<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <base href="$FLUTTER_BASE_HREF">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="description" content="趣我圈：遇见同趣，绽放热爱。">
  <meta name="theme-color" content="#F6F8FC">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="趣我圈">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>趣我圈</title>
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #f6f8fc;
      font-family:
        -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
        "Noto Sans SC", sans-serif;
    }
  </style>
</head>
<body>
  <script>
    // Keep only the minimal bridge required by Flutter startup telemetry.
    // Waiting time is never promoted to a fatal startup fact on Web.
    window.__qwqStartupStartedAtMs = performance.now();
    window.__qwqStartupElapsedMs = function () {
      return Math.max(0, performance.now() - window.__qwqStartupStartedAtMs);
    };
    window.__qwqRecordStartupEvent = function () {};
    window.__qwqReadStartupJournal = function () {
      return Promise.resolve('{"attemptId":"","events":[]}');
    };
    window.__qwqClearStartupJournal = function () {};
    window.__qwqReadWebInstallContext = function () {
      const query = new URLSearchParams(location.search);
      const explicit = (query.get("platform") || "").toLowerCase();
      const uaDataPlatform = (
        navigator.userAgentData && navigator.userAgentData.platform || ""
      ).toLowerCase();
      const ua = (navigator.userAgent || "").toLowerCase();
      const navigatorPlatform = (navigator.platform || "").toLowerCase();
      let platform = "unknown";
      if (explicit === "ios" || explicit === "android") {
        platform = explicit;
      } else if (
        uaDataPlatform.includes("android") || ua.includes("android") ||
        ua.includes("harmony") || ua.includes("openharmony")
      ) {
        platform = "android";
      } else if (
        uaDataPlatform.includes("ios") || /iphone|ipad|ipod/.test(ua) ||
        (navigatorPlatform === "macintel" && navigator.maxTouchPoints > 1)
      ) {
        platform = "ios";
      } else if (
        /mac|win|linux|cros/.test(uaDataPlatform || navigatorPlatform || ua)
      ) {
        platform = "desktop";
      }
      const standalone = (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
      let dismissed = false;
      try {
        dismissed = sessionStorage.getItem("qwq-web-install-dismissed") === "1";
      } catch (_) {}
      return JSON.stringify({ platform, standalone, dismissed });
    };
    window.__qwqDismissWebInstall = function () {
      try {
        sessionStorage.setItem("qwq-web-install-dismissed", "1");
      } catch (_) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
