<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <base href="$FLUTTER_BASE_HREF">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="description" content="趣我圈：遇见同趣，绽放热爱。">
  <meta name="theme-color" content="#F6F8FC">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="趣我圈">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>趣我圈</title>
  <!-- 品牌颜色/字号/间距只来自设计系统生成的 CSS variables（DEC-005）。 -->
  <link rel="stylesheet" href="qwq_bootstrap.css">
</head>
<body>
  <!-- 引擎前唯一的 bootstrap surface：loading 无动作；恢复态只有单个 reload 动作。 -->
  <div id="qwq-bootstrap" class="qwq-bootstrap-surface">
    <div id="qwq-bootstrap-loading" class="qwq-bootstrap-panel" role="status" aria-live="polite">
      <div class="qwq-bootstrap-spinner" aria-hidden="true"></div>
      <p id="qwq-bootstrap-loading-text" class="qwq-bootstrap-body"></p>
    </div>
    <div id="qwq-bootstrap-recovery" class="qwq-bootstrap-panel" role="alert" hidden>
      <h1 id="qwq-bootstrap-recovery-title" class="qwq-bootstrap-title"></h1>
      <p id="qwq-bootstrap-recovery-body" class="qwq-bootstrap-body"></p>
      <button id="qwq-bootstrap-reload" class="qwq-bootstrap-reload" type="button"></button>
    </div>
    <div id="qwq-bootstrap-config-error" class="qwq-bootstrap-panel" role="alert" hidden>
      <h1 id="qwq-bootstrap-config-title" class="qwq-bootstrap-title"></h1>
      <p id="qwq-bootstrap-config-body" class="qwq-bootstrap-body"></p>
      <p id="qwq-bootstrap-config-code" class="qwq-bootstrap-code"></p>
      <button id="qwq-bootstrap-config-reload" class="qwq-bootstrap-reload" type="button"></button>
    </div>
  </div>
  <script>
    // Keep only the minimal bridge required by Flutter startup telemetry.
    // Waiting time is never promoted to a fatal startup fact on Web.
    window.__qwqStartupStartedAtMs = performance.now();
    window.__qwqStartupElapsedMs = function () {
      return Math.max(0, performance.now() - window.__qwqStartupStartedAtMs);
    };
    window.__qwqRecordStartupEvent = function () {};
    window.__qwqReadStartupJournal = function () {
      return Promise.resolve('{"attemptId":"","events":[]}');
    };
    window.__qwqClearStartupJournal = function () {};
    window.__qwqReadWebInstallContext = function () {
      const query = new URLSearchParams(location.search);
      const explicit = (query.get("platform") || "").toLowerCase();
      const uaDataPlatform = (
        navigator.userAgentData && navigator.userAgentData.platform || ""
      ).toLowerCase();
      const ua = (navigator.userAgent || "").toLowerCase();
      const navigatorPlatform = (navigator.platform || "").toLowerCase();
      let platform = "unknown";
      if (explicit === "ios" || explicit === "android") {
        platform = explicit;
      } else if (
        uaDataPlatform.includes("android") || ua.includes("android") ||
        ua.includes("harmony") || ua.includes("openharmony")
      ) {
        platform = "android";
      } else if (
        uaDataPlatform.includes("ios") || /iphone|ipad|ipod/.test(ua) ||
        (navigatorPlatform === "macintel" && navigator.maxTouchPoints > 1)
      ) {
        platform = "ios";
      } else if (
        /mac|win|linux|cros/.test(uaDataPlatform || navigatorPlatform || ua)
      ) {
        platform = "desktop";
      }
      const standalone = (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
      let dismissed = false;
      try {
        dismissed = sessionStorage.getItem("qwq-web-install-dismissed") === "1";
      } catch (_) {}
      return JSON.stringify({ platform, standalone, dismissed });
    };
    window.__qwqDismissWebInstall = function () {
      try {
        sessionStorage.setItem("qwq-web-install-dismissed", "1");
      } catch (_) {}
    };
  </script>
  <script src="qwq_bootstrap.js"></script>
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
