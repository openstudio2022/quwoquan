import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group 'com.cloudwebrtc.webrtc'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

def vendoredAndroidArtifact(String name) {
    def artifact = new File(rootProject.projectDir, "../vendor/android_artifacts/${name}")
    if (!artifact.exists()) {
        throw new GradleException(
            "Missing vendored Android artifact ${artifact}. " +
            "This repository forbids implicit remote dependency downloads during build."
        )
    }
    return artifact
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.cloudwebrtc.webrtc'
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    // AGP 8+ forbids packaging local .aar inside another AAR; app module bundles these.
    compileOnly files(vendoredAndroidArtifact('android-144.7559.01.aar'))
    compileOnly files(vendoredAndroidArtifact('audioswitch-89582c47c9a04c62f90aa5e57251af4800a62c9a.aar'))
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
