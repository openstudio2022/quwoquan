import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group = "io.livekit.plugin"
version = "1.0-SNAPSHOT"

def vendoredAndroidArtifact(String name) {
    def artifact = new File(rootProject.projectDir, "../vendor/android_artifacts/${name}")
    if (!artifact.exists()) {
        throw new GradleException(
            "Missing vendored Android artifact ${artifact}. " +
            "This repository forbids implicit remote dependency downloads during build."
        )
    }
    return artifact
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "io.livekit.plugin"
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
    // AGP 8+ forbids packaging local .aar inside another AAR; app module bundles these.
    compileOnly files(vendoredAndroidArtifact("android-144.7559.01.aar"))
    compileOnly files(vendoredAndroidArtifact("noise-2.0.0.aar"))
}
