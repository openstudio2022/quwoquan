org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# vendored 插件的 aar 根，相对本 Gradle 根声明。共用的 vendored 插件由本工程与 Patrol UAT
# test host 两个 Gradle 根消费，各自到 vendor 的相对深度不同。
qwq.vendor.androidArtifactsRoot=../vendor/android_artifacts
# 仓库根，相对本 Gradle 根声明。「trust assets 根必须在源码树外」这条判否依赖它，而共用
# 校验脚本的两个 Gradle 根到仓库根的深度不同。
qwq.repositoryRoot=../..
