name: quwoquan_app
description: 趣我圈 - 跨多设备社交媒体应用
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.3'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2
  
  # UI相关
  cupertino_icons: ^1.0.9
  flutter_screenutil: ^5.9.3
  flutter_localizations:
    sdk: flutter
  
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 网络请求
  http: ^1.6.0
  dio: ^5.9.2
  
  # 工具类
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  
  # 图片处理
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  photo_manager: ^3.9.0
  camera: ^0.12.0+1
  
  # 视频播放
  video_player: ^2.11.1
  chewie: ^1.14.1
  video_thumbnail: ^0.5.6
  
  # 其他
  intl: ^0.20.2
  uuid: ^4.5.3
  go_router: ^17.2.3
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  yaml: ^3.1.3
  crypto: ^3.0.7
  meta: ^1.17.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.1.0
  pretty_qr_code: ^3.6.0
  share_plus: ^13.1.0
  geolocator: ^14.0.3
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1
  file_picker: ^12.0.0-beta.7
  permission_handler: ^12.0.2
  
  # 语音消息
  record: ^7.1.0
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  connectivity_plus: ^7.1.1

  # 实时音视频通话
  livekit_client: ^2.8.1
  flutter_callkit_incoming: ^3.1.1
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.0
  sqflite: ^2.4.2+1

  # Repository 抽象（Mock/Remote 共用）；见 quwoquan_app/packages/quwoquan_cloud_contracts
  quwoquan_cloud_contracts:
    path: packages/quwoquan_cloud_contracts
  quwoquan_runtime_errors:
    path: ../quwoquan_service/contracts/runtime_errors/packages/dart/quwoquan_runtime_errors
  flutter_cache_manager: ^3.4.1
  fluentui_system_icons: ^1.1.273
  flutter_secure_storage: ^10.3.1
  simple_icons: ^16.23.0

  # 添加联系人：二维码扫描(含图库识别) / 系统通讯录读取 / 中文转拼音首字母分组
  mobile_scanner: ^7.2.0
  flutter_contacts: ^2.2.2
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  webview_flutter_platform_interface: ^2.15.1
  flutter_lints: ^6.0.0
  # user_acceptance Patrol（真实设备 / Firebase Test Lab）
  patrol: ^4.5.0
  integration_test:
    sdk: flutter
  build_runner: ^2.15.0
  test: ^1.31.1
  # VM/CI 单测 in-memory 库；在新版链路下与 sqlite3 v3 保持一致
  sqflite_common_ffi: ^2.4.2

dependency_overrides:
  audio_session:
    path: vendor/plugins/audio_session
  camera_android_camerax:
    path: vendor/plugins/camera_android_camerax
  device_info_plus:
    path: vendor/plugins/device_info_plus
  flutter_callkit_incoming:
    path: vendor/plugins/flutter_callkit_incoming
  flutter_webrtc:
    path: vendor/plugins/flutter_webrtc
  image_picker_android:
    path: vendor/plugins/image_picker_android
  livekit_client:
    path: vendor/plugins/livekit_client
  mobile_scanner:
    path: vendor/plugins/mobile_scanner
  package_info_plus:
    path: vendor/plugins/package_info_plus
  patrol:
    path: vendor/plugins/patrol
  photo_manager:
    path: vendor/plugins/photo_manager
  record_web:
    path: vendor/plugins/record_web
  share_plus:
    path: vendor/plugins/share_plus
  shared_preferences_android:
    path: vendor/plugins/shared_preferences_android
  video_thumbnail:
    path: vendor/plugins/video_thumbnail
  url_launcher_android:
    path: vendor/plugins/url_launcher_android
  wakelock_plus:
    path: vendor/plugins/wakelock_plus
  webview_flutter_android:
    path: vendor/plugins/webview_flutter_android
  # chewie 1.14 / share_plus 13 需要较新的传递依赖；上游 geolocator / livekit 尚未对齐
  win32: ^6.3.0
  vector_math: ^2.4.0
  characters: ^1.4.1
  matcher: ^0.12.20
  meta: ^1.18.3
  test: ^1.31.1
  test_api: ^0.7.12
  test_core: ^0.6.18
  dart_style: ^3.1.9
  material_color_utilities: ^0.13.0

flutter:
  config:
    # patrol / video_thumbnail 等插件在 vendored 形态下仍走 CocoaPods；livekit_client 已补 iOS Package.swift
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  
  assets:
    - assets/filters/filter_presets.json
    - ../quwoquan_service/contracts/metadata/social/circle/ui_category_tabs.yaml
    - assets/assistant/config/

  shaders:
    - shaders/article_page_curl_lighting.frag
    - shaders/article_page_curl_backface.frag

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/noto_sans_sc/NotoSansSC[wght].ttf
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/noto_serif_sc/NotoSerifSC[wght].ttf
    - family: Noto Sans Mono
      fonts:
        - asset: assets/fonts/noto_sans_mono/NotoSansMono[wdth,wght].ttf
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/noto_color_emoji/NotoColorEmoji-Regular.ttf

patrol:
  test_directory: test/patrol

hooks:
  user_defines:
    sqlite3:
      # App 运行时不允许依赖外部 GitHub release 下载原生 SQLite 资产。
      # quwoquan_app 主链路只在主机单测中经由 sqflite_common_ffi 间接触达 sqlite3，
      # 移动端实际运行仍使用 sqflite 原生插件，因此统一切到系统 SQLite。
      source: system
      name: sqlite3
      name_android: sqlite
      name_windows: winsqlite3
