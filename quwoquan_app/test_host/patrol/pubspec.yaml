name: quwoquan_patrol_host
description: 趣我圈 canonical user_acceptance 的物理隔离 Patrol test host
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  quwoquan_app:
    path: ../..
  quwoquan_cloud_contracts:
    path: ../../packages/quwoquan_cloud_contracts
  flutter_riverpod: ^3.4.2
  go_router: ^17.2.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.5.0
  flutter_lints: ^6.0.0
  test_api: ^0.7.12

# dependency_overrides 只在解析根包上生效：host 当根时 quwoquan_app 自己的
# 28 条 override 一概失效，vendored 插件会退回 pub.dev 求解，离线缓存里没有
# 这些版本（app 侧一直走 path，从没下载过），于是 --offline 直接求解失败。
# 因此这里必须逐条镜像 app 的 override，路径按 host 位置补 ../.. 前缀。
dependency_overrides:
  patrol:
    path: ../../vendor/plugins/patrol
  audio_session:
    path: ../../vendor/plugins/audio_session
  camera_android_camerax:
    path: ../../vendor/plugins/camera_android_camerax
  device_info_plus:
    path: ../../vendor/plugins/device_info_plus
  flutter_callkit_incoming:
    path: ../../vendor/plugins/flutter_callkit_incoming
  flutter_webrtc:
    path: ../../vendor/plugins/flutter_webrtc
  image_picker_android:
    path: ../../vendor/plugins/image_picker_android
  livekit_client:
    path: ../../vendor/plugins/livekit_client
  mobile_scanner:
    path: ../../vendor/plugins/mobile_scanner
  package_info_plus:
    path: ../../vendor/plugins/package_info_plus
  photo_manager:
    path: ../../vendor/plugins/photo_manager
  record_web:
    path: ../../vendor/plugins/record_web
  share_plus:
    path: ../../vendor/plugins/share_plus
  shared_preferences_android:
    path: ../../vendor/plugins/shared_preferences_android
  video_thumbnail:
    path: ../../vendor/plugins/video_thumbnail
  video_player_android:
    path: ../../vendor/plugins/video_player_android
  url_launcher_android:
    path: ../../vendor/plugins/url_launcher_android
  wakelock_plus:
    path: ../../vendor/plugins/wakelock_plus
  webview_flutter_android:
    path: ../../vendor/plugins/webview_flutter_android
  win32: ^6.4.0
  vector_math: ^2.4.2
  characters: ^1.4.1
  matcher: ^0.12.20
  meta: ^1.19.0
  test: ^1.31.2
  test_api: ^0.7.13
  test_core: ^0.6.19
  dart_style: ^3.1.12
  material_color_utilities: ^0.13.1

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

patrol:
  test_directory: test/patrol
