{
  "root": ".qwq_output",
  "contract": {
    "disposable": true,
    "sourceTruthAllowed": false,
    "deletionInvariant": "repository_remains_buildable",
    "cachePersistenceRequired": false,
    "allowedOutputConsumption": [
      "same_execution_stage",
      "derived_release_deployment",
      "verification_evidence"
    ],
    "derivedDeploymentSnapshots": "env/<env>/release and env/<env>/local/<target>/process",
    "rebuildSources": [
      "quwoquan_app/configs",
      "quwoquan_app/deploy",
      "quwoquan_service/contracts",
      "quwoquan_service/services",
      "quwoquan_data/control_plane",
      "quwoquan_data/prompts",
      "quwoquan_data/templates",
      "quwoquan_data/schema",
      "quwoquan_data/reference",
      "quwoquan_data/requirements.txt",
      "quwoquan_ops/environments",
      "quwoquan_ops/policies"
    ]
  },
  "topLevel": {
    "env": {
      "segments": ["alpha", "beta", "gamma", "prod", "repo"],
      "deploymentChildren": ["runs", "observability", "release", "local"],
      "repoChildren": ["runs", "observability", "local"],
      "localChildren": ["process", "cache"]
    },
    "data": {
      "children": ["tasks", "releases", "local"]
    }
  }
}
