{
  "schema": "environment-runtime",
  "environment": "beta",
  "dataReleaseTarget": "beta-local",
  "urlRoles": {
    "api": {"exposure": "public", "scheme": "https", "host": "api.beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-beta", "consumers": ["app.gateway", "data.release-verifier", "ops.health"]},
    "realtime": {"exposure": "public", "scheme": "wss", "host": "api.beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-beta", "consumers": ["app.realtime", "ops.health"]},
    "rtc": {"exposure": "public", "scheme": "wss", "host": "rtc.beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-beta", "consumers": ["app.rtc", "ops.health"]},
    "productOps": {"exposure": "public", "scheme": "https", "host": "ops.beta.quwoquan.com", "portRole": "product-ops-edge", "pathBase": "/", "tlsProfile": "acme-dns01-beta", "consumers": ["app.recovery", "ops.release"]},
    "publicWeb": {"exposure": "public", "scheme": "https", "host": "beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-beta", "consumers": ["app.public-links", "web.release", "native.app-links"]},
    "appDownload": {"exposure": "public", "scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/app/download", "tlsProfile": "acme-dns01-beta", "consumers": ["app.recovery", "web.download"]},
    "legal": {"exposure": "public", "scheme": "https", "host": "beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/legal", "tlsProfile": "acme-dns01-beta", "consumers": ["app.legal", "web.legal"]},
    "mediaAvatar": {"exposure": "public", "scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/avatar", "tlsProfile": "acme-dns01-beta", "consumers": ["app.media", "data.release", "service.chat"]},
    "mediaImage": {"exposure": "public", "scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/image", "tlsProfile": "acme-dns01-beta", "consumers": ["app.media", "data.release", "service.content"]},
    "mediaVideo": {"exposure": "public", "scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/video", "tlsProfile": "acme-dns01-beta", "consumers": ["app.media", "data.release", "service.content"]},
    "mediaUpload": {"exposure": "public", "scheme": "https", "host": "upload.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/", "tlsProfile": "acme-dns01-beta", "consumers": ["app.media-upload", "service.upload-issuer"]}
  },
  "subnets": {
    "edge": "172.31.10.0/24",
    "media": "172.31.20.0/24",
    "service": "172.31.30.0/24",
    "data": "172.31.40.0/24"
  },
  "serviceAliases": {
    "edge": "beta-edge",
    "media": "beta-media",
    "service": "beta-service",
    "data": "beta-data"
  },
  "artifactPolicy": {
    "app": {
      "runtimeEnv": "beta",
      "allowSeeds": false,
      "allowLocalHosts": true,
      "allowProdHosts": false,
      "distribution": "internal-only"
    },
    "service": {
      "allowFixtureRefs": false,
      "allowReleaseSnapshot": true,
      "secretScope": "beta",
      "distribution": "internal-only"
    }
  },
  "rolloutStagePolicy": {
    "mode": "fixed-env",
    "allowedStages": []
  },
  "targets": {
    "beta-local": {
      "env": "beta",
      "backend": "local",
      "localResourceGroup": "workstation-commercial-runtime",
      "portProfile": "beta-local",
      "baseRoleSet": "environment",
      "origins": {
        "mediaOrigin": "http://127.0.0.1:18110",
        "contentService": "http://127.0.0.1:18220"
      },
      "buildImages": {
        "goBaseImage": "golang:1.24-bookworm",
        "alpineBaseImage": "alpine:3.21"
      },
      "playbackCanary": {
        "source": "published-release",
        "workIdEnv": "VIDEO_PLAYBACK_CANARY_WORK_ID",
        "publicSliceKeyEnv": "VIDEO_PLAYBACK_CANARY_PUBLIC_SLICE_KEY"
      },
      "dataRelease": {
        "mode": "local-import",
        "mongoPortRole": "mongodb",
        "mediaLocalRef": "cache/media",
        "userPostgresPortRole": "postgres",
        "publicReadyTimeoutSeconds": 240
      }
    }
  }
}
