{
  "schema": "environment-runtime",
  "environment": "beta",
  "dataReleaseTarget": "beta-local",
  "productLifecycleState": "research",
  "researchContentIsolation": {
    "identityWhitelistRequired": true,
    "anonymousContentAccess": false,
    "anonymousMediaAccess": false,
    "publicContentDistribution": false,
    "sharingDisabled": true,
    "exportDisabled": true,
    "searchIndexingDisabled": false,
    "internalAppSignatureRequired": true,
    "researchBadgeRequired": true,
    "shortLivedSignedMediaUrlsRequired": true,
    "signedMediaUrlMaxTtlSeconds": 900,
    "mediaAccessAuditLogRequired": true
  },
  "urlRoles": {
    "api": {"scheme": "https", "host": "api.beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "local-managed"},
    "realtime": {"scheme": "wss", "host": "api.beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "local-managed"},
    "rtc": {"scheme": "wss", "host": "rtc.beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "local-managed"},
    "productOps": {"scheme": "https", "host": "ops.beta.quwoquan.com", "portRole": "product-ops-edge", "pathBase": "/", "tlsProfile": "local-managed"},
    "publicWeb": {"scheme": "https", "host": "beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "local-managed"},
    "appDownload": {"scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/download", "tlsProfile": "local-managed"},
    "legal": {"scheme": "https", "host": "beta.quwoquan.com", "portRole": "api-edge", "pathBase": "/legal", "tlsProfile": "local-managed"},
    "mediaAvatar": {"scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/avatar", "tlsProfile": "local-managed"},
    "mediaImage": {"scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/image", "tlsProfile": "local-managed"},
    "mediaVideo": {"scheme": "https", "host": "cdn.beta.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/video", "tlsProfile": "local-managed"},
    "mediaUpload": {"scheme": "https", "host": "upload.beta.quwoquan.com", "portRole": "object-storage-edge", "pathBase": "/", "tlsProfile": "local-managed"}
  },
  "subnets": {
    "edge": "172.31.10.0/24",
    "media": "172.31.20.0/24",
    "service": "172.31.30.0/24",
    "data": "172.31.40.0/24"
  },
  "serviceAliases": {
    "edge": "beta-edge",
    "media": "beta-media",
    "service": "beta-service",
    "data": "beta-data"
  },
  "artifactPolicy": {
    "app": {
      "runtimeEnv": "beta",
      "allowSeeds": false,
      "allowLocalHosts": true,
      "allowProdHosts": false,
      "distribution": "internal-only"
    },
    "service": {
      "allowFixtureRefs": false,
      "allowReleaseSnapshot": true,
      "secretScope": "beta",
      "distribution": "internal-only"
    }
  },
  "rolloutStagePolicy": {
    "mode": "fixed-env",
    "allowedStages": []
  },
  "targets": {
    "beta-local": {
      "env": "beta",
      "backend": "local",
      "localResourceGroup": "workstation-commercial-runtime",
      "portProfile": "beta-local",
      "startup": {
        "dockerProbeTimeoutSeconds": 30,
        "composeBuildTimeoutSeconds": 3600,
        "composeBuildNoProgressTimeoutSeconds": 1200,
        "composeUpTimeoutSeconds": 420
      },
      "baseRoleSet": "environment",
      "origins": {
        "mediaOrigin": "http://127.0.0.1:18110",
        "contentService": "http://127.0.0.1:18220"
      },
      "buildImages": {
        "goBaseImage": "golang:1.24-bookworm",
        "alpineBaseImage": "alpine:3.21"
      },
      "playbackCanary": {
