{
  "schema": "environment-runtime",
  "environment": "gamma",
  "dataReleaseTarget": "gamma-local",
  "urlRoles": {
    "api": {"scheme": "https", "host": "api.gamma.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-gamma"},
    "realtime": {"scheme": "wss", "host": "api.gamma.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-gamma"},
    "rtc": {"scheme": "wss", "host": "rtc.gamma.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-gamma"},
    "productOps": {"scheme": "https", "host": "ops.gamma.quwoquan.com", "portRole": "product-ops-edge", "pathBase": "/", "tlsProfile": "acme-dns01-gamma"},
    "publicWeb": {"scheme": "https", "host": "gamma.quwoquan.com", "portRole": "api-edge", "pathBase": "/", "tlsProfile": "acme-dns01-gamma"},
    "appDownload": {"scheme": "https", "host": "cdn.gamma.quwoquan.com", "portRole": "media-edge", "pathBase": "/download", "tlsProfile": "acme-dns01-gamma"},
    "legal": {"scheme": "https", "host": "gamma.quwoquan.com", "portRole": "api-edge", "pathBase": "/legal", "tlsProfile": "acme-dns01-gamma"},
    "mediaAvatar": {"scheme": "https", "host": "cdn.gamma.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/avatar", "tlsProfile": "acme-dns01-gamma"},
    "mediaImage": {"scheme": "https", "host": "cdn.gamma.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/image", "tlsProfile": "acme-dns01-gamma"},
    "mediaVideo": {"scheme": "https", "host": "cdn.gamma.quwoquan.com", "portRole": "media-edge", "pathBase": "/media/video", "tlsProfile": "acme-dns01-gamma"},
    "mediaUpload": {"scheme": "https", "host": "upload.gamma.quwoquan.com", "portRole": "object-storage-edge", "pathBase": "/", "tlsProfile": "acme-dns01-gamma"}
  },
  "subnets": {
    "edge": "172.40.10.0/24",
    "media": "172.40.20.0/24",
    "service": "172.40.30.0/24",
    "data": "172.40.40.0/24"
  },
  "serviceAliases": {
    "edge": "gamma-edge",
    "media": "gamma-media",
    "service": "gamma-service",
    "data": "gamma-data"
  },
  "artifactPolicy": {
    "app": {
      "runtimeEnv": "gamma",
      "allowSeeds": false,
      "allowLocalHosts": true,
      "allowProdHosts": false,
      "distribution": "internal-only"
    },
    "service": {
      "allowFixtureRefs": false,
      "allowReleaseSnapshot": true,
      "secretScope": "gamma",
      "distribution": "internal-only"
    }
  },
  "rolloutStagePolicy": {
    "mode": "fixed-env",
    "allowedStages": []
  },
  "targets": {
    "gamma-local": {
      "env": "gamma",
      "backend": "local",
      "localResourceGroup": "workstation-commercial-runtime",
      "portProfile": "gamma-local",
      "startup": {
        "dockerProbeTimeoutSeconds": 30,
        "composeBuildTimeoutSeconds": 3600,
        "composeBuildNoProgressTimeoutSeconds": 1200,
        "composeUpTimeoutSeconds": 1800
      },
      "buildImages": {
        "goBaseImage": "golang:1.24-bookworm",
        "alpineBaseImage": "alpine:3.21"
      },
      "baseRoleSet": "environment",
      "origins": {
        "mediaOrigin": "http://127.0.0.1:19110",
        "contentService": "http://127.0.0.1:19220"
      },
      "playbackCanary": {
        "source": "published-release",
        "workIdEnv": "VIDEO_PLAYBACK_CANARY_WORK_ID",
        "publicSliceKeyEnv": "VIDEO_PLAYBACK_CANARY_PUBLIC_SLICE_KEY"
      },
      "dataRelease": {
        "mode": "local-import",
        "mongoPortRole": "mongodb",
        "mediaLocalRef": "cache/media",
        "userPostgresPortRole": "postgres",
        "publicReadyTimeoutSeconds": 240
      }
    }
  }
}
