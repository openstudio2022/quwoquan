schema: external-provider-environment-bindings
description: >-
  环境选择 Capability 的唯一 Binding。仅存稳定 Adapter ID、端点引用和密钥键引用；
  实际值仅能由环境部署的受控密钥系统在运行时注入。
environments:
  alpha:
    capabilities:
      - &location_lookup_binding
        capability_id: integration.location.lookup
        state: blocked
        adapter_id: ext.map.baidu
        endpoint_ref: environment_binding:integration.location
        secret_refs: [runtime_secret:INTEGRATION_LOCATION_BAIDU_AK]
        endpoint_envs:
          base: INTEGRATION_LOCATION_BAIDU_BASE_URL
        timeout_ms: 1200
      - &rtc_room_transport_binding
        capability_id: rtc.room.transport
        state: enabled
        adapter_id: infra.livekit_sfu
        endpoint_ref: environment_binding:rtc.livekit
        secret_refs: [runtime_secret:RTC_MEDIA_API_KEY, runtime_secret:RTC_MEDIA_API_SECRET]
        endpoint_envs:
          connection: RTC_MEDIA_CONNECTION_URL
        timeout_ms: 10000
      - capability_id: assistant.model.generation
        state: enabled
        adapter_id: ext.llm.protocol_fixture
        endpoint_ref: not_configured
        secret_refs: []
        endpoint_envs:
          completion: ASSISTANT_MODEL_FIXTURE_ENDPOINT
        timeout_ms: 1000
      - capability_id: runtime.log.sink
        state: enabled
        adapter_id: infra.observability.sls_fixture
        endpoint_ref: not_configured
        secret_refs: []
        timeout_ms: 1000
      - capability_id: runtime.message.transport
        state: enabled
        adapter_id: infra.redis.message_transport_fixture
        endpoint_ref: not_configured
        secret_refs: []
        timeout_ms: 1000
  beta:
    capabilities: &commercial_capability_bindings
      - capability_id: identity.sms.otp
        state: blocked
        adapter_id: ext.sms.aliyun
        endpoint_ref: environment_binding:integration.sms
        secret_refs: [runtime_secret:INTEGRATION_SMS_TOKEN, runtime_secret:OTP_CODE_REF_KEYS_JSON, runtime_secret:INTEGRATION_SERVICE_MTLS_CA_FILE, runtime_secret:INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE, runtime_secret:INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE]
        endpoint_envs:
          endpoint: INTEGRATION_SMS_ENDPOINT
        timeout_ms: 10000
      - capability_id: identity.carrier.one_tap
        state: blocked
        adapter_id: ext.auth.carrier_one_tap
        endpoint_ref: environment_binding:identity.one_tap
        secret_refs: [runtime_secret:ALIYUN_DYPNS_ACCESS_KEY_ID, runtime_secret:ALIYUN_DYPNS_ACCESS_KEY_SECRET]
        endpoint_envs:
          endpoint: ALIYUN_DYPNS_ENDPOINT
        timeout_ms: 10000
      - capability_id: identity.social.login
        state: blocked
        adapter_id: ext.auth.federated_identity
        endpoint_ref: environment_binding:identity.social
        secret_refs: [runtime_secret:WECHAT_OAUTH_APP_ID, runtime_secret:WECHAT_OAUTH_APP_SECRET, runtime_secret:ALIPAY_OAUTH_APP_ID, runtime_secret:ALIPAY_OAUTH_APP_PRIVATE_KEY_PEM, runtime_secret:ALIPAY_OAUTH_PLATFORM_PUBLIC_KEY_PEM, runtime_secret:ALIPAY_OAUTH_MERCHANT_PID, runtime_secret:QQ_OAUTH_APP_ID]
        endpoint_envs:
          wechat_token: WECHAT_OAUTH_TOKEN_URL
          wechat_user_info: WECHAT_OAUTH_USER_INFO_URL
          alipay_token: ALIPAY_OAUTH_TOKEN_URL
          alipay_user_info: ALIPAY_OAUTH_USER_INFO_URL
          qq_user_info: QQ_OAUTH_USER_INFO_URL
        timeout_ms: 10000
      - capability_id: integration.push.delivery
        state: blocked
        adapter_id: ext.push.dispatch
        endpoint_ref: environment_binding:integration.push
        secret_refs: [runtime_secret:INTEGRATION_PUSH_APNS_KEY_FILE, runtime_secret:INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE]
        endpoint_envs:
          user_service_base_url: INTEGRATION_PUSH_USER_SERVICE_BASE_URL
          apns_environment: INTEGRATION_PUSH_APNS_ENVIRONMENT
          apns_key_id: INTEGRATION_PUSH_APNS_KEY_ID
          apns_team_id: INTEGRATION_PUSH_APNS_TEAM_ID
          apns_topic: INTEGRATION_PUSH_APNS_TOPIC
          fcm_project_id: INTEGRATION_PUSH_FCM_PROJECT_ID
        timeout_ms: 10000
      - *location_lookup_binding
      - capability_id: assistant.model.generation
        state: blocked
        adapter_id: ext.llm.xiaomi_mimo
        endpoint_ref: environment_binding:assistant.model
        secret_refs: [runtime_secret:ASSISTANT_MODEL_API_KEY]
        endpoint_envs:
          completion: ASSISTANT_MODEL_COMPLETION_URL
        timeout_ms: 60000
      - capability_id: assistant.public.search
        state: blocked
        adapter_id: ext.search.duckduckgo_html
        endpoint_ref: environment_binding:assistant.search
        secret_refs: []
        endpoint_envs:
          search: ASSISTANT_PUBLIC_SEARCH_URL
        timeout_ms: 10000
      - capability_id: assistant.weather.forecast
        state: blocked
        adapter_id: ext.weather.open_meteo
        endpoint_ref: environment_binding:assistant.weather
        secret_refs: []
        endpoint_envs:
          geocoding: ASSISTANT_WEATHER_GEOCODING_URL
          forecast: ASSISTANT_WEATHER_FORECAST_URL
        timeout_ms: 10000
      - capability_id: assistant.finance.quote
        state: blocked
        adapter_id: ext.finance.yahoo_chart
        endpoint_ref: environment_binding:assistant.finance
        secret_refs: []
        endpoint_envs:
          chart: ASSISTANT_FINANCE_CHART_URL
        timeout_ms: 10000
      - capability_id: content.embedding.generation
        state: enabled
        adapter_id: ext.embed.openai_compatible
        endpoint_ref: environment_binding:content.embedding
        secret_refs: [runtime_secret:CONTENT_EMBEDDING_API_KEY]
        endpoint_envs:
          endpoint: CONTENT_EMBEDDING_ENDPOINT
        timeout_ms: 10000
      - <<: *rtc_room_transport_binding
        state: blocked
      - capability_id: runtime.log.sink
        state: blocked
        adapter_id: ext.observability.aliyun_sls
        endpoint_ref: environment_binding:observability.sls
        secret_refs: [runtime_secret:ALIBABA_CLOUD_ACCESS_KEY_ID, runtime_secret:ALIBABA_CLOUD_ACCESS_KEY_SECRET]
        endpoint_envs:
          region: PRODUCT_OPS_SLS_REGION
          endpoint: PRODUCT_OPS_SLS_ENDPOINT
          project: PRODUCT_OPS_SLS_PROJECT
          raw_logstore: PRODUCT_OPS_SLS_RAW_LOGSTORE
          startup_diagnostic_logstore: PRODUCT_OPS_SLS_STARTUP_DIAGNOSTIC_LOGSTORE
          runtime_logstore: PRODUCT_OPS_SLS_RUNTIME_LOGSTORE
          aggregate_logstore: PRODUCT_OPS_SLS_AGGREGATE_LOGSTORE
        timeout_ms: 10000
      - capability_id: runtime.message.transport
        state: enabled
        adapter_id: infra.redis.message_transport
        endpoint_ref: environment_binding:runtime.message
        secret_refs: []
        timeout_ms: 5000
  gamma:
    capabilities: *commercial_capability_bindings
  prod:
    capabilities: *commercial_capability_bindings
