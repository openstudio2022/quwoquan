services:
  mongodb:
    image: "${QWQ_DATA_FLEET_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${QWQ_DATA_FLEET_MONGO_CACHE_SIZE_GB:-0.25}"
    ports:
      - "${QWQ_DATA_FLEET_MONGO_PORT:?QWQ_DATA_FLEET_MONGO_PORT is required}:27017"
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo-init:
    image: "${QWQ_DATA_FLEET_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
          }
        '
    restart: "no"

  redis:
    image: "${QWQ_DATA_FLEET_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${QWQ_DATA_FLEET_REDIS_PORT:?QWQ_DATA_FLEET_REDIS_PORT is required}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw EVAL \"redis.call('SET',KEYS[1],'ok','EX',10); local v=redis.call('GET',KEYS[1]); redis.call('DEL',KEYS[1]); return v\" 1 __qwq_data_fleet_health | grep -qx ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mongodb:
  redis:
