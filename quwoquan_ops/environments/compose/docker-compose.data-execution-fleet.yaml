services:
  mongodb:
    image: "${QWQ_DATA_FLEET_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${QWQ_DATA_FLEET_MONGO_CACHE_SIZE_GB:-0.25}"
    ports:
      - "${QWQ_DATA_FLEET_MONGO_PORT:?QWQ_DATA_FLEET_MONGO_PORT is required}:27017"
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo-init:
    image: "${QWQ_DATA_FLEET_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
          }
        '
    restart: "no"

  redis:
    image: "${QWQ_DATA_FLEET_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${QWQ_DATA_FLEET_REDIS_PORT:?QWQ_DATA_FLEET_REDIS_PORT is required}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mongodb:
  redis:
