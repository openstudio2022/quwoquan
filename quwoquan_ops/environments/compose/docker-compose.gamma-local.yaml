services:
  postgres:
    image: "${LOCAL_GAMMA_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}"
    environment:
      POSTGRES_USER: quwoquan
      POSTGRES_PASSWORD: quwoquan
      POSTGRES_DB: quwoquan
    ports:
      - "${LOCAL_GAMMA_POSTGRES_PORT:-19400}:5432"
    volumes:
      - local-gamma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quwoquan"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "${LOCAL_GAMMA_MONGO_CACHE_SIZE_GB:-0.25}",
      ]
    ports:
      - "${LOCAL_GAMMA_MONGO_PORT:-19410}:27017"
    volumes:
      - local-gamma-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
          }
        '
    restart: "no"

  redis:
    image: "${LOCAL_GAMMA_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LOCAL_GAMMA_REDIS_PORT:-19420}:6379"
    volumes:
      - local-gamma-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: "${LOCAL_GAMMA_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}"
    networks:
      default:
        aliases:
          - gamma-upload.quwoquan-env.test
          - gamma-upload.localhost
    environment:
      MINIO_ROOT_USER: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      MINIO_ROOT_PASSWORD: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      MINIO_BROWSER: "off"
      MINIO_CERTS_DIR: /root/.minio/certs
    command:
      - server
      - /data
      - --address
      - ":${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
      - --console-address
      - ":9001"
    ports:
      - "${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}:${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
    volumes:
      - local-gamma-object-storage:/data
      - ${LOCAL_GAMMA_OBJECT_STORAGE_TLS_DIR:?LOCAL_GAMMA_OBJECT_STORAGE_TLS_DIR is required}:/root/.minio/certs:ro

  object-storage-init:
    image: "${LOCAL_GAMMA_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-03-12T17-29-24Z}"
    depends_on:
      object-storage:
        condition: service_started
    environment:
      LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT: "${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_BUCKET: "${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET:?LOCAL_GAMMA_OBJECT_STORAGE_BUCKET is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
    volumes:
      - ${LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE:?LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE is required}:/etc/qwq-object-storage/ca.crt:ro
      - ./object-storage-lifecycle.json:/etc/qwq-object-storage/lifecycle.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        install -d -m 0700 /root/.mc/certs/CAs
        cp /etc/qwq-object-storage/ca.crt /root/.mc/certs/CAs/qwq-gamma-object-storage.crt
        for attempt in $(seq 1 60); do
          if mc alias set qwq "https://gamma-upload.quwoquan-env.test:${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT}" "$LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID" "$LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET"; then
            mc mb --ignore-existing "qwq/${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET}"
            mc ilm rule import "qwq/${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET}" < /etc/qwq-object-storage/lifecycle.json
            exit 0
          fi
          sleep 2
        done
        echo "object-storage did not become ready" >&2
        exit 1
    restart: "no"

  rec-model-service:
    # 对外 DNS 名与 prod K8s Service 统一为 recommendation-service；rec-model-service 仅作工件名/兼容别名。
    networks:
      default:
        aliases:
          - recommendation-service
          - rec-model-service
    image: "${LOCAL_GAMMA_RECOMMENDATION_SERVICE_IMAGE:-localhost/quwoquan_service_rec-model-service:latest}"
    build:
      context: ../../..
      dockerfile: quwoquan_service/services/rec-model-service/deploy/Dockerfile
      args:
        PYTHON_BASE_IMAGE: "${LOCAL_GAMMA_PYTHON_BASE_IMAGE:-python:3.11}"
        PIP_INDEX_URL: "${LOCAL_GAMMA_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${LOCAL_GAMMA_PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
    environment:
      SERVICE_NAME: recommendation-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DATABASE: quwoquan_content
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      PYTHONUNBUFFERED: "1"
      MODEL_CACHE_DIR: /app/cache
      REC_MODEL_UVICORN_WORKERS: "${LOCAL_GAMMA_REC_MODEL_WORKERS:-2}"
      REC_MODEL_SCORE_CACHE_TTL_MS: "${LOCAL_GAMMA_REC_MODEL_SCORE_CACHE_TTL_MS:-500}"
      REC_MODEL_SCORE_CACHE_MAX_ENTRIES: "${LOCAL_GAMMA_REC_MODEL_SCORE_CACHE_MAX_ENTRIES:-4096}"
      REC_MODEL_MICROBATCH_WINDOW_MS: "${LOCAL_GAMMA_REC_MODEL_MICROBATCH_WINDOW_MS:-2}"
      REC_MODEL_FEATURE_BUDGET_MS: "${LOCAL_GAMMA_REC_MODEL_FEATURE_BUDGET_MS:-20}"
      REC_MODEL_MODEL_BUDGET_MS: "${LOCAL_GAMMA_REC_MODEL_MODEL_BUDGET_MS:-80}"
      REC_MODEL_RETRY_BUDGET_MS: "${LOCAL_GAMMA_REC_MODEL_RETRY_BUDGET_MS:-15}"
      REC_MODEL_GUARDRAIL_MODE: suggest_only
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
    ports:
      - "${LOCAL_GAMMA_REC_MODEL_PORT:-19240}:8000"
    volumes:
      - ${LOCAL_GAMMA_CONFIG_ROOT:?LOCAL_GAMMA_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${LOCAL_GAMMA_MODEL_CACHE_ROOT:-../../../.qwq_output/env/gamma/local/gamma-local/cache/model}:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 5

  content-service:
    image: "${LOCAL_GAMMA_CONTENT_SERVICE_IMAGE:-localhost/quwoquan_service_content-service:latest}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/content-service/deploy/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: content-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      MONGO_URI: mongodb://mongodb:27017
      REPORT_DATABASE_URL: postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable
      CONTENT_REPORT_ACCOUNT_BACKFILL_FILE: /etc/qwq-config/report-account-backfill.json
      CONTENT_REDIS_REC_ADDR: redis:6379
      CONTENT_REDIS_GENERAL_ADDR: redis:6379
      CONTENT_REDIS_REALTIME_ADDR: redis:6379
      CONTENT_OSS_ENDPOINT: "${LOCAL_GAMMA_OBJECT_STORAGE_ENDPOINT:?LOCAL_GAMMA_OBJECT_STORAGE_ENDPOINT is required}"
      CONTENT_OSS_BUCKET: "${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET:?LOCAL_GAMMA_OBJECT_STORAGE_BUCKET is required}"
      CONTENT_OSS_REGION: "${LOCAL_GAMMA_OBJECT_STORAGE_REGION:?LOCAL_GAMMA_OBJECT_STORAGE_REGION is required}"
      CONTENT_OSS_ACCESS_KEY_ID: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      CONTENT_OSS_ACCESS_KEY_SECRET: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      CONTENT_CDN_DOMAIN: "${LOCAL_GAMMA_OBJECT_STORAGE_CDN_DOMAIN:?LOCAL_GAMMA_OBJECT_STORAGE_CDN_DOMAIN is required}"
      CONTENT_CDN_SIGN_KEY: "${LOCAL_GAMMA_OBJECT_STORAGE_CDN_SIGN_KEY:?LOCAL_GAMMA_OBJECT_STORAGE_CDN_SIGN_KEY is required}"
      CONTENT_ACCOUNT_CLOSURE_SUBJECT_HMAC_SECRET: "${CONTENT_ACCOUNT_CLOSURE_SUBJECT_HMAC_SECRET:?CONTENT_ACCOUNT_CLOSURE_SUBJECT_HMAC_SECRET is required}"
      SSL_CERT_FILE: /etc/ssl/local-ca/object-storage-ca.crt
      SEARCH_ES_ENABLED: "true"
      SEARCH_ES_ENDPOINTS: http://elasticsearch:9200
      REC_MODEL_SERVICE_ENABLED: "true"
      REC_MODEL_SERVICE_URL: http://recommendation-service:8000
      # N2-2 per-env 推荐 policy：gamma-local overlay 开启 objectCards
      # （30s 热更；overlay 与 metadata 的差异范围由 verify_gamma_policy_overlay.py 门禁）。
      QWQ_REC_POLICY_PATH: /etc/qwq-rec-policy/policy.yaml
      # ext.embed.openai_compatible 是 gamma 的必需 Binding；缺 endpoint 或密钥
      # 必须在启动前失败，禁止退回空向量或关闭成功路径。
      CONTENT_EMBEDDING_ENDPOINT: "${LOCAL_GAMMA_EMBEDDING_ENDPOINT:-}"
      CONTENT_EMBEDDING_API_KEY: "${LOCAL_GAMMA_EMBEDDING_API_KEY:-}"
      CIRCLE_SERVICE_BASE_URL: http://circle-service:18082
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rec-model-service:
        condition: service_healthy
      circle-service:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_CONTENT_PORT:-19220}:18080"
    volumes:
      - ${LOCAL_GAMMA_CONFIG_ROOT:?LOCAL_GAMMA_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE:?LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE is required}:/etc/ssl/local-ca/object-storage-ca.crt:ro
      - ../policies/recommendation/gamma-local.policy.yaml:/etc/qwq-rec-policy/policy.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  chat-service:
    image: "${LOCAL_GAMMA_CHAT_SERVICE_IMAGE:-localhost/quwoquan_service_chat-service:latest}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/chat-service/deploy/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: chat-service
      MODULE_PACKAGE: chat-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      CHAT_SERVICE_ADDR: ":18081"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: quwoquan_chat
      CHAT_REDIS_REALTIME_ADDR: redis:6379
      CHAT_REDIS_GENERAL_ADDR: redis:6379
      CHAT_REDIS_RELIABLE_TASK_ADDR: redis:6379
      RELIABLE_TASK_READY_INDEX_ENABLED: "true"
      RELIABLE_TASK_READY_INDEX_STREAM: reliabletask:chat:avatar:ready:local-gamma
      RELIABLE_TASK_READY_INDEX_GROUP: chat.group_avatar_worker.local-gamma
      RELIABLE_TASK_READY_INDEX_QUEUE: reliabletask.chat.avatar
      CHAT_GROUP_AVATAR_CDN_BASE_URL: "${LOCAL_GAMMA_MEDIA_PUBLIC_BASE_URL:-${LOCAL_GAMMA_MEDIA_BASE_URL:-http://127.0.0.1:19100}}"
      CHAT_GROUP_AVATAR_LOCAL_MEDIA_ROOT: /var/lib/quwoquan/chat-media
      SSL_CERT_FILE: /etc/ssl/local-ca/object-storage-ca.crt
      USER_SERVICE_BASE_URL: http://user-service:18082
      CIRCLE_SERVICE_BASE_URL: http://circle-service:18082
      CONTENT_SERVICE_BASE_URL: http://content-service:18080
      RUNTIME_SYNC_PATCH_TTL_HOURS: "720"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      content-service:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_CHAT_PORT:-19200}:18081"
    volumes:
      - ${LOCAL_GAMMA_CONFIG_ROOT:?LOCAL_GAMMA_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${LOCAL_GAMMA_MEDIA_ROOT:-../../../.qwq_output/env/gamma/local/gamma-local/cache/media}:/var/lib/quwoquan/chat-media
      - ${LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE:?LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE is required}:/etc/ssl/local-ca/object-storage-ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18081/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  user-service:
    image: "${LOCAL_GAMMA_USER_SERVICE_IMAGE:-localhost/quwoquan_service_user-service:latest}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/user-service/deploy/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_USER_GO_BUILD_FLAGS:--p=1 -tags=nonprod}"
    environment:
      SERVICE_NAME: user-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      USER_SERVICE_ADDR: ":18082"
      OTP_CODE_REF_ACTIVE_KEY_VERSION: "${OTP_CODE_REF_ACTIVE_KEY_VERSION:?OTP_CODE_REF_ACTIVE_KEY_VERSION is required}"
      OTP_CODE_REF_KEYS_JSON: "${OTP_CODE_REF_KEYS_JSON:?OTP_CODE_REF_KEYS_JSON is required}"
      QWQ_PUSH_TOKEN_ENCRYPTION_KEY: "${QWQ_PUSH_TOKEN_ENCRYPTION_KEY:?QWQ_PUSH_TOKEN_ENCRYPTION_KEY is required}"
      POSTGRES_DSN: postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: quwoquan_user
      REDIS_ADDR: redis:6379
      CHAT_SERVICE_BASE_URL: http://chat-service:18081
      # local-gamma 使用本地验收身份；外部 OAuth/号码认证不伪造凭据，
      # 对应端点按 user-service 合同返回结构化 unavailable。
      USER_AUTH_EXTERNAL_PROVIDER_MODE: anonymous_only
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_USER_PORT:-19210}:18082"
    volumes:
      - ${LOCAL_GAMMA_CONFIG_ROOT:?LOCAL_GAMMA_CONFIG_ROOT is required}:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18082/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  assistant-service:
    profiles: ["assistant-runtime"]
    image: "${LOCAL_GAMMA_ASSISTANT_SERVICE_IMAGE:-localhost/quwoquan_service_assistant-service:latest}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/assistant-service/deploy/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: assistant-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      ASSISTANT_SERVICE_ADDR: ":18087"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: quwoquan_assistant
      REDIS_GENERAL_ADDR: redis:6379
      REDIS_REC_ADDR: redis:6379
      ASSISTANT_MODEL_PROVIDER: "${ASSISTANT_MODEL_PROVIDER:-}"
      ALLOW_DETERMINISTIC_BETA: "${ALLOW_DETERMINISTIC_BETA:-}"
      ASSISTANT_SCENARIO_SEED_REFS: "${ASSISTANT_SCENARIO_SEED_REFS:-}"
      ASSISTANT_NOTIFICATION_BASE_URL: "http://notification-service:18087"
      ASSISTANT_SEARCH_PROVIDER: "${ASSISTANT_SEARCH_PROVIDER:-}"
      ASSISTANT_MODEL_API_KEY: "${ASSISTANT_MODEL_API_KEY:-}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    volumes:
      - ${LOCAL_GAMMA_CONFIG_ROOT:?LOCAL_GAMMA_CONFIG_ROOT is required}:/etc/qwq-config:ro
    ports:
      - "${LOCAL_GAMMA_ASSISTANT_PORT:-19230}:18087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18087/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  product-ops-service:
    profiles: ["commercial-observability"]
    image: "${LOCAL_GAMMA_PRODUCT_OPS_SERVICE_IMAGE:-localhost/quwoquan_service_product-ops-service:latest}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/product-ops-service/deploy/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: product-ops-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
