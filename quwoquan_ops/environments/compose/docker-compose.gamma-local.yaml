services:
  postgres:
    image: "${LOCAL_GAMMA_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}"
    networks:
      - default
      - edge
    environment:
      POSTGRES_USER: quwoquan
      POSTGRES_PASSWORD: quwoquan
      POSTGRES_DB: quwoquan
    ports:
      - "${LOCAL_GAMMA_POSTGRES_PORT:-19400}:5432"
    volumes:
      - local-gamma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quwoquan"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "${LOCAL_GAMMA_MONGO_CACHE_SIZE_GB:-0.25}",
      ]
    networks:
      - default
      - edge
    ports:
      - "${LOCAL_GAMMA_MONGO_PORT:-19410}:27017"
    volumes:
      - local-gamma-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
          }
        '
        for attempt in $(seq 1 60); do
          if mongosh --host mongodb:27017 --quiet --eval '
            if (!db.hello().isWritablePrimary) { quit(1) }
          '; then
            exit 0
          fi
          sleep 1
        done
        echo "mongo-init timed out waiting for writable primary" >&2
        exit 1
    restart: "no"

  recommendation-service:
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - default
      - edge

  redis:
    image: "${LOCAL_GAMMA_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - default
      - edge
    ports:
      - "${LOCAL_GAMMA_REDIS_PORT:-19420}:6379"
    volumes:
      - local-gamma-redis:/data
    healthcheck:
      # `redis-cli ping` returns a zero process exit status for `LOADING`; make
      # Compose dependents wait until Redis can serve commands.
      test: ["CMD-SHELL", "redis-cli --raw ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: "${LOCAL_GAMMA_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}"
    networks:
      default:
        aliases:
          - "${QWQ_PUBLIC_UPLOAD_HOST:?QWQ_PUBLIC_UPLOAD_HOST is required}"
      edge:
    environment:
      MINIO_ROOT_USER: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      MINIO_ROOT_PASSWORD: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      MINIO_BROWSER: "off"
      MINIO_CERTS_DIR: /root/.minio/certs
    command:
      - server
      - /data
      - --address
      - ":${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
      - --console-address
      - ":9001"
    ports:
      - "${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}:${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
    volumes:
      - local-gamma-object-storage:/data
      - ${LOCAL_GAMMA_OBJECT_STORAGE_TLS_DIR:?LOCAL_GAMMA_OBJECT_STORAGE_TLS_DIR is required}:/root/.minio/certs:ro

  object-storage-init:
    image: "${LOCAL_GAMMA_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-03-12T17-29-24Z}"
    depends_on:
      object-storage:
        condition: service_started
    environment:
      LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT: "${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_BUCKET: "${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET:?LOCAL_GAMMA_OBJECT_STORAGE_BUCKET is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_ENDPOINT: "${LOCAL_GAMMA_OBJECT_STORAGE_ENDPOINT:?LOCAL_GAMMA_OBJECT_STORAGE_ENDPOINT is required}"
      SSL_CERT_FILE: /etc/ssl/certs/quwoquan-local-managed.crt
    volumes:
      - ${LOCAL_GAMMA_OBJECT_STORAGE_LIFECYCLE_FILE:?packaged object-storage lifecycle file is required}:/etc/qwq-object-storage/lifecycle.json:ro
      - ${LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE:?LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE is required}:/etc/ssl/certs/quwoquan-local-managed.crt:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for attempt in $(seq 1 60); do
          if mc alias set qwq "https://${LOCAL_GAMMA_OBJECT_STORAGE_ENDPOINT}" "$LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID" "$LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET"; then
            mc mb --ignore-existing "qwq/${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET}"
            mc ilm rule import "qwq/${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET}" < /etc/qwq-object-storage/lifecycle.json
            exit 0
          fi
          sleep 2
        done
        echo "object-storage did not become ready" >&2
        exit 1
    restart: "no"

  livekit-sfu:
    profiles: ["edge-media"]
    image: "livekit/livekit-server:v1.7.2@sha256:27d72fa264baa4db4e635b3b6df12d185b4a95fee5f2ddce03e06d150d599e0e"
    command: ["--config", "/etc/livekit/livekit.yaml"]
    networks:
      - default
      - edge
    environment:
      LIVEKIT_KEYS: "${RTC_MEDIA_API_KEY:?RTC_MEDIA_API_KEY is required}: ${RTC_MEDIA_API_SECRET:?RTC_MEDIA_API_SECRET is required}"
    ports:
      - "${LOCAL_GAMMA_LIVEKIT_HTTP_PORT:?LOCAL_GAMMA_LIVEKIT_HTTP_PORT is required}:7880"
      - "${LOCAL_GAMMA_LIVEKIT_RTC_TCP_PORT:?LOCAL_GAMMA_LIVEKIT_RTC_TCP_PORT is required}:7881"
      - "${LOCAL_GAMMA_LIVEKIT_RTC_UDP_PORT:?LOCAL_GAMMA_LIVEKIT_RTC_UDP_PORT is required}:7882/udp"
      - "${LOCAL_GAMMA_LIVEKIT_METRICS_PORT:?LOCAL_GAMMA_LIVEKIT_METRICS_PORT is required}:6789"
    volumes:
      - ${LOCAL_GAMMA_LIVEKIT_CONFIG_FILE:?packaged LiveKit config file is required}:/etc/livekit/livekit.yaml:ro
  coturn:
    profiles: ["edge-media"]
    image: "coturn/coturn:4.6-alpine@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be"
    networks:
      - default
      - edge
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=rtc.quwoquan.local"
      - "--fingerprint"
      - "--no-auth"
    ports:
      - "${LOCAL_GAMMA_TURN_TCP_PORT:?LOCAL_GAMMA_TURN_TCP_PORT is required}:3478/tcp"
      - "${LOCAL_GAMMA_TURN_UDP_PORT:?LOCAL_GAMMA_TURN_UDP_PORT is required}:3478/udp"

  gamma-proxy:
    image: "${LOCAL_GAMMA_CADDY_IMAGE:-docker.io/library/caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17}"
    depends_on:
      api-edge:
        condition: service_healthy
    # Keep service mesh on internal default; publish host/Colima tunnels via edge.
    networks:
      - default
      - edge
    # In-container healthcheck must resolve public SAN hosts to loopback.
    extra_hosts:
      - "${QWQ_PUBLIC_API_HOST:?QWQ_PUBLIC_API_HOST is required}:127.0.0.1"
      - "${QWQ_PUBLIC_WEB_HOST:?QWQ_PUBLIC_WEB_HOST is required}:127.0.0.1"
      - "${QWQ_PUBLIC_RTC_HOST:?QWQ_PUBLIC_RTC_HOST is required}:127.0.0.1"
      - "${QWQ_PUBLIC_OPS_HOST:?QWQ_PUBLIC_OPS_HOST is required}:127.0.0.1"
      - "${QWQ_PUBLIC_CDN_HOST:?QWQ_PUBLIC_CDN_HOST is required}:127.0.0.1"
      - "${QWQ_PUBLIC_UPLOAD_HOST:?QWQ_PUBLIC_UPLOAD_HOST is required}:127.0.0.1"
    environment:
      LOCAL_GAMMA_HTTP_PORT: "${LOCAL_GAMMA_HTTP_PORT:-19000}"
      LOCAL_GAMMA_PRODUCT_OPS_PORT: "${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}"
      LOCAL_GAMMA_MEDIA_EDGE_PORT: "${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}"
      QWQ_PUBLIC_TLS_CERT_FILE: /etc/caddy/tls/fullchain.pem
      QWQ_PUBLIC_TLS_KEY_FILE: /etc/caddy/tls/privkey.pem
      QWQ_PUBLIC_API_HOST: "${QWQ_PUBLIC_API_HOST:?QWQ_PUBLIC_API_HOST is required}"
      QWQ_PUBLIC_WEB_HOST: "${QWQ_PUBLIC_WEB_HOST:?QWQ_PUBLIC_WEB_HOST is required}"
      QWQ_PUBLIC_RTC_HOST: "${QWQ_PUBLIC_RTC_HOST:?QWQ_PUBLIC_RTC_HOST is required}"
      QWQ_PUBLIC_OPS_HOST: "${QWQ_PUBLIC_OPS_HOST:?QWQ_PUBLIC_OPS_HOST is required}"
      QWQ_PUBLIC_CDN_HOST: "${QWQ_PUBLIC_CDN_HOST:?QWQ_PUBLIC_CDN_HOST is required}"
    ports:
      - "${LOCAL_GAMMA_HTTP_PORT:-19000}:${LOCAL_GAMMA_HTTP_PORT:-19000}"
      - "${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}:${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}"
      - "${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}:${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}"
      - "${LOCAL_GAMMA_ADMIN_PORT:-2019}:2019"
    volumes:
      - ${LOCAL_GAMMA_CADDYFILE:?packaged Caddyfile is required}:/etc/caddy/Caddyfile:ro
      - ${QWQ_PUBLIC_TLS_CERT_FILE:?QWQ_PUBLIC_TLS_CERT_FILE is required}:/etc/caddy/tls/fullchain.pem:ro
      - ${QWQ_PUBLIC_TLS_KEY_FILE:?QWQ_PUBLIC_TLS_KEY_FILE is required}:/etc/caddy/tls/privkey.pem:ro
      - ${LOCAL_GAMMA_MEDIA_ROOT:-../../../.qwq_output/env/gamma/local/gamma-local/cache/media}:/srv/media:ro
      - ${LOCAL_GAMMA_LEGAL_STATIC_ROOT:?LOCAL_GAMMA_LEGAL_STATIC_ROOT is required}:/srv/legal:ro
      # 运维运营 Portal 静态站点（vite build 产物；prod 渲染时替换为 runtime/portal）。
      - ${LOCAL_GAMMA_PORTAL_ROOT:?LOCAL_GAMMA_PORTAL_ROOT is required}:/srv/portal:ro
      - ${LOCAL_GAMMA_CADDY_DATA_VOLUME:-local-gamma-caddy-data}:/data
      - ${LOCAL_GAMMA_CADDY_CONFIG_VOLUME:-local-gamma-caddy-config}:/config
    healthcheck:
      # Certificate/SAN verification is owned by stackctl's host probe with
      # the target-scoped local-managed CA.  This in-container loopback probe
      # only checks that Caddy can terminate TLS and route the API healthz.
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://${QWQ_PUBLIC_API_HOST}:${LOCAL_GAMMA_HTTP_PORT:-19000}/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 10

  # Host/Colima readiness probes hit these published ports through the edge
  # network. Keeping them only on the internal default network leaves
  # NetworkSettings.Ports empty and Colima tunnels with nothing to forward
  # (default is internal: true).
  #
  # Only workloads whose Compose fragment is unconditionally loaded may appear
  # here. Conditionally loaded fragments (the debug Provider substitutes) attach
  # to `edge` inside their own fragment, otherwise this file declares an
  # image-less service whenever that fragment is absent.
  user-service:
    networks:
      - default
      - edge
  product-ops-service:
    networks:
      - default
      - edge
  platform-ops-service:
    networks:
      - default
      - edge
  integration-service:
    networks:
      - default
      - edge
  notification-service:
    networks:
      - default
      - edge
  tag-service:
    networks:
      - default
      - edge
  api-edge:
    networks:
      - default
      - edge
  content-service:
    networks:
      - default
      - edge
  entity-service:
    networks:
      - default
      - edge
  chat-service:
    networks:
      - default
      - edge
  assistant-service:
    networks:
      - default
      - edge
  search-service:
    networks:
      - default
      - edge
  circle-service:
    networks:
      - default
      - edge
  realtime-gateway:
    networks:
      - default
      - edge
  rtc-service:
    networks:
      - default
      - edge

networks:
  default:
    # Runtime Provider traffic is closed over first-party infrastructure and
    # Ops-owned protocol substitutes. Image pulls/builds occur before attach.
    internal: true
  edge:
    # Non-internal publish plane so host/Colima can reach declared ports while
    # service-to-service traffic remains on the internal default network.
    driver: bridge

volumes:
  local-gamma-postgres:
  local-gamma-mongo:
  local-gamma-redis:
  local-gamma-object-storage:
  local-gamma-go-cache:
  local-gamma-caddy-data:
  local-gamma-caddy-config:
