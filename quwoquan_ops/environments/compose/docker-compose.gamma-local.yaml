  # 专用 ES/OpenSearch 读模型的本地替身：prod/gamma 用托管/专用集群，local-gamma 用单节点容器
  # 承载同一检索读模型（与 postgres/mongo/redis 同属本地数据面替身）。单节点、安全关闭。
  elasticsearch:
    image: "${LOCAL_GAMMA_ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}"
    # Apple Silicon/Colima 下 ES 8.x 自带 arm64 JDK 会在 JVM 初始化期 SIGILL（非法指令）崩溃，
    # 与 quwoquan_ops/observability/es/docker-compose.yml 参考一致，固定 amd64 由 VM 翻译层运行；
    # 模拟启动较慢（~3min），故 start_period 放宽。prod/gamma 真集群不受此约束。
    platform: linux/amd64
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # gamma-local 的单节点 ES 共享 Colima 虚拟磁盘；宿主构建缓存水位不代表
      # 托管 Gamma 集群容量。关闭本地 allocation threshold 会解除历史
      # read_only_allow_delete block，同时 Search backfill 仍然失败关闭。
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${LOCAL_GAMMA_ES_PORT:-19430}:9200"
    volumes:
      - local-gamma-es:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 240s
      retries: 40

  search-service:
    image: "${LOCAL_GAMMA_SEARCH_SERVICE_IMAGE:-localhost/quwoquan_service_search-service:latest}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/search-service/deploy/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: search-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      # ES 召回主链路：endpoints 经 SEARCH_ES_* 注入（部署密钥口径），gamma config es.enabled=true。
      SEARCH_ES_ENABLED: "true"
      SEARCH_ES_ENDPOINTS: "http://elasticsearch:9200"
      # query log / feedback / 搜索词热力读模型落 Mongo（R-S07 闭环）。
      SEARCH_MONGO_URI: "mongodb://mongodb:27017"
      SEARCH_MONGO_DATABASE: "quwoquan_search"
      # R-S07-5：搜索信号发布到 Redis Stream，供 content-service 消费注入推荐特征。
      SEARCH_REDIS_GENERAL_MODE: standalone
      SEARCH_REDIS_GENERAL_ADDR: redis:6379
      CONTENT_SERVICE_BASE_URL: http://content-service:18080
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      content-service:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_SEARCH_PORT:-19280}:18095"
    volumes:
      - ${LOCAL_GAMMA_CONFIG_ROOT:?LOCAL_GAMMA_CONFIG_ROOT is required}:/etc/qwq-config:ro
    healthcheck:
