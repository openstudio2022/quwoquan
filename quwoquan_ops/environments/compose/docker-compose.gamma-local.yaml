      LOCAL_GAMMA_HTTP_PORT: "${LOCAL_GAMMA_HTTP_PORT:-19000}"
      LOCAL_GAMMA_PRODUCT_OPS_PORT: "${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}"
      LOCAL_GAMMA_MEDIA_EDGE_PORT: "${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}"
    ports:
      - "${LOCAL_GAMMA_HTTP_PORT:-19000}:${LOCAL_GAMMA_HTTP_PORT:-19000}"
      - "${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}:${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}"
      - "${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}:${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}"
      - "${LOCAL_GAMMA_ADMIN_PORT:-2019}:2019"
    volumes:
      - ${LOCAL_GAMMA_CADDYFILE:-../local-gamma/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${LOCAL_GAMMA_MEDIA_ROOT:-../../../.qwq_output/env/gamma/local/gamma-local/cache/media}:/srv/media:ro
      - ${LOCAL_GAMMA_LEGAL_STATIC_ROOT:?LOCAL_GAMMA_LEGAL_STATIC_ROOT is required}:/srv/legal:ro
      # 运维运营 Portal 静态站点（vite build 产物；prod 渲染时替换为 runtime/portal）。
      - ${LOCAL_GAMMA_PORTAL_ROOT:?LOCAL_GAMMA_PORTAL_ROOT is required}:/srv/portal:ro
      - ${LOCAL_GAMMA_CADDY_DATA_VOLUME:-local-gamma-caddy-data}:/data
      - ${LOCAL_GAMMA_CADDY_CONFIG_VOLUME:-local-gamma-caddy-config}:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 10

  # ── edge-media 平面（与 prod 同集群独立 workload 对齐；逻辑独立、当前统一在本 compose、按需 profile 组装）──
  # 默认主栈不启动；`docker compose --profile edge-media up` 在主栈之上叠加实时/媒体面。
  livekit-sfu:
    profiles: ["edge-media"]
    image: "${LOCAL_GAMMA_LIVEKIT_IMAGE:-docker.io/livekit/livekit-server:v1.7.2@sha256:27d72fa264baa4db4e635b3b6df12d185b4a95fee5f2ddce03e06d150d599e0e}"
    command: ["--dev", "--bind", "0.0.0.0", "--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ../../../quwoquan_service/services/livekit-sfu/deploy/kustomize/base/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "${LOCAL_GAMMA_LIVEKIT_HTTP_PORT:-19140}:7880"
      - "${LOCAL_GAMMA_LIVEKIT_RTC_TCP_PORT:-19150}:7881"
      - "${LOCAL_GAMMA_LIVEKIT_RTC_UDP_PORT:-19160}:7882/udp"
      - "${LOCAL_GAMMA_LIVEKIT_METRICS_PORT:-19170}:6789"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

  rtc-service:
    profiles: ["edge-media"]
    image: "${LOCAL_GAMMA_RTC_SERVICE_IMAGE:?fixed rtc-service source image reference is required}"
    environment:
      SERVICE_NAME: rtc-service
      APP_ENV: gamma
      # rtc-service 自带镜像内 config（/etc/rtc-service），不复用 seed config-root。
      CONFIG_ROOT: /etc/rtc-service
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      RTC_SERVICE_ADDR: ":18083"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: quwoquan_rtc
      REDIS_ADDR: redis:6379
      # 客户端媒体地址只由 App 环境包的 topology publicBases.rtc 注入；
      # livekit-sfu:7880 仅是服务内 DNS，禁止进入任何业务 API。
      RTC_MEDIA_CONNECTION_URL: "${LOCAL_GAMMA_RTC_MEDIA_CONNECTION_URL:-wss://gamma-rtc.quwoquan-env.test:19000}"
      RTC_MEDIA_API_KEY: "${LOCAL_GAMMA_RTC_MEDIA_API_KEY:-devkey}"
      RTC_MEDIA_API_SECRET: "${LOCAL_GAMMA_RTC_MEDIA_API_SECRET:-secret}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit-sfu:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_RTC_PORT:-19350}:18083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18083/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  coturn:
    profiles: ["edge-media"]
    image: "${LOCAL_GAMMA_COTURN_IMAGE:-docker.io/coturn/coturn:4.6-alpine@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be}"
    # 本地用端口映射替代 prod 的 hostNetwork；UDP 在部分本机/虚拟化下能力受限，仅供信令/中继联调。
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=rtc.quwoquan.local"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=quwoquan:${LOCAL_GAMMA_TURN_SECRET:-devsecret}"
    ports:
      - "${LOCAL_GAMMA_TURN_TCP_PORT:-19180}:3478/tcp"
      - "${LOCAL_GAMMA_TURN_UDP_PORT:-19180}:3478/udp"

  realtime-gateway:
    profiles: ["edge-media"]
    image: "${LOCAL_GAMMA_REALTIME_GATEWAY_IMAGE:?fixed realtime-gateway source image reference is required}"
    environment:
      SERVICE_NAME: realtime-gateway
      APP_ENV: gamma
      REALTIME_GATEWAY_ADDR: ":18090"
      REALTIME_REDIS_MODE: standalone
      REALTIME_REDIS_ADDR: redis:6379
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_REALTIME_PORT:-19340}:18090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18090/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

volumes:
  local-gamma-postgres:
  local-gamma-mongo:
  local-gamma-redis:
  local-gamma-go-cache:
  local-gamma-es:
  local-gamma-object-storage:
  local-gamma-caddy-data:
  local-gamma-caddy-config:
