services:
  postgres:
    image: "${LOCAL_GAMMA_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}"
    environment:
      POSTGRES_USER: quwoquan
      POSTGRES_PASSWORD: quwoquan
      POSTGRES_DB: quwoquan
    ports:
      - "${LOCAL_GAMMA_POSTGRES_PORT:-19400}:5432"
    volumes:
      - local-gamma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quwoquan"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "${LOCAL_GAMMA_MONGO_CACHE_SIZE_GB:-0.25}",
      ]
    ports:
      - "${LOCAL_GAMMA_MONGO_PORT:-19410}:27017"
    volumes:
      - local-gamma-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
          }
        '
    restart: "no"

  redis:
    image: "${LOCAL_GAMMA_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LOCAL_GAMMA_REDIS_PORT:-19420}:6379"
    volumes:
      - local-gamma-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: "${LOCAL_GAMMA_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}"
    networks:
      default:
        aliases:
          - gamma-upload.quwoquan-env.test
          - gamma-upload.localhost
    environment:
      MINIO_ROOT_USER: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      MINIO_ROOT_PASSWORD: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      MINIO_BROWSER: "off"
      MINIO_CERTS_DIR: /root/.minio/certs
    command:
      - server
      - /data
      - --address
      - ":${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
      - --console-address
      - ":9001"
    ports:
      - "${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}:${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
    volumes:
      - local-gamma-object-storage:/data
      - ${LOCAL_GAMMA_OBJECT_STORAGE_TLS_DIR:?LOCAL_GAMMA_OBJECT_STORAGE_TLS_DIR is required}:/root/.minio/certs:ro

  object-storage-init:
    image: "${LOCAL_GAMMA_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-03-12T17-29-24Z}"
    depends_on:
      object-storage:
        condition: service_started
    environment:
      LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT: "${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT:?LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_BUCKET: "${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET:?LOCAL_GAMMA_OBJECT_STORAGE_BUCKET is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET: "${LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
    volumes:
      - ${LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE:?LOCAL_GAMMA_OBJECT_STORAGE_CA_FILE is required}:/etc/qwq-object-storage/ca.crt:ro
      - ./object-storage-lifecycle.json:/etc/qwq-object-storage/lifecycle.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        install -d -m 0700 /root/.mc/certs/CAs
        cp /etc/qwq-object-storage/ca.crt /root/.mc/certs/CAs/qwq-gamma-object-storage.crt
        for attempt in $(seq 1 60); do
          if mc alias set qwq "https://gamma-upload.quwoquan-env.test:${LOCAL_GAMMA_OBJECT_STORAGE_EDGE_PORT}" "$LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_ID" "$LOCAL_GAMMA_OBJECT_STORAGE_ACCESS_KEY_SECRET"; then
            mc mb --ignore-existing "qwq/${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET}"
            mc ilm rule import "qwq/${LOCAL_GAMMA_OBJECT_STORAGE_BUCKET}" < /etc/qwq-object-storage/lifecycle.json
            exit 0
          fi
          sleep 2
        done
        echo "object-storage did not become ready" >&2
        exit 1
    restart: "no"

  elasticsearch:
    image: "${LOCAL_GAMMA_ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}"
    # Apple Silicon/Colima 下 ES 8.x 自带 arm64 JDK 会在 JVM 初始化期 SIGILL（非法指令）崩溃，
    # 与 quwoquan_ops/observability/es/docker-compose.yml 参考一致，固定 amd64 由 VM 翻译层运行；
    # 模拟启动较慢（~3min），故 start_period 放宽；该限制不代表托管环境容量。
    platform: linux/amd64
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # gamma-local 的单节点 ES 共享 Colima 虚拟磁盘；宿主构建缓存水位不代表
      # 托管 Gamma 集群容量。关闭本地 allocation threshold 会解除历史
      # read_only_allow_delete block，同时 Search backfill 仍然失败关闭。
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${LOCAL_GAMMA_ES_PORT:-19430}:9200"
    volumes:
      - local-gamma-es:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 240s
      retries: 40

  # Elasticsearch 是 gamma-local 基础设施而非 content-service 的通用必需物。
  # beta 的 content-release 切片显式关闭 SEARCH_ES_ENABLED，不能因为不存在
  # 本地 ES service 而失去可组合的 content 数据面。gamma 开启索引投影时，
  # content-service 的 gamma 环境覆盖层声明其启动前置条件。

  gamma-proxy:
    image: "${LOCAL_GAMMA_CADDY_IMAGE:-docker.io/library/caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17}"
    depends_on:
      content-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
        required: false
      product-ops-service:
        condition: service_healthy
        required: false
      tag-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      entity-service:
        condition: service_healthy
      circle-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      LOCAL_GAMMA_TLS_MODE: "${LOCAL_GAMMA_TLS_MODE:-internal}"
      LOCAL_GAMMA_HTTP_PORT: "${LOCAL_GAMMA_HTTP_PORT:-19000}"
      LOCAL_GAMMA_PRODUCT_OPS_PORT: "${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}"
      LOCAL_GAMMA_MEDIA_EDGE_PORT: "${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}"
    ports:
      - "${LOCAL_GAMMA_HTTP_PORT:-19000}:${LOCAL_GAMMA_HTTP_PORT:-19000}"
      - "${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}:${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}"
      - "${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}:${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}"
      - "${LOCAL_GAMMA_ADMIN_PORT:-2019}:2019"
    volumes:
      - ${LOCAL_GAMMA_CADDYFILE:-../gamma/local/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${LOCAL_GAMMA_MEDIA_ROOT:-../../../.qwq_output/env/gamma/local/gamma-local/cache/media}:/srv/media:ro
      - ${LOCAL_GAMMA_LEGAL_STATIC_ROOT:?LOCAL_GAMMA_LEGAL_STATIC_ROOT is required}:/srv/legal:ro
      # 运维运营 Portal 静态站点（vite build 产物；prod 渲染时替换为 runtime/portal）。
      - ${LOCAL_GAMMA_PORTAL_ROOT:?LOCAL_GAMMA_PORTAL_ROOT is required}:/srv/portal:ro
      - ${LOCAL_GAMMA_CADDY_DATA_VOLUME:-local-gamma-caddy-data}:/data
      - ${LOCAL_GAMMA_CADDY_CONFIG_VOLUME:-local-gamma-caddy-config}:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 10

volumes:
  local-gamma-postgres:
  local-gamma-mongo:
  local-gamma-redis:
  local-gamma-object-storage:
  local-gamma-go-cache:
  local-gamma-es:
  local-gamma-caddy-data:
  local-gamma-caddy-config:
