services:
  postgres:
    image: "${BETA_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}"
    environment:
      POSTGRES_USER: quwoquan
      POSTGRES_PASSWORD: quwoquan
      POSTGRES_DB: quwoquan
    ports:
      - "${BETA_POSTGRES_PORT:?BETA_POSTGRES_PORT is required}:5432"
    volumes:
      - beta-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quwoquan"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: "${BETA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "${BETA_MONGO_CACHE_SIZE_GB:-0.25}",
      ]
    ports:
      - "${BETA_MONGO_PORT:?BETA_MONGO_PORT is required}:27017"
    volumes:
      - beta-local-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 10s
      retries: 20

  mongo-init:
    image: "${BETA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
          }
        '
    restart: "no"

  redis:
    image: "${BETA_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BETA_REDIS_PORT:?BETA_REDIS_PORT is required}:6379"
    volumes:
      - beta-local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: "${BETA_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}"
    networks:
      default:
        aliases:
          - upload.beta.quwoquan.com
    environment:
      MINIO_ROOT_USER: "${BETA_OBJECT_STORAGE_ACCESS_KEY_ID:?BETA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      MINIO_ROOT_PASSWORD: "${BETA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?BETA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      MINIO_BROWSER: "off"
      MINIO_CERTS_DIR: /root/.minio/certs
    command:
      - server
      - /data
      - --address
      - ":${BETA_OBJECT_STORAGE_EDGE_PORT:?BETA_OBJECT_STORAGE_EDGE_PORT is required}"
      - --console-address
      - ":9001"
    ports:
      - "${BETA_OBJECT_STORAGE_EDGE_PORT:?BETA_OBJECT_STORAGE_EDGE_PORT is required}:${BETA_OBJECT_STORAGE_EDGE_PORT:?BETA_OBJECT_STORAGE_EDGE_PORT is required}"
    volumes:
      - beta-local-object-storage:/data
      - ${BETA_OBJECT_STORAGE_TLS_DIR:?BETA_OBJECT_STORAGE_TLS_DIR is required}:/root/.minio/certs:ro

  object-storage-init:
    image: "${BETA_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-03-12T17-29-24Z}"
    depends_on:
      object-storage:
        condition: service_started
    environment:
      BETA_OBJECT_STORAGE_EDGE_PORT: "${BETA_OBJECT_STORAGE_EDGE_PORT:?BETA_OBJECT_STORAGE_EDGE_PORT is required}"
      BETA_OBJECT_STORAGE_BUCKET: "${BETA_OBJECT_STORAGE_BUCKET:?BETA_OBJECT_STORAGE_BUCKET is required}"
      BETA_OBJECT_STORAGE_ACCESS_KEY_ID: "${BETA_OBJECT_STORAGE_ACCESS_KEY_ID:?BETA_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      BETA_OBJECT_STORAGE_ACCESS_KEY_SECRET: "${BETA_OBJECT_STORAGE_ACCESS_KEY_SECRET:?BETA_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      BETA_OBJECT_STORAGE_ENDPOINT: "${BETA_OBJECT_STORAGE_ENDPOINT:?BETA_OBJECT_STORAGE_ENDPOINT is required}"
    volumes:
      - ./object-storage-lifecycle.json:/etc/qwq-object-storage/lifecycle.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for attempt in $(seq 1 60); do
          if mc alias set qwq "https://${BETA_OBJECT_STORAGE_ENDPOINT}" "$BETA_OBJECT_STORAGE_ACCESS_KEY_ID" "$BETA_OBJECT_STORAGE_ACCESS_KEY_SECRET"; then
            mc mb --ignore-existing "qwq/${BETA_OBJECT_STORAGE_BUCKET}"
            mc ilm rule import "qwq/${BETA_OBJECT_STORAGE_BUCKET}" < /etc/qwq-object-storage/lifecycle.json
            exit 0
          fi
          sleep 2
        done
        echo "object-storage did not become ready" >&2
        exit 1
    restart: "no"

volumes:
  beta-local-postgres:
  beta-local-mongo:
  beta-local-redis:
  beta-local-object-storage:
