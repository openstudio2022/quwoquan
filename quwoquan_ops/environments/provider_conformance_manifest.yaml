schema: provider-conformance-manifest
description: 每个 Provider Adapter 必须共享同一份三层场景合同，并输出可校验的九格证据。
common_assertion_ids:
- common.success
- common.validation
- common.authentication
- common.dns_network
- common.timeout
- common.throttle
- common.retry
- common.idempotency
- common.redaction
- common.observability
- common.cleanup
profile_assertion_ids:
  generic_provider: [profile.generic.provider_contract]
  message_transport: [profile.message.pubsub_ephemeral, profile.message.delivery_ack, profile.message.pending_reclaim, profile.message.dead_letter, profile.message.scene_isolation, profile.message.duplicate_suppression, profile.message.redaction_cleanup]
  push_delivery: [profile.push.token_invalid, profile.push.delivery_receipt]
  model_gateway: [profile.model.prompt_redaction, profile.model.stream_cancel, profile.model.quota]
  rtc_provider: [profile.rtc.session_lifecycle, profile.rtc.media_permission, profile.rtc.reconnect]
  object_storage: [profile.storage.upload_integrity, profile.storage.download_access, profile.storage.delete_lifecycle]
  public_source: [profile.source.license_provenance, profile.source.rate_limit]
  client_platform: [profile.platform.capability_unavailable, profile.platform.permission_lifecycle]
  runtime_infrastructure: [profile.runtime.startup_preflight, profile.runtime.health_probe]
  observability_log: [profile.log.redaction_pipeline, profile.log.delivery]
  dns_resolver: [profile.dns.resolver_timeout, profile.dns.fallback_policy]
profiles:
  generic_provider: &generic_profile
    local_contract: quwoquan_ops/tests/local_contract/provider_conformance_evidence__contract__local_contract_test.py
    api_integration: quwoquan_ops/tests/acceptance/api_integration/external_provider_governance__api_integration_test.py
    user_acceptance: quwoquan_ops/tests/acceptance/user_acceptance/external_provider_governance__user_acceptance_test.py
    artifact_schema: quwoquan_ops/environments/provider_conformance_evidence.schema.json
  message_transport:
    <<: *generic_profile
    local_contract: quwoquan_service/runtime/messaging/redis_message_transport_binding__local_contract_test.go
    api_integration: quwoquan_service/services/chat-service/tests/api_integration/assistant_mentioned_stream_contract__api_integration_test.go
    user_acceptance: quwoquan_ops/environments/provider_conformance_prerequisites/message_transport_chat_assistant_remote_uat.yaml
  push_delivery: *generic_profile
  model_gateway:
    <<: *generic_profile
    local_contract: quwoquan_service/services/assistant-service/internal/infrastructure/modelprovider/client__local_contract_test.go
    api_integration: quwoquan_service/services/assistant-service/tests/api_integration/external_provider_failure__api_integration_test.go
  rtc_provider:
    <<: *generic_profile
    local_contract: quwoquan_service/services/rtc-service/internal/infrastructure/livekit/room_adapter__local_contract_test.go
    api_integration: quwoquan_service/services/rtc-service/tests/api_integration/call_timeout_and_connected_contract__api_integration_test.go
  object_storage: *generic_profile
  public_source: *generic_profile
  client_platform: *generic_profile
  runtime_infrastructure: *generic_profile
  observability_log:
    <<: *generic_profile
    local_contract: quwoquan_service/services/product-ops-service/tests/local_contract/visit_event_contract__local_contract_test.go
    api_integration: quwoquan_service/services/product-ops-service/tests/api_integration/rtc_media_qoe_summary__observability__api_integration_test.go
  dns_resolver: *generic_profile
