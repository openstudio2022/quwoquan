apiVersion: quwoquan.io/v1
kind: AliyunSLSProductTelemetry
metadata:
  name: app-product-telemetry
  owner: product-ops-growth
  environments: [prod]
spec:
  deploymentProfiles:
    alpha:
      backend: memory
      evidenceClass: local_contract
      requiresSecret: false
      invokeSlsWriter: false
    beta:
      integration:
        backend: postgres_telemetry_local
        evidenceClass: api_integration
        requiresSecret: false
      release:
        backend: postgres_telemetry_local
        evidenceClass: api_integration
        requiresSecret: false
    gamma:
      integration:
        backend: elasticsearch_local
        evidenceClass: api_integration
        requiresSecret: false
      release:
        backend: elasticsearch_local
        evidenceClass: api_integration
        requiresSecret: false
    prod:
      backend: aliyun_sls
      evidenceClass: api_integration
      requiresSecret: true
    selection: compositionRoot
  project:
    configEnv: PRODUCT_OPS_SLS_PROJECT
    regionEnv: PRODUCT_OPS_SLS_REGION
    endpointEnv: PRODUCT_OPS_SLS_ENDPOINT
    endpointScope: vpc
  credentials:
    source: deploymentSecret
    env:
      accessKeyId: ALIBABA_CLOUD_ACCESS_KEY_ID
      accessKeySecret: ALIBABA_CLOUD_ACCESS_KEY_SECRET
      securityToken: ALIBABA_CLOUD_SECURITY_TOKEN
    forbiddenInConfig: true
  logstores:
    - name: app-product-telemetry-raw
      retentionDays: 3
      appendMeta: true
      indexes:
        text: false
        fields:
          - logType
          - eventType
          - pageName
          - journey
          - action
          - result
          - durationMs
          - failReasonCode
          - recoveryAction
          - requestId
          - resultCount
          - rankPosition
          - objectType
          - traceId
          - appVersion
          - networkClass
          - deviceManufacturer
          - deviceModel
          - errorCode
          - operationId
          - httpStatus
          - occurredAt
          - sessionId
          - _batchKey
          - _batchIndex
          - readyMs
          - ttffMs
          - rebufferCount
          - rebufferMs
          - effectivePlaybackMs
          - seekCount
          - seekFailureCount
          - seekCommandMaxMs
          - seekSettleMaxMs
          - droppedFrames
          - processedVideoFrames
          - audioUnderrunCount
          - rendererMode
          - decoderQueueMode
          - decoderFallbackEnabled
          - seekEvidenceSource
          - declaredDurationMs
          - observedDurationMs
          - durationMismatch
          - devicePlatform
          - playbackMode
          - publicationStage
          - contentType
          - objectState
          - surfaceId
          - correlationHash
          - backgroundRetryTerminal
          - chatAction
          - chatOutcome
          - chatSource
          - mentionScope
          - governanceAction
          - watermarkResult
          - memberCountBucket
          - unreadCountBucket
        forbidden: [callStack]
      access:
        write: product-ops-service
        query: [product-ops-service]
        sensitiveExactQueryPermission: ops.event.drilldown.sensitive
    - name: app-startup-diagnostic-raw
      retentionDays: 3
      appendMeta: true
      forbiddenFields: [sessionId, userId, pageName, callStack]
      access:
        write: product-ops-service
        query: [product-ops-service]
    - name: runtime-diagnostics-raw
      retentionDays: 3
      appendMeta: true
      forbiddenFields: [schemaVersion, eventVersion, contractVersion, protocolVersion, releaseVersion, releaseId, dataReleaseId, sessionId, userId]
      indexes:
        text: false
        fields:
          - logKind
          - severity
          - signal
          - errorCode
          - fingerprint
          - resourceSourceType
          - resourceService
          - resourceAppVersion
          - resourceServiceVersion
          - resourceEnvironment
          - operationId
          - pageName
          - occurredAt
          - ingestedAt
      access:
        write: product-ops-service
        query: [product-ops-service]
        sensitiveExactQueryPermission: ops.runtime_log.drilldown.sensitive
    - name: app-product-telemetry-hourly
      retentionDays: 90
      appendMeta: true
      forbiddenFields: [sessionId, userId, callStack, _batchKey]
      access:
        write: scheduled-sql-product-telemetry
        query: [product-ops-service]
  scheduledSql:
    common:
      source: app-product-telemetry-raw
      destination: app-product-telemetry-hourly
      schedule: 0 * * * *
      delaySeconds: 120
      window: '[@h-1h,@h)'
      timeBasis: __time__
      businessHourExpression: date_trunc('hour', from_iso8601_timestamp(occurredAt))
      destinationLogTime: businessHour
      exactlyOnce: true
      lateArrival: emitIncrementForBusinessHour
      rowKindField: rowKind
      freshnessFields: [freshness, generatedThrough, lagSeconds]
      rowIdentity: [_batchKey, _batchIndex]
      duplicatePolicy: count_distinct_row_identity
    jobs:
      - name: app-product-telemetry-event-dimensions-hourly
        rowKind: event_dimensions
        sql: >-
          * | SELECT 'event_dimensions' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          logType,eventType,pageName,appVersion,networkClass,deviceManufacturer,deviceModel,
          journey,action,result,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          approx_set(sessionId) AS sessionHll,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,logType,eventType,pageName,appVersion,networkClass,
          deviceManufacturer,deviceModel,journey,action,result
      - name: app-product-telemetry-product-action-funnel-hourly
        rowKind: product_action_funnel
        sql: >-
          eventType:product_action | SELECT 'product_action_funnel' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          journey,action,pageName,result,failReasonCode,recoveryAction,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          approx_set(sessionId) AS sessionHll,
          histogram(try_cast(durationMs AS double),array[0,50,100,250,500,1000,2000,3000,5000,10000,30000]) AS durationHistogram,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,journey,action,pageName,result,failReasonCode,recoveryAction
      - name: app-product-telemetry-chat-funnel-hourly
        rowKind: chat_funnel
        sql: >-
          eventType:chat_interaction_outcome | SELECT 'chat_funnel' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          pageName,chatAction,chatOutcome,chatSource,mentionScope,governanceAction,
          watermarkResult,memberCountBucket,unreadCountBucket,failReasonCode,recoveryAction,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          approx_set(sessionId) AS sessionHll,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,pageName,chatAction,chatOutcome,chatSource,mentionScope,
          governanceAction,watermarkResult,memberCountBucket,unreadCountBucket,
          failReasonCode,recoveryAction
      - name: app-product-telemetry-content-publication-funnel-hourly
        rowKind: content_publication_funnel
        sql: >-
          eventType:content_publication | SELECT 'content_publication_funnel' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          pageName,publicationStage,contentType,objectState,surfaceId,result,
          backgroundRetryTerminal,failReasonCode,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          count(DISTINCT CASE WHEN publicationStage='submit_started'
            THEN correlationHash END) AS submitStartedCount,
          count(DISTINCT CASE WHEN publicationStage='pending_review'
            THEN correlationHash END) AS pendingReviewCount,
          count(DISTINCT CASE WHEN publicationStage='published'
            THEN correlationHash END) AS publishedCount,
          count(DISTINCT CASE WHEN publicationStage='cancelled'
            THEN correlationHash END) AS cancelledCount,
          count(DISTINCT CASE WHEN backgroundRetryTerminal='retry_exhausted'
            THEN correlationHash END) AS retryExhaustedCount,
          histogram(try_cast(durationMs AS double),
            array[0,1000,5000,15000,30000,60000,120000,300000,600000,1800000,3600000])
            AS publishToVisibleHistogram,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt)))
            AS lagSeconds
          GROUP BY businessHour,pageName,publicationStage,contentType,objectState,surfaceId,
          result,backgroundRetryTerminal,failReasonCode
      - name: app-product-telemetry-article-reader-lifecycle-hourly
        rowKind: article_reader_lifecycle
        sql: >-
          (eventType:article_reader_enter OR eventType:article_reader_dwell OR
          eventType:article_reader_exit OR eventType:article_reader_error OR
          eventType:article_reader_recovery) |
          SELECT 'article_reader_lifecycle' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          eventType,pageName,surfaceId,objectType,result,errorCode,recoveryAction,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          approx_set(sessionId) AS sessionHll,
          histogram(try_cast(durationMs AS double),
            array[0,50,100,250,500,800,1200,2000,3000,5000,10000,30000,60000,300000,
            1800000]) AS durationHistogram,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt)))
            AS lagSeconds
          GROUP BY businessHour,eventType,pageName,surfaceId,objectType,result,errorCode,recoveryAction
      - name: app-product-telemetry-video-preview-track-load-hourly
        rowKind: video_preview_track_load
        sql: >-
          eventType:video_preview_track_load | SELECT 'video_preview_track_load' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          pageName,result,failReasonCode,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          histogram(try_cast(durationMs AS double),
            array[0,50,100,250,500,1000,2000,3000,5000,10000,30000])
            AS durationHistogram,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt)))
            AS lagSeconds
          GROUP BY businessHour,pageName,result,failReasonCode
      - name: app-product-telemetry-search-funnel-hourly
        rowKind: search_funnel
        sql: >-
          (eventType:search_query_submit OR eventType:search_result_impression OR
          eventType:search_result_click OR eventType:search_refine OR
          eventType:search_zero_result OR eventType:search_result_dwell) |
          SELECT 'search_funnel' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          action,
          count(DISTINCT CASE WHEN eventType='search_query_submit' THEN requestId END) AS querySubmitCount,
          count(DISTINCT CASE WHEN eventType='search_result_impression' THEN requestId END) AS nonEmptyResultCount,
          count(DISTINCT CASE WHEN eventType='search_zero_result' THEN requestId END) AS zeroResultCount,
          count(DISTINCT CASE WHEN eventType='search_result_click' THEN requestId END) AS clickRequestCount,
          count(DISTINCT CASE WHEN eventType='search_result_dwell'
            AND try_cast(durationMs AS bigint)>=3000 THEN requestId END) AS qualifiedDwellRequestCount,
          count(DISTINCT CASE WHEN eventType='search_result_click'
            OR (eventType='search_result_dwell' AND try_cast(durationMs AS bigint)>=3000)
            THEN requestId END) AS effectiveActionRequestCount,
          count(DISTINCT CASE WHEN eventType='search_refine' THEN requestId END) AS refineRequestCount,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS acceptedRowCount,
          histogram(CASE WHEN eventType='search_result_impression'
            THEN try_cast(durationMs AS double) END,
            array[0,50,100,250,500,750,1000,1500,2000,3000,5000,10000]) AS firstActionableHistogram,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,action
      - name: app-product-telemetry-performance-hourly
        rowKind: performance
        sql: >-
          (eventType:performance_sample OR eventType:app_startup) | SELECT
          'performance' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,eventType,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          operationId,count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          histogram(try_cast(durationMs AS double),array[0,50,100,250,500,1000,2000,3000,5000,10000,30000]) AS durationHistogram,
          histogram(try_cast(tClickToFirstFrameMs AS double),array[0,50,100,250,500,1000,2000,3000,5000,10000,30000]) AS firstFrameHistogram,
          histogram(try_cast(tFirstFrameToShellMs AS double),array[0,50,100,250,500,1000,2000,3000,5000,10000,30000]) AS shellHistogram,
          histogram(try_cast(tShellToContentMs AS double),array[0,50,100,250,500,1000,2000,3000,5000,10000,30000]) AS contentAfterShellHistogram,
          histogram(try_cast(tClickToContentMs AS double),array[0,50,100,250,500,1000,2000,3000,5000,10000,30000]) AS contentHistogram,
          count(DISTINCT CASE WHEN hasError='true' THEN concat(_batchKey, ':', _batchIndex) END) AS errorCount,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,eventType,operationId
      - name: app-product-telemetry-video-qoe-hourly
        rowKind: video_qoe
        sql: >-
          eventType:video_playback_qoe | SELECT
          'video_qoe' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          devicePlatform,networkClass,
          playbackMode,result,rendererMode,decoderQueueMode,decoderFallbackEnabled,seekEvidenceSource,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS readyCount,
          count(DISTINCT CASE WHEN ttffMs IS NOT NULL THEN concat(_batchKey, ':', _batchIndex) END) AS nativeFirstFrameSuccessCount,
          histogram(try_cast(readyMs AS double),array[0,100,250,500,1000,2000,3000,5000,10000,30000]) AS readyHistogram,
          histogram(try_cast(ttffMs AS double),array[0,100,250,500,1000,2000,3000,5000,10000,30000]) AS ttffHistogram,
          sum(try_cast(rebufferCount AS bigint)) AS rebufferCount,
          count(DISTINCT CASE WHEN try_cast(rebufferCount AS bigint)>0 THEN concat(_batchKey, ':', _batchIndex) END) AS rebufferSessionCount,
          sum(try_cast(rebufferMs AS bigint)) AS rebufferMs,
          sum(try_cast(effectivePlaybackMs AS bigint)) AS effectivePlaybackMs,
          sum(try_cast(seekCount AS bigint)) AS seekCount,
          sum(try_cast(seekFailureCount AS bigint)) AS seekFailureCount,
          histogram(try_cast(seekCommandMaxMs AS double),array[0,25,50,100,250,500,1000,2000,5000]) AS seekCommandHistogram,
          histogram(try_cast(seekSettleMaxMs AS double),array[0,25,50,100,250,500,1000,2000,5000]) AS seekSettleHistogram,
          sum(try_cast(droppedFrames AS bigint)) AS droppedFrames,
          sum(try_cast(processedVideoFrames AS bigint)) AS processedVideoFrames,
          sum(try_cast(audioUnderrunCount AS bigint)) AS audioUnderrunCount,
          count(DISTINCT CASE WHEN result<>'success' THEN concat(_batchKey, ':', _batchIndex) END) AS terminalFailureCount,
          count(DISTINCT CASE WHEN durationMismatch='true' THEN concat(_batchKey, ':', _batchIndex) END) AS durationMismatchCount,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,devicePlatform,networkClass,playbackMode,result,rendererMode,decoderQueueMode,decoderFallbackEnabled,seekEvidenceSource
      - name: app-product-telemetry-rtc-qoe-hourly
        rowKind: rtc_qoe
        sql: >-
          eventType:rtc_media_qoe | SELECT
          'rtc_qoe' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          callType,result,mediaConnected,networkQuality,disconnectReason,failReasonCode,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          histogram(try_cast(connectTimeMs AS double),array[0,250,500,1000,2000,3000,5000,8000,10000,30000]) AS connectTimeHistogram,
          sum(try_cast(reconnectCount AS bigint)) AS reconnectCount,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,callType,result,mediaConnected,networkQuality,disconnectReason,failReasonCode
      - name: app-product-telemetry-errors-hourly
        rowKind: error_dimensions
        sql: >-
          logType:error | SELECT 'error_dimensions' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          errorCode,operationId,httpStatus,pageName,appVersion,deviceManufacturer,deviceModel,
          networkClass,count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,errorCode,operationId,httpStatus,
          pageName,appVersion,deviceManufacturer,deviceModel,networkClass
      - name: runtime-diagnostics-fingerprint-hourly
        rowKind: runtime_diagnostics
        source: runtime-diagnostics-raw
        sql: >-
          * | SELECT 'runtime_diagnostics' AS rowKind,
          date_trunc('hour', from_iso8601_timestamp(occurredAt)) AS businessHour,
          cast(to_unixtime(date_trunc('hour', from_iso8601_timestamp(occurredAt))) AS bigint) AS __time__,
          logKind,severity,signal,errorCode,fingerprint,resourceSourceType,resourceService,
          resourceAppVersion,resourceServiceVersion,resourceEnvironment,
          count(DISTINCT concat(_batchKey, ':', _batchIndex)) AS count,
          'closed_hour' AS freshness,
          max(ingestedAt) AS generatedThrough,
          unix_timestamp(current_timestamp) - max(to_unixtime(from_iso8601_timestamp(ingestedAt))) AS lagSeconds
          GROUP BY businessHour,logKind,severity,signal,errorCode,fingerprint,resourceSourceType,
          resourceService,resourceAppVersion,resourceServiceVersion,resourceEnvironment
  ram:
    productOpsActions:
      - log:PostLogStoreLogs
      - log:GetLogs
      - log:GetHistograms
    scheduledSqlActions:
      - log:GetLogs
      - log:PostLogStoreLogs
    resourceScope: targetProjectAndListedLogstoresOnly
  alerts:
    - name: product-startup-content-p95-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:app_startup | SELECT
        approx_percentile(try_cast(tClickToContentMs AS double), 0.95) AS p95Ms
      condition: p95Ms > 3000
      severity: warning
    - name: product-startup-error-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:app_startup | SELECT
        sum(CASE WHEN hasError='true' THEN 1 ELSE 0 END) / (count(*) + 0.001) AS errorRate
      condition: errorRate > 0.001
      severity: critical
    - name: product-video-ready-p95-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:video_playback_qoe | SELECT count(*) AS sampleCount,
        approx_percentile(try_cast(readyMs AS double), 0.95) AS p95Ms
      condition: sampleCount >= 100 AND p95Ms > 3000
      severity: warning
    - name: product-video-rebuffer-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:video_playback_qoe | SELECT count(*) AS sampleCount,
        sum(CASE WHEN try_cast(rebufferCount AS bigint) > 0 THEN 1 ELSE 0 END)
        / (count(*) + 0.001) AS rebufferRate
      condition: sampleCount >= 100 AND rebufferRate > 0.05
      severity: warning
    - name: product-video-duration-mismatch-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:video_playback_qoe | SELECT count(*) AS sampleCount,
        sum(CASE WHEN durationMismatch='true' THEN 1 ELSE 0 END)
        / (count(*) + 0.001) AS mismatchRate
      condition: sampleCount >= 100 AND mismatchRate > 0.01
      severity: warning
    - name: product-video-seek-command-failure-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:video_playback_qoe | SELECT
        sum(try_cast(seekCount AS bigint)) AS seekCount,
        sum(try_cast(seekFailureCount AS bigint)) / (sum(try_cast(seekCount AS bigint)) + 0.001) AS failureRate
      condition: seekCount >= 100 AND failureRate >= 0.005
      severity: warning
    - name: product-video-dropped-frame-ratio-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:video_playback_qoe | SELECT
        count(*) AS sampleCount,
        sum(try_cast(processedVideoFrames AS bigint)) AS processedFrames,
        sum(try_cast(droppedFrames AS bigint))
        / (sum(try_cast(processedVideoFrames AS bigint)) + 0.001) AS droppedFrameRatio
      condition: sampleCount >= 100 AND processedFrames >= 1000 AND droppedFrameRatio >= 0.01
      severity: warning
    - name: product-video-audio-underrun-detected
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:video_playback_qoe | SELECT count(*) AS sampleCount,
        sum(try_cast(audioUnderrunCount AS bigint)) AS audioUnderrunCount
      condition: sampleCount >= 100 AND audioUnderrunCount > 0
      severity: warning
    - name: product-rtc-media-connect-rate-low
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:rtc_media_qoe | SELECT
        sum(CASE WHEN result<>'abandoned' THEN 1 ELSE 0 END) AS sampleCount,
        sum(CASE WHEN result<>'abandoned' AND mediaConnected='true' THEN 1 ELSE 0 END)
        / (sum(CASE WHEN result<>'abandoned' THEN 1 ELSE 0 END) + 0.001) AS connectRate
      condition: sampleCount >= 50 AND connectRate < 0.98
      severity: critical
    - name: product-rtc-media-connect-p95-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:rtc_media_qoe AND mediaConnected:true | SELECT count(*) AS sampleCount,
        approx_percentile(try_cast(connectTimeMs AS double), 0.95) AS p95Ms
      condition: sampleCount >= 50 AND p95Ms > 3000
      severity: warning
    - name: product-rtc-unexpected-disconnect-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:rtc_media_qoe AND mediaConnected:true | SELECT count(*) AS sampleCount,
        sum(CASE WHEN result='connection_lost' THEN 1 ELSE 0 END)
        / (count(*) + 0.001) AS disconnectRate
      condition: sampleCount >= 50 AND disconnectRate > 0.02
      severity: critical
    - name: product-content-share-action-failure-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:product_action AND journey:content_share | SELECT
        count(*) AS sampleCount,
        sum(CASE WHEN result='failure' THEN 1 ELSE 0 END)
        / (count(*) + 0.001) AS failureRate
      condition: sampleCount >= 20 AND failureRate > 0.05
      severity: warning
    - name: product-content-report-action-failure-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:product_action AND journey:content_report | SELECT
        count(*) AS sampleCount,
        sum(CASE WHEN result='failure' THEN 1 ELSE 0 END)
        / (count(*) + 0.001) AS failureRate
      condition: sampleCount >= 20 AND failureRate > 0.05
      severity: warning
    - name: product-article-reader-enter-p95-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:article_reader_enter AND result:success | SELECT
        count(*) AS sampleCount,
        approx_percentile(try_cast(durationMs AS double), 0.95) AS p95Ms
      condition: sampleCount >= 100 AND p95Ms > 1200
      severity: warning
    - name: product-article-reader-error-rate-high
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        (eventType:article_reader_enter OR eventType:article_reader_error) | SELECT
        sum(CASE WHEN eventType='article_reader_enter' AND result='success' THEN 1 ELSE 0 END)
          AS enterCount,
        sum(CASE WHEN eventType='article_reader_error' AND result='failure' THEN 1 ELSE 0 END)
          / (sum(CASE WHEN eventType='article_reader_enter' AND result='success' THEN 1 ELSE 0 END)
          + 0.001) AS errorRate
      condition: enterCount >= 100 AND errorRate > 0.01
      severity: warning
    - name: product-article-reader-recovery-failure
      signal: scheduledSqlQuery
      source: app-product-telemetry-raw
      query: >-
        eventType:article_reader_recovery AND result:failure | SELECT
        count(*) AS recoveryFailureCount
      condition: recoveryFailureCount > 0
      severity: warning
