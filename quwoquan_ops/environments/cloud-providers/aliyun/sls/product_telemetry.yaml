        (eventType:search_query_submit OR eventType:search_result_click OR
        eventType:search_result_dwell) | SELECT
        count(DISTINCT CASE WHEN eventType='search_query_submit' THEN requestId END) AS submitCount,
        count(DISTINCT CASE WHEN eventType='search_result_click'
          OR (eventType='search_result_dwell' AND try_cast(durationMs AS bigint)>=3000)
          THEN requestId END)
        / (count(DISTINCT CASE WHEN eventType='search_query_submit' THEN requestId END) + 0.001)
        AS effectiveSuccessRate
      condition: submitCount >= 100 AND effectiveSuccessRate < 0.35
