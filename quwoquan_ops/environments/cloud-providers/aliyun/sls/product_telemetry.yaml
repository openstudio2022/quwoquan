        (eventType:search_result_impression OR eventType:search_result_click OR
        eventType:search_result_dwell) | SELECT
        count(DISTINCT CASE WHEN eventType='search_result_impression' THEN requestId END) AS resultCount,
        count(DISTINCT CASE WHEN eventType='search_result_click'
