schema: prod-plane-access-isolation
description: >
  prod-hosted 远端唯一托管目标的「访问隔离层」单一真相源（去 root · 四平面）。
  本文件只描述「谁（Linux service 账号）用哪份凭据、登录到哪条固定路径、操作哪个运行时平面、在哪些 rollout stage 生效」，
  不重新定义平面、不重新定义 workload、不存任何凭据明文。
  - 运行时平面真相源：quwoquan_ops/environments/environment_topology_manifest.yaml（subnets: edge/media/service/data）。
  - workload 归属真相源：quwoquan_ops/environments/workload_topology_inventory.yaml（planes: application/edge-media 的部署形态）。
  - domain↔control-plane 真相源：quwoquan_ops/environments/process_domain_plane_mapping.yaml。
  本层把上述运行时四平面映射到 prod ECS 上的最小权限 Linux service 账号，远端唯一托管目标为 prod-hosted（backend=ssh-hosted）。
  成本约束保留项：gray-initial 与 full 共享同一物理 ECS/集群；隔离强度为「账号 + rollout stage + compose 项目命名空间」级逻辑隔离，非物理隔离。

# 远端唯一托管目标：取消远端 gamma 后，只有 prod-hosted 一个远端访问面。
target: prod-hosted

# 非 root 中转/bootstrap 账号：仅用于 SSH 登录、按平面分发凭据、触发受限发布命令；无日常 root。
relayAccount:
  name: prod-ops
  home: /home/prod-ops
  sshKeySecret: PROD_OPS_SSH_KEY
  bootstrapPath: /home/prod-ops/bootstrap
  sudoScope: "仅限 bootstrap_prod_plane_accounts.sh 中枚举的 useradd/loginctl enable-linger，不授予通用 root"
  notes: 只在一次性 bootstrap 与凭据分发时使用；日常发布由各平面账号自登录完成。

# rollout stage 维度（对齐 stackctl up --rollout-mode 与 prod rolloutStagePolicy）。
# gray-initial：取同集群一个实例验证，承接原远端 gamma 的真实远端集成验证职责。
rolloutStages: [gray-initial, carry-on, full]

# 四平面 × 账号 × 固定路径 × 凭据 × 治理 workload（单一映射，禁止第二套）。
planes:
  - plane: edge
    account: prod-edge-svc
    home: /home/prod-edge-svc
    composeProjectRoot: /home/prod-edge-svc/stack
    credentialsPath: /home/prod-edge-svc/credentials
    sshKeySecret: PROD_EDGE_SSH_KEY
    access: read-write
    runtimeContainer: rootless-podman
    workloadDeployPlane: edge-media
    governedWorkloads: [realtime-gateway, rtc-service]
    rootlessGovernedComposeServices: []
    rootlessSupportComposeServices: []
    appliesToStages: [gray-initial, carry-on, full]
    summary: 实时长连接/信令面（WebSocket、信令），各自独立 compose 项目，仅操作本平面工作负载。

  - plane: media
    account: prod-media-svc
    home: /home/prod-media-svc
    composeProjectRoot: /home/prod-media-svc/stack
    credentialsPath: /home/prod-media-svc/credentials
    sshKeySecret: PROD_MEDIA_SSH_KEY
    access: read-write
    runtimeContainer: rootless-podman
    workloadDeployPlane: edge-media
    governedWorkloads: [livekit-sfu, coturn]
    rootlessGovernedComposeServices: []
    rootlessSupportComposeServices: []
    appliesToStages: [gray-initial, carry-on, full]
    summary: 媒体转发面（SFU/TURN，UDP），独立 compose 项目，仅操作本平面工作负载。

  - plane: service
    account: prod-service-svc
    home: /home/prod-service-svc
    composeProjectRoot: /home/prod-service-svc/stack
    credentialsPath: /home/prod-service-svc/credentials
    sshKeySecret: PROD_SERVICE_SSH_KEY
    access: read-write
    runtimeContainer: rootless-podman
    workloadDeployPlane: application
    governedWorkloads:
      - seed-box
      - recommendation-service
      - product-ops-service
    rootlessComposeTemplate: quwoquan_ops/environments/compose/docker-compose.gamma-local.yaml
    rootlessGovernedComposeServices:
      - rec-model-service
      - content-service
      - chat-service
      - user-service
      - assistant-service
      - product-ops-service
      - tag-service
      - entity-service
    rootlessSupportComposeServices:
      - gamma-proxy
    rootlessConfigServices:
      - recommendation-service
      - content-service
      - chat-service
      - user-service
      - assistant-service
      - product-ops-service
      - tag-service
      - entity-service
    rootlessRuntimeLayout:
      composeFile: docker-compose.prod-hosted.yaml
      envFile: stack.env
      configRoot: runtime/config-root
      caddyfile: runtime/Caddyfile
      mediaStateRef: process/volumes/media
      modelCacheRoot: runtime/model-cache
    appliesToStages: [gray-initial, carry-on, full]
    summary: >
      当前 prod-hosted 首波 rootless 接管按 onebox split-services 真实运行面落地：
      governed compose services = rec-model/content/chat/user/assistant/product-ops/tag/entity，
      support compose services = gamma-proxy；数据面继续复用现有 host 上的 19400/19410/19420 服务，不在 service plane 内复制一套空 DB。
      媒体面只消费 prod-hosted 自有持久卷；禁止复用 gamma-local 输出或把可清理 runtime 目录当作媒体真相源。

  - plane: data
    account: prod-data-svc
    home: /home/prod-data-svc
    composeProjectRoot: null
    credentialsPath: /home/prod-data-svc/credentials
    sshKeySecret: PROD_DATA_SSH_KEY
    access: read-only-audit
    runtimeContainer: none
    workloadDeployPlane: null
    governedWorkloads: []
    appliesToStages: []
    summary: >
      默认只读审计账号；workload_topology_inventory 当前无 wired data-plane workload，
      不授予写权限、不纳入 deploy rollout，仅用于审计/巡检只读访问。

# 不变量（供 verify 脚本断言，保证单一解释、最小权限、与四环境一致）。
invariants:
  - 每个平面有且仅有一个账号；账号名必须为 prod-<plane>-svc。
  - 每个读写平面必须声明 composeProjectRoot 与非空 governedWorkloads；data 平面必须只读且 governedWorkloads 为空。
  - 每个平面 sshKeySecret 唯一，命名 PROD_<PLANE>_SSH_KEY；relay 为 PROD_OPS_SSH_KEY；禁止复用单一全权 secret。
  - planes 的 plane 集合必须等于 environment_topology_manifest subnets 的四平面 edge/media/service/data。
  - 每个 governedWorkloads 条目必须存在于 workload_topology_inventory.workloads，且其 inventory plane 必须落在本平面 workloadDeployPlane。
  - 已退役：PROD_KUBECONFIG 单一全权凭据、远端 gamma 目标。远端访问面只有 prod-hosted。
