{
  "schema": "environment-runtime",
  "environment": "prod",
  "dataReleaseTarget": "prod-hosted",
  "urlRoles": {
    "api": {"exposure": "public", "scheme": "https", "host": "api.quwoquan.com", "portRole": null, "pathBase": "/", "tlsProfile": "public-ca-prod", "consumers": ["app.gateway", "data.release-verifier", "ops.health"]},
    "realtime": {"exposure": "public", "scheme": "wss", "host": "api.quwoquan.com", "portRole": null, "pathBase": "/", "tlsProfile": "public-ca-prod", "consumers": ["app.realtime", "ops.health"]},
    "rtc": {"exposure": "public", "scheme": "wss", "host": "rtc.quwoquan.com", "portRole": null, "pathBase": "/", "tlsProfile": "public-ca-prod", "consumers": ["app.rtc", "ops.health"]},
    "productOps": {"exposure": "public", "scheme": "https", "host": "ops.quwoquan.com", "portRole": null, "pathBase": "/", "tlsProfile": "public-ca-prod", "consumers": ["app.recovery", "ops.release"]},
    "publicWeb": {"exposure": "public", "scheme": "https", "host": "quwoquan.com", "portRole": null, "pathBase": "/", "tlsProfile": "public-ca-prod", "consumers": ["app.public-links", "web.release", "native.app-links"]},
    "appDownload": {"exposure": "public", "scheme": "https", "host": "cdn.quwoquan.com", "portRole": null, "pathBase": "/download", "tlsProfile": "public-ca-prod", "consumers": ["app.recovery", "web.download"]},
    "legal": {"exposure": "public", "scheme": "https", "host": "quwoquan.com", "portRole": null, "pathBase": "/legal", "tlsProfile": "public-ca-prod", "consumers": ["app.legal", "web.legal"]},
    "mediaAvatar": {"exposure": "public", "scheme": "https", "host": "cdn.quwoquan.com", "portRole": null, "pathBase": "/media/avatar", "tlsProfile": "public-ca-prod", "consumers": ["app.media", "data.release", "service.chat"]},
    "mediaImage": {"exposure": "public", "scheme": "https", "host": "cdn.quwoquan.com", "portRole": null, "pathBase": "/media/image", "tlsProfile": "public-ca-prod", "consumers": ["app.media", "data.release", "service.content"]},
    "mediaVideo": {"exposure": "public", "scheme": "https", "host": "cdn.quwoquan.com", "portRole": null, "pathBase": "/media/video", "tlsProfile": "public-ca-prod", "consumers": ["app.media", "data.release", "service.content"]},
    "mediaUpload": {"exposure": "public", "scheme": "https", "host": "upload.quwoquan.com", "portRole": null, "pathBase": "/", "tlsProfile": "public-ca-prod", "consumers": ["app.media-upload", "service.upload-issuer"]}
  },
  "subnets": {
    "edge": "10.60.10.0/24",
    "media": "10.60.20.0/24",
    "service": "10.60.30.0/24",
    "data": "10.60.40.0/24"
  },
  "serviceAliases": {
    "edge": "prod-edge",
    "media": "prod-media",
    "service": "prod-service",
    "data": "prod-data"
  },
  "artifactPolicy": {
    "app": {
      "runtimeEnv": "prod",
      "allowSeeds": false,
      "allowLocalHosts": false,
      "allowProdHosts": true,
      "distribution": "store-release"
    },
    "service": {
      "allowFixtureRefs": false,
      "allowReleaseSnapshot": true,
      "secretScope": "prod",
      "distribution": "store-release"
    }
  },
  "rolloutStagePolicy": {
    "mode": "prod-rollout",
    "allowedStages": [
      "gray-initial",
      "carry-on",
      "full"
    ]
  },
  "targets": {
    "prod-sim": {
      "env": "prod",
      "backend": "local",
      "localResourceGroup": "workstation-commercial-runtime",
      "portProfile": "prod-sim",
      "baseRoleSet": "environment",
      "urlOverrides": {
        "api": {"host": "api.sim.quwoquan.com", "portRole": "api-edge", "tlsProfile": "acme-dns01-sim"},
        "realtime": {"host": "api.sim.quwoquan.com", "portRole": "api-edge", "tlsProfile": "acme-dns01-sim"},
        "rtc": {"host": "rtc.sim.quwoquan.com", "portRole": "api-edge", "tlsProfile": "acme-dns01-sim"},
        "productOps": {"host": "ops.sim.quwoquan.com", "portRole": "product-ops-edge", "tlsProfile": "acme-dns01-sim"},
        "publicWeb": {"host": "sim.quwoquan.com", "portRole": "api-edge", "tlsProfile": "acme-dns01-sim"},
        "appDownload": {"host": "cdn.sim.quwoquan.com", "portRole": "media-edge", "tlsProfile": "acme-dns01-sim"},
        "legal": {"host": "sim.quwoquan.com", "portRole": "api-edge", "tlsProfile": "acme-dns01-sim"},
        "mediaAvatar": {"host": "cdn.sim.quwoquan.com", "portRole": "media-edge", "tlsProfile": "acme-dns01-sim"},
        "mediaImage": {"host": "cdn.sim.quwoquan.com", "portRole": "media-edge", "tlsProfile": "acme-dns01-sim"},
        "mediaVideo": {"host": "cdn.sim.quwoquan.com", "portRole": "media-edge", "tlsProfile": "acme-dns01-sim"},
        "mediaUpload": {"host": "upload.sim.quwoquan.com", "portRole": "media-edge", "tlsProfile": "acme-dns01-sim"}
      },
      "origins": {
        "mediaOrigin": "http://127.0.0.1:20110",
        "contentService": "http://127.0.0.1:20220"
      },
      "playbackCanary": {
        "source": "published-release",
        "workIdEnv": "VIDEO_PLAYBACK_CANARY_WORK_ID",
        "publicSliceKeyEnv": "VIDEO_PLAYBACK_CANARY_PUBLIC_SLICE_KEY"
      }
    },
    "prod-hosted": {
      "env": "prod",
      "backend": "ssh-hosted",
      "portProfile": null,
      "baseRoleSet": "environment",
      "sharedClusterNote": "gray-initial and full share the same physical cluster because of current cost constraints; gamma is local-only and has no remote target",
      "playbackCanary": {
        "source": "published-release",
        "workIdEnv": "VIDEO_PLAYBACK_CANARY_WORK_ID",
        "publicSliceKeyEnv": "VIDEO_PLAYBACK_CANARY_PUBLIC_SLICE_KEY"
      },
      "dataRelease": {
        "mode": "hosted-import",
        "mongoUriEnv": "QWQ_PROD_DATA_RELEASE_MONGO_URI",
        "userPostgresDsnEnv": "QWQ_PROD_DATA_RELEASE_USER_POSTGRES_DSN",
        "mediaRootEnv": "QWQ_PROD_DATA_RELEASE_MEDIA_ROOT"
      }
    }
  }
}
