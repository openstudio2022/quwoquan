# prod 灰度阶段配置（可扩展）
# 供 deploy-prod-auto / deploy-prod-gray workflow 与 platform-ops-service 读取。
#
# 单一真相源边界（防止第二套数）：
# - 本文件只声明 stage 名称、step、独立执行目标与 rollback_on_slo_gate；
# - SLO 阈值 / readback 窗口 / 最小样本唯一来源是
#   quwoquan_ops/policies/config-release/slo_thresholds.yaml（readback 段）；
# - 阶段审批由 GitHub `environment: production` required reviewers 承担，
#   不在本文件重复声明 approval 字段。
#
# gray-initial、carry-on、full 均属于 prod rollout stage，
# 差别仅在本 stages；不得引入 prod-gray 第二环境。
#
# gray-initial / carry-on 只更新独立 gray compose，并由稳定 Caddy 按
# routing_policy.stageDimensions 导入真实流量；full 才替换 prod compose。
stages:
  - name: gray-initial
    step: 5
    execution_target: gray
    routing_profile: gray-initial
    rollback_on_slo_gate: true
  - name: carry-on
    step: 25
    execution_target: gray
    routing_profile: carry-on
    rollback_on_slo_gate: true
  - name: full
    step: 100
    execution_target: prod
    routing_profile: full
    rollback_on_slo_gate: true
