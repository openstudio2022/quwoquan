# prod 生产灰度阶段。它们是 prod rollout stage，不是独立环境。
# SLO 绝对阈值继续由 policies/config-release/slo_thresholds.yaml 唯一声明。
stages:
  - name: canary
    step: 0
    basis_points: 0
    execution_target: candidate
    routing_profile: canary
    rollback_on_slo_gate: true
  - name: "5"
    step: 5
    basis_points: 500
    execution_target: candidate
    routing_profile: "5"
    rollback_on_slo_gate: true
  - name: "20"
    step: 20
    basis_points: 2000
    execution_target: candidate
    routing_profile: "20"
    rollback_on_slo_gate: true
  - name: "50"
    step: 50
    basis_points: 5000
    execution_target: candidate
    routing_profile: "50"
    rollback_on_slo_gate: true
  - name: "100"
    step: 100
    basis_points: 10000
    execution_target: stable
    routing_profile: "100"
    rollback_on_slo_gate: true
