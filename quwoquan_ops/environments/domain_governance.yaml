{
  "schema": "quwoquan.domain-governance",
  "registrableDomain": "quwoquan.com",
  "endpointRegistry": [
    {
      "name": "public-api",
      "role": "api",
      "classification": "first-party-api",
      "owner": "platform-runtime",
      "exposure": "public",
      "consumers": ["app", "web", "ops", "ci"]
    },
    {
      "name": "realtime-signaling",
      "role": "realtime",
      "classification": "first-party-websocket",
      "owner": "realtime",
      "exposure": "public",
      "consumers": ["app", "web", "ci"]
    },
    {
      "name": "rtc-signaling",
      "role": "rtc",
      "classification": "first-party-websocket",
      "owner": "rtc",
      "exposure": "public",
      "consumers": ["app", "ci"]
    },
    {
      "name": "product-ops",
      "role": "productOps",
      "classification": "first-party-ops-api",
      "owner": "product-ops",
      "exposure": "public",
      "consumers": ["ops-portal", "ci"]
    },
    {
      "name": "public-web",
      "role": "publicWeb",
      "classification": "first-party-web",
      "owner": "app-web",
      "exposure": "public",
      "consumers": ["browser", "share-links", "oauth"]
    },
    {
      "name": "app-download",
      "role": "appDownload",
      "classification": "first-party-distribution",
      "owner": "app-release",
      "exposure": "public",
      "consumers": ["browser", "release-ci"]
    },
    {
      "name": "legal",
      "role": "legal",
      "classification": "first-party-legal",
      "owner": "legal-static",
      "exposure": "public",
      "consumers": ["app", "browser", "ci"]
    },
    {
      "name": "media-avatar",
      "role": "mediaAvatar",
      "classification": "first-party-media-read",
      "owner": "media-delivery",
      "exposure": "public",
      "consumers": ["app", "web", "chat"]
    },
    {
      "name": "media-image",
      "role": "mediaImage",
      "classification": "first-party-media-read",
      "owner": "media-delivery",
      "exposure": "public",
      "consumers": ["app", "web", "data-release"]
    },
    {
      "name": "media-video",
      "role": "mediaVideo",
      "classification": "first-party-media-read",
      "owner": "media-delivery",
      "exposure": "public",
      "consumers": ["app", "web", "data-release"]
    },
    {
      "name": "media-upload",
      "role": "mediaUpload",
      "classification": "first-party-media-write",
      "owner": "media-delivery",
      "exposure": "public",
      "consumers": ["app", "web", "ci"]
    }
  ],
  "urlClassRegistry": [
    {
      "classification": "derived-deep-link",
      "owner": "app-navigation",
      "source": "publicWeb role plus route metadata",
      "baseRole": "publicWeb",
      "consumers": ["android-app-links", "ios-universal-links", "share-links"]
    },
    {
      "classification": "oauth-callback",
      "owner": "identity-integrations",
      "source": "publicWeb role plus provider callback metadata",
      "baseRole": "publicWeb",
      "consumers": ["wechat", "commercial-auth", "web"]
    },
    {
      "classification": "east-west-upstream",
      "owner": "service-runtime",
      "source": "environment workload serviceDiscovery and environment config",
      "baseRole": "",
      "consumers": ["service-to-service", "data-importers", "ops"]
    },
    {
      "classification": "third-party",
      "owner": "provider-governance",
      "source": "service contracts external_bindings.yaml",
      "baseRole": "",
      "consumers": ["service-adapters", "app-native-provider-bridges"]
    },
    {
      "classification": "test-only",
      "owner": "test-runtime",
      "source": "runner arguments projected from topology or reserved .invalid fixtures",
      "baseRole": "",
      "consumers": ["local-contract", "api-integration", "user-acceptance"]
    }
  ],
  "derivedLinkOwnership": {
    "originRole": "publicWeb",
    "pathSource": "quwoquan_service/contracts/metadata/_shared/link_templates.yaml",
    "serviceProjection": "quwoquan_service/generated/linktemplates/link_templates.g.go",
    "consumers": ["app-navigation", "user-profile-qr", "data-release"]
  },
  "dnsProvider": {
    "kind": "cloudflare",
    "apiTokenEnv": "QWQ_DNS_PROVISIONING_API_TOKEN",
    "zoneIdEnv": "QWQ_DNS_ZONE_ID"
  },
  "nonProdAddress": "127.0.0.1",
  "nonProdIpv6Address": "::1",
  "acmeChallengeAuthority": {
    "mode": "scoped-dns-api-token",
    "apiTokenEnv": "QWQ_ACME_DNS_API_TOKEN",
    "requiredNamePrefix": "_acme-challenge",
    "forbidProductionZoneMutation": true
  },
  "nonProdMailGuard": {
    "nullMx": ".",
    "spf": "v=spf1 -all"
  },
  "caa": [
    {"flags": 0, "tag": "issue", "value": "letsencrypt.org"},
    {"flags": 0, "tag": "issuewild", "value": "letsencrypt.org"},
    {"flags": 0, "tag": "iodef", "value": "mailto:security@quwoquan.com"}
  ],
  "tlsProfiles": {
    "local-managed": {
      "kind": "local-managed",
      "targets": ["alpha-local", "beta-local", "gamma-local"],
      "renewBeforeDays": 14,
      "certificateDays": 90
    },
    "acme-dns01-sim": {
      "kind": "dns-01-public-ca",
      "target": "prod-sim",
      "apex": "sim.quwoquan.com",
      "wildcard": "*.sim.quwoquan.com"
    }
  },
  "acme": {
    "client": "lego",
    "dnsProvider": "cloudflare",
    "accountEmailEnv": "QWQ_ACME_ACCOUNT_EMAIL",
    "directory": "https://acme-v02.api.letsencrypt.org/directory",
    "renewBeforeDays": 30
  }
}
