# 手写 PromQL overlay 登记表（唯一真相源：本文件 + 告警树实时扫描）
#
# `quwoquan_ops/observability/monitoring/alerts/` 下的告警分两类：
#
# * ContractGraph 派生：`<domain>_contract/*.yaml`、`contract_object_coverage.yaml`、
#   `contract_pending_commercial_coverage.yaml`。由 codegen 生成并做字节级漂移检测。
# * overlay：本文件登记的手写规则。每一条都必须写明「ContractGraph 为什么无法表达这个口径」。
#
# 新增一条手写 PromQL 而不在此登记，`verify_contract_alert_overlay.py` 立刻 BLOCK；
# 反过来，一条规则如果被判定为可派生（P95 延迟 / 5xx 比率 + selector 能解析到 ContractGraph
# operation），也 BLOCK，必须迁进 codegen 而不是在这里登记理由。
#
# 这不是 allowlist：reason 是封闭枚举，且判定完全由 ContractGraph 现场推导，
# 契约一旦补齐相应声明（例如给某个 operation 加上限流 SLO 维度），对应条目会立即变成
# 「可派生残留」并阻断，逼迫迁移。
schema: alert-overlay
rules:
  - file: quwoquan_ops/observability/monitoring/alerts/content_report_lifecycle.yaml
    group: quwoquan_content_report_lifecycle
    rule: content_report_valid_create_rate
    reason: status_class_not_in_contract_slo
    justification: "status matcher =~\"2..\" 不在契约 slo.availabilityPercent 的 5xx 口径内；ContractGraph 的 slo 只有 availabilityPercent（5xx 错误预算）与 latencyP95Milliseconds 两个维度。"
  - file: quwoquan_ops/observability/monitoring/alerts/content_report_lifecycle.yaml
    group: quwoquan_content_report_lifecycle
    rule: content_report_closure_within_72h_rate
    reason: first_party_series_not_contract_operation
    justification: "消费 ['content_report_closure_slo_total']：第一方服务自注册的运行时/业务 series，不是 HTTP operation 的 http_server_* 观测面，ContractGraph 未为其声明 telemetry/slo。"
  - file: quwoquan_ops/observability/monitoring/alerts/content_report_lifecycle.yaml
    group: quwoquan_content_report_lifecycle
    rule: content_feed_blocked_keyword_filter_rate
    reason: first_party_series_not_contract_operation
    justification: "消费 ['content_feed_blocked_keyword_candidates_total', 'content_feed_blocked_keyword_filtered_total']：第一方服务自注册的运行时/业务 series，不是 HTTP operation 的 http_server_* 观测面，ContractGraph 未为其声明 telemetry/slo。"
