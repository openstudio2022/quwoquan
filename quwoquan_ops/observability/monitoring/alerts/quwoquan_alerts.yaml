# L1 — ClientAPILatencyHigh（占位，非 Prom 直采）
# 端侧 API 延迟来自 AppLog → OpsEvent（参见 L1 大盘 histogram app_api_latency_ms / ops pipeline），
# 不在此文件用 expr 实现 stable 阈值告警。生产建议：在日志平台（Loki / Elasticsearch）对 api_latency
# 或结构化 OpsEvent 做 log-based alerting，或将聚合写入 Prometheus recording rule 后再挂 Alertmanager。

groups:
  - name: quwoquan_l2_auth_login
    rules:
      - alert: AuthProviderErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="user-service", route=~"/v1/auth/(authorization/alipay|login/(wechat|alipay|qq|one-tap.*))", status!~"2.."}[5m])) by (route)
          / (sum(rate(http_server_requests_total{service="user-service", route=~"/v1/auth/(authorization/alipay|login/(wechat|alipay|qq|one-tap.*))"}[5m])) by (route) + 0.001) > 0.02
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: user-auth
        annotations:
          summary: "登录 Provider {{ $labels.route }} 错误率连续两个窗口 > 2%"
          description: "当前非 2xx 比率 {{ $value | humanizePercentage }}。立即验证该 provider 降级、短信验证码恢复入口与配置回滚。"

      - alert: AuthChallengeLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_duration_seconds_bucket{service="user-service", route=~"/v1/auth/(otp/send|authorization/alipay|login/one-tap/hint)"}[5m])) by (le, route)
          ) > 1.2
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "登录挑战路由 {{ $labels.route }} P95 连续两个窗口 > 1.2s"
          description: "当前 P95 = {{ $value | humanizeDuration }}，超出 SendOtp/提示契约 SLO。"

      - alert: AuthLoginLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_duration_seconds_bucket{service="user-service", route=~"/v1/auth/login/(phone|wechat|alipay|qq|one-tap)"}[5m])) by (le, route)
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "登录路由 {{ $labels.route }} P95 连续两个窗口 > 1.5s"
          description: "当前 P95 = {{ $value | humanizeDuration }}，超出登录契约 SLO；优先验证 provider 降级和短信恢复路径。"

  - name: quwoquan_l2_mq
    rules:
      - alert: MQConsumeLagHigh
        expr: sum(rate(mq_publish_total[5m])) by (topic) - sum(rate(mq_consume_total[5m])) by (topic) > 100
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "MQ consume lag high for topic {{ $labels.topic }}"
          description: "Publish rate exceeds consume rate by {{ $value }} msg/s"

  - name: quwoquan_l1_ops_pipeline
    rules:
      - alert: OpsEventUploadDrop
        expr: sum(rate(http_server_requests_total{route=~".*(/v1/ops/events|/api/v1/ops/events).*",method="POST"}[10m])) < 0.1
        for: 15m
        labels:
          severity: warning
          layer: l1
        annotations:
          summary: "OpsEvent upload rate dropped to near-zero"
          description: "Client app_log uploads have stopped, indicating AppLogUploader or OpsEvent pipeline failure"

  - name: quwoquan_l1_startup_welcome
    # startup_welcome_sequence 由 App Analytics/AppLog 上传并投影为 OpsEvent labels/metrics。
    rules:
      - alert: StartupWelcomeReplay1RateHigh
        expr: |
          sum(rate(ops_events_total{event_name="startup_welcome_sequence",phase="finished",replay_count=~"1|2"}[10m]))
          / (sum(rate(ops_events_total{event_name="startup_welcome_sequence",phase="finished"}[10m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: startup
        annotations:
          summary: "启动欢迎 replay 1 比例 > 5%"

      - alert: StartupWelcomeReplay2RateHigh
        expr: |
          sum(rate(ops_events_total{event_name="startup_welcome_sequence",phase="finished",replay_count="2"}[10m]))
          / (sum(rate(ops_events_total{event_name="startup_welcome_sequence",phase="finished"}[10m])) + 0.001) > 0.005
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: startup
        annotations:
          summary: "启动欢迎 replay 2 比例 > 0.5%"

      - alert: StartupWelcomeDegradedRateHigh
        expr: |
          sum(rate(ops_events_total{event_name="startup_welcome_sequence",phase="finished",exit_reason=~"degraded|deadline"}[10m]))
          / (sum(rate(ops_events_total{event_name="startup_welcome_sequence",phase="finished"}[10m])) + 0.001) > 0.001
        for: 5m
        labels:
          severity: critical
          layer: l1
          domain: startup
        annotations:
          summary: "启动降级或 deadline 比例 > 0.1%"

      - alert: StartupWelcomeExitOverDeadline
        expr: |
          sum(rate(ops_event_metrics_count{event_name="startup_welcome_sequence",metric="welcomeExitMs"}[5m]))
          - sum(rate(ops_event_metrics_bucket{event_name="startup_welcome_sequence",metric="welcomeExitMs",le="6000"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          layer: l1
          domain: startup
        annotations:
          summary: "发现 welcomeExitMs > 6000 的启动"

      - alert: StartupWelcomeOverlayRemovalOverDeadline
        expr: |
          sum(rate(ops_event_metrics_count{event_name="startup_welcome_sequence",metric="overlayRemovedMs"}[5m]))
          - sum(rate(ops_event_metrics_bucket{event_name="startup_welcome_sequence",metric="overlayRemovedMs",le="6000"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          layer: l1
          domain: startup
        annotations:
          summary: "发现 overlayRemovedMs > 6000 的启动"

      - alert: StartupWelcomeConsecutiveSlowFrames
        expr: |
          sum(rate(ops_events_total{event_name="startup_welcome_sequence",phase="finished",slow_frame_streak_detected="true"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          layer: l1
          domain: startup
        annotations:
          summary: "欢迎动效连续两帧超过 32ms"

  - name: quwoquan_l3_mongo
    rules:
      - alert: MongoSlowCommandRate
        expr: sum(rate(mongo_command_total{status="error"}[5m])) by (database) > 5
        for: 5m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "MongoDB error command rate high for {{ $labels.database }}"

      - alert: MongoCommandLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(mongo_command_duration_seconds_bucket[5m])) by (le, database)) > 0.5
        for: 5m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "MongoDB P95 latency > 500ms for {{ $labels.database }}"

  - name: quwoquan_l3_mq_publish
    rules:
      - alert: MQPublishFailureRate
        expr: sum(rate(mq_publish_total{status="error"}[5m])) / sum(rate(mq_publish_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          layer: l3
        annotations:
          summary: "MQ publish error rate > 5%"

  - name: quwoquan_l3_service
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(http_server_requests_total[5m])) by (service) > 0.01
        for: 3m
        labels:
          severity: critical
          layer: l3
        annotations:
          summary: "服务 {{ $labels.service }} 5xx 错误率 > 1%"
          description: "当前错误率 {{ $value | humanizePercentage }}，持续 3 分钟。"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_duration_seconds_bucket[5m])) by (le, service)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "服务 {{ $labels.service }} P95 延迟 > 200ms"
          description: "当前 P95 = {{ $value | humanizeDuration }}，持续 5 分钟。"

      - alert: HighInflight
        expr: |
          sum(http_server_inflight_requests) by (service) > 100
        for: 2m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "服务 {{ $labels.service }} 并发请求 > 100"

  - name: quwoquan_l3_redis
    rules:
      - alert: RedisHighErrorRate
        expr: |
          sum(rate(redis_operations_total{status="error"}[5m])) by (scene)
          / sum(rate(redis_operations_total[5m])) by (scene) > 0.05
        for: 3m
        labels:
          severity: critical
          layer: l3
        annotations:
          summary: "Redis 场景 {{ $labels.scene }} 错误率 > 5%"

      - alert: RedisHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(redis_duration_seconds_bucket[5m])) by (le, scene)
          ) > 0.05
        for: 3m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "Redis 场景 {{ $labels.scene }} P95 > 50ms"

  - name: quwoquan_l3_projector
    rules:
      - alert: ProjectorFailures
        expr: |
          sum(rate(projector_events_total{status="error"}[5m])) by (projector) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "Projector {{ $labels.projector }} 持续失败"

      - alert: EventStorePublishFailures
        expr: |
          sum(rate(eventstore_publish_failures_total[5m])) by (aggregate_type) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "EventStore publish 失败: {{ $labels.aggregate_type }}"

  - name: quwoquan_rec_model
    # SLI/SLO 真相源：quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml。
    # emitter 状态：
    # - P0 已激活：recommendation_feed_served/impressed/visible/dwell/interaction/negative、
    #   recommendation_behavior_ingest(_dropped)、rec_hotpath_dropped、
    #   recommendation_exposure_filter_smembers_fallback、recommendation_feed_served_by_attribution_total、
    #   recommendation_behavior_by_attribution_total。
    # - 仍为预置告警：ExposureGini / ContentCoverage / PolicyTakedownEjection / ABValidity
    #   等 P1/P2 指标，真实 emitter 落地前不代表已具备触发数据。
    rules:
      - alert: RecModelFallbackRateHigh
        expr: |
          sum(rate(rec_pipeline_rule_hits_total[5m]))
          / (sum(rate(rec_pipeline_model_hits_total[5m])) + sum(rate(rec_pipeline_rule_hits_total[5m])) + 0.001) > 0.5
        for: 5m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "推荐模型 fallback 率 > 50%（rule 打分占比过高）"
          description: "模型服务可能不可用，当前 {{ $value | humanizePercentage }} 请求走 rule fallback"

      - alert: RecPipelineLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(rec_pipeline_total_latency_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐管线 P99 延迟 > 500ms"
          description: "当前 P99 = {{ $value | humanizeDuration }}，可能影响 feed 加载速度"

      - alert: RecModelTimeoutRateHigh
        expr: |
          sum(rate(rec_pipeline_model_timeouts_total[5m]))
          / (sum(rate(rec_pipeline_model_hits_total[5m])) + sum(rate(rec_pipeline_model_timeouts_total[5m])) + 0.001) > 0.1
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐模型超时率 > 10%"
          description: "rec-model-service 响应超时 {{ $value | humanizePercentage }}"

      - alert: RecEmptyFeedRateHigh
        expr: |
          sum(rate(rec_pipeline_empty_results_total[5m]))
          / (sum(rate(rec_pipeline_requests_total[5m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐空 Feed 率 > 5%"
          description: "用户收到空 feed 比例过高，当前 {{ $value | humanizePercentage }}"

      - alert: RecScoreDistributionAnomaly
        expr: |
          abs(
            histogram_quantile(0.50, sum(rate(rec_score_value_bucket[5m])) by (le))
            - histogram_quantile(0.50, sum(rate(rec_score_value_bucket[5m] offset 1d)) by (le))
          ) > 0.15
        for: 15m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐分数分布异常（中位数偏移 > 0.15）"
          description: "rec-model-service 打分分布发生显著变化，可能存在特征漂移、模型退化或切流异常"

      - alert: RecommendationRepeatExposureRateHigh
        expr: |
          sum(rate(recommendation_feed_duplicate_exposure_total[30m]))
          / (sum(rate(recommendation_feed_served_total[30m])) + 0.001) > 0.01
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐重复曝光率 > 1%"
          description: "served/impressed 窗口内重复曝光占比 {{ $value | humanizePercentage }}，超出商用成熟度 SLO（repeat_exposure_rate<=0.01）。"

      - alert: RecommendationExposureGiniHigh
        expr: recommendation_feed_exposure_gini > 0.65
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐曝光基尼 > 0.65"
          description: "内容曝光分布过度集中，动态曝光预算或覆盖率约束可能失效。"

      - alert: RecommendationContentCoverageLow
        expr: |
          count(count_over_time(recommendation_feed_served_total[1h])) / (eligible_feed_item_count + 0.001) < 0.30
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐内容覆盖率 < 30%"
          description: "推荐窗口覆盖的可推荐内容比例过低，可能存在赢家通吃或召回过窄。"

      - alert: RecommendationPolicyTakedownEjectionSlow
        expr: |
          histogram_quantile(0.95,
            sum(rate(recommendation_feed_policy_takedown_ejection_seconds_bucket[5m])) by (le)
          ) > 60
        for: 5m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "推荐违规/下架剔除 P95 > 60s"
          description: "内容被下架或判违规后仍滞留推荐池，违反商用治理 SLO。"

      - alert: RecommendationABValidityLow
        expr: |
          sum(rate(recommendation_feed_ab_valid_experiments_total[1h]))
          / (sum(rate(recommendation_feed_ab_valid_experiments_total[1h])) + sum(rate(recommendation_feed_ab_invalid_experiments_total[1h])) + 0.001) < 0.95
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 AB 实验有效性 < 95%"
          description: "AB 实验存在样本量不足、分桶漂移或显著性口径无效风险。"

      - alert: RecommendationBehaviorIngestDropHigh
        expr: |
          sum(rate(recommendation_behavior_ingest_dropped_total[5m]))
          / (sum(rate(recommendation_behavior_ingest_total[5m])) + 0.001) > 0.01
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐行为入口丢弃率 > 1%"
          description: "FeedbackIngestor 去重/限流/背压丢弃行为事件占比过高，可能丢失曝光/反馈信号。"

      - alert: RecommendationHotPathBufferDropHigh
        expr: sum(rate(rec_hotpath_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 HotPath 缓冲丢弃 > 0"
          description: "BufferedHotPath 缓冲溢出丢弃行为信号，需扩容缓冲或限流上游。"

      - alert: RecommendationExposureSMembersFallback
        expr: |
          sum(rate(recommendation_exposure_filter_smembers_fallback_total[5m]))
          / (sum(rate(rec_pipeline_requests_total[5m])) + 0.001) > 0.01
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐曝光过滤 SMembers 回退率 > 1%"
          description: "曝光过滤应使用候选 membership 点查或等价批量点查；SMembers 回退说明容量路径退化。"

      - alert: RecommendationClickThroughRateLow
        expr: |
          sum(rate(recommendation_feed_engagement_total{action="click"}[30m]))
          / (sum(rate(recommendation_feed_impressed_total[30m])) + 0.001) < 0.05
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 CTR < 5%"
          description: "七态 click / impressed 点击率 {{ $value | humanizePercentage }}，低于商用成熟度 SLO（click_through_rate>=0.05），排查召回/排序/曝光质量。"

      - alert: RecommendationCompletionRateLow
        expr: |
          sum(rate(recommendation_feed_completion_total[1h]))
          / (sum(rate(recommendation_feed_impressed_total[1h])) + 0.001) < 0.35
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐内容完成率 < 35%"
          description: "深度消费/播放完成 / impressed 完成率 {{ $value | humanizePercentage }}，低于 SLO（completion_rate>=0.35），可能存在内容质量或曝光-内容匹配问题。"

      - alert: RecommendationNegativeFeedbackRateHigh
        expr: |
          sum(rate(recommendation_feed_negative_feedback_total[1h]))
          / (sum(rate(recommendation_feed_impressed_total[1h])) + 0.001) > 0.08
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐负反馈率 > 8%"
          description: "dislike/report/hide 等负反馈 / impressed 占比 {{ $value | humanizePercentage }}，超出 SLO（negative_feedback_rate<=0.08）。"

      - alert: RecommendationAttributionUnknownRateHigh
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{channel="unknown",recall_path="unknown"}[10m]))
          / (sum(rate(recommendation_behavior_by_attribution_total[10m])) + 0.001) > 0.05
        for: 15m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐归因 unknown rate > 5%"
          description: "P0+ bounded attribution 丢失占比 {{ $value | humanizePercentage }}，低于 recommendation_attribution_bucket_coverage>=0.95 的商用门槛。"

      - alert: RecommendationAttributionNegativeFeedbackBySupplySourceHigh
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{state="negative",supply_source!="unknown"}[30m])) by (channel, vertical, supply_source)
          / clamp_min(sum(rate(recommendation_behavior_by_attribution_total{state="impressed",supply_source!="unknown"}[30m])) by (channel, vertical, supply_source), 0.001) > 0.08
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐负反馈按供给来源异常（{{ $labels.channel }}/{{ $labels.vertical }}/{{ $labels.supply_source }}）"
          description: "bounded attribution 负反馈率 {{ $value | humanizePercentage }} 超过 8%，需排查 UGC/数据工程供给质量、审核准入或场景路由。"

      - alert: RecommendationAttributionCTRByRecallPathLow
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{state="click",recall_path!="unknown"}[30m])) by (channel, vertical, recall_path)
          / clamp_min(sum(rate(recommendation_behavior_by_attribution_total{state="impressed",recall_path!="unknown"}[30m])) by (channel, vertical, recall_path), 0.001) < 0.03
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 CTR 按召回路径低于 3%（{{ $labels.channel }}/{{ $labels.vertical }}/{{ $labels.recall_path }}）"
          description: "bounded attribution CTR {{ $value | humanizePercentage }} 低于 recall_path 分桶护栏，需排查协同召回、热门、新内容或兜底召回质量。"

      - alert: RecommendationScenarioConsumptionRateLow
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{state=~"click|dwell",channel=~"travel|premium_stream"}[30m])) by (channel)
          / clamp_min(sum(rate(recommendation_feed_served_by_attribution_total{channel=~"travel|premium_stream"}[30m])) by (channel), 0.001) < 0.02
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐旅行/精品场景消费率低于 2%（{{ $labels.channel }}）"
          description: "travel 或 premium_stream 的 click/dwell 相对 served 消费率 {{ $value | humanizePercentage }} 过低，可能场景路由、精品排序预设或内容池质量退化。"

      - alert: RecommendationSupplySourceShareImbalance
        expr: |
          min(sum(rate(recommendation_feed_served_by_attribution_total{supply_source=~"ugc|data_engineering"}[1h])) by (supply_source))
          / clamp_min(sum(rate(recommendation_feed_served_by_attribution_total{supply_source=~"ugc|data_engineering"}[1h])), 0.001) < 0.05
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 UGC/数据工程供给 share 失衡"
          description: "UGC 与 data_engineering 中较低一侧 served share {{ $value | humanizePercentage }} 低于 5%，需排查供给投影、质量分准入或路由配比。"

  - name: quwoquan_search
    # 搜索 SLO 告警（SLI/SLO 真相源：quwoquan_service/services/search-service/
    # configs/observability/search_slo.yaml）。延迟用 histogram 取分位数，按 AB
    # bucket label 可切分；通用 HighErrorRate/HighP95Latency 已按 service 覆盖可用性，
    # 这里补搜索特有的检索延迟、零结果率与降级率。
    rules:
      - alert: SearchRetrieveLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(search_retrieve_duration_seconds_bucket[5m])) by (le)
          ) > 0.4
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索检索 P99 延迟 > 400ms"
          description: "search-service /v1/search P99 = {{ $value | humanizeDuration }}，超出 SLO（p99_ms=400）。"

      - alert: SearchZeroResultRateHigh
        expr: |
          sum(rate(search_retrieve_zero_results_total[10m]))
          / (sum(rate(search_retrieve_requests_total{status="ok"}[10m])) + 0.001) > 0.15
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索零结果率 > 15%"
          description: "成功检索中零结果占比 {{ $value | humanizePercentage }}，超出 SLO（zero_result_rate<=0.15），可能召回或归一化退化。"

      - alert: SearchDegradeRateHigh
        expr: |
          sum(rate(search_retrieve_degraded_total[5m]))
          / (sum(rate(search_retrieve_requests_total{status="ok"}[5m])) + 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索降级率 > 5%"
          description: "携带降级信号（如 ES 失败回退 native）的检索占比 {{ $value | humanizePercentage }}，超出 SLO（degrade_rate<=0.05）。"

      - alert: SearchAvailabilityLow
        expr: |
          sum(rate(search_retrieve_requests_total{status="error"}[5m]))
          / (sum(rate(search_retrieve_requests_total[5m])) + 0.001) > 0.005
        for: 5m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "搜索检索错误率 > 0.5%（可用性 < 99.5%）"
          description: "search-service 检索错误率 {{ $value | humanizePercentage }}，跌破可用性 SLO（0.995）。"

      - alert: SearchLoadShedRateHigh
        # 背压边界主动 shed（in-flight 满）占比。受控 503 退化，超阈值=实例饱和需扩容。
        # SLI load_shed_rate（search_slo.yaml，objective_max=0.01）。
        expr: |
          sum(rate(search_retrieve_load_shed_total[5m]))
          / (sum(rate(search_retrieve_requests_total[5m]))
             + sum(rate(search_retrieve_load_shed_total[5m])) + 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索背压 shed 率 > 1%（实例饱和）"
          description: "search-service in-flight 背压 shed 占比 {{ $value | humanizePercentage }}，超出 SLO（load_shed_rate<=0.01）；需水平扩实例或排查下游变慢。"

      - alert: SearchInflightSaturationHigh
        # 在途并发饱和度（current inflight 接近 SEARCH_MAX_INFLIGHT=256）。持续高位即扩容触发，
        # 早于 load-shed 出现。SLI inflight_saturation（search_slo.yaml，objective_max=256）。
        expr: max(search_retrieve_inflight) > 230
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索在途并发持续逼近上限（>230/256）"
          description: "search-service 在途并发 {{ $value }} 持续 > 230（上限 256，≈90%），即将触发 load-shed，应提前扩容。"

  - name: quwoquan_intersection
    # 交集统一体验 SLO 告警（SLI/SLO 真相源：quwoquan_service/services/content-service/
    # configs/observability/intersection_slo.yaml）。HTTP 延迟/可用性走 http_server_*
    # 中间件按 route 过滤；业务漏斗走 content-service intersection_* 计数器。延迟用
    # histogram 取分位数（禁止算术平均），阈值与 SLO objective 对齐。
    rules:
      - alert: IntersectionApiLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_duration_seconds_bucket{service="content-service", route=~"/v1/content/intersections.*|/v1/content/feed/intersections"}[5m])) by (le)
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集读路由 P95 延迟 > 300ms"
          description: "content-service 交集相关路由 P95 = {{ $value | humanizeDuration }}，超出 SLO（p95_ms=300）。"

      - alert: IntersectionRepeatExposureRateHigh
        expr: |
          sum(rate(intersection_feed_candidates_total{rank_state="seen"}[30m]))
          / (sum(rate(intersection_feed_candidates_total[30m])) + 0.001) > 0.20
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集重复曝光率 > 20%"
          description: "spotlight 候选窗中命中跨会话冷却记忆窗（seen）占比 {{ $value | humanizePercentage }}，超出 SLO（repeat_exposure_rate<=0.20），换新不足或冷却窗失效。"

      - alert: IntersectionFreshnessFilterRateHigh
        expr: |
          sum(rate(intersection_feed_filtered_total{reason="stale"}[30m]))
          / (sum(rate(intersection_feed_candidates_total[30m])) + sum(rate(intersection_feed_filtered_total[30m])) + 0.001) > 0.30
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集保鲜过滤率 > 30%"
          description: "Feed 候选因过保鲜被过滤占比 {{ $value | humanizePercentage }}，超出 SLO（freshness_filter_rate<=0.30），读模型 freshness TTL 或重算滞后。"

      - alert: IntersectionDisplayIncompleteRateHigh
        expr: |
          sum(rate(intersection_feed_filtered_total{reason="display_incomplete"}[30m]))
          / (sum(rate(intersection_feed_candidates_total[30m])) + sum(rate(intersection_feed_filtered_total[30m])) + 0.001) > 0.10
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集展示不完备率 > 10%"
          description: "Feed 候选因缺 primaryText/头像被空窗治理过滤占比 {{ $value | humanizePercentage }}，超出 SLO（display_incomplete_rate<=0.10），Explain 管线或读模型数据缺口。"

      - alert: IntersectionRedisDegradedHigh
        expr: |
          sum(rate(intersection_redis_degraded_total[5m])) by (op) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集 Redis 降级速率偏高（op={{ $labels.op }}）"
          description: "交集 Redis 降级速率 {{ $value }}/s（op={{ $labels.op }}）超出 SLO（redis_degraded_rate<=0.05）。Redis 可能不可用——读位已由 rm_intersection_watermark 持久兜底、主请求未阻断，但应尽快恢复 Redis 以回到热路径。"

  - name: quwoquan_l4_infrastructure
    rules:
      - alert: HighGoroutineCount
        expr: go_goroutines > 5000
        for: 5m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "实例 {{ $labels.instance }} goroutine 数 > 5000"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 512
        for: 5m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "实例 {{ $labels.instance }} RSS > 512MB"

      - alert: HighFDUsage
        expr: process_open_fds / process_max_fds > 0.8
        for: 5m
        labels:
          severity: critical
          layer: l4
        annotations:
          summary: "实例 {{ $labels.instance }} FD 使用率 > 80%"

  - name: quwoquan_content_flywheel
    rules:
      - alert: InterestRecomputeErrorRateHigh
        expr: |
          sum(rate(quwoquan_interest_profile_recompute_total{result="error"}[5m]))
          / (sum(rate(quwoquan_interest_profile_recompute_total[5m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "兴趣画像派生失败率 > 5%"
          description: "content-service InterestProfileAggregator 重算失败 {{ $value | humanizePercentage }}，飞轮上游派生环节受损"

      - alert: InterestProjectionFailures
        expr: |
          sum(rate(quwoquan_interest_projection_total{result=~"parse_error|write_error"}[5m])) by (result) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "user 域兴趣投影持续失败（{{ $labels.result }}）"
          description: "InterestProfileProjector 消费 UserInterestRecomputed 写 rm_user_profile_view 失败，CQRS 双路投影出现裂口"

      - alert: InterestProjectionFreshnessLagHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_interest_projection_freshness_lag_seconds_bucket[5m])) by (le)
          ) > 900
        for: 15m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "兴趣投影新鲜度滞后 P95 > 15min"
          description: "画像 recomputedAt 到投影落库滞后过大，对外画像 API 与小艺主动触达读到陈旧画像"

  - name: quwoquan_entity_homepage
    # 实体主页 introduction 读路径 + homepage-import 导入观测（SLI/SLO 真相源：
    # quwoquan_service/services/entity-service/configs/observability/homepage_introduction_slo.yaml）。
    # HTTP 延迟/可用性走 http_server_* 中间件按 route 过滤；导入观测走 homepage-import
    # --metrics-textfile 落的 node_exporter textfile 指标（离线批任务标准通道）。
    rules:
      - alert: HomepageReadLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_duration_seconds_bucket{service="entity-service", route=~"/v1/homepages.*"}[5m])) by (le)
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "实体主页读路由 P95 延迟 > 300ms"
          description: "entity-service /v1/homepages* 路由 P95 = {{ $value | humanizeDuration }}，超出 SLO（p95_ms=300）；homepage_state 单文档读模型不应出现请求期聚合。"

      - alert: HomepageReadAvailabilityLow
        expr: |
          sum(rate(http_server_requests_total{service="entity-service", route=~"/v1/homepages.*", status=~"5.."}[5m]))
          / (sum(rate(http_server_requests_total{service="entity-service", route=~"/v1/homepages.*"}[5m])) + 0.001) > 0.005
        for: 10m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "实体主页读路由 5xx 错误率 > 0.5%"
          description: "entity-service /v1/homepages* 5xx 比率 {{ $value | humanizePercentage }}，低于可用性 SLO（0.995）。优先检查 Mongo homepage_state 连接与最近一次 homepage-import。"

      - alert: HomepageImportIssuesPresent
        expr: |
          max(quwoquan_homepage_import_objects{result="issues"}) by (env) > 0
        for: 5m
        labels:
          severity: warning
          layer: l1
        annotations:
          summary: "homepage-import 最近一次导入存在 issues（env={{ $labels.env }}）"
          description: "qwq-data ship → entity-service homepage-import 报告 issues={{ $value }}，introduction 投影可能缺对象闭包或 CAS；核对 .qwq_output/env/{{ $labels.env }}/data-release/<releaseId>/runs/<runId>/import-homepage.json。"

      - alert: HomepageImportStale
        expr: |
          (time() - max(quwoquan_homepage_import_last_success_timestamp_seconds) by (env)) > 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          layer: l1
        annotations:
          summary: "homepage-import 超过 7 天未成功（env={{ $labels.env }}）"
          description: "环境主页读模型快照可能过期；数据发布链（promote→ship→homepage-import）停摆或 textfile collector 未接入。"
