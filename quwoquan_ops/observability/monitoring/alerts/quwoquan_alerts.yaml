# 产品事件原始明细与小时聚合以 Product Ops Elasticsearch 合同为单一事实源；
# 本文件只消费 product-ops-service 的有界传输指标。聚合 freshness/失败策略在
# observability/elasticsearch/product_telemetry_alerts.yaml 定义。

groups:
  - name: quwoquan_runtime_message_transport_recording
    interval: 30s
    rules:
      - record: qwq_message_transport_publish_p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, root, adapter) (
              rate(qwq_message_transport_publish_duration_seconds_bucket[5m])
            )
          )

      - record: qwq_message_transport_consume_p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, root, adapter) (
              rate(qwq_message_transport_consume_duration_seconds_bucket[5m])
            )
          )

  - name: quwoquan_l2_auth_login
    rules:
      - alert: AuthProviderErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="user-service", route=~"/auth/(authorization/alipay|login/(wechat|alipay|qq|one-tap.*))", status!~"2.."}[5m])) by (route)
          / (sum(rate(http_server_requests_total{service="user-service", route=~"/auth/(authorization/alipay|login/(wechat|alipay|qq|one-tap.*))"}[5m])) by (route) + 0.001) > 0.02
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: user-auth
        annotations:
          summary: "登录 Provider {{ $labels.route }} 错误率连续两个窗口 > 2%"
          description: "当前非 2xx 比率 {{ $value | humanizePercentage }}。立即验证该 provider 降级、短信验证码恢复入口与配置回滚。"

      - alert: AuthChallengeLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_duration_seconds_bucket{service="user-service",route="/auth/otp/send"}[5m])) by (le)
          ) > 1.2
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "验证码发送 P95 延迟连续两个窗口超过 1.2 秒"
          description: "检查 User Service 幂等重放、Integration 投递和短信 Provider 延迟；客户端总 deadline 仍为 3 秒。"

      - alert: AuthLoginLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_duration_seconds_bucket{service="user-service",route=~"/auth/login/(phone|wechat|alipay|qq|one-tap.*)"}[5m])) by (le, route)
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "登录校验 P95 延迟连续两个窗口超过 1.5 秒"
          description: "按 route 定位手机号或第三方登录延迟，并验证 session 签发与 readback；客户端超时后必须保留验证码或恢复动作。"

      - alert: LoginClientStateStalled
        expr: |
          sum(increase(ops_login_funnel_events_total{action="login_state_changed",result="stalled"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "客户端登录状态停留超过 90 秒"
          description: "检查 step 标签定位不可退出状态，并关联 login_operation 的失败类型与恢复动作；指标不携带 flowId、手机号或请求标识。"

      - alert: LoginTerminalDuplicateSuppressed
        expr: |
          sum(increase(ops_login_funnel_events_total{action="login_terminal",result="duplicate_suppressed"}[10m])) > 0
        for: 1m
        labels:
          severity: critical
          layer: l2
          domain: user-auth
        annotations:
          summary: "登录终态出现重复竞争"
          description: "terminal latch 已阻止重复回调；检查成功、关闭、路由 continuation 与 deadline 是否并发触发。"

      - alert: LoginClientOperationFailureRateHigh
        expr: |
          (
            sum(rate(ops_login_operation_events_total{result="failure"}[10m])) by (operation)
            / clamp_min(sum(rate(ops_login_operation_events_total[10m])) by (operation), 0.001)
          ) > 0.05
          and sum(increase(ops_login_operation_events_total[10m])) by (operation) >= 20
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "客户端登录操作 {{ $labels.operation }} 失败率超过 5%"
          description: "按 failure_kind 下钻 OTP、运营商或第三方授权失败，并用 Elasticsearch 运维事件关联 sourceCode/requestId/traceId。"

      - alert: OtpDeliveryConfirmationUnknownHigh
        expr: |
          (
            sum(rate(ops_login_operation_events_total{operation="confirm_otp_delivery_15s",result="delivery_confirming"}[10m]))
            / clamp_min(sum(rate(ops_login_operation_events_total{operation=~"confirm_otp_delivery(_5s|_15s)?"}[10m])), 0.001)
          ) > 0.02
          and sum(increase(ops_login_operation_events_total{operation=~"confirm_otp_delivery(_5s|_15s)?"}[10m])) >= 20
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "验证码发送结果 15 秒未知率超过 2%"
          description: "客户端已停止自动确认但仍允许输入已收到的验证码；检查 User Service durable consumer、Integration result 延迟和短信 Provider backlog。"

      - alert: OtpDeliveryFailureRateHigh
        expr: |
          (
            sum(rate(ops_login_operation_events_total{operation=~"send_otp|confirm_otp_delivery(_5s|_15s)?",result="delivery_failed"}[10m]))
            / clamp_min(sum(rate(ops_login_operation_events_total{operation=~"send_otp|confirm_otp_delivery(_5s|_15s)?"}[10m])), 0.001)
          ) > 0.02
          and sum(increase(ops_login_operation_events_total{operation=~"send_otp|confirm_otp_delivery(_5s|_15s)?"}[10m])) >= 20
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: user-auth
        annotations:
          summary: "验证码投递失败率超过 2%"
          description: "按 operation 区分初次发码与 5/15 秒状态确认，检查 delivery_failed、Provider dead letter 与精确冷却恢复。"

      - alert: LoginCompletionRateLow
        expr: |
          (
            sum(rate(ops_login_funnel_events_total{action="login_terminal",result="login_success"}[15m]))
            / clamp_min(sum(rate(ops_login_funnel_events_total{action="login_flow_exposed",result="exposed"}[15m])), 0.001)
          ) < 0.80
          and sum(increase(ops_login_funnel_events_total{action="login_flow_exposed",result="exposed"}[15m])) >= 20
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "登录完成率低于 80%"
          description: "按 send_otp、confirm_otp_delivery、verify_login_otp 与 failure_kind 下钻，确认短信、校验和 session readback 均可恢复。"

      - alert: LoginPhoneBindingAbandonmentHigh
        expr: |
          (
            sum(rate(ops_login_funnel_events_total{action="login_phone_binding",result="cancelled"}[15m])) by (provider)
            / clamp_min(sum(rate(ops_login_funnel_events_total{action="login_phone_binding",result="required"}[15m])) by (provider), 0.001)
          ) > 0.20
          and sum(increase(ops_login_funnel_events_total{action="login_phone_binding",result="required"}[15m])) by (provider) >= 10
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: user-auth
        annotations:
          summary: "{{ $labels.provider }} 首次登录绑定手机号放弃率超过 20%"
          description: "核对绑定页可退出性、短信挑战失败、凭证冲突与更换手机号恢复路径；未完成绑定不得进入 Shell。"

      # UserSettings 对象命令（PATCH /user/settings/*）：CAS 写失败或存储异常。

      - alert: UserAccountCloseOutboxFailureRateHigh
        expr: |
          sum(rate(user_account_close_outbox_delivery_total{result="failed"}[10m]))
          / clamp_min(sum(rate(user_account_close_outbox_delivery_total[10m])), 1e-9) > 0.01
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号注销终态事件投递失败率 > 1%"
          description: "UserAccountClosed durable outbox 未能推进；核查 PostgreSQL 租约、events.user.account Redis Stream 与下游匿名化消费者。"

      - alert: AccountSecurityAuthorityUnavailable
        expr: |
          sum by (job, instance) (
            increase(runtime_auth_account_security_authority_checks_total{outcome="unavailable"}[5m])
          ) > 0
        for: 1m
        labels:
          severity: critical
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号安全同步权威出现不可用拒绝"
          description: "资源服务已按 fail-closed 拒绝请求；核查 user-service scoped health、服务凭据、网络与 PostgreSQL，禁止通过缓存或跳过校验恢复流量。"

      - alert: AccountSecurityAuthorityDeniedSpike
        expr: |
          (
            sum by (job, instance) (
              rate(runtime_auth_account_security_authority_checks_total{outcome=~"denied_deleted|denied_suspended|denied_token_stale"}[5m])
            )
            / clamp_min(
              sum by (job, instance) (
                rate(runtime_auth_account_security_authority_checks_total[5m])
              ),
              1e-9
            )
          ) > 0.05
          and sum by (job, instance) (
            rate(runtime_auth_account_security_authority_checks_total[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号安全权威拒绝比例超过 5%"
          description: "检查注销/停用是否异常增长、客户端是否持续重放旧 access token，以及 auth_epoch 签发与读取是否漂移；指标不含主体标识。"

      - alert: AccountSecurityAuthorityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job, instance) (
              rate(runtime_auth_account_security_authority_check_duration_seconds_bucket[5m])
            )
          ) > 0.15
        for: 5m
        labels:
          severity: warning
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号安全同步权威 P95 超过 150ms"
          description: "延迟正在侵蚀 fail-closed deadline；核查 user-service 查询、连接池与服务网络，禁止引入可放行的本地缓存。"

      - alert: AccountSecurityAuthorityLatencyErrorBudgetBurn
        expr: |
          (
            (
              1 -
              sum by (job, instance) (
                rate(runtime_auth_account_security_authority_check_duration_seconds_bucket{le="0.15"}[5m])
              )
              /
              clamp_min(
                sum by (job, instance) (
                  rate(runtime_auth_account_security_authority_check_duration_seconds_count[5m])
                ),
                1e-9
              )
            ) / 0.05
          ) > 14.4
          and
          (
            (
              1 -
              sum by (job, instance) (
                rate(runtime_auth_account_security_authority_check_duration_seconds_bucket{le="0.15"}[1h])
              )
              /
              clamp_min(
                sum by (job, instance) (
                  rate(runtime_auth_account_security_authority_check_duration_seconds_count[1h])
                ),
                1e-9
              )
            ) / 0.05
          ) > 14.4
        for: 2m
        labels:
          severity: critical
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号安全同步权威 150ms 延迟预算快速燃烧"
          description: "5m 与 1h 窗口均超过 14.4 倍 burn rate；deadline 可继续容纳慢成功，但必须停止放量并修复 user-service/网络延迟，禁止用缓存绕过 fail-closed 权威读取。"

      - alert: UserAccountClosedConsumerRetrying
        expr: |
          sum(increase({__name__=~"(content|chat|circle|notification|search)_user_account_closed_consumer_total", result="retry"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号注销下游清理正在重试"
          description: "至少一个 UserAccountClosed 消费者在最近 10 分钟发生重试；核查 MongoDB、Redis pending、外部索引和消费者健康探针。"

      - alert: UserAccountClosedDeadLetterPresent
        expr: |
          (
            sum(increase({__name__=~"(content|chat|circle|notification|search)_user_account_closed_consumer_total", result="dlq"}[10m])) > 0
          )
          or
          (
            sum(increase({__name__=~"(content|chat|circle|notification|search)_user_account_closed_consumer_total", result="held_for_recovery"}[10m])) > 0
          )
        for: 0m
        labels:
          severity: critical
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号注销清理事件存在待恢复 DLQ"
          description: "UserAccountClosed 已达到有限重试上限或仍被 terminal marker 持有；修复后只能释放原 source PEL 重新消费并验证各域清理探针，禁止仅清空 DLQ 或用脱敏 DLQ 重建事件。"

      - alert: UserAccountClosedCleanupP95High
        expr: |
          max(
            histogram_quantile(
              0.95,
              sum by (le, __name__) (
                rate({__name__=~"(content|chat|circle|notification|search)_user_account_closed_cleanup_seconds_bucket"}[10m])
              )
            )
          ) > 60
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-identity
        annotations:
          summary: "账号注销单消费者清理 P95 超过 60 秒"
          description: "下游总目标为 15 分钟；单消费者处理时间持续超过 60 秒会侵蚀重试与排空预算。"

  - name: quwoquan_l2_mq
    rules:
      - alert: MQConsumeLagHigh
        expr: sum(rate(mq_publish_total[5m])) by (topic) - sum(rate(mq_consume_total[5m])) by (topic) > 100
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "MQ consume lag high for topic {{ $labels.topic }}"
          description: "Publish rate exceeds consume rate by {{ $value }} msg/s"

  - name: quwoquan_l1_ops_pipeline
    rules:
      - alert: ProductTelemetryIngestUnavailableRateHigh
        expr: |
          sum(rate(ops_telemetry_ingest_batches_total{result="unavailable"}[10m]))
          / (sum(rate(ops_telemetry_ingest_batches_total[10m])) + 0.001) > 0.01
        for: 10m
        labels:
          severity: critical
          layer: l1
          domain: product-telemetry
        annotations:
          summary: "产品遥测不可用批次比例超过 1%"
          description: "检查四环境 product-ops runtime.log.sink 的 Elasticsearch health、鉴权、网络与写入超时；App 会保留加密 outbox。"

      - alert: ProductTelemetryLogSinkWriteErrors
        expr: sum(increase(ops_telemetry_logstore_operation_duration_seconds_count{operation=~"put_event_batch|put_startup_diagnostic",result="error"}[10m])) > 0
        for: 2m
        labels:
          severity: critical
          layer: l1
          domain: product-telemetry
        annotations:
          summary: "产品遥测日志端口写入出现错误"
          description: "按 operation 检查 raw/startup 分区；指标不携带 session、batch 或用户标识。"

      - alert: ProductTelemetryLogSinkWriteP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(ops_telemetry_logstore_operation_duration_seconds_bucket{operation="put_event_batch",result="success"}[10m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: product-telemetry
        annotations:
          summary: "产品遥测日志端口写入 P95 超过 1 秒"
          description: "接近服务端超时预算；检查 Elasticsearch 网络、配额与批量大小。"

      - alert: RuntimeLogSpoolBacklogHigh
        expr: runtime_log_export_spool_pending > 100
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: runtime-observability
        annotations:
          summary: "服务 {{ $labels.service }} 运行日志 spool 积压超过 100 批"
          description: "检查 product-ops runtime-log ingest、机器 token、网络和 Elasticsearch；spool 会按指数退避保留关键日志。"

      - alert: RuntimeLogDeadLetterPresent
        expr: runtime_log_export_dead_letter_pending > 0
        for: 5m
        labels:
          severity: critical
          layer: l1
          domain: runtime-observability
        annotations:
          summary: "服务 {{ $labels.service }} 存在运行日志 DLQ"
          description: "永久 4xx、TTL 过期或容量淘汰已进入 DLQ；修复契约/凭据后按 batch digest 幂等重放。"

      - alert: RuntimeLogCriticalCapacityEviction
        expr: increase(runtime_log_export_batches_total{result="critical_capacity_evicted"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          layer: l1
          domain: runtime-observability
        annotations:
          summary: "服务 {{ $labels.service }} 关键日志因 spool 容量被淘汰"
          description: "ERROR/WARN spool 已满；立即恢复 ingest 并扩容持久卷。"

      # Prometheus 只承载低基数近实时预警；Portal 的精确 ANR/卡顿会话率仍从
      # Elasticsearch 权威事件按 session 去重计算，禁止在时序标签中放 sessionId。
      - alert: AppANREventRateHigh
        expr: |
          sum(rate(ops_app_experience_events_total{event_type="app_anr_outcome",result="detected"}[10m]))
          / clamp_min(sum(rate(ops_app_experience_events_total{event_type="app_startup"}[10m])), 0.001) > 0.0047
        for: 10m
        labels:
          severity: critical
          layer: l1
          domain: app-experience
        annotations:
          summary: "App ANR 近实时事件率超过 0.47%"
          description: "先按 appVersion/networkClass 在产品体验权威回读中核对去重会话率，再下钻 app_anr_outcome 与 runtime signal。"

      - alert: AppJankFrameRateHigh
        expr: |
          (
            sum(rate(ops_app_janky_frames_total{page_name=~"home|video_book"}[10m]))
            / clamp_min(sum(rate(ops_app_frame_samples_total{page_name=~"home|video_book"}[10m])), 0.001)
          ) > 0.05
          and sum(increase(ops_app_frame_samples_total{page_name=~"home|video_book"}[10m])) >= 300
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: app-experience
        annotations:
          summary: "首页或视频书卡顿帧率达到 1%"
          description: "告警直接使用 jankyFrames/sampledFrames；从产品体验页按 pageName、surfaceId、channelId、appVersion、networkClass 下钻 worstFrameMs、worstBuildFrameMs 与 worstRasterFrameMs。"

      - alert: AppFrameSampleDenominatorMissing
        expr: absent(ops_app_frame_samples_total)
        for: 15m
        labels:
          severity: critical
          layer: l1
          domain: app-experience
        annotations:
          summary: "App 帧体验指标缺少 sampledFrames 分母"
          description: "检查 App 完整 frame batch、telemetry outbox、product-ops ingest 与 Prometheus exporter；缺分母必须显示 unavailable。"

      - alert: VideoBookPlaybackReadyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(ops_video_playback_ready_duration_seconds_bucket{page_name="video_book",result="success"}[10m])) by (le)
          ) > 2
          and sum(increase(ops_video_playback_events_total{page_name="video_book"}[10m])) >= 20
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: app-experience
        annotations:
          summary: "视频书 player ready P95 超过 2 秒"
          description: "按 appVersion/networkClass/devicePlatform 下钻 video_playback_qoe；6 秒仍未就绪必须进入可恢复终态。"

      - alert: VideoBookRebufferRatioHigh
        expr: |
          (
            sum(rate(ops_video_playback_rebuffer_seconds_total{page_name="video_book"}[15m]))
            / clamp_min(sum(rate(ops_video_playback_effective_seconds_total{page_name="video_book"}[15m])), 0.001)
          ) > 0.02
          and sum(increase(ops_video_playback_effective_seconds_total{page_name="video_book"}[15m])) >= 300
        for: 15m
        labels:
          severity: warning
          layer: l1
          domain: app-experience
        annotations:
          summary: "视频书重缓冲时长占比超过 2%"
          description: "检查媒体 Range/cache-control、弱网恢复、N+1 预热与 decoder 槽位；分母不足时不触发比率告警。"

      - alert: AppExperienceTelemetryMissing
        expr: absent(ops_app_experience_events_total{event_type="app_startup"})
        for: 15m
        labels:
          severity: critical
          layer: l1
          domain: app-experience
        annotations:
          summary: "App 体验黄金指标没有启动分母"
          description: "检查 App telemetry outbox、product-ops ingest、Elasticsearch 与 Prometheus scrape；缺样本必须显示 unavailable。"

  - name: quwoquan_l1_startup_welcome
    # 以下规则只消费 product-ops-service 的受限匿名启动阶段事实。
    # 产品 app_startup 分位数与错误率由 Elasticsearch 小时聚合提供，不复制到 Prometheus label。
    rules:
      - alert: StartupFlutterFirstFrameP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(ops_startup_phase_duration_seconds_bucket{phase="flutter_first_frame"}[10m])) by (le, platform, runtime_env)
          ) > 2
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: startup
        annotations:
          summary: "Flutter 首帧 P95 超过 2 秒"
          description: "检查 native plugin、Dart bootstrap 与 runtime define 注入；按 platform/runtime_env 下钻。"

      - alert: StartupShellFirstPaintP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(ops_startup_phase_duration_seconds_bucket{phase="shell_first_paint"}[10m])) by (le, platform, runtime_env)
          ) > 3
        for: 10m
        labels:
          severity: warning
          layer: l1
          domain: startup
        annotations:
          summary: "启动 Shell 首帧 P95 超过 3 秒"
          description: "检查 Router deferred load、安全 Shell 与启动任务是否争用首帧预算。"

      - alert: StartupRecoveryRateHigh
        expr: |
          sum(rate(ops_startup_phase_total{phase="recovery"}[10m])) by (platform, runtime_env)
          / (sum(rate(ops_startup_phase_total{phase="native_pre_flutter"}[10m])) by (platform, runtime_env) + 0.001) > 0.001
        for: 5m
        labels:
          severity: critical
          layer: l1
          domain: startup
        annotations:
          summary: "启动恢复面比例超过 0.1%"
          description: "按 recovery_surface 和 failure code 查询受限启动遥测，确认是 bootstrap、Router 还是 native watchdog。"

      - alert: StartupTerminalFunnelIncomplete
        expr: |
          1 -
          (
            sum(rate(ops_startup_phase_total{phase="terminal"}[15m])) by (platform, runtime_env)
            / (sum(rate(ops_startup_phase_total{phase="native_pre_flutter"}[15m])) by (platform, runtime_env) + 0.001)
          ) > 0.01
        for: 15m
        labels:
          severity: warning
          layer: l1
          domain: startup
        annotations:
          summary: "超过 1% 启动未观测到 terminal"
          description: "检查 native/Web journal、补传 drain 与受限 startup endpoint 的可用性。"

      - alert: StartupTelemetryJournalDrop
        expr: |
          sum(rate(ops_startup_phase_total{phase="terminal",outcome="journal_drop"}[10m])) by (platform, runtime_env) > 0
        for: 5m
        labels:
          severity: warning
          layer: l1
          domain: startup
        annotations:
          summary: "启动 journal 发生容量淘汰"
          description: "离线或 endpoint 故障导致启动记录超过本地容量；检查补传延迟与网络可用性。"

  - name: quwoquan_l3_mongo
    rules:
      - alert: MongoSlowCommandRate
        expr: sum(rate(mongo_command_total{status="error"}[5m])) by (database) > 5
        for: 5m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "MongoDB error command rate high for {{ $labels.database }}"

      - alert: MongoCommandLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(mongo_command_duration_seconds_bucket[5m])) by (le, database)) > 0.5
        for: 5m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "MongoDB P95 latency > 500ms for {{ $labels.database }}"

  - name: quwoquan_l3_mq_publish
    rules:
      - alert: MQPublishFailureRate
        expr: sum(rate(mq_publish_total{status="error"}[5m])) / sum(rate(mq_publish_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          layer: l3
        annotations:
          summary: "MQ publish error rate > 5%"

  - name: quwoquan_l3_service
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(http_server_requests_total[5m])) by (service) > 0.01
        for: 3m
        labels:
          severity: critical
          layer: l3
        annotations:
          summary: "服务 {{ $labels.service }} 5xx 错误率 > 1%"
          description: "当前错误率 {{ $value | humanizePercentage }}，持续 3 分钟。"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_duration_seconds_bucket[5m])) by (le, service)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "服务 {{ $labels.service }} P95 延迟 > 200ms"
          description: "当前 P95 = {{ $value | humanizeDuration }}，持续 5 分钟。"

      - alert: HighInflight
        expr: |
          sum(http_server_inflight_requests) by (service) > 100
        for: 2m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "服务 {{ $labels.service }} 并发请求 > 100"

  - name: quwoquan_l3_redis
    rules:
      - alert: RedisHighErrorRate
        expr: |
          sum(rate(redis_operations_total{status="error"}[5m])) by (scene)
          / sum(rate(redis_operations_total[5m])) by (scene) > 0.05
        for: 3m
        labels:
          severity: critical
          layer: l3
        annotations:
          summary: "Redis 场景 {{ $labels.scene }} 错误率 > 5%"

      - alert: RedisHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(redis_duration_seconds_bucket[5m])) by (le, scene)
          ) > 0.05
        for: 3m
        labels:
          severity: warning
          layer: l3
        annotations:
          summary: "Redis 场景 {{ $labels.scene }} P95 > 50ms"

  - name: quwoquan_l3_projector
    rules:
      - alert: ProjectorFailures
        expr: |
          sum(rate(projector_events_total{status="error"}[5m])) by (projector) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "Projector {{ $labels.projector }} 持续失败"

      - alert: EventStorePublishFailures
        expr: |
          sum(rate(mq_publish_total{status="error"}[5m])) by (topic) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "事件发布失败: topic={{ $labels.topic }}"

  - name: quwoquan_rec_model
    # SLI/SLO 真相源：quwoquan_service/services/content-service/observability/slo/recommendation_slo.yaml。
    # emitter 状态：
    # - P0 已激活：recommendation_feed_served/impressed/visible/dwell/interaction/negative、
    #   recommendation_behavior_ingest(_dropped)、rec_hotpath_dropped、
    #   recommendation_feed_served_by_attribution_total、
    #   recommendation_behavior_by_attribution_total、recommendation_feed_terminal_total。
    # - 仍为预置告警：ExposureGini / ContentCoverage / PolicyTakedownEjection / ABValidity
    #   等 P1/P2 指标，真实 emitter 落地前不代表已具备触发数据。
    rules:
      - alert: RecModelFallbackRateHigh
        # N1-1 语义修正：只统计真实降级（rec_pipeline_model_fallback_total，
        # N0-1 CascadeScorer 记账）。旧表达式用 rule_hits 占比，在 shadow-only
        # 阶段（rule 分桶 100%）永远为真，属语义失真告警。
        expr: |
          sum(rate(rec_pipeline_model_fallback_total[5m]))
          / (sum(rate(rec_pipeline_requests_total[5m])) + 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "推荐模型降级率 > 5%（模型故障回退 RuleScorer）"
          description: "模型服务可能不可用，当前 {{ $value | humanizePercentage }} 请求由 CascadeScorer 降级 RuleScorer 供给"

      - alert: RecPipelineLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(rec_pipeline_total_latency_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐管线 P99 延迟 > 500ms"
          description: "当前 P99 = {{ $value | humanizeDuration }}，可能影响 feed 加载速度"

      - alert: RecModelTimeoutRateHigh
        expr: |
          sum(rate(rec_pipeline_model_timeouts_total[5m]))
          / (sum(rate(rec_pipeline_model_hits_total[5m])) + sum(rate(rec_pipeline_model_timeouts_total[5m])) + 0.001) > 0.1
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐模型超时率 > 10%"
          description: "recommendation-service 响应超时 {{ $value | humanizePercentage }}"

      - alert: RecEmptyFeedRateHigh
        expr: |
          sum(rate(recommendation_feed_terminal_total{request_class="initial_recommend",outcome="empty"}[5m]))
          / (sum(rate(recommendation_feed_terminal_total{request_class="initial_recommend"}[5m])) + 0.001) > 0.001
        for: 10m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "推荐首刷成功空 Feed 率 > 0.1%"
          description: "discovery/recommend 首刷违反“非空或 canonical failure”契约，当前 {{ $value | humanizePercentage }}；following 与 continuation 合法空态已排除。"

      - alert: RecInitialRecommendTerminalFailureRateHigh
        expr: |
          sum(rate(recommendation_feed_terminal_total{request_class="initial_recommend",outcome="failure"}[5m]))
          / (sum(rate(recommendation_feed_terminal_total{request_class="initial_recommend"}[5m])) + 0.001) > 0.005
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐首刷 canonical failure 率 > 0.5%"
          description: "按 failure_stage 排查 recall/scorer/active_supply/hard_exclusion/ranked_window/hydration/exposure 终态，当前 {{ $value | humanizePercentage }}。"

      - alert: RankedFeedWindowAtomicUnavailable
        expr: |
          sum(increase(recommendation_ranked_feed_window_create_total{result="atomic_unavailable"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "RankedFeedWindow 原子 Redis 能力不可用"
          description: "续页窗口已按 fail-closed 停止签发；核查 rec scene 生产适配器及固定 quotaShard 同槽 Lua 能力，禁止降级为无界 SET NX。"

      - alert: RankedFeedWindowPayloadRejectionRateHigh
        expr: |
          sum(rate(recommendation_ranked_feed_window_create_total{result="payload_rejected"}[10m]))
          / (sum(rate(recommendation_ranked_feed_window_create_total[10m])) + 0.001) > 0.001
          and sum(increase(recommendation_ranked_feed_window_create_total[10m])) >= 100
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "RankedFeedWindow payload 拒绝率 > 0.1%"
          description: "未压缩窗口超过 canonical 2 MiB 硬上限，首屏会降级为无 continuation；下钻候选标签/实体引用与训练快照体积。"

      - alert: RankedFeedWindowShardKeyQuotaRejected
        expr: |
          sum(increase(recommendation_ranked_feed_window_create_total{result="shard_key_rejected"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "RankedFeedWindow quota shard live-key 准入拒绝"
          description: "固定分片达到业务 live-key 上限，contender 已 fail-closed 且未跨主体淘汰；核对触达分片分布、配置容量与 Redis 实际容量。"

      - alert: RankedFeedWindowShardByteQuotaRejected
        expr: |
          sum(increase(recommendation_ranked_feed_window_create_total{result="shard_byte_rejected"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "RankedFeedWindow quota shard live-byte 准入拒绝"
          description: "固定分片达到业务 live-byte 上限；核对 payload 分布、分片容量与 Redis 实际容量，禁止改用 maxmemory 淘汰。"

      - alert: RankedFeedWindowRepairBoundRejected
        expr: |
          sum(increase(recommendation_ranked_feed_window_create_total{result="repair_bound_rejected"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "RankedFeedWindow quota index/metadata 不变量破坏"
          description: "有界索引超限、metadata 缺失或 bytes 不一致；创建已 fail-closed。按 canonical quota shard 执行受控巡检与回滚，禁止全量 SCAN 在线修复。"

      - alert: FeedDeliveryPageAtomicUnavailable
        expr: |
          sum(increase(content_feed_delivery_page_total{operation="append",result="atomic_unavailable"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "FeedDeliveryPage 原子 Redis 能力不可用"
          description: "已交付页记录按 fail-closed 停止签发 continuation；核查 rec scene 固定 quotaShard 同槽 Lua 能力，禁止回退非原子写入。"

      - alert: FeedDeliveryPageFailureRateHigh
        expr: |
          sum(rate(content_feed_delivery_page_total{result=~"store_unavailable|atomic_unavailable|payload_rejected|conflict|error|invalid|invalid_quota_policy|shard_key_rejected|shard_byte_rejected|repair_bound_rejected"}[10m]))
          / (sum(rate(content_feed_delivery_page_total[10m])) + 0.001) > 0.001
          and sum(increase(content_feed_delivery_page_total[10m])) >= 100
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "FeedDeliveryPage 系统失败率 > 0.1%"
          description: "previous/next cursor 的只追加交付事实不可可靠写读；按 operation/result 下钻原子能力、payload、冲突与 Redis 可用性。"

      - alert: FeedDeliveryPageShardKeyQuotaRejected
        expr: |
          sum(increase(content_feed_delivery_page_total{operation="append",result="shard_key_rejected"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "FeedDeliveryPage quota shard live-key 准入拒绝"
          description: "固定分片达到业务 live-key 上限，新页已 fail-closed 且未跨 scope 淘汰；核对分片分布、配置容量与 Redis 实际容量。"

      - alert: FeedDeliveryPageShardByteQuotaRejected
        expr: |
          sum(increase(content_feed_delivery_page_total{operation="append",result="shard_byte_rejected"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "FeedDeliveryPage quota shard live-byte 准入拒绝"
          description: "固定分片达到业务 live-byte 上限；核对页 payload 分布、配置容量与 Redis 实际容量，禁止改用 maxmemory 淘汰。"

      - alert: FeedDeliveryPageRepairBoundRejected
        expr: |
          sum(increase(content_feed_delivery_page_total{operation="append",result="repair_bound_rejected"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "FeedDeliveryPage quota index/metadata 不变量破坏"
          description: "有界索引超限、metadata 缺失或 bytes 不一致；append 已 fail-closed。按 canonical quota shard 受控巡检，禁止在线全量 SCAN 修复。"

      # N1-1 死告警清理：RecScoreDistributionAnomaly 已删除——rec_score_value
      # histogram 无任何 emitter，该告警从未可求值。分数分布/特征漂移监控的
      # 真实通道是 CI 训练管线 monitoring job（make verify-ml-drift 的 PSI 报表）。

      - alert: RecommendationRepeatExposureRateHigh
        expr: |
          sum(rate(recommendation_feed_duplicate_exposure_total[30m]))
          / (sum(rate(recommendation_feed_served_total[30m])) + 0.001) > 0.01
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐重复曝光率 > 1%"
          description: "served/impressed 窗口内重复曝光占比 {{ $value | humanizePercentage }}，超出商用成熟度 SLO（repeat_exposure_rate<=0.01）。"

      # 曝光基尼（exposure_gini）为 objective_only SLI：per-content 分布无法在
      # PromQL 侧低基数计算，评估走离线 replay 报表；此处不留死告警。
      #
      # N1-1 死告警清理：
      # - RecommendationContentCoverageLow 已删除——recommendation_offline_eval_metric_value
      #   无生产 emitter（Go ReplayReport.Emit 无调度）；覆盖率回归门在 CI 训练管线
      #   promote gate（make verify-ml-model-quality）。
      # - RecommendationPolicyTakedownEjectionSlow 已删除——
      #   recommendation_feed_policy_takedown_ejection_seconds histogram 无 emitter；
      #   对应 SLI（policy_takedown_ejection_latency）保持 objective_only，接入真实
      #   emitter 后再恢复告警。

      - alert: RecommendationABValidityLow
        expr: |
          sum(rate(recommendation_feed_ab_experiment_validity_total{result="valid"}[1h]))
          / (sum(rate(recommendation_feed_ab_experiment_validity_total[1h])) + 0.001) < 0.95
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 AB 实验有效性 < 95%"
          description: "AB 实验存在样本量不足、分桶漂移或显著性口径无效风险。"

      - alert: RecommendationBehaviorIngestDropHigh
        expr: |
          sum(rate(recommendation_behavior_ingest_dropped_total[5m]))
          / (sum(rate(recommendation_behavior_ingest_total[5m])) + 0.001) > 0.01
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐行为入口丢弃率 > 1%"
          description: "FeedbackIngestor 去重/限流/背压丢弃行为事件占比过高，可能丢失曝光/反馈信号。"

      - alert: RecommendationHotPathBufferDropHigh
        expr: sum(rate(rec_hotpath_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 HotPath 缓冲丢弃 > 0"
          description: "BufferedHotPath 缓冲溢出丢弃行为信号，需扩容缓冲或限流上游。"

      - alert: RecommendationClickThroughRateLow
        expr: |
          sum(rate(recommendation_feed_engagement_total{action="click"}[30m]))
          / (sum(rate(recommendation_feed_impressed_total[30m])) + 0.001) < 0.05
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 CTR < 5%"
          description: "七态 click / impressed 点击率 {{ $value | humanizePercentage }}，低于商用成熟度 SLO（click_through_rate>=0.05），排查召回/排序/曝光质量。"

      - alert: RecommendationCompletionRateLow
        expr: |
          sum(rate(recommendation_feed_completion_total[1h]))
          / (sum(rate(recommendation_feed_impressed_total[1h])) + 0.001) < 0.35
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐内容完成率 < 35%"
          description: "深度消费/播放完成 / impressed 完成率 {{ $value | humanizePercentage }}，低于 SLO（completion_rate>=0.35），可能存在内容质量或曝光-内容匹配问题。"

      - alert: RecommendationNegativeFeedbackRateHigh
        expr: |
          sum(rate(recommendation_feed_negative_feedback_total[1h]))
          / (sum(rate(recommendation_feed_impressed_total[1h])) + 0.001) > 0.08
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐负反馈率 > 8%"
          description: "dislike/report/hide 等负反馈 / impressed 占比 {{ $value | humanizePercentage }}，超出 SLO（negative_feedback_rate<=0.08）。"

      - alert: TagFeedbackConsumerLagHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(content_tag_feedback_fact_consumer_lag_seconds_bucket[10m])) by (le)
          ) > 30
        for: 10m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "显式标签反馈投影 P95 时延 > 30s"
          description: "TagFeedbackRecorded 从 tag-service 到 content-service 特征提交的 P95 时延为 {{ $value | humanizeDuration }}；检查 Redis PEL、Mongo inbox 与消费者健康。"

      - alert: TagFeedbackConsumerFailuresSustained
        expr: sum(rate(content_tag_feedback_fact_consumer_total{result="failed"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "显式标签反馈消费者持续失败"
          description: "TagFeedbackRecorded 消费扫描持续失败；事实保留在 Redis PEL 以供 reclaim，但必须在 stream 保留期前恢复。"

      - alert: RecommendationAttributionUnknownRateHigh
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{channel="unknown",recall_path="unknown"}[10m]))
          / (sum(rate(recommendation_behavior_by_attribution_total[10m])) + 0.001) > 0.05
        for: 15m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐归因 unknown rate > 5%"
          description: "P0+ bounded attribution 丢失占比 {{ $value | humanizePercentage }}，低于 recommendation_attribution_bucket_coverage>=0.95 的商用门槛。"

      - alert: RecommendationAttributionNegativeFeedbackBySupplySourceHigh
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{state="negative",supply_source!="unknown"}[30m])) by (channel, vertical, supply_source)
          / clamp_min(sum(rate(recommendation_behavior_by_attribution_total{state="impressed",supply_source!="unknown"}[30m])) by (channel, vertical, supply_source), 0.001) > 0.08
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐负反馈按供给来源异常（{{ $labels.channel }}/{{ $labels.vertical }}/{{ $labels.supply_source }}）"
          description: "bounded attribution 负反馈率 {{ $value | humanizePercentage }} 超过 8%，需排查 UGC/数据工程供给质量、审核准入或场景路由。"

      - alert: RecommendationAttributionCTRByRecallPathLow
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{state="click",recall_path!="unknown"}[30m])) by (channel, vertical, recall_path)
          / clamp_min(sum(rate(recommendation_behavior_by_attribution_total{state="impressed",recall_path!="unknown"}[30m])) by (channel, vertical, recall_path), 0.001) < 0.03
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 CTR 按召回路径低于 3%（{{ $labels.channel }}/{{ $labels.vertical }}/{{ $labels.recall_path }}）"
          description: "bounded attribution CTR {{ $value | humanizePercentage }} 低于 recall_path 分桶护栏，需排查协同召回、热门、新内容或兜底召回质量。"

      - alert: RecommendationScenarioConsumptionRateLow
        expr: |
          sum(rate(recommendation_behavior_by_attribution_total{state=~"click|dwell",channel=~"travel|premium_stream"}[30m])) by (channel)
          / clamp_min(sum(rate(recommendation_feed_served_by_attribution_total{channel=~"travel|premium_stream"}[30m])) by (channel), 0.001) < 0.02
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐旅行/精品场景消费率低于 2%（{{ $labels.channel }}）"
          description: "travel 或 premium_stream 的 click/dwell 相对 served 消费率 {{ $value | humanizePercentage }} 过低，可能场景路由、精品排序预设或内容池质量退化。"

      - alert: RecommendationSupplySourceShareImbalance
        expr: |
          min(sum(rate(recommendation_feed_served_by_attribution_total{supply_source=~"ugc|data_engineering"}[1h])) by (supply_source))
          / clamp_min(sum(rate(recommendation_feed_served_by_attribution_total{supply_source=~"ugc|data_engineering"}[1h])), 0.001) < 0.05
        for: 1h
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "推荐 UGC/数据工程供给 share 失衡"
          description: "UGC 与 data_engineering 中较低一侧 served share {{ $value | humanizePercentage }} 低于 5%，需排查供给投影、质量分准入或路由配比。"

  - name: quwoquan_search
    # 搜索 SLO 告警（SLI/SLO 真相源：quwoquan_service/services/search-service/
    # quwoquan_service/services/search-service/observability/slo/search_slo.yaml）。延迟用 histogram 取分位数，按 AB
    # bucket label 可切分；通用 HighErrorRate/HighP95Latency 已按 service 覆盖可用性，
    # 这里补搜索特有的检索延迟、零结果率与降级率。
    rules:
      - alert: SearchRetrieveLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(search_retrieve_duration_seconds_bucket[5m])) by (le)
          ) > 0.4
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索检索 P99 延迟 > 400ms"
          description: "search-service /search P99 = {{ $value | humanizeDuration }}，超出 SLO（p99_ms=400）。"

      - alert: SearchZeroResultRateHigh
        expr: |
          sum(rate(search_retrieve_zero_results_total[10m]))
          / (sum(rate(search_retrieve_requests_total{status="ok"}[10m])) + 0.001) > 0.15
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索零结果率 > 15%"
          description: "成功检索中零结果占比 {{ $value | humanizePercentage }}，超出 SLO（zero_result_rate<=0.15），可能召回或归一化退化。"

      - alert: SearchDegradeRateHigh
        expr: |
          sum(rate(search_retrieve_degraded_total[5m]))
          / (sum(rate(search_retrieve_requests_total{status="ok"}[5m])) + 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索降级率 > 5%"
          description: "携带受控依赖降级信号的检索占比 {{ $value | humanizePercentage }}，超出 SLO（degrade_rate<=0.05）；生产召回不允许切换第二 backend。"

      - alert: SearchAvailabilityLow
        expr: |
          sum(rate(search_retrieve_requests_total{status="error"}[5m]))
          / (sum(rate(search_retrieve_requests_total[5m])) + 0.001) > 0.005
        for: 5m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "搜索检索错误率 > 0.5%（可用性 < 99.5%）"
          description: "search-service 检索错误率 {{ $value | humanizePercentage }}，跌破可用性 SLO（0.995）。"

      - alert: SearchLoadShedRateHigh
        # 背压边界主动 shed（in-flight 满）占比。受控 503 退化，超阈值=实例饱和需扩容。
        # SLI load_shed_rate（search_slo.yaml，objective_max=0.01）。
        expr: |
          sum(rate(search_retrieve_load_shed_total[5m]))
          / (sum(rate(search_retrieve_requests_total[5m]))
             + sum(rate(search_retrieve_load_shed_total[5m])) + 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索背压 shed 率 > 1%（实例饱和）"
          description: "search-service in-flight 背压 shed 占比 {{ $value | humanizePercentage }}，超出 SLO（load_shed_rate<=0.01）；需水平扩实例或排查下游变慢。"

      - alert: SearchInflightSaturationHigh
        # 在途并发饱和度（current inflight 接近 SEARCH_MAX_INFLIGHT=256）。持续高位即扩容触发，
        # 早于 load-shed 出现。SLI inflight_saturation（search_slo.yaml，objective_max=256）。
        expr: max(search_retrieve_inflight) > 230
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "搜索在途并发持续逼近上限（>230/256）"
          description: "search-service 在途并发 {{ $value }} 持续 > 230（上限 256，≈90%），即将触发 load-shed，应提前扩容。"

      - alert: SearchFeedbackSignalDeliveryLagHigh
        expr: max(search_feedback_signal_relay_oldest_pending_age_seconds) > 30
        for: 5m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "搜索点击推荐信号待投递时延 > 30s"
          description: "已提交 click 事实到 durable recommendation stream 的最老待投递时延为 {{ $value | humanizeDuration }}；检查 Mongo relay checkpoint 与 Redis stream。"

      - alert: SearchFeedbackSignalRelayFailuresSustained
        expr: |
          sum(rate(search_feedback_signal_relay_outcomes_total{outcome=~"read_error|publish_error|ack_error|invalid_fact"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          layer: l2
        annotations:
          summary: "搜索反馈信号 relay 持续失败"
          description: "反馈事实 relay 持续出现读取、发布、确认或事实校验失败；稳定 signalId 可重放，但需在保留期前恢复。"

  - name: quwoquan_intersection
    # 交集统一体验 SLO 告警（SLI/SLO 真相源：quwoquan_service/services/content-service/
    # configs/observability/intersection_slo.yaml）。HTTP 延迟/可用性走 http_server_*
    # 中间件按 route 过滤；业务漏斗走 content-service intersection_* 计数器。延迟用
    # histogram 取分位数（禁止算术平均），阈值与 SLO objective 对齐。
    rules:

      - alert: IntersectionRepeatExposureRateHigh
        expr: |
          sum(rate(intersection_feed_candidates_total{rank_state="seen"}[30m]))
          / (sum(rate(intersection_feed_candidates_total[30m])) + 0.001) > 0.20
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集重复曝光率 > 20%"
          description: "spotlight 候选窗中命中跨会话冷却记忆窗（seen）占比 {{ $value | humanizePercentage }}，超出 SLO（repeat_exposure_rate<=0.20），换新不足或冷却窗失效。"

      - alert: IntersectionFreshnessFilterRateHigh
        expr: |
          sum(rate(intersection_feed_filtered_total{reason="stale"}[30m]))
          / (sum(rate(intersection_feed_candidates_total[30m])) + sum(rate(intersection_feed_filtered_total[30m])) + 0.001) > 0.30
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集保鲜过滤率 > 30%"
          description: "Feed 候选因过保鲜被过滤占比 {{ $value | humanizePercentage }}，超出 SLO（freshness_filter_rate<=0.30），读模型 freshness TTL 或重算滞后。"

      - alert: IntersectionDisplayIncompleteRateHigh
        expr: |
          sum(rate(intersection_feed_filtered_total{reason="display_incomplete"}[30m]))
          / (sum(rate(intersection_feed_candidates_total[30m])) + sum(rate(intersection_feed_filtered_total[30m])) + 0.001) > 0.10
        for: 30m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集展示不完备率 > 10%"
          description: "Feed 候选因缺 primaryText/头像被空窗治理过滤占比 {{ $value | humanizePercentage }}，超出 SLO（display_incomplete_rate<=0.10），Explain 管线或读模型数据缺口。"

      - alert: IntersectionRedisDegradedHigh
        expr: |
          sum(rate(intersection_redis_degraded_total[5m])) by (op) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "交集 Redis 降级速率偏高（op={{ $labels.op }}）"
          description: "交集 Redis 降级速率 {{ $value }}/s（op={{ $labels.op }}）超出 SLO（redis_degraded_rate<=0.05）。Redis 可能不可用——读位已由 rm_intersection_watermark 持久兜底、主请求未阻断，但应尽快恢复 Redis 以回到热路径。"

      - alert: IntersectionVisitClearErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="content-service", route="/content/intersections/visit", status!~"2.."}[10m]))
          / (sum(rate(http_server_requests_total{service="content-service", route="/content/intersections/visit"}[10m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: intersection
        annotations:
          summary: "交集清红点（MarkIntersectionsVisited）错误率 > 2%"
          description: "已读水位推进失败率 {{ $value | humanizePercentage }}。端侧降级容忍不阻断列表，但红点无法清零；检查 rm_intersection_watermark Mongo 写路径。"

  - name: quwoquan_l2_ops_objects
    rules:
      # B9 运营对象核心链路：visit 计数、config 变更事件投递、experiment 控制面。
      - alert: OpsVisitRecordErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="product-ops-service", route="/ops/visits", status!~"2.."}[10m]))
          / (sum(rate(http_server_requests_total{service="product-ops-service", route="/ops/visits"}[10m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: product-ops
        annotations:
          summary: "访问计数上报（RecordVisit）错误率 > 2%"
          description: "当前非 2xx 比率 {{ $value | humanizePercentage }}。端侧有 200 条补传队列兜底；检查 Mongo visit_records 写入与 Redis 幂等台账。"

      - alert: PgOutboxDispatchFailuresSustained
        expr: |
          sum(rate(pg_outbox_dispatch_failures_total[10m])) by (table) > 0
        for: 15m
        labels:
          severity: critical
          layer: l2
          domain: ops-outbox
        annotations:
          summary: "outbox 事件投递持续失败（table={{ $labels.table }}）"
          description: "事务 outbox（product_ops_outbox / platform_ops_outbox）发布持续失败并进入退避重试；事件滞留可恢复但需尽快检查 Redis 事件总线与 publisher 凭据，防止 ConfigLayerValueSet / ExperimentRolloutUpdated 长期滞留。"

      - alert: ControlPlaneConfigWriteErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="platform-ops-service", route=~"/control-plane/platform/configs/.*", status=~"5.."}[10m]))
          / (sum(rate(http_server_requests_total{service="platform-ops-service", route=~"/control-plane/platform/configs/.*"}[10m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: platform-ops
        annotations:
          summary: "ConfigLayer 控制面 5xx 比率 > 5%"
          description: "UpdateServiceConfig/Resolve 服务端错误率异常；检查 PostgreSQL platform_config_layers CAS 提交与 generated guard。"

  - name: quwoquan_l4_infrastructure
    rules:
      - alert: HighGoroutineCount
        expr: go_goroutines > 5000
        for: 5m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "实例 {{ $labels.instance }} goroutine 数 > 5000"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 512
        for: 5m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "实例 {{ $labels.instance }} RSS > 512MB"

      - alert: HighFDUsage
        expr: process_open_fds / process_max_fds > 0.8
        for: 5m
        labels:
          severity: critical
          layer: l4
        annotations:
          summary: "实例 {{ $labels.instance }} FD 使用率 > 80%"

      # ===== 主机（node-exporter）：整体负荷与毛刺 =====
      - alert: HostCPUHigh
        expr: |
          100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "主机 CPU 平均利用率 > 85%（10m）"
          description: "prod-hosted 主机整体负荷过高（当前 {{ $value | printf \"%.1f\" }}%），先看 podman-exporter 容器分布定位吃 CPU 的服务。"

      - alert: HostCPUSpike
        expr: |
          100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 95
        for: 2m
        labels:
          severity: critical
          layer: l4
        annotations:
          summary: "主机 CPU 毛刺 > 95%（1m 窗口持续 2m）"

      - alert: HostMemoryHigh
        expr: |
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: critical
          layer: l4
        annotations:
          summary: "主机内存使用率 > 90%"

      - alert: HostDiskAlmostFull
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels:
          severity: critical
          layer: l4
        annotations:
          summary: "磁盘 {{ $labels.mountpoint }} 使用率 > 85%"

      - alert: HostNetworkErrorSpike
        expr: |
          sum(rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "主机网络错误速率 > 10/s（收发合计）"

      # ===== 容器（podman-exporter）：单实例负荷 =====
      - alert: ContainerMemoryHigh
        expr: |
          podman_container_mem_usage_bytes / (podman_container_mem_limit_bytes > 0) > 0.9
        for: 10m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "容器 {{ $labels.name }} 内存使用超限 90%"

      # ===== 数据面（mongodb / postgres / redis exporter） =====
      - alert: DataPlaneExporterDown
        expr: |
          up{job=~"mongodb-exporter|postgres-exporter|redis-exporter|node-exporter|podman-exporter"} == 0
        for: 5m
        labels:
          severity: critical
          layer: l4
        annotations:
          summary: "基础设施 exporter {{ $labels.job }} 不可达"

      - alert: MongoConnectionsHigh
        expr: mongodb_ss_connections{conn_type="current"} > 800
        for: 10m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "MongoDB 当前连接数 > 800"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 80
        for: 10m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "Postgres 活跃连接数 > 80"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
          layer: l4
        annotations:
          summary: "Redis 内存使用超 maxmemory 90%"

  - name: quwoquan_content_flywheel
    rules:
      - alert: InterestRecomputeErrorRateHigh
        expr: |
          sum(rate(quwoquan_interest_profile_recompute_total{result="error"}[5m]))
          / (sum(rate(quwoquan_interest_profile_recompute_total[5m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "兴趣画像派生失败率 > 5%"
          description: "content-service InterestProfileAggregator 重算失败 {{ $value | humanizePercentage }}，飞轮上游派生环节受损"

      - alert: InterestProjectionFailures
        expr: |
          sum(rate(quwoquan_interest_projection_total{result=~"parse_error|write_error"}[5m])) by (result) > 0
        for: 5m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "user 域兴趣投影持续失败（{{ $labels.result }}）"
          description: "InterestProfileProjector 消费 UserInterestRecomputed 写 rm_user_profile_view 失败，CQRS 双路投影出现裂口"

      - alert: InterestProjectionFreshnessLagHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_interest_projection_freshness_lag_seconds_bucket[5m])) by (le)
          ) > 900
        for: 15m
        labels:
          severity: warning
          layer: l2
        annotations:
          summary: "兴趣投影新鲜度滞后 P95 > 15min"
          description: "画像 recomputedAt 到投影落库滞后过大，对外画像 API 与小艺主动触达读到陈旧画像"

  - name: quwoquan_entity_homepage
    # 实体主页 introduction 读路径 + homepage-import 导入观测（SLI/SLO 真相源：
    # quwoquan_service/services/entity-service/observability/slo/homepage_introduction_slo.yaml）。
    # HTTP 延迟/可用性走 http_server_* 中间件按 route 过滤；导入观测走 homepage-import
    # --metrics-textfile 落的 node_exporter textfile 指标（离线批任务标准通道）。
    rules:




      - alert: HomepageImportIssuesPresent
        expr: |
          max(quwoquan_homepage_import_objects{result="issues"}) by (env) > 0
        for: 5m
        labels:
          severity: warning
          layer: l1
        annotations:
          summary: "homepage-import 最近一次导入存在 issues（env={{ $labels.env }}）"
          description: "qwq-data ship → entity-service homepage-import 报告 issues={{ $value }}，introduction 投影可能缺对象闭包或 CAS；核对 .qwq_output/env/{{ $labels.env }}/data-release/<releaseId>/runs/<runId>/import-homepage.json。"

      - alert: HomepageImportStale
        expr: |
          (time() - max(quwoquan_homepage_import_last_success_timestamp_seconds) by (env)) > 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          layer: l1
        annotations:
          summary: "homepage-import 超过 7 天未成功（env={{ $labels.env }}）"
          description: "环境主页读模型快照可能过期；数据发布链（promote→ship→homepage-import）停摆或 textfile collector 未接入。"

  # 助手域对象级告警：消费 assistant-service 本地 contracts 声明的 operation SLO
  # （run 1.5s/99.9%、conversation 500ms/99.9%、SSE 首事件 2s、consent/subscription 500ms）。
  - name: quwoquan_l2_assistant_recordings
    # recording rules：从 assistant_grounding_total 派生 context-grounded-answering
    # 规格所需的 assistant_grounding_success_rate。
    rules:
      - record: assistant_grounding_success_rate
        expr: |
          sum(rate(assistant_grounding_total{outcome="success"}[5m]))
          / (sum(rate(assistant_grounding_total[5m])) + 0.000001)

  - name: quwoquan_l2_assistant_objects
    rules:


      - alert: AssistantConsentUnavailable
        expr: |
          sum(rate(http_server_requests_total{service="assistant-service", route=~"/assistant/consents|/assistant/skills/.*/consent", status="503"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "consent 服务持续 503（fail-closed 生效中）"
          description: "PG skill_consents 不可用会让全部敏感能力按未授权拒绝；检查 postgres 连接与 consent store 迁移。"

      - alert: AssistantSubscriptionCronStalled
        expr: |
          sum(increase(assistant_subscription_cron_tick_total{outcome="succeeded"}[30m])) == 0
        for: 30m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "订阅调度 tick 30 分钟内无成功执行"
          description: "主动订阅投递停摆；检查 assistant-service 内置 scheduler、Mongo deliveryState 与 Redis 租约（assistant:subscription:lease:*）。"

      - alert: AssistantSubscriptionDeliveryFailureRateHigh
        expr: |
          sum(rate(assistant_subscription_delivery_attempt_total{outcome="failed"}[15m]))
          / (sum(rate(assistant_subscription_delivery_attempt_total[15m])) + 0.001) > 0.05
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "主动订阅外部投递失败率连续 15 分钟 > 5%"
          description: "检查 user-service 投递策略、notification/chat 下游、模型执行与 Mongo deliveryState；失败会保留 deliveryId 并按退避补偿。"

      # 小趣业务级告警对应 runtime-assistant 的 grounding、mentioned consumer
      # 与 proactive subscription 规格；指标由 assistant-service 业务链路产出。
      - alert: AssistantMentionedConsumerDLQBacklog
        expr: |
          sum(increase(assistant_mentioned_consumer_dlq_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "@小趣 群聊消费 DLQ 持续积压"
          description: "events.chat.assistant_mentions.dlq 15 分钟内有新增死信；检查 chat grounding 拉取、模型执行与 SendMessage 回投链路后重放 DLQ。"

      - alert: AssistantGroundingSuccessRateLow
        expr: |
          avg_over_time(assistant_grounding_success_rate[30m]) < 0.95
        for: 30m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 grounding 成功率 < 95%"
          description: "上下文注入/引用生成成功率低于商用 SLO；检查 page-context Redis、检索工具与证据接纳链路，必要时按 grounding feature flag 降级为通用回答。"

      - alert: AssistantFirstVisibleResponseP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(assistant_first_visible_response_ms_bucket[5m])) by (le)
          ) > 3000
        for: 30m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣首个可见响应 P95 > 3s"
          description: "@小趣/私助提问到首个可见回答超商用 SLO（p95≤3s）；检查模型网关时延、技能选择阶段与 SSE 转发。"

      - alert: AssistantRunWorkerRecoveryFailed
        expr: |
          sum(increase(assistant_run_worker_claim_total{outcome="failed"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣持久 Run Worker 接管失败"
          description: "检查 assistant_run_work_queue claim/heartbeat、fencing token、Mongo CAS 与 checkpoint；不得把未验证恢复的 Run 标记完成。"

      - alert: AssistantRunCheckpointStale
        expr: |
          histogram_quantile(0.95,
            sum(rate(assistant_run_checkpoint_age_seconds_bucket[15m])) by (le)
          ) > 30
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣恢复 Checkpoint P95 年龄 > 30s"
          description: "检查 Worker 心跳、过期 claim 扫描、队列积压与 checkpoint 提交；目标为失联后 30 秒内接管。"

      - alert: AssistantRunCancelP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(assistant_run_cancel_duration_seconds_bucket{outcome="succeeded"}[15m])) by (le)
          ) > 10
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 Run 取消收敛 P95 > 10s"
          description: "检查 AgentLoop 上下文取消、Tool/Subagent AwaitStopped 与 terminal active-item 不变量。"

      - alert: AssistantPublicWebAvailabilityLow
        expr: |
          sum(rate(assistant_public_web_tool_total{tool=~"web_open|web_find",outcome="succeeded"}[15m]))
          / clamp_min(sum(rate(assistant_public_web_tool_total{tool=~"web_open|web_find",outcome=~"succeeded|fetch_unavailable|budget_unavailable|evidence_unavailable|failed"}[15m])), 0.001) < 0.99
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣公开网页读取可用率低于 99%"
          description: "安全拒绝与预算耗尽已排除；检查 Public Web Fetch Runtime、DNS/TLS、上游站点和 assistant_run_web_evidence。"

      - alert: AssistantPublicWebEvidenceUnavailable
        expr: |
          sum(increase(assistant_public_web_policy_boundary_total{reason="web_evidence_unavailable"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣网页证据账本不可用"
          description: "已抓取证据无法安全提交或读取；检查 Mongo assistant_run_web_evidence 索引、容量与写关注，在恢复前不得声称该证据已留存。"

      - alert: AssistantPublicWebSafetyRejectionSpike
        expr: |
          sum(rate(assistant_public_web_policy_boundary_total{reason="web_target_rejected"}[10m])) > 1
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣公开网页安全拒绝持续升高"
          description: "检查是否出现内网探测、重定向逃逸、危险端口或错误 Skill 链接；指标不包含 URL、Host、IP 等敏感标签。"

      - alert: AssistantRunLeaseContentionHigh
        expr: |
          sum(rate(assistant_run_lease_contention_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 Run lease 竞争持续升高"
          description: "claim、heartbeat、complete 或 fencing 冲突超过阈值；检查 Worker 实例时钟、租约和 Mongo CAS。"

      - alert: AssistantRunCompletionRejectedHigh
        expr: |
          sum(rate(assistant_run_completion_rejected_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 Run 完成校验拒绝持续升高"
          description: "Verifier、TaskGraph 或 active item 不变量阻止完成；不得绕过校验强制写 completed。"

      - alert: AssistantPresentationProjectionFailed
        expr: |
          sum(increase(assistant_presentation_projection_total{outcome="failed"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 Adaptive Presentation 投影失败"
          description: "presentation snapshot 或 commit 未进入 canonical Run journal；检查 CAS、document schema 与终态顺序。"

      - alert: AssistantPresentationFallbackRateHigh
        expr: |
          sum(rate(ops_app_experience_events_total{event_type="assistant_turn_quality",result="presentation_fallback"}[15m]))
          / clamp_min(sum(rate(assistant_presentation_projection_total{phase="commit",outcome="succeeded"}[15m])), 0.001) > 0.01
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 Adaptive Presentation fallback 超过 1%"
          description: "App 因未知节点、非法文档、action 不可达或渲染失败频繁降级；fallback 仍须非空且不得执行未知动作。"

      - alert: AssistantContextDependencyUnavailable
        expr: |
          sum(rate(assistant_context_resolution_total{outcome=~"resolver_unavailable|dependency_unavailable"}[10m])) > 0.01
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 Skill Context 依赖不可用"
          description: "Context Resolver 或权威 Reader 依赖不可用率升高；检查 source ref、预算和服务连接。"

      - alert: AssistantContextConsentFailClosed
        expr: |
          sum(increase(assistant_context_privacy_rejection_total{reason="consent_unavailable"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣 Skill Context Consent 不可用"
          description: "Consent 检查不可用且已 fail-closed；检查授权存储，恢复前不得放宽敏感 Context。"

      - alert: AssistantWrongDestinationIncident
        expr: |
          sum(increase(assistant_wrong_destination_incidents_total[5m])) > 0
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "小趣主动投递出现错发（P0）"
          description: "投递目的地校验失败计数非零：可能把订阅产出发给了错误用户/会话。立即暂停内部 tick 调度并审计 SkillSubscription destination 与 user/chat 授权链。"

  - name: quwoquan_l2_chat_objects
    rules:
      - alert: ChatMessageSendErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="chat-service", route=~"/chat/conversations/[^/]+/messages", method="POST", status!~"2.."}[5m]))
          / (sum(rate(http_server_requests_total{service="chat-service", route=~"/chat/conversations/[^/]+/messages", method="POST"}[5m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: chat
        annotations:
          summary: "chat SendMessage 错误率连续两个窗口 > 2%"
          description: "metric chat_message_send；发送失败直接打断消息主旅程，检查 Mongo 事务/幂等回执与关系 gate 依赖。"



      - alert: ChatMessageListErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="chat-service", route=~"/chat/conversations/[^/]+/messages", method="GET", status!~"2.."}[5m]))
          / (sum(rate(http_server_requests_total{service="chat-service", route=~"/chat/conversations/[^/]+/messages", method="GET"}[5m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: chat
        annotations:
          summary: "chat ListMessages 错误率连续两个窗口 > 2%"
          description: "metric chat_message_list；历史消息拉取失败会阻断会话页首屏与 gap 补全。"





      - alert: ChatProjectionOrOutboxRelayUnhealthy
        expr: |
          runtime_health_check_status{instance=~"chat-service(:[0-9]+)?",check=~"(message|conversation|membership|user_state)_outbox_relay|inbox_projection"} == 0
        for: 2m
        labels:
          severity: critical
          layer: l2
          domain: chat
        annotations:
          summary: "chat 投影/Outbox {{ $labels.check }} 持续不健康"
          description: "消息实时投递或 Inbox 未读/排序投影可能停滞；检查 checkpoint、Mongo outbox 与 realtime Redis scene。"

      - alert: ChatMentionCommandFailureRateHigh
        expr: |
          sum(rate(chat_mention_command_total{result="failed"}[10m]))
          / clamp_min(sum(rate(chat_mention_command_total[10m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: chat
        annotations:
          summary: "chat 带 @ 消息命令失败率 > 2%"
          description: "用户 @ 或 @全体消息提交失败率超过预算；检查成员关系验证、消息事务与命令幂等回执。指标仅按 all/members 分桶，不含成员或会话标识。"

      - alert: ChatReadWatermarkCommandFailureRateHigh
        expr: |
          sum(rate(chat_read_watermark_command_total{result="failed"}[10m]))
          / clamp_min(sum(rate(chat_read_watermark_command_total[10m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: chat
        annotations:
          summary: "chat 已读水位推进失败率 > 2%"
          description: "已读水位命令连续失败会造成未读数和回执停滞；检查 ConversationUserState 事务、成员校验与客户端重试。"

      - alert: ChatInboxProjectionLagHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(chat_inbox_projection_event_lag_seconds_bucket[10m])) by (le)
          ) > 5
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: chat
        annotations:
          summary: "chat Inbox 投影事件 P95 延迟超过 5 秒"
          description: "MessageSent 到未读/排序投影的 P95 延迟超过商业预算；检查 Message outbox checkpoint、Mongo 读写与 projector 消费循环。"

      - alert: ChatInboxProjectionDrainFailures
        expr: sum(increase(chat_inbox_projection_drain_total{result="failed"}[10m])) > 0
        for: 2m
        labels:
          severity: critical
          layer: l2
          domain: chat
        annotations:
          summary: "chat Inbox 投影 drain 出现失败"
          description: "Inbox projector 读取、应用或保存 checkpoint 失败；未读和排序会滞后，需检查失败日志后恢复并验证 checkpoint 前进。"

      - alert: ChatProjectionOrOutboxSignalStale
        expr: |
          time() - runtime_health_check_last_success_timestamp_seconds{instance=~"chat-service(:[0-9]+)?",check=~"(message|conversation|membership|user_state)_outbox_relay|inbox_projection"} > 30
        for: 2m
        labels:
          severity: warning
          layer: l2
          domain: chat
        annotations:
          summary: "chat 投影/Outbox {{ $labels.check }} 成功信号超过 30 秒未刷新"
          description: "health 检查未能持续证明 relay/projector 前进；检查 health scraper 与对应 goroutine。"

      - alert: ChatSyncHintToPullLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_runtime_media_sync_hint_to_pull_delay_ms_bucket{instance=~"chat-service(:[0-9]+)?"}[10m])) by (le)
          ) > 500
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: chat
        annotations:
          summary: "chat durable sync hint-to-pull P95 超过 500ms"
          description: "客户端从 realtime hint 到 durable patch 拉取的观测延迟超预算；检查 realtime-gateway、Redis realtime scene 与 App 补拉调度。"

      - alert: ChatSyncPatchFanoutFailureRateHigh
        expr: |
          sum(rate(quwoquan_runtime_media_sync_patch_fanout_total{instance=~"chat-service(:[0-9]+)?",result="failure"}[10m]))
          / clamp_min(sum(rate(quwoquan_runtime_media_sync_patch_fanout_total{instance=~"chat-service(:[0-9]+)?"}[10m])), 1e-9) > 0.01
        for: 5m
        labels:
          severity: critical
          layer: l2
          domain: chat
        annotations:
          summary: "chat durable sync hint fanout 失败率 > 1%"
          description: "patch 已持久化但 realtime hint 投递失败；客户端只能依赖周期补拉，检查 realtime Redis 与网关订阅。"

      - alert: ChatSyncRequiresResync
        expr: |
          increase(quwoquan_runtime_media_sync_requires_resync_total{instance=~"chat-service(:[0-9]+)?"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
          layer: l2
          domain: chat
        annotations:
          summary: "chat durable sync 出现 patch gap，需要全量重同步"
          description: "检查 patch TTL、Redis 数据丢失和客户端 afterSeq 水位；该指标正常应为 0。"



  - name: quwoquan_l2_notification_inbox
    rules:
      - alert: AppMessageCreateErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="notification-service", route="/internal/app-messages", status!~"2.."}[5m]))
          / (sum(rate(http_server_requests_total{service="notification-service", route="/internal/app-messages"}[5m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: notification
        annotations:
          summary: "CreateAppMessage 错误率连续两个窗口 > 2%"
          description: "互动通知写入通道退化；检查 app_messages Mongo transaction 与 idempotency 索引（metric notification_app_message_create）。"


      - alert: InteractionNotificationDLQGrowing
        expr: |
          sum(rate(redis_stream_length{stream=~"events\\..*\\.notification-dlq"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          layer: l2
          domain: notification
        annotations:
          summary: "互动通知 DLQ 持续增长"
          description: "七源事件投影连续失败并进入 dead-letter；检查 interaction_notification_failures 与事件 payload 契约（接收者字段缺失）。"

  - name: quwoquan_l2_integration_external
    rules:
      - alert: ExternalInteractionSubmitErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="integration-service", route="/integrations/external-requests", status!~"2.."}[5m]))
          / (sum(rate(http_server_requests_total{service="integration-service", route="/integrations/external-requests"}[5m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: integration
        annotations:
          summary: "SubmitExternalInteractionRequest 错误率连续两个窗口 > 2%"
          description: "外部可靠交互受理退化（metric integration_external_interaction_submit）；检查 typed wire 校验与 reliable task outbox。"

      - alert: ExternalInteractionDeadLettersPresent
        expr: |
          sum(reliable_task_dead_letters{owner_domain="integration"}) > 0
        for: 30m
        labels:
          severity: warning
          layer: l2
          domain: integration
        annotations:
          summary: "外部交互死信 30 分钟未清零"
          description: "provider 连续失败超过重试预算；operator 经 /integrations/external-requests/dead-letters:recover 补偿并核对 provider 凭据。"

  - name: quwoquan_l2_rtc_call
    rules:

      - alert: RtcCallInitiateErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="rtc-service", route="/rtc/calls", status!~"2.."}[5m]))
          / (sum(rate(http_server_requests_total{service="rtc-service", route="/rtc/calls"}[5m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: rtc
        annotations:
          summary: "InitiateCall 错误率连续两个窗口 > 2%"
          description: "发起通话退化（metric rtc_call_lifecycle_command）；检查关系门禁、活跃通话去重与 LiveKit token 签发。"

      - alert: RtcAccountSecurityConsumerDeadLettered
        expr: |
          (
            sum(increase(rtc_account_security_consumer_total{outcome="dlq"}[5m])) > 0
          )
          or
          (
            sum(increase(rtc_account_security_consumer_total{outcome="held_for_recovery"}[5m])) > 0
          )
        for: 1m
        labels:
          severity: critical
          layer: l2
          domain: rtc
        annotations:
          summary: "RTC 账号安全终态存在待恢复 DLQ"
          description: "原 events.user.account PEL 被 terminal marker 持有；修复依赖后只能释放原 stream 坐标重试，并验证 CallSession、ticket 与 media room access 均已撤销。"

      - alert: LiveKitMetricsUnavailable
        expr: up{job="livekit-sfu"} == 0
        for: 2m
        labels:
          severity: critical
          layer: l2
          domain: rtc
        annotations:
          summary: "LiveKit SFU 指标端点不可达"
          description: "媒体面无法观测且通话可能不可用；检查 livekit-sfu:6789、固定配置挂载和 edge-media workload。"

      - alert: LiveKitPacketLossP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(livekit_packet_loss_percent_bucket{job="livekit-sfu"}[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: rtc
        annotations:
          summary: "LiveKit 媒体流 P95 丢包率持续高于 2%"
          description: "检查 SFU 节点带宽、UDP 7882、TURN 路径与宿主网络；不得仅以 rtc-service HTTP 健康替代媒体面诊断。"

      - alert: LiveKitMedianQualityLow
        expr: |
          histogram_quantile(0.5,
            sum(rate(livekit_quality_score_bucket{job="livekit-sfu"}[5m])) by (le)
          ) < 3
          and on()
          sum(rate(livekit_quality_score_count{job="livekit-sfu"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: rtc
        annotations:
          summary: "LiveKit 媒体质量中位分持续低于 3"
          description: "真实媒体样本质量退化；结合 rtc_media_qoe 的建连、重连与终止原因下钻，不把 SFU 指标冒充端侧首帧事实。"

  - name: quwoquan_l2_realtime_gateway
    rules:
      - alert: RealtimeTicketRejectRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="realtime-gateway", route="/realtime/tickets", status!~"2.."}[5m]))
          / (sum(rate(http_server_requests_total{service="realtime-gateway", route="/realtime/tickets"}[5m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: realtime
        annotations:
          summary: "连接 ticket 签发拒绝率连续两个窗口 > 5%"
          description: "metric realtime_connection_ticket；检查 Bearer 鉴权与 realtime Redis scene 可用性。"

      - alert: RealtimeConnectionUpgradeErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="realtime-gateway", route=~"/realtime/(ws|poll)", status!~"2.."}[5m]))
          / (sum(rate(http_server_requests_total{service="realtime-gateway", route=~"/realtime/(ws|poll)"}[5m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: realtime
        annotations:
          summary: "实时连接升级/轮询错误率连续两个窗口 > 5%"
          description: "metric realtime_connection_session；ticket 消费失败或 Redis 订阅不可用会阻断 chat 实时推送与 rtc 来电信令。"

      - alert: RealtimeAccountSecurityConsumerDeadLettered
        expr: |
          (
            sum(increase(realtime_account_security_consumer_total{outcome="dlq"}[5m])) > 0
          )
          or
          (
            sum(increase(realtime_account_security_consumer_total{outcome="held_for_recovery"}[5m])) > 0
          )
        for: 1m
        labels:
          severity: critical
          layer: l2
          domain: realtime
        annotations:
          summary: "UserAccount 安全终态 consumer 存在待恢复 DLQ"
          description: "事件只以摘要进入 DLQ，原 events.user.account PEL 保持待恢复；立即修复 authority/Redis 依赖后从原 stream 坐标恢复，并验证 ticket、lease 与 presence 已清理。"

      - alert: RealtimeAccountSecurityEvictionPathUnhealthy
        expr: |
          runtime_health_check_status{
            instance=~"realtime-gateway(:[0-9]+)?",
            check=~"account_security_authority|account_security_relay|user_account_security_consumer"
          } == 0
        for: 1m
        labels:
          severity: critical
          layer: l2
          domain: realtime
        annotations:
          summary: "实时账户安全即时断连链路不健康"
          description: "authority、跨节点 relay 或 durable consumer 不健康时，该节点不得继续承接新连接；修复 Redis/authority 后确认 relay 重订阅，并从原 PEL 恢复未完成终态事件。"

  - name: quwoquan_l2_relationship_objects
    rules:
      # B3 关系与个人投影：关注命令、主体关注、打招呼破冰、关注频道读链路。
      - alert: PersonaFollowCommandErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="user-service", route=~"/user/personas/.*/(follow|block)", status!~"2.."}[10m]))
          / (sum(rate(http_server_requests_total{service="user-service", route=~"/user/personas/.*/(follow|block)"}[10m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "用户关注/拉黑命令错误率 > 2%（metric user_persona_relationship_command）"
          description: "当前非 2xx 比率 {{ $value | humanizePercentage }}。检查 persona_relationship PG 事务（advisory lock / receipt / outbox）与 profile 计数联动。"

      - alert: PersonaRelationshipCommandLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(quwoquan_persona_relationship_command_latency_ms_bucket[10m])) by (le)) > 500
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "关注/取关/拉黑/解除拉黑命令 P95 超过 500ms"
          description: "对象级 histogram 已超过 persona_relationship service.yaml SLO；检查 PG pair 锁竞争、receipt 与 outbox 写入，禁止把派生计数恢复到命令路径。"

      - alert: PersonaRelationshipCounterProjectionLagHigh
        expr: |
          histogram_quantile(0.95, sum(rate(quwoquan_persona_relationship_counter_projection_lag_ms_bucket[10m])) by (le)) > 5000
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "关系 follower/following 派生计数投影 P95 延迟超过 5s"
          description: "检查 PersonaRelationship outbox backlog、Redis Stream 发布、counter projector 与 profile cache 失效；命令路径不得恢复同步 COUNT。"

      - alert: PersonaRelationshipConsistencyMismatchDetected
        expr: |
          sum(increase(quwoquan_persona_relationship_events_total{metric=~"persona_relationship_(counter_mismatch|page_drift|filter_mismatch|capability_mismatch)_count"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: user-relationship
        annotations:
          summary: "关系对象计数、分页、过滤或能力位出现一致性漂移"
          description: "该指标应恒为 0；立即核对关系事务、分页过滤顺序、viewer capability 与投影 freshness。"

      - alert: ProfileSubjectReadLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(quwoquan_profile_subject_public_read_latency_ms_bucket[10m])) by (le)) > 500
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "公开用户主页主体读取 P95 超过 500ms"
          description: "主页首屏 TTI 依赖该读取；检查 profile/persona 查询、缓存命中和可见性判定。"

      - alert: PersonaSwitchLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(quwoquan_persona_switch_latency_ms_bucket[10m])) by (le)) > 1500
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "分身切换 P95 超过 1500ms"
          description: "已超过 persona ActivatePersona service.yaml SLO；检查 session context、profile sync 和缓存失效。"

      - alert: SubjectFollowCommandErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="user-service", route=~"/relationships/subjects/.*", status!~"2.."}[10m]))
          / (sum(rate(http_server_requests_total{service="user-service", route=~"/relationships/subjects/.*"}[10m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "主体关注（SubjectFollow）命令错误率 > 2%（metric user_subject_follow_command）"
          description: "主页/圈子/地点关注唯一写入口失败会同时阻断关注频道投影与 homepage follower 计数；检查 subject_follows 事务与 relay。"

      - alert: FollowingSubjectReadErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="user-service", route=~"/user/(following-subjects|followed-subjects/.*)", status!~"2.."}[10m]))
          / (sum(rate(http_server_requests_total{service="user-service", route=~"/user/(following-subjects|followed-subjects/.*)"}[10m])) + 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "关注频道列表/红点水位链路错误率 > 5%（metric user_following_subject_query / user_followed_subject_visit_command）"
          description: "首页关注频道依赖 following_subjects Mongo 投影与 visit 水位；检查 Mongo 可用性与 relay 投影是否滞后。"

      - alert: GreetingCommandErrorRateHigh
        expr: |
          sum(rate(http_server_requests_total{service="user-service", route=~"/user/greeting-request.*", method!="GET", status!~"(2..|409|429)"}[10m]))
          / (sum(rate(http_server_requests_total{service="user-service", route=~"/user/greeting-request.*", method!="GET"}[10m])) + 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: user-relationship
        annotations:
          summary: "打招呼命令错误率 > 2%（metric user_greeting_request_command；409/429 为业务预期不计入）"
          description: "破冰链路（发送/回复/忽略/撤回）失败会阻断陌生人会话升级；检查 greeting receipt/outbox 事务与 chat 会话网关。"

  - name: quwoquan_l2_content_objects
    # operation/contract_metric 由 content_contract/*.yaml 从唯一 ContractGraph 生成；
    # 这些规则消费真实 recording series，不依赖 route 注释或手写 metric 文本。
    rules:




      - alert: ContentFilterCatalogAvailabilityLow
        expr: |
          sum(rate(content_filter_catalog_get_total{outcome=~"unavailable|storage_unavailable"}[5m]))
          / clamp_min(sum(rate(content_filter_catalog_get_total[5m])), 0.001) > 0.001
        for: 5m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "活动滤镜目录可用性低于 99.9%"
          description: "GetActiveFilterCatalog 无 active release 或存储不可用会让图片编辑器无法加载经验证目录；检查 single-active 状态、Redis 缓存失效和 Mongo reader。"

      - alert: ContentFilterCatalogReadLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(content_filter_catalog_operation_duration_seconds_bucket{operation="get"}[5m])) by (le)
          ) > 0.3
        for: 5m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "活动滤镜目录读取 P95 超过 300ms"
          description: "GetActiveFilterCatalog 超出 metadata latency_p95_ms=300；检查 active reader 缓存和 Mongo 查询。"

      - alert: ContentFilterCatalogPublishStorageUnavailable
        expr: |
          sum(rate({__name__=~"content_filter_catalog_(stage|activate|rollback)_total",outcome="storage_unavailable"}[5m])) > 0
        for: 5m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "滤镜目录发布面持续出现存储不可用"
          description: "Stage/Activate/Rollback 的 Mongo 事务或 active cache invalidation 失败；停止发布并以当前 active release 保持端侧目录稳定。"






      - alert: ContentOriginalAccessQuotaGrantServerErrors
        expr: |
          sum(rate(quwoquan_content_contract_operation_requests_total{service="content-service",operation="content.original_access_quota.ReserveOriginalImageAccessGrant",contract_metric="content_media_original_access_request",commercial_status="ready",status=~"5.."}[10m])) by (operation, contract_metric, commercial_status) > 0
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "原图访问额度预留出现持续 5xx"
          description: "ReserveOriginalImageAccessGrant 是 original_access_quota 聚合的唯一写入口；额度耗尽预期 403 不告警，5xx 表示 fail-closed 边界、额度事务或底层存储异常。"

      - alert: ContentOutboundShareFactAppendServerErrors
        expr: |
          sum(rate(quwoquan_content_contract_operation_requests_total{service="content-service",operation="content.outbound_share_fact.AppendOutboundShareFact",contract_metric="content_outbound_share_append",commercial_status="blocked",status=~"5.."}[10m])) by (operation, contract_metric, commercial_status) > 0
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "站外分享事实追加出现持续 5xx"
          description: "blocked 阶段预期 403 不告警；5xx 表示 fail-closed 边界或 append-only 存储异常。"





      - alert: ContentMediaProcessingJobFailureRateHigh
        expr: |
          sum(rate(content_media_processing_jobs_total{result=~"infrastructure_error|record_failed"}[10m]))
          / clamp_min(sum(rate(content_media_processing_jobs_total[10m])), 0.001) > 0.001
        for: 10m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "媒体处理 Worker 失败率超过 0.1%"
          description: "基于 Worker 全链路 job 指标；对象存储、FFmpeg 或结果持久化失败会保留 checkpoint 并重放。"

      - alert: ContentMediaProcessingJobLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(content_media_processing_duration_seconds_bucket{result=~"ready|rejected"}[10m])) by (le)
          ) > 840
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "媒体处理全链路 Job P95 接近 15 分钟超时"
          description: "50 MiB、最长 1 小时视频的处理预算被突破；检查 FFmpeg 容量、对象存储吞吐与 worker CPU。"

      - alert: ContentMediaHLSCMAFPackagingFallbackRateHigh
        expr: |
          (
            sum(rate(content_media_hls_cmaf_packaging_total{result="fallback_progressive"}[15m]))
            / clamp_min(sum(rate(content_media_hls_cmaf_packaging_total[15m])), 0.001)
          ) > 0.05
          and sum(increase(content_media_hls_cmaf_packaging_total[15m])) >= 20
        for: 15m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "HLS/CMAF 打包回退率超过 5%"
          description: "资产仍通过同版本 progressive MP4 可用；检查 FFmpeg 容量、CMAF 产物校验与对象存储写入。"

      - alert: ContentMediaProcessingCompleteToReadyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(content_media_processing_complete_to_ready_seconds_bucket[10m])) by (le)
          ) > 900
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "媒体 upload-complete 到 ready 的 P95 超过 15 分钟"
          description: "按 media_type/input_size_class 下钻，核对 outbox oldest-event age、对象存储、FFmpeg 容量和结果回写。"

      - alert: ContentMediaProcessingOldestOutboxEventHigh
        expr: content_media_processing_outbox_oldest_event_age_seconds > 900
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "媒体 outbox 最旧事件滞留超过 15 分钟"
          description: "Worker 已观测到未消费的 durable event；检查 lease、checkpoint、工作目录容量、对象存储和 FFmpeg。"

      - alert: ContentMediaProcessingDLQAdmissionAgeHigh
        expr: max(content_media_processing_dlq_event_age_seconds) > 300
        for: 1m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "媒体事件进入 DLQ 时已滞留超过 5 分钟"
          description: "这是 DLQ 准入时的年龄，不代表当前时钟年龄；按 poison reason 修复源事实并使用受控重放流程。"

      - alert: ContentPublicationRetryExhausted
        expr: sum(increase(ops_content_publication_events_total{background_retry_terminal="retry_exhausted"}[10m])) > 0
        for: 1m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "内容发布后台重试已耗尽"
          description: "按 content_type、object_state 和 failReasonCode 在 Elasticsearch content_publication_funnel 下钻；不得把终态任务伪装为成功。"

      - alert: ArticleReaderEnterLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(ops_article_reader_enter_duration_seconds_bucket{result="success"}[10m])) by (le)
          ) > 1.2
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "文章阅读器进入 P95 超过 1.2s"
          description: "文章阅读器 SLI 为成功 enter 事件的客户端可用时延；按 Elasticsearch article_reader_lifecycle 的 surfaceId、errorCode 和 recoveryAction 下钻。"

      - alert: ArticleReaderErrorRateHigh
        expr: |
          sum(rate(ops_article_reader_events_total{stage="error",result="failure"}[10m]))
          / clamp_min(sum(rate(ops_article_reader_events_total{stage="enter",result="success"}[10m])), 0.001) > 0.01
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "文章阅读器错误率超过 1%"
          description: "文章阅读器可用性 SLO 为 enter 后无 error 的比例至少 99%；检查 typed Remote failure 的 errorCode 与 recoveryAction。"

      - alert: ArticleReaderRecoveryFailure
        expr: sum(increase(ops_article_reader_events_total{stage="recovery",result="failure"}[10m])) > 0
        for: 2m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "文章阅读器重试恢复失败"
          description: "用户触发的阅读器恢复仍失败；按 Elasticsearch article_reader_lifecycle 的 errorCode 和 recoveryAction 定位 Remote 或数据面问题。"

      - alert: VideoPreviewTrackLoadFailureRateHigh
        expr: |
          sum(rate(ops_video_preview_track_loads_total{result="failure"}[10m]))
          / clamp_min(sum(rate(ops_video_preview_track_loads_total[10m])), 0.001) > 0.01
        for: 10m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "视频预览轨道加载失败率超过 1%"
          description: "核对 CDN manifest、签名/缓存、轨道 descriptor 版本绑定，并通过 Elasticsearch video_preview_track_load 明细定位失败类型。"

      - alert: ContentMediaProcessingWorkerUnhealthy
        expr: |
          runtime_health_check_status{check="content_media_processing_worker"} == 0
        for: 2m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "媒体处理 Worker 持续不健康"
          description: "检查 media outbox/checkpoint、对象存储以及 ffmpeg/ffprobe 运行时；失败期间 checkpoint 不会推进。"

      - alert: ContentMediaProcessingInfrastructureErrors
        expr: |
          sum(rate(content_media_processing_jobs_total{result=~"infrastructure_error|record_failed"}[10m])) > 0
        for: 10m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "媒体处理基础设施错误持续发生"
          description: "对象存储、转码运行时或处理结果持久化失败；对应 MediaAssetCreated 会保留在 checkpoint 后等待重放。"

      - alert: ContentMediaProcessingOutboxBacklog
        expr: |
          max(content_media_processing_outbox_consecutive_full_batches) > 0
        for: 15m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "媒体处理 outbox 连续满批"
          description: "Worker 每批上限为 10；15 分钟未出现非满批扫描，表示消费持续落后。"

      - alert: ContentMediaProcessingPoisonEvent
        expr: |
          sum(increase(content_media_processing_poison_events_total[5m])) > 0
        for: 1m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "媒体处理发现异常 outbox 源事件"
          description: "带有效 cursor 的事件会在推进 checkpoint 前持久化到 media_processing_dead_letters；缺 cursor 的事件会 fail-closed。必须修复源数据并执行受控重放。"

      - alert: ContentMediaProcessingPoisonQuarantineFailed
        expr: |
          sum(increase(content_media_processing_poison_quarantine_failures_total[5m])) > 0
        for: 1m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "媒体处理异常事件无法写入 dead letter"
          description: "Worker 已保持 checkpoint 不推进，后续事件会阻塞等待重试；检查 media_processing_dead_letters 的 Mongo 可用性和唯一索引。"

      - alert: ContentProjectionCheckpointUnhealthy
        expr: |
          runtime_health_check_status{instance=~"content-service(:[0-9]+)?",check=~".*(projection|outbox|lifecycle|count).*"} == 0
        for: 2m
        labels: { severity: critical, layer: l2, domain: content }
        annotations:
          summary: "内容投影/checkpoint {{ $labels.check }} 持续不健康"
          description: "health check 直接调用 relay.Healthy；失败表示 scan 出错或 checkpoint 超过 5 秒未成功推进。"

      - alert: ContentProjectionCheckpointSignalStale
        expr: |
          time() - runtime_health_check_last_success_timestamp_seconds{instance=~"content-service(:[0-9]+)?",check=~".*(projection|outbox|lifecycle|count).*"} > 30
        for: 2m
        labels: { severity: warning, layer: l2, domain: content }
        annotations:
          summary: "内容投影/checkpoint {{ $labels.check }} 成功信号超过 30 秒未刷新"
          description: "检查容器 health probe、relay scan 与底层 checkpoint store。"

  - name: quwoquan_l2_content_comment_compliance
    rules:
      - alert: CommentIPLocationResolverErrors
        expr: |
          sum(rate(content_comment_ip_location_lookup_total{outcome=~"error|unavailable"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: content-comment
        annotations:
          summary: "评论 IP 属地离线解析持续失败"
          description: "生产离线库查询连续 10 分钟出现 error/unavailable；核查 xdb 完整性、双栈数据库与 content-service 实例。原始 IP 不得写入日志。"

      - alert: CommentIPLocationCoverageLow
        expr: |
          sum(rate(content_comment_ip_location_lookup_total{outcome="not_found"}[15m]))
          / clamp_min(sum(rate(content_comment_ip_location_lookup_total{outcome=~"ok|not_found"}[15m])), 0.001) > 0.2
        for: 30m
        labels:
          severity: warning
          layer: l2
          domain: content-comment
        annotations:
          summary: "评论 IP 属地有效查询未命中率超过 20%"
          description: "排除无效/私网 IP 后的 not_found 比率持续过高；核查 xdb 覆盖率与网关受信客户端 IP 注入，禁止用臆造属地兜底。"

      - alert: CommentIPLocationDatabaseNearExpiry
        expr: content_comment_ip_location_data_age_days > 35
        for: 1h
        labels:
          severity: warning
          layer: l2
          domain: content-comment
        annotations:
          summary: "评论 IP 属地离线库即将超过新鲜度门"
          description: "当前数据年龄 {{ $value }} 天；须在 45 天启动硬门前升级 Dockerfile 固定版本、双库 SHA256 与 config data_version，并完成 gamma 回归。"




      - alert: CommentCreateRateLimitedRatioHigh
        expr: |
          sum(rate(quwoquan_content_contract_operation_requests_total{
            service="content-service",
            operation="content.comment.CreateComment",
            status="429"
          }[15m]))
          / clamp_min(
            sum(rate(quwoquan_content_contract_operation_requests_total{
              service="content-service",
              operation="content.comment.CreateComment"
            }[15m])),
            0.001
          ) > 0.2
        for: 15m
        labels: { severity: warning, layer: l2, domain: content-comment }
        annotations:
          summary: "评论创建频控命中率超过 20%"
          description: "区分异常流量、自动化攻击与真实创作阻塞；调整阈值必须先更新 config、压测和产品验收，不得绕过事务频控。"

      - alert: CommentProjectionRelayUnhealthy
        expr: |
          runtime_health_check_status{
            instance=~"content-service(:[0-9]+)?",
            check=~"content_comment_.*|report_comment_moderation"
          } == 0
        for: 2m
        labels: { severity: critical, layer: l2, domain: content-comment }
        annotations:
          summary: "评论投影 {{ $labels.check }} 持续不健康"
          description: "评论计数、hotScore、通知流、推荐信号或举报治理至少一条独立 checkpoint 未收敛；按 runbook 检查 relay、checkpoint 与 poison event。"

  - name: quwoquan_l2_api_edge_admission
    rules:
      - alert: ApiEdgeAdmissionStateUnavailableDenied
        expr: |
          sum(increase(api_edge_admission_decisions_total{outcome="state_unavailable_denied"}[5m])) by (environment) > 0
        for: 1m
        labels: {severity: critical, layer: l2, domain: gateway}
        annotations:
          summary: "{{ $labels.environment }} 统一入口共享限流状态不可用"
          description: "api-edge 已按 operation 的 fail_closed 策略拒绝请求；立即检查 admission Redis、停止放量并按上一不可变配置或镜像回滚。"

      - alert: ApiEdgeAdmissionFailOpenObserved
        expr: |
          sum(increase(api_edge_admission_decisions_total{outcome="state_unavailable_allowed"}[5m])) by (environment, operation) > 0
        for: 1m
        labels: {severity: critical, layer: l2, domain: gateway}
        annotations:
          summary: "{{ $labels.environment }} operation {{ $labels.operation }} 执行了显式 fail_open"
          description: "共享状态不可用时仍放行已经发生；确认该 generated operation 的声明策略并停止扩大故障窗口，禁止补进程内 fallback。"

      - alert: ApiEdgeAdmissionLatencySLOBreach
        expr: |
          histogram_quantile(0.95,
            sum(rate(api_edge_admission_duration_seconds_bucket[5m])) by (le, environment)
          ) > 0.025
        for: 10m
        labels: {severity: warning, layer: l2, domain: gateway}
        annotations:
          summary: "{{ $labels.environment }} 统一入口 admission P95 超过 25ms"
          description: "检查 Redis 网络、Lua 执行和连接池容量；该指标不含 owner service 延迟。"

      - alert: ApiEdgeRateLimitedRatioHigh
        expr: |
          sum(rate(api_edge_admission_decisions_total{outcome="rate_limited"}[15m])) by (environment, operation)
          / clamp_min(
            sum(rate(api_edge_admission_decisions_total{outcome=~"allowed|rate_limited"}[15m])) by (environment, operation),
            0.001
          ) > 0.2
        for: 15m
        labels: {severity: warning, layer: l2, domain: gateway}
        annotations:
          summary: "{{ $labels.environment }} operation {{ $labels.operation }} 限流命中率超过 20%"
