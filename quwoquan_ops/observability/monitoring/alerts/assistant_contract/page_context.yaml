groups:
  - name: quwoquan_assistant_contract_page_context
    rules:
      - record: quwoquan_assistant_contract_operation_requests_total
        expr: |
          sum by (status) (http_server_requests_total{service="assistant-service",method="POST",route="/assistant/page-context"})
        labels:
          service: "assistant-service"
          operation: "assistant.page_context.ReportPageContext"
          contract_metric: "assistant_page_context_session"
          commercial_status: "blocked"
          slo_latency_p95_ms: "300"
          slo_availability_percent: "99.5"
      - record: quwoquan_assistant_contract_operation_duration_seconds_bucket
        expr: |
          sum by (le) (http_server_duration_seconds_bucket{service="assistant-service",method="POST",route="/assistant/page-context"})
        labels:
          service: "assistant-service"
          operation: "assistant.page_context.ReportPageContext"
          contract_metric: "assistant_page_context_session"
          commercial_status: "blocked"
          slo_latency_p95_ms: "300"
          slo_availability_percent: "99.5"
