# Code generated from quwoquan_service/generated/contract_graph.json.
# Regenerate with verify_contract_alert_overlay.py --write.
# commercial.status != ready 的 operation 覆盖。阈值同样来自 ContractGraph 的
# slo.availabilityPercent / slo.latencyP95Milliseconds；selector 显式枚举 operation 与
# contract_metric，不假设 contract_metric 以 <domain>_ 开头。
groups:
  - name: quwoquan_assistant_contract_object_pending_blocked_coverage
    rules:
      - alert: AssistantPendingBlockedContractOperationAvailabilityBelow99p5Percent
        expr: |
          sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"(assistant\\.assistant_run\\.StreamAssistantRunEvents)",contract_metric=~"(assistant_run_stream)",commercial_status="blocked",status=~"5.."}[10m])) by (operation, contract_metric)
          / clamp_min(sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"(assistant\\.assistant_run\\.StreamAssistantRunEvents)",contract_metric=~"(assistant_run_stream)",commercial_status="blocked"}[10m])) by (operation, contract_metric), 0.001) > 0.005
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: assistant
          commercial_status: blocked
        annotations:
          summary: "assistant 待商用（blocked）operation 5xx 比率超出可用性 SLO（99.5%）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）5xx 比率 {{ $value | humanizePercentage }} 超出 ContractGraph 声明的可用性 SLO；该 operation 尚未商用，先按 commercial.gapId 判断是否阻塞放量。"
      - alert: AssistantPendingBlockedContractOperationAvailabilityBelow99p9Percent
        expr: |
          sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"(assistant\\.assistant_preference\\.ListAssistantPreferences|assistant\\.assistant_preference\\.RestoreAssistantPreference|assistant\\.assistant_preference\\.RevokeAssistantPreference|assistant\\.assistant_preference\\.SetAssistantPreference|assistant\\.assistant_run\\.ApproveAssistantToolUse|assistant\\.assistant_run\\.PauseAssistantRun|assistant\\.assistant_run\\.ResumeAssistantRun|assistant\\.assistant_run\\.StartAssistantRun|assistant\\.assistant_run\\.SteerAssistantRun|assistant\\.assistant_run\\.SubmitDeviceActionReceipt|assistant\\.assistant_turn_view\\.ListSessionTurns|assistant\\.skill_surface_placement\\.GetSkillSurfacePlacement|assistant\\.skill_surface_placement\\.PutSkillSurfacePlacement)",contract_metric=~"(assistant_device_action_receipt|assistant_preference_command|assistant_preference_query|assistant_run_command|assistant_run_control|assistant_skill_surface_placement_command|assistant_skill_surface_placement_query|assistant_tool_approval|assistant_turn_view_query)",commercial_status="blocked",status=~"5.."}[10m])) by (operation, contract_metric)
          / clamp_min(sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"(assistant\\.assistant_preference\\.ListAssistantPreferences|assistant\\.assistant_preference\\.RestoreAssistantPreference|assistant\\.assistant_preference\\.RevokeAssistantPreference|assistant\\.assistant_preference\\.SetAssistantPreference|assistant\\.assistant_run\\.ApproveAssistantToolUse|assistant\\.assistant_run\\.PauseAssistantRun|assistant\\.assistant_run\\.ResumeAssistantRun|assistant\\.assistant_run\\.StartAssistantRun|assistant\\.assistant_run\\.SteerAssistantRun|assistant\\.assistant_run\\.SubmitDeviceActionReceipt|assistant\\.assistant_turn_view\\.ListSessionTurns|assistant\\.skill_surface_placement\\.GetSkillSurfacePlacement|assistant\\.skill_surface_placement\\.PutSkillSurfacePlacement)",contract_metric=~"(assistant_device_action_receipt|assistant_preference_command|assistant_preference_query|assistant_run_command|assistant_run_control|assistant_skill_surface_placement_command|assistant_skill_surface_placement_query|assistant_tool_approval|assistant_turn_view_query)",commercial_status="blocked"}[10m])) by (operation, contract_metric), 0.001) > 0.001
        for: 10m
        labels:
          severity: warning
          layer: l2
          domain: assistant
          commercial_status: blocked
        annotations:
          summary: "assistant 待商用（blocked）operation 5xx 比率超出可用性 SLO（99.9%）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）5xx 比率 {{ $value | humanizePercentage }} 超出 ContractGraph 声明的可用性 SLO；该 operation 尚未商用，先按 commercial.gapId 判断是否阻塞放量。"
      - alert: AssistantPendingBlockedContractOperationLatencyP95Above300Ms
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_assistant_contract_operation_duration_seconds_bucket{service="assistant-service",operation=~"(assistant\\.assistant_run\\.PauseAssistantRun|assistant\\.assistant_run\\.ResumeAssistantRun|assistant\\.assistant_run\\.SteerAssistantRun)",contract_metric=~"(assistant_run_control)",commercial_status="blocked"}[5m])) by (le, operation, contract_metric)
          ) > 0.3
        for: 5m
        labels:
          severity: info
          layer: l2
          domain: assistant
          commercial_status: blocked
        annotations:
          summary: "assistant 待商用（blocked）operation P95 超出 SLO（300ms）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）P95 = {{ $value | humanizeDuration }} 超出 ContractGraph 声明的 slo.latencyP95Milliseconds=300。"
      - alert: AssistantPendingBlockedContractOperationLatencyP95Above500Ms
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_assistant_contract_operation_duration_seconds_bucket{service="assistant-service",operation=~"(assistant\\.assistant_preference\\.ListAssistantPreferences|assistant\\.assistant_preference\\.RestoreAssistantPreference|assistant\\.assistant_preference\\.RevokeAssistantPreference|assistant\\.assistant_preference\\.SetAssistantPreference|assistant\\.assistant_run\\.ApproveAssistantToolUse|assistant\\.assistant_run\\.SubmitDeviceActionReceipt|assistant\\.assistant_turn_view\\.ListSessionTurns|assistant\\.skill_surface_placement\\.GetSkillSurfacePlacement)",contract_metric=~"(assistant_device_action_receipt|assistant_preference_command|assistant_preference_query|assistant_skill_surface_placement_query|assistant_tool_approval|assistant_turn_view_query)",commercial_status="blocked"}[5m])) by (le, operation, contract_metric)
          ) > 0.5
        for: 5m
        labels:
          severity: info
          layer: l2
          domain: assistant
          commercial_status: blocked
        annotations:
          summary: "assistant 待商用（blocked）operation P95 超出 SLO（500ms）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）P95 = {{ $value | humanizeDuration }} 超出 ContractGraph 声明的 slo.latencyP95Milliseconds=500。"
      - alert: AssistantPendingBlockedContractOperationLatencyP95Above700Ms
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_assistant_contract_operation_duration_seconds_bucket{service="assistant-service",operation=~"(assistant\\.skill_surface_placement\\.PutSkillSurfacePlacement)",contract_metric=~"(assistant_skill_surface_placement_command)",commercial_status="blocked"}[5m])) by (le, operation, contract_metric)
          ) > 0.7
        for: 5m
        labels:
          severity: info
          layer: l2
          domain: assistant
          commercial_status: blocked
        annotations:
          summary: "assistant 待商用（blocked）operation P95 超出 SLO（700ms）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）P95 = {{ $value | humanizeDuration }} 超出 ContractGraph 声明的 slo.latencyP95Milliseconds=700。"
      - alert: AssistantPendingBlockedContractOperationLatencyP95Above1500Ms
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_assistant_contract_operation_duration_seconds_bucket{service="assistant-service",operation=~"(assistant\\.assistant_run\\.StartAssistantRun)",contract_metric=~"(assistant_run_command)",commercial_status="blocked"}[5m])) by (le, operation, contract_metric)
          ) > 1.5
        for: 5m
        labels:
          severity: info
          layer: l2
          domain: assistant
          commercial_status: blocked
        annotations:
          summary: "assistant 待商用（blocked）operation P95 超出 SLO（1500ms）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）P95 = {{ $value | humanizeDuration }} 超出 ContractGraph 声明的 slo.latencyP95Milliseconds=1500。"
      - alert: AssistantPendingBlockedContractOperationLatencyP95Above2000Ms
        expr: |
          histogram_quantile(0.95,
