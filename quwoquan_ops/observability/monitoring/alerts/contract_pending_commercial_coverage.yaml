          summary: "assistant 待商用（blocked）operation P95 超出 SLO（2000ms）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）P95 = {{ $value | humanizeDuration }} 超出 ContractGraph 声明的 slo.latencyP95Milliseconds=2000。"
