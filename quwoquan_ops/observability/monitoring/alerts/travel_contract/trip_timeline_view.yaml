# Code generated from quwoquan_service/generated/contract_graph.json.
# Regenerate with verify_object_alert_coverage.py --write.
groups:
  - name: quwoquan_travel_contract_trip_timeline_view
    rules:
      - record: quwoquan_travel_contract_operation_requests_total
        expr: |
          sum by (status) (http_server_requests_total{service="travel-service",method="GET",route=~"^/travel/trips/[^/]+/timeline$"})
        labels:
          service: "travel-service"
          operation: "travel.trip_timeline_view.GetTripTimeline"
          contract_metric: "travel_trip_timeline_get"
          commercial_status: "blocked"
          slo_latency_p95_ms: "500"
          slo_availability_percent: "99.9"
      - record: quwoquan_travel_contract_operation_duration_seconds_bucket
        expr: |
          sum by (le) (http_server_duration_seconds_bucket{service="travel-service",method="GET",route=~"^/travel/trips/[^/]+/timeline$"})
        labels:
          service: "travel-service"
          operation: "travel.trip_timeline_view.GetTripTimeline"
          contract_metric: "travel_trip_timeline_get"
          commercial_status: "blocked"
          slo_latency_p95_ms: "500"
          slo_availability_percent: "99.9"
