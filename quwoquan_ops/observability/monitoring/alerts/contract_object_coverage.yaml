# Code generated from quwoquan_service/generated/contract_graph.json.
# Regenerate with verify_object_alert_coverage.py --write.
# 阈值来自 ContractGraph 的 slo.availabilityPercent / slo.latencyP95Milliseconds，
# 每个域按 SLO 档位分组，selector 只消费 recording rule 的 operation/contract_metric label。
groups:
  - name: quwoquan_assistant_contract_object_coverage
    rules:
      - alert: AssistantContractOperationAvailabilityBelow99p5Percent
        expr: |
          sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"assistant\\..+",contract_metric=~"assistant_.+",commercial_status="ready",slo_availability_percent="99.5",status=~"5.."}[10m])) by (operation, contract_metric)
          / clamp_min(sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"assistant\\..+",contract_metric=~"assistant_.+",commercial_status="ready",slo_availability_percent="99.5"}[10m])) by (operation, contract_metric), 0.001) > 0.005
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "assistant ready operation 5xx 比率超出可用性 SLO（99.5%）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）5xx 比率 {{ $value | humanizePercentage }} 超出 ContractGraph 声明的可用性 SLO；按对象 owner 检查依赖、鉴权与存储链路。"
      - alert: AssistantContractOperationAvailabilityBelow99p9Percent
        expr: |
          sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"assistant\\..+",contract_metric=~"assistant_.+",commercial_status="ready",slo_availability_percent="99.9",status=~"5.."}[10m])) by (operation, contract_metric)
          / clamp_min(sum(rate(quwoquan_assistant_contract_operation_requests_total{service="assistant-service",operation=~"assistant\\..+",contract_metric=~"assistant_.+",commercial_status="ready",slo_availability_percent="99.9"}[10m])) by (operation, contract_metric), 0.001) > 0.001
        for: 10m
        labels:
          severity: critical
          layer: l2
          domain: assistant
        annotations:
          summary: "assistant ready operation 5xx 比率超出可用性 SLO（99.9%）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）5xx 比率 {{ $value | humanizePercentage }} 超出 ContractGraph 声明的可用性 SLO；按对象 owner 检查依赖、鉴权与存储链路。"
      - alert: AssistantContractOperationLatencyP95Above100Ms
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_assistant_contract_operation_duration_seconds_bucket{service="assistant-service",operation=~"assistant\\..+",contract_metric=~"assistant_.+",commercial_status="ready",slo_latency_p95_ms="100"}[5m])) by (le, operation, contract_metric)
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          layer: l2
          domain: assistant
        annotations:
          summary: "assistant ready operation P95 超出 SLO（100ms）"
          description: "{{ $labels.operation }}（{{ $labels.contract_metric }}）P95 = {{ $value | humanizeDuration }} 超出 ContractGraph 声明的 slo.latencyP95Milliseconds=100。"
      - alert: AssistantContractOperationLatencyP95Above300Ms
        expr: |
          histogram_quantile(0.95,
            sum(rate(quwoquan_assistant_contract_operation_duration_seconds_bucket{service="assistant-service",operation=~"assistant\\..+",contract_metric=~"assistant_.+",commercial_status="ready",slo_latency_p95_ms="300"}[5m])) by (le, operation, contract_metric)
          ) > 0.3
        for: 5m
