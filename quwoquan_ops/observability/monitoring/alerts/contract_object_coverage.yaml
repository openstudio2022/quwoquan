            sum(rate(quwoquan_assistant_contract_operation_duration_seconds_bucket{service="assistant-service",operation=~"assistant\\..+",contract_metric=~"assistant_.+",commercial_status="ready",slo_latency_p95_ms="600"}[5m])) by (le, operation, contract_metric)
