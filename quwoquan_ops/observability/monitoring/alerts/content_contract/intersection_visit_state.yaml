# Code generated from quwoquan_service/generated/contract_graph.json.
# Regenerate with verify_content_object_alert_coverage.py --write-recording-rules.
groups:
  - name: quwoquan_content_contract_intersection_visit_state
    rules:
      - record: quwoquan_content_contract_operation_requests_total
        expr: |
          sum by (status) (http_server_requests_total{service="content-service",method="POST",route="/content/intersections/visit"})
        labels:
          service: "content-service"
          operation: "content.intersection_visit_state.MarkIntersectionsVisited"
          contract_metric: "content_intersection_visit_mark"
          commercial_status: "ready"
          slo_latency_p95_ms: "500"
          slo_availability_percent: "99.9"
      - record: quwoquan_content_contract_operation_duration_seconds_bucket
        expr: |
          sum by (le) (http_server_duration_seconds_bucket{service="content-service",method="POST",route="/content/intersections/visit"})
        labels:
          service: "content-service"
          operation: "content.intersection_visit_state.MarkIntersectionsVisited"
          contract_metric: "content_intersection_visit_mark"
          commercial_status: "ready"
          slo_latency_p95_ms: "500"
          slo_availability_percent: "99.9"
