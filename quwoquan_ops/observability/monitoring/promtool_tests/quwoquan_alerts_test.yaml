# promtool test rules：核心手写告警的表达式求值回归。
# 运行：make verify-prometheus-rule-tests
# 范围：SLO burn-rate、黑盒拨测、黄金指标绑定告警（登录完成率 / ANR）。
# 契约派生告警依赖 recording rule 链，按域抽测在后续扩展。
rule_files:
  - ../alerts/quwoquan_alerts.yaml

evaluation_interval: 1m

tests:
  # ── 快烧开火：恒定 10% 5xx 远超 14.4x 预算（1.44%），双窗同时满足 ──
  - interval: 1m
    input_series:
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="500"}'
        values: '0+60x90'
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="200"}'
        values: '0+540x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: GlobalHttpAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: l3
              domain: slo-burn-rate
            exp_annotations:
              summary: "全局可用性错误预算快烧（14.4x，约 1 小时烧完 2% 月度预算）"
              description: "1h 与 5m 双窗 5xx 比率同时超过 14.4 倍预算燃烧率；立即按 Error Governance 看板定位 top 错误码与服务。"
              runbook_url: "quwoquan_ops/runbooks/slo_burn_rate.md"

  # ── 快烧不开火：0.05% 5xx 低于 1.44% 燃烧线 ──
  - interval: 1m
    input_series:
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="500"}'
        values: '0+1x90'
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="200"}'
        values: '0+1999x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: GlobalHttpAvailabilityFastBurn
        exp_alerts: []

  # ── 黑盒探测失败开火 ──
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://api.quwoquan.com/healthz", plane="edge", job="blackbox-public-health"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PublicEndpointProbeFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: l4
              domain: edge-probe
              instance: "https://api.quwoquan.com/healthz"
              plane: edge
              job: blackbox-public-health
            exp_annotations:
              summary: "公网入口 https://api.quwoquan.com/healthz 黑盒探测失败"
              description: "DNS/TLS/HTTP 探测连续失败；先核对 edge Caddy 与证书，再查 api-edge 健康。"
              runbook_url: "quwoquan_ops/runbooks/slo_burn_rate.md"

  # ── 黑盒探测恢复后不开火 ──
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://quwoquan.com/", plane="edge", job="blackbox-public-health"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PublicEndpointProbeFailed
        exp_alerts: []

  # ── 登录完成率低开火：曝光 30/15m（≥20 门槛），成功率 50% < 80% ──
  - interval: 1m
    input_series:
      - series: 'ops_login_funnel_events_total{action="login_flow_exposed", result="exposed"}'
        values: '0+2x60'
      - series: 'ops_login_funnel_events_total{action="login_terminal", result="login_success"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: LoginCompletionRateLow
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: l2
              domain: user-auth
            exp_annotations:
              summary: "登录完成率低于 80%"
              description: "按 send_otp、confirm_otp_delivery、verify_login_otp 与 failure_kind 下钻，确认短信、校验和 session readback 均可恢复。"

  # ── 慢烧开火：0.8% 5xx 超过 6x 预算（0.6%），6h+30m 双窗同时满足 ──
  - interval: 1m
    input_series:
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="500"}'
        values: '0+8x420'
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="200"}'
        values: '0+992x420'
    alert_rule_test:
      - eval_time: 400m
        alertname: GlobalHttpAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: l3
              domain: slo-burn-rate
            exp_annotations:
              summary: "全局可用性错误预算慢烧（6x，持续将在数日内耗尽月度预算）"
              description: "6h 与 30m 双窗 5xx 比率同时超过 6 倍预算燃烧率；按服务下钻并安排修复工单。"
              runbook_url: "quwoquan_ops/runbooks/slo_burn_rate.md"

  # ── 慢烧不开火：0.3% 低于 0.6% 慢烧线（但会高于快烧线吗？0.3%<1.44% 同样安静） ──
  - interval: 1m
    input_series:
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="500"}'
        values: '0+3x420'
      - series: 'http_server_requests_total{service="content-service", route="/feed", method="GET", status="200"}'
        values: '0+997x420'
    alert_rule_test:
      - eval_time: 400m
        alertname: GlobalHttpAvailabilitySlowBurn
        exp_alerts: []

  # ── 证书临期告警：剩余 7 天 < 14 天阈值 ──
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://api.quwoquan.com/healthz", plane="edge", job="blackbox-public-health"}'
        values: '604800+0x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: PublicEndpointCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: l4
              domain: edge-probe
              instance: "https://api.quwoquan.com/healthz"
              plane: edge
              job: blackbox-public-health
            exp_annotations:
              summary: "公网证书 https://api.quwoquan.com/healthz 将在 14 天内过期"
              description: "检查 ACME 自动续期链路；证书真相源与续期规则见 edge deploy。"

  # ── ANR 事件率超阈开火：1% > 0.47% ──
  - interval: 1m
    input_series:
      - series: 'ops_app_experience_events_total{event_type="app_anr_outcome", result="detected"}'
        values: '0+1x40'
      - series: 'ops_app_experience_events_total{event_type="app_startup", result="ok"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: AppANREventRateHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: l1
              domain: app-experience
            exp_annotations:
              summary: "App ANR 近实时事件率超过 0.47%"
              description: "先按 appVersion/networkClass 在产品体验权威回读中核对去重会话率，再下钻 app_anr_outcome 与 runtime signal。"
