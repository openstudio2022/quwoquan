# promtool test rules：LiveKit 媒体面丢包告警的表达式求值回归。
# 运行：make verify-prometheus-rule-tests
rule_files:
  - ../alerts/quwoquan_alerts.yaml

evaluation_interval: 1m

tests:
  - name: livekit_packet_loss_p95_crosses_threshold_and_holds
    interval: 1m
    input_series:
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="1"}'
        values: '0+0x25'
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="2"}'
        values: '0+0x25'
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="5"}'
        values: '0+60x25'
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="+Inf"}'
        values: '0+60x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: LiveKitPacketLossP95High
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: l2
              domain: rtc
            exp_annotations:
              summary: LiveKit 媒体流 P95 丢包率持续高于 2%
              description: 检查 SFU 节点带宽、UDP 7882、TURN 路径与宿主网络；不得仅以 rtc-service HTTP 健康替代媒体面诊断。

  - name: livekit_packet_loss_p95_below_threshold_stays_clear
    interval: 1m
    input_series:
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="1"}'
        values: '0+60x25'
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="2"}'
        values: '0+60x25'
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="5"}'
        values: '0+60x25'
      - series: 'livekit_packet_loss_percent_bucket{job="livekit-sfu",le="+Inf"}'
        values: '0+60x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: LiveKitPacketLossP95High
        exp_alerts: []
