# 本地工作副本（fixed lane worktree、唯一 integration worktree 与同源 clone）生命周期策略。
# 分支闭集只读 branch_policy.yaml；lane 路径 ownership 只读 lane_ownership.yaml。
# 本文件唯一拥有物理布局：project root、bare hub、固定 branch->同名目录和 integration。

schema_version: 2
project_root: "{repo_parent}"
bare_hub_directory: quwoquan.git
integration_worktree_directory: integration
lane_worktree_directory_rule: branch_suffix

# 创建授权凭据：随命令一次性传递的显式意图声明（留痕用，hook 只提醒不阻断）。
authorization_env_var: QWQ_WORKTREE_AUTHZ
unmerged_reminder_after_days: 3
reminder_min_interval_hours: 24

# 同源 clone 的发现根。{repo_parent} 是当前 worktree 的父目录；扫描会跳过 bare hub。
discovery_roots:
  - "{repo_parent}"
  - "~/.codex/worktrees"
  - "/private/tmp"
discovery_max_depth: 2

hooks_path: quwoquan_ops/hooks
install_command: bash quwoquan_ops/hooks/run_install_hooks.sh

failure_codes:
  not_authorized: OPS.WORKTREE.NOT_AUTHORIZED
  unmerged_overdue: OPS.WORKTREE.UNMERGED_OVERDUE
  hooks_not_installed: OPS.WORKTREE.HOOKS_NOT_INSTALLED
