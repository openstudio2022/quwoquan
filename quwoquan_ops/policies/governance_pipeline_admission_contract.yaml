  creates_authority: false
  production_ready_claim: false
  commercial_ready_claim: false
  hotl_admitted_claim: false
  prod_mutation: false
  hotl_mutation: false
  local_fixture_release_evidence: false

closed_sets:
  admission_status: [blocked, not_admitted, eligible_observe_only, observe_only]
  allowed_mode: [manual, observe_only]
  evidence_status: [present, absent, failed]
  evidence_result: [absent, not_executed, selected, pass, READY, scope_ready, release_ready, observed, not_observed, insufficient, calibrated, code_absent, code_present, code_pass, integration_unproven, integration_pass, live_absent, live_pass, present, recovered, allowlisted, applied, unknown, clean_sha, released, published, attained, manual_safe]
  provider_kind: [absent, source_inspection, local_fixture, local_runtime, hosted_code, hosted_integration, authenticated_external]
  metric_kind: [histogram, gauge, counter]
  metric_unit: [milliseconds, ratio, count]
  activation_verification_status: [present, absent, failed]

schemas:
  inspection_input:
    required_fields: [subject, evidence, human_calibration_readback, activation_receipt]
  subject:
    required_fields: [subject_id, scope_id, candidate_id, evidence_fingerprint]
  evidence_readback:
    required_fields: [status, schema_valid, fresh, fingerprint_match, result, provider_kind, release_evidence_eligible, detail, receipt_ref, receipt_bytes_sha256, verified_at, provider_timestamp, candidate_id, scope_id, verifier_id]
  activation_receipt:
    required_fields: [status, receipt_id, evaluation_digest, evaluation_bytes_sha256]
  activation_verification:
    required_fields: [status, provider_kind, authenticated, exact_bytes_verified, release_evidence_eligible, receipt_id, evaluation_digest, evaluation_bytes_sha256]
  observation_metric:
    required_fields: [metric_id, kind, unit, dimensions, sensitive_fields]
  inspection_result:
    required_fields: [schema_id, schema_version, result, error_code, detail, subject, status, allowed_mode, production_ready, commercial_ready, hotl_admitted, mutation_allowed, prod_mutation_allowed, hotl_mutation_allowed, max_write_concurrency, activation_required, activation_receipt_ref, evaluation_digest, evaluation_bytes_sha256, blockers, evidence_summary, objective_s4_readback, external_effect_policy, observation_metrics, external_open]
  contract_terminal:
    required_fields: [result, error_code, terminal, recovery, detail, blockers]
  evidence_bundle:
    required_fields: [schema_id, schema_version, subject_fingerprint, subject_fingerprint_receipt, assembled_at, receipts]
  evidence_bundle_receipts:
    required_fields: [owner_manifest, workflow_resolve, local_scope_ready, local_release_ready, review_plan, named_evidence, review_consolidation, handoff, human_calibration, objective_inspect, hotl_inspect, hosted_authority_source, external]
  bundle_receipt:
    required_fields: [provider_id, receipt_ref, exact_bytes_base64]

evidence_layers:
  workflow_resolve: {qualifying_result: selected, missing_blocker: WORKFLOW_RESOLVE_RECEIPT_MISSING, failed_blocker: WORKFLOW_RESOLVE_RECEIPT_FAILED, unqualified_blocker: WORKFLOW_RESOLVE_NOT_SELECTED}
  owner_manifest: {qualifying_result: pass, missing_blocker: OWNER_MANIFEST_MISSING, failed_blocker: OWNER_MANIFEST_INVALID, unqualified_blocker: OWNER_MANIFEST_NOT_CURRENT}
  local_scope_ready: {qualifying_result: scope_ready, missing_blocker: LOCAL_SCOPE_RECEIPT_MISSING, failed_blocker: LOCAL_SCOPE_RECEIPT_INVALID, unqualified_blocker: LOCAL_SCOPE_NOT_READY}
