precedence:
  blocked_before_admission:
    - CANONICAL_CONTRACT_INVALID
    - INPUT_CONTRACT_INVALID
    - EVIDENCE_SCHEMA_INVALID
    - EVIDENCE_STALE
    - EVIDENCE_FINGERPRINT_MISMATCH
    - REQUIRED_CODE_EVIDENCE_ABSENT
    - REQUIRED_CODE_EVIDENCE_FAILED
    - HUMAN_CALIBRATION_SELF_ASSERTED
    - OBJECTIVE_ADMISSION_BLOCKED
    - EVALUATION_IDENTITY_FAILED
  rules:
    machine_baseline_does_not_satisfy_human_calibration: true
    review_ready_does_not_satisfy_pass: true
    scope_ready_does_not_satisfy_release_ready: true
    hosted_code_does_not_satisfy_live: true
    released_published_outcome_are_independent: true
    missing_schema_stale_or_fingerprint_mismatch_blocks_first: true

admission_policy:
  current_max_write_concurrency: 1
  dynamic_objective_s4_required: true
  dynamic_objective_s4_consumption: [status, write_concurrency, reason, terminal]
  objective_s4_upper_bound: 1
  observe_only_requires_all_evidence_layers: true
  activation:
    authenticated_external_provider_required: true
    exact_evaluation_digest_required: true
    exact_evaluation_bytes_required: true
    local_inspect_may_self_assert: false
    provider_available: false
    provider_absent_status_ceiling: eligible_observe_only
    provider_absent_blocker: ACTIVATION_PROVIDER_UNAVAILABLE
  external_effects:
    production_effects_allowed: false
    reversible_nonproduction_only: true
    allowed_effects: [governance_observation_marker, governance_cache_probe, governance_readback_probe]
    unknown_outcome: pending
    retry_unknown: false
  external_open:
    - hosted_authority_integration_and_live_evidence
    - hosted_identity_infrastructure_and_live_uat
    - human_calibration_real_participant_uat
    - authenticated_observe_only_activation_provider
    - commercial_prod_channel_outcome_evidence

human_calibration_policy:
  owner_contract_version: 2
  readback_schema_source: quwoquan_ops/policies/human_agent_delivery_contract.yaml#schemas.human_calibration_readback
  verifier_source: quwoquan_ops/cli/lib/human_agent_delivery/calibration.py#verify_calibration_readback
  required_status: calibrated
  incompatibility_blocker: HUMAN_CALIBRATION_CONTRACT_INCOMPATIBLE
  missing_session_bytes_blocker: HUMAN_CALIBRATION_CONTRACT_INCOMPATIBLE
  machine_baseline_is_substitute: false
  governance_may_recompute_human_semantics: false

observation_metrics:
  forbidden_dimensions: [prompt, prompt_text, message, message_text, actor_id, user_id, email, phone, raw_payload, pii]
  definitions:
    - {metric_id: governance_edit_latency_ms, kind: histogram, unit: milliseconds, dimensions: [workflow, status], sensitive_fields: []}
    - {metric_id: governance_idle_latency_ms, kind: histogram, unit: milliseconds, dimensions: [workflow, status], sensitive_fields: []}
    - {metric_id: governance_scope_latency_ms, kind: histogram, unit: milliseconds, dimensions: [scope, status], sensitive_fields: []}
    - {metric_id: governance_release_latency_ms, kind: histogram, unit: milliseconds, dimensions: [scope, status], sensitive_fields: []}
    - {metric_id: governance_cache_hit_ratio, kind: gauge, unit: ratio, dimensions: [scope], sensitive_fields: []}
