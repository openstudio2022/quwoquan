  portal_uat: {qualifying_result: pass, missing_blocker: PORTAL_UAT_RECEIPT_MISSING, failed_blocker: PORTAL_UAT_RECEIPT_FAILED, unqualified_blocker: PORTAL_UAT_NOT_PASS}
  hosted_ci_clean_sha: {qualifying_result: clean_sha, missing_blocker: HOSTED_CI_RECEIPT_MISSING, failed_blocker: HOSTED_CI_RECEIPT_FAILED, unqualified_blocker: HOSTED_CI_NOT_CLEAN_SHA}
  environment: {qualifying_result: pass, missing_blocker: ENVIRONMENT_RECEIPT_MISSING, failed_blocker: ENVIRONMENT_RECEIPT_FAILED, unqualified_blocker: ENVIRONMENT_NOT_PASS}
