schema_version: 1
contract_id: local-readiness-v1
levels:
  edit_feedback: L-1
  fast_green: L0
  scope_ready: L1
  release_ready: L2
readiness_states: [not_ready, fast_green, scope_ready, release_ready]
fingerprint:
  canonical_implementation: quwoquan_ops/cli/lib/evidence_fingerprint.py
  exact_input_groups: [git, workspace, assets, execution]
  workspace_categories: [tracked, untracked, deleted, renamed, symlink]
  invalidating_inputs: [source, lockfile, toolchain, command, owner_manifest, review_consolidation, required_evidence]
profiles:
  fast:
    required_checks: [static, focused]
    allow_deferred: true
  scope:
    required_checks: [static, focused, scope_build]
    allow_deferred: false
    required_admission: [review_consolidation_pass, required_named_evidence_pass]
  release:
    required_checks: [static, focused, scope_build, release]
    allow_deferred: false
    required_admission: [review_consolidation_pass, required_named_evidence_pass]
scope_profiles:
  service:
    focused: [go_test]
    scope_build: [go_test_compile, go_build]
  app:
    focused: [dart_test]
    scope_build: [app_affected_package_smoke]
  data:
    focused: [managed_pytest]
    scope_build: [data_verify_all, affected_tests]
  portal:
    focused: [portal_test]
    scope_build: [portal_build]
  spec_contract:
    focused: [feature_tree]
    scope_build: [feature_tree]
commands:
  recovery_scope_staged: python3 quwoquan_ops/cli/local_readiness.py scope --staged --owner-manifest <current-manifest> --review-consolidation <pass.json> --required-evidence <pass-receipt.json>
  recovery_release_push_stdin: python3 quwoquan_ops/cli/local_readiness.py release --push-updates - --owner-manifest <current-manifest> --review-consolidation <pass.json> --required-evidence <pass-receipt.json>
  worker_once: python3 quwoquan_ops/cli/local_readiness.py worker --once
storage:
  root: .qwq_output/env/repo/local/local-readiness
  queue: process/deferred-queue.json
  receipts_by_fingerprint: process/receipts/by-fingerprint
  receipt_current_pointers: process/receipts/current
  cache: cache/exact-input
  locks: process/locks
worker:
  debounce_seconds: 2
  queue_identity: [path, exact_input_digest]
  retry_identity: [evidence_fingerprint_ref, check_identity_digest]
  retry_base_seconds: 2
  retry_max_seconds: 60
  max_attempts: 4
  terminal_code: LOCAL_READINESS.RETRY_EXHAUSTED
  failure_terminal: GATE_BLOCK
freshness:
  staged_receipt: exact-current-staged-index-fingerprint
  push_receipt: exact-push-updates-local-sha-base-fingerprint
failure_semantics:
  hook_exception: no_readiness_pass
  worker_exception: no_readiness_pass
  deferred_scope_or_release: blocked
