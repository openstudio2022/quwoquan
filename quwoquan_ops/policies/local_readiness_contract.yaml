schema_version: 2
contract_id: local-readiness-v2
fact_dimensions:
  sourceReadiness:
    producer: local_readiness
    statuses: [not_ready, fast_green, scope_ready, release_ready]
  environmentReadiness:
    producer: environment_ops
    statuses: [not_evaluated, passed, not_required, failed]
  deviceReadiness:
    producer: package_acceptance
    statuses: [not_evaluated, passed, failed]
  integrationEligibility:
    producer: trusted_integration_publisher
    statuses: [not_evaluated, eligible, blocked]
  promotionEligibility:
    producer: integration_qualification
    statuses: [not_evaluated, eligible, blocked]
independence:
  source_pass_implies: []
  cross_dimension_inference: denied
  local_readiness_writes: [sourceReadiness]
  non_source_default: not_evaluated
levels:
  edit_feedback: L-1
  fast_green: L0
  scope_ready: L1
  release_ready: L2
fingerprint:
  canonical_implementation: quwoquan_ops/cli/lib/evidence_fingerprint.py
  exact_input_groups: [git, workspace, assets, execution]
  workspace_categories: [tracked, untracked, deleted, renamed, symlink]
  invalidating_inputs: [source, lockfile, toolchain, command, timeout_policy, owner_identity, candidate_evidence, review_consolidation, required_evidence]
profiles:
  fast:
    required_checks: [static, focused]
    allow_deferred: true
  scope:
    required_checks: [static, focused, scope_build]
    allow_deferred: false
    required_admission: [review_consolidation_pass, required_named_evidence_pass]
  release:
    required_checks: [static, focused, scope_build, release]
    allow_deferred: false
    required_admission: [review_consolidation_pass, required_named_evidence_pass]
timeouts:
  schema_version: 1
  # 解析顺序固定为 check → phase → level → default。每个 canonical check 都带 phase，
  # 所以 default_by_level / default_seconds 只在缺 phase 的新 check 上生效，不得删以免 schema 漂移。
  default_seconds: 300
  default_by_level:
    fast: 120
    scope: 600
    release: 1200
  default_by_phase:
    static: 60
    focused: 300
    scope_build: 900
    release: 1800
  maximum_by_level:
    fast: 300
    scope: 1800
    release: 7200
  overrides_by_check:
    static:code_health_delta_fast: 30
    static:code-health-delta: 300
  resolution_order: [check, phase, level, default]
scope_profiles:
  service:
    focused: [go_test]
    scope_build: [go_test_compile, go_build]
  app:
    focused: [dart_test]
    scope_build: [app_affected_package_smoke]
  data:
    focused: [managed_pytest]
    scope_build: [data_verify_all, affected_tests]
  portal:
    focused: [portal_test]
    scope_build: [portal_build]
  spec_contract:
    focused: [feature_tree]
    scope_build: [feature_tree]
commands:
  recovery_scope_staged: python3 quwoquan_ops/cli/local_readiness.py scope --staged --owner-identity <current-owner-identity> --candidate-evidence <current-candidate-evidence> --review-consolidation <pass.json> --required-evidence <pass-receipt.json>
  recovery_release_push_stdin: python3 quwoquan_ops/cli/local_readiness.py release --push-updates - --owner-identity <current-owner-identity> --candidate-evidence <current-candidate-evidence> --review-consolidation <pass.json> --required-evidence <pass-receipt.json>
  worker_once: python3 quwoquan_ops/cli/local_readiness.py worker --once
storage:
  root: .qwq_output/env/repo/local/local-readiness
  queue: process/deferred-queue.json
  receipts_by_fingerprint: process/receipts/by-fingerprint
  receipt_current_pointers: process/receipts/current
  cache: cache/exact-input
  locks: process/locks
worker:
  debounce_seconds: 2
  max_items_per_run: 8
  wall_clock_budget_seconds: 120
  scheduling_order: [enqueued_at, path]
  queue_identity: [path, exact_input_digest]
  retry_identity: [evidence_fingerprint_ref, check_identity_digest]
  retry_base_seconds: 2
  retry_max_seconds: 60
  max_attempts: 4
  terminal_code: LOCAL_READINESS.RETRY_EXHAUSTED
  failure_terminal: GATE_BLOCK
freshness:
  staged_receipt: exact-current-staged-index-fingerprint
  staged_unstaged_overlap: LOCAL_READINESS.STAGED_UNSTAGED_OVERLAP
  push_receipt: exact-push-updates-local-sha-base-fingerprint
queue_closure:
  schema_version: 1
  enforcement: advisory_until_verified_consumer
  consuming_levels: [scope, release]
  classifications: [exact-pending, foreign-pending]
  exact_pending_definition: candidate_path_with_current_input_identity
  foreign_pending_definition: any_queue_item_outside_exact_candidate_identity
  blocking: []
  ordinary_commit_push_pending: advisory
failure_semantics:
  hook_exception: no_readiness_pass
  worker_exception: no_readiness_pass
  exact_candidate_pending_scope_or_release: advisory
  feedback_only_named_evidence: REVIEW.EVIDENCE_FEEDBACK_ONLY
  staged_unstaged_overlap: LOCAL_READINESS.STAGED_UNSTAGED_OVERLAP
  foreign_pending: advisory
  ordinary_commit_push_pending: advisory
