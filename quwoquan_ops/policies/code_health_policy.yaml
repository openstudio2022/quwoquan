schema_version: 1
policy_id: incremental-code-health-v2
owner: incremental-code-health-governance
terminals: [PASS, PR_WARN, GATE_BLOCK]
source_categories:
  - handwritten-production
  - test
  - generated
  - vendor
  - contract-metadata
  - config-data
  - docs
classification:
  source_extensions: [.py, .go, .dart, .ts, .tsx, .js, .jsx, .swift, .java, .kt, .kts, .sh]
  generated_markers: [/generated/, _generated.go, .g.dart, .g.go, .freezed.dart, /gen/, lib/l10n/app_localizations]
  vendor_markers: [/vendor/, /Pods/, /node_modules/, /.dart_tool/]
  test_markers: [/test/, /tests/, /RunnerTests/, /androidTest/, _test.go, _test.dart, _test.py, __local_contract_test.py, __api_integration_test.py, __user_acceptance_test.py]
  contract_markers: [/contracts/, /schema/, /schemas/, /metadata/]
  docs_prefixes: [docs/, specs/, .agents/]
  config_extensions: [.json, .yaml, .yml, .toml, .xml, .arb]
# v2（2026-09-06）：file_lines 由 advisory 800 / block 1000 放宽为 1000 / 2000。
# 旧口径实测值：手写生产文件 >1000 行 37 个（其中 >2000 行 4 个），20 个历史 merge 样本中
# 8 个因新越过 1000 行被 GATE_BLOCK，全部是发布链拆分未完成的过渡态；2000 以上存量继续由
# OVERSIZED_FILE_GROWTH 冻结增长，1000–2000 区间进入 weekly 棘轮观测。
# change_size 未按同批样本重设：20 个样本呈双峰（p50 churn 88，p75 9416），分位数不适合作
# 阈值；SPLIT_ANALYSIS_REQUIRED 改为「超过 split 阈值且跨 >= split_analysis_scopes 个 owner
# scope」的口径，纯规模只走 CHANGE_SIZE_ADVISORY。
thresholds:
  file_lines:
    advisory: 1000
    block: 2000
  complexity:
    cyclomatic_advisory: 15
    cognitive_advisory: 20
  duplication:
    advisory_percent: 3.0
    minimum_measured_new_lines: 20
    block_lines: 6
  change_size:
    warn_handwritten_churn: 400
    warn_handwritten_files: 20
    split_analysis_churn: 1000
    split_analysis_files: 40
    split_analysis_scopes: 3
rollout:
  automatic_promotion: false
  calibration:
    started_at: '2026-09-05T00:00:00+08:00'
    minimum_days: 14
    minimum_pull_requests: 20
    maximum_confirmed_false_positive_rate: 0.10
    # 升格资格按 finding code 抽样：每个 advisory code 至少这么多条人工评审即可判定，不要求评审全部 advisory。
    minimum_reviewed_per_code: 20
performance:
  local_p95_seconds: 30
  ci_p95_seconds: 180
  ci_hard_timeout_seconds: 300
  delivery_critical_path_max_growth_percent: 5
  delivery_critical_path_max_growth_seconds: 60
  delivery_outcome_regression_percent: 10
# 文档字段，不参与判罚：各 finding 的 terminal 由 engine 代码与上面的阈值唯一决定。
notes:
  metrics_provider: builtin-python-stdlib-and-git
  external_analyzers_not_adopted: [ruff, golangci-lint, dart-code-linter]
  advisory_only_codes: [CODE_HEALTH.COMPLEXITY_ADVISORY, CODE_HEALTH.DUPLICATION_ADVISORY, CODE_HEALTH.FILE_LINES_ADVISORY, CODE_HEALTH.CHANGE_SIZE_ADVISORY, CODE_HEALTH.SPLIT_ANALYSIS_REQUIRED]
  blocking_codes: [CODE_HEALTH.NEW_FILE_OVER_BLOCK, CODE_HEALTH.OVERSIZED_FILE_GROWTH, CODE_HEALTH.NEW_PRIVATE_PYTHON_WITHOUT_ENTRY, CODE_HEALTH.TRACKED_SOURCE_EXECUTABLE]
report:
  root: .qwq_output/env/repo/runs/code-health
  weekly_top_hotspots: 20
  history_first_parent: true
  history_date: committer
  cloc_count_duplicate_paths: true
  size_observation_tiers: [800, 1000, 2000]
