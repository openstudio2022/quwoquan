      - "quwoquan_ops/cli/lib/handoff_store.py"
      - "quwoquan_ops/cli/lib/human_agent_delivery/**"
      - "quwoquan_ops/cli/lib/hotl_admission/**"
      - "quwoquan_ops/cli/lib/objective_execution/**"
      - "quwoquan_ops/cli/lib/feature_tree/**"
      - "quwoquan_ops/cli/lib/feature_context_fingerprint.py"
      - "quwoquan_ops/cli/lib/governance_pipeline_admission/**"
      - "quwoquan_ops/cli/lib/agent_governance_contract.py"
