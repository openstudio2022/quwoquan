# 四个内容域 lane 的默认路径归属（逐条按序匹配，首个命中生效）。
# lane/small-fix 与 lane/refactor 是跨路径 lead lane，不声明静态独占路径。
# schema 只声明 ownership；分支闭集读 branch_policy.yaml，物理 worktree 布局读
# worktree_policy.yaml，三者不得互相复制成为第二真相源。
# 行为语义归属：
#   specs/feature-tree/runtime/deliver-deploy-prod-pipeline/daily-merge-release-strategy/spec.md REQ-001
# 边界原则：
#   engineering = 开发→发布态的 AI-native 软件工程（agent 工作流面、HOTL、review/handoff、
#                 feature-tree 工具、CI/CD pipeline-as-code、门禁、hooks、分支/worktree/lane 治理、
#                 local readiness、三个工程 spec 目录）
#   ops         = 发布后运行态（stackctl 运行编排、四环境 manifests、observability、runbooks、
#                 migrations、portal、domain governance、hosted authority、provider conformance、
#                 environment-ops / incident-inspection Skill、拓扑/观测/运行配置 spec）
# 规则按序首个命中；跨界少量文件随 lead lane 进入允许，但 preflight 只报
# OWNERSHIP_DRIFT、不阻断。
schema_version: 1
matching: first_match
rules:
  - owner: lane/data-engineering
    patterns:
      - "quwoquan_data/**"
      - ".agents/skills/content-production/**"

  - owner: lane/ops
    patterns:
      - "quwoquan_ops/cli/stackctl.py"
      - "quwoquan_ops/cli/commands/**"
      - "quwoquan_ops/cli/alpha/**"
      - "quwoquan_ops/cli/beta/**"
      - "quwoquan_ops/cli/gamma/**"
      - "quwoquan_ops/cli/prod/**"
      - "quwoquan_ops/cli/prod_sim/**"
      - "quwoquan_ops/cli/probes/**"
      - "quwoquan_ops/cli/smoke/**"
      - "quwoquan_ops/cli/shared/**"
      - "quwoquan_ops/cli/domain_governance.py"
      - "quwoquan_ops/cli/hosted_authority.py"
      - "quwoquan_ops/cli/hosted_authority_smoke.py"
      - "quwoquan_ops/cli/provider_conformance_runner.py"
      - "quwoquan_ops/cli/render_runtime_config.py"
      - "quwoquan_ops/cli/print_local_port_profile.py"
      - "quwoquan_ops/cli/legal_static.py"
      - "quwoquan_ops/observability/**"
      - "quwoquan_ops/runbooks/**"
      - "quwoquan_ops/migrations/**"
      - "quwoquan_ops/portal/**"
      - "quwoquan_ops/external/**"
      - "quwoquan_ops/tools/alert_drill.py"
      - "quwoquan_ops/policies/migrations/**"
      - "quwoquan_ops/policies/app_build_projection_policy.json"
      - "quwoquan_ops/policies/cloud_contract_ownership.json"
      - "quwoquan_ops/policies/config-release/**"
      - "quwoquan_ops/tests/local_contract/observability/**"
      - "quwoquan_ops/tests/local_contract/stackctl/**"
      - "quwoquan_ops/tests/local_contract/environment/**"
      - "quwoquan_ops/tests/local_contract/media/**"
      - "quwoquan_ops/tests/local_contract/provider/**"
      - "quwoquan_ops/tests/local_contract/service_ops/**"
      - "quwoquan_ops/tests/local_contract/test_data/**"
      - "quwoquan_ops/tests/local_contract/portal_control_plane__local_contract_test.mjs"
      - "quwoquan_ops/tests/acceptance/**"
      - ".agents/skills/environment-ops/**"
      - ".agents/skills/incident-inspection/**"
      - "specs/feature-tree/runtime/system-topology-and-networking/**"
      - "specs/feature-tree/runtime/runtime-observability/**"
      - "specs/feature-tree/runtime/runtime-config/**"

  - owner: lane/engineering
    patterns:
      - "AGENTS.md"
      - "README.md"
      - "Makefile"
      - ".gitignore"
      - ".dockerignore"
      - "LICENSE"
      - "docs/**"
      - ".agents/**"
      - ".cursor/**"
      - ".codex/**"
      - ".github/**"
      - "quwoquan_ops/AGENTS.md"
      - "quwoquan_ops/__init__.py"
      - "quwoquan_ops/gate/**"
      - "quwoquan_ops/hooks/**"
