      - "specs/feature-tree/runtime/development-workflow-governance/**"
      - "specs/feature-tree/runtime/deliver-deploy-prod-pipeline/**"
      - "specs/feature-tree/runtime/system-architecture-and-engineering-guide/**"
      - "specs/feature-tree/README.md"
      - "specs/feature-tree/spec.md"
      - "specs/feature-tree/design.md"

  # cli/lib 其余全部是运行态基础能力（app_*、dev_up、managed_preparation、package_reuse、
  # local_*、provider_*、runtime_*、service_*、storage_*、test_data、research_*、output_paths ...）
  - owner: lane/ops
    patterns:
      - "quwoquan_ops/cli/lib/**"
      - "quwoquan_ops/environments/**"

  - owner: lane/product-mainline
    patterns:
      - "quwoquan_app/**"
      - "quwoquan_service/**"
      - "specs/feature-tree/**"
