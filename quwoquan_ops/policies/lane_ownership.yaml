      - "quwoquan_ops/cli/human_agent_delivery.py"
      - "quwoquan_ops/cli/hotl_admission.py"
      - "quwoquan_ops/cli/objective_execution.py"
      - "quwoquan_ops/cli/workflow_trace.py"
      - "quwoquan_ops/cli/evidence_runner.py"
      - "quwoquan_ops/cli/feature_tree.py"
      - "quwoquan_ops/cli/feature_tree_content_review.py"
      - "quwoquan_ops/cli/local_readiness.py"
      - "quwoquan_ops/cli/governance_pipeline_admission.py"
      - "quwoquan_ops/cli/repo_hygiene_audit.py"
      - "quwoquan_ops/cli/prepare_test_python.py"
