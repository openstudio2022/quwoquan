role_interaction_evaluation:
  expected_fixture_count: 4
  required_event_types: [progress_update, decision_request, exception_escalation, completion_report]
  fixtures:
  - id: interaction-progress
    payload:
      event_type: progress_update
      delivery_stage: agent_led_implementation
      audience_role: engineering_delivery_owner
      what_happened: 已完成当前增量的契约修改，正在验证角色可见交互。
      user_or_business_impact: 当前尚无外部行为变化，交付范围保持不变。
      decision_owner: null
      legal_actions: [continue_authorized_work, pause]
      safe_actions_taken: [preserve_current_state, keep_external_effects_disabled]
      next_acceptance: 完成最小验证后由工程交付负责人检查范围与结果。
      next_acceptance_role: engineering_delivery_owner
      audit_details: {internal_tool_name: pytest, sha: abc123}
  - id: interaction-decision
    payload:
      event_type: decision_request
      delivery_stage: product_definition
      audience_role: product_owner
      what_happened: 两个产品范围方向均合法，需要由产品负责人选择。
      user_or_business_impact: 选择会影响首轮覆盖人群与交付时间。
      decision_owner: product_owner
      legal_actions: [choose_legal_option, request_evidence, pause]
      safe_actions_taken: [preserve_current_state]
      next_acceptance: 产品负责人确认范围后继续冻结验收。
      next_acceptance_role: product_owner
      audit_details: {owner_manifest: .qwq_output/env/repo/runs/feature-tree/by-fingerprint/<digest>.json}
  - id: interaction-exception
    payload:
      event_type: exception_escalation
      delivery_stage: quality_business_uat
      audience_role: quality_owner
      what_happened: 目标场景验证失败，当前不能继续准出。
      user_or_business_impact: 用户任务是否可用尚未得到证明。
      decision_owner: quality_owner
      legal_actions: [request_evidence, request_changes_in_owned_scope, hold, abort]
      safe_actions_taken: [isolate_failed_step, preserve_current_state]
      next_acceptance: 修复后由质量负责人重新检查当前场景结果。
      next_acceptance_role: quality_owner
      audit_details: {typed_blocker: REVIEW.EVIDENCE_FAILED, receipt: run.json}
      cannot_continue_reason: 必需的当前场景验证未通过。
      safest_default: 保持等待，不向下游宣称可用。
  - id: interaction-completion
    payload:
      event_type: completion_report
      delivery_stage: agent_led_implementation
      audience_role: engineering_delivery_owner
      what_happened: 授权范围内的实现与本地验证已经完成。
      user_or_business_impact: 角色可见交互已可供本地工作流使用，但尚未形成生产或商用结论。
      decision_owner: engineering_delivery_owner
      legal_actions: [approve_owned_scope, request_changes_in_owned_scope, pause]
      safe_actions_taken: [preserve_current_state, keep_external_effects_disabled]
      next_acceptance: 工程交付负责人检查本轮范围与本地验证结果。
      next_acceptance_role: engineering_delivery_owner
      audit_details: {digest: abc, exact_byte: true, readback: local}
      proof: [四类事件字段均通过本地契约测试。]
      limits: [仅证明本地实现，不代表真实用户验收、发布或业务结果。]
conversation_replay:
  input_mode: injectable_json_object
  required_input_fields: [messages, expected_event_type, expected_delivery_stage, expected_audience_role]
  canonical_private_transcript_fixture: false
  reads_private_transcript_paths: false
  example_input:
    messages:
    - {speaker: user, text: 请实现并验证本地增量。}
    expected_event_type: progress_update
    expected_delivery_stage: agent_led_implementation
    expected_audience_role: engineering_delivery_owner
