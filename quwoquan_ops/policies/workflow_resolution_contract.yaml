schema_id: workflow-resolution-contract
schema_version: 2
owner_story: specs/feature-tree/runtime/development-workflow-governance/workflow-resolution/spec.md
skill_root: .agents/skills
review_registry_ref: .agents/skills/review/references/registry.yaml#workflows
human_interaction_binding_ref: quwoquan_ops/policies/human_agent_delivery_contract.yaml#workflow_interaction_binding
evidence_fingerprint_source: quwoquan_ops/policies/agent_governance_contract.yaml#evidence_fingerprint

closed_sets:
  input_mode: [explicit, natural_structured]
  input_category: [explicit_command, natural_text, natural_structured_candidate, natural_mixed]
  resolution_status: [selected, ask, hold]
  ambiguity_terminal: [none, ask, hold]
  next_segment: [PRE, hold, terminal]
  owner_manifest_status: [fresh, missing, stale]
  host_label: [cursor, codex, unknown]
  host_adapter: [cursor-command-shell, cursor-natural-hook, codex-repository-adapter, direct-cli, unknown]
  discovery_status: [proven, unproven]
  candidate_source: [explicit_command, rule, structured_candidate]
  evidence_kind: [exact_command, contract_rule, host_classification, user_selection]
  evidence_reference: [canonical_command, host_classifier, user_explicit_workflow_selection]
  confidence_basis:
    - exact_canonical_command
    - contract_rule_match
    - structured_enumerated_evidence
    - negated_mutation
    - quoted_or_meta_mutation
    - no_high_confidence_match
    - unknown_candidate
  authorization_effect: [none]

schemas:
  workflow_resolve_receipt:
    required_fields:
      - schema_id
      - schema_version
      - result
      - terminal_code
      - recovery
      - input_mode
      - input_category
      - input_digest
      - input_length
      - selected_workflow
      - candidates
      - rejections
      - skill_ref
      - skill_digest
      - semantic_identity
      - owner_manifest_ref
      - owner_manifest_expected_target
      - owner_manifest_expected_scope
      - owner_manifest_status
      - ambiguity_terminal
      - readiness_profile
      - next_segment
      - authorization_effect
      - human_interaction_binding_ref
      - evidence_fingerprint
      - host_audit
      - receipt_digest
  candidate:
    required_fields: [workflow, source, confidence_basis, evidence_kind, evidence_digest, evidence_ref]
  rejection:
    required_fields: [workflow, code, confidence_basis]
  host_audit:
    required_fields: [claimed_host, adapter, discovery_status, discovery_evidence_ref]
  owner_manifest_input:
    required_fields: [ref, expected_target, expected_scope]
  structured_candidate:
    required_fields: [workflow, evidence]
  structured_candidate_evidence:
    required_fields: [kind, digest, reference]

resolution_policy:
  explicit_command_prefix: /
  natural_rules_are_closed: true
  free_text_deterministic_claim_forbidden: true
  one_high_confidence_candidate_required: true
  overlap_terminal: ask
  low_confidence_terminal: ask
  unknown_candidate_terminal: hold
  unknown_candidate_precedes_ask: true
  manifest_failure_precedes_candidate_terminal: true
  owner_manifest_required_for_pre: true
  owner_manifest_caller_status_forbidden: true
  owner_manifest_ref_repo_relative_only: true
  owner_manifest_reject_symlink: true
  owner_manifest_validate_current_fingerprint: true
  stale_owner_manifest_blocks_pre: true
  routine_workflows_require_human_checkpoint: false
  dynamic_audience_reference_only: true
  resolver_grants_external_write_authority: false
  input_digest_includes: [input_mode, normalized_input]
  receipt_digest_includes: [semantic_fields, terminal_descriptor, host_audit]
  semantic_identity_excludes: [input_mode, input_category, input_digest, input_length, receipt_digest, host_audit]
  parity_fields: [selected_workflow, skill_digest, readiness_profile, next_segment, authorization_effect]
  mutation_workflows: [dev, commit, environment-ops, content-production]
  negation_markers: [不要, 不用, 无需, 请勿, 别, 禁止, 不允许, 不打算, not, do not, don't]
  meta_markers: [这句话, 这段话, 文案, 示例, 讨论, 提到, 引用, 测试文本, 意图识别, quote, example, discuss]
  quote_pairs: ['""', '“”', '‘’', '``']

terminal_matrix:
  selected:
    terminal_codes: [WFR.SELECTED]
    selected_workflow: required
    legal_high_confidence_candidates: exactly_one
    owner_manifest_status: fresh
    ambiguity_terminal: none
    next_segment: PRE
  ask:
    terminal_codes: [WFR.AMBIGUOUS, WFR.LOW_CONFIDENCE, WFR.MUTATION_INTENT_UNCERTAIN]
    selected_workflow: forbidden
    owner_manifest_status: fresh
    ambiguity_terminal: ask
    next_segment: terminal
  hold:
    terminal_codes:
      - WFR.CONTRACT_INVALID
      - WFR.INPUT_INVALID
      - WFR.UNKNOWN_EXPLICIT_COMMAND
      - WFR.UNKNOWN_CANDIDATE
      - WFR.OWNER_MANIFEST_REQUIRED
      - WFR.OWNER_MANIFEST_UNSAFE
      - WFR.OWNER_MANIFEST_INVALID
      - WFR.OWNER_MANIFEST_TARGET_MISMATCH
      - WFR.OWNER_MANIFEST_OWNER_MISMATCH
      - WFR.OWNER_MANIFEST_STALE
      - WFR.RECEIPT_INVALID
      - WFR.DISCOVERY_UNPROVEN
    ambiguity_terminal: hold
    next_segment: [hold, terminal]

readiness_profiles:
  explore: {profile: discovery_readiness, next_segment: PRE, human_checkpoint: false}
  prd: {profile: product_definition_readiness, next_segment: PRE, human_checkpoint: false}
  design: {profile: solution_design_readiness, next_segment: PRE, human_checkpoint: false}
  dev: {profile: implementation_readiness, next_segment: PRE, human_checkpoint: false}
  continue: {profile: recovery_readiness, next_segment: PRE, human_checkpoint: false}
  plan-next: {profile: round_closure_readiness, next_segment: PRE, human_checkpoint: false}
  review: {profile: review_readiness, next_segment: PRE, human_checkpoint: false}
  commit: {profile: integration_commit_readiness, next_segment: PRE, human_checkpoint: false}
  environment-ops: {profile: environment_operation_readiness, next_segment: PRE, human_checkpoint: false}
  content-production: {profile: content_execution_readiness, next_segment: PRE, human_checkpoint: false}
  incident-inspection: {profile: incident_inspection_readiness, next_segment: PRE, human_checkpoint: false}
  distill: {profile: knowledge_distillation_readiness, next_segment: PRE, human_checkpoint: false}

workflows:
  explore:
    canonical_command: /explore
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/explore/SKILL.md
    natural_rules:
      - {id: explore-ownership, all_terms: [先分析]}
      - {id: explore-scope, any_terms: [看归属, 怎么拆, 有哪些风险]}
  prd:
    canonical_command: /prd
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/prd/SKILL.md
    natural_rules:
      - {id: prd-freeze, any_terms: [写 PRD, 冻结需求, 明确规格, 明确范围, 明确验收]}
  design:
    canonical_command: /design
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/design/SKILL.md
    natural_rules:
      - {id: design-decision, any_terms: [设计方案, 梳理架构, 明确边界, 明确回滚, 明确观测]}
  dev:
    canonical_command: /dev
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/dev/SKILL.md
    natural_rules:
      - {id: dev-implement, any_terms: [实现, 修复, 开始写代码, 加字段, 加接口, 加事件, 加查询, 加对象, 新建服务]}
  continue:
    canonical_command: /continue
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/continue/SKILL.md
    natural_rules:
      - {id: continue-resume, any_terms: [继续开发, 接着做, 续跑, 按规划实施, 复盘后接着做, 继续]}
  plan-next:
    canonical_command: /plan-next
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/plan-next/SKILL.md
    natural_rules:
      - {id: plan-next-close, any_terms: [下一轮做什么, 计划复核, 闭环自检, 这轮做完了吗]}
  review:
    canonical_command: /review
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/review/SKILL.md
    natural_rules:
      - {id: review-evaluate, any_terms: [评审, 审核, 检视, plan review, code review, 验证, 准出检查]}
  commit:
    canonical_command: /commit
    host_explicit_entry_available: true
    automatic_only: false
    skill_ref: .agents/skills/commit/SKILL.md
    natural_rules:
      - {id: commit-create, any_terms: [创建提交, git commit, 提交]}
  environment-ops:
    canonical_command: /environment-ops
    host_explicit_entry_available: false
    automatic_only: true
    skill_ref: .agents/skills/environment-ops/SKILL.md
    natural_rules:
      - {id: env-stackctl, any_terms: [stackctl, gamma-local, prod-hosted, 环境启动, 健康检查, 灰度, 回滚, 部署]}
  content-production:
    canonical_command: /content-production
    host_explicit_entry_available: false
    automatic_only: true
    skill_ref: .agents/skills/content-production/SKILL.md
    natural_rules:
      - {id: content-run, any_terms: [内容生产, 跑内容任务, 恢复内容任务, immutable release, 数据发布]}
  incident-inspection:
    canonical_command: /incident-inspection
    host_explicit_entry_available: false
    automatic_only: true
    skill_ref: .agents/skills/incident-inspection/SKILL.md
    natural_rules:
      - {id: incident-observe, any_terms: [ES 巡检, 异常监控, 线上错误, 线上异常, exception triage, traceId, requestId, fingerprint]}
  distill:
    canonical_command: /distill
    host_explicit_entry_available: false
    automatic_only: true
    skill_ref: .agents/skills/distill/SKILL.md
    natural_rules:
      - {id: distill-rule, any_terms: [沉淀规则, 教训沉淀, 规则候选]}

host_projections:
  neutral_adapter: quwoquan_ops/cli/workflow_host_adapter.py
  cursor:
    explicit_adapter: cursor-command-shell
    explicit_shell_root: .cursor/commands
    explicit_workflows: [explore, prd, design, dev, continue, plan-next, review, commit]
    arbitrary_message_intercept_available: false
    natural_adapter: cursor-natural-hook
    natural_discovery_status: unproven
  codex:
    repository_adapter: codex-repository-adapter
    native_explicit_entry_available: false
    arbitrary_message_intercept_available: false
    natural_discovery_status: unproven

errors:
  WFR.SELECTED: {terminal: selected, recovery: enter_selected_skill_pre}
  WFR.CONTRACT_INVALID: {terminal: hold, recovery: repair_canonical_workflow_resolution_contract}
  WFR.INPUT_INVALID: {terminal: hold, recovery: supply_declared_resolver_input}
  WFR.UNKNOWN_EXPLICIT_COMMAND: {terminal: hold, recovery: select_canonical_workflow_command}
  WFR.UNKNOWN_CANDIDATE: {terminal: hold, recovery: select_candidate_from_canonical_workflow_closed_set}
  WFR.LOW_CONFIDENCE: {terminal: ask, recovery: ask_user_to_select_listed_candidate_or_explicit_command}
  WFR.AMBIGUOUS: {terminal: ask, recovery: ask_user_to_select_one_listed_candidate}
  WFR.MUTATION_INTENT_UNCERTAIN: {terminal: ask, recovery: ask_user_to_state_mutation_intent_directly}
  WFR.OWNER_MANIFEST_REQUIRED: {terminal: hold, recovery: generate_current_owner_manifest}
  WFR.OWNER_MANIFEST_UNSAFE: {terminal: hold, recovery: supply_safe_repo_relative_regular_manifest_ref}
  WFR.OWNER_MANIFEST_INVALID: {terminal: hold, recovery: regenerate_canonical_owner_manifest}
  WFR.OWNER_MANIFEST_TARGET_MISMATCH: {terminal: hold, recovery: regenerate_manifest_for_expected_target}
  WFR.OWNER_MANIFEST_OWNER_MISMATCH: {terminal: hold, recovery: repair_feature_tree_owner_resolution}
  WFR.OWNER_MANIFEST_STALE: {terminal: hold, recovery: regenerate_owner_manifest_for_current_fingerprint}
  WFR.RECEIPT_INVALID: {terminal: hold, recovery: rerun_resolution_from_digestible_input}
  WFR.DISCOVERY_UNPROVEN: {terminal: hold, recovery: run_real_host_smoke_protocol}

smoke_protocol:
  status: OPEN
  open_id: OPEN-001
  claim_limit: local_contract_does_not_prove_real_cursor_or_codex_discovery
  steps:
    - 在真实 Cursor 宿主分别提交一个显式命令与其 canonical 自然语言等价输入，保存宿主发现结果和 resolver receipt。
    - 在真实 Codex 宿主重复同一输入对，保存宿主发现结果和 resolver receipt。
    - 核对四份 receipt 的 parity_fields 与 semantic_identity，并确认 host_audit 只进入 receipt audit/digest。
    - 任一宿主未实际完成发现时保持 WFR.DISCOVERY_UNPROVEN，不以本地测试替代。
