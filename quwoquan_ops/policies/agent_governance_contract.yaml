tracked_projections:
  authoring_source: .agents/skills/review/references/reviewer-executor.md
  generator: quwoquan_ops/tools/generate_agent_adapters.py
  outputs:
    - .cursor/agents/reviewer.md
    - .codex/agents/reviewer.toml
  manual_edit: forbidden

runtime_outputs:
  root: .qwq_output
  disposable: true
  tracked: false
