version: 1
policy:
  name: config-release-slo-gate

thresholds:
  error_rate:
    warn: 0.01
    critical: 0.03
  p95_ms:
    warn: 300
    critical: 600
  redis_error_rate:
    warn: 0.01
    critical: 0.03
  startup_welcome:
    ttid_p50_ms: 1000
    ttid_p95_ms: 2000
    shell_first_paint_target_ms: 3000
    welcome_exit_hard_ms: 6000
    overlay_removed_hard_ms: 6000
    replay_1_rate_warn: 0.05
    replay_2_rate_warn: 0.005
    degraded_or_deadline_rate_critical: 0.001
    consecutive_slow_frame_ms: 32
    consecutive_slow_frame_count: 2

readback:
  window: 5m
  minimum_samples: 100
  settle_seconds:
    gray-initial: 120
    carry-on: 120
    full: 120
  # N2-5 推荐业务指标（仅对 content-service readback 生效）：
  # 空 feed 率与负反馈率超 critical 直接阻断放量；CTR 为观察指标——
  # impression 样本低于 min_impressions 时诚实跳过（不虚报、不拦截）。
  recommendation:
    service: content-service
    min_impressions: 200
    empty_feed_rate:
      warn: 0.05
      critical: 0.20
    negative_feedback_rate:
      warn: 0.05
      critical: 0.15
    ctr_floor_warn: 0.005

decisions:
  continue_when: "all metrics below warn"
  pause_when: "any metric >= warn and all metrics < critical"
  rollback_when: "any metric >= critical"
