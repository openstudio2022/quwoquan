schema: emitted-error-code-declaration-baseline
governance:
  owner: cloud-contract-governance
  reason: 实现已发射但两个声明源都无声明位的存量码只减不增，新增即 BLOCK
  expires_when: codes 与 unresolved_sites 均为空时删除本文件
# 反向错误码治理基线：实现发射了 stable code，但两个声明源（各对象 errors.yaml 与
# contracts/runtime_errors/errors/runtime_failure_codes.yaml）都没有声明位。
#
# 门禁：quwoquan_ops/gate/verify_emitted_error_code_declaration.py
# 语义：只减不增。新增未声明码立刻 BLOCK；条目一旦被声明或不再发射，必须删除。
# 只接受精确 MODULE.KIND.reason，不接受通配符、前缀或 module 级批量豁免。
# 排序：codes 必须按 code 升序，保证 diff 友好。
#
# codes 段当前为空：当前覆盖形态（runtime NewCode 家族）扫描出的未声明码已全部
# 处置完毕，本段进入纯防回退状态。
#
# 覆盖范围：当前只覆盖 runtime NewCode 家族（EMISSION_FORMS）。已知至少还有五种
# 发射形态未覆盖（AppErrorFrom* 生成构造器、错误码字面量、go_const 标识符、
# 文件内局部构造器、领域 sentinel 状态码映射），端侧 quwoquan_app 也未覆盖。
# 因此 0 不是未声明码的上界，unresolved_sites 段仍有 3 个手工枚举出的未声明码。
#
# 修复方向（清零后删除对应条目即可收紧门禁）：
#   1. 在所属对象 errors.yaml 补声明位（stable code / http_status / user_message /
#      recovery.action / disruptionLevel / go_const / dart_const），再 verify/codegen。
#   2. 或把实现改成发射已声明码。
codes: []

# 维度盲点：module/kind 不唯一，当前形态无法静态解析。这里登记是为了让「盲点变多」
# 同样 BLOCK，避免维度悄悄失去覆盖。emits 是手工枚举结果，attested_scope 必须写明
# 所依据的搜索范围（弱判据纪律：不得以「标识符查无」下结论）。
# emits 里未声明的码只报告不阻断——扫描器无法重新推导它们，把无法自动复核的手工
# 事实做成阻断条件等于把门禁绑在会腐烂的台账上。它们属下一轮形态扩展范围。
unresolved_sites:
- path: quwoquan_service/control-plane/platform-ops/cmd/api/main.go
  function: writeRuntimeError
  expression: NewCode(rterr.ModuleOps, kind, reason)
  attested_scope: 读 writeRuntimeError 函数体全部分支（main.go:657-679）
  emits:
  - OPS.SYSTEM.internal_error
  - OPS.USER.invalid_argument
  note: 按 HTTP 状态码合成，400/405/404 -> USER.invalid_argument，其余 -> SYSTEM.internal_error
- path: quwoquan_service/runtime/auth/operation_guard.go
  function: writeOperationGuardError
  expression: NewCode(rterr.ModuleGateway, rterr.KindUser, reason)
  attested_scope: rg 全仓 writeOperationGuardError 调用点（operation_guard.go 内 6 处：106/324/334/344/357/372）
  emits:
  - GATEWAY.USER.forbidden
  - GATEWAY.USER.route_not_found
  - GATEWAY.USER.unauthorized
  note: 全平台默认拒绝边界 RequireGeneratedOperationAuthorization；返回频次最高的一组拒绝码
- path: quwoquan_service/runtime/messaging/dead_letter_recovery_http.go
  function: deadLetterRecoveryHandler
  expression: NewCode(config.Module, rterr.KindSystem, "internal_error",)
  attested_scope: rg 全仓 WithDeadLetterRecoveryRoute 装配点的 Module 字段（chat/content/notification/search/circle/rtc/realtime-gateway 七处 cmd/api/main.go）
  emits:
  - CHAT.SYSTEM.internal_error
  - CIRCLE.SYSTEM.internal_error
  - CONTENT.SYSTEM.internal_error
  - NOTIFICATION.SYSTEM.internal_error
  - REALTIME.SYSTEM.internal_error
  - RTC.SYSTEM.internal_error
  - SEARCH.SYSTEM.internal_error
  note: module 由 runtime 配置注入；七个装配模块的对应码全部已有声明位
- path: quwoquan_service/runtime/messaging/dead_letter_recovery_http.go
  function: deadLetterRecoveryHandler
  expression: NewInvalidArgument(config.Module, ...)
  attested_scope: 同上七个 WithDeadLetterRecoveryRoute 装配点
  emits:
  - CHAT.USER.invalid_argument
  - CIRCLE.USER.invalid_argument
  - CONTENT.USER.invalid_argument
  - NOTIFICATION.USER.invalid_argument
  - REALTIME.USER.invalid_argument
  - RTC.USER.invalid_argument
  - SEARCH.USER.invalid_argument
  note: 七个装配模块的对应码全部已有声明位
- path: quwoquan_service/services/product-ops-service/cmd/api/main.go
  function: writeRuntimeError
  expression: NewCode(module, kind, reason)
  attested_scope: 读 writeRuntimeError 状态码 switch 全部分支（main.go:880-922）
  emits:
  - GATEWAY.USER.forbidden
  - GATEWAY.USER.unauthorized
  - OPS.SYSTEM.internal_error
  - OPS.USER.conflict
  - OPS.USER.invalid_argument
  - OPS.USER.route_not_found
  note: module 与 kind 同时是变量；按 file-wide 取值集合叉乘会从 6 个真实码膨胀成 24 个组合码，故不解析
- path: quwoquan_service/services/tag-service/internal/tag/tag_feedback_fact/adapters/inbound/http/handler.go
  function: feedbackError
  expression: NewCode(moduleTag, kind, reason)
  attested_scope: rg tag-service 全服务 feedbackError( 调用点（handler.go:78/82/84），排除 _test.go
  emits:
  - TAG.SYSTEM.feedback_storage_failed
  - TAG.USER.feedback_idempotency_conflict
  - TAG.USER.feedback_invalid_action
  note: 文件内局部构造器形态；三个码全部已有声明位
- path: quwoquan_service/services/tag-service/internal/tag/tag_taxonomy_release/adapters/inbound/http/taxonomy_release_handler.go
  function: releaseError
  expression: NewCode(moduleTag, kind, reason)
  attested_scope: rg tag-service 全服务 releaseError( 调用点（taxonomy_release_handler.go:77-87 共 6 处），排除 _test.go
  emits:
  - TAG.SYSTEM.release_storage_failed
  - TAG.USER.release_idempotency_conflict
  - TAG.USER.release_invalid_transition
  - TAG.USER.release_not_found
  - TAG.USER.release_snapshot_incomplete
  - TAG.USER.release_version_conflict
  note: 文件内局部构造器形态；六个码全部已有声明位
