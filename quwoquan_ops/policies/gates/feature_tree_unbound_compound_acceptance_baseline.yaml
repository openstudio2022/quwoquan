schema: feature-tree-unbound-compound-acceptance-ratchet
governance:
  owner: feature-tree-governance
  reason: |
    有多条结果子句的验收，整体只绑一个 spec_ref 时无法说明哪条子句真被断言过。
    这类验收既不在 OPEN 里挂账（被当作已闭合），也没有逐子句证据，缺失的那部分
    就此没有任何出口。
  expires_when: entries 归零时删除本文件，并把子句级绑定改为全树零容忍
  measure: |
    unbound_compound_anchors 对每个 spec.md 取结果子句数 >= 2 的验收，若该验收未被
    任何 OPEN 的完成判定引用，且测试树中没有任何 `#<anchor>.tN` 形式的 spec_ref，
    即计入。
  superseded_measure: |
    旧口径把同一份计数直接 print 成「RATCHET: ... 只减不增，改动即需补齐」，但代码
    里算完就走，既不读基线也不比对，随后直接 return 0——「只减不增」从未被执行过。
    删掉一条「要求逐子句绑定」的 OPEN 而不补绑定时，欠的证据会原地滑进这个计数且
    不触发任何告警。切换到全树逐条硬门当日实测 162。
  note: |
    这里记录具体条目而不是总数。纯计数基线挡不住「补齐一条旧的、同时放过一条新的」
    这种总数不变的漂移；逐条登记后，任何不在册的无绑定复合验收都会被直接 BLOCK，
    而补齐子句绑定的条目必须同批从这里删除。

