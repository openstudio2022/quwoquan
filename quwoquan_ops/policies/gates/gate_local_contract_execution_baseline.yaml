schema: gate-local-contract-execution-baseline
governance:
  owner: repo-gate-governance
  reason: 存量门禁的配套 local_contract 测试尚未接入任何 gate 链；逐条接线会显著拉长 make gate 单次时长，需按门禁分批评估执行相位后再接，故先按只减不增登记，防止缺口继续扩大
  expires_when: unexecuted_companion_tests 为空时删除本文件，并把本门禁改为零容忍
# 门禁：quwoquan_ops/gate/verify_gate_local_contract_execution.py
# 语义：只减不增。新增「门禁在链上、配套 local_contract 测试不在链上」的组合立刻
# BLOCK；条目一旦被接线（gate_repo.sh 直接执行，或纳入某条 gate 链可达的 pytest
# 目录），必须从本文件删除，否则同样 BLOCK。
#
# 判定范围：只覆盖「门禁脚本名与测试 subject 同源」的配套关系
# （`verify_<subject>.py` ↔ `<subject>__<facet>__local_contract_test.py`）。
# 命名不同源的门禁/测试对（例如 verify_test_no_fake.py ↔
# test_no_fake_gate__local_contract_test.py、verify_domain_governance.py ↔
# test_domain_governance_dns__local_contract_test.py）当前判定不到，
# 因此本文件的条目数不是未接线门禁的上界。
#
# 接线方式二选一：
#   1. 在 gate_repo.sh 对应门禁旁直接 `python3 <test>`（适合秒级测试）；
#   2. 把测试纳入某条已在 gate 链上的 pytest 目录参数（适合成组接入）。
#
# 登记时的一次性执行审计（2026-08-07，dev1.0 脏工作树）：本文件全部条目 + 当时
# 尚未接线的 test_single_track_contracts 一起实跑，结论是
#   * 绿：22 个条目；
#   * 红：test_service_architecture__contract__local_contract_test.py，红因是它
#     包裹的 verify_service_architecture.py 当前本就失败。审计时记录的两个红因
#     中，chat-service 的写入探针残骸已清除，当前只剩 api-edge
#     edge_security/operation_admission_decision 的对象层缺口。该门禁脚本本身在
#     gate 链上，所以这条红是显性的存量门禁失败，不属于「红而无人可见」，
#     接线后会与门禁同进同退。
