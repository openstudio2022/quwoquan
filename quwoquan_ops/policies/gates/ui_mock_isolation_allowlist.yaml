# UI / App / Core / Cloud 与 cloud/services/*/mock 隔离 — 过渡期豁免清单
#
# 规则：verify_ui_mock_isolation.py 扫描 lib/ui、lib/app、lib/core、lib/cloud；
#      命中下列违规时，仅当 (relative_path + rule) 在本表 allowed 中才通过。
# path 可写 `lib/ui/...` 或 `ui/...`（脚本会规范化为相对于 quwoquan_app/lib 的路径）。
# 治理：每修复一处，删除对应条目；禁止为新增文件追加豁免（应直接按规范实现）。
#
governance:
  owner: runtime-client-foundation
  reason: production UI/App/Core/Cloud 与 Mock 物理隔离迁移期间冻结存量
  expires_when: allowed 为空时删除本文件

allowed:
  # ── B2 扩扫 lib/cloud 时的存量棘轮基线（content 域已清零）────────────
  # 归属批次：circle→B6、entity→B4、rtc→B9、user→B3；
  # 各批 Remote-only 改造完成后删除对应条目，禁止新增。
  - path: cloud/services/circle/circle_repository.dart
    rule: import_cloud_mock
  - path: cloud/services/circle/mock/circle_contract_seed_helpers.dart
    rule: import_cloud_mock
