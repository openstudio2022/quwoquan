schema: media-delivery-consumer-sweep
governance:
  owner: content-media-delivery
  reason: |
    枚举式 sealed 清单只盯已收口的文件，新增或从未被想起的消费点不在清单里，
    于是「私有资产走公开 URL」这类漏接在门禁上永远不会红。逐轮补清单的结果是
    每轮都宣称收完、每轮又被翻出新的一批。
  measure: |
    media_delivery_consumer_sweep 扫 quwoquan_app/lib 下全部直连公开渲染原子
    （AppCachedNetworkImage / AppMediaImage / AppAvatarImage / AppCircularAvatar /
    RoundedSquareAvatar / ArticleAdaptiveImage）的位置，排除原子自身定义文件与
    typed 入口的 publicBuilder/readyBuilder/signedReadyBuilder 分派回调。
    每一处命中都必须落到 baseline 或 allowlist 之一，不在册即 BLOCK。
  expires_when: baseline 归零时删除该段，并把未登记命中改为全仓零容忍
  note: |
    这里记录具体 site 而不是总数。纯计数基线挡不住「修一处、又漏接一处」这种
    总数不变的漂移；逐条登记后，收口一处必须同批删除对应条目，行号漂移导致的
    陈旧条目同样 BLOCK，册子因此不会腐化成一张无人维护的白名单。

# 待收口：消费 release 媒体却未经 typed 交付入口分流。修一处删一条，归零即链路闭合。
baseline:

# 按设计不消费 release 交付的渲染位。每条必须写明归类理由。
