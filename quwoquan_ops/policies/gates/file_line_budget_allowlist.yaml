_comment: 已退休的 R03 文件行数预算 allowlist。消费者 verify_file_line_budget.py 已删除；文件规模由 canonical Code Health Delta 单轨拥有。allow 已清空，本文件在下一提交删除。
governance:
  owner: repository-architecture
  reason: 消费者已退休且文件规模改由 code_health_policy.yaml 单轨治理，存量条目全部低于新的 2000 行硬顶，不再构成债务
  expires_when: allow 为空时删除本文件（已满足；受「含债 baseline 不得删除」约束需先清空再于下一提交删除）
  measure: |
    无消费者。文件规模事实由 quwoquan_ops/policies/code_health_policy.yaml 的
    thresholds.file_lines 与 verify_incremental_code_health.py 派生：新越过 block 或
    既有超限继续增长即 GATE_BLOCK，超过 advisory 且增长即 PR_WARN。
  superseded_measure: |
    旧口径：verify_file_line_budget.py 统计各源文件物理行数，超过 block_threshold(1000)
    且不在 allow 内即 BLOCK；allow 内文件超过各自 max_lines 也 BLOCK。
    换口径原因：该脚本已在 b0b680056 删除，本文件自此无任何读取者；同一事实由
    Code Health Delta 增量判罚，双轨只会制造第二真相源。
    旧口径实测值（2026-09-06）：14 个 allow 条目，max_lines 1002–1552，全部等于当前实际行数，
    均低于新 block 阈值 2000。
block_threshold: 2000
allow: []
