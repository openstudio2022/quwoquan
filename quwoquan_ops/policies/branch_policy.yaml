allowed_local_branches:
  - dev1.0
  - main
  - lane/product-mainline
  - lane/data-engineering
  - lane/engineering
  - lane/ops
  - lane/small-fix
  - lane/refactor

allowed_remote_branches:
  - dev1.0
  - main
  - lane/product-mainline
  - lane/data-engineering
  - lane/engineering
  - lane/ops
  - lane/small-fix
  - lane/refactor

pull_request_branch_prefixes:
  - lane/

integration_branch: dev1.0
integration_branch_activation:
  state: active
  transition_command: python3 -B quwoquan_ops/gate/verify_git_branch_policy.py --activation-transition --evidence-path .qwq_output/env/repo/runs/branch-policy/dev1.0-activation.json
  evidence_kind: integration_branch_activation_v1
  bootstrap:
    remote_before_oid: absent
    remote_after_oid: exact_local_integration_head
    source_branch: dev1.0
    target_branch: dev1.0
    release_eligibility: false
  active:
    accepted_updates:
      - lane_pull_request_merge
      - system_fast_forward_backsync
      - integration_matching_fast_forward_push
    # matching_integration_or_lane_only：integration 与 lane 一样只允许推同名远端；
    # integration→origin/dev1.0 另强制 expected-old 快进；main 仍禁止直推。
    direct_push: matching_integration_or_lane_only
release_branch: main
production_source_branch: main
production_workflow: .github/workflows/deploy-prod-auto.yml

required_promotion_checks:
  - name: 03. Delivery Gate
    workflow: .github/workflows/delivery-gate.yml
  - name: 04. Pre-Release Gate
    workflow: .github/workflows/pre-release-gate.yml
  - name: 05. App Env Device Matrix
    workflow: .github/workflows/app-env-device-matrix-self-hosted.yml

allowed_pull_request_edges:
  - head: dev1.0
    base: main
  - head: lane/*
    base: dev1.0

system_backsync:
  head: main
  base: dev1.0
  mode: fast-forward-only

# 六条固定 lane 是长期 writer 分支：最多六个不同 lane writer，同一 lane
# 同一时刻至多一个 writer；integration/abort 后 worktree retained，并强制
# fast-forward resync 到新的 dev1.0。共享 host mutation 仍保持单 writer。
persistent_lane_admission:
  isolation: branch_per_writer
  promotion: declared_pull_request_edge_only
  resync: mandatory_fast_forward_after_integration_or_abort
  worktree_lifecycle: retained
  concurrency_evidence: required

failure_codes:
  policy_invalid: OPS.BRANCH.POLICY_INVALID
  ref_not_allowed: OPS.BRANCH.REF_NOT_ALLOWED
  direct_push_not_allowed: OPS.BRANCH.DIRECT_PUSH_NOT_ALLOWED
  backsync_not_fast_forward: OPS.BRANCH.BACKSYNC_NOT_FAST_FORWARD
  backsync_cas_conflict: OPS.BRANCH.BACKSYNC_CAS_CONFLICT
  authority_unavailable: OPS.BRANCH.AUTHORITY_UNAVAILABLE
  source_not_main_reachable: OPS.BRANCH.SOURCE_NOT_MAIN_REACHABLE
  integration_read_only: OPS.BRANCH.INTEGRATION_READ_ONLY
