    implementation_path: quwoquan_service/services/integration-service/internal/infrastructure/provider/amap_client.go
    sdk_dependencies: [go:stdlib/net/http]
    implementation_status: implemented_fail_closed
    allowed_environments: [alpha, beta, gamma, prod]
    secret_refs: [runtime_secret:INTEGRATION_LOCATION_AMAP_KEY]
    production_grade: true
    declared_gap: 尚未成为任何环境的 selected Binding；不能用作自动回退或准出证据。
    notes: 候选 Adapter 必须通过受控 Binding 切换，不能由请求路径按字符串选择。
