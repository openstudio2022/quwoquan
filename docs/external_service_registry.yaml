adapters:
  - <<: *adapter_defaults
    adapter_id: ext.map.baidu
    display_name: 百度地图 Adapter
    capability_id: integration.location.lookup
    category: map
    vendor: baidu
    endpoint_ref: environment_binding:integration.location
    access_policy: central_integration
    consumers: [integration-service]
    metadata_refs: [quwoquan_service/contracts/metadata/integration/location/service.yaml, quwoquan_service/contracts/metadata/integration/location/errors.yaml]
    implementation_path: quwoquan_service/services/integration-service/internal/infrastructure/provider/baidu_client.go
    sdk_dependencies: [go:stdlib/net/http]
    implementation_status: implemented_fail_closed
    allowed_environments: [alpha, beta, gamma, prod]
    secret_refs: [runtime_secret:INTEGRATION_LOCATION_BAIDU_AK]
    production_grade: true
    declared_gap: 各环境 Binding 仍保持 blocked，直至注入凭据、真实调用和配额观测证据。
    notes: 仅由 integration-service 组合根按编译期 Binding 显式装配；不可作为运行时回退目标。
