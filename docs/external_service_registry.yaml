version: 1
description: >
  外部服务依赖机读登记表。覆盖 app/service/data/ops 的外部 SaaS、公开数据源、
  自托管基础设施与客户端平台能力。配套说明见 docs/external_service_dependency_registry.md。

status_legend:
  production: 生产路径已接通，存在真实实现
  mock: 仅 mock provider 或 mock SDK
  test_fixture_only: 仅 local_contract/alpha runner 可达，任何 service/production 组合根均不可达
  sandbox: 仅沙箱 / allowlist / 半真实路径
  planned: metadata 或接口存在，但真实实现未落地
  registered_only: 只在注册表或目录中声明，未发现运行时调用
  none: 代码中未发现真实接入实现

compliance_legend:
  compliant: 已登记，且访问路径符合当前规格
  violation: 已发现绕过统一出口或关键校验缺失
  waived: 不适用统一出口，但已显式登记并说明理由

fields:
  - service_id
  - display_name
  - category
  - vendor
  - endpoint
  - access_layer
  - consumers
  - metadata_ref
  - impl_status
  - env_matrix
  - secrets
  - compliance
  - gap
  - notes

