schema: external-provider-governance
description: >-
  外部能力唯一登记表。Capability 声明业务能力和唯一 Port；Adapter 声明具体供应商、
  实现边界和可部署环境。端点与凭据只允许以 Binding / runtime_secret 引用表达。
governance_refs: &governance_refs
  slo: specs/feature-tree/runtime/runtime-external-integration/spec.md
  privacy: specs/feature-tree/runtime/runtime-external-integration/design.md
  cost: specs/feature-tree/runtime/runtime-external-integration/design.md
  degradation: specs/feature-tree/runtime/runtime-external-integration/design.md
  rollback: specs/feature-tree/runtime/runtime-external-integration/design.md
acceptance_refs: &acceptance_refs
  - specs/feature-tree/runtime/runtime-external-integration/acceptance.yaml
adapter_defaults: &adapter_defaults
  endpoint_ref: not_configured
  consumers: []
  metadata_refs: []
  implementation_path: not_implemented
  sdk_dependencies: []
  implementation_status: registered_only
  allowed_environments: []
  secret_refs: []
  production_grade: false
  conformance_profile: generic_provider
  governance_refs: *governance_refs
  compliance: registered
  declared_gap: 未绑定到运行时组合根，不能作为任何环境的能力完成证据。
  notes: 已完成资产盘点；启用前必须实现真实 Adapter、Binding 和九格证据。

capabilities:
