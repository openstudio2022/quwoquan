    owner: integration-service
    canonical_port: integration.location.LocationProvider
    access_policy: central_integration
    required_environments: [beta, gamma, prod]
    binding_scope: root_composed
    binding_roots:
      - root_id: integration-service-api
        descriptor_owner: integration-service
        descriptor_output: quwoquan_service/services/integration-service/internal/generated/external_provider_bindings.g.go
        entrypoint: quwoquan_service/services/integration-service/cmd/api/main.go
        entrypoint_symbol: ResolveLocationLookup
        resolver_path: quwoquan_service/services/integration-service/internal/infrastructure/providerbinding/location_binding.go
        resolver_symbol: ResolveLocationLookup
    governance_refs: *governance_refs
    acceptance_refs: *acceptance_refs
  - capability_id: identity.sms.otp
