apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  labels:
    app.kubernetes.io/name: realtime-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime-gateway
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: realtime-gateway
      containers:
        - name: realtime-gateway
          image: realtime-gateway/realtime-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: gamma
            - name: SERVICE_NAME
              value: realtime-gateway
            - name: CONFIG_ROOT
              value: /etc/realtime-gateway
            - name: CONFIG_VERSION
              value: v0.0.0
            - name: IMAGE_VERSION
              value: v0.0.0
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: realtime-gateway-secrets
                  key: REDIS_ADDR
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: realtime-gateway-secrets
                  key: AUTH_JWT_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
