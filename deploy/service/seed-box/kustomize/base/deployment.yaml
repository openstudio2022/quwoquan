apiVersion: apps/v1
kind: Deployment
metadata:
  name: seed-box
  labels:
    app.kubernetes.io/name: seed-box
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seed-box
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-box
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: seed-box
      containers:
        - name: seed-box
          image: ghcr.io/openstudio2022/quwoquan/seed-box:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: gamma
            - name: SERVICE_NAME
              value: seed-box
            - name: CONFIG_ROOT
              value: /app/runtime-config
            - name: CONFIG_VERSION
              value: v0.0.0
            - name: IMAGE_VERSION
              value: v0.0.0
            - name: SEED_BOX_HTTP_ADDR
              value: ":8080"
            - name: REC_MODEL_SERVICE_ENABLED
              value: "true"
            - name: REC_MODEL_SERVICE_URL
              value: http://recommendation-service:8000
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: MONGO_URI
                  optional: true
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: MONGO_URI
                  optional: true
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: POSTGRES_DSN
                  optional: true
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: REDIS_ADDR
                  optional: true
            - name: CIRCLE_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: CIRCLE_MONGO_URI
                  optional: true
            - name: CIRCLE_REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: CIRCLE_REDIS_ADDR
                  optional: true
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: AUTH_JWT_SECRET
                  optional: true
            - name: CHAT_GROUP_AVATAR_CDN_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: seed-box-secrets
                  key: CHAT_GROUP_AVATAR_CDN_BASE_URL
                  optional: true
            - name: CHAT_GROUP_AVATAR_LOCAL_MEDIA_ROOT
              value: /tmp/chat-media
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
