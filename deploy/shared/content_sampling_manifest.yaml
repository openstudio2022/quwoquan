# 按环境内容采样真相源（唯一）。
# publish/ 是单一发布主线（prod 全量）；其余环境按 sampleRatio + caps 确定性采样。
# 采样产物 = publish/sample_bundles/{env}.json（桥契约），由服务侧 importer 消费灌入运行库。
#
# 采样确定性：seedHash(salt + ref) 映射到 [0,1)，< sampleRatio 入选；再按 bucket cap 截断。
# 同一 ref 在同一 env/salt 下结果稳定，可重跑、可审计。
schemaVersion: quwoquan.content_sampling_manifest
salt: "qwq-content-2026"
environments:
  prod:
    description: 生产全量，不采样
    sampleRatio: 1.0
    postCapPerBucket: 0      # 0 = 不限
    entityCapPerBucket: 0
    maxPosts: 0
    maxEntities: 0
  gamma:
    description: 自动化集成，半量采样
    sampleRatio: 0.5
    postCapPerBucket: 80
    entityCapPerBucket: 60
    maxPosts: 2000
    maxEntities: 1500
  beta:
    description: 人工验收，小样
    sampleRatio: 0.2
    postCapPerBucket: 24
    entityCapPerBucket: 20
    maxPosts: 600
    maxEntities: 400
  alpha:
    description: 开发/CI 冒烟，极小样
    sampleRatio: 0.05
    postCapPerBucket: 6
    entityCapPerBucket: 6
    maxPosts: 120
    maxEntities: 100
