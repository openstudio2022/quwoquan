vertical: travel
category: travel
intent: 行前指南
carrier: article
styleFamily: 实用攻略风
audiences: [selfDriveTraveler, familyTraveler]
creatorPersona:
  archetype: self_drive_expert
  preferredCreatorIds: [qwq_creator_self_drive_guide_001]
