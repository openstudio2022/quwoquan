templateId: 线路_环线攻略
subject: { kind: topic, type: 旅行/线路, minEntityRefs: 4, subjectTagRef: Topic/旅行/行程形态/自由行 }
vertical: travel
category: travel
intent: 攻略
carrier: article
styleFamily: 路线规划风
audiences: [leisureTraveler, selfDriveTraveler]
creatorPersona:
  archetype: travel_blogger
  preferredCreatorIds: [qwq_creator_travel_blogger_001]
  requiredProfileTagRefs: [Topic/旅行/行程形态/自由行, Format/内容角度/攻略]
  allowedPerspective: [中性事实叙事, 编辑部]
  mustNotClaim: [官方推荐, 实时路况承诺]
editorialIntent: 用环线视角组织多个实体，帮助读者理解顺序、天数、强度和取舍。
render: { articleTemplate: journal, fontPreset: clean }
narrativeMode:
  kind: route_narrative
  openingFocus: route_logic
  transitionPolicy: route_progression
  closingFocus: route_choice
evidenceRequirements:
  fact:
    required: true
    categories: [transport, intensity, stay, risk]
  emotion:
    required: true
    kinds: [like, pain]
  mainline:
    required: true
    minSignals: 3
continuityExpectations:
  requireProgression: true
  requireTransitions: true
  forbidSlotStacking: true
  minNarrativeParagraphs: 5
routeCoverageExpectations:
  minCoveredEntityRefs: 3
  requireAllPrimaryNodes: true
structure:
  required: [路线逻辑, 天数安排, 每日节点, 住宿选择, 适合与不适合]
  optional: [反向走法, 雨雪备选, 预算区间]
evidenceConditionedFacts: [天数, 节点顺序, 交通耗时, 住宿点, 替代方案]
forbiddenPhrases: [冷启动, 批次, 角色：, 占位, contract_fixture]
wordCount: { min: 1200, max: 2400 }
imagePlan:
  - { slot: 总览地图, imageLayout: fullWidth }
  - { slot: 日程卡, imageLayout: wrapLeft }
  - { slot: 节点图集, gallery: masonry }
crossRefs: { minEntity: 4, minTag: 4 }
recommendation:
  authorBinding: { required: true, source: creator_profile_catalog }
  exposeStyleTags: true
  qualitySignals: [bodyLength, evidenceSupportedFactCoverage, imageSlotCoverage, entityRefCount]
  bodyForbiddenFields: [qualityScore, templateId, routingReason, coldStartBoost, isSystemBuiltin]
openingTension: { required: true, focus: 出发动机与犹豫 }
explicitFeelings: { requireLike: true, requireDislike: true }
decisionPoints: { required: true, minPoints: 2 }
tipsEmbeddingPolicy: { mode: inline, forbidStandaloneBlock: true }
