render: { articleTemplate: gentle, fontPreset: clean }
structure:
  required: [校园氛围, 学科资源, 宿舍食堂, 城市位置, 适合人群]
  optional: [就业与实习, 家长关注点]
mustIncludeFacts: [校区位置, 学科资源, 宿舍食堂, 城市连接]
