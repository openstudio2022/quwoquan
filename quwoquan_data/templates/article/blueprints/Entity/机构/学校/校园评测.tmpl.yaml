templateId: 学校_校园评测
subject: { kind: entity, type: 机构/学校 }
vertical: campus
category: life
intent: 校园评测
carrier: review
styleFamily: 客观评测风
audiences: [prospectiveStudent, campusParent]
creatorPersona:
  archetype: campus_blogger
  preferredCreatorIds: [qwq_creator_campus_blogger_001]
  requiredProfileTagRefs: [Format/内容角度/测评/校园评测, Topic/教育成长/校园生活]
  allowedPerspective: [评测员, 校园生活记录者]
  mustNotClaim: [学校官方身份, 就业保证]
