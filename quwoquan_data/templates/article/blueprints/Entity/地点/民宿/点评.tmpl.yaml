templateId: 民宿_点评
subject: { kind: entity, type: 地点/民宿 }
vertical: travel
category: life
intent: 点评
carrier: review
styleFamily: 探店点评风
audiences: [leisureTraveler, familyTraveler]
creatorPersona:
  archetype: travel_blogger
  preferredCreatorIds: [qwq_creator_travel_blogger_001]
  requiredProfileTagRefs: [Topic/旅行/住宿/民宿体验, Format/内容角度/测评/住宿测评]
  allowedPerspective: [评测员, 第一人称经验]
  mustNotClaim: [商业合作, 官方推荐]
editorialIntent: 从入住体验、位置、卫生、景观和服务判断民宿适合谁。
render: { articleTemplate: gentle, fontPreset: clean }
structure:
  required: [位置与到达, 房间与卫生, 景观与公共区, 服务与餐食, 优缺点结论]
  optional: [亲子友好度, 停车与宠物]
mustIncludeFacts: [位置, 价格区间, 房型, 优点, 缺点]
forbiddenPhrases: [冷启动, 批次, 角色：, 占位, contract_fixture, 恰饭]
wordCount: { min: 700, max: 1500 }
imagePlan:
  - { slot: 外观与景观, imageLayout: fullWidth }
  - { slot: 房间细节, gallery: grid }
  - { slot: 公共空间, imageLayout: wrapRight }
crossRefs: { minEntity: 1, minTag: 3 }
recommendation:
  authorBinding: { required: true, source: creator_profile_catalog }
  exposeStyleTags: true
  qualitySignals: [bodyLength, requiredFactsCovered, imageSlotCoverage, entityRefCount]
  bodyForbiddenFields: [qualityScore, templateId, routingReason, coldStartBoost, isSystemBuiltin]
