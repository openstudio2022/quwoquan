version: 1
imageLayouts: [fullWidth, wrapLeft, wrapRight, infographic, fullBleed]
galleryLayouts: [grid, masonry, carousel, scroll]
slots:
  travel_route:
    - { slot: 总览地图, imageLayout: fullWidth, purpose: 解释路线结构 }
    - { slot: 分段路况, imageLayout: wrapRight, purpose: 说明驾驶难度 }
    - { slot: 节点图集, gallery: masonry, purpose: 展示关键停靠点 }
  geo_feature:
    - { slot: 封面大片, imageLayout: fullBleed, purpose: 建立地理氛围 }
    - { slot: 地图信息图, imageLayout: infographic, purpose: 解释空间关系 }
    - { slot: 图说长卷, gallery: scroll, purpose: 国家地理式图说叙事 }
    - { slot: 地貌细节, gallery: masonry, purpose: 补充证据 }
  food_feature:
    - { slot: 风味封面, imageLayout: fullBleed, purpose: 建立风味氛围 }
    - { slot: 食材产地图, imageLayout: infographic, purpose: 解释产地与时令 }
    - { slot: 制作过程, gallery: masonry, purpose: 还原做法 }
  city_walk:
    - { slot: 街区入口, imageLayout: fullWidth, purpose: 建立街区印象 }
    - { slot: 动线地图, imageLayout: infographic, purpose: 解释步行动线 }
    - { slot: 街景图集, gallery: masonry, purpose: 展示沿途细节 }
  campus:
    - { slot: 校门, imageLayout: fullWidth, purpose: 识别学校 }
    - { slot: 宿舍食堂, gallery: grid, purpose: 生活判断 }
    - { slot: 学习空间, imageLayout: wrapRight, purpose: 学业资源 }
captionRules:
  - 描述画面与信息，不写“配图1”。
  - 写清地点、季节、视角或限制。
  - 不夸大图片来源和授权。
  - 信息图/图说必须有数据或事实出处，国家地理式版式靠图注与信息图承载深度。
