templateId: 线路_枢纽到达
version: 1
subject: { kind: topic, type: 旅行/线路, minEntityRefs: 2, subjectTagRef: Topic/旅行/出行方式/高铁铁路 }
vertical: travel
category: travel
intent: 攻略
carrier: article
styleFamily: 路线规划风
audiences: [hubInboundTraveler, leisureTraveler]
creatorPersona:
  archetype: travel_blogger
  preferredCreatorIds: [qwq_creator_travel_blogger_001]
  requiredProfileTagRefs: [Topic/旅行/出行方式/高铁铁路, Topic/旅行/行程形态/自由行, Format/内容角度/攻略]
  allowedPerspective: [第一人称经验, 编辑部]
  mustNotClaim: [官方交通承诺, 最低价机票]
editorialIntent: 为外地游客规划大交通到成都、市内休整与再出发川西段，把枢纽段与后续环线/深度段衔接清楚。
render: { articleTemplate: journal, fontPreset: clean }
conditionAxes:
  region: { applicable: true, slot: 成都枢纽与周边 }
  season: { applicable: true, slot: 旺季交通与备选 }
structure:
  required: [大交通方案, 到达成都, 休整与补给, 再出发衔接, 时间与费用, 风险提醒]
  optional: [转机/转高铁, 成都半日安排]
hooks: ["从{origin}到成都，先把大交通和休整算清楚", "外地进川西，成都这一站决定后面会不会赶"]
mustIncludeFacts: [大交通方式, 耗时与费用, 成都到达站, 休整安排, 后续川西段衔接]
forbiddenPhrases: [冷启动, 批次, 角色：, 占位, contract_fixture]
wordCount: { min: 1400, max: 2600 }
imagePlan:
  - { slot: 大交通示意, imageLayout: fullWidth }
  - { slot: 成都枢纽, imageLayout: wrapRight }
  - { slot: 衔接路线图, imageLayout: wrapLeft }
crossRefs: { minEntity: 2, minTag: 5 }
recommendation:
  authorBinding: { required: true, source: creator_profile_catalog }
  exposeStyleTags: true
  qualitySignals: [bodyLength, requiredFactsCovered, imageSlotCoverage, entityRefCount]
  bodyForbiddenFields: [qualityScore, templateId, routingReason, coldStartBoost, isSystemBuiltin, recommendationWeight]
sopExampleRef: sop/article.md
