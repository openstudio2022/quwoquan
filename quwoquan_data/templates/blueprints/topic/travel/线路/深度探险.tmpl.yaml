templateId: 线路_深度探险
version: 1
subject: { kind: topic, type: 旅行/线路, minEntityRefs: 2, subjectTagRef: Topic/旅行/出行方式/徒步穿越 }
vertical: travel
category: travel
intent: 深度探险
carrier: article
styleFamily: 路线规划风
audiences: [selfDriveTraveler, leisureTraveler]
creatorPersona:
  archetype: self_drive_expert
  preferredCreatorIds: [qwq_creator_self_drive_guide_001]
  requiredProfileTagRefs: [Topic/旅行/出行方式/徒步穿越, Format/内容角度/攻略/路线推荐, Topic/旅行/旅行筹备/应急避险]
  allowedPerspective: [第一人称经验, 专业导览]
  mustNotClaim: [官方救援, 向导资质保证, 零风险承诺]
editorialIntent: 面向 7–14 日深度与徒步穿越线路，强调补给、风险、向导与体能边界，不做探险营销。
render: { articleTemplate: journal, fontPreset: clean }
conditionAxes:
  region: { applicable: true, slot: 地形与风险 }
  season: { applicable: true, slot: 季节窗口与封山 }
structure:
  required: [线路定位, 体能与经验要求, 分段行程, 补给与露营, 风险与应急, 向导与许可, 替代方案]
  optional: [摄影停靠, 高反适应]
hooks: ["走{name}之前，先确认体能和风险边界", "这条深度线不是打卡，而是算好补给和退路"]
mustIncludeFacts: [总里程, 高程变化, 补给点, 露营或住宿, 向导需求, 应急避险, 最佳季节]
forbiddenPhrases: [冷启动, 批次, 角色：, 占位, contract_fixture, 零风险]
wordCount: { min: 1600, max: 3200 }
imagePlan:
  - { slot: 线路总览, imageLayout: fullWidth }
  - { slot: 海拔剖面, imageLayout: infographic }
  - { slot: 节点图集, gallery: masonry }
  - { slot: 风险提示, imageLayout: fullWidth }
crossRefs: { minEntity: 2, minTag: 5 }
recommendation:
  authorBinding: { required: true, source: creator_profile_catalog }
  exposeStyleTags: true
  qualitySignals: [bodyLength, requiredFactsCovered, imageSlotCoverage, entityRefCount]
  bodyForbiddenFields: [qualityScore, templateId, routingReason, coldStartBoost, isSystemBuiltin, recommendationWeight]
sopExampleRef: sop/article.md
