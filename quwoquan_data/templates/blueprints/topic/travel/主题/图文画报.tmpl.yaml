templateId: 主题_图文画报
version: 1
subject: { kind: topic, type: 旅行/主题, minEntityRefs: 2, subjectTagRef: Topic/旅行/玩法/摄影旅拍 }
vertical: travel
category: photography
intent: 美图
carrier: image
styleFamily: 摄影画报风
audiences: [photoTraveler, leisureTraveler]
creatorPersona:
  archetype: landscape_photographer
  preferredCreatorIds: [qwq_creator_landscape_photographer_001]
  requiredProfileTagRefs: [Topic/旅行/玩法/摄影旅拍, Format/内容载体/图文/图集]
  allowedPerspective: [摄影师, 编辑部]
  mustNotClaim: [商业图库授权, 无限制航拍]
editorialIntent: 用图集、图注和少量文字做出精美画报，而不是把照片当普通配图。
render: { articleTemplate: journal, fontPreset: clean }
structure:
  required: [封面主图, 地理线索, 图集分组, 拍摄提示, 图注说明]
  optional: [器材与焦段, 季节光线]
hooks: ["用一组图看懂{name}的光线和地貌", "{name}最值得停下来的几个画面"]
mustIncludeFacts: [拍摄地点, 季节, 光线时段, 图片来源, 授权状态]
forbiddenPhrases: [冷启动, 批次, 角色：, 占位, contract_fixture, 国家地理]
wordCount: { min: 500, max: 1200 }
imagePlan:
  - { slot: 封面大片, imageLayout: fullWidth, visualStyle: 电影感 }
  - { slot: 跨页主图, imageLayout: fullWidth }
  - { slot: 细节特写, gallery: masonry }
  - { slot: 地图信息图, imageLayout: wrapLeft }
crossRefs: { minEntity: 2, minTag: 4 }
recommendation:
  authorBinding: { required: true, source: creator_profile_catalog }
  exposeStyleTags: true
  qualitySignals: [bodyLength, requiredFactsCovered, imageSlotCoverage, entityRefCount]
  bodyForbiddenFields: [qualityScore, templateId, routingReason, coldStartBoost, isSystemBuiltin]
sopExampleRef: sop/image.md
