# 开篇策略库（解决"开篇千篇一律"）：每个 styleFamily 通过 allowedOpenings 关联多种可选开篇，
# agent 按原文体裁 + 证据自选其一并写入 draft_meta.openingStrategy；review 开篇门按所选策略的
# markers 语义化校验（命中即视为采用了真实钩子，而非套路化罗列）；跨篇相似度门再防雷同。
openingStrategies:
  scene_immersion:
    label: 场景沉浸
    hint: 用一个具体时间/天气/动作把读者瞬间放进现场，而不是先报地名与行程。
    markers: ["清晨", "傍晚", "夜里", "推开", "站在", "脚下", "那一刻", "抬头", "转过", "风", "雨", "雾", "阳光", "踩"]
  personal_motivation:
    label: 出发动机
    hint: 写为什么想去、出发前的犹豫或期待，带出真实的个人理由。
    markers: ["出发前", "动身", "想去", "为什么走", "出门前", "临出发", "犹豫", "期待", "决定走", "一直想", "纠结"]
  question_hook:
    label: 设问悬念
    hint: 用一个真实问题或反差勾住读者，引出全文要回答的事。
    markers: ["？", "?", "到底", "真的", "值不值", "是不是", "难道", "凭什么"]
  data_contrast:
    label: 认知反差
    hint: 用一个具体数字或常见误解开场，再纠偏。
    markers: ["其实", "原来", "误以为", "以为", "没想到", "别被", "真相", "实际上", "并不是"]
  conclusion_first:
    label: 结论先行
    hint: 先抛态度/结论，再展开理由，适合攻略与测评。
    markers: ["先说结论", "直接说", "一句话", "说重点", "结论是", "先讲", "只说一件事"]
  dialogue_quote:
    label: 对话引语
    hint: 用一句对话或当地人的话破题。
    markers: ["“", "”", "问我", "告诉我", "有人说", "他说", "她说", "当地人"]
  contrast_compare:
    label: 对比并置
    hint: 把两种选择/两类人/两个时刻并置，制造张力。
    markers: ["有人", "也有人", "比起", "相比", "一边", "另一边", "与其", "不如", "曾经", "如今"]
styleFamilies:
  实用攻略风:
    render: { articleTemplate: journal, fontPreset: clean }
    allowedOpenings: [conclusion_first, question_hook, data_contrast]
