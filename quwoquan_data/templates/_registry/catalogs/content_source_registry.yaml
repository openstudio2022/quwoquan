schemaVersion: quwoquan.content_source_registry.v1
version: 1

allowedValues:
  lanes: [homepage, article, image, video]
  defaultRoles:
    - primary
    - supporting
    - discovery_only
    - reference_only
    - licensed_candidate
    - publish_candidate
    - publishable
  fetchModes:
    - api
    - html
    - search
    - manual_authorization
    - licensed_api
    - platform_reference
  rightsPolicies:
    - factual_reference_only
    - official_terms_required
    - asset_level_required
    - open_license_required
    - commercial_license_required
    - creator_authorization_required
    - reference_only
  siteCrawlProfileFields:
    - siteId
    - domains
    - allowedPaths
    - timeWindowDays
    - contentLanes
    - fetchMode
    - extractor
    - rateLimit
    - rightsPolicy
    - robotsPolicy
    - loginPolicy
    - watermarkPolicy
    - maxDepth
    - maxPagesPerDay
    - crawlAllowed

# 来源专业度先验（作品 vs 随记判定的来源侧信号）。
# baseTier ∈ tier1..tier5；worksAffinity ∈ work_strong/work/neutral/moment/reject。
# 判定权重在 works_classification.yaml；此处只声明"来源类别 → 专业度先验"映射（单一真相源）。
# 缺失 sourceClass 走 default；内容实测信号(score_source_markdown/结构/图片)会进一步调整。
sourceTierSignals:
  version: 1
  default:
    baseTier: tier4_casual
    worksAffinity: neutral
  bySourceClass:
    encyclopedia: { baseTier: tier1_authoritative, worksAffinity: work_strong }
    knowledge_graph: { baseTier: tier1_authoritative, worksAffinity: work_strong }
    official_site: { baseTier: tier1_authoritative, worksAffinity: work_strong }
    government_tourism: { baseTier: tier1_authoritative, worksAffinity: work }
    official_article: { baseTier: tier2_professional, worksAffinity: work }
    authoritative_media: { baseTier: tier2_professional, worksAffinity: work }
    vertical_professional: { baseTier: tier2_professional, worksAffinity: work }
    media_article: { baseTier: tier2_professional, worksAffinity: work }
    ugc_longform: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    community_post: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    platform_article: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    open_license_media: { baseTier: tier2_professional, worksAffinity: work }
    photography_community: { baseTier: tier2_professional, worksAffinity: work }
    free_stock: { baseTier: tier3_quality_ugc, worksAffinity: work }
    commercial_stock: { baseTier: tier2_professional, worksAffinity: work }
    visual_discovery_platform: { baseTier: tier4_casual, worksAffinity: neutral }
    domestic_stock: { baseTier: tier3_quality_ugc, worksAffinity: work }
    official_gallery: { baseTier: tier1_authoritative, worksAffinity: work }
    museum_open_access: { baseTier: tier1_authoritative, worksAffinity: work }
    vertical_image_platform: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    guidebook: { baseTier: tier2_professional, worksAffinity: work }
    route_platform: { baseTier: tier3_quality_ugc, worksAffinity: work }
    review_note: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    video_platform: { baseTier: tier4_casual, worksAffinity: neutral }
    vertical_video: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    stock_video: { baseTier: tier3_quality_ugc, worksAffinity: work }
    social_feed: { baseTier: tier4_casual, worksAffinity: moment }
    microblog: { baseTier: tier4_casual, worksAffinity: moment }
    short_video_feed: { baseTier: tier4_casual, worksAffinity: moment }

lanePolicies:
  homepage:
    maxCoreSources: 5
    # P3 三类解耦：实体主页底稿主源【只来自百科】（wiki/百度/搜狗百科 = encyclopedia）。
    # 知识图谱（Wikidata）、官网、政务文旅、权威媒体一律降为 supporting，只能补事实/交叉验证，
    # 不得作为主页 primaryEvidenceRef（base draft 单源择优只在百科之间进行）。
    primarySourceClasses: [encyclopedia]
    supportingOnlySourceClasses: [knowledge_graph, official_site, government_tourism, authoritative_media]
    rankingSignals:
      - authority
      - entity_match
      - fact_density
      - image_text_completeness
      - freshness
    promptFacts:
      - 实体主页主源【只】从百科（维基百科 / 百度百科 / 搜狗百科）中选择，多个百科源之间按质量择优取最优单源。
      - 知识图谱、实体/景区官网、政务、文旅、媒体和 UGC 只能补事实或交叉验证，不得作为主页 primaryEvidenceRef。
      - 核心主页来源最多 5 个，优先图文并茂、事实字段丰富、可抓取和可追溯的页面。
  article:
    sourceSelectionMode: quality_driven
    noIntrinsicPriorityBySourceClass: true
    rankingSignals:
      - content_quality
      - entity_relevance
      - information_density
      - image_text_completeness
      - traceability
      - rights_safety
      - originality
      - dedupe_value
      - freshness
    promptFacts:
      - 文章来源不按 UGC、社区、媒体、官方或垂类专业站天然升降级。
      - 所有文章型来源按内容质量、图文完整、事实可追溯、去重价值和文字/图片权利风险判断。
      - 文章底稿必须来自 article lane，源图是底稿证据链的一部分，一稿一用。
  image:
    discoveryAllowed: true
    publishRequiresAssetRights: true
    rankingSignals:
      - visual_relevance
      - asset_rights_clarity
      - source_traceability
      - image_quality
      - creator_identity
      - dedupe_value
    promptFacts:
      - 图片广泛检索通用视觉平台、摄影社区、图库、官方图库和垂类平台。
      - Pinterest、小红书、微博、抖音、B站等可做发现或参考，但发布必须逐图具备明确授权或开放许可。
      - 有水印、版权声明、转载痕迹、作者不明或 terms 不清的图片不得进入发布候选；去水印只允许用于自有或明确授权素材。
  video:
    discoveryAllowed: true
    publishRequiresAssetRights: true
    rankingSignals:
      - visual_relevance
      - officiality
      - audio_rights_clarity
      - asset_rights_clarity
      - source_traceability
    promptFacts:
      - 视频广泛检索通用视频平台、素材库、官方账号和垂类视频源。
      - 视频能否发布由标题、描述、字幕、账号身份、音乐版权、画面水印、转载痕迹和授权声明逐条判断。

siteCrawlProfilePolicy:
  workspaceRoot: runtime/site_supply/{vertical}/{siteId}/{batch}
  defaultTimeWindowDays: 730
  scaleQueueBackend: reliabletask
  crawlerTruthSource: vertical source_registry.yaml
  promptFacts:
    - 网站维度供给线只负责发现、抓取、抽取、评分和映射候选，不直接发布内容。
    - fetchable=false 或 crawlAllowed=false 的站点不得进入批量抓取，只能作为 discovery/reference。
    - controlledTrial.allowed=true 仅代表可做受控 DAG/并发/门禁验证；validationOnly 必须为 true，rawFetchAllowed 和 publishableAssetsAllowed 必须为 false。
    - 受控试跑候选只能作为 content_plan handoff 结构验证，不代表真实抓取授权，也不得把平台素材作为可发布资产。
    - 发布主线只接受 content_plan_packet 之后的标准对象，不直接消费 site crawl 产物。
    - 平台发现图不能自动变发布图；逐资产缺 license、credit、sourceUrl、termsUrl、usageScope 即不可发布。
    - 日产 10 万级必须提供站点漏斗、TokenLedger、release/import、搜索可见和推荐反馈证据。

