schemaVersion: quwoquan.task.defaults
# 四川省地域默认：四川真实地形全谱（川西高原雪山 + 盆周山地森林 + 成都平原都市 + 川南川东乡村田园）。
# 这是“该地域可用条件维菜单”，具体每篇按实体所在地注入；季节继承旅行四季。
# 跨全地形的 task（省域总览/景区/住宿/打卡地）直接继承；
# 人文/城市类（古镇/博物馆/遗址/美食/赛事）在 task.yaml 收窄到实际分布地形。
content:
  conditionAxes:
    regions:
    - 高原
    - 雪山
    - 山地森林
    - 平原都市
    - 乡村田园
