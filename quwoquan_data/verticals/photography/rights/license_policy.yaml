schema: quwoquan.photography_license_policy
vertical: photography
defaultAction: block
discoveryPlatformRoles:
  - platform: Pinterest
    defaultDiscoveryRole: publish_candidate
  - platform: pinterest
    defaultDiscoveryRole: publish_candidate
  - platform: 图虫
    defaultDiscoveryRole: licensed_candidate
requiredImageFields:
  - license
  - credit
  - sourceUrl
  - termsUrl
  - usageScope
  - authorizationProof
  - modelReleaseStatus
allowedAuthorizationBases:
  - attribution_no_watermark
attributionNoWatermarkRequiredFields:
  - authorizationBasis
  - pinUrl
  - discoveryUrl
  - originalAssetUrl
  - sourceAuthor
  - repostAttribution
  - watermarkScan
  - ocrScan
  - collectedAt
allowedLicenseKinds:
  - CC0
  - CC-BY
  - CC-BY-SA
  - Public Domain
  - Unsplash License
  - Pexels License
  - Pixabay License
  - photographer_authorized
  - stock_authorized
  - museum_open_access
  - attribution_no_watermark
usageScopes:
  - internal_reference
  - app_publish
  - editorial
  - commercial
humanSubjectPolicy:
  modelReleaseRequiredWhenFaceDetected: true
  requiredField: modelReleaseStatus
  allowedStatuses:
    - not_required
    - obtained
    - editorial_only
