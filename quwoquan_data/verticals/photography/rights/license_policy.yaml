schemaVersion: quwoquan.photography_license_policy.v1
vertical: photography
defaultAction: block
discoveryPlatformRoles:
  - platform: Pinterest
    defaultDiscoveryRole: discovery_only
  - platform: pinterest
    defaultDiscoveryRole: discovery_only
  - platform: 图虫
    defaultDiscoveryRole: licensed_candidate
requiredImageFields:
  - license
  - credit
  - sourceUrl
  - termsUrl
  - usageScope
allowedLicenseKinds:
  - CC0
  - CC-BY
  - CC-BY-SA
  - Public Domain
  - Unsplash License
  - Pexels License
  - Pixabay License
  - photographer_authorized
  - stock_authorized
  - museum_open_access
usageScopes:
  - internal_reference
  - app_publish
  - editorial
  - commercial
humanSubjectPolicy:
  modelReleaseRequiredWhenFaceDetected: true
  requiredField: modelReleaseStatus
  allowedStatuses:
    - not_required
    - obtained
    - editorial_only
