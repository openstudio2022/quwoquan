policyId: campus-content-supply
feedMinimumPosts: 20
contentPerEntity:
  article: 1
  image: 1
  video: 1
quality:
  nonEmptyRateMinimum: 0.999
  duplicateExposureRateMaximum: 0.01
  homepageMaxSourceFidelity: 0.92
  homepageMinimumBodyChars: 350
  homepageMinimumFactCount: 4
  homepageMinimumFactChars: 180
  homepageMinimumSectionChars: 40
  homepageSourceOutlineSectionChars: 120
  homepageMaxSourceParagraphOverlap: 0.7
  homepageMaxIntraBodyParagraphSimilarity: 0.7
  homepageDerivationParagraphMinimumChars: 60
mediaSubject:
  representativeIndicators:
    - campus
    - university
    - college
    - school
    - classroom
    - library
    - dormitory
    - 校园
    - 校区
    - 校门
    - 教学楼
    - 图书馆
    - 宿舍
    - 操场
    - 实验室
  prohibitedIndicators:
    - screenshot
    - watermark
    - id photo
    - transcript
    - 截图
    - 水印
    - 证件照
    - 身份证
    - 成绩单
    - 学生证
videoDelivery:
  container: mp4
  codec: h264
  width: 1080
  height: 1920
  aspectRatio: "9:16"
  pixelFormat: yuv420p
  framesPerSecond: 24
  segmentDurationSeconds: 2
  minimumSourceFrames: 2
  minimumDurationSeconds: 6
  maximumDurationSeconds: 30
  posterRequired: true
  subtitlesRequired: true
  checksumRequired: true
  rightsProvenanceRequired: true
