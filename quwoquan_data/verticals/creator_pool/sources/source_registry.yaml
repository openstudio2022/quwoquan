schemaVersion: quwoquan.creator_source_registry.v1
owner: creator_pool
description: >
  Travel x photography creator acquisition registry. Sites here provide public
  discovery, validation, factual, or style-distribution signals only. Generated
  users must remain derivative_persona_v1 and must not copy real names, avatars,
  bios, or account identity.
segmentTargets:
  travel_primary: 300
  photography_primary: 300
  travel_photography_cross: 400
perShardQuota:
  travel_primary: 30
  photography_primary: 30
  travel_photography_cross: 40
retrievalLayers:
  - platform_frontier
  - public_signal_extract
  - legal_filter
  - diversity_sampling
  - persona_enrich
  - validate_merge
