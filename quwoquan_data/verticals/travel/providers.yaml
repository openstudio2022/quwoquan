        rawFetchAllowed: false
        publishableAssetsAllowed: false
        notes: 仅用于链接发现、实体互证、质量分布和 DAG/并发验证；不得抓原文，不发布平台图片或视频。
      notes: 小红书默认仅作 reference/discovery；逐条授权或开放平台合同缺失时不得进入 release。
    notes: 综合内容平台参考源；按内容检索发现风景/摄影候选，不作为默认正文抓取源，不把平台素材计入可发布成功率。
