        notes: 综合内容平台按主题/时间片/地域检索候选内容；仅用于发现、互证和质量分布，不抓原文，不发布平台图片或视频。
      maxDepth: 0
      maxPagesPerDay: 0
      controlledTrial:
        allowed: true
