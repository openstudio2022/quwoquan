      termsUrl: https://pages.ctrip.com/webhome/purehtml/cn/memberCenter/regTerm.html
      rateLimit:
        mode: conservative
        maxRequestsPerSecond: 0.2
        backoffOnStatus: [403, 429]
      discoveryStrategy:
        mode: content_search
        searchProvider: brave_public
        seedAxes: [entity]
        queryTemplates:
          - "{entity} site:you.ctrip.com/sight"
        precheckGates: [light_fetch, scenery_or_photography_classification, quality_gate, entity_anchor]
        notes: 按实体名发现公开景点详情页；标题与抓取正文必须同时通过实体锚点门。
      maxDepth: 1
      maxPagesPerDay: 5000
      notes: 只抓公开实体景点详情正文，作为原创文章的事实参考；不复制点评，不发布站内图片。
    notes: 实体级旅行指南候选源；URL 由运行时公开搜索发现，不在仓内维护实体特例。
