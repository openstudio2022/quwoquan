  - siteId: mafengwo_travelogue
    platform: 马蜂窝
    category: travelogue
    domains: [www.mafengwo.cn, mafengwo.cn]
    urlPatterns:
      - https://www.mafengwo.cn/i/*
    fetchable: false
    extractor: generic_html
    licensePolicy: factual_citation_only
    qualityTier: C
    siteCrawlProfile:
      crawlAllowed: false
      contentLanes: [article, image, video]
      articleCommercialAdmission: controlled_trial
      allowedPaths:
        - https://www.mafengwo.cn/i/*
      fetchMode: platform_reference
      extractor: generic_html
      rightsPolicy: factual_citation_only
      robotsPolicy: respect_robots_txt
      loginPolicy: public_only
      watermarkPolicy: reject_watermarked_publish_assets
      termsUrl: https://bigfile.mafengwo.net/s18/M00/91/9E/CoUBYGCbqRKABoiVAALoDVTSgVE139.pdf
      discoveryStrategy:
        mode: site_listing_scan
        seedAxes: [topic, time_window, site_listing]
        precheckGates: [light_fetch, scenery_or_photography_classification, quality_gate, entity_anchor]
        notes: 旅行类站点先轻量巡检公开游记/攻略候选页，再做风景摄影分类与质量门；不按作者扩源。
      maxDepth: 0
      maxPagesPerDay: 0
      controlledTrial:
        allowed: true
        validationOnly: true
        rawFetchAllowed: false
        publishableAssetsAllowed: false
        notes: 仅用于站点维度 DAG、门禁、并发与准出稳定性验证；不声明真实批量抓取授权，不发布平台素材。
      notes: 当前常见反爬探针页，不具备站点级稳定正文抽取条件；真实 batch crawl 禁止，controlled trial 仅验证 DAG/门禁/准出稳定性。
    notes: 当前常见反爬探针页，不允许当稳定可抓正文源；真实抓取抓不到即 Reject，受控试跑不发布平台素材。
