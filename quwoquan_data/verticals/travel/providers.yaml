schema: quwoquan.travel_source_registry
vertical: travel
defaultAction: block
qualityTiers:
  - A
  - B
  - C
licensePolicies:
  - factual_citation_only
  - cc_or_pd_only
  - official_terms_required
  - reference_only
  - discovery_only
  - attribution_no_watermark
  - licensed_candidate
  - licensed_asset_required
extractors:
  - wikipedia_api
  - baidu_baike_html
  - toutiao_baike_html
  - static_official_html
  - qunar_html
  - ctrip_sight_html
  - generic_html
articleCommercialAdmissions:
  - commercial_release
  - controlled_trial
  - reference_only
  - blocked
sites:
  - siteId: wikipedia_zh
    platform: 维基百科
    category: encyclopedia
    domains: [zh.wikipedia.org]
    urlPatterns:
      - https://zh.wikipedia.org/wiki/*
    fetchable: true
    extractor: wikipedia_api
    licensePolicy: factual_citation_only
    qualityTier: A
    notes: 中文百科正文真相源，允许抽取 facts/sections，不得整段搬运。
  - siteId: wikivoyage_zh
    platform: 维基导游
    category: travelogue
    domains: [zh.wikivoyage.org]
    urlPatterns:
      - https://zh.wikivoyage.org/wiki/*
    fetchable: true
    extractor: wikipedia_api
    licensePolicy: factual_citation_only
    qualityTier: B
    siteCrawlProfile:
      crawlAllowed: true
      contentLanes: [homepage, article]
      articleCommercialAdmission: commercial_release
      allowedPaths:
        - https://zh.wikivoyage.org/wiki/*
      fetchMode: mediawiki_api
      extractor: wikipedia_api
      rightsPolicy: factual_citation_only
      robotsPolicy: respect_robots_txt
      loginPolicy: public_only
      watermarkPolicy: reject_watermarked_publish_assets
      termsUrl: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      rateLimit:
        mode: conservative
        maxRequestsPerSecond: 0.5
        backoffOnStatus: [403, 429]
      discoveryStrategy:
        mode: entity_seeded_scan
        seedAxes: [entity, topic, time_window]
        queryTemplates:
          - "{entity} site:zh.wikivoyage.org/wiki"
        precheckGates: [light_fetch, scenery_or_photography_classification, quality_gate, entity_anchor]
        notes: 以目的地/主题/时间片检索可读指南页；不按作者维度扩展。
      maxDepth: 2
      maxPagesPerDay: 5000
      timeWindowDays: 730
      notes: 维基导游站点线可为 homepage/article 提供事实与目的地指南候选来源；正文生产仍须经 content_plan/post/review，不复现原文。
    notes: 中文维基导游旅行指南；可作 travel homepage/article 的权威参考候选，但最终是否成为主页主锚仍由 homepage authority gate 择优裁定。
  - siteId: baidu_baike
    platform: 百度百科
    category: encyclopedia
    domains: [baike.baidu.com]
    urlPatterns:
      - https://baike.baidu.com/item/*
    fetchable: false
    extractor: baidu_baike_html
    licensePolicy: factual_citation_only
    qualityTier: A
    notes: 百度百科可用于候选发现与标题解析；其公开 HTML 不具备稳定批量抓取能力，不得冻结为可重复执行的主页正文源。
  - siteId: toutiao_baike
    platform: 今日头条百科
    category: encyclopedia
    domains: [www.baike.com, baike.com]
    urlPatterns:
      - https://www.baike.com/wikiid/*
      - https://baike.com/wikiid/*
    fetchable: true
    extractor: toutiao_baike_html
    licensePolicy: factual_citation_only
    qualityTier: B
    notes: 经结构化 DOM 抽取与正文事实门验证后，可作为实体主页百科正文源；批处理仍受运行时访问约束和来源质量门约束。
