schemaVersion: quwoquan.travel_source_registry
vertical: travel
defaultAction: block
qualityTiers:
  - A
  - B
  - C
licensePolicies:
  - factual_citation_only
  - cc_or_pd_only
  - official_terms_required
extractors:
  - wikipedia_api
  - baidu_baike_html
  - sogou_baike_html
  - static_official_html
  - qunar_html
  - generic_html
sites:
  - siteId: wikipedia_zh
    platform: 维基百科
    category: encyclopedia
    domains: [zh.wikipedia.org]
    urlPatterns:
      - https://zh.wikipedia.org/wiki/*
    fetchable: true
    extractor: wikipedia_api
    licensePolicy: factual_citation_only
    qualityTier: A
    notes: 中文百科正文真相源，允许抽取 facts/sections，不得整段搬运。
  - siteId: wikivoyage_zh
    platform: 维基导游
    category: travelogue
    domains: [zh.wikivoyage.org]
    urlPatterns:
      - https://zh.wikivoyage.org/wiki/*
    fetchable: true
    extractor: wikipedia_api
    licensePolicy: factual_citation_only
    qualityTier: B
    notes: 中文维基导游旅行指南，可抓取目的地攻略/交通/游览分区；仅作事实与决策参考，不复现原文。
  - siteId: baidu_baike
    platform: 百度百科
    category: encyclopedia
    domains: [baike.baidu.com]
    urlPatterns:
      - https://baike.baidu.com/item/*
    fetchable: true
    extractor: baidu_baike_html
    licensePolicy: factual_citation_only
    qualityTier: A
    notes: 中文结构化百科补充源，用于实体事实和章节骨架校验。
  - siteId: sogou_baike
    platform: 搜狗百科
    category: encyclopedia
    domains: [baike.sogou.com]
    urlPatterns:
      - https://baike.sogou.com/*
    fetchable: true
    extractor: sogou_baike_html
    licensePolicy: factual_citation_only
    qualityTier: B
    notes: 作为百科补充源，抓取成功才使用。
  - siteId: scenic_official
    platform: 景区官网
    category: official
    domains: [ems517.com, sxd.cn, jiuzhai.com, dujiangyan.com.cn, bipenggou.net, snzh.cn, bifengxia.com, djy517.com, njfzm.net, hhhkpb.com, hukouwaterfall.com, shuanglongdong.com, zjshenxianju.com, tongli.net, xitang.com.cn, gthyjng.cn, wyhl.cc, chinaguyao.com, ixsw.cn, dzskyjy.cn, hnzjj.com]
    urlPatterns:
      - http://www.ems517.com/new/*
      - https://www.ems517.com/new/*
      - http://www.ems517.com/new_api/*
      - https://www.ems517.com/new_api/*
      - https://www.sxd.cn/*
      - https://www.jiuzhai.com/*
      - https://www.dujiangyan.com.cn/*
      - http://www.bipenggou.net/*
      - https://www.bipenggou.net/*
      - https://www.snzh.cn/*
      - http://www.bifengxia.com/*
      - https://www.djy517.com/*
      - http://www.djy517.com/*
      - http://www.njfzm.net/*
      - https://www.njfzm.net/*
      - http://www.hhhkpb.com/*
      - http://www.hukouwaterfall.com/*
      - http://www.shuanglongdong.com/*
      - https://www.zjshenxianju.com/*
      - http://www.tongli.net/*
      - http://www.xitang.com.cn/*
      - http://www.gthyjng.cn/*
      - https://www.wyhl.cc/*
      - http://www.chinaguyao.com/*
      - https://www.ixsw.cn/*
      - https://www.dzskyjy.cn/*
      - https://www.hnzjj.com/*
      - http://www.hnzjj.com/*
    fetchable: true
    extractor: static_official_html
    licensePolicy: official_terms_required
    qualityTier: A
    notes: 景区官网正文与公开 API 真相源；支持官方 SPA 页面与其公开 JSON 接口。
  - siteId: cultural_tourism_bureau
    platform: 文旅局
    category: official
    domains: [gov.cn]
    urlPatterns:
      - http://*.gov.cn/*
      - https://*.gov.cn/*
    fetchable: true
    extractor: static_official_html
    licensePolicy: official_terms_required
    qualityTier: A
    notes: 政务/文旅公告类正文源，若主页或 JS 门户无正文则应在 source_screen 判 Reject。
  - siteId: authoritative_media_reference
    platform: 权威媒体
    category: authoritative_reference
    domains:
      - people.com.cn
      - news.cn
      - xinhuanet.com
      - chinanews.com
      - cctv.com
      - gmw.cn
      - scol.com.cn
      - newssc.org
      - whc.unesco.org
      - redtourism.com.cn
    urlPatterns:
      - http://*.people.com.cn/*
      - https://*.people.com.cn/*
      - http://*.news.cn/*
      - https://*.news.cn/*
      - http://*.xinhuanet.com/*
      - https://*.xinhuanet.com/*
      - http://*.chinanews.com/*
      - https://*.chinanews.com/*
      - http://*.cctv.com/*
      - https://*.cctv.com/*
      - http://*.gmw.cn/*
      - https://*.gmw.cn/*
      - http://*.scol.com.cn/*
      - https://*.scol.com.cn/*
      - http://*.newssc.org/*
      - https://*.newssc.org/*
      - https://whc.unesco.org/*
      - http://*.redtourism.com.cn/*
      - https://*.redtourism.com.cn/*
    fetchable: true
    extractor: static_official_html
    licensePolicy: factual_citation_only
    qualityTier: B
    notes: 权威媒体/机构公开页面，仅用于事实参考、背景校验和交叉证据，不得按原文改编。
  - siteId: amap_geo
    platform: 高德地图
    category: map_geo
    domains: [ditu.amap.com, amap.com]
    urlPatterns:
      - https://ditu.amap.com/*
      - https://www.amap.com/*
    fetchable: false
    extractor: generic_html
    licensePolicy: factual_citation_only
    qualityTier: B
    notes: 仅作为地理定位/路线辅助类别，不直接抓正文。
  - siteId: mafengwo_travelogue
    platform: 马蜂窝
    category: travelogue
    domains: [www.mafengwo.cn, mafengwo.cn]
    urlPatterns:
      - https://www.mafengwo.cn/i/*
    fetchable: false
    extractor: generic_html
    licensePolicy: factual_citation_only
    qualityTier: C
    siteCrawlProfile:
      crawlAllowed: false
      contentLanes: [article, image, video]
      allowedPaths:
        - https://www.mafengwo.cn/i/*
      fetchMode: platform_reference
      extractor: generic_html
      rightsPolicy: factual_citation_only
      robotsPolicy: respect_robots_txt
      loginPolicy: public_only
      watermarkPolicy: reject_watermarked_publish_assets
      termsUrl: https://bigfile.mafengwo.net/s18/M00/91/9E/CoUBYGCbqRKABoiVAALoDVTSgVE139.pdf
      maxDepth: 0
      maxPagesPerDay: 0
      controlledTrial:
        allowed: true
        validationOnly: true
        rawFetchAllowed: false
        publishableAssetsAllowed: false
        minimumLaneCounts:
          article: 500
          image: 100
          video: 50
        notes: 仅用于站点维度 DAG、门禁、并发与准出稳定性验证；不声明真实批量抓取授权，不发布平台素材。
      notes: 当前常见反爬探针页，不具备站点级稳定正文抽取条件；真实 batch crawl 禁止，controlled trial 仅验证 DAG/门禁/准出稳定性。
    notes: 当前常见反爬探针页，不允许当稳定可抓正文源；真实抓取抓不到即 Reject，受控试跑不发布平台素材。
  - siteId: ctrip_travelogue
    platform: 携程攻略
    category: travelogue
    domains: [you.ctrip.com]
    urlPatterns:
      - https://you.ctrip.com/*
    fetchable: false
    extractor: generic_html
    licensePolicy: factual_citation_only
    qualityTier: C
    siteCrawlProfile:
      crawlAllowed: false
      contentLanes: [article, image, video]
      allowedPaths:
        - https://you.ctrip.com/*
      fetchMode: platform_reference
      extractor: generic_html
      rightsPolicy: factual_citation_only
      robotsPolicy: respect_robots_txt
      loginPolicy: public_only
      watermarkPolicy: reject_watermarked_publish_assets
      termsUrl: https://pages.ctrip.com/webhome/purehtml/cn/memberCenter/regTerm.html
      maxDepth: 0
      maxPagesPerDay: 0
      controlledTrial:
        allowed: true
        validationOnly: true
        rawFetchAllowed: false
        publishableAssetsAllowed: false
        minimumLaneCounts:
          article: 500
          image: 100
          video: 50
        notes: 仅用于站点维度 DAG、门禁、并发与准出稳定性验证；不声明真实批量抓取授权，不发布平台素材。
      notes: 未实现专用抽取器与站点级稳定正文准入前，只可作为 discovery/reference；controlled trial 仅验证 DAG/门禁/准出稳定性。
    notes: 当前未实现专用抽取器，站点级不作为稳定正文源；已逐条验证的 knownArticleSources 可显式 fetchable=true 进入 source_screen，受控试跑不发布平台素材。
  - siteId: qunar_guide
    platform: 去哪儿攻略
    category: travelogue
    domains: [touch.travel.qunar.com, travel.qunar.com]
    urlPatterns:
      - https://touch.travel.qunar.com/*
      - https://travel.qunar.com/*
    fetchable: true
    extractor: qunar_html
    licensePolicy: factual_citation_only
    qualityTier: B
    siteCrawlProfile:
      crawlAllowed: true
      contentLanes: [article, image]
      allowedPaths:
        - https://touch.travel.qunar.com/*
        - https://travel.qunar.com/*
      fetchMode: html
      extractor: qunar_html
      rightsPolicy: factual_citation_only
      robotsPolicy: respect_robots_txt
      loginPolicy: public_only
      watermarkPolicy: reject_watermarked_publish_assets
      termsUrl: https://touch.travel.qunar.com/
      rateLimit:
        mode: conservative
        maxRequestsPerSecond: 0.2
        backoffOnStatus: [403, 429]
      maxDepth: 3
      maxPagesPerDay: 5000
      timeWindowDays: 730
      notes: v1 网站维度受控试点站点；站点线仅产出候选与证据，正文仍走 content_plan/produce/review。
    notes: 去哪儿攻略静态页可稳定抓取，用于路线/门票/避坑类社区攻略证据。
