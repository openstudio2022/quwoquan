# 多 worker 小样本吞吐探针（WP7 放量评估）：6 实体 trial 口径，
# maxWorkers 由 QWQ_MANAGED_LOCAL_CURSOR_MAX_WORKERS 覆盖（2→3 两轮实测），
# 错峰冷启由 bridge launch cooldown 控制，产出 per-worker 退化曲线证据。
# 运行：QWQ_MANAGED_LOCAL_CURSOR_MAX_WORKERS=2 qwq-data task run-recipe content/travel/homepage/mw_probe
schemaVersion: quwoquan.task.recipe
recipeId: content/travel/homepage/mw_probe
title: 全国景区主页多worker吞吐探针（trial）
presetRef: content/travel/homepage/base
batchAxes:
  phase: e2e
  contentType: homepage
  supplyMode: site_primary
runtimeProfile: cursor_local
env:
  QWQ_HOMEPAGE_ONLY_EXECUTION_BRANCH: feature/homepage-commercial-lane
  QWQ_CONTENT_SUPPLY_EXECUTION_BRANCH: feature/homepage-commercial-lane
  # 错峰冷启：worker bridge 启动间隔拉大，避免同时抢占本地 Cursor 资源
  QWQ_CURSOR_BRIDGE_LAUNCH_COOLDOWN_SECONDS: "10"
task:
  generate:
    name: 全国景区主页多worker探针0707
    title: 全国景区主页多worker探针0707
    intentLabel: 主页多worker探针0707
    discovery: quwoquan_data/verticals/travel/coverage/discovery_china_scenic_220_20260705.json
    limit: 6
    reserveRatio: 0.2
    entityHomepagesPerTarget: 1
    entityArticlesPerTarget: 0
    imageWorksPerTarget: 0
    allowQuotaShortfall: true
contract:
  requireActiveStatus: true
  executionBranch: feature/homepage-commercial-lane
  targetObjectCount: 6
execution:
  mode: scaled_e2e
  concurrency: 4
  maxWorkers: 2
  cycles: 3
  runtime: local
  model: composer
  startupTimeoutSeconds: 240
  maxAuthorRounds: 60
readiness:
  dailyTarget: 6
  target: 6
  minPassRate: 0.0
  mode: trial
  failOnNoGo: false
  # 本地 cursor_sdk bridge 不回传 usage，estimated 账本可准出（2026-07-06 裁定）
  acceptEstimatedTokenLedger: true
