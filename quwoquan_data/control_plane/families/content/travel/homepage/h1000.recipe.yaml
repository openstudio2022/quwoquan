# 全国景区主页千级（1000 目标，commercial 口径）；h100 GO 后放量。
# 运行：qwq-data task run-recipe content/travel/homepage/h1000
schemaVersion: quwoquan.task.recipe
recipeId: content/travel/homepage/h1000
title: 全国景区主页千级批（commercial）
presetRef: content/travel/homepage/base
batchAxes:
  phase: e2e
  contentType: homepage
  supplyMode: site_primary
runtimeProfile: cursor_local
env:
  QWQ_HOMEPAGE_ONLY_EXECUTION_BRANCH: feature/homepage-commercial-lane
  QWQ_CONTENT_SUPPLY_EXECUTION_BRANCH: feature/homepage-commercial-lane
task:
  generate:
    name: 全国景区主页千级0706a
    title: 全国景区主页千级0706a
    intentLabel: 主页千级0706
    discovery: quwoquan_data/verticals/travel/coverage/discovery_china_scenic_220_20260705.json
    limit: 1000
    reserveRatio: 0.2
    entityHomepagesPerTarget: 1
    entityArticlesPerTarget: 0
    imageWorksPerTarget: 0
    allowQuotaShortfall: true
# 千级 discovery 供给可能不足 1000：不锁 targetObjectCount，由 select-targets 真实选量决定。
contract:
  requireActiveStatus: true
  executionBranch: feature/homepage-commercial-lane
execution:
  mode: scaled_e2e
  concurrency: 4
  maxWorkers: 1
  cycles: 3
  runtime: local
  model: composer
  startupTimeoutSeconds: 240
  maxAuthorRounds: 200
readiness:
  dailyTarget: 1000
  target: 1000
  minPassRate: 0.9
  mode: commercial
  failOnNoGo: true
  # 2026-07-06 裁定：本地 cursor_sdk bridge 不回传 usage，estimated 账本可准出。
  acceptEstimatedTokenLedger: true
