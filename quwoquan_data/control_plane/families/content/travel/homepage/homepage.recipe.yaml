# `task init` 从已确认 carrier demand 的 familyRef 读取本 recipe；本文件不包含实例参数。
# 区域、主题与目标数只进入 carrier demand / immutable candidate bindings，不得复制到 recipe。
# 同一 executionId 只允许字节一致重放；blocked 后用新 executionId，并由 carrier demand 声明 retryOf。
schema: quwoquan.content.recipe
recipeId: content/travel/homepage/homepage
title: 旅行地点主页执行（通用模板）
presetRef: content/travel/homepage/base
selection:
  # 全旅游地点：在冻结前以地点实体分区选取，覆盖景区、博物馆、古镇等地点类型。
  category: 地点
  # 目标集在 execution 初始化时冻结；来源短缺只能以同一冻结池的审计丢弃吸收，
  # 且 source-ready 数必须仍满足 approvedQuota，禁止 reserve/replacement。
  entityHomepagesPerTarget: 1
  entityArticlesPerTarget: 0
  imageWorksPerTarget: 0
  videoWorksPerTarget: 0
contract:
  requireActiveStatus: true
execution:
  model: gpt-5.6-terra
  modelFamily: gpt
  modelParameters: []
  reviewModel: gpt-5.6-terra
  reviewModelFamily: gpt
  reviewModelParameters: []
readiness:
  mode: research
  requireReviewed: true
