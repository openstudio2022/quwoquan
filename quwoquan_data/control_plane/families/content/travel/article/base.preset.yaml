# 旅行文章内容基线 preset（默认值唯一真相源；execution spec 的 presetRef 指向本文件）。
# defaults 与 execution spec 同构：实例未显式声明的字段由此补齐。
schema: quwoquan.content.preset
presetId: content/travel/article/base
title: 旅行文章任务基线
defaults:
  content:
    angles:
    - 体验
    - 美图
    - 攻略
    audiences:
    - 通用
    carriers:
    - article
    modalityContract: separated_research
    research:
      lanes:
      - article
      imageAssetStrategy: attribution_audited_publish
      imageCountPolicy: score_bonus
      allowAiImages: false
    quotas:
      entityHomepagesPerTarget: 0
      entityArticlesPerTarget: 1
      imageWorksPerTarget: 0
      videoWorksPerTarget: 0
      routeArticles: 0
