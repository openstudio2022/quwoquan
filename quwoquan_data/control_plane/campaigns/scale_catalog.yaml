# Campaign scale catalog: named throughput floors plus arbitrary M{n}/quota.
# A quota is a minimum workload/milestone floor, never a maximum admission count.
# Full-frontier runs may finalize every qualified object beyond the named floor;
# count is never stored here and runtime derives initial work via oversampleFactor.
maxQuota: 100000
minQuota: 1
namedScales:
  M1: { quota: 1 }
  M10: { quota: 10 }
  M100: { quota: 100 }
  M1000: { quota: 1000 }
  M10000: { quota: 10000 }
  M100000: { quota: 100000 }
