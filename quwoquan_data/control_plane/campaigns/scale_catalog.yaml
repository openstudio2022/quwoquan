# Campaign scale catalog: named presets plus arbitrary M{n}/quota (hard cap).
# count is never stored here; runtime derives it via oversampleFactor.
maxQuota: 100000
minQuota: 1
namedScales:
  M1: { quota: 1 }
  M10: { quota: 10 }
  M100: { quota: 100 }
  M1000: { quota: 1000 }
  M10000: { quota: 10000 }
  M100000: { quota: 100000 }
