schema: quwoquan_data.public_contacts
# 公共可公示联系方式白名单（唯一真相源）。
# 规则：正文默认拦截一切电话/微信/QQ 等私人联系方式；仅以下公共号码、
# 以及在 source 证据中核实的"景区官方接待电话"（经 entity 级显式放行）可出现。
# 微信号/QQ 号属私人联系方式，任何情况下都不得出现在编辑内容正文。

# 紧急 / 公共服务短号（全国通用，永远放行）
emergencyNumbers:
  - "110"   # 报警
  - "119"   # 火警
  - "120"   # 急救
  - "122"   # 交通事故
  - "12395" # 水上搜救
  - "12301" # 全国旅游服务热线
  - "12315" # 市场监管投诉
  - "96110" # 反诈
  - "12345" # 政务服务热线

# 全国性公共热线（含说明，便于人工审计）
publicHotlines:
  - number: "12301"
    label: 全国旅游服务热线
  - number: "12315"
    label: 全国消费者投诉举报热线

# 允许号码前缀（仅放行明确的全国性服务号段；不放行任意座机/手机）。
# 景区官方接待电话因实体而异，须在 source 证据核实后经 entity 级白名单放行，
# 不在此默认前缀内放行。
allowPrefixes: []
