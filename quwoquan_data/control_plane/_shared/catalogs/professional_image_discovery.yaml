schema: quwoquan_data.professional_image_discovery_catalog
catalogRevision: research-professional-image-v3
providerOrder: [pinterest, tuchong, wikimedia_commons, openverse]
supportedAxes: [entity, category, season, style, viewpoint, popularity]
providers:
  - provider: pinterest
    displayName: Pinterest
    priority: 0
    discoveryMode: manual_or_supported_api
    publicDiscoveryUrls:
      - https://www.pinterest.com/
    searchUrlTemplate: ""
    queryTemplates:
      - "{entity} {category} {season} {style} {viewpoint} photography {popularity}"
      - "{entity} travel landscape {style} {viewpoint} {popularity}"
    acquisitionPaths: [supported_api, manual_file]
    termsUrl: https://policy.pinterest.com/en/terms-of-service
    accessPolicy:
      anonymousOnly: true
      respectRobots: true
      loginBypass: false
      captchaBypass: false
      paywallBypass: false
  - provider: tuchong
    displayName: 图虫
    priority: 1
    discoveryMode: public_explore_manual_query
    publicDiscoveryUrls:
      - https://tuchong.com/explore/
      - https://tuchong.com/feeds/recommend/
    searchUrlTemplate: ""
    queryTemplates:
      - "{entity} {category} {season} {style} {viewpoint} {popularity}"
      - "{entity} 风光 旅行 摄影 {style} {viewpoint}"
    acquisitionPaths: [public_direct, supported_api, manual_file]
    termsUrl: https://tuchong.com/info/terms/
    accessPolicy:
      anonymousOnly: true
      respectRobots: true
      loginBypass: false
      captchaBypass: false
      paywallBypass: false
  - provider: wikimedia_commons
    displayName: Wikimedia Commons
    priority: 2
    discoveryMode: public_search_url
    publicDiscoveryUrls:
      - https://commons.wikimedia.org/wiki/Special:MediaSearch
    searchUrlTemplate: "https://commons.wikimedia.org/w/index.php?search={query}&title=Special:MediaSearch&type=image"
    queryTemplates:
      - "{entity} {category} {season} {style} {viewpoint} {popularity}"
      - "{entity}"
    acquisitionPaths: [supported_api, manual_file]
    termsUrl: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
    accessPolicy:
      anonymousOnly: true
      respectRobots: true
      loginBypass: false
      captchaBypass: false
      paywallBypass: false
  - provider: openverse
    displayName: Openverse
    priority: 3
    discoveryMode: public_search_url
    publicDiscoveryUrls:
      - https://openverse.org/
    searchUrlTemplate: "https://openverse.org/search/image?q={query}"
    queryTemplates:
      - "{entity} {category} {season} {style} {viewpoint} {popularity}"
      - "{entity}"
    acquisitionPaths: [supported_api]
    termsUrl: https://docs.openverse.org/terms_of_use.html
    accessPolicy:
      anonymousOnly: true
      respectRobots: true
      loginBypass: false
      captchaBypass: false
      paywallBypass: false
