schema: quwoquan.content_source_registry

allowedValues:
  lanes: [homepage, article, image, video]
  defaultRoles:
    - primary
    - supporting
    - discovery_only
    - reference_only
    - licensed_candidate
    - publish_candidate
    - publishable
  fetchModes:
    - api
    - html
    - search
    - manual_authorization
    - licensed_api
    - platform_reference
    - attribution_manifest
  researchAcquisitionPaths:
    - public_direct
    - supported_api
    - manual_file
  rightsPolicies:
    - factual_reference_only
    - official_terms_required
    - asset_level_required
    - open_license_required
    - attribution_no_watermark
    - commercial_license_required
    - creator_authorization_required
    - reference_only
  siteCrawlProfileFields:
    - siteId
    - domains
    - allowedPaths
    - discoveryStrategy
    - timeWindowDays
    - contentLanes
    - fetchMode
    - extractor
    - rateLimit
    - rightsPolicy
    - robotsPolicy
    - loginPolicy
    - watermarkPolicy
    - maxDepth
    - maxPagesPerDay
    - crawlAllowed

# 来源专业度先验（作品 vs 随记判定的来源侧信号）。
# baseTier ∈ tier1..tier5；worksAffinity ∈ work_strong/work/neutral/moment/reject。
# 判定权重在 works_classification.yaml；此处只声明"来源类别 → 专业度先验"映射（单一真相源）。
# 缺失 sourceClass 走 default；内容实测信号(score_source_markdown/结构/图片)会进一步调整。
sourceTierSignals:
  default:
    baseTier: tier4_casual
    worksAffinity: neutral
  bySourceClass:
    encyclopedia: { baseTier: tier1_authoritative, worksAffinity: work_strong }
    knowledge_graph: { baseTier: tier1_authoritative, worksAffinity: work_strong }
    official_site: { baseTier: tier1_authoritative, worksAffinity: work_strong }
    government_tourism: { baseTier: tier1_authoritative, worksAffinity: work }
    official_article: { baseTier: tier2_professional, worksAffinity: work }
    authoritative_media: { baseTier: tier2_professional, worksAffinity: work }
    vertical_professional: { baseTier: tier2_professional, worksAffinity: work }
    media_article: { baseTier: tier2_professional, worksAffinity: work }
    ugc_longform: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    community_post: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    platform_article: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    open_license_media: { baseTier: tier2_professional, worksAffinity: work }
    photography_community: { baseTier: tier2_professional, worksAffinity: work }
    free_stock: { baseTier: tier3_quality_ugc, worksAffinity: work }
    commercial_stock: { baseTier: tier2_professional, worksAffinity: work }
    visual_discovery_platform: { baseTier: tier4_casual, worksAffinity: neutral }
    domestic_stock: { baseTier: tier3_quality_ugc, worksAffinity: work }
    official_gallery: { baseTier: tier1_authoritative, worksAffinity: work }
    museum_open_access: { baseTier: tier1_authoritative, worksAffinity: work }
    vertical_image_platform: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    guidebook: { baseTier: tier2_professional, worksAffinity: work }
    route_platform: { baseTier: tier3_quality_ugc, worksAffinity: work }
    review_note: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    video_platform: { baseTier: tier4_casual, worksAffinity: neutral }
    vertical_video: { baseTier: tier3_quality_ugc, worksAffinity: neutral }
    stock_video: { baseTier: tier3_quality_ugc, worksAffinity: work }
    social_feed: { baseTier: tier4_casual, worksAffinity: moment }
    microblog: { baseTier: tier4_casual, worksAffinity: moment }
    short_video_feed: { baseTier: tier4_casual, worksAffinity: moment }

lanePolicies:
  homepage:
    maxCoreSources: 5
    homepageSourcePolicyRevision: encyclopedia-primary
    primarySources:
      - sourceKind: wikipedia
        sourceId: wikipedia
        platform: 维基百科
        authorityRank: 0
        probeOrder: 0
        hosts: [zh.wikipedia.org]
        urlPatterns: ["https://zh.wikipedia.org/wiki/*", "https://zh.wikipedia.org/w/api.php*"]
        extractor: wikipedia_api
        sourceUseMode: licensed_adaptation
        license: CC BY-SA 4.0
        termsUrl: https://creativecommons.org/licenses/by-sa/4.0/
        licenseSnapshot: Wikipedia text is available under CC BY-SA 4.0 subject to attribution.
        homepageTextAllowed: true
        sameSourceImageEvidenceAllowed: true
      - sourceKind: baidu_baike
        sourceId: baidu_baike
        platform: 百度百科
        authorityRank: 1
        probeOrder: 1
        hosts: [baike.baidu.com]
        urlPatterns: ["https://baike.baidu.com/item/*"]
        extractor: baidu_baike_html
        sourceUseMode: factual_reference_only
        homepageTextAllowed: true
        sameSourceImageEvidenceAllowed: false
        canonicalResolution:
          baseUrl: https://baike.baidu.com/search/word?word=
          candidateLimit: 3
          requireGeoContextForAlias: true
          canonicalConfidence: 0.94
          aliasConfidence: 0.85
      - sourceKind: toutiao_baike
        sourceId: toutiao_baike
        platform: 今日头条百科
        authorityRank: 2
        probeOrder: 2
        hosts: [www.baike.com, baike.com]
        urlPatterns:
          - "https://www.baike.com/wiki/*"
          - "https://baike.com/wiki/*"
          - "https://www.baike.com/wikiid/*"
          - "https://baike.com/wikiid/*"
        extractor: toutiao_baike_html
        sourceUseMode: factual_reference_only
        homepageTextAllowed: true
        sameSourceImageEvidenceAllowed: true
        canonicalResolution:
          baseUrl: https://www.baike.com/wiki/
          candidateLimit: 3
          requireGeoContextForAlias: true
          canonicalConfidence: 0.93
          aliasConfidence: 0.84
    discoveryOnlySources:
      - wikidata
      - osm_poi
      - encyclopedia_search
    # 只约束正文底稿（source plan / source unit / writing pack / primaryEvidenceRef）。
    # 结构化事实字段的准入见 structuredFactsPolicy，两者不共用来源闭集。
    forbiddenNarrativeSources:
      - wikivoyage
      - baike_360
      - official_site
      - government_tourism
      - portal
      - media
      - ota
    # 结构化事实与正文底稿的证据要求本质不同：营业时间、票价、建议游玩时长、
    # 海拔与官网这类字段是可逐条核验的单值事实，百科词条恰恰最不可靠也最不及时，
    # 而官网与政府文旅门户是这些字段的第一手发布方。因此结构化事实单独放开受审计
    # 的官方来源，正文底稿仍锁在三百科闭集。
    structuredFactsPolicy:
      revision: audited-official-structured-facts
      fields:
        - openingHours
        - ticketPriceRange
        - recommendedDurationMinutes
        - bestSeasonTagRefs
        - altitudeMeters
        - officialWebsite
      allowedSourceClasses:
        - encyclopedia
        - official_site
        - government_tourism
      minIndependentSources: 1
      requiresFactSourceProvenance: true
      narrativeBodyRemainsEncyclopediaOnly: true
      promptFacts:
        - 结构化事实字段可以用官网与政府/文旅门户作为独立证据源，正文底稿不可以。
        - 每条结构化事实必须逐字段落 factSources：sourceId、sourceClass、抓取 URL、观测时间与置信度，缺任一项该字段不发布。
        - 官方来源与百科冲突时以官方来源为准，并保留冲突记录；不得静默取其一。
        - 官网与政府门户的准入只覆盖 fields 列出的字段，不得借此把官方文案改写进正文或 keyFacts。
    rankingSignals:
      - authority
      - entity_match
      - fact_density
      - image_text_completeness
      - freshness
    promptFacts:
      - 实体主页正文主源闭集仅为维基百科、百度百科、今日头条百科。
      - Rank 0 维基百科，Rank 1 百度百科，Rank 2 今日头条百科；按实体匹配、事实密度与正文质量决胜。
      - Wikidata、OSM 与百科搜索仅作候选发现；维基导游、360百科、官网、政府、门户、媒体、OTA 不得进入主页 source plan、source unit、writing pack 或 primaryEvidenceRef。
      - 核心主页来源最多 5 个，优先图文并茂、事实字段丰富、可抓取和可追溯的页面。
  article:
    sourceSelectionMode: quality_driven
    noIntrinsicPriorityBySourceClass: true
    rankingSignals:
      - content_quality
      - entity_relevance
      - information_density
      - image_text_completeness
      - traceability
      - rights_safety
      - originality
      - dedupe_value
      - freshness
    promptFacts:
      - 文章来源不按 UGC、社区、媒体、官方或垂类专业站天然升降级。
      - 所有文章型来源按内容质量、图文完整、事实可追溯、去重价值和文字/图片权利风险判断。
      - 文章底稿必须来自 article lane，源图是底稿证据链的一部分，一稿一用。
  image:
    discoveryAllowed: true
    publishRequiresAssetRights: true
    rankingSignals:
      - visual_relevance
      - asset_rights_clarity
      - source_traceability
      - image_quality
      - creator_identity
      - dedupe_value
    promptFacts:
      - 图片广泛检索通用视觉平台、摄影社区、图库、官方图库和垂类平台。
      - Pinterest、小红书、微博、抖音、B站等可做发现或参考；其中 Pinterest 允许走 attribution_no_watermark 逐图归因发布，但必须补齐 pin/source/作者/转载出处/无水印扫描证据。
      - 有水印、版权声明、转载痕迹、作者不明或 terms 不清的图片不得进入发布候选；去水印只允许用于自有或明确授权素材。
  video:
    discoveryAllowed: true
    publishRequiresAssetRights: true
    admissionPolicyRevision: sourced-video-attribution
    requiredEvidence:
      - directly_downloadable_asset
      - media_probe
      - sampled_watermark_ocr
      - original_creator_attribution
      - source_post_url
      - original_asset_url
      - audio_rights
      - model_release
      - property_release
      - notice_and_takedown
    invariant:
      directDownloadRequired: true
      accessControlBypassAllowed: false
      drmAllowed: false
      watermarkStatusRequired: absent
      attributionRequired: true
      audioRightsEvidenceRequired: true
    commercialAdmissionMatrix:
      - { sourceId: wikimedia_commons_video, sourceKind: tourism_video_site, publicationAdmissions: [research_release, commercial_release] }
      - { sourceId: youtube, sourceKind: tourism_video_site, publicationAdmissions: [] }
      - { sourceId: vimeo, sourceKind: tourism_video_site, publicationAdmissions: [] }
      - { sourceId: bilibili, sourceKind: tourism_video_site, publicationAdmissions: [] }
      - { sourceId: douyin, sourceKind: douyin, publicationAdmissions: [research_release, risk_accepted_attribution_only, commercial_release] }
      - { sourceId: tiktok, sourceKind: tiktok, publicationAdmissions: [research_release, risk_accepted_attribution_only, commercial_release] }
      - { sourceId: weibo, sourceKind: weibo, publicationAdmissions: [research_release, risk_accepted_attribution_only, commercial_release] }
      - { sourceId: toutiao_video, sourceKind: toutiao, publicationAdmissions: [research_release, risk_accepted_attribution_only, commercial_release] }
      - { sourceId: pexels_videos, sourceKind: tourism_video_site, publicationAdmissions: [research_release, commercial_release] }
      - { sourceId: pixabay_videos, sourceKind: tourism_video_site, publicationAdmissions: [research_release, commercial_release] }
      - { sourceId: pond5, sourceKind: tourism_video_site, publicationAdmissions: [research_release, commercial_release] }
      - { sourceId: storyblocks, sourceKind: tourism_video_site, publicationAdmissions: [research_release, commercial_release] }
      - { sourceId: travel_vlog, sourceKind: tourism_video_site, publicationAdmissions: [research_release, risk_accepted_attribution_only, commercial_release] }
      - { sourceId: chinese_tourism_vertical, sourceKind: tourism_video_site, publicationAdmissions: [research_release, risk_accepted_attribution_only, commercial_release] }
      - { sourceId: cctv_video, sourceKind: tourism_video_site, publicationAdmissions: [research_release] }
    rankingSignals:
      - visual_relevance
      - play_count
      - like_count
      - comment_count
      - share_count
      - favorite_count
      - observed_at
      - same_platform_topic_time_bucket_percentile
      - officiality
      - audio_rights_clarity
      - asset_rights_clarity
      - source_traceability
    promptFacts:
      - 视频广泛检索通用视频平台、素材库、官方账号和垂类视频源。
      - 抖音、TikTok、微博、今日头条及中国旅行垂类只接收可直接下载、无 DRM、未绕过访问控制、采样 OCR 无水印的资产。
      - 外部源视频必须冻结原创者、来源帖、原始资产、音频权利和下架策略；风险归因发布必须绑定审批 riskAcceptanceId，商业发布必须绑定已验证授权凭证。

siteCrawlProfilePolicy:
  sourceRoot: sources/{vertical}/{sourceId}
  defaultTimeWindowDays: 730
  crawlerTruthSource: vertical providers.yaml
  promptFacts:
    - 网站维度供给线只负责发现、抓取、抽取、评分和映射候选，不直接发布内容。
    - fetchable=false 或 crawlAllowed=false 的站点不得进入批量抓取，只能作为 discovery/reference。
    - controlledTrial.allowed=true 仅代表可做受控 DAG/并发/门禁验证；validationOnly 必须为 true，rawFetchAllowed 和 publishableAssetsAllowed 必须为 false。
    - 受控试跑候选只能作为 0.plan handoff 结构验证，不代表真实抓取授权，也不得把平台素材作为可发布资产。
    - 发布主线只接受 0.plan target_set 冻结后的标准对象，不直接消费 site crawl 产物。
    - 站点主线 execution 声明 supplyMode=site_primary 并记录 sourceKey=siteId；搜索引擎汇聚只作小流量数据补全，必须使用独立 search_supplement execution，禁止与站点主线共用 executionId 或 readiness 口径。
    - 平台发现图不能自动变发布图；逐资产缺 license、credit、sourceUrl、termsUrl、usageScope 即不可发布。
    - 日产 10 万级必须提供站点漏斗、release/import、搜索可见和推荐反馈证据。

common:
  entity:
    - sourceId: wikipedia
      platform: 维基百科
      sourceClass: encyclopedia
      lanes: [homepage]
      defaultRole: primary
      fetchMode: api
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [多语言百科主事实源, 不整段搬运, 适合作为实体主页核心证据]
    - sourceId: wikidata
      platform: Wikidata
      sourceClass: knowledge_graph
      lanes: []
      defaultRole: discovery_only
      fetchMode: api
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [结构化别名、坐标、官网、媒体属性和知识图谱补证]
    - sourceId: baidu_baike
      platform: 百度百科
      sourceClass: encyclopedia
      lanes: [homepage]
      defaultRole: primary
      fetchMode: api
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [中文百科补充事实源, 只抽取可核验事实]
    - sourceId: toutiao_baike
      platform: 今日头条百科
      sourceClass: encyclopedia
      lanes: [homepage]
      defaultRole: primary
      fetchMode: search
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [中文百科正文主源, 只抽取可核验事实]
    - sourceId: britannica
      platform: Britannica
      sourceClass: encyclopedia
      lanes: []
      defaultRole: discovery_only
      fetchMode: html
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [英文权威百科补证, 适合国际实体]
    - sourceId: google_knowledge_graph
      platform: Google Knowledge Graph
      sourceClass: knowledge_graph
      lanes: []
      defaultRole: discovery_only
      fetchMode: api
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [知识图谱补证, 不作为正文改编来源]
    - sourceId: official_site
      platform: 官方网站
      sourceClass: official_site
      lanes: []
      defaultRole: reference_only
      structuredFactsRole: audited_evidence
      fetchMode: html
      rightsPolicy: official_terms_required
      rateLimit: conservative
      promptFacts:
        - 实体官网或品牌官网不得进入实体主页正文来源链
        - 可作为营业时间、票价、建议时长、海拔与官网地址的受审计结构化事实证据源，必须逐字段留 factSources
    - sourceId: government_tourism
      platform: 政务文旅
      sourceClass: government_tourism
      lanes: []
      defaultRole: reference_only
      structuredFactsRole: audited_evidence
      fetchMode: html
      rightsPolicy: official_terms_required
      rateLimit: conservative
      promptFacts:
        - 政府或文旅站点不得进入实体主页正文来源链
        - 可作为营业时间、票价、建议时长、海拔与最佳季节的受审计结构化事实证据源，必须逐字段留 factSources
  article:
    - sourceId: official_article
      platform: 官方文章
      sourceClass: official_article
      lanes: [article]
      defaultRole: licensed_candidate
      fetchMode: html
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [官方图文、公告、专题或攻略文章, 质量和权利逐篇判断]
    - sourceId: vertical_professional
      platform: 垂类专业站
      sourceClass: vertical_professional
      lanes: [article]
      defaultRole: licensed_candidate
      fetchMode: html
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [垂类攻略、评测、指南或专业内容, 不天然优先于 UGC]
    - sourceId: ugc_longform
      platform: UGC长文
      sourceClass: ugc_longform
      lanes: [article]
      defaultRole: licensed_candidate
      fetchMode: html
      rightsPolicy: asset_level_required
      rateLimit: conservative
      promptFacts: [游记、笔记、经验帖、长评, 按内容质量和权利风险判断]
    - sourceId: community_post
      platform: 社区帖子
      sourceClass: community_post
      lanes: [article]
      defaultRole: licensed_candidate
      fetchMode: html
      rightsPolicy: asset_level_required
      rateLimit: conservative
      promptFacts: [社区经验、讨论帖、论坛帖, 只使用可核验事实和可发布图片]
    - sourceId: media_article
      platform: 媒体文章
      sourceClass: media_article
      lanes: [article]
      defaultRole: licensed_candidate
      fetchMode: html
      rightsPolicy: factual_reference_only
      rateLimit: conservative
      promptFacts: [新闻、深度、测评和专题, 避免长句复现]
    - sourceId: platform_article
      platform: 内容平台文章
      sourceClass: platform_article
      lanes: [article]
      defaultRole: licensed_candidate
      fetchMode: html
      rightsPolicy: asset_level_required
      rateLimit: conservative
      promptFacts: [今日头条、网易、搜狐、微信、知乎等平台文章, 平台不决定优先级]
    - sourceId: xiaohongshu_travel_reference
      platform: 小红书
      sourceClass: community_post
      lanes: [article, image, video]
      defaultRole: discovery_only
      fetchMode: platform_reference
      rightsPolicy: reference_only
      rateLimit: conservative
      promptFacts: [综合内容平台只按主题、地域和时间片检索风景/摄影候选, 默认只做发现、互证和质量分布, 未经逐资产授权不得发布]
  image:
    - sourceId: wikimedia_commons
      platform: Wikimedia Commons
      sourceClass: open_license_media
      lanes: [image]
      defaultRole: publish_candidate
      fetchMode: api
      rightsPolicy: open_license_required
      researchAcquisitionPaths: [supported_api, manual_file]
      rateLimit: conservative
      promptFacts: [自由媒体库, 逐图记录许可、署名和文件页, 受控网络无法直连官方 CDN 时仅允许基于同一官方文件页和 exact-byte 证据人工导入]
    - sourceId: openverse
      platform: Openverse
      sourceClass: open_license_media
      lanes: [image]
      defaultRole: publish_candidate
      fetchMode: api
      rightsPolicy: open_license_required
      rateLimit: conservative
      promptFacts: [开放许可媒体搜索索引, 以原始落地页和 license URL 为授权证据]
    - sourceId: flickr
      platform: Flickr
      sourceClass: photography_community
      lanes: [image]
      defaultRole: licensed_candidate
      fetchMode: search
      rightsPolicy: asset_level_required
      rateLimit: conservative
      promptFacts: [摄影社区和 CC 图片来源, 必须逐图判断许可]
    - sourceId: pinterest
      platform: Pinterest
      sourceClass: visual_discovery_platform
      lanes: [image]
      defaultRole: publish_candidate
      fetchMode: attribution_manifest
      rightsPolicy: attribution_no_watermark
      researchAcquisitionPaths: [supported_api, manual_file]
      rateLimit: conservative
      promptFacts: [视觉发现和单源图片作品候选, Pinterest robots 禁止自动 search 抓取；research 只能通过平台支持接口或人工文件取得并记录 unverified 权利缺口, commercial 必须补齐逐图授权, 逐图记录 pinUrl/originalAssetUrl/sourceAuthor/repostAttribution/watermarkScan/ocrScan/modelReleaseStatus/collectedAt]
    - sourceId: five_hundred_px
      platform: 500px
      sourceClass: photography_community
      lanes: [image]
      defaultRole: licensed_candidate
      fetchMode: search
      rightsPolicy: creator_authorization_required
      rateLimit: conservative
      promptFacts: [摄影社区, 适合作品发现和授权洽谈]
    - sourceId: behance
      platform: Behance
      sourceClass: photography_community
      lanes: [image]
      defaultRole: licensed_candidate
      fetchMode: search
      rightsPolicy: creator_authorization_required
      rateLimit: conservative
      promptFacts: [摄影与视觉作品社区, 适合作品发现和创作者授权洽谈, 必须逐图取得作者授权并保留署名和作品落地页]
    - sourceId: unsplash
      platform: Unsplash
      sourceClass: free_stock
