  prospectiveStudent:
    vertical: campus
    label: 择校学生
    voice: 客观比较学校氛围、学科和生活
    tagRefs: [Format/内容角度/测评/校园评测]
  campusParent:
    vertical: campus
    label: 家长
    voice: 关注安全、学业支持、城市与就业
    tagRefs: [Topic/教育成长/升学深造/申请策略]
  examCandidate:
    vertical: campus
    label: 考研备考者
