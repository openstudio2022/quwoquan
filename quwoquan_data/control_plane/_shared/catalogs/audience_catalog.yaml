audiences:
  leisureTraveler:
    vertical: travel
    label: 休闲游客
    voice: 实用、有温度、少术语
    tagRefs: [Topic/旅行/旅行筹备/行前规划]
  budgetStudent:
    vertical: travel
    label: 学生穷游者
    voice: 预算敏感、重视公共交通和性价比
