# 本地 Cursor SDK 唯一运行策略。任务范围和目标数由 execution request 冻结，不进入本文件。
profileId: cursor_local_calibrated
policy:
  cursor:
    provider: cursor_sdk
    model: auto
    modelParameters: []
    runtime: local
  workers:
    # Cursor auto 由 provider 动态路由。每个 detached carrier 只保留一个
    # 语义工作槽，四载体并发由 campaign lane 提供，避免单 lane 内资源争抢。
    author: 1
    reviewer: 1
    research: 1
    download: 4
    campaignLaneWorkers: 4
    cursorBridgeInstances: 1
  selection:
    # 候选池 = ceil(准出配额 * oversampleFactor)。1.8 来自实测首过率，
    # 质量不达标的对象直接丢弃、不重试，靠过采补足配额。
    oversampleFactor: 1.8
  budgets:
    startupTimeoutSeconds: 600
    campaignSubmissionTimeoutSeconds: 3600
    # Cursor auto 单 lane 保持一个语义槽。按 M100 实测，M1000 的 1800
    # 候选采集约 32 小时、1000 对象创作约 17 小时；72 小时给 review、
    # publish 与有界恢复留出余量，同时仍由 controller 超时硬终止。
    campaignLaneTimeoutSeconds: 259200
    preflightNetworkTimeoutSeconds: 5
    agentTimeoutSeconds: 2400
    authRetryLimit: 3
    authRetryDelaySeconds: 30
    noProgressRoundLimit: 6
    researchWaveSize: 1
    researchMaxWavesPerRun: 0
    sourcePlanRecoveryPasses: 1
    sourcePlanRecoveryWorkers: 1
    coldStartMaxWorkers: 1
    workerStaggerSeconds: 15.0
    managedFutureGraceSeconds: 15
    schedulerStaleSeconds: 900
    controllerLeaseStaleSeconds: 900
    assignmentDeadlineSeconds: 2400
    downloadFetchRetryLimit: 1
    bridgeLaunchCooldownSeconds: 2.0
    bridgeReadyDelaySeconds: 1.5
    reactRewindLimit: 2
    preflightStartupAttempts: 3
    preflightRetryDelaySeconds: 3.0
    cursorWarmAttempts: 3
    cursorBridgeMaxRetries: 3
    managedCheckpointRefLimit: 0
    cursorBridgeHandshakeTimeoutSeconds: 60
    pageImageFetchMaxAttempts: 5
    pageImageFetchRetryBackoffSeconds: 1.0
    pageImageDownloadTimeoutSeconds: 45
    downloadTextTimeoutSeconds: 20
    downloadBytesTimeoutSeconds: 8
    stageNoProgressTimeoutSeconds: 1800
    researchWaveBudgetSeconds: 1800
    networkBreakerThreshold: 6
    localProcessProbeTimeoutSeconds: 2
    processTerminationTimeoutSeconds: 5
    agentFuturePollTimeoutSeconds: 10
    apiRequestTimeoutSeconds: 30
    directFetchTimeoutSeconds: 15
    sourceFetchTimeoutSeconds: 20
    sourceVideoReadTimeoutSeconds: 180
    sourceFetchMaxRetries: 4
    ocrTimeoutSeconds: 8
    videoProbeTimeoutSeconds: 60
    videoTranscodeTimeoutSeconds: 300
    mediawikiFallbackRetries: 2
    mediawikiWikitextMaxRetries: 2
    queueLeaseTtlSeconds: 1800
    queueHeartbeatSeconds: 60
    queueMaxAttempts: 2
    queueMaxStartupFailures: 3
    queueMaxWallClockSeconds: 2400
    queueBackoffBaseSeconds: 30
    queueBackoffCapSeconds: 600
    queueStuckThreshold: 3
    startupProbeSuiteAttempts: 8
    cursorStartupProbeCacheTtlSeconds: 600
    # 八次探针下任一失败率均为 12.5%，因此 1% 阈值等价于零失败准入。
    cursorTrue5xxRateLimit: 0.01
    cursorStartupTimeoutRateLimit: 0.01
    coverageWikiRetryLimit: 3
    coverageWikiRetryBackoffSeconds: 5.0
    coverageWikiInterRequestDelaySeconds: 0.3
    coverageOverpassRetryLimit: 3
    coverageOverpassRetryBackoffSeconds: 5.0
    coverageOverpassInterRequestDelaySeconds: 2.0
    coverageOverpassQueryTimeoutSeconds: 60
  coverageDiscovery:
    saturationThreshold: 0.05
    saturationRounds: 2
    maxPagesPerCell: 20
    maxCandidatesPerCitySource: 1000
    maxNewPerCell: 200
    requestBudget: 20000
    maxTotalCandidates: 0
    requiredEmptyPages: 2
    requestTimeoutSeconds: 90
    rateLimitPerSecond: 0.5
    wikiCategoryDepth: 4
    retryBackoffMultiplier: 2.0
    wikidataSparqlEndpoint: https://query.wikidata.org/sparql
    wikidataResultLimit: 500
    overpassConcurrency: 4
    overpassResultLimit: 500
    overpassEndpoints:
      - https://maps.mail.ru/osm/tools/overpass/api/interpreter
      - https://overpass-api.de/api/interpreter
  network:
    curlRetries: 1
    curlRetryDelaySeconds: 1
    providerTimeoutSeconds:
      encyclopedia: 20
      mediawiki: 20
      qunar: 20
      openverse: 25
      overpass: 75
