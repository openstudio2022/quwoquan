schema: quwoquan.content_distribution_policy
policyId: research-content-cold-start
productLifecycleState: research
releaseClass: research
mediaGeneration:
  imageAllowed: false
  videoAllowed: false
acquisition:
  bypassLogin: false
  bypassPaywall: false
  bypassCaptcha: false
  bypassAccessControl: false
researchDiscovery:
  catalogRevision: research-media-discovery-v1
  imageProviderPriority:
    - pinterest
    - tuchong
    - openverse
    - wikimedia_commons
  imageSearchAxes:
    - category
    - entity
    - season
    - style
    - viewpoint
    - popularity
  videoPopularity:
    signals:
      - play
      - like
      - comment
      - share
      - favorite
    normalization: same_platform_topic_time_bucket_percentile
    statistical: true
    nonBlocking: true
researchDistribution:
  allowedRightsStatuses:
    - verified
    - unverified
    - unknown
  requireInternalAccessIsolation: true
commercialDistribution:
  allowedRightsStatuses:
    - verified
  requireAuthorizationProof: true
articleMedia:
  illustratedRateTarget: 0.9
  textOnlyRateTarget: 0.1
  requireCoverAndBodyImage: false
scaleMilestones:
  m1Targets:
    homepage: 1
    article: 1
    image: 1
    video: 1
  m10Targets:
    homepage: 10
    article: 10
    image: 10
    video: 2
  m100Targets:
    homepage: 100
    article: 100
    image: 100
    video: 10
  m1000Targets:
    homepage: 1000
    article: 1000
    image: 1000
    video: 100
  m10000Targets:
    homepage: 10000
    article: 10000
    image: 10000
    video: 1000
  requireM100PromotionBeforeM1000: false
  requireM1000PromotionBeforeM10000: false
  milestoneAttainmentRequired: true
  attainmentCountingMode: cumulative_unique_finalized_objects
