schema: quwoquan.content_distribution_policy
policyId: commercial-rights-closure
productLifecycleState: commercial
releaseClass: commercial
mediaGeneration:
  imageAllowed: false
  videoAllowed: false
acquisition:
  bypassLogin: false
  bypassPaywall: false
  bypassCaptcha: false
  bypassAccessControl: false
researchDiscovery:
  catalogRevision: research-media-discovery-v1
  imageProviderPriority:
    - pinterest
    - tuchong
    - openverse
    - wikimedia_commons
  imageSearchAxes:
    - category
    - entity
    - season
    - style
    - viewpoint
    - popularity
  videoPopularity:
    signals:
      - play
      - like
      - comment
      - share
      - favorite
    normalization: same_platform_topic_time_bucket_percentile
    statistical: true
    nonBlocking: true
researchDistribution:
  allowedRightsStatuses:
    - verified
    - unverified
    - unknown
  requireInternalAccessIsolation: true
commercialDistribution:
  allowedRightsStatuses:
    - verified
  requireAuthorizationProof: true
articleMedia:
  illustratedRateTarget: 0.9
  textOnlyRateTarget: 0.1
  requireCoverAndBodyImage: true
scaleMilestones:
  m100Targets:
    homepage: 100
    article: 100
    image: 100
    video: 10
  m1000Targets:
    homepage: 1000
    article: 1000
    image: 1000
    video: 100
  requireM100PromotionBeforeM1000: true
  automaticRecovery:
    targetRate: 0.95
    statistical: true
    nonBlocking: true
