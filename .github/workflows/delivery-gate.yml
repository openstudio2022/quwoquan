# Delivery Gate — PR 合入主门禁（L1+L2）
# 触发：dev1.0 push + dev1.0 -> main pull_request + workflow_dispatch；生产 branch evaluator 决定合法边
# 职责：拓扑校验 + metadata + L1(Flutter) + L2(Go contract) + portal
# 执行语义见 .cursor/commands/deliver.md；本 workflow 是 CI 行为真相源。
name: 03. Delivery Gate

permissions:
  contents: read
  actions: read

env:
  QWQ_OUTPUT_ROOT: .qwq_output
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

on:
  push:
    branches: [dev1.0]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Caller commit SHA/ref for checkout
        required: true
        type: string
      base_sha:
        description: Explicit diff base SHA
        required: true
        type: string
      head_sha:
        description: Explicit diff head SHA
        required: true
        type: string
      candidate_digest:
        description: Stable candidateId from the same Service Pipeline DAG
        required: false
        type: string
        default: ''
      artifact_digest:
        description: ReleaseEvidenceManifest snapshot artifactDigest
        required: false
        type: string
        default: ''
      release_evidence_ref:
        description: Exact immutable GHCR release evidence OCI ref
        required: false
        type: string
        default: ''
      producer_workflow_run_id:
        description: ReleaseEvidenceManifest source.workflowRunId
        required: false
        type: string
        default: ''
      source_git_sha:
        description: ReleaseEvidenceManifest source.gitSha
        required: false
        type: string
        default: ''
      produce_release_evidence:
        description: Produce immutable provider and three-layer test evidence for candidate sealing
        required: false
        type: boolean
        default: false
      provider_evidence_ref:
        description: Exact immutable GHCR OCI ref containing controlled Provider evidence
        required: false
        type: string
        default: ''
      provider_evidence_digest:
        description: OCI transport digest for controlled Provider evidence
        required: false
        type: string
        default: ''
      provider_candidate_image_digest:
        description: Candidate image-set digest executed by Provider release evidence
        required: false
        type: string
        default: ''
      provider_component_evidence_ref:
        description: Exact component-ready OCI ref bound by Provider execution
        required: false
        type: string
        default: ''
      user_acceptance_evidence_ref:
        description: Exact immutable GHCR OCI ref containing real Remote user_acceptance evidence for this source tree
        required: false
        type: string
        default: ''
      user_acceptance_evidence_digest:
        description: OCI transport digest for the real Remote user_acceptance evidence
        required: false
        type: string
        default: ''
    outputs:
      machine_critical_path_seconds:
        description: Diagnostic Delivery Gate job DAG execution path; never the end-to-end budget clock
        value: ${{ jobs.delivery_gate_summary.outputs.machine_critical_path_seconds }}
      summary_result:
        description: Delivery Gate summary result
        value: ${{ jobs.delivery_gate_summary.outputs.summary_result }}
      candidate_digest:
        description: Candidate identity bound to this Delivery Gate
        value: ${{ jobs.delivery_gate_summary.outputs.candidate_digest }}
      artifact_digest:
        description: Evidence snapshot bound to this Delivery Gate
        value: ${{ jobs.delivery_gate_summary.outputs.artifact_digest }}
      delivery_evidence_ref:
        description: Exact immutable Provider/test evidence OCI ref
        value: ${{ jobs.release_evidence.outputs.delivery_evidence_ref }}
      delivery_evidence_digest:
        description: Provider/test evidence OCI transport digest
        value: ${{ jobs.release_evidence.outputs.delivery_evidence_digest }}
      source_git_sha:
        description: Exact source Git SHA bound to Provider/test evidence
        value: ${{ jobs.release_evidence.outputs.source_git_sha }}

jobs:
  topology_regression:
    name: Delivery Gate — Topology
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      service: ${{ steps.detect.outputs.service }}
      app: ${{ steps.detect.outputs.app }}
      portal: ${{ steps.detect.outputs.portal }}
      topology: ${{ steps.detect.outputs.topology }}
      data: ${{ steps.detect.outputs.data }}
      candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
      artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - name: Validate every workflow with pinned actionlint
        run: |
          ACTIONLINT_ROOT="$RUNNER_TEMP/actionlint-1.7.7"
          GOBIN="$ACTIONLINT_ROOT/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          test "$("$ACTIONLINT_ROOT/bin/actionlint" -version | head -n 1)" = "v1.7.7"
          "$ACTIONLINT_ROOT/bin/actionlint" -color
      - name: Enforce canonical repository branch admission
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: python3 quwoquan_ops/gate/verify_git_branch_policy.py
      - id: detect
        name: Detect impacted scopes
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 quwoquan_ops/ci/detect_ci_impacted_scopes.py \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Login GHCR for candidate binding
        if: ${{ inputs.candidate_digest != '' || inputs.artifact_digest != '' || inputs.release_evidence_ref != '' || inputs.producer_workflow_run_id != '' || inputs.source_git_sha != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: candidate
        name: Bind Delivery Gate to the exact Service Pipeline candidate
        if: ${{ inputs.candidate_digest != '' || inputs.artifact_digest != '' || inputs.release_evidence_ref != '' || inputs.producer_workflow_run_id != '' || inputs.source_git_sha != '' }}
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_digest }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          EXPECTED_RELEASE_REF: ${{ inputs.release_evidence_ref }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ inputs.producer_workflow_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_git_sha }}
        run: |
          REQUIRED=(EXPECTED_CANDIDATE EXPECTED_ARTIFACT_DIGEST EXPECTED_RELEASE_REF EXPECTED_WORKFLOW_RUN_ID EXPECTED_SOURCE_SHA)
          for name in "${REQUIRED[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GATE_BLOCK: partial Service Pipeline candidate binding: ${name} is missing"
              exit 2
            fi
          done
          if [[ "$EXPECTED_SOURCE_SHA" != "${{ inputs.head_sha }}" ]]; then
            echo "::error::GATE_BLOCK: Delivery Gate source SHA differs from the requested head"
            exit 2
          fi
          if [[ "$EXPECTED_SOURCE_SHA" != "${{ inputs.checkout_ref }}" ]]; then
            echo "::error::GATE_BLOCK: Delivery Gate source SHA differs from the release candidate"
            exit 2
          fi
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/delivery-release-evidence"
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "$EXPECTED_RELEASE_REF" \
            --output-dir "$ROOT"
          python3 quwoquan_ops/ci/verify_workflow_release_candidate.py \
            --manifest "$ROOT/manifest.json" \
            --expected-candidate "$EXPECTED_CANDIDATE" \
            --expected-artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-repository "${{ github.repository }}" \
            --expected-release-ref "$EXPECTED_RELEASE_REF"
          echo "candidate_digest=$EXPECTED_CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$EXPECTED_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Environment Topology Regression
        if: ${{ steps.detect.outputs.topology == 'true' }}
        run: |
          make verify-service-architecture
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_service:
    name: Delivery Gate — Service Core (L2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.service == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: change_range
        name: Resolve immutable Delivery change range
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHECKOUT_REF: ${{ inputs.checkout_ref || '' }}
          INPUT_BASE_SHA: ${{ inputs.base_sha || '' }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_CHECKOUT_REF" || -n "$INPUT_BASE_SHA" || -n "$INPUT_HEAD_SHA" ]]; then
            if [[ -z "$INPUT_CHECKOUT_REF" || -z "$INPUT_BASE_SHA" || -z "$INPUT_HEAD_SHA" ]]; then
              echo "::error::GATE_BLOCK: reusable Delivery call requires checkout_ref, base_sha and head_sha together"
              exit 2
            fi
            REQUESTED_CHECKOUT_REF="$INPUT_CHECKOUT_REF"
            REQUESTED_BASE_SHA="$INPUT_BASE_SHA"
            REQUESTED_CANDIDATE_SHA="$INPUT_HEAD_SHA"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
              REQUESTED_CHECKOUT_REF="$PR_HEAD_SHA"
              REQUESTED_BASE_SHA="$PR_BASE_SHA"
              REQUESTED_CANDIDATE_SHA="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ ! "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              echo "::error::GATE_BLOCK: Delivery push requires an exact non-zero before SHA"
              exit 2
            fi
            REQUESTED_CHECKOUT_REF="$DISPATCH_SHA"
            REQUESTED_BASE_SHA="$PUSH_BEFORE_SHA"
            REQUESTED_CANDIDATE_SHA="$DISPATCH_SHA"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            REQUESTED_CHECKOUT_REF="$DISPATCH_SHA"
            REQUESTED_BASE_SHA="$(git rev-parse "${DISPATCH_SHA}^" 2>/dev/null || true)"
            REQUESTED_CANDIDATE_SHA="$DISPATCH_SHA"
          else
            echo "::error::GATE_BLOCK: unsupported Delivery trigger for exact change range"
            exit 2
          fi
          if [[ "$REQUESTED_CHECKOUT_REF" != "$REQUESTED_CANDIDATE_SHA" ]]; then
            echo "::error::GATE_BLOCK: checkout_ref must equal head_sha"
            exit 2
          fi
          CANDIDATE_SHA="$(git rev-parse "$REQUESTED_CANDIDATE_SHA" 2>/dev/null || true)"
          BASE_SHA="$(git rev-parse "$REQUESTED_BASE_SHA" 2>/dev/null || true)"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GATE_BLOCK: Delivery gates require exact base/candidate SHAs"
            exit 2
          fi
          if [[ "$CANDIDATE_SHA" != "$(git rev-parse HEAD)" ]] || \
             ! git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"; then
            echo "::error::GATE_BLOCK: Delivery change range is not the checked-out descendant"
            exit 2
          fi
          {
            echo "base_sha=$BASE_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: quwoquan_service/go.mod
          cache: false
      - name: 设置 Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
      - name: 安装 kustomize
        run: bash quwoquan_ops/cli/shared/install_kustomize.sh
      - name: 安装 Service 系统测试依赖
        run: bash quwoquan_ops/ci/run_bounded_apt_install.sh prometheus tesseract-ocr
      - name: 安装 Python 依赖 (recommendation-service)
        run: |
          pip install -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/requirements.txt
      - name: Gate (quwoquan_service)
        env:
          GRAPHQL_MIGRATION_BASE_SHA: ${{ steps.change_range.outputs.base_sha }}
          GRAPHQL_MIGRATION_CANDIDATE_SHA: ${{ steps.change_range.outputs.candidate_sha }}
          GATE_CHANGE_BASE_SHA: ${{ steps.change_range.outputs.base_sha }}
          GATE_CHANGE_HEAD_SHA: ${{ steps.change_range.outputs.candidate_sha }}
          GATE_SERVICE_PHASE: core
        run: |
          bash quwoquan_ops/gate/gate_repo.sh --scope service
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_service_packaging:
    name: Delivery Gate — Service Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.service == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 安装 kustomize
        run: bash quwoquan_ops/cli/shared/install_kustomize.sh
      - name: Gate (quwoquan_service packaging)
        env:
          GATE_SERVICE_PHASE: packaging
        run: bash quwoquan_ops/gate/gate_repo.sh --scope service
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  search_contract_smoke:
    name: Delivery Gate — Search /search Contract Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: topology_regression
    if: >-
      ${{
        needs.topology_regression.outputs.service == 'true' ||
        needs.topology_regression.outputs.app == 'true' ||
        needs.topology_regression.outputs.topology == 'true' ||
        inputs.produce_release_evidence
      }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: quwoquan_service/go.mod
          cache: false
      - name: Build the pinned production CJK search image
        run: |
          docker build \
            --tag quwoquan/elasticsearch-cjk:8.13.4 \
            quwoquan_service/services/product-ops-service/build/elasticsearch
      - name: Verify canonical /search response contract
        working-directory: quwoquan_service
        run: go test ./services/search-service/tests/api_integration/search/search_index_view -count=1
      - name: Verify four-environment search probe contract
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            quwoquan_ops.tests.acceptance.user_acceptance.test_stackctl_up_runtime__integration_probe__user_acceptance_test.StackctlUpRuntimeTest.test_environment_probe_uses_ready_entity_operation_not_blocked_chat \
            quwoquan_ops.tests.acceptance.user_acceptance.test_stackctl_up_runtime__integration_probe__user_acceptance_test.StackctlUpRuntimeTest.test_environment_probe_requires_search_commercial_envelope
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_app_static:
    name: Delivery Gate — App Static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.app == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Configure App CI paths
        run: echo "QWQ_DEPLOY_WORK_ROOT=$RUNNER_TEMP/quwoquan-deploy" >> "$GITHUB_ENV"
      - id: flutter
        name: Resolve repository-pinned Flutter SDK
        run: python3 quwoquan_ops/ci/setup_flutter_sdk.py resolve --version-file quwoquan_app/.flutter-version
      - name: Cache lock-bound Dart dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: "pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('quwoquan_app/pubspec.lock') }}"
          restore-keys: |
            pub-${{ runner.os }}-${{ runner.arch }}-
      - name: Install verified Flutter SDK
        env:
          FLUTTER_ARCHIVE_URL: ${{ steps.flutter.outputs.archive_url }}
          FLUTTER_CACHE_PATH: ${{ steps.flutter.outputs.cache_path }}
          FLUTTER_SHA256: ${{ steps.flutter.outputs.sha256 }}
        run: |
          python3 quwoquan_ops/ci/setup_flutter_sdk.py install \
            --archive-url "$FLUTTER_ARCHIVE_URL" \
            --cache-path "$FLUTTER_CACHE_PATH" \
            --sha256 "$FLUTTER_SHA256"
      - name: Resolve locked App dependencies
        working-directory: quwoquan_app
        run: flutter pub get --enforce-lockfile
      - name: Gate (quwoquan_app static + PA core)
        env:
          GATE_APP_PHASE: static
        run: bash quwoquan_ops/gate/gate_repo.sh --scope app
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_app_tests:
    name: Delivery Gate — App Tests Shard ${{ matrix.shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.app == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Configure App CI paths
        run: echo "QWQ_DEPLOY_WORK_ROOT=$RUNNER_TEMP/quwoquan-deploy" >> "$GITHUB_ENV"
      - id: flutter
        name: Resolve repository-pinned Flutter SDK
        run: python3 quwoquan_ops/ci/setup_flutter_sdk.py resolve --version-file quwoquan_app/.flutter-version
      - name: Cache lock-bound Dart dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: "pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('quwoquan_app/pubspec.lock') }}"
          restore-keys: |
            pub-${{ runner.os }}-${{ runner.arch }}-
      - name: Install verified Flutter SDK
        env:
          FLUTTER_ARCHIVE_URL: ${{ steps.flutter.outputs.archive_url }}
          FLUTTER_CACHE_PATH: ${{ steps.flutter.outputs.cache_path }}
          FLUTTER_SHA256: ${{ steps.flutter.outputs.sha256 }}
        run: |
          python3 quwoquan_ops/ci/setup_flutter_sdk.py install \
            --archive-url "$FLUTTER_ARCHIVE_URL" \
            --cache-path "$FLUTTER_CACHE_PATH" \
            --sha256 "$FLUTTER_SHA256"
      - name: Resolve locked App dependencies
        working-directory: quwoquan_app
        run: flutter pub get --enforce-lockfile
      - name: Install App shared contract native dependencies
        if: ${{ matrix.shard_index == 0 }}
        run: bash quwoquan_ops/ci/run_bounded_apt_install.sh tesseract-ocr
      - name: Gate (quwoquan_app tests shard)
        env:
          GATE_APP_PHASE: tests
          FLUTTER_TEST_TOTAL_SHARDS: "4"
          FLUTTER_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
          FLUTTER_TEST_SERIAL_MODE: exclude
          FLUTTER_TEST_CONCURRENCY: "8"
          FLUTTER_TEST_GUARD_TIMEOUT_SECONDS: "1800"
        run: bash quwoquan_ops/gate/gate_repo.sh --scope app
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_app_serial:
    name: Delivery Gate — App Serial
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.app == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Configure App CI paths
        run: echo "QWQ_DEPLOY_WORK_ROOT=$RUNNER_TEMP/quwoquan-deploy" >> "$GITHUB_ENV"
      - id: flutter
        name: Resolve repository-pinned Flutter SDK
        run: python3 quwoquan_ops/ci/setup_flutter_sdk.py resolve --version-file quwoquan_app/.flutter-version
      - name: Cache lock-bound Dart dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: "pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('quwoquan_app/pubspec.lock') }}"
          restore-keys: |
            pub-${{ runner.os }}-${{ runner.arch }}-
      - name: Install verified Flutter SDK
        env:
          FLUTTER_ARCHIVE_URL: ${{ steps.flutter.outputs.archive_url }}
          FLUTTER_CACHE_PATH: ${{ steps.flutter.outputs.cache_path }}
          FLUTTER_SHA256: ${{ steps.flutter.outputs.sha256 }}
        run: |
          python3 quwoquan_ops/ci/setup_flutter_sdk.py install \
            --archive-url "$FLUTTER_ARCHIVE_URL" \
            --cache-path "$FLUTTER_CACHE_PATH" \
            --sha256 "$FLUTTER_SHA256"
      - name: Resolve locked App dependencies
        working-directory: quwoquan_app
        run: flutter pub get --enforce-lockfile
      - name: Gate (quwoquan_app serial suites)
        env:
          GATE_APP_PHASE: serial
          FLUTTER_TEST_CONCURRENCY: "1"
          FLUTTER_TEST_GUARD_TIMEOUT_SECONDS: "1800"
        run: bash quwoquan_ops/gate/gate_repo.sh --scope app
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_app:
    name: Delivery Gate — App (L1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - topology_regression
      - quwoquan_app_static
      - quwoquan_app_tests
      - quwoquan_app_serial
    if: always() && needs.topology_regression.outputs.app == 'true'
    steps:
      - id: combine
        name: Require every App phase
        env:
          TESTS_RESULT: ${{ needs.quwoquan_app_tests.result }}
          STATIC_RESULT: ${{ needs.quwoquan_app_static.result }}
          SERIAL_RESULT: ${{ needs.quwoquan_app_serial.result }}
        run: |
          set -euo pipefail
          if [ "${STATIC_RESULT}" != "success" ] || [ "${SERIAL_RESULT}" != "success" ] || [ "${TESTS_RESULT}" != "success" ]; then
            echo "::error::App L1 phases failed (static=${STATIC_RESULT}, tests=${TESTS_RESULT}, serial=${SERIAL_RESULT})"
            exit 1
          fi
          echo "App L1 static, all four test shards and serial suites succeeded."

  quwoquan_data:
    name: Delivery Gate — Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.data == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 安装 Data 依赖
        run: pip install -r quwoquan_data/requirements.txt
      - name: Gate (quwoquan_data)
        run: bash quwoquan_ops/gate/gate_repo.sh --scope data
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  ops_portal:
    name: Delivery Gate — Ops Portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.portal == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Configure Ops Portal CI paths
        run: echo "QWQ_DEPLOY_WORK_ROOT=$RUNNER_TEMP/quwoquan-deploy" >> "$GITHUB_ENV"
      - name: 设置 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: quwoquan_ops/portal/package-lock.json
      - name: Gate (ops-portal)
        run: |
          bash quwoquan_ops/gate/gate_repo.sh --scope portal
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  release_evidence:
    name: Delivery Gate — Candidate qualification evidence
    needs:
      - topology_regression
      - quwoquan_service
      - quwoquan_service_packaging
      - search_contract_smoke
      - quwoquan_app
      - quwoquan_app_static
      - quwoquan_app_tests
      - quwoquan_app_serial
      - quwoquan_data
      - ops_portal
    if: always() && inputs.produce_release_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      delivery_evidence_ref: ${{ steps.bundle_ref.outputs.ref }}
      delivery_evidence_digest: ${{ steps.bundle.outputs.digest }}
      source_git_sha: ${{ steps.identity.outputs.source_git_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - id: identity
        name: Resolve immutable evidence coordinates
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="sha1:$(git rev-parse 'HEAD^{tree}')"
          if [[ -n "${{ inputs.head_sha }}" && "$SOURCE_SHA" != "${{ inputs.head_sha }}" ]]; then
            echo "::error::GATE_BLOCK: Delivery evidence checkout differs from the requested source"
            exit 2
          fi
          echo "source_git_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_tree_digest=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
      - name: Login immutable Provider evidence registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize controlled Provider evidence by exact OCI digest
        env:
          PROVIDER_EVIDENCE_REF: ${{ inputs.provider_evidence_ref }}
          PROVIDER_EVIDENCE_DIGEST: ${{ inputs.provider_evidence_digest }}
        run: |
          if [[ ! "$PROVIDER_EVIDENCE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || \
             [[ "${PROVIDER_EVIDENCE_REF##*@}" != "$PROVIDER_EVIDENCE_DIGEST" ]]; then
            echo "::error::GATE_BLOCK: controlled Provider evidence must be an exact immutable OCI ref"
            exit 2
          fi
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "$PROVIDER_EVIDENCE_REF" \
            --expected-digest "$PROVIDER_EVIDENCE_DIGEST" \
            --output-dir "$QWQ_OUTPUT_ROOT" \
            --require-file provider-candidate.json \
            --require-file evidence/release/pilot-release-attestation.json \
            --require-file evidence/release/pilot-rollback-attestation.json \
            --require-file evidence/release/lifecycle-exit-alpha.json \
            --require-file evidence/release/lifecycle-exit-beta.json \
            --require-file evidence/release/lifecycle-exit-gamma.json \
            --require-file evidence/release/alpha-beta-gamma-green-matrix.json
      - name: Verify executed Provider evidence candidate binding
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.head_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.provider_candidate_image_digest }}
          EXPECTED_COMPONENT_REF: ${{ inputs.provider_component_evidence_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          metadata = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "provider-candidate.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = {
              "schema": "provider-release-evidence-binding",
              "sourceGitSha": os.environ["EXPECTED_SOURCE_SHA"],
              "componentEvidenceRef": os.environ["EXPECTED_COMPONENT_REF"],
              "expectedImageDigest": os.environ["EXPECTED_IMAGE_DIGEST"],
              "readinessEnvironment": "alpha,beta,gamma,prod",
          }
          if any(metadata.get(key) != value for key, value in expected.items()):
              raise SystemExit(
                  "GATE_BLOCK: executed Provider evidence is bound to another candidate"
              )
          if re.fullmatch(r"sha256:[0-9a-f]{64}", expected["expectedImageDigest"]) is None:
              raise SystemExit("GATE_BLOCK: Provider candidate image digest is not immutable")
          evidence_count = metadata.get("evidenceCount")
          if (
              isinstance(evidence_count, bool)
              or not isinstance(evidence_count, int)
              or evidence_count <= 0
          ):
              raise SystemExit(
                  "GATE_BLOCK: executed Provider evidence set must be non-empty"
              )
          PY
      - name: Produce canonical Provider conformance source or GATE_BLOCK
        env:
          PROVIDER_EVIDENCE_REF: ${{ inputs.provider_evidence_ref }}
          PROVIDER_EVIDENCE_DIGEST: ${{ inputs.provider_evidence_digest }}
          QWQ_PROVIDER_CONFORMANCE_EXPECTED_IMAGE_DIGEST: ${{ inputs.provider_candidate_image_digest }}
        run: |
          set -euo pipefail
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/runs/mainline-delivery-evidence"
          mkdir -p "$ROOT"
          python3 quwoquan_ops/ci/render_provider_conformance_source.py \
            --require-environment prod \
            --source-evidence-ref "$PROVIDER_EVIDENCE_REF" \
            --source-evidence-digest "$PROVIDER_EVIDENCE_DIGEST" \
            --archive-dir "$ROOT/provider-raw" \
            --output "$ROOT/provider-conformance-source.json"
      - name: Materialize real Remote user_acceptance evidence by exact OCI digest
        env:
          USER_ACCEPTANCE_EVIDENCE_REF: ${{ inputs.user_acceptance_evidence_ref }}
          USER_ACCEPTANCE_EVIDENCE_DIGEST: ${{ inputs.user_acceptance_evidence_digest }}
        run: |
          if [[ ! "$USER_ACCEPTANCE_EVIDENCE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || \
             [[ "${USER_ACCEPTANCE_EVIDENCE_REF##*@}" != "$USER_ACCEPTANCE_EVIDENCE_DIGEST" ]]; then
            echo "::error::GATE_BLOCK: real Remote user_acceptance evidence must be an exact immutable OCI ref"
            exit 2
          fi
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "$USER_ACCEPTANCE_EVIDENCE_REF" \
            --expected-digest "$USER_ACCEPTANCE_EVIDENCE_DIGEST" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/runs/imported-user-acceptance" \
            --require-file test-evidence.json
      - name: Aggregate exact three-layer test results
        env:
          SERVICE_IMPACTED: ${{ needs.topology_regression.outputs.service }}
          APP_IMPACTED: ${{ needs.topology_regression.outputs.app }}
          DATA_IMPACTED: ${{ needs.topology_regression.outputs.data }}
          PORTAL_IMPACTED: ${{ needs.topology_regression.outputs.portal }}
          TOPOLOGY_RESULT: ${{ needs.topology_regression.result }}
          SERVICE_RESULT: ${{ needs.quwoquan_service.result }}
          SERVICE_PACKAGING_RESULT: ${{ needs.quwoquan_service_packaging.result }}
          SEARCH_RESULT: ${{ needs.search_contract_smoke.result }}
          APP_STATIC_RESULT: ${{ needs.quwoquan_app_static.result }}
          APP_TESTS_RESULT: ${{ needs.quwoquan_app_tests.result }}
          APP_SERIAL_RESULT: ${{ needs.quwoquan_app_serial.result }}
          DATA_RESULT: ${{ needs.quwoquan_data.result }}
          PORTAL_RESULT: ${{ needs.ops_portal.result }}
          SOURCE_GIT_SHA: ${{ steps.identity.outputs.source_git_sha }}
          SOURCE_TREE_DIGEST: ${{ steps.identity.outputs.source_tree_digest }}
          USER_ACCEPTANCE_EVIDENCE_DIGEST: ${{ inputs.user_acceptance_evidence_digest }}
        run: |
          ARGS=(
            --source-git-sha "$SOURCE_GIT_SHA"
            --source-tree-digest "$SOURCE_TREE_DIGEST"
            --repository "${{ github.repository }}"
            --workflow-run-id "${{ github.run_id }}"
            --output "$QWQ_OUTPUT_ROOT/env/repo/runs/mainline-delivery-evidence/test-evidence.json"
            --job-result "topology=$TOPOLOGY_RESULT"
            --job-result "service=$SERVICE_RESULT"
            --job-result "service_packaging=$SERVICE_PACKAGING_RESULT"
            --job-result "search=$SEARCH_RESULT"
            --job-result "app_static=$APP_STATIC_RESULT"
            --job-result "app_tests=$APP_TESTS_RESULT"
            --job-result "app_serial=$APP_SERIAL_RESULT"
            --job-result "data=$DATA_RESULT"
            --job-result "portal=$PORTAL_RESULT"
            --local-required topology
            --api-required search
            --user-acceptance-source "$QWQ_OUTPUT_ROOT/env/repo/runs/imported-user-acceptance/test-evidence.json"
            --user-acceptance-transport-digest "$USER_ACCEPTANCE_EVIDENCE_DIGEST"
            --pilot-release-attestation "$QWQ_OUTPUT_ROOT/evidence/release/pilot-release-attestation.json"
            --pilot-rollback-attestation "$QWQ_OUTPUT_ROOT/evidence/release/pilot-rollback-attestation.json"
            --content-lifecycle-alpha "$QWQ_OUTPUT_ROOT/evidence/release/lifecycle-exit-alpha.json"
            --content-lifecycle-beta "$QWQ_OUTPUT_ROOT/evidence/release/lifecycle-exit-beta.json"
            --content-lifecycle-gamma "$QWQ_OUTPUT_ROOT/evidence/release/lifecycle-exit-gamma.json"
            --local-env-green-matrix "$QWQ_OUTPUT_ROOT/evidence/release/alpha-beta-gamma-green-matrix.json"
          )
          if [[ "$SERVICE_IMPACTED" == "true" ]]; then ARGS+=(--local-required service --local-required service_packaging); fi
          if [[ "$APP_IMPACTED" == "true" ]]; then
            ARGS+=(--local-required app_static --local-required app_tests --local-required app_serial)
          fi
          if [[ "$DATA_IMPACTED" == "true" ]]; then ARGS+=(--local-required data); fi
          if [[ "$PORTAL_IMPACTED" == "true" ]]; then ARGS+=(--local-required portal); fi
          python3 quwoquan_ops/ci/render_delivery_release_evidence.py "${ARGS[@]}"
      - name: Setup Buildx for immutable Delivery evidence
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: bundle
        name: Publish immutable Provider and test evidence OCI
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/mainline-delivery-evidence
          file: quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/delivery-evidence:run-${{ github.run_id }}
          sbom: true
          provenance: mode=max
      - id: bundle_ref
        name: Record exact immutable Delivery evidence ref
        run: |
          echo "ref=ghcr.io/${{ github.repository }}/delivery-evidence@${{ steps.bundle.outputs.digest }}" >> "$GITHUB_OUTPUT"

  delivery_gate_summary:
    name: 03. Delivery Gate
    needs:
      - topology_regression
      - quwoquan_service
      - quwoquan_service_packaging
      - search_contract_smoke
      - quwoquan_app
      - quwoquan_app_static
      - quwoquan_app_tests
      - quwoquan_app_serial
      - quwoquan_data
      - ops_portal
      - release_evidence
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      machine_critical_path_seconds: ${{ steps.timing.outputs.machine_critical_path_seconds }}
      summary_result: ${{ steps.summary.outputs.result }}
      candidate_digest: ${{ needs.topology_regression.outputs.candidate_digest }}
      artifact_digest: ${{ needs.topology_regression.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - name: Read authoritative Delivery Gate job timings
        id: job_timing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVICE_IMPACTED: ${{ needs.topology_regression.outputs.service }}
          APP_IMPACTED: ${{ needs.topology_regression.outputs.app }}
          DATA_IMPACTED: ${{ needs.topology_regression.outputs.data }}
          PORTAL_IMPACTED: ${{ needs.topology_regression.outputs.portal }}
          TOPOLOGY_IMPACTED: ${{ needs.topology_regression.outputs.topology }}
          PRODUCE_RELEASE_EVIDENCE: ${{ inputs.produce_release_evidence }}
        run: |
          ARGS=(
            --repository "${{ github.repository }}"
            --run-id "${{ github.run_id }}"
            --phase "topology=Delivery Gate — Topology"
            --phase "service=Delivery Gate — Service Core (L2)"
            --phase "service_packaging=Delivery Gate — Service Packaging"
            --phase "search=Delivery Gate — Search /search Contract Smoke"
            --phase "app_static=Delivery Gate — App Static"
            --phase "app_tests=Delivery Gate — App Tests Shard "
            --phase "app_serial=Delivery Gate — App Serial"
            --phase "data=Delivery Gate — Data"
            --phase "portal=Delivery Gate — Ops Portal"
            --phase "release_evidence=Delivery Gate — Candidate qualification evidence"
            --require-count "topology=1"
            --dag-layer "topology"
            --critical-start run
            --github-output "$GITHUB_OUTPUT"
          )
          FANOUT=()
          if [[ "$SERVICE_IMPACTED" == "true" ]]; then
            ARGS+=(--require-count "service=1" --require-count "service_packaging=1")
            FANOUT+=(service service_packaging)
          fi
          if [[ "$SERVICE_IMPACTED" == "true" || "$APP_IMPACTED" == "true" || "$TOPOLOGY_IMPACTED" == "true" || "$PRODUCE_RELEASE_EVIDENCE" == "true" ]]; then ARGS+=(--require-count "search=1"); FANOUT+=(search); fi
          if [[ "$APP_IMPACTED" == "true" ]]; then
            ARGS+=(--require-count "app_static=1" --require-count "app_tests=4" --require-count "app_serial=1")
            FANOUT+=(app_static app_tests app_serial)
          fi
          if [[ "$DATA_IMPACTED" == "true" ]]; then ARGS+=(--require-count "data=1"); FANOUT+=(data); fi
          if [[ "$PORTAL_IMPACTED" == "true" ]]; then ARGS+=(--require-count "portal=1"); FANOUT+=(portal); fi
          if (( ${#FANOUT[@]} > 0 )); then
            ARGS+=(--dag-layer "$(IFS=,; echo "${FANOUT[*]}")")
          fi
          if [[ "$PRODUCE_RELEASE_EVIDENCE" == "true" ]]; then
            ARGS+=(--require-count "release_evidence=1" --dag-layer "release_evidence")
          fi
          python3 quwoquan_ops/ci/github_actions_timing.py "${ARGS[@]}"
      - id: delivery_budget
        name: Read canonical Delivery Gate budget
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(
              Path("quwoquan_ops/environments/pr_gate_timing_budgets.json").read_text(
                  encoding="utf-8"
              )
          )["gates"]["03.delivery_gate"]
          print(f"soft={int(gate['budgetSeconds'])}")
          print(f"hard={int(gate['hardFailSeconds'])}")
          PY
      - name: 输出 Delivery Gate 耗时摘要
        id: timing
        env:
          TOPOLOGY_SECONDS: ${{ steps.job_timing.outputs.phase_topology }}
          SERVICE_SECONDS: ${{ steps.job_timing.outputs.phase_service }}
          SERVICE_PACKAGING_SECONDS: ${{ steps.job_timing.outputs.phase_service_packaging }}
          SEARCH_SECONDS: ${{ steps.job_timing.outputs.phase_search }}
          APP_STATIC_SECONDS: ${{ steps.job_timing.outputs.phase_app_static }}
          APP_TESTS_SECONDS: ${{ steps.job_timing.outputs.phase_app_tests }}
          APP_SERIAL_SECONDS: ${{ steps.job_timing.outputs.phase_app_serial }}
          DATA_SECONDS: ${{ steps.job_timing.outputs.phase_data }}
          PORTAL_SECONDS: ${{ steps.job_timing.outputs.phase_portal }}
          MACHINE_CRITICAL_PATH_SECONDS: ${{ steps.job_timing.outputs.machine_critical_path_seconds }}
          RUN_CREATED_AT: ${{ steps.job_timing.outputs.run_created_at }}
          CANDIDATE_READY_AT: ${{ steps.job_timing.outputs.candidate_ready_at }}
          QUEUE_SECONDS: ${{ steps.job_timing.outputs.queue_seconds }}
          UPSTREAM_MISSING_EVIDENCE: ${{ steps.job_timing.outputs.missing_evidence }}
          SETUP_SECONDS: ${{ steps.job_timing.outputs.setup_seconds }}
          EXECUTION_SECONDS: ${{ steps.job_timing.outputs.execution_seconds }}
          CALENDAR_SECONDS: ${{ steps.job_timing.outputs.calendar_lead_time_seconds }}
          SOFT_BUDGET_SECONDS: ${{ steps.delivery_budget.outputs.soft }}
          HARD_FAIL_SECONDS: ${{ steps.delivery_budget.outputs.hard }}
        run: |
          REQUIRED=(TOPOLOGY_SECONDS MACHINE_CRITICAL_PATH_SECONDS RUN_CREATED_AT CANDIDATE_READY_AT CALENDAR_SECONDS)
          for name in "${REQUIRED[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GATE_BLOCK: official Delivery Gate timing is missing ${name}"
              exit 2
            fi
          done
          PHASE_ARGS=(--phase "topology_regression=${TOPOLOGY_SECONDS}")
          if [[ -n "$SERVICE_SECONDS" ]]; then PHASE_ARGS+=(--phase "quwoquan_service=${SERVICE_SECONDS}"); fi
          if [[ -n "$SERVICE_PACKAGING_SECONDS" ]]; then PHASE_ARGS+=(--phase "quwoquan_service_packaging=${SERVICE_PACKAGING_SECONDS}"); fi
          if [[ -n "$SEARCH_SECONDS" ]]; then PHASE_ARGS+=(--phase "search_contract_smoke=${SEARCH_SECONDS}"); fi
          if [[ -n "$APP_STATIC_SECONDS" ]]; then PHASE_ARGS+=(--phase "quwoquan_app_static=${APP_STATIC_SECONDS}"); fi
          if [[ -n "$APP_TESTS_SECONDS" ]]; then PHASE_ARGS+=(--phase "quwoquan_app_tests=${APP_TESTS_SECONDS}"); fi
          if [[ -n "$APP_SERIAL_SECONDS" ]]; then PHASE_ARGS+=(--phase "quwoquan_app_serial=${APP_SERIAL_SECONDS}"); fi
          if [[ -n "$DATA_SECONDS" ]]; then PHASE_ARGS+=(--phase "quwoquan_data=${DATA_SECONDS}"); fi
          if [[ -n "$PORTAL_SECONDS" ]]; then PHASE_ARGS+=(--phase "ops_portal=${PORTAL_SECONDS}"); fi
          DURATION_ARGS=(--calendar-lead-time-seconds "$CALENDAR_SECONDS")
          EVIDENCE_ARGS=()
          NOTE_ARGS=()
          if [[ -n "$QUEUE_SECONDS" ]]; then DURATION_ARGS+=(--queue-seconds "$QUEUE_SECONDS"); fi
          if [[ -n "$UPSTREAM_MISSING_EVIDENCE" ]]; then
            EVIDENCE_ARGS+=(--missing-evidence "$UPSTREAM_MISSING_EVIDENCE")
            NOTE_ARGS+=(--note "GitHub Jobs API omitted created_at for one or more matched jobs; queue duration is absent and no zero or substitute timestamp was used.")
          fi
          if [[ -n "$SETUP_SECONDS" ]]; then DURATION_ARGS+=(--setup-seconds "$SETUP_SECONDS"); fi
          if [[ -n "$EXECUTION_SECONDS" ]]; then DURATION_ARGS+=(--execution-seconds "$EXECUTION_SECONDS"); fi
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 03.delivery_gate \
            --title "03. Delivery Gate" \
            --machine-critical-path-seconds "${MACHINE_CRITICAL_PATH_SECONDS}" \
            --critical-path-source github_run_calendar \
            --candidate-digest "${{ inputs.candidate_digest }}" \
            --workflow-run-id "${{ inputs.producer_workflow_run_id || github.run_id }}" \
            --source-git-sha "${{ inputs.source_git_sha || github.event.pull_request.head.sha || github.sha }}" \
            --run-created-at "$RUN_CREATED_AT" \
            --candidate-ready-at "$CANDIDATE_READY_AT" \
            "${DURATION_ARGS[@]}" \
            "${EVIDENCE_ARGS[@]}" \
            "${NOTE_ARGS[@]}" \
            "${PHASE_ARGS[@]}" \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/delivery-gate-summary.json" \
            --write-step-summary
          echo "machine_critical_path_seconds=${MACHINE_CRITICAL_PATH_SECONDS}" >> "$GITHUB_OUTPUT"
          if [ "${CALENDAR_SECONDS}" -gt "${HARD_FAIL_SECONDS}" ]; then
            echo "::error::Delivery Gate end-to-end time ${CALENDAR_SECONDS}s exceeds the ${HARD_FAIL_SECONDS}s hard gate"
            exit 1
          elif [ "${CALENDAR_SECONDS}" -gt "${SOFT_BUDGET_SECONDS}" ]; then
            echo "::warning::Delivery Gate end-to-end time ${CALENDAR_SECONDS}s exceeds the ${SOFT_BUDGET_SECONDS}s soft budget"
          fi
          if [[ -n "$UPSTREAM_MISSING_EVIDENCE" ]]; then
            echo "::error::GATE_BLOCK: Delivery Gate timing is historical_incomplete: ${UPSTREAM_MISSING_EVIDENCE}"
            exit 2
          fi
      - name: 汇总并阻断失败项
        id: summary
        if: always()
        env:
          TOPOLOGY: ${{ needs.topology_regression.result }}
          SERVICE: ${{ needs.quwoquan_service.result }}
          SERVICE_PACKAGING: ${{ needs.quwoquan_service_packaging.result }}
          SEARCH: ${{ needs.search_contract_smoke.result }}
          APP: ${{ needs.quwoquan_app.result }}
          APP_STATIC: ${{ needs.quwoquan_app_static.result }}
          APP_TESTS: ${{ needs.quwoquan_app_tests.result }}
          APP_SERIAL: ${{ needs.quwoquan_app_serial.result }}
          DATA: ${{ needs.quwoquan_data.result }}
          PORTAL: ${{ needs.ops_portal.result }}
          RELEASE_EVIDENCE: ${{ needs.release_evidence.result }}
          PRODUCE_RELEASE_EVIDENCE: ${{ inputs.produce_release_evidence }}
        run: |
          set -euo pipefail
          fail=0
          expect_success() {
            local name="$1" val="$2" hint="$3"
            if [ "${val}" != "success" ]; then
              echo "::error::${name} expected success, got ${val}. ${hint}"
              fail=1
            fi
          }
          expect_success_or_skipped() {
            local name="$1" val="$2" hint="$3"
            if [ "${val}" != "success" ] && [ "${val}" != "skipped" ]; then
              echo "::error::${name} expected success/skipped, got ${val}. ${hint}"
              fail=1
            fi
          }
          expect_success "topology_regression" "${TOPOLOGY}" "检查部署拓扑 / metadata 回归脚本"
          expect_success_or_skipped "quwoquan_service" "${SERVICE}" "检查 service scope gate 输出"
          expect_success_or_skipped "quwoquan_service_packaging" "${SERVICE_PACKAGING}" "检查三环境与 Prod packaging contract 输出"
          expect_success_or_skipped "search_contract_smoke" "${SEARCH}" "检查 /search 商业信封与四环境探针契约"
          expect_success_or_skipped "quwoquan_app" "${APP}" "检查 app scope 汇总"
          expect_success_or_skipped "quwoquan_app_static" "${APP_STATIC}" "检查 app static + PA core"
          expect_success_or_skipped "quwoquan_app_tests" "${APP_TESTS}" "检查 app 分片测试"
          expect_success_or_skipped "quwoquan_app_serial" "${APP_SERIAL}" "检查 app 串行套件"
          expect_success_or_skipped "quwoquan_data" "${DATA}" "检查 data scope gate 输出"
          expect_success_or_skipped "ops_portal" "${PORTAL}" "检查 portal scope gate 输出"
          if [ "${PRODUCE_RELEASE_EVIDENCE}" = "true" ]; then
            expect_success "release_evidence" "${RELEASE_EVIDENCE}" "检查 Provider 与真实 Remote user_acceptance 不可变证据"
          else
            expect_success_or_skipped "release_evidence" "${RELEASE_EVIDENCE}" "非发布调用必须跳过候选证据封装"
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Delivery Gate 未全部成功；请按上列分项修复后重跑。"
            exit 1
          fi
          echo "result=success" >> "$GITHUB_OUTPUT"
      - name: Upload delivery gate timing summary
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-gate-timing-summary
          path: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/ci-timing/delivery-gate-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
