# dev1.0 -> main 唯一 required context：PR 只验 pre-merge admission；main push 才封印合入结果。
name: 03. Delivery Gate

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: source-promotion-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

jobs:
  promotion_verify:
    name: 03. Delivery Gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      # job 级 env 不能引用 runner 上下文（解析期即失效，run 产生 0 个 job）。
      EVIDENCE_ROOT: ${{ github.workspace }}/.qwq_output/env/repo/runs/promotion-evidence
      CONTROL_ROOT: ${{ github.workspace }}/.qwq_output/env/repo/runs/release-control
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - name: Resolve exact pre-merge event inputs
        id: inputs
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_INPUTS_JSON: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          exact_oci = re.compile(r"^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$")
          sha = re.compile(r"^[0-9a-f]{40}(?:[0-9a-f]{24})?$")
          try:
              supplied = json.loads(os.environ["PR_INPUTS_JSON"])
          except json.JSONDecodeError as error:
              raise SystemExit("GATE_BLOCK: promotion PR body must be one exact JSON object") from error
          required_keys = {
              "qualification_ref", "approval_ref", "thread_ref", "ruleset_ref",
              "boundary_ref", "required_evidence_refs", "promotion_ready_at",
          }
          if not isinstance(supplied, dict) or set(supplied) != required_keys:
              raise SystemExit("GATE_BLOCK: promotion PR body keys are incomplete or unexpected")
          values = {
              "HEAD_REF": os.environ["PR_HEAD_REF"],
              "BASE_REF": os.environ["PR_BASE_REF"],
              "HEAD_SHA": os.environ["PR_HEAD_SHA"],
              "BASE_SHA": os.environ["PR_BASE_SHA"],
              "MERGE_SHA": os.environ["PR_MERGE_SHA"],
              "QUALIFICATION_REF": supplied["qualification_ref"],
              "APPROVAL_REF": supplied["approval_ref"],
              "THREAD_REF": supplied["thread_ref"],
              "RULESET_REF": supplied["ruleset_ref"],
              "BOUNDARY_REF": supplied["boundary_ref"],
              "REQUIRED_EVIDENCE_REFS": json.dumps(
                  supplied["required_evidence_refs"], separators=(",", ":")
              ),
              "PROMOTION_READY_AT": supplied["promotion_ready_at"],
          }
          if values["HEAD_REF"] != "dev1.0" or values["BASE_REF"] != "main":
              raise SystemExit("GATE_BLOCK: only dev1.0 -> main is admissible")
          if os.environ["PR_HEAD_REPOSITORY"] != os.environ["REPOSITORY"]:
              raise SystemExit("GATE_BLOCK: promotion PR must originate from this repository")
          for name in ("HEAD_SHA", "BASE_SHA", "MERGE_SHA"):
              if sha.fullmatch(values[name]) is None:
                  raise SystemExit(f"GATE_BLOCK: {name} must be an exact Git object id")
          if values["MERGE_SHA"] in {values["HEAD_SHA"], values["BASE_SHA"]}:
              raise SystemExit("GATE_BLOCK: MERGE_SHA must identify a distinct synthetic merge")
          for name in (
              "QUALIFICATION_REF", "APPROVAL_REF", "THREAD_REF", "RULESET_REF",
              "BOUNDARY_REF",
          ):
              if exact_oci.fullmatch(values[name]) is None:
                  raise SystemExit(f"GATE_BLOCK: {name} must be a real immutable OCI ref")
          required = supplied["required_evidence_refs"]
          if (
              not isinstance(required, list)
              or not required
              or any(not isinstance(item, str) or exact_oci.fullmatch(item) is None for item in required)
          ):
              raise SystemExit(
                  "GATE_BLOCK: REQUIRED_EVIDENCE_REFS must be a non-empty exact OCI ref array"
              )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              for name, value in values.items():
                  handle.write(f"{name.lower()}={value}\n")
          PY
      - name: Read back current dev, main and synthetic merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          MERGE_SHA: ${{ steps.inputs.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/dev1.0:refs/remotes/origin/dev1.0" \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pull/${PR_NUMBER}/merge"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/dev1.0)" = "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/pull/${PR_NUMBER}/merge)" = "$MERGE_SHA"
          test "$(git cat-file -t "$MERGE_SHA")" = commit
          test "$(git show -s --format=%P "$MERGE_SHA")" = "$BASE_SHA $HEAD_SHA"
          test -n "$(git show -s --format=%T "$MERGE_SHA")"
      - name: Materialize immutable promotion facts
        env:
          GHCR_TOKEN: ${{ github.token }}
          QUALIFICATION_REF: ${{ steps.inputs.outputs.qualification_ref }}
          APPROVAL_REF: ${{ steps.inputs.outputs.approval_ref }}
          THREAD_REF: ${{ steps.inputs.outputs.thread_ref }}
          RULESET_REF: ${{ steps.inputs.outputs.ruleset_ref }}
          BOUNDARY_REF: ${{ steps.inputs.outputs.boundary_ref }}
          REQUIRED_EVIDENCE_REFS: ${{ steps.inputs.outputs.required_evidence_refs }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          rm -rf "$EVIDENCE_ROOT" "$CONTROL_ROOT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          source = Path(os.environ["EVIDENCE_ROOT"])
          store = Path(os.environ["CONTROL_ROOT"])
          entries = {
              "qualification": os.environ["QUALIFICATION_REF"],
              "approval": os.environ["APPROVAL_REF"],
              "threads": os.environ["THREAD_REF"],
              "ruleset": os.environ["RULESET_REF"],
              "boundary": os.environ["BOUNDARY_REF"],
          }
          entries.update({
              f"required-{index}": ref
              for index, ref in enumerate(json.loads(os.environ["REQUIRED_EVIDENCE_REFS"]))
          })
          manifest = {}
          for name, oci_ref in entries.items():
              pulled = source / name / "fact.json"
              subprocess.run([
                  "python3", "quwoquan_ops/ci/promotion_evidence.py", "materialize-oci",
                  "--ref", oci_ref, "--output-file", str(pulled),
              ], check=True)
              local = store / name / "fact.json"
              local.parent.mkdir(parents=True, exist_ok=True)
              local.write_bytes(pulled.read_bytes())
              manifest[name] = {
                  "ref": local.relative_to(store).as_posix(),
                  "digest": "sha256:" + hashlib.sha256(local.read_bytes()).hexdigest(),
                  "ociRef": oci_ref,
              }
          store.mkdir(parents=True, exist_ok=True)
          (store / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Bind exact local refs for admission verification
        env:
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
        run: |
          set -euo pipefail
          git branch --force dev1.0 "$HEAD_SHA"
          git branch --force main "$BASE_SHA"
      - name: Verify IntegrationQualificationFact signature and lifetime
        env:
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
          PROMOTION_READY_AT: ${{ steps.inputs.outputs.promotion_ready_at }}
          QWQ_INTEGRATION_QUALIFICATION_SIGNING_KEY: ${{ secrets.QWQ_INTEGRATION_QUALIFICATION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          HEAD_TREE="$(git show -s --format=%T "$HEAD_SHA")"
          QUALIFICATION_LOCAL_REF="$(python3 -c 'import json,os; from pathlib import Path; print(json.loads(Path(os.environ["CONTROL_ROOT"]).joinpath("manifest.json").read_text())["qualification"]["ref"])')"
          QUALIFICATION_LOCAL_DIGEST="$(python3 -c 'import json,os; from pathlib import Path; print(json.loads(Path(os.environ["CONTROL_ROOT"]).joinpath("manifest.json").read_text())["qualification"]["digest"])')"
          python3 quwoquan_ops/ci/integration_qualification.py \
            --repository "$GITHUB_WORKSPACE" --store-root "$CONTROL_ROOT" \
            --qualification-ref "$QUALIFICATION_LOCAL_REF" \
            --qualification-digest "$QUALIFICATION_LOCAL_DIGEST" \
            --expected-dev-head "$HEAD_SHA" --expected-dev-tree "$HEAD_TREE" \
            --verified-at "$PROMOTION_READY_AT"
      - name: Verify branch, secret, PII and generated boundaries
        id: impact
        env:
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 quwoquan_ops/gate/verify_git_branch_policy.py
          ROOT="$RUNNER_TEMP/promotion-impact"
          mkdir -p "$ROOT"
          TREE_DIGEST="sha1:$(git rev-parse "${HEAD_SHA}^{tree}")"
          # detect 会整体覆盖 --github-output 文件，所以先写 IMPACT_OUTPUT 再回读 digest。
          IMPACT_OUTPUT="$ROOT/impact-outputs"
          python3 quwoquan_ops/ci/detect_ci_impacted_scopes.py \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --source-tree-digest "$TREE_DIGEST" \
            --execution-profile promotion \
            --impact-plan "$ROOT/impact-plan.json" --github-output "$IMPACT_OUTPUT"
          PLAN_DIGEST="$(awk -F= '$1 == "plan_digest" {print $2}' "$IMPACT_OUTPUT" | tail -n 1)"
          python3 quwoquan_ops/ci/detect_ci_impacted_scopes.py \
            --validate-impact-plan "$ROOT/impact-plan.json" \
            --expected-source-sha "$HEAD_SHA" \
            --expected-tree-digest "$TREE_DIGEST" \
            --expected-plan-digest "$PLAN_DIGEST"
          python3 quwoquan_ops/ci/verify_ci_changed_boundary.py \
            --impact-plan "$ROOT/impact-plan.json" \
            --expected-source-sha "$HEAD_SHA" \
            --expected-tree-digest "$TREE_DIGEST" \
            --expected-plan-digest "$PLAN_DIGEST"
          cat "$IMPACT_OUTPUT" >> "$GITHUB_OUTPUT"
      - name: Validate exact facts and issue PromotionAdmissionReceipt
        id: admission
        env:
          GHCR_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          MERGE_SHA: ${{ steps.inputs.outputs.merge_sha }}
          PROMOTION_READY_AT: ${{ steps.inputs.outputs.promotion_ready_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["CONTROL_ROOT"])
          refs = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          args = [
              "python3", "quwoquan_ops/ci/release_control.py",
              "--store-root", str(root), "promotion-admit",
              "--qualification", f"{refs['qualification']['ref']}={refs['qualification']['digest']}",
              "--approval", f"{refs['approval']['ref']}={refs['approval']['digest']}",
              "--threads", f"{refs['threads']['ref']}={refs['threads']['digest']}",
              "--ruleset", f"{refs['ruleset']['ref']}={refs['ruleset']['digest']}",
              "--boundary", f"{refs['boundary']['ref']}={refs['boundary']['digest']}",
              "--head-sha", os.environ["HEAD_SHA"], "--base-sha", os.environ["BASE_SHA"],
              "--synthetic-merge-sha", os.environ["MERGE_SHA"],
              "--promotion-ready-at", os.environ["PROMOTION_READY_AT"],
          ]
          for name in sorted(key for key in refs if key.startswith("required-")):
              exact = refs[name]
              args.extend(["--required-evidence", f"{exact['ref']}={exact['digest']}"])
          result = json.loads(
              subprocess.run(args, check=True, text=True, capture_output=True).stdout
          )
          path = root / result["ref"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"path={path.as_posix()}\n")
              output.write(f"digest={result['digest']}\n")
          PY
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "${{ steps.admission.outputs.path }}" \
            --repository "ghcr.io/${{ github.repository }}/promotion-admission" \
            --transport-tag "base-${BASE_SHA}-head-${HEAD_SHA}" > "$RUNNER_TEMP/promotion-admission-oci.json"
          ADMISSION_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/promotion-admission-oci.json")"
          echo "admission_ref=$ADMISSION_REF" >> "$GITHUB_OUTPUT"
          echo "PromotionAdmissionReceipt exact OCI: $ADMISSION_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Create exact promotion handoff payload
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          MERGE_SHA: ${{ steps.inputs.outputs.merge_sha }}
          ADMISSION_REF: ${{ steps.admission.outputs.admission_ref }}
        run: |
          set -euo pipefail
          MERGE_TREE="$(git show -s --format=%T "$MERGE_SHA")"
          CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ACTOR_ID="$(gh api "/users/${GITHUB_ACTOR}" --jq .id)"
          python3 quwoquan_ops/ci/promotion_evidence.py create-handoff \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "${{ github.event.pull_request.number }}" \
            --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA" \
            --synthetic-merge-sha "$MERGE_SHA" --synthetic-merge-tree "$MERGE_TREE" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-repository "$GITHUB_WORKFLOW_REPOSITORY" --workflow-head-sha "$HEAD_SHA" \
            --workflow-actor-login "$GITHUB_ACTOR" --workflow-actor-id "$ACTOR_ID" \
            --promotion-admission-ref "$ADMISSION_REF" \
            --admission-bytes-digest "${{ steps.admission.outputs.digest }}" \
            --created-at "$CREATED_AT" \
            --output-file "$RUNNER_TEMP/promotion-admission-handoff.json"
          {
            echo "created_at=$CREATED_AT"
            echo "record_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["recordId"])' < "$RUNNER_TEMP/promotion-admission-handoff.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Mint trusted promotion recorder token
        id: recorder
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.QWQ_PROMOTION_RECORDER_CLIENT_ID }}
          private-key: ${{ secrets.QWQ_PROMOTION_RECORDER_PRIVATE_KEY }}
          permission-checks: write
      - name: Persist create-once hosted promotion handoff
        env:
          GH_TOKEN: ${{ steps.recorder.outputs.token }}
          RECORDER_APP_SLUG: ${{ steps.recorder.outputs.app-slug }}
          RECORDER_INSTALLATION_ID: ${{ steps.recorder.outputs.installation-id }}
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
          HANDOFF_CREATED_AT: ${{ steps.handoff.outputs.created_at }}
          HANDOFF_RECORD_ID: ${{ steps.handoff.outputs.record_id }}
        run: |
          set -euo pipefail
          test -n "$RECORDER_APP_SLUG" && test -n "$RECORDER_INSTALLATION_ID" || {
            echo 'GATE_BLOCK: trusted promotion recorder App identity is unavailable' >&2
            exit 1
          }
          CHECKS_API="/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs"
          gh api --method GET --paginate --slurp "$CHECKS_API" \
            -f check_name='quwoquan/promotion-admission-handoff/v1' \
            -f filter=all -f per_page=100 --jq '[.[].check_runs[]]' \
            > "$RUNNER_TEMP/promotion-handoff-existing-checks.json"
          EXISTING="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' < "$RUNNER_TEMP/promotion-handoff-existing-checks.json")"
          test "$EXISTING" = 0 || {
            echo 'GATE_BLOCK: promotion handoff context already exists for this head' >&2
            exit 1
          }
          HANDOFF_SUMMARY="$(base64 < "$RUNNER_TEMP/promotion-admission-handoff.json" | tr -d '\n')"
          RESPONSE="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='quwoquan/promotion-admission-handoff/v1' \
            -f head_sha="$HEAD_SHA" -f status=completed -f conclusion=success \
            -f external_id="$HANDOFF_RECORD_ID" \
            -f started_at="$HANDOFF_CREATED_AT" -f completed_at="$HANDOFF_CREATED_AT" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            -f 'output[title]=quwoquan_ops.promotion_admission_handoff.v1' \
            -f "output[summary]=$HANDOFF_SUMMARY")"
          printf '%s\n' "$RESPONSE" > "$RUNNER_TEMP/promotion-handoff-check-created.json"
          gh api --method GET --paginate --slurp "$CHECKS_API" \
            -f check_name='quwoquan/promotion-admission-handoff/v1' \
            -f filter=all -f per_page=100 --jq '[.[].check_runs[]]' \
            > "$RUNNER_TEMP/promotion-handoff-created-checks.json"
          COUNT="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' < "$RUNNER_TEMP/promotion-handoff-created-checks.json")"
          test "$COUNT" = 1 || {
            echo 'GATE_BLOCK: promotion handoff is not unique after create' >&2
            exit 1
          }
          CHECK_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' < "$RUNNER_TEMP/promotion-handoff-check-created.json")"
          gh api "/repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_ID}" \
            > "$RUNNER_TEMP/promotion-handoff-check-readback.json"
          python3 - "$RUNNER_TEMP/promotion-handoff-check-created.json" "$RUNNER_TEMP/promotion-handoff-check-readback.json" <<'PY'
          import json
          import sys
          created = json.load(open(sys.argv[1], encoding="utf-8"))
          readback = json.load(open(sys.argv[2], encoding="utf-8"))
          fields = ("id", "node_id", "name", "head_sha", "status", "conclusion", "external_id", "started_at", "completed_at", "details_url", "output")
          if any(created.get(field) != readback.get(field) for field in fields):
              raise SystemExit("GATE_BLOCK: hosted promotion handoff readback changed after create")
          PY
      - name: Record hosted promotion readiness boundary
        run: |
          {
            echo '### Source promotion pre-merge qualification'
            echo '- scope: exact dev1.0 identity and immutable promotion admission only'
            echo '- post-merge MainSourceSeal: not issued on pull_request'
            echo "- exact dev head: \`${{ steps.inputs.outputs.head_sha }}\`"
            echo "- PromotionAdmissionReceipt digest: \`${{ steps.admission.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  main_source_seal:
    name: Post-merge Main Source Seal
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      source_sha: ${{ steps.readback.outputs.source_sha }}
      main_source_seal_ref: ${{ steps.seal.outputs.main_source_seal_ref }}
      main_source_seal_digest: ${{ steps.seal.outputs.main_source_seal_digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      checks: read
      pull-requests: read
    env:
      CONTROL_ROOT: ${{ github.workspace }}/.qwq_output/env/repo/runs/release-control
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.after }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - name: Read back hosted main and exact admitted merge
        id: readback
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PUSH_REF: ${{ github.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          TRUSTED_RECORDER_APP_SLUG: ${{ vars.QWQ_PROMOTION_RECORDER_APP_SLUG }}
          TRUSTED_RECORDER_APP_ID: ${{ vars.QWQ_PROMOTION_RECORDER_APP_ID }}
        run: |
          set -euo pipefail
          SHA_PATTERN='^[0-9a-f]{40}$'
          [[ "$PUSH_BEFORE_SHA" =~ $SHA_PATTERN ]] || {
            echo 'GATE_BLOCK: main push before SHA must be exact' >&2
            exit 1
          }
          [[ "$PUSH_AFTER_SHA" =~ $SHA_PATTERN ]] || {
            echo 'GATE_BLOCK: main push after SHA must be exact' >&2
            exit 1
          }
          test "$PUSH_REF" = refs/heads/main
          MAIN_SHA="$PUSH_AFTER_SHA"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/dev1.0:refs/remotes/origin/dev1.0"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_SHA" || {
            echo 'GATE_BLOCK: hosted main readback drifted from push after SHA' >&2
            exit 1
          }
          test "$(git rev-list --count "$PUSH_BEFORE_SHA..$MAIN_SHA")" = 1 || {
            echo 'GATE_BLOCK: main push must contain exactly one admitted merge commit' >&2
            exit 1
          }
          read -r FIRST_PARENT SOURCE_SHA EXTRA_PARENT <<< "$(git show -s --format=%P "$MAIN_SHA")"
          test -n "$FIRST_PARENT" && test -n "$SOURCE_SHA" && test -z "${EXTRA_PARENT:-}" || {
            echo 'GATE_BLOCK: main update must be one two-parent merge' >&2
            exit 1
          }
          test "$FIRST_PARENT" = "$PUSH_BEFORE_SHA" || {
            echo 'GATE_BLOCK: main merge first parent must equal push before SHA' >&2
            exit 1
          }
          MAIN_TREE="$(git show -s --format=%T "$MAIN_SHA")"
          MAIN_READBACK_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          test -n "$TRUSTED_RECORDER_APP_SLUG" \
            && [[ "$TRUSTED_RECORDER_APP_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'GATE_BLOCK: trusted promotion recorder App identity is not configured' >&2
            exit 1
          }
          PRS="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${MAIN_SHA}/pulls")"
          PR_NUMBER="$(printf '%s' "$PRS" | python3 -c 'import json,sys; rows=json.load(sys.stdin); rows=[r for r in rows if r.get("merged_at") and r.get("base",{}).get("ref")=="main" and r.get("head",{}).get("ref")=="dev1.0"]; print(rows[0]["number"] if len(rows)==1 else "")')"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'GATE_BLOCK: merged main commit must map to exactly one dev1.0 promotion PR' >&2
            exit 1
          }
          gh api --method GET --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs" \
            -f check_name='quwoquan/promotion-admission-handoff/v1' \
            -f filter=all -f per_page=100 --jq '[.[].check_runs[]]' \
            > "$RUNNER_TEMP/promotion-handoff-check-list.json"
          HANDOFF_COUNT="$(python3 - "$RUNNER_TEMP/promotion-handoff-check-list.json" <<'PY'
          import json
          import sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))
          print(sum(row.get("name") == "quwoquan/promotion-admission-handoff/v1" for row in rows))
          PY
          )"
          test "$HANDOFF_COUNT" = 1 || {
            echo 'GATE_BLOCK: exact promotion handoff must exist exactly once' >&2
            exit 1
          }
          python3 - "$RUNNER_TEMP/promotion-handoff-check-list.json" > "$RUNNER_TEMP/promotion-handoff-check.json" <<'PY'
          import json
          import sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [row for row in rows if row.get("name") == "quwoquan/promotion-admission-handoff/v1"]
          if len(matches) != 1:
              raise SystemExit("GATE_BLOCK: exact promotion handoff is missing or duplicated")
          json.dump(matches[0], sys.stdout, sort_keys=True, separators=(",", ":"))
          sys.stdout.write("\n")
          PY
          HANDOFF_RUN_ID="$(python3 - "$RUNNER_TEMP/promotion-handoff-check.json" <<'PY'
          import base64
          import json
          import sys
          check = json.load(open(sys.argv[1], encoding="utf-8"))
          record = json.loads(base64.b64decode(check["output"]["summary"], validate=True))
          print(record["workflowRunId"])
          PY
          )"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${HANDOFF_RUN_ID}" \
            > "$RUNNER_TEMP/promotion-handoff-workflow-run.json"
          python3 quwoquan_ops/ci/promotion_evidence.py validate-hosted-handoff \
            --check-run-file "$RUNNER_TEMP/promotion-handoff-check.json" \
            --workflow-run-file "$RUNNER_TEMP/promotion-handoff-workflow-run.json" \
            --repository "$GITHUB_REPOSITORY" --pull-request-number "$PR_NUMBER" \
            --head-sha "$SOURCE_SHA" --base-sha "$PUSH_BEFORE_SHA" \
            --synthetic-merge-tree "$MAIN_TREE" \
            --expected-context 'quwoquan/promotion-admission-handoff/v1' \
            --expected-app-slug "$TRUSTED_RECORDER_APP_SLUG" \
            --expected-app-id "$TRUSTED_RECORDER_APP_ID" \
            --expected-workflow-repository "$GITHUB_REPOSITORY" \
            --verified-at "$MAIN_READBACK_AT" \
            --output-file "$RUNNER_TEMP/promotion-handoff-verified.json" \
            > "$RUNNER_TEMP/promotion-handoff-validation-result.json"
          PROMOTION_ADMISSION_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/promotion-handoff-validation-result.json")"
          EXPECTED_ADMISSION_BYTES_DIGEST="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["admissionBytesDigest"])' < "$RUNNER_TEMP/promotion-handoff-validation-result.json")"
          rm -rf "$CONTROL_ROOT"
          mkdir -p "$CONTROL_ROOT/promotion-admission"
          python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
            --ref "$PROMOTION_ADMISSION_REF" \
            --output-file "$CONTROL_ROOT/promotion-admission/fact.json"
          ADMISSION_BYTES_DIGEST="$(shasum -a 256 "$CONTROL_ROOT/promotion-admission/fact.json" | awk '{print "sha256:" $1}')"
          test "$ADMISSION_BYTES_DIGEST" = "$EXPECTED_ADMISSION_BYTES_DIGEST" || {
            echo 'GATE_BLOCK: exact PromotionAdmissionReceipt bytes differ from hosted handoff' >&2
            exit 1
          }
          mkdir -p "$CONTROL_ROOT/promotion-handoff"
          install -m 600 "$RUNNER_TEMP/promotion-handoff-verified.json" "$CONTROL_ROOT/promotion-handoff/record.json"
          HANDOFF_DIGEST="$(shasum -a 256 "$CONTROL_ROOT/promotion-handoff/record.json" | awk '{print "sha256:" $1}')"
          PROMOTION_READY_AT="$(python3 - "$CONTROL_ROOT/promotion-admission/fact.json" "$SOURCE_SHA" "$PUSH_BEFORE_SHA" "$MAIN_TREE" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          fact = json.loads(path.read_bytes())
          identity = dict(fact)
          admission_id = identity.pop("admissionId", None)
          calculated = "sha256:" + hashlib.sha256(
              json.dumps(
                  identity, ensure_ascii=False, sort_keys=True,
                  separators=(",", ":"), allow_nan=False,
              ).encode()
          ).hexdigest()
          if (
              fact.get("schema") != "quwoquan_ops.promotion_admission_receipt.v1"
              or fact.get("decision") != "admitted"
              or fact.get("headRef") != "refs/heads/dev1.0"
              or fact.get("baseRef") != "refs/heads/main"
              or fact.get("headSha") != sys.argv[2]
              or fact.get("baseSha") != sys.argv[3]
              or fact.get("syntheticMergeTree") != sys.argv[4]
              or admission_id != calculated
          ):
              raise SystemExit("GATE_BLOCK: PromotionAdmissionReceipt does not bind merged main")
          ready = fact.get("promotionReadyAt")
          if not isinstance(ready, str) or not ready:
              raise SystemExit("GATE_BLOCK: PromotionAdmissionReceipt lacks promotionReadyAt")
          print(ready)
          PY
          )"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/dev1.0 || {
            echo 'GATE_BLOCK: merge second parent is not dev1.0-reachable' >&2
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main || {
            echo 'GATE_BLOCK: merged source is not reachable from hosted main' >&2
            exit 1
          }
          git branch --force main "$MAIN_SHA"
          {
            echo "main_sha=$MAIN_SHA"
            echo "base_sha=$PUSH_BEFORE_SHA"
            echo "source_sha=$SOURCE_SHA"
            echo "main_readback_at=$MAIN_READBACK_AT"
            echo "promotion_ready_at=$PROMOTION_READY_AT"
            echo "promotion_admission_ref=$PROMOTION_ADMISSION_REF"
            echo "promotion_admission_local_ref=promotion-admission/fact.json"
            echo "promotion_admission_local_digest=$ADMISSION_BYTES_DIGEST"
            echo "promotion_handoff_local_ref=promotion-handoff/record.json"
            echo "promotion_handoff_local_digest=$HANDOFF_DIGEST"
          } >> "$GITHUB_OUTPUT"
      - name: Issue, publish and read back MainSourceSeal
        id: seal
        env:
          GHCR_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.readback.outputs.main_sha }}
          MAIN_READBACK_AT: ${{ steps.readback.outputs.main_readback_at }}
          PROMOTION_ADMISSION_REF: ${{ steps.readback.outputs.promotion_admission_ref }}
          PROMOTION_ADMISSION_LOCAL_REF: ${{ steps.readback.outputs.promotion_admission_local_ref }}
          PROMOTION_ADMISSION_LOCAL_DIGEST: ${{ steps.readback.outputs.promotion_admission_local_digest }}
          PROMOTION_HANDOFF_LOCAL_REF: ${{ steps.readback.outputs.promotion_handoff_local_ref }}
        run: |
          set -euo pipefail
          HANDOFF_DIGEST="$(shasum -a 256 "$CONTROL_ROOT/$PROMOTION_HANDOFF_LOCAL_REF" | awk '{print "sha256:" $1}')"
          python3 quwoquan_ops/ci/promotion_evidence.py main-seal \
            --repository "$GITHUB_WORKSPACE" --evidence-root "$CONTROL_ROOT" \
            --admission "${PROMOTION_ADMISSION_LOCAL_REF}=${PROMOTION_ADMISSION_LOCAL_DIGEST}" \
            --admission-oci-ref "$PROMOTION_ADMISSION_REF" \
            --hosted-handoff "${PROMOTION_HANDOFF_LOCAL_REF}=${HANDOFF_DIGEST}" \
            --main-sha "$MAIN_SHA" --main-readback-at "$MAIN_READBACK_AT" \
            > "$RUNNER_TEMP/main-source-seal.json"
          SEAL_PATH="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' < "$RUNNER_TEMP/main-source-seal.json")"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "$CONTROL_ROOT/$SEAL_PATH" \
            --repository "ghcr.io/${{ github.repository }}/main-source-seal" \
            --transport-tag "main-${MAIN_SHA}" > "$RUNNER_TEMP/main-source-seal-oci.json"
          MAIN_SOURCE_SEAL_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/main-source-seal-oci.json")"
          python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
            --ref "$MAIN_SOURCE_SEAL_REF" \
            --output-file "$RUNNER_TEMP/main-source-seal-readback.json"
          cmp "$CONTROL_ROOT/$SEAL_PATH" "$RUNNER_TEMP/main-source-seal-readback.json"
          MAIN_SOURCE_SEAL_DIGEST="${MAIN_SOURCE_SEAL_REF##*@}"
          {
            echo "main_source_seal_ref=$MAIN_SOURCE_SEAL_REF"
            echo "main_source_seal_digest=$MAIN_SOURCE_SEAL_DIGEST"
            echo "main_source_seal_path=$CONTROL_ROOT/$SEAL_PATH"
          } >> "$GITHUB_OUTPUT"
      - name: Submit timing sample after hosted readback
        env:
          GHCR_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.readback.outputs.source_sha }}
          BASE_SHA: ${{ steps.readback.outputs.base_sha }}
          PROMOTION_READY_AT: ${{ steps.readback.outputs.promotion_ready_at }}
          MAIN_READBACK_AT: ${{ steps.readback.outputs.main_readback_at }}
          MAIN_SOURCE_SEAL_REF: ${{ steps.seal.outputs.main_source_seal_ref }}
          PROD_SERVICE_SSH_KEY: ${{ secrets.PROD_SERVICE_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          POLICY_DIGEST="$(python3 quwoquan_ops/ci/promotion_timing_ratchet.py policy-digest \
            --policy quwoquan_ops/policies/promotion_timing_ratchet.yaml \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["policyDigest"])')"
          WORKFLOW_DIGEST="sha256:$(shasum -a 256 .github/workflows/delivery-gate.yml | awk '{print $1}')"
          python3 quwoquan_ops/ci/promotion_timing_ratchet.py sample \
            --observation-id "delivery-${{ github.run_id }}-${{ github.run_attempt }}" \
            --event-id "promotion-${{ steps.readback.outputs.main_sha }}" \
            --repository "${{ github.repository }}" \
            --workflow-run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" \
            --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA" \
            --first-attempt-at "$PROMOTION_READY_AT" \
            --promotion-ready-at "$PROMOTION_READY_AT" --observed-at "$MAIN_READBACK_AT" \
            --main-readback-at "$MAIN_READBACK_AT" --classification success \
            --evidence-complete true --policy-digest "$POLICY_DIGEST" \
            --workflow-digest "$WORKFLOW_DIGEST" \
            --write-json "$RUNNER_TEMP/promotion-timing-sample.json"
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "$RUNNER_TEMP/promotion-timing-sample.json" \
            --repository "ghcr.io/${{ github.repository }}/promotion-timing-sample" \
            --transport-tag "run-${{ github.run_id }}-${{ github.run_attempt }}" \
            > "$RUNNER_TEMP/promotion-timing-oci.json"
          TIMING_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/promotion-timing-oci.json")"
          TIMING_DIGEST="${TIMING_REF##*@}"
          python3 quwoquan_ops/ci/sync_hosted_ci_timing_ledger.py append-sample \
            --sample "$RUNNER_TEMP/promotion-timing-sample.json" \
            --evidence-ref "$TIMING_REF" --evidence-digest "$TIMING_DIGEST" \
            --output "$RUNNER_TEMP/promotion-timing-readback.json"
          {
            echo '### Post-merge source admission'
            echo "- exact PromotionAdmissionReceipt: \`${{ steps.readback.outputs.promotion_admission_ref }}\`"
            echo "- exact MainSourceSeal: \`$MAIN_SOURCE_SEAL_REF\`"
            echo '- MainSourceSeal OCI bytes: published and read back before timing submission'
            echo '- source status: source-admitted; release status: not_selected'
          } >> "$GITHUB_STEP_SUMMARY"

  system_backsync:
    name: Managed system backsync
    needs: main_source_seal
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
    uses: ./.github/workflows/system-backsync.yml
    with:
      expected_dev_before: ${{ needs.main_source_seal.outputs.source_sha }}
      source_sha: ${{ needs.main_source_seal.outputs.source_sha }}
      main_source_seal_ref: ${{ needs.main_source_seal.outputs.main_source_seal_ref }}
      main_source_seal_digest: ${{ needs.main_source_seal.outputs.main_source_seal_digest }}
