# Delivery Gate — PR 合入主门禁（L1+L2）
# 触发：pull_request(main) + workflow_dispatch
# 职责：拓扑校验 + metadata + L1(Flutter) + L2(Go contract) + portal
# 执行语义见 .cursor/commands/deliver.md；本 workflow 是 CI 行为真相源。
name: 03. Delivery Gate

permissions:
  contents: read

env:
  QWQ_OUTPUT_ROOT: .qwq_output

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Caller commit SHA/ref for checkout
        required: false
        type: string
        default: ''
      base_sha:
        description: Explicit diff base SHA
        required: false
        type: string
        default: ''
      head_sha:
        description: Explicit diff head SHA
        required: false
        type: string
        default: ''
    outputs:
      critical_path_seconds:
        description: Delivery Gate critical path seconds
        value: ${{ jobs.delivery_gate_summary.outputs.critical_path_seconds }}
      summary_result:
        description: Delivery Gate summary result
        value: ${{ jobs.delivery_gate_summary.outputs.summary_result }}

jobs:
  topology_regression:
    name: Delivery Gate — Topology
    runs-on: ubuntu-latest
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      service: ${{ steps.detect.outputs.service }}
      app: ${{ steps.detect.outputs.app }}
      portal: ${{ steps.detect.outputs.portal }}
      topology: ${{ steps.detect.outputs.topology }}
      data: ${{ steps.detect.outputs.data }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: detect
        name: Detect impacted scopes
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
        run: |
          python3 quwoquan_ops/ci/detect_ci_impacted_scopes.py \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Environment Topology Regression
        if: ${{ steps.detect.outputs.topology == 'true' }}
        run: |
          make verify-service-architecture
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_service:
    name: Delivery Gate — Service (L2)
    runs-on: ubuntu-latest
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.service == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: quwoquan_service/go.mod
      - name: 设置 Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
      - name: 安装 kustomize
        run: bash quwoquan_ops/cli/shared/install_kustomize.sh
      - name: 安装 Python 依赖 (recommendation-service)
        run: |
          pip install -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/requirements.txt
      - name: Gate (quwoquan_service)
        run: |
          bash quwoquan_ops/gate/gate_repo.sh --scope service
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  search_contract_smoke:
    name: Delivery Gate — Search /search Contract Smoke
    runs-on: ubuntu-latest
    needs: topology_regression
    if: >-
      ${{
        needs.topology_regression.outputs.service == 'true' ||
        needs.topology_regression.outputs.app == 'true' ||
        needs.topology_regression.outputs.topology == 'true'
      }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: quwoquan_service/go.mod
      - name: Verify canonical /search response contract
        working-directory: quwoquan_service
        run: go test ./services/search-service/tests/api_integration/search/search_query -count=1
      - name: Verify four-environment search probe contract
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            quwoquan_ops.tests.acceptance.user_acceptance.test_stackctl_up_runtime__user_acceptance_test.StackctlUpRuntimeTest.test_environment_probe_uses_ready_entity_operation_not_blocked_chat \
            quwoquan_ops.tests.acceptance.user_acceptance.test_stackctl_up_runtime__user_acceptance_test.StackctlUpRuntimeTest.test_environment_probe_requires_search_commercial_envelope
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_app:
    name: Delivery Gate — App (L1)
    runs-on: ubuntu-latest
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.app == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Resolve Flutter SDK
        id: flutter
        run: python3 quwoquan_ops/ci/setup_flutter_sdk.py resolve
      - name: Cache Flutter SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ steps.flutter.outputs.cache_path }}
            ~/.pub-cache
          key: "flutter-${{ runner.os }}-${{ runner.arch }}-${{ steps.flutter.outputs.sha256 }}-${{ hashFiles('quwoquan_app/pubspec.lock') }}"
          restore-keys: |
            flutter-${{ runner.os }}-${{ runner.arch }}-${{ steps.flutter.outputs.sha256 }}-
      - name: Install verified Flutter SDK
        env:
          FLUTTER_ARCHIVE_URL: ${{ steps.flutter.outputs.archive_url }}
          FLUTTER_CACHE_PATH: ${{ steps.flutter.outputs.cache_path }}
          FLUTTER_SHA256: ${{ steps.flutter.outputs.sha256 }}
        run: |
          python3 quwoquan_ops/ci/setup_flutter_sdk.py install \
            --archive-url "${FLUTTER_ARCHIVE_URL}" \
            --cache-path "${FLUTTER_CACHE_PATH}" \
            --sha256 "${FLUTTER_SHA256}"
      - name: Gate (quwoquan_app)
        run: |
          bash quwoquan_ops/gate/gate_repo.sh --scope app
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  quwoquan_data:
    name: Delivery Gate — Data
    runs-on: ubuntu-latest
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.data == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 安装 Data 依赖
        run: pip install -r quwoquan_data/requirements.txt
      - name: Gate (quwoquan_data)
        run: bash quwoquan_ops/gate/gate_repo.sh --scope data
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  ops_portal:
    name: Delivery Gate — Ops Portal
    runs-on: ubuntu-latest
    needs: topology_regression
    if: ${{ needs.topology_regression.outputs.portal == 'true' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: quwoquan_ops/portal/package-lock.json
      - name: Gate (ops-portal)
        run: |
          bash quwoquan_ops/gate/gate_repo.sh --scope portal
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  delivery_gate_summary:
    name: 03. Delivery Gate
    needs:
      - topology_regression
      - quwoquan_service
      - search_contract_smoke
      - quwoquan_app
      - quwoquan_data
      - ops_portal
    if: always()
    runs-on: ubuntu-latest
    outputs:
      critical_path_seconds: ${{ steps.timing.outputs.critical_path_seconds }}
      summary_result: ${{ steps.summary.outputs.result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: 输出 Delivery Gate 耗时摘要
        id: timing
        env:
          TOPOLOGY_SECONDS: ${{ needs.topology_regression.outputs.duration_seconds }}
          SERVICE_SECONDS: ${{ needs.quwoquan_service.outputs.duration_seconds }}
          SEARCH_SECONDS: ${{ needs.search_contract_smoke.outputs.duration_seconds }}
          APP_SECONDS: ${{ needs.quwoquan_app.outputs.duration_seconds }}
          DATA_SECONDS: ${{ needs.quwoquan_data.outputs.duration_seconds }}
          PORTAL_SECONDS: ${{ needs.ops_portal.outputs.duration_seconds }}
        run: |
          TOPOLOGY_SECONDS="${TOPOLOGY_SECONDS:-0}"
          SERVICE_SECONDS="${SERVICE_SECONDS:-0}"
          SEARCH_SECONDS="${SEARCH_SECONDS:-0}"
          APP_SECONDS="${APP_SECONDS:-0}"
          DATA_SECONDS="${DATA_SECONDS:-0}"
          PORTAL_SECONDS="${PORTAL_SECONDS:-0}"
          FANOUT_SECONDS="${SERVICE_SECONDS}"
          if [ "${SEARCH_SECONDS}" -gt "${FANOUT_SECONDS}" ]; then FANOUT_SECONDS="${SEARCH_SECONDS}"; fi
          if [ "${APP_SECONDS}" -gt "${FANOUT_SECONDS}" ]; then FANOUT_SECONDS="${APP_SECONDS}"; fi
          if [ "${DATA_SECONDS}" -gt "${FANOUT_SECONDS}" ]; then FANOUT_SECONDS="${DATA_SECONDS}"; fi
          if [ "${PORTAL_SECONDS}" -gt "${FANOUT_SECONDS}" ]; then FANOUT_SECONDS="${PORTAL_SECONDS}"; fi
          CRITICAL_PATH_SECONDS=$(( TOPOLOGY_SECONDS + FANOUT_SECONDS ))
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 03.delivery_gate \
            --title "03. Delivery Gate" \
            --critical-path-seconds "${CRITICAL_PATH_SECONDS}" \
            --phase "topology_regression=${TOPOLOGY_SECONDS}" \
            --phase "quwoquan_service=${SERVICE_SECONDS}" \
            --phase "search_contract_smoke=${SEARCH_SECONDS}" \
            --phase "quwoquan_app=${APP_SECONDS}" \
            --phase "quwoquan_data=${DATA_SECONDS}" \
            --phase "ops_portal=${PORTAL_SECONDS}" \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/delivery-gate-summary.json" \
            --write-step-summary
          echo "critical_path_seconds=${CRITICAL_PATH_SECONDS}" >> "$GITHUB_OUTPUT"
      - name: 汇总并阻断失败项
        id: summary
        env:
          TOPOLOGY: ${{ needs.topology_regression.result }}
          SERVICE: ${{ needs.quwoquan_service.result }}
          SEARCH: ${{ needs.search_contract_smoke.result }}
          APP: ${{ needs.quwoquan_app.result }}
          DATA: ${{ needs.quwoquan_data.result }}
          PORTAL: ${{ needs.ops_portal.result }}
        run: |
          set -euo pipefail
          fail=0
          expect_success() {
            local name="$1" val="$2" hint="$3"
            if [ "${val}" != "success" ]; then
              echo "::error::${name} expected success, got ${val}. ${hint}"
              fail=1
            fi
          }
          expect_success_or_skipped() {
            local name="$1" val="$2" hint="$3"
            if [ "${val}" != "success" ] && [ "${val}" != "skipped" ]; then
              echo "::error::${name} expected success/skipped, got ${val}. ${hint}"
              fail=1
            fi
          }
          expect_success "topology_regression" "${TOPOLOGY}" "检查部署拓扑 / metadata 回归脚本"
          expect_success_or_skipped "quwoquan_service" "${SERVICE}" "检查 service scope gate 输出"
          expect_success_or_skipped "search_contract_smoke" "${SEARCH}" "检查 /search 商业信封与四环境探针契约"
          expect_success_or_skipped "quwoquan_app" "${APP}" "检查 app scope gate 输出"
          expect_success_or_skipped "quwoquan_data" "${DATA}" "检查 data scope gate 输出"
          expect_success_or_skipped "ops_portal" "${PORTAL}" "检查 portal scope gate 输出"
          if [ "${fail}" -ne 0 ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Delivery Gate 未全部成功；请按上列分项修复后重跑。"
            exit 1
          fi
          echo "result=success" >> "$GITHUB_OUTPUT"
      - name: Upload delivery gate timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-gate-timing-summary
          path: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/ci-timing/delivery-gate-summary.json
          if-no-files-found: error
          compression-level: 0
