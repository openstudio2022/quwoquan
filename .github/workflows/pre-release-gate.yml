# 04 PR 轻量门禁：pr_light 不访问远端；manual_full/mainline_auto_prod
# 必须对显式 beta/prod URL 执行 canonical /search 商业信封探针。hosted gamma 预检保持退役。
# 触发：pull_request + workflow_dispatch；canonical evaluator 决定是否为 promotion
# 执行语义见 .cursor/commands/verify.md；本 workflow 是 CI 行为真相源。
name: 04. Pre-Release Gate

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: '验证 profile：pr_light（默认）/ manual_full / mainline_auto_prod'
        required: false
        default: pr_light
        type: choice
        options:
          - pr_light
          - manual_full
          - mainline_auto_prod
      search_env:
        description: 'manual_full/mainline_auto_prod 搜索探针环境'
        required: false
        default: beta
        type: choice
        options:
          - beta
          - prod
      search_base_url:
        description: 'manual_full/mainline_auto_prod 必填：待准出环境 API base URL'
        required: false
        default: ''
        type: string

concurrency:
  group: pre-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch_policy:
    name: Pre-Release — Branch Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - if: ${{ github.event_name == 'pull_request' }}
        name: Enforce the reviewed promotion edge
        run: python3 quwoquan_ops/gate/verify_git_branch_policy.py

  resolve_profile:
    name: Resolve validation profile
    needs: branch_policy
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - id: resolve
        name: Determine profile
        run: |
          PROFILE="${{ inputs.validation_profile || 'pr_light' }}"
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"

  search_runtime_smoke:
    name: Pre-Release — Search /search Runtime Smoke
    needs:
      - resolve_profile
    if: ${{ needs.resolve_profile.outputs.profile != 'pr_light' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Require explicit release environment URL
        env:
          SEARCH_BASE_URL: ${{ inputs.search_base_url || '' }}
        run: |
          if [ -z "${SEARCH_BASE_URL}" ]; then
            echo "::error::manual_full/mainline_auto_prod requires search_base_url for the live /search probe"
            exit 1
          fi
      - name: Probe canonical /search commercial envelope
        env:
          SEARCH_ENV: ${{ inputs.search_env || 'beta' }}
          SEARCH_BASE_URL: ${{ inputs.search_base_url || '' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 \
            quwoquan_ops/cli/probes/run_environment_integration_probe.py \
            --env "${SEARCH_ENV}" \
            --base-url "${SEARCH_BASE_URL}" \
            --mode readonly \
            --only-check global_search \
            --report ".qwq_output/env/${SEARCH_ENV}/runs/pre-release/search-runtime-smoke.json"
      - name: Upload search runtime evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-release-search-runtime-smoke
          path: .qwq_output/env/*/runs/pre-release/search-runtime-smoke.json
          if-no-files-found: error
          retention-days: 3

  release-evidence-summary:
    name: 04. Pre-Release Gate
    needs:
      - resolve_profile
      - search_runtime_smoke
    if: always()
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: 输出 04 PR gate 摘要
        env:
          PROFILE: ${{ needs.resolve_profile.outputs.profile }}
        run: |
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 04.pre_release_gate_pr \
            --title "04. Pre-Release Gate (pr_light)" \
            --machine-critical-path-seconds 0 \
            --phase profile_resolved=0 \
            --note "pr_light 不访问远端；manual_full/mainline_auto_prod 必须提供 beta/prod base URL 并通过 canonical /search 商业信封探针。hosted gamma 预检保持退役。" \
            --write-step-summary
      - name: 汇总并阻断失败项
        env:
          PROFILE: ${{ needs.resolve_profile.outputs.profile }}
          RESOLVE_RESULT: ${{ needs.resolve_profile.result }}
          SEARCH_RESULT: ${{ needs.search_runtime_smoke.result }}
        run: |
          set -euo pipefail
          if [ "${RESOLVE_RESULT}" != "success" ]; then
            echo "::error::resolve_profile expected success, got ${RESOLVE_RESULT}."
            exit 1
          fi
          if [ "${PROFILE}" = "pr_light" ]; then
            if [ "${SEARCH_RESULT}" != "skipped" ]; then
              echo "::error::search_runtime_smoke must be skipped for pr_light, got ${SEARCH_RESULT}."
              exit 1
            fi
          elif [ "${SEARCH_RESULT}" != "success" ]; then
            echo "::error::search_runtime_smoke expected success for ${PROFILE}, got ${SEARCH_RESULT}."
            exit 1
          fi
          echo "::notice::04. Pre-Release Gate passed with profile=${PROFILE}"
