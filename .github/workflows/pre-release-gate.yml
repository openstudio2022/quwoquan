# 04 PR 轻量门禁占位：hosted gamma 预检已退役，远端验证统一收敛到 07 prod gray-initial。
# 仅保留 profile 解析与门禁汇总，便于后续按需扩展非 gamma 的 PR 预检。
# 触发：pull_request(main) + workflow_dispatch
# 端到端闭环见 quwoquan_ops/environments/ci_cd_end_to_end_design.md
name: 04. Pre-Release Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validation_profile:
        description: '验证 profile：pr_light（默认）/ manual_full / mainline_auto_prod'
        required: false
        default: pr_light
        type: choice
        options:
          - pr_light
          - manual_full
          - mainline_auto_prod

concurrency:
  group: pre-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve_profile:
    name: Resolve validation profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      use_ecs_deploy: ${{ steps.resolve.outputs.use_ecs_deploy }}
    steps:
      - id: resolve
        name: Determine profile
        run: |
          PROFILE="${{ inputs.validation_profile || 'pr_light' }}"
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          if [ "${PROFILE}" = "manual_full" ] || [ "${PROFILE}" = "mainline_auto_prod" ]; then
            echo "use_ecs_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_ecs_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  release-evidence-summary:
    name: 04. Pre-Release Gate
    needs:
      - resolve_profile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 输出 04 PR gate 摘要
        env:
          PROFILE: ${{ needs.resolve_profile.outputs.profile }}
        run: |
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 04.pre_release_gate_pr \
            --title "04. Pre-Release Gate (pr_light)" \
            --critical-path-seconds 0 \
            --phase profile_resolved=0 \
            --note "hosted gamma 预检已退役；远端验证统一收敛到 07 prod gray-initial。04 仅保留 profile 解析与门禁占位。" \
            --write-step-summary
      - name: 汇总并阻断失败项
        env:
          PROFILE: ${{ needs.resolve_profile.outputs.profile }}
          RESOLVE_RESULT: ${{ needs.resolve_profile.result }}
        run: |
          set -euo pipefail
          if [ "${RESOLVE_RESULT}" != "success" ]; then
            echo "::error::resolve_profile expected success, got ${RESOLVE_RESULT}."
            exit 1
          fi
          echo "::notice::04. Pre-Release Gate passed with profile=${PROFILE}"
