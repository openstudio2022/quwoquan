# 04 PR 轻量门禁：pr_light 不访问远端；manual_full/mainline_auto_prod
# 必须对显式 beta/prod URL 执行 canonical /search 商业信封探针。hosted gamma 预检保持退役。
# 触发：dev1.0 push + dev1.0 -> main pull_request + workflow_dispatch；canonical evaluator 决定是否为 promotion
# 执行语义见 .cursor/commands/verify.md；本 workflow 是 CI 行为真相源。
name: 04. Pre-Release Gate

permissions:
  contents: read

on:
  push:
    branches: [dev1.0]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: '验证 profile：pr_light（默认）/ manual_full / mainline_auto_prod'
        required: false
        default: pr_light
        type: choice
        options:
          - pr_light
          - manual_full
          - mainline_auto_prod
      search_env:
        description: 'manual_full/mainline_auto_prod 搜索探针环境'
        required: false
        default: beta
        type: choice
        options:
          - beta
          - prod
      search_base_url:
        description: 'manual_full/mainline_auto_prod 必填：待准出环境 API base URL'
        required: false
        default: ''
        type: string

concurrency:
  group: pre-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_light_governance:
    name: Pre-Release — PR Light Governance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      impact_plan_digest: ${{ steps.impact.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: profile
        name: Resolve validation profile
        run: |
          PROFILE="${{ inputs.validation_profile || 'pr_light' }}"
          case "$PROFILE" in pr_light|manual_full|mainline_auto_prod) ;; *) exit 2 ;; esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - id: range
        name: Resolve exact governance impact range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$PR_BASE_SHA"
          if [[ "${{ github.event_name }}" == push ]]; then BASE_SHA="$PUSH_BEFORE_SHA"; fi
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" || -z "$BASE_SHA" ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          { echo "base_sha=$BASE_SHA"; echo "head_sha=$HEAD_SHA"; } >> "$GITHUB_OUTPUT"
      - id: impact
        name: Generate canonical PR-light impact plan
        run: |
          ROOT="$RUNNER_TEMP/pre-release-impact-plan"
          mkdir -p "$ROOT"
          python3 quwoquan_ops/ci/detect_ci_impacted_scopes.py \
            --base-sha "${{ steps.range.outputs.base_sha }}" \
            --head-sha "${{ steps.range.outputs.head_sha }}" \
            --impact-plan "$ROOT/impact-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          python3 quwoquan_ops/ci/detect_ci_impacted_scopes.py \
            --validate-impact-plan "$ROOT/impact-plan.json" \
            --expected-source-sha "${{ steps.range.outputs.head_sha }}" \
            --expected-plan-digest "$(awk -F= '$1 == "plan_digest" {print $2}' "$GITHUB_OUTPUT" | tail -n 1)" \
            --github-output "$RUNNER_TEMP/pre-release-impact-validated"
      - name: Verify changed secret, PII and generated boundaries
        run: |
          python3 quwoquan_ops/ci/verify_ci_changed_boundary.py \
            --impact-plan "$RUNNER_TEMP/pre-release-impact-plan/impact-plan.json" \
            --expected-source-sha "${{ steps.range.outputs.head_sha }}" \
            --expected-plan-digest "${{ steps.impact.outputs.plan_digest }}"
      - name: Upload canonical PR-light impact plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-release-impact-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-impact-plan/impact-plan.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  search_runtime_smoke:
    name: Pre-Release — Search /search Runtime Smoke
    needs: pr_light_governance
    if: ${{ needs.pr_light_governance.outputs.profile != 'pr_light' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Require explicit release environment URL
        env:
          SEARCH_BASE_URL: ${{ inputs.search_base_url || '' }}
        run: |
          if [ -z "${SEARCH_BASE_URL}" ]; then
            echo "::error::manual_full/mainline_auto_prod requires search_base_url for the live /search probe"
            exit 1
          fi
      - name: Probe canonical /search commercial envelope
        env:
          SEARCH_ENV: ${{ inputs.search_env || 'beta' }}
          SEARCH_BASE_URL: ${{ inputs.search_base_url || '' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 \
            quwoquan_ops/cli/probes/run_environment_integration_probe.py \
            --env "${SEARCH_ENV}" \
            --base-url "${SEARCH_BASE_URL}" \
            --mode readonly \
            --only-check global_search \
            --report ".qwq_output/env/${SEARCH_ENV}/runs/pre-release/search-runtime-smoke.json"
      - name: Upload search runtime evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-release-search-runtime-smoke
          path: .qwq_output/env/*/runs/pre-release/search-runtime-smoke.json
          if-no-files-found: error
          retention-days: 3

  release-evidence-summary:
    name: 04. Pre-Release Gate
    needs: [pr_light_governance, search_runtime_smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce functional profile closure and publish budget target
        env:
          PROFILE: ${{ needs.pr_light_governance.outputs.profile }}
          GOVERNANCE_RESULT: ${{ needs.pr_light_governance.result }}
          SEARCH_RESULT: ${{ needs.search_runtime_smoke.result }}
        run: |
          set -euo pipefail
          test "$GOVERNANCE_RESULT" = success
          if [[ "$PROFILE" != pr_light ]]; then test "$SEARCH_RESULT" = success; fi
          {
            echo "### 04. Pre-Release Gate"
            echo "- pr_light target: <=120s; hard timeout: 180s"
            echo "- impact plan: ${{ needs.pr_light_governance.outputs.impact_plan_digest }}"
            echo "- full profiles retain the canonical live /search admission check"
          } >> "$GITHUB_STEP_SUMMARY"
