name: 08b. Deploy Gamma ECS Direct

on:
  workflow_dispatch:
    inputs:
      stage:
        description: ECS onebox stage
        type: choice
        default: prod
        options:
          - pre
          - prod
      image_version:
        description: Target image version; empty uses run number
        required: false
        type: string
        default: ''
      mode:
        description: restart / rollout / cold-build
        type: choice
        default: rollout
        options:
          - restart
          - rollout
          - cold-build
      skip_upload:
        description: Reuse the existing ECS tree and only rerun remote startup
        type: boolean
        default: false

concurrency:
  group: gamma-ecs-direct-${{ github.ref }}
  cancel-in-progress: false

env:
  GAMMA_ECS_HOST: ${{ vars.GAMMA_ECS_HOST || secrets.GAMMA_ECS_HOST || '118.31.239.122' }}
  GAMMA_ECS_USER: ${{ vars.GAMMA_ECS_USER || 'root' }}
  GAMMA_ECS_PORT: ${{ vars.GAMMA_ECS_PORT || '22' }}
  GAMMA_ECS_REMOTE_DIR: ${{ vars.GAMMA_ECS_REMOTE_DIR || '/opt/quwoquan/gamma' }}
  ASSISTANT_MODEL_PROVIDER: deterministic
  ALLOW_DETERMINISTIC_BETA: "1"

jobs:
  deploy_direct:
    name: Deploy ECS directly without artifact handoff
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      base_url: ${{ steps.urls.outputs.base_url }}
      product_ops_base_url: ${{ steps.urls.outputs.product_ops_base_url }}
      media_base_url: ${{ steps.urls.outputs.media_base_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve gamma URLs
        id: urls
        run: |
          PUBLIC_HOST="${GAMMA_ECS_PUBLIC_HOST:-118.31.239.122}"
          BASE_URL="${GAMMA_BASE_URL:-http://${PUBLIC_HOST}:19000}"
          PRODUCT_OPS_BASE_URL="${GAMMA_PRODUCT_OPS_BASE_URL:-http://${PUBLIC_HOST}:19010}"
          MEDIA_BASE_URL="${MEDIA_AVATAR_CDN_BASE_URL:-http://${PUBLIC_HOST}:19100}"
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "product_ops_base_url=${PRODUCT_OPS_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "media_base_url=${MEDIA_BASE_URL}" >> "$GITHUB_OUTPUT"
        env:
          GAMMA_ECS_PUBLIC_HOST: ${{ vars.GAMMA_ECS_PUBLIC_HOST || vars.GAMMA_ECS_HOST }}
          GAMMA_BASE_URL: ${{ vars.GAMMA_BASE_URL }}
          GAMMA_PRODUCT_OPS_BASE_URL: ${{ vars.GAMMA_PRODUCT_OPS_BASE_URL }}
          MEDIA_AVATAR_CDN_BASE_URL: ${{ vars.MEDIA_AVATAR_CDN_BASE_URL }}
      - name: Validate ECS credentials
        env:
          GAMMA_ECS_PASSWORD: ${{ secrets.GAMMA_ECS_PASSWORD }}
          GAMMA_ECS_SSH_KEY: ${{ secrets.GAMMA_ECS_SSH_KEY }}
        run: |
          if [ -z "${GAMMA_ECS_PASSWORD:-}" ] && [ -z "${GAMMA_ECS_SSH_KEY:-}" ]; then
            echo "::error::需要配置 secrets.GAMMA_ECS_PASSWORD 或 secrets.GAMMA_ECS_SSH_KEY"
            exit 2
          fi
      - name: Install sshpass
        env:
          GAMMA_ECS_PASSWORD: ${{ secrets.GAMMA_ECS_PASSWORD }}
          GAMMA_ECS_SSH_KEY: ${{ secrets.GAMMA_ECS_SSH_KEY }}
        run: |
          if [ -n "${GAMMA_ECS_SSH_KEY:-}" ] || [ -z "${GAMMA_ECS_PASSWORD:-}" ]; then
            echo "skip sshpass install"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y sshpass
      - name: Create minimal ECS bundle
        if: ${{ !inputs.skip_upload }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gamma-minimal-bundle/quwoquan_app"
          mkdir -p "${RUNNER_TEMP}/gamma-minimal-bundle/quwoquan_data/data"
          mkdir -p "${RUNNER_TEMP}/gamma-minimal-bundle/releases"
          cp -R agent_ops "${RUNNER_TEMP}/gamma-minimal-bundle/agent_ops"
          cp -R deploy "${RUNNER_TEMP}/gamma-minimal-bundle/deploy"
          cp -R releases/config "${RUNNER_TEMP}/gamma-minimal-bundle/releases/config"
          cp -R quwoquan_app/scripts "${RUNNER_TEMP}/gamma-minimal-bundle/quwoquan_app/scripts"
          cp -R quwoquan_data/scripts "${RUNNER_TEMP}/gamma-minimal-bundle/quwoquan_data/scripts"
          cp -R quwoquan_data/data/admin_regions "${RUNNER_TEMP}/gamma-minimal-bundle/quwoquan_data/data/admin_regions"
          cp -R quwoquan_service "${RUNNER_TEMP}/gamma-minimal-bundle/quwoquan_service"
          tar \
            --exclude='.git' \
            --exclude='.dart_tool' \
            --exclude='build' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.mypy_cache' \
            --exclude='quwoquan_app/.dart_tool' \
            --exclude='quwoquan_app/build' \
            --exclude='apps/ops-portal/node_modules' \
            -C "${RUNNER_TEMP}/gamma-minimal-bundle" \
            -czf "${RUNNER_TEMP}/gamma-ecs-bundle.tgz" .
          ls -lh "${RUNNER_TEMP}/gamma-ecs-bundle.tgz"
      - name: Deploy to ECS via stackctl
        run: |
          python3 agent_ops/deploy/stackctl.py \
            --output-format json \
            --report-dir artifacts/stackctl/gamma/deploy-direct \
            deploy \
            --target gamma-hosted \
            --mode "${DEPLOY_MODE}" \
            --stage "${GAMMA_ECS_STAGE}" \
            --image-version "${GAMMA_DEPLOY_IMAGE_VERSION}" \
            --previous-image-version "${GAMMA_PREVIOUS_IMAGE_VERSION:-bootstrap}" \
            --base-url "${GAMMA_BASE_URL}" \
            --product-ops-base-url "${GAMMA_PRODUCT_OPS_BASE_URL}" \
            --media-base-url "${MEDIA_AVATAR_CDN_BASE_URL}"
        env:
          GAMMA_ECS_STAGE: ${{ inputs.stage }}
          DEPLOY_MODE: ${{ inputs.mode }}
          GAMMA_ECS_SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
          GAMMA_DEPLOY_IMAGE_VERSION: ${{ inputs.image_version || format('0.0.{0}', github.run_number) }}
          GAMMA_ECS_LOCAL_TARBALL: ${{ runner.temp }}/gamma-ecs-bundle.tgz
          GAMMA_ECS_PASSWORD: ${{ secrets.GAMMA_ECS_PASSWORD }}
          GAMMA_ECS_SSH_KEY: ${{ secrets.GAMMA_ECS_SSH_KEY }}
          GAMMA_BASE_URL: ${{ steps.urls.outputs.base_url }}
          GAMMA_PRODUCT_OPS_BASE_URL: ${{ steps.urls.outputs.product_ops_base_url }}
          MEDIA_AVATAR_CDN_BASE_URL: ${{ steps.urls.outputs.media_base_url }}
          GAMMA_TEST_AUTH_TOKEN: ${{ secrets.GAMMA_TEST_AUTH_TOKEN }}
          GAMMA_ECS_CONTAINER_REGISTRY_MIRROR: ${{ vars.GAMMA_ECS_CONTAINER_REGISTRY_MIRROR }}
          GAMMA_ECS_IMAGE_PULL_TIMEOUT_SECONDS: ${{ vars.GAMMA_ECS_IMAGE_PULL_TIMEOUT_SECONDS }}
          GAMMA_ECS_COMPOSE_TIMEOUT_SECONDS: ${{ vars.GAMMA_ECS_COMPOSE_TIMEOUT_SECONDS }}
          GAMMA_ECS_SKIP_IMAGE_REBUILD: ${{ inputs.skip_upload && '1' || '0' }}
          ASSISTANT_MODEL_PROVIDER: ${{ env.ASSISTANT_MODEL_PROVIDER }}
          ALLOW_DETERMINISTIC_BETA: ${{ env.ALLOW_DETERMINISTIC_BETA }}
      - name: Upload deploy evidence
        id: upload_deploy_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stackctl-gamma-deploy-direct
          path: |
            artifacts/ecs-onebox/deploy-report.json
            artifacts/stackctl/gamma/deploy-direct/**
          if-no-files-found: ignore
      - name: Echo deploy failure reports
        if: failure()
        run: |
          set +e
          echo "::group::stackctl gamma deploy summary"
          if [ -f artifacts/stackctl/gamma/deploy-direct/summary.md ]; then
            sed -n '1,200p' artifacts/stackctl/gamma/deploy-direct/summary.md
          else
            echo "missing artifacts/stackctl/gamma/deploy-direct/summary.md"
          fi
          echo "::endgroup::"

          echo "::group::stackctl gamma deploy report.json"
          if [ -f artifacts/stackctl/gamma/deploy-direct/report.json ]; then
            sed -n '1,260p' artifacts/stackctl/gamma/deploy-direct/report.json
          else
            echo "missing artifacts/stackctl/gamma/deploy-direct/report.json"
          fi
          echo "::endgroup::"

          echo "::group::gamma ecs deploy report"
          if [ -f artifacts/ecs-onebox/deploy-report.json ]; then
            sed -n '1,260p' artifacts/ecs-onebox/deploy-report.json
          else
            echo "missing artifacts/ecs-onebox/deploy-report.json"
          fi
          echo "::endgroup::"

          echo "::group::gamma ecs deploy phases"
          if [ -f artifacts/ecs-onebox/deploy-phases.json ]; then
            sed -n '1,260p' artifacts/ecs-onebox/deploy-phases.json
          else
            echo "missing artifacts/ecs-onebox/deploy-phases.json"
          fi
          echo "::endgroup::"

          echo "::group::stackctl gamma deploy stdout"
          if [ -f artifacts/stackctl/gamma/deploy-direct/stdout.md ]; then
            tail -n 1200 artifacts/stackctl/gamma/deploy-direct/stdout.md
          else
            echo "missing artifacts/stackctl/gamma/deploy-direct/stdout.md"
          fi
          echo "::endgroup::"
      - name: Probe hosted content flow
        env:
          BASE_URL: ${{ steps.urls.outputs.base_url }}
          PRODUCT_OPS_BASE_URL: ${{ steps.urls.outputs.product_ops_base_url }}
          MEDIA_BASE_URL: ${{ steps.urls.outputs.media_base_url }}
          GAMMA_TEST_AUTH_TOKEN: ${{ secrets.GAMMA_TEST_AUTH_TOKEN }}
        run: |
          python3 agent_ops/deploy/probes/run_environment_integration_probe.py \
            --env gamma \
            --mode post-deploy \
            --base-url "${BASE_URL}" \
            --product-ops-base-url "${PRODUCT_OPS_BASE_URL}" \
            --media-base-url "${MEDIA_BASE_URL}" \
            --test-auth-token "${GAMMA_TEST_AUTH_TOKEN}" \
            --require-non-empty-content-feed \
            --report artifacts/stackctl/gamma/deploy-direct/integration-probe-post-deploy.json
      - name: Fail when deploy evidence upload failed
        if: always() && steps.upload_deploy_evidence.outcome != 'success'
        run: |
          echo "::error::deploy evidence upload failed; do not treat this run as having a downloadable evidence chain."
          exit 1
