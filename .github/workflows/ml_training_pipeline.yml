name: "ML Training Pipeline"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Model scenario (e.g. content_feed)"
        default: "content_feed"
      production:
        description: "Promote to production if gate passes"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run with minimal data"
        type: boolean
        default: false
      baseline_date:
        description: "Optional ISO baseline date for PSI monitoring (e.g. 2026-05-01)"
        default: ""
  schedule:
    - cron: "0 18 * * 0"  # Sunday UTC 18:00 = Monday Beijing 02:00

env:
  MONGODB_URI: ${{ secrets.PROD_TRAINING_MONGODB_URI }}
  DB: quwoquan_content_training
  SCENARIO: ${{ github.event.inputs.scenario || 'content_feed' }}
  MODEL_ARTIFACT_ENDPOINT: ${{ secrets.MODEL_ARTIFACT_ENDPOINT }}
  MODEL_ARTIFACT_BUCKET: ${{ secrets.MODEL_ARTIFACT_BUCKET || 'quwoquan-models' }}
  MODEL_ARTIFACT_ACCESS_KEY: ${{ secrets.MODEL_ARTIFACT_ACCESS_KEY }}
  MODEL_ARTIFACT_SECRET_KEY: ${{ secrets.MODEL_ARTIFACT_SECRET_KEY }}
  MAX_FEATURE_LAG_SECONDS: "86400"

jobs:
  dry-run-e2e:
    name: "0. Dry-Run E2E"
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run == 'true'
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output
      QWQ_DEPLOY_WORK_ROOT: ${{ runner.temp }}/quwoquan-deploy
      MODEL_OUT_DIR: .qwq_output/env/repo/local/ml/models
      REC_MODEL_URL: http://127.0.0.1:18090
      AUTH_JWT_SECRET: ml-dry-run-jwt-secret
      AUTH_JWT_ISSUER: quwoquan-ml-dry-run
      AUTH_JWT_AUDIENCE: quwoquan-ml-dry-run
      AUTH_JWT_TOKEN_VERSION: ml-dry-run-v1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install \
            -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/requirements.txt \
            -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts/requirements.txt
      - name: Run ML contract tests
        working-directory: quwoquan_service
        run: make verify-ml-tests
      - name: Verify ML feature consistency
        working-directory: quwoquan_service
        run: python3 services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts/verify_feature_consistency.py
      - name: Prepare autonomous Recommendation package
        run: |
          python3 quwoquan_ops/cli/stackctl.py package --service recommendation-service --env alpha
          PACKAGE_DIR="$QWQ_DEPLOY_WORK_ROOT/alpha-local/packages/services/recommendation-service"
          CONFIG_ROOT="$RUNNER_TEMP/quwoquan-ml-config"
          MODEL_CACHE_ROOT="$RUNNER_TEMP/quwoquan-ml-model-cache"
          mkdir -p "$CONFIG_ROOT" "$MODEL_CACHE_ROOT"
          cp "$PACKAGE_DIR/config/config.yaml" "$CONFIG_ROOT/recommendation-service.yaml"
          CONFIG_VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["configVersion"])' "$PACKAGE_DIR/provenance.json")
          echo "QWQ_COMPOSE_ENV=alpha" >> "$GITHUB_ENV"
          echo "QWQ_COMPOSE_CONFIG_ROOT=$CONFIG_ROOT" >> "$GITHUB_ENV"
          echo "QWQ_COMPOSE_MODEL_CACHE_ROOT=$MODEL_CACHE_ROOT" >> "$GITHUB_ENV"
          echo "QWQ_COMPOSE_RECOMMENDATION_SERVICE_CONFIG_VERSION=$CONFIG_VERSION" >> "$GITHUB_ENV"
          echo "QWQ_COMPOSE_REC_MODEL_PORT=18090" >> "$GITHUB_ENV"
          echo "QWQ_COMPOSE_MONGODB_URI=mongodb://mongodb:27017/?directConnection=true" >> "$GITHUB_ENV"
      - name: Start local ML stack
        run: |
          docker compose \
            -f quwoquan_ops/environments/compose/docker-compose.gamma-local.yaml \
            -f quwoquan_service/services/recommendation-service/deploy/compose.yaml \
            up -d --build mongodb mongo-init recommendation-service
      - name: Run dry-run e2e
        working-directory: quwoquan_service
        run: make verify-ml-e2e
      - name: Stop local ML stack
        if: always()
        run: |
          docker compose \
            -f quwoquan_ops/environments/compose/docker-compose.gamma-local.yaml \
            -f quwoquan_service/services/recommendation-service/deploy/compose.yaml \
            down -v

  join-samples:
    name: "1. Join Training Samples"
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.PROD_TRAINING_MONGODB_URI }}
      DB: quwoquan_content_training
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts/requirements.txt
      - name: Run sample joiner
        working-directory: quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts
        run: |
          LIMIT=${{ github.event.inputs.dry_run == 'true' && '200' || '50000' }}
          python sample_joiner.py --scenario "$SCENARIO" --limit "$LIMIT" --db "$DB" --clean

  train:
    name: "2. Train Models"
    if: github.event.inputs.dry_run != 'true'
    needs: join-samples
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.PROD_TRAINING_MONGODB_URI }}
      DB: quwoquan_content_training
    strategy:
      matrix:
        model_type: [lgb, multiobjective]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts/requirements.txt
      - name: Train
        working-directory: quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts
        run: |
          # N0-5 训练链库统一：join/train/evaluate/promote 全部落 $DB
          # （此前 train/evaluate 落默认 quwoquan_content，join 写 training 库，
          # 训练读不到新样本、promote 必报 No staged model）。
          ROUNDS=${{ github.event.inputs.dry_run == 'true' && '5' || '100' }}
          MIN_SAMPLES=${{ github.event.inputs.dry_run == 'true' && '50' || '100' }}
          if [ "${{ matrix.model_type }}" = "lgb" ]; then
            python train.py --scenario "$SCENARIO" --db "$DB" --num-boost-round "$ROUNDS" --min-samples "$MIN_SAMPLES" --max-feature-lag-seconds "$MAX_FEATURE_LAG_SECONDS"
          else
            python train_multiobjective.py --scenario "$SCENARIO" --db "$DB" --num-boost-round "$ROUNDS" --min-samples "$MIN_SAMPLES" --max-feature-lag-seconds "$MAX_FEATURE_LAG_SECONDS"
          fi

  evaluate:
    name: "3. Evaluate & Gate"
    if: github.event.inputs.dry_run != 'true'
    needs: train
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.PROD_TRAINING_MONGODB_URI }}
      DB: quwoquan_content_training
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts/requirements.txt
      - name: Freeze weekly replay dataset (immutable if exists)
        working-directory: quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts
        run: |
          # W13/B20 固定 replay dataset：每周冻结一次评估切片（已存在则不覆盖），
          # N0-5 起冻结即物化完整样本快照（rec_replay_samples），join --clean 不摧毁。
          python replay_dataset.py freeze --scenario "$SCENARIO" --db "$DB"
      - name: Run evaluation
        working-directory: quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts
        run: |
          python evaluate.py --scenario "$SCENARIO" --db "$DB" --max-feature-lag-seconds "$MAX_FEATURE_LAG_SECONDS"
          python evaluate.py --scenario "${SCENARIO}_multiobjective" --db "$DB" --max-feature-lag-seconds "$MAX_FEATURE_LAG_SECONDS"
          # 固定 replay dataset 复评（存在本周冻结集时）：输出带 replay_dataset_id
          # 的对比指标，进入 replay 周报证据链。
          REPLAY_ID=$(python replay_dataset.py list --scenario "$SCENARIO" --db "$DB" | head -1 | cut -f1)
          if [ -n "$REPLAY_ID" ]; then
            python evaluate.py --scenario "$SCENARIO" --db "$DB" --replay-dataset "$REPLAY_ID" --max-feature-lag-seconds "$MAX_FEATURE_LAG_SECONDS"
          fi
      - name: Quality gate
        working-directory: quwoquan_service
        run: |
          DRY_RUN_FLAG="false"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="true"
          fi
          make verify-ml-model-quality ML_DRY_RUN="$DRY_RUN_FLAG"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-report
          path: |
            .qwq_output/env/repo/runs/ml/eval_report_*.json

  promote:
    name: "4. Promote Models"
    if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.production == 'true' }}
    needs: evaluate
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.PROD_TRAINING_MONGODB_URI }}
      DB: quwoquan_content_training
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts/requirements.txt
      - name: Promote models to production
        working-directory: quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts
        run: |
          python model_registry_cli.py promote --scenario "$SCENARIO"
          python model_registry_cli.py promote --scenario "${SCENARIO}_multiobjective"

  monitoring:
    name: "5. Guardrail & Drift Monitoring"
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    needs: evaluate
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.PROD_TRAINING_MONGODB_URI }}
      DB: quwoquan_content_training
      ML_GUARDRAIL_ENV: prod
      ML_GUARDRAIL_DRY_RUN: true
      ML_GUARDRAIL_WINDOW_HOURS: 4
      ML_DRIFT_BASELINE_DATE: ${{ github.event.inputs.baseline_date || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r quwoquan_service/services/recommendation-service/internal/recommendation/recommendation_model_release/infrastructure/model_runtime/scripts/requirements.txt
      - name: Run rule-only guardrail dry-run
        id: guardrail
        working-directory: quwoquan_service
        continue-on-error: true
        run: make verify-ml-guardrail ML_GUARDRAIL_OUT="guardrail_report.json"
      - name: Run PSI drift monitor
        id: drift
        working-directory: quwoquan_service
        continue-on-error: true
        run: make verify-ml-drift ML_DRIFT_OUT="drift_report.json"
      - name: Evaluate monitoring results
        if: always()
        working-directory: quwoquan_service
        run: |
          if [ "${{ steps.guardrail.outcome }}" = "failure" ]; then
            echo "Guardrail dry-run reported a rule-only cutover condition"
            exit 1
          fi
          if [ "${{ steps.drift.outcome }}" = "failure" ]; then
            echo "PSI drift monitor reported an alert condition"
            exit 1
          fi
      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rec-monitoring-reports
          path: |
            quwoquan_service/guardrail_report.json
            quwoquan_service/drift_report.json

  notify:
    name: "6. Summary"
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    needs: [evaluate, promote, monitoring]
    runs-on: ubuntu-latest
    steps:
      - name: Download report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eval-report
          path: .
        continue-on-error: true
      - name: Download monitoring reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rec-monitoring-reports
          path: monitoring
        continue-on-error: true
      - name: Print summary
        run: |
          echo "## ML Training Pipeline Results" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import json
          import os
          for path in sorted(glob.glob('eval_report_*.json')):
              with open(path, encoding='utf-8') as f:
                  r = json.load(f)
              print(f'### {os.path.basename(path)}')
              print(f"Status: **{r['status'].upper()}**")
              print(f"Reason: {r['reason']}")
              print(f"New metrics: {json.dumps(r['new_metrics'], indent=2)}")
              print("")
          for path in ['monitoring/guardrail_report.json', 'monitoring/drift_report.json']:
              if os.path.exists(path):
                  with open(path, encoding='utf-8') as f:
                      r = json.load(f)
                  print(f'### {os.path.basename(path)}')
                  print(f"Status: **{r.get('status', r.get('overall_status', 'UNKNOWN')).upper()}**")
                  print(f"Reason: {r.get('reason', r.get('overall_status', ''))}")
                  print("")
          PY
