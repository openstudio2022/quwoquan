name: Domain governance

on:
  workflow_dispatch:
    inputs:
      applyProductionRecords:
        description: >-
          确认写入生产 DNS 记录（破坏性动作）。留空时本次只做 plan 与漂移核对。
        type: boolean
        default: false
  schedule:
    # 定时触发只做漂移检测，从不写入生产记录。
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: domain-governance
  cancel-in-progress: false

jobs:
  dns:
    runs-on: ubuntu-latest
    environment: domain-governance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify agent context governance budget
        run: make verify-agent-context-budget
      - name: Apply canonical DNS records
        env:
          QWQ_DNS_PROVISIONING_API_TOKEN: ${{ secrets.QWQ_DNS_PROVISIONING_API_TOKEN }}
          QWQ_PROD_EDGE_IPV4: ${{ secrets.QWQ_PROD_EDGE_IPV4 }}
          APPLY_PRODUCTION_RECORDS: ${{ inputs.applyProductionRecords }}
        run: |
          python3 quwoquan_ops/gate/require_ci_inputs.py \
            --scope domain-governance \
            QWQ_DNS_PROVISIONING_API_TOKEN \
            QWQ_PROD_EDGE_IPV4
          python3 quwoquan_ops/cli/domain_governance.py plan \
            --report .qwq_output/env/repo/runs/domain/dns-plan.json
          if [ "$APPLY_PRODUCTION_RECORDS" = "true" ]; then
            python3 quwoquan_ops/cli/domain_governance.py apply \
              --allow-production-mutation \
              --report .qwq_output/env/repo/runs/domain/dns-apply-receipt.json
          else
            echo "[domain-governance] plan-only run; production records untouched."
          fi
          # verify 的退出码三分：0 全部核对通过，2 现网与计划不一致，3 有 scope 未被
          # 核对（本 job 强制注入 edge 地址，因此 3 意味着接线本身出了问题）。
          python3 quwoquan_ops/cli/domain_governance.py verify \
            --skip-tls \
            --report .qwq_output/env/repo/runs/domain/dns-live-evidence.json
      - name: Prepare redacted DNS failure diagnostic
        if: ${{ failure() && !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".qwq_output/env/repo/runs/domain")
          sources = []
          for source in (
              root / "dns-plan.json",
              root / "dns-apply-receipt.json",
              root / "dns-live-evidence.json",
          ):
              summary = {"name": source.name, "present": source.is_file()}
              if source.is_file():
                  try:
                      payload = json.loads(source.read_text(encoding="utf-8"))
                  except (OSError, UnicodeError, json.JSONDecodeError):
                      summary["validJson"] = False
                  else:
                      summary["validJson"] = isinstance(payload, dict)
                      if isinstance(payload, dict):
                          summary["schema"] = str(payload.get("schema") or "unknown")
                          summary["status"] = str(payload.get("status") or "unknown")
              sources.append(summary)
          root.mkdir(parents=True, exist_ok=True)
          diagnostic = {
              "schema": "quwoquan.domain-governance-failure-diagnostic",
              "job": "dns",
              "status": os.environ.get("JOB_STATUS", "failure"),
              "sources": sources,
          }
          (root / "dns-failure-diagnostic.json").write_text(
              json.dumps(diagnostic, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload redacted DNS failure diagnostic
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: domain-dns-failure-diagnostic
          path: .qwq_output/env/repo/runs/domain/dns-failure-diagnostic.json
          retention-days: 3

  certificate:
    needs: dns
    runs-on: ubuntu-latest
    environment: domain-governance
    strategy:
      fail-fast: false
      matrix:
        target: [alpha-local, beta-local, gamma-local, prod-sim, prod-hosted]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Go without implicit cache
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install pinned DNS-01 and encryption clients
        run: |
          go install github.com/go-acme/lego/v5/cmd/lego@v5.3.1
          go install filippo.io/age/cmd/age@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Issue and encrypt wildcard certificate
        env:
          QWQ_ACME_DNS_API_TOKEN: ${{ secrets.QWQ_ACME_DNS_API_TOKEN }}
          QWQ_TLS_AGE_RECIPIENT: ${{ secrets.QWQ_TLS_AGE_RECIPIENT }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 quwoquan_ops/gate/require_ci_inputs.py \
            --scope domain-governance \
            QWQ_ACME_DNS_API_TOKEN \
            QWQ_TLS_AGE_RECIPIENT
          evidence_dir=".qwq_output/env/repo/runs/domain"
          mkdir -p "$evidence_dir"
          python3 quwoquan_ops/cli/lib/public_domain_tls.py issue \
            --target "$TARGET" \
            > "${evidence_dir}/${TARGET}-tls-evidence.json"
          tls_exports="$(python3 quwoquan_ops/cli/lib/public_domain_tls.py paths \
            --target "$TARGET" --format shell)"
          eval "$tls_exports"
          # 加密证书包是 deployment payload，只落仓外受限部署工作区。
          mkdir -p "$QWQ_PUBLIC_TLS_BUNDLE_DIR"
          bundle="${QWQ_PUBLIC_TLS_BUNDLE_DIR}/${TARGET}-tls-bundle.tar.age"
          tar -C "$(dirname "$QWQ_PUBLIC_TLS_CERT_FILE")" \
            -cf - fullchain.pem privkey.pem \
            | age -r "$QWQ_TLS_AGE_RECIPIENT" -o "$bundle"
          echo "QWQ_TLS_BUNDLE_PATH=$bundle" >> "$GITHUB_ENV"
      - name: Prepare redacted TLS failure diagnostic
        if: ${{ failure() && !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".qwq_output/env/repo/runs/domain")
          target = os.environ["TARGET"]
          source = root / f"{target}-tls-evidence.json"
          source_summary = {"present": source.is_file()}
          if source.is_file():
              try:
                  payload = json.loads(source.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  source_summary["validJson"] = False
              else:
                  source_summary["validJson"] = isinstance(payload, dict)
                  if isinstance(payload, dict):
                      for key in ("schema", "profile", "kind", "status", "renewBeforeDays"):
                          if key in payload:
                              source_summary[key] = payload[key]
          root.mkdir(parents=True, exist_ok=True)
          diagnostic = {
              "schema": "quwoquan.domain-governance-tls-failure-diagnostic",
              "job": "certificate",
              "target": target,
              "status": os.environ.get("JOB_STATUS", "failure"),
              "source": source_summary,
          }
          (root / f"{target}-tls-failure-diagnostic.json").write_text(
              json.dumps(diagnostic, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload redacted TLS failure diagnostic
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: domain-tls-failure-diagnostic-${{ matrix.target }}
          path: .qwq_output/env/repo/runs/domain/${{ matrix.target }}-tls-failure-diagnostic.json
          retention-days: 3
