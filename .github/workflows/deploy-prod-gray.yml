# 半自动灰度到 prod：workflow_dispatch，单步灰度 + SLO 卡点
# 执行语义见 .cursor/commands/deploy.md；stage 只读取 gray_rollout_stages.yaml。
name: 06. Deploy To Prod (Gray)

permissions:
  contents: read

env:
  QWQ_OUTPUT_ROOT: .qwq_output

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options:
          - aliyun
          - volcengine
          - huaweicloud
      release_run_id:
        description: '02. Service Pipeline run id that produced the immutable release artifact'
        required: true
        type: string
      step:
        description: 'Canonical rollout stage (5=initial, 25=carry-on, 100=full)'
        required: true
        type: choice
        options:
          - '5'
          - '25'
          - '100'
      dry_run:
        description: 'Dry run (no prod apply)'
        required: false
        default: true
        type: boolean

concurrency:
  group: prod-hosted-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    outputs:
      release_artifact_ref: ${{ steps.artifact.outputs.release_artifact_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: release_run
        name: Resolve Service Pipeline source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.inputs.release_run_id }}" --jq .head_sha)"
          test -n "$HEAD_SHA"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Login OCI release artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: artifact
        name: Materialize immutable OCI release artifact
        env:
          SOURCE_SHA: ${{ steps.release_run.outputs.head_sha }}
        run: |
          REPORT="$QWQ_OUTPUT_ROOT/env/repo/local/ci/process/release-artifact-fetch.json"
          mkdir -p "$(dirname "$REPORT")"
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --source-sha "$SOURCE_SHA" \
            --repository "${{ github.repository }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline" \
            > "$REPORT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci/process/release-artifact-fetch.json"
          payload = json.loads(report.read_text(encoding="utf-8"))
          print(f"release_artifact_ref={payload['ref']}")
          PY
      - name: Require immutable release manifest
        run: |
          test -s "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" || {
            echo "::error::release artifact is required; local regeneration is forbidden"
            exit 1
          }
      - name: Checkout the exact release source
        run: |
          SOURCE_SHA="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline/manifest.json"
          print(json.loads(path.read_text(encoding="utf-8"))["source"]["gitSha"])
          PY
          )"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          MANIFEST_DIGEST="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline/manifest.json"
          print(json.loads(path.read_text(encoding="utf-8"))["manifestDigest"])
          PY
          )"
          echo "MANIFEST_DIGEST=$MANIFEST_DIGEST" >> "$GITHUB_ENV"
      - name: Require reviewed PR release governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --git-sha "$SOURCE_SHA" \
            --manifest-digest "$MANIFEST_DIGEST" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/governance-receipt.json"
  stackctl-deploy:
    name: Stackctl deploy prod gray
    needs: [validate]
    runs-on: [self-hosted, macOS, prod-release]
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      QWQ_PROD_RELEASE_STATE_DIR: ${{ vars.PROD_RELEASE_STATE_DIR }}
      QWQ_PROD_BACKUP_RECOVERY_RECEIPT: ${{ vars.PROD_BACKUP_RECOVERY_RECEIPT }}
    # 去 root · 按平面 SSH 凭据（退役单一全权 PROD_KUBECONFIG）。
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Login OCI release artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize immutable OCI release artifact
        run: |
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "${{ needs.validate.outputs.release_artifact_ref }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline"
      - name: Require immutable release manifest
        run: |
          test -s "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" || {
            echo "::error::release artifact is required; local regeneration is forbidden"
            exit 1
          }
      - name: Rebind reviewed PR governance to materialized digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          readarray -t RELEASE_CONTEXT < <(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline/manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          print(manifest["source"]["gitSha"])
          print(manifest["manifestDigest"])
          PY
          )
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --git-sha "${RELEASE_CONTEXT[0]}" \
            --manifest-digest "${RELEASE_CONTEXT[1]}" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/governance-receipt.json"
      - name: Require fresh hosted backup and recovery receipt
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py verify \
            --env prod \
            --target prod-hosted \
            --kind all \
            --profile release \
            --backup-recovery-receipt "$QWQ_PROD_BACKUP_RECOVERY_RECEIPT" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/manual-backup-recovery-preflight"
      - name: Checkout the governed release source
        run: |
          SOURCE_SHA="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline/manifest.json"
          print(json.loads(path.read_text(encoding="utf-8"))["source"]["gitSha"])
          PY
          )"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
      - name: Validate prod plane SSH credentials
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          case "${{ github.event.inputs.step }}" in
            5) STAGE=gray-initial ;;
            25) STAGE=carry-on ;;
            100) STAGE=full ;;
            *) echo "unsupported rollout step" >&2; exit 2 ;;
          esac
          python3 quwoquan_ops/cli/prod/validate_prod_plane_credentials.py --stage "$STAGE"
      - name: Unpack service package config evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest.get("releaseFiles", {}).values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
      - name: Login immutable image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy via stackctl
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
          PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
        run: |
          eval "$(python3 quwoquan_ops/cli/prod/resolve_prod_release_state.py --output-format shell)"
          eval "$(python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path
          path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline/manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          print(f"TARGET_IMAGE={shlex.quote(str(manifest['versions']['imageVersion']))}")
          print(f"TARGET_CONFIG={shlex.quote(str(manifest['versions']['configVersion']))}")
          PY
          )"
          case "${{ github.event.inputs.step }}" in
            5) STAGE=gray-initial ;;
            25) STAGE=carry-on ;;
            100) STAGE=full ;;
          esac
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ github.event.inputs.cloud_provider }}" \
            --service prod-stack \
            --from-image "$RESOLVED_FROM_IMAGE" \
            --to-image "$TARGET_IMAGE" \
            --from-config "$RESOLVED_FROM_CONFIG" \
            --to-config "$TARGET_CONFIG" \
            --stage "$STAGE" \
            --step "${{ github.event.inputs.step }}" \
            --dry-run "${{ github.event.inputs.dry_run }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/manual-gray-${{ github.event.inputs.step }}"
