# 半自动灰度到 prod：workflow_dispatch，单步灰度 + SLO 卡点
# 设计见 deploy/shared/deploy_prod_design.md
# 版本号来源与灰度对象（整颗 seed-box）见 deploy/shared/deliver_to_production_runbook.md §3.4、§6.0
name: 06. Deploy To Prod (Gray)

on:
  workflow_dispatch:
    inputs:
      # 灰度对象固定为整颗 seed-box（Go + recommendation 两容器一起），不按服务区分
      cloud_provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options:
          - aliyun
          - volcengine
          - huaweicloud
      # 留空则从 state/release/seed-box.state 自动读取（每天新版本时只需填 target）
      from_image:
        description: 'Current prod image (empty = auto from state/release/seed-box.state)'
        required: false
      to_image:
        description: 'Target image version (must match pre-release integration)'
        required: true
      from_config:
        description: 'Current prod config (empty = auto from state/release/seed-box.state)'
        required: false
      to_config:
        description: 'Target config version (must match pre-release integration)'
        required: true
      step:
        description: 'Gray step (50=initial, 100=full for 2 replicas)'
        required: true
        type: choice
        options:
          - '50'
          - '100'
      error_rate:
        description: 'SLO: error rate (e.g. 0.005)'
        required: true
        default: '0.005'
      p95_ms:
        description: 'SLO: P95 latency ms'
        required: true
        default: '100'
      redis_error_rate:
        description: 'SLO: Redis error rate'
        required: true
        default: '0'
      dry_run:
        description: 'Dry run (no prod apply)'
        required: false
        default: true
        type: boolean

jobs:
  resolve-versions:
    name: Resolve current prod versions
    runs-on: ubuntu-latest
    outputs:
      from_image: ${{ steps.resolve.outputs.from_image }}
      from_config: ${{ steps.resolve.outputs.from_config }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          SERVICE="seed-box"
          FROM_IMG="${{ github.event.inputs.from_image }}"
          FROM_CFG="${{ github.event.inputs.from_config }}"
          STATE="state/release/${SERVICE}.state"
          if [[ -z "$FROM_IMG" || -z "$FROM_CFG" ]]; then
            if [[ ! -f "$STATE" ]]; then
              echo "::error::Current prod version needed but state/release/$SERVICE.state not found. Either fill 'Current prod' fields or run first rollout with them set."
              exit 1
            fi
            FROM_IMG=$(awk -F= '/^to_image=/{print $2; exit}' "$STATE")
            FROM_CFG=$(awk -F= '/^to_config=/{print $2; exit}' "$STATE")
            echo "Resolved from state/release/$SERVICE.state: from_image=$FROM_IMG from_config=$FROM_CFG"
          fi
          echo "from_image=$FROM_IMG" >> $GITHUB_OUTPUT
          echo "from_config=$FROM_CFG" >> $GITHUB_OUTPUT

  validate:
    name: Validate step & config
    needs: resolve-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate release snapshot locally
        run: |
          rm -rf .mainline-release-artifact
          python3 agent_ops/deploy/prod/generate_mainline_release_artifact.py \
            --output-dir .mainline-release-artifact \
            --git-sha "${GITHUB_SHA}" \
            --run-number "${{ github.run_number }}" \
            --repository "${{ github.repository }}" \
            --registry "${{ env.REGISTRY || 'ghcr.io' }}" \
            --image-version "${{ github.event.inputs.to_image }}" \
            --config-version "${{ github.event.inputs.to_config }}"
      - name: Unpack generated release snapshots
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path(".mainline-release-artifact")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest.get("releaseFiles", {}).values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
      - name: Check config file exists
        run: |
          cfg="releases/config/seed-box/${{ github.event.inputs.to_config }}.yaml"
          if [[ ! -f "$cfg" ]]; then
            echo "FAIL: config not found: $cfg"
            exit 1
          fi
      - name: Check step sequence
        run: |
          state="state/release/seed-box.state"
          prev=0
          prev_target_image=""
          prev_target_config=""
          if [[ -f "$state" ]]; then
            prev=$(awk -F= '/^step=/{print $2}' "$state" || echo 0)
            prev_target_image=$(awk -F= '/^to_image=/{print $2; exit}' "$state" || true)
            prev_target_config=$(awk -F= '/^to_config=/{print $2; exit}' "$state" || true)
          fi
          step=${{ github.event.inputs.step }}
          if [[ "$prev_target_image" != "${{ github.event.inputs.to_image }}" || "$prev_target_config" != "${{ github.event.inputs.to_config }}" ]]; then
            prev=0
          fi
          if [[ "$prev" -gt "$step" ]]; then
            echo "FAIL: step cannot go backwards (prev=$prev, next=$step)"
            exit 1
          fi

  stackctl-deploy:
    name: Stackctl deploy prod gray
    needs: [validate, resolve-versions]
    runs-on: [self-hosted, macOS]
    # 去 root · 按平面 SSH 凭据（退役单一全权 PROD_KUBECONFIG）。
    steps:
      - uses: actions/checkout@v4
      - name: Validate prod plane SSH credentials
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          STAGE=gray-initial
          [ "${{ github.event.inputs.step }}" = "100" ] && STAGE=full
          python3 agent_ops/deploy/prod/validate_prod_plane_credentials.py --stage "$STAGE"
      - name: Regenerate release snapshot locally
        run: |
          rm -rf .mainline-release-artifact
          python3 agent_ops/deploy/prod/generate_mainline_release_artifact.py \
            --output-dir .mainline-release-artifact \
            --git-sha "${GITHUB_SHA}" \
            --run-number "${{ github.run_number }}" \
            --repository "${{ github.repository }}" \
            --registry "ghcr.io" \
            --image-version "${{ github.event.inputs.to_image }}" \
            --config-version "${{ github.event.inputs.to_config }}"
      - name: Unpack generated release snapshots
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path(".mainline-release-artifact")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest.get("releaseFiles", {}).values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
      - name: Deploy via stackctl
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
        run: |
          python3 agent_ops/deploy/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ github.event.inputs.cloud_provider }}" \
            --service seed-box \
            --from-image "${{ needs.resolve-versions.outputs.from_image }}" \
            --to-image "${{ github.event.inputs.to_image }}" \
            --from-config "${{ needs.resolve-versions.outputs.from_config }}" \
            --to-config "${{ github.event.inputs.to_config }}" \
            --step "${{ github.event.inputs.step }}" \
            --dry-run "${{ github.event.inputs.dry_run }}" \
            --error-rate "${{ github.event.inputs.error_rate }}" \
            --p95-ms "${{ github.event.inputs.p95_ms }}" \
            --redis-error-rate "${{ github.event.inputs.redis_error_rate }}"
