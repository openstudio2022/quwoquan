# Manual, non-promotable first-party container rehearsal. The canonical target
# remains prod-hosted; mode=prevalidate creates the isolated prod-sim namespace
# and is forbidden from writing rollout ledger/receipt evidence.
name: 06. Prod-Sim Manual Admission

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit SHA
        required: true
      release_evidence_ref:
        description: Exact deployable ReleaseEvidenceManifest OCI ref
        required: true

concurrency:
  group: prod-sim-manual-admission
  cancel-in-progress: false

permissions:
  contents: read

env:
  QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output

jobs:
  prod_sim_admission:
    name: Non-promotable prod-sim first-party prevalidation
    runs-on: [self-hosted, macOS, ARM64]
    environment: prod-sim-admission
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      packages: read
    outputs:
      prod_sim_receipt_base64: ${{ steps.prod_sim_receipt.outputs.receipt_base64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Require exact reviewed main source
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if [[ "$SOURCE_SHA" != "${{ inputs.source_sha }}" ]] || \
             [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::GATE_BLOCK: prod-sim admission requires an exact commit reachable from main"
            exit 2
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::GATE_BLOCK: prod-sim admission source checkout must be clean"
            exit 2
          fi
      - name: Login immutable release registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx for release evidence verification
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: candidate
        name: Verify deployable manifest, OIDC and artifact closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$QWQ_OUTPUT_ROOT/env/prod/runs/prod-sim-admission/release"
          python3 quwoquan_ops/ci/consume_released_release_evidence.py \
            --ref "${{ inputs.release_evidence_ref }}" \
            --repository "${{ github.repository }}" \
            --require-status deployable \
            --expected-source-sha "${{ inputs.source_sha }}" \
            --output-dir "$ROOT" \
            --github-output "$GITHUB_OUTPUT"
      - name: Materialize isolated prevalidation SSH credentials
        env:
          EDGE_KEY_MATERIAL: ${{ secrets.PROD_EDGE_SSH_KEY }}
          KEY_MATERIAL: ${{ secrets.PROD_SERVICE_SSH_KEY }}
        run: |
          set -euo pipefail
          for material in "$EDGE_KEY_MATERIAL" "$KEY_MATERIAL"; do
            if [[ -z "$material" || "$material" != *"PRIVATE KEY"* ]]; then
              echo "::error::GATE_BLOCK: prod-sim admission SSH key material is missing"
              exit 2
            fi
          done
          EDGE_KEY_FILE="$RUNNER_TEMP/prod-sim-edge-ssh-key"
          KEY_FILE="$RUNNER_TEMP/prod-sim-service-ssh-key"
          (umask 077 && printf '%s\n' "$EDGE_KEY_MATERIAL" > "$EDGE_KEY_FILE")
          (umask 077 && printf '%s\n' "$KEY_MATERIAL" > "$KEY_FILE")
          echo "PROD_EDGE_SSH_KEY_FILE=$EDGE_KEY_FILE" >> "$GITHUB_ENV"
          echo "PROD_SERVICE_SSH_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Run non-promotable isolated first-party prevalidation
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --mode prevalidate \
            --data-mode isolated \
            --prevalidate-scope first-party \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/prod/runs/prod-sim-admission/release/manifest.json" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/prod-sim-admission/prevalidate"
      - name: Prove the rehearsal cannot become release evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (
                  Path(os.environ["QWQ_OUTPUT_ROOT"])
                  / "env/prod/runs/prod-sim-admission/prevalidate/report.json"
              ).read_text(encoding="utf-8")
          )
          if report.get("schema") != "prod-hosted-first-party-prevalidation-report":
              raise SystemExit("GATE_BLOCK: prod-sim prevalidation report schema drifted")
          if report.get("mode") != "prevalidate" or report.get("dataMode") != "isolated":
              raise SystemExit("GATE_BLOCK: prod-sim did not use isolated prevalidation")
          if (report.get("containerDeployment") or {}).get("status") != "passed":
              raise SystemExit("GATE_BLOCK: prod-sim first-party containers did not pass")
          if (report.get("releaseEligibility") or {}).get("status") != "GATE_BLOCK":
              raise SystemExit("GATE_BLOCK: prod-sim evidence must remain non-promotable")
          PY
          {
            echo "## Prod-sim manual admission"
            echo "- candidate: \`${{ steps.candidate.outputs.candidate_digest }}\`"
            echo "- container deployment: \`passed\`"
            echo "- release eligibility: \`GATE_BLOCK (non-promotable by contract)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: prod_sim_receipt
        name: Bind and verify canonical prod-sim report
        run: |
          set -euo pipefail
          REPORT="$QWQ_OUTPUT_ROOT/env/prod/runs/prod-sim-admission/prevalidate/report.json"
          MANIFEST="$QWQ_OUTPUT_ROOT/env/prod/runs/prod-sim-admission/release/manifest.json"
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py bind-prod-sim \
            --report "$REPORT" \
            --manifest "$MANIFEST" \
            --expected-candidate "${{ steps.candidate.outputs.candidate_digest }}" \
            --expected-artifact-digest "${{ steps.candidate.outputs.artifact_digest }}" \
            --expected-source-sha "${{ inputs.source_sha }}" \
            --github-output "$GITHUB_OUTPUT"
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py verify-prod-sim \
            --receipt "$REPORT"
      - name: Upload non-authoritative prod-sim diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prod-sim-manual-admission-${{ github.run_id }}
          path: ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/prod-sim-admission
          retention-days: 1

  attest_prod_sim_report:
    name: Attest exact passed non-promotable prod-sim report
    needs: prod_sim_admission
    if: ${{ needs.prod_sim_admission.result == 'success' && needs.prod_sim_admission.outputs.prod_sim_receipt_base64 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RECEIPT_BASE64: ${{ needs.prod_sim_admission.outputs.prod_sim_receipt_base64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_sha }}
          clean: false
          persist-credentials: false
      - name: Initialize runner-local prod-sim receipt path
        run: echo "RECEIPT_PATH=$RUNNER_TEMP/prod-hosted-first-party-prevalidation-report.json" >> "$GITHUB_ENV"
      - name: Materialize exact prod-sim report bytes
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RECEIPT_PATH"]).write_bytes(
              base64.b64decode(os.environ["RECEIPT_BASE64"], validate=True)
          )
          PY
      - name: Verify passed non-promotable prod-sim report bindings
        run: |
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py verify-prod-sim \
            --receipt "$RECEIPT_PATH"
      - name: Attest exact prod-sim report bytes
        uses: actions/attest@f7c2b2a3f1986639bb3d0d22cb88d0e5e1d2c749
        with:
          subject-path: ${{ env.RECEIPT_PATH }}
