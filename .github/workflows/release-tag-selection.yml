# Unique create-only controller. An immutable admission intent must pass before
# any local tag object or remote ref mutation. Canonical logic: release_tag_admission.py. Final AdmissionFact is issued
# only after Hosted creator/ruleset readback binds the actual annotated object.
# Controller identity = 仓库 deploy key `release-controller`（tag ruleset 只给 DeployKey 留 bypass）；
# 全部 readback 走 GitHub REST（GITHUB_TOKEN 只读），由 release_tag_readback.py 归约为 canonical 事实。
name: 07. Release Tag Selection

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag_kind:
        description: rc or stable
        required: true
        type: choice
        options: [rc, stable]
      tag_name:
        description: Strict vMAJOR.MINOR.PATCH[-rc.N]
        required: true
        type: string
      source_git_sha:
        description: Exact main-reachable source commit
        required: true
        type: string
      selection_fact_ref:
        description: RC selection or stable product authority OCI @sha256 ref
        required: true
        type: string
      initial_release_authority_ref:
        description: Exact initial-release authority OCI @sha256 ref when required
        required: false
        default: ''
        type: string
      selected_rc_admission_ref:
        description: Stable only, exact RC AdmissionFact OCI @sha256 ref
        required: false
        default: ''
        type: string
      qualification_fact_ref:
        description: Stable only, exact QualificationFact OCI @sha256 ref
        required: false
        default: ''
        type: string
      release_authority_fact_ref:
        description: Stable only, exact release authority OCI @sha256 ref
        required: false
        default: ''
        type: string

concurrency:
  group: release-tag-controller
  cancel-in-progress: false

env:
  CONTROLLER_TITLE: release-controller

jobs:
  pre_admission:
    name: Seal exact admission intent before mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-selection
    permissions: {contents: read, packages: write, id-token: write}
    outputs:
      intent_ref: ${{ steps.publish.outputs.intent_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - id: admit
        name: Validate all authorities and seal create-once intent
        env:
          STORE: ${{ runner.temp }}/release-control
          KIND: ${{ inputs.tag_kind }}
          TAG: ${{ inputs.tag_name }}
          SOURCE_SHA: ${{ inputs.source_git_sha }}
          SELECTION: ${{ inputs.selection_fact_ref }}
          RC_ADMISSION: ${{ inputs.selected_rc_admission_ref }}
          QUALIFICATION: ${{ inputs.qualification_fact_ref }}
          RELEASE_AUTHORITY: ${{ inputs.release_authority_fact_ref }}
          INITIAL_AUTHORITY: ${{ inputs.initial_release_authority_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          materialize_fact() {
            exact_ref="$1"
            [[ "$exact_ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
              --ref "$exact_ref" --output-file "$STORE/$exact_ref" >/dev/null
            local_digest="sha256:$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$STORE/$exact_ref")"
            printf '%s=%s\n' "$exact_ref" "$local_digest"
          }
          # ---- hosted readback（只读 REST）：deploy key、tag ref 缺失、两条 tag ruleset ----
          READBACK="$RUNNER_TEMP/hosted"
          mkdir -p "$READBACK" "$STORE/readback"
          gh api "/repos/${GITHUB_REPOSITORY}/keys" > "$READBACK/keys.json"
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > "$READBACK/ref-before.json" 2>/dev/null; then
            echo "GATE_BLOCK: refs/tags/$TAG already exists on hosted" >&2
            exit 1
          fi
          rm -f "$READBACK/ref-before.json"
          gh api "/repos/${GITHUB_REPOSITORY}/rulesets" --jq '[.[].id]' > "$READBACK/ruleset-ids.json"
          python3 - "$READBACK" "$GITHUB_REPOSITORY" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root, repository = Path(sys.argv[1]), sys.argv[2]
          rulesets, etags = [], {}
          for ruleset_id in json.loads((root / "ruleset-ids.json").read_text(encoding="utf-8")):
              raw = subprocess.run(["gh", "api", "-i", f"/repos/{repository}/rulesets/{ruleset_id}"], check=True, text=True, capture_output=True).stdout
              head, _, body = raw.replace("\r\n", "\n").partition("\n\n")
              etag = next((line.split(":", 1)[1].strip() for line in head.splitlines() if line.lower().startswith("etag:")), "")
              rulesets.append(json.loads(body))
              etags[str(ruleset_id)] = etag
          (root / "rulesets.json").write_text(json.dumps(rulesets, sort_keys=True) + "\n", encoding="utf-8")
          (root / "etags.json").write_text(json.dumps(etags, sort_keys=True) + "\n", encoding="utf-8")
          PY
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -B quwoquan_ops/ci/release_tag_readback.py --repository "$GITHUB_REPOSITORY" --tag-name "$TAG" \
            --phase pre_mutation --keys-file "$READBACK/keys.json" --controller-title "$CONTROLLER_TITLE" \
            --observed-at "$OBSERVED_AT" --output "$STORE/readback/$TAG-creator-before.json" creator \
            > "$RUNNER_TEMP/creator-before.json"
          python3 -B quwoquan_ops/ci/release_tag_readback.py --repository "$GITHUB_REPOSITORY" --tag-name "$TAG" \
            --phase pre_mutation --keys-file "$READBACK/keys.json" --controller-title "$CONTROLLER_TITLE" \
            --observed-at "$OBSERVED_AT" --output "$STORE/readback/$TAG-ruleset-before.json" ruleset \
            --rulesets-file "$READBACK/rulesets.json" --etags-file "$READBACK/etags.json" \
            > "$RUNNER_TEMP/ruleset-before.json"
          KEY_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["producer"]["keyId"])' < "$RUNNER_TEMP/creator-before.json")"
          KEY_FINGERPRINT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["producer"]["fingerprint"])' < "$RUNNER_TEMP/creator-before.json")"
          PRE_CREATOR_EXACT="readback/$TAG-creator-before.json=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' < "$RUNNER_TEMP/creator-before.json")"
          PRE_RULESET_EXACT="readback/$TAG-ruleset-before.json=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' < "$RUNNER_TEMP/ruleset-before.json")"
          # The single release-selection environment plus this controller's
          # concurrency lock is the create-once reservation authority. Seal it
          # as exact local bytes before validating the mutation intent.
          RESERVATION_FILE="$STORE/reservation/$TAG.json"
          mkdir -p "$(dirname "$RESERVATION_FILE")"
          python3 - "$RESERVATION_FILE" "$TAG" "$KIND" "$SOURCE_SHA" <<'PY'
          import json, pathlib, subprocess, sys
          tree = subprocess.check_output(
              ["git", "show", "-s", "--format=%T", sys.argv[4]], text=True,
          ).strip()
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "schema": "quwoquan_ops.release_tag_reservation_fact.v1",
              "status": "reserved", "tagName": sys.argv[2],
              "tagKind": sys.argv[3], "sourceGitSha": sys.argv[4],
              "sourceTree": tree,
          }, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          RESERVATION_EXACT="reservation/$TAG.json=sha256:$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$RESERVATION_FILE")"
          SELECTION_EXACT="$(materialize_fact "$SELECTION")"
          INITIAL_ARGS=()
          if [[ -n "$INITIAL_AUTHORITY" ]]; then
            INITIAL_EXACT="$(materialize_fact "$INITIAL_AUTHORITY")"
            INITIAL_ARGS=(--initial-release-authority "$INITIAL_EXACT")
          fi
          case "$KIND" in
            rc)
              [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]
              test -z "$RC_ADMISSION$QUALIFICATION$RELEASE_AUTHORITY"
              RESULT="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" tag-admit-rc-intent \
                --tag-name "$TAG" --source-git-sha "$SOURCE_SHA" --reservation "$RESERVATION_EXACT" \
                --selection "$SELECTION_EXACT" --creator-readback "$PRE_CREATOR_EXACT" \
                --ruleset-readback "$PRE_RULESET_EXACT" --repository "$GITHUB_REPOSITORY" \
                --controller-key-id "$KEY_ID" --controller-key-title "$CONTROLLER_TITLE" \
                --controller-key-fingerprint "$KEY_FINGERPRINT" \
                "${INITIAL_ARGS[@]}" --admitted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
              ;;
            stable)
              [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              RC_EXACT="$(materialize_fact "$RC_ADMISSION")"
              QUALIFICATION_EXACT="$(materialize_fact "$QUALIFICATION")"
              RELEASE_EXACT="$(materialize_fact "$RELEASE_AUTHORITY")"
              RESULT="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" tag-admit-stable-intent \
                --tag-name "$TAG" --source-git-sha "$SOURCE_SHA" --reservation "$RESERVATION_EXACT" \
                --selected-rc-admission "$RC_EXACT" --qualification "$QUALIFICATION_EXACT" \
                --product-authority "$SELECTION_EXACT" --release-authority "$RELEASE_EXACT" \
                --creator-readback "$PRE_CREATOR_EXACT" --ruleset-readback "$PRE_RULESET_EXACT" \
                --repository "$GITHUB_REPOSITORY" --controller-key-id "$KEY_ID" \
                --controller-key-title "$CONTROLLER_TITLE" --controller-key-fingerprint "$KEY_FINGERPRINT" \
                "${INITIAL_ARGS[@]}" --admitted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
              ;;
            *) exit 2 ;;
          esac
          INTENT_LOCAL_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' <<<"$RESULT")"
          echo "intent_local_ref=$INTENT_LOCAL_REF" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publish exact pre-mutation admission intent
        env:
          STORE: ${{ runner.temp }}/release-control
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "$STORE/${{ steps.admit.outputs.intent_local_ref }}" \
            --repository "ghcr.io/${{ github.repository }}/release-tag-intent" \
            --transport-tag "run-${{ github.run_id }}-${{ github.run_attempt }}" > "$RUNNER_TEMP/tag-intent-oci.json"
          REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/tag-intent-oci.json")"
          echo "intent_ref=$REF" >> "$GITHUB_OUTPUT"

  create_and_readback:
    name: Create once and finalize immutable admission
    needs: [pre_admission]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-selection
    permissions: {contents: read, packages: write, id-token: write}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - id: transact
        name: Consume intent, mutate once via controller deploy key, read back, finalize
        env:
          STORE: ${{ runner.temp }}/release-control
          KIND: ${{ inputs.tag_kind }}
          TAG: ${{ inputs.tag_name }}
          SOURCE_SHA: ${{ inputs.source_git_sha }}
          INTENT: ${{ needs.pre_admission.outputs.intent_ref }}
          RELEASE_CONTROLLER_DEPLOY_KEY: ${{ secrets.RELEASE_CONTROLLER_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          materialize_fact() {
            exact_ref="$1"
            [[ "$exact_ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
              --ref "$exact_ref" --output-file "$STORE/$exact_ref" >/dev/null
            local_digest="sha256:$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$STORE/$exact_ref")"
            printf '%s=%s\n' "$exact_ref" "$local_digest"
          }
          INTENT_EXACT="$(materialize_fact "$INTENT")"
          python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" tag-admission-intent-check \
            --tag-kind "$KIND" --tag-name "$TAG" --intent "$INTENT_EXACT" >/dev/null
          READBACK="$RUNNER_TEMP/hosted"
          mkdir -p "$READBACK" "$STORE/readback"
          gh api "/repos/${GITHUB_REPOSITORY}/keys" > "$READBACK/keys.json"
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > "$READBACK/ref-before.json" 2>/dev/null; then
            echo "GATE_BLOCK: refs/tags/$TAG already exists before mutation" >&2
            exit 1
          fi
          # ---- controller 身份：deploy key 私钥只在此 step 短时物化，tagger 就是 controller title ----
          [[ "$RELEASE_CONTROLLER_DEPLOY_KEY" == *"PRIVATE KEY"* ]] || {
            echo 'GATE_BLOCK: RELEASE_CONTROLLER_DEPLOY_KEY is unavailable' >&2
            exit 1
          }
          KEY_FILE="$RUNNER_TEMP/release-controller-key"
          (umask 077 && printf '%s\n' "$RELEASE_CONTROLLER_DEPLOY_KEY" > "$KEY_FILE")
          LOCAL_FINGERPRINT="$(ssh-keygen -lf "$KEY_FILE" | awk '{print $2}')"
          HOSTED_FINGERPRINT="$(python3 -B - "$READBACK/keys.json" "$CONTROLLER_TITLE" <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from quwoquan_ops.ci.release_tag_readback import controller_key
          print(controller_key(json.load(open(sys.argv[1], encoding="utf-8")), title=sys.argv[2])["fingerprint"])
          PY
          )"
          test "$LOCAL_FINGERPRINT" = "$HOSTED_FINGERPRINT" || {
            echo 'GATE_BLOCK: RELEASE_CONTROLLER_DEPLOY_KEY does not match the hosted release-controller deploy key' >&2
            exit 1
          }
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config user.name "$CONTROLLER_TITLE"
          git config user.email "release-controller@example.invalid"
          git remote set-url origin "ssh://git@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          mutation_failed() {
            set +e
            FAILURE_RESULT="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" tag-mutation-outcome \
              --tag-kind "$KIND" --tag-name "$TAG" --intent "$INTENT_EXACT" --status failed \
              --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
            if [[ $? -eq 0 ]]; then
              FAILURE_LOCAL_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' <<<"$FAILURE_RESULT")"
              python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
                --fact-file "$STORE/$FAILURE_LOCAL_REF" \
                --repository "ghcr.io/${GITHUB_REPOSITORY}/release-tag-mutation-outcome" \
                --transport-tag "failed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
            fi
          }
          trap mutation_failed ERR
          # 先记 outcome 的 create-once 身份（intent 绑定），再把它写进 annotated tag message：
          # tag 对象本身就携带 outcome 绑定，REST 读回即可证明"这个对象就是这次 mutation 创建的"。
          INTENT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["intentId"])' < "$STORE/${INTENT_EXACT%%=*}")"
          # checkout may already contain the exact local tag. Accept only an
          # annotated object that peels to SOURCE_SHA; never overwrite it.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git cat-file -t "refs/tags/$TAG")" = tag
            test "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA"
          else
            git tag -a "$TAG" "$SOURCE_SHA" -m "$TAG" -m "release-tag-intent: $INTENT_ID"
          fi
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > "$READBACK/ref-after.json"
          REMOTE_OBJECT_OID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' < "$READBACK/ref-after.json")"
          [[ "$REMOTE_OBJECT_OID" =~ ^[0-9a-f]{40}$ ]]
          gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_OBJECT_OID}" > "$READBACK/tag-object-after.json"
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])' < "$READBACK/tag-object-after.json")" = commit
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' < "$READBACK/tag-object-after.json")" = "$SOURCE_SHA"
          TAG_OBJECT_OID="$(git rev-parse "refs/tags/$TAG")"
          test "$TAG_OBJECT_OID" = "$REMOTE_OBJECT_OID"
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          OUTCOME_RESULT="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" tag-mutation-outcome \
            --tag-kind "$KIND" --tag-name "$TAG" --intent "$INTENT_EXACT" --status created \
            --tag-object-oid "$TAG_OBJECT_OID" --peeled-commit "$SOURCE_SHA" \
            --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          OUTCOME_LOCAL_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' <<<"$OUTCOME_RESULT")"
          OUTCOME_EXACT="$OUTCOME_LOCAL_REF=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' <<<"$OUTCOME_RESULT")"
          gh api "/repos/${GITHUB_REPOSITORY}/rulesets" --jq '[.[].id]' > "$READBACK/ruleset-ids.json"
          python3 - "$READBACK" "$GITHUB_REPOSITORY" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root, repository = Path(sys.argv[1]), sys.argv[2]
          rulesets, etags = [], {}
          for ruleset_id in json.loads((root / "ruleset-ids.json").read_text(encoding="utf-8")):
              raw = subprocess.run(["gh", "api", "-i", f"/repos/{repository}/rulesets/{ruleset_id}"], check=True, text=True, capture_output=True).stdout
              head, _, body = raw.replace("\r\n", "\n").partition("\n\n")
              etag = next((line.split(":", 1)[1].strip() for line in head.splitlines() if line.lower().startswith("etag:")), "")
              rulesets.append(json.loads(body))
              etags[str(ruleset_id)] = etag
          (root / "rulesets.json").write_text(json.dumps(rulesets, sort_keys=True) + "\n", encoding="utf-8")
          (root / "etags.json").write_text(json.dumps(etags, sort_keys=True) + "\n", encoding="utf-8")
          PY
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -B quwoquan_ops/ci/release_tag_readback.py --repository "$GITHUB_REPOSITORY" --tag-name "$TAG" \
            --phase post_mutation --keys-file "$READBACK/keys.json" --controller-title "$CONTROLLER_TITLE" \
            --observed-at "$OBSERVED_AT" --output "$STORE/readback/$TAG-creator-after.json" creator \
            --ref-file "$READBACK/ref-after.json" --tag-object-file "$READBACK/tag-object-after.json" \
            > "$RUNNER_TEMP/creator-after.json"
          python3 -B quwoquan_ops/ci/release_tag_readback.py --repository "$GITHUB_REPOSITORY" --tag-name "$TAG" \
            --phase post_mutation --keys-file "$READBACK/keys.json" --controller-title "$CONTROLLER_TITLE" \
            --observed-at "$OBSERVED_AT" --output "$STORE/readback/$TAG-ruleset-after.json" ruleset \
            --rulesets-file "$READBACK/rulesets.json" --etags-file "$READBACK/etags.json" \
            --tag-object-oid "$TAG_OBJECT_OID" --peeled-commit "$SOURCE_SHA" \
            > "$RUNNER_TEMP/ruleset-after.json"
          CREATOR_EXACT="readback/$TAG-creator-after.json=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' < "$RUNNER_TEMP/creator-after.json")"
          RULESET_EXACT="readback/$TAG-ruleset-after.json=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' < "$RUNNER_TEMP/ruleset-after.json")"
          FINAL="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" "tag-admit-$KIND-finalize" \
            --tag-name "$TAG" --intent "$INTENT_EXACT" --mutation-outcome "$OUTCOME_EXACT" \
            --creator-readback "$CREATOR_EXACT" --ruleset-readback "$RULESET_EXACT" \
            --admitted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          echo "admission_local_ref=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' <<<"$FINAL")" >> "$GITHUB_OUTPUT"
          trap - ERR
          rm -f "$KEY_FILE"
      - name: Publish final immutable ReleaseTagAdmissionFact
        env:
          STORE: ${{ runner.temp }}/release-control
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "$STORE/${{ steps.transact.outputs.admission_local_ref }}" \
            --repository "ghcr.io/${{ github.repository }}/release-tag-admission" \
            --transport-tag "${{ inputs.tag_kind }}-${{ inputs.tag_name }}" > "$RUNNER_TEMP/tag-admission-oci.json"
          echo "ReleaseTagAdmissionFact exact OCI: $(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/tag-admission-oci.json")" >> "$GITHUB_STEP_SUMMARY"
