# 原 Lane Gate 检查集合已由本地 accept 的 canonical push readiness 执行。
# 此入口只手动读回 dev 防删/防非 FF，不是 required check 或 Alpha 资格证明。
name: 04. Dev Protection Readback

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: dev-protection-readback-${{ github.ref }}
  cancel-in-progress: false

env:
  QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  readback:
    name: Dev Protection Readback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned readback dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Read dev deletion and non-fast-forward protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B quwoquan_ops/ci/verify_hosted_integration_ruleset.py \
            --repository "$GITHUB_REPOSITORY" \
            --output "$QWQ_OUTPUT_ROOT/env/repo/runs/dev-protection/hosted-integration-ruleset.json"
          echo 'Dev protection readback only; local accept/bundle/integrate/hook enforce acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Hosted Alpha enforcement is not implemented; ordinary authorized credentials can fast-forward dev.' >> "$GITHUB_STEP_SUMMARY"
