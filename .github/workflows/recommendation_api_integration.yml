# N2-1：推荐面 api_integration 的 CI 执行点。
#
# 此前 premium_pool_event_chain / post_behavior_contract 等 api_integration
# 测试无任何 workflow 调用方（只能本地手跑）。content-service 的
# api_integration 通过 testcontainers 自管 Mongo/Redis，GitHub-hosted runner
# 的 Docker 即可承载，无需 self-hosted 环境。
#
# recommendation-service 自身的 pytest api_integration（排序窗口真实
# uvicorn 传输、候选/特征投影、serving API、事实落库）由第二个 job 承载：
# 真实 mongod 副本集（docker）+ 真实 redis-server（apt 二进制，fixture 自拉起）。
name: "Recommendation API Integration"

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *" # 每日 UTC 19:30（北京 03:30），错峰 ML 训练管线
  pull_request:
    paths:
      - "quwoquan_service/services/content-service/**"
      - "quwoquan_service/services/recommendation-service/**"
      - "quwoquan_service/runtime/recommendation/**"
      - "quwoquan_service/runtime/recpolicy/**"
      - ".github/workflows/recommendation_api_integration.yml"

env:
  QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output

jobs:
  content-service-api-integration:
    name: "content-service api_integration (testcontainers)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: quwoquan_service
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: quwoquan_service/go.mod
          cache: false
      - name: 缓存 Go 模块
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/go/pkg/mod
          key: go-mod-api-integration-${{ runner.os }}-${{ hashFiles('quwoquan_service/go.sum') }}
          restore-keys: |
            go-mod-api-integration-${{ runner.os }}-
          # Pull-request cache scopes are isolated by GitHub. They may restore
          # the default-branch cache, but must not create a new per-PR copy.
          lookup-only: ${{ github.event_name == 'pull_request' }}
      - name: Run content-service api_integration
        run: |
          go test ./services/content-service/tests/api_integration/content/post/ -count=1 -timeout 30m -v 2>&1 | tee api_integration.log
      - name: Assert recommendation-critical tests executed
        run: |
          # 防回归：premium 事件链与 behavior 契约必须真实执行（不是被 skip）。
          for required in \
            TestPremiumPoolEventChainServesAndEjectsPremiumFeed \
            TestBehaviorBatchAssistantInterestProjectsTagInteraction \
            TestBehaviorBatchSevenStateImpressionExcludesVisibleCountsClick \
            TestBehaviorBatchRejectsLike \
            TestCommentStore_AuthoritativeCountsNoCache; do
            if ! grep -q "PASS: ${required}" api_integration.log; then
              echo "required api_integration test ${required} did not pass"
              exit 1
            fi
          done
      - name: Upload log
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recommendation-api-integration-log
          path: quwoquan_service/api_integration.log
          retention-days: 3

  recommendation-service-api-integration:
    name: "recommendation-service api_integration (pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quwoquan_service/services/recommendation-service
    env:
      QWQ_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install redis-server binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl stop redis-server || true
      - name: Start MongoDB replica set
        run: |
          docker run -d --name qwq-rec-mongo -p 27017:27017 mongo:7-jammy \
            --replSet rs0 --bind_ip_all
          for _ in $(seq 1 60); do
            if docker exec qwq-rec-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec qwq-rec-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for _ in $(seq 1 60); do
            if docker exec qwq-rec-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              break
            fi
            sleep 1
          done
      - name: Install Python dependencies
        run: |
          pip install \
            -r internal/recommendation/recommendation_model_release/infrastructure/model_runtime/requirements.txt \
            -r resources/coverage-toolchain.lock
      - name: Run recommendation-service api_integration
        run: |
          python -B -m pytest -o cache_dir="$QWQ_OUTPUT_ROOT/pytest-cache/recommendation-service" \
            -v tests/api_integration 2>&1 | tee rec_api_integration.log
      - name: Assert ranked-window real-transport tests executed
        run: |
          # 防回归：排序窗口真实传输与 serving 契约测试必须真实执行（不是被 skip）。
          for required in \
            test_ranked_window_create_and_continue_over_real_redis_and_mongo \
            test_ranked_window_rejects_unauthorized_conflict_and_missing_window \
            test_ranked_window_closes_and_erases_windows_for_closed_subject \
            test_metrics_exposes_http_series; do
            if ! grep -E "${required}.* PASSED" rec_api_integration.log >/dev/null; then
              echo "required api_integration test ${required} did not pass"
              exit 1
            fi
          done
      - name: Upload log
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recommendation-service-api-integration-log
          path: quwoquan_service/services/recommendation-service/rec_api_integration.log
          retention-days: 3
