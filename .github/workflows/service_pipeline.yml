# =============================================================================
# Service Pipeline — quwoquan_service CI/CD
# =============================================================================
# 触发条件：main 合入后的 quwoquan_service/**、quwoquan_ops/** 路径变动 / 手动
# 流程：Go 构建 + Python (recommendation-service) Docker 镜像 → kustomize/prod 部署清单校验
# 当前职责：构建服务镜像并校验发布清单；prod-hosted 发布由 prod rollout workflow 负责。
#
# 【必须配置的 GitHub Secrets】（部署时）
#   DOCKER_REGISTRY     — Docker 镜像仓库地址，如 ghcr.io
#   DOCKER_TOKEN        — 镜像仓库推送凭证
# =============================================================================

name: 02. Service Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'quwoquan_ops/**'
      - 'quwoquan_service/**'
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
  IMAGE_PREFIX: ${{ github.repository }}
  QWQ_OUTPUT_ROOT: .qwq_output
  # Go cache is intentionally assigned per job below under RUNNER_TEMP. Never
  # place read-only Go module files inside github.workspace: checkout clean
  # would make one self-hosted matrix job poison another job's workspace.
  # docker/build-push-action otherwise uploads one .dockerbuild Actions Artifact
  # for every matrix image. The immutable GHCR digest is the release input;
  # Build records are neither a deploy dependency nor useful durable evidence.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  prepare-release:
    name: Prepare mainline release coordinates
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      actions: read
    outputs:
      image_version: ${{ steps.versions.outputs.image_version }}
      config_version: ${{ steps.versions.outputs.config_version }}
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: false
      - name: Generate versions
        id: versions
        env:
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import os
          stamp = dt.datetime.now(dt.timezone.utc)
          run_number = os.environ["GITHUB_RUN_NUMBER_VALUE"]
          print(f"image_version=1.{stamp.strftime('%Y%m%d')}.{run_number}")
          print(f"config_version=v{stamp.strftime('%Y.%m.%d')}.{run_number}")
          PY
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  build-go:
    name: Go 构建与测试
    runs-on: [self-hosted, macOS, ARM64]
    needs: [prepare-release]
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    defaults:
      run:
        working-directory: quwoquan_service
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: false
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: 设置 job 隔离 Go 缓存
        run: |
          cache_root="${RUNNER_TEMP}/quwoquan-service-pipeline/${GITHUB_RUN_ID}"
          echo "GOCACHE=${cache_root}/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${cache_root}/go-mod" >> "$GITHUB_ENV"

      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: quwoquan_service/go.mod
          cache: false

      - name: Go 构建
        run: make build

      # L2 由 delivery-gate 负责，此处仅 build
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  build-release-images:
    name: 构建 ${{ matrix.service }} 不可变镜像
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, macOS, ARM64]
    needs: [prepare-release]
    permissions:
      contents: read
      packages: write
    strategy:
      # 单个 GHCR 传输瞬态不得取消尚未执行的服务；每个服务仍独立硬失败。
      fail-fast: false
      matrix:
        include:
          - service: recommendation-service
            image_name: recommendation-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/recommendation-service/build/Dockerfile
          - service: content-service
            image_name: content-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/content-service/build/Dockerfile
          - service: chat-service
            image_name: chat-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/chat-service/build/Dockerfile
          - service: user-service
            image_name: user-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/user-service/build/Dockerfile
          - service: assistant-service
            image_name: assistant-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/assistant-service/build/Dockerfile
          - service: product-ops-service
            image_name: product-ops-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/product-ops-service/build/Dockerfile
          - service: platform-ops-service
            image_name: platform-ops-service
            context: .
            dockerfile: quwoquan_service/control-plane/platform-ops/build/Dockerfile
          - service: tag-service
            image_name: tag-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/tag-service/build/Dockerfile
          - service: entity-service
            image_name: entity-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/entity-service/build/Dockerfile
          - service: integration-service
            image_name: integration-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/integration-service/build/Dockerfile
          - service: notification-service
            image_name: notification-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/notification-service/build/Dockerfile
          - service: circle-service
            image_name: circle-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/circle-service/build/Dockerfile
          - service: search-service
            image_name: search-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/search-service/build/Dockerfile
          - service: realtime-gateway
            image_name: realtime-gateway
            context: quwoquan_service
            dockerfile: quwoquan_service/services/realtime-gateway/build/Dockerfile
          - service: rtc-service
            image_name: rtc-service
            context: quwoquan_service
            dockerfile: quwoquan_service/services/rtc-service/build/Dockerfile
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 job 隔离 Docker 配置
        run: |
          docker_context="$(docker context show)"
          docker_host="$(docker context inspect "$docker_context" --format '{{.Endpoints.docker.Host}}')"
          if [[ -z "$docker_host" ]]; then
            echo "当前 Docker context 未提供 daemon endpoint" >&2
            exit 1
          fi
          DOCKER_HOST="$docker_host" docker version >/dev/null
          docker_config="${RUNNER_TEMP}/quwoquan-service-pipeline/${GITHUB_RUN_ID}/${{ matrix.service }}/docker-config"
          mkdir -p "$docker_config"
          echo "DOCKER_HOST=${docker_host}" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=${docker_config}" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: false
      - id: base_images
        name: Resolve governed builder base images
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          runtime = json.loads(
              Path("quwoquan_ops/environments/prod/runtime.yaml").read_text(
                  encoding="utf-8"
              )
          )
          images = runtime["targets"]["prod-hosted"]["buildImages"]
          for output, key in (
              ("go_base_image", "goBaseImage"),
              ("alpine_base_image", "alpineBaseImage"),
              ("python_base_image", "pythonBaseImage"),
          ):
              value = str(images.get(key) or "").strip()
              repository, separator, digest = value.rpartition("@sha256:")
              if not separator or not repository or len(digest) != 64:
                  raise SystemExit(f"governed build image {key} must use sha256 digest")
              print(f"{output}={value}")
          PY
      - id: qemu_attempt_1
        name: 设置 linux/amd64 QEMU（第 1 次）
        continue-on-error: true
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: docker.io/tonistiigi/binfmt@sha256:b4c6a09270133b3c5b4dff94f83067df4dd27eced195fc6a1dbad102999e24dd
          platforms: amd64
          cache-image: false
      - name: QEMU setup 退避（5 秒）
        if: ${{ steps.qemu_attempt_1.outcome == 'failure' }}
        run: sleep 5
      - id: qemu_attempt_2
        name: 设置 linux/amd64 QEMU（第 2 次）
        if: ${{ steps.qemu_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: docker.io/tonistiigi/binfmt@sha256:b4c6a09270133b3c5b4dff94f83067df4dd27eced195fc6a1dbad102999e24dd
          platforms: amd64
          cache-image: false
      - name: QEMU setup 退避（15 秒）
        if: ${{ steps.qemu_attempt_1.outcome == 'failure' && steps.qemu_attempt_2.outcome == 'failure' }}
        run: sleep 15
      - id: qemu_attempt_3
        name: 设置 linux/amd64 QEMU（第 3 次）
        if: ${{ steps.qemu_attempt_1.outcome == 'failure' && steps.qemu_attempt_2.outcome == 'failure' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: docker.io/tonistiigi/binfmt@sha256:b4c6a09270133b3c5b4dff94f83067df4dd27eced195fc6a1dbad102999e24dd
          platforms: amd64
          cache-image: false
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
      - name: 登录镜像仓库（重试瞬时网络失败）
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "GHCR login failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - id: image
        name: 构建、生成 SBOM/provenance 并推送（重试瞬时 GHCR OAuth EOF）
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
          BUILD_DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}:${{ needs.prepare-release.outputs.image_version }}
          GO_BASE_IMAGE: ${{ steps.base_images.outputs.go_base_image }}
          ALPINE_BASE_IMAGE: ${{ steps.base_images.outputs.alpine_base_image }}
          PYTHON_BASE_IMAGE: ${{ steps.base_images.outputs.python_base_image }}
        run: |
          set -o pipefail
          build_log="$(mktemp)"
          for attempt in 1 2 3; do
            set +e
            docker buildx build \
              --file "$BUILD_DOCKERFILE" \
              --platform linux/amd64 \
              --push \
              --tag "$IMAGE_TAG" \
              --build-arg "GO_BASE_IMAGE=$GO_BASE_IMAGE" \
              --build-arg "ALPINE_BASE_IMAGE=$ALPINE_BASE_IMAGE" \
              --build-arg "PYTHON_BASE_IMAGE=$PYTHON_BASE_IMAGE" \
              --attest type=sbom \
              --attest type=provenance,mode=max \
              "$BUILD_CONTEXT" 2>&1 | tee "$build_log"
            build_status="${PIPESTATUS[0]}"
            set -e
            if [[ "$build_status" == 0 ]]; then
              exit 0
            fi
            if ! grep -Eq 'failed to fetch oauth token:.*EOF|https://ghcr.io/(token|v2/).*EOF' "$build_log"; then
              exit "$build_status"
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "GHCR transient OAuth failure persisted after ${attempt} attempts" >&2
              exit "$build_status"
            fi
            sleep "$((attempt * 5))"
          done

  validate-deploy:
    name: 校验 Kustomize 部署
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - prepare-release
      - build-go
      - build-release-images
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: write
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      image_build_max_seconds: ${{ steps.image_timing.outputs.max_seconds }}
      release_artifact_ref: ${{ steps.release_bundle_ref.outputs.ref }}
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 设置 release artifact 隔离 Docker 配置
        run: |
          docker_context="$(docker context show)"
          docker_host="$(docker context inspect "$docker_context" --format '{{.Endpoints.docker.Host}}')"
          if [[ -z "$docker_host" ]]; then
            echo "当前 Docker context 未提供 daemon endpoint" >&2
            exit 1
          fi
          DOCKER_HOST="$docker_host" docker version >/dev/null
          docker_config="${RUNNER_TEMP}/quwoquan-service-pipeline/${GITHUB_RUN_ID}/release-artifact/docker-config"
          mkdir -p "$docker_config"
          echo "DOCKER_HOST=${docker_host}" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=${docker_config}" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: false
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
      - id: release_registry_login_attempt_1
        name: 登录镜像仓库（第 1 次）
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}
      - name: GHCR 登录退避（5 秒）
        if: ${{ steps.release_registry_login_attempt_1.outcome == 'failure' }}
        run: sleep 5
      - id: release_registry_login_attempt_2
        name: 登录镜像仓库（第 2 次）
        if: ${{ steps.release_registry_login_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}
      - name: GHCR 登录退避（15 秒）
        if: ${{ steps.release_registry_login_attempt_1.outcome == 'failure' && steps.release_registry_login_attempt_2.outcome == 'failure' }}
        run: sleep 15
      - id: release_registry_login_attempt_3
        name: 登录镜像仓库（第 3 次）
        if: ${{ steps.release_registry_login_attempt_1.outcome == 'failure' && steps.release_registry_login_attempt_2.outcome == 'failure' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Generate mainline release inputs
        run: |
          rm -rf "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline"
          rm -rf "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/image-descriptors"
          python3 quwoquan_ops/cli/prod/generate_mainline_release_artifact.py \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline" \
            --git-sha "${GITHUB_SHA}" \
            --run-number "${{ github.run_number }}" \
            --repository "${{ github.repository }}" \
            --registry "${{ env.REGISTRY }}" \
            --image-version "${{ needs.prepare-release.outputs.image_version }}" \
            --config-version "${{ needs.prepare-release.outputs.config_version }}"
      - name: Resolve immutable image descriptors from GHCR
        run: |
          python3 quwoquan_ops/cli/prod/collect_mainline_image_descriptors.py \
            --manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/image-descriptors"
      - name: Finalize deployable release artifact
        run: |
          python3 quwoquan_ops/cli/prod/finalize_mainline_release_artifact.py \
            --artifact-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline" \
            --image-descriptors-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/image-descriptors"
      - id: image_timing
        name: Record image build critical path
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/image-descriptors"
          durations = [
              int(json.loads(path.read_text(encoding="utf-8"))["buildDurationSeconds"])
              for path in root.glob("*.json")
          ]
          print(f"max_seconds={max(durations)}")
          PY
      - name: Require immutable release manifest
        run: |
          test -s "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" || {
            echo "::error::mainline release artifact is required; local regeneration is forbidden"
            exit 1
          }
      - name: Unpack service package config evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest.get("releaseFiles", {}).values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY

      - name: 安装 kustomize
        run: bash quwoquan_ops/cli/shared/install_kustomize.sh

      - name: 校验 56 个服务环境入口及四环境装配
        run: |
          for env in alpha beta gamma prod; do
            for service_root in quwoquan_service/services/*; do
              kustomize build --load-restrictor LoadRestrictionsNone "$service_root/environments/$env/deploy" > /dev/null
            done
            for workload in coturn livekit; do
              kustomize build --load-restrictor LoadRestrictionsNone "quwoquan_ops/external/$workload/environments/$env" > /dev/null
            done
            kustomize build --load-restrictor LoadRestrictionsNone "quwoquan_ops/environments/$env" > /dev/null
            echo "$env autonomous assembly OK"
          done
      - id: release_bundle_attempt_1
        name: Publish deployable release artifact to GHCR（第 1 次）
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/ci-packages/process/service/mainline
          file: quwoquan_ops/cli/prod/release_artifact.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/release-artifact:${{ needs.prepare-release.outputs.image_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/release-artifact:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: GHCR release artifact 推送退避（5 秒）
        if: ${{ steps.release_bundle_attempt_1.outcome == 'failure' }}
        run: sleep 5
      - id: release_bundle_attempt_2
        name: Publish deployable release artifact to GHCR（第 2 次）
        if: ${{ steps.release_bundle_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/ci-packages/process/service/mainline
          file: quwoquan_ops/cli/prod/release_artifact.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/release-artifact:${{ needs.prepare-release.outputs.image_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/release-artifact:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: GHCR release artifact 推送退避（15 秒）
        if: ${{ steps.release_bundle_attempt_1.outcome == 'failure' && steps.release_bundle_attempt_2.outcome == 'failure' }}
        run: sleep 15
      - id: release_bundle_attempt_3
        name: Publish deployable release artifact to GHCR（第 3 次）
        if: ${{ steps.release_bundle_attempt_1.outcome == 'failure' && steps.release_bundle_attempt_2.outcome == 'failure' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/ci-packages/process/service/mainline
          file: quwoquan_ops/cli/prod/release_artifact.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/release-artifact:${{ needs.prepare-release.outputs.image_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/release-artifact:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
      - id: release_bundle
        name: Resolve successful release artifact digest
        if: always()
        env:
          ATTEMPT_1_OUTCOME: ${{ steps.release_bundle_attempt_1.outcome }}
          ATTEMPT_1_DIGEST: ${{ steps.release_bundle_attempt_1.outputs.digest }}
          ATTEMPT_2_OUTCOME: ${{ steps.release_bundle_attempt_2.outcome }}
          ATTEMPT_2_DIGEST: ${{ steps.release_bundle_attempt_2.outputs.digest }}
          ATTEMPT_3_OUTCOME: ${{ steps.release_bundle_attempt_3.outcome }}
          ATTEMPT_3_DIGEST: ${{ steps.release_bundle_attempt_3.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            outcome_name="ATTEMPT_${attempt}_OUTCOME"
            digest_name="ATTEMPT_${attempt}_DIGEST"
            outcome="${!outcome_name}"
            digest="${!digest_name}"
            if [[ "$outcome" == "success" && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::release artifact push failed after 3 bounded attempts"
          exit 1
      - id: release_bundle_ref
        name: Record immutable OCI release artifact
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/release-artifact@${{ steps.release_bundle.outputs.digest }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_artifact_ref=$REF"
          echo "- OCI release artifact: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  service_pipeline_summary:
    name: 02. Service Pipeline
    needs:
      - prepare-release
      - build-go
      - build-release-images
      - validate-deploy
    if: always()
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      critical_path_seconds: ${{ steps.timing.outputs.critical_path_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: false
      - name: Enforce service pipeline results
        env:
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          BUILD_GO_RESULT: ${{ needs.build-go.result }}
          BUILD_IMAGES_RESULT: ${{ needs.build-release-images.result }}
          VALIDATE_RESULT: ${{ needs.validate-deploy.result }}
        run: |
          test "$PREPARE_RESULT" = "success"
          test "$BUILD_GO_RESULT" = "success"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            test "$BUILD_IMAGES_RESULT" = "success"
            test "$VALIDATE_RESULT" = "success"
          fi
      - name: Render service pipeline timing summary
        id: timing
        env:
          PREPARE_SECONDS: ${{ needs.prepare-release.outputs.duration_seconds }}
          BUILD_GO_SECONDS: ${{ needs.build-go.outputs.duration_seconds }}
          BUILD_IMAGES_SECONDS: ${{ needs.validate-deploy.outputs.image_build_max_seconds }}
          VALIDATE_SECONDS: ${{ needs.validate-deploy.outputs.duration_seconds }}
        run: |
          PREPARE="${PREPARE_SECONDS:-0}"
          BUILD_GO="${BUILD_GO_SECONDS:-0}"
          BUILD_IMAGES="${BUILD_IMAGES_SECONDS:-0}"
          VALIDATE="${VALIDATE_SECONDS:-0}"
          FANOUT="${BUILD_GO}"
          if [ "${BUILD_IMAGES}" -gt "${FANOUT}" ]; then FANOUT="${BUILD_IMAGES}"; fi
          CRITICAL_PATH_SECONDS=$(( PREPARE + FANOUT + VALIDATE ))
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 02.service_pipeline \
            --title "02. Service Pipeline" \
            --critical-path-seconds "${CRITICAL_PATH_SECONDS}" \
            --phase "prepare_release=${PREPARE}" \
            --phase "build_go=${BUILD_GO}" \
            --phase "build_release_images=${BUILD_IMAGES}" \
            --phase "validate_deploy=${VALIDATE}" \
            --note "02 负责 mainline release artifact、镜像构建推送与部署清单校验；该耗时必须计入真实 commit-to-prod。" \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/service-pipeline-summary.json" \
            --write-step-summary
          echo "critical_path_seconds=${CRITICAL_PATH_SECONDS}" >> "$GITHUB_OUTPUT"
