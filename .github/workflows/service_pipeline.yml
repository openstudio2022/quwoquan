# =============================================================================
# Service Pipeline — quwoquan_service CI/CD
# =============================================================================
# 触发条件：仅由 RC qualification 以 exact admission/request 复用
# 流程：Go 构建 + Python (recommendation-service) Docker 镜像 → kustomize/prod 部署清单校验
# 当前职责：构建服务镜像并校验发布清单；prod-hosted 发布由 prod rollout workflow 负责。
#
# 【必须配置的 GitHub Secrets】（部署时）
#   GITHUB_TOKEN        — GHCR packages read/write（由 GitHub 自动注入）
# =============================================================================

name: 02. Service Pipeline

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact RC peeled main commit SHA
        required: true
        type: string
      rc_tag_admission_ref:
        description: Exact immutable RC tag AdmissionFact OCI @sha256 ref
        required: true
        type: string
      qualification_request_ref:
        description: Exact immutable RC QualificationRequest OCI @sha256 ref
        required: true
        type: string
      qualification_request_digest:
        description: Exact immutable OCI digest suffix of qualification_request_ref
        required: true
        type: string
      artifact_build_number:
        description: Hosted monotonic build number shared by both factories
        required: true
        type: number
      artifact_build_number_allocation_ref:
        description: Exact immutable hosted build allocation OCI @sha256 ref
        required: true
        type: string
      artifact_build_number_allocation_digest:
        description: Exact immutable OCI digest suffix of the allocation ref
        required: true
        type: string
    outputs:
      component_evidence_ref:
        description: Exact immutable GHCR service factory material OCI ref
        value: ${{ jobs.service_pipeline_summary.outputs.component_evidence_ref }}
      component_artifact_digest:
        description: Exact canonical aggregate service digest
        value: ${{ jobs.service_pipeline_summary.outputs.component_artifact_digest }}
      source_git_sha:
        description: Exact main source Git SHA bound by the service material
        value: ${{ jobs.service_pipeline_summary.outputs.source_git_sha }}
      source_tree_digest:
        description: Exact Git tree object bound by the service material
        value: ${{ jobs.service_pipeline_summary.outputs.source_tree_digest }}
      qualification_request_ref:
        description: Exact immutable QualificationRequest OCI ref bound by the service material
        value: ${{ jobs.service_pipeline_summary.outputs.qualification_request_ref }}
      qualification_request_digest:
        description: Exact immutable QualificationRequest OCI digest
        value: ${{ jobs.service_pipeline_summary.outputs.qualification_request_digest }}
      service_material_digest:
        description: Exact canonical digest of the complete service factory material
        value: ${{ jobs.service_pipeline_summary.outputs.service_material_digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  QWQ_OUTPUT_ROOT: .qwq_output
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  prepare-release:
    name: Prepare canonical release transport
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image_transport_tag: ${{ steps.coordinates.outputs.image_transport_tag }}
      source_git_sha: ${{ steps.source.outputs.source_git_sha }}
      source_tree_digest: ${{ steps.source.outputs.source_tree_digest }}
      producer_workflow_run_id: ${{ steps.source.outputs.producer_workflow_run_id }}
      qualification_request_fact_digest: ${{ steps.source.outputs.qualification_request_fact_digest }}
      qualification_request_id: ${{ steps.source.outputs.qualification_request_id }}
      artifact_build_number_allocation_fact_digest: ${{ steps.source.outputs.artifact_build_number_allocation_fact_digest }}
      artifact_build_number_allocation_id: ${{ steps.source.outputs.artifact_build_number_allocation_id }}
      rc_tag_admission_fact_digest: ${{ steps.source.outputs.rc_tag_admission_fact_digest }}
      rc_tag_admission_id: ${{ steps.source.outputs.rc_tag_admission_id }}
      rc_tag_name: ${{ steps.source.outputs.rc_tag_name }}
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
      build_count: ${{ steps.plan.outputs.build_count }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - id: source
        name: Consume exact RC source and qualification authorities
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          RC_TAG_ADMISSION_REF: ${{ inputs.rc_tag_admission_ref }}
          QUALIFICATION_REQUEST_REF: ${{ inputs.qualification_request_ref }}
          QUALIFICATION_REQUEST_DIGEST: ${{ inputs.qualification_request_digest }}
          ARTIFACT_BUILD_NUMBER: ${{ inputs.artifact_build_number }}
          ARTIFACT_BUILD_NUMBER_ALLOCATION_REF: ${{ inputs.artifact_build_number_allocation_ref }}
          ARTIFACT_BUILD_NUMBER_ALLOCATION_DIGEST: ${{ inputs.artifact_build_number_allocation_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          [[ "$RC_TAG_ADMISSION_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$QUALIFICATION_REQUEST_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$QUALIFICATION_REQUEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_BUILD_NUMBER_ALLOCATION_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_BUILD_NUMBER_ALLOCATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${QUALIFICATION_REQUEST_REF##*@}" = "$QUALIFICATION_REQUEST_DIGEST"
          test "${ARTIFACT_BUILD_NUMBER_ALLOCATION_REF##*@}" = "$ARTIFACT_BUILD_NUMBER_ALLOCATION_DIGEST"

          AUTHORITY_ROOT="$RUNNER_TEMP/service-factory-authority"
          rm -rf "$AUTHORITY_ROOT"
          mkdir -p "$AUTHORITY_ROOT"
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
            --ref "$QUALIFICATION_REQUEST_REF" \
            --output-file "$AUTHORITY_ROOT/qualification-request.json" >/dev/null
          python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
            --ref "$RC_TAG_ADMISSION_REF" \
            --output-file "$AUTHORITY_ROOT/rc-tag-admission.json" >/dev/null
          python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
            --ref "$ARTIFACT_BUILD_NUMBER_ALLOCATION_REF" \
            --output-file "$AUTHORITY_ROOT/artifact-build-number-allocation.json" >/dev/null

          python3 - "$AUTHORITY_ROOT/qualification-request.json" \
            "$AUTHORITY_ROOT/rc-tag-admission.json" \
            "$AUTHORITY_ROOT/artifact-build-number-allocation.json" \
            "$REQUESTED_SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" <<'PY_AUTHORITY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path, PurePosixPath

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          sha_pattern = re.compile(r"[0-9a-f]{40}")

          def canonical_digest(value):
              canonical = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
              return "sha256:" + hashlib.sha256(canonical).hexdigest()

          def exact_ref(value, field):
              if not isinstance(value, dict) or set(value) != {"ref", "digest"}:
                  raise SystemExit(f"GATE_BLOCK: {field} exact identity is incomplete")
              ref = value.get("ref")
              digest = value.get("digest")
              if (
                  not isinstance(ref, str)
                  or not ref
                  or ref != ref.strip()
                  or "\\" in ref
                  or any(part in {"", ".", "..", "latest", "current"} for part in PurePosixPath(ref).parts)
                  or not isinstance(digest, str)
                  or digest_pattern.fullmatch(digest) is None
              ):
                  raise SystemExit(f"GATE_BLOCK: {field} exact identity is mutable or invalid")
              return {"ref": ref, "digest": digest}

          request_path = Path(sys.argv[1])
          admission_path = Path(sys.argv[2])
          allocation_path = Path(sys.argv[3])
          source = sys.argv[4]
          source_tree = sys.argv[5]
          request_raw = request_path.read_bytes()
          admission_raw = admission_path.read_bytes()
          allocation_raw = allocation_path.read_bytes()
          request = json.loads(request_raw)
          admission = json.loads(admission_raw)
          allocation = json.loads(allocation_raw)
          request_keys = {
              "schema", "rcTagAdmission", "mainSourceSeal",
              "integrationQualification", "requestAuthority", "tagName",
              "sourceGitSha", "sourceTree", "requestedAt", "requestId",
          }
          admission_keys = {
              "schema", "admissionId", "decision", "tagKind", "tagName",
              "tagObjectOid", "peeledCommit", "sourceTree", "productVersion",
              "rcSequence", "selectionFact", "productVersionManifestDigest",
              "releaseSelectionPolicyDigest", "creatorReadback",
              "rulesetReadback", "admittedAt",
          }
          allocation_keys = {
              "schema", "allocationId", "requestId", "qualificationRequest",
              "artifactBuildNumber", "predecessor", "hostedAuthority",
          }
          request_body = dict(request)
          request_id = request_body.pop("requestId", None)
          admission_body = dict(admission)
          admission_id = admission_body.pop("admissionId", None)
          allocation_body = dict(allocation)
          allocation_id = allocation_body.pop("allocationId", None)
          request_fact_digest = "sha256:" + hashlib.sha256(request_raw).hexdigest()
          admission_fact_digest = "sha256:" + hashlib.sha256(admission_raw).hexdigest()
          allocation_fact_digest = "sha256:" + hashlib.sha256(allocation_raw).hexdigest()
          request_admission = exact_ref(request.get("rcTagAdmission"), "request.rcTagAdmission")
          for field in ("mainSourceSeal", "integrationQualification", "requestAuthority"):
              exact_ref(request.get(field), f"request.{field}")
          if (
              not isinstance(request, dict)
              or request_raw
              != json.dumps(
                  request, ensure_ascii=False, sort_keys=True,
                  separators=(",", ":"), allow_nan=False,
              ).encode("utf-8") + b"\n"
              or admission_raw
              != json.dumps(
                  admission, ensure_ascii=False, sort_keys=True,
                  separators=(",", ":"), allow_nan=False,
              ).encode("utf-8") + b"\n"
              or allocation_raw
              != json.dumps(
                  allocation, ensure_ascii=False, sort_keys=True,
                  separators=(",", ":"), allow_nan=False,
              ).encode("utf-8") + b"\n"
              or set(request) != request_keys
              or request.get("schema") != "quwoquan_ops.release_qualification_request.v1"
              or request_id != canonical_digest(request_body)
              or not isinstance(allocation, dict)
              or set(allocation) != allocation_keys
              or allocation.get("schema") != "quwoquan_ops.artifact_build_number_allocation.v1"
              or allocation_id != canonical_digest(allocation_body)
              or allocation.get("requestId") != request_id
              or allocation.get("qualificationRequest")
              != {"ref": os.environ["QUALIFICATION_REQUEST_REF"], "digest": request_fact_digest}
              or allocation.get("artifactBuildNumber") != int(os.environ["ARTIFACT_BUILD_NUMBER"])
              or allocation.get("predecessor") is not None
              or not isinstance(allocation.get("hostedAuthority"), dict)
              or allocation["hostedAuthority"].get("provider") != "github_actions_workflow_run_number"
              or allocation["hostedAuthority"].get("runNumber") != int(os.environ["ARTIFACT_BUILD_NUMBER"])
              or not isinstance(admission, dict)
              or set(admission) != admission_keys
              or admission.get("schema") != "quwoquan_ops.release_candidate_tag_admission_fact.v1"
              or admission.get("decision") != "admitted"
              or admission.get("tagKind") != "rc"
              or admission_id != canonical_digest(admission_body)
              or request_admission
              != {"ref": os.environ["RC_TAG_ADMISSION_REF"], "digest": admission_fact_digest}
              or request.get("sourceGitSha") != source
              or admission.get("peeledCommit") != source
              or request.get("sourceTree") != source_tree
              or admission.get("sourceTree") != source_tree
              or request.get("tagName") != admission.get("tagName")
              or sha_pattern.fullmatch(source_tree) is None
          ):
              raise SystemExit("GATE_BLOCK: QualificationRequest/RC admission identity drifted")
          print(f"source_git_sha={source}")
          print(f"source_tree_digest={source_tree}")
          print(f"producer_workflow_run_id={os.environ['GITHUB_RUN_ID']}")
          print(f"qualification_request_fact_digest={request_fact_digest}")
          print(f"qualification_request_id={request_id}")
          print(f"artifact_build_number_allocation_fact_digest={allocation_fact_digest}")
          print(f"artifact_build_number_allocation_id={allocation_id}")
          print(f"rc_tag_admission_fact_digest={admission_fact_digest}")
          print(f"rc_tag_admission_id={admission_id}")
          print(f"rc_tag_name={admission['tagName']}")
          PY_AUTHORITY
      - id: plan
        name: Build the complete RC service material set
        run: |
          python3 quwoquan_ops/ci/plan_service_release_images.py \
            --head-sha "${{ steps.source.outputs.source_git_sha }}" \
            --changed-file .github/workflows/service_pipeline.yml \
            --github-output "$GITHUB_OUTPUT"
      - name: Generate immutable transport coordinate
        id: coordinates
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_git_sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          print(f"image_transport_tag=sha-{os.environ['SOURCE_SHA']}")
          PY
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  build-go:
    name: Go 构建与测试
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    needs: [prepare-release]
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    defaults:
      run:
        working-directory: quwoquan_service
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare-release.outputs.source_git_sha }}
          persist-credentials: false
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: 设置 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: quwoquan_service/go.mod
          cache: false

      - name: 配置跨 run Go 缓存
        run: |
          cache_root="${RUNNER_TEMP}/quwoquan-service-pipeline/go-${RUNNER_ARCH}"
          mkdir -p "${cache_root}/go-build" "${cache_root}/go-mod"
          echo "GOCACHE=${cache_root}/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${cache_root}/go-mod" >> "$GITHUB_ENV"

      - name: Restore Go build/module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/quwoquan-service-pipeline/go-${{ runner.arch }}/go-build
            ${{ runner.temp }}/quwoquan-service-pipeline/go-${{ runner.arch }}/go-mod
          key: service-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('quwoquan_service/go.sum') }}
          restore-keys: |
            service-go-${{ runner.os }}-${{ runner.arch }}-

      - name: Go 构建
        run: make build

      # L2 由 delivery-gate 负责，此处仅 build
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  build-release-images:
    name: 构建 ${{ matrix.trust_domain }}/${{ matrix.runtime_image_owner }} 不可变镜像
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    needs: [prepare-release]
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.image_matrix) }}
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare-release.outputs.source_git_sha }}
          persist-credentials: false
      - id: base_images
        name: Resolve governed build images
        if: ${{ matrix.action == 'build' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          runtime = json.loads(
              Path("quwoquan_ops/environments/prod/runtime.yaml").read_text(
                  encoding="utf-8"
              )
          )
          images = runtime["targets"]["prod-hosted"]["buildImages"]
          # DEC-005：镜像字节环境无关，环境配置摘要不再进入 build args；
          # artifact-identity.json 由部署面挂载。
          print(f"go_base_image={images['goBaseImage']}")
          print(f"alpine_base_image={images['alpineBaseImage']}")
          print(f"python_base_image={images['pythonBaseImage']}")
          PY
      - name: 设置 QEMU
        if: ${{ matrix.action == 'build' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: docker.io/tonistiigi/binfmt@sha256:b4c6a09270133b3c5b4dff94f83067df4dd27eced195fc6a1dbad102999e24dd
          platforms: amd64
          cache-image: false
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - name: 登录镜像仓库
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: 构建、生成 SBOM/provenance 并推送
        if: ${{ matrix.action == 'build' }}
        env:
          GO_BASE_IMAGE: ${{ steps.base_images.outputs.go_base_image }}
          ALPINE_BASE_IMAGE: ${{ steps.base_images.outputs.alpine_base_image }}
          PYTHON_BASE_IMAGE: ${{ steps.base_images.outputs.python_base_image }}
        run: |
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --platform linux/amd64 \
            --build-arg "GO_BASE_IMAGE=$GO_BASE_IMAGE" \
            --build-arg "ALPINE_BASE_IMAGE=$ALPINE_BASE_IMAGE" \
            --build-arg "PYTHON_BASE_IMAGE=$PYTHON_BASE_IMAGE" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}:${{ needs.prepare-release.outputs.image_transport_tag }}" \
            --cache-from "type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.runtime_image_owner }}-buildcache:main" \
            --cache-to "type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.runtime_image_owner }}-buildcache:main,mode=max,oci-mediatypes=true" \
            --sbom=true \
            --provenance=mode=max \
            --push \
            "${{ matrix.context }}"
      - name: Reject image reuse in RC factory
        if: ${{ matrix.action == 'reuse' }}
        run: |
          echo "::error::GATE_BLOCK: RC service factory must build every source-bound image; prior-digest reuse is diagnostic-only"
          exit 2
      - id: exact_image
        name: Resolve exact image digest
        run: |
          SUBJECT_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}"
          TRANSPORT_REF="$SUBJECT_NAME:${{ needs.prepare-release.outputs.image_transport_tag }}"
          DIGEST="$(docker buildx imagetools inspect "$TRANSPORT_REF" --format '{{json .Manifest.Digest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin))')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GATE_BLOCK: registry returned no immutable image digest"
            exit 2
          fi
          {
            echo "subject_name=$SUBJECT_NAME"
            echo "subject_digest=$DIGEST"
            echo "exact_ref=$SUBJECT_NAME@$DIGEST"
          } >> "$GITHUB_OUTPUT"
      - name: Extract structured BuildKit SPDX SBOM
        if: ${{ matrix.action == 'build' }}
        run: |
          python3 quwoquan_ops/cli/prod/oci_supply_chain.py extract-sbom \
            --ref "${{ steps.exact_image.outputs.exact_ref }}" \
            --output "${{ runner.temp }}/release-image-sbom/${{ matrix.trust_domain }}--${{ matrix.runtime_image_owner }}.spdx.json"
      - name: Sign image provenance with GitHub OIDC
        if: ${{ matrix.action == 'build' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.exact_image.outputs.subject_name }}
          subject-digest: ${{ steps.exact_image.outputs.subject_digest }}
          push-to-registry: true
      - name: Sign image SPDX SBOM with GitHub OIDC
        if: ${{ matrix.action == 'build' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.exact_image.outputs.subject_name }}
          subject-digest: ${{ steps.exact_image.outputs.subject_digest }}
          sbom-path: ${{ runner.temp }}/release-image-sbom/${{ matrix.trust_domain }}--${{ matrix.runtime_image_owner }}.spdx.json
          push-to-registry: true
      - name: Verify signed provenance, SBOM, signer and issuer
        env:
          MATRIX_ACTION: ${{ matrix.action }}
        run: |
          ARGS=(
            verify
            --ref "${{ steps.exact_image.outputs.exact_ref }}"
            --repository "${{ github.repository }}"
            --signer-workflow "${{ github.repository }}/.github/workflows/service_pipeline.yml"
          )
          if [[ "$MATRIX_ACTION" != "build" ]]; then
            echo "::error::GATE_BLOCK: RC service image escaped source-bound build policy"
            exit 2
          fi
          ARGS+=(--source-digest "${{ needs.prepare-release.outputs.source_git_sha }}")
          python3 quwoquan_ops/cli/prod/oci_supply_chain.py "${ARGS[@]}"

  validate-deploy:
    name: 校验 Kustomize 部署
    needs:
      - prepare-release
      - build-go
      - build-release-images
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      component_evidence_ref: ${{ steps.release_bundle_ref.outputs.ref }}
      component_artifact_digest: ${{ steps.published_identity.outputs.service_digest }}
      producer_workflow_run_id: ${{ steps.published_identity.outputs.producer_workflow_run_id }}
      source_git_sha: ${{ steps.published_identity.outputs.source_git_sha }}
      source_tree_digest: ${{ steps.published_identity.outputs.source_tree_digest }}
      qualification_request_ref: ${{ inputs.qualification_request_ref }}
      qualification_request_digest: ${{ inputs.qualification_request_digest }}
      service_material_digest: ${{ steps.published_identity.outputs.material_digest }}
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare-release.outputs.source_git_sha }}
          persist-credentials: false
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: docker.io/tonistiigi/binfmt@sha256:b4c6a09270133b3c5b4dff94f83067df4dd27eced195fc6a1dbad102999e24dd
          platforms: amd64
          cache-image: false
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: release_registry_login_attempt_1
        name: Login release registry (attempt 1)
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.release_registry_login_attempt_1.outcome == 'failure' }}
        run: sleep 5
      - id: release_registry_login_attempt_2
        name: Login release registry (attempt 2)
        if: ${{ steps.release_registry_login_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.release_registry_login_attempt_2.outcome == 'failure' }}
        run: sleep 5
      - id: release_registry_login_attempt_3
        name: Login release registry (attempt 3)
        if: ${{ steps.release_registry_login_attempt_1.outcome == 'failure' && steps.release_registry_login_attempt_2.outcome == 'failure' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: component_manifest
        name: Build canonical signed service factory material
        env:
          SOURCE_GIT_SHA: ${{ needs.prepare-release.outputs.source_git_sha }}
          SOURCE_TREE_DIGEST: ${{ needs.prepare-release.outputs.source_tree_digest }}
          QUALIFICATION_REQUEST_REF: ${{ inputs.qualification_request_ref }}
          QUALIFICATION_REQUEST_DIGEST: ${{ inputs.qualification_request_digest }}
          QUALIFICATION_REQUEST_FACT_DIGEST: ${{ needs.prepare-release.outputs.qualification_request_fact_digest }}
          QUALIFICATION_REQUEST_ID: ${{ needs.prepare-release.outputs.qualification_request_id }}
          ARTIFACT_BUILD_NUMBER: ${{ inputs.artifact_build_number }}
          ARTIFACT_BUILD_NUMBER_ALLOCATION_REF: ${{ inputs.artifact_build_number_allocation_ref }}
          ARTIFACT_BUILD_NUMBER_ALLOCATION_DIGEST: ${{ inputs.artifact_build_number_allocation_digest }}
          ARTIFACT_BUILD_NUMBER_ALLOCATION_FACT_DIGEST: ${{ needs.prepare-release.outputs.artifact_build_number_allocation_fact_digest }}
          ARTIFACT_BUILD_NUMBER_ALLOCATION_ID: ${{ needs.prepare-release.outputs.artifact_build_number_allocation_id }}
          RC_TAG_ADMISSION_REF: ${{ inputs.rc_tag_admission_ref }}
          RC_TAG_ADMISSION_FACT_DIGEST: ${{ needs.prepare-release.outputs.rc_tag_admission_fact_digest }}
          RC_TAG_ADMISSION_ID: ${{ needs.prepare-release.outputs.rc_tag_admission_id }}
          RC_TAG_NAME: ${{ needs.prepare-release.outputs.rc_tag_name }}
          IMAGE_TRANSPORT_TAG: ${{ needs.prepare-release.outputs.image_transport_tag }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/service-factory-material"
          mkdir -p "$RUNNER_TEMP/service-factory-material"
          python3 - <<'PY_MATERIAL' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from quwoquan_ops.ci.plan_service_release_images import (
              RUNTIME_IMAGE_OWNERS,
              TRUST_DOMAINS,
          )
          from quwoquan_ops.cli.prod.oci_supply_chain import OIDC_ISSUER, PREDICATES

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          oci_pattern = re.compile(r"ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}")
          source_pattern = re.compile(r"[0-9a-f]{40}")

          def canonical_digest(value):
              canonical = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
              return "sha256:" + hashlib.sha256(canonical).hexdigest()

          source = os.environ["SOURCE_GIT_SHA"]
          tree = os.environ["SOURCE_TREE_DIGEST"]
          request_ref = os.environ["QUALIFICATION_REQUEST_REF"]
          request_digest = os.environ["QUALIFICATION_REQUEST_DIGEST"]
          admission_ref = os.environ["RC_TAG_ADMISSION_REF"]
          if (
              source_pattern.fullmatch(source) is None
              or source_pattern.fullmatch(tree) is None
              or oci_pattern.fullmatch(request_ref) is None
              or not request_ref.endswith("@" + request_digest)
              or oci_pattern.fullmatch(admission_ref) is None
          ):
              raise SystemExit("GATE_BLOCK: service factory authority identity is invalid")

          signer_workflow = (
              f"{os.environ['GITHUB_REPOSITORY']}/"
              ".github/workflows/service_pipeline.yml"
          )
          images = []
          digests_by_owner = {}
          for trust_domain in TRUST_DOMAINS:
              for owner in RUNTIME_IMAGE_OWNERS:
                  repository = (
                      f"ghcr.io/{os.environ['GITHUB_REPOSITORY']}/"
                      f"{owner}-{trust_domain}"
                  )
                  transport_ref = (
                      f"{repository}:{os.environ['IMAGE_TRANSPORT_TAG']}"
                  )
                  inspected = subprocess.run(
                      [
                          "docker", "buildx", "imagetools", "inspect",
                          transport_ref, "--format", "{{json .Manifest.Digest}}",
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  image_digest = json.loads(inspected.stdout)
                  if not isinstance(image_digest, str) or digest_pattern.fullmatch(image_digest) is None:
                      raise SystemExit(
                          f"GATE_BLOCK: immutable image digest missing for {trust_domain}/{owner}"
                      )
                  exact_ref = f"{repository}@{image_digest}"
                  verified = subprocess.run(
                      [
                          "python3",
                          "quwoquan_ops/cli/prod/oci_supply_chain.py",
                          "verify",
                          "--ref", exact_ref,
                          "--repository", os.environ["GITHUB_REPOSITORY"],
                          "--signer-workflow", signer_workflow,
                          "--source-digest", source,
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  verification = json.loads(verified.stdout)
                  signed_attestations = verification.get("attestations")
                  if (
                      verification.get("status") != "passed"
                      or not isinstance(signed_attestations, dict)
                      or set(signed_attestations) != set(PREDICATES)
                      or any(
                          not isinstance(value, str)
                          or digest_pattern.fullmatch(value) is None
                          for value in signed_attestations.values()
                      )
                  ):
                      raise SystemExit(
                          f"GATE_BLOCK: signed attestations incomplete for {trust_domain}/{owner}"
                      )
                  signature_identity = {
                      "subject": exact_ref,
                      "issuer": OIDC_ISSUER,
                      "signerWorkflow": signer_workflow,
                      "attestations": signed_attestations,
                  }
                  digests_by_owner[(trust_domain, owner)] = image_digest
                  images.append(
                      {
                          "trustDomain": trust_domain,
                          "runtimeImageOwner": owner,
                          "ociRef": exact_ref,
                          "digest": image_digest,
                          "signature": {
                              "issuer": OIDC_ISSUER,
                              "signerWorkflow": signer_workflow,
                              "verificationDigest": canonical_digest(signature_identity),
                          },
                          "attestations": {
                              name: {
                                  "predicateType": PREDICATES[name],
                                  "verificationDigest": signed_attestations[name],
                              }
                              for name in sorted(PREDICATES)
                          },
                      }
                  )
          for owner in RUNTIME_IMAGE_OWNERS:
              if digests_by_owner[("nonprod", owner)] == digests_by_owner[("prod", owner)]:
                  raise SystemExit(
                      f"GATE_BLOCK: prod image did not fork nonprod trust domain: {owner}"
                  )

          service_subjects = [
              {
                  "trustDomain": image["trustDomain"],
                  "runtimeImageOwner": image["runtimeImageOwner"],
                  "digest": image["digest"],
              }
              for image in images
          ]
          service_digest = canonical_digest({"images": service_subjects})
          bundle_paths = (
              "quwoquan_ops/environments/prod",
              "quwoquan_ops/external/coturn/base",
              "quwoquan_ops/external/coturn/environments/prod",
              "quwoquan_ops/external/livekit/base",
              "quwoquan_ops/external/livekit/environments/prod",
              "quwoquan_ops/observability/monitoring/docker-compose.prod.yml",
              "quwoquan_ops/cli/prod/render_prod_plane_stack.py",
              "quwoquan_ops/cli/prod/render_prod_plane_stack_lib",
              ":(glob)quwoquan_service/services/*/config/schema.yaml",
              ":(glob)quwoquan_service/services/*/environments/prod/config.yaml",
              ":(glob)quwoquan_service/services/*/deploy/**",
              ":(glob)quwoquan_service/services/*/environments/prod/deploy/**",
              "quwoquan_service/control-plane/platform-ops/deploy/base",
              "quwoquan_service/control-plane/platform-ops/environments/prod/deploy",
          )
          listed = subprocess.run(
              ["git", "ls-files", "-z", "--", *bundle_paths],
              check=True, capture_output=True,
          ).stdout
          bundle_files = []
          for relative in sorted(item.decode("utf-8") for item in listed.split(b"\0") if item):
              path = Path(relative)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(
                      f"GATE_BLOCK: Prod runtime config/deployment bundle input invalid: {relative}"
                  )
              bundle_files.append(
                  {
                      "path": relative,
                      "digest": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )
          if not bundle_files:
              raise SystemExit(
                  "GATE_BLOCK: Prod runtime config/deployment bundle closure is empty"
              )
          prod_bundle = {
              "schema": "quwoquan_ops.prod_runtime_config_deployment_bundle.v1",
              "algorithm": "sha256_sorted_tracked_path_bytes_v1",
              "files": bundle_files,
          }
          prod_bundle["digest"] = canonical_digest(prod_bundle)
          material = {
              "schema": "quwoquan_ops.service_factory_material",
              "sourceGitSha": source,
              "sourceTree": tree,
              "qualificationRequest": {
                  "ref": request_ref,
                  "digest": request_digest,
                  "factDigest": os.environ["QUALIFICATION_REQUEST_FACT_DIGEST"],
                  "requestId": os.environ["QUALIFICATION_REQUEST_ID"],
              },
              "rcTagAdmission": {
                  "ref": admission_ref,
                  "digest": admission_ref.rsplit("@", 1)[1],
                  "factDigest": os.environ["RC_TAG_ADMISSION_FACT_DIGEST"],
                  "admissionId": os.environ["RC_TAG_ADMISSION_ID"],
                  "tagName": os.environ["RC_TAG_NAME"],
              },
              "artifactBuildNumber": int(os.environ["ARTIFACT_BUILD_NUMBER"]),
              "artifactBuildNumberAllocation": {
                  "ref": os.environ["ARTIFACT_BUILD_NUMBER_ALLOCATION_REF"],
                  "digest": os.environ["ARTIFACT_BUILD_NUMBER_ALLOCATION_DIGEST"],
                  "factDigest": os.environ["ARTIFACT_BUILD_NUMBER_ALLOCATION_FACT_DIGEST"],
                  "allocationId": os.environ["ARTIFACT_BUILD_NUMBER_ALLOCATION_ID"],
              },
              "serviceDigest": service_digest,
              "images": images,
              "prodRuntimeConfigDeploymentBundle": prod_bundle,
              "producer": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "signerWorkflow": signer_workflow,
                  "workflowRunId": os.environ["GITHUB_RUN_ID"],
              },
              "buildPolicy": "build_sign_attest_once",
          }
          material["materialDigest"] = canonical_digest(material)
          output = Path(os.environ["RUNNER_TEMP"]) / "service-factory-material/manifest.json"
          output.write_bytes(
              json.dumps(
                  material, ensure_ascii=False, sort_keys=True,
                  separators=(",", ":"), allow_nan=False,
              ).encode("utf-8")
              + b"\n"
          )
          print(f"service_digest={service_digest}")
          print(f"material_digest={material['materialDigest']}")
          PY_MATERIAL
      - name: Require canonical service factory material
        run: |
          test -s "$RUNNER_TEMP/service-factory-material/manifest.json" || {
            echo "::error::canonical service factory material is required; discovery fallback is forbidden"
            exit 2
          }
      - id: evidence_identity
        name: Read back exact service factory material
        env:
          EXPECTED_SERVICE_DIGEST: ${{ steps.component_manifest.outputs.service_digest }}
          EXPECTED_MATERIAL_DIGEST: ${{ steps.component_manifest.outputs.material_digest }}
          EXPECTED_SOURCE_GIT_SHA: ${{ needs.prepare-release.outputs.source_git_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.prepare-release.outputs.source_tree_digest }}
          EXPECTED_QUALIFICATION_REQUEST_REF: ${{ inputs.qualification_request_ref }}
          EXPECTED_QUALIFICATION_REQUEST_DIGEST: ${{ inputs.qualification_request_digest }}
          EXPECTED_QUALIFICATION_REQUEST_FACT_DIGEST: ${{ needs.prepare-release.outputs.qualification_request_fact_digest }}
          EXPECTED_QUALIFICATION_REQUEST_ID: ${{ needs.prepare-release.outputs.qualification_request_id }}
          EXPECTED_ARTIFACT_BUILD_NUMBER: ${{ inputs.artifact_build_number }}
          EXPECTED_ALLOCATION_REF: ${{ inputs.artifact_build_number_allocation_ref }}
          EXPECTED_ALLOCATION_DIGEST: ${{ inputs.artifact_build_number_allocation_digest }}
          EXPECTED_ALLOCATION_FACT_DIGEST: ${{ needs.prepare-release.outputs.artifact_build_number_allocation_fact_digest }}
          EXPECTED_ALLOCATION_ID: ${{ needs.prepare-release.outputs.artifact_build_number_allocation_id }}
          EXPECTED_RC_TAG_ADMISSION_REF: ${{ inputs.rc_tag_admission_ref }}
          EXPECTED_RC_TAG_ADMISSION_FACT_DIGEST: ${{ needs.prepare-release.outputs.rc_tag_admission_fact_digest }}
          EXPECTED_RC_TAG_ADMISSION_ID: ${{ needs.prepare-release.outputs.rc_tag_admission_id }}
          EXPECTED_RC_TAG_NAME: ${{ needs.prepare-release.outputs.rc_tag_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY_READBACK' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from quwoquan_ops.ci.plan_service_release_images import (
              RUNTIME_IMAGE_OWNERS,
              TRUST_DOMAINS,
          )
          from quwoquan_ops.cli.prod.oci_supply_chain import OIDC_ISSUER, PREDICATES

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          oci_pattern = re.compile(r"ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}")

          def canonical_bytes(value):
              return json.dumps(
                  value, ensure_ascii=False, sort_keys=True,
                  separators=(",", ":"), allow_nan=False,
              ).encode("utf-8")

          def canonical_digest(value):
              return "sha256:" + hashlib.sha256(canonical_bytes(value)).hexdigest()

          path = Path(os.environ["RUNNER_TEMP"]) / "service-factory-material/manifest.json"
          raw = path.read_bytes()
          manifest = json.loads(raw)
          if raw != canonical_bytes(manifest) + b"\n":
              raise SystemExit("GATE_BLOCK: service factory material bytes are not canonical")
          expected_keys = {
              "schema", "sourceGitSha", "sourceTree", "qualificationRequest",
              "rcTagAdmission", "artifactBuildNumber",
              "artifactBuildNumberAllocation", "serviceDigest", "images",
              "prodRuntimeConfigDeploymentBundle", "producer",
              "buildPolicy", "materialDigest",
          }
          unsigned = dict(manifest)
          claimed_material_digest = unsigned.pop("materialDigest", None)
          expected_request = {
              "ref": os.environ["EXPECTED_QUALIFICATION_REQUEST_REF"],
              "digest": os.environ["EXPECTED_QUALIFICATION_REQUEST_DIGEST"],
              "factDigest": os.environ["EXPECTED_QUALIFICATION_REQUEST_FACT_DIGEST"],
              "requestId": os.environ["EXPECTED_QUALIFICATION_REQUEST_ID"],
          }
          admission_ref = os.environ["EXPECTED_RC_TAG_ADMISSION_REF"]
          expected_admission = {
              "ref": admission_ref,
              "digest": admission_ref.rsplit("@", 1)[1],
              "factDigest": os.environ["EXPECTED_RC_TAG_ADMISSION_FACT_DIGEST"],
              "admissionId": os.environ["EXPECTED_RC_TAG_ADMISSION_ID"],
              "tagName": os.environ["EXPECTED_RC_TAG_NAME"],
          }
          signer_workflow = (
              f"{os.environ['GITHUB_REPOSITORY']}/"
              ".github/workflows/service_pipeline.yml"
          )
          expected_allocation = {
              "ref": os.environ["EXPECTED_ALLOCATION_REF"],
              "digest": os.environ["EXPECTED_ALLOCATION_DIGEST"],
              "factDigest": os.environ["EXPECTED_ALLOCATION_FACT_DIGEST"],
              "allocationId": os.environ["EXPECTED_ALLOCATION_ID"],
          }
          expected_producer = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "signerWorkflow": signer_workflow,
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
          }
          bundle = manifest.get("prodRuntimeConfigDeploymentBundle")
          bundle_unsigned = dict(bundle) if isinstance(bundle, dict) else {}
          bundle_digest = bundle_unsigned.pop("digest", None)
          bundle_files = bundle.get("files") if isinstance(bundle, dict) else None
          expected_paths = subprocess.run(
              [
                  "git", "ls-files", "-z", "--",
                  "quwoquan_ops/environments/prod",
                  "quwoquan_ops/external/coturn/base",
                  "quwoquan_ops/external/coturn/environments/prod",
                  "quwoquan_ops/external/livekit/base",
                  "quwoquan_ops/external/livekit/environments/prod",
                  "quwoquan_ops/observability/monitoring/docker-compose.prod.yml",
                  "quwoquan_ops/cli/prod/render_prod_plane_stack.py",
                  "quwoquan_ops/cli/prod/render_prod_plane_stack_lib",
                  ":(glob)quwoquan_service/services/*/config/schema.yaml",
                  ":(glob)quwoquan_service/services/*/environments/prod/config.yaml",
                  ":(glob)quwoquan_service/services/*/deploy/**",
                  ":(glob)quwoquan_service/services/*/environments/prod/deploy/**",
                  "quwoquan_service/control-plane/platform-ops/deploy/base",
                  "quwoquan_service/control-plane/platform-ops/environments/prod/deploy",
              ],
              check=True, capture_output=True,
          ).stdout
          expected_files = [
              {
                  "path": relative,
                  "digest": "sha256:" + hashlib.sha256(Path(relative).read_bytes()).hexdigest(),
              }
              for relative in sorted(
                  item.decode("utf-8") for item in expected_paths.split(b"\0") if item
              )
          ]
          if (
              not isinstance(manifest, dict)
              or set(manifest) != expected_keys
              or manifest.get("schema") != "quwoquan_ops.service_factory_material"
              or manifest.get("buildPolicy") != "build_sign_attest_once"
              or manifest.get("sourceGitSha") != os.environ["EXPECTED_SOURCE_GIT_SHA"]
              or manifest.get("sourceTree") != os.environ["EXPECTED_SOURCE_TREE"]
              or manifest.get("qualificationRequest") != expected_request
              or manifest.get("rcTagAdmission") != expected_admission
              or manifest.get("artifactBuildNumber") != int(os.environ["EXPECTED_ARTIFACT_BUILD_NUMBER"])
              or manifest.get("artifactBuildNumberAllocation") != expected_allocation
              or not isinstance(bundle, dict)
              or set(bundle) != {"schema", "algorithm", "files", "digest"}
              or bundle.get("schema") != "quwoquan_ops.prod_runtime_config_deployment_bundle.v1"
              or bundle.get("algorithm") != "sha256_sorted_tracked_path_bytes_v1"
              or not expected_files
              or bundle_files != expected_files
              or bundle_digest != canonical_digest(bundle_unsigned)
              or manifest.get("producer") != expected_producer
              or claimed_material_digest != canonical_digest(unsigned)
              or claimed_material_digest != os.environ["EXPECTED_MATERIAL_DIGEST"]
          ):
              raise SystemExit("GATE_BLOCK: service factory material identity drifted")

          images = manifest.get("images")
          expected_subject_order = [
              (trust_domain, owner)
              for trust_domain in TRUST_DOMAINS
              for owner in RUNTIME_IMAGE_OWNERS
          ]
          expected_subjects = set(expected_subject_order)
          observed_subjects = set()
          observed_subject_order = []
          service_subjects = []
          if not isinstance(images, list):
              raise SystemExit("GATE_BLOCK: service image material is incomplete")
          for image in images:
              if not isinstance(image, dict) or set(image) != {
                  "trustDomain", "runtimeImageOwner", "ociRef", "digest",
                  "signature", "attestations",
              }:
                  raise SystemExit("GATE_BLOCK: service image material shape drifted")
              subject = (image.get("trustDomain"), image.get("runtimeImageOwner"))
              exact_ref = image.get("ociRef")
              image_digest = image.get("digest")
              signature = image.get("signature")
              attestations = image.get("attestations")
              if (
                  subject in observed_subjects
                  or subject not in expected_subjects
                  or not isinstance(exact_ref, str)
                  or oci_pattern.fullmatch(exact_ref) is None
                  or not isinstance(image_digest, str)
                  or digest_pattern.fullmatch(image_digest) is None
                  or not exact_ref.endswith("@" + image_digest)
                  or not isinstance(signature, dict)
                  or set(signature) != {"issuer", "signerWorkflow", "verificationDigest"}
                  or signature.get("issuer") != OIDC_ISSUER
                  or signature.get("signerWorkflow") != signer_workflow
                  or not isinstance(attestations, dict)
                  or set(attestations) != set(PREDICATES)
              ):
                  raise SystemExit("GATE_BLOCK: service image exact identity drifted")
              verification_digests = {}
              for name, predicate_type in PREDICATES.items():
                  attestation = attestations.get(name)
                  if (
                      not isinstance(attestation, dict)
                      or set(attestation) != {"predicateType", "verificationDigest"}
                      or attestation.get("predicateType") != predicate_type
                      or not isinstance(attestation.get("verificationDigest"), str)
                      or digest_pattern.fullmatch(attestation["verificationDigest"]) is None
                  ):
                      raise SystemExit("GATE_BLOCK: signed service attestation drifted")
                  verification_digests[name] = attestation["verificationDigest"]
              signature_identity = {
                  "subject": exact_ref,
                  "issuer": OIDC_ISSUER,
                  "signerWorkflow": signer_workflow,
                  "attestations": verification_digests,
              }
              if signature.get("verificationDigest") != canonical_digest(signature_identity):
                  raise SystemExit("GATE_BLOCK: service signature verification identity drifted")
              observed_subjects.add(subject)
              observed_subject_order.append(subject)
              service_subjects.append(
                  {
                      "trustDomain": subject[0],
                      "runtimeImageOwner": subject[1],
                      "digest": image_digest,
                  }
              )
          if (
              observed_subjects != expected_subjects
              or observed_subject_order != expected_subject_order
          ):
              raise SystemExit("GATE_BLOCK: canonical service image order/set drifted")
          service_digest = canonical_digest({"images": service_subjects})
          if (
              manifest.get("serviceDigest") != service_digest
              or service_digest != os.environ["EXPECTED_SERVICE_DIGEST"]
          ):
              raise SystemExit("GATE_BLOCK: aggregate service digest drifted")
          print(f"service_digest={service_digest}")
          print(f"material_digest={claimed_material_digest}")
          print(f"producer_workflow_run_id={expected_producer['workflowRunId']}")
          print(f"source_git_sha={manifest['sourceGitSha']}")
          print(f"source_tree_digest={manifest['sourceTree']}")
          PY_READBACK
      - name: 安装 kustomize
        run: bash quwoquan_ops/cli/shared/install_kustomize.sh

      - name: 校验服务环境入口及四环境装配
        run: |
          for env in alpha beta gamma prod; do
            for service_root in quwoquan_service/services/*; do
              kustomize build --load-restrictor LoadRestrictionsNone "$service_root/environments/$env/deploy" > /dev/null
            done
            for workload in coturn livekit; do
              kustomize build --load-restrictor LoadRestrictionsNone "quwoquan_ops/external/$workload/environments/$env" > /dev/null
            done
            kustomize build --load-restrictor LoadRestrictionsNone "quwoquan_ops/environments/$env" > /dev/null
            echo "$env autonomous assembly OK"
          done
      - id: release_bundle_attempt_1
        name: Publish immutable service factory material (attempt 1)
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ runner.temp }}/service-factory-material
          file: quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/service-factory-material:run-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - if: ${{ steps.release_bundle_attempt_1.outcome == 'failure' }}
        run: sleep 15
      - id: release_bundle_attempt_2
        name: Publish immutable service factory material (attempt 2)
        if: ${{ steps.release_bundle_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ runner.temp }}/service-factory-material
          file: quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/service-factory-material:run-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - if: ${{ steps.release_bundle_attempt_2.outcome == 'failure' }}
        run: sleep 15
      - id: release_bundle_attempt_3
        name: Publish immutable service factory material (attempt 3)
        if: ${{ steps.release_bundle_attempt_1.outcome == 'failure' && steps.release_bundle_attempt_2.outcome == 'failure' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ runner.temp }}/service-factory-material
          file: quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/service-factory-material:run-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: release_bundle_ref
        name: Record exact immutable service factory material OCI
        run: |
          set -euo pipefail
          DIGEST="${{ steps.release_bundle_attempt_1.outputs.digest || steps.release_bundle_attempt_2.outputs.digest || steps.release_bundle_attempt_3.outputs.digest }}"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::service factory material push failed after 3 bounded attempts"
            exit 2
          fi
          SUBJECT_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/service-factory-material"
          REF="$SUBJECT_NAME@$DIGEST"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "- Immutable service factory material: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
      - id: published_identity
        name: Read back exact published service factory material
        env:
          SERVICE_MATERIAL_REF: ${{ steps.release_bundle_ref.outputs.ref }}
          SERVICE_MATERIAL_OCI_DIGEST: ${{ steps.release_bundle_ref.outputs.digest }}
          EXPECTED_SERVICE_DIGEST: ${{ steps.evidence_identity.outputs.service_digest }}
          EXPECTED_MATERIAL_DIGEST: ${{ steps.evidence_identity.outputs.material_digest }}
          EXPECTED_SOURCE_GIT_SHA: ${{ steps.evidence_identity.outputs.source_git_sha }}
          EXPECTED_SOURCE_TREE: ${{ steps.evidence_identity.outputs.source_tree_digest }}
          EXPECTED_PRODUCER_RUN_ID: ${{ steps.evidence_identity.outputs.producer_workflow_run_id }}
        run: |
          set -euo pipefail
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "$SERVICE_MATERIAL_REF" \
            --expected-digest "$SERVICE_MATERIAL_OCI_DIGEST" \
            --output-dir "$RUNNER_TEMP/service-factory-material-readback" \
            --require-file manifest.json
          cmp "$RUNNER_TEMP/service-factory-material/manifest.json" \
            "$RUNNER_TEMP/service-factory-material-readback/manifest.json"
          python3 - "$RUNNER_TEMP/service-factory-material-readback/manifest.json" <<'PY_PUBLISHED' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          def canonical_bytes(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          material = json.loads(raw)
          unsigned = dict(material)
          material_digest = unsigned.pop("materialDigest", None)
          observed = "sha256:" + hashlib.sha256(canonical_bytes(unsigned)).hexdigest()
          producer = material.get("producer")
          bundle = material.get("prodRuntimeConfigDeploymentBundle")
          bundle_unsigned = dict(bundle) if isinstance(bundle, dict) else {}
          bundle_digest = bundle_unsigned.pop("digest", None)
          if (
              raw != canonical_bytes(material) + b"\n"
              or material.get("schema") != "quwoquan_ops.service_factory_material"
              or material_digest != observed
              or material_digest != os.environ["EXPECTED_MATERIAL_DIGEST"]
              or material.get("serviceDigest") != os.environ["EXPECTED_SERVICE_DIGEST"]
              or material.get("sourceGitSha") != os.environ["EXPECTED_SOURCE_GIT_SHA"]
              or material.get("sourceTree") != os.environ["EXPECTED_SOURCE_TREE"]
              or not isinstance(bundle, dict)
              or bundle.get("schema") != "quwoquan_ops.prod_runtime_config_deployment_bundle.v1"
              or not isinstance(bundle.get("files"), list)
              or not bundle["files"]
              or bundle_digest != "sha256:" + hashlib.sha256(canonical_bytes(bundle_unsigned)).hexdigest()
              or not isinstance(producer, dict)
              or producer.get("workflowRunId") != os.environ["EXPECTED_PRODUCER_RUN_ID"]
          ):
              raise SystemExit("GATE_BLOCK: published service factory material drifted")
          print(f"service_digest={material['serviceDigest']}")
          print(f"material_digest={material_digest}")
          print(f"producer_workflow_run_id={producer['workflowRunId']}")
          print(f"source_git_sha={material['sourceGitSha']}")
          print(f"source_tree_digest={material['sourceTree']}")
          PY_PUBLISHED
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  service_pipeline_summary:
    name: 02. Service Pipeline
    needs:
      - prepare-release
      - build-go
      - build-release-images
      - validate-deploy
    if: always()
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      component_evidence_ref: ${{ needs.validate-deploy.outputs.component_evidence_ref }}
      component_artifact_digest: ${{ needs.validate-deploy.outputs.component_artifact_digest }}
      source_git_sha: ${{ needs.validate-deploy.outputs.source_git_sha }}
      source_tree_digest: ${{ needs.validate-deploy.outputs.source_tree_digest }}
      qualification_request_ref: ${{ needs.validate-deploy.outputs.qualification_request_ref }}
      qualification_request_digest: ${{ needs.validate-deploy.outputs.qualification_request_digest }}
      service_material_digest: ${{ needs.validate-deploy.outputs.service_material_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.validate-deploy.outputs.source_git_sha }}
          persist-credentials: false
      - name: Enforce service pipeline results
        env:
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          BUILD_GO_RESULT: ${{ needs.build-go.result }}
          BUILD_IMAGES_RESULT: ${{ needs.build-release-images.result }}
          VALIDATE_RESULT: ${{ needs.validate-deploy.result }}
        run: |
          test "$PREPARE_RESULT" = "success"
          test "$BUILD_GO_RESULT" = "success"
          test "$BUILD_IMAGES_RESULT" = "success"
          test "$VALIDATE_RESULT" = "success"
      - id: official_timing
        name: Read official queue, setup, matrix and DAG timestamps
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_IMAGE_COUNT: ${{ needs.prepare-release.outputs.build_count }}
          REUSE_IMAGE_COUNT: ${{ needs.prepare-release.outputs.reuse_count }}
        run: |
          IMAGE_JOB_COUNT=$((BUILD_IMAGE_COUNT + REUSE_IMAGE_COUNT))
          test "$IMAGE_JOB_COUNT" -gt 0
          python3 quwoquan_ops/ci/github_actions_timing.py \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --phase "prepare_release=Prepare canonical release transport" \
            --phase "build_go=Go 构建与测试" \
            --phase "build_release_images=构建 " \
            --phase "validate_deploy=校验 Kustomize 部署" \
            --require-count "prepare_release=1" \
            --require-count "build_go=1" \
            --require-count "build_release_images=${IMAGE_JOB_COUNT}" \
            --require-count "validate_deploy=1" \
            --dag-layer "prepare_release" \
            --dag-layer "build_go,build_release_images" \
            --dag-layer "validate_deploy" \
            --candidate-job "校验 Kustomize 部署" \
            --critical-start run \
            --github-output "$GITHUB_OUTPUT"
      - id: service_budget
        name: Read canonical Service Pipeline budget
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(
              Path("quwoquan_ops/environments/pr_gate_timing_budgets.json").read_text(
                  encoding="utf-8"
              )
          )["gates"]["02.service_pipeline"]
          print(f"soft={int(gate['budgetSeconds'])}")
          print(f"hard={int(gate['hardFailSeconds'])}")
          PY
      - name: Render service pipeline timing summary
        id: timing
        env:
          PREPARE_SECONDS: ${{ steps.official_timing.outputs.phase_prepare_release }}
          BUILD_GO_SECONDS: ${{ steps.official_timing.outputs.phase_build_go }}
          BUILD_IMAGES_SECONDS: ${{ steps.official_timing.outputs.phase_build_release_images }}
          VALIDATE_SECONDS: ${{ steps.official_timing.outputs.phase_validate_deploy }}
          MACHINE_CRITICAL_PATH_SECONDS: ${{ steps.official_timing.outputs.machine_critical_path_seconds }}
          RUN_CREATED_AT: ${{ steps.official_timing.outputs.run_created_at }}
          CANDIDATE_READY_AT: ${{ steps.official_timing.outputs.candidate_ready_at }}
          QUEUE_SECONDS: ${{ steps.official_timing.outputs.queue_seconds }}
          UPSTREAM_MISSING_EVIDENCE: ${{ steps.official_timing.outputs.missing_evidence }}
          SETUP_SECONDS: ${{ steps.official_timing.outputs.setup_seconds }}
          EXECUTION_SECONDS: ${{ steps.official_timing.outputs.execution_seconds }}
          CALENDAR_SECONDS: ${{ steps.official_timing.outputs.calendar_lead_time_seconds }}
          SOFT_BUDGET_SECONDS: ${{ steps.service_budget.outputs.soft }}
          HARD_FAIL_SECONDS: ${{ steps.service_budget.outputs.hard }}
        run: |
          REQUIRED=(PREPARE_SECONDS BUILD_GO_SECONDS BUILD_IMAGES_SECONDS VALIDATE_SECONDS MACHINE_CRITICAL_PATH_SECONDS RUN_CREATED_AT CANDIDATE_READY_AT CALENDAR_SECONDS)
          for name in "${REQUIRED[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GATE_BLOCK: official Service Pipeline timing is missing ${name}"
              exit 2
            fi
          done
          PREPARE="$PREPARE_SECONDS"
          BUILD_GO="$BUILD_GO_SECONDS"
          VALIDATE="$VALIDATE_SECONDS"
          DURATION_ARGS=(--calendar-lead-time-seconds "$CALENDAR_SECONDS")
          EVIDENCE_ARGS=()
          NOTE_ARGS=()
          if [[ -n "$QUEUE_SECONDS" ]]; then DURATION_ARGS+=(--queue-seconds "$QUEUE_SECONDS"); fi
          if [[ -n "$UPSTREAM_MISSING_EVIDENCE" ]]; then
            EVIDENCE_ARGS+=(--missing-evidence "$UPSTREAM_MISSING_EVIDENCE")
            NOTE_ARGS+=(--note "GitHub Jobs API omitted created_at for one or more matched jobs; queue duration is absent and no zero or substitute timestamp was used.")
          fi
          if [[ -n "$SETUP_SECONDS" ]]; then DURATION_ARGS+=(--setup-seconds "$SETUP_SECONDS"); fi
          if [[ -n "$EXECUTION_SECONDS" ]]; then DURATION_ARGS+=(--execution-seconds "$EXECUTION_SECONDS"); fi
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 02.service_pipeline \
            --title "02. Service Pipeline" \
            --machine-critical-path-seconds "${MACHINE_CRITICAL_PATH_SECONDS}" \
            --workflow-run-id "${{ needs.validate-deploy.outputs.producer_workflow_run_id }}" \
            --source-git-sha "${{ needs.validate-deploy.outputs.source_git_sha }}" \
            --run-created-at "$RUN_CREATED_AT" \
            --candidate-ready-at "$CANDIDATE_READY_AT" \
            "${DURATION_ARGS[@]}" \
            "${EVIDENCE_ARGS[@]}" \
            "${NOTE_ARGS[@]}" \
            --phase "prepare_release=${PREPARE}" \
            --phase "build_go=${BUILD_GO}" \
            --phase "build_release_images=${BUILD_IMAGES_SECONDS}" \
            --phase "validate_deploy=${VALIDATE}" \
            --critical-path-source github_run_calendar \
            --note "GitHub Jobs API records the longest governed-service matrix node; the RC factory freshly builds every source-bound trust-domain image with isolated registry BuildKit caches." \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/service-pipeline-summary.json" \
            --write-step-summary
          echo "machine_critical_path_seconds=${MACHINE_CRITICAL_PATH_SECONDS}" >> "$GITHUB_OUTPUT"
          if [[ "$CALENDAR_SECONDS" -gt "$HARD_FAIL_SECONDS" ]]; then
            echo "::error::Service Pipeline end-to-end time ${CALENDAR_SECONDS}s exceeds hard budget ${HARD_FAIL_SECONDS}s"
            exit 1
          elif [[ "$CALENDAR_SECONDS" -gt "$SOFT_BUDGET_SECONDS" ]]; then
            echo "::warning::Service Pipeline end-to-end time ${CALENDAR_SECONDS}s exceeds soft budget ${SOFT_BUDGET_SECONDS}s"
          fi
          if [[ -n "$UPSTREAM_MISSING_EVIDENCE" ]]; then
            echo "::error::GATE_BLOCK: Service Pipeline timing is historical_incomplete: ${UPSTREAM_MISSING_EVIDENCE}"
            exit 2
          fi
