# Report-only observation; never a pull-request required check and never writes repository snapshots.
# History lives in immutable OCI facts (one per ISO week) so trends never need a committed snapshot.
name: 11. Weekly Code Health Observation

permissions:
  contents: read
  actions: read

env:
  QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output
  WEEKLY_REPOSITORY: ghcr.io/${{ github.repository }}/code-health-weekly

on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

concurrency:
  group: code-health-weekly
  cancel-in-progress: false

jobs:
  report:
    name: Weekly Code Health — Report Only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - name: Install pinned report dependencies
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          curl --fail --location --silent --show-error \
            https://github.com/AlDanial/cloc/releases/download/v2.06/cloc-2.06.pl \
            --output "$RUNNER_TEMP/cloc"
          echo "ed9fbdd081a2ceb933ea490b3c1cfacc87d3898ae2650d0d6756439695a836c8  $RUNNER_TEMP/cloc" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/cloc"
      - name: Fetch candidate verification outcomes for governance side-effect comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE="$(date -u -d '56 days ago' +%Y-%m-%d)"
          for WORKFLOW in code-health-integration.yml app_pipeline.yml service_pipeline.yml; do
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/${WORKFLOW}/runs?per_page=100&created=>=${SINCE}" \
              > "$RUNNER_TEMP/runs-${WORKFLOW}.json" || echo '[]' > "$RUNNER_TEMP/runs-${WORKFLOW}.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          pages = []
          for path in sorted(root.glob("runs-*.json")):
              loaded = json.loads(path.read_text(encoding="utf-8"))
              pages.extend(loaded if isinstance(loaded, list) else [loaded])
          (root / "delivery-runs.json").write_text(json.dumps(pages), encoding="utf-8")
          PY
      - name: Materialize recent weekly history facts
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/code-health-weekly-history"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          PYTHONDONTWRITEBYTECODE=1 python3 -B quwoquan_ops/ci/code_health_evidence.py pull-weekly-history \
            --repository "$WEEKLY_REPOSITORY" --limit 8 --output-dir "$RUNNER_TEMP/code-health-weekly-history" \
            | tee "$RUNNER_TEMP/weekly-history.json"
      - name: Generate canonical report-only observation
        run: |
          set -euo pipefail
          PREVIOUS_ARGS=()
          for REPORT in "$RUNNER_TEMP"/code-health-weekly-history/*.json; do
            [ -f "$REPORT" ] && PREVIOUS_ARGS+=(--previous "$REPORT")
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -B quwoquan_ops/gate/report_code_health_weekly.py \
            --head "${{ github.sha }}" \
            --cloc "$RUNNER_TEMP/cloc" \
            --delivery-runs "$RUNNER_TEMP/delivery-runs.json" \
            --summary-markdown "$RUNNER_TEMP/weekly-summary.md" \
            "${PREVIOUS_ARGS[@]}"
      - name: Render successful report summary
        if: success()
        run: cat "$RUNNER_TEMP/weekly-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable weekly fact
        if: success()
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT_PATH="$(python3 - <<'PY'
          import os
          from pathlib import Path
          print(next(Path(os.environ["QWQ_OUTPUT_ROOT"]).glob("env/repo/runs/code-health/weekly/**/report.json")))
          PY
          )"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          PYTHONDONTWRITEBYTECODE=1 python3 -B quwoquan_ops/ci/code_health_evidence.py publish \
            --report "$REPORT_PATH" \
            --repository "$WEEKLY_REPOSITORY" \
            --transport-tag "week-$(date -u +%G-W%V)" \
            | tee "$RUNNER_TEMP/weekly-publish.json"
          echo "- weekly fact: \`$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["exactRef"])' "$RUNNER_TEMP/weekly-publish.json")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload successful weekly report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-health-weekly-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/code-health/weekly/**/report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload failed weekly diagnostic
        if: failure() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-health-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/code-health/weekly/**/report.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
