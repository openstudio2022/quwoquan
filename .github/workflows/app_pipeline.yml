# =============================================================================
# App Pipeline — quwoquan_app CI/CD
# =============================================================================
# 触发条件：v* tag 发布 / 手动
# 职责：端侧正式发布构建与制品纯度/来源证明；L1/L2 门禁统一由 03 Delivery Gate 承担
#
# 受 production Environment 保护的 Android/iOS 签名材料见 CI_CD_SECRETS.md。
# =============================================================================

name: 01. App Pipeline

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Flutter Build macOS
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: 缓存 Flutter 依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.pub-cache
            quwoquan_app/.dart_tool
          key: "flutter-macos-${{ runner.os }}-${{ hashFiles('quwoquan_app/pubspec.lock') }}"
          restore-keys: |
            flutter-macos-${{ runner.os }}-

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        working-directory: quwoquan_app
        run: flutter pub get

      - name: Flutter Build macOS
        working-directory: quwoquan_app
        env:
          QWQ_APP_RUNTIME_ENV: prod
        run: |
          set -euo pipefail
          DART_DEFINES=()
          while IFS= read -r define; do
            [ -n "${define}" ] && DART_DEFINES+=("${define}")
          done < <(python3 scripts/env/print_app_env_dart_defines.py --env prod --format args)
          flutter build macos --release -t lib/main_prod.dart "${DART_DEFINES[@]}"
          python3 scripts/runtime/verify_production_release_artifact.py \
            --platform macos \
            --artifact build/macos/Build/Products/Release \
            --report build/release-attestation/macos.json

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-build-${{ github.ref_name }}
          path: |
            quwoquan_app/build/macos/Build/Products/Release/
            quwoquan_app/build/release-attestation/macos.json

      - name: 上传构建失败日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-build-fail-logs
          path: quwoquan_app/build/

  build-android-release:
    name: Flutter Build Android Release
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: 安装依赖
        working-directory: quwoquan_app
        run: flutter pub get
      - name: 验证 Production 单一装配路径
        run: make verify-production-wiring-purity
      - name: 构建并验证正式 Android AAB 与 APK
        working-directory: quwoquan_app
        env:
          QWQ_APP_RUNTIME_ENV: prod
          QWQ_DEPLOY_WORK_ROOT: ${{ runner.temp }}/quwoquan-deploy
          QWQ_ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/quwoquan-release.jks
          QWQ_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.QWQ_ANDROID_RELEASE_STORE_PASSWORD }}
          QWQ_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.QWQ_ANDROID_RELEASE_KEY_ALIAS }}
          QWQ_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.QWQ_ANDROID_RELEASE_KEY_PASSWORD }}
          QWQ_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.QWQ_ANDROID_RELEASE_KEYSTORE_B64 }}
          QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256: ${{ secrets.QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256 }}
          QWQ_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.QWQ_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "${QWQ_ANDROID_RELEASE_KEYSTORE_B64}" || { echo "::error::QWQ_ANDROID_RELEASE_KEYSTORE_B64 is required"; exit 2; }
          test -n "${QWQ_ANDROID_RELEASE_STORE_PASSWORD}" || { echo "::error::QWQ_ANDROID_RELEASE_STORE_PASSWORD is required"; exit 2; }
          test -n "${QWQ_ANDROID_RELEASE_KEY_ALIAS}" || { echo "::error::QWQ_ANDROID_RELEASE_KEY_ALIAS is required"; exit 2; }
          test -n "${QWQ_ANDROID_RELEASE_KEY_PASSWORD}" || { echo "::error::QWQ_ANDROID_RELEASE_KEY_PASSWORD is required"; exit 2; }
          test -n "${QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256}" || { echo "::error::QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256 is required"; exit 2; }
          test -n "${QWQ_ANDROID_GOOGLE_SERVICES_JSON}" || { echo "::error::QWQ_ANDROID_GOOGLE_SERVICES_JSON is required"; exit 2; }
          printf '%s' "${QWQ_ANDROID_RELEASE_KEYSTORE_B64}" | base64 --decode > "${QWQ_ANDROID_RELEASE_KEYSTORE_PATH}"
          printf '%s' "${QWQ_ANDROID_GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          cleanup() {
            rm -f android/app/google-services.json "${QWQ_ANDROID_RELEASE_KEYSTORE_PATH}"
          }
          trap cleanup EXIT
          mkdir -p build/release-attestation
          python3 scripts/device/build_launcher_handoff.py \
            --env prod \
            --target prod-hosted \
            --launch-mode release_package \
            > build/release-attestation/android-launcher-handoff.json
          eval "$(
            python3 - build/release-attestation/android-launcher-handoff.json <<'PY'
          import json
          import shlex
          import sys

          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          for key, value in {
              "QWQ_LAUNCH_TARGET": handoff["target"],
              "QWQ_DART_DEFINES_DIGEST": handoff["dartDefinesDigest"],
              "QWQ_EXPECTED_RUNTIME_CONFIG_DIGEST": handoff["runtimeConfigDigest"],
              "QWQ_EFFECTIVE_LAUNCH_MANIFEST_DIGEST": handoff["effectiveLaunchManifestDigest"],
              "QWQ_APP_RECOVERY_BASE_URL": handoff["recoveryBaseUrl"],
              "QWQ_APP_PUBLIC_WEB_URL": handoff["publicWebBaseUrl"],
              "ENTRYPOINT": handoff["entrypoint"],
          }.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
          )"
          export QWQ_APP_BUILD_CONTEXT=package-only
          DART_DEFINES=()
          while IFS= read -r define; do
            [ -n "${define}" ] && DART_DEFINES+=("${define}")
          done < <(
            python3 - build/release-attestation/android-launcher-handoff.json <<'PY'
          import json
          import sys

          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          for key, value in handoff["dartDefines"].items():
              print(f"--dart-define={key}={value}")
          PY
          )
          flutter build appbundle --release -t "$ENTRYPOINT" "${DART_DEFINES[@]}"
          flutter build apk --release -t "$ENTRYPOINT" "${DART_DEFINES[@]}"
          jarsigner -verify -strict -certs \
            build/app/outputs/bundle/release/app-release.aab
          APKSIGNER="$(
            python3 - "${ANDROID_HOME}/build-tools" <<'PY'
          import sys
          from pathlib import Path

          candidates = sorted(Path(sys.argv[1]).glob("*/apksigner"))
          print(candidates[-1] if candidates else "")
          PY
          )"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk
          python3 scripts/runtime/verify_production_release_artifact.py \
            --platform android \
            --artifact build/app/outputs/bundle/release/app-release.aab \
            --launcher-handoff build/release-attestation/android-launcher-handoff.json \
            --report build/release-attestation/android-aab.json
          python3 scripts/runtime/verify_production_release_artifact.py \
            --platform android \
            --artifact build/app/outputs/flutter-apk/app-release.apk \
            --launcher-handoff build/release-attestation/android-launcher-handoff.json \
            --report build/release-attestation/android-apk.json
          python3 ../quwoquan_ops/cli/stackctl.py --output-format json package \
            --env prod \
            --target prod-hosted \
            --kind app-release \
            --apk-path build/app/outputs/flutter-apk/app-release.apk \
            > build/release-attestation/android-official-package.json
          OFFICIAL_MANIFEST="$(
            python3 - "$QWQ_DEPLOY_WORK_ROOT/prod-hosted/packages/app/official-release/android" <<'PY'
          import sys
          from pathlib import Path

          manifests = sorted(Path(sys.argv[1]).glob("*/manifest.json"))
          print(manifests[-1] if manifests else "")
          PY
          )"
          test -n "$OFFICIAL_MANIFEST" || {
            echo "::error::official Android release manifest was not generated"
            exit 2
          }
          python3 ../quwoquan_ops/cli/prod/prevalidate_android_distribution.py \
            --package-manifest "$OFFICIAL_MANIFEST" \
            --report build/release-attestation/android-distribution-prevalidation.json
      - name: 上传 Android 正式制品与证明
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            quwoquan_app/build/app/outputs/bundle/release/app-release.aab
            quwoquan_app/build/app/outputs/flutter-apk/app-release.apk
            quwoquan_app/build/release-attestation/

  build-web-release:
    name: Flutter Build Web Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: 构建并验证正式 Web 制品
        working-directory: quwoquan_app
        env:
          QWQ_APP_RUNTIME_ENV: prod
        run: |
          set -euo pipefail
          flutter pub get
          DART_DEFINES=()
          while IFS= read -r define; do
            [ -n "${define}" ] && DART_DEFINES+=("${define}")
          done < <(python3 scripts/env/print_app_env_dart_defines.py --env prod --format args)
          flutter build web --release -t lib/main_prod.dart "${DART_DEFINES[@]}"
          python3 scripts/runtime/verify_production_release_artifact.py \
            --platform web \
            --artifact build/web \
            --report build/release-attestation/web.json
      - name: 上传 Web 正式制品与证明
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-release-${{ github.ref_name }}
          path: |
            quwoquan_app/build/web/
            quwoquan_app/build/release-attestation/web.json

  build-ios-release:
    name: Flutter Build iOS IPA
    runs-on: macos-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: 导入 iOS 正式签名材料
        env:
          QWQ_IOS_DISTRIBUTION_CERT_P12_B64: ${{ secrets.QWQ_IOS_DISTRIBUTION_CERT_P12_B64 }}
          QWQ_IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.QWQ_IOS_DISTRIBUTION_CERT_PASSWORD }}
          QWQ_IOS_PROVISIONING_PROFILE_B64: ${{ secrets.QWQ_IOS_PROVISIONING_PROFILE_B64 }}
          QWQ_IOS_EXPORT_OPTIONS_PLIST_B64: ${{ secrets.QWQ_IOS_EXPORT_OPTIONS_PLIST_B64 }}
        run: |
          set -euo pipefail
          for required in \
            QWQ_IOS_DISTRIBUTION_CERT_P12_B64 \
            QWQ_IOS_DISTRIBUTION_CERT_PASSWORD \
            QWQ_IOS_PROVISIONING_PROFILE_B64 \
            QWQ_IOS_EXPORT_OPTIONS_PLIST_B64; do
            test -n "${!required}" || { echo "::error::${required} is required"; exit 2; }
          done
          CERTIFICATE_PATH="${RUNNER_TEMP}/quwoquan-distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/quwoquan.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/quwoquan-release.keychain-db"
          decode_base64_secret() {
            local variable_name="$1"
            local target="$2"
            VARIABLE_NAME="${variable_name}" TARGET="${target}" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["TARGET"]).write_bytes(
              base64.b64decode(os.environ[os.environ["VARIABLE_NAME"]], validate=True)
          )
          PY
          }
          decode_base64_secret QWQ_IOS_DISTRIBUTION_CERT_P12_B64 "${CERTIFICATE_PATH}"
          decode_base64_secret QWQ_IOS_PROVISIONING_PROFILE_B64 "${PROFILE_PATH}"
          decode_base64_secret QWQ_IOS_EXPORT_OPTIONS_PLIST_B64 "${RUNNER_TEMP}/ExportOptions.plist"
          security create-keychain -p "${RUNNER_TEMP}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${RUNNER_TEMP}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${QWQ_IOS_DISTRIBUTION_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "$HOME/Library/MobileDevice/Provisioning Profiles/quwoquan.mobileprovision"
      - name: 构建并验证正式 IPA
        working-directory: quwoquan_app
        env:
          QWQ_APP_RUNTIME_ENV: prod
        run: |
          set -euo pipefail
          flutter pub get
          make verify-production-wiring-purity
          mkdir -p build/release-attestation
          python3 scripts/device/build_launcher_handoff.py \
            --env prod \
            --target prod-hosted \
            --launch-mode release_package \
            > build/release-attestation/ios-launcher-handoff.json
          eval "$(
            python3 - build/release-attestation/ios-launcher-handoff.json <<'PY'
          import json
          import shlex
          import sys

          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          for key, value in {
              "QWQ_LAUNCH_TARGET": handoff["target"],
              "QWQ_DART_DEFINES_DIGEST": handoff["dartDefinesDigest"],
              "QWQ_EXPECTED_RUNTIME_CONFIG_DIGEST": handoff["runtimeConfigDigest"],
              "QWQ_EFFECTIVE_LAUNCH_MANIFEST_DIGEST": handoff["effectiveLaunchManifestDigest"],
              "QWQ_APP_RECOVERY_BASE_URL": handoff["recoveryBaseUrl"],
              "QWQ_APP_PUBLIC_WEB_URL": handoff["publicWebBaseUrl"],
              "ENTRYPOINT": handoff["entrypoint"],
          }.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
          )"
          export QWQ_APP_BUILD_CONTEXT=package-only
          DART_DEFINES=()
          while IFS= read -r define; do
            [ -n "${define}" ] && DART_DEFINES+=("${define}")
          done < <(
            python3 - build/release-attestation/ios-launcher-handoff.json <<'PY'
          import json
          import sys

          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          for key, value in handoff["dartDefines"].items():
              print(f"--dart-define={key}={value}")
          PY
          )
          flutter build ipa --release -t "$ENTRYPOINT" \
            --export-options-plist "${RUNNER_TEMP}/ExportOptions.plist" \
            "${DART_DEFINES[@]}"
          IPA_PATHS=(build/ios/ipa/*.ipa)
          test "${#IPA_PATHS[@]}" -eq 1
          IPA_PATH="${IPA_PATHS[0]}"
          rm -rf "${RUNNER_TEMP}/quwoquan-ipa-verify"
          mkdir -p "${RUNNER_TEMP}/quwoquan-ipa-verify"
          ditto -x -k "$IPA_PATH" "${RUNNER_TEMP}/quwoquan-ipa-verify"
          APP_PATHS=("${RUNNER_TEMP}"/quwoquan-ipa-verify/Payload/*.app)
          test "${#APP_PATHS[@]}" -eq 1
          codesign --verify --deep --strict --verbose=4 "${APP_PATHS[0]}"
          test -f "${APP_PATHS[0]}/embedded.mobileprovision"
          python3 scripts/runtime/verify_production_release_artifact.py \
            --platform ios \
            --artifact "$IPA_PATH" \
            --launcher-handoff build/release-attestation/ios-launcher-handoff.json \
            --report build/release-attestation/ios.json
      - name: 上传 iOS 正式制品与证明
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-release-${{ github.ref_name }}
          path: |
            quwoquan_app/build/ios/ipa/
            quwoquan_app/build/release-attestation/ios.json
            quwoquan_app/build/release-attestation/ios-launcher-handoff.json
