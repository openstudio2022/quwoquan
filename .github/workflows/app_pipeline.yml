# Canonical App candidate builder. CI is deliberately a thin stackctl caller:
# the five metadata-owned build products share one source capsule contract.
name: 01. App Pipeline

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      source_git_sha:
        description: Full Git SHA owned by the mainline candidate run
        required: true
        type: string
      base_git_sha:
        description: Optional affected-scope comparison SHA
        required: false
        default: ''
        type: string
    secrets:
      QWQ_ANDROID_RELEASE_STORE_PASSWORD: {required: true}
      QWQ_ANDROID_RELEASE_KEY_ALIAS: {required: true}
      QWQ_ANDROID_RELEASE_KEY_PASSWORD: {required: true}
      QWQ_ANDROID_RELEASE_KEYSTORE_B64: {required: true}
      QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256: {required: true}
      QWQ_ANDROID_NONPROD_GOOGLE_SERVICES_JSON: {required: true}
      QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON: {required: true}
      QWQ_APP_RUNTIME_CONFIG_PROD_TRUSTED_PUBLIC_KEYS_JSON: {required: true}
    outputs:
      app_evidence_ref:
        description: Immutable GHCR OCI digest ref containing all App packages and evidence
        value: ${{ jobs.aggregate.outputs.app_evidence_ref }}
      app_evidence_digest:
        description: OCI transport manifest digest; never a release candidate identity
        value: ${{ jobs.aggregate.outputs.app_evidence_digest }}
      source_git_sha:
        description: Source SHA verified by every App build product
        value: ${{ jobs.aggregate.outputs.source_git_sha }}
      machine_critical_path_seconds:
        description: Diagnostic Jobs API execution path across five build products
        value: ${{ jobs.aggregate.outputs.machine_critical_path_seconds }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/quwoquan
  QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output
  SHARD_TRANSPORT_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: app-candidate-${{ inputs.source_git_sha }}
  cancel-in-progress: false

jobs:
  product:
    name: App package product / ${{ matrix.buildProductId }}
    runs-on: macos-latest
    environment: release-signing
    timeout-minutes: 30
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - buildProductId: android-nonprod-apk
            profile: nonprod
            format: apk
          - buildProductId: android-prod-apk
            profile: prod
            format: apk
          - buildProductId: ios-nonprod-app
            profile: nonprod
            format: app
          - buildProductId: ios-prod-app
            profile: prod
            format: app
          - buildProductId: web-shared
            profile: shared
            format: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_git_sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.buildProductId == 'web-shared'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quwoquan_ops/portal/package-lock.json
      - id: flutter_version
        run: echo "value=$(tr -d '[:space:]' < quwoquan_app/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '${{ steps.flutter_version.outputs.value }}', cache: true}
      - name: Require exact clean candidate checkout
        env: {EXPECTED_SOURCE: '${{ inputs.source_git_sha }}'}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
      - id: strict_inputs
        name: Prepare fresh source-bound package inputs
        env:
          EXPECTED_SOURCE: ${{ inputs.source_git_sha }}
          QWQ_DEPLOY_WORK_ROOT: ${{ runner.temp }}/quwoquan-deploy
          QWQ_APP_RUNTIME_CONFIG_PROD_TRUSTED_PUBLIC_KEYS_JSON: ${{ secrets.QWQ_APP_RUNTIME_CONFIG_PROD_TRUSTED_PUBLIC_KEYS_JSON }}
        run: |
          set -euo pipefail
          PACKAGE_ENVIRONMENT=prod
          PACKAGE_TARGET=prod-hosted
          if [ "${{ matrix.profile }}" = nonprod ]; then
            PACKAGE_ENVIRONMENT=alpha
            PACKAGE_TARGET=alpha-local
          fi
          python3 quwoquan_ops/ci/prepare_app_pipeline_inputs.py \
            --build-product-id "${{ matrix.buildProductId }}" \
            --environment "$PACKAGE_ENVIRONMENT" --target "$PACKAGE_TARGET" \
            --expected-source-git-sha "$EXPECTED_SOURCE" \
            --work-root "$RUNNER_TEMP/app-pipeline-inputs" \
            --github-output "$GITHUB_OUTPUT"
      - name: Compile one canonical App build product through stackctl
        env:
          QWQ_OUTPUT_ROOT: ${{ steps.strict_inputs.outputs.qwq_output_root }}
          QWQ_DEPLOY_WORK_ROOT: ${{ runner.temp }}/quwoquan-deploy
          QWQ_APP_RUNTIME_CONFIG_TRUST_PATH: ${{ steps.strict_inputs.outputs.runtime_config_trust_path }}
          QWQ_COCOAPODS_EXECUTABLE: ${{ steps.strict_inputs.outputs.cocoapods_executable }}
          QWQ_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.QWQ_ANDROID_RELEASE_STORE_PASSWORD }}
          QWQ_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.QWQ_ANDROID_RELEASE_KEY_ALIAS }}
          QWQ_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.QWQ_ANDROID_RELEASE_KEY_PASSWORD }}
          QWQ_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.QWQ_ANDROID_RELEASE_KEYSTORE_B64 }}
          QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256: ${{ secrets.QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256 }}
          QWQ_ANDROID_NONPROD_GOOGLE_SERVICES_JSON: ${{ secrets.QWQ_ANDROID_NONPROD_GOOGLE_SERVICES_JSON }}
          QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON: ${{ secrets.QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON }}
          PROD_OPS_OIDC_ISSUER: ${{ vars.PROD_OPS_OIDC_ISSUER }}
          PROD_OPS_OIDC_CLIENT_ID: ${{ vars.PROD_OPS_OIDC_CLIENT_ID }}
          PROD_OPS_OIDC_AUDIENCE: ${{ vars.PROD_OPS_OIDC_AUDIENCE }}
          PROD_OPS_OIDC_SCOPE: ${{ vars.PROD_OPS_OIDC_SCOPE }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.format }}" = apk ]; then
            FIREBASE_INPUT=QWQ_ANDROID_NONPROD_GOOGLE_SERVICES_JSON
            if [ "${{ matrix.profile }}" = prod ]; then
              FIREBASE_INPUT=QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON
            fi
            python3 quwoquan_ops/gate/require_ci_inputs.py --scope release-signing \
              QWQ_ANDROID_RELEASE_KEYSTORE_B64 QWQ_ANDROID_RELEASE_STORE_PASSWORD \
              QWQ_ANDROID_RELEASE_KEY_ALIAS QWQ_ANDROID_RELEASE_KEY_PASSWORD \
              QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256 \
              "$FIREBASE_INPUT"
          fi
          RESULT="$RUNNER_TEMP/stackctl-app-result.json"
          python3 quwoquan_ops/cli/stackctl.py --output-format json package \
            --kind app-artifact \
            --build-product-id "${{ matrix.buildProductId }}" > "$RESULT"

          COLLECT_ARGS=(
            --result "$RESULT"
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence"
          )
          if [ "${{ matrix.buildProductId }}" = android-prod-apk ]; then
            APK_PATH="$(python3 - "$RESULT" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          receipt = json.load(open(Path(result["attemptDir"]) / "build-receipt.json", encoding="utf-8"))
          print(Path(receipt["artifactPath"]).resolve())
          PY
            )"
            python3 quwoquan_ops/cli/stackctl.py --output-format json package \
              --env prod --target prod-hosted --kind app-release --apk-path "$APK_PATH" \
              > "$RUNNER_TEMP/stackctl-android-official-result.json"
            OFFICIAL_MANIFEST="$(python3 - "$QWQ_DEPLOY_WORK_ROOT/prod-hosted/packages/app/official-release/android" <<'PY'
          import sys
          from pathlib import Path
          manifests = sorted(Path(sys.argv[1]).glob("*/manifest.json"))
          if len(manifests) != 1:
              raise SystemExit("GATE_BLOCK: expected one canonical Android official manifest")
          print(manifests[0])
          PY
            )"
            COLLECT_ARGS+=(--android-release-manifest "$OFFICIAL_MANIFEST")
          fi
          if [ "${{ matrix.buildProductId }}" = web-shared ]; then
            WEB_RELEASE_MANIFEST="$RUNNER_TEMP/app-pipeline-web-release.json"
            python3 quwoquan_ops/ci/materialize_app_pipeline_web_release.py \
              --result "$RESULT" --output "$WEB_RELEASE_MANIFEST"
            COLLECT_ARGS+=(--web-release-manifest "$WEB_RELEASE_MANIFEST")
          fi
          python3 quwoquan_ops/ci/collect_stackctl_app_shard.py "${COLLECT_ARGS[@]}"

          if [ "${{ matrix.buildProductId }}" = web-shared ]; then
            python3 quwoquan_ops/gate/require_ci_inputs.py --scope release-signing \
              PROD_OPS_OIDC_ISSUER PROD_OPS_OIDC_CLIENT_ID \
              PROD_OPS_OIDC_AUDIENCE PROD_OPS_OIDC_SCOPE
            python3 quwoquan_ops/cli/stackctl.py --output-format json package \
              --env prod --target prod-hosted --kind ops-portal \
              > "$RUNNER_TEMP/stackctl-ops-portal-result.json"
            PORTAL_DIR="$(python3 - <<'PY'
          from quwoquan_ops.cli.lib.output_paths import portal_deployment_package_dir
          current = portal_deployment_package_dir("prod", target="prod-hosted") / "current"
          if not current.is_symlink():
              raise SystemExit("GATE_BLOCK: Prod Ops Portal current package is not immutable")
          print(current.resolve())
          PY
            )"
            mkdir -p "$RUNNER_TEMP/app-candidate-evidence/payloads/opsPortal"
            cp "$PORTAL_DIR/manifest.json" \
              "$RUNNER_TEMP/app-candidate-evidence/payloads/opsPortal/manifest.json"
            cp -R "$PORTAL_DIR/dist" \
              "$RUNNER_TEMP/app-candidate-evidence/payloads/opsPortal/dist"
            cp "$PORTAL_DIR/provenance.json" \
              "$RUNNER_TEMP/app-candidate-evidence/ops-portal-provenance.json"
          fi
      - name: Publish build-product shard to immutable OCI transport
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          trap 'oras logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/app_candidate_oci_transport.py publish-shard \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --repository "$REGISTRY/$IMAGE_PREFIX/app-candidate-shard-${{ matrix.buildProductId }}" \
            --transport-tag "$SHARD_TRANSPORT_TAG"

  aggregate:
    name: App candidate OCI / aggregate
    needs: [product]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, packages: write, actions: read}
    outputs:
      app_evidence_ref: ${{ steps.identity.outputs.app_evidence_ref }}
      app_evidence_digest: ${{ steps.identity.outputs.app_evidence_digest }}
      source_git_sha: ${{ steps.identity.outputs.source_git_sha }}
      machine_critical_path_seconds: ${{ steps.timing.outputs.machine_critical_path_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_git_sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - name: Materialize all five build-product shards from exact OCI digests
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          trap 'oras logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/app_candidate_oci_transport.py materialize-shards \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --repository-prefix "$REGISTRY/$IMAGE_PREFIX" \
            --transport-tag "$SHARD_TRANSPORT_TAG"
      - name: Validate complete five-product App package bundle
        env: {SOURCE_GIT_SHA: '${{ inputs.source_git_sha }}'}
        run: |
          set -euo pipefail
          SOURCE_TREE_DIGEST="sha1:$(git rev-parse 'HEAD^{tree}')"
          python3 quwoquan_ops/ci/render_release_application_package.py validate-bundle \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --source-git-sha "$SOURCE_GIT_SHA" --source-tree-digest "$SOURCE_TREE_DIGEST"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: {registry: '${{ env.REGISTRY }}', username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: publish
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ runner.temp }}/app-candidate-evidence
          file: ${{ github.workspace }}/quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/app-candidate-artifact:run-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: identity
        name: Expose immutable App OCI identity
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
          APP_EVIDENCE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$APP_EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          APP_EVIDENCE_REF="$REGISTRY/$IMAGE_PREFIX/app-candidate-artifact@$APP_EVIDENCE_DIGEST"
          {
            echo "app_evidence_ref=$APP_EVIDENCE_REF"
            echo "app_evidence_digest=$APP_EVIDENCE_DIGEST"
            echo "source_git_sha=$SOURCE_GIT_SHA"
          } >> "$GITHUB_OUTPUT"
      - id: timing
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          python3 quwoquan_ops/ci/render_app_candidate_timing.py \
            --repository "${{ github.repository }}" --run-id "${{ github.run_id }}" \
            --token "$GITHUB_TOKEN" --github-output "$GITHUB_OUTPUT"
