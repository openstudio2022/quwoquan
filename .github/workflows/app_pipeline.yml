# App candidate builder. It is reusable only: mainline orchestration owns promotion.
# Four platform matrices run alpha/beta/gamma/prod shards in parallel and bind every
# real package to one source tree, then Linux aggregate publishes one immutable OCI.
name: 01. App Pipeline

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      source_git_sha:
        description: Full Git SHA owned by the mainline candidate run
        required: true
        type: string
      base_git_sha:
        description: Optional comparison SHA used by the caller for affected-scope planning
        required: false
        default: ''
        type: string
    secrets:
      QWQ_ANDROID_RELEASE_STORE_PASSWORD:
        required: true
      QWQ_ANDROID_RELEASE_KEY_ALIAS:
        required: true
      QWQ_ANDROID_RELEASE_KEY_PASSWORD:
        required: true
      QWQ_ANDROID_RELEASE_KEYSTORE_B64:
        required: true
      QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256:
        required: true
      QWQ_ANDROID_ALPHA_GOOGLE_SERVICES_JSON:
        required: true
      QWQ_ANDROID_BETA_GOOGLE_SERVICES_JSON:
        required: true
      QWQ_ANDROID_GAMMA_GOOGLE_SERVICES_JSON:
        required: true
      QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON:
        required: true
      QWQ_IOS_DISTRIBUTION_CERT_P12_B64:
        required: true
      QWQ_IOS_DISTRIBUTION_CERT_PASSWORD:
        required: true
      QWQ_IOS_PROVISIONING_PROFILE_B64:
        required: true
      QWQ_IOS_EXPORT_OPTIONS_PLIST_B64:
        required: true
    outputs:
      app_evidence_ref:
        description: Immutable GHCR OCI digest ref containing all App packages and evidence
        value: ${{ jobs.aggregate.outputs.app_evidence_ref }}
      app_evidence_digest:
        description: OCI transport manifest digest; never a release candidate identity
        value: ${{ jobs.aggregate.outputs.app_evidence_digest }}
      source_git_sha:
        description: Source SHA verified by every App package shard
        value: ${{ jobs.aggregate.outputs.source_git_sha }}
      machine_critical_path_seconds:
        description: Diagnostic Jobs API execution path across four shards and OCI aggregation
        value: ${{ jobs.aggregate.outputs.machine_critical_path_seconds }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/quwoquan
  QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output
  SHARD_TRANSPORT_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: app-candidate-${{ inputs.source_git_sha }}
  cancel-in-progress: false

jobs:
  android:
    name: App package shard / Android / ${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: [alpha, beta, gamma, prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_git_sha }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - id: flutter_version
        name: Read repository-pinned Flutter toolchain
        run: echo "value=$(tr -d '[:space:]' < quwoquan_app/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.value }}
          cache: true
      - name: Verify source identity and dependencies
        working-directory: quwoquan_app
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_GIT_SHA"
          flutter pub get
          make verify-production-wiring-purity
      - name: Build four immutable Android packages
        working-directory: quwoquan_app
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
          QWQ_DEPLOY_WORK_ROOT: ${{ runner.temp }}/quwoquan-deploy
          QWQ_ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/quwoquan-release.jks
          QWQ_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.QWQ_ANDROID_RELEASE_STORE_PASSWORD }}
          QWQ_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.QWQ_ANDROID_RELEASE_KEY_ALIAS }}
          QWQ_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.QWQ_ANDROID_RELEASE_KEY_PASSWORD }}
          QWQ_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.QWQ_ANDROID_RELEASE_KEYSTORE_B64 }}
          QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256: ${{ secrets.QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256 }}
          QWQ_ANDROID_ALPHA_GOOGLE_SERVICES_JSON: ${{ secrets.QWQ_ANDROID_ALPHA_GOOGLE_SERVICES_JSON }}
          QWQ_ANDROID_BETA_GOOGLE_SERVICES_JSON: ${{ secrets.QWQ_ANDROID_BETA_GOOGLE_SERVICES_JSON }}
          QWQ_ANDROID_GAMMA_GOOGLE_SERVICES_JSON: ${{ secrets.QWQ_ANDROID_GAMMA_GOOGLE_SERVICES_JSON }}
          QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON: ${{ secrets.QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          for required in \
            QWQ_ANDROID_RELEASE_KEYSTORE_B64 \
            QWQ_ANDROID_RELEASE_STORE_PASSWORD \
            QWQ_ANDROID_RELEASE_KEY_ALIAS \
            QWQ_ANDROID_RELEASE_KEY_PASSWORD \
            QWQ_ANDROID_EXPECTED_SIGNING_CERTIFICATE_SHA256 \
            QWQ_ANDROID_ALPHA_GOOGLE_SERVICES_JSON \
            QWQ_ANDROID_BETA_GOOGLE_SERVICES_JSON \
            QWQ_ANDROID_GAMMA_GOOGLE_SERVICES_JSON \
            QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON; do
            if [[ -z "${!required}" ]]; then
              echo "::error::${required} is required"
              exit 2
            fi
          done
          printf '%s' "$QWQ_ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$QWQ_ANDROID_RELEASE_KEYSTORE_PATH"
          cleanup() {
            rm -f android/app/google-services.json "$QWQ_ANDROID_RELEASE_KEYSTORE_PATH"
          }
          trap cleanup EXIT
          BUNDLE_ROOT="$RUNNER_TEMP/app-candidate-evidence"
          mkdir -p "$BUNDLE_ROOT/application-packages" "$BUNDLE_ROOT/payloads"
          SOURCE_TREE_DIGEST="sha1:$(git rev-parse 'HEAD^{tree}')"
          for env_name in "${{ matrix.environment }}"; do
            case "$env_name" in
              alpha) TARGET=alpha-local; FIREBASE_JSON="$QWQ_ANDROID_ALPHA_GOOGLE_SERVICES_JSON" ;;
              beta) TARGET=beta-local; FIREBASE_JSON="$QWQ_ANDROID_BETA_GOOGLE_SERVICES_JSON" ;;
              gamma) TARGET=gamma-local; FIREBASE_JSON="$QWQ_ANDROID_GAMMA_GOOGLE_SERVICES_JSON" ;;
              prod) TARGET=prod-hosted; FIREBASE_JSON="$QWQ_ANDROID_PROD_GOOGLE_SERVICES_JSON" ;;
            esac
            printf '%s' "$FIREBASE_JSON" > android/app/google-services.json
            HANDOFF="build/release-attestation/${env_name}-android-launcher-handoff.json"
            mkdir -p "$(dirname "$HANDOFF")"
            python3 scripts/device/build_launcher_handoff.py \
              --env "$env_name" \
              --target "$TARGET" \
              --launch-mode release_package > "$HANDOFF"
            eval "$(python3 - "$HANDOFF" <<'PY'
          import json
          import shlex
          import sys

          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          values = {
              "QWQ_LAUNCH_TARGET": handoff["target"],
              "QWQ_DART_DEFINES_DIGEST": handoff["dartDefinesDigest"],
              "QWQ_EXPECTED_RUNTIME_CONFIG_DIGEST": handoff["runtimeConfigDigest"],
              "QWQ_EFFECTIVE_LAUNCH_MANIFEST_DIGEST": handoff["effectiveLaunchManifestDigest"],
              "QWQ_APP_RECOVERY_BASE_URL": handoff["recoveryBaseUrl"],
              "QWQ_APP_PUBLIC_WEB_URL": handoff["publicWebBaseUrl"],
              "QWQ_APP_DOWNLOAD_BASE_URL": handoff["appDownloadBaseUrl"],
              "ENTRYPOINT": handoff["entrypoint"],
          }
          for key, value in values.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
            )"
            export QWQ_APP_RUNTIME_ENV="$env_name"
            export QWQ_APP_BUILD_CONTEXT=package-only
            mapfile -t DART_DEFINES < <(python3 - "$HANDOFF" <<'PY'
          import json
          import sys
          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          for key, value in handoff["dartDefines"].items():
              print(f"--dart-define={key}={value}")
          PY
            )
            flutter build apk --release -t "$ENTRYPOINT" "${DART_DEFINES[@]}"
            APKSIGNER="$(python3 - "$ANDROID_HOME/build-tools" <<'PY'
          import sys
          from pathlib import Path
          candidates = sorted(Path(sys.argv[1]).glob("*/apksigner"))
          print(candidates[-1] if candidates else "")
          PY
            )"
            test -x "$APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
            if [ "$env_name" != prod ]; then
              DEST="$BUNDLE_ROOT/payloads/$env_name/android/app-release.apk"
              mkdir -p "$(dirname "$DEST")"
              cp build/app/outputs/flutter-apk/app-release.apk "$DEST"
              python3 ../quwoquan_ops/ci/render_release_application_package.py render \
                --environment "$env_name" \
                --surface android \
                --package "$(dirname "$DEST")" \
                --source-git-sha "$SOURCE_GIT_SHA" \
                --source-tree-digest "$SOURCE_TREE_DIGEST" \
                --output "$BUNDLE_ROOT/application-packages/${env_name}--android.json"
              continue
            fi
            flutter build appbundle --release -t "$ENTRYPOINT" "${DART_DEFINES[@]}"
            jarsigner -verify -strict -certs build/app/outputs/bundle/release/app-release.aab
            python3 scripts/runtime/architecture/verify_production_release_artifact.py \
              --platform android \
              --artifact build/app/outputs/flutter-apk/app-release.apk \
              --launcher-handoff "$HANDOFF" \
              --report build/release-attestation/prod-android.json
            python3 ../quwoquan_ops/cli/stackctl.py --output-format json package \
              --env prod \
              --target prod-hosted \
              --kind app-release \
              --apk-path build/app/outputs/flutter-apk/app-release.apk \
              > build/release-attestation/android-official-package.json
            OFFICIAL_MANIFEST="$(python3 - "$QWQ_DEPLOY_WORK_ROOT/prod-hosted/packages/app/official-release/android" <<'PY'
          import sys
          from pathlib import Path
          manifests = sorted(Path(sys.argv[1]).glob("*/manifest.json"))
          if len(manifests) != 1:
              raise SystemExit("GATE_BLOCK: expected exactly one Android release manifest")
          print(manifests[0])
          PY
            )"
            PACKAGED_APK="$(python3 - "$OFFICIAL_MANIFEST" <<'PY'
          import json
          import sys
          value = str(json.load(open(sys.argv[1], encoding="utf-8")).get("packagedAPK") or "")
          if not value or "/" in value or "\\" in value:
              raise SystemExit("GATE_BLOCK: Android packagedAPK is not a canonical filename")
          print(value)
          PY
            )"
            mkdir -p "$BUNDLE_ROOT/payloads/prod/android"
            cp "$(dirname "$OFFICIAL_MANIFEST")/$PACKAGED_APK" \
              "$BUNDLE_ROOT/payloads/prod/android/$PACKAGED_APK"
            python3 ../quwoquan_ops/ci/render_release_application_package.py bind-special \
              --kind android \
              --manifest "$OFFICIAL_MANIFEST" \
              --source-git-sha "$SOURCE_GIT_SHA" \
              --source-tree-digest "$SOURCE_TREE_DIGEST" \
              --output "$BUNDLE_ROOT/android-release-manifest.json"
            python3 ../quwoquan_ops/cli/prod/prevalidate_android_distribution.py \
              --package-manifest "$OFFICIAL_MANIFEST" \
              --report build/release-attestation/android-distribution-prevalidation.json
          done
      - name: Publish Android shard to immutable OCI transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          trap 'oras logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/app_candidate_oci_transport.py publish-shard \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --repository "$REGISTRY/$IMAGE_PREFIX/app-candidate-shard-android-${{ matrix.environment }}" \
            --transport-tag "$SHARD_TRANSPORT_TAG"

  ios:
    name: App package shard / iOS / ${{ matrix.environment }}
    runs-on: macos-latest
    environment: release-signing
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: [alpha, beta, gamma, prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_git_sha }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - id: flutter_version
        name: Read repository-pinned Flutter toolchain
        run: echo "value=$(tr -d '[:space:]' < quwoquan_app/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.value }}
          cache: true
      - name: Import canonical iOS signing material
        env:
          QWQ_IOS_DISTRIBUTION_CERT_P12_B64: ${{ secrets.QWQ_IOS_DISTRIBUTION_CERT_P12_B64 }}
          QWQ_IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.QWQ_IOS_DISTRIBUTION_CERT_PASSWORD }}
          QWQ_IOS_PROVISIONING_PROFILE_B64: ${{ secrets.QWQ_IOS_PROVISIONING_PROFILE_B64 }}
          QWQ_IOS_EXPORT_OPTIONS_PLIST_B64: ${{ secrets.QWQ_IOS_EXPORT_OPTIONS_PLIST_B64 }}
        run: |
          set -euo pipefail
          for required in QWQ_IOS_DISTRIBUTION_CERT_P12_B64 QWQ_IOS_DISTRIBUTION_CERT_PASSWORD QWQ_IOS_PROVISIONING_PROFILE_B64 QWQ_IOS_EXPORT_OPTIONS_PLIST_B64; do
            test -n "${!required}" || { echo "::error::${required} is required"; exit 2; }
          done
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          values = {
              "QWQ_IOS_DISTRIBUTION_CERT_P12_B64": Path(os.environ["RUNNER_TEMP"]) / "quwoquan-distribution.p12",
              "QWQ_IOS_PROVISIONING_PROFILE_B64": Path(os.environ["RUNNER_TEMP"]) / "quwoquan.mobileprovision",
              "QWQ_IOS_EXPORT_OPTIONS_PLIST_B64": Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist",
          }
          for name, path in values.items():
              path.write_bytes(base64.b64decode(os.environ[name], validate=True))
          PY
          KEYCHAIN_PATH="$RUNNER_TEMP/quwoquan-release.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/quwoquan-distribution.p12" \
            -P "$QWQ_IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/quwoquan.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/quwoquan.mobileprovision"
      - name: Build four immutable iOS packages
        working-directory: quwoquan_app
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_GIT_SHA"
          flutter pub get
          make verify-production-wiring-purity
          BUNDLE_ROOT="$RUNNER_TEMP/app-candidate-evidence"
          mkdir -p "$BUNDLE_ROOT/application-packages" "$BUNDLE_ROOT/payloads"
          SOURCE_TREE_DIGEST="sha1:$(git rev-parse 'HEAD^{tree}')"
          for env_name in "${{ matrix.environment }}"; do
            case "$env_name" in
              alpha) TARGET=alpha-local ;;
              beta) TARGET=beta-local ;;
              gamma) TARGET=gamma-local ;;
              prod) TARGET=prod-hosted ;;
            esac
            HANDOFF="build/release-attestation/${env_name}-ios-launcher-handoff.json"
            mkdir -p "$(dirname "$HANDOFF")"
            python3 scripts/device/build_launcher_handoff.py \
              --env "$env_name" \
              --target "$TARGET" \
              --launch-mode release_package > "$HANDOFF"
            eval "$(python3 - "$HANDOFF" <<'PY'
          import json
          import shlex
          import sys
          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          values = {
              "QWQ_LAUNCH_TARGET": handoff["target"],
              "QWQ_DART_DEFINES_DIGEST": handoff["dartDefinesDigest"],
              "QWQ_EXPECTED_RUNTIME_CONFIG_DIGEST": handoff["runtimeConfigDigest"],
              "QWQ_EFFECTIVE_LAUNCH_MANIFEST_DIGEST": handoff["effectiveLaunchManifestDigest"],
              "QWQ_APP_RECOVERY_BASE_URL": handoff["recoveryBaseUrl"],
              "QWQ_APP_PUBLIC_WEB_URL": handoff["publicWebBaseUrl"],
              "QWQ_APP_DOWNLOAD_BASE_URL": handoff["appDownloadBaseUrl"],
              "ENTRYPOINT": handoff["entrypoint"],
          }
          for key, value in values.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
            )"
            export QWQ_APP_RUNTIME_ENV="$env_name"
            export QWQ_APP_BUILD_CONTEXT=package-only
            DART_DEFINES=()
            while IFS= read -r define; do
              [ -n "$define" ] && DART_DEFINES+=("$define")
            done < <(python3 - "$HANDOFF" <<'PY'
          import json
          import sys
          handoff = json.load(open(sys.argv[1], encoding="utf-8"))
          for key, value in handoff["dartDefines"].items():
              print(f"--dart-define={key}={value}")
          PY
            )
            rm -rf build/ios/ipa
            flutter build ipa --release -t "$ENTRYPOINT" \
              --export-options-plist "$RUNNER_TEMP/ExportOptions.plist" \
              "${DART_DEFINES[@]}"
            IPA_PATHS=(build/ios/ipa/*.ipa)
            test "${#IPA_PATHS[@]}" -eq 1
            IPA_PATH="${IPA_PATHS[0]}"
            VERIFY_ROOT="$RUNNER_TEMP/quwoquan-ipa-verify-$env_name"
            rm -rf "$VERIFY_ROOT"
            mkdir -p "$VERIFY_ROOT"
            ditto -x -k "$IPA_PATH" "$VERIFY_ROOT"
            APP_PATHS=("$VERIFY_ROOT"/Payload/*.app)
            test "${#APP_PATHS[@]}" -eq 1
            codesign --verify --deep --strict --verbose=4 "${APP_PATHS[0]}"
            test -f "${APP_PATHS[0]}/embedded.mobileprovision"
            DEST="$BUNDLE_ROOT/payloads/$env_name/ios/quwoquan.ipa"
            mkdir -p "$(dirname "$DEST")"
            cp "$IPA_PATH" "$DEST"
            python3 ../quwoquan_ops/ci/render_release_application_package.py render \
              --environment "$env_name" \
              --surface ios \
              --package "$(dirname "$DEST")" \
              --source-git-sha "$SOURCE_GIT_SHA" \
              --source-tree-digest "$SOURCE_TREE_DIGEST" \
              --output "$BUNDLE_ROOT/application-packages/${env_name}--ios.json"
            if [ "$env_name" = prod ]; then
              python3 scripts/runtime/architecture/verify_production_release_artifact.py \
                --platform ios \
                --artifact "$IPA_PATH" \
                --launcher-handoff "$HANDOFF" \
                --report build/release-attestation/prod-ios.json
            fi
          done
      - name: Publish iOS shard to immutable OCI transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          trap 'oras logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/app_candidate_oci_transport.py publish-shard \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --repository "$REGISTRY/$IMAGE_PREFIX/app-candidate-shard-ios-${{ matrix.environment }}" \
            --transport-tag "$SHARD_TRANSPORT_TAG"

  web:
    name: App package shard / Web / ${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: [alpha, beta, gamma, prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_git_sha }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.environment == 'prod'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quwoquan_ops/portal/package-lock.json
      - id: flutter_version
        name: Read repository-pinned Flutter toolchain
        run: echo "value=$(tr -d '[:space:]' < quwoquan_app/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.value }}
          cache: true
      - name: Build four immutable Web packages and Prod Ops Portal
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
          QWQ_DEPLOY_WORK_ROOT: ${{ runner.temp }}/quwoquan-deploy
          PROD_OPS_OIDC_ISSUER: ${{ vars.PROD_OPS_OIDC_ISSUER }}
          PROD_OPS_OIDC_CLIENT_ID: ${{ vars.PROD_OPS_OIDC_CLIENT_ID }}
          PROD_OPS_OIDC_AUDIENCE: ${{ vars.PROD_OPS_OIDC_AUDIENCE }}
          PROD_OPS_OIDC_SCOPE: ${{ vars.PROD_OPS_OIDC_SCOPE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_GIT_SHA"
          if [ "${{ matrix.environment }}" = prod ]; then
            for required in PROD_OPS_OIDC_ISSUER PROD_OPS_OIDC_CLIENT_ID PROD_OPS_OIDC_AUDIENCE PROD_OPS_OIDC_SCOPE; do
              if [[ -z "${!required}" ]]; then
                echo "::error::release-signing ${required} is required"
                exit 2
              fi
            done
          fi
          BUNDLE_ROOT="$RUNNER_TEMP/app-candidate-evidence"
          mkdir -p "$BUNDLE_ROOT/application-packages" "$BUNDLE_ROOT/payloads"
          SOURCE_TREE_DIGEST="sha1:$(git rev-parse 'HEAD^{tree}')"
          for env_name in "${{ matrix.environment }}"; do
            python3 quwoquan_ops/cli/stackctl.py package \
              --env "$env_name" \
              --kind web \
              --report-dir "$QWQ_OUTPUT_ROOT/env/$env_name/runs/app-candidate-web"
            RELEASE_DIR="$(python3 - "$env_name" <<'PY'
          import sys
          from quwoquan_ops.cli.lib.output_paths import (
              deployment_target_for_env,
              web_deployment_package_dir,
          )
          environment = sys.argv[1]
          target = deployment_target_for_env(environment)
          current = web_deployment_package_dir(environment, target=target) / "current"
          if not current.is_symlink():
              raise SystemExit("GATE_BLOCK: public Web current package is not immutable")
          print(current.resolve())
          PY
            )"
            if [ "$env_name" = prod ]; then
              mkdir -p "$BUNDLE_ROOT/payloads/prod/web"
              cp -R "$RELEASE_DIR/public/." "$BUNDLE_ROOT/payloads/prod/web/"
              python3 quwoquan_ops/ci/render_release_application_package.py bind-special \
                --kind publicWeb \
                --manifest "$RELEASE_DIR/manifest.json" \
                --source-git-sha "$SOURCE_GIT_SHA" \
                --source-tree-digest "$SOURCE_TREE_DIGEST" \
                --output "$BUNDLE_ROOT/public-web-manifest.json"
              continue
            fi
            DEST="$BUNDLE_ROOT/payloads/$env_name/web/public-web.tar.gz"
            mkdir -p "$(dirname "$DEST")"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf "$DEST" -C "$RELEASE_DIR" public
            python3 quwoquan_ops/ci/render_release_application_package.py render \
              --environment "$env_name" \
              --surface web \
              --package "$(dirname "$DEST")" \
              --source-git-sha "$SOURCE_GIT_SHA" \
              --source-tree-digest "$SOURCE_TREE_DIGEST" \
              --output "$BUNDLE_ROOT/application-packages/${env_name}--web.json"
          done
          if [ "${{ matrix.environment }}" = prod ]; then
            (
              cd quwoquan_ops/portal
              npm ci --no-audit --no-fund
            )
            python3 quwoquan_ops/cli/stackctl.py package \
              --env prod \
              --target prod-hosted \
              --kind ops-portal \
              --skip-install \
              --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/app-candidate-ops-portal"
            PORTAL_DIR="$(python3 - <<'PY'
          from quwoquan_ops.cli.lib.output_paths import portal_deployment_package_dir
          current = portal_deployment_package_dir("prod", target="prod-hosted") / "current"
          if not current.is_symlink():
              raise SystemExit("GATE_BLOCK: Ops Portal current package is not immutable")
          print(current.resolve())
          PY
            )"
            mkdir -p "$BUNDLE_ROOT/payloads/prod/opsPortal"
            cp "$PORTAL_DIR/manifest.json" "$BUNDLE_ROOT/payloads/prod/opsPortal/manifest.json"
            cp -R "$PORTAL_DIR/dist" "$BUNDLE_ROOT/payloads/prod/opsPortal/dist"
            python3 quwoquan_ops/ci/render_release_application_package.py bind-special \
              --kind opsPortal \
              --manifest "$PORTAL_DIR/provenance.json" \
              --source-git-sha "$SOURCE_GIT_SHA" \
              --source-tree-digest "$SOURCE_TREE_DIGEST" \
              --output "$BUNDLE_ROOT/ops-portal-provenance.json"
          fi
      - name: Publish Web shard to immutable OCI transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          trap 'oras logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/app_candidate_oci_transport.py publish-shard \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --repository "$REGISTRY/$IMAGE_PREFIX/app-candidate-shard-web-${{ matrix.environment }}" \
            --transport-tag "$SHARD_TRANSPORT_TAG"

  macos:
    name: App package shard / macOS / ${{ matrix.environment }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: [alpha, beta, gamma, prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_git_sha }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - id: flutter_version
        name: Read repository-pinned Flutter toolchain
        run: echo "value=$(tr -d '[:space:]' < quwoquan_app/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.value }}
          cache: true
      - name: Build four immutable macOS packages
        working-directory: quwoquan_app
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_GIT_SHA"
          flutter pub get
          BUNDLE_ROOT="$RUNNER_TEMP/app-candidate-evidence"
          mkdir -p "$BUNDLE_ROOT/application-packages" "$BUNDLE_ROOT/payloads"
          SOURCE_TREE_DIGEST="sha1:$(git rev-parse 'HEAD^{tree}')"
          for env_name in "${{ matrix.environment }}"; do
            export QWQ_APP_RUNTIME_ENV="$env_name"
            DART_DEFINES=()
            while IFS= read -r define; do
              [ -n "$define" ] && DART_DEFINES+=("$define")
            done < <(python3 scripts/env/print_app_env_dart_defines.py --env "$env_name" --format args)
            flutter build macos --release -t lib/main_prod.dart "${DART_DEFINES[@]}"
            APP_PATHS=(build/macos/Build/Products/Release/*.app)
            test "${#APP_PATHS[@]}" -eq 1
            if [ "$env_name" = prod ]; then
              python3 scripts/runtime/architecture/verify_production_release_artifact.py \
                --platform macos \
                --artifact "${APP_PATHS[0]}" \
                --report build/release-attestation/prod-macos.json
            fi
            DEST="$BUNDLE_ROOT/payloads/$env_name/macos/quwoquan-macos.zip"
            mkdir -p "$(dirname "$DEST")"
            ditto -c -k --sequesterRsrc --keepParent "${APP_PATHS[0]}" "$DEST"
            python3 ../quwoquan_ops/ci/render_release_application_package.py render \
              --environment "$env_name" \
              --surface macos \
              --package "$(dirname "$DEST")" \
              --source-git-sha "$SOURCE_GIT_SHA" \
              --source-tree-digest "$SOURCE_TREE_DIGEST" \
              --output "$BUNDLE_ROOT/application-packages/${env_name}--macos.json"
          done
      - name: Publish macOS shard to immutable OCI transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          trap 'oras logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/app_candidate_oci_transport.py publish-shard \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --repository "$REGISTRY/$IMAGE_PREFIX/app-candidate-shard-macos-${{ matrix.environment }}" \
            --transport-tag "$SHARD_TRANSPORT_TAG"

  aggregate:
    name: App candidate OCI / aggregate
    needs: [android, ios, web, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      app_evidence_ref: ${{ steps.identity.outputs.app_evidence_ref }}
      app_evidence_digest: ${{ steps.identity.outputs.app_evidence_digest }}
      source_git_sha: ${{ steps.identity.outputs.source_git_sha }}
      machine_critical_path_seconds: ${{ steps.timing.outputs.machine_critical_path_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_git_sha }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3
      - name: Materialize all matrix shards from exact OCI digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          trap 'oras logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/app_candidate_oci_transport.py materialize-shards \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --repository-prefix "$REGISTRY/$IMAGE_PREFIX" \
            --transport-tag "$SHARD_TRANSPORT_TAG"
      - name: Validate complete App package bundle
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_GIT_SHA"
          SOURCE_TREE_DIGEST="sha1:$(git rev-parse 'HEAD^{tree}')"
          python3 quwoquan_ops/ci/render_release_application_package.py validate-bundle \
            --bundle-dir "$RUNNER_TEMP/app-candidate-evidence" \
            --source-git-sha "$SOURCE_GIT_SHA" \
            --source-tree-digest "$SOURCE_TREE_DIGEST"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish complete immutable App candidate evidence
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ runner.temp }}/app-candidate-evidence
          file: ${{ github.workspace }}/quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/app-candidate-artifact:run-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: identity
        name: Expose immutable App OCI identity
        env:
          SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
          APP_EVIDENCE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$APP_EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          APP_EVIDENCE_REF="$REGISTRY/$IMAGE_PREFIX/app-candidate-artifact@$APP_EVIDENCE_DIGEST"
          {
            echo "app_evidence_ref=$APP_EVIDENCE_REF"
            echo "app_evidence_digest=$APP_EVIDENCE_DIGEST"
            echo "source_git_sha=$SOURCE_GIT_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "- App OCI evidence: \`$APP_EVIDENCE_REF\`" >> "$GITHUB_STEP_SUMMARY"
      - id: timing
        name: Calculate App candidate machine-path diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/render_app_candidate_timing.py \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --token "$GITHUB_TOKEN" \
            --github-output "$GITHUB_OUTPUT"
