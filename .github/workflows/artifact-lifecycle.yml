name: 00. Artifact Lifecycle

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - 01. App Pipeline
      - 02. Service Pipeline
      - 03. Delivery Gate
      - 04. Pre-Release Gate
      - 05. App Env Device Matrix
      - 07. Deploy To Prod (Controlled)
      - ML Training Pipeline
      - Recommendation API Integration
    types:
      - completed
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete lifecycle-expired Actions artifacts'
        required: true
        default: true
        type: boolean
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Reclaim invalid Actions artifacts
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.name != '00. Artifact Lifecycle' &&
          (
            github.event.workflow_run.name == '02. Service Pipeline' ||
            github.event.workflow_run.conclusion != 'success'
          )
        )
      }}
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ github.event_name != 'pull_request' }}
      - name: Audit and reclaim expired diagnostics
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --token-env GITHUB_TOKEN
            --failed-retention-days 3
            --output ".qwq_output/env/repo/runs/artifact-lifecycle/report.json"
          )
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            args+=(--run-id "${{ github.event.workflow_run.id }}")
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.apply }}" = "true" ]]; then
            args+=(--apply)
          fi
          python3 quwoquan_ops/ci/manage_actions_artifacts.py "${args[@]}"
      - name: Reclaim closed pull-request caches
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          cache_ids="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$CACHE_REF" --limit 100 --json id --jq '.[].id')"
          if [[ -z "$cache_ids" ]]; then
            echo "No isolated pull-request caches to reclaim."
            exit 0
          fi
          while IFS= read -r cache_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            echo "Reclaimed closed pull-request cache ${cache_id}."
          done <<< "$cache_ids"
