# Stable-tag admitted ProdActivationAdmissionFact transaction.
# Canonical qualified_prod.py logic is invoked through release_control.py.
name: 07. Deploy Qualified Stable Tag

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag_admission_ref:
        description: Exact immutable stable ReleaseTagAdmissionFact OCI @sha256 ref
        required: true
        type: string
      previous_active_released_ledger_ref:
        description: Exact immutable previous active released ledger OCI @sha256 ref
        required: true
        type: string
      rollback_readiness_ref:
        description: Exact immutable rollback readiness OCI @sha256 ref
        required: true
        type: string

concurrency:
  group: prod-stable-${{ inputs.release_tag_admission_ref }}
  cancel-in-progress: false

jobs:
  prod_activation_admission:
    name: Admit stable tag and exact OCI material
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: read
    outputs:
      admission_ref: ${{ steps.publish.outputs.admission_ref }}
      admission_digest: ${{ steps.admit.outputs.admission_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - id: admit
        name: Materialize exact stable AdmissionFact graph and admit Prod
        env:
          STORE: ${{ runner.temp }}/release-control
          TAG_FACT: ${{ inputs.release_tag_admission_ref }}
          PREVIOUS_FACT: ${{ inputs.previous_active_released_ledger_ref }}
          ROLLBACK_FACT: ${{ inputs.rollback_readiness_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          materialize_fact() {
            name="$1"; exact_ref="$2"
            [[ "$exact_ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
              --ref "$exact_ref" --output-file "$STORE/$exact_ref" >/dev/null
            local_digest="sha256:$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$STORE/$exact_ref")"
            printf '%s=%s\n' "$exact_ref" "$local_digest"
          }
          TAG_EXACT="$(materialize_fact release-tag "$TAG_FACT")"
          PREVIOUS_EXACT="$(materialize_fact previous-released "$PREVIOUS_FACT")"
          ROLLBACK_EXACT="$(materialize_fact rollback-readiness "$ROLLBACK_FACT")"
          python3 - "$STORE" "$TAG_FACT" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          store, tag_ref = Path(sys.argv[1]), sys.argv[2]
          tag = json.loads((store / tag_ref).read_text(encoding="utf-8"))
          original_tag_bytes = (store / tag_ref).read_bytes()
          for field in ("qualificationFact", "candidateMaterialManifest"):
              exact = tag.get(field)
              ref = exact.get("ref") if isinstance(exact, dict) else None
              digest = exact.get("digest") if isinstance(exact, dict) else None
              if not isinstance(ref, str) or not ref.startswith("ghcr.io/") or not isinstance(digest, str):
                  raise SystemExit(f"GATE_BLOCK: stable tag AdmissionFact {field} must be an exact OCI ref/digest")
              if ref.rsplit("@", 1)[-1] != digest:
                  raise SystemExit(f"GATE_BLOCK: stable tag AdmissionFact {field} OCI digest drifted")
              destination = store / ref
              destination.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  "python3", "quwoquan_ops/ci/promotion_evidence.py", "materialize-oci",
                  "--ref", ref, "--output-file", str(destination),
              ], check=True)
              if "sha256:" + hashlib.sha256(destination.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"GATE_BLOCK: stable tag AdmissionFact {field} payload digest drifted")
          if (store / tag_ref).read_bytes() != original_tag_bytes:
              raise SystemExit("GATE_BLOCK: release tag AdmissionFact bytes mutated during materialization")
          PY
          RESULT="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-admit \
            --release-tag-admission "$TAG_EXACT" \
            --previous-active-released-ledger "$PREVIOUS_EXACT" --rollback-readiness "$ROLLBACK_EXACT" \
            --control-plane-git-sha "${{ github.workflow_sha }}" --admitted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          ADMISSION_LOCAL_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' <<<"$RESULT")"
          ADMISSION_DIGEST="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' <<<"$RESULT")"
          {
            echo "admission_local_ref=$ADMISSION_LOCAL_REF"
            echo "admission_digest=$ADMISSION_DIGEST"
          } >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publish create-once ProdActivationAdmissionFact before canary
        env:
          STORE: ${{ runner.temp }}/release-control
          ADMISSION_LOCAL_REF: ${{ steps.admit.outputs.admission_local_ref }}
          ADMISSION_DIGEST: ${{ steps.admit.outputs.admission_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "sha256:$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$STORE/$ADMISSION_LOCAL_REF")" = "$ADMISSION_DIGEST"
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "$STORE/$ADMISSION_LOCAL_REF" \
            --repository "ghcr.io/${{ github.repository }}/prod-activation-admission" \
            --transport-tag "run-${{ github.run_id }}-${{ github.run_attempt }}" > "$RUNNER_TEMP/prod-admission-oci.json"
          EXACT_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/prod-admission-oci.json")"
          [[ "$EXACT_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          echo "admission_ref=$EXACT_REF" >> "$GITHUB_OUTPUT"

  prod_rollout:
    name: Canary to 100 percent
    needs: prod_activation_admission
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      released_fact_ref: ${{ steps.rollout.outputs.released_fact_ref }}
      released_fact_digest: ${{ steps.rollout.outputs.released_fact_digest }}
      full_stage_receipt_id: ${{ steps.rollout.outputs.full_stage_receipt_id }}
    env:
      QWQ_PROD_ROLLOUT_EVIDENCE_ROOT: ${{ vars.PROD_ROLLOUT_EVIDENCE_ROOT }}
      PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - id: activation_input
        name: Materialize exact activation graph and factory actual bytes
        env:
          ADMISSION_OCI_REF: ${{ needs.prod_activation_admission.outputs.admission_ref }}
          ADMISSION_DIGEST: ${{ needs.prod_activation_admission.outputs.admission_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/release-control"
          ADMISSION_LOCAL_REF="activation-input.json"
          [[ "$ADMISSION_OCI_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$ADMISSION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          mkdir -p "$STORE/$(dirname "$ADMISSION_OCI_REF")"
          python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
            --ref "$ADMISSION_OCI_REF" --output-file "$STORE/$ADMISSION_OCI_REF" >/dev/null
          test "sha256:$(shasum -a 256 "$STORE/$ADMISSION_OCI_REF" | awk '{print $1}')" = "$ADMISSION_DIGEST"
          while IFS=$'\t' read -r kind ref digest; do
            test -n "$kind" && test -n "$ref" && test -n "$digest"
            case "$kind" in
              authority)
                mkdir -p "$STORE/$(dirname "$ref")"
                python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
                  --ref "$ref" --output-file "$STORE/$ref" >/dev/null
                test "sha256:$(shasum -a 256 "$STORE/$ref" | awk '{print $1}')" = "$digest"
                ;;
              factory)
                output_dir="$RUNNER_TEMP/prod-factory-material/${ref##*/}"
                python3 quwoquan_ops/ci/materialize_evidence_oci.py \
                  --ref "$ref" --expected-digest "$digest" --output-dir "$output_dir" \
                  --require-file manifest.json
                local_ref="factory-material/${ref##*/}/manifest.json"
                mkdir -p "$STORE/$(dirname "$local_ref")"
                cp "$output_dir/manifest.json" "$STORE/$local_ref"
                local_digest="sha256:$(shasum -a 256 "$STORE/$local_ref" | awk '{print $1}')"
                case "$ref" in
                  */service-factory-material@*) factory_name="service" ;;
                  */app-candidate-artifact@*) factory_name="app" ;;
                  *) echo "::error::GATE_BLOCK: unknown factory OCI repository $ref"; exit 2 ;;
                esac
                printf '%s=%s\n' "$local_ref" "$local_digest" > "$RUNNER_TEMP/$factory_name-factory.exact"
                ;;
              *) echo "::error::GATE_BLOCK: unknown activation predecessor kind $kind"; exit 2 ;;
            esac
          done < <(python3 - "$STORE/$ADMISSION_OCI_REF" <<'PY'
          import json, re, sys
          fact = json.load(open(sys.argv[1], encoding="utf-8"))
          exact_ref = re.compile(r"^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$")
          exact_digest = re.compile(r"^sha256:[0-9a-f]{64}$")
          for field in ("releaseTagAdmission", "qualification", "candidateMaterialManifest", "previousActiveReleasedLedger", "rollbackReadiness"):
              value = fact.get(field)
              if not isinstance(value, dict) or set(value) != {"ref", "digest"} or exact_ref.fullmatch(str(value.get("ref", ""))) is None or exact_digest.fullmatch(str(value.get("digest", ""))) is None or value["ref"].rsplit("@", 1)[-1] != value["digest"]:
                  raise SystemExit(f"GATE_BLOCK: ProdActivationAdmissionFact {field} is not exact OCI-bound evidence")
              print("authority", value["ref"], value["digest"], sep="\t")
          factories = fact.get("factoryMaterials")
          if not isinstance(factories, dict) or set(factories) != {"service", "app"}:
              raise SystemExit("GATE_BLOCK: ProdActivationAdmissionFact factory closure is incomplete")
          for kind in ("service", "app"):
              value = factories[kind]
              if not isinstance(value, dict) or set(value) != {"ociRef", "ociDigest", "payloadDigest", "materialDigest"} or exact_ref.fullmatch(str(value.get("ociRef", ""))) is None or value["ociRef"].rsplit("@", 1)[-1] != value.get("ociDigest"):
                  raise SystemExit(f"GATE_BLOCK: {kind} factory material locator drifted")
              print("factory", value["ociRef"], value["ociDigest"], sep="\t")
          PY
          )
          SERVICE_FACTORY_EXACT="$(cat "$RUNNER_TEMP/service-factory.exact")"
          APP_FACTORY_EXACT="$(cat "$RUNNER_TEMP/app-factory.exact")"
          python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-materialize-input \
            --admission "$ADMISSION_OCI_REF=$ADMISSION_DIGEST" \
            --service-factory-material "$SERVICE_FACTORY_EXACT" \
            --app-factory-material "$APP_FACTORY_EXACT" \
            --output "$STORE/$ADMISSION_LOCAL_REF" --github-output "$GITHUB_OUTPUT"
          test -s "$STORE/$ADMISSION_LOCAL_REF"
          python3 - "$STORE/$ADMISSION_LOCAL_REF" "$ADMISSION_OCI_REF" "$ADMISSION_DIGEST" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          path, admission_ref, admission_digest, github_output = sys.argv[1:]
          envelope = json.load(open(path, encoding="utf-8"))
          if envelope.get("prodActivationAdmission") != {"ref": admission_ref, "digest": admission_digest}:
              raise SystemExit("GATE_BLOCK: materialized activation envelope admission binding drifted")
          with open(github_output, "a", encoding="utf-8") as output:
              output.write(f"admission_local_ref={path.rsplit('/', 1)[-1]}\n")
          PY
      # release_control prod-stage-append invokes append_prod_stage_attempt;
      # prod-terminal-release invokes create_terminal_released_fact; a failed
      # stackctl stage invokes prod-rollback/create_prod_rollback_fact.
      - id: rollout
        name: Execute canonical permanent rollout transaction
        env:
          FROM_CANDIDATE_DIGEST: ${{ steps.activation_input.outputs.from_candidate_digest }}
          TO_CANDIDATE_DIGEST: ${{ steps.activation_input.outputs.candidate_digest }}
          ADMISSION_LOCAL_REF: ${{ steps.activation_input.outputs.admission_local_ref }}
          QWQ_PROD_ROLLOUT_EVIDENCE_ROOT: ${{ vars.PROD_ROLLOUT_EVIDENCE_ROOT }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/release-control"
          ADMISSION="${{ needs.prod_activation_admission.outputs.admission_ref }}"
          ADMISSION_DIGEST="${{ needs.prod_activation_admission.outputs.admission_digest }}"
          test -s "$STORE/$ADMISSION_LOCAL_REF"
          printf '%s' "${{ github.token }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          PREDECESSOR=""
          FULL_STAGE_RECEIPT_ID=""
          PROMOTION_DEADLINE_EPOCH="$(( $(date +%s) + 1800 ))"
          HARD_DEADLINE_EPOCH="$(( PROMOTION_DEADLINE_EPOCH + 300 ))"
          for stage in canary 5 20 50 100; do
            case "$stage" in canary) step=0 ;; 5|20|50|100) step="$stage" ;; esac
            EVIDENCE="$QWQ_PROD_ROLLOUT_EVIDENCE_ROOT/$stage.json"
            test -s "$EVIDENCE" || {
              echo "::error::GATE_BLOCK: protected stage evidence is absent for $stage"
              exit 2
            }
            REPORT_DIR="$RUNNER_TEMP/prod-stage-$stage"
            set +e
            python3 quwoquan_ops/cli/stackctl.py deploy --target prod-hosted \
              --service prod-stack --stage "$stage" --step "$step" \
              --from-candidate-digest "$FROM_CANDIDATE_DIGEST" \
              --to-candidate-digest "$TO_CANDIDATE_DIGEST" \
              --prod-activation-admission "$STORE/$ADMISSION_LOCAL_REF" \
              --promotion-evidence "$EVIDENCE" \
              --promotion-deadline-epoch "$PROMOTION_DEADLINE_EPOCH" \
              --hard-deadline-epoch "$HARD_DEADLINE_EPOCH" \
              --rollback-budget-seconds 300 \
              --report-dir "$REPORT_DIR"
            STACKCTL_STATUS="$?"
            set -e
            if [[ "$STACKCTL_STATUS" -ne 0 ]]; then
              ROLLBACK_ARGS=()
              while IFS= read -r arg; do ROLLBACK_ARGS+=("$arg"); done < <(python3 - "$REPORT_DIR/report.json" "$STORE" "$ADMISSION" "$stage" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          report_path, store, admission_ref, stage = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], sys.argv[4]
          report = json.loads(report_path.read_text(encoding="utf-8"))
          exact_admission = {"ref": admission_ref, "digest": "sha256:" + hashlib.sha256((store / admission_ref).read_bytes()).hexdigest()}
          sources = {"activation": report.get("releaseState") or {}, "health": report.get("rollbackPostChecks") or [], "readback": report.get("rollback") or {}}
          for kind, source in sources.items():
              body = {"schema": f"quwoquan_ops.prod_rollback_{kind}_evidence.v1", "admission": exact_admission, "stage": stage, "status": "passed", "rollbackTarget": json.loads((store / admission_ref).read_text())["previousActiveReleasedLedger"], "ociDigests": json.loads((store / admission_ref).read_text())["previousOciDigests"], "source": source}
              encoded = json.dumps(body, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
              path = store / "prod" / "rollback-evidence" / stage / f"{kind}.json"
              path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(encoded)
              print(f"--{kind}"); print(f"{path.relative_to(store).as_posix()}=sha256:{hashlib.sha256(encoded).hexdigest()}")
          PY
              )
              FAILED_ARGS=()
              while IFS= read -r arg; do FAILED_ARGS+=("$arg"); done < <(python3 - "$REPORT_DIR/report.json" "$STORE" "$ADMISSION" "$stage" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          report_path, store, admission_ref, stage = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], sys.argv[4]
          report = json.loads(report_path.read_text(encoding="utf-8"))
          exact_admission = {"ref": admission_ref, "digest": "sha256:" + hashlib.sha256((store / admission_ref).read_bytes()).hexdigest()}
          root = store / "prod" / "runtime-evidence" / stage
          receipt_id = str(report.get("releaseReceiptId") or "")
          hosted_payload = {"schema": "prod-hosted-release-receipt-readback", "authority": str(report.get("releaseReceiptAuthority") or ""), "receipt": report.get("hostedReceipt") or {}, "receiptRef": str(report.get("releaseReceiptRef") or "")}
          if hosted_payload["authority"] != "prod-hosted-service-plane" or hosted_payload["receiptRef"] != f"receipt:hosted:{receipt_id}" or not hosted_payload["receipt"]:
              raise SystemExit(f"GATE_BLOCK: failed stage {stage} lacks hosted receipt bytes")
          hosted_encoded = json.dumps(hosted_payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          hosted_path = root / "failed-hosted-receipt-readback.json"; hosted_path.parent.mkdir(parents=True, exist_ok=True); hosted_path.write_bytes(hosted_encoded)
          print(f"--hosted-receipt-readback"); print(f"{hosted_path.relative_to(store).as_posix()}=sha256:{hashlib.sha256(hosted_encoded).hexdigest()}")
          for kind, source in {"activation": report.get("releaseState") or {}, "health": report.get("postDeployChecks") or [], "slo": report.get("sloReadback") or {}, "placement": report.get("wiredWorkloads") or [], "readback": report}.items():
              body = {"schema": f"quwoquan_ops.prod_{kind}_evidence.v1", "admission": exact_admission, "stage": stage, "status": "failed", "source": source}
              encoded = json.dumps(body, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
              path = root / f"failed-{kind}.json"; path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(encoded)
              print(f"--{kind}"); print(f"{path.relative_to(store).as_posix()}=sha256:{hashlib.sha256(encoded).hexdigest()}")
          PY
              )
              PREDECESSOR_ARGS=(); if [[ -n "$PREDECESSOR" ]]; then PREDECESSOR_ARGS=(--predecessor "$PREDECESSOR"); fi
              FAILED_HOSTED_READBACK="${FAILED_ARGS[1]}"
              FAILED_EVIDENCE_ARGS=("${FAILED_ARGS[@]:2}")
              FAILED_RESULT="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-stage-append \
                --admission "$ADMISSION=$ADMISSION_DIGEST" --stage "$stage" --status failed \
                "${FAILED_EVIDENCE_ARGS[@]}" --hosted-receipt-readback "$FAILED_HOSTED_READBACK" \
                "${PREDECESSOR_ARGS[@]}" --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
              FAILED_REF="$(python3 -c 'import json,sys; v=json.load(sys.stdin); print(v["ref"]+"="+v["digest"])' <<<"$FAILED_RESULT")"
              python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-rollback \
                --admission "$ADMISSION=$ADMISSION_DIGEST" --failed-attempt "$FAILED_REF" \
                "${ROLLBACK_ARGS[@]}" --hosted-receipt-readback "$FAILED_HOSTED_READBACK" \
                --rolled-back-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              exit "$STACKCTL_STATUS"
            fi
            ARGS=()
            while IFS= read -r arg; do ARGS+=("$arg"); done < <(python3 - "$REPORT_DIR/report.json" "$STORE" "$ADMISSION" "$stage" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          report_path, store, admission_ref, stage = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], sys.argv[4]
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("exitCode") != 0 or report.get("rolloutDecision") != "continue":
              raise SystemExit(f"GATE_BLOCK: stage {stage} did not produce a successful hosted transition")
          exact_admission = {"ref": admission_ref, "digest": "sha256:" + hashlib.sha256((store / admission_ref).read_bytes()).hexdigest()}
          evidence_root = store / "prod" / "runtime-evidence" / stage
          hosted_ref = str(report.get("releaseReceiptRef") or "")
          receipt_id = str(report.get("releaseReceiptId") or "")
          if hosted_ref != f"receipt:hosted:{receipt_id}" or len(receipt_id) != 64:
              raise SystemExit(f"GATE_BLOCK: stage {stage} lacks exact hosted receipt identity")
          hosted_payload = {
              "schema": "prod-hosted-release-receipt-readback",
              "authority": str(report.get("releaseReceiptAuthority") or ""),
              "receipt": report.get("hostedReceipt") or {},
              "receiptRef": hosted_ref,
          }
          if hosted_payload["authority"] != "prod-hosted-service-plane" or not hosted_payload["receipt"]:
              raise SystemExit(f"GATE_BLOCK: stage {stage} lacks hosted receipt bytes")
          hosted_encoded = json.dumps(hosted_payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          hosted_path = evidence_root / "hosted-receipt-readback.json"
          hosted_path.parent.mkdir(parents=True, exist_ok=True); hosted_path.write_bytes(hosted_encoded)
          sources = {
              "activation": report.get("releaseState") or {},
              "health": report.get("postDeployChecks") or [],
              "slo": report.get("sloReadback") or {},
              "placement": report.get("wiredWorkloads") or [],
              "readback": hosted_payload,
          }
          for kind, source in sources.items():
              body = {"schema": f"quwoquan_ops.prod_{kind}_evidence.v1", "admission": exact_admission, "stage": stage, "status": "passed", "source": source}
              encoded = json.dumps(body, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
              path = evidence_root / f"{kind}.json"
              path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(encoded)
              print(f"--{kind}")
              print(f"{path.relative_to(store).as_posix()}=sha256:{hashlib.sha256(encoded).hexdigest()}")
          PY
            )
            HOSTED_READBACK_EXACT="$(python3 - "$REPORT_DIR/report.json" "$STORE/prod/runtime-evidence/$stage/hosted-receipt-readback.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          report, path = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")), Path(sys.argv[2])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("receipt", {}).get("receiptId") != report.get("releaseReceiptId"):
              raise SystemExit("GATE_BLOCK: materialized hosted stage receipt drifted")
          print(f"{path.relative_to(Path(sys.argv[2]).parents[3]).as_posix()}=sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}")
          PY
            )"
            PREDECESSOR_ARGS=()
            if [[ -n "$PREDECESSOR" ]]; then PREDECESSOR_ARGS=(--predecessor "$PREDECESSOR"); fi
            STAGE_RESULT="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-stage-append \
              --admission "$ADMISSION=$ADMISSION_DIGEST" --stage "$stage" \
              --status passed "${ARGS[@]}" --hosted-receipt-readback "$HOSTED_READBACK_EXACT" \
              "${PREDECESSOR_ARGS[@]}" --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
            PREDECESSOR="$(python3 -c 'import json,sys; v=json.load(sys.stdin); print(v["ref"]+"="+v["digest"])' <<<"$STAGE_RESULT")"
            if [[ "$stage" == 100 ]]; then
              FULL_STAGE_RECEIPT_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["releaseReceiptId"])' "$REPORT_DIR/report.json")"
              [[ "$FULL_STAGE_RECEIPT_ID" =~ ^[0-9a-f]{64}$ ]]
            fi
          done
          TERMINAL="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-terminal-release \
            --admission "$ADMISSION=$ADMISSION_DIGEST" --final-attempt "$PREDECESSOR" \
            --hosted-receipt-readback "$HOSTED_READBACK_EXACT" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          TERMINAL_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' <<<"$TERMINAL")"
          TERMINAL_DIGEST="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' <<<"$TERMINAL")"
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "$STORE/$TERMINAL_REF" \
            --repository "ghcr.io/${{ github.repository }}/released-prod" \
            --transport-tag "run-${{ github.run_id }}-${{ github.run_attempt }}" > "$RUNNER_TEMP/released-prod-oci.json"
          TERMINAL_OCI_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["exactRef"])' < "$RUNNER_TEMP/released-prod-oci.json")"
          {
            echo "released_fact_ref=$TERMINAL_OCI_REF"
            echo "released_fact_digest=$TERMINAL_DIGEST"
            echo "full_stage_receipt_id=$FULL_STAGE_RECEIPT_ID"
          } >> "$GITHUB_OUTPUT"

  post_release_soak:
    name: Independent post-release soak
    needs: prod_rollout
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 1440
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
      ALERTMANAGER_URL: ${{ vars.PROD_ALERTMANAGER_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - name: Materialize hosted service-plane readback credential
        env:
          KEY_MATERIAL: ${{ secrets.PROD_SERVICE_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$KEY_MATERIAL" == *"PRIVATE KEY"* ]]
          KEY_FILE="$RUNNER_TEMP/prod-service-ssh-key"
          (umask 077 && printf '%s\n' "$KEY_MATERIAL" > "$KEY_FILE")
          echo "PROD_SERVICE_SSH_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - id: soak
        name: Observe and append PostReleaseSoakFact
        env:
          RELEASED_REF: ${{ needs.prod_rollout.outputs.released_fact_ref }}
          RELEASED_DIGEST: ${{ needs.prod_rollout.outputs.released_fact_digest }}
          FULL_STAGE_RECEIPT_ID: ${{ needs.prod_rollout.outputs.full_stage_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/release-control"
          RELEASED_OCI_REF="$RELEASED_REF"
          RELEASED_LOCAL_REF="prod/released/released.json"
          mkdir -p "$STORE/$(dirname "$RELEASED_LOCAL_REF")" "$RUNNER_TEMP/prod-soak"
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
            --ref "$RELEASED_OCI_REF" --output-file "$STORE/$RELEASED_LOCAL_REF" >/dev/null
          test "sha256:$(shasum -a 256 "$STORE/$RELEASED_LOCAL_REF" | awk '{print $1}')" = "$RELEASED_DIGEST"
          while IFS=$'\t' read -r ref payload_digest; do
            [[ "$ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            mkdir -p "$STORE/$(dirname "$ref")"
            python3 quwoquan_ops/ci/promotion_evidence.py materialize-oci \
              --ref "$ref" --output-file "$STORE/$ref" >/dev/null
            test "sha256:$(shasum -a 256 "$STORE/$ref" | awk '{print $1}')" = "$payload_digest"
          done < <(python3 - "$STORE/$RELEASED_LOCAL_REF" <<'PY'
          import json, sys
          released = json.load(open(sys.argv[1], encoding="utf-8"))
          value = released.get("admission")
          if not isinstance(value, dict) or set(value) != {"ref", "digest"}:
              raise SystemExit("GATE_BLOCK: ProdReleasedFact admission predecessor is invalid")
          print(value["ref"], value["digest"], sep="\t")
          PY
          )
          RELEASED_REF="$RELEASED_LOCAL_REF"
          FULL_STAGE_READBACK="$RUNNER_TEMP/prod-soak/full-stage-readback.json"
          CREDENTIAL_EVIDENCE="$RUNNER_TEMP/prod-soak/credentials.json"
          SOAK_REQUEST="$RUNNER_TEMP/prod-soak/request.json"
          SOAK_COMMITTED="$RUNNER_TEMP/prod-soak/committed-readback.json"
          SOAK_READBACK="$RUNNER_TEMP/prod-soak/remote-readback.json"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service --operation release-ledger-receipt --service prod-stack \
            --receipt-id "$FULL_STAGE_RECEIPT_ID" --output-path "$FULL_STAGE_READBACK"
          test -s "$FULL_STAGE_READBACK"
          python3 - "$FULL_STAGE_READBACK" "$STORE" "$RELEASED_REF" "$FULL_STAGE_RECEIPT_ID" <<'PY'
          import json, sys
          from pathlib import Path
          readback, store, released_ref, expected_receipt_id = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], sys.argv[4]
          payload = json.loads(readback.read_text(encoding="utf-8"))
          receipt = payload.get("receipt") or {}
          released = json.loads((store / released_ref).read_text(encoding="utf-8"))
          hosted_exact = released.get("hostedReceiptReadback")
          if not isinstance(hosted_exact, dict) or set(hosted_exact) != {"ref", "digest"}:
              raise SystemExit("GATE_BLOCK: released fact lacks exact hosted receipt readback")
          hosted_payload = json.loads((store / hosted_exact["ref"]).read_text(encoding="utf-8"))
          hosted_receipt = hosted_payload.get("receipt") or {}
          if receipt.get("receiptId") != expected_receipt_id or hosted_receipt.get("receiptId") != expected_receipt_id or receipt.get("toCandidateDigest") != released.get("candidateId"):
              raise SystemExit("GATE_BLOCK: full hosted receipt does not bind released candidate")
          PY
          python3 quwoquan_ops/ci/collect_prod_soak_observations.py \
            --full-readback "$FULL_STAGE_READBACK" --service prod-stack \
            --prometheus-service prod-stack --prometheus-url "$PROMETHEUS_URL" \
            --alertmanager-url "$ALERTMANAGER_URL" \
            --soak-policy quwoquan_ops/policies/config-release/slo_thresholds.yaml \
            --health-report-dir "$RUNNER_TEMP/prod-soak/health" \
            --slo-output "$RUNNER_TEMP/prod-soak/slo-source.json" \
            --alerts-output "$RUNNER_TEMP/prod-soak/alerts-source.json"
          python3 quwoquan_ops/cli/prod/validate_prod_plane_credentials.py \
            --stage 100 --evidence-output "$CREDENTIAL_EVIDENCE"
          OBS=()
          while IFS= read -r observation; do OBS+=("$observation"); done < <(python3 - "$STORE" "$RELEASED_REF" "$RELEASED_DIGEST" "$RUNNER_TEMP/prod-soak" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          store, released_ref, released_digest, root = Path(sys.argv[1]), sys.argv[2], sys.argv[3], Path(sys.argv[4])
          released = {"ref": released_ref, "digest": released_digest}
          source_paths = {"health": root / "health/report.json", "slo": root / "slo-source.json", "alerts": root / "alerts-source.json"}
          for kind, source_path in source_paths.items():
              source_raw = source_path.read_bytes(); source = json.loads(source_raw)
              observed_at = source.get("timestamp") if kind == "health" else source.get("queriedAt")
              if not isinstance(observed_at, str) or not observed_at:
                  raise SystemExit(f"GATE_BLOCK: soak {kind} observation timestamp is missing")
              body = {"schema": f"quwoquan_ops.prod_soak_{kind}_observation.v1", "release": released, "status": "passed", "readOnly": True, "observedAt": observed_at, "sourceDigest": "sha256:" + hashlib.sha256(source_raw).hexdigest(), "source": source}
              encoded = json.dumps(body, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
              path = store / "prod" / "soak-observations" / f"{kind}.json"
              path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(encoded)
              print(f"--{kind}")
              print(f"{path.relative_to(store).as_posix()}=sha256:{hashlib.sha256(encoded).hexdigest()}")
          PY
          )
          python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-soak-request \
            --released-fact "$RELEASED_REF=$RELEASED_DIGEST" --released-oci-ref "$RELEASED_OCI_REF" \
            --full-stage-readback "$FULL_STAGE_READBACK" "${OBS[@]}" \
            --credential-evidence "$CREDENTIAL_EVIDENCE" \
            --repository "${{ github.repository }}" \
            --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" \
            --actor "${{ github.actor }}" --verified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --output "$SOAK_REQUEST"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service --operation release-ledger-soak-commit --service prod-stack \
            --request-path "$SOAK_REQUEST" --output-path "$SOAK_COMMITTED"
          SOAK_RECEIPT_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt"]["receiptId"])' "$SOAK_COMMITTED")"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service --operation release-ledger-soak-receipt --service prod-stack \
            --receipt-id "$SOAK_RECEIPT_ID" --output-path "$SOAK_READBACK"
          cmp "$SOAK_COMMITTED" "$SOAK_READBACK"
          HOSTED_SOAK_LOCAL_REF="prod/soak/hosted-readback.json"
          cp "$SOAK_READBACK" "$STORE/$HOSTED_SOAK_LOCAL_REF"
          HOSTED_SOAK_DIGEST="sha256:$(shasum -a 256 "$STORE/$HOSTED_SOAK_LOCAL_REF" | awk '{print $1}')"
          SOAK="$(python3 -B quwoquan_ops/ci/release_control.py --store-root "$STORE" prod-soak \
            --released-fact "$RELEASED_REF=$RELEASED_DIGEST" "${OBS[@]}" \
            --hosted-soak-readback "$HOSTED_SOAK_LOCAL_REF=$HOSTED_SOAK_DIGEST" --status passed \
            --observed-at "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt"]["verifiedAt"])' "$SOAK_READBACK")")"
          SOAK_REF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ref"])' <<<"$SOAK")"
          # release_control prod-soak invokes create_post_release_soak_fact.
          python3 quwoquan_ops/ci/promotion_evidence.py publish-oci \
            --fact-file "$STORE/$SOAK_REF" \
            --repository "ghcr.io/${{ github.repository }}/post-release-soak" \
            --transport-tag "run-${{ github.run_id }}-${{ github.run_attempt }}"
