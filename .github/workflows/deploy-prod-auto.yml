        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-prod-gamma
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/gamma/runs/**/summary.json
