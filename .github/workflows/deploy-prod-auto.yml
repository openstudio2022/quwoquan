# main 后多环境自动 promotion 主链
# 设计见 specs/feature-tree/runtime/deliver-deploy-prod-pipeline/design.md
name: 07. Deploy To Prod (Auto)

permissions:
  contents: read
  actions: read

env:
  QWQ_OUTPUT_ROOT: .qwq_output

on:
  workflow_run:
    workflows:
      - 02. Service Pipeline
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_run_id:
        description: '02. Service Pipeline run id'
        required: true
      cloud_provider:
        description: 'Cloud provider'
        required: false
        default: 'aliyun'
      dry_run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

concurrency:
  group: prod-hosted-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare mainline auto prod inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SERVICE_SSH_KEY: ${{ secrets.PROD_SERVICE_SSH_KEY }}
    outputs:
      initial_step: ${{ steps.stages.outputs.initial_step }}
      carry_step: ${{ steps.stages.outputs.carry_step }}
      full_step: ${{ steps.stages.outputs.full_step }}
      from_image: ${{ steps.inputs.outputs.from_image }}
      from_config: ${{ steps.inputs.outputs.from_config }}
      to_image: ${{ steps.inputs.outputs.to_image }}
      to_config: ${{ steps.inputs.outputs.to_config }}
      cloud_provider: ${{ steps.inputs.outputs.cloud_provider }}
      dry_run: ${{ steps.inputs.outputs.dry_run }}
      checkout_ref: ${{ steps.release_context.outputs.checkout_ref }}
      base_sha: ${{ steps.diff.outputs.base_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      artifact_note: ${{ steps.inputs.outputs.artifact_note }}
      has_release_artifact: ${{ steps.artifact.outputs.has_release_artifact }}
      release_artifact_ref: ${{ steps.artifact.outputs.release_artifact_ref }}
      service_pipeline_run_id: ${{ steps.context.outputs.release_run_id }}
      service_pipeline_elapsed_seconds: ${{ steps.service_pipeline_timing.outputs.elapsed_seconds }}
    steps:
      - id: context
        name: Resolve workflow context
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "release_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_run_id=${{ github.event.inputs.release_run_id }}" >> "$GITHUB_OUTPUT"
          fi
      - id: service_pipeline_timing
        name: Read completed Service Pipeline elapsed time
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.context.outputs.release_run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.request
          from datetime import datetime

          run_id = os.environ["RELEASE_RUN_ID"].strip()
          token = os.environ["GITHUB_TOKEN"].strip()
          if not run_id or not token:
              raise SystemExit("missing service pipeline run id or Actions token")
          request = urllib.request.Request(
              f"https://api.github.com/repos/${{ github.repository }}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get("status") != "completed" or payload.get("conclusion") != "success":
              raise SystemExit(
                  "Service Pipeline must be completed and successful before prod timing "
                  f"can be recorded: {payload.get('status')}/{payload.get('conclusion')}"
              )
          start_raw = payload.get("run_started_at") or payload.get("created_at")
          end_raw = payload.get("updated_at")
          if not isinstance(start_raw, str) or not isinstance(end_raw, str):
              raise SystemExit("Service Pipeline API response has no complete timing window")
          start = datetime.fromisoformat(start_raw.replace("Z", "+00:00"))
          end = datetime.fromisoformat(end_raw.replace("Z", "+00:00"))
          print(f"elapsed_seconds={max(0, int((end - start).total_seconds()))}")
          PY
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          ref: ${{ steps.context.outputs.checkout_ref }}
      - name: Resolve diff base sha
        id: diff
        run: |
          BASE_SHA="${{ steps.context.outputs.base_sha }}"
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Login OCI release artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: artifact
        name: Materialize immutable OCI release artifact
        env:
          SOURCE_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          REPORT="$QWQ_OUTPUT_ROOT/env/repo/local/ci/process/release-artifact-fetch.json"
          mkdir -p "$(dirname "$REPORT")"
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --source-sha "$SOURCE_SHA" \
            --repository "${{ github.repository }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline" \
            > "$REPORT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci/process/release-artifact-fetch.json"
          payload = json.loads(report.read_text(encoding="utf-8"))
          print("has_release_artifact=true")
          print(f"release_artifact_ref={payload['ref']}")
          PY
      - name: Require immutable release artifact
        run: |
          test -s "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" || {
            echo "::error::02. Service Pipeline release artifact is required; local regeneration is forbidden"
            exit 1
          }
      - id: release_context
        name: Resolve exact release source
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline/manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          print(f"checkout_ref={manifest['source']['gitSha']}")
          print(f"manifest_digest={manifest['manifestDigest']}")
          PY
      - name: Require reviewed PR release governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --git-sha "${{ steps.release_context.outputs.checkout_ref }}" \
            --manifest-digest "${{ steps.release_context.outputs.manifest_digest }}" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/governance-receipt.json"
      - name: Unpack service package config evidence
        if: ${{ hashFiles(format('{0}/env/repo/local/ci-packages/process/service/mainline/manifest.json', env.QWQ_OUTPUT_ROOT)) != '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest.get("releaseFiles", {}).values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
      - name: Resolve rollout inputs
        id: inputs
        run: |
          CLOUD_PROVIDER="${{ github.event.inputs.cloud_provider }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          ARTIFACT_NOTE="consumed 02 mainline GHCR OCI release artifact digest"
          if [[ -z "$CLOUD_PROVIDER" ]]; then CLOUD_PROVIDER="aliyun"; fi
          if [[ -z "$DRY_RUN" ]]; then DRY_RUN="false"; fi
          readarray -t RELEASE_VERSIONS < <(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest_path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          print(str(manifest["versions"]["imageVersion"]))
          print(str(manifest["versions"]["configVersion"]))
          PY
          )
          TO_IMG="${RELEASE_VERSIONS[0]}"
          TO_CFG="${RELEASE_VERSIONS[1]}"
          eval "$(python3 quwoquan_ops/cli/prod/resolve_prod_release_state.py --output-format shell)"
          FROM_IMG="$RESOLVED_FROM_IMAGE"
          FROM_CFG="$RESOLVED_FROM_CONFIG"
          ARTIFACT_NOTE="${ARTIFACT_NOTE}; current prod resolved via ${RESOLVED_FROM_SOURCE_ACCOUNT}@${RESOLVED_FROM_SOURCE_HOST}"
          echo "from_image=$FROM_IMG" >> $GITHUB_OUTPUT
          echo "from_config=$FROM_CFG" >> $GITHUB_OUTPUT
          echo "to_image=$TO_IMG" >> $GITHUB_OUTPUT
          echo "to_config=$TO_CFG" >> $GITHUB_OUTPUT
          echo "cloud_provider=$CLOUD_PROVIDER" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "artifact_note=$ARTIFACT_NOTE" >> $GITHUB_OUTPUT
      - name: Parse gray_rollout_stages
        id: stages
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          payload = yaml.safe_load(
              Path("quwoquan_ops/environments/prod/rollout/stages.yaml").read_text(
                  encoding="utf-8"
              )
          )
          stages = {item["name"]: int(item["step"]) for item in payload["stages"]}
          if stages != {"gray-initial": 5, "carry-on": 25, "full": 100}:
              raise SystemExit(f"invalid canonical rollout stages: {stages}")
          print(f"initial_step={stages['gray-initial']}")
          print(f"carry_step={stages['carry-on']}")
          print(f"full_step={stages['full']}")
          PY

  delivery_gate:
    name: Delivery Gate (mainline)
    needs: [prepare]
    uses: ./.github/workflows/delivery-gate.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets: inherit

  alpha_local:
    name: Alpha local stage
    needs: [prepare, delivery_gate]
    runs-on: ubuntu-latest
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Verify topology/config contracts
        run: |
          python3 quwoquan_ops/cli/stackctl.py verify \
            --env alpha \
            --target alpha-local \
            --kind all \
            --profile smoke \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-verify"
      - name: Package alpha environment
        run: |
          python3 quwoquan_ops/cli/stackctl.py package \
            --env alpha \
            --include-services \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-package"
      - name: Bring up alpha-local
        run: |
          python3 quwoquan_ops/cli/stackctl.py up \
            --target alpha-local \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-up"
      - name: Alpha full health
        run: |
          python3 quwoquan_ops/cli/stackctl.py health \
            --target alpha-local \
            --scope full \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-health"
      - name: Alpha inspect
        if: always()
        run: |
          python3 quwoquan_ops/cli/stackctl.py inspect \
            --target alpha-local \
            --scope all \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-inspect"
      - name: Upload alpha stackctl artifacts
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainline-auto-prod-alpha
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/alpha/runs/**/summary.json
            ${{ env.QWQ_OUTPUT_ROOT }}/env/alpha/runs/**/report.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  beta_device_matrix:
    name: Beta local stage
    needs: [prepare, alpha_local]
    uses: ./.github/workflows/app-env-device-matrix-self-hosted.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
      validation_profile: mainline_auto_prod
    secrets: inherit

  prod_initial:
    name: Prod initial rollout
    needs: [prepare, beta_device_matrix]
    runs-on: [self-hosted, macOS, prod-release]
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    # 去 root · 按平面 SSH 凭据（退役单一全权 PROD_KUBECONFIG）。
    env:
      PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
      QWQ_PROD_RELEASE_STATE_DIR: ${{ vars.PROD_RELEASE_STATE_DIR }}
      QWQ_PROD_BACKUP_RECOVERY_RECEIPT: ${{ vars.PROD_BACKUP_RECOVERY_RECEIPT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Validate prod plane SSH credentials
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          python3 quwoquan_ops/cli/prod/validate_prod_plane_credentials.py --stage gray-initial
      - name: Login OCI release artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize immutable OCI release artifact
        run: |
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "${{ needs.prepare.outputs.release_artifact_ref }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline"
      - name: Require immutable release manifest
        run: |
          test -s "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" || {
            echo "::error::resolved release artifact is required; local regeneration is forbidden"
            exit 1
          }
      - name: Rebind reviewed PR governance to materialized digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/governance-receipt.json"
      - name: Require fresh hosted backup and recovery receipt
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py verify \
            --env prod \
            --target prod-hosted \
            --kind all \
            --profile release \
            --backup-recovery-receipt "$QWQ_PROD_BACKUP_RECOVERY_RECEIPT" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-backup-recovery-preflight"
      - name: Unpack service package config evidence
        if: ${{ hashFiles(format('{0}/env/repo/local/ci-packages/process/service/mainline/manifest.json', env.QWQ_OUTPUT_ROOT)) != '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest.get("releaseFiles", {}).values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
      - name: Build ops portal release
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          python3 quwoquan_ops/cli/prod/build_portal_release.py \
            --version "${{ needs.prepare.outputs.to_image }}" \
            --oidc-issuer "${{ vars.PROD_OPS_OIDC_ISSUER }}" \
            --oidc-client-id "${{ vars.PROD_OPS_OIDC_CLIENT_ID }}" \
            --oidc-audience "${{ vars.PROD_OPS_OIDC_AUDIENCE }}" \
            --oidc-scope "${{ vars.PROD_OPS_OIDC_SCOPE }}"
      - name: Login immutable image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Deploy prod initial via stackctl
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-image "${{ needs.prepare.outputs.from_image }}" \
            --to-image "${{ needs.prepare.outputs.to_image }}" \
            --from-config "${{ needs.prepare.outputs.from_config }}" \
            --to-config "${{ needs.prepare.outputs.to_config }}" \
            --stage gray-initial \
            --step "${{ needs.prepare.outputs.initial_step }}" \
            --dry-run "${{ needs.prepare.outputs.dry_run }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-initial"
      - name: Upload prod initial artifacts
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainline-auto-prod-prod-initial
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/summary.json
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/report.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  prod_carry_on:
    name: Prod carry-on rollout
    needs: [prepare, prod_initial]
    runs-on: [self-hosted, macOS, prod-release]
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    env:
      PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
      QWQ_PROD_RELEASE_STATE_DIR: ${{ vars.PROD_RELEASE_STATE_DIR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Validate prod plane SSH credentials
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          python3 quwoquan_ops/cli/prod/validate_prod_plane_credentials.py --stage carry-on
      - name: Login OCI release artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize immutable OCI release artifact
        run: |
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "${{ needs.prepare.outputs.release_artifact_ref }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline"
      - name: Rebind reviewed PR governance to materialized digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/governance-receipt.json"
      - name: Unpack service package config evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          root = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest["releaseFiles"].values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
      - name: Login immutable image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Deploy prod carry-on via stackctl
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-image "${{ needs.prepare.outputs.from_image }}" \
            --to-image "${{ needs.prepare.outputs.to_image }}" \
            --from-config "${{ needs.prepare.outputs.from_config }}" \
            --to-config "${{ needs.prepare.outputs.to_config }}" \
            --stage carry-on \
            --step "${{ needs.prepare.outputs.carry_step }}" \
            --dry-run "${{ needs.prepare.outputs.dry_run }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-carry-on"
      - name: Upload prod carry-on artifacts
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainline-auto-prod-carry-on
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/summary.json
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/report.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  prod_full:
    name: Prod full rollout
    needs: [prepare, prod_carry_on]
    runs-on: [self-hosted, macOS, prod-release]
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
    # 去 root · 按平面 SSH 凭据（退役单一全权 PROD_KUBECONFIG）。
    env:
      PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
      QWQ_PROD_RELEASE_STATE_DIR: ${{ vars.PROD_RELEASE_STATE_DIR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Validate prod plane SSH credentials
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          python3 quwoquan_ops/cli/prod/validate_prod_plane_credentials.py --stage full
      - name: Login OCI release artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize immutable OCI release artifact
        run: |
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "${{ needs.prepare.outputs.release_artifact_ref }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline"
      - name: Require immutable release manifest
        run: |
          test -s "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" || {
            echo "::error::resolved release artifact is required; local regeneration is forbidden"
            exit 1
          }
      - name: Rebind reviewed PR governance to materialized digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/governance-receipt.json"
      - name: Unpack service package config evidence
        if: ${{ hashFiles(format('{0}/env/repo/local/ci-packages/process/service/mainline/manifest.json', env.QWQ_OUTPUT_ROOT)) != '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/mainline"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for rel_path in manifest.get("releaseFiles", {}).values():
              src = root / rel_path
              dst = Path(rel_path)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
      - name: Login immutable image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Deploy prod full via stackctl
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-image "${{ needs.prepare.outputs.from_image }}" \
            --to-image "${{ needs.prepare.outputs.to_image }}" \
            --from-config "${{ needs.prepare.outputs.from_config }}" \
            --to-config "${{ needs.prepare.outputs.to_config }}" \
            --stage full \
            --step "${{ needs.prepare.outputs.full_step }}" \
            --dry-run "${{ needs.prepare.outputs.dry_run }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/mainline/manifest.json" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-full"
      - name: Upload prod full artifacts
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainline-auto-prod-prod-full
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/summary.json
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/report.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  mainline_summary:
    name: 07. Deploy To Prod (Auto)
    needs:
      - prepare
      - delivery_gate
      - alpha_local
      - beta_device_matrix
      - prod_initial
      - prod_carry_on
      - prod_full
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Render mainline timing summary
        env:
          SERVICE_PIPELINE_SECONDS: ${{ needs.prepare.outputs.service_pipeline_elapsed_seconds }}
          DELIVERY_SECONDS: ${{ needs.delivery_gate.outputs.critical_path_seconds }}
          ALPHA_SECONDS: ${{ needs.alpha_local.outputs.duration_seconds }}
          BETA_SECONDS: ${{ needs.beta_device_matrix.outputs.critical_path_seconds }}
          PROD_INITIAL_SECONDS: ${{ needs.prod_initial.outputs.duration_seconds }}
          PROD_CARRY_ON_SECONDS: ${{ needs.prod_carry_on.outputs.duration_seconds }}
          PROD_FULL_SECONDS: ${{ needs.prod_full.outputs.duration_seconds }}
        run: |
          SERVICE_PIPELINE="${SERVICE_PIPELINE_SECONDS:-0}"
          DELIVERY="${DELIVERY_SECONDS:-0}"
          ALPHA="${ALPHA_SECONDS:-0}"
          BETA="${BETA_SECONDS:-0}"
          PROD_INITIAL="${PROD_INITIAL_SECONDS:-0}"
          PROD_CARRY_ON="${PROD_CARRY_ON_SECONDS:-0}"
          PROD_FULL="${PROD_FULL_SECONDS:-0}"
          CRITICAL_PATH_SECONDS=$(( DELIVERY + ALPHA + BETA + PROD_INITIAL + PROD_CARRY_ON + PROD_FULL ))
          COMMIT_TO_PROD_SECONDS=$(( SERVICE_PIPELINE + CRITICAL_PATH_SECONDS ))
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 07.mainline_auto_prod \
            --title "07. Deploy To Prod (Auto)" \
            --critical-path-seconds "${CRITICAL_PATH_SECONDS}" \
            --phase "delivery_gate=${DELIVERY}" \
            --phase "alpha_stage=${ALPHA}" \
            --phase "beta_device_matrix=${BETA}" \
            --phase "prod_initial_checks=${PROD_INITIAL}" \
            --phase "prod_carry_on=${PROD_CARRY_ON}" \
            --phase "prod_full=${PROD_FULL}" \
            --note "目标版本来源：${{ needs.prepare.outputs.artifact_note }}；主链 checkout 已锁定到触发 02 的 main commit。" \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/mainline-auto-prod-summary.json" \
            --write-step-summary
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 07.main_commit_to_prod \
            --title "Main Commit To Prod" \
            --critical-path-seconds "${COMMIT_TO_PROD_SECONDS}" \
            --phase "service_pipeline_02=${SERVICE_PIPELINE}" \
            --phase "mainline_auto_prod_07=${CRITICAL_PATH_SECONDS}" \
            --note "真实 commit-to-prod = 02 Service Pipeline 已完成运行耗时 + 07 mainline_auto_prod；15 分钟承诺以该总和为准。" \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/main-commit-to-prod-summary.json" \
            --write-step-summary
          if [ "${CRITICAL_PATH_SECONDS}" -gt 900 ]; then
            echo "::error::mainline_auto_prod critical_path_seconds=${CRITICAL_PATH_SECONDS} exceeds 900s budget"
            exit 1
          fi
          if [ "${COMMIT_TO_PROD_SECONDS}" -gt 900 ]; then
            echo "::error::main_commit_to_prod critical_path_seconds=${COMMIT_TO_PROD_SECONDS} exceeds 900s budget"
            exit 1
          fi
      - name: Render environment chain timing diagnostics
        if: always()
        run: |
          python3 quwoquan_ops/ci/render_environment_chain_timing_diagnostics.py \
            --mainline-summary "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/mainline-auto-prod-summary.json" \
            --commit-summary "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/main-commit-to-prod-summary.json" \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/environment-chain-timing-diagnostics.json" \
            --write-markdown "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/environment-chain-timing-diagnostics.md" \
            --write-step-summary \
            --emit-annotations
      - name: Upload mainline timing summaries
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainline-auto-prod-timing-summaries
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/ci-timing/*.json
            ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/ci-timing/*.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Assert promotion stages
        env:
          DELIVERY_RESULT: ${{ needs.delivery_gate.outputs.summary_result }}
          ALPHA_RESULT: ${{ needs.alpha_local.result }}
          BETA_RESULT: ${{ needs.beta_device_matrix.outputs.summary_result }}
          PROD_INITIAL_RESULT: ${{ needs.prod_initial.result }}
          PROD_CARRY_ON_RESULT: ${{ needs.prod_carry_on.result }}
          PROD_FULL_RESULT: ${{ needs.prod_full.result }}
        run: |
          set -euo pipefail
          fail=0
          expect_success() {
            local name="$1" value="$2" hint="$3"
            if [ "${value}" != "success" ]; then
              echo "::error::${name} expected success, got ${value}. ${hint}"
              fail=1
            fi
          }
          expect_success "delivery_gate" "${DELIVERY_RESULT}" "检查 03 Delivery Gate"
          expect_success "alpha_local" "${ALPHA_RESULT}" "检查 alpha-local package/up/health artifacts"
          expect_success "beta_device_matrix" "${BETA_RESULT}" "检查 beta-local self-hosted matrix gate"
          expect_success "prod_initial" "${PROD_INITIAL_RESULT}" "检查 prod initial deploy 与 post-deploy probes"
          expect_success "prod_carry_on" "${PROD_CARRY_ON_RESULT}" "检查 prod carry-on SLO 留观与配置复核"
          expect_success "prod_full" "${PROD_FULL_RESULT}" "检查 prod full deploy 与 rollback 闭环"
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
