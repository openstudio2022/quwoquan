  preprod_evidence:
    name: Accept Alpha then Beta then Gamma receipts
    needs:
      - prepare
      - alpha_local
      - beta_device_matrix
      - gamma_local
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      release_evidence_ref: ${{ steps.bundle_ref.outputs.ref }}
      candidate_digest: ${{ steps.identity.outputs.candidate_digest }}
      artifact_digest: ${{ steps.identity.outputs.artifact_digest }}
      status: ${{ steps.identity.outputs.status }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Login immutable release registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize sealed candidate once
        run: |
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "${{ needs.prepare.outputs.release_evidence_ref }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/mainline-preprod/process/release-evidence-manifest"
      - name: Materialize exact Alpha, Beta and Gamma evidence OCI bundles
        run: |
          INCOMING="$QWQ_OUTPUT_ROOT/env/repo/local/mainline-preprod/process/incoming"
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "${{ needs.alpha_local.outputs.receipt_ref }}" \
            --expected-digest "${{ needs.alpha_local.outputs.receipt_digest }}" \
            --output-dir "$INCOMING/alpha" \
            --require-file alpha.json
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "${{ needs.beta_device_matrix.outputs.receipt_ref }}" \
            --expected-digest "${{ needs.beta_device_matrix.outputs.receipt_digest }}" \
            --output-dir "$INCOMING/beta" \
            --require-file beta.json
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "${{ needs.gamma_local.outputs.receipt_ref }}" \
            --expected-digest "${{ needs.gamma_local.outputs.receipt_digest }}" \
            --output-dir "$INCOMING/gamma" \
            --require-file gamma.json
      - name: Accept environment receipts in canonical order
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/mainline-preprod/process/release-evidence-manifest"
          INCOMING="$QWQ_OUTPUT_ROOT/env/repo/local/mainline-preprod/process/incoming"
          CURRENT="$QWQ_OUTPUT_ROOT/env/repo/local/mainline-preprod/process/current-receipt"
          ARCHIVE="$ROOT/evidence/raw/environments"
          mkdir -p "$CURRENT" "$ARCHIVE"
          for environment in alpha beta gamma; do
            test -s "$INCOMING/$environment/$environment.json" || {
              echo "::error::GATE_BLOCK: ${environment} receipt is missing"
              exit 2
            }
            cp -R "$INCOMING/$environment" "$ARCHIVE/$environment"
            cp "$ARCHIVE/$environment/$environment.json" "$CURRENT/$environment.json"
            python3 quwoquan_ops/cli/prod/finalize_mainline_release_artifact.py \
              --artifact-dir "$ROOT" \
              --environment-receipts-dir "$CURRENT"
            rm "$CURRENT/$environment.json"
            echo "Accepted ${environment} receipt for candidate ${{ needs.prepare.outputs.candidate_digest }}"
          done
      - id: identity
        name: Preserve candidate identity and record new evidence snapshot
        env:
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate_digest }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/mainline-preprod/process/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          candidate = str(manifest.get("candidateId") or "")
          artifact = str(manifest.get("artifactDigest") or "")
          if candidate != os.environ["EXPECTED_CANDIDATE"]:
              raise SystemExit("GATE_BLOCK: candidateId changed while appending environment receipts")
          if set(manifest.get("environmentReceipts") or {}) != {"alpha", "beta", "gamma"}:
              raise SystemExit("GATE_BLOCK: pre-Prod environment receipt set is incomplete")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", artifact) is None:
              raise SystemExit("GATE_BLOCK: qualified evidence artifactDigest is invalid")
          print(f"candidate_digest={candidate}")
          print(f"artifact_digest={artifact}")
          print(f"status={manifest['status']}")
          PY
      - name: Setup Buildx for pre-Prod evidence
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: bundle
        name: Publish pre-Prod evidence snapshot
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/mainline-preprod/process/release-evidence-manifest
          file: quwoquan_ops/cli/prod/release_artifact.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/release-artifact:preprod-${{ github.run_id }}
          sbom: true
          provenance: mode=max
      - id: bundle_ref
        name: Record exact pre-Prod evidence OCI ref
        run: |
          echo "ref=ghcr.io/${{ github.repository }}/release-artifact@${{ steps.bundle.outputs.digest }}" >> "$GITHUB_OUTPUT"

  prod_rollout:
    name: Prod rollout transaction
    needs:
      - prepare
      - alpha_local
      - beta_device_matrix
      - gamma_local
      - preprod_evidence
    runs-on: [self-hosted, macOS, ARM64]
    environment:
      name: ${{ needs.prepare.outputs.dry_run != 'true' && 'production' || 'release-validation' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      packages: write
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      release_evidence_ref: ${{ steps.terminal_bundle_ref.outputs.ref }}
      release_status: ${{ steps.terminal_receipts.outputs.status }}
      artifact_digest: ${{ steps.terminal_receipts.outputs.artifact_digest }}
      fully_verified_at: ${{ steps.terminal_receipts.outputs.fully_verified_at }}
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
      QWQ_PROD_ROLLOUT_EVIDENCE_ROOT: ${{ secrets.PROD_ROLLOUT_STAGE_EVIDENCE_ROOT }}
      QWQ_PROD_RELEASE_STATE_DIR: ${{ vars.PROD_RELEASE_STATE_DIR }}
      QWQ_PROD_BACKUP_RECOVERY_RECEIPT: ${{ vars.PROD_BACKUP_RECOVERY_RECEIPT }}
      QWQ_PROD_ROLLBACK_DRILL_RECEIPT_ID: ${{ vars.PROD_ROLLBACK_DRILL_RECEIPT_ID }}
    steps:
      - id: start
        name: Start prod transaction timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Validate protected rollout promotion evidence root
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path

          raw = os.environ.get("QWQ_PROD_ROLLOUT_EVIDENCE_ROOT", "").strip()
          root = Path(raw)
          if not raw or not root.is_absolute():
              raise SystemExit("GATE_BLOCK: protected rollout evidence root must be an absolute directory")
          try:
              metadata = os.lstat(root)
          except OSError as error:
              raise SystemExit(f"GATE_BLOCK: protected rollout evidence root is unavailable: {error}") from error
          if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
              raise SystemExit("GATE_BLOCK: protected rollout evidence root must be a non-symlink directory")
          if metadata.st_uid != os.getuid():
              raise SystemExit("GATE_BLOCK: protected rollout evidence root must be owned by the current uid")
          if metadata.st_mode & (stat.S_IWGRP | stat.S_IWOTH):
              raise SystemExit("GATE_BLOCK: protected rollout evidence root must not be group/world writable")
          PY
      - name: Materialize hosted rollout SSH credentials
        env:
          EDGE_KEY_MATERIAL: ${{ secrets.PROD_EDGE_SSH_KEY }}
          KEY_MATERIAL: ${{ secrets.PROD_SERVICE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$EDGE_KEY_MATERIAL" || "$EDGE_KEY_MATERIAL" != *"PRIVATE KEY"* ]]; then
            echo "::error::GATE_BLOCK: PROD_EDGE_SSH_KEY is missing or is not private-key material"
            exit 2
          fi
          if [[ -z "$KEY_MATERIAL" || "$KEY_MATERIAL" != *"PRIVATE KEY"* ]]; then
            echo "::error::GATE_BLOCK: PROD_SERVICE_SSH_KEY is missing or is not private-key material"
            exit 2
          fi
          EDGE_KEY_FILE="$RUNNER_TEMP/prod-edge-ssh-key"
          KEY_FILE="$RUNNER_TEMP/prod-service-ssh-key"
          (umask 077 && printf '%s\n' "$EDGE_KEY_MATERIAL" > "$EDGE_KEY_FILE")
          (umask 077 && printf '%s\n' "$KEY_MATERIAL" > "$KEY_FILE")
          chmod 600 "$EDGE_KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "PROD_EDGE_SSH_KEY_FILE=$EDGE_KEY_FILE" >> "$GITHUB_ENV"
          echo "PROD_SERVICE_SSH_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Validate every prod plane SSH credential once
        run: |
          for stage in canary 5 20 50 100; do
            python3 quwoquan_ops/cli/prod/validate_prod_plane_credentials.py \
              --stage "$stage"
          done
      - name: Login immutable release registry once
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: materialized_release
        name: Materialize immutable release evidence once
        env:
          NEW_RELEASE_EVIDENCE_REF: ${{ needs.preprod_evidence.outputs.release_evidence_ref }}
          EXISTING_RELEASE_EVIDENCE_REF: ${{ needs.prepare.outputs.existing_release_evidence_ref }}
        run: |
          ACTIVE_REF="${EXISTING_RELEASE_EVIDENCE_REF:-$NEW_RELEASE_EVIDENCE_REF}"
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "$ACTIVE_REF" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest"
          python3 - "$ACTIVE_REF" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          print(f"release_evidence_ref={sys.argv[1]}")
          print(f"artifact_digest={manifest['artifactDigest']}")
          PY
      - name: Require the reviewed canonical candidate
        env:
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.preprod_evidence.outputs.candidate_digest }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.materialized_release.outputs.artifact_digest }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ needs.prepare.outputs.service_pipeline_run_id }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.head_sha }}
          EXPECTED_RELEASE_REF: ${{ steps.materialized_release.outputs.release_evidence_ref }}
        run: |
          python3 quwoquan_ops/ci/verify_workflow_release_candidate.py \
            --manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --expected-candidate "$EXPECTED_CANDIDATE_DIGEST" \
            --expected-artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-repository "${{ github.repository }}" \
            --expected-release-ref "$EXPECTED_RELEASE_REF"
      - name: Rebind reviewed PR governance once
        if: ${{ needs.prepare.outputs.existing_release_evidence_ref == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/governance-receipt.json"
      - name: Require fresh hosted backup and recovery receipt
        if: ${{ needs.prepare.outputs.existing_release_evidence_ref == '' }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py verify \
            --env prod \
            --target prod-hosted \
            --kind all \
            --profile release \
            --backup-recovery-receipt "$QWQ_PROD_BACKUP_RECOVERY_RECEIPT" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-backup-recovery-preflight"
      - name: Seal rollback readiness from hosted ledger, real drill and backup recovery
        if: ${{ needs.prepare.outputs.existing_release_evidence_ref == '' }}
        env:
          FROM_CANDIDATE_DIGEST: ${{ needs.prepare.outputs.from_candidate_digest }}
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest"
          READINESS="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-rollback-readiness"
          ARCHIVE="$ROOT/evidence/raw/prod/readiness"
          mkdir -p "$READINESS" "$ARCHIVE"
          if [[ ! "$QWQ_PROD_ROLLBACK_DRILL_RECEIPT_ID" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::GATE_BLOCK: PROD_ROLLBACK_DRILL_RECEIPT_ID must identify a real hosted rollback receipt"
            exit 2
          fi
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service \
            --operation release-ledger-fetch \
            --service prod-stack \
            --output-path "$READINESS/current-ledger.json"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service \
            --operation release-ledger-receipt \
            --service prod-stack \
            --receipt-id "$QWQ_PROD_ROLLBACK_DRILL_RECEIPT_ID" \
            --output-path "$READINESS/rollback-drill.json"
          cp "$READINESS/current-ledger.json" "$ARCHIVE/current-ledger.json"
          cp "$READINESS/rollback-drill.json" "$ARCHIVE/rollback-drill.json"
          cp "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-backup-recovery-preflight/backup-recovery.json" "$ARCHIVE/backup-validation.json"
          python3 quwoquan_ops/ci/render_release_lifecycle_receipts.py rollback-readiness \
            --manifest "$ROOT/manifest.json" \
            --service prod-stack \
            --from-candidate-digest "$FROM_CANDIDATE_DIGEST" \
            --current-ledger-readback "$ARCHIVE/current-ledger.json" \
            --rollback-drill-readback "$ARCHIVE/rollback-drill.json" \
            --backup-validation "$ARCHIVE/backup-validation.json" \
            --archive-prefix evidence/raw/prod/readiness \
            --rollback-drill-max-age-seconds "${{ needs.prepare.outputs.rollback_drill_max_age_seconds }}" \
            --output "$READINESS/rollback.json"
          python3 quwoquan_ops/cli/prod/finalize_mainline_release_artifact.py \
            --artifact-dir "$ROOT" \
            --rollback-receipt "$READINESS/rollback.json"
          DEPLOYABLE_ARTIFACT_DIGEST="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          print(manifest["artifactDigest"])
          PY
          )"
          python3 quwoquan_ops/ci/verify_workflow_release_candidate.py \
            --manifest "$ROOT/manifest.json" \
            --expected-candidate "${{ needs.preprod_evidence.outputs.candidate_digest }}" \
            --expected-artifact-digest "$DEPLOYABLE_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "${{ needs.prepare.outputs.service_pipeline_run_id }}" \
            --expected-source-sha "${{ needs.prepare.outputs.head_sha }}" \
            --expected-repository "${{ github.repository }}" \
            --require-deployable
          echo "DEPLOYABLE_ARTIFACT_DIGEST=$DEPLOYABLE_ARTIFACT_DIGEST" >> "$GITHUB_ENV"
      - name: Setup Buildx for immutable Prod lifecycle evidence
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: deployable_bundle
        name: Publish exact deployable evidence snapshot before apply
        if: ${{ needs.prepare.outputs.existing_release_evidence_ref == '' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/ci-packages/process/service/release-evidence-manifest
          file: quwoquan_ops/cli/prod/release_artifact.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/release-artifact:deployable-${{ github.run_id }}
          sbom: true
          provenance: mode=max
      - id: deployable_ref
        name: Resolve exact deployable ReleaseEvidenceManifest OCI ref
        env:
          EXISTING_RELEASE_EVIDENCE_REF: ${{ needs.prepare.outputs.existing_release_evidence_ref }}
        run: |
          if [[ -n "$EXISTING_RELEASE_EVIDENCE_REF" ]]; then
            REF="$EXISTING_RELEASE_EVIDENCE_REF"
          else
            REF="ghcr.io/${{ github.repository }}/release-artifact@${{ steps.deployable_bundle.outputs.digest }}"
          fi
          if [[ ! "$REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GATE_BLOCK: active deployable evidence ref is not exact OCI"
            exit 2
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Require exact active deployable candidate
        env:
          ACTIVE_RELEASE_REF: ${{ steps.deployable_ref.outputs.ref }}
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest"
          ARTIFACT_DIGEST="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          print(manifest["artifactDigest"])
          PY
          )"
          python3 quwoquan_ops/ci/verify_workflow_release_candidate.py \
            --manifest "$ROOT/manifest.json" \
            --expected-candidate "${{ needs.preprod_evidence.outputs.candidate_digest }}" \
            --expected-artifact-digest "$ARTIFACT_DIGEST" \
            --expected-workflow-run-id "${{ needs.prepare.outputs.service_pipeline_run_id }}" \
            --expected-source-sha "${{ needs.prepare.outputs.head_sha }}" \
            --expected-repository "${{ github.repository }}" \
            --expected-release-ref "$ACTIVE_RELEASE_REF" \
            --require-deployable
      - name: Materialize canonical configuration packages once
        env:
          QWQ_PROD_RELEASE_ARTIFACT_ROOT: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/ci-packages/process/service/release-evidence-manifest
        run: |
          python3 quwoquan_ops/cli/stackctl.py package \
            --env prod \
            --target prod-hosted \
            --include-services \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-package"
      - name: Require the prebuilt immutable Ops Portal package
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          descriptor = (manifest.get("applicationPackages") or {}).get("prod", {}).get("opsPortal")
          if not isinstance(descriptor, dict) or not str(descriptor.get("digest") or "").startswith("sha256:"):
              raise SystemExit("GATE_BLOCK: prebuilt Prod Ops Portal package evidence is missing")
          PY
      - name: Deploy Prod canary
        if: ${{ needs.prepare.outputs.resume_stage == 'canary' }}
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
          WORKFLOW_STARTED_EPOCH: ${{ needs.prepare.outputs.workflow_started_epoch }}
          PROMOTION_CUTOFF_SECONDS: ${{ needs.prepare.outputs.promotion_cutoff_seconds }}
          HARD_FAIL_SECONDS: ${{ needs.prepare.outputs.hard_fail_seconds }}
          ROLLBACK_BUDGET_SECONDS: ${{ needs.prepare.outputs.rollback_budget_seconds }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-candidate-digest "${{ needs.prepare.outputs.from_candidate_digest }}" \
            --to-candidate-digest "${{ needs.prepare.outputs.candidate_digest }}" \
            --release-evidence-ref "${{ steps.deployable_ref.outputs.ref }}" \
            --stage canary \
            --step "${{ needs.prepare.outputs.canary_step }}" \
            --promotion-evidence "$QWQ_PROD_ROLLOUT_EVIDENCE_ROOT/canary.json" \
            --dry-run "${{ needs.prepare.outputs.dry_run }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --promotion-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + PROMOTION_CUTOFF_SECONDS ))" \
            --hard-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + HARD_FAIL_SECONDS ))" \
            --rollback-budget-seconds "$ROLLBACK_BUDGET_SECONDS" \
            --reuse-package \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-canary"
      - name: Explain dry-run boundary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: |
          echo "::notice::Dry-run remained read-only after canary validation. The 5/20/50/100 stages require committed hosted ledger transitions and are intentionally not fabricated."
      - name: Deploy Prod 5%
        if: ${{ needs.prepare.outputs.dry_run != 'true' && (needs.prepare.outputs.resume_stage == 'canary' || needs.prepare.outputs.resume_stage == '5') }}
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
          WORKFLOW_STARTED_EPOCH: ${{ needs.prepare.outputs.workflow_started_epoch }}
          PROMOTION_CUTOFF_SECONDS: ${{ needs.prepare.outputs.promotion_cutoff_seconds }}
          HARD_FAIL_SECONDS: ${{ needs.prepare.outputs.hard_fail_seconds }}
          ROLLBACK_BUDGET_SECONDS: ${{ needs.prepare.outputs.rollback_budget_seconds }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-candidate-digest "${{ needs.prepare.outputs.from_candidate_digest }}" \
            --to-candidate-digest "${{ needs.prepare.outputs.candidate_digest }}" \
            --release-evidence-ref "${{ steps.deployable_ref.outputs.ref }}" \
            --stage 5 \
            --step "${{ needs.prepare.outputs.percent_5_step }}" \
            --promotion-evidence "$QWQ_PROD_ROLLOUT_EVIDENCE_ROOT/5.json" \
            --dry-run false \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --promotion-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + PROMOTION_CUTOFF_SECONDS ))" \
            --hard-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + HARD_FAIL_SECONDS ))" \
            --rollback-budget-seconds "$ROLLBACK_BUDGET_SECONDS" \
            --reuse-package \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-5"
      - name: Deploy Prod 20%
        if: ${{ needs.prepare.outputs.dry_run != 'true' && (needs.prepare.outputs.resume_stage == 'canary' || needs.prepare.outputs.resume_stage == '5' || needs.prepare.outputs.resume_stage == '20') }}
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
          WORKFLOW_STARTED_EPOCH: ${{ needs.prepare.outputs.workflow_started_epoch }}
          PROMOTION_CUTOFF_SECONDS: ${{ needs.prepare.outputs.promotion_cutoff_seconds }}
          HARD_FAIL_SECONDS: ${{ needs.prepare.outputs.hard_fail_seconds }}
          ROLLBACK_BUDGET_SECONDS: ${{ needs.prepare.outputs.rollback_budget_seconds }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-candidate-digest "${{ needs.prepare.outputs.from_candidate_digest }}" \
            --to-candidate-digest "${{ needs.prepare.outputs.candidate_digest }}" \
            --release-evidence-ref "${{ steps.deployable_ref.outputs.ref }}" \
            --stage 20 \
            --step "${{ needs.prepare.outputs.percent_20_step }}" \
            --promotion-evidence "$QWQ_PROD_ROLLOUT_EVIDENCE_ROOT/20.json" \
            --dry-run false \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --promotion-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + PROMOTION_CUTOFF_SECONDS ))" \
            --hard-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + HARD_FAIL_SECONDS ))" \
            --rollback-budget-seconds "$ROLLBACK_BUDGET_SECONDS" \
            --reuse-package \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-20"
      - name: Deploy Prod 50%
        if: ${{ needs.prepare.outputs.dry_run != 'true' && (needs.prepare.outputs.resume_stage == 'canary' || needs.prepare.outputs.resume_stage == '5' || needs.prepare.outputs.resume_stage == '20' || needs.prepare.outputs.resume_stage == '50') }}
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
          WORKFLOW_STARTED_EPOCH: ${{ needs.prepare.outputs.workflow_started_epoch }}
          PROMOTION_CUTOFF_SECONDS: ${{ needs.prepare.outputs.promotion_cutoff_seconds }}
          HARD_FAIL_SECONDS: ${{ needs.prepare.outputs.hard_fail_seconds }}
          ROLLBACK_BUDGET_SECONDS: ${{ needs.prepare.outputs.rollback_budget_seconds }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-candidate-digest "${{ needs.prepare.outputs.from_candidate_digest }}" \
            --to-candidate-digest "${{ needs.prepare.outputs.candidate_digest }}" \
            --release-evidence-ref "${{ steps.deployable_ref.outputs.ref }}" \
            --stage 50 \
            --step "${{ needs.prepare.outputs.percent_50_step }}" \
            --promotion-evidence "$QWQ_PROD_ROLLOUT_EVIDENCE_ROOT/50.json" \
            --dry-run false \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --promotion-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + PROMOTION_CUTOFF_SECONDS ))" \
            --hard-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + HARD_FAIL_SECONDS ))" \
            --rollback-budget-seconds "$ROLLBACK_BUDGET_SECONDS" \
            --reuse-package \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-50"
      - name: Deploy Prod 100%
        if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.resume_stage != 'complete' }}
        env:
          PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
          WORKFLOW_STARTED_EPOCH: ${{ needs.prepare.outputs.workflow_started_epoch }}
          PROMOTION_CUTOFF_SECONDS: ${{ needs.prepare.outputs.promotion_cutoff_seconds }}
          HARD_FAIL_SECONDS: ${{ needs.prepare.outputs.hard_fail_seconds }}
          ROLLBACK_BUDGET_SECONDS: ${{ needs.prepare.outputs.rollback_budget_seconds }}
        run: |
          python3 quwoquan_ops/cli/stackctl.py deploy \
            --target prod-hosted \
            --cloud-provider "${{ needs.prepare.outputs.cloud_provider }}" \
            --service prod-stack \
            --from-candidate-digest "${{ needs.prepare.outputs.from_candidate_digest }}" \
            --to-candidate-digest "${{ needs.prepare.outputs.candidate_digest }}" \
            --release-evidence-ref "${{ steps.deployable_ref.outputs.ref }}" \
            --stage 100 \
            --step "${{ needs.prepare.outputs.percent_100_step }}" \
            --promotion-evidence "$QWQ_PROD_ROLLOUT_EVIDENCE_ROOT/100.json" \
            --dry-run false \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --promotion-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + PROMOTION_CUTOFF_SECONDS ))" \
            --hard-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + HARD_FAIL_SECONDS ))" \
            --rollback-budget-seconds "$ROLLBACK_BUDGET_SECONDS" \
            --reuse-package \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-100"
      - id: terminal_receipts
        name: Seal terminal Prod outcome from hosted receipt readbacks
        if: ${{ always() && needs.prepare.outputs.dry_run != 'true' }}
        env:
          FROM_CANDIDATE_DIGEST: ${{ needs.prepare.outputs.from_candidate_digest }}
          WORKFLOW_STARTED_EPOCH: ${{ needs.prepare.outputs.workflow_started_epoch }}
          HARD_FAIL_SECONDS: ${{ needs.prepare.outputs.hard_fail_seconds }}
          ROLLBACK_BUDGET_SECONDS: ${{ needs.prepare.outputs.rollback_budget_seconds }}
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest"
          INPUTS="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-terminal-inputs"
          OUTCOME="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-terminal-receipts"
          ARCHIVE="$ROOT/evidence/raw/prod/outcome"
          mkdir -p "$INPUTS" "$OUTCOME/environment" "$ARCHIVE"
          LEDGER="$INPUTS/current-ledger.json"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service \
            --operation release-ledger-fetch \
            --service prod-stack \
            --output-path "$LEDGER"
          ARGS=()
          while IFS='=' read -r stage receipt_id; do
            [[ -n "$stage" && -n "$receipt_id" ]] || continue
            case "$stage" in
              canary) report="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-canary/report.json" ;;
              5) report="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-5/report.json" ;;
              20) report="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-20/report.json" ;;
              50) report="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-50/report.json" ;;
              100) report="$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-100/report.json" ;;
              *) echo "::error::GATE_BLOCK: hosted ledger contains an unknown stage"; exit 2 ;;
            esac
            readback="$INPUTS/${stage}-readback.json"
            bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
              --plane service \
              --operation release-ledger-receipt \
              --service prod-stack \
              --receipt-id "$receipt_id" \
              --output-path "$readback"
            if [[ -s "$report" ]]; then
              python3 - "$report" "$receipt_id" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("releaseReceiptId") != sys.argv[2]:
              raise SystemExit("GATE_BLOCK: local stage report differs from hosted history")
          PY
            else
              python3 quwoquan_ops/ci/render_hosted_release_stage_report.py \
                --manifest "$ROOT/manifest.json" \
                --stage-readback "$readback" \
                --stage "$stage" \
                --service prod-stack \
                --output "$report"
            fi
            cp "$report" "$ARCHIVE/${stage}-report.json"
            cp "$readback" "$ARCHIVE/${stage}-readback.json"
            ARGS+=(
              --stage-report "$stage=$ARCHIVE/${stage}-report.json"
              --stage-readback "$stage=$ARCHIVE/${stage}-readback.json"
            )
          done < <(python3 - "$LEDGER" "$ROOT/manifest.json" "$FROM_CANDIDATE_DIGEST" <<'PY'
          import json
          import re
          import sys

          ledger = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          state = ledger.get("state") or {}
          candidate = manifest.get("candidateId")
          artifact = manifest.get("artifactDigest")
          source = sys.argv[3]
          decision = state.get("decision")
          normal = (
              state.get("from_candidate_digest") == source
              and state.get("to_candidate_digest") == candidate
          )
          rollback = (
              decision == "rolled_back"
              and state.get("from_candidate_digest") == candidate
              and state.get("to_candidate_digest") == source
          )
          if not (normal or rollback) or state.get("artifact_digest") != artifact:
              raise SystemExit("GATE_BLOCK: hosted stage history is not bound to this candidate transaction")
          fields = (
              ("canary", "canary_receipt_id"),
              ("5", "percent_5_receipt_id"),
              ("20", "percent_20_receipt_id"),
              ("50", "percent_50_receipt_id"),
              ("100", "percent_100_receipt_id"),
          )
          for stage, field in fields:
              receipt_id = str(state.get(field) or "")
              if receipt_id:
                  if re.fullmatch(r"[0-9a-f]{64}", receipt_id) is None:
                      raise SystemExit(f"GATE_BLOCK: hosted {stage} receipt id is invalid")
                  print(f"{stage}={receipt_id}")
          PY
          )
          if [[ "${#ARGS[@]}" -eq 0 ]]; then
            echo "::error::GATE_BLOCK: no immutable hosted Prod transition receipt exists"
            exit 2
          fi
          python3 quwoquan_ops/ci/render_release_lifecycle_receipts.py prod-outcome \
            --manifest "$ROOT/manifest.json" \
            --service prod-stack \
            --from-candidate-digest "$FROM_CANDIDATE_DIGEST" \
            "${ARGS[@]}" \
            --archive-prefix evidence/raw/prod/outcome \
            --hard-deadline-epoch "$(( WORKFLOW_STARTED_EPOCH + HARD_FAIL_SECONDS ))" \
            --rollback-budget-seconds "$ROLLBACK_BUDGET_SECONDS" \
            --output-dir "$OUTCOME"
          mv "$OUTCOME/prod.json" "$OUTCOME/environment/prod.json"
          python3 quwoquan_ops/cli/prod/finalize_mainline_release_artifact.py \
            --artifact-dir "$ROOT" \
            --environment-receipts-dir "$OUTCOME/environment" \
            --rollout-receipt "$OUTCOME/rollout.json" \
            --rollback-receipt "$OUTCOME/rollback.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          status = str(manifest.get("status") or "")
          artifact = str(manifest.get("artifactDigest") or "")
          if status not in {"released", "rolled-back", "rollback-failed"}:
              raise SystemExit(f"GATE_BLOCK: terminal release status is invalid: {status}")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", artifact) is None:
              raise SystemExit("GATE_BLOCK: terminal release evidence digest is invalid")
          print(f"status={status}")
          print(f"artifact_digest={artifact}")
          prod_receipt = (manifest.get("environmentReceipts") or {}).get("prod") or {}
          verified_at = str(prod_receipt.get("verifiedAt") or "")
          if not verified_at:
              raise SystemExit("GATE_BLOCK: terminal Prod receipt has no hosted verification timestamp")
          print(f"fully_verified_at={verified_at}")
          PY
      - id: terminal_bundle
        name: Publish immutable terminal ReleaseEvidenceManifest
        if: ${{ always() && needs.prepare.outputs.dry_run != 'true' && steps.terminal_receipts.outcome == 'success' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/ci-packages/process/service/release-evidence-manifest
          file: quwoquan_ops/cli/prod/release_artifact.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/release-artifact:terminal-${{ github.run_id }}
          sbom: true
          provenance: mode=max
      - id: terminal_bundle_ref
        name: Record exact terminal ReleaseEvidenceManifest OCI ref
        if: ${{ always() && needs.prepare.outputs.dry_run != 'true' && steps.terminal_bundle.outcome == 'success' }}
        run: |
          echo "ref=ghcr.io/${{ github.repository }}/release-artifact@${{ steps.terminal_bundle.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Extract released terminal SPDX SBOM
        if: ${{ always() && steps.terminal_bundle.outcome == 'success' && steps.terminal_receipts.outputs.status == 'released' }}
        run: |
          python3 quwoquan_ops/cli/prod/oci_supply_chain.py extract-sbom \
            --ref "${{ steps.terminal_bundle_ref.outputs.ref }}" \
            --output "$RUNNER_TEMP/terminal-release-artifact.spdx.json"
      - name: Sign released terminal provenance with GitHub OIDC
        if: ${{ always() && steps.terminal_bundle.outcome == 'success' && steps.terminal_receipts.outputs.status == 'released' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ghcr.io/${{ github.repository }}/release-artifact
          subject-digest: ${{ steps.terminal_bundle.outputs.digest }}
          push-to-registry: true
      - name: Sign released terminal SBOM with GitHub OIDC
        if: ${{ always() && steps.terminal_bundle.outcome == 'success' && steps.terminal_receipts.outputs.status == 'released' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ghcr.io/${{ github.repository }}/release-artifact
          subject-digest: ${{ steps.terminal_bundle.outputs.digest }}
          sbom-path: ${{ runner.temp }}/terminal-release-artifact.spdx.json
          push-to-registry: true
      - name: Verify released terminal OIDC identity and closure
        if: ${{ always() && steps.terminal_bundle.outcome == 'success' && steps.terminal_receipts.outputs.status == 'released' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 quwoquan_ops/cli/prod/oci_supply_chain.py verify \
            --ref "${{ steps.terminal_bundle_ref.outputs.ref }}" \
            --repository "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/deploy-prod-auto.yml" \
            --source-digest "${{ needs.prepare.outputs.head_sha }}"
      - name: Preserve terminal evidence but fail a non-release outcome
        if: ${{ always() && needs.prepare.outputs.dry_run != 'true' && steps.terminal_bundle.outcome == 'success' && steps.terminal_receipts.outputs.status != 'released' }}
        run: |
          echo "::error::Prod terminal evidence is ${{ steps.terminal_receipts.outputs.status }}; rollback evidence is preserved but promotion remains failed."
          exit 1
      - name: Upload prod transaction artifacts
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-prod-rollout
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/summary.json
            ${{ env.QWQ_OUTPUT_ROOT }}/env/prod/runs/**/report.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - id: finish
        if: always()
        name: Finish prod transaction timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  prod_soak_acceptance:
    name: Prod hosted soak authority
    needs: [prepare, prod_rollout]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prod_rollout.result == 'success' && needs.prod_rollout.outputs.release_status == 'released' }}
    runs-on: [self-hosted, macOS, ARM64]
    environment: production
    timeout-minutes: 1500
    permissions:
      contents: read
      packages: read
    outputs:
      receipt_id: ${{ steps.commit.outputs.receipt_id }}
      readback_digest: ${{ steps.commit.outputs.readback_digest }}
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROMETHEUS_URL: ${{ vars.PROD_PROMETHEUS_URL }}
      ALERTMANAGER_URL: ${{ vars.PROD_ALERTMANAGER_URL }}
      PROD_EDGE_SSH_KEY_REFERENCE: ${{ vars.PROD_EDGE_SSH_KEY_REFERENCE }}
      PROD_EDGE_SSH_KEY_PUBLIC_DIGEST: ${{ vars.PROD_EDGE_SSH_KEY_PUBLIC_DIGEST }}
      PROD_EDGE_SSH_KEY_ISSUER: ${{ vars.PROD_EDGE_SSH_KEY_ISSUER }}
      PROD_EDGE_SSH_KEY_EXPIRES_AT: ${{ vars.PROD_EDGE_SSH_KEY_EXPIRES_AT }}
      PROD_SERVICE_SSH_KEY_REFERENCE: ${{ vars.PROD_SERVICE_SSH_KEY_REFERENCE }}
      PROD_SERVICE_SSH_KEY_PUBLIC_DIGEST: ${{ vars.PROD_SERVICE_SSH_KEY_PUBLIC_DIGEST }}
      PROD_SERVICE_SSH_KEY_ISSUER: ${{ vars.PROD_SERVICE_SSH_KEY_ISSUER }}
      PROD_SERVICE_SSH_KEY_EXPIRES_AT: ${{ vars.PROD_SERVICE_SSH_KEY_EXPIRES_AT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Materialize hosted soak SSH credentials
        env:
          EDGE_KEY_MATERIAL: ${{ secrets.PROD_EDGE_SSH_KEY }}
          SERVICE_KEY_MATERIAL: ${{ secrets.PROD_SERVICE_SSH_KEY }}
        run: |
          set -euo pipefail
          for binding in EDGE SERVICE; do
            variable="${binding}_KEY_MATERIAL"
            material="${!variable}"
            if [[ -z "$material" || "$material" != *"PRIVATE KEY"* ]]; then
              echo "::error::GATE_BLOCK: PROD_${binding}_SSH_KEY is missing or invalid"
              exit 2
            fi
            if [[ "$binding" == "EDGE" ]]; then
              key_file="$RUNNER_TEMP/prod-edge-ssh-key"
            else
              key_file="$RUNNER_TEMP/prod-service-ssh-key"
            fi
            (umask 077 && printf '%s\n' "$material" > "$key_file")
            chmod 600 "$key_file"
            echo "PROD_${binding}_SSH_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          done
      - name: Login immutable release registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize released terminal evidence
        run: |
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "${{ needs.prod_rollout.outputs.release_evidence_ref }}" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/release-evidence"
      - name: Fetch exact 100% stage hosted receipt
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/release-evidence"
          RECEIPT_ID="$(python3 - "$ROOT/manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if manifest.get("status") != "released":
              raise SystemExit("GATE_BLOCK: prod soak requires released terminal evidence")
          stage = (((manifest.get("rolloutReceipt") or {}).get("evidence") or {}).get("stages") or {}).get("100") or {}
          receipt_id = str(stage.get("receiptId") or "")
          if len(receipt_id) != 64:
              raise SystemExit("GATE_BLOCK: released manifest lacks 100% hosted receipt")
          print(receipt_id)
          PY
          )"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service \
            --operation release-ledger-receipt \
            --service prod-stack \
            --receipt-id "$RECEIPT_ID" \
            --output-path "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/100-readback.json"
      - name: Observe authoritative soak window
        run: |
          python3 quwoquan_ops/ci/collect_prod_soak_observations.py \
            --full-readback "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/100-readback.json" \
            --service prod-stack \
            --prometheus-url "$PROMETHEUS_URL" \
            --alertmanager-url "$ALERTMANAGER_URL" \
            --soak-policy quwoquan_ops/policies/config-release/slo_thresholds.yaml \
            --health-report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/hosted-soak-health" \
            --slo-output "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/slo.json" \
            --alerts-output "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/alerts.json"
      - name: Verify expiring credential references without secret material
        run: |
          python3 quwoquan_ops/cli/prod/validate_prod_plane_credentials.py \
            --stage 100 \
            --evidence-output "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/credentials.json"
      - name: Bind reviewed mainline approval to released artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/release-evidence"
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --release-manifest "$ROOT/manifest.json" \
            --minimum-approvals 1 \
            --output "$ROOT/governance-receipt.json"
      - name: Render canonical hosted soak request
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/release-evidence"
          python3 quwoquan_ops/ci/render_release_lifecycle_receipts.py prod-soak-request \
            --manifest "$ROOT/manifest.json" \
            --service prod-stack \
            --full-readback "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/100-readback.json" \
            --slo-observation "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/slo.json" \
            --alerts-observation "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/alerts.json" \
            --health-report "$QWQ_OUTPUT_ROOT/env/prod/runs/hosted-soak-health/report.json" \
            --credential-evidence "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/credentials.json" \
            --credential-policy quwoquan_ops/environments/prod/access-isolation.yaml \
            --governance-receipt "$ROOT/governance-receipt.json" \
            --soak-policy quwoquan_ops/policies/config-release/slo_thresholds.yaml \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/request.json"
      - id: commit
        name: Commit and read back immutable hosted soak receipt
        run: |
          REQUEST="$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/request.json"
          COMMITTED="$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/committed-readback.json"
          READBACK="$QWQ_OUTPUT_ROOT/env/repo/local/prod-soak/remote-readback.json"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service \
            --operation release-ledger-soak-commit \
            --service prod-stack \
            --request-path "$REQUEST" \
            --output-path "$COMMITTED"
          RECEIPT_ID="$(python3 - "$COMMITTED" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["receipt"]["receiptId"])
          PY
          )"
          bash quwoquan_ops/cli/prod/sync_prod_plane_stack.sh \
            --plane service \
            --operation release-ledger-soak-receipt \
            --service prod-stack \
            --receipt-id "$RECEIPT_ID" \
            --output-path "$READBACK"
          cmp "$COMMITTED" "$READBACK"
          python3 - "$READBACK" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          payload = json.loads(raw)
          print(f"receipt_id={payload['receipt']['receiptId']}")
          print(f"readback_digest=sha256:{hashlib.sha256(raw).hexdigest()}")
          PY

  mainline_summary:
    name: 07. Deploy To Prod (Controlled)
    needs:
      - source_context
      - service_pipeline
      - app_pipeline
      - prepare
      - delivery_gate
      - alpha_local
      - beta_device_matrix
      - gamma_local
      - preprod_evidence
      - prod_rollout
      - prod_soak_acceptance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.source_context.outputs.source_git_sha || github.sha }}
      - id: workflow_timing
        name: Read authoritative workflow timing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVICE_PIPELINE_MACHINE_SECONDS: ${{ needs.service_pipeline.outputs.machine_critical_path_seconds }}
          APP_PIPELINE_MACHINE_SECONDS: ${{ needs.app_pipeline.outputs.machine_critical_path_seconds }}
          DELIVERY_GATE_MACHINE_SECONDS: ${{ needs.delivery_gate.outputs.machine_critical_path_seconds }}
          BETA_MATRIX_MACHINE_SECONDS: ${{ needs.beta_device_matrix.outputs.machine_critical_path_seconds }}
        run: |
          REQUIRED=(SERVICE_PIPELINE_MACHINE_SECONDS APP_PIPELINE_MACHINE_SECONDS DELIVERY_GATE_MACHINE_SECONDS BETA_MATRIX_MACHINE_SECONDS)
          for name in "${REQUIRED[@]}"; do
            if [[ ! "${!name}" =~ ^[0-9]+$ ]]; then
              echo "::error::GATE_BLOCK: reusable workflow timing is missing or invalid: ${name}"
              exit 2
            fi
          done
          python3 quwoquan_ops/ci/github_actions_timing.py \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --phase "source_context=Resolve exact mainline source" \
            --phase "prepare=Seal canonical candidate and prepare promotion" \
            --phase "alpha_stage=Alpha local stage" \
            --phase "gamma_local=Gamma-local release-fast stage" \
            --phase "preprod_evidence=Accept Alpha then Beta then Gamma receipts" \
            --phase "prod_rollout_transaction=Prod rollout transaction" \
            --external-phase "service_pipeline=${SERVICE_PIPELINE_MACHINE_SECONDS}" \
            --external-phase "app_pipeline=${APP_PIPELINE_MACHINE_SECONDS}" \
            --external-phase "delivery_gate=${DELIVERY_GATE_MACHINE_SECONDS}" \
            --external-phase "beta_device_matrix=${BETA_MATRIX_MACHINE_SECONDS}" \
            --require-count "source_context=1" \
            --require-count "prepare=1" \
            --require-count "alpha_stage=1" \
            --require-count "gamma_local=1" \
            --require-count "preprod_evidence=1" \
            --require-count "prod_rollout_transaction=1" \
            --dag-layer "source_context" \
            --dag-layer "service_pipeline,app_pipeline,delivery_gate" \
            --dag-layer "prepare" \
            --dag-layer "alpha_stage,beta_device_matrix,gamma_local" \
            --dag-layer "preprod_evidence" \
            --dag-layer "prod_rollout_transaction" \
            --candidate-job "Seal canonical candidate and prepare promotion" \
            --prod-job "Prod rollout transaction" \
            --critical-start run \
            --github-output "$GITHUB_OUTPUT"
      - name: Render canonical release timing summary
        if: ${{ steps.workflow_timing.outcome == 'success' }}
        env:
          SOURCE_CONTEXT_SECONDS: ${{ steps.workflow_timing.outputs.phase_source_context }}
          SERVICE_PIPELINE_SECONDS: ${{ steps.workflow_timing.outputs.phase_service_pipeline }}
          APP_PIPELINE_SECONDS: ${{ steps.workflow_timing.outputs.phase_app_pipeline }}
          DELIVERY_GATE_SECONDS: ${{ steps.workflow_timing.outputs.phase_delivery_gate }}
          PREPARE_SECONDS: ${{ steps.workflow_timing.outputs.phase_prepare }}
          ALPHA_SECONDS: ${{ steps.workflow_timing.outputs.phase_alpha_stage }}
          BETA_SECONDS: ${{ steps.workflow_timing.outputs.phase_beta_device_matrix }}
          GAMMA_SECONDS: ${{ steps.workflow_timing.outputs.phase_gamma_local }}
          PREPROD_SECONDS: ${{ steps.workflow_timing.outputs.phase_preprod_evidence }}
          PROD_SECONDS: ${{ steps.workflow_timing.outputs.phase_prod_rollout_transaction }}
          MACHINE_CRITICAL_PATH_SECONDS: ${{ steps.workflow_timing.outputs.machine_critical_path_seconds }}
          RUN_CREATED_AT: ${{ steps.workflow_timing.outputs.run_created_at }}
          CANDIDATE_READY_AT: ${{ steps.workflow_timing.outputs.candidate_ready_at }}
          APPROVAL_REQUESTED_AT: ${{ steps.workflow_timing.outputs.approval_requested_at }}
          APPROVAL_APPROVED_AT: ${{ steps.workflow_timing.outputs.approval_approved_at }}
          PROD_COMPLETED_AT: ${{ steps.workflow_timing.outputs.prod_completed_at }}
          PROD_FULLY_VERIFIED_AT: ${{ needs.prod_rollout.outputs.fully_verified_at }}
          QUEUE_SECONDS: ${{ steps.workflow_timing.outputs.queue_seconds }}
          UPSTREAM_MISSING_EVIDENCE: ${{ steps.workflow_timing.outputs.missing_evidence }}
          SETUP_SECONDS: ${{ steps.workflow_timing.outputs.setup_seconds }}
          EXECUTION_SECONDS: ${{ steps.workflow_timing.outputs.execution_seconds }}
          HUMAN_DECISION_WAIT_SECONDS: ${{ steps.workflow_timing.outputs.human_decision_wait_seconds }}
          APPROVAL_WAIT_SECONDS: ${{ steps.workflow_timing.outputs.approval_wait_seconds }}
          APPROVAL_EVIDENCE_REASON: ${{ steps.workflow_timing.outputs.approval_evidence_reason }}
          CALENDAR_SECONDS: ${{ steps.workflow_timing.outputs.calendar_lead_time_seconds }}
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.candidate_digest }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RELEASE_STATUS: ${{ needs.prod_rollout.outputs.release_status }}
          SOFT_BUDGET_SECONDS: ${{ needs.prepare.outputs.soft_budget_seconds }}
          HARD_FAIL_SECONDS: ${{ needs.prepare.outputs.hard_fail_seconds }}
          SOURCE_CONTEXT_RESULT: ${{ needs.source_context.result }}
          SERVICE_PIPELINE_RESULT: ${{ needs.service_pipeline.result }}
          APP_PIPELINE_RESULT: ${{ needs.app_pipeline.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DELIVERY_GATE_RESULT: ${{ needs.delivery_gate.result }}
          ALPHA_RESULT: ${{ needs.alpha_local.result }}
          BETA_RESULT: ${{ needs.beta_device_matrix.result }}
          GAMMA_RESULT: ${{ needs.gamma_local.result }}
          PREPROD_RESULT: ${{ needs.preprod_evidence.result }}
          PROD_RESULT: ${{ needs.prod_rollout.result }}
        run: |
          REQUIRED_UPSTREAM_RESULTS=(
            SOURCE_CONTEXT_RESULT SERVICE_PIPELINE_RESULT APP_PIPELINE_RESULT
            PREPARE_RESULT DELIVERY_GATE_RESULT ALPHA_RESULT BETA_RESULT
            GAMMA_RESULT PREPROD_RESULT
          )
          for name in "${REQUIRED_UPSTREAM_RESULTS[@]}"; do
            if [[ "${!name}" != "success" ]]; then
              echo "::error::GATE_BLOCK: canonical complete timing requires successful upstream job ${name}; got ${!name}"
              exit 2
            fi
          done
          if [[ "$PROD_RESULT" != "success" && ! "$RELEASE_STATUS" =~ ^(rolled-back|rollback-failed)$ ]]; then
            echo "::error::GATE_BLOCK: failed Prod job has no canonical terminal release outcome"
            exit 2
          fi
          REQUIRED=(
            SOURCE_CONTEXT_SECONDS SERVICE_PIPELINE_SECONDS APP_PIPELINE_SECONDS
            DELIVERY_GATE_SECONDS PREPARE_SECONDS ALPHA_SECONDS BETA_SECONDS
            GAMMA_SECONDS PREPROD_SECONDS PROD_SECONDS MACHINE_CRITICAL_PATH_SECONDS
            RUN_CREATED_AT CANDIDATE_READY_AT PROD_COMPLETED_AT
            CALENDAR_SECONDS CANDIDATE_DIGEST APPROVAL_EVIDENCE_REASON
          )
          for name in "${REQUIRED[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GATE_BLOCK: canonical mainline timing is missing ${name}"
              exit 2
            fi
          done
          PROD_TIMESTAMP_ARGS=()
          if [ "${DRY_RUN}" != "true" ]; then
            if [[ -z "$PROD_FULLY_VERIFIED_AT" ]]; then
              echo "::error::GATE_BLOCK: hosted terminal Prod verification timestamp is missing"
              exit 2
            fi
            if [[ ! "$RELEASE_STATUS" =~ ^(released|rolled-back|rollback-failed)$ ]]; then
              echo "::error::GATE_BLOCK: hosted terminal release status is missing or invalid"
              exit 2
            fi
            PROD_TIMESTAMP_ARGS+=(--prod-fully-verified-at "${PROD_FULLY_VERIFIED_AT}")
            RELEASE_OUTCOME="$RELEASE_STATUS"
          else
            RELEASE_OUTCOME="dry-run"
          fi
          APPROVAL_TIMESTAMP_ARGS=()
          if [[ -n "$APPROVAL_REQUESTED_AT" ]]; then
            APPROVAL_TIMESTAMP_ARGS+=(--approval-requested-at "$APPROVAL_REQUESTED_AT")
          fi
          if [[ -n "$APPROVAL_APPROVED_AT" ]]; then
            APPROVAL_TIMESTAMP_ARGS+=(--approval-approved-at "$APPROVAL_APPROVED_AT")
          fi
          DURATION_ARGS=(--calendar-lead-time-seconds "$CALENDAR_SECONDS")
          EVIDENCE_ARGS=()
          NOTE_ARGS=()
          if [[ -n "$QUEUE_SECONDS" ]]; then DURATION_ARGS+=(--queue-seconds "$QUEUE_SECONDS"); fi
          if [[ -n "$UPSTREAM_MISSING_EVIDENCE" ]]; then
            EVIDENCE_ARGS+=(--missing-evidence "$UPSTREAM_MISSING_EVIDENCE")
            NOTE_ARGS+=(--note "GitHub Jobs API omitted created_at for one or more matched jobs; queue duration is absent and no zero or substitute timestamp was used.")
          fi
          if [[ -n "$SETUP_SECONDS" ]]; then DURATION_ARGS+=(--setup-seconds "$SETUP_SECONDS"); fi
          if [[ -n "$EXECUTION_SECONDS" ]]; then DURATION_ARGS+=(--execution-seconds "$EXECUTION_SECONDS"); fi
          if [[ -n "$HUMAN_DECISION_WAIT_SECONDS" ]]; then DURATION_ARGS+=(--human-decision-wait-seconds "$HUMAN_DECISION_WAIT_SECONDS"); fi
          if [[ -n "$APPROVAL_WAIT_SECONDS" ]]; then DURATION_ARGS+=(--approval-wait-seconds "$APPROVAL_WAIT_SECONDS"); fi
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 07.mainline_auto_prod \
            --title "07. Deploy To Prod (Controlled)" \
            --source-git-sha "${{ needs.prepare.outputs.head_sha }}" \
            --candidate-digest "${CANDIDATE_DIGEST}" \
            --machine-critical-path-seconds "${MACHINE_CRITICAL_PATH_SECONDS}" \
            --critical-path-source github_run_calendar \
            --release-outcome "$RELEASE_OUTCOME" \
            --run-created-at "${RUN_CREATED_AT}" \
            --candidate-ready-at "${CANDIDATE_READY_AT}" \
            "${APPROVAL_TIMESTAMP_ARGS[@]}" \
            "${PROD_TIMESTAMP_ARGS[@]}" \
            "${DURATION_ARGS[@]}" \
            "${EVIDENCE_ARGS[@]}" \
            "${NOTE_ARGS[@]}" \
            --phase "source_context=${SOURCE_CONTEXT_SECONDS}" \
            --phase "service_pipeline=${SERVICE_PIPELINE_SECONDS}" \
            --phase "app_pipeline=${APP_PIPELINE_SECONDS}" \
            --phase "delivery_gate=${DELIVERY_GATE_SECONDS}" \
            --phase "prepare=${PREPARE_SECONDS}" \
            --phase "alpha_stage=${ALPHA_SECONDS}" \
            --phase "beta_device_matrix=${BETA_SECONDS}" \
            --phase "gamma_local=${GAMMA_SECONDS}" \
            --phase "preprod_evidence=${PREPROD_SECONDS}" \
            --phase "prod_rollout_transaction=${PROD_SECONDS}" \
            --note "Alpha/Beta/Gamma run in isolated fanout; Prod is one approved canary/5/20/50/100 transaction. Dry-run validates canary only and does not fabricate later ledger state." \
            --note "${APPROVAL_EVIDENCE_REASON}" \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/ci-timing-summary.json" \
            --write-step-summary
          if [ "${CALENDAR_SECONDS}" -gt "${HARD_FAIL_SECONDS}" ]; then
            echo "::error::mainline end-to-end time ${CALENDAR_SECONDS}s exceeds the ${HARD_FAIL_SECONDS}s hard gate"
            exit 1
          elif [ "${CALENDAR_SECONDS}" -gt "${SOFT_BUDGET_SECONDS}" ]; then
            echo "::warning::RELEASED_OVER_SOFT_BUDGET: mainline end-to-end time ${CALENDAR_SECONDS}s exceeds ${SOFT_BUDGET_SECONDS}s"
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ -z "$APPROVAL_REQUESTED_AT" || -z "$APPROVAL_APPROVED_AT" || -z "$APPROVAL_WAIT_SECONDS" || -z "$HUMAN_DECISION_WAIT_SECONDS" ]]; then
              echo "::error::GATE_BLOCK: ${APPROVAL_EVIDENCE_REASON} Canonical summary remains historical_incomplete."
              exit 2
            fi
          fi
          if [[ -n "$UPSTREAM_MISSING_EVIDENCE" ]]; then
            echo "::error::GATE_BLOCK: canonical mainline timing is historical_incomplete: ${UPSTREAM_MISSING_EVIDENCE}"
            exit 2
          fi
      - name: Preserve canonical failure-path timing without fabrication
        if: ${{ always() && !cancelled() }}
        env:
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.candidate_digest }}
          SOURCE_CONTEXT_RESULT: ${{ needs.source_context.result }}
          SERVICE_PIPELINE_RESULT: ${{ needs.service_pipeline.result }}
          APP_PIPELINE_RESULT: ${{ needs.app_pipeline.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DELIVERY_GATE_RESULT: ${{ needs.delivery_gate.result }}
          ALPHA_RESULT: ${{ needs.alpha_local.result }}
          BETA_RESULT: ${{ needs.beta_device_matrix.result }}
          GAMMA_RESULT: ${{ needs.gamma_local.result }}
          PREPROD_RESULT: ${{ needs.preprod_evidence.result }}
          PROD_RESULT: ${{ needs.prod_rollout.result }}
        run: |
          SUMMARY="$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/ci-timing-summary.json"
          if [[ -s "$SUMMARY" ]]; then
            echo "::notice::Canonical CiTimingSummary already exists; failure-path fallback will not overwrite it."
            exit 0
          fi
          CANDIDATE_ARGS=()
          if [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            CANDIDATE_ARGS+=(--candidate-digest "$CANDIDATE_DIGEST")
          fi
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 07.mainline_auto_prod \
            --title "07. Deploy To Prod (Controlled)" \
            --workflow "${{ github.workflow }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --source-git-sha "${{ github.sha }}" \
            "${CANDIDATE_ARGS[@]}" \
            --missing-evidence "workflowTiming.authoritativeDAG" \
            --missing-evidence "upstreamJobs=${SOURCE_CONTEXT_RESULT},${SERVICE_PIPELINE_RESULT},${APP_PIPELINE_RESULT},${PREPARE_RESULT},${DELIVERY_GATE_RESULT},${ALPHA_RESULT},${BETA_RESULT},${GAMMA_RESULT},${PREPROD_RESULT},${PROD_RESULT}" \
            --note "Failure-path evidence records only immutable GitHub run identity; unavailable timing, phase, candidate, approval, and Prod facts remain null or missing." \
            --write-json "$SUMMARY" \
            --write-step-summary
      - name: Setup Buildx for canonical timing OCI
        if: ${{ always() && !cancelled() }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - name: Login canonical timing registry
        if: ${{ always() && !cancelled() }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: timing_bundle
        name: Publish canonical CiTimingSummary to immutable OCI
        if: ${{ always() && !cancelled() }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/ci-timing
          file: quwoquan_ops/ci/ci_timing_summary.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-timing-summary:run-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: timing_bundle_ref
        name: Record exact CiTimingSummary OCI digest ref
        if: ${{ always() && !cancelled() }}
        env:
          TIMING_EVIDENCE_DIGEST: ${{ steps.timing_bundle.outputs.digest }}
        run: |
          if [[ ! "$TIMING_EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GATE_BLOCK: canonical timing OCI transport digest is missing or invalid"
            exit 2
          fi
          TIMING_EVIDENCE_REF="ghcr.io/${{ github.repository }}/ci-timing-summary@${TIMING_EVIDENCE_DIGEST}"
          echo "ref=$TIMING_EVIDENCE_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$TIMING_EVIDENCE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Bind exact timing OCI into hosted append-only authority
        if: ${{ always() && !cancelled() }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVICE_SSH_KEY: ${{ secrets.PROD_SERVICE_SSH_KEY }}
          TIMING_EVIDENCE_REF: ${{ steps.timing_bundle_ref.outputs.ref }}
          TIMING_EVIDENCE_DIGEST: ${{ steps.timing_bundle_ref.outputs.digest }}
        run: |
          python3 quwoquan_ops/ci/sync_hosted_ci_timing_ledger.py bind \
            --summary "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/ci-timing-summary.json" \
            --timing-evidence-ref "$TIMING_EVIDENCE_REF" \
            --timing-evidence-digest "$TIMING_EVIDENCE_DIGEST" \
            --output "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/hosted-bind-readback.json"
      - name: Query hosted timing authority and verify readback
        if: ${{ always() && !cancelled() }}
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SERVICE_SSH_KEY: ${{ secrets.PROD_SERVICE_SSH_KEY }}
        run: |
          python3 quwoquan_ops/ci/sync_hosted_ci_timing_ledger.py query \
            --candidate-digest "${{ needs.prepare.outputs.candidate_digest }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --output "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/hosted-query-readback.json"
          if ! cmp -s \
            "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/hosted-bind-readback.json" \
            "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/hosted-query-readback.json"; then
            echo "::error::GATE_BLOCK: hosted timing authority query differs from committed exact OCI binding"
            exit 2
          fi
      - name: Upload diagnostic timing copy (non-authoritative)
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-prod-timing-summaries
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/ci-timing/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Assert four-environment promotion chain
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          DELIVERY_RESULT: ${{ needs.delivery_gate.outputs.summary_result }}
          ALPHA_RESULT: ${{ needs.alpha_local.result }}
          BETA_RESULT: ${{ needs.beta_device_matrix.outputs.summary_result }}
          GAMMA_RESULT: ${{ needs.gamma_local.result }}
          PROD_RESULT: ${{ needs.prod_rollout.result }}
          PROD_RELEASE_STATUS: ${{ needs.prod_rollout.outputs.release_status }}
          PROD_SOAK_RESULT: ${{ needs.prod_soak_acceptance.result }}
        run: |
          set -euo pipefail
          fail=0
          expect_success() {
            local name="$1" value="$2" hint="$3"
            if [ "${value}" != "success" ]; then
              echo "::error::${name} expected success, got ${value}. ${hint}"
              fail=1
            fi
          }
          expect_success "delivery_gate" "${DELIVERY_RESULT}" "检查 03 Delivery Gate"
          expect_success "alpha_local" "${ALPHA_RESULT}" "检查 alpha-local package/up/health/verify"
          expect_success "beta_device_matrix" "${BETA_RESULT}" "检查 beta-local self-hosted device matrix"
          expect_success "gamma_local" "${GAMMA_RESULT}" "检查 gamma-local release-fast package/up/health/verify"
          expect_success "prod_rollout" "${PROD_RESULT}" "检查单一 Prod 事务及真实 GATE_BLOCK"
          if [[ "$DRY_RUN" != "true" ]]; then
            expect_success "prod_soak_acceptance" "${PROD_SOAK_RESULT}" "检查真实 soak、告警、健康、凭据与审批 hosted readback"
            if [[ "${PROD_RELEASE_STATUS}" != "released" ]]; then
              echo "::error::prod_rollout terminal status expected released, got ${PROD_RELEASE_STATUS:-missing}. Rolled-back or rollback-failed evidence is preserved but cannot be promoted as green."
              fail=1
            fi
          elif [[ "$PROD_SOAK_RESULT" != "skipped" ]]; then
            echo "::error::automatic dry-run must not execute Prod soak; got ${PROD_SOAK_RESULT}"
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
