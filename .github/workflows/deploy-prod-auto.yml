# mainline 端到端编排：main 合入自动启动，Prod 仍由 production environment 审批。
# 当前阶段 main 只生成 GHCR OCI digest；第一方容器预验证由 stackctl 的
# mode=prevalidate 独立执行，不能写入正式 rollout、ledger 或 receipt。
# 设计见 specs/feature-tree/runtime/deliver-deploy-prod-pipeline/design.md
name: 07. Deploy To Prod (Controlled)

permissions:
  contents: read
  actions: read
  packages: read

env:
  QWQ_OUTPUT_ROOT: .qwq_output

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'quwoquan_app/**'
      - 'quwoquan_data/**'
      - 'quwoquan_ops/**'
      - 'quwoquan_service/**'
      - 'specs/feature-tree/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact main commit SHA; defaults to dispatch ref SHA'
        required: false
        default: ''
      cloud_provider:
        description: 'Cloud provider'
        required: false
        default: 'aliyun'
      dry_run:
        description: 'Formal rollout dry run; set false only after all release gates and approvals are valid'
        required: false
        default: true
        type: boolean
      provider_evidence_ref:
        description: 'Exact executed Provider evidence OCI ref; defaults to controlled repository variable'
        required: false
        default: ''
      provider_evidence_digest:
        description: 'Executed Provider evidence OCI transport digest'
        required: false
        default: ''
      provider_candidate_image_digest:
        description: 'Candidate image-set digest executed by Provider evidence'
        required: false
        default: ''

concurrency:
  group: prod-hosted-release
  cancel-in-progress: false

jobs:
  source_context:
    name: Resolve exact mainline source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      source_git_sha: ${{ steps.source.outputs.source_git_sha }}
      base_sha: ${{ steps.source.outputs.base_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_sha || github.sha }}
      - id: source
        name: Require an exact commit reachable from main
        env:
          REQUESTED_SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
          EVENT_BASE_SHA: ${{ github.event.before || '' }}
        run: |
          SOURCE_SHA="$(git rev-parse "$REQUESTED_SOURCE_SHA")"
          git fetch --no-tags origin main
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::GATE_BLOCK: source must be an exact commit reachable from main"
            exit 2
          fi
          BASE_SHA="$EVENT_BASE_SHA"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${SOURCE_SHA}^")"
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GATE_BLOCK: diff base must be an exact Git SHA"
            exit 2
          fi
          echo "source_git_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

  service_pipeline:
    name: Service Pipeline (same mainline DAG)
    needs: [source_context]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/service_pipeline.yml
    with:
      source_sha: ${{ needs.source_context.outputs.source_git_sha }}
      base_sha: ${{ needs.source_context.outputs.base_sha }}
    secrets: inherit

  app_pipeline:
    name: App package evidence (same mainline DAG)
    needs: [source_context]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/app_pipeline.yml
    with:
      source_git_sha: ${{ needs.source_context.outputs.source_git_sha }}
      base_git_sha: ${{ needs.source_context.outputs.base_sha }}
    secrets: inherit

  prepare:
    name: Seal canonical candidate and prepare promotion
    needs: [source_context, service_pipeline, app_pipeline, delivery_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      packages: write
      pull-requests: read
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
    outputs:
      canary_step: ${{ steps.stages.outputs.canary_step }}
      percent_5_step: ${{ steps.stages.outputs.percent_5_step }}
      percent_20_step: ${{ steps.stages.outputs.percent_20_step }}
      percent_50_step: ${{ steps.stages.outputs.percent_50_step }}
      percent_100_step: ${{ steps.stages.outputs.percent_100_step }}
      from_candidate_digest: ${{ steps.inputs.outputs.from_candidate_digest }}
      resume_stage: ${{ steps.inputs.outputs.resume_stage }}
      existing_release_evidence_ref: ${{ steps.inputs.outputs.existing_release_evidence_ref }}
      cloud_provider: ${{ steps.inputs.outputs.cloud_provider }}
      dry_run: ${{ steps.inputs.outputs.dry_run }}
      checkout_ref: ${{ needs.service_pipeline.outputs.source_git_sha }}
      base_sha: ${{ needs.source_context.outputs.base_sha }}
      head_sha: ${{ needs.service_pipeline.outputs.source_git_sha }}
      has_release_evidence: ${{ steps.evidence.outputs.has_release_evidence }}
      release_evidence_ref: ${{ steps.candidate_bundle_ref.outputs.ref }}
      component_evidence_ref: ${{ needs.service_pipeline.outputs.component_evidence_ref }}
      service_pipeline_run_id: ${{ needs.service_pipeline.outputs.producer_workflow_run_id }}
      service_pipeline_machine_seconds: ${{ needs.service_pipeline.outputs.machine_critical_path_seconds }}
      workflow_created_at: ${{ steps.workflow_clock.outputs.created_at }}
      workflow_started_epoch: ${{ steps.workflow_clock.outputs.started_epoch }}
      candidate_digest: ${{ steps.candidate_identity.outputs.candidate_digest }}
      artifact_digest: ${{ steps.candidate_identity.outputs.artifact_digest }}
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      soft_budget_seconds: ${{ steps.release_budget.outputs.soft_budget_seconds }}
      hard_fail_seconds: ${{ steps.release_budget.outputs.hard_fail_seconds }}
      promotion_cutoff_seconds: ${{ steps.release_budget.outputs.promotion_cutoff_seconds }}
      rollback_budget_seconds: ${{ steps.release_budget.outputs.rollback_budget_seconds }}
      rollback_drill_max_age_seconds: ${{ steps.release_budget.outputs.rollback_drill_max_age_seconds }}
    steps:
      - id: start
        name: Start prepare timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: workflow_clock
        name: Resolve authoritative workflow clock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.request
          from datetime import datetime

          request = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          created_at = payload.get("created_at")
          if not isinstance(created_at, str):
              raise SystemExit("workflow run has no authoritative created_at")
          created = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
          print(f"created_at={created_at}")
          print(f"started_epoch={int(created.timestamp())}")
          PY
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          ref: ${{ needs.service_pipeline.outputs.source_git_sha }}
      - id: release_budget
        name: Resolve canonical 10/30 release budget
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("quwoquan_ops/environments/pr_gate_timing_budgets.json").read_text(
                  encoding="utf-8"
              )
          )
          gate = payload["gates"]["07.mainline_auto_prod"]
          values = {
              "soft_budget_seconds": int(gate["budgetSeconds"]),
              "hard_fail_seconds": int(gate["hardFailSeconds"]),
              "promotion_cutoff_seconds": int(gate["promotionCutoffSeconds"]),
              "rollback_budget_seconds": int(gate["rollbackBudgetSeconds"]),
              "rollback_drill_max_age_seconds": int(gate["rollbackDrillMaxAgeSeconds"]),
          }
          if values != {
              "soft_budget_seconds": 600,
              "hard_fail_seconds": 1800,
              "promotion_cutoff_seconds": 1500,
              "rollback_budget_seconds": 300,
              "rollback_drill_max_age_seconds": 2592000,
          }:
              raise SystemExit(f"canonical release budget drift: {values}")
          for key, value in values.items():
              print(f"{key}={value}")
          PY
      - name: Login OCI release evidence registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: evidence
        name: Discover source tag and bind the exact Service Pipeline OCI candidate
        env:
          SOURCE_SHA: ${{ needs.service_pipeline.outputs.source_git_sha }}
          EXPECTED_RELEASE_REF: ${{ needs.service_pipeline.outputs.component_evidence_ref }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.service_pipeline.outputs.component_artifact_digest }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ needs.service_pipeline.outputs.producer_workflow_run_id }}
        run: |
          REPORT="$QWQ_OUTPUT_ROOT/env/repo/local/ci/process/release-evidence-fetch.json"
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest"
          mkdir -p "$(dirname "$REPORT")"
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --source-sha "$SOURCE_SHA" \
            --repository "${{ github.repository }}" \
            --output-dir "$ROOT" \
            > "$REPORT"
          DISCOVERED_REF="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci/process/release-evidence-fetch.json"
          payload = json.loads(report.read_text(encoding="utf-8"))
          print(payload["ref"])
          PY
          )"
          python3 quwoquan_ops/ci/verify_workflow_release_candidate.py \
            --manifest "$ROOT/manifest.json" \
            --expected-artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-repository "${{ github.repository }}" \
            --expected-release-ref "$EXPECTED_RELEASE_REF" \
            --discovered-release-ref "$DISCOVERED_REF" \
            --expect-component-ready
          echo "has_release_evidence=true" >> "$GITHUB_OUTPUT"
          echo "release_evidence_ref=$DISCOVERED_REF" >> "$GITHUB_OUTPUT"
      - name: Require canonical release evidence
        run: |
          test -s "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" || {
            echo "::error::02. Service Pipeline release evidence is required; local regeneration is forbidden"
            exit 1
          }
      - name: Materialize immutable App evidence OCI by exact digest
        env:
          APP_EVIDENCE_REF: ${{ needs.app_pipeline.outputs.app_evidence_ref }}
          APP_EVIDENCE_DIGEST: ${{ needs.app_pipeline.outputs.app_evidence_digest }}
          APP_SOURCE_SHA: ${{ needs.app_pipeline.outputs.source_git_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.service_pipeline.outputs.source_git_sha }}
        run: |
          if [[ ! "$APP_EVIDENCE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || \
             [[ "${APP_EVIDENCE_REF##*@}" != "$APP_EVIDENCE_DIGEST" ]]; then
            echo "::error::GATE_BLOCK: App evidence is not an exact immutable OCI ref"
            exit 2
          fi
          if [[ -z "$APP_SOURCE_SHA" || "$APP_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::GATE_BLOCK: App evidence source Git SHA differs from Service evidence"
            exit 2
          fi
          DEST="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/whole-candidate-sources/app"
          mkdir -p "$DEST"
          docker pull --platform linux/amd64 "$APP_EVIDENCE_REF"
          CID="$(docker create --platform linux/amd64 "$APP_EVIDENCE_REF")"
          cleanup() { docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker cp "$CID:/evidence/." "$DEST"
          SOURCE_TREE_DIGEST="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          print(manifest["source"]["treeDigest"])
          PY
          )"
          python3 quwoquan_ops/ci/render_release_application_package.py validate-bundle \
            --bundle-dir "$DEST" \
            --source-git-sha "$EXPECTED_SOURCE_SHA" \
            --source-tree-digest "$SOURCE_TREE_DIGEST"
      - name: Materialize immutable Delivery evidence OCI by exact digest
        env:
          DELIVERY_EVIDENCE_REF: ${{ needs.delivery_gate.outputs.delivery_evidence_ref }}
          DELIVERY_EVIDENCE_DIGEST: ${{ needs.delivery_gate.outputs.delivery_evidence_digest }}
          DELIVERY_SOURCE_SHA: ${{ needs.delivery_gate.outputs.source_git_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.service_pipeline.outputs.source_git_sha }}
        run: |
          if [[ ! "$DELIVERY_EVIDENCE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || \
             [[ "${DELIVERY_EVIDENCE_REF##*@}" != "$DELIVERY_EVIDENCE_DIGEST" ]]; then
            echo "::error::GATE_BLOCK: Delivery evidence is not an exact immutable OCI ref"
            exit 2
          fi
          if [[ "$DELIVERY_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::GATE_BLOCK: Delivery evidence source Git SHA differs from Service evidence"
            exit 2
          fi
          DEST="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/whole-candidate-sources/delivery"
          mkdir -p "$DEST"
          docker pull --platform linux/amd64 "$DELIVERY_EVIDENCE_REF"
          CID="$(docker create --platform linux/amd64 "$DELIVERY_EVIDENCE_REF")"
          cleanup() { docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker cp "$CID:/evidence/." "$DEST"
      - name: Fail closed when whole-candidate producers are incomplete
        run: |
          SOURCES="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/whole-candidate-sources"
          REQUIRED_SOURCES=(
            app/public-web-manifest.json
            app/android-release-manifest.json
            app/ops-portal-provenance.json
            delivery/provider-conformance-source.json
            delivery/test-evidence.json
          )
          for file in "${REQUIRED_SOURCES[@]}"; do
            if [[ ! -s "$SOURCES/$file" ]]; then
              echo "::error::GATE_BLOCK: real whole-candidate evidence is missing: $file"
              exit 2
            fi
          done
          if [[ ! -d "$SOURCES/app/application-packages" ]]; then
            echo "::error::GATE_BLOCK: four-environment application package evidence directory is missing"
            exit 2
          fi
          if [[ ! -d "$SOURCES/delivery/provider-raw" ]]; then
            echo "::error::GATE_BLOCK: raw Provider evidence archive is missing"
            exit 2
          fi
      - name: Seal candidate from component plus six real evidence classes
        env:
          APP_EVIDENCE_REF: ${{ needs.app_pipeline.outputs.app_evidence_ref }}
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest"
          SOURCES="$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/whole-candidate-sources"
          python3 quwoquan_ops/ci/render_provider_release_evidence.py \
            --component-manifest "$ROOT/manifest.json" \
            --contract-graph quwoquan_service/generated/contract_graph.json \
            --conformance-report "$SOURCES/delivery/provider-conformance-source.json" \
            --output "$SOURCES/delivery/provider-readiness.json"
          python3 quwoquan_ops/cli/stackctl.py package \
            --env prod \
            --target prod-hosted \
            --kind release-manifest \
            --release-artifact-dir "$ROOT" \
            --application-packages-dir "$SOURCES/app/application-packages" \
            --application-package-payloads-dir "$SOURCES/app/payloads" \
            --application-evidence-ref "oci://$APP_EVIDENCE_REF" \
            --public-web-manifest "$SOURCES/app/public-web-manifest.json" \
            --android-release-manifest "$SOURCES/app/android-release-manifest.json" \
            --ops-portal-provenance "$SOURCES/app/ops-portal-provenance.json" \
            --contract-graph quwoquan_service/generated/contract_graph.json \
            --provider-evidence "$SOURCES/delivery/provider-readiness.json" \
            --provider-raw-dir "$SOURCES/delivery/provider-raw" \
            --test-evidence "$SOURCES/delivery/test-evidence.json" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/mainline-seal-candidate"
      - id: candidate_identity
        name: Record sealed candidate and evidence snapshot separately
        env:
          EXPECTED_WORKFLOW_RUN_ID: ${{ needs.service_pipeline.outputs.producer_workflow_run_id }}
          EXPECTED_SOURCE_SHA: ${{ needs.service_pipeline.outputs.source_git_sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json").read_text(encoding="utf-8")
          )
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          candidate = str(manifest.get("candidateId") or "")
          artifact = str(manifest.get("artifactDigest") or "")
          source = manifest.get("source") or {}
          if manifest.get("status") != "candidate-ready":
              raise SystemExit("GATE_BLOCK: whole-candidate evidence did not seal candidate-ready")
          if digest.fullmatch(candidate) is None or digest.fullmatch(artifact) is None:
              raise SystemExit("GATE_BLOCK: candidateId/artifactDigest are not immutable")
          if source.get("workflowRunId") != os.environ["EXPECTED_WORKFLOW_RUN_ID"]:
              raise SystemExit("GATE_BLOCK: sealed candidate workflowRunId drift")
          if source.get("gitSha") != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("GATE_BLOCK: sealed candidate source Git SHA drift")
          print(f"candidate_digest={candidate}")
          print(f"artifact_digest={artifact}")
          PY
      - name: Setup Buildx for immutable candidate publication
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: candidate_bundle
        name: Publish sealed candidate evidence without moving the source discovery tag
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/local/ci-packages/process/service/release-evidence-manifest
          file: quwoquan_ops/cli/prod/release_artifact.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/release-artifact:candidate-${{ github.run_id }}
          sbom: true
          provenance: mode=max
      - id: candidate_bundle_ref
        name: Record exact immutable candidate OCI ref
        run: |
          REF="ghcr.io/${{ github.repository }}/release-artifact@${{ steps.candidate_bundle.outputs.digest }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Extract candidate release artifact SPDX SBOM
        run: |
          python3 quwoquan_ops/cli/prod/oci_supply_chain.py extract-sbom \
            --ref "${{ steps.candidate_bundle_ref.outputs.ref }}" \
            --output "$RUNNER_TEMP/candidate-release-artifact.spdx.json"
      - name: Sign candidate release artifact provenance with GitHub OIDC
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ghcr.io/${{ github.repository }}/release-artifact
          subject-digest: ${{ steps.candidate_bundle.outputs.digest }}
          push-to-registry: true
      - name: Sign candidate release artifact SBOM with GitHub OIDC
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ghcr.io/${{ github.repository }}/release-artifact
          subject-digest: ${{ steps.candidate_bundle.outputs.digest }}
          sbom-path: ${{ runner.temp }}/candidate-release-artifact.spdx.json
          push-to-registry: true
      - name: Verify candidate release artifact OIDC identity and closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 quwoquan_ops/cli/prod/oci_supply_chain.py verify \
            --ref "${{ steps.candidate_bundle_ref.outputs.ref }}" \
            --repository "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/deploy-prod-auto.yml" \
            --source-digest "${{ needs.service_pipeline.outputs.source_git_sha }}"
      - name: Require reviewed PR release governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/verify_release_governance.py \
            --repository "${{ github.repository }}" \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json" \
            --minimum-approvals 1 \
            --output "$QWQ_OUTPUT_ROOT/env/repo/local/ci-packages/process/service/release-evidence-manifest/governance-receipt.json"
      - name: Materialize hosted service-plane SSH credential
        env:
          KEY_MATERIAL: ${{ secrets.PROD_SERVICE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_MATERIAL" || "$KEY_MATERIAL" != *"PRIVATE KEY"* ]]; then
            echo "::error::GATE_BLOCK: PROD_SERVICE_SSH_KEY is missing or is not private-key material"
            exit 2
          fi
          KEY_FILE="$RUNNER_TEMP/prod-service-ssh-key"
          (umask 077 && printf '%s\n' "$KEY_MATERIAL" > "$KEY_FILE")
          chmod 600 "$KEY_FILE"
          echo "PROD_SERVICE_SSH_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Resolve rollout inputs
        id: inputs
        run: |
          CLOUD_PROVIDER="${{ github.event.inputs.cloud_provider }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [[ -z "$CLOUD_PROVIDER" ]]; then CLOUD_PROVIDER="aliyun"; fi
          if [[ -z "$DRY_RUN" ]]; then DRY_RUN="true"; fi
          if [[ "$DRY_RUN" != "true" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "::error::GATE_BLOCK: real Prod apply requires explicit workflow_dispatch"
            exit 2
          fi
          CANDIDATE_DIGEST="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest_path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/local/ci-packages/process/service/release-evidence-manifest/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          candidate = str(manifest["candidateId"])
          print(candidate)
          PY
          )"
          HOSTED_READBACK="$RUNNER_TEMP/prod-hosted-release-readback.json"
          eval "$(python3 quwoquan_ops/cli/prod/resolve_prod_release_state.py \
            --to-candidate-digest "$CANDIDATE_DIGEST" \
            --readback-output "$HOSTED_READBACK" \
            --output-format shell)"
          FROM_CANDIDATE_DIGEST="$RESOLVED_FROM_CANDIDATE_DIGEST"
          if [[ -z "$FROM_CANDIDATE_DIGEST" ]] || \
             [[ "$RESOLVED_HOSTED_AUTHORITY" != "prod-hosted-service-plane" ]] || \
             [[ ! "$RESOLVED_RESUME_STAGE" =~ ^(canary|5|20|50|100|complete)$ ]]; then
            echo "::error::GATE_BLOCK: hosted ledger did not resolve canonical candidate recovery state"
            exit 2
          fi
          EXISTING_RELEASE_EVIDENCE_REF="$(python3 - "$HOSTED_READBACK" "$CANDIDATE_DIGEST" <<'PY'
          import json
          import re
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          state = payload["state"]
          candidate = sys.argv[2]
          if state["to_candidate_digest"] == candidate:
              ref = str(state["to_release_evidence_ref"])
          elif (
              state["decision"] == "rolled_back"
              and state["from_candidate_digest"] == candidate
          ):
              ref = str(state["from_release_evidence_ref"])
          else:
              print("")
              raise SystemExit(0)
          if re.fullmatch(r"ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}", ref) is None:
              raise SystemExit("GATE_BLOCK: hosted target release evidence ref is invalid")
          print(ref)
          PY
          )"
          {
            echo "from_candidate_digest=$FROM_CANDIDATE_DIGEST"
            echo "resume_stage=$RESOLVED_RESUME_STAGE"
            echo "existing_release_evidence_ref=$EXISTING_RELEASE_EVIDENCE_REF"
            echo "cloud_provider=$CLOUD_PROVIDER"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
      - name: Parse canonical rollout stages
        id: stages
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          payload = yaml.safe_load(
              Path("quwoquan_ops/environments/prod/rollout/stages.yaml").read_text(
                  encoding="utf-8"
              )
          )
          stages = {item["name"]: int(item["step"]) for item in payload["stages"]}
          if stages != {"canary": 0, "5": 5, "20": 20, "50": 50, "100": 100}:
              raise SystemExit(f"invalid canonical rollout stages: {stages}")
          print(f"canary_step={stages['canary']}")
          print(f"percent_5_step={stages['5']}")
          print(f"percent_20_step={stages['20']}")
          print(f"percent_50_step={stages['50']}")
          print(f"percent_100_step={stages['100']}")
          PY
      - id: finish
        if: always()
        name: Finish prepare timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  delivery_gate:
    name: Delivery Gate (mainline)
    needs: [source_context, service_pipeline]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/delivery-gate.yml
    with:
      checkout_ref: ${{ needs.source_context.outputs.source_git_sha }}
      base_sha: ${{ needs.source_context.outputs.base_sha }}
      head_sha: ${{ needs.source_context.outputs.source_git_sha }}
      produce_release_evidence: true
      provider_evidence_ref: ${{ inputs.provider_evidence_ref || vars.PROD_PROVIDER_EVIDENCE_REF }}
      provider_evidence_digest: ${{ inputs.provider_evidence_digest || vars.PROD_PROVIDER_EVIDENCE_DIGEST }}
      provider_candidate_image_digest: ${{ inputs.provider_candidate_image_digest || vars.PROD_PROVIDER_CANDIDATE_IMAGE_DIGEST }}
      provider_component_evidence_ref: ${{ needs.service_pipeline.outputs.component_evidence_ref }}
      user_acceptance_evidence_ref: ${{ vars.RELEASE_USER_ACCEPTANCE_EVIDENCE_REF }}
      user_acceptance_evidence_digest: ${{ vars.RELEASE_USER_ACCEPTANCE_EVIDENCE_DIGEST }}
    secrets: inherit

  ai_ci_shadow:
    name: AI CI shadow advisory (read-only)
    needs: [source_context, service_pipeline, app_pipeline, delivery_gate]
    if: ${{ always() && needs.source_context.result == 'success' && vars.AI_CI_SHADOW_ENDPOINT != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.source_context.outputs.source_git_sha }}
      - name: Materialize structured upstream evidence without credentials
        env:
          SERVICE_RESULT: ${{ needs.service_pipeline.result }}
          SERVICE_SECONDS: ${{ needs.service_pipeline.outputs.machine_critical_path_seconds }}
          APP_RESULT: ${{ needs.app_pipeline.result }}
          APP_SECONDS: ${{ needs.app_pipeline.outputs.machine_critical_path_seconds }}
          DELIVERY_RESULT: ${{ needs.delivery_gate.result }}
          DELIVERY_SECONDS: ${{ needs.delivery_gate.outputs.machine_critical_path_seconds }}
        run: |
          mkdir -p "$QWQ_OUTPUT_ROOT/env/repo/runs/ai-ci-shadow"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          jobs = []
          for name, result_key, seconds_key in (
              ("service_pipeline", "SERVICE_RESULT", "SERVICE_SECONDS"),
              ("app_pipeline", "APP_RESULT", "APP_SECONDS"),
              ("delivery_gate", "DELIVERY_RESULT", "DELIVERY_SECONDS"),
          ):
              raw_seconds = os.environ.get(seconds_key, "").strip()
              jobs.append(
                  {
                      "job": name,
                      "status": os.environ.get(result_key, "").strip(),
                      "machineCriticalPathSeconds": (
                          int(raw_seconds) if raw_seconds.isdigit() else None
                      ),
                  }
              )
          path = Path(os.environ["QWQ_OUTPUT_ROOT"]) / "env/repo/runs/ai-ci-shadow/source.json"
          path.write_text(
              json.dumps({"jobs": jobs}, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Run isolated AI advisory shadow
        env:
          AI_CI_SHADOW_ENDPOINT: ${{ vars.AI_CI_SHADOW_ENDPOINT }}
          AI_CI_SHADOW_TOKEN: ${{ secrets.AI_CI_SHADOW_TOKEN }}
        run: |
          python3 quwoquan_ops/ci/run_ai_ci_shadow.py \
            --source "$QWQ_OUTPUT_ROOT/env/repo/runs/ai-ci-shadow/source.json" \
            --source-ref-prefix "github-actions://${{ github.repository }}/runs/${{ github.run_id }}/jobs/mainline-upstream" \
            --source-git-sha "${{ needs.source_context.outputs.source_git_sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --endpoint "$AI_CI_SHADOW_ENDPOINT" \
            --output "$QWQ_OUTPUT_ROOT/env/repo/runs/ai-ci-shadow/ai-ci-advisory.json"
      - name: Upload read-only advisory evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-ci-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/ai-ci-shadow/ai-ci-advisory.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

  alpha_local:
    name: Alpha local stage
    needs: [prepare, delivery_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      receipt_ref: ${{ steps.receipt_bundle_ref.outputs.ref }}
      receipt_digest: ${{ steps.receipt_bundle.outputs.digest }}
    steps:
      - id: start
        name: Start timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Login immutable candidate registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize and bind exact Alpha candidate
        env:
          EXPECTED_RELEASE_REF: ${{ needs.prepare.outputs.release_evidence_ref }}
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate_digest }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ needs.prepare.outputs.service_pipeline_run_id }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: |
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/local/mainline-alpha/process/release-evidence-manifest"
          python3 quwoquan_ops/cli/prod/fetch_mainline_release_artifact.py \
            --ref "$EXPECTED_RELEASE_REF" \
            --output-dir "$ROOT"
          python3 quwoquan_ops/ci/verify_workflow_release_candidate.py \
            --manifest "$ROOT/manifest.json" \
            --expected-candidate "$EXPECTED_CANDIDATE" \
            --expected-artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-repository "${{ github.repository }}" \
            --expected-release-ref "$EXPECTED_RELEASE_REF"
          echo "QWQ_PROD_RELEASE_ARTIFACT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Package alpha environment
        run: |
          python3 quwoquan_ops/cli/stackctl.py package \
            --env alpha \
            --include-services \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-package"
      - name: Bring up alpha-local
        run: |
          python3 quwoquan_ops/cli/stackctl.py up \
            --target alpha-local \
            --formal-release \
            --release-manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --skip-build \
            --skip-app \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-up"
      - name: Alpha full health
        run: |
          python3 quwoquan_ops/cli/stackctl.py health \
            --target alpha-local \
            --scope full \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-health"
      - name: Verify alpha release-fast contracts
        run: |
          python3 quwoquan_ops/cli/stackctl.py verify \
            --env alpha \
            --target alpha-local \
            --kind all \
            --profile smoke \
            --reuse-package \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-verify"
      - id: receipt
        name: Seal Alpha environment receipt from raw stackctl evidence
        run: |
          RECEIPT="$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-receipt"
          mkdir -p "$RECEIPT"
          python3 quwoquan_ops/ci/render_environment_release_receipt.py \
            --manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --environment alpha \
            --evidence "package=$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-package/report.json" \
            --evidence "up=$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-up/report.json" \
            --evidence "health=$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-health/report.json" \
            --evidence "verify=$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-verify/report.json" \
            --evidence "pilot-release=$QWQ_PROD_RELEASE_ARTIFACT_ROOT/evidence/release/pilot-release-attestation.json" \
            --evidence "pilot-rollback=$QWQ_PROD_RELEASE_ARTIFACT_ROOT/evidence/release/pilot-rollback-attestation.json" \
            --evidence "content-lifecycle=$QWQ_PROD_RELEASE_ARTIFACT_ROOT/evidence/release/lifecycle-exit-alpha.json" \
            --require-evidence package \
            --require-evidence up \
            --require-evidence health \
            --require-evidence verify \
            --require-evidence pilot-release \
            --require-evidence pilot-rollback \
            --require-evidence content-lifecycle \
            --archive-prefix evidence/raw/environments/alpha/raw \
            --output "$RECEIPT/alpha.json"
      - name: Setup Buildx for Alpha evidence
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: receipt_bundle
        name: Publish immutable Alpha environment evidence OCI
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/alpha/runs/mainline-receipt
          file: quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/environment-evidence:alpha-${{ github.run_id }}
          sbom: true
          provenance: mode=max
      - id: receipt_bundle_ref
        name: Record exact Alpha environment evidence ref
        run: |
          echo "ref=ghcr.io/${{ github.repository }}/environment-evidence@${{ steps.receipt_bundle.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Alpha inspect
        if: always()
        run: |
          python3 quwoquan_ops/cli/stackctl.py inspect \
            --target alpha-local \
            --scope all \
            --report-dir "$QWQ_OUTPUT_ROOT/env/alpha/runs/mainline-inspect"
      - name: Upload alpha stackctl artifacts
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainline-auto-prod-alpha
          path: |
            ${{ env.QWQ_OUTPUT_ROOT }}/env/alpha/runs/**/summary.json
            ${{ env.QWQ_OUTPUT_ROOT }}/env/alpha/runs/**/report.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - id: finish
        if: always()
        name: Finish timer
        run: |
          echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

