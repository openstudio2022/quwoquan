# Manual producer for executed Provider evidence. The production environment
# approval protects real Prod Remote health/switch/rollback assertions. This
# workflow never publishes source-only conformance metadata as release evidence.
name: 06. Provider Release Evidence

on:
  workflow_dispatch:
    inputs:
      release_evidence_ref:
        description: Single exact immutable released ReleaseEvidenceManifest OCI ref
        required: false
        default: ''

concurrency:
  group: provider-release-evidence
  cancel-in-progress: false

permissions:
  contents: read
  attestations: read
  packages: read

jobs:
  provider_release_evidence:
    name: Execute and publish Provider release evidence
    runs-on: [self-hosted, macOS, ARM64]
    environment: production
    timeout-minutes: 240
    permissions:
      contents: read
      attestations: read
      packages: write
    outputs:
      evidence_ref: ${{ steps.identity.outputs.ref }}
      evidence_digest: ${{ steps.bundle.outputs.digest }}
      expected_image_digest: ${{ steps.package.outputs.expected_image_digest }}
      evidence_count: ${{ steps.package.outputs.evidence_count }}
    env:
      QWQ_PROVIDER_CONFORMANCE_ATTESTATION_KEY: ${{ secrets.QWQ_PROVIDER_CONFORMANCE_ATTESTATION_KEY }}
      QWQ_PROVIDER_CONFORMANCE_ATTESTATION_AUTHORITY: ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Initialize runner-local Provider output root
        run: echo "QWQ_OUTPUT_ROOT=$RUNNER_TEMP/quwoquan-provider-${{ github.run_id }}-${{ github.run_attempt }}/.qwq_output" >> "$GITHUB_ENV"
      - id: pointer
        name: Resolve the only allowed release pointer
        env:
          INPUT_RELEASE_REF: ${{ inputs.release_evidence_ref }}
          STABLE_RELEASE_REF: ${{ vars.RELEASED_RELEASE_EVIDENCE_REF }}
        run: |
          RELEASE_REF="${INPUT_RELEASE_REF:-$STABLE_RELEASE_REF}"
          if [[ -z "$RELEASE_REF" ]]; then
            echo "::error::GATE_BLOCK: release_evidence_ref and RELEASED_RELEASE_EVIDENCE_REF are both empty"
            exit 2
          fi
          echo "ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"
      - name: Login immutable evidence registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx for release evidence verification
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: release
        name: Verify released manifest, OIDC and artifact closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 quwoquan_ops/ci/consume_released_release_evidence.py \
            --ref "${{ steps.pointer.outputs.ref }}" \
            --repository "${{ github.repository }}" \
            --require-status released \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/release" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.source_git_sha }}
          persist-credentials: false
      - name: Require manifest-derived reviewed main source and authority
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if [[ "$SOURCE_SHA" != "${{ steps.release.outputs.source_git_sha }}" ]] || \
             [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::GATE_BLOCK: released source must be an exact commit reachable from main"
            exit 2
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::GATE_BLOCK: Provider evidence source checkout must be clean"
            exit 2
          fi
          if [[ -z "$QWQ_PROVIDER_CONFORMANCE_ATTESTATION_KEY" ]]; then
            echo "::error::GATE_BLOCK: QWQ_PROVIDER_CONFORMANCE_ATTESTATION_KEY is required"
            exit 2
          fi
          echo "QWQ_PROVIDER_CONFORMANCE_REVIEWED_COMMIT=$SOURCE_SHA" >> "$GITHUB_ENV"
      - id: candidate
        name: Bind Provider execution to the released image set
        run: |
          python3 quwoquan_ops/ci/provider_release_evidence.py identity \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/release/manifest.json" \
            --release-evidence-ref "${{ steps.release.outputs.release_evidence_ref }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Execute all compiled required nonprod Provider cells
        run: |
          python3 quwoquan_ops/ci/provider_release_evidence.py execute-nonprod \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/release/manifest.json" \
            --release-evidence-ref "${{ steps.release.outputs.release_evidence_ref }}" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/nonprod-provider"
      - name: Execute real Prod Remote Provider release cells
        run: |
          python3 quwoquan_ops/ci/provider_release_evidence.py execute-prod \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/release/manifest.json" \
            --release-evidence-ref "${{ steps.release.outputs.release_evidence_ref }}" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/prod/runs/provider-release"
      - id: package
        name: Package only validated executed Provider evidence
        run: |
          python3 quwoquan_ops/ci/provider_release_evidence.py package \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/release/manifest.json" \
            --release-evidence-ref "${{ steps.release.outputs.release_evidence_ref }}" \
            --release-root "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/release" \
            --output-dir "$QWQ_OUTPUT_ROOT/env/repo/runs/provider-release/oci" \
            --github-output "$GITHUB_OUTPUT"
      - id: bundle
        name: Publish executed Provider evidence OCI
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/repo/runs/provider-release/oci
          file: ${{ github.workspace }}/quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/provider-evidence:${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: identity
        name: Record exact executed Provider evidence ref
        run: |
          set -euo pipefail
          DIGEST="${{ steps.bundle.outputs.digest }}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          REF="ghcr.io/${{ github.repository }}/provider-evidence@$DIGEST"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          {
            echo "## Executed Provider release evidence"
            echo "- ref: \`$REF\`"
            echo "- release candidate: \`${{ steps.release.outputs.candidate_digest }}\`"
            echo "- release evidence: \`${{ steps.release.outputs.release_evidence_ref }}\`"
            echo "- candidate image digest: \`${{ steps.package.outputs.expected_image_digest }}\`"
            echo "- executed evidence files: \`${{ steps.package.outputs.evidence_count }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
