# Self-hosted mobile validation: one host-bound Beta stack, two explicit device jobs,
# one receipt aggregator, then one standalone teardown. Formal Beta consumes the
# same exact OCI candidate as Alpha/Gamma and never enters the source-build path.
name: 05. App Env Device Matrix

permissions:
  contents: read
  attestations: read
  packages: read

env:
  QWQ_OUTPUT_ROOT: ${{ github.workspace }}/.qwq_output

on:
  schedule:
    - cron: '0 18 * * *'
  pull_request:
    branches:
      - dev1.0
      - main
  workflow_dispatch:
    inputs:
      validation_profile:
        description: '验证 profile：pr_light / manual_full / nightly_full / release_candidate / mainline_auto_prod'
        required: false
        default: pr_light
        type: choice
        options:
          - pr_light
          - manual_full
          - nightly_full
          - release_candidate
          - mainline_auto_prod
      env_json:
        description: '矩阵环境 JSON 数组，例如 ["alpha","beta","gamma"] 或 ["gamma"]'
        required: false
        default: ''
      allow_missing_platforms:
        description: '缺席平台是否允许跳过（留空则按 profile 决定）'
        required: false
        default: ''
        type: string
      matrix_kind:
        description: assistant / chat-avatar / environment-smoke / app-core-readback / media-publication / user-profile / account-closure / JSON 数组
        required: false
        default: ''
      release_evidence_ref:
        description: 'Single exact immutable ReleaseEvidenceManifest OCI ref'
        required: false
        default: ''
      account_closure_disposable_ack:
        description: '仅 Prod 一次性账号注销：确认凭据对应账号允许永久注销'
        required: false
        default: false
        type: boolean
      account_closure_prod_platform:
        description: 'Prod 一次性注销证据设备平台'
        required: false
        default: ios
        type: choice
        options: [ios, android]
      account_closure_prod_device_id:
        description: 'Prod 一次性注销证据的唯一 Flutter device id'
        required: false
        default: ''
  workflow_call:
    inputs:
      checkout_ref:
        description: Caller commit SHA/ref for checkout
        required: false
        type: string
        default: ''
      validation_profile:
        description: 'pr_light / manual_full / nightly_full / release_candidate / mainline_auto_prod'
        required: false
        type: string
        default: pr_light
      env_json:
        description: 'JSON array of environments (overrides profile default)'
        required: false
        type: string
        default: ''
      allow_missing_platforms:
        description: '是否允许缺席平台跳过 (overrides profile default)'
        required: false
        type: string
        default: ''
      matrix_kind:
        description: 'Matrix kind or JSON array (overrides profile default)'
        required: false
        type: string
        default: ''
      account_closure_disposable_ack:
        description: 'Acknowledge irreversible closure of the injected disposable Prod account'
        required: false
        type: boolean
        default: false
      account_closure_prod_platform:
        description: 'Single mobile platform for destructive Prod account closure evidence'
        required: false
        type: string
        default: ios
      account_closure_prod_device_id:
        description: 'Single Flutter device id for destructive Prod account closure evidence'
        required: false
        type: string
        default: ''
      release_evidence_ref:
        description: Single exact immutable ReleaseEvidenceManifest OCI ref
        required: true
        type: string
    outputs:
      discover_duration_seconds:
        description: Host/profile prerequisite duration
        value: ${{ jobs.beta_stack.outputs.duration_seconds }}
      mobile_duration_seconds:
        description: Dual-platform aggregation duration
        value: ${{ jobs.mobile_matrix.outputs.duration_seconds }}
      android_result:
        description: Android matrix result
        value: ${{ jobs.mobile_matrix.outputs.android_result }}
      ios_result:
        description: iOS matrix result
        value: ${{ jobs.mobile_matrix.outputs.ios_result }}
      allow_missing_platforms:
        description: Whether the selected profile allows a missing platform
        value: ${{ jobs.beta_stack.outputs.allow_missing_platforms }}
      has_android:
        description: Android is a required dedicated runner capability
        value: ${{ jobs.beta_stack.outputs.has_android }}
      has_ios:
        description: iOS is a required dedicated runner capability
        value: ${{ jobs.beta_stack.outputs.has_ios }}
      machine_critical_path_seconds:
        description: Official GitHub DAG diagnostic duration
        value: ${{ jobs.app_env_device_matrix_summary.outputs.machine_critical_path_seconds }}
      summary_result:
        description: Summary gate result
        value: ${{ jobs.app_env_device_matrix_summary.outputs.summary_result }}
      receipt_ref:
        description: Exact immutable Beta environment evidence OCI ref
        value: ${{ jobs.mobile_matrix.outputs.receipt_ref }}
      receipt_digest:
        description: Beta environment evidence OCI transport digest
        value: ${{ jobs.mobile_matrix.outputs.receipt_digest }}

concurrency:
  group: app-env-device-matrix-beta-stack
  cancel-in-progress: false

jobs:
  resolve_release_evidence:
    name: Resolve one canonical release evidence reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read
      packages: read
    outputs:
      profile: ${{ steps.inputs.outputs.profile }}
      release_evidence_ref: ${{ steps.inputs.outputs.release_evidence_ref }}
      required_status: ${{ steps.inputs.outputs.required_status }}
      checkout_ref: ${{ steps.release.outputs.source_git_sha || steps.inputs.outputs.checkout_ref }}
      candidate_digest: ${{ steps.release.outputs.candidate_digest }}
      artifact_digest: ${{ steps.release.outputs.artifact_digest }}
      producer_workflow_run_id: ${{ steps.release.outputs.producer_workflow_run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - id: inputs
        name: Resolve profile and the only allowed release pointer
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROFILE: ${{ inputs.validation_profile }}
          INPUT_RELEASE_REF: ${{ inputs.release_evidence_ref }}
          INPUT_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          SCHEDULE_RELEASE_REF: ${{ vars.RELEASED_RELEASE_EVIDENCE_REF }}
        run: |
          set -euo pipefail
          PROFILE="${INPUT_PROFILE:-pr_light}"
          if [[ "$EVENT_NAME" == pull_request ]]; then PROFILE=pr_light; fi
          if [[ "$EVENT_NAME" == schedule ]]; then PROFILE=nightly_full; fi
          case "$PROFILE" in
            pr_light)
              RELEASE_REF=""
              REQUIRED_STATUS=""
              CHECKOUT_REF="${INPUT_CHECKOUT_REF:-${{ github.sha }}}"
              ;;
            mainline_auto_prod|release_candidate)
              RELEASE_REF="$INPUT_RELEASE_REF"
              REQUIRED_STATUS=candidate-ready
              CHECKOUT_REF=""
              ;;
            manual_full|nightly_full)
              RELEASE_REF="$INPUT_RELEASE_REF"
              if [[ "$EVENT_NAME" == schedule ]]; then
                RELEASE_REF="$SCHEDULE_RELEASE_REF"
              fi
              REQUIRED_STATUS=released
              CHECKOUT_REF=""
              ;;
            *)
              echo "::error::GATE_BLOCK: unsupported validation profile"
              exit 2
              ;;
          esac
          if [[ "$PROFILE" != pr_light && -z "$RELEASE_REF" ]]; then
            echo "::error::GATE_BLOCK: full validation requires one immutable release_evidence_ref"
            exit 2
          fi
          {
            echo "profile=$PROFILE"
            echo "release_evidence_ref=$RELEASE_REF"
            echo "required_status=$REQUIRED_STATUS"
            echo "checkout_ref=$CHECKOUT_REF"
          } >> "$GITHUB_OUTPUT"
      - name: Login immutable release evidence registry
        if: ${{ steps.inputs.outputs.release_evidence_ref != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx for release evidence verification
        if: ${{ steps.inputs.outputs.release_evidence_ref != '' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: release
        name: Verify OIDC, manifest and complete artifact closure
        if: ${{ steps.inputs.outputs.release_evidence_ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 quwoquan_ops/ci/consume_released_release_evidence.py \
            --ref "${{ steps.inputs.outputs.release_evidence_ref }}" \
            --repository "${{ github.repository }}" \
            --require-status "${{ steps.inputs.outputs.required_status }}" \
            --output-dir "$RUNNER_TEMP/release-evidence" \
            --github-output "$GITHUB_OUTPUT"

  beta_stack:
    name: Prepare one Beta stack prerequisite
    needs: resolve_release_evidence
    if: ${{ github.event_name != 'pull_request' || vars.ENABLE_SELF_HOSTED_MOBILE_MATRIX == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.validation_profile == 'manual_full' || inputs.validation_profile == 'nightly_full' || inputs.validation_profile == 'release_candidate') && 20 || 2 }}
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      profile: ${{ steps.defaults.outputs.profile }}
      env_json: ${{ steps.defaults.outputs.env_json }}
      allow_missing_platforms: ${{ steps.defaults.outputs.allow_missing_platforms }}
      matrix_kind: ${{ steps.defaults.outputs.matrix_kind }}
      artifact_key: ${{ steps.defaults.outputs.artifact_key }}
      has_android: ${{ steps.defaults.outputs.has_android }}
      has_ios: ${{ steps.defaults.outputs.has_ios }}
      host_digest: ${{ steps.host.outputs.host_digest }}
      stack_ref: ${{ steps.stack_ref.outputs.ref }}
      stack_digest: ${{ steps.stack_bundle.outputs.digest }}
      formal_runtime_started: ${{ steps.formal_runtime.outputs.started }}
      managed_runtime_started: ${{ steps.managed_runtime.outputs.started }}
      release_evidence_ref: ${{ needs.resolve_release_evidence.outputs.release_evidence_ref }}
      source_git_sha: ${{ needs.resolve_release_evidence.outputs.checkout_ref }}
      candidate_digest: ${{ steps.release.outputs.candidate_digest }}
      artifact_digest: ${{ steps.release.outputs.artifact_digest }}
      producer_workflow_run_id: ${{ steps.release.outputs.producer_workflow_run_id }}
    env:
      STACK_REPO_DIR: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/stack
      STACKCTL_AUTO_WIPE_MIGRATION_DRIFT: "0"
    steps:
      - id: start
        name: Start prerequisite timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.resolve_release_evidence.outputs.checkout_ref }}
          path: .qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/stack
          clean: false
          persist-credentials: false
      - name: Require exact clean candidate checkout
        working-directory: ${{ env.STACK_REPO_DIR }}
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="${{ needs.resolve_release_evidence.outputs.checkout_ref }}"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
      - id: defaults
        name: Resolve validation profile without discovering devices centrally
        working-directory: ${{ env.STACK_REPO_DIR }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROFILE: ${{ inputs.validation_profile }}
          INPUT_ENV_JSON: ${{ inputs.env_json }}
          INPUT_ALLOW_MISSING: ${{ inputs.allow_missing_platforms }}
          INPUT_MATRIX_KIND: ${{ inputs.matrix_kind }}
        run: |
          set -euo pipefail
          PROFILE="${INPUT_PROFILE:-pr_light}"
          if [ "$EVENT_NAME" = "pull_request" ]; then PROFILE="pr_light"; fi
          if [ "$EVENT_NAME" = "schedule" ]; then PROFILE="nightly_full"; fi
          PROFILE_JSON="$RUNNER_TEMP/mobile-profile-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python3 quwoquan_ops/ci/resolve_gamma_validation_profile.py \
            --profile "$PROFILE" \
            --github-output "$RUNNER_TEMP/profile-output" > "$PROFILE_JSON"
          DEFAULT_ENV_JSON="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["device_envs"], separators=(",",":")))' "$PROFILE_JSON")"
          DEFAULT_ALLOW="$(python3 -c 'import json,sys; print("true" if json.load(open(sys.argv[1])).get("allow_missing_platforms") else "false")' "$PROFILE_JSON")"
          DEFAULT_KINDS="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])).get("matrix_kinds") or ["assistant"], separators=(",",":")))' "$PROFILE_JSON")"
          ENV_JSON="${INPUT_ENV_JSON:-$DEFAULT_ENV_JSON}"
          ALLOW_MISSING="${INPUT_ALLOW_MISSING:-$DEFAULT_ALLOW}"
          MATRIX_KIND="${INPUT_MATRIX_KIND:-$DEFAULT_KINDS}"
          ARTIFACT_KEY="$(MATRIX_KIND_VALUE="$MATRIX_KIND" python3 -c 'import json,os,re; raw=os.environ["MATRIX_KIND_VALUE"].strip(); items=json.loads(raw) if raw.startswith("[") else raw.split(","); print(re.sub(r"[^a-zA-Z0-9._-]+", "-", str(items[0]).strip()) if len(items)==1 else "multi-kind")')"
          {
            echo "profile=$PROFILE"
            echo "env_json=$ENV_JSON"
            echo "allow_missing_platforms=$ALLOW_MISSING"
            echo "matrix_kind=$MATRIX_KIND"
            echo "artifact_key=$ARTIFACT_KEY"
            echo "has_android=true"
            echo "has_ios=true"
          } >> "$GITHUB_OUTPUT"
      - id: host
        name: Bind the stack prerequisite to one physical Mac
        working-directory: ${{ env.STACK_REPO_DIR }}
        run: python3 quwoquan_ops/ci/device_runner_lease.py host --github-output "$GITHUB_OUTPUT"
      - name: Login immutable candidate registry
        if: ${{ steps.defaults.outputs.profile != 'pr_light' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx for release evidence verification
        if: ${{ steps.defaults.outputs.profile != 'pr_light' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: release
        name: Derive exact candidate and release closure
        if: ${{ steps.defaults.outputs.profile != 'pr_light' }}
        working-directory: ${{ env.STACK_REPO_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/runs/beta-stack/release-evidence-manifest"
          python3 quwoquan_ops/ci/consume_released_release_evidence.py \
            --ref "${{ needs.resolve_release_evidence.outputs.release_evidence_ref }}" \
            --repository "${{ github.repository }}" \
            --require-status "${{ needs.resolve_release_evidence.outputs.required_status }}" \
            --expected-source-sha "${{ needs.resolve_release_evidence.outputs.checkout_ref }}" \
            --output-dir "$ROOT" \
            --github-output "$GITHUB_OUTPUT"
          echo "QWQ_PROD_RELEASE_ARTIFACT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Export manifest-bound pilot attestation paths
        if: ${{ steps.defaults.outputs.profile != 'pr_light' }}
        run: |
          {
            echo "QWQ_RELEASE_ATTESTATION=${{ steps.release.outputs.pilot_release_path }}"
            echo "QWQ_ROLLBACK_RELEASE_ATTESTATION=${{ steps.release.outputs.pilot_rollback_path }}"
          } >> "$GITHUB_ENV"
      - id: formal_runtime
        name: Run immutable Beta formal runtime
        if: ${{ steps.defaults.outputs.profile == 'mainline_auto_prod' }}
        working-directory: ${{ env.STACK_REPO_DIR }}
        run: |
          set -euo pipefail
          ROOT="$QWQ_OUTPUT_ROOT/env/beta/runs/formal-runtime"
          mkdir -p "$ROOT"
          echo "started=true" >> "$GITHUB_OUTPUT"
          python3 quwoquan_ops/cli/stackctl.py package \
            --env beta \
            --include-services \
            --report-dir "$ROOT/package"
          cp "$ROOT/package/report.json" "$ROOT/package.json"
          python3 quwoquan_ops/cli/stackctl.py up \
            --target beta-local \
            --formal-release \
            --release-manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --skip-build \
            --skip-app \
            --report-dir "$ROOT/up"
          cp "$ROOT/up/report.json" "$ROOT/up.json"
          python3 quwoquan_ops/cli/stackctl.py health \
            --target beta-local \
            --scope full \
            --report-dir "$ROOT/health"
          cp "$ROOT/health/report.json" "$ROOT/health.json"
          python3 quwoquan_ops/cli/stackctl.py verify \
            --env beta \
            --target beta-local \
            --kind all \
            --profile release \
            --reuse-package \
            --report-dir "$ROOT/verify"
          cp "$ROOT/verify/report.json" "$ROOT/verify.json"
      - name: Verify nightly runtime release matches candidate
        if: ${{ steps.defaults.outputs.profile == 'nightly_full' }}
        working-directory: ${{ env.STACK_REPO_DIR }}
        run: |
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py verify-release-binding \
            --manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --release-attestation "$QWQ_RELEASE_ATTESTATION"
      - id: managed_runtime
        name: Start stackctl-managed Gamma full runtime
        if: ${{ steps.defaults.outputs.profile == 'manual_full' || steps.defaults.outputs.profile == 'nightly_full' || steps.defaults.outputs.profile == 'release_candidate' }}
        working-directory: ${{ env.STACK_REPO_DIR }}
        run: |
          set -euo pipefail
          for attestation in "$QWQ_RELEASE_ATTESTATION" "$QWQ_ROLLBACK_RELEASE_ATTESTATION"; do
            if [[ -z "$attestation" || ! -s "$attestation" ]]; then
              echo "::error::GATE_BLOCK: canonical release closure is missing pilot attestations"
              exit 2
            fi
          done
          ROOT="$QWQ_OUTPUT_ROOT/env/gamma/runs/device-matrix-runtime"
          python3 quwoquan_ops/cli/stackctl.py dev-session \
            --env gamma \
            --release-attestation "$QWQ_RELEASE_ATTESTATION" \
            --rollback-release-attestation "$QWQ_ROLLBACK_RELEASE_ATTESTATION" \
            --report-dir "$ROOT/dev-session"
          SESSION_KIND="$(python3 -c 'import json,sys; payload=json.load(open(sys.argv[1])); sessions=payload.get("sessions") or []; print((sessions[0] if sessions else {}).get("sessionKind") or "")' "$ROOT/dev-session/report.json")"
          case "$SESSION_KIND" in
            cold) echo "started=true" >> "$GITHUB_OUTPUT" ;;
            hot) echo "started=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::GATE_BLOCK: dev-session did not record cold/hot runtime ownership"; exit 2 ;;
          esac
      - name: Inspect and doctor the managed Gamma runtime before soak
        if: ${{ steps.defaults.outputs.profile == 'manual_full' || steps.defaults.outputs.profile == 'nightly_full' || steps.defaults.outputs.profile == 'release_candidate' }}
        working-directory: ${{ env.STACK_REPO_DIR }}
        run: |
          set -euo pipefail
          ROOT="$QWQ_OUTPUT_ROOT/env/gamma/runs/device-matrix-runtime"
          python3 quwoquan_ops/cli/stackctl.py inspect \
            --target gamma-local \
            --scope all \
            --report-dir "$ROOT/startup-inspect"
          python3 quwoquan_ops/cli/stackctl.py doctor \
            --target gamma-local \
            --report-dir "$ROOT/startup-doctor"
      - name: Seal immutable Beta stack evidence
        if: ${{ steps.defaults.outputs.profile == 'mainline_auto_prod' }}
        working-directory: ${{ env.STACK_REPO_DIR }}
        run: |
          python3 quwoquan_ops/ci/render_beta_device_evidence.py stack \
            --manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --host-digest "${{ steps.host.outputs.host_digest }}" \
            --stack-evidence "package=$QWQ_OUTPUT_ROOT/env/beta/runs/formal-runtime/package.json" \
            --stack-evidence "up=$QWQ_OUTPUT_ROOT/env/beta/runs/formal-runtime/up.json" \
            --stack-evidence "health=$QWQ_OUTPUT_ROOT/env/beta/runs/formal-runtime/health.json" \
            --stack-evidence "verify=$QWQ_OUTPUT_ROOT/env/beta/runs/formal-runtime/verify.json" \
            --bundle-dir "$QWQ_OUTPUT_ROOT/env/beta/runs/stack-evidence"
      - name: Setup Buildx for Beta stack evidence
        if: ${{ steps.defaults.outputs.profile == 'mainline_auto_prod' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: stack_bundle
        name: Publish immutable Beta stack evidence OCI
        if: ${{ steps.defaults.outputs.profile == 'mainline_auto_prod' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/beta/runs/stack-evidence
          file: ${{ env.STACK_REPO_DIR }}/quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/beta-stack-evidence:${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: stack_ref
        name: Record producer-returned exact stack evidence ref
        if: ${{ steps.defaults.outputs.profile == 'mainline_auto_prod' }}
        run: echo "ref=ghcr.io/${{ github.repository }}/beta-stack-evidence@${{ steps.stack_bundle.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: finish
        if: always()
        name: Finish prerequisite timer
        run: echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  android_device_matrix:
    name: Android device matrix
    needs: beta_stack
    if: ${{ needs.beta_stack.result == 'success' }}
    permissions:
      contents: read
      attestations: read
      packages: write
    uses: ./.github/workflows/beta-device-platform.yml
    with:
      platform: android
      checkout_ref: ${{ needs.beta_stack.outputs.source_git_sha }}
      validation_profile: ${{ needs.beta_stack.outputs.profile }}
      env_json: ${{ needs.beta_stack.outputs.env_json }}
      matrix_kind: ${{ needs.beta_stack.outputs.matrix_kind }}
      expected_host_digest: ${{ needs.beta_stack.outputs.host_digest }}
      release_evidence_ref: ${{ needs.beta_stack.outputs.release_evidence_ref }}
      event_name: ${{ github.event_name }}
      account_closure_disposable_ack: ${{ inputs.account_closure_disposable_ack }}
      account_closure_prod_platform: ${{ inputs.account_closure_prod_platform }}
      account_closure_prod_device_id: ${{ inputs.account_closure_prod_device_id }}
    secrets: inherit

  ios_device_matrix:
    name: iOS device matrix
    needs: beta_stack
    if: ${{ needs.beta_stack.result == 'success' }}
    permissions:
      contents: read
      attestations: read
      packages: write
    uses: ./.github/workflows/beta-device-platform.yml
    with:
      platform: ios
      checkout_ref: ${{ needs.beta_stack.outputs.source_git_sha }}
      validation_profile: ${{ needs.beta_stack.outputs.profile }}
      env_json: ${{ needs.beta_stack.outputs.env_json }}
      matrix_kind: ${{ needs.beta_stack.outputs.matrix_kind }}
      expected_host_digest: ${{ needs.beta_stack.outputs.host_digest }}
      release_evidence_ref: ${{ needs.beta_stack.outputs.release_evidence_ref }}
      event_name: ${{ github.event_name }}
      account_closure_disposable_ack: ${{ inputs.account_closure_disposable_ack }}
      account_closure_prod_platform: ${{ inputs.account_closure_prod_platform }}
      account_closure_prod_device_id: ${{ inputs.account_closure_prod_device_id }}
    secrets: inherit

  attest_android_recovery_receipt:
    name: Attest exact Android recovery receipt
    needs: [beta_stack, android_device_matrix]
    if: ${{ needs.beta_stack.outputs.profile == 'nightly_full' && needs.android_device_matrix.result == 'success' && needs.android_device_matrix.outputs.recovery_receipt_base64 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RECEIPT_BASE64: ${{ needs.android_device_matrix.outputs.recovery_receipt_base64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.beta_stack.outputs.source_git_sha }}
          clean: false
          persist-credentials: false
      - name: Initialize runner-local Android receipt path
        run: echo "RECEIPT_PATH=$RUNNER_TEMP/environment-stability-recovery-android.json" >> "$GITHUB_ENV"
      - name: Materialize exact Android recovery receipt bytes
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RECEIPT_PATH"]).write_bytes(
              base64.b64decode(os.environ["RECEIPT_BASE64"], validate=True)
          )
          PY
      - name: Verify canonical Android recovery receipt bindings
        run: |
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py verify-case \
            --kind recovery.android \
            --receipt "$RECEIPT_PATH"
      - name: Attest exact Android recovery receipt bytes
        uses: actions/attest@f7c2b2a3f1986639bb3d0d22cb88d0e5e1d2c749
        with:
          subject-path: ${{ env.RECEIPT_PATH }}

  attest_ios_recovery_receipt:
    name: Attest exact iOS recovery receipt
    needs: [beta_stack, ios_device_matrix]
    if: ${{ needs.beta_stack.outputs.profile == 'nightly_full' && needs.ios_device_matrix.result == 'success' && needs.ios_device_matrix.outputs.recovery_receipt_base64 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RECEIPT_BASE64: ${{ needs.ios_device_matrix.outputs.recovery_receipt_base64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.beta_stack.outputs.source_git_sha }}
          clean: false
          persist-credentials: false
      - name: Initialize runner-local iOS receipt path
        run: echo "RECEIPT_PATH=$RUNNER_TEMP/environment-stability-recovery-ios.json" >> "$GITHUB_ENV"
      - name: Materialize exact iOS recovery receipt bytes
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RECEIPT_PATH"]).write_bytes(
              base64.b64decode(os.environ["RECEIPT_BASE64"], validate=True)
          )
          PY
      - name: Verify canonical iOS recovery receipt bindings
        run: |
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py verify-case \
            --kind recovery.ios \
            --receipt "$RECEIPT_PATH"
      - name: Attest exact iOS recovery receipt bytes
        uses: actions/attest@f7c2b2a3f1986639bb3d0d22cb88d0e5e1d2c749
        with:
          subject-path: ${{ env.RECEIPT_PATH }}

  mobile_matrix:
    name: Aggregate mobile matrix evidence
    needs: [beta_stack, android_device_matrix, ios_device_matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      attestations: read
      packages: write
    env:
      AGGREGATE_REPO_DIR: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/aggregate
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      android_result: ${{ steps.results.outputs.android_result }}
      ios_result: ${{ steps.results.outputs.ios_result }}
      receipt_ref: ${{ steps.receipt_ref.outputs.ref }}
      receipt_digest: ${{ steps.receipt_bundle.outputs.digest }}
    steps:
      - id: start
        name: Start aggregation timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.beta_stack.outputs.source_git_sha || github.sha }}
          path: .qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/aggregate
          clean: false
          persist-credentials: false
      - id: results
        name: Project explicit Android and iOS job results
        env:
          ANDROID: ${{ needs.android_device_matrix.result }}
          IOS: ${{ needs.ios_device_matrix.result }}
        run: |
          echo "android_result=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios_result=$IOS" >> "$GITHUB_OUTPUT"
      - name: Require successful direct-bound dual-platform evidence
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        env:
          STACK_RESULT: ${{ needs.beta_stack.result }}
          ANDROID_RESULT: ${{ needs.android_device_matrix.result }}
          IOS_RESULT: ${{ needs.ios_device_matrix.result }}
          STACK_REF: ${{ needs.beta_stack.outputs.stack_ref }}
          STACK_DIGEST: ${{ needs.beta_stack.outputs.stack_digest }}
          ANDROID_REF: ${{ needs.android_device_matrix.outputs.evidence_ref }}
          ANDROID_DIGEST: ${{ needs.android_device_matrix.outputs.evidence_digest }}
          IOS_REF: ${{ needs.ios_device_matrix.outputs.evidence_ref }}
          IOS_DIGEST: ${{ needs.ios_device_matrix.outputs.evidence_digest }}
        run: |
          set -euo pipefail
          if [ "$STACK_RESULT" != success ] || [ "$ANDROID_RESULT" != success ] || [ "$IOS_RESULT" != success ]; then
            echo "::error::GATE_BLOCK: Beta receipt requires one immutable stack and successful independent Android/iOS jobs"
            exit 2
          fi
          for exact_ref in "$STACK_REF" "$ANDROID_REF" "$IOS_REF"; do
            case "$exact_ref" in ghcr.io/*@sha256:*) ;; *) exit 2 ;; esac
          done
          test "${STACK_REF##*@}" = "$STACK_DIGEST"
          test "${ANDROID_REF##*@}" = "$ANDROID_DIGEST"
          test "${IOS_REF##*@}" = "$IOS_DIGEST"
      - name: Login immutable evidence registry
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx for release evidence verification
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - name: Materialize exact candidate and exact producer-returned evidence refs
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        working-directory: ${{ env.AGGREGATE_REPO_DIR }}
        env:
          STACK_REF: ${{ needs.beta_stack.outputs.stack_ref }}
          STACK_DIGEST: ${{ needs.beta_stack.outputs.stack_digest }}
          ANDROID_REF: ${{ needs.android_device_matrix.outputs.evidence_ref }}
          ANDROID_DIGEST: ${{ needs.android_device_matrix.outputs.evidence_digest }}
          IOS_REF: ${{ needs.ios_device_matrix.outputs.evidence_ref }}
          IOS_DIGEST: ${{ needs.ios_device_matrix.outputs.evidence_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST_ROOT="$QWQ_OUTPUT_ROOT/env/repo/runs/beta-aggregation/release-evidence-manifest"
          INCOMING="$QWQ_OUTPUT_ROOT/env/beta/runs/evidence-incoming"
          python3 quwoquan_ops/ci/consume_released_release_evidence.py \
            --ref "${{ needs.beta_stack.outputs.release_evidence_ref }}" \
            --repository "${{ github.repository }}" \
            --require-status candidate-ready \
            --expected-candidate "${{ needs.beta_stack.outputs.candidate_digest }}" \
            --expected-artifact-digest "${{ needs.beta_stack.outputs.artifact_digest }}" \
            --expected-source-sha "${{ needs.beta_stack.outputs.source_git_sha }}" \
            --output-dir "$MANIFEST_ROOT"
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "$STACK_REF" --expected-digest "$STACK_DIGEST" \
            --output-dir "$INCOMING/stack" --require-file stack.json
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "$ANDROID_REF" --expected-digest "$ANDROID_DIGEST" \
            --output-dir "$INCOMING/android" --require-file platform.json --require-file raw/device-lease.json
          python3 quwoquan_ops/ci/materialize_evidence_oci.py \
            --ref "$IOS_REF" --expected-digest "$IOS_DIGEST" \
            --output-dir "$INCOMING/ios" --require-file platform.json --require-file raw/device-lease.json
          echo "QWQ_PROD_RELEASE_ARTIFACT_ROOT=$MANIFEST_ROOT" >> "$GITHUB_ENV"
      - name: Seal one Beta receipt after host, lease and overlap validation
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        working-directory: ${{ env.AGGREGATE_REPO_DIR }}
        env:
          STACK_REF: ${{ needs.beta_stack.outputs.stack_ref }}
          STACK_DIGEST: ${{ needs.beta_stack.outputs.stack_digest }}
          ANDROID_REF: ${{ needs.android_device_matrix.outputs.evidence_ref }}
          ANDROID_DIGEST: ${{ needs.android_device_matrix.outputs.evidence_digest }}
          IOS_REF: ${{ needs.ios_device_matrix.outputs.evidence_ref }}
          IOS_DIGEST: ${{ needs.ios_device_matrix.outputs.evidence_digest }}
        run: |
          set -euo pipefail
          INCOMING="$QWQ_OUTPUT_ROOT/env/beta/runs/evidence-incoming"
          RECEIPT="$QWQ_OUTPUT_ROOT/env/beta/runs/mainline-receipt"
          RAW="$RECEIPT/raw"
          mkdir -p "$RAW/platforms/android" "$RAW/platforms/ios"
          cp -R "$INCOMING/android/." "$RAW/platforms/android/"
          cp -R "$INCOMING/ios/." "$RAW/platforms/ios/"
          python3 quwoquan_ops/ci/render_beta_device_evidence.py merge \
            --manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --expected-host-digest "${{ needs.beta_stack.outputs.host_digest }}" \
            --stack-bundle "$INCOMING/stack" --stack-ref "$STACK_REF" --stack-digest "$STACK_DIGEST" \
            --android-bundle "$INCOMING/android" --android-ref "$ANDROID_REF" --android-digest "$ANDROID_DIGEST" \
            --ios-bundle "$INCOMING/ios" --ios-ref "$IOS_REF" --ios-digest "$IOS_DIGEST" \
            --output "$RAW/devices.json"
          for command in package up health verify; do
            cp "$INCOMING/stack/raw/${command}.json" "$RAW/${command}.json"
          done
          cp "$INCOMING/android/platform.json" "$RAW/android-platform.json"
          cp "$INCOMING/ios/platform.json" "$RAW/ios-platform.json"
          python3 quwoquan_ops/ci/render_environment_release_receipt.py \
            --manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --environment beta \
            --evidence "package=$RAW/package.json" \
            --evidence "up=$RAW/up.json" \
            --evidence "health=$RAW/health.json" \
            --evidence "verify=$RAW/verify.json" \
            --evidence "android-platform=$RAW/android-platform.json" \
            --evidence "ios-platform=$RAW/ios-platform.json" \
            --evidence "devices=$RAW/devices.json" \
            --evidence "pilot-release=$QWQ_PROD_RELEASE_ARTIFACT_ROOT/evidence/release/pilot-release-attestation.json" \
            --evidence "pilot-rollback=$QWQ_PROD_RELEASE_ARTIFACT_ROOT/evidence/release/pilot-rollback-attestation.json" \
            --evidence "content-lifecycle=$QWQ_PROD_RELEASE_ARTIFACT_ROOT/evidence/release/lifecycle-exit-beta.json" \
            --require-evidence package --require-evidence up --require-evidence health --require-evidence verify \
            --require-evidence android-platform --require-evidence ios-platform --require-evidence devices \
            --require-evidence pilot-release --require-evidence pilot-rollback --require-evidence content-lifecycle \
            --archive-prefix evidence/raw/environments/beta/raw \
            --output "$RECEIPT/beta.json"
      - name: Setup Buildx for aggregated Beta evidence
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: receipt_bundle
        name: Publish immutable Beta environment evidence OCI
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/beta/runs/mainline-receipt
          file: ${{ env.AGGREGATE_REPO_DIR }}/quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/environment-evidence:beta-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: receipt_ref
        name: Record exact Beta environment evidence ref
        if: ${{ needs.beta_stack.outputs.profile == 'mainline_auto_prod' }}
        run: echo "ref=ghcr.io/${{ github.repository }}/environment-evidence@${{ steps.receipt_bundle.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: finish
        if: always()
        name: Finish aggregation timer
        run: echo "duration_seconds=$(( $(date +%s) - ${{ steps.start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

  beta_teardown:
    name: Teardown the stack owned by this matrix run
    needs: [beta_stack, android_device_matrix, ios_device_matrix, mobile_matrix]
    if: ${{ always() && (needs.beta_stack.outputs.formal_runtime_started == 'true' || needs.beta_stack.outputs.managed_runtime_started == 'true') }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: ${{ needs.beta_stack.outputs.managed_runtime_started == 'true' && 10 || 1 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.beta_stack.outputs.source_git_sha }}
          path: .qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/teardown
          clean: false
          persist-credentials: false
      - id: host
        name: Refuse teardown from a different physical Mac
        working-directory: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/teardown
        run: |
          python3 quwoquan_ops/ci/device_runner_lease.py host --github-output "$GITHUB_OUTPUT"
          test "$(tail -n 1 "$GITHUB_OUTPUT" | cut -d= -f2-)" = "${{ needs.beta_stack.outputs.host_digest }}"
      - name: Teardown only the recorded formal Beta runtime
        if: ${{ needs.beta_stack.outputs.formal_runtime_started == 'true' }}
        working-directory: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/teardown
        run: |
          python3 quwoquan_ops/cli/stackctl.py down \
            --target beta-local \
            --formal-release \
            --release-manifest "$QWQ_OUTPUT_ROOT/env/repo/runs/beta-stack/release-evidence-manifest/manifest.json" \
            --report-dir "$QWQ_OUTPUT_ROOT/env/beta/runs/formal-runtime/down"
      - name: Inspect and doctor the managed Gamma runtime after soak
        if: ${{ needs.beta_stack.outputs.managed_runtime_started == 'true' }}
        working-directory: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/teardown
        run: |
          set -euo pipefail
          ROOT="$QWQ_OUTPUT_ROOT/env/gamma/runs/device-matrix-runtime"
          python3 quwoquan_ops/cli/stackctl.py inspect \
            --target gamma-local \
            --scope all \
            --report-dir "$ROOT/final-inspect"
          python3 quwoquan_ops/cli/stackctl.py doctor \
            --target gamma-local \
            --report-dir "$ROOT/final-doctor"
      - name: Verify and teardown only the Gamma runtime started here
        if: ${{ always() && needs.beta_stack.outputs.managed_runtime_started == 'true' }}
        working-directory: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/teardown
        run: |
          set -uo pipefail
          STATUS=0
          python3 quwoquan_ops/cli/stackctl.py health \
            --target gamma-local \
            --scope full \
            --report-dir "$QWQ_OUTPUT_ROOT/env/gamma/runs/device-matrix-runtime/final-health" || STATUS=$?
          python3 quwoquan_ops/cli/stackctl.py down \
            --target gamma-local \
            --workload full \
            --report-dir "$QWQ_OUTPUT_ROOT/env/gamma/runs/device-matrix-runtime/down" || STATUS=$?
          exit "$STATUS"

  app_env_device_matrix_summary:
    name: 05. App Env Device Matrix
    needs: [beta_stack, android_device_matrix, ios_device_matrix, mobile_matrix, beta_teardown]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    env:
      SUMMARY_REPO_DIR: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/summary
    outputs:
      machine_critical_path_seconds: ${{ steps.timing.outputs.machine_critical_path_seconds }}
      summary_result: ${{ steps.summary.outputs.result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.beta_stack.outputs.source_git_sha || github.sha }}
          path: .qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/summary
          clean: false
          persist-credentials: false
      - id: timing
        name: Render official GitHub DAG timing
        working-directory: ${{ env.SUMMARY_REPO_DIR }}
        env:
          SELF_HOSTED_ENABLED: ${{ github.event_name != 'pull_request' || vars.ENABLE_SELF_HOSTED_MOBILE_MATRIX == 'true' }}
          VALIDATION_PROFILE: ${{ needs.beta_stack.outputs.profile }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$SELF_HOSTED_ENABLED" != true ]; then
            echo "machine_critical_path_seconds=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIMING_OUTPUT="$(mktemp)"
          python3 quwoquan_ops/ci/github_actions_timing.py \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --phase "beta_stack=Prepare one Beta stack prerequisite" \
            --phase "android=Android device matrix" \
            --phase "ios=iOS device matrix" \
            --phase "aggregation=Aggregate mobile matrix evidence" \
            --require-count "beta_stack=1" --require-count "android=1" --require-count "ios=1" --require-count "aggregation=1" \
            --dag-layer beta_stack --dag-layer android,ios --dag-layer aggregation \
            --candidate-job "Aggregate mobile matrix evidence" \
            --critical-start run \
            --github-output "$TIMING_OUTPUT"
          # shellcheck source=/dev/null
          source "$TIMING_OUTPUT"
          cat "$TIMING_OUTPUT" >> "$GITHUB_OUTPUT"
          DURATION_ARGS=(--calendar-lead-time-seconds "$calendar_lead_time_seconds")
          EVIDENCE_ARGS=()
          NOTE_ARGS=()
          if [[ -n "${queue_seconds:-}" ]]; then DURATION_ARGS+=(--queue-seconds "$queue_seconds"); fi
          if [[ -n "${missing_evidence:-}" ]]; then
            EVIDENCE_ARGS+=(--missing-evidence "$missing_evidence")
            NOTE_ARGS+=(--note "GitHub Jobs API omitted created_at for one or more matched jobs; queue duration is absent and no zero or substitute timestamp was used.")
          fi
          python3 quwoquan_ops/ci/render_ci_timing_summary.py \
            --gate-key 05.app_env_device_matrix_pr \
            --title "05. App Env Device Matrix" \
            --machine-critical-path-seconds "$machine_critical_path_seconds" \
            --critical-path-source github_run_calendar \
            --run-created-at "$run_created_at" \
            --candidate-ready-at "$candidate_ready_at" \
            "${DURATION_ARGS[@]}" \
            "${EVIDENCE_ARGS[@]}" \
            "${NOTE_ARGS[@]}" \
            --phase "beta_stack=$phase_beta_stack" \
            --phase "android=$phase_android" \
            --phase "ios=$phase_ios" \
            --phase "aggregation=$phase_aggregation" \
            --note "GitHub Jobs API proves explicit Android/iOS jobs share one host-bound stack and execute before one aggregator." \
            --write-json "$QWQ_OUTPUT_ROOT/env/repo/runs/ci-timing/app-env-device-matrix-summary.json" \
            --write-step-summary
          if [ "$VALIDATION_PROFILE" = mainline_auto_prod ]; then
            if [ "$calendar_lead_time_seconds" -gt 480 ]; then
              echo "::error::GATE_BLOCK: Beta stack/device/aggregation calendar path exceeded the 480 second hard budget"
              exit 2
            fi
          fi
          if [ "$VALIDATION_PROFILE" = nightly_full ] && [ "$calendar_lead_time_seconds" -gt 7200 ]; then
            echo "::error::GATE_BLOCK: nightly full device matrix exceeded the 7200 second soak budget"
            exit 2
          fi
          if [[ -n "${missing_evidence:-}" ]]; then
            echo "::error::GATE_BLOCK: App device matrix timing is historical_incomplete: ${missing_evidence}"
            exit 2
          fi
      - id: summary
        name: Block any missing or failed platform
        env:
          SELF_HOSTED_ENABLED: ${{ github.event_name != 'pull_request' || vars.ENABLE_SELF_HOSTED_MOBILE_MATRIX == 'true' }}
          STACK: ${{ needs.beta_stack.result }}
          ANDROID: ${{ needs.android_device_matrix.result }}
          IOS: ${{ needs.ios_device_matrix.result }}
          AGGREGATE: ${{ needs.mobile_matrix.result }}
          TEARDOWN: ${{ needs.beta_teardown.result }}
          FORMAL_RUNTIME_STARTED: ${{ needs.beta_stack.outputs.formal_runtime_started }}
          MANAGED_RUNTIME_STARTED: ${{ needs.beta_stack.outputs.managed_runtime_started }}
          ALLOW_MISSING: ${{ needs.beta_stack.outputs.allow_missing_platforms }}
        run: |
          set -euo pipefail
          if [ "$SELF_HOSTED_ENABLED" != true ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=()
          if [ "$ALLOW_MISSING" = true ]; then args+=(--allow-missing-platforms); fi
          python3 "$SUMMARY_REPO_DIR/quwoquan_ops/ci/device_matrix/check_gate.py" \
            --discover-result "$STACK" \
            --android-result "$ANDROID" \
            --ios-result "$IOS" \
            --has-android true \
            --has-ios true \
            "${args[@]}"
          test "$AGGREGATE" = success
          if [ "$FORMAL_RUNTIME_STARTED" = true ]; then test "$TEARDOWN" = success; fi
          if [ "$MANAGED_RUNTIME_STARTED" = true ]; then test "$TEARDOWN" = success; fi
          echo "result=success" >> "$GITHUB_OUTPUT"

  attest_nightly_receipt:
    name: Attest exact nightly full receipt
    needs:
      - beta_stack
      - android_device_matrix
      - ios_device_matrix
      - attest_android_recovery_receipt
      - attest_ios_recovery_receipt
      - app_env_device_matrix_summary
    if: ${{ always() && needs.beta_stack.outputs.profile == 'nightly_full' && needs.app_env_device_matrix_summary.result == 'success' && needs.attest_android_recovery_receipt.result == 'success' && needs.attest_ios_recovery_receipt.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IOS_RECEIPT_BASE64: ${{ needs.ios_device_matrix.outputs.recovery_receipt_base64 }}
      ANDROID_RECEIPT_BASE64: ${{ needs.android_device_matrix.outputs.recovery_receipt_base64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.beta_stack.outputs.source_git_sha }}
          clean: false
          persist-credentials: false
      - name: Initialize runner-local nightly receipt paths
        run: |
          {
            echo "IOS_RECEIPT_PATH=$RUNNER_TEMP/environment-stability-recovery-ios.json"
            echo "ANDROID_RECEIPT_PATH=$RUNNER_TEMP/environment-stability-recovery-android.json"
            echo "RECEIPT_PATH=$RUNNER_TEMP/environment-stability-nightly-full.json"
          } >> "$GITHUB_ENV"
      - name: Materialize exact dual-platform recovery receipt bytes
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          for prefix in ("IOS", "ANDROID"):
              Path(os.environ[f"{prefix}_RECEIPT_PATH"]).write_bytes(
                  base64.b64decode(
                      os.environ[f"{prefix}_RECEIPT_BASE64"],
                      validate=True,
                  )
              )
          PY
      - name: Render canonical nightly receipt after dual-platform attestations
        run: |
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py aggregate-nightly \
            --ios-receipt "$IOS_RECEIPT_PATH" \
            --android-receipt "$ANDROID_RECEIPT_PATH" \
            --output "$RECEIPT_PATH"
      - name: Verify canonical nightly candidate, commit, release and artifact bindings
        run: |
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py verify-case \
            --kind nightly \
            --receipt "$RECEIPT_PATH"
      - name: Attest exact nightly receipt bytes
        uses: actions/attest@f7c2b2a3f1986639bb3d0d22cb88d0e5e1d2c749
        with:
          subject-path: ${{ env.RECEIPT_PATH }}
