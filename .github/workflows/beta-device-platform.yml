name: Beta Device Platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      validation_profile:
        required: true
        type: string
      env_json:
        required: true
        type: string
      matrix_kind:
        required: true
        type: string
      expected_host_digest:
        required: true
        type: string
      release_evidence_ref:
        required: false
        type: string
        default: ''
      event_name:
        required: true
        type: string
      account_closure_disposable_ack:
        required: false
        type: boolean
        default: false
      account_closure_prod_platform:
        required: false
        type: string
        default: ios
      account_closure_prod_device_id:
        required: false
        type: string
        default: ''
    outputs:
      duration_seconds:
        value: ${{ jobs.device.outputs.duration_seconds }}
      result:
        value: ${{ jobs.device.outputs.result }}
      evidence_ref:
        value: ${{ jobs.device.outputs.evidence_ref }}
      evidence_digest:
        value: ${{ jobs.device.outputs.evidence_digest }}
      device_id_digest:
        value: ${{ jobs.device.outputs.device_id_digest }}
      lease_id:
        value: ${{ jobs.device.outputs.lease_id }}
      execution_started_at:
        value: ${{ jobs.device.outputs.execution_started_at }}
      execution_ended_at:
        value: ${{ jobs.device.outputs.execution_ended_at }}
      recovery_receipt_base64:
        value: ${{ jobs.device.outputs.recovery_receipt_base64 }}

permissions:
  contents: read

jobs:
  device:
    name: Beta ${{ inputs.platform }} device matrix
    runs-on: [self-hosted, macOS, ARM64]
    # PR-light still performs a real package/device pass; a cold checkout alone
    # can exceed four minutes. Keep every profile bounded while leaving enough
    # time for exact checkout, lease, native startup and evidence closure.
    timeout-minutes: ${{ inputs.validation_profile == 'nightly_full' && 120 || ((inputs.validation_profile == 'release_candidate' || inputs.validation_profile == 'manual_full' || inputs.validation_profile == 'mainline_auto_prod') && 90 || 40) }}
    permissions:
      contents: read
      attestations: read
      packages: write
    environment:
      name: ${{ contains(inputs.env_json, '"prod"') && 'production' || 'device-matrix' }}
    outputs:
      duration_seconds: ${{ steps.finish.outputs.duration_seconds }}
      result: ${{ steps.success.outputs.result }}
      evidence_ref: ${{ steps.evidence_ref.outputs.ref }}
      evidence_digest: ${{ steps.evidence_bundle.outputs.digest }}
      device_id_digest: ${{ steps.lease.outputs.device_id_digest }}
      lease_id: ${{ steps.lease.outputs.lease_id }}
      execution_started_at: ${{ steps.execution_start.outputs.started_at }}
      execution_ended_at: ${{ steps.execution_end.outputs.ended_at }}
      recovery_receipt_base64: ${{ steps.recovery_receipt.outputs.receipt_base64 }}
    env:
      PLATFORM_REPO_DIR: ${{ github.workspace }}/.qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.platform }}
      ALPHA_TEST_AUTH_TOKEN: ${{ secrets.ALPHA_TEST_AUTH_TOKEN }}
      BETA_TEST_AUTH_TOKEN: ${{ secrets.BETA_TEST_AUTH_TOKEN }}
      GAMMA_TEST_AUTH_TOKEN: ${{ secrets.GAMMA_TEST_AUTH_TOKEN }}
      PROD_TEST_AUTH_TOKEN: ${{ secrets.PROD_TEST_AUTH_TOKEN }}
      PROD_ACCOUNT_CLOSURE_TEST_AUTH_TOKEN: ${{ secrets.PROD_ACCOUNT_CLOSURE_TEST_AUTH_TOKEN }}
      PROD_ACCOUNT_CLOSURE_TEST_REFRESH_TOKEN: ${{ secrets.PROD_ACCOUNT_CLOSURE_TEST_REFRESH_TOKEN }}
      PROD_ACCOUNT_CLOSURE_OWNER_ID: ${{ secrets.PROD_ACCOUNT_CLOSURE_OWNER_ID }}
      PROD_ACCOUNT_CLOSURE_PERSONA_ID: ${{ secrets.PROD_ACCOUNT_CLOSURE_PERSONA_ID }}
      VIDEO_PLAYBACK_CANARY_WORK_ID: ${{ vars.VIDEO_PLAYBACK_CANARY_WORK_ID }}
    steps:
      - name: Initialize runner-local device output root
        run: echo "QWQ_OUTPUT_ROOT=$RUNNER_TEMP/quwoquan-device-matrix/${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.platform }}/.qwq_output" >> "$GITHUB_ENV"
      - id: start
        name: Start platform timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.checkout_ref }}
          path: .qwq_output/env/repo/local/device-matrix/cache/checkouts/${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.platform }}
          clean: false
          persist-credentials: false
      - name: Require exact clean candidate checkout
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="${{ inputs.checkout_ref }}"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Validate platform and preinstalled mobile tools
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        run: |
          set -euo pipefail
          case "${{ inputs.platform }}" in android|ios) ;; *) exit 2 ;; esac
          command -v flutter >/dev/null 2>&1 || { echo "::error::flutter is required"; exit 2; }
          if [ "${{ inputs.platform }}" = "android" ]; then
            command -v adb >/dev/null 2>&1 || { echo "::error::adb is required"; exit 2; }
          else
            command -v xcrun >/dev/null 2>&1 || { echo "::error::xcrun is required"; exit 2; }
          fi
      - id: lease
        name: Acquire one host-bound device lease
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        env:
          PREFERRED_DEVICE_ID: ${{ inputs.account_closure_prod_platform == inputs.platform && inputs.account_closure_prod_device_id || '' }}
        run: |
          set -euo pipefail
          LEASE="$QWQ_OUTPUT_ROOT/env/repo/runs/device-lease/${{ inputs.platform }}.json"
          python3 quwoquan_ops/ci/device_runner_lease.py acquire \
            --platform "${{ inputs.platform }}" \
            --expected-host-digest "${{ inputs.expected_host_digest }}" \
            --runner-label "mobile-${{ inputs.platform }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --preferred-device-id "$PREFERRED_DEVICE_ID" \
            --evidence-output "$LEASE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Mask device lease ownership token
        env:
          LEASE_TOKEN: ${{ steps.lease.outputs.lease_token }}
        run: echo "::add-mask::$LEASE_TOKEN"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: ${{ env.PLATFORM_REPO_DIR }}/quwoquan_service/go.mod
          cache: false
      - name: Login immutable candidate registry
        if: ${{ inputs.validation_profile != 'pr_light' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx for release evidence verification
        if: ${{ inputs.validation_profile != 'pr_light' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: release
        name: Derive candidate identity and artifact closure
        if: ${{ inputs.validation_profile != 'pr_light' }}
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$QWQ_OUTPUT_ROOT/env/repo/runs/release-evidence-manifest"
          case "${{ inputs.validation_profile }}" in
            mainline_auto_prod|release_candidate) REQUIRED_STATUS=candidate-ready ;;
            manual_full|nightly_full) REQUIRED_STATUS=released ;;
            *) echo "::error::GATE_BLOCK: unsupported release validation profile"; exit 2 ;;
          esac
          python3 quwoquan_ops/ci/consume_released_release_evidence.py \
            --ref "${{ inputs.release_evidence_ref }}" \
            --repository "${{ github.repository }}" \
            --require-status "$REQUIRED_STATUS" \
            --expected-source-sha "${{ inputs.checkout_ref }}" \
            --output-dir "$ROOT" \
            --github-output "$GITHUB_OUTPUT"
          echo "QWQ_PROD_RELEASE_ARTIFACT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Install Flutter dependencies
        working-directory: ${{ env.PLATFORM_REPO_DIR }}/quwoquan_app
        run: flutter pub get
      - name: Build Android package-only startup matrix
        if: ${{ inputs.platform == 'android' }}
        working-directory: ${{ env.PLATFORM_REPO_DIR }}/quwoquan_app
        run: |
          python3 scripts/device/build_startup_environment_matrix.py \
            --platform android \
            --output-root "$QWQ_OUTPUT_ROOT/env/repo/runs/startup-environment-android-build-matrix"
      - name: Verify Android native startup on the leased device
        if: ${{ inputs.platform == 'android' }}
        working-directory: ${{ env.PLATFORM_REPO_DIR }}/quwoquan_app
        env:
          DEVICE_ID: ${{ steps.lease.outputs.device_id }}
        run: bash scripts/device/verify_android_native_startup_gate.sh "$DEVICE_ID"
      - name: Prewarm sqlite3 macOS native asset
        working-directory: ${{ env.PLATFORM_REPO_DIR }}/quwoquan_app
        run: |
          set -euo pipefail
          warmup_script="$(mktemp "${PWD}/.dart_tool/sqlite3-prewarm.XXXXXX.dart")"
          cleanup() { rm -f "$warmup_script"; }
          trap cleanup EXIT
          printf '%s\n' "import 'package:sqlite3/sqlite3.dart'; void main() { final db = sqlite3.openInMemory(); db.execute('select 1;'); db.dispose(); }" > "$warmup_script"
          dart run "$warmup_script"
      - id: execution_start
        name: Record device execution start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run only the leased platform device matrix
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        env:
          MOBILE_PLATFORM: ${{ inputs.platform }}
          MOBILE_DEVICE_ID: ${{ steps.lease.outputs.device_id }}
          MOBILE_MATRIX_ENV_JSON: ${{ inputs.env_json }}
          MOBILE_MATRIX_KIND: ${{ inputs.matrix_kind }}
          EVENT_NAME: ${{ inputs.event_name }}
          ACCOUNT_CLOSURE_DISPOSABLE_ACK: ${{ inputs.account_closure_disposable_ack }}
          ACCOUNT_CLOSURE_PROD_PLATFORM: ${{ inputs.account_closure_prod_platform }}
          ACCOUNT_CLOSURE_PROD_DEVICE_ID: ${{ inputs.account_closure_prod_device_id }}
        run: bash quwoquan_ops/ci/run_mobile_platform_matrix.sh
      - id: execution_end
        name: Record device execution end
        run: echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Verify platform evidence in the producing job
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        run: |
          python3 quwoquan_ops/tests/acceptance/user_acceptance/service_ops/chat-service/gate/verify_device_matrix_evidence.py \
            --artifact-root "$QWQ_OUTPUT_ROOT" \
            --report-glob "env/*/runs/device-matrix/**/*-${{ inputs.platform }}.json"
      - id: recovery_receipt
        name: Render and verify canonical recovery receipt
        if: ${{ inputs.validation_profile == 'nightly_full' }}
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        run: |
          set -euo pipefail
          RECEIPT="$QWQ_OUTPUT_ROOT/env/gamma/runs/environment-stability/recovery-${{ inputs.platform }}.json"
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py render-recovery \
            --platform "${{ inputs.platform }}" \
            --manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --evidence "$QWQ_OUTPUT_ROOT/env/gamma/runs/device-matrix/runtime-recovery-${{ inputs.platform }}.json" \
            --expected-candidate "${{ steps.release.outputs.candidate_digest }}" \
            --expected-artifact-digest "${{ steps.release.outputs.artifact_digest }}" \
            --expected-source-sha "${{ steps.release.outputs.source_git_sha }}" \
            --output "$RECEIPT" \
            --github-output "$GITHUB_OUTPUT"
          python3 quwoquan_ops/ci/render_environment_stability_attested_receipt.py verify-case \
            --kind "recovery.${{ inputs.platform }}" \
            --receipt "$RECEIPT"
      - name: Seal direct-bound Beta platform evidence
        if: ${{ inputs.validation_profile == 'mainline_auto_prod' }}
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        run: |
          BUNDLE="$QWQ_OUTPUT_ROOT/env/beta/runs/platform-evidence/${{ inputs.platform }}"
          python3 quwoquan_ops/ci/render_beta_device_evidence.py platform \
            --manifest "$QWQ_PROD_RELEASE_ARTIFACT_ROOT/manifest.json" \
            --platform "${{ inputs.platform }}" \
            --lease-evidence "${{ steps.lease.outputs.lease_evidence }}" \
            --execution-started-at "${{ steps.execution_start.outputs.started_at }}" \
            --execution-ended-at "${{ steps.execution_end.outputs.ended_at }}" \
            --device-report-root "$QWQ_OUTPUT_ROOT/env/beta/runs/device-matrix" \
            --bundle-dir "$BUNDLE"
      - name: Setup Buildx for Beta platform evidence
        if: ${{ inputs.validation_profile == 'mainline_auto_prod' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.35.0
          cache-binary: false
          clean: false
      - id: evidence_bundle
        name: Publish Beta platform evidence OCI
        if: ${{ inputs.validation_profile == 'mainline_auto_prod' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ env.QWQ_OUTPUT_ROOT }}/env/beta/runs/platform-evidence/${{ inputs.platform }}
          file: ${{ env.PLATFORM_REPO_DIR }}/quwoquan_ops/ci/app_candidate_evidence.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/beta-${{ inputs.platform }}-device-evidence:${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: evidence_ref
        name: Record producer-returned exact platform evidence ref
        if: ${{ inputs.validation_profile == 'mainline_auto_prod' }}
        run: echo "ref=ghcr.io/${{ github.repository }}/beta-${{ inputs.platform }}-device-evidence@${{ steps.evidence_bundle.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: success
        name: Mark platform matrix successful
        run: echo "result=success" >> "$GITHUB_OUTPUT"
      - name: Release only this job's device lease
        if: ${{ always() && steps.lease.outputs.lease_evidence != '' }}
        working-directory: ${{ env.PLATFORM_REPO_DIR }}
        env:
          LEASE_EVIDENCE: ${{ steps.lease.outputs.lease_evidence }}
          LEASE_TOKEN: ${{ steps.lease.outputs.lease_token }}
        run: |
          python3 quwoquan_ops/ci/device_runner_lease.py release \
            --lease-evidence "$LEASE_EVIDENCE" \
            --lease-token "$LEASE_TOKEN"
      - id: finish
        if: always()
        name: Finish platform timer
        run: |
          started_at="${{ steps.start.outputs.started_at }}"
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
