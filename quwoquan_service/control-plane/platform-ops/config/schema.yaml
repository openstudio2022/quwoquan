description: 该自治边界的运行配置定义与默认值；环境只维护差异和引用。
configs:
- key: sys.platform-ops-service.postgres.dsn
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.platform-ops-service.service.http.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: :18088
- key: sys.platform-ops-service.redis.general.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: redis:6379
