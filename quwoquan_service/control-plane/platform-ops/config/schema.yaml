description: 该自治边界的运行配置定义与默认值；环境只维护差异和引用。
configs:
- key: sys.platform-ops-service.config.max_image_version
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 9.9.9
- key: sys.platform-ops-service.config.min_image_version
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0.0.1
- key: sys.platform-ops-service.postgres.dsn
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.platform-ops-service.service.http.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: :18088
