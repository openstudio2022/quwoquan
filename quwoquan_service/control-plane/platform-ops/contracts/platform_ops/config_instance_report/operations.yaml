consumers:
- name: platform-ops
  capabilities: [list_config_instance_reports, report_config_instance, list_release_candidate_acks, list_runtime_services, list_runtime_instances, ingest_alertmanager_webhook, list_active_alerts, acknowledge_alert, list_platform_audits, list_platform_approvals, get_platform_projection_summary, get_platform_triage_summary]
contract_test:
  coverage_requirements:
  - ACK 只接受绑定 service/environment/instance namespace 的已验证 service principal。
  - ACK 必须绑定 canonical ReleaseManifest digest，desiredHash 只能来自 ConfigSnapshot；状态、workflow、audit、幂等 receipt 与 ConfigInstanceReported outbox 必须原子提交。
  current_evidence:
    local_contract: [control-plane/platform-ops/tests/local_contract/platform_ops/config_instance_report/atomic_handler__local_contract_test.go]
    api_integration: [control-plane/platform-ops/tests/api_integration/platform_ops/config_instance_report/postgres_outbox__api_integration_test.go]
    real_engines: {postgres: embedded-postgres}
