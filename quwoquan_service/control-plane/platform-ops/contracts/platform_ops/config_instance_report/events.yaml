events:
- name: ConfigInstanceReported
  description: 实例配置 ACK 的状态、workflow、audit 与幂等 receipt 原子提交后形成的唯一 typed event。
  no_consumer_reason: durable control-plane audit stream retained for orchestrator evidence and incident replay; no domain aggregate consumes it
  delivery_semantics: transactional_event_log
  topic: events.ops.config_instance_report
  payload_entity: ConfigInstanceReport
  payload_fields: [instanceId, environment, cluster, service, configVersion, imageVersion, releaseManifestDigest, desiredHash, effectiveHash, inSync, source, updatedAt, lastError]
