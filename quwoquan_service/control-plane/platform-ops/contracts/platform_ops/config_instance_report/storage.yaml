backend: postgres
tables:
  control_plane_documents:
    publication_role: not_published
    entity: ConfigInstanceReport
    role: authoritative
    description: platform-ops scope 下 namespace=config_instance_reports 的运行实例配置 ACK；body 保存经服务身份和候选 ReleaseManifest 摘要校验后的规范文档。
    pk:
    - scope
    - namespace
    - document_id
    columns:
    - name: scope
      type: TEXT
      constraints: [PK, NOT_NULL]
    - name: namespace
      type: TEXT
      constraints: [PK, NOT_NULL]
    - name: document_id
      type: TEXT
      constraints: [PK, NOT_NULL]
    - name: body
      type: JSONB
      constraints: [NOT_NULL]
    - name: updated_at
      type: TIMESTAMPTZ
      constraints: [NOT_NULL]
      default: NOW()
    indexes:
    - name: idx_control_plane_documents_namespace
      columns: [scope, namespace, document_id]
  platform_control_plane_outbox:
    publication_role: transactional_event_log
    entity: ConfigInstanceReport
    role: append_only
    description: platform scope 的事务性事件表；ConfigInstanceReported 与 document / workflow /
      audit / 幂等 receipt 在同一 Postgres 事务内追加，落地即完成投递义务，无具名领域消费者。
    pk:
    - event_id
    columns:
    - name: event_id
      type: VARCHAR(128)
      constraints: [PK, NOT_NULL]
    - name: event_type
      type: VARCHAR(128)
      constraints: [NOT_NULL]
    - name: aggregate_type
      type: VARCHAR(128)
      constraints: [NOT_NULL]
    - name: aggregate_id
      type: VARCHAR(128)
      constraints: [NOT_NULL]
    - name: payload
      type: JSONB
      constraints: [NOT_NULL]
    - name: occurred_at
      type: TIMESTAMPTZ
      constraints: [NOT_NULL]
    - name: dispatched_at
      type: TIMESTAMPTZ
    - name: retry_count
      type: INTEGER
      constraints: [NOT_NULL]
      default: '0'
    - name: next_attempt_at
      type: TIMESTAMPTZ
      constraints: [NOT_NULL]
      default: NOW()
    - name: last_error
      type: TEXT
      constraints: [NOT_NULL]
      default: ''''''
    - name: lease_owner
      type: VARCHAR(160)
    - name: leased_until
      type: TIMESTAMPTZ
    indexes:
    - name: idx_platform_control_plane_outbox_ready
      columns: [dispatched_at, next_attempt_at, occurred_at]
role: authoritative
