contract_test:
  coverage_requirements:
  - Human contract 生成 binding 漂移失败。
  - collection/read wrong-role、request DTO wire、全部 mutation exact idempotency 与 server-owned finalize authority 有本地契约测试。
  - GitHub HMAC、mapping fail-closed、delivery digest replay/conflict 与同 identity tuple request→approved 有本地契约测试。
  - PostgreSQL append-only hash chain 与原子 decision/audit/outbox/receipt 有真实引擎集成测试。
