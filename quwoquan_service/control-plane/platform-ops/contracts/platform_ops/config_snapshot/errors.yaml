domain: OPS
aggregate: ConfigSnapshot
description: 平台 IaC 配置只读快照查询的稳定错误语义。
errors:
- code: OPS.USER.config_invalid
  kind: USER
  reason: config_invalid
  http_status: 400
  emitted_by:
  - {surface: http, operations: [ResolveEffectiveConfig, ResolveEffectiveConfigForInstance, GetConfigSnapshot]}
  recovery_action: surface
  dart_const: configInvalid
  go_const: ErrConfigInvalid
  user_message:
    zh: 配置查询作用域无效
    en: The config query scope is invalid
- code: OPS.USER.config_snapshot_not_found
  kind: USER
  reason: config_snapshot_not_found
  http_status: 404
  emitted_by:
  - {surface: http, operations: [GetConfigSnapshot]}
  recovery_action: refresh
  dart_const: configSnapshotNotFound
  go_const: ErrConfigSnapshotNotFound
  user_message:
    zh: 配置快照不存在
    en: The config snapshot was not found
- code: OPS.SYSTEM.config_storage_read_failed
  kind: SYSTEM
  reason: config_storage_read_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [ListServiceConfigs, ResolveEffectiveConfig, ResolveEffectiveConfigForInstance, GetConfigSnapshot, ListConfigDomains, ListServiceCatalogEntries, ListPlaneBindings, GetProdPlaneAccessIsolation, GetGrayRoutingPolicy, ListEnvironmentTopologies, ListRuntimeClusters]}
  recovery_action: retry
  recovery_after_seconds: 2
  dart_const: configStorageReadFailed
  go_const: ErrConfigStorageReadFailed
  user_message:
    zh: 配置读取失败，请稍后重试
    en: Config read failed; retry later
