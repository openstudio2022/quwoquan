description: 单个自治服务或平台配置域的只读有效配置快照
fields:
- name: domain
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: projection
- name: service
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: projection
- name: environment
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: projection
- name: files
  type: array
  constraints:
  - NOT_NULL
  classification: SENSITIVE
  log_policy: redacted
  api_exposure: drop
  ops_exposure: read
  role: projection
- name: releaseVersions
  type: array
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: projection
  description: 兼容既有只读 wire 字段；内容仅为当前有效配置的摘要版本，不登记历史版本
- name: mergedSha256
  type: string
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: projection
- name: snapshotSource
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: projection
types:
  ConfigSnapshotView:
    description: 单个自治服务或平台配置域的已发布只读快照。
    fields:
    - name: domain
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: service
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: environment
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: files
      type: array
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: redacted
      api_exposure: drop
      ops_exposure: read
    - name: releaseVersions
      type: array
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: mergedSha256
      type: string
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: snapshotSource
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
  ConfigKeyCatalogSlice:
    description: metadata 生成的配置键目录
    fields:
    - name: items
      type: array
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: read
  EffectiveConfigSlice:
    description: 自治服务 package 快照解析出的 sys.* 有效配置值及来源文件
    fields:
    - name: scope
      type: object
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: resolvedAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: values
      type: array
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: redacted
      api_exposure: drop
      ops_exposure: read
    - name: effectiveHash
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: desiredHash
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: source
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
  ConfigSnapshotFile:
    description: 快照内单个配置文件的路径、内容与摘要
    fields:
    - name: path
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: role
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: sha256
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: content
      type: string
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: redacted
      api_exposure: drop
      ops_exposure: read
  ConfigDomainSlice:
    description: 可查看的配置域清单（云侧服务、端侧 App、数据工程、平台自身）
    fields:
    - name: items
      type: array
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: read
