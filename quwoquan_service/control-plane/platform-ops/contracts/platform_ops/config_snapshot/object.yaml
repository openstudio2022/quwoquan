kind: external_reference
description: '服务自治配置只读快照。配置的唯一真相源是服务 config/schema.yaml 与

  environments/{alpha,beta,gamma,prod}/config.yaml；运行态读取服务 package 内唯一有效配置；

  平台不提供任何在线写路径，快照仅用于查看与漂移核对。

  '
identity:
  fields:
  - environment
  - service
  version_source: external
access:
  commands: none
  cross_context: public_contract_only
  queries: external_port
relationships: []
search_policy:
  exposed: none
  not_exposed_reason: "运营与控制面对象，只由运营台按 operator scope 访问，不进入用户检索面。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "运营控制面不是用户助手面，小趣既不读取也不写入运营对象。"
business_rules:
- 配置值只随发布包变化；任何环境不提供在线编辑、审批或热写入端点。
- resolve 的 sys.* 有效值 = 服务 schema 默认值叠加所选环境 config.yaml 覆盖。
- 快照必须携带来源文件与 sha256，供实例 ACK 漂移核对。
- 运行实例只读取所属服务 package 的单一 config.yaml；config version 由该文件 sha256 派生。
lifecycle:
  refresh_semantics: replace_only_with_verified_service_package_digest
  tombstone: detach_when_service_package_is_retired
external_authority:
  owner: service_config_package
  identity_contract: environment_service_and_config_sha256
