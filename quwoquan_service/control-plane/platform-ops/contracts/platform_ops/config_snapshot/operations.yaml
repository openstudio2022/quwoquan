consumers:
- name: platform-ops
  capabilities:
  - list_config_keys
  - resolve_effective_config
  - get_config_snapshot
  - list_config_domains
  - list_service_catalog_entries
  - list_plane_bindings
  - get_prod_plane_access_isolation
  - get_gray_routing_policy
  - list_environment_topologies
  - list_runtime_clusters
contract_test:
  coverage_requirements:
  - resolve 的有效值来自服务 schema 默认值与单一环境覆盖，无任何在线写路径
  - snapshot 携带来源文件、sha256 与当前有效配置摘要；不维护历史版本注册表
  - 未知 service/environment 返回 config_snapshot_not_found 或 config_invalid
  current_evidence:
    local_contract:
    - control-plane/platform-ops/tests/local_contract/ops/platform_ops/config_snapshot/config_layer_http_boundary__local_contract_test.go
    api_integration:
    - control-plane/platform-ops/tests/api_integration/ops/platform_ops/config_snapshot/config_layer_http_boundary__api_integration_test.go
    real_engines:
      postgres: embedded-postgres
