commercial_defaults:
  status: blocked
  block_reason: ConfigSnapshot object packet is not yet commercially complete
  gap_id: PLATFORM_OPS_OBJECT_MIGRATION
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- method: GET
  path: /control-plane/platform/configs
  operation: ListServiceConfigs
  actor: account
  security:
    auth_mode: required
  response_entity: ConfigKeyCatalogSlice
  authorization:
    principal: operator
    scopes:
    - ops.platform.config.read
    ownership_policy: operator_scope
  reliability:
    timeout_ms: 1000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - OPS.USER.unauthorized
  - OPS.USER.forbidden
  - OPS.SYSTEM.config_storage_read_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: redacted
  telemetry:
    metric: ops_platform_config_catalog
    trace: true
    attributes:
    - operation
    - outcome
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  commercial:
    status: ready
  application:
    kind: query
    facet: ConfigSnapshotQueryFacade
    method: listConfigKeys
    reader: ConfigKeyCatalogReader
    slice: ConfigKeyCatalogSlice
- method: GET
  path: /control-plane/platform/configs/resolve
  operation: ResolveEffectiveConfig
  actor: account
  security:
    auth_mode: required
  response_entity: EffectiveConfigSlice
