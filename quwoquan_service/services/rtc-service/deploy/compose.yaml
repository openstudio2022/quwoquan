# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  rtc-service:
    profiles: ["edge-media"]
    image: "${QWQ_COMPOSE_RTC_SERVICE_IMAGE:?fixed rtc-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/rtc-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: rtc-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      QWQ_ARTIFACT_IDENTITY_FILE: /etc/quwoquan/artifact-identity.json
      CONFIG_VERSION: "${QWQ_COMPOSE_RTC_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_RTC_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      RTC_SERVICE_ADDR: ":18083"
      RTC_MONGO_URI: mongodb://mongodb:27017
      RTC_MONGO_DATABASE: quwoquan_rtc
      RTC_REDIS_ADDR: redis:6379
      USER_SERVICE_BASE_URL: http://user-service:18081
      RTC_MEDIA_CONNECTION_URL: "${RTC_MEDIA_CONNECTION_URL:-}"
      RTC_MEDIA_API_KEY: "${RTC_MEDIA_API_KEY:-}"
      RTC_MEDIA_API_SECRET: "${RTC_MEDIA_API_SECRET:-}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${QWQ_COMPOSE_RTC_PORT:-19350}:18083"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${QWQ_COMPOSE_ARTIFACT_IDENTITY_FILE:?artifact identity mount is required}:/etc/quwoquan/artifact-identity.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18083/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
