description: 该自治边界的运行配置定义与默认值；环境只维护差异和引用。
configs:
- key: sys.rtc-service.user_account_security_authority.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.rtc-service.user_account_security_authority.timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.rtc-service.livekit.api_key
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.rtc-service.livekit.api_secret
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.rtc-service.livekit.url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: ws://localhost:7880
- key: sys.rtc-service.mongodb.database
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: quwoquan_rtc_local
- key: sys.rtc-service.mongodb.uri
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.rtc-service.redis.general.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: localhost:6379
- key: sys.rtc-service.redis.general.db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 3
- key: sys.rtc-service.redis.general.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: standalone
- key: sys.rtc-service.redis.realtime.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: localhost:6379
- key: sys.rtc-service.redis.realtime.db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 4
- key: sys.rtc-service.redis.realtime.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: standalone
- key: sys.rtc-service.service.http.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: :18083
