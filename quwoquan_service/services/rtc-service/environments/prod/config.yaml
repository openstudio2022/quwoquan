overrides:
  sys.rtc-service.user_account_security_authority.base_url: http://user-service:18081
  sys.rtc-service.user_account_security_authority.timeout_ms: 500
  sys.rtc-service.livekit.url: ''
  sys.rtc-service.mongodb.database: quwoquan_rtc
  sys.rtc-service.redis.general.addr: ''
  sys.rtc-service.redis.general.mode: cluster
  sys.rtc-service.redis.realtime.addr: ''
  sys.rtc-service.redis.realtime.mode: cluster
secretRefs:
  sys.rtc-service.mongodb.uri: MONGO_URI
externalBindings:
  runtime.message.transport:
    state: enabled
  rtc.room.transport:
    state: enabled
    adapter: infra.livekit_sfu
    endpointRef: environment_binding:rtc.livekit
    endpointEnvs:
      connection: RTC_MEDIA_CONNECTION_URL
    secretRefs:
    - RTC_MEDIA_API_KEY
    - RTC_MEDIA_API_SECRET
    timeoutMs: 10000
