commercial_defaults:
  status: blocked
  block_reason: gamma full cold-start and media transport adapter runtime evidence blocked by missing controlled product telemetry SLS credential
  gap_id: RTC_CALL_SESSION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
privacy_contract:
  user_account_security_terminal_consumer:
    source_event_contract: user.UserAccountClosed
    suspension_event_contract: user.UserSuspended
    restore_event_contract: user.UserRestored
    failure_persistence: irreversible_event_and_error_digests_only
    dead_letter_retained:
      - dead_letter_id
      - source_stream
      - source_stream_id
      - event_class
      - irreversible_event_digest
      - irreversible_content_digest
      - attempt
      - controlled_error_class
      - irreversible_error_digest
      - dead_lettered_at
    dead_letter_prohibited:
      - account_id
      - user_id
      - persona_ids
      - raw_payload
      - raw_error
    recovery: source_stream_pending_reference_only
    logs: digest_only
description: 实时音视频通话信令编排、媒体房间管理、媒体访问凭据签发、屏幕共享控制
externalDependencies:
  - capability: rtc.room.transport
    port: MediaTransportPort
    operations: [createRoom, closeRoom, issueParticipantAccess, listParticipants, removeParticipant]
    conformance: rtc_transport
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [publishEphemeral, appendDurable]
    scenes: [general, realtime]
api_routes:
  - method: POST
    path: /rtc/calls
    operation: InitiateCall
    request_entity: RtcInitiateCallCommand
    request_body_kind: object
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: CallLifecycleCommandFacet
      method: initiateCall
      aggregate_owner: CallSession
      mutation_target: CallSession
      invariant_target: CallSession
    description: 发起通话（一次创建：CallSession + 媒体房间 + 发起方媒体访问凭据 + 来电通知；同 actor 活跃通话唯一约束防双呼）
    response_fields:
      - session
      - mediaAccess
    client_contract:
      dart_import: ../rtc/call_session_contracts.dart
      response_type: RtcInitiateCallResultDto
      response_decoder: decodeRtcInitiateCallResult
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - RTC.USER.invalid_argument
      - RTC.USER.unauthorized
      - RTC.USER.account_security_denied
      - RTC.USER.already_in_call
      - RTC.USER.not_mutual
      - RTC.USER.blocked
      - RTC.USER.idempotency_conflict
      - RTC.SYSTEM.media_transport_unavailable
      - RTC.SYSTEM.account_security_unavailable
      - RTC.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: rtc_call_lifecycle_command
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
        - replayed
    slo:
      latency_p95_ms: 300
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: initiator_self
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
