contract_test:
  test_strategy:
    service_side:
      description: 使用真实测试数据库与 operation guard 在链的鉴权中间件，媒体房间通过 mock adapter
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: miniredis/v2
      spy_targets:
        - event_publisher
      mock_targets:
        - livekit_adapter
        - cross_service_clients
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: DeleteMany for call_sessions / call_session_command_receipts / call_session_outbox
        redis_cleanup: miniredis.FlushAll()
      scenarios:
        - name: full_1v1_call_lifecycle
          commands:
            - InitiateCall
            - AnswerCall
            - ReportMediaConnected(caller)
            - ReportMediaConnected(callee)
            - HangupCall
          seed: []
          assertions:
            - db.call_sessions.FindOne({_id}).status → ringing → connecting → in_call → ended
            - eventSpy.AssertPublished('CallInitiated')
            - eventSpy.AssertPublished('CallAnswered')
            - eventSpy.AssertPublished('CallConnected')
            - 'eventSpy.AssertPublished(''CallEnded'', {endReason: ''normal''})'
            - livekitMock.AssertCreateRoom(callId)
            - livekitMock.AssertDeleteRoom(callId)
        - name: server_owned_cas_and_noop_receipt
          commands:
            - ToggleMute(muted=true)
            - ToggleMute(muted=true
            - new key)
            - HangupCall
            - HangupCall(new key)
          assertions:
            - request 不携带版本字段，纯 CAS 冲突由服务端重载重放
            - 目标状态已满足的命名意图持久化 no-op receipt 且不递增 aggregate version
            - 同一 Idempotency-Key 重放返回原始结果
        - name: call_no_answer_timeout
          commands:
            - InitiateCall
            - RingTimeout(1v1=30s
            - group=60s)
          assertions:
            - db.call_sessions.FindOne({_id}).status → ended
            - db.call_sessions.FindOne({_id}).endReason → no_answer
            - 'db.call_session_command_receipts.FindOne({commandName: ''RingTimeout''}) exists'
            - 'db.call_session_outbox.FindOne({eventType: ''CallEnded''}).payload.type → call.ended'
        - name: group_call_32_limit
          commands:
            - InitiateCall(32 targets)
            - JoinCall(33rd)
          assertions:
            - 'error returned: call_full'
            - db.call_sessions.FindOne({_id}).participantCount → 32
        - name: concurrent_initiate_500
          description: 500 并发发起通话基准测试
          assertions:
            - p95 latency < 200ms
            - error rate < 1%
  coverage_requirements:
    - 全状态机路径覆盖（initiated→ringing→connecting→in_call→ended × 7 种 endReason）
    - 多人通话 join/leave/invite 全路径
    - ReportMediaConnected 的 connecting→connected、≥2 人进入 in_call 与目标态 no-op
    - 32 人上限边界测试
    - 屏幕共享互斥测试
    - 服务端内部 CAS 有限重放与 no-op receipt 幂等
    - operation guard 与 auth 中间件在链的越权负例（非参与者 403/404）
    - 500 并发基准测试
