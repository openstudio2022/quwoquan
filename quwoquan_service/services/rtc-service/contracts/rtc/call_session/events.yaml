description: CallSession 消费 UserAccount 安全终态事件并幂等终止受影响通话；通话生命周期事件经 transactional outbox 发布，由下游对象各自的 object.yaml.lifecycle.source_events 单轨声明消费。
events:
- name: CallInitiated
  description: 通话发起（发起方创建 CallSession + 媒体 Room）
  delivery_semantics: transactional_outbox
  wire_event_type: CallInitiated
  topic: rt:rtc:persona:{participantPersonaId}
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - callType
  - initiatorId
  - initiatorRingtoneId
  - conversationId
  - circleId
  - maxParticipants
  - createdAt
  client_ws_type: call.initiated
- name: CallRinging
  description: '来电振铃（被邀请人收到来电通知）

    非 canonical 结构字段迁移注记：realtime_channel="rt:rtc:persona:{targetPersonaId}"；delivery_identity="sha256(callId + ''\\x00''
    + targetPersonaId)"；telemetry={"metric":"rtc_call_outbox_relay_total","labels":["event_type","transport","outcome"]}；expiry_policy={"one_to_one_seconds":30,"group_seconds":60}；push_policy={"coordinator":"notification-service","online":"realtime_then_presentation_ack","presentation_ack_grace_ms":750,"offline_ios":"voip_push","offline_android":"fcm_high_priority_full_screen_intent","description":"notification-service
    按设备 PresenceView 单选投递：在线先走 realtime，750ms 内 收到设备级 presentation ACK 即结束；未 ACK 或离线才进入 iOS VoIP Push / Android FCM 高优先级队列。Web
    Push 不属于 M2。","payload_contract":"realtime 来电帧保留 callerAvatarUrl；移动 provider 外送按 integration PushDeliveryRequest 只含 action、endpointRef、deliveryKey、callId、
    targetPersonaId、callType、callerName、sourceLabel、trustRelation、 expiresAt 与 occurredAt，禁止携带 endpoint token。CallAnswered/CallEnded
    对已展示或已提交 ring 的 endpoint 发送同 deliveryKey 的 action=cancel； 终端必须结束来电面并压制乱序迟到 ring。"}。'
  delivery_semantics: transactional_outbox
  wire_event_type: CallRinging
  topic: events.rtc.call_ringing
  payload_entity: CallEventPayload
  payload_fields:
  - eventId
  - callId
  - targetPersonaId
  - callType
  - callerName
  - callerAvatarUrl
  - sourceLabel
  - trustRelation
  - expiresAt
  - deliveryKey
  client_ws_type: call.ringing
  client_payload_defaults:
    callType: audio
- name: CallAnswered
  description: '通话接听（参与者进入 connecting 状态）

    非 canonical 结构字段迁移注记：realtime_channel="rt:rtc:persona:{participantPersonaId}"；telemetry={"metric":"rtc_call_outbox_relay_total","labels":["event_type","transport","outcome"]}。'
  delivery_semantics: transactional_outbox
  wire_event_type: CallAnswered
  topic: events.rtc.call_answered
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - userId
  client_ws_type: call.answered
- name: CallConnected
  description: 媒体建连成功（ICE+DTLS 完成，参与者 connected）
  delivery_semantics: transactional_outbox
  wire_event_type: CallConnected
  topic: rt:rtc:persona:{participantPersonaId}
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - userId
  - participantCount
  client_ws_type: call.connected
- name: CallEnded
  description: '通话结束（所有参与者离开、主动挂断或账号安全终态收回媒体房间）；account_closed/account_suspended 仅表达终态原因，不携带被处置账号或 Persona 标识。

    非 canonical 结构字段迁移注记：realtime_channel="rt:rtc:persona:{participantPersonaId}"；telemetry={"metric":"rtc_call_outbox_relay_total","labels":["event_type","transport","outcome"]}；chat_integration={"description":"chat-service
    消费此事件，在关联会话中插入通话记录消息（type=system_call_log）"}。'
  delivery_semantics: transactional_outbox
  wire_event_type: CallEnded
  topic: events.rtc.call_ended
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - callType
  - initiatorId
  - conversationId
  - endReason
  - durationMs
  - participantCount
  - startedAt
  - endedAt
  client_ws_type: call.ended
- name: ParticipantJoined
  description: 参与者加入通话（多人模式）
  delivery_semantics: transactional_outbox
  wire_event_type: ParticipantJoined
  topic: rt:rtc:persona:{participantPersonaId}
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - userId
  - role
  - participantCount
  client_ws_type: participant.joined
- name: ParticipantLeft
  description: 参与者离开通话
  delivery_semantics: transactional_outbox
  wire_event_type: ParticipantLeft
  topic: rt:rtc:persona:{participantPersonaId}
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - userId
  - participantCount
  client_ws_type: participant.left
- name: ScreenShareStarted
  description: 屏幕共享开始
  delivery_semantics: transactional_outbox
  wire_event_type: ScreenShareStarted
  topic: rt:rtc:persona:{participantPersonaId}
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - userId
  client_ws_type: screen_share.started
- name: ScreenShareStopped
  description: 屏幕共享停止
  delivery_semantics: transactional_outbox
  wire_event_type: ScreenShareStopped
  topic: rt:rtc:persona:{participantPersonaId}
  payload_entity: CallEventPayload
  payload_fields:
  - callId
  - userId
  client_ws_type: screen_share.stopped
