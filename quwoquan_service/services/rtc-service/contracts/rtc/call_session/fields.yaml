      constraints:
      - NOT_NULL
      client_default: ''
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      role: authoritative_state
    - name: role
      source: role
      type: enum
      enum_ref: ParticipantRole
      constraints:
      - NOT_NULL
      client_default: invitee
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: initiator/invitee
      role: authoritative_state
    - name: status
      source: status
      type: enum
      enum_ref: ParticipantStatus
      constraints:
      - NOT_NULL
      client_default: invited
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: invited/ringing/connecting/connected/left/timeout
      role: authoritative_state
    - name: isMuted
      source: isMuted
      type: bool
      constraints:
      - NOT_NULL
      client_default: 'false'
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      role: authoritative_state
    - name: isCameraOn
      source: isCameraOn
      type: bool
      constraints:
      - NOT_NULL
      client_default: 'true'
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      role: authoritative_state
    - name: joinedAt
      source: joinedAt
      type: datetime
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      role: authoritative_state
    - name: leftAt
      source: leftAt
      type: datetime
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      role: authoritative_state
    - name: inviteStatus
      source: inviteStatus
      type: enum
      enum_ref: CallInviteStatus
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: 邀请生命周期状态（加人/链接入会结果反馈）
      role: authoritative_state
    - name: invitedBy
      source: invitedBy
      type: string
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
