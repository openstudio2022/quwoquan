description: 通话会话（聚合根）
fields:
- name: _id
  source: _id
  type: string
  constraints:
  - PK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  client_dart_name: callId
  description: RFC 4122 UUID；同时作为 iOS CallKit / Android Telecom 的稳定通话标识
  role: authoritative_state
- name: callType
  source: callType
  type: enum
  enum_ref: CallType
  constraints:
  - NOT_NULL
  client_default: audio
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: audio/video
  role: authoritative_state
- name: status
  source: status
  type: enum
  enum_ref: CallStatus
  constraints:
  - NOT_NULL
  client_default: initiated
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 通话状态
  role: authoritative_state
- name: initiatorId
  source: initiatorId
  type: string
  constraints:
  - NOT_NULL
  client_default: ''
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 发起者 userId
  role: authoritative_state
  reference: true
- name: initiatorRingtoneId
  source: initiatorRingtoneId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 发起通话时快照的发起方官方呼叫铃声 ID；群邀请后续加人沿用该值
  role: authoritative_state
  reference: true
- name: conversationId
  source: conversationId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 关联会话（来自哪个聊天发起的通话）
  role: authoritative_state
  reference: true
- name: circleId
  source: circleId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 关联圈子（圈子通话入口）
  role: authoritative_state
  reference: true
- name: roomId
  source: roomId
  type: string
  constraints:
  - NOT_NULL
  client_default: ''
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 媒体房间 ID
  role: authoritative_state
- name: maxParticipants
  source: maxParticipants
  type: int
  constraints:
  - NOT_NULL
  client_default: '32'
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 最大参与人数（1v1=2, 多人≤32）
  role: authoritative_state
- name: participantCount
  source: participantCount
  type: int
  constraints:
  - NOT_NULL
  client_default: '0'
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 当前参与人数
  role: authoritative_state
- name: participants
  source: participants
  type: embedded_list
  item_entity: CallParticipant
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: API JSON 嵌入参与者列表（非存储字段，客户端 DTO 合成）
  role: owned_value
- name: isScreenSharing
  source: isScreenSharing
  type: bool
  constraints:
  - NOT_NULL
  client_default: 'false'
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 是否有人正在共享屏幕
  role: authoritative_state
- name: screenShareUserId
  source: screenShareUserId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 当前屏幕共享者 userId
  role: authoritative_state
- name: endReason
  source: endReason
  type: enum
  enum_ref: EndReason
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 通话结束原因
  role: authoritative_state
- name: durationMs
  source: durationMs
  type: long
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 通话时长（毫秒，通话结束后写入）
  role: authoritative_state
- name: startedAt
  source: startedAt
  type: datetime
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 通话建连时间（至少两个参与者 connected、会话首次进入 in_call 时）
  role: authoritative_state
- name: endedAt
  source: endedAt
  type: datetime
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 通话结束时间
  role: authoritative_state
- name: createdAt
  source: createdAt
  type: datetime
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: updatedAt
  source: updatedAt
  type: datetime
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
members:
  CallParticipant:
    kind: owned_entity
    fields:
    - name: userId
