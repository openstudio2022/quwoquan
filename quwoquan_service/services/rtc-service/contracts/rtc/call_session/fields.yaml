      role: authoritative_state
    description: 通话参与者（嵌入 CallSession）
types:
  RtcAccountClosureDeadLetterRecoveryRequest:
    description: operator 释放 RTC 账号安全 terminal marker 的强类型命令；只接受 Redis source PEL 坐标。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: write
      ops_exposure: write
  RtcAccountClosureDeadLetterRecoveryAccepted:
    description: RTC 账号安全 source PEL 已受理重新消费。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - PK
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: recoveryAccepted
      source: recoveryAccepted
      type: bool
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  CallParticipant:
    description: 通话参与者（嵌入 CallSession）
    fields:
    - name: userId
      source: userId
      type: string
      constraints:
      - NOT_NULL
      client_default: ''
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: role
      source: role
      type: enum
      enum_ref: ParticipantRole
      constraints:
      - NOT_NULL
      client_default: invitee
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: initiator/invitee
    - name: status
      source: status
      type: enum
      enum_ref: ParticipantStatus
      constraints:
      - NOT_NULL
      client_default: invited
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: invited/ringing/connecting/connected/left/timeout
    - name: isMuted
      source: isMuted
      type: bool
      constraints:
      - NOT_NULL
      client_default: 'false'
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: isCameraOn
      source: isCameraOn
      type: bool
      constraints:
      - NOT_NULL
      client_default: 'true'
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: joinedAt
      source: joinedAt
      type: datetime
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: leftAt
      source: leftAt
      type: datetime
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: inviteStatus
      source: inviteStatus
      type: enum
      enum_ref: CallInviteStatus
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: 邀请生命周期状态（加人/链接入会结果反馈）
    - name: invitedBy
      source: invitedBy
      type: string
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: 邀请发起者 userId（区分原始发起人与会中加人邀请方）
enums:
  CallType:
    values:
    - audio
    - video
    description: 通话类型
  CallStatus:
    values:
    - initiated
    - ringing
    - connecting
    - in_call
    - ended
    description: 通话状态机
  EndReason:
    values:
    - normal
    - cancelled
    - rejected
    - no_answer
    - error
    - timeout
    - last_leave
    - account_closed
    - account_suspended
    description: 通话结束原因
  ParticipantRole:
    values:
    - initiator
    - invitee
    description: 参与者角色
  ParticipantStatus:
    values:
    - invited
    - ringing
    - connecting
    - connected
    - left
    - timeout
    description: 参与者状态
  TrustRelation:
    values:
    - known
    - possibly_unknown
    description: 信任关系两态：known=联系人/同好/当前会话或群成员（可信）； possibly_unknown=其他群成员/链接加入者/无共同关系者（提示注意隐私）。富信息（共同关注的人数量等）后续增强。
  CallInviteStatus:
    values:
    - pending
    - ringing
    - accepted
    - declined
    - expired
    - cancelled
    description: 通话邀请生命周期状态（用于通话中加人/链接入会的结果反馈）
