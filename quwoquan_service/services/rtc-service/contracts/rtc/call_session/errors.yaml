domain: RTC
aggregate: CallSession
description: 'rtc 域结构化错误码声明。格式：MODULE.KIND.REASON。

  codegen 从本文件生成 Dart RtcErrorCode enum + RtcErrorMessages，

  以及 Go errors.go 常量。

  '
errors:
- code: RTC.USER.invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
    - InviteToCall
    - ToggleMute
    - ToggleCamera
    - RecoverRtcAccountClosureDeadLetter
  recovery_action: surface
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 通话操作请求格式无效
    en: Invalid RTC operation request
- code: RTC.USER.call_not_found
  kind: USER
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations:
    - AnswerCall
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - GetCall
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
  recovery_action: surface
  dart_const: callNotFound
  go_const: ErrCallNotFound
  user_message:
    zh: 通话不存在
    en: Call not found
- code: RTC.USER.unauthorized
  kind: USER
  reason: unauthorized
  http_status: 401
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
    - AnswerCall
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
    - RecoverRtcAccountClosureDeadLetter
  recovery_action: surface
  dart_const: unauthorized
  go_const: ErrUnauthorized
  user_message:
    zh: 请先登录
    en: Please sign in
- code: RTC.USER.account_security_denied
  kind: USER
  reason: unauthorized
  http_status: 401
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
    - AnswerCall
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - GetCall
    - ListCalls
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
  recovery_action: surface
  dart_const: accountSecurityDenied
  go_const: ErrAccountSecurityDenied
  user_message:
    zh: 登录凭据已失效，请重新登录
    en: Your sign-in credential is no longer valid
- code: RTC.USER.already_in_call
  kind: USER
  reason: conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
  recovery_action: surface
  dart_const: alreadyInCall
  go_const: ErrAlreadyInCall
  user_message:
    zh: 你正在通话中，请先结束当前通话
    en: You are already in a call
- code: RTC.USER.call_full
  kind: USER
  reason: limit_exceeded
  http_status: 409
  emitted_by:
  - surface: http
    operations:
    - JoinCall
    - InviteToCall
  recovery_action: surface
  dart_const: callFull
  go_const: ErrCallFull
  user_message:
    zh: 通话人数已达上限
    en: Call is full
- code: RTC.USER.call_ended
  kind: USER
  reason: invalid_state
  http_status: 410
  emitted_by:
  - surface: http
    operations:
    - AnswerCall
    - JoinCall
  recovery_action: surface
  dart_const: callEnded
  go_const: ErrCallEnded
  user_message:
    zh: 通话已结束
    en: Call has ended
- code: RTC.USER.not_participant
  kind: USER
  reason: forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations:
    - AnswerCall
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - GetCall
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
  recovery_action: surface
  dart_const: notParticipant
  go_const: ErrNotParticipant
  user_message:
    zh: 你不是该通话的参与者
    en: You are not a participant of this call
- code: RTC.USER.not_mutual
  kind: USER
  reason: forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
  recovery_action: surface
  dart_const: notMutual
  go_const: ErrNotMutual
  user_message:
    zh: 互相关注后可发起 1 对 1 实时通话
    en: Mutual follow is required to start a 1-on-1 realtime call
- code: RTC.USER.blocked
  kind: USER
  reason: forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
  recovery_action: surface
  dart_const: blocked
  go_const: ErrBlocked
  user_message:
    zh: 当前关系不允许发起通话
    en: Current relationship does not allow calling
- code: RTC.USER.cannot_answer
  kind: USER
  reason: invalid_state
  http_status: 409
  emitted_by:
  - surface: http
    operations:
    - AnswerCall
  recovery_action: surface
  dart_const: cannotAnswer
  go_const: ErrCannotAnswer
  user_message:
    zh: 无法接听，通话状态异常
    en: Cannot answer, invalid call state
- code: RTC.USER.invalid_call_action
  kind: USER
  reason: invalid_state
  http_status: 409
  emitted_by:
  - surface: http
    operations:
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
  recovery_action: surface
  dart_const: invalidCallAction
  go_const: ErrInvalidCallAction
  user_message:
    zh: 当前通话状态无法执行该操作
    en: This action is not allowed in the current call state
- code: RTC.USER.screen_share_conflict
  kind: USER
  reason: conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations:
    - StartScreenShare
    - StopScreenShare
  recovery_action: surface
  dart_const: screenShareConflict
  go_const: ErrScreenShareConflict
  user_message:
    zh: 已有参与者正在共享屏幕
    en: Another participant is already sharing screen
- code: RTC.USER.idempotency_conflict
  kind: USER
  reason: idempotency_conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
    - AnswerCall
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
  recovery_action: surface
  dart_const: idempotencyConflict
  go_const: ErrIdempotencyConflict
  user_message:
    zh: 请求重复且内容不一致，请重新发起
    en: Duplicate request with different content
- code: RTC.SYSTEM.media_transport_unavailable
  kind: SYSTEM
  reason: upstream_error
  http_status: 503
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
    - AnswerCall
    - JoinCall
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: mediaTransportUnavailable
  go_const: ErrMediaTransportUnavailable
  user_message:
    zh: 通话服务暂时不可用，请稍后重试
    en: Call service temporarily unavailable
- code: RTC.SYSTEM.account_security_unavailable
  kind: SYSTEM
  reason: upstream_error
  http_status: 503
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
    - AnswerCall
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - GetCall
    - ListCalls
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: accountSecurityUnavailable
  go_const: ErrAccountSecurityUnavailable
  user_message:
    zh: 账号安全校验暂不可用，请稍后重试
    en: Account security verification is temporarily unavailable
- code: RTC.SYSTEM.internal_error
  kind: SYSTEM
  reason: internal_error
  http_status: 500
  emitted_by:
  - surface: http
    operations:
    - InitiateCall
    - AnswerCall
    - RejectCall
    - CancelCall
    - HangupCall
    - JoinCall
    - LeaveCall
    - ReportMediaConnected
    - InviteToCall
    - GetCall
    - ListCalls
    - ToggleMute
    - ToggleCamera
    - StartScreenShare
    - StopScreenShare
    - RecoverRtcAccountClosureDeadLetter
  recovery_action: surface
  dart_const: internalError
  go_const: ErrInternalError
  user_message:
    zh: 通话服务异常，请稍后重试
    en: Call service error, please try again
