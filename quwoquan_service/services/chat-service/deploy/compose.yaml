# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  chat-service:
    image: "${QWQ_COMPOSE_CHAT_SERVICE_IMAGE:?fixed chat-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/chat-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: chat-service
      MODULE_PACKAGE: chat-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${QWQ_COMPOSE_CHAT_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_CHAT_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      CHAT_SERVICE_ADDR: ":18081"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: quwoquan_chat
      CHAT_REDIS_REALTIME_ADDR: redis:6379
      CHAT_REDIS_GENERAL_ADDR: redis:6379
      CHAT_REDIS_RELIABLE_TASK_ADDR: redis:6379
      RELIABLE_TASK_READY_INDEX_ENABLED: "true"
      RELIABLE_TASK_READY_INDEX_STREAM: reliabletask:chat:avatar:ready:local-gamma
      RELIABLE_TASK_READY_INDEX_GROUP: chat.group_avatar_worker.local-gamma
      RELIABLE_TASK_READY_INDEX_QUEUE: reliabletask.chat.avatar
      CHAT_GROUP_AVATAR_CDN_BASE_URL: "${QWQ_COMPOSE_MEDIA_AVATAR_BASE_URL:?QWQ_COMPOSE_MEDIA_AVATAR_BASE_URL is required}"
      CHAT_GROUP_AVATAR_LOCAL_MEDIA_ROOT: /var/lib/quwoquan/chat-media
      USER_SERVICE_BASE_URL: http://user-service:18081
      CIRCLE_SERVICE_BASE_URL: http://circle-service:18082
      CONTENT_SERVICE_BASE_URL: http://content-service:18080
      RUNTIME_SYNC_PATCH_TTL_HOURS: "720"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      content-service:
        condition: service_healthy
    ports:
      - "${QWQ_COMPOSE_CHAT_PORT:-19200}:18081"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${QWQ_COMPOSE_MEDIA_ROOT:-../../../.qwq_output/env/gamma/local/gamma-local/cache/media}:/var/lib/quwoquan/chat-media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18081/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
