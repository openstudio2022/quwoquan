contract_test:
  mock_strategy:
    app_side:
      mock_target: chat-service API
      data_source: fields.yaml
      scenarios:
      - name: conversation_list
        route: GET /chat/conversations
        assertions:
        - status_200
        - items_match_schema
        - sorted_by_last_message_time
        - maxSeq_present
      - name: inbox_list
        route: GET /chat/inbox
        assertions:
        - status_200
        - items_match_schema
        - sorted_by_pinned_then_last_message_time
        - unread_and_mention_counts_present
      - name: group_chat_lifecycle
        routes:
        - POST /chat/conversations
        - POST /chat/conversations/{id}/members
        - DELETE /chat/conversations/{id}/members/{uid}
        assertions:
        - group_created
        - member_added
        - member_removed
        - memberCount_updated
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: miniredis/v2
      spy_targets:
      - event_publisher
      mock_targets:
      - cross_service_clients
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: DeleteMany for conversations, conversations_command_receipts, conversations_outbox, messages,
          messages_sequences, messages_command_receipts, messages_outbox, messages_outbox_sequences, messages_projection_checkpoints,
          conversation_memberships, conversation_memberships_command_receipts, conversation_memberships_outbox,
          conversation_user_states, conversation_user_states_command_receipts, conversation_user_states_outbox,
          message_receipts, chat_projection_checkpoints, chat_aggregate_outbox_sequences
        redis_cleanup: miniredis.FlushAll()
      scenarios:
      - name: create_direct_conversation_unique
        command: CreateConversation (direct, duplicate participants)
        assertions:
        - second create returns existing conversation id
        - db.conversations.CountDocuments({type:'direct', participants}) → 1
      - name: dissolve_conversation_noop_replay
        command: DissolveConversation (repeat with same Idempotency-Key)
        assertions:
        - first call archives conversation and writes receipt + outbox in one transaction
        - replay returns original receipt without new outbox event
  coverage_requirements:
  - all public conversation types (direct/group/encrypted) covered
  - CircleGroup binding is provisioned only from durable events; public CreateConversation rejects all
    binding/source fields
  - governance commands write state/receipt/outbox in one transaction
  - receipt enabled/disabled paths
