    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: '「从群聊/圈子中选择联系人」来源列表（图四）。返回当前用户所在、且含与当前用户互关联系人的群会话，并给出每个群的互关好友数 friendMemberCount。

      由 chat-service 聚合会话成员与关系能力（relationship gate）计算交集，friendMemberCount==0 的群不返回；前端不得再自行多次拉取成员逐群求交集。

      可选 source=group 仅返回 circleId 为空的私建群，source=circle 仅返回 circleId 非空的圈子绑定群；其它值拒绝，避免端侧分页后过滤导致来源漏项。

      响应使用 `items + nextCursor` keyset Slice；cursor、source 和 query 必须在服务端同一读取链路中处理，端侧仅可顺序追加后续页。

'
    response_entity: SelectableGroupConversationPageSlice
    response_body: SelectableGroupConversationRow
    response_body_kind: page
    error_codes:
      - CHAT.USER.unauthorized
      - CHAT.USER.invalid_argument
      - CHAT.SYSTEM.internal_error
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ChatListSelectableGroupConversationsQuery
    request_body_kind: none
