commercial_defaults:
  status: blocked
  block_reason: operation 尚未逐项完成商业证据绑定
  gap_id: CHAT_CONVERSATION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 会话管理、消息收发（seq 有序 + clientMsgId 幂等）、讨论成员、离线同步、已读回执、小趣助手会话内参与
externalDependencies:
  - role: owner
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [publishEphemeral, subscribeEphemeral, appendDurable, consumeDurable]
    scenes: [general, realtime]
    conformance: redis_message_transport
    adapterContracts:
      infra.redis.message_transport:
        endpointEnvs: {}
        secretRefs: []
        defaultTimeoutMs: 5000
    observability:
      metrics:
        - pending_lag
        - dead_letter
        - publish_p95
        - consume_p95
