- method: POST
  path: /chat/conversations
  operation: CreateConversation
  actor: persona
  commercial:
    status: ready
  application:
    kind: command
    facet: ConversationLifecycleCommandFacet
    method: createConversation
    aggregate_owner: Conversation
    mutation_target: Conversation
    invariant_target: Conversation
  authorization:
    principal: persona
    ownership_policy: self
  reliability:
    timeout_ms: 3000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  privacy:
    request_classification: SENSITIVE
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: chat_conversation_command
    trace: true
    attributes:
    - operation
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  description: '创建私信、私密群或加密会话，并自动创建 ConversationMember + ConversationUserState。

    direct 会话按参与者对唯一：重复创建返回既有会话；group 创建以 Idempotency-Key receipt 保证重放返回首个会话。

    group 的 maxGroupSize 缺省为 1000 且不可超过 1000；direct/encrypted 固定为 2。

    CircleGroup 绑定会话仅由 circle-service durable event provisioner 创建；调用方不得提交 circleId、circleGroupId、

    originType、bindingType 或 lifecyclePolicy。

    '
  request_entity: Conversation
  writable_fields:
  - type
  - title
  - maxGroupSize
  - initialMemberIds
  response_body: ChatConversation
  response_body_kind: object
  client_contract:
    dart_import: ../chat/conversation_contracts.dart
    request_type: ChatCreateConversationCommand
    response_type: ChatConversation
    request_encoder: encodeChatCreateConversationCommand
    response_decoder: decodeChatConversation
  error_codes:
  - CHAT.USER.unauthorized
  - CHAT.USER.invalid_argument
  - CHAT.USER.circle_group_binding_write_forbidden
  - CHAT.USER.not_mutual
  - CHAT.USER.greeting_required
  - CHAT.USER.blocked
  - CHAT.USER.group_member_not_mutual
  - CHAT.USER.group_member_blocked
  - CHAT.USER.group_full
  - CHAT.USER.conversation_idempotency_conflict
  - CHAT.SYSTEM.internal_error
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
