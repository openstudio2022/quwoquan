kind: aggregate_root
description: '会话聚合。直聊/群聊/圈子聊/加密四种会话类型。

  助手（小趣）不再是独立会话类型，而是作为特殊成员（memberType=assistant）

  可被邀请到任意会话中，帮助处理聊天中的信息（总结、翻译、问答等）。

  成员通过独立 ConversationMember collection 支撑大群，

  用户级设置拆分为独立 ConversationUserState collection（消除写放大），

  Message seq、幂等回执与 outbox 由 Message Store 在同一 MongoDB transaction 中提交。

  Conversation 只保留可由 Message 事件重建的摘要投影。

  '
identity:
  fields:
  - id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: circleGroup
  on_delete: detach
  reference_fields:
  - circleGroupId
  target_object: circle.CircleGroup
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: circle
  on_delete: detach
  reference_fields:
  - circleId
  target_object: circle.Circle
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: creatorPersona
  on_delete: retain
  reference_fields:
  - creatorId
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: announcementUpdaterPersona
  on_delete: retain
  reference_fields:
  - announcementUpdatedBy
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: homepage
  on_delete: detach
  reference_fields:
  - entityId
  target_object: entity.Homepage
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: groupAvatarAsset
  on_delete: detach
  reference_fields:
  - groupAvatarAssetId
  target_object: content.MediaAsset
- access: named_reader
  cardinality: N:N
  consistency: eventual
  kind: reference
  name: initialMembers
  on_delete: retain
  reference_fields:
  - initialMemberIds
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: lastMessage
  on_delete: detach
  reference_fields:
  - lastMessageId
  target_object: chat.Message
- access: command_facade
  cardinality: 1:1
  consistency: eventual
  kind: reference
  name: gathering
  on_delete: retain
  reference_fields:
  - gatheringId
  target_object: circle.Gathering
local_identity_reasons:
  gatheringSourceEventId: immutable source-event idempotency and conflict coordinate for the monotonic
    Gathering projection watermark; it is not Conversation identity or a business-object reference
  originRequestId: immutable correlation or idempotency key scoped to this fact or command; it is not
    a business-object reference
taggable: true
vector_enabled: false
business_rules:
- type、creatorId 与 origin binding 创建后不可变
- Conversation 只管理会话身份、标题、策略和生命周期
- circleGroupId 非空时必须一对一绑定 active CircleGroup；绑定只可由 CircleGroupCreated 的 durable event provisioner 写入，普通
  HTTP 创建命令不得提交 circleId 或 circleGroupId
- CircleGroupMembership 的 active、left、removed、role_changed 与 CircleGroupArchived 仅由 durable projector
  写入对应 Conversation 成员、用户态与终态；圈群成员治理不接受 Chat HTTP 旁路
- gatheringId 非空时必须一对一绑定 Gathering；仅接受 circle-service 受信任幂等投影命令，普通 CreateConversation 不得写入
- Gathering room/access/posting 投影以 gatheringSourceVersion 单调收敛；旧版本为 no-op，同版本不同事实 fail-closed
- Gathering capacity 不进入 Chat 席位裁决；活动 room 始终为 group，ConversationMembership 仅表达 Chat access
- accessMode=read_only 或 postingPolicy=announcements_only 时公开 SendMessage 禁止写入；Announcement 继续复用 Chat owner 命令
- 成员、用户状态与 Message 分别由其聚合维护
- maxSeq 只由 MessageCommitted 事件单调推进，不由客户端提交
- dissolved 为终态且通过 outbox 通知成员与投影收敛
lifecycle:
  state_field: status
  states:
  - active
  - dissolved
  optimistic_concurrency: version
  idempotency: command_receipt
  source_events:
  - circle.circle_group.CircleGroupCreated
  - circle.circle_group.CircleGroupArchived
  - user.user_account.UserAvatarUpdated
  event_consumers:
  - name: ProjectCircleGroupConversation
    kind: event_handler
    facet: CircleGroupConversationProjectionHandler
    method: apply
    idempotency: event_id
  - name: ConsumeUserAvatarUpdated
    kind: event_handler
    facet: UserAvatarUpdateConsumer
    method: handleMessage
    idempotency: identity_payload_digest
