domain: CHAT
aggregate: Conversation
description: 'chat 域结构化错误码声明。格式：MODULE.KIND.REASON。

  codegen 从本文件生成 Dart ChatErrorCode enum + ChatErrorMessages，

  以及 Go errors.go 常量。

  '
errors:
- code: CHAT.USER.invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 请求参数无效
    en: Request parameters are invalid
- code: CHAT.USER.circle_group_binding_write_forbidden
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: circleGroupBindingWriteForbidden
  go_const: ErrCircleGroupBindingWriteForbidden
  user_message:
    zh: 圈群绑定只能由系统创建
    en: Circle group bindings can only be created by the system
- code: CHAT.USER.conversation_not_found
  kind: USER
  reason: not_found
  http_status: 404
  recovery_action: surface
  dart_const: conversationNotFound
  go_const: ErrConversationNotFound
  user_message:
    zh: 会话不存在
    en: Conversation not found
- code: CHAT.USER.unauthorized
  kind: USER
  reason: unauthorized
  http_status: 401
  recovery_action: surface
  dart_const: unauthorized
  go_const: ErrUnauthorized
  user_message:
    zh: 请先登录
    en: Please sign in
- code: CHAT.USER.message_not_found
  kind: USER
  reason: not_found
  http_status: 404
  recovery_action: surface
  dart_const: messageNotFound
  go_const: ErrMessageNotFound
  user_message:
    zh: 消息不存在
    en: Message not found
- code: CHAT.USER.message_recall_forbidden
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: messageRecallForbidden
  go_const: ErrMessageRecallForbidden
  user_message:
    zh: 只能撤回自己发送的消息
    en: Only the sender can recall a message
- code: CHAT.USER.message_recall_expired
  kind: USER
  reason: conflict
  http_status: 409
  recovery_action: surface
  dart_const: messageRecallExpired
  go_const: ErrMessageRecallExpired
  user_message:
    zh: 消息已超过可撤回时间
    en: Message recall window has expired
- code: CHAT.USER.message_idempotency_conflict
  kind: USER
  reason: conflict
  http_status: 409
  recovery_action: surface
  dart_const: messageIdempotencyConflict
  go_const: ErrMessageIdempotencyConflict
  user_message:
    zh: 该消息请求标识已用于不同内容，请重新发送
    en: This message request identifier was already used for different content
- code: CHAT.USER.conversation_idempotency_conflict
  kind: USER
  reason: idempotency_conflict
  http_status: 409
  recovery_action: surface
  dart_const: conversationIdempotencyConflict
  go_const: ErrConversationIdempotencyConflict
  user_message:
    zh: 该建群请求标识已用于不同内容，请重新发起
    en: This conversation request identifier was already used for different content
- code: CHAT.USER.message_too_long
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: messageTooLong
  go_const: ErrMessageTooLong
  user_message:
    zh: 消息内容超出长度限制
    en: Message exceeds length limit
- code: CHAT.USER.message_invalid
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: messageInvalid
  go_const: ErrMessageInvalid
  user_message:
    zh: 消息内容不符合发送要求，请检查后重试
    en: Message content is invalid; review it and try again
- code: CHAT.USER.message_media_invalid
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: messageMediaInvalid
  go_const: ErrMessageMediaInvalid
  user_message:
    zh: 消息媒体不可用，请重新上传后再发送
    en: Message media is invalid; upload it again before sending
- code: CHAT.SYSTEM.message_media_unavailable
  kind: SYSTEM
  reason: dependency_unavailable
  http_status: 503
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: messageMediaUnavailable
  go_const: ErrMessageMediaUnavailable
  user_message:
    zh: 媒体服务暂时不可用，请稍后重试
    en: Media service is temporarily unavailable; try again later
- code: CHAT.USER.rate_limited
  kind: USER
  reason: rate_limited
  http_status: 429
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: rateLimited
  go_const: ErrRateLimited
  user_message:
    zh: 发送太频繁，请稍后重试
    en: Sending too frequently, please wait
- code: CHAT.USER.not_mutual
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: notMutual
  go_const: ErrNotMutual
  user_message:
    zh: 互相关注后可进入正式私信
    en: Mutual follow is required to enter a formal direct conversation
- code: CHAT.USER.greeting_required
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: greetingRequired
  go_const: ErrGreetingRequired
  user_message:
    zh: 请先打招呼，等对方回复后再进入正式私信
    en: Send a greeting first and wait for a reply before entering formal direct conversation
- code: CHAT.USER.blocked
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: blocked
  go_const: ErrBlocked
  user_message:
    zh: 当前状态不能继续发送消息
    en: Current relationship does not allow messaging
- code: CHAT.USER.group_member_not_mutual
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: groupMemberNotMutual
  go_const: ErrGroupMemberNotMutual
  user_message:
    zh: 只能邀请互相关注的好友加入群聊
    en: Only mutually-followed friends can be invited to a group
- code: CHAT.USER.group_member_blocked
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: groupMemberBlocked
  go_const: ErrGroupMemberBlocked
  user_message:
    zh: 存在已屏蔽的成员，无法发起群聊
    en: Cannot start a group while some members are blocked
- code: CHAT.USER.group_governance_forbidden
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: groupGovernanceForbidden
  go_const: ErrGroupGovernanceForbidden
  user_message:
    zh: 只有群主或管理员可以执行该操作
    en: Only the group owner or an admin can perform this action
- code: CHAT.USER.circle_group_managed_by_circle
  kind: USER
  reason: conflict
  http_status: 409
  recovery_action: surface
  dart_const: circleGroupManagedByCircle
  go_const: ErrCircleGroupManagedByCircle
  user_message:
    zh: 该群成员与角色由圈群管理，请在群组管理页操作
    en: This group is managed by its circle group. Use group management instead.
- code: CHAT.SYSTEM.circle_group_binding_conflict
  kind: SYSTEM
  reason: projection_conflict
  http_status: 409
  recovery_action: surface
  dart_const: circleGroupBindingConflict
  go_const: ErrCircleGroupBindingConflict
  user_message:
    zh: 圈群会话绑定状态异常，请稍后重试
    en: The circle group chat binding is inconsistent. Please try again later.
- code: CHAT.USER.group_full
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: groupFull
  go_const: ErrGroupFull
  user_message:
    zh: 群成员已达上限
    en: The group has reached its member limit
- code: CHAT.USER.conversation_dissolved
  kind: USER
  reason: conflict
  http_status: 409
  recovery_action: surface
  dart_const: conversationDissolved
  go_const: ErrConversationDissolved
  user_message:
    zh: 该群聊已解散
    en: This group has been dissolved
- code: CHAT.USER.group_owner_must_transfer_before_leave
  kind: USER
  reason: conflict
  http_status: 409
  recovery_action: surface
  dart_const: groupOwnerMustTransferBeforeLeave
  go_const: ErrGroupOwnerMustTransferBeforeLeave
  user_message:
    zh: 群主退群前需先转让群主
    en: Transfer ownership before leaving the group
- code: CHAT.SYSTEM.internal_error
  kind: SYSTEM
  reason: internal_error
  http_status: 500
  recovery_action: surface
  dart_const: internalError
  go_const: ErrInternalError
  user_message:
    zh: 消息服务异常，请稍后重试
    en: Chat service error, please try again
