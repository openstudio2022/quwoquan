read_model: MessageHomeRow
description: '商用消息首页行。由 ChatInboxProjection 与 NotificationInboxProjection 聚合。

  App 只消费本 read model，不在 UI/Provider 中根据标题或摘要推导通知、群聊或私聊分类。

  '
fields:
- {name: id, type: string}
- {name: kind, type: string}
- {name: conversationId, type: string}
- {name: notificationId, type: string}
- {name: conversationType, type: string}
- {name: title, type: string}
- {name: summary, type: string}
- {name: avatarUrl, type: string}
- {name: groupAvatarVersion, type: int64}
- {name: lastActiveAt, type: timestamp, nullable: true}
- {name: unreadCount, type: int}
- {name: mentionUnreadCount, type: int}
- {name: muted, type: bool}
- {name: pinned, type: bool}
- {name: notificationType, type: string}
- {name: read, type: bool}
