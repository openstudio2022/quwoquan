read_model: ChatInbox
description: '聊天列表 per-user ReadModel（逻辑视图）。

  物理载体是 conversation_user_states（未读/排序行）join conversations（标题、

  头像、lastMessage 摘要），不复制第二份集合：未读推进由 inbox projector 消费

  Message outbox 的 MessageSent 原子 $inc；已读回落与 muted/pinned 由

  ConversationUserState 命令在聚合 state 内原子完成；标题/头像/lastSeq 由

  Conversation 侧投影（ProjectCommittedMessage / 群头像流水线）维护。

  ConversationMemberRemoved / ConversationMemberLeft 在成员命令事务内删除当事人的

  ConversationUserState；因此其后迟到的 MessageSent 只推进既有成员的水位，缺失状态

  必须 no-op，不能复活收件箱行。

  按 pinned DESC + lastMessageTime(updatedAt) DESC 排序。

  '
storage_backend: mongodb
collection: conversation_user_states
source_entities:
- Conversation
- Message
- ConversationMember
- ConversationUserState
source_events:
- MessageSent
- ConversationCreated
- ConversationMemberAdded
- ConversationMemberRemoved
- ConversationMemberLeft
- ConversationUserSettingsChanged
- ConversationReadWatermarkAdvanced
consumers:
- app (chat list)
fields:
- name: userId
  type: string
- name: conversationId
  type: ObjectId
- name: type
  type: enum
- name: title
  type: string
- name: avatarUrl
  type: string
  description: 会话主头像 URL：单聊为对方用户头像；群聊（含圈子绑定默认群）为 chat-service 服务端预合成 CDN URL（须非空可访问）
- name: groupAvatarVersion
  type: int64
  description: 群头像版本号（服务端内部一致性）；用于端侧缓存失效与 patch 幂等
- name: lastMessagePreview
  type: string
- name: lastMessageType
  type: enum
  enum_ref: MessageType
  description: 最近一条消息类型，用于列表副标题 icon
- name: lastMessageTime
  type: timestamp
- name: lastSeq
  type: int64
  description: 会话最新 seq（端侧 gap 检测用）
- name: unreadCount
  type: int
- name: mentionUnreadCount
  type: int
  description: '@我且未读的消息数'
- name: muted
  type: bool
- name: pinned
  type: bool
- name: circleId
  type: string
  description: 关联圈子 id；有值表示该会话为圈子绑定默认群，其他会话可为空
indexes:
- name: idx_ci_user_pinned_time
  keys:
    userId: 1
    pinned: -1
    lastMessageTime: -1
- name: idx_ci_user_conv
  keys:
    userId: 1
    conversationId: 1
  unique: true
client_projection:
  dart_class: ChatInboxDto
  base_class: ''
  output_path: cloud/runtime/generated/chat/chat_inbox_dto.g.dart
  strict: true
  computed_getters:
  - name: hasMention
    source: hasMention
    dart_return_type: bool
    nullable: false
    description: 是否存在 @我 且未读的消息。
    body: 'return mentionUnreadCount > 0;

      '
  - name: hasUnread
    source: hasUnread
    dart_return_type: bool
    nullable: false
    description: 是否存在未读消息。
    body: 'return unreadCount > 0;

      '
  fields:
  - name: id
    dart_type: String
    nullable: false
    source: conversationId
    default: ''''''
  - name: type
    dart_type: String
    nullable: false
    source: type
    default: ''''''
  - name: title
    dart_type: String
    nullable: false
    source: title
    default: ''''''
  - name: avatarUrl
    dart_type: String
    nullable: false
    source: avatarUrl
    default: ''''''
  - name: groupAvatarVersion
    dart_type: int
    nullable: false
    source: groupAvatarVersion
    default: '0'
  - name: lastMessagePreview
    dart_type: String
    nullable: false
    source: lastMessagePreview
    default: ''''''
  - name: lastMessageType
    dart_type: String
    nullable: false
    source: lastMessageType
    default: '''text'''
  - name: lastMessageTime
    dart_type: DateTime
    nullable: true
    source: lastMessageTime
    default: 'null'
  - name: lastSeq
    dart_type: int
    nullable: false
    source: lastSeq
    default: '0'
  - name: unreadCount
    dart_type: int
    nullable: false
    source: unreadCount
    default: '0'
  - name: mentionUnreadCount
    dart_type: int
    nullable: false
    source: mentionUnreadCount
    default: '0'
  - name: muted
    dart_type: bool
    nullable: false
    source: muted
    default: 'false'
  - name: pinned
    dart_type: bool
    nullable: false
    source: pinned
    default: 'false'
  - name: circleId
    dart_type: String
    nullable: false
    source: circleId
    default: ''''''
