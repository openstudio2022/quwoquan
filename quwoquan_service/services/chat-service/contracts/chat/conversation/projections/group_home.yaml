read_model: GroupHome
description: '商用群主页 / 聊天信息页 read model。由 Conversation、ConversationMember、

  CircleGroup、Circle、Homepage 聚合，聊天页顶部与聊天信息页必须消费同一事实源。

  '
fields:
- {name: conversationId, type: string}
- {name: title, type: string}
- {name: avatarUrl, type: string}
- {name: groupAvatarVersion, type: int64}
- {name: circleId, type: string}
- {name: circleGroupId, type: string}
- {name: entityId, type: string}
- {name: sourceEntityTitle, type: string}
- {name: sourceCircleTitle, type: string}
- {name: memberCount, type: int}
- {name: announcement, type: string}
- {name: capabilities, type: '[]string'}
- {name: originType, type: string}
- {name: canManageMembers, type: bool}
- {name: canDissolve, type: bool}
