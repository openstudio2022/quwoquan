read_model: GroupHome
description: '商用群主页 / 聊天信息页 read model。由 Conversation、ConversationMember、

  CircleGroup、Circle、Homepage 聚合，聊天页顶部与聊天信息页必须消费同一事实源。

  '
client_projection:
  dart_class: GroupHomeDto
  base_class: ''
  output_path: cloud/runtime/generated/chat/group_home_dto.g.dart
  fields:
  - name: conversationId
    dart_type: String
    nullable: false
    source: conversationId
    default: ''''''
  - name: title
    dart_type: String
    nullable: false
    source: title
    default: ''''''
  - name: avatarUrl
    dart_type: String
    nullable: false
    source: avatarUrl
    default: ''''''
  - name: groupAvatarVersion
    dart_type: int
    nullable: false
    source: groupAvatarVersion
    default: '0'
  - name: circleId
    dart_type: String
    nullable: false
    source: circleId
    default: ''''''
  - name: circleGroupId
    dart_type: String
    nullable: false
    source: circleGroupId
    default: ''''''
  - name: entityId
    dart_type: String
    nullable: false
    source: entityId
    default: ''''''
  - name: sourceEntityTitle
    dart_type: String
    nullable: false
    source: sourceEntityTitle
    default: ''''''
  - name: sourceCircleTitle
    dart_type: String
    nullable: false
    source: sourceCircleTitle
    default: ''''''
  - name: memberCount
    dart_type: int
    nullable: false
    source: memberCount
    default: '0'
  - name: announcement
    dart_type: String
    nullable: false
    source: announcement
    default: ''''''
  - name: capabilities
    dart_type: List<String>
    nullable: false
    source: capabilities
    default: const <String>[]
  - name: originType
    dart_type: String
    nullable: false
    source: originType
    default: ''''''
  - name: bindingType
    dart_type: String
    nullable: false
    source: bindingType
    default: ''''''
  - name: lifecyclePolicy
    dart_type: String
    nullable: false
    source: lifecyclePolicy
    default: ''''''
  - name: canManageMembers
    dart_type: bool
    nullable: false
    source: canManageMembers
    default: 'false'
  - name: canDissolve
    dart_type: bool
    nullable: false
    source: canDissolve
    default: 'false'
