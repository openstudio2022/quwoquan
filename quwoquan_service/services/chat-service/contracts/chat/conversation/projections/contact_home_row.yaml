read_model: ContactHomeRow
description: '商用联系首页行。由关系、圈子、群成员、会话和交集聚合服务生成。

  App 不拼“来源”“交集”“成员数”“最近互动”等业务事实。

  '
fields:
- {name: id, type: string}
- {name: kind, type: string}
- {name: objectId, type: string}
- {name: userId, type: string, nullable: true}
- {name: userHandle, type: string}
- {name: conversationId, type: string, nullable: true}
- {name: circleId, type: string, nullable: true}
- {name: circleGroupId, type: string, nullable: true}
- {name: entityId, type: string, nullable: true}
- {name: title, type: string}
- {name: subtitle, type: string}
- {name: avatarUrl, type: string}
- {name: relationState, type: string, nullable: true}
# 真实交集点（≤2 条，云侧 IntersectionReason 只读快照）。取代弱类型 summaryIntersections
# 字符串列表：Chat 不拼句、不改写，引用重解析不成立时整条不下发（intersection-native-messaging REQ-001/REQ-004）。
- {name: intersectionFacts, type: '[]ContactIntersectionFact'}
- {name: sourceEntityTitle, type: string, nullable: true}
- {name: sourceCircleTitle, type: string, nullable: true}
- {name: memberCount, type: int, nullable: true}
- {name: contactCount, type: int}
- {name: lastActiveAt, type: timestamp, nullable: true}
- {name: sortKey, type: string}
- {name: isStarred, type: bool, nullable: true}
