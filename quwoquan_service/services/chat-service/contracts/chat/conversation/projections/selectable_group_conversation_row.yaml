read_model: SelectableGroupConversationRow
description: 'ListSelectableGroupConversations 返回的群行（wire），用于「从群聊/圈子中选择联系人」来源列表（图四）。

  每行表示一个当前用户所在、且含互关联系人的群会话；friendMemberCount 为群成员中与当前用户互关的联系人数，

  memberCount 为群总成员数。circleId 非空表示圈子绑定群，供服务端 source 过滤与端侧来源语义展示；

  avatarUrl 为服务端会话头像（可能为空，端侧按群占位兜底）。

  '
fields:
- {name: conversationId, type: string}
- {name: title, type: string}
- {name: avatarUrl, type: string}
- {name: circleId, type: string}
- {name: friendMemberCount, type: int}
- {name: memberCount, type: int}
