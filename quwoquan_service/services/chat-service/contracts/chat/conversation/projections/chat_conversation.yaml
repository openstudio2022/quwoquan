read_model: ChatConversation
description: Canonical full Conversation wire projection shared by detail, create, mutation readback,
  batch and keyset list responses.
storage_backend: mongodb
collection: conversations
source_entities:
- Conversation
fields:
- name: id
  type: string
- name: conversationId
  type: string
- name: type
  type: string
- name: title
  type: string
- name: avatarUrl
  type: string
- name: groupAvatarVersion
  type: int64
- name: groupAvatarSourceHash
  type: string
  nullable: true
- name: creatorId
  type: string
- name: circleId
  type: string
- name: circleGroupId
  type: string
- name: gatheringId
  type: string
- name: gatheringSourceVersion
  type: int64
# Gathering 投影来源事件 id（活动群绑定溯源）；云侧 wire 一直携带，
# 此前缺契约登记导致 App generated client 拒收（首个 App api_integration 抓出）。
- name: gatheringSourceEventId
  type: string
- name: accessMode
  type: enum
  enum_ref: ConversationAccessMode
- name: postingPolicy
  type: enum
  enum_ref: ConversationPostingPolicy
- name: entityId
  type: string
- name: originType
  type: string
- name: originIntersectionSnapshot
  type: GreetingIntersectionSnapshot
  nullable: true
# 非破冰 1v1 的常驻交集摘要（≤2 条云侧 ContactIntersectionFact 只读快照）；
# 群会话与携带破冰快照的会话为空数组。Chat 不拼句、不改写（REQ-001/REQ-004）。
- name: intersectionFacts
  type: '[]ContactIntersectionFact'
- name: maxSeq
  type: int64
- name: memberCount
  type: int
- name: membersRosterRevision
  type: int64
- name: maxGroupSize
  type: int
- name: receiptEnabled
  type: bool
- name: announcement
  type: string
- name: announcementUpdatedBy
  type: string
# 无公告的会话不携带该键（云侧条件写入）；此前缺 nullable 声明导致
# App generated client 在真实环境解码失败（App api_integration 抓出）。
- name: announcementUpdatedAt
  type: timestamp
  nullable: true
- name: nameEditableByAdminOnly
  type: bool
- name: lastMessageId
  type: string
- name: lastMessagePreview
  type: string
- name: lastMessageType
  type: enum
  enum_ref: MessageType
- name: lastMessageTime
  type: timestamp
- name: messageCount
  type: int64
- name: status
  type: string
- name: createdAt
  type: timestamp
- name: updatedAt
  type: timestamp
