read_model: ChatConversation
description: Canonical full Conversation wire projection shared by detail, create, mutation readback,
  batch and keyset list responses.
storage_backend: mongodb
collection: conversations
source_entities:
- Conversation
fields:
- name: id
  type: string
- name: conversationId
  type: string
- name: type
  type: string
- name: title
  type: string
- name: avatarUrl
  type: string
- name: groupAvatarVersion
  type: int64
- name: groupAvatarSourceHash
  type: string
  nullable: true
- name: creatorId
  type: string
- name: circleId
  type: string
- name: circleGroupId
  type: string
- name: entityId
  type: string
- name: originType
  type: string
- name: originIntersectionSnapshot
  type: GreetingIntersectionSnapshot
  nullable: true
- name: maxSeq
  type: int64
- name: memberCount
  type: int
- name: membersRosterRevision
  type: int64
- name: maxGroupSize
  type: int
- name: receiptEnabled
  type: bool
- name: announcement
  type: string
- name: announcementUpdatedBy
  type: string
- name: announcementUpdatedAt
  type: timestamp
- name: nameEditableByAdminOnly
  type: bool
- name: lastMessageId
  type: string
- name: lastMessagePreview
  type: string
- name: lastMessageType
  type: enum
  enum_ref: MessageType
- name: lastMessageTime
  type: timestamp
- name: messageCount
  type: int64
- name: status
  type: string
- name: createdAt
  type: timestamp
- name: updatedAt
  type: timestamp
