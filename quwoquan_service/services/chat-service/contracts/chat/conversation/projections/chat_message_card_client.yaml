read_model: ChatMessageCardClient
description: Message 聚合内 MessageCard 值对象的强类型客户端投影。
client_projection:
  dart_class: ChatMessageCardDto
  base_class: ''
  output_path: cloud/runtime/generated/chat/chat_message_card_dto.g.dart
  strict: true
  dart_imports:
  - chat_message_card_attribute_dto.g.dart
  - chat_message_card_object_ref_dto.g.dart
  fields:
  - name: kind
    dart_type: String
    nullable: false
    source: kind
  - name: title
    dart_type: String
    nullable: false
    source: title
  - name: objectRef
    dart_type: ChatMessageCardObjectRefDto
    nullable: true
    source: objectRef
    map_from_string_key_class: ChatMessageCardObjectRefDto
  - name: subtitle
    dart_type: String
    nullable: true
    source: subtitle
  - name: thumbnailUrl
    dart_type: String
    nullable: true
    source: thumbnailUrl
  - name: deeplink
    dart_type: String
    nullable: true
    source: deeplink
  - name: landingUrl
    dart_type: String
    nullable: true
    source: landingUrl
  - name: shareText
    dart_type: String
    nullable: true
    source: shareText
  - name: message
    dart_type: String
    nullable: true
    source: message
  - name: attributes
    dart_type: List<ChatMessageCardAttributeDto>
    nullable: false
    source: attributes
    list_element_dart_class: ChatMessageCardAttributeDto
