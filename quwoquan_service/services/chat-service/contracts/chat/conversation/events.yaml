events:
- name: ConversationCreated
  description: 会话创建
  delivery_semantics: transactional_outbox
  payload_entity: Conversation
  payload_fields:
  - conversationId
  - type
  - creatorId
  - circleId
  - circleGroupId
  - gatheringId
  - gatheringSourceVersion
  - accessMode
  - postingPolicy
  - maxGroupSize
  - receiptEnabled
  - createdAt
- name: CircleGroupConversationProvisioned
  description: 'chat-service 已为 CircleGroup 成功持久化唯一 Conversation 的绑定事实。

    circle-service consumer 必须以 eventId 幂等回写 CircleGroup.conversationId；未持久化

    或投递失败时不得确认 source event，禁止用同步 RPC 或客户端字段替代此链路。'
  delivery_semantics: transactional_outbox
  payload_entity: Conversation
  payload_fields:
  - conversationId
  - circleId
  - circleGroupId
  - creatorId
  - createdAt
- name: ConversationRosterUpdated
  description: '会话成员或群资料变更后的合并刷新信号。客户端以

    membersRosterRevision 和 updatedAt 定点拉取会话与成员，而不消费逐成员事件。'
  delivery_semantics: transactional_outbox
  topic: rt:user:{recipientId}
  payload_entity: ConversationRosterUpdatedEventPayload
  payload_fields:
  - conversationId
  - membersRosterRevision
  - updatedAt
  - aspects
  client_ws_type: ConversationRosterUpdated
- name: GatheringConversationPolicyChanged
  description: Gathering lifecycle projection 改变 Chat access/posting policy 后的可重放刷新事件。
  delivery_semantics: transactional_event_log
  no_consumer_reason: 策略状态与审计事件在 Conversation 事务中一并持久追加；Board 与会话读取直接查询当前 Conversation，目前没有独立异步 consumer。
  topic: rt:user:{recipientId}
  payload_entity: GatheringConversationPolicyChangedEventPayload
  payload_fields:
  - conversationId
  - gatheringId
  - sourceVersion
  - accessMode
  - postingPolicy
  - updatedAt
  client_ws_type: GatheringConversationPolicyChanged
- name: ConversationAvatarUpdated
  description: '群头像预合成结果更新。

    用于统一 sync patch `conversation.avatar.updated` 的上游事件输入。'
  delivery_semantics: transactional_outbox
  topic: rt:user:{recipientId}
  payload_entity: ConversationAvatarUpdatedEventPayload
  payload_fields:
  - conversationId
  - avatarUrl
  - groupAvatarAssetId
  - groupAvatarVersion
  - groupAvatarSourceHash
  - updatedAt
  client_ws_type: ConversationAvatarUpdated
- name: ConversationDissolved
  description: '群聊解散终态事件（与 aggregate lifecycle `dissolved` 同名单轨）。

    成员端收到后收敛会话入口；投影据此下线群相关行。'
  delivery_semantics: transactional_outbox
  topic: rt:user:{recipientId}
  payload_entity: ConversationDissolvedEventPayload
  payload_fields:
  - conversationId
  - status
  - dissolvedBy
  - dissolvedAt
  client_ws_type: ConversationDissolved
