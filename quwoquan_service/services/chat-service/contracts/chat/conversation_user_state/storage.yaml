backend: mongodb
collections:
  conversation_user_states:
    publication_role: not_published
    entity: ConversationUserState
    role: authoritative
    indexes:
    - name: uq_conversation_user_states_identity
      keys:
        userId: 1
        conversationId: 1
      unique: true
    - name: idx_conversation_user_states_inbox
      keys:
        userId: 1
        pinned: -1
        updatedAt: -1
  conversation_user_states_command_receipts:
    publication_role: not_published
    entity: ConversationUserState
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。
  conversation_user_states_outbox:
    publication_role: transactional_outbox
    entity: ConversationUserState
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
  chat_user_account_restrictions:
    publication_role: not_published
    entity: ConversationUserState
    role: projection
    description: UserSuspended/UserRestored 的 Chat 本地可逆阻断状态；只保存主体摘要与单调账号版本。
  chat_user_account_restriction_inbox:
    publication_role: not_published
    entity: ConversationUserState
    role: projection
    description: 账号限制事件的幂等 inbox；与受影响 ConversationUserState mutation 同事务。
  chat_user_account_restriction_watermarks:
    publication_role: not_published
    entity: ConversationUserState
    role: projection
    description: 账号限制单调水位；账号关闭后 terminal，不允许迟到恢复事件复活状态。
role: authoritative
