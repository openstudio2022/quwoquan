description: 用户级会话状态（独立 collection，消除写放大）
fields:
  - name: _id
    source: _id
    type: ObjectId
    constraints:
      - PK
    classification: PUBLIC
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: userId
    source: userId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: conversationId
    source: conversationId
    type: ObjectId
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: readSeq
    source: readSeq
    type: int64
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 用户已读到的 seq
    role: authoritative_state
  - name: inboxProjectedSeq
    source: inboxProjectedSeq
    type: int64
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    description: ChatInbox 投影已原子消费到的会话消息 seq，用于重放幂等与已读计数重算
    role: authoritative_state
  - name: unreadCount
    source: unreadCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: mentionUnreadCount
    source: mentionUnreadCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: '@我且未读的消息数'
    role: authoritative_state
  - name: muted
    source: muted
    type: bool
    constraints:
      - NOT_NULL
      - DEFAULT_FALSE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: pinned
    source: pinned
    type: bool
    constraints:
      - NOT_NULL
      - DEFAULT_FALSE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: lastReadAt
    source: lastReadAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
types:
  ConversationUserSettingsChangedEventPayload:
    description: 当前用户的会话级静音与置顶状态变化后供端侧定点刷新 owner projection 的 canonical 实时载荷。
    fields:
      - {name: conversationId, type: string, constraints: [NOT_BLANK]}
      - {name: userId, type: string, constraints: [NOT_BLANK]}
      - {name: muted, type: bool, constraints: [NOT_NULL]}
      - {name: pinned, type: bool, constraints: [NOT_NULL]}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  ChatMarkConversationMessageReadCommand:
    fields:
      - name: conversationId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: idempotencyKey
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
        client_wire_name: Idempotency-Key
      - name: messageId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  ChatUpdateConversationSettingsCommand:
    fields:
      - name: conversationId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: idempotencyKey
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
        client_wire_name: Idempotency-Key
      - name: muted
        type: bool
        constraints:
          - NULLABLE
        client_dart_type: bool?
      - name: pinned
        type: bool
        constraints:
          - NULLABLE
        client_dart_type: bool?
  ConversationUserStateCommandAck:
    description: ConversationUserState 命令的对象本地稳定确认体。
    fields:
      - name: status
        type: string
        constraints: [NOT_NULL]
