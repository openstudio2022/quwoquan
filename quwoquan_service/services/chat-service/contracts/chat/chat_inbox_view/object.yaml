kind: projection
description: Conversation、Message 与 persona 私有会话状态事件合并出的收件箱排序视图；不拥有消息或成员事实。
identity:
  fields:
  - userId
  - conversationId
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: persona
  on_delete: tombstone
  reference_fields:
  - userId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: conversationEvents
  on_delete: tombstone
  reference_fields:
  - conversationId
  target_object: chat.Conversation
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: lastMessage
  on_delete: detach
  reference_fields:
  - lastMessageId
  target_object: chat.Message
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: circle
  on_delete: detach
  reference_fields:
  - circleId
  target_object: circle.Circle
search_policy:
  exposed: none
  not_exposed_reason: "仅所属用户可见的私有状态，进入任何共享索引即构成越权披露。"
assistant_access:
  read:
    mode: owner_scoped
    scopes:
    - assistant.chat.chat_inbox_view.read
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
business_rules:
- 每个 persona 与 conversation 至多一条 inbox 行，排序游标由最后已提交消息序列和时间共同决定。
- 未读数只由 Message 与 ConversationUserState 事件推进，查询不得回扫 message 集合补算。
- 同一 conversation 的源事件按聚合版本单调应用，重放或乱序事件不得回退已投影行。
- Conversation tombstone 必须移除可见内容并保留幂等处理水位。
lifecycle:
  source_events:
  - chat.message.MessageSent
  - chat.message.MessageRecalled
  - chat.conversation.ConversationCreated
  - chat.conversation.ConversationRosterUpdated
  - chat.conversation.ConversationAvatarUpdated
  - chat.conversation.ConversationDissolved
  - chat.conversation_membership.ConversationMemberAdded
  - chat.conversation_membership.ConversationMemberRemoved
  - chat.conversation_membership.ConversationMemberLeft
  - chat.conversation_membership.ConversationMemberRoleChanged
  - chat.conversation_user_state.ConversationReadWatermarkAdvanced
  - chat.conversation_user_state.ConversationUserSettingsChanged
  checkpoint: per_source_outbox_sequence
  rebuild: enumerate_conversation_user_state_identities
  tombstone: hide_inactive_or_inaccessible_conversation_keep_checkpoint
  idempotency: aggregate_version
  event_consumers:
  - name: ProjectChatInbox
    kind: projector
    facet: ChatInboxViewProjector
    method: apply
    idempotency: aggregate_version
