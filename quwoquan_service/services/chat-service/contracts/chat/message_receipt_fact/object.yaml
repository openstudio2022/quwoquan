kind: append_only_fact
description: 'MessageReceiptFact 是 receiptEnabled 会话中某 Persona 对单条 Message 的不可变已读事实。

  它与 read watermark、命令回执在同一事务追加；对同一 messageId + userId 只允许一个事实。

  '
identity:
  fields:
  - _id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: message
  on_delete: retain
  reference_fields:
  - messageId
  target_object: chat.Message
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: conversation
  on_delete: retain
  reference_fields:
  - conversationId
  target_object: chat.Conversation
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: persona
  on_delete: retain
  reference_fields:
  - userId
  target_object: user.Persona
search_policy:
  exposed: none
  not_exposed_reason: "追加事实只服务于后台聚合、审计与回放，不构成用户可检索的对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "原始行为与遥测事实不对小趣开放；小趣只读所属域的公开投影结果。"
business_rules:
- messageId + userId 在全局唯一；相同已读命令重放不得追加第二个事实
- conversationId 必须与 Message.conversationId 一致，userId 必须是该 Conversation 的 active Persona 成员
- 仅 receiptEnabled=true 的 Conversation 追加逐消息回执；否则只推进 ConversationUserState.readSeq
- 事实只由 ConversationUserState 已读命令与 Message 在同一事务经 append sink 追加，事务身份即幂等键
- readAt 由服务端可信时钟产生且不得早于 Message.timestamp
lifecycle:
  immutable: true
  idempotency: transaction_identity
