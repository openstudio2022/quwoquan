kind: append_only_fact
description: MessageReceiptFact 的领域对象契约。
identity:
  fields:
  - _id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: none
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: message
  on_delete: retain
  reference_fields:
  - messageId
  target_object: chat.Message
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: conversation
  on_delete: retain
  reference_fields:
  - conversationId
  target_object: chat.Conversation
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: persona
  on_delete: retain
  reference_fields:
  - userId
  target_object: user.Persona
