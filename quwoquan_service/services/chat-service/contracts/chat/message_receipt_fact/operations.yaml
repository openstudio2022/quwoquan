  runner_source_path: quwoquan_app/test/local_contract/service/chat_service/chat/message_receipt_fact/message_receipt_fact_remote__local_contract_test.dart
  executions:
  - {env: alpha, platform: app, device: runner, provider: none, digest_binding: candidate}
