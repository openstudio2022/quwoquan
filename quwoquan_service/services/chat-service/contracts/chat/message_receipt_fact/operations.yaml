description: MessageReceiptFact 由 ConversationUserState 已读命令在同一事务追加，并由对象自己的 named reader 查询。
commercial_defaults:
  status: blocked
  block_reason: operation 尚未逐项完成商业证据绑定
  gap_id: CHAT_MESSAGE_RECEIPT_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- method: GET
  path: /chat/conversations/{conversationId}/messages/{messageId}/receipts
  operation: GetReceipts
  request_bindings:
    path:
    - name: conversationId
      field: conversationId
    - name: messageId
      field: messageId
  actor: persona
  commercial:
    status: ready
  application:
    kind: query
    facet: MessageReceiptQueryFacet
    method: getReceipts
    reader: MessageReceiptReader
    slice: MessageReceiptPageSlice
  authorization:
    principal: persona
    ownership_policy: conversation_member
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: chat_message_receipt_query
    trace: true
    attributes:
    - outcome
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: 获取不可变消息回执列表；仅 Conversation 当前成员可读，且 message 必须属于 path 中的 Conversation。
  response_entity: MessageReceiptPageSlice
  response_body: ChatMessageReceipt
  response_body_kind: page
  error_codes:
  - CHAT.USER.unauthorized
  - CHAT.USER.blocked
  - CHAT.USER.message_not_found
  - CHAT.SYSTEM.internal_error
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
  request_entity: ChatGetMessageReceiptsQuery
  request_body_kind: none
readiness_cases:
- case_id: get-receipts-local
  spec_ref: specs/feature-tree/chat-conversation/spec.md#dom-002
  producer: service
  layer: local_contract
  target: {kind: operation, id: GetReceipts}
  runner_source_path: quwoquan_service/services/chat-service/tests/local_contract/chat/message_receipt_fact/immutable_fact__contract__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: get-receipts-api
  spec_ref: specs/feature-tree/chat-conversation/spec.md#dom-002
  producer: service
  layer: api_integration
  target: {kind: operation, id: GetReceipts}
  runner_source_path: quwoquan_service/services/chat-service/tests/api_integration/chat/message_receipt_fact/mongo_store__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
- case_id: message_receipt_fact_get_receipts_app_local
  spec_ref: specs/feature-tree/chat-conversation/commercial-message-system/commercial-remote-only-message-system/spec.md#gwt-001
  producer: app
