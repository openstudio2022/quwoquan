    description: 以 OrganizerAssignment、Participation 与 Block 的独立 sourceVersion 幂等投影 Chat access；role 由 sourceType 派生，不经过互关邀请门，也不开放客户端入口。
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.invalid_argument, CHAT.USER.conversation_not_found, CHAT.USER.gathering_binding_conflict, CHAT.SYSTEM.internal_error]
    security:
