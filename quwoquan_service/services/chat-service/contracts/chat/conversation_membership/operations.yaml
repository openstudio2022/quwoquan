description: ConversationMembership 对象专属 command packet。
commercial_defaults:
  status: blocked
  block_reason: operation 尚未逐项完成商业证据绑定
  gap_id: CHAT_MEMBERSHIP_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- method: POST
  path: /chat/conversations/{conversationId}/members
  operation: AddMembers
  actor: persona
  commercial:
    status: ready
  application:
    kind: command
    facet: ConversationMemberCommandFacet
    method: addMembers
    aggregate_owner: ConversationMembership
    mutation_target: ConversationMembership
    invariant_target: ConversationMembership
  authorization:
    principal: persona
    ownership_policy: conversation_member
  reliability:
    timeout_ms: 3000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  privacy:
    request_classification: SENSITIVE
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: chat_membership_command
    trace: true
    attributes:
    - operation
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  description: '添加私建群成员（批量）。操作者必须是该会话的活跃成员；新成员必须与操作者互关且无屏蔽关系；

    检查 maxGroupSize 上限（超限返回 group_full）；已在群成员重复添加为 no-op 并重放原回执。

    circleGroupId 非空的会话只能由 CircleGroupMembership durable projector 写入，本 operation 返回

    circle_group_managed_by_circle。

    '
  response_body_kind: ack
  client_contract:
    dart_import: ../chat/conversation_membership_contracts.dart
    request_type: ChatAddConversationMembersCommand
    response_type: ChatCommandAck
    request_encoder: encodeChatAddConversationMembersCommand
    response_decoder: decodeChatCommandAck
  error_codes:
  - CHAT.USER.unauthorized
  - CHAT.USER.conversation_not_found
  - CHAT.USER.conversation_dissolved
  - CHAT.USER.group_governance_forbidden
  - CHAT.USER.circle_group_managed_by_circle
  - CHAT.USER.group_member_not_mutual
  - CHAT.USER.group_member_blocked
  - CHAT.USER.group_full
  - CHAT.SYSTEM.internal_error
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
