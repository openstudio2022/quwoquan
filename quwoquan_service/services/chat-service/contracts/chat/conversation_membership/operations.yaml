  description: '主动退出群聊（自愿离开语义，区别于被移出）。仅群聊可退出；

    群主必须先 TransferOwnership 再退出（否则返回 group_owner_must_transfer_before_leave）；

    已不在群为 no-op 并重放原回执。产生 ConversationMemberLeft 事件。

    circleGroupId 非空时必须从 CircleGroupMembership 入口离开并拒绝本 operation。

    '
  response_body_kind: ack
  client_contract:
    dart_import: ../chat/conversation_membership_contracts.dart
    request_type: ChatLeaveConversationCommand
    response_type: ChatCommandAck
    request_encoder: encodeChatLeaveConversationCommand
    response_decoder: decodeChatCommandAck
