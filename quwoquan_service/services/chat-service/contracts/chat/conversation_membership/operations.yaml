  description: '移出成员（群治理动作，仅 owner/admin）。群主可移出任何非群主成员；

    管理员只能移出普通成员（不可移出群主或其他管理员）；

    自愿退出必须走 LeaveConversation，不复用本命令；成员已不在群为 no-op 并重放原回执。

    circleGroupId 非空时由 CircleGroupMembership 管理并拒绝本 operation。

    '
  response_body_kind: ack
  client_contract:
    dart_import: ../chat/conversation_membership_contracts.dart
    request_type: ChatRemoveConversationMemberCommand
    response_type: ChatCommandAck
    request_encoder: encodeChatRemoveConversationMemberCommand
