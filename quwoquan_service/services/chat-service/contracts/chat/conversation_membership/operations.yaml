    description: '移出成员（群治理动作，仅 owner/admin）。群主可移出任何非群主成员；

      管理员只能移出普通成员（不可移出群主或其他管理员）；

      自愿退出必须走 LeaveConversation，不复用本命令；成员已不在群为 no-op 并重放原回执。

      circleGroupId 非空时由 CircleGroupMembership 管理并拒绝本 operation。

'
    response_entity: ConversationMembershipCommandAck
    response_body_kind: object
    error_codes:
      - CHAT.USER.unauthorized
      - CHAT.USER.conversation_not_found
      - CHAT.USER.conversation_dissolved
      - CHAT.USER.group_governance_forbidden
      - CHAT.USER.source_managed_conversation
      - CHAT.SYSTEM.internal_error
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ChatRemoveConversationMemberCommand
    request_body_kind: none
