events:
- name: MessageSent
  producer: chat-service
  consumers:
  - projection-workers
  channel: transactional_outbox
  payload_entity: Message
  payload_fields:
  - messageId
  - conversationId
  - seq
  - clientMsgId
  - senderId
  - type
  - content
  - mediaAssetId
  - card
  - replyToMessageId
  - mentions
  - personaContextVersion
  - senderDisplayNameSnapshot
  - senderAvatarUrlSnapshot
  - timestamp
- name: MessageRecalled
  producer: chat-service
  consumers:
  - projection-workers
  channel: transactional_outbox
  payload_entity: Message
  payload_fields:
  - messageId
  - conversationId
  - seq
  - recalledAt
- name: AssistantMentioned
  description: 会话消息中提及已加入助手时，交给 assistant-service 的可靠消费事件。
  producer: chat-service
  consumers:
  - assistant-service
  channel: transactional_outbox
  payload_entity: Message
  payload_fields:
  - conversationId
  - messageId
  - seq
  - senderId
  - senderAccountId
  - content
  - assistantMemberId
  - triggerClientMsgId
