events:
- name: MessageSent
  delivery_semantics: transactional_outbox
  payload_entity: MessageSentEventPayload
  payload_fields:
  - messageId
  - conversationId
  - seq
  - clientMsgId
  - senderId
  - type
  - content
  - mediaAssetId
  - card
  - replyToMessageId
  - mentions
  - personaContextVersion
  - senderDisplayNameSnapshot
  - senderAvatarUrlSnapshot
  - timestamp
  client_ws_type: MessageSent
- name: MessageRecalled
  delivery_semantics: transactional_outbox
  payload_entity: MessageRecalledEventPayload
  payload_fields:
  - messageId
  - conversationId
  - seq
  - recalledAt
  client_ws_type: MessageRecalled
- name: AssistantMentioned
  description: 会话消息中提及已加入助手时，交给 assistant-service 的可靠消费事件。
  delivery_semantics: transactional_outbox
  payload_entity: Message
  payload_fields:
  - conversationId
  - messageId
  - seq
  - senderId
  - senderAccountId
  - content
  - assistantMemberId
  - triggerClientMsgId
