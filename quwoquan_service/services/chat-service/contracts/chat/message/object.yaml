kind: aggregate_root
description: Conversation 中单条消息的发送、服务端序号与撤回生命周期聚合。
identity:
  fields:
  - _id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: media_asset
  on_delete: tombstone
  reference_fields:
  - mediaAssetId
  target_object: content.MediaAsset
- access: command_facade
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: conversation
  on_delete: tombstone
  reference_fields:
  - conversationId
  target_object: chat.Conversation
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: replyMessage
  on_delete: tombstone
  reference_fields:
  - replyToMessageId
  target_object: chat.Message
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: senderPersona
  on_delete: retain
  reference_fields:
  - senderId
  target_object: user.Persona
local_identity_reasons:
  clientMsgId: immutable correlation or idempotency key scoped to this fact or command; it is not a business-object
    reference
business_rules:
- clientMsgId 在 conversationId + sender persona 范围内唯一
- sender 必须是 active ConversationMembership，actor 只能来自 trusted principal
- Conversation accessMode=read_only 或 postingPolicy=announcements_only 时公开 SendMessage 必须拒绝；公告只走 Chat Announcement 命令
- seq 由服务端按 Conversation 单调分配，客户端不可指定
- media 消息只保存 MediaAsset id，不拥有上传会话或 URL 真相
- card 消息必须拥有一个强类型 MessageCard，非 card 消息禁止携带 card
- MessageCard 最多 16 个同名唯一的属性；子对象只能由 Message 创建和持久化
- content 最多 5000 个 Unicode code point，card title 最多 120 个 Unicode code point
- mentions 最多 50 个并按首次出现顺序去重；普通目标必须是当前活跃成员
- __all__ 只允许群 owner/admin 使用；assistant 只在助手成员已加入时合法
- 只有 sender 或有权限 moderator 可在策略时间窗内撤回
lifecycle:
  state_field: status
  states:
  - sent
  - recalled
  optimistic_concurrency: version
  idempotency: command_receipt
  source_events:
  - rtc.call_session.CallEnded
  event_consumers:
  - name: AppendRtcCallLog
    kind: event_handler
    facet: RtcCallLogHandler
    method: appendRtcCallLog
    idempotency: event_id
