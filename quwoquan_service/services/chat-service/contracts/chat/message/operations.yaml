      log_policy: metadata_only
    telemetry:
      metric: chat_message_list
      trace: true
      attributes:
        - conversation_id
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    application:
      kind: query
      facet: MessageQueryFacet
      method: listMessages
      reader: MessageHistoryReader
      slice: MessagePageSlice
    description: 消息列表（支持 afterSeq/beforeSeq 分页，默认按 seq DESC）
    response_entity: MessagePageSlice
    response_body: ChatMessageClient
    response_body_kind: page
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ChatListMessagesQuery
    request_body_kind: none
  - method: GET
    path: /chat/conversations/{conversationId}/assets
    operation: ListConversationAssets
    request_bindings:
      path:
        - name: conversationId
          field: conversationId
      query:
        - name: kind
          field: kind
        - name: limit
          field: limit
          required: false
        - name: beforeSeq
          field: beforeSeq
          required: false
    actor: persona
    commercial:
      status: ready
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CHAT.USER.unauthorized
      - CHAT.USER.invalid_argument
      - CHAT.USER.conversation_not_found
      - CHAT.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_assets_list
      trace: true
      attributes:
        - conversation_id
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    application:
      kind: query
      facet: MessageQueryFacet
      method: listConversationAssets
      reader: MessageHistoryReader
      slice: ConversationAssetPage
    description: '群空间相册/文件索引（kind=image|file，按 seq DESC keyset 分页）；

      每行由 Message owner 事实与 MediaAsset delivery Reader 组合，交付字段随行返回，

      App 相册/文件宫格直接渲染，不再各自扫描消息列表。

'
    response_entity: ConversationAssetPage
    response_body: ConversationAssetClient
    response_body_kind: page
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ChatListConversationAssetsQuery
    request_body_kind: none
  - method: POST
    path: /chat/conversations/{conversationId}/sync
    operation: SyncMessages
    request_bindings:
      path:
        - name: conversationId
          field: conversationId
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: MessageSyncQueryFacet
      method: syncMessages
      reader: MessageSyncReader
      slice: MessageSyncSlice
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    pagination:
      default_items: 500
      maximum_items: 500
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_message_sync
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 离线同步（上报 lastSeq，返回 gap 消息列表 + hasMore，单次最多 500 条）
    response_body: ChatMessageSyncSlice
    response_entity: ChatMessageSyncSlice
    response_body_kind: object
    error_codes:
      - CHAT.USER.unauthorized
      - CHAT.USER.conversation_not_found
      - CHAT.SYSTEM.internal_error
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ChatSyncMessagesQuery
    request_body_kind: object
