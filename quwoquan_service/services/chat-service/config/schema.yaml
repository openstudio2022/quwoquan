description: 该自治边界的运行配置定义与默认值；环境只维护差异和引用。
configs:
- key: sys.chat-service.mongodb.database
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: quwoquan_chat
- key: sys.chat-service.mongodb.uri
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.chat-service.redis.general.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: localhost:6379
- key: sys.chat-service.redis.general.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: standalone
- key: sys.chat-service.redis.realtime.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: localhost:6379
- key: sys.chat-service.redis.realtime.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: standalone
- key: sys.chat-service.redis.reliable_task.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: localhost:6379
- key: sys.chat-service.redis.reliable_task.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
