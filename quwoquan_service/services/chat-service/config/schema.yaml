  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.chat-service.runtime.media.group_avatar_local_media_root
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: ./var/chat-media
- key: sys.chat-service.runtime.observability.runtime_media.group_avatar_fallback_ratio
  type: float
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0.05
- key: sys.chat-service.runtime.observability.runtime_media.group_avatar_recompute_duration_ms_p95
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 500
- key: sys.chat-service.runtime.observability.runtime_media.hint_to_pull_delay_ms_p95
  type: int
  scope: workload
  reload: restart
  rollout: progressive
