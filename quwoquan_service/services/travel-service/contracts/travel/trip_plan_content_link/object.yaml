kind: aggregate_root
description: Trip/Item 对既有 Post 的可撤销采用关系；只保存 canonical Post reference 与归属，不复制内容事实。
identity:
  fields: [_id]
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- {name: trip_plan, kind: reference, cardinality: 'N:1', consistency: strong, access: named_reader, on_delete: retain, reference_fields: [tripId], target_object: travel.TripPlan}
- {name: post, kind: reference, cardinality: 'N:1', consistency: eventual, access: named_reader, on_delete: tombstone, reference_fields: [postId], target_object: content.Post}
- {name: linked_by_persona, kind: reference, cardinality: 'N:1', consistency: eventual, access: named_reader, on_delete: tombstone, reference_fields: [linkedByPersonaId], target_object: user.Persona}
local_identity_reasons:
  itemId: TripPlanRevision 内的 owned item 稳定键，只能与 tripId/revisionNumber 联合解释，不是独立 aggregate identity
capabilities: [commandable, queryable, idempotent_commands]
business_rules:
- 同一 tripId + postId 最多一个当前 link，移动只改变归属而不复制或修改 Post
- 写入前必须核验 actor 是 active Trip member 且 Post 对该 actor 可见
- trip 级采用不携带 day/item；day 级必须携带 dayIndex；item 级必须携带同一不可变 Revision 中的 dayIndex + itemId
- sourceVersion 只能单调推进
- 放置、移动和移除必须使用 expectedVersion CAS，并与幂等回执和 outbox 原子提交
lifecycle:
  state_field: status
  states: [active, removed]
  optimistic_concurrency: version
  idempotency: command_receipt
