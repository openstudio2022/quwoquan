description: TripPlanContentLink 与 named Reader 字段。
fields:
- {name: _id, type: string, constraints: [PK, NOT_NULL], role: authoritative_state}
- {name: version, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: tripId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: postId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: revisionNumber, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: targetKind, type: enum, enum_ref: TripPlanContentLinkTargetKind, constraints: [NOT_NULL], role: authoritative_state}
- {name: dayIndex, type: int, constraints: [NULLABLE], role: authoritative_state}
- {name: itemId, type: string, constraints: [NULLABLE], role: authoritative_state}
- {name: visibility, type: enum, enum_ref: TripPlanContentLinkVisibility, constraints: [NOT_NULL], role: authoritative_state}
- {name: linkedByPersonaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: sourceVersion, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: status, type: enum, enum_ref: TripPlanContentLinkStatus, constraints: [NOT_NULL], role: authoritative_state}
- {name: createdAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
- {name: updatedAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
unique_constraints:
- columns: [tripId, postId]
  description: 同一 Post 在一个 Trip 只有一个当前采用关系
types:
  ListTripPlanContentLinksQuery:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  PutTripPlanContentLinkRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: postId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: revisionNumber, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: targetKind, type: enum, enum_ref: TripPlanContentLinkTargetKind, constraints: [NOT_NULL], client_dart_type: TripPlanContentLinkTargetKind}
    - {name: dayIndex, type: int, constraints: [NULLABLE], client_dart_type: 'int?'}
    - {name: itemId, type: string, constraints: [NULLABLE], client_dart_type: 'String?'}
    - {name: visibility, type: enum, enum_ref: TripPlanContentLinkVisibility, constraints: [NOT_NULL], client_dart_type: TripPlanContentLinkVisibility}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
  RemoveTripPlanContentLinkRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: postId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: reason, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  TripPlanContentLinkSlice:
    fields:
    - {name: linkId, type: string, constraints: [NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL]}
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: postId, type: string, constraints: [NOT_NULL]}
    - {name: revisionNumber, type: int64, constraints: [NOT_NULL]}
    - {name: targetKind, type: enum, enum_ref: TripPlanContentLinkTargetKind, constraints: [NOT_NULL]}
    - {name: dayIndex, type: int, constraints: [NULLABLE]}
    - {name: itemId, type: string, constraints: [NULLABLE]}
    - {name: visibility, type: enum, enum_ref: TripPlanContentLinkVisibility, constraints: [NOT_NULL]}
    - {name: linkedByPersonaId, type: string, constraints: [NOT_NULL]}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: TripPlanContentLinkStatus, constraints: [NOT_NULL]}
    - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  TripPlanContentLinkListSlice:
    fields:
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: links, type: '[]TripPlanContentLinkSlice', constraints: [NOT_NULL]}
enums:
  TripPlanContentLinkTargetKind:
    values: [trip, day, item]
  TripPlanContentLinkStatus:
    values: [active, removed]
