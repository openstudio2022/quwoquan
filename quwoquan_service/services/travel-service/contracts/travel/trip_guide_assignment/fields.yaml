description: TripGuideAssignment 任务、角色、署名与公开资质引用。
fields:
- {name: _id, type: string, constraints: [PK, NOT_NULL], role: authoritative_state}
- {name: version, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: tripId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: taskKey, type: string, constraints: [NOT_NULL], role: authoritative_state}
- {name: assigneePersonaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: role, type: enum, enum_ref: TripGuideRole, constraints: [NOT_NULL], role: authoritative_state}
- {name: taskKind, type: enum, enum_ref: TripGuideTaskKind, constraints: [NOT_NULL], role: authoritative_state}
- {name: title, type: string, constraints: [NOT_NULL], role: authoritative_state}
- {name: dueAt, type: timestamp, constraints: [NULLABLE], role: authoritative_state}
- {name: sourceRevisionNumber, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: attributionKind, type: enum, enum_ref: TripGuideAttributionKind, constraints: [NOT_NULL], role: authoritative_state}
- {name: attributionPersonaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: publicQualificationPersonaId, type: string, constraints: [NULLABLE], role: authoritative_state, reference: true}
- {name: status, type: enum, enum_ref: TripGuideAssignmentStatus, constraints: [NOT_NULL], role: authoritative_state}
- {name: createdByPersonaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: createdAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
- {name: updatedAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
unique_constraints:
- columns: [tripId, taskKey]
  description: 一个 Trip 内 taskKey 只有一个当前任务归属
types:
  ListTripGuideAssignmentsQuery:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  PutTripGuideAssignmentRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: taskKey, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: assigneePersonaId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: role, type: enum, enum_ref: TripGuideRole, constraints: [NOT_NULL], client_dart_type: TripGuideRole}
    - {name: taskKind, type: enum, enum_ref: TripGuideTaskKind, constraints: [NOT_NULL], client_dart_type: TripGuideTaskKind}
    - {name: title, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: dueAt, type: timestamp, constraints: [NULLABLE], client_dart_type: 'DateTime?'}
    - {name: sourceRevisionNumber, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: attributionKind, type: enum, enum_ref: TripGuideAttributionKind, constraints: [NOT_NULL], client_dart_type: TripGuideAttributionKind}
    - {name: attributionPersonaId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: publicQualificationPersonaId, type: string, constraints: [NULLABLE], client_dart_type: 'String?'}
  TransitionTripGuideAssignmentRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: taskKey, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: targetStatus, type: enum, enum_ref: TripGuideAssignmentStatus, constraints: [NOT_NULL], client_dart_type: TripGuideAssignmentStatus}
  TripGuideAssignmentListSlice:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK]}
    - {name: assignments, type: '[]TripGuideAssignment', constraints: [NOT_NULL]}
enums:
  TripGuideRole:
    values: [leader, assistant_guide, licensed_guide, local_expert]
  TripGuideTaskKind:
    values: [collection, briefing, route_guidance, commentary, general_support]
  TripGuideAttributionKind:
    values: [administrative, general_fact, professional_commentary]
  TripGuideAssignmentStatus:
    values: [assigned, accepted, in_progress, completed, cancelled]
