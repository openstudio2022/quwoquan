description: TripGuideAssignment 创建/改派、状态推进与成员读取。
commercial_defaults:
  status: blocked
  block_reason: User 公开 Persona Reader 已落地；仍缺专业角色 App 旅程、Assistant 任务提醒、法律运营审核、真实 API integration、三环境与双端物理真机 UAT
  gap_id: TRAVEL_GUIDE_ASSIGNMENT_COMMERCIAL_CLOSURE
  target_story: trip-guide-template-assignment
api_routes:
- method: PUT
  path: /travel/trips/{tripId}/guide-assignments/{taskKey}
  operation: PutTripGuideAssignment
  request_bindings: {path: [{name: tripId, field: tripId}, {name: taskKey, field: taskKey}]}
  actor: persona
  security: {auth_mode: required}
  application: {kind: command, facet: TripGuideAssignmentCommandFacet, method: putTripGuideAssignment, aggregate_owner: TripGuideAssignment, mutation_target: TripGuideAssignment, invariant_target: TripGuideAssignment}
  request_entity: PutTripGuideAssignmentRequest
  response_entity: TripGuideAssignment
  authorization: {principal: persona, scopes: [travel.trip.guide_assignment.write], ownership_policy: trip_organizer_only}
  reliability: {timeout_ms: 1800, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_guide_assignment_invalid_argument, TRAVEL.USER.trip_guide_assignment_permission_denied, TRAVEL.USER.trip_guide_assignment_revision_conflict, TRAVEL.USER.trip_guide_assignment_idempotency_conflict, TRAVEL.DEPENDENCY.trip_guide_assignment_reference_unavailable, TRAVEL.SYSTEM.trip_guide_assignment_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: travel_guide_assignment_put, trace: true, attributes: [outcome, role, task_kind]}
  slo: {latency_p95_ms: 800, availability_percent: 99.9}
  request_body_kind: object
- method: POST
  path: /travel/trips/{tripId}/guide-assignments/{taskKey}/transitions
  operation: TransitionTripGuideAssignment
  request_bindings: {path: [{name: tripId, field: tripId}, {name: taskKey, field: taskKey}]}
  actor: persona
  security: {auth_mode: required}
  application: {kind: command, facet: TripGuideAssignmentCommandFacet, method: transitionTripGuideAssignment, aggregate_owner: TripGuideAssignment, mutation_target: TripGuideAssignment, invariant_target: TripGuideAssignment}
  request_entity: TransitionTripGuideAssignmentRequest
  response_entity: TripGuideAssignment
  authorization: {principal: persona, scopes: [travel.trip.guide_assignment.write], ownership_policy: organizer_or_assignee}
  reliability: {timeout_ms: 1500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_guide_assignment_invalid_argument, TRAVEL.USER.trip_guide_assignment_not_found, TRAVEL.USER.trip_guide_assignment_permission_denied, TRAVEL.USER.trip_guide_assignment_state_invalid, TRAVEL.USER.trip_guide_assignment_revision_conflict, TRAVEL.USER.trip_guide_assignment_idempotency_conflict, TRAVEL.SYSTEM.trip_guide_assignment_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: travel_guide_assignment_transition, trace: true, attributes: [outcome, previous_status, target_status]}
  slo: {latency_p95_ms: 650, availability_percent: 99.9}
  request_body_kind: object
- method: GET
  path: /travel/trips/{tripId}/guide-assignments
  operation: ListTripGuideAssignments
  request_bindings: {path: [{name: tripId, field: tripId}]}
  request_entity: ListTripGuideAssignmentsQuery
  actor: persona
  security: {auth_mode: required}
  application: {kind: query, facet: TripGuideAssignmentQueryFacet, method: listTripGuideAssignments, reader: TripGuideAssignmentReader, slice: TripGuideAssignmentListSlice}
  response_entity: TripGuideAssignmentListSlice
  authorization: {principal: persona, scopes: [travel.trip.read], ownership_policy: active_trip_member}
  reliability: {timeout_ms: 900, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: none}
  error_codes: [TRAVEL.USER.trip_guide_assignment_permission_denied, TRAVEL.SYSTEM.trip_guide_assignment_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: travel_guide_assignment_list, trace: true, attributes: [outcome, count]}
  slo: {latency_p95_ms: 400, availability_percent: 99.9}
  request_body_kind: none
