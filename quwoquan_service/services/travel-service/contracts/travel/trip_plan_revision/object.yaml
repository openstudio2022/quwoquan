kind: append_only_fact
description: TripPlan 每次成功创建或修订产生的不可变计划快照、diff 与影响范围。
identity:
  fields: [_id]
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships:
- name: trip_plan
  kind: event_source
  cardinality: N:1
  consistency: strong
  access: event
  on_delete: retain
  reference_fields: [tripId]
  target_object: travel.TripPlan
- name: previous_revision
  kind: event_source
  cardinality: N:1
  consistency: strong
  access: event
  on_delete: retain
  reference_fields: [previousRevisionId]
  target_object: travel.TripPlanRevision
- name: affected_personas
  kind: reference
  cardinality: N:N
  consistency: eventual
  access: named_reader
  on_delete: tombstone
  reference_fields: [affectedPersonaIds]
  target_object: user.Persona
- name: created_by_persona
  kind: reference
  cardinality: N:1
  consistency: eventual
  access: named_reader
  on_delete: tombstone
  reference_fields: [createdByPersonaId]
  target_object: user.Persona
capabilities: [append_only, queryable]
business_rules:
- tripId + revisionNumber 全局唯一且只允许在 TripPlan 事务内追加
- previousRevisionId 必须指向同 Trip 的前一版本；revision 1 为空
- items、diff、影响引用和创建主体写入后不可修改
- Revision 不保存聊天正文、网页原文、个人 Connector 数据或媒体字节
lifecycle:
  immutable: true
