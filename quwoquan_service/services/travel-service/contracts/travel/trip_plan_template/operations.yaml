description: TripPlanTemplate 创建、CAS 修订与 owner 读取。
commercial_defaults:
  status: blocked
  block_reason: 公开 Post 署名 Reader 已落地；仍缺模板复用 App 旅程、Assistant 提醒、真实 API integration、三环境与双端物理真机 UAT
  gap_id: TRAVEL_TRIP_TEMPLATE_COMMERCIAL_CLOSURE
  target_story: trip-guide-template-assignment
api_routes:
- method: POST
  path: /travel/templates
  operation: CreateTripPlanTemplate
  actor: persona
  security: {auth_mode: required}
  application: {kind: command, facet: TripPlanTemplateCommandFacet, method: createTripPlanTemplate, aggregate_owner: TripPlanTemplate, mutation_target: TripPlanTemplate, invariant_target: TripPlanTemplate}
  request_entity: CreateTripPlanTemplateRequest
  response_entity: TripPlanTemplate
  authorization: {principal: persona, scopes: [travel.trip.template.write], ownership_policy: creator_becomes_owner}
  reliability: {timeout_ms: 2000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_plan_template_invalid_argument, TRAVEL.USER.trip_plan_template_idempotency_conflict, TRAVEL.DEPENDENCY.trip_plan_template_reference_unavailable, TRAVEL.SYSTEM.trip_plan_template_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: travel_trip_template_create, trace: true, attributes: [outcome, day_count, item_count]}
  slo: {latency_p95_ms: 900, availability_percent: 99.9}
  request_body_kind: object
- method: POST
  path: /travel/templates/{templateId}/revisions
  operation: ReviseTripPlanTemplate
  request_bindings: {path: [{name: templateId, field: templateId}]}
  actor: persona
  security: {auth_mode: required}
  application: {kind: command, facet: TripPlanTemplateCommandFacet, method: reviseTripPlanTemplate, aggregate_owner: TripPlanTemplate, mutation_target: TripPlanTemplate, invariant_target: TripPlanTemplate}
  request_entity: PutTripPlanTemplateRequest
  response_entity: TripPlanTemplate
  authorization: {principal: persona, scopes: [travel.trip.template.write], ownership_policy: template_owner_only}
  reliability: {timeout_ms: 2000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_plan_template_invalid_argument, TRAVEL.USER.trip_plan_template_not_found, TRAVEL.USER.trip_plan_template_permission_denied, TRAVEL.USER.trip_plan_template_revision_conflict, TRAVEL.USER.trip_plan_template_idempotency_conflict, TRAVEL.DEPENDENCY.trip_plan_template_reference_unavailable, TRAVEL.SYSTEM.trip_plan_template_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: travel_trip_template_revise, trace: true, attributes: [outcome, version, item_count]}
  slo: {latency_p95_ms: 900, availability_percent: 99.9}
  request_body_kind: object
- method: GET
  path: /travel/templates/{templateId}
  operation: GetTripPlanTemplate
  request_bindings: {path: [{name: templateId, field: templateId}]}
  request_entity: GetTripPlanTemplateQuery
  actor: persona
  security: {auth_mode: required}
  application: {kind: query, facet: TripPlanTemplateQueryFacet, method: getTripPlanTemplate, reader: TripPlanTemplateReader, slice: TripPlanTemplate}
  response_entity: TripPlanTemplate
  authorization: {principal: persona, scopes: [travel.trip.read], ownership_policy: template_owner_only}
  reliability: {timeout_ms: 900, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: none}
  error_codes: [TRAVEL.USER.trip_plan_template_not_found, TRAVEL.USER.trip_plan_template_permission_denied, TRAVEL.SYSTEM.trip_plan_template_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: travel_trip_template_get, trace: true, attributes: [outcome, version]}
  slo: {latency_p95_ms: 400, availability_percent: 99.9}
  request_body_kind: none
- method: GET
  path: /travel/templates
  operation: ListTripPlanTemplates
  request_entity: ListTripPlanTemplatesQuery
  actor: persona
  security: {auth_mode: required}
  application: {kind: query, facet: TripPlanTemplateQueryFacet, method: listTripPlanTemplates, reader: TripPlanTemplateReader, slice: TripPlanTemplateListSlice}
  response_entity: TripPlanTemplateListSlice
  authorization: {principal: persona, scopes: [travel.trip.read], ownership_policy: own_templates_only}
  reliability: {timeout_ms: 1000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: none}
  error_codes: [TRAVEL.SYSTEM.trip_plan_template_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: travel_trip_template_list, trace: true, attributes: [outcome, count]}
  slo: {latency_p95_ms: 450, availability_percent: 99.9}
  request_body_kind: none
