    - {name: coarsePlaceRef, type: object, object_ref: TripMomentObjectRef, constraints: [NULLABLE]}
    - {name: visibility, type: enum, enum_ref: TripMomentVisibility, constraints: [NOT_NULL]}
    - {name: assignmentStatus, type: enum, enum_ref: TripMomentAssignmentStatus, constraints: [NOT_NULL]}
    - {name: attributionPersonaId, type: string, constraints: [NOT_NULL]}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: TripMomentStatus, constraints: [NOT_NULL]}
    - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  TripMomentListSlice:
    fields:
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: moments, type: '[]TripMomentSlice', constraints: [NOT_NULL]}
