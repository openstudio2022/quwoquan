- {name: attributionPersonaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: sourceVersion, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: status, type: enum, enum_ref: TripMomentStatus, constraints: [NOT_NULL], role: authoritative_state}
- {name: createdAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
- {name: updatedAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
types:
