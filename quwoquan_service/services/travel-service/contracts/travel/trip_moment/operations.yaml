description: TripMoment 创建、确认归属、删除和 named Reader。
commercial_defaults:
  status: blocked
  block_reason: 缺 Media/Post/Place authority、投影、真实 API 与双端 UAT
  gap_id: TRAVEL_TRIP_MOMENT_COMMERCIAL_CLOSURE
  target_story: trip-moment-content-link
api_routes:
- method: POST
  path: /travel/trips/{tripId}/moments
  operation: CreateTripMoment
  actor: persona
  request_bindings: {path: [{name: tripId, field: tripId}]}
  security: {auth_mode: required}
  application: {kind: command, facet: TripMomentCommandFacet, method: createTripMoment, aggregate_owner: TripMoment, mutation_target: TripMoment, invariant_target: TripMoment}
  request_entity: CreateTripMomentRequest
  response_entity: TripMomentSlice
  authorization: {principal: persona, ownership_policy: active_trip_member}
  reliability: {timeout_ms: 2500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_moment_invalid_argument, TRAVEL.USER.trip_not_found, TRAVEL.USER.trip_permission_denied, TRAVEL.USER.trip_moment_idempotency_conflict, TRAVEL.DEPENDENCY.trip_moment_reference_unavailable, TRAVEL.SYSTEM.trip_moment_storage_failed]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: travel_trip_moment_create, trace: true, attributes: [outcome, kind, visibility, assignment_status]}
  slo: {latency_p95_ms: 900, availability_percent: 99.9}
  request_body_kind: object
- method: POST
  path: /travel/trips/{tripId}/moments/{momentId}/assignments
  operation: AssignTripMoment
  actor: persona
  request_bindings:
    path: [{name: tripId, field: tripId}, {name: momentId, field: momentId}]
  security: {auth_mode: required}
  application: {kind: command, facet: TripMomentCommandFacet, method: assignTripMoment, aggregate_owner: TripMoment, mutation_target: TripMoment, invariant_target: TripMoment}
  request_entity: AssignTripMomentRequest
  response_entity: TripMomentSlice
  authorization: {principal: persona, ownership_policy: moment_owner_or_trip_organizer}
  reliability: {timeout_ms: 2500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_moment_invalid_argument, TRAVEL.USER.trip_moment_not_found, TRAVEL.USER.trip_permission_denied, TRAVEL.USER.trip_moment_revision_conflict, TRAVEL.USER.trip_moment_idempotency_conflict, TRAVEL.DEPENDENCY.trip_moment_reference_unavailable, TRAVEL.SYSTEM.trip_moment_storage_failed]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: travel_trip_moment_assign, trace: true, attributes: [outcome, assignment_status]}
  slo: {latency_p95_ms: 900, availability_percent: 99.9}
  request_body_kind: object
- method: POST
  path: /travel/trips/{tripId}/moments/{momentId}/deletions
  operation: DeleteTripMoment
  actor: persona
  request_bindings:
    path: [{name: tripId, field: tripId}, {name: momentId, field: momentId}]
  security: {auth_mode: required}
  application: {kind: command, facet: TripMomentCommandFacet, method: deleteTripMoment, aggregate_owner: TripMoment, mutation_target: TripMoment, invariant_target: TripMoment}
  request_entity: DeleteTripMomentRequest
  response_entity: TripMomentSlice
  authorization: {principal: persona, ownership_policy: moment_owner_or_trip_organizer}
  reliability: {timeout_ms: 2000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_moment_invalid_argument, TRAVEL.USER.trip_moment_not_found, TRAVEL.USER.trip_permission_denied, TRAVEL.USER.trip_moment_revision_conflict, TRAVEL.USER.trip_moment_idempotency_conflict, TRAVEL.SYSTEM.trip_moment_storage_failed]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: travel_trip_moment_delete, trace: true, attributes: [outcome, kind]}
  slo: {latency_p95_ms: 700, availability_percent: 99.9}
  request_body_kind: object
- method: GET
  path: /travel/trips/{tripId}/moments
  operation: ListTripMoments
  actor: persona
  request_bindings: {path: [{name: tripId, field: tripId}]}
  request_entity: ListTripMomentsQuery
  security: {auth_mode: required}
  application: {kind: query, facet: TripMomentQueryFacet, method: listTripMoments, reader: TripMomentReader, slice: TripMomentListSlice}
  response_entity: TripMomentListSlice
  authorization: {principal: persona, ownership_policy: active_trip_member}
  reliability: {timeout_ms: 1000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: none}
  error_codes: [TRAVEL.USER.trip_not_found, TRAVEL.USER.trip_permission_denied, TRAVEL.SYSTEM.trip_moment_storage_failed]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: travel_trip_moment_list, trace: true, attributes: [outcome, moment_count]}
  slo: {latency_p95_ms: 500, availability_percent: 99.9}
  request_body_kind: none
