backend: mongodb
role: authoritative
collections:
  trip_moments:
    entity: TripMoment
    role: authoritative
    indexes:
    - {name: idx_trip_moment_timeline, keys: {tripId: 1, status: 1, capturedAt: 1, _id: 1}}
    - {name: idx_trip_moment_item, keys: {tripId: 1, revisionNumber: 1, itemId: 1, status: 1}}
  trip_moment_command_receipts:
    entity: TripMomentCommandReceipt
    role: authoritative
  trip_moment_outbox:
    entity: TripMomentOutbox
    role: append_only
  trip_moment_outbox_sequences:
    entity: TripMomentOutbox
    role: authoritative
