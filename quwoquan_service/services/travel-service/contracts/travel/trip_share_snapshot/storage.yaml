backend: mongodb
role: authoritative
collections:
  trip_share_snapshots:
    entity: TripShareSnapshot
    role: authoritative
    indexes:
    - {name: idx_trip_share_snapshot_trip_created, keys: {tripId: 1, createdAt: -1}}
    - {name: idx_trip_share_snapshot_source, keys: {tripId: 1, sourceRevisionNumber: 1, sourceDigest: 1}}
  trip_share_snapshot_command_receipts:
    entity: TripShareSnapshotCommandReceipt
    role: authoritative
  trip_share_snapshot_outbox:
    entity: TripShareSnapshotOutbox
    role: append_only
  trip_share_snapshot_outbox_sequences:
    entity: TripShareSnapshotOutbox
    role: authoritative
