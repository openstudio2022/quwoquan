kind: aggregate_root
description: Trip 与 Conversation/Circle 的显式多对多放置关系；不拥有共享场景事实。
identity:
  fields: [_id]
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- {name: trip_plan, kind: reference, cardinality: 'N:1', consistency: strong, access: named_reader, on_delete: retain, reference_fields: [tripId], target_object: travel.TripPlan}
- {name: shared_surface, kind: reference, cardinality: 'N:1', consistency: eventual, access: named_reader, on_delete: tombstone, reference_fields: [surfaceId], target_objects: [chat.Conversation, circle.Circle]}
- {name: created_by_persona, kind: reference, cardinality: 'N:1', consistency: eventual, access: named_reader, on_delete: tombstone, reference_fields: [createdByPersonaId], target_object: user.Persona}
capabilities: [commandable, queryable, idempotent_commands]
business_rules:
- 同一 tripId + surfaceKind + surfaceId 最多一个当前 Placement
- 放置前必须通过所属 Chat/Circle typed authority 验证场景存在和 actor 管理权限
- sourceVersion 单调推进；过期来源事件不得恢复已移除放置
- 一个共享场景允许多个 Trip；Assistant 无唯一目标时必须返回候选，不得猜测写入
lifecycle:
  state_field: status
  states: [active, removed]
  optimistic_concurrency: version
  idempotency: command_receipt
