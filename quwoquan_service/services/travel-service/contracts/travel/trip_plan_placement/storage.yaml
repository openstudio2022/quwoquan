backend: mongodb
role: authoritative
collections:
  trip_plan_placements:
    entity: TripPlanPlacement
    role: authoritative
    indexes:
    - {name: uq_trip_plan_placement_surface, keys: {tripId: 1, surfaceKind: 1, surfaceId: 1}, unique: true}
    - {name: idx_trip_plan_placement_surface_active, keys: {surfaceKind: 1, surfaceId: 1, status: 1, updatedAt: -1}}
  trip_plan_placement_command_receipts:
    entity: TripPlanPlacementCommandReceipt
    role: authoritative
  trip_plan_placement_outbox:
    entity: TripPlanPlacementOutbox
    role: append_only
  trip_plan_placement_outbox_sequences:
    entity: TripPlanPlacementOutbox
    role: authoritative
