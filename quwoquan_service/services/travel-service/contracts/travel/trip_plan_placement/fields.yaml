description: TripPlanPlacement 与共享场景 Reader 切片。
fields:
- {name: _id, type: string, constraints: [PK, NOT_NULL], role: authoritative_state}
- {name: version, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: tripId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: surfaceKind, type: enum, enum_ref: TripPlacementSurfaceKind, constraints: [NOT_NULL], role: authoritative_state}
- {name: surfaceId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: sourceVersion, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: status, type: enum, enum_ref: TripPlanPlacementStatus, constraints: [NOT_NULL], role: authoritative_state}
- {name: createdByPersonaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: createdAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
- {name: updatedAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
unique_constraints:
- columns: [tripId, surfaceKind, surfaceId]
  description: 一个 Trip 对同一共享场景只有一个当前 Placement
types:
  ListTripPlanPlacementsQuery:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  ListSurfaceTripPlacementsQuery:
    fields:
    - {name: surfaceKind, type: enum, enum_ref: TripPlacementSurfaceKind, constraints: [NOT_NULL], client_dart_type: TripPlacementSurfaceKind}
    - {name: surfaceId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  PutTripPlanPlacementRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: surfaceKind, type: enum, enum_ref: TripPlacementSurfaceKind, constraints: [NOT_NULL], client_dart_type: TripPlacementSurfaceKind}
    - {name: surfaceId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
  RemoveTripPlanPlacementRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: surfaceKind, type: enum, enum_ref: TripPlacementSurfaceKind, constraints: [NOT_NULL], client_dart_type: TripPlacementSurfaceKind}
    - {name: surfaceId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
  TripPlanPlacementSlice:
    fields:
    - {name: placementId, type: string, constraints: [NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL]}
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: surfaceKind, type: enum, enum_ref: TripPlacementSurfaceKind, constraints: [NOT_NULL]}
    - {name: surfaceId, type: string, constraints: [NOT_NULL]}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: TripPlanPlacementStatus, constraints: [NOT_NULL]}
    - {name: createdByPersonaId, type: string, constraints: [NOT_NULL]}
    - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  TripPlanPlacementListSlice:
    fields:
    - {name: tripId, type: string, constraints: [NULLABLE]}
    - {name: surfaceKind, type: enum, enum_ref: TripPlacementSurfaceKind, constraints: [NULLABLE]}
    - {name: surfaceId, type: string, constraints: [NULLABLE]}
    - {name: placements, type: '[]TripPlanPlacementSlice', constraints: [NOT_NULL]}
enums:
  TripPlacementSurfaceKind:
    values: [conversation, circle]
  TripPlanPlacementStatus:
    values: [active, removed]
