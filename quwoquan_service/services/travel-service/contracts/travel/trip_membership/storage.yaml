backend: mongodb
role: authoritative
collections:
  trip_memberships:
    entity: TripMembership
    role: authoritative
    indexes:
    - {name: uq_trip_membership_persona, keys: {tripId: 1, personaId: 1}, unique: true}
    - {name: idx_trip_membership_trip_state, keys: {tripId: 1, state: 1, updatedAt: -1}}
  trip_membership_command_receipts:
    entity: TripMembershipCommandReceipt
    role: authoritative
  trip_membership_outbox:
    entity: TripMembershipOutbox
    role: append_only
  trip_membership_outbox_sequences:
    entity: TripMembershipOutbox
    role: authoritative
