description: TripMembership、来源引用与命令/读切片字段。
fields:
- {name: _id, type: string, constraints: [PK, NOT_NULL], role: authoritative_state}
- {name: version, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: tripId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: personaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: role, type: enum, enum_ref: TripMembershipRole, constraints: [NOT_NULL], role: authoritative_state}
- {name: state, type: enum, enum_ref: TripMembershipState, constraints: [NOT_NULL], role: authoritative_state}
- {name: sourceKind, type: enum, enum_ref: TripMembershipSourceKind, constraints: [NOT_NULL], role: authoritative_state}
- {name: sourceObjectRef, type: TripMembershipSourceRef, constraints: [NULLABLE], role: authoritative_state}
- {name: sourceVersion, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: joinedAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
- {name: updatedAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
unique_constraints:
- columns: [tripId, personaId]
  description: 同一 Persona 在一个 Trip 只有一个当前成员事实
types:
  ListTripMembershipsQuery:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  TripMembershipSourceRef:
    fields:
    - {name: objectTypeRef, type: string, constraints: [NOT_BLANK]}
    - {name: objectId, type: string, constraints: [NOT_BLANK]}
  PutTripMembershipRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: personaId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: role, type: enum, enum_ref: TripMembershipRole, constraints: [NOT_NULL], client_dart_type: TripMembershipRole}
    - {name: sourceKind, type: enum, enum_ref: TripMembershipSourceKind, constraints: [NOT_NULL], client_dart_type: TripMembershipSourceKind}
    - {name: sourceObjectRef, type: object, object_ref: TripMembershipSourceRef, constraints: [NULLABLE], client_dart_type: 'TripMembershipSourceRef?', client_wire: toWire}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
  DepartTripMembershipRequest:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: personaId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: expectedVersion, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: reason, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  TripMembershipSlice:
    fields:
    - {name: membershipId, type: string, constraints: [NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL]}
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: personaId, type: string, constraints: [NOT_NULL]}
    - {name: role, type: enum, enum_ref: TripMembershipRole, constraints: [NOT_NULL]}
    - {name: state, type: enum, enum_ref: TripMembershipState, constraints: [NOT_NULL]}
    - {name: sourceKind, type: enum, enum_ref: TripMembershipSourceKind, constraints: [NOT_NULL]}
    - {name: sourceObjectRef, type: object, object_ref: TripMembershipSourceRef, constraints: [NULLABLE]}
    - {name: sourceVersion, type: int64, constraints: [NOT_NULL]}
    - {name: joinedAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  TripMembershipListSlice:
    fields:
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: memberships, type: '[]TripMembershipSlice', constraints: [NOT_NULL]}
enums:
  TripMembershipRole:
    values: [organizer, participant, leader, assistant_guide, guide, local_expert]
  TripMembershipState:
    values: [active, left, revoked]
  TripMembershipSourceKind:
    values: [trip_invitation, conversation, circle, gathering]
