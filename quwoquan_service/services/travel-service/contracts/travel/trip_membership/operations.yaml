description: TripMembership 角色管理、退出和成员 named Reader。
commercial_defaults:
  status: blocked
  block_reason: 缺来源成员事件收敛、真实 API、群圈与双端 UAT
  gap_id: TRAVEL_TRIP_MEMBERSHIP_COMMERCIAL_CLOSURE
  target_story: trip-placement-collaboration
api_routes:
- method: PUT
  path: /travel/trips/{tripId}/memberships/{personaId}
  operation: PutTripMembership
  actor: persona
  request_bindings:
    path: [{name: tripId, field: tripId}, {name: personaId, field: personaId}]
  security: {auth_mode: required}
  application: {kind: command, facet: TripMembershipCommandFacet, method: putTripMembership, aggregate_owner: TripMembership, mutation_target: TripMembership, invariant_target: TripMembership}
  request_entity: PutTripMembershipRequest
  response_entity: TripMembershipSlice
  authorization: {principal: persona, ownership_policy: trip_organizer_only}
  reliability: {timeout_ms: 2000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_membership_invalid_argument, TRAVEL.USER.trip_not_found, TRAVEL.USER.trip_permission_denied, TRAVEL.USER.trip_membership_revision_conflict, TRAVEL.USER.trip_membership_idempotency_conflict, TRAVEL.DEPENDENCY.trip_membership_source_unavailable, TRAVEL.SYSTEM.trip_membership_storage_failed]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: travel_trip_membership_put, trace: true, attributes: [outcome, role, source_kind]}
  slo: {latency_p95_ms: 700, availability_percent: 99.9}
  request_body_kind: object
- method: POST
  path: /travel/trips/{tripId}/membership-departures/{personaId}
  operation: DepartTripMembership
  actor: persona
  request_bindings:
    path: [{name: tripId, field: tripId}, {name: personaId, field: personaId}]
  security: {auth_mode: required}
  application: {kind: command, facet: TripMembershipCommandFacet, method: departTripMembership, aggregate_owner: TripMembership, mutation_target: TripMembership, invariant_target: TripMembership}
  request_entity: DepartTripMembershipRequest
  response_entity: TripMembershipSlice
  authorization: {principal: persona, ownership_policy: membership_self_or_trip_organizer}
  reliability: {timeout_ms: 2000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TRAVEL.USER.trip_membership_invalid_argument, TRAVEL.USER.trip_membership_not_found, TRAVEL.USER.trip_permission_denied, TRAVEL.USER.trip_membership_revision_conflict, TRAVEL.USER.trip_membership_idempotency_conflict, TRAVEL.SYSTEM.trip_membership_storage_failed]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: travel_trip_membership_depart, trace: true, attributes: [outcome, previous_state]}
  slo: {latency_p95_ms: 700, availability_percent: 99.9}
  request_body_kind: object
- method: GET
  path: /travel/trips/{tripId}/memberships
  operation: ListTripMemberships
  actor: persona
  request_bindings: {path: [{name: tripId, field: tripId}]}
  request_entity: ListTripMembershipsQuery
  security: {auth_mode: required}
  application: {kind: query, facet: TripMembershipQueryFacet, method: listTripMemberships, reader: TripMembershipReader, slice: TripMembershipListSlice}
  response_entity: TripMembershipListSlice
  authorization: {principal: persona, ownership_policy: active_trip_member}
  reliability: {timeout_ms: 1000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: none}
  error_codes: [TRAVEL.USER.trip_not_found, TRAVEL.USER.trip_permission_denied, TRAVEL.SYSTEM.trip_membership_storage_failed]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: travel_trip_membership_list, trace: true, attributes: [outcome, member_count]}
  slo: {latency_p95_ms: 400, availability_percent: 99.9}
  request_body_kind: none
