kind: aggregate_root
description: Trip 内的成员角色和当前参与状态；不复制 Chat、Circle 或 Gathering 名册。
identity:
  fields: [_id]
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- name: trip_plan
  kind: reference
  cardinality: N:1
  consistency: strong
  access: named_reader
  on_delete: retain
  reference_fields: [tripId]
  target_object: travel.TripPlan
- name: member_persona
  kind: reference
  cardinality: N:1
  consistency: eventual
  access: named_reader
  on_delete: tombstone
  reference_fields: [personaId]
  target_object: user.Persona
capabilities: [commandable, queryable, idempotent_commands]
business_rules:
- tripId + personaId 最多一个当前 Membership；organizer 不得被普通成员命令移除
- Conversation/Circle/Gathering 来源只保存 typed reference 和单调 sourceVersion，不复制其成员事实
- 来源成员失效时只通过对应 source-version event 推进 left/revoked，过期事件不得回滚权限
- role 或 state 变化必须使用 expectedVersion CAS，并与幂等回执和 outbox 原子提交
lifecycle:
  state_field: state
  states: [active, left, revoked]
  optimistic_concurrency: version
  idempotency: command_receipt
