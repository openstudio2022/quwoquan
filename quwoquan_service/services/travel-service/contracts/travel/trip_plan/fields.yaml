description: TripPlan 聚合、计划项值对象、命令与 named Slice 的 canonical 字段。
fields:
- {name: _id, type: string, constraints: [PK, NOT_NULL], role: authoritative_state}
- {name: version, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: organizerPersonaId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: title, type: string, constraints: [NOT_NULL], role: authoritative_state}
- {name: status, type: enum, enum_ref: TripPlanStatus, constraints: [NOT_NULL], role: authoritative_state}
- {name: startAt, type: timestamp, constraints: [NULLABLE], role: authoritative_state}
- {name: endAt, type: timestamp, constraints: [NULLABLE], role: authoritative_state}
- {name: sourceTemplateId, type: string, constraints: [NULLABLE], role: authoritative_state, reference: true}
- {name: sourceTemplateVersion, type: int64, constraints: [NULLABLE], role: authoritative_state}
- {name: sourceAttributionIds, type: '[]string', constraints: [NOT_NULL], role: authoritative_state}
- {name: sourceAttributionPersonaIds, type: '[]string', constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: sourcePostIds, type: '[]string', constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: sourceAttributions, type: '[]TripPlanSourceAttribution', constraints: [NOT_NULL], role: authoritative_state}
- {name: currentRevisionId, type: string, constraints: [NOT_NULL], role: authoritative_state, reference: true}
- {name: currentRevisionNumber, type: int64, constraints: [NOT_NULL], role: authoritative_state}
- {name: currentItemCount, type: int, constraints: [NOT_NULL], role: authoritative_state}
- {name: createdAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
- {name: updatedAt, type: timestamp, constraints: [NOT_NULL], role: authoritative_state}
types:
  TripPlaceRef:
    description: 地点的 canonical typed reference；不得携带地图 Provider URL 或参数。
    fields:
    - {name: objectTypeRef, type: string, constraints: [NOT_BLANK]}
    - {name: objectId, type: string, constraints: [NOT_BLANK]}
  TripPlanItemInput:
    description: 创建或修订时提交的结构化计划项。
    fields:
    - {name: itemId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: dayIndex, type: int, constraints: [NOT_NULL], client_dart_type: int}
    - {name: orderInDay, type: int, constraints: [NOT_NULL], client_dart_type: int}
    - {name: kind, type: enum, enum_ref: TripPlanItemKind, constraints: [NOT_NULL], client_dart_type: TripPlanItemKind}
    - {name: title, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: startAt, type: timestamp, constraints: [NULLABLE], client_dart_type: 'DateTime?'}
    - {name: endAt, type: timestamp, constraints: [NULLABLE], client_dart_type: 'DateTime?'}
    - {name: placeRef, type: object, object_ref: TripPlaceRef, constraints: [NULLABLE], client_dart_type: 'TripPlaceRef?', client_wire: toWire}
    - {name: note, type: string, constraints: [NULLABLE], client_dart_type: 'String?'}
  TripPlanItemSlice:
    description: 当前 Revision 中顺序稳定的计划项。
    fields:
    - {name: itemId, type: string, constraints: [NOT_NULL]}
    - {name: dayIndex, type: int, constraints: [NOT_NULL]}
    - {name: orderInDay, type: int, constraints: [NOT_NULL]}
    - {name: kind, type: enum, enum_ref: TripPlanItemKind, constraints: [NOT_NULL]}
    - {name: title, type: string, constraints: [NOT_NULL]}
    - {name: startAt, type: timestamp, constraints: [NULLABLE]}
    - {name: endAt, type: timestamp, constraints: [NULLABLE]}
    - {name: placeRef, type: object, object_ref: TripPlaceRef, constraints: [NULLABLE]}
    - {name: note, type: string, constraints: [NULLABLE]}
  TripPlanSourceAttribution:
    description: 从模板冻结到新 Trip 的公开来源或专业署名快照；不得包含成员、住宿、聊天或私人 Connector 数据。
    fields:
    - {name: attributionId, type: string, constraints: [NOT_BLANK]}
    - {name: kind, type: enum, enum_ref: TripPlanSourceAttributionKind, constraints: [NOT_NULL]}
    - {name: postId, type: string, constraints: [NOT_BLANK]}
    - {name: authorPersonaId, type: string, constraints: [NULLABLE]}
    - {name: title, type: string, constraints: [NOT_BLANK]}
  CreateTripPlanCommand:
    fields:
    - {name: title, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: startAt, type: timestamp, constraints: [NULLABLE], client_dart_type: 'DateTime?'}
    - {name: endAt, type: timestamp, constraints: [NULLABLE], client_dart_type: 'DateTime?'}
    - {name: items, type: '[]TripPlanItemInput', constraints: [NOT_NULL], client_dart_type: 'List<TripPlanItemInput>', client_wire: mapToWire}
  CreateTripPlanFromTemplateCommand:
    fields:
    - {name: templateId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: title, type: string, constraints: [NULLABLE], client_dart_type: 'String?'}
    - {name: startAt, type: timestamp, constraints: [NULLABLE], client_dart_type: 'DateTime?'}
    - {name: endAt, type: timestamp, constraints: [NULLABLE], client_dart_type: 'DateTime?'}
  ReviseTripPlanCommand:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: expectedRevisionNumber, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: changeReason, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: severity, type: enum, enum_ref: TripRevisionSeverity, constraints: [NOT_NULL], client_dart_type: TripRevisionSeverity}
    - {name: items, type: '[]TripPlanItemInput', constraints: [NOT_NULL], client_dart_type: 'List<TripPlanItemInput>', client_wire: mapToWire}
  TransitionTripPlanCommand:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
    - {name: expectedRevisionNumber, type: int64, constraints: [NOT_NULL], client_dart_type: int}
    - {name: targetStatus, type: enum, enum_ref: TripPlanStatus, constraints: [NOT_NULL], client_dart_type: TripPlanStatus}
  TripPlanIDQuery:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  ListTripPlansQuery:
    fields:
    - {name: status, type: enum, enum_ref: TripPlanStatus, constraints: [NULLABLE], client_dart_type: 'TripPlanStatus?'}
    - {name: cursor, type: string, constraints: [NULLABLE], client_dart_type: 'String?'}
    - {name: limit, type: int, constraints: [NULLABLE], client_dart_type: 'int?'}
  TripPlanCommandResult:
    fields:
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL]}
    - {name: currentRevisionId, type: string, constraints: [NOT_NULL]}
    - {name: currentRevisionNumber, type: int64, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: TripPlanStatus, constraints: [NOT_NULL]}
    - {name: idempotentReplay, type: bool, constraints: [NOT_NULL]}
  TripPlanSlice:
    fields:
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL]}
    - {name: organizerPersonaId, type: string, constraints: [NOT_NULL]}
    - {name: title, type: string, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: TripPlanStatus, constraints: [NOT_NULL]}
    - {name: startAt, type: timestamp, constraints: [NULLABLE]}
    - {name: endAt, type: timestamp, constraints: [NULLABLE]}
    - {name: sourceTemplateId, type: string, constraints: [NULLABLE]}
    - {name: sourceTemplateVersion, type: int64, constraints: [NULLABLE]}
    - {name: sourceAttributions, type: '[]TripPlanSourceAttribution', constraints: [NOT_NULL]}
    - {name: currentRevisionId, type: string, constraints: [NOT_NULL]}
    - {name: currentRevisionNumber, type: int64, constraints: [NOT_NULL]}
    - {name: items, type: '[]TripPlanItemSlice', constraints: [NOT_NULL]}
    - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  TripPlanSummarySlice:
    fields:
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: title, type: string, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: TripPlanStatus, constraints: [NOT_NULL]}
    - {name: startAt, type: timestamp, constraints: [NULLABLE]}
    - {name: endAt, type: timestamp, constraints: [NULLABLE]}
    - {name: currentRevisionId, type: string, constraints: [NOT_NULL]}
    - {name: currentRevisionNumber, type: int64, constraints: [NOT_NULL]}
    - {name: itemCount, type: int, constraints: [NOT_NULL]}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  TripPlanListSlice:
    fields:
    - {name: plans, type: '[]TripPlanSummarySlice', constraints: [NOT_NULL]}
    - {name: nextCursor, type: string, constraints: [NULLABLE]}
  TripPlanCommandReceipt:
    fields:
    - {name: _id, type: string, constraints: [PK, NOT_NULL]}
    - {name: commandDigest, type: string, constraints: [NOT_NULL]}
    - {name: tripId, type: string, constraints: [NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL]}
    - {name: revisionNumber, type: int64, constraints: [NOT_NULL]}
    - {name: resultSnapshot, type: object, object_ref: TripPlanCommandResult, constraints: [NOT_NULL]}
    - {name: expiresAt, type: timestamp, constraints: [NOT_NULL]}
  TripPlanOutbox:
    fields:
    - {name: _id, type: string, constraints: [PK, NOT_NULL]}
    - {name: outboxSequence, type: int64, constraints: [NOT_NULL]}
    - {name: eventType, type: string, constraints: [NOT_NULL]}
    - {name: aggregateId, type: string, constraints: [NOT_NULL]}
    - {name: aggregateVersion, type: int64, constraints: [NOT_NULL]}
    - {name: payloadJson, type: json, constraints: [NOT_NULL]}
    - {name: occurredAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: claimedBy, type: string, constraints: [NULLABLE]}
    - {name: leaseExpiresAt, type: timestamp, constraints: [NULLABLE]}
    - {name: publishAttempts, type: int, constraints: [NOT_NULL]}
    - {name: publishedAt, type: timestamp, constraints: [NULLABLE]}
enums:
  TripPlanSourceAttributionKind:
    values: [public_source, professional_commentary]
