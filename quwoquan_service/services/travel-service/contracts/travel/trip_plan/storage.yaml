backend: mongodb
role: authoritative
collections:
  trip_plans:
    entity: TripPlan
    role: authoritative
    indexes:
    - {name: idx_trip_plan_organizer_status, keys: {organizerPersonaId: 1, status: 1, updatedAt: -1, _id: -1}}
  trip_plan_command_receipts:
    entity: TripPlanCommandReceipt
    role: authoritative
    description: 与 TripPlan、Revision 和 outbox 在同一 MongoDB transaction 提交的幂等回执。
  trip_plan_outbox:
    entity: TripPlanOutbox
    role: append_only
    indexes:
    - name: idx_trip_plan_outbox_pending
      keys: {publishedAt: 1, leaseExpiresAt: 1, outboxSequence: 1}
  trip_plan_outbox_sequences:
    entity: TripPlanOutbox
    role: authoritative
