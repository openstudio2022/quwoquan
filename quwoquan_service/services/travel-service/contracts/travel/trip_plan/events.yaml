events:
- name: TripPlanCreated
  producer: travel-service
  consumers: [assistant-service, chat-service, circle-service]
  channel: transactional_outbox
  payload_entity: TripPlan
  payload_fields: [_id, organizerPersonaId, status, sourceTemplateId, sourceTemplateVersion, currentRevisionId, currentRevisionNumber, createdAt]
- name: TripPlanRevised
  producer: travel-service
  consumers: [assistant-service, chat-service, circle-service, notification-service]
  channel: transactional_outbox
  payload_entity: TripPlan
  payload_fields: [_id, status, currentRevisionId, currentRevisionNumber, updatedAt]
- name: TripPlanLifecycleChanged
  producer: travel-service
  consumers: [assistant-service, chat-service, circle-service]
  channel: transactional_outbox
  payload_entity: TripPlan
  payload_fields: [_id, status, currentRevisionId, currentRevisionNumber, updatedAt]
