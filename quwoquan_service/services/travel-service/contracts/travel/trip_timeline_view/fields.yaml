description: TripTimelineView 只读投影字段。
fields:
- {name: tripId, type: string, constraints: [PK, NOT_NULL], role: projection, reference: true}
- {name: tripVersion, type: int64, constraints: [NOT_NULL], role: projection}
- {name: tripStatus, type: enum, enum_ref: TripPlanStatus, constraints: [NOT_NULL], role: projection}
- {name: currentRevisionId, type: string, constraints: [NOT_NULL], role: projection, reference: true}
- {name: currentRevisionNumber, type: int64, constraints: [NOT_NULL], role: projection}
- {name: revisionChangeReason, type: string, constraints: [NOT_NULL], role: projection}
- {name: revisionSeverity, type: enum, enum_ref: TripRevisionSeverity, constraints: [NOT_NULL], role: projection}
- {name: tripContentLinks, type: '[]TripTimelineContentLinkSlice', constraints: [NOT_NULL], role: projection}
- {name: days, type: '[]TripTimelineDaySlice', constraints: [NOT_NULL], role: projection}
- {name: sourceMomentIds, type: '[]string', constraints: [NOT_NULL], role: projection, reference: true}
- {name: sourceContentLinkIds, type: '[]string', constraints: [NOT_NULL], role: projection, reference: true}
- {name: sourceDigest, type: string, constraints: [NOT_NULL], role: projection}
- {name: sourceEventId, type: string, constraints: [NOT_NULL], role: projection}
- {name: projectedAt, type: timestamp, constraints: [NOT_NULL], role: projection}
types:
  GetTripTimelineQuery:
    fields:
    - {name: tripId, type: string, constraints: [NOT_BLANK], client_dart_type: String}
  TripTimelinePlaceRef:
    fields:
    - {name: objectTypeRef, type: string, constraints: [NOT_BLANK]}
    - {name: objectId, type: string, constraints: [NOT_BLANK]}
  TripTimelineContentRef:
    fields:
    - {name: objectTypeRef, type: string, constraints: [NOT_BLANK]}
    - {name: objectId, type: string, constraints: [NOT_BLANK]}
  TripTimelineMomentSlice:
    fields:
    - {name: momentId, type: string, constraints: [NOT_NULL]}
    - {name: kind, type: enum, enum_ref: TripMomentKind, constraints: [NOT_NULL]}
    - {name: contentRef, type: object, object_ref: TripTimelineContentRef, constraints: [NULLABLE]}
    - {name: inlineText, type: string, constraints: [NULLABLE]}
    - {name: capturedAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: coarsePlaceRef, type: object, object_ref: TripTimelinePlaceRef, constraints: [NULLABLE]}
    - {name: visibility, type: enum, enum_ref: TripMomentVisibility, constraints: [NOT_NULL]}
    - {name: attributionPersonaId, type: string, constraints: [NOT_NULL]}
  TripTimelineContentLinkSlice:
    fields:
    - {name: linkId, type: string, constraints: [NOT_NULL]}
    - {name: postId, type: string, constraints: [NOT_NULL]}
    - {name: visibility, type: enum, enum_ref: TripPlanContentLinkVisibility, constraints: [NOT_NULL]}
    - {name: linkedByPersonaId, type: string, constraints: [NOT_NULL]}
  TripTimelineItemSlice:
    fields:
    - {name: itemId, type: string, constraints: [NOT_NULL]}
    - {name: orderInDay, type: int, constraints: [NOT_NULL]}
    - {name: kind, type: enum, enum_ref: TripPlanItemKind, constraints: [NOT_NULL]}
    - {name: title, type: string, constraints: [NOT_NULL]}
    - {name: startAt, type: timestamp, constraints: [NULLABLE]}
    - {name: endAt, type: timestamp, constraints: [NULLABLE]}
    - {name: placeRef, type: object, object_ref: TripTimelinePlaceRef, constraints: [NULLABLE]}
    - {name: note, type: string, constraints: [NULLABLE]}
    - {name: moments, type: '[]TripTimelineMomentSlice', constraints: [NOT_NULL]}
    - {name: contentLinks, type: '[]TripTimelineContentLinkSlice', constraints: [NOT_NULL]}
  TripTimelineDaySlice:
    fields:
    - {name: dayIndex, type: int, constraints: [NOT_NULL]}
    - {name: unassignedMoments, type: '[]TripTimelineMomentSlice', constraints: [NOT_NULL]}
    - {name: unassignedContentLinks, type: '[]TripTimelineContentLinkSlice', constraints: [NOT_NULL]}
    - {name: items, type: '[]TripTimelineItemSlice', constraints: [NOT_NULL]}
