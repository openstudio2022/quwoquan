backend: mongodb
role: projection
collections:
  trip_timeline_views:
    entity: TripTimelineView
    role: projection
    indexes:
    - {name: uq_trip_timeline_view_trip, keys: {tripId: 1}, unique: true}
    - {name: idx_trip_timeline_source_revision, keys: {currentRevisionId: 1, currentRevisionNumber: 1}}
  trip_timeline_projection_receipts:
    entity: TripTimelineProjectionReceipt
    role: inbox
    description: sourceEventId 永久幂等回执；与 Timeline/Map 同事务提交。
    indexes:
    - {name: uq_trip_timeline_projection_event, keys: {sourceEventId: 1}, unique: true}
