description: travel-service 自治运行配置定义；环境只维护差异和引用。
configs:
  - key: sys.travel-service.accountSecurityAuthority.baseUrl
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
  - key: sys.travel-service.accountSecurityAuthority.timeoutMs
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 800
  - key: sys.travel-service.contentPublicAuthority.baseUrl
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
  - key: sys.travel-service.contentPublicAuthority.timeoutMs
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 800
  - key: sys.travel-service.entityPublicAuthority.baseUrl
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
  - key: sys.travel-service.entityPublicAuthority.timeoutMs
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 800
  - key: sys.travel-service.chatSourceAuthority.baseUrl
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
  - key: sys.travel-service.chatSourceAuthority.timeoutMs
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 800
  - key: sys.travel-service.circleSourceAuthority.baseUrl
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
  - key: sys.travel-service.circleSourceAuthority.timeoutMs
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 800
  - key: sys.travel-service.mongo.uri
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: true
  - key: sys.travel-service.mongo.database
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: quwoquan_travel
  - key: sys.travel-service.redis.general.mode
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: standalone
  - key: sys.travel-service.redis.general.addr
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
  - key: sys.travel-service.redis.general.addrs
    type: list
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: []
  - key: sys.travel-service.redis.general.password
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: true
  - key: sys.travel-service.redis.general.db
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 0
  - key: sys.travel-service.redis.general.tls
    type: bool
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: false
  - key: sys.travel-service.redis.general.pool.size
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 0
  - key: sys.travel-service.redis.general.pool.min_idle
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 0
  - key: sys.travel-service.redis.general.pool.read_timeout_ms
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 200
  - key: sys.travel-service.redis.general.pool.write_timeout_ms
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 200
  - key: sys.travel-service.redis.general.pool.dial_timeout_ms
    type: int
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: 500
  - key: sys.travel-service.service.http.addr
    type: string
    scope: workload
    reload: restart
    rollout: progressive
    sensitive: false
    default: ":18093"
