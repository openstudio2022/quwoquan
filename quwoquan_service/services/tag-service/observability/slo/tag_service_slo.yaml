# tag-service 服务面 SLI/SLO 声明（单一真相源：本文件 + 统一 HTTP 中间件指标）。
# 对象级契约 SLO（telemetry.metric + slo）仍由各对象 operations.yaml 声明并经
# ContractGraph 生成 recording/告警；本文件声明服务级健康口径。
service: tag-service
domain: tag

# 指标真相源（Prometheus，统一中间件 /metrics 暴露）
metrics:
  requests_total: http_server_requests_total          # labels: service, route, method, status
  latency_histogram: http_server_duration_seconds     # labels: service, route, method
  error_codes_total: http_server_error_codes_total    # labels: service, error_code, module, kind

slis:
  - id: request_latency
    description: tag 检索/治理接口延迟，分位数取自统一 histogram
    sli: histogram_quantile(q, sum(rate(http_server_duration_seconds_bucket{service="tag-service"}[5m])) by (le))
    objectives:
      p50_ms: 50
      p95_ms: 500
  - id: availability
    description: 服务可用性 = 1 - 5xx 比率
    sli: 1 - sum(rate(http_server_requests_total{service="tag-service",status=~"5.."}[5m])) / sum(rate(http_server_requests_total{service="tag-service"}[5m]))
    objective: 0.999
