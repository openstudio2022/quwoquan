  runner_source_path: quwoquan_service/services/tag-service/tests/api_integration/tag/tag_feedback_fact/tag_feedback_contract__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
