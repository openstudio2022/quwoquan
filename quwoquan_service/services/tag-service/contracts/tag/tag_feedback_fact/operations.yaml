  spec_ref: specs/feature-tree/user-identity-profile-relationship/profile-homepage-redesign/career-interest-profile-editor/spec.md#gwt-002
  producer: service
  layer: local_contract
  target: {kind: operation, id: ReportTagFeedback}
  runner_source_path: quwoquan_service/services/tag-service/tests/local_contract/tag/tag_feedback_fact/tag_feedback_facade__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: report-tag-feedback-api
  spec_ref: specs/feature-tree/user-identity-profile-relationship/profile-homepage-redesign/career-interest-profile-editor/spec.md#gwt-002
  producer: service
