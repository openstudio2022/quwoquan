commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: TAG_TAG_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
externalDependencies:
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [consumeDurable]
    scenes: [general]
api_routes:
  - method: GET
    path: /tag/resolve
    operation: ResolveTag
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: public_taxonomy_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - TAG.USER.invalid_argument
      - TAG.USER.tag_not_found
      - TAG.SYSTEM.storage_read_failed
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: tag_resolve
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 300
      availability_percent: 99.9
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: TagCatalogQueryFacade
      method: resolve
      reader: TagDefinitionReader
      slice: TagDefinitionSlice
    description: 解析单个路径制 tagRef → 标签定义（label / 别名 / 祖先）
    request_bindings:
      query:
        - name: tagRef
          field: tagRef
    response_entity: TagResolveView
    response_fields:
      - tagRef
      - group
      - label
      - labelEn
      - aliases
      - ancestors
    request_entity: ResolveTagQuery
    request_body_kind: none
  - method: GET
    path: /tag/children
    operation: ListTagChildren
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: public_taxonomy_read
