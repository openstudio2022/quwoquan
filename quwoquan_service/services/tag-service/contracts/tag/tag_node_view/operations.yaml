      principal: service
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
    application:
      kind: query
      facet: TagGraphQueryFacade
      method: findInvertedObjects
      reader: TagInvertedObjectReader
      slice: InvertedObjectsSlice
    description: 反向索引——引用某 tagRef 的对象集合；includeDescendants=true 时按路径制子孙标签展开聚合（省/市级 geo 标签反查含全部区县级叶子对象，查询侧展开、存储不变）
    request_bindings:
      query:
        - {name: tagRef, field: tagRef, required: true}
        - {name: objectType, field: objectType, required: false}
        - {name: limit, field: limit, required: false}
        - {name: includeDescendants, field: includeDescendants, required: false}
    response_entity: InvertedObjectsView
    response_fields:
