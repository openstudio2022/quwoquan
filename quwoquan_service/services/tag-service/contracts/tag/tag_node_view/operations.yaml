      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
    application:
      kind: query
      facet: TagGraphQueryFacade
      method: findSharedTags
      reader: ObjectTagIntersectionReader
      slice: SharedTagsSlice
    description: 计算两个对象的共享 tagRef（交集锚点 + 强度 + 来源）
    request_bindings:
      query:
        - {name: objectAId, field: objectAId, required: true}
        - {name: objectAType, field: objectAType, required: false}
        - {name: objectBId, field: objectBId, required: true}
        - {name: objectBType, field: objectBType, required: false}
        - {name: limit, field: limit, required: false}
    response_entity: SharedTagView
    response_fields:
      - tagRef
      - label
      - strength
      - source
