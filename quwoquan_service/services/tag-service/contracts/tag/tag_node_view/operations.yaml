contract_test:
  mock_strategy:
    app_side:
      mock_target: tag-service API
      data_source: fields.yaml
      scenarios:
        - name: resolve_launch_subset
          route: GET /tag/resolve
          assertions:
            - status_200
            - tagref_resolvable
        - name: list_children_admin_regions
          route: GET /tag/children
          assertions:
            - status_200
            - direct_children_only
            - active_only
        - name: validate_expected_taxonomy_release
          route: POST /tag/validate
          assertions:
            - status_200
            - taxonomy_release_matches
            - refs_partitioned_into_valid_and_invalid
    service_side:
      description: 使用真实测试数据库，不 mock 存储层；只读首发子集 seed
      real_engines:
        mongodb: testcontainers (mongo:7)
      data_management:
        seed: fixture 工厂导入首发子集 tag_nodes + object_tag_index
        cleanup: db.tag_nodes.DeleteMany({}); db.object_tag_index.DeleteMany({})
      scenarios:
        - name: resolve_returns_definition
          route: GET /tag/resolve
          assertions:
            - db.tag_nodes.FindOne({tagRef:'Topic/旅行'}) → exists
            - response.label non-empty
        - name: shared_tags_two_objects
          route: GET /internal/tag/shared-tags
          assertions:
            - service_principal_required
            - shared tagRefs ⊆ both objects' tagRefs
  coverage_requirements:
    - resolve subset tagRefs resolvable
    - children direct hierarchy correctness
    - shared-tags intersection correctness
    - inverted returns objects referencing tagRef
