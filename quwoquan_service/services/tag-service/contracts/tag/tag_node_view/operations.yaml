      availability_percent: 99.9
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: TagCatalogQueryFacade
      method: listChildren
      reader: TagHierarchyReader
      slice: TagChildrenSlice
    description: 列出某个 tagRef 的 active 直接子节点；行政区选择使用该公共标签层级接口，不走 user-service 本地 catalog
    request_bindings:
      query:
        - name: parentTagRef
          field: parentTagRef
        - name: limit
          field: limit
    response_entity: TagChildrenSlice
    response_fields:
      - items
    request_entity: ListTagChildrenQuery
    request_body_kind: none
