kind: projection
description: 'TagTaxonomyRelease 激活事件构建的路径制标签节点只读投影。唯一真相源为数据工程

  control_plane/governance/taxonomy

  （四分组 Topic/Audience/Format/Entity，tagRef = 目录路径）。

  tag-service 只读消费离线导入产物，提供 resolve / shared-tags / inverted 查询，

  不接收命令、不产生领域事件；节点数量不进入 TagTaxonomyRelease 聚合一致性边界。

  '
identity:
  fields:
  - releaseId
  - tagRef
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: releaseEvents
  on_delete: tombstone
  reference_fields:
  - releaseId
  target_object: tag.TagTaxonomyRelease
capabilities:
- queryable
business_rules:
- 节点只来自已验证且已激活的 TagTaxonomyRelease，不接受在线临时创建或编辑。
- tagRef 等于 canonical 目录路径且在同一 release 内唯一，查询不得通过字符串前缀猜测跨轴关系。
- 新 release 激活采用完整投影切换；旧 release 只用于回滚与审计，不与当前节点并行读取。
lifecycle:
  source_events: [TagTaxonomyReleaseActivated, TagTaxonomyReleaseRetired]
  checkpoint: active_taxonomy_release_digest
  rebuild: import_active_immutable_taxonomy_release
  tombstone: remove_nodes_from_retired_release_after_atomic_switch
