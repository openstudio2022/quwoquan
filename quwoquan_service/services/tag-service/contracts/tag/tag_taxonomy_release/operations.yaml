description: 'TagTaxonomyRelease 只接受 Data publish Facade 的版本化导入与激活命令。

  离线导入器（cmd/import）是唯一节点写入口：导入完成后经 Stage 以完整

  release intent 落不可变记录，再经 Activate 按 releaseId 做单 active CAS 切换。

  releaseId 是业务身份；canonicalDigest 只校验 taxonomy snapshot 内容，允许不同

  immutable content release 引用同一 digest。

  '
commercial_defaults:
  status: blocked
  block_reason: internal 命令面向 Data publish 管道；beta/gamma 正式导入 pipeline 证据未取得
  gap_id: TAG_TAXONOMY_RELEASE_WIRING
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- method: POST
  path: /internal/tag/taxonomy-releases
  operation: StageTagTaxonomyRelease
  actor: account
  commercial:
    status: ready
  application:
    kind: command
    facet: TagTaxonomyReleaseCommandFacade
    method: stage
    aggregate_owner: TagTaxonomyRelease
    mutation_target: TagTaxonomyRelease
    invariant_target: TagTaxonomyRelease
  authorization:
    principal: service
    ownership_policy: internal_publish_plane
  reliability:
    timeout_ms: 3000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - TAG.USER.release_invalid_argument
  - TAG.USER.release_idempotency_conflict
  - TAG.SYSTEM.release_storage_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: tag_taxonomy_release_stage
    trace: true
    attributes:
    - outcome
    - replayed
  slo:
    latency_p95_ms: 1000
    availability_percent: 99.9
  description: '落一条不可变 staged release（releaseId/sourceOwner/canonicalDigest/releaseKind/nodeCount）。

    releaseId 是业务身份；只有同 releaseId 的完整 intent（sourceOwner/canonicalDigest/releaseKind/nodeCount）

    完全相同才返回首次记录。不同 releaseId 可引用同一 canonicalDigest，并分别保存为独立 immutable release；

    同 releaseId 的任一 intent 字段漂移均返回幂等冲突。

    content 必须至少包含一个节点；release-bound empty_baseline 必须恰好为零节点。

    '
  request_entity: StageTagTaxonomyReleaseRequest
  request_body_kind: object
  response_entity: TagTaxonomyRelease
  security:
    auth_mode: required
    principal: service
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
- method: POST
  path: /internal/tag/taxonomy-releases/{releaseId}:activate
  operation: ActivateTagTaxonomyRelease
  actor: account
  commercial:
    status: ready
  application:
    kind: command
    facet: TagTaxonomyReleaseCommandFacade
    method: activate
    aggregate_owner: TagTaxonomyRelease
    mutation_target: TagTaxonomyRelease
    invariant_target: TagTaxonomyRelease
  authorization:
    principal: service
    ownership_policy: internal_publish_plane
  reliability:
    timeout_ms: 3000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - TAG.USER.release_not_found
  - TAG.USER.release_invalid_transition
  - TAG.USER.release_snapshot_incomplete
  - TAG.USER.release_version_conflict
  - TAG.USER.release_idempotency_conflict
  - TAG.SYSTEM.release_storage_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: tag_taxonomy_release_activate
    trace: true
    attributes:
    - outcome
    - replayed
  slo:
    latency_p95_ms: 1000
    availability_percent: 99.9
  description: '激活 staged 或 retired immutable release：服务端内部 CAS 完成单 active 切换（旧 active → retired）。

    目标已 active 时按 no-op receipt 重放安全；retired 允许 rollback replay，
    历史 release 与 TagNode snapshot 不物理删除；公开请求不携带版本字段。

    '
  response_entity: TagTaxonomyRelease
  request_bindings:
    path:
    - name: releaseId
      field: releaseId
  security:
    auth_mode: required
    principal: service
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
consumers:
- name: data-publish-pipeline
  capabilities:
  - stage_taxonomy_release
  - activate_taxonomy_release
contract_test:
  test_strategy:
    service_side:
      description: 真实 Mongo 验证 release intent 幂等、同 digest 多 release、单 active CAS 切换与状态机
      real_engines:
        mongodb: testcontainers (mongo:7)
      scenarios:
      - name: stage_release_intent_idempotent
        route: POST /internal/tag/taxonomy-releases
        assertions:
        - 同 releaseId 且完整 intent 相同的重复 Stage 返回首次记录，不落第二条
        - 同 releaseId 任一 intent 字段漂移返回幂等冲突
        - 不同 releaseId 使用相同 canonicalDigest 时各自成功落一条 immutable release
      - name: activate_single_active_cas
        route: POST /internal/tag/taxonomy-releases/{releaseId}:activate
        assertions:
        - 激活目标严格按 releaseId 选择，不按 canonicalDigest 选择
        - 激活后旧 active release 变 retired，同一时刻只有一个 active
        - 重复激活 no-op 重放安全
        - release-bound empty_baseline 零节点快照可激活并可重放 retired 历史快照

