description: |-
  TagTaxonomyRelease 同时保留 legacy taxonomy 激活轨与 Data content-release rail。
  Data rail 只接受 canonical immutable release header + attestation，以
  (environment, sourceOwner=qwq_data, releaseId, manifestDigest) stage immutable verified
  candidate；导入器在 stage-only 模式绝不调用 legacy Activate，后续 exact query 也只按完整
  identity 读取、重验 candidate document、节点闭包和 canonical indexes，不扫描 latest。
commercial_defaults:
  status: blocked
  block_reason: internal 命令面向 Data publish 管道；beta/gamma 正式导入 pipeline 证据未取得
  gap_id: TAG_TAXONOMY_RELEASE_WIRING
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- method: POST
  path: /internal/tag/taxonomy-releases
  operation: StageTagTaxonomyRelease
  actor: account
  commercial: {status: ready}
  application:
    kind: command
    facet: TagTaxonomyReleaseCommandFacade
    method: stage
    aggregate_owner: TagTaxonomyRelease
    mutation_target: TagTaxonomyRelease
    invariant_target: TagTaxonomyRelease
  authorization: {principal: service, ownership_policy: internal_publish_plane}
  reliability: {timeout_ms: 3000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TAG.USER.release_invalid_argument, TAG.USER.release_idempotency_conflict, TAG.SYSTEM.release_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: tag_taxonomy_release_stage, trace: true, attributes: [outcome, replayed]}
  slo: {latency_p95_ms: 1000, availability_percent: 99.9}
  description: |-
    Legacy 非 Data rail：按 releaseId 落 staged taxonomy release。Data content importer 不调用此
    HTTP Activate 流；其 owner-local candidate 使用完整 Content fence 单独持久化到 verified。
  request_entity: StageTagTaxonomyReleaseRequest
  request_body_kind: object
  response_entity: TagTaxonomyRelease
  security: {auth_mode: required, principal: service, token_transport: bearer, anonymous_policy: deny, visibility: internal}
- method: POST
  path: /internal/tag/taxonomy-releases/{releaseId}:activate
  operation: ActivateTagTaxonomyRelease
  actor: account
  commercial: {status: ready}
  application:
    kind: command
    facet: TagTaxonomyReleaseCommandFacade
    method: activate
    aggregate_owner: TagTaxonomyRelease
    mutation_target: TagTaxonomyRelease
    invariant_target: TagTaxonomyRelease
  authorization: {principal: service, ownership_policy: internal_publish_plane}
  reliability: {timeout_ms: 3000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [TAG.USER.release_not_found, TAG.USER.release_invalid_transition, TAG.USER.release_snapshot_incomplete, TAG.USER.release_version_conflict, TAG.USER.release_idempotency_conflict, TAG.SYSTEM.release_storage_failed]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: tag_taxonomy_release_activate, trace: true, attributes: [outcome, replayed]}
  slo: {latency_p95_ms: 1000, availability_percent: 99.9}
  description: |-
    Legacy 非 Data rail 的 taxonomy active CAS。Data content rail importer 必须显式
    --activation-mode=stage-only，禁止调用本操作，因此 stage B 不会改变 legacy active A。
  response_entity: TagTaxonomyRelease
  request_bindings: {path: [{name: releaseId, field: releaseId}]}
  security: {auth_mode: required, principal: service, token_transport: bearer, anonymous_policy: deny, visibility: internal}
consumers:
- name: data-publish-pipeline
  capabilities: [stage_taxonomy_release, activate_taxonomy_release, stage_tag_content_release_candidate, query_exact_tag_content_release_candidate]
contract_test:
  test_strategy:
    service_side:
      description: 真实 Mongo 验证 legacy 激活兼容与 Data rail exact verified candidate/receipt
      real_engines: {mongodb: 'testcontainers (mongo:7)'}
      scenarios:
      - name: data_candidate_stage_only
        assertions:
        - 完整 Content fence 首次导入落 verified candidate，same digest replay 只读校验
        - 同 environment/sourceOwner/releaseId 的 manifest 或 candidate projection 漂移显式冲突
        - stage B 不调用 Activate 且不改变 legacy active A
      - name: data_candidate_exact_query
        assertions:
        - 只按 environment/sourceOwner/releaseId/manifestDigest exact query，不扫描 latest
        - 查询重验 persisted candidate、node count/closure、canonical digest、tagRefs digest 与索引
        - not_found 与 found 均输出 create-once、非 symlink receipt
