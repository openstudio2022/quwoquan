backend: mongodb
collections:
  tag_taxonomy_releases:
    entity: TagTaxonomyRelease
    role: authoritative
    indexes:
    - name: uq_tag_taxonomy_release_single_active
      keys:
        status: 1
      unique: true
      partial_filter:
        status: active
    - name: idx_tag_taxonomy_release_digest
      keys:
        canonicalDigest: 1
      unique: false
role: authoritative
