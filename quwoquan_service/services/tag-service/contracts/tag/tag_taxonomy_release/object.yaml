kind: aggregate_root
description: |-
  一次不可变标签分类发布。prior taxonomy 可保留单 active；Data content rail 只按完整 Content
  fence stage verified candidate，不创建 Tag 自有 Content active pointer，也不得激活 prior taxonomy。
identity:
  fields: [releaseId]
  version_source: store_commit
access: {commands: aggregate_facade, cross_context: public_contract_only, queries: named_reader}
relationships: []
search_policy: {exposed: none, not_exposed_reason: '目录与发布对象由所属域按版本直接读取，不进入统一检索索引。'}
assistant_access:
  read: {mode: metadata_only, scopes: [assistant.tag.tag_taxonomy_release.read]}
  cite: {mode: none, scopes: []}
  write: {mode: none, scopes: []}
business_rules:
- Data content fence 唯一身份为 environment/sourceOwner/releaseId/manifestDigest；sourceOwner 必须 qwq_data
- Data candidate 到 verified 为止，绑定 projectionVersion、canonicalDigest、node closure、tagRefsDigest 和 expected/projected counts
- exact query 每次重验 persisted candidate、节点闭包和 canonical indexes；禁止扫描 latest
- Data importer 必须显式 stage-only，不调用 prior Activate，stage B 不改变 active A
- prior taxonomy active 只用于非 Data rail 兼容；不得创建 Tag 独立 Content active pointer
- retired prior release 可 rollback/replay，历史 release 与 TagNode snapshot 不物理删除
lifecycle:
  state_field: status
  states: [staged, verified, active, retired, rejected]
  optimistic_concurrency: version
  idempotency: import_receipt
