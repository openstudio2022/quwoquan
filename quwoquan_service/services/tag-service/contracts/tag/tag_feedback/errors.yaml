entity: TagFeedback
domain: TAG
errors:
- code: TAG.USER.feedback_invalid_action
  kind: USER
  reason: feedback_invalid_action
  http_status: 400
  recovery_action: surface
  dart_const: tagFeedbackInvalidAction
  go_const: ErrTagFeedbackInvalidAction
  user_message:
    zh: 标签反馈动作不合法
    en: Invalid tag feedback action
- code: TAG.USER.feedback_idempotency_conflict
  kind: USER
  reason: feedback_idempotency_conflict
  http_status: 409
  recovery_action: refresh
  dart_const: tagFeedbackIdempotencyConflict
  go_const: ErrTagFeedbackIdempotencyConflict
  user_message:
    zh: 重复反馈与原请求不一致
    en: The repeated feedback differs from the original request
- code: TAG.SYSTEM.feedback_storage_failed
  kind: SYSTEM
  reason: feedback_storage_failed
  http_status: 500
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: tagFeedbackStorageFailed
  go_const: ErrTagFeedbackStorageFailed
  user_message:
    zh: 标签反馈暂时无法记录，请稍后重试
    en: Unable to record tag feedback, please retry
