kind: projection
description: TagTaxonomyRelease 与对象标签事实构建的对象到 canonical tagRef 倒排视图，供搜索、推荐与交集统一读取。
identity:
  fields:
  - objectType
  - objectId
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: releaseProvenance
  on_delete: retain
  reference_fields:
  - releaseId
  - visibleFromReleaseId
  - taxonomyReleaseId
  target_object: tag.TagTaxonomyRelease
local_identity_reasons:
  sourceEventId: durable stream 事件相关键，仅用于幂等审计与故障诊断，不是 ObjectTagIndexView 对象身份
search_policy:
  exposed: none
  not_exposed_reason: "服务内部投影，只供所属域 named Reader 消费，不构成独立检索结果类型。"
assistant_access:
  read:
    mode: public
    scopes:
    - assistant.tag.object_tag_index_view.read
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
business_rules:
- 只接受已激活 taxonomy release 中存在的 tagRef，未知或退役 tag 不得进入在线索引。
- objectType 与 objectId 的标签集合按 source event version 幂等替换，不做跨轴路径猜测。
- 对象或 release tombstone 必须移除对应标签绑定并保留 checkpoint。
lifecycle:
  source_events:
  - user.user_account.UserProfileTagsChanged
  checkpoint: taxonomy_release_and_object_event_sequence
  rebuild: load_active_taxonomy_then_replay_user_profile_tag_events
  tombstone: delete_object_tag_bindings_keep_checkpoint
  event_consumers:
  - name: ProjectObjectTagIndex
    kind: projector
    facet: UserProfileTagConsumer
    method: processOnce
    idempotency: aggregate_version
