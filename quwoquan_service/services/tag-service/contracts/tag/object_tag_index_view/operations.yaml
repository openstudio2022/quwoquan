description: ObjectTagIndexView 通过 active taxonomy release 拉取构建基础索引，并仅消费 UserProfileTagsChanged durable 事件更新用户标签绑定。
api_routes: []
runtime_entrypoints:
- name: ProjectObjectTagIndex
  kind: projector
  phase: event_projection
  application:
    kind: command
    facet: UserProfileTagConsumer
    method: processOnce
    object_owner: ObjectTagIndexView
  telemetry:
    metric: tag_object_tag_index_projection
    trace: true
    attributes: [outcome]
  slo:
    freshness_p95_seconds: 60
    backlog_max_events: 1000
    failure_ratio_percent: 1

readiness_cases:
- case_id: project-object-tag-index-local
  spec_ref: specs/feature-tree/user-identity-profile-relationship/profile-homepage-redesign/spec.md#sit-006
  producer: service
  layer: local_contract
  target: {kind: object, id: tag.object_tag_index_view}
  runner_source_path: quwoquan_service/services/tag-service/tests/local_contract/tag/object_tag_index_view/user_profile_tag_consumer__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: project-object-tag-index-api
  spec_ref: specs/feature-tree/user-identity-profile-relationship/profile-homepage-redesign/spec.md#sit-006
  producer: service
  layer: api_integration
  target: {kind: object, id: tag.object_tag_index_view}
  runner_source_path: quwoquan_service/services/tag-service/tests/api_integration/tag/object_tag_index_view/mongo_projection__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
