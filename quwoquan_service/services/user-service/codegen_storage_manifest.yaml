service: user-service
output_dir: services/user-service/internal
module_path: quwoquan_service/services/user-service/internal

sources:
  - metadata: user/user_profile
    domain_pkg: user
    tables:
      - user_profiles
      - personas
      - user_auth
      - user_devices
      - user_settings
      - credential_bindings
      - anonymous_device_bindings
      - profile_qr_tokens
    migration_skip_tables:
      - profile_qr_tokens
    name_overrides:
      UserProfile: Profile
      UserSetting: Setting
    type_overrides:
      UserSetting:
        contentLanguage: "*string"
        feedPreference: "*string"
    cache_overrides:
      "cache:user_profile:{userId}":
        entity: FullSnapshot
        name: Profile
      "cache:user_setting:{userId}":
        name: Setting

  - metadata: user/persona_relationship
    domain_pkg: persona_relationship
    domain_path: relationship/persona_relationship
    events_only: true

  - metadata: user/profile_update_proposal
    domain_pkg: profile_update_proposal
    domain_path: persona/profile_update_proposal
    tables:
      - profile_update_proposals
      - profile_update_proposals_command_receipts
      - profile_update_proposals_outbox
    migration_skip_tables:
      - profile_update_proposals
      - profile_update_proposals_command_receipts
      - profile_update_proposals_outbox

  - metadata: user/contact_discovery
    domain_pkg: user
    name_overrides:
      ContactDiscoveryRecord: ContactDiscovery

  - metadata: user/invite_record
    domain_pkg: user
    name_overrides:
      InviteRecord: Invite

  - metadata: user/user_life_item
    domain_pkg: user
    name_overrides:
      UserLifeItem: LifeItem

  - metadata: user/user_work
    domain_pkg: user
    name_overrides:
      UserWork: Work

  - metadata: user/greeting_request
    domain_pkg: user
    name_overrides:
      GreetingRequest: Greeting
