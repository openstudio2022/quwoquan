description: 资料修改提案（状态机 + 乐观锁）
fields:
  - name: id
    source: id
    type: string
    constraints:
      - PK
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: personaId
    source: personaId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: source
    source: source
    type: enum
    enum_ref: ProposalSource
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: proposedChanges
    source: proposedChanges
    type: jsonb
    constraints:
      - NOT_NULL
    classification: SENSITIVE
    log_policy: mask
    api_exposure: read
    ops_exposure: read
    description: ProfileChangeSet typed value object 的持久化编码；领域层禁止动态 Map。
    role: authoritative_state
  - name: reason
    source: reason
    type: string
    constraints:
      - NOT_NULL
    classification: SENSITIVE
    log_policy: mask
    api_exposure: read
    ops_exposure: read
    description: 创建者提交的可审核变更理由。
    role: authoritative_state
  - name: evidenceRefs
    source: evidenceRefs
    type: jsonb
    constraints:
      - NOT_NULL
    classification: SENSITIVE
    log_policy: metadata_only
    api_exposure: read
    ops_exposure: read
    description: 有界、去重且稳定排序的 typed source evidence references。
    role: authoritative_state
  - name: impactScope
    source: impactScope
    type: jsonb
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 必须与 ProfileChangeSet 实际字段完全一致的有界影响范围。
    role: authoritative_state
  - name: createdBy
    source: createdBy
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: createdRequestId
    source: createdRequestId
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: createdTraceId
    source: createdTraceId
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: status
    source: status
    type: enum
    enum_ref: ProposalStatus
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    role: authoritative_state
  - name: reviewedBy
    source: reviewedBy
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: targetPersonaExpectedVersion
    source: targetPersonaExpectedVersion
    type: int
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: apply 时调用 Persona Command Facade 的乐观锁版本。
    role: authoritative_state
  - name: applyActorPersonaId
    source: applyActorPersonaId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: applyRequestId
    source: applyRequestId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: applyTraceId
    source: applyTraceId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: applyAuditId
    source: applyAuditId
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: rollbackDeadline
    source: rollbackDeadline
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: rollbackActorPersonaId
    source: rollbackActorPersonaId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: rollbackRequestId
    source: rollbackRequestId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: rollbackTraceId
    source: rollbackTraceId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: rollbackAuditId
    source: rollbackAuditId
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: version
    source: version
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: PUBLIC
    log_policy: allow
    api_exposure: drop
    ops_exposure: drop
    description: 乐观锁版本号
    role: authoritative_state
  - name: createdAt
    source: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: resolvedAt
    source: resolvedAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
types:
  CreateProfileUpdateProposalCommand:
    fields:
      - name: personaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: proposalId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: source
        type: enum
        enum_ref: ProposalSource
      - name: displayName
        type: string
        constraints: [NULLABLE, MAX_LENGTH_64]
      - name: bio
        type: string
        constraints: [NULLABLE, MAX_LENGTH_500]
      - name: avatarMediaAssetId
        type: string
        constraints: [NULLABLE]
      - name: backgroundMediaAssetId
        type: string
        constraints: [NULLABLE]
      - name: isPrivate
        type: bool
        constraints: [NULLABLE]
      - name: isolationLevel
        type: string
        constraints: [NULLABLE]
      - name: purposeHint
        type: string
        constraints: [NULLABLE, MAX_LENGTH_120]
      - name: reason
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: evidenceRefs
        type: '[]string'
        client_dart_type: List<String>
        client_normalization: trim_dedupe_drop_empty
      - name: impactScope
        type: '[]string'
        client_dart_type: List<String>
        client_normalization: trim_dedupe_drop_empty
  ProfileUpdateProposalListQuery:
    fields:
      - name: personaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: cursor
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
  RejectProfileUpdateProposalCommand:
    fields:
      - name: id
        type: string
        constraints:
          - NOT_BLANK
        client_dart_name: proposalId
        client_dart_type: String
        client_normalization: trim
  RollbackProfileUpdateProposalCommand:
    fields:
      - name: id
        type: string
        constraints:
          - NOT_BLANK
        client_dart_name: proposalId
        client_dart_type: String
        client_normalization: trim
  ConfirmProfileUpdateProposalCommand:
    fields:
      - name: id
        type: string
        constraints:
          - NOT_BLANK
        client_dart_name: proposalId
        client_dart_type: String
        client_normalization: trim
  ProfileUpdateProposalQuery:
    fields:
      - name: id
        type: string
        constraints:
          - NOT_BLANK
        client_dart_name: proposalId
        client_dart_type: String
        client_normalization: trim
  ApplyProfileUpdateProposalCommand:
    fields:
      - name: id
        type: string
        constraints:
          - NOT_BLANK
        client_dart_name: proposalId
        client_dart_type: String
        client_normalization: trim
