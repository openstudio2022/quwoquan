consumers:
  - name: app
    capabilities:
      - create_profile_proposal
      - confirm_profile_proposal
      - apply_profile_proposal
      - rollback_profile_proposal
      - reject_profile_proposal
      - read_profile_proposal
  - name: assistant-service
    capabilities:
      - create_profile_proposal
      - consume_profile_proposal_events
contract_test:
  scenarios:
    - name: owner_and_bola
      assertions:
        - verified_persona_only
        - foreign_persona_returns_not_found
        - no_state_change
    - name: server_owned_cas_and_idempotency
      assertions:
        - caller_version_absent
        - pure_cas_conflict_retried
        - same_key_same_result
        - same_key_different_command_conflict
    - name: aggregate_outbox_atomicity
      assertions:
        - state_receipt_outbox_same_transaction
        - one_event_per_version
    - name: audit_and_controlled_rollback
      assertions:
        - immutable_apply_audit
        - applying_response_loss_recovery
        - rollback_window_enforced
        - rollback_requires_unchanged_persona_version
        - rollback_receipt_replay
