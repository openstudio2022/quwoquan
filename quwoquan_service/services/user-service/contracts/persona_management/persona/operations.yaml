    trace: true
    attributes:
    - outcome
    - error_code
  slo:
    latency_p95_ms: 1500
    availability_percent: 99.9
  client_contract:
    dart_import: ../user/persona_contracts.dart
    request_type: UpdateUserProfileCommand
    response_type: ProfileUpdateSnapshot
    request_encoder: encodeUpdateUserProfileCommand
    response_decoder: decodeProfileUpdateSnapshot
