description: Persona 对象专属 command packet。
api_routes:
  - method: POST
    path: /user/personas
    operation: CreatePersona
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: createPersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 创建新分身；userHandle/趣我圈号由服务端按 personaId 系统分配，客户端不提交
    request_entity: CreatePersonaCommand
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaManagementItemView
    response_entity_ref: user.UserAccount
    response_fields:
      - personaId
      - displayName
      - userHandle
      - avatarUrl
      - backgroundUrl
      - bio
      - isolationLevel
      - isActive
      - isPrimary
      - status
      - retiredAt
      - inheritsProfileFromOwner
      - overriddenProfileFields
      - lastProfileSyncAt
      - lastProfileSyncSource
      - profileVisibility
      - purposeHint
      - updatedAt
      - lastActivatedAt
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PERSONA.quota_reached
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
      - USER.PERSONA.handle_taken
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_persona_create
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_body: PersonaManagementItemView
    response_body_kind: object
    request_body_kind: object
  - method: PATCH
    path: /user/personas/{personaId}
    operation: UpdatePersona
    request_bindings:
      path:
        - name: personaId
          field: personaId
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: updatePersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 更新分身资料或隔离等级；userHandle/趣我圈号只读，不允许客户端修改
    request_entity: UpdatePersonaCommand
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaManagementItemView
    response_entity_ref: user.UserAccount
    response_fields:
      - personaId
      - displayName
      - userHandle
      - avatarUrl
      - backgroundUrl
      - bio
      - isolationLevel
      - isActive
      - isPrimary
      - status
      - retiredAt
      - inheritsProfileFromOwner
      - overriddenProfileFields
      - lastProfileSyncAt
      - lastProfileSyncSource
      - profileVisibility
      - purposeHint
      - updatedAt
      - lastActivatedAt
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PERSONA.not_found
      - USER.PERSONA.handle_readonly
      - USER.PERSONA.retired_guard
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
      - USER.PERSONA.handle_taken
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_persona_update
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_body: PersonaManagementItemView
    response_body_kind: object
    request_body_kind: object
  - method: POST
    path: /user/personas/{personaId}/profile-sync
    operation: ApplyPersonaProfileSync
    request_bindings:
      path:
        - name: personaId
          field: personaId
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: applyPersonaProfileSync
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 将某个分身的资料字段同步到全部或指定其它分身
    request_entity: ApplyPersonaProfileSyncCommand
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PERSONA.not_found
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
      - USER.PERSONA.handle_taken
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_persona_profile_sync
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_entity: PersonaProfileSyncResult
    response_body: PersonaProfileSyncResult
    response_body_kind: object
    request_body_kind: object
  - method: POST
    path: /user/personas/{personaId}/retire
    operation: RetirePersona
    request_bindings:
      path:
        - name: personaId
          field: personaId
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: retirePersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 退役非主、非激活且非最后一个分身；Persona 标识永久保留以承载跨域归因
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaLifecycleGuardView
    response_entity_ref: user.UserAccount
    response_fields:
      - personaId
      - requestedAction
      - allowed
      - reason
      - requiresSuccessor
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PERSONA.not_found
      - USER.PERSONA.last_persona
      - USER.PERSONA.primary_guard
      - USER.PERSONA.active_guard
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_persona_retire
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_body: PersonaLifecycleGuardView
    response_body_kind: object
    request_entity: RetirePersonaCommand
    request_body_kind: none
  - method: POST
    path: /user/personas/{personaId}/activate
    operation: ActivatePersona
    request_bindings:
      path:
        - name: personaId
          field: personaId
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: activatePersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 切换激活分身（强一致，排他写）
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: ActivePersonaContextView
    response_entity_ref: user.UserAccount
    response_fields:
      - ownerUserId
      - personaId
      - subjectType
      - displayName
      - avatarUrl
      - avatarVersion
      - isPrimary
      - isolationLevel
      - profileVisibility
      - contextVersion
      - personaSnapshotVersion
      - sourceSurfaceId
      - explicitOverride
      - switchedAt
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PERSONA.not_found
      - USER.PERSONA.retired_guard
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_persona_activate
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_body: ActivePersonaContextView
    response_body_kind: object
    request_entity: ActivatePersonaCommand
    request_body_kind: none
  - method: PATCH
    path: /user/profile
    operation: UpdateUserProfile
    actor: persona
    application:
      kind: command
      facet: ProfileCommandFacade
      method: updateUserProfile
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 更新当前 active Persona 的公开资料；UserAccount 同名字段仅由 durable projector 物化，禁止直接写入
    request_entity: UpdateUserProfileCommand
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PROFILE.invalid_media_asset
      - USER.PROFILE.invalid_region
      - USER.PROFILE.invalid_tag_ref
      - USER.PROFILE.taxonomy_release_conflict
      - USER.PROFILE.version_conflict
      - USER.PROFILE.idempotency_conflict
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_profile_update
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_entity: ProfileUpdateSnapshot
    response_body: ProfileUpdateSnapshot
    response_body_kind: object
    request_body_kind: object
