    path: /user/profile
    operation: UpdateUserProfile
    actor: persona
    application:
      kind: command
      facet: ProfileCommandFacade
      method: updateUserProfile
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 更新当前 active Persona 的公开资料；UserAccount 同名字段仅由 durable projector 物化，禁止直接写入
    request_entity: UpdateUserProfileCommand
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PROFILE.invalid_media_asset
      - USER.PROFILE.invalid_region
      - USER.PROFILE.invalid_tag_ref
      - USER.PROFILE.taxonomy_release_conflict
      - USER.PROFILE.version_conflict
      - USER.PROFILE.idempotency_conflict
