  - subAccountId
  - subjectType
  - displayName
  - avatarUrl
  - avatarVersion
  - isPrimary
  - isolationLevel
  - profileVisibility
  - contextVersion
  - personaSnapshotVersion
  - sourceSurfaceId
  - explicitOverride
  - switchedAt
  authorization:
    principal: account
    ownership_policy: current_account_owner
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - USER.USER.invalid_argument
  - USER.USER.unauthorized
  - USER.SUB_ACCOUNT.not_found
  - USER.SUB_ACCOUNT.retired_guard
  - USER.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: user_persona_activate
    trace: true
    attributes:
    - outcome
    - error_code
  slo:
    latency_p95_ms: 1500
    availability_percent: 99.9
  client_contract:
    dart_import: ../user/persona_contracts.dart
    request_type: ActivatePersonaCommand
    response_type: ActivePersonaContext
    request_encoder: encodeActivatePersonaCommand
    response_decoder: decodeActivePersonaContext
- method: PATCH
  path: /user/profile
  operation: UpdateUserProfile
  actor: persona
  application:
    kind: command
    facet: ProfileCommandFacade
    method: updateUserProfile
    aggregate_owner: Persona
    mutation_target: Persona
    invariant_target: Persona
  description: '[已有] 更新主控账号资料'
  request_entity: SubAccountProfileMutation
  request_fields:
  - nickname
  - displayName
  - avatarAssetId
  - avatarUrl
  - backgroundAssetId
  - backgroundUrl
  - bio
  - gender
  - birthDate
  - regionTagRef
  - occupationTagRef
  - interestTagRefs
  - expectedTaxonomyReleaseId
  - identityTags
  - profileVisibility
  - applyScope
  - syncTargetIds
  - fieldsMask
  commercial:
    status: ready
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
  authorization:
    principal: account
    ownership_policy: current_account_owner
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - USER.USER.invalid_argument
  - USER.USER.unauthorized
  - USER.USER.nickname_taken
  - USER.PROFILE.invalid_media_asset
  - USER.PROFILE.invalid_region
  - USER.PROFILE.invalid_tag_ref
  - USER.PROFILE.taxonomy_release_conflict
  - USER.PROFILE.version_conflict
  - USER.PROFILE.idempotency_conflict
