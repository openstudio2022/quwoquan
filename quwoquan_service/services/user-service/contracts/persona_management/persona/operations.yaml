description: Persona 对象专属 command packet。
api_routes:
  - method: POST
    path: /user/personas
    operation: CreatePersona
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: createPersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 创建新分身；userHandle/趣我圈号由服务端按 personaId 系统分配，客户端不提交
    request_entity: CreatePersonaCommand
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaManagementItemView
    response_entity_ref: user.UserAccount
    response_fields:
      - personaId
      - displayName
      - userHandle
      - avatarUrl
      - backgroundUrl
      - bio
      - isolationLevel
      - isActive
      - isPrimary
      - status
      - retiredAt
      - inheritsProfileFromOwner
      - overriddenProfileFields
      - lastProfileSyncAt
      - lastProfileSyncSource
      - profileVisibility
      - purposeHint
      - updatedAt
      - lastActivatedAt
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PERSONA.quota_reached
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
      - USER.PERSONA.handle_taken
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_persona_create
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_body: PersonaManagementItemView
    response_body_kind: object
    request_body_kind: object
  - method: PATCH
    path: /user/personas/{personaId}
    operation: UpdatePersona
    request_bindings:
      path:
        - name: personaId
          field: personaId
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: updatePersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 更新分身资料或隔离等级；userHandle/趣我圈号只读，不允许客户端修改
    request_entity: UpdatePersonaCommand
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaManagementItemView
    response_entity_ref: user.UserAccount
    response_fields:
      - personaId
      - displayName
      - userHandle
      - avatarUrl
      - backgroundUrl
      - bio
      - isolationLevel
      - isActive
      - isPrimary
      - status
      - retiredAt
      - inheritsProfileFromOwner
      - overriddenProfileFields
      - lastProfileSyncAt
      - lastProfileSyncSource
      - profileVisibility
      - purposeHint
      - updatedAt
      - lastActivatedAt
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.PERSONA.not_found
      - USER.PERSONA.handle_readonly
      - USER.PERSONA.retired_guard
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
      - USER.PERSONA.handle_taken
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_persona_update
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    response_body: PersonaManagementItemView
    response_body_kind: object
    request_body_kind: object
