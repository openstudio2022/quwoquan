  role: authoritative_state
- name: backgroundMediaAssetId
  source: backgroundMediaAssetId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 主页头图 MediaAsset identity。
  role: authoritative_state
  reference: true
- name: bio
  source: bio
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  description: 子账号简介；为空时继承 owner 基线
  role: authoritative_state
- name: callerRingtoneId
  source: callerRingtoneId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
