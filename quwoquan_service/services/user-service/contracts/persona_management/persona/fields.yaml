  role: authoritative_state
- name: createdAt
  source: createdAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: subAccountId
  source: subAccountId
  type: string
  constraints:
  - PK
  - NOT_NULL
  - UK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 全局唯一子账号 ID；也是跨域上下文唯一主体 ID
  role: authoritative_state
- name: isolationLevel
  source: isolationLevel
  type: enum
