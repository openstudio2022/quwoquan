  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: isPrivate
  source: isPrivate
  type: bool
  constraints:
  - NOT_NULL
  - DEFAULT_FALSE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: authoritative_state
- name: isActive
  source: isActive
  type: bool
  constraints:
  - NOT_NULL
  - DEFAULT_FALSE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: status
  source: status
  type: enum
  enum_ref: PersonaStatus
  constraints:
