description: 用户子账号——应用内真实身份主体；只保留 subAccountId 作为主体 ID
fields:
- name: userId
  source: userId
  type: string
  constraints:
  - FK_user_profiles_CASCADE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
  reference: true
- name: displayName
  source: displayName
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: authoritative_state
- name: userHandle
  source: userHandle
  type: string
  constraints:
  - NULLABLE
  - UK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  description: 分身用户号；全局唯一、用户可修改、用于公开标识
  role: authoritative_state
- name: phone
  source: phone
  type: string
  constraints:
  - NULLABLE
  classification: PII
  log_policy: mask
  api_exposure: read_write
  ops_exposure: mask
  description: 当前分身绑定手机号；默认继承主分身，可单独改写
  role: authoritative_state
- name: email
  source: email
  type: string
  constraints:
  - NULLABLE
  classification: PII
  log_policy: mask
  api_exposure: read_write
  ops_exposure: mask
