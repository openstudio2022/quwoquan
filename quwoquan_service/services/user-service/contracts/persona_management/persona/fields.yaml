  role: authoritative_state
- name: avatarUrl
  source: avatarUrl
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: authoritative_state
- name: avatarMediaAssetId
  source: avatarMediaAssetId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: MediaAsset identity；delivery URL 仅为可重建投影字段。
  role: authoritative_state
  reference: true
- name: avatarVersion
  source: avatarVersion
  type: int
  constraints:
  - NOT_NULL
  - DEFAULT_0
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  recommend_feature: false
  description: 子账号头像版本号；用于 persona 头像缓存失效与继承头像对齐
  role: authoritative_state
- name: backgroundUrl
  source: backgroundUrl
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
