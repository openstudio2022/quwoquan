backend: postgres
tables:
  personas:
    entity: Persona
    role: authoritative
    columns:
    - name: sub_account_id
      type: VARCHAR(96)
      constraints:
      - PK
      - NOT_NULL
    - name: user_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: display_name
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: user_handle
      type: VARCHAR(64)
    - name: phone
      type: VARCHAR(32)
    - name: email
      type: VARCHAR(255)
    - name: bio
      type: TEXT
      constraints:
      - NOT_NULL
      default: ''''''
    - name: avatar_media_asset_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
      default: ''''''
    - name: avatar_url
      type: TEXT
      constraints:
      - NOT_NULL
      default: ''''''
    - name: avatar_version
      type: INTEGER
      constraints:
      - NOT_NULL
      default: '0'
    - name: background_media_asset_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
      default: ''''''
    - name: background_url
      type: TEXT
      constraints:
      - NOT_NULL
      default: ''''''
    - name: caller_ringtone_id
      type: VARCHAR(64)
    - name: theme_mode_override
      type: VARCHAR(16)
    - name: font_size_preset_override
      type: VARCHAR(16)
    - name: appearance_override_updated_at
      type: TIMESTAMPTZ
    - name: is_primary
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'false'
    - name: is_private
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'false'
    - name: is_active
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'false'
    - name: isolation_level
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''open'''
    - name: purpose_hint
      type: VARCHAR(128)
    - name: status
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''active'''
    - name: retired_at
      type: TIMESTAMPTZ
    - name: inherits_profile_from_owner
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: overridden_profile_fields
      type: TEXT[]
    - name: last_profile_sync_at
      type: TIMESTAMPTZ
    - name: last_profile_sync_source
      type: VARCHAR(32)
    - name: last_activated_at
      type: TIMESTAMPTZ
    - name: version
      type: BIGINT
      constraints:
      - NOT_NULL
      default: '1'
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
  personas_command_receipts:
    entity: Persona
    role: authoritative
    infrastructure_only: true
    description: Persona 命令及 UpdateUserProfile 与各自 aggregate state/outbox 在同一 postgres transaction 提交的幂等回执；idempotency_key 使用命令命名空间隔离。
    columns:
    - name: receipt_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: aggregate_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: idempotency_key
      type: VARCHAR(160)
      constraints:
      - NOT_NULL
    - name: command_digest
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: aggregate_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: result_json
      type: JSONB
      constraints:
      - NOT_NULL
  personas_outbox:
    entity: Persona
    role: append_only
    infrastructure_only: true
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
    columns:
    - name: event_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: aggregate_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: aggregate_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: event_type
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: payload_json
      type: JSONB
      constraints:
      - NOT_NULL
    - name: occurred_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: published_at
      type: TIMESTAMPTZ
    - name: retry_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: '0'
    - name: next_attempt_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: last_error
      type: TEXT
      constraints:
      - NOT_NULL
      default: ''''''
role: authoritative
codegen:
  enabled: true
  package: user
  tables:
  - personas
  - personas_command_receipts
  - personas_outbox
  migration_skip_tables:
  - personas
  - personas_command_receipts
  - personas_outbox
