backend: mongodb
collections:
  creator_runtime_profiles:
    entity: CreatorRuntimeProfile
    indexes:
    - name: idx_creator_runtime_creator_id_unique
      keys:
        creatorId: 1
      unique: true
    - name: idx_creator_runtime_persona
      keys:
        personaId: 1
        status: 1
    - name: idx_creator_runtime_handle
      keys:
        handle: 1
        status: 1
    - name: idx_creator_runtime_managed_status
      keys:
        managedBy: 1
        status: 1
role: projection
