kind: projection
description: 'immutable release desired-state 引用的 canonical creator package 只读运行时投影。

  归属 user-service，复用既有 creator/profile/works API；不创建可登录用户，不复制作品正文。

  '
identity:
  fields:
  - creatorId
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: persona
  on_delete: tombstone
  reference_fields:
  - personaId
  target_object: user.Persona
local_identity_reasons:
  avatarAssetId: immutable release MediaAsset authority reference; validated against media_manifest.json
    and never used as a CreatorRuntimeProfile aggregate identity
  preferredBlueprintIds: stable catalog or release key; resolved through its typed catalog reader and
    never used as an aggregate Store identity
  releaseId: stable catalog or release key; resolved through its typed catalog reader and never used as
    an aggregate Store identity
search_policy:
  exposed: none
  not_exposed_reason: "服务内部投影，只供所属域 named Reader 消费，不构成独立检索结果类型。"
assistant_access:
  read:
    mode: public
    scopes:
    - assistant.user.creator_runtime_profile.read
  cite:
    mode: public_citation
    scopes:
    - assistant.user.creator_runtime_profile.cite
  write:
    mode: none
    scopes: []
business_rules:
- 事件投影集合不得承载 immutable Data release candidate；Data candidate 只写本对象 owner-local 的 creator_release_projections / creator_release_candidate_states，stage-only，不创建可登录账号、不写 Persona outbox 或 command receipt，也不维护 User 侧 active/latest pointer。
- release candidate 公开读取必须绑定 Content active tuple（environment/sourceOwner/releaseId/manifestDigest）exact fence，不得从事件投影或旧 content_release Persona fallback。
- Persona 关闭必须 tombstone 事件来源的运行时档案并从公开查询移除。
lifecycle:
  source_events:
  - user.user_account.UserAccountClosed
  checkpoint: user_account_event_id
  rebuild: import_active_creator_release_then_replay_user_account_closed_events
  tombstone: remove_public_profile_keep_release_audit
  idempotency: event_id
  event_consumers:
  - name: ProjectCreatorRuntimeProfileAccountClosure
    kind: projector
    facet: AccountClosureProjector
    method: apply
    idempotency: event_id
