kind: projection
description: '当前身份关注对象的统一读模型。它聚合用户关注、圈子加入/关注、地点和事物主页关注，

  供首页关注频道顶部“关注动态”横向列表消费。该模型不替代各对象域的关系写入，

  只维护 viewer 维度访问水位与未读变化投影。

  '
identity:
  fields:
  - viewerPersonaId
  - subjectType
  - subjectId
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: followedSubject
  on_delete: tombstone
  reference_fields:
  - subjectId
  target_objects:
  - user.Persona
  - entity.Homepage
  - circle.Circle
  - integration.Location
local_identity_reasons:
  targetObjectId: navigation projection identifier derived from the typed subject reference and never
    used for aggregate access
  targetRouteId: generated route, surface, or operation registry key used only for navigation or telemetry
    attribution
search_policy:
  exposed: none
  not_exposed_reason: "成员与关系记录只在所属对象的授权 Reader 内可见，不作为独立检索对象。"
assistant_access:
  read:
    mode: owner_scoped
    scopes:
    - assistant.user.following_subject.read
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
business_rules:
- 关注状态只由 PersonaRelationship、SubjectFollow 与 CircleMembership 等 owner 的 typed event 投影。
- viewerPersonaId、subjectType、subjectId 唯一确定一行，访问水位不得覆盖 owner 的关注事实。
- subject tombstone 或 viewer 账号关闭必须删除可见行并保留 projector checkpoint。
lifecycle:
  source_events:
  - user.persona_relationship.PersonaFollowStateChanged
  - user.persona_relationship.PersonaBlocked
  - user.persona_relationship.PersonaUnblocked
  - user.subject_follow.SubjectFollowStateChanged
  - user.followed_subject_visit_state.FollowedSubjectVisited
  - user.user_account.UserAccountClosed
  checkpoint: per_owner_event_sequence
  rebuild: replay_all_typed_follow_subject_events
  tombstone: delete_following_subject_keep_checkpoint
  idempotency: aggregate_version
  event_consumers:
  - name: ProjectFollowingSubject
    kind: projector
    facet: FollowingSubjectProjector
    method: apply
    idempotency: aggregate_version
