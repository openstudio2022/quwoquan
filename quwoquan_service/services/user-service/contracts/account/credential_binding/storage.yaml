backend: postgres
tables:
  credential_bindings:
    entity: CredentialBinding
    role: authoritative
    description: credentialType + credentialKey 全局唯一约束承载绑定幂等，不设独立 receipt 表。
    columns:
    - name: id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: owner_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: credential_type
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
    - name: credential_key
      type: VARCHAR(256)
      constraints:
      - NOT_NULL
    - name: display_label
      type: VARCHAR(32)
    - name: is_active
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: bound_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: last_used_at
      type: TIMESTAMPTZ
    - name: version
      type: BIGINT
      constraints:
      - NOT_NULL
      default: '1'
  credential_bindings_outbox:
    entity: CredentialBinding
    role: append_only
    infrastructure_only: true
    description: bind/revoke 安全审计事实，与 aggregate state 同一 postgres transaction 提交。
  federated_phone_binding_tickets:
    entity: CredentialBinding
    role: authoritative
    infrastructure_only: true
    description: 社交首登手机号绑定的一次性短期票据；只保存 opaque ticket 的 SHA-256，不保存或记录明文。ticket、bind_phone challenge、账号事实、双凭证、设备、consent 与 session 由 CredentialBinding completion packet 在一个 PostgreSQL transaction 中消费和提交。
role: authoritative
