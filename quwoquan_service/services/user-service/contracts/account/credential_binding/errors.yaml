domain: USER
aggregate: CredentialBinding
description: 'CredentialBinding 对象专属错误码。格式：MODULE.KIND.REASON。

  覆盖凭证绑定唯一性冲突与最后凭证保护；codegen 与 user 域其余对象

  errors.yaml 聚合生成端云错误契约。

  '
errors:
- code: USER.AUTH.credential_conflict
  kind: AUTH
  reason: conflict
  emitted_by:
  - surface: http
    operations:
    - BindCarrierPhoneCredential
    - BindPhoneCredential
    - CompleteFederatedPhoneBinding
    - user.account_session.LoginOneTap
    - user.account_session.LoginWithAlipay
    - user.account_session.LoginWithPhone
    - user.account_session.LoginWithQq
    - user.account_session.LoginWithWechat
  http_status: 409
  recovery:
    action: surface
    disruptionLevel: inlineCard
  l10n_key: userAuthCredentialConflict
  dart_const: credentialConflict
  go_const: ErrCredentialConflict
  user_message:
    zh: 这个手机号已绑定其他账号
    en: This phone number is linked to another account
- code: USER.AUTH.last_credential
  kind: AUTH
  reason: constraint_violation
  emitted_by:
  - surface: http
    operations:
    - UnbindCredential
  http_status: 400
  recovery:
    action: surface
    disruptionLevel: inlineCard
  l10n_key: userAuthLastCredential
  dart_const: lastCredential
  go_const: ErrLastCredential
  user_message:
    zh: 无法解绑，这是您唯一的登录方式
    en: Cannot unlink the only login method
