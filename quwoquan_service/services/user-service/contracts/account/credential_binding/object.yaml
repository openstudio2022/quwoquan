kind: aggregate_root
description: Account 与 phone、carrier、OAuth 等认证凭证的绑定和吊销生命周期聚合。
identity:
  fields:
  - id
  version_field: version
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: command_facade
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: account
  on_delete: cascade
  reference_fields:
  - ownerId
  target_object: user.UserAccount
capabilities:
- commandable
- queryable
- idempotent_commands
business_rules:
- credentialType + credentialKey 全局唯一且 secret 仅保存不可逆引用
- 绑定必须消费已完成且未消费的 AuthenticationChallenge
- Account 必须始终保留至少一种可恢复凭证，除非账号 closed
- revoked 绑定不可恢复，重新绑定创建新 identity
- bind/revoke 与安全审计 outbox 在同一 PostgreSQL transaction 提交
- 同账号重复绑定同一凭证为幂等 no-op，由全局唯一约束承载，不接收调用方幂等键
lifecycle:
  states:
  - active
  - revoked
  optimistic_concurrency: version
  idempotency: unique_credential_key
