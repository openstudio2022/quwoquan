description: 登录会话、刷新轮换与吊销的独立生命周期根
fields:
  - name: id
    type: string
    constraints:
      - PK
      - NOT_NULL
    role: authoritative_state
  - name: accountId
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: deviceId
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: refreshTokenHash
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: status
    type: enum
    enum_ref: AccountSessionStatus
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: issuedAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: expiresAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: rotatedAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: revokedAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
enums:
  AccountSessionStatus:
    - active
    - rotated
    - revoked
    - expired
  FederatedLoginStatus:
    - authenticated
    - phoneBindingRequired
types:
  LoginOneTapCommand:
    fields:
      - name: vendor
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: carrierToken
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: platform
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: appVersion
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: agreementVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: privacyVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  LoginWithQqCommand:
    fields:
      - name: qqAuthCode
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: platform
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: appVersion
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: agreementVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: privacyVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  LoginAnonymousCommand:
    fields:
      - name: installId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceFingerprintHash
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: platform
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: appVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  LoginWithPhoneCommand:
    fields:
      - name: phone
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: otpCode
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: platform
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: appVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: agreementVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: privacyVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  LoginWithWechatCommand:
    fields:
      - name: wechatCode
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: platform
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: appVersion
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: agreementVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: privacyVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  LogoutCommand:
    fields:
      - name: refreshToken
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: deviceId
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
  LoginWithAlipayCommand:
    fields:
      - name: alipayAuthCode
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: platform
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: appVersion
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: agreementVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: privacyVersion
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  RefreshTokenCommand:
    fields:
      - name: refreshToken
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  WhitelistedResearchSession:
    fields:
      - name: subjectHash
        type: string
        constraints:
          - NOT_BLANK
      - name: attestationId
        type: string
        constraints:
          - NOT_BLANK
      - name: expiresAt
        type: timestamp
        constraints:
          - NOT_NULL
  IssueWhitelistedResearchSessionCommand:
    fields:
      - name: accountId
        type: string
        constraints:
          - NOT_BLANK
  ActivePersonaEnvelope:
    fields:
      - {name: personaId, type: string, constraints: [NOT_BLANK]}
  AccountHintSnapshot:
    fields:
      - {name: displayName, type: string, constraints: [NOT_NULL]}
      - {name: nicknameCustomized, type: boolean, constraints: [NOT_NULL]}
      - {name: avatarUrl, type: string, constraints: [NOT_NULL]}
      - {name: avatarAssetId, type: string, constraints: [NOT_NULL]}
      - {name: maskedPhone, type: string, constraints: [NOT_NULL]}
      - {name: identityOrigin, type: string, constraints: [NOT_NULL]}
  AuthSessionGrant:
    fields:
      - {name: accessToken, type: string, constraints: [NOT_BLANK]}
      - {name: refreshToken, type: string, constraints: [NOT_BLANK]}
      - {name: ownerId, type: string, constraints: [NOT_BLANK]}
      - {name: accountState, type: string, constraints: [NOT_NULL]}
      - {name: identityOrigin, type: string, constraints: [NOT_NULL]}
      - {name: logicalShard, type: int, constraints: [NOT_NULL]}
      - {name: anonymousRetentionPolicy, type: string, constraints: [NOT_NULL]}
      - {name: personaCount, type: int, constraints: [NOT_NULL]}
      - {name: sessionRememberTtlSeconds, type: int, constraints: [NOT_NULL]}
      - {name: activePersona, type: ActivePersonaEnvelope, constraints: [NULLABLE]}
      - {name: accountHint, type: AccountHintSnapshot, constraints: [NULLABLE]}
  FederatedLoginOutcome:
    fields:
      - {name: status, type: enum, enum_ref: FederatedLoginStatus, constraints: [NOT_NULL]}
      - {name: session, type: AuthSessionGrant, constraints: [NULLABLE]}
      - {name: bindingTicket, type: string, constraints: [NULLABLE]}
      - {name: provider, type: string, constraints: [NULLABLE]}
      - {name: expiresInSeconds, type: int, constraints: [NOT_NULL]}
  TokenRefreshGrant:
    fields:
      - {name: accessToken, type: string, constraints: [NOT_BLANK]}
      - {name: refreshToken, type: string, constraints: [NOT_BLANK]}
      - {name: sessionRememberTtlSeconds, type: int, constraints: [NOT_NULL]}
  LogoutAck:
    fields:
      - {name: revoked, type: boolean, constraints: [NOT_NULL]}
