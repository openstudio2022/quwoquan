events:
- name: AccountSessionAuthenticated
  producer: user-service
  consumers: []
  channel: transactional_audit
  no_consumer_reason: UserAccount provision is completed synchronously by the login application flow; the persisted session event currently has no relay.
  description: 首次成功认证与 UserAccount 同步 provision 的持久化审计事实；当前不声明未装配的异步 projector。
  payload_entity: AccountSession
  payload_fields:
  - sessionId
  - authenticationSubject
  - identityOrigin
  - deviceId
  - issuedAt
- name: AccountSessionRevoked
  producer: user-service
  consumers: []
  channel: transactional_audit
  no_consumer_reason: Session revocation is enforced by the authoritative session store; the persisted event currently has no relay.
  payload_entity: AccountSession
  payload_fields:
  - sessionId
  - accountId
  - deviceId
  - revokedAt
  - reason
