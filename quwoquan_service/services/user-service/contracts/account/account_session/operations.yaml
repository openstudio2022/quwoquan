        - platform
        - vendor
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_entity: AuthSessionGrant
    response_body: AuthSessionGrant
    response_body_kind: object
    request_entity: LoginOneTapCommand
    request_body_kind: object
  - method: POST
    path: /auth/login/anonymous
    operation: LoginAnonymous
    actor: none
    application:
      kind: command
      facet: AccountSessionCommandFacade
      method: loginAnonymous
      aggregate_owner: AccountSession
      mutation_target: AccountSession
      invariant_target: AccountSession
    description: 基于 installId + deviceFingerprintHash 匿名引导，复用同设备稳定 owner/persona
    response_entity: AuthSessionGrant
    response_body: AuthSessionGrant
    response_body_kind: object
    response_fields:
      - accessToken
      - refreshToken
      - ownerId
      - activePersona
      - personaCount
      - accountState
      - identityOrigin
      - logicalShard
      - anonymousRetentionPolicy
      - sessionRememberTtlSeconds
    authorization:
      principal: public
      ownership_policy: anonymous_device_bootstrap
    commercial:
      status: ready
    reliability:
      timeout_ms: 10000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes:
      - USER.USER.invalid_argument
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: PII
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_anonymous_login
      trace: true
      attributes:
        - platform
        - outcome
    slo:
      latency_p95_ms: 2000
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    request_entity: LoginAnonymousCommand
    request_body_kind: object
  - method: POST
    path: /auth/research/session
    operation: IssueWhitelistedResearchSession
    actor: account
    application:
      kind: command
      facet: ResearchSessionCommandFacade
      method: issueWhitelistedResearchSession
      aggregate_owner: AccountSession
      mutation_target: AccountSession
      invariant_target: AccountSession
    description: 已认证账号仅在命中受管 subjectHash 白名单后换取短期研究态签名证明；签发必须先完成脱敏 durable audit append
    response_fields:
      - subjectHash
      - attestationId
      - expiresAt
    authorization:
      principal: account
      ownership_policy: authenticated_account_research_allowlist
    commercial:
      status: blocked
      block_reason: research-only identity attestation is never a commercial session
      gap_id: USER_ACCOUNT_SESSION_RESEARCH_ONLY
      target_story: multi-carrier-release
    reliability:
      timeout_ms: 800
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.forbidden
      - USER.AUTH.account_security_unavailable
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SECRET
      log_policy: none
    telemetry:
      metric: user_research_session_issue
      trace: true
      attributes:
        - environment
        - outcome
        - error_code
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: WhitelistedResearchSession
    response_body: WhitelistedResearchSession
    response_body_kind: object
    request_entity: IssueWhitelistedResearchSessionCommand
    request_body_kind: none
    request_bindings:
      injected:
        - name: authenticatedAccountId
          field: accountId
  - method: GET
    path: /auth/research/session/attestation
    operation: GetResearchSessionAttestation
    actor: account
    application:
      kind: query
      facet: ResearchSessionQueryFacade
      method: getResearchSessionAttestation
      reader: ResearchSessionAttestationReader
      slice: ResearchSessionAttestationView
    description: 已认证账号回读自身短期研究态签名证明；attestation 缺失、签名漂移、过期或与账号不符一律 fail closed
    response_fields:
      - subjectHash
      - attestationId
      - expiresAt
    authorization:
      principal: account
      ownership_policy: authenticated_account_research_attestation
    commercial:
      status: blocked
      block_reason: research-only identity attestation readback is never a commercial session surface
      gap_id: USER_ACCOUNT_SESSION_RESEARCH_ONLY
      target_story: multi-carrier-release
    reliability:
      timeout_ms: 800
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.research_identity_invalid
      - USER.AUTH.account_security_unavailable
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SECRET
      response_classification: SECRET
      log_policy: none
    telemetry:
      metric: user_research_session_attestation_readback
      trace: true
      attributes:
        - environment
        - outcome
        - error_code
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: ResearchSessionAttestationView
    response_body: ResearchSessionAttestationView
    response_body_kind: object
    request_entity: ResearchSessionAttestationQuery
    request_body_kind: none
    request_bindings:
      header:
        - {name: X-Research-Identity-Attestation, field: researchIdentityAttestation, required: true}
  - method: POST
    path: /auth/token/refresh
    operation: RefreshToken
    actor: none
    application:
      kind: command
      facet: AccountSessionCommandFacade
      method: refreshToken
      aggregate_owner: AccountSession
      mutation_target: AccountSession
      invariant_target: AccountSession
    description: 刷新 access token（滑动延期；rotation 重放吊销 lineage）
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_fields:
      - accessToken
      - refreshToken
      - sessionRememberTtlSeconds
    authorization:
      principal: public
      ownership_policy: session_refresh_token_holder
    commercial:
      status: ready
    reliability:
      timeout_ms: 800
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.invalid_argument
      - USER.AUTH.token_expired
      - USER.AUTH.account_suspended
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SECRET
      response_classification: SECRET
      log_policy: none
    telemetry:
      metric: user_auth_token_refresh
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 800
      availability_percent: 99.95
    response_entity: TokenRefreshGrant
    response_body: TokenRefreshGrant
    response_body_kind: object
    request_entity: RefreshTokenCommand
    request_body_kind: object
  - method: POST
    path: /auth/logout
    operation: Logout
    actor: account
    application:
      kind: command
      facet: AccountSessionCommandFacade
      method: logout
      aggregate_owner: AccountSession
      mutation_target: AccountSession
      invariant_target: AccountSession
    description: 登出（吊销 refresh token）
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    authorization:
      principal: account
      ownership_policy: session_owner
    commercial:
      status: ready
    reliability:
      timeout_ms: 800
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.invalid_argument
      - USER.USER.unauthorized
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: SECRET
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_auth_logout
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    response_entity: LogoutAck
    response_body: LogoutAck
    response_body_kind: object
    request_entity: LogoutCommand
    request_body_kind: object
