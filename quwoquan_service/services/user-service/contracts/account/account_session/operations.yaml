description: AccountSession 对象专属 command packet。
commercial_defaults:
  status: blocked
  block_reason: operation must carry explicit commercial evidence before enablement
  gap_id: USER_ACCOUNT_SESSION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /auth/login/phone
    operation: LoginWithPhone
    actor: none
    application:
      kind: command
      facet: AccountSessionCommandFacade
      method: loginWithPhone
      aggregate_owner: AccountSession
      mutation_target: AccountSession
      invariant_target: AccountSession
    description: 手机号 + OTP 登录，创建或恢复 OwnerAccount
    response_fields:
      - accessToken
      - refreshToken
      - ownerId
      - activePersona
      - personaCount
      - accountState
      - identityOrigin
      - logicalShard
      - anonymousRetentionPolicy
      - accountHint
      - sessionRememberTtlSeconds
    authorization:
      principal: public
      ownership_policy: account_session_bootstrap
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.invalid_argument
      - USER.AUTH.otp_expired
      - USER.AUTH.otp_mismatch
      - USER.AUTH.otp_attempts_exceeded
      - USER.AUTH.consent_required
      - USER.AUTH.credential_conflict
      - USER.AUTH.account_suspended
      - USER.AUTH.account_deleted
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SECRET
      response_classification: SECRET
      log_policy: none
    telemetry:
      metric: user_auth_phone_login
      trace: true
      attributes:
        - environment
        - platform
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_entity: AuthSessionGrant
    response_body: AuthSessionGrant
    response_body_kind: object
    request_entity: LoginWithPhoneCommand
    request_body_kind: object
  - method: POST
    path: /auth/login/wechat
    operation: LoginWithWechat
    actor: none
    application:
      kind: command
      facet: AccountSessionCommandFacade
      method: loginWithWechat
      aggregate_owner: AccountSession
      mutation_target: AccountSession
      invariant_target: AccountSession
    description: 微信授权码登录；App 只上传短期 code，服务端置换 openid/unionid 与公开资料并首次同步昵称头像
    response_fields:
      - status
      - session
      - bindingTicket
      - provider
      - expiresInSeconds
    authorization:
      principal: public
      ownership_policy: account_session_bootstrap
    commercial:
      status: blocked
      block_reason: prod WeChat credentials and real-device SDK evidence are not injected
      gap_id: R_AUTH_001
      target_story: four-environment-commercial-login-maturity
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.invalid_argument
      - USER.AUTH.wechat_auth_failed
      - USER.AUTH.social_provider_cancelled
      - USER.AUTH.social_provider_unavailable
      - USER.AUTH.consent_required
      - USER.AUTH.credential_conflict
      - USER.AUTH.account_suspended
      - USER.AUTH.account_deleted
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SECRET
      response_classification: SECRET
      log_policy: none
    telemetry:
      metric: user_auth_wechat_login
      trace: true
      attributes:
        - environment
        - platform
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_entity: FederatedLoginOutcome
    response_body: FederatedLoginOutcome
    response_body_kind: object
    request_entity: LoginWithWechatCommand
    request_body_kind: object
