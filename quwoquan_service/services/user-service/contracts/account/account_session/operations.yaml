description: AccountSession 对象专属 command packet。
commercial_defaults:
  status: blocked
  block_reason: operation must carry explicit commercial evidence before enablement
  gap_id: USER_ACCOUNT_SESSION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- method: POST
  path: /auth/login/phone
  operation: LoginWithPhone
  actor: none
  application:
    kind: command
    facet: AccountSessionCommandFacade
    method: loginWithPhone
    aggregate_owner: AccountSession
    mutation_target: AccountSession
    invariant_target: AccountSession
  description: 手机号 + OTP 登录，创建或恢复 OwnerAccount
  request_fields:
  - phone
  - otpCode
  - deviceId
  - platform
  - appVersion
  - agreementVersion
  - privacyVersion
  response_fields:
  - accessToken
  - refreshToken
  - ownerId
  - activeSub
  - subAccountCount
  - accountState
  - identityOrigin
  - logicalShard
  - anonymousRetentionPolicy
  - accountHint
  - sessionRememberTtlSeconds
  authorization:
    principal: public
    ownership_policy: account_session_bootstrap
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: none
    max_attempts: 1
    idempotency: none
  error_codes:
  - USER.USER.invalid_argument
  - USER.AUTH.otp_expired
  - USER.AUTH.otp_mismatch
  - USER.AUTH.otp_attempts_exceeded
  - USER.AUTH.login_locked
  - USER.AUTH.consent_required
  - USER.AUTH.credential_conflict
  - USER.AUTH.account_suspended
  - USER.AUTH.account_deleted
  - USER.SYSTEM.internal_error
  privacy:
    request_classification: SECRET
    response_classification: SECRET
    log_policy: none
  telemetry:
    metric: user_auth_phone_login
    trace: true
    attributes:
    - environment
    - platform
    - outcome
    - error_code
  slo:
    latency_p95_ms: 1500
    availability_percent: 99.9
  security:
    auth_mode: public
    principal: public
    token_transport: none
    anonymous_policy: allow
    visibility: private
  client_contract:
    dart_import: ../user/account_session_contracts.dart
    request_type: LoginWithPhoneCommand
    response_type: AuthSessionGrant
    request_encoder: encodeLoginWithPhoneCommand
    response_decoder: decodeAuthSessionGrant
