    - LoginWithAlipay
    - LoginWithQq
    - LoginWithWechat
    - user.authentication_challenge.CreateAlipayAuthorizationRequest
  http_status: 503
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthSocialProviderUnavailable
  dart_const: socialProviderUnavailable
  go_const: ErrSocialProviderUnavailable
  user_message:
    zh: 授权未完成
    en: Authorization was not completed
- code: USER.AUTH.carrier_unavailable
