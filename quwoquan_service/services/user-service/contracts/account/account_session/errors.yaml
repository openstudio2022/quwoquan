domain: USER
aggregate: AccountSession
description: 'AccountSession 对象专属错误码。格式：MODULE.KIND.REASON。

  覆盖六路登录、token 生命周期、账号态与运营商/第三方登录链路；

  codegen 与 user 域其余对象 errors.yaml 聚合生成端云错误契约。

  '
errors:
- code: USER.AUTH.login_locked
  kind: AUTH
  reason: locked
  http_status: 423
  recovery:
    action: retry
    disruptionLevel: inlineCard
    afterSeconds: 1800
  l10n_key: userAuthLoginLocked
  dart_const: loginLocked
  go_const: ErrLoginLocked
  user_message:
    zh: 账号因多次失败已暂时锁定，请30分钟后重试
    en: Account temporarily locked due to multiple failed attempts, please retry in 30 minutes
- code: USER.AUTH.token_expired
  kind: AUTH
  reason: token_expired
  http_status: 401
  recovery:
    action: surface
    disruptionLevel: inlineCard
  l10n_key: userAuthTokenExpired
  dart_const: tokenExpired
  go_const: ErrTokenExpired
  user_message:
    zh: 登录已过期，请重新登录
    en: Session expired, please sign in again
- code: USER.AUTH.wechat_auth_failed
  kind: AUTH
  reason: third_party_failure
  http_status: 502
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthWechatFailed
  dart_const: wechatAuthFailed
  go_const: ErrWechatAuthFailed
  user_message:
    zh: 微信授权失败，请重试
    en: WeChat authorization failed, please try again
- code: USER.AUTH.alipay_auth_failed
  kind: AUTH
  reason: third_party_failure
  http_status: 502
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthAlipayFailed
  dart_const: alipayAuthFailed
  go_const: ErrAlipayAuthFailed
  user_message:
    zh: 支付宝授权失败，请重试
    en: Alipay authorization failed, please try again
- code: USER.AUTH.qq_auth_failed
  kind: AUTH
  reason: third_party_failure
  http_status: 502
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthQqFailed
  dart_const: qqAuthFailed
  go_const: ErrQqAuthFailed
  user_message:
    zh: QQ 授权失败，请重试
    en: QQ authorization failed, please try again
- code: USER.AUTH.social_provider_cancelled
  kind: AUTH
  reason: cancelled
  http_status: 400
  recovery:
    action: absorb
    disruptionLevel: silent
  l10n_key: userAuthSocialProviderCancelled
  dart_const: socialProviderCancelled
  go_const: ErrSocialProviderCancelled
  user_message:
    zh: 已取消第三方授权
    en: Third-party authorization was cancelled
- code: USER.AUTH.social_provider_unavailable
  kind: AUTH
  reason: third_party_unavailable
  http_status: 503
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthSocialProviderUnavailable
  dart_const: socialProviderUnavailable
  go_const: ErrSocialProviderUnavailable
  user_message:
    zh: 第三方登录暂不可用，请使用其他方式登录
    en: Third-party login is unavailable, please use another method
- code: USER.AUTH.apple_auth_failed
  kind: AUTH
  reason: third_party_failure
  http_status: 502
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthAppleFailed
  dart_const: appleAuthFailed
  go_const: ErrAppleAuthFailed
  user_message:
    zh: Apple 登录失败，请重试
    en: Apple sign-in failed, please try again
- code: USER.AUTH.passkey_auth_failed
  kind: AUTH
  reason: third_party_failure
  http_status: 502
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthPasskeyFailed
  dart_const: passkeyAuthFailed
  go_const: ErrPasskeyAuthFailed
  user_message:
    zh: Passkey 登录失败，请重试或改用其他方式
    en: Passkey sign-in failed, please retry or use another method
- code: USER.AUTH.carrier_unavailable
  kind: AUTH
  reason: third_party_unavailable
  http_status: 503
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthCarrierUnavailable
  dart_const: carrierUnavailable
  go_const: ErrCarrierUnavailable
  user_message:
    zh: 本机号码登录暂不可用，请使用其他方式登录
    en: Carrier sign-in is unavailable; use SMS verification instead
- code: USER.AUTH.carrier_token_invalid
  kind: AUTH
  reason: invalid_token
  http_status: 400
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthCarrierTokenInvalid
  dart_const: carrierTokenInvalid
  go_const: ErrCarrierTokenInvalid
  user_message:
    zh: 本机号码授权已失效，请使用其他方式登录
    en: Carrier authorization expired; use SMS verification instead
- code: USER.AUTH.carrier_provider_timeout
  kind: AUTH
  reason: upstream_timeout
  http_status: 504
  recovery:
    action: retry
    disruptionLevel: inlineCard
  l10n_key: userAuthCarrierProviderTimeout
  dart_const: carrierProviderTimeout
  go_const: ErrCarrierProviderTimeout
  user_message:
    zh: 本机号码校验超时，请使用其他方式登录
    en: Carrier verification timed out; use SMS verification instead
- code: USER.AUTH.carrier_phone_mismatch
  kind: AUTH
  reason: conflict
  http_status: 409
  recovery:
    action: fallback
    disruptionLevel: inlineCard
  l10n_key: userAuthCarrierPhoneMismatch
  dart_const: carrierPhoneMismatch
  go_const: ErrCarrierPhoneMismatch
  user_message:
    zh: 本机号码与上次账号不一致，请使用其他手机号或其他方式登录
    en: Carrier phone does not match the remembered account; use another phone or sign-in method
- code: USER.AUTH.consent_required
  kind: AUTH
  reason: consent_required
  http_status: 400
  recovery:
    action: surface
    disruptionLevel: inlineCard
  l10n_key: userAuthConsentRequired
  dart_const: consentRequired
  go_const: ErrConsentRequired
  user_message:
    zh: 请先阅读并同意用户协议与隐私政策
    en: Please agree to the user agreement and privacy policy first
- code: USER.AUTH.account_suspended
  kind: AUTH
  reason: suspended
  http_status: 403
  recovery:
    action: escalate
    disruptionLevel: inlineCard
  l10n_key: userAuthAccountSuspended
  dart_const: accountSuspended
  go_const: ErrAccountSuspended
  user_message:
    zh: 账号已被限制登录，请更换手机号或联系支持
    en: This account is currently restricted
- code: USER.AUTH.account_deleted
  kind: AUTH
  reason: deleted
  http_status: 410
  recovery:
    action: escalate
    disruptionLevel: inlineCard
  l10n_key: userAuthAccountDeleted
  dart_const: accountDeleted
  go_const: ErrAccountDeleted
  user_message:
    zh: 账号已注销或进入删除流程，请更换手机号登录
    en: This account has been deleted or is being deleted
- code: USER.AUTH.token_stale
  kind: AUTH
  reason: token_stale
  http_status: 401
  recovery:
    action: surface
    disruptionLevel: inlineCard
  l10n_key: userAuthTokenStale
  dart_const: tokenStale
  go_const: ErrTokenStale
  user_message:
    zh: 登录凭据已失效，请重新登录
    en: This session is no longer valid. Please sign in again
- code: USER.AUTH.account_security_unavailable
  kind: AUTH
  reason: account_security_unavailable
  http_status: 503
  recovery:
    action: retry
    disruptionLevel: inlineCard
    afterSeconds: 3
  l10n_key: userAuthAccountSecurityUnavailable
  dart_const: accountSecurityUnavailable
  go_const: ErrAccountSecurityUnavailable
  user_message:
    zh: 账号安全校验暂不可用，请稍后重试
    en: Account security verification is temporarily unavailable. Please retry
