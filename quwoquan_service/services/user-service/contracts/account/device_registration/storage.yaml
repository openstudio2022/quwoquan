backend: postgres
tables:
  user_devices:
    entity: DeviceRegistration
    role: authoritative
    description: DeviceRegistration 聚合根；未上线阶段通过破坏性 migration 统一使用 account_id，不保留历史 user_id/push_token
      字段。
    columns:
    - name: id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: account_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: device_id
      type: VARCHAR(128)
      constraints:
      - NOT_NULL
    - name: app_version
      type: VARCHAR(32)
    - name: status
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''active'''
    - name: version
      type: BIGINT
      constraints:
      - NOT_NULL
      default: '1'
    - name: last_active_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    unique_constraints:
    - name: uq_user_devices_account_device
      columns:
      - account_id
      - device_id
    foreign_keys:
    - columns:
      - account_id
      references: user_profiles(user_id)
      on_delete: CASCADE
  device_push_endpoints:
    entity: DevicePushEndpoint
    role: owned
    description: DeviceRegistration owned endpoint 子表；父 identity + endpoint_kind 唯一， active token fingerprint
      全局唯一，所有变更与父 version CAS 同事务提交。
    columns:
    - name: endpoint_ref
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: account_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: device_id
      type: VARCHAR(128)
      constraints:
      - NOT_NULL
    - name: endpoint_kind
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
    - name: token_ciphertext
      type: TEXT
    - name: token_fingerprint
      type: VARCHAR(64)
    - name: status
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''active'''
    - name: invalidation_reason
      type: VARCHAR(256)
    - name: version
      type: BIGINT
      constraints:
      - NOT_NULL
      default: '1'
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    unique_constraints:
    - name: uq_device_push_endpoints_identity
      columns:
      - account_id
      - device_id
      - endpoint_kind
    foreign_keys:
    - columns:
      - account_id
      - device_id
      references: user_devices(account_id, device_id)
      on_delete: CASCADE
    indexes:
    - name: uq_device_push_endpoints_active_token_fingerprint
      columns:
      - token_fingerprint
      condition: status = 'active' AND token_fingerprint IS NOT NULL
      unique: true
    - name: idx_device_push_endpoints_active_account
      columns:
      - account_id
      - device_id
      - endpoint_kind
      condition: status = 'active'
role: authoritative
