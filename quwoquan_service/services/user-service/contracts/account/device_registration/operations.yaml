description: 'DeviceRegistration 对象 packet 提供 account-scoped endpoint 命令与

  service-principal-only 来电 destination / secret reader。token 永不进入

  destination refs、公开响应、日志、trace attribute 或错误上下文。

'
api_routes:
  - method: PUT
    path: /user/devices/{deviceId}/push-endpoints/{endpointKind}
    operation: UpsertDevicePushEndpoint
    request_bindings:
      path:
        - name: deviceId
          field: deviceId
        - name: endpointKind
          field: endpointKind
    actor: account
    application:
      kind: command
      facet: DeviceRegistrationCommandFacade
      method: upsertDevicePushEndpoint
      aggregate_owner: DeviceRegistration
      mutation_target: DeviceRegistration
      invariant_target: DeviceRegistration
    description: 按 accountId + deviceId + endpointKind 自然幂等 upsert/rotate push token。
    request_entity: DevicePushEndpointUpsertCommand
    response_entity: DevicePushEndpointCommandResult
    response_fields:
      - endpointRef
      - deviceId
      - endpointKind
      - status
      - version
      - aggregateVersion
      - idempotentReplay
      - updatedAt
    response_body: DevicePushEndpointCommandResult
    response_body_kind: object
    authorization:
      principal: account
      ownership_policy: trusted_current_account_device
    commercial:
      status: ready
    reliability:
      timeout_ms: 1000
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.forbidden
      - USER.DEVICE_PUSH.invalid_endpoint_kind
      - USER.DEVICE_PUSH.invalid_token
      - USER.DEVICE_PUSH.token_conflict
      - USER.DEVICE_PUSH.version_conflict
      - USER.DEVICE_PUSH.crypto_failure
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: SECRET
      response_classification: SENSITIVE
      log_policy: none
    telemetry:
      metric: user_device_push_endpoint_upsert
      trace: true
      attributes:
        - endpoint_kind
        - outcome
        - error_code
        - idempotent_replay
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    security:
      auth_mode: required
      principal: account
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: DELETE
    path: /user/devices/{deviceId}/push-endpoints/{endpointKind}
    operation: RemoveDevicePushEndpoint
    request_bindings:
      path:
        - name: deviceId
          field: deviceId
        - name: endpointKind
          field: endpointKind
    actor: account
    application:
      kind: command
      facet: DeviceRegistrationCommandFacade
      method: removeDevicePushEndpoint
      aggregate_owner: DeviceRegistration
      mutation_target: DeviceRegistration
      invariant_target: DeviceRegistration
    description: 吊销当前 account 的 owned endpoint 并清除 token material。
    response_entity: DevicePushEndpointCommandResult
    response_fields:
      - endpointRef
      - deviceId
      - endpointKind
      - status
      - version
      - aggregateVersion
      - idempotentReplay
      - updatedAt
    response_body: DevicePushEndpointCommandResult
    response_body_kind: object
    authorization:
      principal: account
      ownership_policy: trusted_current_account_device
    commercial:
      status: ready
    reliability:
      timeout_ms: 800
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.forbidden
      - USER.DEVICE_PUSH.invalid_endpoint_kind
      - USER.DEVICE_PUSH.endpoint_not_found
      - USER.DEVICE_PUSH.version_conflict
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_device_push_endpoint_remove
      trace: true
      attributes:
        - endpoint_kind
        - outcome
        - error_code
        - idempotent_replay
    slo:
      latency_p95_ms: 600
      availability_percent: 99.9
    security:
      auth_mode: required
      principal: account
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: DevicePushEndpointRemoveCommand
    request_body_kind: none
  - method: GET
    path: /internal/user/personas/{personaId}/push-destinations
    operation: ResolveIncomingCallPushDestinations
    request_bindings:
      path:
        - {name: personaId, field: personaId}
    actor: none
    application:
      kind: query
      facet: DeviceRegistrationQueryFacade
      method: resolveIncomingCallPushDestinations
      reader: ResolveIncomingCallPushDestinationsReader
      slice: IncomingCallPushDestinationSlice
    description: 解析 Persona owner account 的 active endpoint refs；响应不含 token。
    response_entity: IncomingCallPushDestinationSlice
    response_fields:
      - destinations
    authorization:
      principal: service
      scopes:
        - user.push_destination.read
      ownership_policy: trusted_internal_call_dispatch
    commercial:
      status: ready
    reliability:
      timeout_ms: 600
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.forbidden
      - USER.USER.not_found
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SENSITIVE
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_incoming_call_push_destinations_resolve
      trace: true
      attributes:
        - outcome
        - error_code
        - destination_count
    slo:
      latency_p95_ms: 400
      availability_percent: 99.95
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
  - method: GET
    path: /internal/user/push-endpoints/{endpointRef}/secret
    operation: ResolvePushEndpointSecret
    request_bindings:
      path:
        - {name: endpointRef, field: endpointRef}
    actor: none
    application:
      kind: query
      facet: DeviceRegistrationQueryFacade
      method: resolvePushEndpointSecret
      reader: ResolvePushEndpointSecretReader
      slice: PushEndpointSecret
    description: 仅 integration-service 可读取 active endpoint 的 endpointKind + token。
    response_entity: PushEndpointSecret
    response_fields:
      - endpointRef
      - endpointKind
      - token
    authorization:
      principal: service
      scopes:
        - user.push_endpoint.secret.read
      ownership_policy: integration_service_push_delivery_only
    commercial:
      status: ready
    reliability:
      timeout_ms: 500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.forbidden
      - USER.DEVICE_PUSH.endpoint_not_found
      - USER.DEVICE_PUSH.endpoint_not_active
      - USER.DEVICE_PUSH.crypto_failure
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SENSITIVE
      response_classification: SECRET
      log_policy: none
    telemetry:
      metric: user_push_endpoint_secret_resolve
      trace: true
      attributes:
        - endpoint_kind
        - outcome
        - error_code
    slo:
      latency_p95_ms: 300
      availability_percent: 99.95
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
  - method: POST
    path: /internal/user/push-endpoints/{endpointRef}/invalidate
    operation: InvalidateDevicePushEndpoint
    request_bindings:
      path:
        - {name: endpointRef, field: endpointRef}
    actor: none
    application:
      kind: command
      facet: DeviceRegistrationCommandFacade
      method: invalidateDevicePushEndpoint
      aggregate_owner: DeviceRegistration
      mutation_target: DeviceRegistration
      invariant_target: DeviceRegistration
    description: Provider 判定 token 永久失效后将 endpoint 标记 stale 并清除 token material。
    request_entity: InvalidateDevicePushEndpointRequest
    response_entity: DevicePushEndpointCommandResult
    response_fields:
      - endpointRef
      - deviceId
      - endpointKind
      - status
      - version
      - aggregateVersion
      - idempotentReplay
      - updatedAt
    authorization:
      principal: service
      scopes:
        - user.push_endpoint.invalidate
      ownership_policy: integration_service_push_delivery_only
    commercial:
      status: ready
    reliability:
      timeout_ms: 800
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.forbidden
      - USER.DEVICE_PUSH.endpoint_not_found
      - USER.DEVICE_PUSH.invalid_invalidation_reason
      - USER.DEVICE_PUSH.version_conflict
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_push_endpoint_invalidate
      trace: true
      attributes:
        - endpoint_kind
        - outcome
        - error_code
        - idempotent_replay
    slo:
      latency_p95_ms: 600
      availability_percent: 99.95
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
consumers:
  - name: integration-service
    capabilities:
      - resolve_incoming_call_destinations
      - resolve_push_endpoint_secret
      - invalidate_push_endpoint
contract_test:
  service_side:
    real_engines:
      postgres: embedded-postgres
    scenarios:
      - public endpoint upsert/remove uses trusted account principal and natural identity
      - internal readers and invalidation require service role plus exact scope
      - secret response is no-store and never appears in destination refs or logs
