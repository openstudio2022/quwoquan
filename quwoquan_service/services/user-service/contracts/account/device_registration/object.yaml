kind: aggregate_root
description: Account 的设备登记聚合；拥有最多两个按 provider kind 区分的推送 endpoint。
identity:
  fields:
  - id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: aggregate_root
  cardinality: 1:N
  consistency: strong
  kind: owned
  name: pushEndpoints
  on_delete: cascade
  reference_fields: []
  target_object: user.DevicePushEndpoint
- access: command_facade
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: account
  on_delete: cascade
  reference_fields:
  - accountId
  target_object: user.UserAccount
local_identity_reasons:
  deviceId: account-scoped stable device lookup key; the DeviceRegistration aggregate identity remains
    id
search_policy:
  exposed: none
  not_exposed_reason: "认证、凭据与会话安全对象，任何检索暴露都会直接削弱账号安全。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "认证凭据、会话密钥与风控状态对小趣完全关闭，不存在可开放的子集。"
business_rules:
- identity 固定为 accountId + deviceId
- DevicePushEndpoint identity 固定为 accountId + deviceId + endpointKind，不能独立于父聚合访问
- endpointKind 只允许 apns_voip 或 fcm，同一设备可同时拥有两种 endpoint
- token 明文只允许存在于命令/secret reader 内存与内部 HTTP body；持久化只保存 AES-GCM 密文与 keyed fingerprint
- 同一 token fingerprint 同时只能属于一个 active endpoint
- UpsertDevicePushEndpoint 按 owned identity 自然幂等；token 轮换递增 endpoint 与父聚合 version
- RemoveDevicePushEndpoint 清除 token material 并迁移为 revoked；provider 永久失效迁移为 stale
- 父聚合在任一 child active 时为 active；无 active child 时按 revoked/stale child 状态同步
lifecycle:
  state_field: status
  states:
  - active
  - revoked
  - stale
  optimistic_concurrency: version
  idempotency: natural_upsert
  child_states:
  - active
  - revoked
  - stale
  child_optimistic_concurrency: version
members:
  DevicePushEndpoint:
    kind: owned_entity
    cardinality: 1:N
    max_cardinality: 2
    description: 只能经 DeviceRegistration 命令维护的 APNs VoIP / FCM endpoint。
