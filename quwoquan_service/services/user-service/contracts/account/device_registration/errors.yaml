domain: USER
aggregate: DeviceRegistration
description: DeviceRegistration 与 owned DevicePushEndpoint 的稳定 RuntimeError 合同。
errors:
- code: USER.DEVICE_PUSH.invalid_endpoint_kind
  kind: DEVICE_PUSH
  reason: invalid_endpoint_kind
  http_status: 400
  recovery:
    action: surface
    disruptionLevel: inline
  l10n_key: error_device_push_invalid_endpoint_kind
  go_const: ErrDevicePushInvalidEndpointKind
  dart_const: devicePushInvalidEndpointKind
  user_message:
    zh: 推送通道类型无效
    en: Invalid push endpoint kind
- code: USER.DEVICE_PUSH.invalid_token
  kind: DEVICE_PUSH
  reason: invalid_token
  http_status: 400
  recovery:
    action: surface
    disruptionLevel: inline
  l10n_key: error_device_push_invalid_token
  go_const: ErrDevicePushInvalidToken
  dart_const: devicePushInvalidToken
  user_message:
    zh: 推送凭证无效，请重新授权通知
    en: Invalid push token, please enable notifications again
- code: USER.DEVICE_PUSH.endpoint_not_found
  kind: DEVICE_PUSH
  reason: endpoint_not_found
  http_status: 404
  recovery:
    action: none
    disruptionLevel: silent
  l10n_key: error_device_push_endpoint_not_found
  go_const: ErrDevicePushEndpointNotFound
  dart_const: devicePushEndpointNotFound
  user_message:
    zh: 推送通道不存在
    en: Push endpoint was not found
- code: USER.DEVICE_PUSH.endpoint_not_active
  kind: DEVICE_PUSH
  reason: endpoint_not_active
  http_status: 409
  recovery:
    action: none
    disruptionLevel: silent
  l10n_key: error_device_push_endpoint_not_active
  go_const: ErrDevicePushEndpointNotActive
  dart_const: devicePushEndpointNotActive
  user_message:
    zh: 推送通道已失效
    en: Push endpoint is inactive
- code: USER.DEVICE_PUSH.token_conflict
  kind: DEVICE_PUSH
  reason: token_conflict
  http_status: 409
  recovery:
    action: refresh
    disruptionLevel: inline
  l10n_key: error_device_push_token_conflict
  go_const: ErrDevicePushTokenConflict
  dart_const: devicePushTokenConflict
  user_message:
    zh: 推送凭证已被其他设备使用，请刷新后重试
    en: Push token is already active on another device
- code: USER.DEVICE_PUSH.version_conflict
  kind: DEVICE_PUSH
  reason: version_conflict
  http_status: 409
  recovery:
    action: retry
    disruptionLevel: silent
  l10n_key: error_device_push_version_conflict
  go_const: ErrDevicePushVersionConflict
  dart_const: devicePushVersionConflict
  user_message:
    zh: 设备推送状态已更新，请重试
    en: Device push state changed, please retry
- code: USER.DEVICE_PUSH.invalid_invalidation_reason
  kind: DEVICE_PUSH
  reason: invalid_invalidation_reason
  http_status: 400
  recovery:
    action: none
    disruptionLevel: silent
  l10n_key: error_device_push_invalid_invalidation_reason
  go_const: ErrDevicePushInvalidInvalidationReason
  dart_const: devicePushInvalidInvalidationReason
  user_message:
    zh: 推送失效原因无效
    en: Invalid push endpoint invalidation reason
- code: USER.DEVICE_PUSH.crypto_failure
  kind: DEVICE_PUSH
  reason: crypto_failure
  http_status: 500
  recovery:
    action: retry
    disruptionLevel: blocking
  l10n_key: error_device_push_crypto_failure
  go_const: ErrDevicePushCryptoFailure
  dart_const: devicePushCryptoFailure
  user_message:
    zh: 推送凭证暂时无法处理，请稍后重试
    en: Push credentials are temporarily unavailable
