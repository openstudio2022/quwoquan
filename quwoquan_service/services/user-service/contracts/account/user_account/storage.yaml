backend: postgres
tables:
  user_profiles:
    entity: UserAccount
    pk: user_id
    columns:
    - name: user_id
      type: VARCHAR(96)
      constraints:
      - PK
    - name: account_state
      type: VARCHAR(32)
      constraints:
      - NOT_NULL
      default: '''active'''
    - name: auth_epoch
      type: BIGINT
      constraints:
      - NOT_NULL
      default: 1
    - name: suspension_case_ref
      type: VARCHAR(128)
    - name: suspended_at
      type: TIMESTAMPTZ
    - name: identity_origin
      type: VARCHAR(32)
      constraints:
      - NOT_NULL
      default: '''phone'''
    - name: logical_shard
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: anonymous_retention_policy
      type: VARCHAR(32)
      constraints:
      - NOT_NULL
      default: '''preserve'''
    - name: phone
      type: VARCHAR(64)
      constraints:
      - UNIQUE
    - name: nickname
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: nickname_customized
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: false
    - name: avatar_url
      type: TEXT
    - name: avatar_asset_id
      type: VARCHAR(96)
    - name: avatar_version
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: background_url
      type: TEXT
    - name: background_asset_id
      type: VARCHAR(96)
    - name: bio
      type: VARCHAR(500)
    - name: identity_tags
      type: TEXT
    - name: gender
      type: VARCHAR(16)
    - name: birth_date
      type: DATE
    - name: region
      type: VARCHAR(128)
    - name: region_code
      type: VARCHAR(32)
    - name: profile_version
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 1
    - name: follower_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: following_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: post_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: circle_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: like_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: owner_display_name
      type: VARCHAR(64)
    - name: persona_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 1
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    indexes:
    - name: idx_user_profiles_nickname
      columns:
      - nickname
    - name: idx_user_profiles_phone
      columns:
      - phone
    - name: idx_user_profiles_account_state
      columns:
      - account_state
    search_indexes:
    - name: gin_user_profiles_search
      columns:
      - nickname
      - bio
      type: GIN_TRGM
  anonymous_device_bindings:
    entity: AnonymousDeviceBinding
    pk: id
    fk:
      column: owner_id
      references: user_profiles.user_id
      on_delete: CASCADE
    columns:
    - name: id
      type: VARCHAR(64)
      constraints:
      - PK
    - name: owner_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: install_id_hash
      type: VARCHAR(256)
      constraints:
      - NOT_NULL
    - name: device_fingerprint_hash
      type: VARCHAR(256)
      constraints:
      - NOT_NULL
    - name: platform
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
    - name: app_version
      type: VARCHAR(32)
    - name: last_seen_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    indexes:
    - name: idx_anonymous_device_bindings_owner_id
      columns:
      - owner_id
    - name: idx_anonymous_device_bindings_install_id_hash
      columns:
      - install_id_hash
    unique_constraints:
    - name: uq_anonymous_device_bindings_fingerprint
      columns:
      - device_fingerprint_hash
    cache_excluded: true
  profile_qr_tokens:
    entity: ProfileQrToken
    pk: token_id
    fk:
      column: owner_user_id
      references: user_profiles.user_id
      on_delete: CASCADE
    columns:
    - name: token_id
      type: VARCHAR(64)
      constraints:
      - PK
    - name: token_hash
      type: VARCHAR(128)
      constraints:
      - NOT_NULL
      - UNIQUE
    - name: owner_user_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: persona_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: user_handle
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: status
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''active'''
    - name: expires_at
      type: TIMESTAMPTZ
    - name: revoked_at
      type: TIMESTAMPTZ
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    indexes:
    - name: idx_profile_qr_tokens_owner_status
      columns:
      - owner_user_id
      - status
    - name: idx_profile_qr_tokens_handle
      columns:
      - user_handle
    - name: idx_profile_qr_tokens_hash
      columns:
      - token_hash
    unique_constraints:
    - name: uq_profile_qr_tokens_hash
      columns:
      - token_hash
    cache_excluded: true
  user_auth:
    entity: UserAuth
    pk: user_id
    fk:
      column: user_id
      references: user_profiles.user_id
      on_delete: CASCADE
    description: 仅承载登录失败计数与锁定状态；refresh 会话归 account_sessions（只存哈希）。
    columns:
    - name: user_id
      type: VARCHAR(96)
      constraints:
      - PK
    - name: password_hash
      type: VARCHAR(256)
      constraints:
      - NOT_NULL
    - name: otp_secret
      type: VARCHAR(128)
    - name: last_login_at
      type: TIMESTAMPTZ
    - name: last_login_ip
      type: VARCHAR(45)
    - name: login_fail_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: locked_until
      type: TIMESTAMPTZ
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    cache_excluded: true
  consent_records:
    entity: ConsentRecord
    pk: id
    fk:
      column: owner_id
      references: user_profiles.user_id
      on_delete: CASCADE
    columns:
    - name: id
      type: VARCHAR(64)
      constraints:
      - PK
    - name: owner_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: agreement_version
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: privacy_version
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: accepted_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: device_id
      type: VARCHAR(128)
    - name: platform
      type: VARCHAR(32)
    - name: source_operation
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    indexes:
    - name: idx_consent_records_owner_id
      columns:
      - owner_id
    - name: idx_consent_records_source_operation
      columns:
      - source_operation
  user_account_outbox:
    entity: UserAccount
    infrastructure_only: true
    description: UserAccountClosed、UserSuspended、UserRestored 与 UserProfileTagsChanged 同源状态事务提交的 durable outbox；租约 relay 仅在 durable stream 成功后确认 published，并按账号顺序重放。
    columns:
    - name: event_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: aggregate_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: aggregate_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: event_type
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: payload_json
      type: JSONB
      constraints:
      - NOT_NULL
    - name: occurred_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: published_at
      type: TIMESTAMPTZ
    - name: retry_count
      type: INTEGER
      constraints:
      - NOT_NULL
    - name: next_attempt_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: last_failure_code
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: last_failure_digest
      type: CHAR(64)
      constraints:
      - NOT_NULL
    - name: last_failed_at
      type: TIMESTAMPTZ
    - name: terminal_failure_at
      type: TIMESTAMPTZ
    - name: lease_owner
      type: VARCHAR(96)
    - name: lease_until
      type: TIMESTAMPTZ
    indexes:
    - name: idx_user_account_outbox_claim_ready
      columns:
      - next_attempt_at
      - lease_until
      - occurred_at
      - event_id
    - name: idx_user_account_outbox_unpublished_order
      columns:
      - aggregate_id
      - occurred_at
      - event_id
  user_account_outbox_dead_letters:
    entity: UserAccount
    infrastructure_only: true
    description: UserAccount lifecycle relay 的 payload-free terminal DLQ；仅保存 opaque event_id、事件类别、重试次数和错误 code/digest，relay 每小时清理超过 30 天的诊断记录，原 outbox 仍保持 terminal 以防乱序。
    columns:
    - name: event_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: event_type
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: aggregate_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: delivery_attempt
      type: INTEGER
      constraints:
      - NOT_NULL
    - name: failure_code
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: failure_digest
      type: CHAR(64)
      constraints:
      - NOT_NULL
    - name: failed_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: expires_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    indexes:
    - name: idx_user_account_outbox_dead_letters_expiry
      columns:
      - expires_at
    - name: idx_user_account_outbox_dead_letters_failed
      columns:
      - failed_at
      - event_id
  user_profile_search_outbox:
    entity: UserAccount
    infrastructure_only: true
    description: UserProfileUpdated、UserAvatarUpdated 与 UserRegistered 的 search projection durable outbox；资料事实与投影坐标在同一事务提交，租约 relay 只在 Elasticsearch/OpenSearch 幂等 upsert 或 delete 成功后确认 checkpoint，失败保留为可重放记录。
    columns:
    - name: event_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: user_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: profile_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: event_type
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: occurred_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: published_at
      type: TIMESTAMPTZ
    - name: retry_count
      type: INTEGER
      constraints:
      - NOT_NULL
    - name: next_attempt_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: last_failure_code
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: last_failure_digest
      type: CHAR(64)
      constraints:
      - NOT_NULL
    - name: last_failed_at
      type: TIMESTAMPTZ
    - name: lease_owner
      type: VARCHAR(96)
    - name: lease_until
      type: TIMESTAMPTZ
    indexes:
    - name: idx_user_profile_search_outbox_claim_ready
      columns:
      - next_attempt_at
      - lease_until
      - occurred_at
      - event_id
    - name: idx_user_profile_search_outbox_unpublished_order
      columns:
      - user_id
      - occurred_at
      - event_id
  service_schema_migrations:
    entity: UserAccount
    infrastructure_only: true
    description: user-service 迁移 runner 的幂等 ledger；只记录迁移文件 identity 与 digest，不承载业务状态。
    columns:
    - name: service_name
      type: TEXT
      constraints:
      - NOT_NULL
    - name: filename
      type: TEXT
      constraints:
      - NOT_NULL
    - name: checksum
      type: TEXT
      constraints:
      - NOT_NULL
    - name: applied_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    unique_constraints:
    - name: uq_service_schema_migrations_identity
      columns:
      - service_name
      - filename
  user_account_enforcement_receipts:
    entity: UserAccount
    infrastructure_only: true
    description: 已批准账号 suspend/restore decision 的原子幂等回执；与 UserAccount 状态、auth epoch 和 outbox 同事务提交。
    pk: decision_id
    columns:
    - name: decision_id
      type: VARCHAR(128)
      constraints:
      - PK
      - NOT_NULL
    - name: account_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: action
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
    - name: case_ref
      type: VARCHAR(128)
      constraints:
      - NOT_NULL
    - name: decision_digest
      type: VARCHAR(256)
      constraints:
      - NOT_NULL
    - name: approved_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: account_state
      type: VARCHAR(32)
      constraints:
      - NOT_NULL
    - name: auth_epoch
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: account_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: occurred_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    indexes:
    - name: idx_user_account_enforcement_receipts_account
      columns:
      - account_id
      - occurred_at
collections:
  rm_user_profile_view:
    backend: mongodb
    entity: UserAccount
    projection: UserProfileView
    role: projection
    description: UserAccount 的可重建兴趣、分群与统计视图；只消费 typed domain events，Mongo 记录不得成为账号或推荐特征的第二权威来源。
    indexes:
    - name: idx_upv_user
      keys:
        userId: 1
      unique: true
    - name: idx_upv_activity
      keys:
        activityLevel: 1
    - name: idx_upv_interest
      keys:
        interestTags: 1
    - name: idx_upv_segments
      keys:
        segments: 1
streams:
  events.user.account:
    entity: UserAccount
    role: append_only
    idempotency_key: eventId
    retention_seconds: 604800
    description: UserAccount closed/suspended/restored 的唯一 durable 生命周期 transport。
redis_cache:
- key: cache:user_profile:{userId}
  ttl_seconds: 600
  entity: UserAccount
  invalidate_on:
  - UserProfileUpdated
- key: device_tokens:{userId}
  ttl_seconds: 3600
  entity: UserDevice
  type: set
  description: 推送 token 集合
- key: login_fail:{userId}
  ttl_seconds: 1800
  type: string
  description: 登录失败滑动窗口计数
role: authoritative
codegen:
  enabled: true
  root_entity: UserAccount
  package: user
  tables:
  - user_profiles
  - user_auth
  - anonymous_device_bindings
  - profile_qr_tokens
  migration_skip_tables:
  - user_profiles
  - user_auth
  - anonymous_device_bindings
  - profile_qr_tokens
  name_overrides:
    UserProfile: Profile
  type_overrides:
    UserAccount:
      identityTags: string
  cache_overrides:
    "cache:user_profile:{userId}":
      skip: true
