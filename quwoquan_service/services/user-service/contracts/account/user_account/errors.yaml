domain: USER
aggregate: UserProfile
description: 'UserProfile 对象与 user 域共享的通用错误码。格式：MODULE.KIND.REASON。

  认证挑战/登录会话/凭证绑定/设置/分身错误码已按归属对象拆分至

  account_session、authentication_challenge、credential_binding、

  user_settings、persona 各自 errors.yaml；codegen 按 user/**/errors.yaml

  聚合生成 Dart UserErrorCode enum + UserErrorMessages 与 Go errors.go。

  '
errors:
- code: USER.USER.not_found
  kind: USER
  reason: not_found
  http_status: 404
  recovery_action: surface
  dart_const: userNotFound
  go_const: ErrUserNotFound
  user_message:
    zh: 用户不存在
    en: User not found
- code: USER.USER.unauthorized
  kind: USER
  reason: unauthorized
  http_status: 401
  recovery_action: surface
  dart_const: unauthorized
  go_const: ErrUnauthorized
  user_message:
    zh: 请先登录
    en: Please sign in to continue
- code: USER.USER.forbidden
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: forbidden
  go_const: ErrForbidden
  user_message:
    zh: 无权访问该资源
    en: Access denied
- code: USER.USER.nickname_taken
  kind: USER
  reason: conflict
  http_status: 409
  recovery_action: surface
  dart_const: nicknameTaken
  go_const: ErrNicknameTaken
  user_message:
    zh: 该昵称已被使用，请换一个
    en: Nickname already taken, please choose another
- code: USER.USER.invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 请求参数有误
    en: Invalid request parameters
- code: USER.ACCOUNT.enforcement_decision_invalid
  kind: ACCOUNT
  reason: enforcement_decision_invalid
  http_status: 400
  recovery_action: surface
  dart_const: accountEnforcementDecisionInvalid
  go_const: ErrAccountEnforcementDecisionInvalid
  user_message:
    zh: 账号处置决策无效
    en: The account enforcement decision is invalid
- code: USER.ACCOUNT.state_conflict
  kind: ACCOUNT
  reason: state_conflict
  http_status: 409
  recovery_action: surface
  dart_const: accountStateConflict
  go_const: ErrAccountStateConflict
  user_message:
    zh: 账号当前状态无法执行该操作
    en: The account is not in a state that permits this action
- code: USER.USER.rate_limited
  kind: USER
  reason: rate_limited
  http_status: 429
  recovery_action: retry
  recovery_after_seconds: 60
  dart_const: rateLimited
  go_const: ErrRateLimited
  user_message:
    zh: 操作太频繁，请稍后重试
    en: Too many requests, please retry later
- code: USER.SYSTEM.internal_error
  kind: SYSTEM
  reason: internal_error
  http_status: 500
  recovery_action: surface
  dart_const: internalError
  go_const: ErrInternalError
  user_message:
    zh: 登录服务暂不可用，请使用其他方式登录
    en: Service error, please try again later
- code: USER.PROFILE.invalid_region
  kind: PROFILE
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: profileInvalidRegion
  go_const: ErrProfileInvalidRegion
  user_message:
    zh: 请选择有效的省市地区
    en: Please choose a valid region
- code: USER.PROFILE.invalid_tag_ref
  kind: PROFILE
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: profileInvalidTagRef
  go_const: ErrProfileInvalidTagRef
  user_message:
    zh: 所选标签不可用，请重新选择
    en: Selected tags are unavailable, please choose again
- code: USER.PROFILE.taxonomy_release_conflict
  kind: PROFILE
  reason: conflict
  http_status: 409
  recovery_action: reload
  dart_const: profileTaxonomyReleaseConflict
  go_const: ErrProfileTaxonomyReleaseConflict
  user_message:
    zh: 标签目录已更新，请刷新后重新选择
    en: The tag catalog has changed. Refresh and choose again.
- code: USER.PROFILE.version_conflict
  kind: PROFILE
  reason: conflict
  http_status: 409
  recovery_action: reload
  dart_const: profileVersionConflict
  go_const: ErrProfileVersionConflict
  user_message:
    zh: 资料已在其他会话中更新，请刷新后重试
    en: The profile changed in another session. Refresh and retry.
- code: USER.PROFILE.idempotency_conflict
  kind: PROFILE
  reason: idempotency_conflict
  http_status: 409
  recovery_action: surface
  dart_const: profileIdempotencyConflict
  go_const: ErrProfileIdempotencyConflict
  user_message:
    zh: 重复保存请求的内容不一致，请重新操作
    en: The repeated profile update differs from the original request.
- code: USER.PROFILE.invalid_media_asset
  kind: PROFILE
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: profileInvalidMediaAsset
  go_const: ErrProfileInvalidMediaAsset
  user_message:
    zh: 图片上传未完成，请重新选择并保存
    en: Image upload is incomplete, please choose and save again
- code: USER.PROFILE.qr_token_invalid
  kind: PROFILE
  reason: not_found
  http_status: 404
  recovery_action: surface
  dart_const: profileQrTokenInvalid
  go_const: ErrProfileQrTokenInvalid
  user_message:
    zh: 二维码已失效，请让对方重新分享
    en: QR code is invalid, please ask for a new share
- code: USER.PROFILE.qr_token_expired
  kind: PROFILE
  reason: expired
  http_status: 410
  recovery_action: surface
  dart_const: profileQrTokenExpired
  go_const: ErrProfileQrTokenExpired
  user_message:
    zh: 二维码已过期，请让对方重新分享
    en: QR code expired, please ask for a new share
