    application:
      facet: PersonaManagementQueryFacade
      kind: query
      method: listPersonas
      reader: ListPersonasReader
      slice: ListPersonasSlice
    description: 查看自己所有分身列表
    method: GET
    operation: ListPersonas
    commercial:
      status: ready
    path: /user/personas
    response_entity: ListPersonasResult
    response_fields:
      - personaId
      - displayName
      - userHandle
      - phone
      - email
      - avatarUrl
      - backgroundUrl
      - bio
      - isolationLevel
      - isActive
      - isPrimary
      - status
      - retiredAt
      - inheritsProfileFromOwner
      - overriddenProfileFields
      - lastProfileSyncAt
      - lastProfileSyncSource
      - profileVisibility
      - purposeHint
      - updatedAt
      - lastActivatedAt
      - version
    security:
      anonymous_policy: deny
      auth_mode: required
      principal: owner
      token_transport: bearer
      visibility: private
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_personas_list
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    response_body: ListPersonasResult
    response_body_kind: object
    request_entity: ListPersonasQuery
    request_body_kind: none
