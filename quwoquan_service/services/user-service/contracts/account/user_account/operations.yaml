description: 用户档案、认证、设备、设置与分身管理
externalDependencies:
  - capability: identity.carrier.one_tap
    port: CarrierOneTapPort
    operations: [resolvePhone]
    conformance: carrier_one_tap
    adapterContracts:
      ext.auth.carrier_one_tap_protocol_fixture:
        endpointEnvs: {endpoint: USER_CARRIER_ONE_TAP_SUBSTITUTE_ENDPOINT}
        secretRefs: []
        defaultTimeoutMs: 10000
      ext.auth.carrier_one_tap:
        endpointEnvs: {endpoint: ALIYUN_DYPNS_ENDPOINT}
        secretRefs:
        - ALIYUN_DYPNS_ACCESS_KEY_ID
        - ALIYUN_DYPNS_ACCESS_KEY_SECRET
        defaultTimeoutMs: 10000
  - capability: identity.social.login
    port: FederatedIdentityPort
    operations: [authorize, resolveIdentity]
    conformance: social_identity
    adapterContracts:
      ext.auth.federated_identity_protocol_fixture:
        endpointEnvs: {endpoint: USER_FEDERATED_IDENTITY_SUBSTITUTE_ENDPOINT}
        secretRefs: []
        defaultTimeoutMs: 10000
      ext.auth.federated_identity:
        endpointEnvs:
          wechat_token: WECHAT_OAUTH_TOKEN_URL
          wechat_user_info: WECHAT_OAUTH_USER_INFO_URL
          alipay_token: ALIPAY_OAUTH_TOKEN_URL
          alipay_user_info: ALIPAY_OAUTH_USER_INFO_URL
          qq_user_info: QQ_OAUTH_USER_INFO_URL
        secretRefs:
        - WECHAT_OAUTH_APP_ID
        - WECHAT_OAUTH_APP_SECRET
        - ALIPAY_OAUTH_APP_ID
        - ALIPAY_OAUTH_APP_PRIVATE_KEY_PEM
        - ALIPAY_OAUTH_PLATFORM_PUBLIC_KEY_PEM
        - ALIPAY_OAUTH_MERCHANT_PID
        - QQ_OAUTH_APP_ID
        defaultTimeoutMs: 10000
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [appendDurable]
    scenes: [general, realtime]
api_routes:
