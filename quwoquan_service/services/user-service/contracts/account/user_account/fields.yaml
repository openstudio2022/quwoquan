description: 用户根实体——登录凭证、设备、恢复、审计与多分身管理容器
fields:
  - name: userId
    source: userId
    type: string
    constraints:
      - PK
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 全局唯一 owner ID；匿名与注册账号都使用同一稳定主键规则
    role: authoritative_state
  - name: accountState
    source: accountState
    type: enum
    enum_ref: AccountState
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    recommend_feature: false
    observe_metric: user_account_state_gauge
    description: 账号生命周期状态：anonymous | active | suspended | closed（closed 为注销终态）
    role: authoritative_state
  - name: authEpoch
    source: authEpoch
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: INTERNAL
    log_policy: metadata_only
    api_exposure: drop
    ops_exposure: read
    recommend_feature: false
    description: 账号安全代次；Suspend/Restore/Close 递增，认证、refresh 和服务鉴权拒绝旧 epoch token
    role: authoritative_state
  - name: suspensionCaseRef
    source: suspensionCaseRef
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: mask
    api_exposure: drop
    ops_exposure: read
    recommend_feature: false
    description: 当前有效限制对应的不透明运营 case 引用；禁止写入审核理由、证据或用户可见响应
    role: authoritative_state
  - name: suspendedAt
    source: suspendedAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: metadata_only
    api_exposure: drop
    ops_exposure: read
    recommend_feature: false
    description: 当前 suspended 状态首次生效时间；Restore 后保留仅供审计，不作为公开资料字段
    role: authoritative_state
  - name: identityOrigin
    source: identityOrigin
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 首次创建来源：anonymous_device | phone | federated | apple | passkey | migrated_seed
    role: authoritative_state
  - name: logicalShard
    source: logicalShard
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 固定逻辑槽位；由结构化 ownerId 生成并长期稳定
    role: authoritative_state
  - name: anonymousRetentionPolicy
    source: anonymousRetentionPolicy
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    recommend_feature: false
    description: 匿名痕迹保留策略；当前固定为 preserve
    role: authoritative_state
  - name: phone
    source: phone
    type: string
    constraints:
      - UK
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: drop
    ops_exposure: mask
    recommend_feature: false
    description: 手机号（登录凭证）；匿名账号允许为空
    role: authoritative_state
  - name: nickname
    source: nickname
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    search_field: true
    description: 昵称（显示名，允许重复，不再作为唯一标识；唯一性由 userId/personaId/userHandle 承担）
    role: projection
  - name: nicknameCustomized
    source: nicknameCustomized
    type: bool
    constraints:
      - NOT_NULL
      - DEFAULT_FALSE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 用户是否手动修改过昵称；首次创建的系统默认昵称为 false，用户改名后置 true，端侧据此决定是否展示昵称编辑画笔
    role: projection
  - name: avatarUrl
    source: avatarUrl
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 当前 active Persona 头像投影；只由 Persona outbox projector 写入
    role: projection
  - name: avatarAssetId
    source: avatarAssetId
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 当前 active Persona 头像资产主键投影；只由 Persona outbox projector 写入
    role: projection
    reference: true
  - name: avatarVersion
    source: avatarVersion
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 当前 active Persona 头像版本投影；只由 Persona outbox projector 写入，用于群头像重算与缓存失效
    role: projection
  - name: backgroundUrl
    source: backgroundUrl
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 当前 active Persona 主页头图投影；只由 Persona outbox projector 写入
    role: projection
  - name: backgroundAssetId
    source: backgroundAssetId
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 当前 active Persona 主页头图资产主键投影；只由 Persona outbox projector 写入
    role: projection
    reference: true
  - name: bio
    source: bio
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    search_field: true
    description: 当前 active Persona 个人签名投影；只由 Persona outbox projector 写入
    role: projection
  - name: identityTags
    source: identityTags
    type: '[]string'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    search_field: true
    description: 当前 active Persona 主页身份标签投影；只由 Persona outbox projector 写入，端侧以 · 分隔单行展示
    role: projection
  - name: interestTags
    source: interestTags
    type: '[]string'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    tag_ref: true
    description: 当前 active Persona 声明式兴趣投影；只由 Persona outbox projector 写入，tagRef 真相源为 control_plane/governance/taxonomy
    role: projection
  - name: gender
    source: gender
    type: enum
    enum_ref: Gender
    constraints:
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: read
    ops_exposure: mask
    recommend_feature: true
    description: 当前 active Persona 性别投影；只由 Persona outbox projector 写入
    role: projection
  - name: birthDate
    source: birthDate
    type: date
    constraints:
      - NULLABLE
    classification: PII
    log_policy: drop
    api_exposure: read
    ops_exposure: drop
    recommend_feature: false
    description: 当前 active Persona 出生日期投影；只由 Persona outbox projector 写入
    role: projection
  - name: region
    source: region
    type: string
    constraints:
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 当前 active Persona 地区投影；只由 Persona outbox projector 写入
    role: projection
  - name: regionTagRef
    source: regionTagRef
    type: tag_ref
    constraints:
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 当前 active Persona 省市行政区 tagRef 投影；只由 Persona outbox projector 写入，公开展示由 tag-service 派生
    role: projection
  - name: profileVersion
    source: profileVersion
    type: int
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: Persona 公开资料投影版本号；只由 Persona outbox projector 推进，供端侧增量校验
    role: projection
  - name: followerCount
    source: followerCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 关注该用户主页的人数；只由 canonical relationship outbox projector 写入，修复任务仅从同一权威关系事实重放；前台展示为「粉丝」
    role: projection
  - name: followingCount
    source: followingCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 当前 Persona 关注数；只由 canonical relationship outbox projector 写入，修复任务仅从同一权威关系事实重放
    role: projection
  - name: postCount
    source: postCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 公开作品数；只由 canonical content outbox projector 写入，修复任务仅从同一权威内容事实重放
    role: projection
  - name: circleCount
    source: circleCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 已加入圈子数；只由 canonical circle membership outbox projector 写入，修复任务仅从同一权威成员事实重放
    role: projection
  - name: likeCount
    source: likeCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_0
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 获赞总数；只由 canonical content reaction outbox projector 写入，修复任务仅从同一权威互动事实重放
    role: projection
  - name: createdAt
    source: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    role: authoritative_state
  - name: ownerDisplayName
    source: ownerDisplayName
    type: string
    constraints:
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: drop
    ops_exposure: read
    recommend_feature: false
    description: 主控账号管理视角名称（仅自己控制台可见，不对外展示）
    role: projection
  - name: personaCount
    source: personaCount
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    description: 当前持有Persona数量（冗余计数）
    role: authoritative_state
  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: false
    role: authoritative_state
enums:
  UserSyncPatchKind:
    values: [user_avatar_updated, conversation_avatar_updated]
types:
  UserSyncHintEventPayload:
    description: durable UserSyncPatch 已提交后的最小实时提示；客户端只使用 latestSyncSeq 触发 typed PullUserSync，不解析业务补丁。
    fields:
      - {name: userId, source: userId, type: string, constraints: [NOT_BLANK], classification: PRIVATE, log_policy: hash, api_exposure: read, ops_exposure: none}
      - {name: latestSyncSeq, source: latestSyncSeq, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: read, ops_exposure: none, semantic_type: watermark_sequence}
  UserAvatarSyncPatchPayload:
    description: 用户头像同步补丁的最小强类型载荷；只包含联系人头像缓存重建所需的用户身份、URL 与版本。
    fields:
      - {name: userId, source: userId, type: string, constraints: [NOT_NULL], classification: PRIVATE, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: avatarUrl, source: avatarUrl, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: avatarVersion, source: avatarVersion, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, semantic_type: aggregate_version}
  ConversationAvatarSyncPatchPayload:
    description: 会话头像同步补丁的最小强类型载荷；会话事实仍由 Chat 拥有，UserAccount 只返回当前账号同步流中的脱敏投影。
    fields:
      - {name: conversationId, source: conversationId, type: string, constraints: [NOT_NULL], classification: PRIVATE, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: avatarUrl, source: avatarUrl, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: groupAvatarVersion, source: groupAvatarVersion, type: int, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, semantic_type: aggregate_version}
      - {name: groupAvatarSourceHash, source: groupAvatarSourceHash, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
  UserSyncPatch:
    description: 由 kind 判别的账号增量同步补丁；未知 kind、缺失对应载荷或同时携带多份载荷必须拒绝。
    discriminator: kind
    variants:
      user_avatar_updated: UserAvatarSyncPatchPayload
      conversation_avatar_updated: ConversationAvatarSyncPatchPayload
    fields:
      - {name: syncSeq, source: syncSeq, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: read, ops_exposure: read, semantic_type: sequence}
      - {name: kind, source: kind, type: enum, enum_ref: UserSyncPatchKind, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: userAvatarUpdated, source: userAvatarUpdated, type: UserAvatarSyncPatchPayload, constraints: [NULLABLE], classification: PRIVATE, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: conversationAvatarUpdated, source: conversationAvatarUpdated, type: ConversationAvatarSyncPatchPayload, constraints: [NULLABLE], classification: PRIVATE, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: occurredAt, source: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: read, ops_exposure: read, semantic_type: instant}
  PullUserSyncSlice:
    description: 当前账号的有界同步补丁页；游标缺口时 requiresResync=true，调用方必须从 owner query 重建而非猜测补丁。
    fields:
      - {name: patches, source: patches, type: '[]UserSyncPatch', constraints: [NOT_NULL], classification: PRIVATE, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: latestSyncSeq, source: latestSyncSeq, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: read, ops_exposure: read, semantic_type: watermark_sequence}
      - {name: hasMore, source: hasMore, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: requiresResync, source: requiresResync, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
  ListPersonasResult:
    fields:
      - {name: items, type: '[]PersonaManagementItemView', constraints: [NOT_NULL]}
  PersonaManagementSummaryView:
    fields:
      - {name: items, type: '[]PersonaManagementItemView', constraints: [NOT_NULL]}
      - {name: quota, type: PersonaManagementQuotaView, constraints: [NOT_NULL]}
      - {name: activeContext, type: ActivePersonaContextView, constraints: [NOT_NULL]}
  SearchSocialRelationsResult:
    fields:
      - {name: items, type: '[]SocialRelationSearchItemView', constraints: [NOT_NULL]}
      - {name: cursor, type: string, constraints: [NOT_NULL]}
  LoginAccountHint:
    description: 登录页历史账号或运营商命中账号的脱敏摘要；只用于展示和二次登录，不是认证事实
    cache_excluded: true
    fields:
      - name: displayName
        source: displayName
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 登录页展示昵称；优先 ownerDisplayName，其次 nickname
      - name: nicknameCustomized
        source: nicknameCustomized
        type: bool
        constraints:
          - NOT_NULL
          - DEFAULT_FALSE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 昵称是否为用户主动设置或第三方授权同步的有效公开昵称；端侧不得通过昵称格式猜测
      - name: avatarUrl
        source: avatarUrl
        type: string
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: avatarAssetId
        source: avatarAssetId
        type: string
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: maskedPhone
        source: maskedPhone
        type: string
        constraints:
          - NULLABLE
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: mask
        description: 脱敏手机号，如 138****8888；端侧不得接触真实手机号
      - name: identityOrigin
        source: identityOrigin
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: lastLoginAt
        source: lastLoginAt
        type: timestamp
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  OneTapLoginHintResponse:
    description: 运营商一键登录提示响应；不签发 token，只返回脱敏号码和账号摘要
    cache_excluded: true
    fields:
      - name: state
        source: state
        type: enum
        enum_ref: OneTapLoginHintState
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: maskedPhone
        source: maskedPhone
        type: string
        constraints:
          - NULLABLE
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: mask
      - name: registered
        source: registered
        type: bool
        constraints:
          - NOT_NULL
          - DEFAULT_FALSE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: accountHint
        source: accountHint
        type: object
        object_ref: LoginAccountHint
        constraints:
          - NULLABLE
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: mask
      - name: expiresInSeconds
        source: expiresInSeconds
        type: int
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: providerRequestId
        source: providerRequestId
        type: string
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  CarrierProviderAuditContext:
    description: 运营商服务商审计上下文；禁止记录真实手机号和 carrier token
    cache_excluded: true
    fields:
      - name: provider
        source: provider
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: providerRequestId
        source: providerRequestId
        type: string
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: latencyMs
        source: latencyMs
        type: int
        constraints:
          - NOT_NULL
          - DEFAULT_0
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: resultCode
        source: resultCode
        type: string
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: occurredAt
        source: occurredAt
        type: timestamp
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
  ConsentRecord:
    description: 登录前用户协议与隐私政策同意记录；用于登录、数据权利与法务审计
    cache_excluded: true
    fields:
      - name: id
        source: id
        type: string
        constraints:
          - PK
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: ownerId
        source: ownerId
        type: string
        constraints:
          - FK_user_profiles_CASCADE
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: agreementVersion
        source: agreementVersion
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: privacyVersion
        source: privacyVersion
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: acceptedAt
        source: acceptedAt
        type: timestamp
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: deviceId
        source: deviceId
        type: string
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: platform
        source: platform
        type: string
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: sourceOperation
        source: sourceOperation
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
    business_rules:
      - id: last_credential_protection
        description: OwnerAccount 至少保留 1 个 isActive=true 的凭证，不能全部解绑
  AnonymousDeviceBinding:
    description: 匿名设备到 owner 账号的稳定绑定，不直接暴露或依赖原始设备标识
    cache_excluded: true
    fields:
      - name: id
        source: id
        type: string
        constraints:
