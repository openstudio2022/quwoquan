read_model: UserProfileView
description: '用户画像 ReadModel。聚合 UserProfile + 标签 + 行为统计。

  供推荐引擎和助手消费。

  '
storage_backend: mongodb
collection: rm_user_profile_view
projection_mode: rebuildable
source_entities:
- UserProfile
- PersonaRelationship
- ContentReaction
- VisitRecord
source_events:
- UserProfileUpdated
- PersonaFollowStateChanged
- ContentReactionSet
- ContentReactionCleared
- BehaviorBatchReported
consumers:
- recommendation-engine
- assistant-service
checkpoint:
  source: typed event identity 与 aggregate version
  resume: inclusive_idempotent
rebuild:
  strategy: replay_declared_source_events
  atomic_replace: true
tombstone:
  strategy: UserAccountClosed 删除账号视图且禁止迟到事件复活
fields:
- name: userId
  type: string
- name: nickname
  type: string
- name: bio
  type: string
- name: region
  type: string
- name: followerCount
  type: int
- name: followingCount
  type: int
- name: postCount
  type: int
- name: interestTags
  type: '[]string'
  description: 推断的兴趣标签
- name: contentPreference
  type: object
  description: 内容偏好分布
- name: activityLevel
  type: string
  description: 活跃度等级
- name: recentBehaviors
  type: '[]object'
  description: 最近行为摘要
- name: interestProfile
  source: interestProfile
  type: object
  description: "派生兴趣画像(T4-1)：由 content-service 基于 rm_recommend_feature.userFeatures 四维 affinities\n计算(topN\
    \ 归一 + 生命周期分层 + 半衰期新鲜度衰减)，经 UserInterestRecomputed 事件跨服务\n投影到本 user 域 ReadModel(单一真相源)：\n  topInterests:\
    \ [{ tagRef, dimension(topic|audience|format|entity), score(0..1), level(0..5) }]\n  dimensionTops:\
    \ { topic: [tagRef...], audience: [...], format: [...], entity: [...] }\n  lifecycleStage: new|active|dormant\n\
    \  freshnessDays: int\n  decayHalfLifeDays: int\n  recomputedAt: timestamp\n仅按 userId 聚合(禁 personaId)；供\
    \ recommendation-engine 与 assistant-service 消费。\n"
- name: segments
  source: segments
  type: '[]string'
  description: '规则人群 segment 命中集(T4-2)：content-service 在派生 interestProfile 后，按

    services/recommendation-service/contracts/recommendation/recommendation_model_release/segments.yaml 的结构化 predicate(AND 语义)

    匹配，随 UserInterestRecomputed 事件携带，投影到本 ReadModel 顶层(单一真相源)；

    按 priority 降序，供推荐定向(boost/filter)与小艺主动画像消费。

    '
- name: updatedAt
  type: timestamp
indexes:
- name: idx_upv_user
  keys:
    userId: 1
  unique: true
- name: idx_upv_segments
  keys:
    segments: 1
