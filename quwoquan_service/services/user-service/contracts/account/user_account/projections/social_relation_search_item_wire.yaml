read_model: SocialRelationSearchItemWire
description: 'SearchSocialRelations 列表元素 wire；关系能力必须使用强类型投影，

  禁止由页面或 View 从整行动态 Map 回退推断。

  '
source_entities:
- UserProfile
consumers:
- app
client_projection:
  dart_class: SocialRelationSearchItemWireDto
  base_class: ''
  output_path: cloud/runtime/generated/user/social_relation_search_item_wire_dto.g.dart
  dart_imports:
  - relationship_capability_wire_dto.g.dart
  fields:
  - name: personaId
    dart_type: String
    nullable: false
    source: personaId
    default: ''''''
  - name: userHandle
    dart_type: String
    nullable: false
    source: userHandle
    default: ''''''
  - name: displayName
    dart_type: String
    nullable: false
    source: displayName
    default: ''''''
  - name: avatarUrl
    dart_type: String
    nullable: true
    source: avatarUrl
    default: 'null'
  - name: avatarVersion
    dart_type: int
    nullable: false
    source: avatarVersion
    default: '0'
  - name: headline
    dart_type: String
    nullable: true
    source: headline
    default: 'null'
  - name: chatAvailable
    dart_type: bool
    nullable: false
    source: chatAvailable
    default: 'false'
  - name: relationshipCapability
    dart_type: RelationshipCapabilityWireDto
    nullable: false
    source: relationshipCapability
    map_from_string_key_class: RelationshipCapabilityWireDto
