read_model: AuthLoginResult
description: 'Owner 登录（phone/wechat/apple）响应 wire，与 user_profile/operations.yaml

  LoginWith* 的 response_fields 对齐。供 App AuthRepository.login 强类型解析。

  '
source_entities:
- OwnerAccount
consumers:
- app
client_projection:
  dart_class: AuthLoginResultDto
  base_class: ''
  output_path: cloud/runtime/generated/user/auth_login_result_dto.g.dart
  fields:
  - name: accessToken
    dart_type: String
    nullable: false
    source: accessToken
    default: ''''''
  - name: refreshToken
    dart_type: String
    nullable: false
    source: refreshToken
    default: ''''''
  - name: ownerId
    dart_type: String
    nullable: false
    source: ownerId
    default: ''''''
  - name: accountState
    dart_type: String
    nullable: false
    source: accountState
    default: ''''''
  - name: identityOrigin
    dart_type: String
    nullable: false
    source: identityOrigin
    default: ''''''
  - name: logicalShard
    dart_type: int
    nullable: false
    source: logicalShard
    default: '0'
  - name: anonymousRetentionPolicy
    dart_type: String
    nullable: false
    source: anonymousRetentionPolicy
    default: ''''''
  - name: activePersona
    dart_type: Map<String, dynamic>
    nullable: true
    source: activePersona
    default: 'null'
  - name: personaCount
    dart_type: int
    nullable: false
    source: personaCount
    default: '0'
  - name: sessionRememberTtlSeconds
    dart_type: int
    nullable: false
    source: sessionRememberTtlSeconds
    default: '0'
  - name: accountHint
    dart_type: Map<String, dynamic>
    nullable: true
    source: accountHint
    default: 'null'
