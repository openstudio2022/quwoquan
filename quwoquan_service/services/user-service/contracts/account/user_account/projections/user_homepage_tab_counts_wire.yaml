read_model: UserHomepageTabCountsWire
description: '用户主页 / 我的主页 Tab 计数 wire（homepage-bundle 子对象）。承载主页 Tab 导航角标计数：

  作品 / 获赞 / 圈子 / 收藏。仅身份域可直接计数的真相，交集与影响力的下钻计数不在此聚合

  （仍由 content 域接口提供，避免 user 域成为内容事实的第二真相源）。

  '
source_entities:
- UserProfile
consumers:
- app
fields:
- {name: worksCount, type: int, nullable: false}
- {name: likesCount, type: int, nullable: false}
- {name: circlesCount, type: int, nullable: false}
- {name: collectionsCount, type: int, nullable: false}
