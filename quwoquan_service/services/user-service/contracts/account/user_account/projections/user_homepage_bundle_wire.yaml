read_model: UserHomepageBundleWire
description: 'GET /user/{personaId}/homepage-bundle 响应 wire（主页首屏聚合真相源，锁定决策 #1）。

  只聚合「身份域真相」：profile（公开档案）/ stats（统计计数）/ relationshipCapability（viewer→target

  关系能力，自己/陌生时可空）/ tabCounts（Tab 角标计数）/ viewerContext（本人/游客/关系/可见性）/

  cacheVersion（端做乐观回填与并发刷新一致性的版本锚）。


  红线：禁止在 user 域聚合 content / intersection 事实——交集卡与影响力 evidence 仍由 content 域接口

  端侧并发拉取，user 域不得成为内容事实第二真相源（§3 架构冻结）。bundle 让首屏从「串行多请求」收敛

  为「一次聚合 + 并发补充」，消除首屏串行阻塞断点。

  '
source_entities:
- UserProfile
consumers:
- app
fields:
- {name: profile, type: PersonaProfileView, nullable: false}
- {name: stats, type: UserProfileStatsWire, nullable: false}
- {name: relationshipCapability, type: RelationshipCapabilityView, nullable: true}
- {name: tabCounts, type: UserHomepageTabCountsWire, nullable: false}
- {name: viewerContext, type: UserHomepageViewerContextWire, nullable: false}
- {name: cacheVersion, type: string, nullable: false}
