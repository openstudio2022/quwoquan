read_model: UserProfileStatsWire
description: '用户主页统计计数 wire（独立 stats 响应或与 profile 合并字段）。

  followerCount 在人页统计前台展示为「粉丝」；followingCount 展示为「关注」。

  前台术语由用户身份领域规格约束：followerCount 展示为「粉丝」，禁止使用「关注者」。

  '
source_entities:
- UserProfile
consumers:
- app
client_projection:
  dart_class: UserProfileStatsWireDto
  base_class: ''
  output_path: cloud/runtime/generated/user/account/user_account_stats_wire_dto.g.dart
  fields:
  - name: followingCount
    dart_type: int
    nullable: false
    source: followingCount
    default: '0'
  - name: circleCount
    dart_type: int
    nullable: false
    source: circleCount
    default: '0'
  - name: followerCount
    dart_type: int
    nullable: false
    source: followerCount
    default: '0'
  - name: likeCount
    dart_type: int
    nullable: false
    source: likeCount
    default: '0'
  - name: postCount
    dart_type: int
    nullable: false
    source: postCount
    default: '0'
