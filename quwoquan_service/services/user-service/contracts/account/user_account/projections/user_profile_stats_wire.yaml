read_model: UserProfileStatsWire
description: '用户主页统计计数 wire（独立 stats 响应或与 profile 合并字段）。

  followerCount 在人页统计前台展示为「粉丝」；followingCount 展示为「关注」。

  前台术语由用户身份领域规格约束：followerCount 展示为「粉丝」，禁止使用「关注者」。

  '
source_entities:
- UserProfile
consumers:
- app
fields:
- {name: followingCount, type: int, nullable: false}
- {name: circleCount, type: int, nullable: false}
- {name: followerCount, type: int, nullable: false}
- {name: likeCount, type: int, nullable: false}
- {name: postCount, type: int, nullable: false}
