read_model: ProfileEditSnapshotWire
description: 'GET /user/profile/edit-snapshot 返回的本人资料编辑私有快照，合并 owner/profile、

  active persona、凭证摘要、二维码摘要与标签选择。userHandle 为服务端系统分配，只读展示。

  '
source_entities:
- UserProfile
- Persona
- CredentialBinding
consumers:
- app
fields:
- {name: ownerUserId, type: string, nullable: false}
- {name: personaId, type: string, nullable: false}
- {name: avatarUrl, type: string, nullable: true}
- {name: avatarAssetId, type: string, nullable: true}
- {name: avatarVersion, type: int, nullable: false}
- {name: backgroundUrl, type: string, nullable: true}
- {name: backgroundAssetId, type: string, nullable: true}
- {name: nickname, type: string, nullable: false}
- {name: displayName, type: string, nullable: false}
- {name: gender, type: enum, enum_ref: Gender, nullable: true}
- {name: birthDate, type: date, nullable: true}
- {name: region, type: string, nullable: true}
- {name: regionTagRef, type: tag_ref, nullable: true}
- {name: userHandle, type: string, nullable: false}
- {name: bio, type: string, nullable: true}
- {name: identityTags, type: '[]string', nullable: true}
- {name: occupationTagRef, type: tag_ref, nullable: true}
- {name: interestTagRefs, type: '[]tag_ref', nullable: true}
- {name: phoneCredential, type: ProfileCredentialSummaryWire, nullable: true}
- {name: qrCard, type: ProfileQrCardWire, nullable: true}
- {name: updatedAt, type: timestamp, nullable: false}
