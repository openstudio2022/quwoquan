events:
- name: UserSyncHinted
  description: durable UserSyncPatch 已提交后发给当前账号的轻量提示；端侧必须通过 PullUserSync 获取 typed patch。
  delivery_semantics: best_effort_ephemeral
  topic: rt:user:{userId}
  payload_entity: UserSyncHintEventPayload
  payload_fields:
  - userId
  - latestSyncSeq
  client_ws_type: sync_hint
  no_consumer_reason: 当前没有 canonical object.yaml.lifecycle.source_events 反向边；若 delivery_semantics 要求投递，commercial closure 保持
    GATE_BLOCK。
- name: UserProfileUpdated
  description: 用户资料提交后的尽力而为失效提示；权威搜索投影由 PersonaProfileProjector 同事务写入 user_profile_search_outbox 并独立重放，瞬时通知丢失不得回滚资料事实。
  delivery_semantics: best_effort_ephemeral
  topic: event:user-profile
  payload_entity: UserAccount
  payload_fields:
  - userId
  - nickname
  - profileVersion
  - updatedAt
  no_consumer_reason: 该瞬时提示没有 durable consumer 义务；搜索索引消费独立的事务性 profile projection coordinate，不消费此 channel。
- name: UserProfileTagsChanged
  description: 用户职业/兴趣标签与资料状态原子提交后的 durable 投影事件；tag-service 独占 object_tag_index 写入
  delivery_semantics: transactional_outbox
  payload_entity: UserProfileTagProjectionEvent
  payload_fields:
  - userId
  - tagRefs
  - taxonomyReleaseId
  - profileVersion
  - occurredAt
- name: UserAvatarUpdated
  description: 用户头像已更新
  delivery_semantics: transactional_outbox
  payload_entity: UserAccount
  payload_fields:
  - userId
  - avatarUrl
  - avatarVersion
  - profileVersion
  - updatedAt
- name: UserSuspended
  description: 受信运营 Suspend decision 已原子生效。下游必须落可逆 restriction projection， 隐藏可见性/拒绝写入/抑制投递；不得调用 UserAccountClosed 的删除或匿名化路径。
  delivery_semantics: transactional_outbox
  topic: events.user.account
  payload_entity: UserAccountEnforcementPayload
  payload_fields:
  - userId
  - personaIds
  - accountState
  - authEpoch
  - decisionRef
  - occurredAt
- name: UserRestored
  description: 受信 Restore decision 已原子生效。下游只能恢复可逆 restriction projection； 不得恢复 closed 账号、旧 session/token、已删除数据或已过期通知。
  delivery_semantics: transactional_outbox
  topic: events.user.account
  payload_entity: UserAccountEnforcementPayload
  payload_fields:
  - userId
  - personaIds
  - accountState
  - authEpoch
  - decisionRef
  - occurredAt
- name: UserAccountClosed
  description: 账号已注销（closed 终态）；下游必须删除或匿名化该账号关联的可见数据与索引。 recommendation-service 独立形成 RecommendationSubjectClosureFact 并据此阻止推荐窗口、曝光、反馈与特征复活，不得再由
    content-service 代管推荐隐私状态。
  delivery_semantics: transactional_outbox
  topic: events.user.account
  payload_entity: UserAccountClosedPayload
  payload_fields:
  - userId
  - personaIds
  - accountState
  - updatedAt
