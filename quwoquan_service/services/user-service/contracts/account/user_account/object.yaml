kind: aggregate_root
description: '用户档案聚合（当前 ContractGraph 中保留 UserAccount 名称的 UserAccount 语义根）。

  该根只拥有账号认证与安全状态；Persona、CredentialBinding、UserDevice、

  UserSetting、ProfileUpdateProposal 均按独立生命周期对象治理，不作为 owned member。

  对这些对象的关联由各对象契约的关系与公开操作表达，跨聚合读取由具名 Reader

  组装，禁止通过聚合 members 或数据库 join 暗示直接访问。

  '
identity:
  fields:
  - userId
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: avatarAsset
  on_delete: detach
  reference_fields:
  - avatarAssetId
  target_object: content.MediaAsset
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: backgroundAsset
  on_delete: detach
  reference_fields:
  - backgroundAssetId
  target_object: content.MediaAsset
search_policy:
  exposed: remote_index
  object_type_refs:
  - user.profile
  eligibility_ref: quwoquan_service/services/user-service/internal/account/user_account/application/account_orchestration/user_search_projection.go#UserProfileSearchEligible
  index_projector_ref: quwoquan_service/services/search-service/internal/search/search_index_view/application/user_profile_projection.go#UserProfileSearchProjectionEvent.Document
  privacy_filter_ref: quwoquan_service/services/user-service/internal/account/user_account/application/account_orchestration/user_search_projection.go#UserProfileSearchEligible
assistant_access:
  read:
    mode: owner_scoped
    scopes:
    - assistant.user.user_account.read
    reader:
      descriptor_id: account.user_interest_profile
      resolver_ref: user.interest_profile
      owner_service: user-service
      owner_operation_ref: user.user_account.GetUserInterestProfile
      input_schema_ref: assistant.GetAssistantRunQuery
      output_schema_ref: assistant.ContextSegment
      object_type_ref: user.UserAccount
      authority: domain_canonical
      sensitivity: private
      accepted_source_kinds: [memory]
      surface_kinds: [personal]
      artifact_policy: inline_bounded
      citation_policy: source_reference
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
business_rules:
- 账号根身份在存储 userId 与 wire ownerId/accountId 中只使用 `uo_<origin>_<4hex>_<26 lowercase Crockford>`；4hex 必须等于 origin 与 entropy 的 canonical routing hash 槽位，禁止版本段、别名格式或宽松解析
- accountState、identityOrigin 与 logicalShard 仅由账号生命周期命令或受信事件修改
- UserAccount 不保存可写公开 Persona 资料、凭证 secret、Session token、设备 token 或设置值；公开资料字段只作为 active Persona outbox 的只读投影
- followerCount、followingCount、postCount、circleCount、likeCount 只允许 canonical 领域 outbox projector 写入，修复任务只能重放同一权威事实
- 一个 Account 可以引用多个 Persona，但不得跨聚合事务直接修改 Persona
- close 为终态并通过 outbox 驱动 credential、session 与 device 吊销
- CloseAccount 由账号本人 App 内自助发起（Apple 5.1.1(v)）；已 closed 重放为幂等成功
- SuspendAccount 仅接受经过服务身份、scope 与审批决策校验的内部调用；只允许 active -> suspended
- RestoreAccount 仅接受经过 appeal/运营审批链校验的内部调用；只允许 suspended -> active，closed 永不可恢复
- SuspendAccount 与 RestoreAccount 必须在同一事务内更新 accountState/authEpoch、撤销 refresh session、写幂等回执/audit ref
  并写 durable outbox
- actor、accountId 与审计元数据只来自 trusted principal 和 invocation context
- PullUserSync 只返回由 kind 判别的 user_avatar_updated 或 conversation_avatar_updated 强类型补丁；未知 runtime patch、kind 与载荷不匹配或字段畸形必须 fail closed，游标缺口只以 requiresResync 要求调用方重建 owner projection
lifecycle:
  state_field: accountState
  states:
  - anonymous
  - active
  - suspended
  - closed
  optimistic_concurrency: version
  idempotency: event_or_command_receipt
  source_events:
  - user.persona.PersonaCreated
  - user.persona.PersonaUpdated
  - user.persona.PersonaRetired
  - user.persona.PersonaActivated
  event_consumers:
  - name: MaterializeActivePersonaProfile
    kind: event_handler
    facet: PersonaProfileProjector
    method: project
    idempotency: aggregate_version
