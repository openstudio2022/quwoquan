aggregate: UserAccount
app_log_policy:
- app_log: drop
  classification: PII
  description: 手机号不记录任何日志
  field: phone
- app_log: drop
  classification: PII
  description: 生日不记录日志
  field: birthDate
- app_log: mask
  classification: PII
  field: region
  mask_strategy: city_level_only
- app_log: drop_if_gt_100chars
  classification: PUBLIC
  field: bio
data_lifecycle:
  deletion_cascade:
  - entity: Persona
    strategy: hard_delete
  - entity: CredentialBinding
    strategy: hard_delete
  - entity: DeviceRegistration
    strategy: hard_delete
  - entity: UserSettings
    strategy: hard_delete
  deletion_on_user_request: true
  retention_days: 3650
description: 'UserAccount 账号与只读公开资料投影的隐私与安全策略。

  补充 fields.yaml classification 的端侧实现细节和 GDPR 数据生命周期。

  codegen 从本文件生成 Dart UserPrivacyPolicy.sanitizeForLog()。

  '
field_visibility:
- description: 手机号只在服务内部使用，不经过任何 API 暴露
  field: phone
  visibility:
  - user-service-internal
- field: birthDate
  visibility:
  - self
  - user-service-internal
- field: gender
  visibility:
  - self
  - platform-ops
