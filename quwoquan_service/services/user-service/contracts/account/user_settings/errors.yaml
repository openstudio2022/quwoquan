description: 'UserSettings 对象专属错误码。格式：MODULE.KIND.REASON。

  覆盖通话铃声/外观作用域校验与服务端内部 version CAS 冲突；

  codegen 与 user 域其余对象 errors.yaml 聚合生成端云错误契约。

  '
errors:
- code: USER.SETTING.invalid_call_ringtone
  reason: invalid_argument
  emitted_by:
  - surface: http
    operations:
    - UpdateCallSettings
  http_status: 400
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: invalidCallRingtone
  go_const: ErrInvalidCallRingtone
  user_message:
    zh: 所选铃声不可用，请从官方铃声库中重新选择
    en: Selected ringtone is unavailable, please choose from the official library
- code: USER.SETTING.invalid_appearance_scope
  reason: invalid_argument
  emitted_by:
  - surface: http
    operations:
    - UpdateAppearanceSettings
  http_status: 400
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: invalidAppearanceScope
  go_const: ErrInvalidAppearanceScope
  user_message:
    zh: 外观设置作用范围无效，请重试
    en: Appearance settings scope is invalid, please try again
- code: USER.SETTING.settings_version_conflict
  reason: conflict
  emitted_by:
  - surface: http
    operations:
    - UpdateAppearanceSettings
    - UpdateCallSettings
    - UpdateNotificationSettings
    - UpdatePrivacySettings
  http_status: 409
  recovery_action: retry
  disruption_level: silent
  dart_const: settingsVersionConflict
  go_const: ErrSettingsVersionConflict
  user_message:
    zh: 设置已在其他设备更新，请刷新后重试
    en: Settings were updated on another device, please refresh and retry
