description: UserSettings 对象专属 command packet。
commercial_defaults:
  status: blocked
  block_reason: operation must carry explicit commercial evidence before enablement
  gap_id: USER_SETTINGS_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: GET
    path: /user/settings/notifications
    operation: GetNotificationSettings
    actor: account
    application:
      kind: query
      facet: UserSettingsQueryFacade
      method: getNotificationSettings
      reader: GetNotificationSettingsReader
      slice: GetNotificationSettingsSlice
    response_entity: NotificationSettingsView
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 800
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_settings_notifications_get
      trace: true
      attributes:
        - outcome
        - error_code
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    commercial:
      status: ready
    response_body: NotificationSettingsView
    response_body_kind: object
    request_entity: UserSettingsQuery
    request_body_kind: none
