  - method: GET
    path: /internal/user/accounts/{userId}/assistant-delivery-policy
    operation: ResolveAssistantDeliveryPolicy
    request_bindings:
      path:
        - {name: userId, field: userId}
    actor: none
    application:
      kind: query
      facet: UserSettingsQueryFacade
      method: resolveAssistantDeliveryPolicy
      reader: AssistantDeliveryPolicyReader
      slice: AssistantDeliveryPolicyView
    description: 按订阅 owner userId 读取 UserSettings，并返回主动助手投递所需的最小开关与免打扰策略。
    response_entity: AssistantDeliveryPolicyView
    response_fields:
      - userId
      - assistantEnabled
      - quietHoursStart
      - quietHoursEnd
      - version
      - updatedAt
    authorization:
      principal: service
      scopes:
        - user.assistant_delivery_policy.read
      ownership_policy: trusted_internal_account_policy_read
    commercial:
      status: ready
    reliability:
      timeout_ms: 600
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
