backend: postgres
tables:
  user_settings:
    entity: UserSettings
    role: authoritative
    description: 服务端 version CAS + LWW；同值重写幂等，不设独立 receipt 表。
    columns:
    - name: user_id
      type: VARCHAR(96)
      constraints:
      - PK
      - NOT_NULL
    - name: enable_push
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: enable_marketing
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'false'
    - name: quiet_hours_start
      type: TIME
    - name: quiet_hours_end
      type: TIME
    - name: default_incoming_call_ringtone_id
      type: VARCHAR(64)
    - name: allow_caller_ringtone_override
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: enable_call_vibration
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: enable_group_call_ring
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: allow_stranger_msg
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: profile_visibility
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''public'''
    - name: content_language
      type: VARCHAR(16)
    - name: feed_preference
      type: VARCHAR(16)
    - name: assistant_enabled
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: 'true'
    - name: default_theme_mode
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''system'''
    - name: default_font_size_preset
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''md'''
    - name: appearance_version
      type: INTEGER
      constraints:
      - NOT_NULL
      default: '1'
    - name: appearance_updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: blocked_keywords
      type: TEXT[]
    - name: version
      type: BIGINT
      constraints:
      - NOT_NULL
      default: '1'
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
  user_settings_outbox:
    entity: UserSettings
    role: append_only
    infrastructure_only: true
    description: 与 aggregate state 同一 PostgreSQL transaction 提交的设置变更审计事实；当前无独立 relay consumer。
role: authoritative
