    - name: userId
      source: userId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: assistantEnabled
      source: assistantEnabled
      type: bool
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: quietHoursStart
      source: quietHoursStart
      type: time
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: quietHoursEnd
      source: quietHoursEnd
      type: time
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: version
      source: version
      type: int64
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: updatedAt
      source: updatedAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  UserSettingsCommandResult:
    description: 通知/隐私/通话设置命令的稳定提交回执；读投影是设置页单一真相源。
    fields:
    - name: userId
      source: userId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: version
      source: version
      type: int64
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: idempotentReplay
      source: idempotentReplay
      type: boolean
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
