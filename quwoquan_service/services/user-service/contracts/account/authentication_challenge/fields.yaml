description: 一次密码、OTP、passkey 或联合登录挑战的短生命周期根
fields:
  - name: id
    type: string
    constraints:
      - PK
      - NOT_NULL
    role: authoritative_state
  - name: accountId
    type: string
    constraints:
      - NULLABLE
    role: authoritative_state
    reference: true
  - name: purpose
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: channel
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: destinationHash
    classification: SENSITIVE
    log_policy: drop
    type: string
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: secretRef
    classification: SECRET
    log_policy: drop
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: status
    type: enum
    enum_ref: AuthenticationChallengeStatus
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: attemptCount
    type: int
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: expiresAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: completedAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: deliveryRequestId
    type: string
    constraints:
      - NULLABLE
    role: authoritative_state
    reference: true
  - name: deliveryStatus
    type: enum
    enum_ref: OtpDeliveryStatus
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: deliveryUpdatedAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: lastDeliveryEventId
    type: string
    constraints:
      - NULLABLE
    role: authoritative_state
enums:
  AuthenticationChallengeStatus:
    - pending
    - completed
    - expired
    - locked
    - cancelled
  OtpDeliveryStatus:
    - queued
    - sent_unconfirmed
    - delivered
    - failed
  OtpClientPlatform:
    - ios
    - android
    - web
    - acceptance
  OtpDeliveryAvailability:
    - ready
    - temporarily_unavailable
types:
  SyntheticIdentityLabel:
    client_value: true
    description: 'Alpha isolated 本地非认证标识；value 完整匹配 ^alpha-synthetic:[a-f0-9]{32}$（ASCII、区分大小写、不 trim/折叠、不接受任何别名）。32 位后缀由本地安全随机 128-bit 生成，不从真实 phone/email/name 派生。唯一键为已验证 source/snapshot/instance 加 value；请求不能自报空间。尚无本地端口生成器时仅为值合同，不是可运行认证入口。'
    fields:
      - {name: value, type: string, pattern: '^alpha-synthetic:[a-f0-9]{32}$', constraints: [NOT_BLANK], max_utf8_bytes: 48, classification: PUBLIC, log_policy: drop, api_exposure: none, ops_exposure: drop}
  BeginSyntheticChallenge:
    client_value: true
    description: '仅由已验证 isolated composition 的本地端口消费，非 HTTP operation；requestKey 为随机128-bit lowercase hex，重复同payload幂等、跨payload冲突。identity 不得借用 SendOtp.phone。'
    fields:
      - {name: identity, type: SyntheticIdentityLabel, constraints: [NOT_NULL], classification: INTERNAL, log_policy: drop, api_exposure: none, ops_exposure: drop}
      - {name: requestKey, type: string, pattern: '^[a-f0-9]{32}$', constraints: [NOT_BLANK], max_utf8_bytes: 32, classification: INTERNAL, log_policy: drop, api_exposure: none, ops_exposure: drop}
  SyntheticChallengeView:
    client_value: true
    description: 'challengeId 完整匹配 ^alpha-challenge:[a-f0-9]{32}$，绑定空间/identity/到期/消费状态。confirmationHint 唯一值 alpha-rehearsal-confirm，仅用于确认UI步骤，没有真实认证能力，不是OTP/秘密，不进入真实SMS或AutoFill。expiresInSeconds为1..300，最多5次错误锁定。'
    fields:
      - {name: challengeId, type: string, pattern: '^alpha-challenge:[a-f0-9]{32}$', constraints: [NOT_BLANK], classification: INTERNAL, log_policy: drop, api_exposure: none, ops_exposure: drop}
      - {name: confirmationHint, type: string, const: alpha-rehearsal-confirm, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: drop, api_exposure: none, ops_exposure: drop}
      - {name: expiresInSeconds, type: int, constraints: [NOT_NULL, MIN_1, MAX_300], classification: INTERNAL, log_policy: drop, api_exposure: none, ops_exposure: drop}
  SyntheticLoginEvidence:
    client_value: true
    description: '仅限已校验isolated Alpha的私有plan/screenshots/native活动产物：仅identityLabel完整匹配 ^alpha-synthetic:[a-f0-9]{32}$ 且confirmationHint精确等于alpha-rehearsal-confirm。必须来自本地typed流程，不接受自由文本或额外字段。PUBLIC只说明不含真实主体/认证秘密，普通日志仍drop。空间未验证、unknown类别、任何真实phone/OTP/credential/内部ID或收集器无法隔离屏幕/键盘/剪贴板/活动输入时一律拒绝且不执行native输入。该值合同不提供采集授权。'
    fields:
      - {name: identityLabel, type: string, pattern: '^alpha-synthetic:[a-f0-9]{32}$', constraints: [NOT_BLANK], max_utf8_bytes: 48, classification: PUBLIC, log_policy: drop, api_exposure: none, ops_exposure: drop}
      - {name: confirmationHint, type: string, const: alpha-rehearsal-confirm, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: drop, api_exposure: none, ops_exposure: drop}
  OtpDeliveryReadinessQuery:
    fields: []
  SendOtpCommand:
    fields:
      - name: phone
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceId
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: platform
        type: enum
        enum_ref: OtpClientPlatform
        constraints:
          - NOT_NULL
        client_dart_type: OtpClientPlatform
      - name: appVersion
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: sourceOperation
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: bindingTicket
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
  ResolveOneTapLoginHintCommand:
    fields:
      - name: vendor
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: carrierToken
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: deviceId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: platform
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: appVersion
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
  CreateAlipayAuthorizationRequestCommand:
    fields:
      - name: platform
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: appVersion
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
  OtpChallengeIssueResult:
    fields:
      - {name: maskedPhone, type: string, constraints: [NOT_NULL]}
      - {name: expiresInSeconds, type: int, constraints: [NOT_NULL]}
      - {name: deliveryStatus, type: enum, enum_ref: OtpDeliveryStatus, constraints: [NOT_NULL]}
      - {name: retryAfterSeconds, type: int, constraints: [NOT_NULL]}
      - {name: requestId, type: string, constraints: [NOT_BLANK]}
      - {name: challengeId, type: string, constraints: [NOT_BLANK]}
  OtpDeliveryReadiness:
    fields:
      - {name: availability, type: enum, enum_ref: OtpDeliveryAvailability, constraints: [NOT_NULL]}
      - {name: retryAfterSeconds, type: int, constraints: [NOT_NULL]}
  AlipayAuthorizationGrant:
    fields:
      - {name: authorizationPayload, type: string, constraints: [NOT_BLANK]}
      - {name: expiresAt, type: timestamp, constraints: [NOT_NULL]}
  OneTapAccountHint:
    fields:
      - {name: displayName, type: string, constraints: [NOT_NULL]}
      - {name: avatarUrl, type: string, constraints: [NOT_NULL]}
      - {name: maskedPhone, type: string, constraints: [NOT_NULL]}
      - {name: identityOrigin, type: string, constraints: [NOT_NULL]}
  OneTapLoginHint:
    fields:
      - {name: state, type: string, constraints: [NOT_NULL]}
      - {name: maskedPhone, type: string, constraints: [NOT_NULL]}
      - {name: registered, type: boolean, constraints: [NOT_NULL]}
      - {name: expiresInSeconds, type: int, constraints: [NOT_NULL]}
      - {name: accountHint, type: OneTapAccountHint, constraints: [NULLABLE]}
      - {name: providerRequestId, type: string, constraints: [NULLABLE]}
