description: 一次密码、OTP、passkey 或联合登录挑战的短生命周期根
fields:
- name: id
  type: string
  constraints:
  - PK
  - NOT_NULL
  role: authoritative_state
- name: accountId
  type: string
  constraints:
  - NULLABLE
  role: authoritative_state
  reference: true
- name: purpose
  type: string
  constraints:
  - NOT_NULL
  role: authoritative_state
- name: channel
  type: string
  constraints:
  - NOT_NULL
  role: authoritative_state
- name: destinationHash
  type: string
  constraints:
  - NULLABLE
  role: authoritative_state
- name: secretRef
  type: string
  constraints:
  - NOT_NULL
  role: authoritative_state
- name: status
  type: string
  constraints:
  - NOT_NULL
  role: authoritative_state
- name: attemptCount
  type: int
  constraints:
  - NOT_NULL
  role: authoritative_state
- name: expiresAt
  type: timestamp
  constraints:
  - NOT_NULL
  role: authoritative_state
- name: createdAt
  type: timestamp
  constraints:
  - NOT_NULL
  role: authoritative_state
- name: completedAt
  type: timestamp
  constraints:
  - NULLABLE
  role: authoritative_state
