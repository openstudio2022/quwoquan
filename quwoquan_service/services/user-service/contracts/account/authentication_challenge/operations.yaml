description: AuthenticationChallenge 对象专属 command packet。
externalDependencies:
  - role: use
    capability: identity.sms.otp
    port: SmsDeliveryPort
    operations: [sendOtp]
    scenes: [phone_otp_delivery]
commercial_defaults:
  status: blocked
  block_reason: operation must carry explicit commercial evidence before enablement
  gap_id: USER_AUTHENTICATION_CHALLENGE_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: GET
    path: /auth/otp/readiness
    operation: GetOtpDeliveryReadiness
    actor: none
    application:
      kind: query
      facet: AuthenticationChallengeQueryFacade
      method: getOtpDeliveryReadiness
      reader: OtpDeliveryReadinessReader
      slice: OtpDeliveryReadiness
    description: 只读确认手机号验证码投递链是否可接受新请求，不暴露 Provider 或内部依赖检查
    response_fields:
      - availability
      - retryAfterSeconds
    authorization:
      principal: public
      ownership_policy: authentication_challenge_bootstrap
    commercial:
      status: ready
    reliability:
      timeout_ms: 1200
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: user_auth_otp_delivery_readiness
      trace: true
      attributes:
        - environment
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_entity: OtpDeliveryReadiness
    response_body: OtpDeliveryReadiness
    response_body_kind: object
    request_entity: OtpDeliveryReadinessQuery
    request_body_kind: none
  - method: POST
    path: /auth/otp/send
    operation: SendOtp
    actor: none
    application:
      kind: command
      facet: AuthenticationChallengeCommandFacade
      method: sendOtp
      aggregate_owner: AuthenticationChallenge
      mutation_target: AuthenticationChallenge
      invariant_target: AuthenticationChallenge
    description: 下发手机号验证码（发码冷却 + 每小时配额），验证码只经外部短信投递
    response_fields:
      - maskedPhone
      - expiresInSeconds
      - deliveryStatus
      - requestId
      - challengeId
      - retryAfterSeconds
    authorization:
      principal: public
      ownership_policy: authentication_challenge_bootstrap
    commercial:
      status: ready
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.invalid_argument
      - USER.AUTH.otp_rate_limited
      - USER.AUTH.otp_idempotency_conflict
      - USER.AUTH.otp_provider_failed
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: PII
      response_classification: PII
      log_policy: metadata_only
    telemetry:
      metric: user_auth_otp_send
      trace: true
      attributes:
        - environment
        - platform
        - outcome
        - error_code
        - delivery_status
        - idempotent_replay
    slo:
      latency_p95_ms: 1200
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_entity: OtpChallengeIssueResult
    response_body: OtpChallengeIssueResult
    response_body_kind: object
    request_entity: SendOtpCommand
    request_body_kind: object
  - method: POST
    path: /auth/authorization/alipay
    operation: CreateAlipayAuthorizationRequest
    actor: none
    application:
      kind: command
      facet: AuthenticationChallengeCommandFacade
      method: createAlipayAuthorizationRequest
      aggregate_owner: AuthenticationChallenge
      mutation_target: AuthenticationChallenge
      invariant_target: AuthenticationChallenge
    description: 为支付宝原生 authV2 SDK 生成服务端 RSA2 签名的短期授权串；客户端不得持有商户私钥
    response_fields:
      - authorizationPayload
      - expiresAt
    authorization:
      principal: public
      ownership_policy: social_authorization_bootstrap
    commercial:
      status: blocked
      block_reason: prod Alipay credentials and controlled SDK evidence are not injected
      gap_id: R_AUTH_001
      target_story: four-environment-commercial-login-maturity
    reliability:
      timeout_ms: 1200
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.invalid_argument
      - USER.AUTH.alipay_auth_failed
      - USER.AUTH.social_provider_unavailable
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SECRET
      log_policy: none
    telemetry:
      metric: user_auth_alipay_authorization
      trace: true
      attributes:
        - environment
        - platform
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1200
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_entity: AlipayAuthorizationGrant
    response_body: AlipayAuthorizationGrant
    response_body_kind: object
    request_entity: CreateAlipayAuthorizationRequestCommand
    request_body_kind: object
  - method: POST
    path: /auth/login/one-tap/hint
    operation: ResolveOneTapLoginHint
    actor: none
    application:
      kind: command
      facet: AuthenticationChallengeCommandFacade
      method: resolveOneTapLoginHint
      aggregate_owner: AuthenticationChallenge
      mutation_target: AuthenticationChallenge
      invariant_target: AuthenticationChallenge
    description: 运营商一键登录提示；服务端置换短期授权 token 后返回脱敏手机号与账号摘要，不签发 token
    response_fields:
      - state
      - maskedPhone
      - registered
      - accountHint
      - expiresInSeconds
      - providerRequestId
    authorization:
      principal: public
      ownership_policy: authentication_challenge_bootstrap
    commercial:
      status: blocked
      block_reason: prod carrier credentials, controlled SDK, and real-device evidence are not injected
      gap_id: R_AUTH_001
      target_story: four-environment-commercial-login-maturity
    reliability:
      timeout_ms: 1200
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - USER.USER.invalid_argument
      - USER.AUTH.carrier_unavailable
      - USER.AUTH.carrier_token_invalid
      - USER.AUTH.carrier_provider_timeout
      - USER.AUTH.account_suspended
      - USER.AUTH.account_deleted
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SECRET
      response_classification: PII
      log_policy: none
    telemetry:
      metric: user_auth_one_tap_hint
      trace: true
      attributes:
        - environment
        - platform
        - vendor
        - outcome
        - error_code
    slo:
      latency_p95_ms: 1200
      availability_percent: 99.9
    security:
      auth_mode: public
      principal: public
      token_transport: none
      anonymous_policy: allow
      visibility: private
    response_entity: OneTapLoginHint
    response_body: OneTapLoginHint
    response_body_kind: object
    request_entity: ResolveOneTapLoginHintCommand
    request_body_kind: object
readiness_cases:
  - case_id: send-otp-local
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md#gwt-001
    producer: service
    layer: local_contract
    target: {kind: operation, id: SendOtp}
    runner_source_path: quwoquan_service/services/user-service/tests/local_contract/account/authentication_challenge/operation_orchestration__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
  - case_id: send-otp-api
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md#gwt-001
    producer: service
    layer: api_integration
    target: {kind: operation, id: SendOtp}
    runner_source_path: quwoquan_service/services/user-service/tests/api_integration/account/authentication_challenge/postgres_challenge__api_integration_test.go
    executions:
      - {env: beta, platform: service, device: runner, provider: postgres, digest_binding: candidate}
  - case_id: create-alipay-authorization-request-local
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login-commercial-login-entry/spec.md#gwt-003
    producer: service
    layer: local_contract
    target: {kind: operation, id: CreateAlipayAuthorizationRequest}
    runner_source_path: quwoquan_service/services/user-service/tests/local_contract/account/authentication_challenge/operation_orchestration__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
  - case_id: create-alipay-authorization-request-api
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login-commercial-login-entry/spec.md#gwt-003
    producer: service
    layer: api_integration
    target: {kind: operation, id: CreateAlipayAuthorizationRequest}
    runner_source_path: quwoquan_service/services/user-service/tests/api_integration/account/authentication_challenge/postgres_challenge__api_integration_test.go
    executions:
      - {env: beta, platform: service, device: runner, provider: alipay-rsa2, digest_binding: candidate}
  - case_id: resolve-one-tap-login-hint-local
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md#gwt-001
    producer: service
    layer: local_contract
    target: {kind: operation, id: ResolveOneTapLoginHint}
    runner_source_path: quwoquan_service/services/user-service/tests/local_contract/account/authentication_challenge/operation_orchestration__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
  - case_id: resolve-one-tap-login-hint-api
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md#gwt-001
    producer: service
    layer: api_integration
    target: {kind: operation, id: ResolveOneTapLoginHint}
    runner_source_path: quwoquan_service/services/user-service/tests/api_integration/account/authentication_challenge/postgres_challenge__api_integration_test.go
    executions:
      - {env: beta, platform: service, device: runner, provider: protocol-substitute, digest_binding: candidate}
  - case_id: authentication_challenge_send_otp_app_local
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md#gwt-001
    producer: app
    layer: local_contract
    target: {kind: operation, id: SendOtp}
    runner_source_path: quwoquan_app/test/local_contract/service/user_service/account/authentication_challenge/authentication_challenge_remote__local_contract_test.dart
    executions:
      - {env: alpha, platform: app, device: runner, provider: none, digest_binding: candidate}
  - case_id: authentication_challenge_create_alipay_authorization_request_app_local
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login-commercial-login-entry/spec.md#gwt-003
    producer: app
    layer: local_contract
    target: {kind: operation, id: CreateAlipayAuthorizationRequest}
    runner_source_path: quwoquan_app/test/local_contract/service/user_service/account/authentication_challenge/authentication_challenge_remote__local_contract_test.dart
    executions:
      - {env: alpha, platform: app, device: runner, provider: none, digest_binding: candidate}
  - case_id: authentication_challenge_resolve_one_tap_login_hint_app_local
    spec_ref: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md#gwt-001
    producer: app
