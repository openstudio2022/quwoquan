kind: aggregate_root
description: OTP、OAuth authorization 与 one-tap hint 的短期验证挑战聚合。
identity:
  fields:
  - id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: account
  on_delete: retain
  reference_fields:
  - accountId
  target_object: user.UserAccount
- access: command_facade
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: externalDelivery
  on_delete: retain
  reference_fields:
  - deliveryRequestId
  target_object: integration.ExternalInteraction
local_identity_reasons:
  lastDeliveryEventId: immutable Integration result-event correlation key, not a standalone aggregate identity
search_policy:
  exposed: none
  not_exposed_reason: "认证、凭据与会话安全对象，任何检索暴露都会直接削弱账号安全。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "认证凭据、会话密钥与风控状态对小趣完全关闭，不存在可开放的子集。"
business_rules:
- purpose、channel、destinationHash、secretRef 与内部 bindingTicketRef 创建后不可变
- secret 明文不得进入 aggregate、日志、事件或 API 响应
- verify attempt 有界，超过上限或 expiresAt 后立即失效
- completed、expired 与 locked 为终态；成功消费在 challenge 行内记录结果指纹，同一凭据重复验证返回同一结果
- 发送冷却与配额由服务端强制，challenge 创建按 idempotency key 去重
- 同一 SendOtp idempotency key 只创建一个 challenge、只提交一个 Provider request 且只消费一次配额；跨 destination、purpose 或 binding scope 重用必须冲突失败
- Provider 投递状态只由 ExternalInteractionResultReported durable consumer 更新；重复、乱序和终态倒退不得改变权威状态，failed/dead_letter 必须取消仍 pending 的 challenge
- 用于社交首登 completion 的 bind_phone challenge 必须引用创建时已验证的 pending binding ticket，completion 只能消费同一 ticket 引用的 challenge；已登录账号自行绑定手机号的 challenge 不伪造 ticket
lifecycle:
  state_field: status
  states:
  - pending
  - completed
  - expired
  - locked
  - cancelled
  optimistic_concurrency: version
  idempotency: inline_row_receipt
  source_events:
  - integration.external_interaction.ExternalInteractionResultReported
  event_consumers:
  - name: ApplyOtpDeliveryResult
    kind: event_handler
    facet: AuthenticationChallengeDeliveryResultConsumer
    method: processOnce
    idempotency: event_id
