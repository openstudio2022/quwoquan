description: AccountAppealIntake 单用途凭据、暂停状态、提交与认领的 typed errors。
errors:
- code: USER.ACCOUNT.account_appeal_credential_invalid
  reason: account_appeal_credential_invalid
  emitted_by: [{surface: http, operations: [IssueAccountAppealCredential, SubmitAccountAppealIntake]}]
  http_status: 400
  recovery_action: retry
  disruption_level: inlineCard
  dart_const: accountAppealCredentialInvalid
  go_const: ErrAccountAppealCredentialInvalid
  user_message: {zh: 申诉凭据无效，请重新验证身份, en: Appeal credential is invalid; verify your identity again}
- code: USER.ACCOUNT.account_appeal_credential_expired
  reason: account_appeal_credential_expired
  emitted_by: [{surface: http, operations: [SubmitAccountAppealIntake]}]
  http_status: 410
  recovery_action: retry
  disruption_level: inlineCard
  dart_const: accountAppealCredentialExpired
  go_const: ErrAccountAppealCredentialExpired
  user_message: {zh: 申诉凭据已失效，请重新验证身份, en: Appeal credential expired; verify your identity again}
- code: USER.ACCOUNT.account_appeal_credential_consumed
  reason: account_appeal_credential_consumed
  emitted_by: [{surface: http, operations: [SubmitAccountAppealIntake]}]
  http_status: 409
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: accountAppealCredentialConsumed
  go_const: ErrAccountAppealCredentialConsumed
  user_message: {zh: 申诉凭据已使用, en: Appeal credential has already been used}
- code: USER.ACCOUNT.account_appeal_not_suspended
  reason: account_appeal_not_suspended
  emitted_by: [{surface: http, operations: [IssueAccountAppealCredential, SubmitAccountAppealIntake, ClaimAccountAppealIntake]}]
  http_status: 409
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: accountAppealNotSuspended
  go_const: ErrAccountAppealNotSuspended
  user_message: {zh: 当前账号状态不需要申诉恢复, en: This account state does not allow a restoration appeal}
- code: USER.ACCOUNT.account_appeal_rate_limited
  reason: account_appeal_rate_limited
  emitted_by: [{surface: http, operations: [IssueAccountAppealCredential]}]
  http_status: 429
  recovery_action: retry
  recovery_after_seconds: 600
  disruption_level: inlineCard
  dart_const: accountAppealRateLimited
  go_const: ErrAccountAppealRateLimited
  user_message: {zh: 身份验证请求较频繁，请稍后重试, en: Too many appeal identity requests; try again later}
- code: USER.ACCOUNT.account_appeal_intake_not_found
  reason: account_appeal_intake_not_found
  emitted_by: [{surface: http, operations: [ClaimAccountAppealIntake]}]
  http_status: 404
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: accountAppealIntakeNotFound
  go_const: ErrAccountAppealIntakeNotFound
  user_message: {zh: 申诉记录不存在或已删除, en: Appeal intake was not found or has been deleted}
- code: USER.ACCOUNT.account_appeal_intake_account_mismatch
  reason: account_appeal_intake_account_mismatch
  emitted_by: [{surface: http, operations: [ClaimAccountAppealIntake]}]
  http_status: 409
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: accountAppealIntakeAccountMismatch
  go_const: ErrAccountAppealIntakeAccountMismatch
  user_message: {zh: 申诉记录与账号不一致, en: Appeal intake does not belong to this account}
- code: USER.ACCOUNT.account_appeal_intake_claimed
  reason: account_appeal_intake_claimed
  emitted_by: [{surface: http, operations: [ClaimAccountAppealIntake]}]
  http_status: 409
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: accountAppealIntakeClaimed
  go_const: ErrAccountAppealIntakeClaimed
  user_message: {zh: 申诉记录已由其他案件认领, en: Appeal intake was claimed by another case}
- code: USER.ACCOUNT.account_appeal_idempotency_conflict
  reason: account_appeal_idempotency_conflict
  emitted_by: [{surface: http, operations: [SubmitAccountAppealIntake, ClaimAccountAppealIntake]}]
  http_status: 409
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: accountAppealIdempotencyConflict
  go_const: ErrAccountAppealIdempotencyConflict
  user_message: {zh: 请求标识已用于其他申诉操作, en: Request identity was already used for another appeal operation}
