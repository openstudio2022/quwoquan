backend: postgresql
role: authoritative
tables:
  account_appeal_credentials:
    entity: AccountAppealIntake
    role: authoritative
    infrastructure_only: true
    description: 单用途短期 credential；只持久化 SHA-256 摘要、challenge 引用、suspension authEpoch 与消费回执，绝不保存明文。
    columns:
    - {name: credential_id, type: VARCHAR(64), constraints: [PK, NOT_NULL]}
    - {name: credential_digest, type: CHAR(64), constraints: [NOT_NULL, UNIQUE]}
    - {name: challenge_id, type: VARCHAR(128), constraints: [NOT_NULL, UNIQUE]}
    - {name: account_id, type: VARCHAR(96), constraints: [NOT_NULL]}
    - {name: suspension_auth_epoch, type: BIGINT, constraints: [NOT_NULL]}
    - {name: issued_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: expires_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: consumed_at, type: TIMESTAMPTZ, constraints: [NULLABLE]}
    - {name: intake_ref, type: VARCHAR(64), constraints: [NULLABLE]}
    - {name: delete_after, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    indexes:
    - {name: idx_account_appeal_credentials_account_epoch, columns: [account_id, suspension_auth_epoch, issued_at]}
    - {name: idx_account_appeal_credentials_delete_after, columns: [delete_after]}
  account_appeal_intakes:
    entity: AccountAppealIntake
    role: authoritative
    columns:
    - {name: intake_ref, type: VARCHAR(64), constraints: [PK, NOT_NULL]}
    - {name: account_id, type: VARCHAR(96), constraints: [NOT_NULL]}
    - {name: suspension_auth_epoch, type: BIGINT, constraints: [NOT_NULL]}
    - {name: status, type: VARCHAR(16), constraints: [NOT_NULL], default: "'submitted'"}
    - {name: submitted_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: claimed_case_id, type: VARCHAR(128), constraints: [NULLABLE]}
    - {name: claimed_at, type: TIMESTAMPTZ, constraints: [NULLABLE]}
    - {name: delete_after, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: version, type: BIGINT, constraints: [NOT_NULL], default: "'1'"}
    - {name: submission_idempotency_key, type: VARCHAR(160), constraints: [NOT_NULL, UNIQUE]}
    - {name: submission_digest, type: CHAR(64), constraints: [NOT_NULL]}
    - {name: claim_idempotency_key, type: VARCHAR(160), constraints: [NULLABLE, UNIQUE]}
    - {name: claim_digest, type: CHAR(64), constraints: [NULLABLE]}
    indexes:
    - {name: uq_account_appeal_intakes_account_epoch, columns: [account_id, suspension_auth_epoch], unique: true}
    - {name: idx_account_appeal_intakes_delete_after, columns: [delete_after]}
    - {name: idx_account_appeal_intakes_claimed_case, columns: [claimed_case_id]}
