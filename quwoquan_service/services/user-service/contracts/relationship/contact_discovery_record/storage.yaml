backend: postgres
tables:
  contact_discovery_records:
    publication_role: not_published
    entity: ContactDiscoveryRecord
    pk:
    - id
    foreign_keys:
    - columns:
      - owner_account_id
      references: user_profiles(user_id)
      on_delete: CASCADE
    columns:
    - name: id
      type: VARCHAR(64)
      constraints:
      - PK
    - name: owner_account_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: hashed_phones
      type: TEXT[]
      constraints:
      - NOT_NULL
    - name: matched_persona_ids
      type: TEXT[]
    - name: status
      type: VARCHAR(16)
      constraints:
      - NOT_NULL
      default: '''pending'''
    - name: match_count
      type: INTEGER
      constraints:
      - NOT_NULL
      default: 0
    - name: expire_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: completed_at
      type: TIMESTAMPTZ
    indexes:
    - name: idx_contact_discovery_owner
      columns:
      - owner_account_id
    - name: idx_contact_discovery_expire
      columns:
      - expire_at
    - name: idx_contact_discovery_status
      columns:
      - status
  contact_discovery_command_receipts:
    publication_role: not_published
    entity: ContactDiscoveryCommandReceipt
    role: idempotency_receipt
    description: ContactDiscoveryRecord 命令首次成功结果；同 owner/operation/key 只允许一个 command digest，重放返回同一 aggregate/result。
    pk:
    - receipt_id
    foreign_keys:
    - columns: [aggregate_id]
      references: contact_discovery_records(id)
      on_delete: CASCADE
    columns:
    - {name: receipt_id, type: VARCHAR(80), constraints: [PK, NOT_NULL]}
    - {name: owner_account_id, type: VARCHAR(96), constraints: [NOT_NULL]}
    - {name: operation, type: VARCHAR(64), constraints: [NOT_NULL]}
    - {name: idempotency_key, type: VARCHAR(256), constraints: [NOT_NULL]}
    - {name: command_digest, type: CHAR(64), constraints: [NOT_NULL]}
    - {name: aggregate_id, type: VARCHAR(64), constraints: [NOT_NULL]}
    - {name: result_status, type: VARCHAR(16), constraints: [NOT_NULL]}
    - {name: result_json, type: JSONB, constraints: [NOT_NULL]}
    - {name: result_error, type: VARCHAR(32), constraints: [NOT_NULL], default: "''"}
    - {name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW()}
    unique_constraints:
    - name: uq_contact_discovery_command_receipt
      columns: [owner_account_id, operation, idempotency_key]
    indexes:
    - name: idx_contact_discovery_command_receipt_aggregate
      columns: [aggregate_id]
role: authoritative
codegen:
  enabled: true
  package: user
  root_entity: ContactDiscoveryRecord
  name_overrides:
    ContactDiscoveryRecord: ContactDiscovery
  migration_skip_tables:
  - contact_discovery_records
  - contact_discovery_command_receipts
