events:
- name: ContactDiscoveryInitiated
  description: '用户触发通讯录发现

    非 canonical 结构字段迁移注记：security_note="payload 不含 hashedPhones"。'
  delivery_semantics: best_effort_ephemeral
  payload_entity: ContactDiscoveryRecord
  payload_fields:
  - id
  - ownerAccountId
  - createdAt
  no_consumer_reason: The best-effort user event has no durable service consumer; ContactDiscoveryRecord remains queryable
    from its authoritative store.
- name: ContactDiscoveryCompleted
  description: '通讯录匹配完成

    非 canonical 结构字段迁移注记：security_note="payload 不含 matchedPersonaIds（端侧通过 API 拉取）"。'
  delivery_semantics: best_effort_ephemeral
  payload_entity: ContactDiscoveryRecord
  payload_fields:
  - id
  - ownerAccountId
  - matchCount
  - completedAt
  no_consumer_reason: The best-effort user event has no durable service consumer; clients fetch the privacy-filtered result
    through the named reader.
