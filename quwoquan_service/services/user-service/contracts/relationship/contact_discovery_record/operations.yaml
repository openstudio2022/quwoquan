description: 通讯录发现——哈希匹配已注册用户，结果只暴露 personaId
api_routes:
  - method: POST
    path: /owner/contact-discovery
    operation: InitiateContactDiscovery
    actor: account
    application:
      kind: command
      facet: ContactDiscoveryCommandFacade
      method: initiateContactDiscovery
      aggregate_owner: ContactDiscoveryRecord
      mutation_target: ContactDiscoveryRecord
      invariant_target: ContactDiscoveryRecord
    description: 上传哈希手机号列表，触发异步匹配
    response_fields:
      - id
      - status
      - expireAt
    response_entity: ContactDiscoveryResult
    response_body: ContactDiscoveryResult
    response_body_kind: object
    rate_limit: 5次/24h/ownerAccountId
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.invalid_argument
      - USER.CONTACT.rate_limited
      - USER.CONTACT.too_many_contacts
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: SENSITIVE
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_contact_discovery_command
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
    request_entity: InitiateContactDiscoveryCommand
    request_body_kind: object
  - method: GET
    path: /owner/contact-discovery/latest
    operation: GetLatestContactDiscovery
    actor: account
    application:
      kind: query
      facet: ContactDiscoveryQueryFacade
      method: getLatestContactDiscovery
      reader: GetLatestContactDiscoveryReader
      slice: GetLatestContactDiscoverySlice
    description: '获取最近一次发现结果。matchedPersonaIds 保留为隐私基线（仅 ID）； matches[] 为富化投影 ContactDiscoveryMatchResult，回显发起者上传的 hashedPhone（端侧据此映射回本地通讯录显示名）、 精简 profile 与关系能力位，驱动「添加 / 已添加」。

'
    response_entity: ContactDiscoveryResult
    response_read_models:
      - ContactDiscoveryMatchResult
    response_fields:
      - id
      - status
      - matchedPersonaIds
      - matchCount
      - expireAt
      - completedAt
    response_body: ContactDiscoveryResult
    response_body_kind: object
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.CONTACT.not_found
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: PUBLIC
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_contact_discovery_query
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
    request_entity: GetLatestContactDiscoveryQuery
    request_body_kind: none
  - method: DELETE
    path: /owner/contact-discovery/{id}
    operation: DismissContactDiscovery
    request_bindings:
      path:
        - name: id
          field: id
    actor: account
    application:
      kind: command
      facet: ContactDiscoveryCommandFacade
      method: dismissContactDiscovery
      aggregate_owner: ContactDiscoveryRecord
      mutation_target: ContactDiscoveryRecord
      invariant_target: ContactDiscoveryRecord
    description: 主动删除/忽略发现记录
    response_fields:
      - status
    response_entity: ContactDiscoveryDismissResult
    response_body: ContactDiscoveryDismissResult
    response_body_kind: object
    authorization:
      principal: account
      ownership_policy: current_account_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.unauthorized
      - USER.CONTACT.not_found
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_contact_discovery_command
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
    request_entity: DismissContactDiscoveryCommand
    request_body_kind: none
consumers:
  - name: app
    capabilities:
      - initiate_discovery
      - read_discovery_result
      - dismiss_discovery
