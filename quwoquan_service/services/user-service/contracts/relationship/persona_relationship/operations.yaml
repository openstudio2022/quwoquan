      response_type: FollowCommandResult
      response_decoder: decodeFollowCommandResult
    authorization:
      principal: persona
      ownership_policy: actor_self
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.invalid_argument
      - USER.RELATIONSHIP.follow_blocked
      - USER.RELATIONSHIP.target_not_found
      - USER.RELATIONSHIP.actor_forbidden
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
      - USER.RELATIONSHIP.invalid_pair
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_persona_relationship_command
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
        - idempotent_replay
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
