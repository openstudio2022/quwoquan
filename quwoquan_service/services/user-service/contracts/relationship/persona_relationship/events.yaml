  - occurredAt
- name: PersonaUnblocked
  delivery_semantics: transactional_outbox
  payload_entity: PersonaRelationship
  payload_fields:
  - eventId
  - pairId
  - sourcePersonaId
  - targetPersonaId
  - version
  - occurredAt
