  delivery_semantics: transactional_outbox
  payload_entity: PersonaRelationship
  payload_fields:
  - eventId
  - pairId
  - sourcePersonaId
  - targetPersonaId
  - following
  - version
  - occurredAt
- name: PersonaBlocked
  delivery_semantics: transactional_outbox
