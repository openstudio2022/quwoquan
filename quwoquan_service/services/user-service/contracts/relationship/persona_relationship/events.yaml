description: payload实体严格匹配OutboxPayload；eventId/eventName在durable envelope，relay展平不改变payload ownership。
events:
- name: PersonaFollowStateChanged
  delivery_semantics: transactional_outbox
  wire_event_type: PersonaFollowStateChanged
  payload_entity: PersonaRelationshipEventPayload
  payload_shape: exact
  payload_fields: [pairId, sourcePersonaId, targetPersonaId, following, sourceFollowCleared, targetFollowCleared, clearedFollowDirections, version, occurredAt]
- name: PersonaBlocked
  delivery_semantics: transactional_outbox
  wire_event_type: PersonaBlocked
  payload_entity: PersonaRelationshipEventPayload
  payload_shape: exact
  payload_fields: [pairId, sourcePersonaId, targetPersonaId, following, sourceFollowCleared, targetFollowCleared, clearedFollowDirections, version, occurredAt]
- name: PersonaUnblocked
  delivery_semantics: transactional_outbox
  wire_event_type: PersonaUnblocked
  payload_entity: PersonaRelationshipEventPayload
  payload_shape: exact
  payload_fields: [pairId, sourcePersonaId, targetPersonaId, following, sourceFollowCleared, targetFollowCleared, clearedFollowDirections, version, occurredAt]
