fields:
  - name: pairId
    source: pairId
    type: string
    constraints:
      - PK
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: lowerPersonaId 与 upperPersonaId 的 canonical digest
    role: authoritative_state
  - name: version
    source: version
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: lowerPersonaId
    source: lowerPersonaId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 规范化后字典序较小的 persona ID
    role: authoritative_state
    reference: true
  - name: upperPersonaId
    source: upperPersonaId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 规范化后字典序较大的 persona ID
    role: authoritative_state
    reference: true
  - name: directions
    source: directions
    type: '[]RelationshipDirection'
    constraints:
      - NOT_NULL
      - MAX_2
    classification: PRIVATE
    log_policy: metadata_only
    api_exposure: drop
    ops_exposure: read
    role: owned_value
  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
