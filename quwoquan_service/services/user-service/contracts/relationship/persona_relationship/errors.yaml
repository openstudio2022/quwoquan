domain: USER
entity: PersonaRelationship
errors:
- code: USER.RELATIONSHIP.follow_blocked
  kind: RELATIONSHIP
  reason: follow_blocked
  http_status: 403
  recovery_action: surface
  go_const: ErrRelationshipFollowBlocked
  dart_const: relationshipFollowBlocked
  l10n_key: error_relationship_follow_blocked
  user_message:
    zh: 当前关系不可关注
    en: You cannot follow this user
  debug_hint: persona relationship pair contains a block direction
- code: USER.RELATIONSHIP.invalid_pair
  kind: RELATIONSHIP
  reason: invalid_pair
  http_status: 400
  recovery_action: surface
  go_const: ErrRelationshipInvalidPair
  dart_const: relationshipInvalidPair
  l10n_key: error_relationship_invalid_pair
  user_message:
    zh: 关系主体无效
    en: Invalid relationship subject
  debug_hint: source/target persona id missing, identical, or malformed pair
- code: USER.RELATIONSHIP.target_not_found
  kind: RELATIONSHIP
  reason: not_found
  http_status: 404
  recovery_action: surface
  go_const: ErrRelationshipTargetNotFound
  dart_const: relationshipTargetNotFound
  l10n_key: error_relationship_target_not_found
  user_message:
    zh: 该用户不存在或不可关注
    en: This user does not exist or cannot be followed
  debug_hint: target persona missing, retired, or strictly isolated（404 masks existence）
- code: USER.RELATIONSHIP.actor_forbidden
  kind: RELATIONSHIP
  reason: actor_forbidden
  http_status: 403
  recovery_action: surface
  go_const: ErrRelationshipActorForbidden
  dart_const: relationshipActorForbidden
  l10n_key: error_relationship_actor_forbidden
  user_message:
    zh: 当前身份无法执行该操作
    en: This identity cannot perform the action
  debug_hint: explicit actorSubAccountId does not belong to the authenticated account or is retired
