backend: postgres
tables:
  persona_relationships:
    publication_role: not_published
    entity: PersonaRelationship
    role: authoritative
    pk:
    - pair_id
    columns:
    - name: pair_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: lower_persona_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: upper_persona_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: version
      type: BIGINT
      constraints:
      - NOT_NULL
      default: 1
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    indexes:
    - name: uq_persona_relationship_pair
      columns:
      - lower_persona_id
      - upper_persona_id
      unique: true
  persona_relationship_directions:
    publication_role: not_published
    entity: RelationshipDirection
    role: owned
    pk:
    - pair_id
    foreign_keys:
    - columns:
      - pair_id
      references: persona_relationships(pair_id)
      on_delete: CASCADE
    columns:
    - name: pair_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: source_persona_id
      type: VARCHAR(96)
      constraints:
      - PK
      - NOT_NULL
    - name: target_persona_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: following
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: false
    - name: blocked
      type: BOOLEAN
      constraints:
      - NOT_NULL
      default: false
    - name: follow_source
      type: VARCHAR(64)
      constraints:
      - NULLABLE
    - name: followed_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    - name: blocked_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    indexes:
    - name: uq_persona_relationship_direction
      columns:
      - pair_id
      - source_persona_id
      unique: true
    - name: idx_persona_relationship_following
      columns:
      - source_persona_id
      - following
      - followed_at DESC
    - name: idx_persona_relationship_followers
      columns:
      - target_persona_id
      - following
      - followed_at DESC
    - name: idx_persona_relationship_blocked
      columns:
      - source_persona_id
      - blocked
      - blocked_at DESC
  persona_relationship_command_receipts:
    publication_role: not_published
    role: authoritative
    pk:
    - receipt_id
    columns:
    - name: receipt_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: actor_persona_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: idempotency_key
      type: VARCHAR(160)
      constraints:
      - NOT_NULL
    - name: operation
      type: VARCHAR(32)
      constraints:
      - NOT_NULL
    - name: target_persona_id
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: pair_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: aggregate_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: response_json
      type: JSONB
      constraints:
      - NOT_NULL
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    indexes:
    - name: uq_persona_relationship_command_receipt
      columns:
      - actor_persona_id
      - idempotency_key
      unique: true
  persona_relationship_statistics_inbox:
    publication_role: publication_accessory
    role: owned
    description: PersonaRelationship 统计消费者按 eventId 去重并保存 payload digest；同版本异摘要拒绝。
  persona_relationship_statistics_members:
    publication_role: publication_accessory
    role: owned
    description: 每个 pair/persona/follower-or-following 成员的 lastAppliedVersion 与 currentContribution；正常事件只更新成员及一个固定桶。
  persona_relationship_statistics_buckets:
    publication_role: publication_accessory
    role: owned
    description: 64 个稳定桶内的当前贡献合计；live 为当前增量代际，repair 代际只在对账通过后替换 live。
  persona_relationship_statistics_rollups:
    publication_role: publication_accessory
    role: owned
    description: immutable generation 的 persona follower/following 汇总、statsVersion、source checkpoint 与绝对来源期限。
  persona_relationship_statistics_reader_generation:
    publication_role: publication_accessory
    role: owned
    description: 当前唯一 reader generation；旧代际不得覆盖新代际。
  persona_relationship_outbox:
    publication_role: transactional_outbox
    role: append_only
    pk:
    - event_id
    columns:
    - name: event_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: aggregate_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: aggregate_version
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: event_name
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: payload_json
      type: JSONB
      constraints:
      - NOT_NULL
    - name: occurred_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: partition_id
      type: SMALLINT
      constraints:
      - NOT_NULL
    - name: partition_sequence
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: counter_projected_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    - name: published_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    indexes:
    - name: uq_persona_relationship_outbox_version
      columns:
      - aggregate_id
      - aggregate_version
      unique: true
    - name: uq_persona_relationship_outbox_partition_sequence
      columns:
      - partition_id
      - partition_sequence
      unique: true
    - name: idx_persona_relationship_outbox_partition_pending
      columns:
      - partition_id
      - partition_sequence
      condition: published_at IS NULL
  persona_relationship_outbox_sequences:
    publication_role: publication_accessory
    entity: PersonaRelationship
    role: authoritative
    description: 32 个固定分区各自的 transport sequence 分配器；正常写入不更新全局单行。
    pk: [partition_id]
    columns:
    - {name: partition_id, type: SMALLINT, constraints: [PK, NOT_NULL]}
    - {name: sequence, type: BIGINT, constraints: [NOT_NULL], default: 0}
  persona_relationship_outbox_checkpoints:
    publication_role: publication_accessory
    entity: PersonaRelationship
    role: authoritative
    description: 每 consumer、每固定分区的连续 applied checkpoint 与 leaseEpoch fencing。
    pk: [consumer, partition_id]
    columns:
    - {name: consumer, type: VARCHAR(160), constraints: [PK, NOT_NULL]}
    - {name: partition_id, type: SMALLINT, constraints: [PK, NOT_NULL]}
    - {name: sequence, type: BIGINT, constraints: [NOT_NULL], default: 0}
    - {name: lease_epoch, type: BIGINT, constraints: [NOT_NULL], default: 0}
    - {name: lease_owner, type: VARCHAR(160), constraints: [NULLABLE]}
    - {name: lease_until, type: TIMESTAMPTZ, constraints: [NULLABLE]}
    - {name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW()}
    indexes:
    - name: idx_persona_relationship_outbox_checkpoint_claim
      columns: [consumer, lease_until, partition_id]
streams:
  events.user.persona_relationship:
    publication_role: publication_accessory
    entity: PersonaRelationship
    role: append_only
    idempotency_key: eventId
    retention_seconds: 604800
    description: PersonaRelationship outbox 的唯一 durable transport；eventId 稳定去重，pairId 为 partitionKey，并携带 partitionId/partitionSequence；消费方不得回读 User 存储。
role: authoritative
codegen:
  enabled: true
  package: persona_relationship
  domain_path: relationship/persona_relationship
  events_only: true
