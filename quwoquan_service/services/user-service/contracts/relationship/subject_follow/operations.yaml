api_routes:
  - method: POST
    path: /relationships/subjects/{subjectType}/{subjectId}/follow
    operation: FollowSubject
    request_bindings:
      path:
        - name: subjectType
          field: subjectType
        - name: subjectId
          field: subjectId
    actor: persona
    application:
      kind: command
      facet: SubjectFollowCommandFacade
      method: follow
      aggregate_owner: SubjectFollow
      mutation_target: SubjectFollow
      invariant_target: SubjectFollow
    description: 关注非 persona 主体（主页/圈子/地点）；set 语义由服务端内部 CAS 与幂等 receipt 保证重放安全
    request_entity: FollowSubjectCommand
    response_entity: SubjectFollowCommandResult
    response_fields:
      - personaId
      - subjectType
      - subjectId
      - state
      - idempotentReplay
      - updatedAt
    client_contract:
      dart_import: ../user/subject_follow_contracts.dart
      response_type: SubjectFollowCommandResult
      response_decoder: decodeSubjectFollowCommandResult
    authorization:
      principal: persona
      ownership_policy: actor_self
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.unauthorized
      - USER.SUBJECT_FOLLOW.invalid_subject_type
      - USER.USER.invalid_argument
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_subject_follow_command
      trace: true
      attributes:
        - operation
        - subject_type
        - outcome
        - error_code
        - idempotent_replay
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: DELETE
    path: /relationships/subjects/{subjectType}/{subjectId}/follow
    operation: UnfollowSubject
    request_bindings:
      path:
        - name: subjectType
          field: subjectType
        - name: subjectId
          field: subjectId
    actor: persona
    application:
      kind: command
      facet: SubjectFollowCommandFacade
      method: unfollow
      aggregate_owner: SubjectFollow
      mutation_target: SubjectFollow
      invariant_target: SubjectFollow
    description: 取消关注非 persona 主体；unset 语义天然幂等
    response_entity: SubjectFollowCommandResult
    response_fields:
      - personaId
      - subjectType
      - subjectId
      - state
      - idempotentReplay
      - updatedAt
    client_contract:
      dart_import: ../user/subject_follow_contracts.dart
      response_type: SubjectFollowCommandResult
      response_decoder: decodeSubjectFollowCommandResult
    authorization:
      principal: persona
      ownership_policy: actor_self
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.unauthorized
      - USER.SUBJECT_FOLLOW.invalid_subject_type
      - USER.USER.invalid_argument
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_subject_follow_command
      trace: true
      attributes:
        - operation
        - subject_type
        - outcome
        - error_code
        - idempotent_replay
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: UnfollowSubjectCommand
    request_body_kind: none
consumers:
  - name: app
    capabilities:
      - follow_subject
      - unfollow_subject
contract_test:
  mock_strategy:
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        postgres: embedded-postgres
      spy_targets:
        - event_publisher
      data_management:
        seed: fixture 工厂预制到真实 PostgreSQL
        cleanup: TRUNCATE subject_follows, subject_follow_command_receipts, subject_follow_outbox CASCADE
      scenarios:
        - name: follow_subject_idempotent
          command: FollowSubject x2 (same persona + subject)
          assertions:
            - subject_follows 唯一约束下 exactly 1 行且 state=following
            - 第二次调用 idempotentReplay=true 且不追加 outbox
        - name: unfollow_after_follow
          command: FollowSubject -> UnfollowSubject
          assertions:
            - state=unfollowed 且 version 单调递增
            - eventSpy.AssertPublished('SubjectFollowStateChanged', {state:'unfollowed'})
        - name: reject_persona_subject_type
          command: FollowSubject (subjectType=persona)
          assertions:
            - 返回 USER.SUBJECT_FOLLOW.invalid_subject_type
