backend: postgres
tables:
  subject_follows:
    role: authoritative
    primary_key: id
    unique_constraints:
    - - persona_id
      - subject_type
      - subject_id
  subject_follow_command_receipts:
    role: authoritative
    unique_constraints:
    - - persona_id
      - idempotency_key
  subject_follow_outbox:
    role: append_only
    unique_constraints:
    - - aggregate_id
      - aggregate_version
role: authoritative
