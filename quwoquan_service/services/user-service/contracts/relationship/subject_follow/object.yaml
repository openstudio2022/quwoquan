kind: aggregate_root
description: Persona 对非 Persona 主体的版本化关注关系。
identity:
  fields:
  - id
  version_field: version
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: persona
  on_delete: cascade
  reference_fields:
  - personaId
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: subject
  on_delete: tombstone
  reference_fields:
  - subjectType
  - subjectId
  target_objects:
  - entity.Homepage
  - circle.Circle
  - integration.Location
business_rules:
- subjectType 不得为 persona，persona 间关系只能写 PersonaRelationship
- personaId + subjectType + subjectId 全局唯一
- follow/unfollow 为关系 set/unset，由服务端内部 CAS 与 idempotency receipt 保证重放安全
lifecycle:
  state_field: state
  states:
  - following
  - unfollowed
  optimistic_concurrency: version
  idempotency: command_receipt
