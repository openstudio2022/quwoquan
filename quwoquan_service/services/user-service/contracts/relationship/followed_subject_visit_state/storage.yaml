backend: mongodb
collections:
  followed_subject_visit_states:
    entity: FollowedSubjectVisitState
    indexes:
    - name: uq_visit_identity
      keys:
        personaId: 1
        subjectType: 1
        subjectId: 1
      unique: true
    - name: idx_visit_persona_updated
      keys:
        personaId: 1
        updatedAt: -1
role: authoritative
