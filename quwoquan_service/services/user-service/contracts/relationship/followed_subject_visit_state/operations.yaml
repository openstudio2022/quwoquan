description: FollowedSubjectVisitState 私有水位命令操作包。
api_routes:
  - method: POST
    path: /user/followed-subjects/{subjectType}/{subjectId}:mark-visited
    operation: MarkFollowedSubjectVisited
    request_bindings:
      path:
        - name: subjectType
          field: subjectType
        - name: subjectId
          field: subjectId
    actor: persona
    application:
      kind: command
      facet: FollowedSubjectVisitCommandFacade
      method: markFollowedSubjectVisited
      aggregate_owner: FollowedSubjectVisitState
      mutation_target: FollowedSubjectVisitState
      invariant_target: FollowedSubjectVisitState
    description: 标记关注对象已访问，清除“上次访问后变化”提示；lastVisitedAt 单调推进，重复 clientRequestId 返回同一 receipt
    request_entity: MarkFollowedSubjectVisitedCommand
    response_entity: FollowedSubjectVisitResult
    response_fields:
      - subjectId
      - subjectType
      - lastVisitedAt
      - hasUnreadChanges
    response_body: FollowedSubjectVisitResult
    response_body_kind: object
    authorization:
      principal: persona
      ownership_policy: self
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.invalid_argument
      - USER.SYSTEM.internal_error
      - USER.AUTH.account_deleted
      - USER.AUTH.account_security_unavailable
      - USER.AUTH.account_suspended
      - USER.AUTH.token_stale
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_followed_subject_visit_command
      trace: true
      attributes:
        - operation
        - subject_type
        - outcome
        - error_code
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
consumers:
  - name: app
    capabilities:
      - mark_following_subject_visited
readiness_cases:
  - case_id: mark-followed-subject-visited-local
    spec_ref: specs/feature-tree/user-identity-profile-relationship/persona-follow-graph/spec.md#sit-001
    producer: service
    layer: local_contract
    target: {kind: operation, id: MarkFollowedSubjectVisited}
    runner_source_path: quwoquan_service/services/user-service/tests/local_contract/relationship/followed_subject_visit_state/model__contract__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
