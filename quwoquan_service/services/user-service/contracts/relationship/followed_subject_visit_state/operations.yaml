description: FollowedSubjectVisitState 私有水位命令操作包。
api_routes:
- method: POST
  path: /user/followed-subjects/{subjectType}/{subjectId}:mark-visited
  operation: MarkFollowedSubjectVisited
  actor: persona
  application:
    kind: command
    facet: FollowedSubjectVisitCommandFacade
    method: markFollowedSubjectVisited
    aggregate_owner: FollowedSubjectVisitState
    mutation_target: FollowedSubjectVisitState
    invariant_target: FollowedSubjectVisitState
  description: 标记关注对象已访问，清除“上次访问后变化”提示；lastVisitedAt 单调推进，重复 clientRequestId 返回同一 receipt
  path_params:
  - subjectType
  - subjectId
  request_entity: MarkFollowedSubjectVisitedRequest
  request_fields:
  - subjectId
  - subjectType
  - visitedAt
  - clientRequestId
  response_entity: FollowedSubjectVisitResult
  response_fields:
  - subjectId
  - subjectType
  - lastVisitedAt
  - hasUnreadChanges
  client_contract:
    dart_import: ../user/following_subject_contracts.dart
    request_type: MarkFollowedSubjectVisitedCommand
    response_type: FollowedSubjectVisitResult
    request_encoder: encodeMarkFollowedSubjectVisitedCommand
    response_decoder: decodeFollowedSubjectVisitResult
  authorization:
    principal: persona
    ownership_policy: self
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - USER.USER.unauthorized
  - USER.USER.invalid_argument
  - USER.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: user_followed_subject_visit_command
    trace: true
    attributes:
    - operation
    - subject_type
    - outcome
    - error_code
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  commercial:
    status: ready
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
consumers:
- name: app
  capabilities:
  - mark_following_subject_visited
