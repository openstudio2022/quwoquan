description: 当前 viewer 对关注对象的访问水位
fields:
  - name: personaId
    source: personaId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: subjectType
    source: subjectType
    type: enum
    enum_ref: FollowSubjectKind
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: subjectId
    source: subjectId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: lastVisitedAt
    source: lastVisitedAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
types:
  MarkFollowedSubjectVisitedRequest:
    description: 推进访问水位的业务命令 payload
    fields:
      - name: subjectId
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
      - name: subjectType
        type: enum
        enum_ref: FollowSubjectKind
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
      - name: visitedAt
        type: timestamp
        constraints:
          - NULLABLE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
      - name: clientRequestId
        type: string
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: hash
        api_exposure: read_write
        ops_exposure: read
  FollowedSubjectVisitResult:
    description: 访问水位提交后的版本化结果
    fields:
      - name: subjectId
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: subjectType
        type: enum
        enum_ref: FollowSubjectKind
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: lastVisitedAt
        type: timestamp
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: hasUnreadChanges
        type: bool
        constraints:
          - NOT_NULL
          - DEFAULT_FALSE
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  MarkFollowedSubjectVisitedCommand:
    fields:
      - name: subjectId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: subjectType
        type: FollowSubjectKind
        enum_ref: FollowSubjectKind
        client_dart_type: FollowSubjectKind
        client_wire: canonicalEnum
      - name: visitedAt
        type: timestamp
        client_dart_type: DateTime
      - name: clientRequestId
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
        client_omit_empty: true
