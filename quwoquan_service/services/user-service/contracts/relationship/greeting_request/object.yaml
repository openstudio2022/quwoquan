kind: aggregate_root
description: '打招呼请求对象（请求箱容器）。

  用户向陌生/关注用户发送的接触请求，在对方回复前独立于正式会话容器存在，

  不污染主聊天列表。回复后自动升级为正式 Conversation。

  '
identity:
  fields:
  - id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: promotedConversation
  on_delete: detach
  reference_fields:
  - promotedConversationId
  target_object: chat.Conversation
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: requesterPersona
  on_delete: retain
  reference_fields:
  - requesterPersonaId
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: targetPersona
  on_delete: retain
  reference_fields:
  - targetPersonaId
  target_object: user.Persona
search_policy:
  exposed: none
  not_exposed_reason: "仅所属用户可见的私有状态，进入任何共享索引即构成越权披露。"
assistant_access:
  read:
    mode: owner_scoped
    scopes:
    - assistant.user.greeting_request.read
  cite:
    mode: none
    scopes: []
  write:
    mode: proposal_only
    scopes:
    - assistant.user.greeting_request.write
    requires_user_consent: true
    consent_scope_ref: assistant.user.greeting_request.write
business_rules:
- sender persona、recipient persona 与首条消息创建后不可变
- 同一 persona pair 只能存在一个 pending request
- sender 不能向自己或已 block 的 persona 发起请求
- accept 只能执行一次并通过 Chat Command Facade 创建正式 Conversation
- reject 或 expire 后不得恢复原 request
lifecycle:
  state_field: status
  states:
  - pending
  - replied
  - ignored
  - blocked
  - expired
  - cancelled
  optimistic_concurrency: version
  idempotency: command_receipt
