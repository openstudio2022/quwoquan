fields:
  - name: id
    source: id
    type: string
    constraints:
      - PK
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: requesterPersonaId
    source: requesterPersonaId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 发起方Persona ID
    role: authoritative_state
    reference: true
  - name: targetPersonaId
    source: targetPersonaId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 接收方Persona ID
    role: authoritative_state
    reference: true
  - name: requestMessage
    source: requestMessage
    type: string
    constraints:
      - NULLABLE
    classification: SENSITIVE
    log_policy: mask
    api_exposure: read_write
    ops_exposure: mask
    description: 打招呼自定义内容，最长 200 字
    role: authoritative_state
  - name: intersectionRef
    source: intersectionRef
    type: jsonb
    constraints:
      - NULLABLE
    classification: SENSITIVE
    log_policy: mask
    api_exposure: read
    ops_exposure: mask
    description: 发起方提交的强类型交集意图引用；不得直接作为可见依据使用
    role: authoritative_state
  - name: intersectionSnapshot
    source: intersectionSnapshot
    type: jsonb
    constraints:
      - NULLABLE
    classification: SENSITIVE
    log_policy: mask
    api_exposure: read
    ops_exposure: mask
    description: 服务端按当前双方重解析后写入的不可变交集依据；引用失效时为空
    role: authoritative_state
  - name: status
    source: status
    type: enum
    enum_ref: GreetingRequestStatus
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 'pending    - 等待回复（进入接收方请求箱，不进入聊天列表）

      replied    - 对方已回复，自动升级为正式 Conversation

      ignored    - 接收方主动忽略

      blocked    - 接收方已拉黑发起方（静默，发起方不可见被拉黑事实）

      cancelled  - 发起方撤回

      expired    - 超期未处理（expireAt 触发）

'
    role: authoritative_state
  - name: source
    source: source
    type: enum
    enum_ref: GreetingRequestSource
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: profile/recommendation/group_member/invite（请求来源，用于漏斗分析）
    role: authoritative_state
  - name: promotedConversationId
    source: promotedConversationId
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 升级后的正式会话 ID（status=replied 时写入）
    role: authoritative_state
    reference: true
  - name: expireAt
    source: expireAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 请求过期时间（默认 30 天）
    role: authoritative_state
  - name: decisionAt
    source: decisionAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 接收方作出决策的时间（replied/ignored/blocked）
    role: authoritative_state
  - name: createdAt
    source: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
unique_constraints:
  - columns:
      - requesterPersonaId
      - targetPersonaId
      - status
    where: status = 'pending'
    description: 同一发起方对同一接收方，同时只能有一条 pending 请求（频控幂等）
types:
  GreetingRequestSentPayload:
    description: 打招呼已提交事件；接收账号在 User producer 事务前经 Persona owner reader 解析并固化。
    fields:
      - {name: id, type: string, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: requesterPersonaId, type: string, constraints: [NOT_BLANK], classification: PII, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: targetPersonaId, type: string, constraints: [NOT_BLANK], classification: PII, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: recipientAccountId, type: string, constraints: [NOT_BLANK], classification: PRIVATE, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: source, type: enum, enum_ref: GreetingRequestSource, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: expireAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: targetAllowsStrangerGreeting, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
  GreetingIntersectionRef:
    description: 客户端可提交的最小交集引用；不包含标题、结论、URL 或标签
    fields:
      - name: intersectionId
        type: string
        constraints:
          - NOT_BLANK
      - name: evidenceId
        type: string
        constraints:
          - NOT_BLANK
      - name: sourceRef
        type: string
        constraints:
          - NOT_BLANK
      - name: objectTypeRef
        type: string
        constraints:
          - NOT_BLANK
      - name: objectId
        type: string
        constraints:
          - NOT_BLANK
  GreetingRequestRecord:
    fields:
      - {name: id, type: string, constraints: [NOT_BLANK]}
      - {name: requesterPersonaId, type: string, constraints: [NOT_BLANK]}
      - {name: targetPersonaId, type: string, constraints: [NOT_BLANK]}
      - {name: requestMessage, type: string, constraints: [NULLABLE]}
      - {name: intersectionRef, type: GreetingIntersectionRef, constraints: [NULLABLE]}
      - {name: intersectionSnapshot, type: GreetingIntersectionSnapshot, constraints: [NULLABLE]}
      - {name: status, type: enum, enum_ref: GreetingRequestStatus, constraints: [NOT_NULL]}
      - {name: source, type: enum, enum_ref: GreetingRequestSource, constraints: [NOT_NULL]}
      - {name: promotedConversationId, type: string, constraints: [NULLABLE]}
      - {name: expireAt, type: timestamp, constraints: [NULLABLE]}
      - {name: decisionAt, type: timestamp, constraints: [NULLABLE]}
      - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  GreetingRequestSlice:
    fields:
      - {name: items, type: '[]GreetingRequestRecord', constraints: [NOT_NULL]}
      - {name: nextCursor, type: string, constraints: [NULLABLE]}
  ListGreetingRequestsQuery:
    fields:
      - name: status
        type: string
        client_dart_type: String
        client_default: '''pending'''
        client_omit_empty: true
      - name: cursor
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_omit_empty: true
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
  ReplyGreetingCommand:
    fields:
      - name: requestId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  IgnoreGreetingCommand:
    fields:
      - name: requestId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  SendGreetingCommand:
    fields:
      - name: targetPersonaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: requestMessage
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
        client_omit_empty: true
      - name: source
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_default: '''profile'''
        client_normalization: trim
      - name: intersectionRef
        type: GreetingIntersectionRef
        constraints:
          - NULLABLE
  CancelGreetingCommand:
    fields:
      - name: requestId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
