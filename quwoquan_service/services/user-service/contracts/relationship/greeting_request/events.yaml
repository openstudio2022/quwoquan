events:
- name: GreetingRequestSent
  description: '用户发送打招呼请求

    非 canonical 结构字段迁移注记：side_effects=[{"target":"notification-service","action":"push_greeting_received","condition":"targetUser.allowStrangerGreeting
    == true"}]。'
  delivery_semantics: transactional_outbox
  payload_entity: GreetingRequest
  payload_fields:
  - id
  - requesterPersonaId
  - targetPersonaId
  - source
  - expireAt
- name: GreetingRequestReplied
  description: '接收方回复打招呼；user-service 必须创建或复用正式 1v1 会话并写入 promotedConversationId 后再发布事件

    非 canonical 结构字段迁移注记：side_effects=[{"target":"chat-service","action":"sync_conversation_projection","note":"chat-service
    消费事件用于同步会话投影，不能把创建正式会话延后到事件异步阶段"}]。'
  delivery_semantics: transactional_outbox
  payload_entity: GreetingRequest
  payload_fields:
  - id
  - requesterPersonaId
  - targetPersonaId
  - promotedConversationId
- name: GreetingRequestIgnored
  description: 接收方忽略打招呼
  delivery_semantics: transactional_outbox
  payload_entity: GreetingRequest
  payload_fields:
  - id
  - requesterPersonaId
  - targetPersonaId
  - decisionAt
- name: GreetingRequestCancelled
  description: 发起方撤回打招呼
  delivery_semantics: transactional_outbox
  payload_entity: GreetingRequest
  payload_fields:
  - id
  - requesterPersonaId
  - targetPersonaId
