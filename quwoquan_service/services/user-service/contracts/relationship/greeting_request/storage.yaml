backend: postgresql
tables:
  greeting_requests:
    entity: GreetingRequest
    columns:
    - name: id
      type: UUID
      constraints:
      - PK
      - NOT_NULL
      - DEFAULT_GEN_RANDOM_UUID
    - name: requester_sub_account_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: target_sub_account_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: request_message
      type: TEXT
      constraints:
      - NULLABLE
    - name: status
      type: VARCHAR(20)
      constraints:
      - NOT_NULL
      - DEFAULT_'pending'
    - name: source
      type: VARCHAR(30)
      constraints:
      - NOT_NULL
    - name: promoted_conversation_id
      type: VARCHAR(64)
      constraints:
      - NULLABLE
    - name: expire_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    - name: decision_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      - DEFAULT_NOW
    - name: updated_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      - DEFAULT_NOW
    indexes:
    - name: idx_gr_inbox
      columns:
      - target_sub_account_id
      - status
      - created_at DESC
    - name: idx_gr_outbox
      columns:
      - requester_sub_account_id
      - status
      - created_at DESC
    - name: idx_gr_unique_pending
      columns:
      - requester_sub_account_id
      - target_sub_account_id
      condition: status = 'pending'
      unique: true
    - name: idx_gr_expire
      columns:
      - expire_at
      condition: status = 'pending'
      description: 惰性过期判断扫描索引
  greeting_request_command_receipts:
    description: 与 greeting_requests state 和 outbox 同事务提交的幂等命令回执
    infrastructure_only: true
    columns:
    - name: receipt_id
      type: VARCHAR(64)
      constraints:
      - PK
      - NOT_NULL
    - name: actor_sub_account_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: idempotency_key
      type: VARCHAR(160)
      constraints:
      - NOT_NULL
    - name: operation
      type: VARCHAR(48)
      constraints:
      - NOT_NULL
    - name: request_id
      type: UUID
      constraints:
      - NOT_NULL
    - name: response_json
      type: JSONB
      constraints:
      - NOT_NULL
    - name: created_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      - DEFAULT_NOW
    indexes:
    - name: uq_gr_receipt_key
      columns:
      - actor_sub_account_id
      - idempotency_key
      unique: true
  greeting_request_outbox:
    description: GreetingRequest 事件的事务性 outbox（append-only，relay 消费）
    infrastructure_only: true
    columns:
    - name: event_id
      type: VARCHAR(96)
      constraints:
      - PK
      - NOT_NULL
    - name: aggregate_id
      type: UUID
      constraints:
      - NOT_NULL
    - name: event_name
      type: VARCHAR(96)
      constraints:
      - NOT_NULL
    - name: payload_json
      type: JSONB
      constraints:
      - NOT_NULL
    - name: occurred_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
    - name: claim_owner
      type: VARCHAR(96)
      constraints:
      - NULLABLE
    - name: claimed_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    - name: published_at
      type: TIMESTAMPTZ
      constraints:
      - NULLABLE
    indexes:
    - name: idx_gr_outbox_pending
      columns:
      - published_at
      - occurred_at
cache:
  backend: redis
  patterns:
  - key: greeting:inbox:{targetSubAccountId}:pending
    ttl: 60s
    invalidate_on:
    - GreetingRequestSent
    - GreetingRequestReplied
    - GreetingRequestIgnored
    - GreetingRequestCancelled
    description: 收件箱 pending 数量缓存（红点角标）
role: authoritative
codegen:
  enabled: true
  package: user
  name_overrides:
    GreetingRequest: Greeting
  migration_skip_tables:
  - greeting_requests
  - greeting_request_command_receipts
  - greeting_request_outbox
