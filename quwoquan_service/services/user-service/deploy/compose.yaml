# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  user-service:
    image: "${QWQ_COMPOSE_USER_SERVICE_IMAGE:?fixed user-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/user-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_USER_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: user-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${QWQ_COMPOSE_USER_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_USER_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      QWQ_WORKLOAD: "${QWQ_WORKLOAD:-full}"
      USER_SERVICE_ADDR: ":18081"
      USER_RESEARCH_IDENTITY_ATTESTATION_KEY_BASE64: "${USER_RESEARCH_IDENTITY_ATTESTATION_KEY_BASE64:-}"
      USER_RESEARCH_IDENTITY_ACCOUNT_ID_ALLOWLIST_JSON: "${USER_RESEARCH_IDENTITY_ACCOUNT_ID_ALLOWLIST_JSON:-}"
      USER_MANAGED_ACCEPTANCE_IDENTITY_JSON: "${USER_MANAGED_ACCEPTANCE_IDENTITY_JSON:-}"
      OTP_CODE_REF_ACTIVE_KEY_VERSION: "${OTP_CODE_REF_ACTIVE_KEY_VERSION:?OTP_CODE_REF_ACTIVE_KEY_VERSION is required}"
      OTP_CODE_REF_KEYS_JSON: "${OTP_CODE_REF_KEYS_JSON:?OTP_CODE_REF_KEYS_JSON is required}"
      QWQ_PUSH_TOKEN_ENCRYPTION_KEY: "${QWQ_PUSH_TOKEN_ENCRYPTION_KEY:?QWQ_PUSH_TOKEN_ENCRYPTION_KEY is required}"
      POSTGRES_DSN: postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable
      MONGODB_URI: mongodb://mongodb:27017
      REDIS_ADDR: redis:6379
      CHAT_SERVICE_BASE_URL: http://chat-service:18081
      CONTENT_SERVICE_BASE_URL: http://content-service:18080
      TAG_SERVICE_BASE_URL: http://tag-service:18092
      PUBLIC_WEB_BASE_URL: "${QWQ_COMPOSE_PUBLIC_WEB_BASE_URL:?QWQ_COMPOSE_PUBLIC_WEB_BASE_URL is required}"
      SEARCH_ES_ENABLED: "${QWQ_COMPOSE_SEARCH_ES_ENABLED:-true}"
      SEARCH_ES_ENDPOINTS: "${QWQ_COMPOSE_SEARCH_ES_ENDPOINTS:-http://elasticsearch:9200}"
      USER_CARRIER_ONE_TAP_SUBSTITUTE_ENDPOINT: "${USER_CARRIER_ONE_TAP_SUBSTITUTE_ENDPOINT:-}"
      USER_FEDERATED_IDENTITY_SUBSTITUTE_ENDPOINT: "${USER_FEDERATED_IDENTITY_SUBSTITUTE_ENDPOINT:-}"
      ALIYUN_DYPNS_ENDPOINT: "${ALIYUN_DYPNS_ENDPOINT:-}"
      ALIYUN_DYPNS_ACCESS_KEY_ID: "${ALIYUN_DYPNS_ACCESS_KEY_ID:-}"
      ALIYUN_DYPNS_ACCESS_KEY_SECRET: "${ALIYUN_DYPNS_ACCESS_KEY_SECRET:-}"
      WECHAT_OAUTH_TOKEN_URL: "${WECHAT_OAUTH_TOKEN_URL:-}"
      WECHAT_OAUTH_USER_INFO_URL: "${WECHAT_OAUTH_USER_INFO_URL:-}"
      WECHAT_OAUTH_APP_ID: "${WECHAT_OAUTH_APP_ID:-}"
      WECHAT_OAUTH_APP_SECRET: "${WECHAT_OAUTH_APP_SECRET:-}"
      ALIPAY_OAUTH_TOKEN_URL: "${ALIPAY_OAUTH_TOKEN_URL:-}"
      ALIPAY_OAUTH_USER_INFO_URL: "${ALIPAY_OAUTH_USER_INFO_URL:-}"
      ALIPAY_OAUTH_APP_ID: "${ALIPAY_OAUTH_APP_ID:-}"
      ALIPAY_OAUTH_APP_PRIVATE_KEY_PEM: "${ALIPAY_OAUTH_APP_PRIVATE_KEY_PEM:-}"
      ALIPAY_OAUTH_PLATFORM_PUBLIC_KEY_PEM: "${ALIPAY_OAUTH_PLATFORM_PUBLIC_KEY_PEM:-}"
      ALIPAY_OAUTH_MERCHANT_PID: "${ALIPAY_OAUTH_MERCHANT_PID:-}"
      QQ_OAUTH_USER_INFO_URL: "${QQ_OAUTH_USER_INFO_URL:-}"
      QQ_OAUTH_APP_ID: "${QQ_OAUTH_APP_ID:-}"
      INTEGRATION_EXTERNAL_INTERACTION_BASE_URL: "${INTEGRATION_EXTERNAL_INTERACTION_BASE_URL:-}"
      INTEGRATION_SERVICE_MTLS_CA_FILE: /run/quwoquan/integration-mtls/ca.crt
      INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE: /run/quwoquan/integration-mtls/client.crt
      INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE: /run/quwoquan/integration-mtls/client.key
      INTEGRATION_SERVICE_MTLS_SERVER_NAME: "${INTEGRATION_SERVICE_MTLS_SERVER_NAME:-integration-service}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${QWQ_COMPOSE_USER_PORT:-19210}:18081"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${INTEGRATION_SERVICE_MTLS_CA_FILE:?INTEGRATION_SERVICE_MTLS_CA_FILE is required}:/run/quwoquan/integration-mtls/ca.crt:ro
      - ${INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE:?INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE is required}:/run/quwoquan/integration-mtls/client.crt:ro
      - ${INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE:?INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE is required}:/run/quwoquan/integration-mtls/client.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18081/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
