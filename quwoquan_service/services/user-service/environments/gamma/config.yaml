overrides:
  sys.user-service.es.enabled: true
  sys.user-service.es.requestTimeoutMs: 5000
  sys.user-service.integration.external_interaction_base_url: http://integration-service:18086
secretRefs:
  sys.user-service.mongodb.uri: USER_MONGO_URI
  sys.user-service.postgres.dsn: USER_POSTGRES_DSN
  sys.user-service.redis.general.password: USER_REDIS_GENERAL_PASSWORD
externalBindings:
  identity.carrier.one_tap:
    state: enabled
    adapter: ext.auth.carrier_one_tap_protocol_fixture
    endpointRef: local_topology:provider-protocol-substitute
  identity.social.login:
    state: enabled
    adapter: ext.auth.federated_identity_protocol_fixture
    endpointRef: local_topology:provider-protocol-substitute
