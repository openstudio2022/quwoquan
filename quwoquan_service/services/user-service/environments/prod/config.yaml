overrides:
  sys.user-service.es.enabled: true
  sys.user-service.es.shards: 3
  sys.user-service.integration.external_interaction_base_url: https://integration-service.prod
  sys.user-service.redis.general.mode: cluster
  sys.user-service.redis.general.tls: true
secretRefs:
  sys.user-service.mongodb.uri: MONGODB_URI
  sys.user-service.postgres.dsn: POSTGRES_DSN
  sys.user-service.redis.general.password: REDIS_PASSWORD
externalBindings:
  identity.carrier.one_tap:
    state: enabled
    adapter: ext.auth.carrier_one_tap
    endpointRef: environment_binding:identity.one_tap
  identity.social.login:
    state: enabled
    adapter: ext.auth.federated_identity
    endpointRef: environment_binding:identity.social
