# gamma overrides (cloud integration env)
service:
  http:
    addr: ":18081"

# gamma：搜索索引写侧开启，端点/凭据经共享 SEARCH_ES_* 环境变量注入。
es:
  enabled: true
  endpoints: []
  index: "quwoquan_objects"
  shards: 1
  replicas: 1

redis:
  general:
    mode: standalone
    addr: ""
    db: 0

integration:
  external_interaction_base_url: "https://integration-service.local"
  otp:
    mode: fixed_test
  social:
    providers: {}
  one_tap:
    resolver: aliyun
