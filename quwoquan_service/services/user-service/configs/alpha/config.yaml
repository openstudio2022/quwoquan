# alpha overrides (developer single-instance validation)
service:
  http:
    addr: ":18081"

postgres:
  dsn: "postgres://quwoquan:quwoquan@127.0.0.1:5432/quwoquan?sslmode=disable"

mongodb:
  uri: "mongodb://127.0.0.1:27017"

# alpha：搜索索引写侧关闭，主路径不依赖 ES。
es:
  enabled: false
  endpoints: []

redis:
  general:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 0

integration:
  external_interaction_base_url: "https://integration-service.local"
  otp:
    mode: fixed_test
  social:
    providers: {}
  one_tap:
    resolver: aliyun
