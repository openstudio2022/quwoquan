# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  content-service:
    image: "${QWQ_COMPOSE_CONTENT_SERVICE_IMAGE:?fixed content-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/content-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: content-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${QWQ_COMPOSE_CONTENT_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_CONTENT_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      QWQ_WORKLOAD: "${QWQ_WORKLOAD:-full}"
      MONGO_URI: "${QWQ_COMPOSE_MONGO_URI:-mongodb://mongodb:27017}"
      REPORT_DATABASE_URL: postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable
      CONTENT_REDIS_REC_ADDR: redis:6379
      CONTENT_REDIS_GENERAL_ADDR: redis:6379
      CONTENT_REDIS_REALTIME_ADDR: redis:6379
      CONTENT_OSS_ENDPOINT: "${QWQ_COMPOSE_OBJECT_STORAGE_ENDPOINT:?QWQ_COMPOSE_OBJECT_STORAGE_ENDPOINT is required}"
      CONTENT_OSS_BUCKET: "${QWQ_COMPOSE_OBJECT_STORAGE_BUCKET:?QWQ_COMPOSE_OBJECT_STORAGE_BUCKET is required}"
      CONTENT_OSS_REGION: "${QWQ_COMPOSE_OBJECT_STORAGE_REGION:?QWQ_COMPOSE_OBJECT_STORAGE_REGION is required}"
      CONTENT_OSS_ACCESS_KEY_ID: "${QWQ_COMPOSE_OBJECT_STORAGE_ACCESS_KEY_ID:?QWQ_COMPOSE_OBJECT_STORAGE_ACCESS_KEY_ID is required}"
      CONTENT_OSS_ACCESS_KEY_SECRET: "${QWQ_COMPOSE_OBJECT_STORAGE_ACCESS_KEY_SECRET:?QWQ_COMPOSE_OBJECT_STORAGE_ACCESS_KEY_SECRET is required}"
      CONTENT_MEDIA_DELIVERY_BASE_URL: "${QWQ_COMPOSE_MEDIA_DELIVERY_BASE_URL:?QWQ_COMPOSE_MEDIA_DELIVERY_BASE_URL is required}"
      CONTENT_MEDIA_UPLOAD_BASE_URL: "${QWQ_COMPOSE_MEDIA_UPLOAD_BASE_URL:?QWQ_COMPOSE_MEDIA_UPLOAD_BASE_URL is required}"
      CONTENT_CDN_SIGN_KEY: "${QWQ_COMPOSE_OBJECT_STORAGE_CDN_SIGN_KEY:?QWQ_COMPOSE_OBJECT_STORAGE_CDN_SIGN_KEY is required}"
      CONTENT_ACCOUNT_CLOSURE_SUBJECT_HMAC_SECRET: "${CONTENT_ACCOUNT_CLOSURE_SUBJECT_HMAC_SECRET:?CONTENT_ACCOUNT_CLOSURE_SUBJECT_HMAC_SECRET is required}"
      SEARCH_ES_ENABLED: "${QWQ_COMPOSE_SEARCH_ES_ENABLED:-true}"
      SEARCH_ES_ENDPOINTS: "${QWQ_COMPOSE_SEARCH_ES_ENDPOINTS:-http://elasticsearch:9200}"
      REC_MODEL_SERVICE_ENABLED: "${QWQ_COMPOSE_REC_MODEL_SERVICE_ENABLED:-true}"
      REC_MODEL_SERVICE_URL: http://recommendation-service:8000
      # 推荐 policy 只消费 content-service canonical resource；30s 热更仍执行
      # validate-before-swap，发布身份由内容摘要承担。
      QWQ_REC_POLICY_PATH: /etc/qwq-rec-policy/policy.yaml
      CONTENT_EMBEDDING_ENDPOINT: "${QWQ_COMPOSE_EMBEDDING_ENDPOINT:-}"
      CONTENT_EMBEDDING_API_KEY: "${QWQ_COMPOSE_EMBEDDING_API_KEY:-}"
      CIRCLE_SERVICE_BASE_URL: "${QWQ_COMPOSE_CIRCLE_SERVICE_BASE_URL:-http://circle-service:18082}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "${QWQ_COMPOSE_CONTENT_PORT:-19220}:18080"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${QWQ_COMPOSE_REC_POLICY_SOURCE:?QWQ_COMPOSE_REC_POLICY_SOURCE is required}:/etc/qwq-rec-policy/policy.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
