description: 'PostModerationCase 对象专属错误码（审核裁决与版本一致性）。

  共享错误码唯一定义于 content/content/post/errors.yaml；content 域 codegen 与端云 parity

  按固定文件列表合并，code 全域唯一。

  '
errors:
- code: CONTENT.USER.moderation_case_not_found
  reason: moderation_case_not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [ReviewPostModerationCase, DecidePostModeration, SupersedePostModerationCase, GetCurrentPostModerationCase]
  recovery_action: retry
  disruption_level: snackbar
  dart_const: moderationCaseNotFound
  go_const: ErrModerationCaseNotFound
  user_message:
    zh: 未找到当前内容的审核记录
    en: No current moderation case was found
