fields:
- name: id
  source: id
  type: string
  constraints:
  - PK
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: version
  source: version
  type: int
  constraints:
  - NOT_NULL
  - DEFAULT_1
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: postId
  source: postId
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
  reference: true
- name: postVersion
  source: postVersion
  type: int
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: contentDigest
  source: contentDigest
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: hash
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: status
  source: status
  type: enum
  enum_ref: PostModerationCaseStatus
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read_write
  role: authoritative_state
- name: reviewerId
  source: reviewerId
  type: string
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: hash
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
  reference: true
- name: decisionReason
  source: decisionReason
  type: string
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: redact
  api_exposure: drop
  ops_exposure: read_write
  role: authoritative_state
- name: createdAt
  source: createdAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: updatedAt
  source: updatedAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: decidedAt
  source: decidedAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
state_machine:
  field: status
  transitions:
  - from: pending
    to:
    - reviewed
    - superseded
  - from: reviewed
    to:
    - approved
    - rejected
    - superseded
  - from: approved
    to:
    - superseded
  - from: rejected
    to:
    - superseded
types:
  OpenPostModerationCaseRequest:
    fields:
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: postVersion, type: int, constraints: [NOT_NULL, MIN_1], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: contentDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
  ReviewPostModerationCaseRequest:
    fields:
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: caseId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
  DecidePostModerationCaseRequest:
    fields:
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: caseId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
    - {name: decision, type: enum, enum_ref: PostModerationDecision, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: decisionReason, type: string, constraints: [NULLABLE, MAX_LENGTH_512], classification: SENSITIVE, log_policy: redact, api_exposure: write, ops_exposure: read}
  SupersedePostModerationCaseRequest:
    fields:
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: caseId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
  GetCurrentPostModerationCaseQuery:
    fields:
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
  GetPostPublicationEligibilityQuery:
    fields:
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: postVersion, type: int, constraints: [NOT_NULL, MIN_1], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
    - {name: contentDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
  PostModerationCaseOpenedPayload:
    fields:
    - {name: caseId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: postVersion, type: int, constraints: [NOT_NULL, MIN_1], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: contentDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read}
  PostModerationCaseReviewedPayload:
    fields:
    - {name: caseId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: reviewerId, type: string, constraints: [NOT_NULL], classification: PII, log_policy: hash, api_exposure: drop, ops_exposure: read}
  PostModerationCaseDecidedPayload:
    fields:
    - {name: id, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: version, type: int, constraints: [NOT_NULL, MIN_1], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: postVersion, type: int, constraints: [NOT_NULL, MIN_1], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: contentDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read}
    - {name: reviewerId, type: string, constraints: [NOT_NULL], classification: PII, log_policy: hash, api_exposure: drop, ops_exposure: read}
    - {name: status, type: enum, enum_ref: PostModerationCaseStatus, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: decidedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
  PostModerationCaseSupersededPayload:
    fields:
    - {name: caseId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: postVersion, type: int, constraints: [NOT_NULL, MIN_1], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
enums:
  PostModerationDecision:
    values: [approved, rejected]
