commercial_defaults:
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: CONTENT_REPORT_COMMERCIAL_EVIDENCE
  status: blocked
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - actor: persona
    application:
      aggregate_owner: Report
      mutation_target: Report
      invariant_target: Report
      facet: ReportCommandFacet
      kind: command
      method: createReport
    authorization:
      ownership_policy: reporter
      principal: persona
    commercial:
      status: ready
    description: 提交举报
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    method: POST
    operation: CreateReport
    path: /content/reports
    privacy:
      log_policy: metadata_only
      request_classification: SENSITIVE
      response_classification: INTERNAL
    reliability:
      cancellation: supported
      idempotency: required
      max_attempts: 2
      retry_mode: idempotent
      timeout_ms: 5000
    security:
      auth_mode: required
      token_transport: bearer
      visibility: private
    slo:
      availability_percent: 99.9
      latency_p95_ms: 800
    telemetry:
      attributes:
        - target_type
        - outcome
      metric: content_report_create
      trace: true
    request_entity: CreateContentReportCommand
    request_body_kind: object
    response_body_kind: ack
  - actor: persona
    application:
      facet: ReportQueryFacet
      kind: query
      method: listMyReports
      reader: MyReportReader
      slice: MyReportPageSlice
    authorization:
      ownership_policy: reporter
      principal: persona
    commercial:
      status: ready
    description: 当前 persona 查看自己提交的举报及生命周期进度
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.SYSTEM.storage_read_failed
    method: GET
    operation: ListMyReports
    path: /content/users/me/reports
    privacy:
      log_policy: metadata_only
      request_classification: PII
      response_classification: SENSITIVE
    request_bindings:
      query:
        - name: cursor
          field: cursor
          required: false
        - name: limit
          field: limit
    reliability:
      cancellation: supported
      idempotency: none
      max_attempts: 2
      retry_mode: idempotent
      timeout_ms: 1500
    response_body: MyReportPageSlice
    response_body_kind: page
    response_entity: MyReportPageSlice
    security:
      anonymous_policy: deny
      auth_mode: required
      principal: persona
      token_transport: bearer
      visibility: private
    slo:
      availability_percent: 99.9
      latency_p95_ms: 400
    telemetry:
      attributes:
        - outcome
      metric: content_my_report_list
      trace: true
    request_entity: ContentMyReportsQuery
    request_body_kind: none
  - actor: account
    application:
      facet: ReportQueryFacet
      kind: query
      method: listReports
      reader: ReportQueueReader
      slice: ReportQueueSlice
    authorization:
      ownership_policy: operator_queue
      permissions:
        - content.report.read
      principal: operator
      scopes:
        - ops.case.read
    commercial:
      status: ready
    description: 举报运营队列（仅运营人员）
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.SYSTEM.storage_read_failed
    method: GET
    operation: ListReports
    path: /content/reports
    privacy:
      log_policy: redacted
      request_classification: INTERNAL
      response_classification: SENSITIVE
    request_bindings:
      query:
        - {name: limit, field: limit, required: false}
    reliability:
      cancellation: supported
      idempotency: none
      max_attempts: 2
      retry_mode: idempotent
      timeout_ms: 1500
    response_body: ReportQueueItemSlice
    response_body_kind: page
    response_entity: ReportQueueItemSlice
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    slo:
      availability_percent: 99.9
      latency_p95_ms: 400
    telemetry:
      attributes:
        - outcome
      metric: content_report_queue_list
      trace: true
  - actor: account
    application:
      facet: ReportQueryFacet
      kind: query
      method: getReport
      reader: ReportDetailReader
      slice: ReportDetailSlice
    authorization:
      ownership_policy: operator_queue
      permissions:
        - content.report.read
      principal: operator
      scopes:
        - ops.case.read
    commercial:
      status: ready
    description: 举报详情（运营）
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.report_not_found
      - CONTENT.SYSTEM.storage_read_failed
    method: GET
    operation: GetReport
    path: /content/reports/{reportId}
    request_bindings:
      path:
        - {name: reportId, field: reportId, required: true}
    privacy:
      log_policy: redacted
      request_classification: INTERNAL
      response_classification: SENSITIVE
    reliability:
      cancellation: supported
      idempotency: none
      max_attempts: 2
      retry_mode: idempotent
      timeout_ms: 1500
    response_body: ReportDetailSlice
    response_body_kind: object
    response_entity: ReportDetailSlice
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    slo:
      availability_percent: 99.9
      latency_p95_ms: 400
    telemetry:
      attributes:
        - outcome
      metric: content_report_get
      trace: true
  - actor: account
    application:
      aggregate_owner: Report
      mutation_target: Report
      invariant_target: Report
      facet: ReportCommandFacet
      kind: command
      method: beginReview
    authorization:
      ownership_policy: operator_review
      permissions:
        - content.report.review
      principal: operator
      scopes:
        - ops.case.write
    commercial:
      status: ready
    description: 领取待处理举报并开始审核（仅运营人员）
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.report_not_found
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    method: POST
    operation: BeginReportReview
    path: /content/reports/{reportId}/review
    privacy:
      log_policy: redacted
      request_classification: INTERNAL
      response_classification: INTERNAL
    reliability:
      cancellation: supported
      idempotency: required
      max_attempts: 2
      retry_mode: idempotent
      timeout_ms: 5000
    request_bindings:
      path:
        - {name: reportId, field: reportId, required: true}
    response_body: ReportCommandResult
    response_body_kind: object
    response_entity: ReportCommandResult
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    slo:
      availability_percent: 99.9
      latency_p95_ms: 800
    telemetry:
      attributes:
        - outcome
      metric: content_report_review_begin
      trace: true
  - actor: account
    application:
      aggregate_owner: Report
      mutation_target: Report
      invariant_target: Report
      facet: ReportCommandFacet
      kind: command
      method: dismissReport
    authorization:
      ownership_policy: operator_review
      permissions:
        - content.report.resolve
      principal: operator
      scopes:
        - ops.case.write
    commercial:
      status: ready
    description: 审核完成且未发现违规时驳回举报（仅运营人员）
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.report_not_found
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    method: POST
    operation: DismissReport
    path: /content/reports/{reportId}:dismiss
    request_bindings:
      path:
        - {name: reportId, field: reportId, required: true}
    privacy:
      log_policy: redacted
      request_classification: INTERNAL
      response_classification: INTERNAL
    reliability:
      cancellation: supported
      idempotency: required
      max_attempts: 2
      retry_mode: idempotent
      timeout_ms: 5000
    response_body: ReportCommandResult
    response_body_kind: object
    response_entity: ReportCommandResult
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    slo:
      availability_percent: 99.9
      latency_p95_ms: 800
    telemetry:
      attributes:
        - outcome
      metric: content_report_dismiss
      trace: true
  - actor: account
    application:
      aggregate_owner: Report
      mutation_target: Report
      invariant_target: Report
      facet: ReportCommandFacet
      kind: command
      method: resolveReport
    authorization:
      ownership_policy: operator_review
      permissions:
        - content.report.resolve
      principal: operator
      scopes:
        - ops.case.write
    commercial:
      status: ready
    description: 处理审核中的举报（仅运营人员）
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.report_not_found
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    method: PATCH
    operation: ResolveReport
    path: /content/reports/{reportId}
    privacy:
      log_policy: redacted
      request_classification: INTERNAL
      response_classification: INTERNAL
    reliability:
      cancellation: supported
      idempotency: required
      max_attempts: 2
      retry_mode: idempotent
      timeout_ms: 5000
    request_entity: ResolveReportRequest
    request_body_kind: object
    request_bindings:
      path:
        - {name: reportId, field: reportId, required: true}
    response_body: ReportCommandResult
    response_body_kind: object
    response_entity: ReportCommandResult
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    slo:
      availability_percent: 99.9
      latency_p95_ms: 800
    telemetry:
      attributes:
        - resolution
        - outcome
      metric: content_report_resolve
      trace: true
consumers:
  - capabilities:
      - create_report
      - list_my_reports
    name: app
  - capabilities:
      - list_reports
      - read_report
      - begin_review
      - resolve_report
      - dismiss_report
    name: platform-ops
