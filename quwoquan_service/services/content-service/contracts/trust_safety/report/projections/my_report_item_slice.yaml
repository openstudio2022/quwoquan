read_model: MyReportItemSlice
description: '当前举报人私有可见的举报进度分页单项。只返回举报对象、原因与生命周期状态，

  不暴露 reviewerId、内部处置细节或其他举报人的任何信息。

  '
source_entities:
- Report
consumers:
- app
fields:
- {name: id, type: string, nullable: false}
- {name: targetType, type: enum, enum_ref: ReportTargetType, nullable: false}
- {name: targetId, type: string, nullable: false}
- {name: reason, type: enum, enum_ref: ReportReason, nullable: false}
- {name: description, type: string, nullable: true}
- {name: status, type: enum, enum_ref: ReportStatus, nullable: false}
- {name: createdAt, type: timestamp, nullable: false}
- {name: updatedAt, type: timestamp, nullable: false}
- {name: resolvedAt, type: timestamp, nullable: true}
