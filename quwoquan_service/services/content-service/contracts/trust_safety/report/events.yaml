events:
- name: ReportCreated
  description: 举报聚合创建事实；post 目标审核 Case 和推荐负信号各使用独立 checkpoint。
  delivery_semantics: transactional_outbox
  wire_event_type: content.report.ReportCreated
  payload_entity: ReportCreatedPayload
  payload_shape: exact
  payload_fields:
  - reportId
  - reporterId
  - reporterAccountId
  - targetType
  - targetId
  - reason
- name: ReportReviewStarted
  description: operator 开始审核；当前没有 canonical 下游 handler。
  delivery_semantics: transactional_event_log
  payload_entity: ReportReviewStartedPayload
  payload_shape: exact
  payload_fields:
  - reportId
  - reviewerId
  no_consumer_reason: 审核领取只形成 Report 聚合内的持久运营审计；下游治理结果只由 ReportResolved 或 ReportDismissed 承载。
- name: ReportResolved
  description: 举报核实并结案；通知与 comment delete_content 治理投影分别使用独立 checkpoint。
  delivery_semantics: transactional_outbox
  wire_event_type: content.report.ReportResolved
  payload_entity: ReportResolvedPayload
  payload_shape: exact
  payload_fields:
  - reportId
  - reporterId
  - reporterAccountId
  - targetType
  - targetId
  - reviewerId
  - resolution
- name: ReportDismissed
  description: 举报审核完成但未发现违规；通知传输使用独立 checkpoint。
  delivery_semantics: transactional_outbox
  wire_event_type: content.report.ReportDismissed
  payload_entity: ReportDismissedPayload
  payload_shape: exact
  payload_fields:
  - reportId
  - reporterId
  - reporterAccountId
  - targetType
  - targetId
  - reviewerId
