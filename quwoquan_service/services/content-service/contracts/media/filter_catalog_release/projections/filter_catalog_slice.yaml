read_model: FilterCatalogSlice
description: Active FilterCatalogRelease 的完整公开渲染目录；不暴露 sourceOwner、CAS version 或 command receipt。
source_entities: [FilterCatalogRelease]
consumers: [app]
fields:
  - {name: releaseId, type: string, nullable: false}
  - {name: canonicalDigest, type: string, nullable: false}
  - {name: status, type: enum, enum_ref: FilterCatalogReleaseStatus, nullable: false}
  - {name: categoryCount, type: int, nullable: false}
  - {name: presetCount, type: int, nullable: false}
  - {name: categories, type: '[]FilterCategoryDefinition', nullable: false}
  - {name: presets, type: '[]FilterPresetDefinition', nullable: false}
  - {name: recommendedFallbackPresetIds, type: '[]string', nullable: false}
  - {name: importedAt, type: timestamp, nullable: false}
  - {name: activatedAt, type: timestamp, nullable: true}
