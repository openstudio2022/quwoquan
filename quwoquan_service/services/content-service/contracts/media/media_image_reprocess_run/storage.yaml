backend: mongodb
collections:
  media_image_reprocess_runs:
    entity: MediaImageReprocessRun
    description: 显式图片重处理 run、处理 cursor 与 activation audit；不存储独立 variant 资产。
    indexes:
    - name: idx_media_image_reprocess_run_id
      keys:
        runId: 1
      unique: true
    - name: idx_media_image_reprocess_run_status_updated
      keys:
        status: 1
        updatedAt: 1
    - name: idx_media_image_reprocess_run_version
      keys:
        runId: 1
        version: 1
      unique: true
  media_image_reprocess_run_receipts:
    entity: MediaImageReprocessRun
    description: Start/Pause/Resume/Rollback 及 worker cursor 命令回执；与 run 状态同一 Mongo transaction 提交。
    indexes:
    - name: idx_media_image_reprocess_run_receipts_key
      keys:
        _id: 1
      unique: true
    - name: idx_media_image_reprocess_run_receipts_aggregate
      keys:
        aggregateId: 1
        aggregateVersion: -1
    - name: idx_media_image_reprocess_run_receipts_expire
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
  media_image_reprocess_run_leases:
    entity: MediaImageReprocessRun
    description: 每个 run 的 worker cursor lease；副本接管仅在 owner 过期或显式释放后发生。
    indexes:
    - name: idx_media_image_reprocess_run_lease_id
      keys:
        _id: 1
      unique: true
    - name: idx_media_image_reprocess_run_lease_until
      keys:
        leaseUntil: 1
role: authoritative
