events:
- name: MediaImageReprocessRunStarted
  producer: content-service
  consumers: []
  no_consumer_reason: run 事实即受控运维审计记录；worker 直接读取 aggregate，不经事件投递。
  channel: fact_collection
  payload_entity: MediaImageReprocessRun
  payload_fields:
  - runId
  - targetDerivativePolicyVersion
  - status
  - assetIds
  - startedAt
