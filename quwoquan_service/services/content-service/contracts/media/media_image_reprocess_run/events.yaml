events:
- name: MediaImageReprocessRunStarted
  producer: content-service
  consumers: []
  channel: fact_collection
  payload_entity: MediaImageReprocessRun
  payload_fields:
  - runId
  - targetDerivativePolicyVersion
  - status
  - assetIds
  - startedAt
- name: MediaImageReprocessRunPaused
  producer: content-service
  consumers: []
  channel: fact_collection
  payload_entity: MediaImageReprocessRun
  payload_fields:
  - runId
  - status
  - nextAssetIndex
  - processedCount
  - failedCount
  - pausedAt
- name: MediaImageReprocessRunResumed
  producer: content-service
  consumers: []
  channel: fact_collection
  payload_entity: MediaImageReprocessRun
  payload_fields:
  - runId
  - status
  - nextAssetIndex
  - processedCount
  - failedCount
  - updatedAt
- name: MediaImageReprocessRunCompleted
  producer: content-service
  consumers: []
  channel: fact_collection
  payload_entity: MediaImageReprocessRun
  payload_fields:
  - runId
  - status
  - processedCount
  - failedCount
  - completedAt
- name: MediaImageReprocessRunRolledBack
  producer: content-service
  consumers: []
  channel: fact_collection
  payload_entity: MediaImageReprocessRun
  payload_fields:
  - runId
  - status
  - processedCount
  - failedCount
  - rolledBackAt
