commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: CONTENT_MEDIA_ORIGINAL_ACCESS_FACT_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 'MediaOriginalAccessFact 无独立 transport；审计事实只在 OriginalAccessQuota

  的额度预留事务内追加，禁止暴露第二条原图访问写 API。

  '
api_routes: []
runtime_entrypoints:
- name: AppendOriginalAccessAudit
  kind: internal_port
  phase: transactional_append
  source_objects: [content.OriginalAccessQuota]
  idempotency: identity_payload_digest
  application: {kind: command, facet: MediaOriginalAccessAuditPort, method: appendAudit, object_owner: MediaOriginalAccessFact}
  telemetry:
    metric: content_media_original_access_audit_append
    trace: true
    attributes: [outcome]
  slo:
    latency_p95_ms: 500
    failure_ratio_percent: 0.5
consumers:
- name: content-service
  capabilities:
  - audit_original_access_decision
readiness_cases:
  - case_id: append-original-access-audit-local
    spec_ref: specs/feature-tree/discovery-content/media-processing-helper-read/image-delivery-variants/spec.md#gwt-003
    producer: service
    layer: local_contract
    target: {kind: operation, id: AppendOriginalAccessAudit}
    runner_source_path: quwoquan_service/services/content-service/tests/local_contract/media/media_original_access_fact/application/service__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
  - case_id: append-original-access-audit-api
    spec_ref: specs/feature-tree/discovery-content/media-processing-helper-read/image-delivery-variants/spec.md#gwt-003
    producer: service
    layer: api_integration
    target: {kind: operation, id: AppendOriginalAccessAudit}
    runner_source_path: quwoquan_service/services/content-service/tests/api_integration/media/media_original_access_fact/mongo_append__api_integration_test.go
    executions:
      - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
