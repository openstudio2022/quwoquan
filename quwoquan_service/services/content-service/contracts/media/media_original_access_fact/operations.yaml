commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: CONTENT_MEDIA_ORIGINAL_ACCESS_FACT_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: MediaOriginalAccessFact 的对象中心不可变授权事实追加入口。
api_routes:
  - method: POST
    path: /content/media/{mediaId}/original:access
    operation: RequestOriginalImageAccess
    actor: persona
    application:
      kind: command
      facet: MediaOriginalAccessAppendFacet
      method: requestOriginalImageAccess
      append_sink: MediaOriginalAccessFact
      mutation_target: MediaOriginalAccessFact
      invariant_target: MediaOriginalAccessFact
    authorization:
      principal: persona
      ownership_policy: post_visibility_and_media_policy
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.media_not_found
      - CONTENT.USER.original_access_denied
      - CONTENT.USER.original_access_rate_limited
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: PII
      response_classification: SENSITIVE
      log_policy: redacted
    telemetry:
      metric: content_media_original_access_request
      trace: true
      attributes:
        - purpose
        - outcome
        - access_policy
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_entity: RequestContentMediaOriginalAccessCommand
    request_bindings:
      path:
        - name: mediaId
          field: mediaId
    response_fields:
      - mediaId
      - status
      - originalUrl
      - format
      - sizeBytes
      - expiresAt
      - ttlSeconds
      - auditId
    response_entity: MediaOriginalAccessGrant
    response_body: MediaOriginalAccessGrant
    response_body_kind: object
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    description: 按 MediaAsset named Reader、引用 Post named visibility reader、资产策略与 viewer/media/purpose 限流校验签发短时原图访问授权。
    request_body_kind: object
