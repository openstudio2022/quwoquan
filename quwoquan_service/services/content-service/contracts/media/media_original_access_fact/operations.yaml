    layer: local_contract
    target: {kind: operation, id: RequestOriginalImageAccess}
    runner_source_path: quwoquan_service/services/content-service/tests/local_contract/media/media_original_access_fact/application/service__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
  - case_id: request-original-image-access-api
    spec_ref: specs/feature-tree/discovery-content/media-processing-helper-read/image-delivery-variants/spec.md#gwt-003
    producer: service
    layer: api_integration
