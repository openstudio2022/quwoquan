    runner_source_path: quwoquan_service/services/content-service/tests/api_integration/media/media_original_access_fact/http_mongo_append__api_integration_test.go
    executions:
      - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
  - case_id: media_original_access_fact_request_original_image_access_app_local
    spec_ref: specs/feature-tree/discovery-content/media-processing-helper-read/image-delivery-variants/spec.md#gwt-003
