kind: append_only_fact
description: 'MediaAsset、引用 Post 可见性与按 viewer/media/purpose 限流判定后追加的原始媒体访问审计事实。

  事实、幂等 receipt 与 grant 额度保留在同一 Mongo transaction 落盘；重放不得延长授权有效期。

  '
identity:
  fields:
  - auditId
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: none
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: mediaAsset
  on_delete: retain
  reference_fields:
  - assetId
  target_object: content.MediaAsset
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: viewer
  on_delete: retain
  reference_fields:
  - viewerId
  target_object: user.Persona
capabilities:
- append_only
- idempotent_append
- rate_limited
taggable: false
vector_enabled: false
business_rules:
- ready image 的 grant、访问策略/可见性拒绝和 rate-limit 拒绝都必须产生不可变审计事实
- viewer 必须通过 MediaAsset 访问策略、已发布引用 Post 的可见性和 BOLA 校验
- 限流键为 viewerId + assetId + purpose；窗口与额度只由 original_access_policy 声明，拒绝请求不签发 URL
- 同一 idempotencyKey 只产生一个 auditId、一个 outcome、一个 reason 和一条 outbox 事件
- granted replay 返回原绝对 expiresAt，禁止刷新或延长签名 URL 生命周期；非 granted 的 expiresAt 为空
lifecycle:
  states:
  - granted
  - denied
  - rate_limited
  immutable: true
