events:
- name: MediaUploadInitialized
  description: 上传会话已创建，且已绑定 owner、objectKey、expectedSha256 和过期时间。
  delivery_semantics: transactional_outbox
  payload_entity: MediaUploadSession
  payload_fields:
  - id
  - version
  - ownerId
  - objectKey
  - expiresAt
- name: MediaUploadCompleted
  description: 上传会话完成；同一事务内物化 MediaAssetCreated 事实。
  delivery_semantics: transactional_outbox
  payload_entity: MediaUploadSession
  payload_fields:
  - id
  - version
  - ownerId
  - objectKey
  - completedAt
- name: MediaUploadAborted
  description: 上传会话已中止，后续完成回调必须拒绝。
  delivery_semantics: transactional_outbox
  payload_entity: MediaUploadSession
  payload_fields:
  - id
  - version
  - ownerId
  - abortedAt
