fields:
  - name: id
    source: id
    type: string
    constraints:
      - PK
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: version
    source: version
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: ownerId
    source: ownerId
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 素材所有者 Persona ID；所有 owner 侧读取和访问策略变更均以此字段做 BOLA 边界。
    role: authoritative_state
    reference: true
  - name: sourceSessionId
    source: sourceSessionId
    type: string
    constraints:
      - NOT_NULL
      - UNIQUE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 产生该资产的上传会话；同一会话最多物化一个资产。
    role: authoritative_state
    reference: true
  - name: objectKey
    source: objectKey
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 内部对象存储 canonical key（CAS）。仅服务端边界持有；公开交付必须使用稳定 public slice key / delivery URI，禁止把本字段直接交给播放器或图片组件。
    role: authoritative_state
  - name: sha256
    source: sha256
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 已验证的内容摘要；用于 CAS 定址、去重，以及跨环境逻辑资产 parity 校验。
    role: authoritative_state
  - name: mediaType
    source: mediaType
    type: enum
    enum_ref: MediaType
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: mimeType
    source: mimeType
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: fileSize
    source: fileSize
    type: int64
    constraints:
      - NOT_NULL
      - POSITIVE
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: accessPolicy
    source: accessPolicy
    type: enum
    enum_ref: MediaAssetAccessPolicy
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    description: owner_only、referenced_post 或 public；策略不由 Post 内存状态派生。
    role: authoritative_state
  - name: processingStatus
    source: processingStatus
    type: enum
    enum_ref: MediaAssetStatus
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    description: processing、ready、rejected 或 deleted。图片和视频均须经服务端验证与归一化，只有 ready 后可被发布和投影。
    role: authoritative_state
  - name: processingVersion
    source: processingVersion
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: 图片/视频 descriptor 与 public slice 写入时的 MediaAsset 聚合版本。后续 accessPolicy 或 coverStrategy 变更可以推进 aggregate version，但不得重解释既有处理产物的 versioned slice key。
    role: authoritative_state
  - name: processorProfile
    source: processorProfile
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: 处理器 profile；与 assetId、version 共同构成处理幂等键，不向 App 透传。
    role: authoritative_state
  - name: imageWidth
    source: imageWidth
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端解码、方向归一和尺寸约束后得到的权威图片宽度（px）；Feed 与正文布局只消费本字段。
    role: authoritative_state
  - name: imageHeight
    source: imageHeight
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端解码、方向归一和尺寸约束后得到的权威图片高度（px）；Feed 与正文布局只消费本字段。
    role: authoritative_state
  - name: imageDeliveryMimeType
    source: imageDeliveryMimeType
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 图片归一化基线切片的真实 MIME；CDN 只可按 image_variant_policy 生成的 profile 再转为 WebP。
    role: authoritative_state
  - name: imageDominantColor
    source: imageDominantColor
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 受信处理器从归一化基线生成的
    role: authoritative_state
  - name: imageLqip
    source: imageLqip
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: redact
    api_exposure: read
    ops_exposure: read
    description: 受尺寸上限约束的低清 data URI 占位，不含原始 EXIF、对象 key 或用户身份。
    role: authoritative_state
  - name: imageContentProfile
    source: imageContentProfile
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 受信处理器输出的渲染内容画像（photographic 或 alpha_graphic），不承载安全审核结论。
    role: authoritative_state
  - name: imageDerivativePolicyVersion
    source: imageDerivativePolicyVersion
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 生成该 descriptor 的 image_variant_policy 版本；与 processingVersion 一起冻结可回滚交付语义。
    role: authoritative_state
  - name: activeImageDescriptorRevision
    source: activeImageDescriptorRevision
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: 当前对外投影的图片 descriptor revision；切换只能由 MediaAsset CAS 激活或回滚。
    role: authoritative_state
  - name: imageDescriptorRevisions
    source: imageDescriptorRevisions
    type: '[]ImageDescriptorRevision'
    constraints:
      - NULLABLE
      - MAX_ITEMS_32
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 有界的图片 descriptor 历史；保留旧 normalized/public slice 身份以支持审计回滚，不创建 variant MediaAsset。
    role: owned_value
  - name: imageNormalizedObjectKey
    source: imageNormalizedObjectKey
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 服务端处理得到的私有归一化对象 key；发布时复制到 imagePublicSliceKey，禁止直接透传客户端。
    role: authoritative_state
  - name: imagePublicSliceKey
    source: imagePublicSliceKey
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 图片稳定公共基线切片 key；thumbnail/display/cover/full 由 CDN 按 metadata profile 派生。
    role: authoritative_state
  - name: verifiedDurationMs
    source: verifiedDurationMs
    type: int64
    constraints:
      - NULLABLE
      - NON_NEGATIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测后写入的权威视频时长（毫秒）；原生播放器时长只能用于运行时边界和一致性校验。
    role: authoritative_state
  - name: videoWidth
    source: videoWidth
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的编码视频宽度（px）。
    role: authoritative_state
  - name: videoHeight
    source: videoHeight
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的编码视频高度（px）。
    role: authoritative_state
  - name: videoCodec
    source: videoCodec
    type: enum
    enum_ref: MediaVideoCodec
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的 codec 名称；仅用于能力降级和低基数 QoE 分桶。
    role: authoritative_state
  - name: videoContainer
    source: videoContainer
    type: enum
    enum_ref: MediaContainer
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的封装格式。
    role: authoritative_state
  - name: videoAudioCodec
    source: videoAudioCodec
    type: enum
    enum_ref: MediaAudioCodec
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的主音轨 codec；P0 商用 MP4 必须为 AAC。
    role: authoritative_state
  - name: videoKeyframeIntervalMs
    source: videoKeyframeIntervalMs
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: 服务端探测的最大关键帧间隔；P0 media-canary 不得超过 2000ms。
    role: authoritative_state
  - name: videoFastStart
    source: videoFastStart
    type: bool
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: MP4 moov 是否位于媒体数据前，可在首字节 Range 内发现；P0 ready 必须为 true。
    role: authoritative_state
  - name: videoPublicSliceKey
    source: videoPublicSliceKey
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 公开视频 canonical slice key；业务投影必须经受信交付边界解析，禁止向 UI 透传 objectKey 或未验证 URL。
    role: authoritative_state
  - name: coverPublicSliceKey
    source: coverPublicSliceKey
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 公开视频封面 canonical slice key；与 asset/version 绑定。
    role: authoritative_state
  - name: previewTrackVersion
    source: previewTrackVersion
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: storyboard 预览轨版本；缺失时 App 仅显示时间浮标。
    role: authoritative_state
  - name: previewTrackManifestSliceKey
    source: previewTrackManifestSliceKey
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: storyboard manifest 的 canonical slice key；访问与缓存必须绑定 asset/version/profile/access policy。
    role: authoritative_state
  - name: hlsCmafDescriptorVersion
    source: hlsCmafDescriptorVersion
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: HLS/CMAF descriptor 版本；必须与 master manifest、descriptor slice 和 rendition count 成组出现。
    role: authoritative_state
  - name: hlsCmafDescriptorSliceKey
    source: hlsCmafDescriptorSliceKey
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 绑定 asset/version/processor profile 的 HLS/CMAF descriptor canonical slice key。
    role: authoritative_state
  - name: hlsCmafMasterManifestSliceKey
    source: hlsCmafMasterManifestSliceKey
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: HLS master manifest canonical slice key；App 只能经受信交付边界解析，失败必须回退同资产同版本 progressive MP4。
    role: authoritative_state
  - name: hlsCmafRenditionCount
    source: hlsCmafRenditionCount
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: descriptor 中已验证 rendition 数量，闭区间为 1..4。
    role: authoritative_state
  - name: processingFailureReason
    source: processingFailureReason
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: redact
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
  - name: coverStrategy
    source: coverStrategy
    type: enum
    enum_ref: MediaCoverStrategy
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    role: authoritative_state
  - name: manualCoverAssetId
    source: manualCoverAssetId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: read
    ops_exposure: read_write
    role: authoritative_state
    reference: true
  - name: coverFrameTimeMs
    source: coverFrameTimeMs
    type: int64
    constraints:
      - NOT_NULL
      - NON_NEGATIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    role: authoritative_state
  - name: createdAt
    source: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: processedAt
    source: processedAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
types:
  RecordMediaProcessingResultRequest:
    description: 受信处理器提交的原子处理结果；图片、视频 descriptor 字段按 mediaType 与 processingStatus 的领域规则成组校验。
    fields:
      - {name: processingStatus, type: enum, enum_ref: MediaAssetStatus, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: failureReason, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: redact, api_exposure: write, ops_exposure: read}
      - {name: processorProfile, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: imageWidth, type: int, constraints: [NULLABLE, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: imageHeight, type: int, constraints: [NULLABLE, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: imageDeliveryMimeType, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: imageNormalizedObjectKey, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: imagePublicSliceKey, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: imageDominantColor, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: imageLqip, source: imageLQIP, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: imageContentProfile, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: imageDerivativePolicyVersion, type: int, constraints: [NULLABLE, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: verifiedDurationMs, type: int64, constraints: [NULLABLE, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoWidth, type: int, constraints: [NULLABLE, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoHeight, type: int, constraints: [NULLABLE, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoCodec, type: enum, enum_ref: MediaVideoCodec, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoContainer, type: enum, enum_ref: MediaContainer, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoAudioCodec, type: enum, enum_ref: MediaAudioCodec, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoKeyframeIntervalMs, type: int, constraints: [NULLABLE, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoFastStart, type: bool, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: videoPublicSliceKey, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: coverPublicSliceKey, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: previewTrackVersion, type: int, constraints: [NULLABLE, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: previewTrackManifestSliceKey, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: hlsCmafDescriptorVersion, type: int, constraints: [NULLABLE, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: hlsCmafDescriptorSliceKey, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: hlsCmafMasterManifestSliceKey, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: hlsCmafRenditionCount, type: int, constraints: [NULLABLE, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
  UpdateMediaAssetAccessPolicyRequest:
    fields:
      - {name: accessPolicy, type: enum, enum_ref: MediaAssetAccessPolicy, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
  SelectManualVideoCoverRequest:
    description: 手动封面可以选择同 owner 的图片资产或当前视频中的合法帧，领域规则要求至少提供一种来源。
    fields:
      - {name: coverAssetId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: coverFrameTimeMs, type: int64, constraints: [NULLABLE, NON_NEGATIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
  ImageProcessingDescriptor:
    description: 受信图片处理器输出的完整可交付 descriptor；作为 revision 的不可分割值保存。
    fields:
      - {name: processorProfile, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: imageWidth, type: int, constraints: [NOT_NULL, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: imageHeight, type: int, constraints: [NOT_NULL, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: imageDeliveryMimeType, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: imageNormalizedObjectKey, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: imagePublicSliceKey, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: imageDominantColor, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: imageLqip, source: imageLQIP, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: imageContentProfile, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: derivativePolicyVersion, type: int, constraints: [NOT_NULL, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
  ImageDescriptorRevision:
    description: MediaAsset 内有界且不可独立寻址的图片 descriptor revision。
    fields:
      - {name: revision, type: int, constraints: [NOT_NULL, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: previousRevision, type: int, constraints: [NULLABLE, NON_NEGATIVE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: processingVersion, type: int64, constraints: [NOT_NULL, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: descriptor, type: ImageProcessingDescriptor, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read}
      - {name: activatedByRunId, source: activatedByRunId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: activatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: cleanupCandidateAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
  SelectManualContentMediaCoverCommand:
    fields:
      - name: mediaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: coverAssetId
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: coverFrameTimeMs
        type: int
        client_dart_type: int
        client_default: "0"
  GetContentMediaAssetQuery:
    fields:
      - name: mediaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  SelectAutoContentMediaCoverCommand:
    fields:
      - name: mediaId
        type: string
        constraints:
          - NOT_BLANK
