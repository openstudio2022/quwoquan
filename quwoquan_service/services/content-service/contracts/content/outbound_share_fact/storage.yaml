backend: mongodb
collections:
  outbound_share_facts:
    entity: OutboundShareFact
    role: append_only
    indexes:
    - name: idx_outbound_share_event
      keys:
        eventId: 1
      unique: true
  outbound_share_receipts:
    entity: OutboundShareFact
    role: authoritative
    description: OutboundShareFact append 的幂等 command receipt；与事实和 outbox 同事务。
    indexes:
    - name: idx_outbound_share_dedupe
      keys:
        actorDimension: 1
        actorId: 1
        idempotencyKey: 1
      unique: true
    - name: idx_outbound_share_post_time
      keys:
        postId: 1
        occurredAt: -1
  outbound_share_outbox:
    entity: OutboundShareFact
    role: append_only
    indexes:
    - name: idx_outbound_share_outbox_event
      keys:
        eventId: 1
      unique: true
    - name: idx_outbound_share_outbox_sequence
      keys:
        outboxSequence: 1
      unique: true
  outbound_share_outbox_sequences:
    entity: OutboundShareFact
    role: append_only
    description: 为 OutboundShareFact outbox transaction 分配全局单调 sequence。
  outbound_share_projection_checkpoints:
    entity: OutboundShareFact
    role: projection
    indexes:
    - name: idx_outbound_share_projection_checkpoint_consumer
      keys:
        consumer: 1
      unique: true
role: append_only
