fields:
  - name: eventId
    type: string
    constraints:
      - PK
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
  - name: postId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
    reference: true
  - name: actorDimension
    type: enum
    enum_ref: ContentActorDimension
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: append_only_fact
    reference: true
  - name: actorId
    type: string
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    role: append_only_fact
    reference: true
  - name: channel
    type: enum
    enum_ref: OutboundShareChannel
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
  - name: destinationKind
    type: enum
    enum_ref: OutboundShareDestinationKind
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    role: append_only_fact
  - name: destinationDigest
    type: string
    constraints:
      - NULLABLE
    classification: SENSITIVE
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    role: append_only_fact
  - name: referralId
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: hash
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
  - name: idempotencyKey
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    role: append_only_fact
  - name: occurredAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
types:
  OutboundShareFactResult:
    description: Append result for one immutable outbound share fact.
    fields:
      - {name: eventId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: channel, type: enum, enum_ref: OutboundShareChannel, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: referralId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: replayed, type: bool, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  OutboundShareRecordedPayload:
    fields:
      - {name: eventId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: actorDimension, type: enum, enum_ref: ContentActorDimension, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: actorId, type: string, constraints: [NOT_NULL], classification: PII, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: channel, type: enum, enum_ref: OutboundShareChannel, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: destinationKind, type: enum, enum_ref: OutboundShareDestinationKind, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
      - {name: destinationDigest, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: referralId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: providerReceiptDigest, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: drop, ops_exposure: read}
      - {name: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
  CreateContentOutboundShareCommand:
    fields:
      - name: postId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: channel
        type: enum
        enum_ref: OutboundShareChannel
      - name: destinationKind
        type: enum
        enum_ref: OutboundShareDestinationKind
      - name: destination
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: referralId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: providerReceiptId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: clientConfirmedAt
        type: timestamp
        client_dart_type: DateTime
        client_normalization: utc
enums:
  OutboundShareChannel:
    values: [system_share, wechat_friend, wechat_moments]
  OutboundShareDestinationKind:
    values: [external_app]
