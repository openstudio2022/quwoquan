entity: ContentReaction
domain: CONTENT
description: 'ContentReaction 对象专属错误码。共享错误码唯一定义于 content/content/post/errors.yaml；

  content 域 codegen 与端云 parity 按固定文件列表合并，code 全域唯一。

  '
errors:
