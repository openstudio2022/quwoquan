    operations: [LikePost, UnlikePost, ReactToComment]
  recovery_action: surface
  dart_const: contentReactionTargetNotFound
  go_const: ErrContentReactionTargetNotFound
  user_message:
    zh: 互动目标不存在或已失效
    en: The reaction target is missing or unavailable
