events:
- name: ContentReactionSet
  description: 'actor 对 Post 建立 like 或对 Comment 建立 like/dislike 关系的版本化事实。

    非 canonical 结构字段迁移注记：recommend_impact="hot_path_signal"。'
  delivery_semantics: transactional_outbox
  wire_event_type: ContentReactionSet
  payload_entity: ContentReactionChangedPayload
  payload_shape: exact
  payload_fields:
  - reactionId
  - version
  - targetKind
  - targetId
  - targetAuthorId
  - actorDimension
  - actorId
  - reaction
  - occurredAt
  - idempotencyKey
- name: ContentReactionCleared
  description: 'actor 将自身互动关系迁移为 none 的版本化事实；不制造新的通知或正向推荐信号。

    非 canonical 结构字段迁移注记：recommend_impact="hot_path_signal"。'
  delivery_semantics: transactional_outbox
  wire_event_type: ContentReactionCleared
  payload_entity: ContentReactionChangedPayload
  payload_shape: exact
  payload_fields:
  - reactionId
  - version
  - targetKind
  - targetId
  - targetAuthorId
  - actorDimension
  - actorId
  - reaction
  - occurredAt
  - idempotencyKey
