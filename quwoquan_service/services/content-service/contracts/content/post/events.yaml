description: 现役Post对象事件保持唯一source owner；公开/设置/审核/删除/privacy/purge payload新增同事务safetyRevision，不能从sourceVersion/Content revision推算。安全变化原子写PostSafetyState与事件；普通更新携带当前安全revision，只有合法owner动作可改变资格。不存在旧wire兼容或缺字段默认。Content-only authoring尚未实现producer/下游迁移，不宣称Search/Rec水位或隐私清理完成；不新增通用安全事件或registry。
events:
- name: ContentReleaseFenceChanged
  description: activation/rollback唯一已提交转换事实，before/after直接引用Content fence；与pointer CAS、active stage receipt及outbox同事务。eventId绑定environment/sourceOwner/after.revision，envelope aggregateVersion=after.revision且aggregateId为该控制分区，不是Post源版本或postId。重复同摘要幂等，错tuple/同revision不同摘要/未知payload拒绝；只改变fence可见性并对账已准备候选，不产生对象删除级联。迟到事实只有既有inbox或exact提交回执可证时才可superseded，缺回执不得quiet ACK。
  delivery_semantics: transactional_outbox
  wire_event_type: ContentReleaseFenceChanged
  topic: events.content.post_lifecycle
  payload_entity: ContentReleaseFenceChangedPayload
  payload_shape: exact
  payload_fields: [before, after]
- name: PostReleaseCandidatePrepared
  description: verified candidate完整source快照的durable准备事实，不是PostPublished或active。
  delivery_semantics: transactional_outbox
  wire_event_type: PostReleaseCandidatePrepared
  topic: events.content.post_release_candidate
  payload_entity: PostReleaseCandidatePrepared
  payload_shape: exact
  payload_fields: [publicationId, binding, snapshot, sourceVersion, occurredAt]
- name: PostSubmittedForReview
  description: PublishIntent进入pending_review，后续审核allow才可产生PostPublished。
  delivery_semantics: transactional_outbox
  wire_event_type: PostSubmittedForReview
  payload_entity: Post
  payload_fields: [postId, publishIntentId, localDraftId, authorId, contentType, status, moderationStatus, contentDigest, createdAt]
- name: PostPublished
  description: 真实对象发布的canonical公开快照，不承担Data activation通知。sourceVersion等于envelope aggregateVersion；ordinary来源显式null，Data完整源tuple，releaseDigest仅审计；所有字段按源payload严格解码，不猜来源或默认补值。 一次性 PublishIntent 被接受并完成发布；引用发布时 payload 自包含 sourcePostId 与源帖作者（sourcePostAuthorId），"被引用"通知由此驱动，不设第二个 PostQuoted 事实。现有 width/height 依 fields.yaml#width 携带同一 image/video 主媒体正数对或同时 null；图片取 canonical 第一媒体身份，视频取视频资产而非封面，不新增 primaryMedia 字段。
  delivery_semantics: transactional_outbox
  wire_event_type: PostPublished
  payload_entity: PostLifecycleProjectionPayload
  payload_shape: exact
  payload_fields: [postId, authorId, contentType, status, visibility, moderationStatus, title, body, summary, semanticDocument, authorDisplayNameSnapshot, authorAvatarUrlSnapshot, mediaUrls, coverUrl, thumbnailUrl, videoUrl, width, height, durationMs, tagRefs, entityRefs, contentVertical, createdAt, publishedAt, updatedAt, publishIntentId, localDraftId, contentDigest, assistantUsePolicy, coverStrategy, coverFrameTimeMs, likeCount, commentCount, shareCount, mediaItems, semanticMentions, primaryHomepageId, primaryHomepageSnapshot, visitedAt, gatheringRef, captureDisclosure, sourcePostId, sourcePostAuthorId, contentId, contentVersion, variantPurpose, usageScope, environment, sourceOwner, releaseId, releaseDigest, manifestDigest, sourceVersion, safetyRevision]
- name: PostModerationRejected
  description: owner审核拒绝使对象失去公开资格；现役producer调用projectionPayloadForPost，复用同一canonical公开payload与显式来源/唯一sourceVersion，不能只声明聚合字段子集或用activation表示撤权。
  delivery_semantics: transactional_outbox
  wire_event_type: PostModerationRejected
  payload_entity: PostLifecycleProjectionPayload
  payload_shape: exact
  payload_fields: [postId, authorId, contentType, status, visibility, moderationStatus, title, body, summary, semanticDocument, authorDisplayNameSnapshot, authorAvatarUrlSnapshot, mediaUrls, coverUrl, thumbnailUrl, videoUrl, width, height, durationMs, tagRefs, entityRefs, contentVertical, createdAt, publishedAt, updatedAt, publishIntentId, localDraftId, contentDigest, assistantUsePolicy, coverStrategy, coverFrameTimeMs, likeCount, commentCount, shareCount, mediaItems, semanticMentions, primaryHomepageId, primaryHomepageSnapshot, visitedAt, gatheringRef, captureDisclosure, sourcePostId, sourcePostAuthorId, contentId, contentVersion, variantPurpose, usageScope, environment, sourceOwner, releaseId, releaseDigest, manifestDigest, sourceVersion, safetyRevision]
- name: PostUpdated
  description: PostService projectionPayloadForPost产生的完整公开更新快照。 内容更新；携带 Circle/Search/Recommendation 可重建读投影所需的当前公开 Post 快照。现有 width/height 遵循 fields.yaml#width 主媒体规则；替换/移除或缺尺寸时完整快照同时清空两维，禁止省略保留旧尺寸。
  delivery_semantics: transactional_outbox
  wire_event_type: PostUpdated
  payload_entity: PostLifecycleProjectionPayload
  payload_shape: exact
  payload_fields: [postId, authorId, contentType, status, visibility, moderationStatus, title, body, summary, semanticDocument, authorDisplayNameSnapshot, authorAvatarUrlSnapshot, mediaUrls, coverUrl, thumbnailUrl, videoUrl, width, height, durationMs, tagRefs, entityRefs, contentVertical, createdAt, publishedAt, updatedAt, publishIntentId, localDraftId, contentDigest, assistantUsePolicy, coverStrategy, coverFrameTimeMs, likeCount, commentCount, shareCount, mediaItems, semanticMentions, primaryHomepageId, primaryHomepageSnapshot, visitedAt, gatheringRef, captureDisclosure, sourcePostId, sourcePostAuthorId, contentId, contentVersion, variantPurpose, usageScope, environment, sourceOwner, releaseId, releaseDigest, manifestDigest, sourceVersion, safetyRevision]
- name: PostSettingsUpdated
  description: 设置变更使用同一projectionPayloadForPost，保留Homepage/媒体/引用及权限字段。 发布后可变设置更新（可见性 / 小趣排除 / Homepage 引用）；现有 width/height 仍携带同一当前 Post 完整快照，遵循 fields.yaml#width 的 image/video 主媒体身份、成对正数及同时清空规则。
  delivery_semantics: transactional_outbox
  wire_event_type: PostSettingsUpdated
  payload_entity: PostLifecycleProjectionPayload
  payload_shape: exact
  payload_fields: [postId, authorId, contentType, status, visibility, moderationStatus, title, body, summary, semanticDocument, authorDisplayNameSnapshot, authorAvatarUrlSnapshot, mediaUrls, coverUrl, thumbnailUrl, videoUrl, width, height, durationMs, tagRefs, entityRefs, contentVertical, createdAt, publishedAt, updatedAt, publishIntentId, localDraftId, contentDigest, assistantUsePolicy, coverStrategy, coverFrameTimeMs, likeCount, commentCount, shareCount, mediaItems, semanticMentions, primaryHomepageId, primaryHomepageSnapshot, visitedAt, gatheringRef, captureDisclosure, sourcePostId, sourcePostAuthorId, contentId, contentVersion, variantPurpose, usageScope, environment, sourceOwner, releaseId, releaseDigest, manifestDigest, sourceVersion, safetyRevision]
- name: PostDeleted
  description: 仅owner权威删除，DeletePost原授权不变，status是删除前状态；Data release退出不产生此事件。显式来源/唯一sourceVersion由专属payload约束，删除失效覆盖同来源canonical对象全部保留候选，不能以release切换复活。
  delivery_semantics: transactional_outbox
  wire_event_type: PostDeleted
  payload_entity: PostDeletedPayload
  payload_shape: exact
  payload_fields: [postId, authorId, contentType, status, deletedAt, environment, sourceOwner, releaseId, manifestDigest, releaseDigest, sourceVersion, safetyRevision]
- name: PostPrivacyRedacted
  description: 隐私脱敏完成的现行专属协议，尚缺producer运行证明。
  delivery_semantics: transactional_outbox
  wire_event_type: PostPrivacyRedacted
  payload_entity: PostPrivacyRedactedPayload
  payload_shape: exact
  payload_fields: [postId, sourceVersion, safetyRevision, redactedAt, retentionExpiresAt, environment, sourceOwner, releaseId, manifestDigest, releaseDigest]
- name: PostPurged
  description: 最终清除的现行专属协议，尚缺producer运行证明。
  delivery_semantics: transactional_outbox
  wire_event_type: PostPurged
  payload_entity: PostPurgedPayload
  payload_shape: exact
  payload_fields: [postId, sourceVersion, safetyRevision, purgedAt, environment, sourceOwner, releaseId, manifestDigest, releaseDigest]
- name: PostImported
  description: 签名不可变Data release的导入事实。
  delivery_semantics: transactional_outbox
  wire_event_type: PostImported
  payload_entity: Post
  payload_fields: [postId, postVersion, sourceReleaseId, idempotencyKey, signatureKeyId, importedAt]
