aggregate: Post
domain: CONTENT
description: 'Post 对象与 content 域共享的结构化错误码声明。格式：MODULE.KIND.REASON。

  对象专属错误码位于各对象目录（comment、media_asset、media_original_access_fact、

  report、post_moderation_case 的 errors.yaml）；codegen 与端云 parity 门禁按

  content 域固定文件列表合并生成 Dart ContentErrorCode enum + Go errors.go，

  合并时 code 必须全域唯一。CloudErrorMapper 解析 response body "code" 字段。

  '
errors:
- code: CONTENT.USER.post_not_found
  kind: USER
  reason: not_found
  http_status: 404
  recovery_action: surface
  dart_const: postNotFound
  go_const: ErrPostNotFound
  user_message:
    zh: 内容不存在或已删除
    en: Post not found or deleted
- code: CONTENT.USER.forbidden_edit
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: forbiddenEdit
  go_const: ErrForbiddenEdit
  user_message:
    zh: 无权编辑此内容
    en: Not allowed to edit this post
- code: CONTENT.USER.forbidden_delete
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: forbiddenDelete
  go_const: ErrForbiddenDelete
  user_message:
    zh: 无权删除此内容
    en: Not allowed to delete this post
- code: CONTENT.USER.unauthorized
  kind: USER
  reason: unauthorized
  http_status: 401
  recovery_action: surface
  dart_const: unauthorized
  go_const: ErrUnauthorized
  user_message:
    zh: 请先登录
    en: Please sign in to continue
- code: CONTENT.USER.invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 请求参数有误，请检查后重试
    en: Invalid request, please check and retry
- code: CONTENT.USER.interaction_type_invalid
  kind: USER
  reason: interaction_type_invalid
  http_status: 400
  recovery_action: surface
  dart_const: interactionTypeInvalid
  go_const: ErrInteractionTypeInvalid
  user_message:
    zh: 不支持的互动类型
    en: Unsupported interaction type
- code: CONTENT.USER.interaction_cursor_invalid
  kind: USER
  reason: interaction_cursor_invalid
  http_status: 400
  recovery_action: refresh
  dart_const: interactionCursorInvalid
  go_const: ErrInteractionCursorInvalid
  user_message:
    zh: 列表状态已更新，请刷新后重试
    en: The list changed, refresh and retry
- code: CONTENT.USER.interaction_owner_forbidden
  kind: USER
  reason: interaction_owner_forbidden
  http_status: 403
  recovery_action: surface
  dart_const: interactionOwnerForbidden
  go_const: ErrInteractionOwnerForbidden
  user_message:
    zh: 无权查看该互动记录
    en: You cannot view this interaction history
- code: CONTENT.SYSTEM.interaction_read_model_unavailable
  kind: SYSTEM
  reason: interaction_read_model_unavailable
  http_status: 503
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: interactionReadModelUnavailable
  go_const: ErrInteractionReadModelUnavailable
  user_message:
    zh: 互动记录暂时不可用，请稍后重试
    en: Interaction history is temporarily unavailable
- code: CONTENT.USER.assistant_mention_context_missing
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: assistantMentionContextMissing
  go_const: ErrAssistantMentionContextMissing
  user_message:
    zh: 小趣暂时无法识别这条评论的上下文
    en: Xiaoqu cannot resolve this comment context yet
- code: CONTENT.USER.invalid_content_type
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: invalidContentType
  go_const: ErrInvalidContentType
  user_message:
    zh: 不支持的内容类型
    en: Unsupported content type
- code: CONTENT.USER.rate_limited
  kind: USER
  reason: rate_limited
  http_status: 429
  recovery_action: retry
  recovery_after_seconds: 60
  dart_const: rateLimited
  go_const: ErrRateLimited
  user_message:
    zh: 操作太频繁，请稍后重试
    en: Too many requests, please retry later
- code: CONTENT.USER.content_too_long
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: contentTooLong
  go_const: ErrContentTooLong
  user_message:
    zh: 内容超出长度限制
    en: Content exceeds length limit
- code: CONTENT.USER.publication_rejected
  kind: USER
  reason: publication_rejected
  http_status: 422
  recovery_action: surface
  dart_const: publicationRejected
  go_const: ErrPublicationRejected
  user_message:
    zh: 内容未通过发布安全检查，请修改后重试
    en: Content did not pass publication safety checks
- code: CONTENT.USER.post_immutable_after_publish
  kind: USER
  reason: forbidden
  http_status: 409
  recovery_action: surface
  dart_const: postImmutableAfterPublish
  go_const: ErrPostImmutableAfterPublish
  user_message:
    zh: 内容发布后不可修改
    en: Published content is immutable
- code: CONTENT.USER.public_required_for_circle_distribution
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: publicRequiredForCircleDistribution
  go_const: ErrPublicRequiredForCircleDistribution
  user_message:
    zh: 发布到圈子前需设置为公开
    en: Post must be public before distributing to circles
- code: CONTENT.USER.invalid_moment_payload
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: invalidMomentPayload
  go_const: ErrInvalidMomentPayload
  user_message:
    zh: 微趣内容为空，正文/图片/视频至少填写一项
    en: Moment payload is empty; at least body/image/video is required
- code: CONTENT.USER.version_conflict
  kind: USER
  reason: version_conflict
  http_status: 409
  recovery_action: refresh
  dart_const: versionConflict
  go_const: ErrVersionConflict
  user_message:
    zh: 内容已更新，请刷新后重试
    en: Content changed, refresh and retry
- code: CONTENT.USER.idempotency_conflict
  kind: USER
  reason: idempotency_conflict
  http_status: 409
  recovery_action: refresh
  dart_const: idempotencyConflict
  go_const: ErrIdempotencyConflict
  user_message:
    zh: 重复请求与原操作不一致，请刷新后重试
    en: The repeated request differs from the original operation
- code: CONTENT.USER.circle_distribution_forbidden
  kind: USER
  reason: forbidden
  http_status: 403
  recovery_action: surface
  dart_const: circleDistributionForbidden
  go_const: ErrCircleDistributionForbidden
  user_message:
    zh: 无权修改圈子分发关系
    en: Not allowed to modify circle distribution
- code: CONTENT.SYSTEM.storage_write_failed
  kind: SYSTEM
  reason: storage_write_failed
  http_status: 500
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: storageWriteFailed
  go_const: ErrStorageWriteFailed
  user_message:
    zh: 操作失败，请稍后重试
    en: Operation failed, please retry
- code: CONTENT.SYSTEM.storage_read_failed
  kind: SYSTEM
  reason: storage_read_failed
  http_status: 500
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: storageReadFailed
  go_const: ErrStorageReadFailed
  user_message:
    zh: 读取内容失败，请稍后重试
    en: Unable to read content, please retry
- code: CONTENT.SYSTEM.required_dependency_unavailable
  kind: SYSTEM
  reason: required_dependency_unavailable
  http_status: 503
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: requiredDependencyUnavailable
  go_const: ErrRequiredDependencyUnavailable
  user_message:
    zh: 内容服务依赖暂时不可用，请稍后重试
    en: A required content dependency is unavailable
- code: CONTENT.SYSTEM.internal_error
  kind: SYSTEM
  reason: internal_error
  http_status: 500
  recovery_action: surface
  dart_const: internalError
  go_const: ErrInternalError
  user_message:
    zh: 服务异常，请稍后重试
    en: Service error, please try again later
- code: CONTENT.MIDDLEWARE.upstream_timeout
  kind: MIDDLEWARE
  reason: timeout
  http_status: 504
  recovery_action: retry
  recovery_after_seconds: 10
  dart_const: upstreamTimeout
  go_const: ErrUpstreamTimeout
  user_message:
    zh: 内容服务响应超时，请稍后重试
    en: The content service timed out, please try again later
