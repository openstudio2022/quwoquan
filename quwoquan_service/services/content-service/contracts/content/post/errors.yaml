description: 'Post 对象与 content 域共享的结构化错误码声明。格式：MODULE.KIND.REASON。

  对象专属错误码位于各对象目录（comment、media_asset、original_access_quota、

  report、post_moderation_case 的 errors.yaml）；codegen 与端云 parity 门禁按

  content 域固定文件列表合并生成 Dart ContentErrorCode enum + Go errors.go，

  合并时 code 必须全域唯一。CloudErrorMapper 解析 response body "code" 字段。

  '
errors:
- code: CONTENT.USER.content_deleted
  reason: content_deleted
  http_status: 410
  emitted_by:
  - surface: http
    operations: [GetPost]
  - surface: graphql
    operations: [GetPostSemantic, GetPostMedia, GetPostArticleRenderAssets, GetPostArticleEntities]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: contentDeleted
  go_const: ErrContentDeleted
  user_message:
    zh: 内容已删除
    en: Content has been deleted
- code: CONTENT.USER.post_not_found
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [GetPost, DeletePost, UpdatePostSettings, PromotePostToWork, GetCounters, GetHelperRead, content.comment.CreateComment]
  - surface: graphql
    operations: [GetPostSemantic, GetPostMedia, GetPostArticleRenderAssets, GetPostArticleEntities]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: postNotFound
  go_const: ErrPostNotFound
  user_message:
    zh: 内容不存在或已删除
    en: Post not found or deleted
- code: CONTENT.USER.forbidden_edit
  reason: forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations: [SubmitPostPublication, UpdatePostSettings, PromotePostToWork]
  recovery_action: surface
  disruption_level: inlineCard
