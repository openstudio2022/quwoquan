query ContentPostDetailMedia($postId: ID!, $mediaFirst: Int! = 20) {
  contentPostDetailMedia(postId: $postId) {
    postId
    contentType
    mediaAssetIds(first: $mediaFirst)
    mediaUrls(first: $mediaFirst)
    mediaItems(first: $mediaFirst) {
      kind
      mediaAssetId
      mediaAssetVersion
      accessMode
      coverAssetId
      url
      coverUrl
      durationMs
      width
      height
      previewTrackManifestUrl
      previewTrackVersion
      hlsCmafMasterManifestUrl
      hlsCmafDescriptorVersion
      title
      caption
    }
    thumbnailUrl
    videoUrl
    width
    height
    durationMs
    coverStrategy
    coverFrameTimeMs
  }
}
