query ContentPostDetailBase($postId: ID!, $modificationsFirst: Int! = 4) {
  contentPostDetailBase(postId: $postId) {
    postId
    contentType
    contentIdentity
    assistantUsePolicy
    authorId
    authorDisplayName
    authorAvatarUrl
    authorAvatarAssetId
    authorAvatarAccessMode
    title
    body
    summary
    coverUrl
    sourceAttribution {
      isOriginal
      originalCreatorId
      originalCreatorName
      originalCreatorProfileUrl
      platform
      sourcePostUrl
      originalAssetUrl
      attributionText
      rightsBasis
      commercialAuthorizationStatus
      publicationAdmission
      authorizationProofUrl
      termsUrl
      derivedModifications(first: $modificationsFirst)
      watermarkKind
      watermarkNote
      watermarkStatus
      audioRightsStatus
      modelReleaseStatus
      propertyReleaseStatus
      collectedAt
      takedownPolicy
    }
    location {
      latitude
      longitude
    }
    locationName
    geoTagRef
    visitedAt
    primaryHomepageId
    canonicalEntityId
    primaryHomepageType
    primaryHomepageSnapshot {
      canonicalEntityId
      title
      subtitle
      coverUrl
    }
    status
    visibility
    gatheringRef
    likeCount
    commentCount
    shareCount
    viewCount
    viewerLiked
    createdAt
    updatedAt
    publishedAt
  }
}
