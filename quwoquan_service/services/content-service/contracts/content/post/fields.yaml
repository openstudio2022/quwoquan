      在具名 previous-version public migration adapter 边界适配。public 时 url/coverUrl 为
      canonical public slice；signed_grant 时字段存 release authority 的相对私有
      引用，mediaAssetId 必须在场，App 经 ReserveOriginalImageAccessGrant 换取
      短时签名 URL。private HLS（m3u8/mpd/manifest）当前 unsupported 并 fail closed
