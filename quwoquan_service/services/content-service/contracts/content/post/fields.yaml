description: 内容主体（聚合根）
fields:
  - name: _id
    source: _id
    type: ObjectId
    constraints:
      - PK
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: version
    source: version
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: Post 乐观并发版本；每次聚合提交原子递增
    role: authoritative_state
  - name: publishIntentId
    source: publishIntentId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    description: 本地草稿唯一的一次性发布意图；服务端据此永久识别同一次发布
    role: authoritative_state
  - name: localDraftId
    source: localDraftId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    description: 创建该 Post 的端侧本地草稿稳定标识；用于永久阻止同一草稿重复创建
    role: authoritative_state
  - name: authorId
    source: authorId
    type: string
    max_utf8_bytes: 128
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 作者稳定公开主体 ID（personaId）
    role: authoritative_state
    reference: true
  - name: creatorProfileId
    source: creatorProfileId
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 平台创作者画像 ID；系统作者内容必须存在，不写入标签或实体主树
    role: authoritative_state
    reference: true
  - name: creatorArchetype
    source: creatorArchetype
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 作者类型，如 travel_blogger / landscape_photographer / campus_blogger
    role: authoritative_state
  - name: creatorProfileVersion
    source: creatorProfileVersion
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 写入内容时绑定的作者画像版本
    role: authoritative_state
  - name: creatorDisclosure
    source: creatorDisclosure
    type: PostCreatorDisclosure
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 用户可见的虚拟创作者披露信息
    role: owned_value
  - name: sourceAttribution
    source: sourceAttribution
    type: SourceAttribution
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: metadata_only
    api_exposure: read
    ops_exposure: read
    description: 外部来源视频的原创者、来源、权利事实与下架策略；平台发布作者不得覆盖该字段
    role: owned_value
  - name: experienceClaimMode
    source: experienceClaimMode
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 经验声明模式，默认 editorial_synthesis，禁止伪真实亲历
    role: authoritative_state
  - name: authorQualitySignals
    source: authorQualitySignals
    type: PostAuthorQualitySignals
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    recommend_feature: true
    description: 作者质量、疲劳度、风险等级等推荐与调度信号
    role: projection
  - name: authorDisplayNameSnapshot
    source: authorDisplayNameSnapshot
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 作者显示名快照，避免分身退役或改名后记录渲染漂移
    role: authoritative_state
  - name: authorAvatarUrlSnapshot
    source: authorAvatarUrlSnapshot
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 作者头像快照
    role: authoritative_state
  - name: personaContextVersion
    source: personaContextVersion
    type: int
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 写入时绑定的 persona 上下文版本
    role: authoritative_state
  - name: contentType
    source: contentType
    type: enum
    enum_ref: ContentType
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    role: authoritative_state
  - name: title
    source: title
    type: string
    max_utf8_bytes: 320
    constraints:
      - NULLABLE
      - MAX_LENGTH_80
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    recommend_feature: true
    search_field: true
    description: 标题（文章必填，其他可选）
    role: authoritative_state
  - name: body
    source: body
    type: string
    constraints:
      - NULLABLE
      - MAX_LENGTH_5000
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    search_field: true
    role: authoritative_state
  - name: tagRefs
    source: tagRefs
    type: '[]string'
    max_items: 30
    item_max_utf8_bytes: 256
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    tag_ref: true
    description: 只读活动投影；仅由 semanticMentions 中 status=published 且 targetRef 合法的 tag mention 派生
    role: projection
  - name: entityRefs
    source: entityRefs
    type: '[]string'
    max_items: 30
    item_max_utf8_bytes: 256
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    recommend_feature: true
    description: 只读活动投影；仅由 semanticMentions 中 status=published 且 targetRef 合法的 entity mention 派生
    role: projection
  - name: semanticMentions
    source: semanticMentions
    type: '[]PostSemanticMention'
    constraints:
      - NULLABLE
      - MAX_ITEMS_30
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: '标题/正文/文章中的语义标注事实：

      [{mentionId,kind,surface,location,rangeStart,rangeEnd,status,candidateId,targetRef}]。

      status 支持 published/pending_review/rejected/offline；只有 published 且 targetRef 合法的项进入活动 entityRefs/tagRefs。

'
    role: owned_value
  - name: mediaAssetIds
    source: mediaAssetIds
    type: '[]string'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 有序 MediaAsset ID 引用；仅 `SubmitPostPublication` 在完成所有权、就绪态与公开 slice 物化后写入，Post 不内嵌媒体对象。
    role: authoritative_state
    reference: true
  - name: mediaUrls
    source: mediaUrls
    type: '[]string'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端由已绑定 MediaAsset 投影的 canonical public slice key 序列；App 不得持久化上传响应中的 cdnUrl、签名 URL 或 CAS object key。
    role: projection
  - name: mediaItems
    source: mediaItems
    type: '[]PostMediaItem'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: '服务端由已绑定 MediaAsset 投影的统一媒体序列（Work Browser 真相源）：[{kind:image|video, url, coverUrl?, durationMs?, width?, height?, title?}]。

      视频集（一个作品多段视频）唯一契约表达；禁止端侧按同作者从队列临时拼集合。

      为空时端按 mediaUrls/videoUrl 派生单一序列。

'
    role: projection
  - name: coverUrl
    source: coverUrl
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 跨内容类型的通用封面公开交付引用；服务端从已绑定封面 MediaAsset 或视频首帧投影，禁止 App 写入 cdnUrl、签名 URL 或内部 object key。视频未提供 thumbnailUrl 时，只允许使用同一 Post/MediaAsset 的 coverUrl 作为第二展示优先级。
    role: projection
  - name: thumbnailUrl
    source: thumbnailUrl
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 视频未播放态专属主封面公开交付引用；服务端从已绑定封面 MediaAsset 或视频首帧投影，默认首帧，手工选帧时覆盖。存在时展示优先级高于通用 coverUrl；UI mapper 须转为 typed MediaDeliveryReference。
    role: projection
  - name: articleMarkdown
    source: articleMarkdown
    type: string
    constraints:
      - NULLABLE
      - MAX_LENGTH_20000
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    search_field: true
    description: QWQ Rich Markdown 原文，文章长文唯一持久化真相源
    role: authoritative_state
  - name: markdownDialect
    source: markdownDialect
    type: enum
    enum_ref: SemanticDocumentMarkdownDialect
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: Markdown dialect 闭集；当前仅允许 qwq-rich-md，版本语义由共享 semantic_document.yaml 的 dialectVersion 定义
    role: authoritative_state
  - name: semanticDocument
    source: semanticDocument
    type: semantic_document
    go_type_ref: semantic_document.DocumentEnvelope
    go_import: quwoquan_service/services/content-service/generated/content/post/semantic_document
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: metadata_only
    api_exposure: read_write
    ops_exposure: read
    description: canonical semantic document 自包含强类型 AST；新文章 publish/promote 必填，完整 envelope 校验并重算 canonicalDigest，历史记录仅允许只读缺席。
    role: authoritative_state
  - name: articleMarkdownDigest
    source: articleMarkdownDigest
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 规范化 articleMarkdown 的 sha256 digest，用于幂等、缓存与审计
    role: authoritative_state
  - name: articleAssetManifest
    source: articleAssetManifest
    type: PostArticleAssetManifest
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 文章素材清单，正文 asset:// 引用必须存在于该 manifest
    role: owned_value
  - name: articleRenderProfile
    source: articleRenderProfile
    type: PostArticleRenderProfile
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: '文章渲染画像。作品浏览器消费字段：

      template/fontPreset、paperThemeMode(system|manual)、paperTexture

      (darkPaper|coolGray|warmBlack|inkGreen|deepBrown)、contentVertical

      (photography|travel|history|tech|nature)。

      旧模板只保留为版心/排版气质输入，不再决定浏览器默认纸张亮度。

'
    role: owned_value
  - name: contentVertical
    source: contentVertical
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    recommend_feature: true
    description: 内容垂类：photography/travel/history/tech/nature 等；Work Browser 文章纸张系统适配的唯一垂类输入。
    role: authoritative_state
  - name: entityMentions
    source: entityMentions
    type: '[]PostEntityMention'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 文章行内实体标签列表 [{subjectType,subjectId,homepageId,displayName,rangeStart,rangeEnd}]，由 QWQ Rich Markdown 派生并由实体投影解析 canonical Homepage。
    role: projection
  - name: articleTemplate
    source: articleTemplate
    type: enum
    enum_ref: ArticleTemplatePreset
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 从 articleRenderProfile.template 派生的文章模板只读快照
    role: projection
  - name: articleFontPreset
    source: articleFontPreset
    type: enum
    enum_ref: ArticleFontPreset
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 从 articleRenderProfile.fontPreset 派生的文章字体预设只读快照
    role: projection
  - name: videoUrl
    source: videoUrl
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 服务端从已绑定视频 MediaAsset 投影的 canonical public slice key；禁止 App 写入 cdnUrl、签名 URL 或内部 CAS/object key。端侧播放器只消费经 MediaDeliveryResolver 校验后的 MediaDeliveryReference。
    role: projection
  - name: width
    source: width
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端从 ready MediaAsset 投影的权威视频宽度（px）。
    role: projection
  - name: height
    source: height
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端从 ready MediaAsset 投影的权威视频高度（px）。
    role: projection
  - name: durationMs
    source: durationMs
    type: int
    constraints:
      - NULLABLE
      - POSITIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端从 ready MediaAsset verifiedDurationMs 投影的权威视频时长（毫秒）。
    role: projection
  - name: coverStrategy
    source: coverStrategy
    type: enum
    enum_ref: MediaCoverStrategy
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 视频封面策略。first_frame 表示首帧派生；manual 表示用户手工选帧或手工封面资产
    role: projection
  - name: coverFrameTimeMs
    source: coverFrameTimeMs
    type: int
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 视频封面帧时间点（毫秒）。默认首帧为 0；用于审计和重新派生封面
    role: projection
  - name: location
    source: location
    type: GeoPoint
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    recommend_feature: true
    role: owned_value
  - name: locationName
    source: locationName
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    recommend_feature: true
    search_field: true
    role: projection
  - name: geoTagRef
    source: geoTagRef
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    recommend_feature: true
    tag_ref: true
    description: 发布定位归属的行政区标签（Topic/地理/行政区/... 路径制 tagRef），由端侧 POI 选点或已披露的拍摄地 GPS 解析得到。与 location/locationName 不同，它是可召回、可交集的 行政区事实，不承载精确坐标；未选位置或解析失败时为空，不臆造。
    role: owned_value
  - name: visitedAt
    source: visitedAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    recommend_feature: true
    description: 作者声明的实际到访时间（出行时间），与 publishedAt/createdAt 正交：游记可以在 出行数月后发布。与 geoTagRef 组成「带定位发布」这一可证到访事实，供旅游时间维度交集 （同地同期到访）消费。未声明即为空，禁止用 publishedAt/createdAt 顶替，也不得取未来时间 （计划出行不是到访）。
    role: owned_value
  - name: captureDisclosure
    source: captureDisclosure
    type: '[]enum'
    enum_ref: CaptureDisclosureGroup
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 作者确认披露的拍摄事实分组闭集，只允许 CaptureDisclosureGroup；服务端按该闭集投影或撤回器材、参数、地点与时间派生子树。
    role: authoritative_state
  - name: captureFeatureRefs
    source: captureFeatureRefs
    type: '[]string'
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: metadata_only
    api_exposure: drop
    ops_exposure: read
    recommend_feature: true
    description: 服务端从已披露 MediaAsset 拍摄事实派生的内部推荐/解释特征；禁止进入可见交集文案、搜索筛选、Creator chip 或 App wire。
    role: projection
  - name: primaryHomepageId
    source: primaryHomepageId
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 内容绑定的 canonical 共享主页 ID
    role: authoritative_state
    reference: true
  - name: gatheringRef
    source: gatheringRef
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    recommend_feature: true
    description: 作者主动关联的 canonical Gathering ID（共同经历回流引用）。只在作者创作时显式选择 「发布到这次共同经历」后写入；服务端必须校验作者在该 Gathering 持有有效 Participation 后才接受，校验不成立 fail-closed。与 sourcePostId 方向相反：source 表达内容从哪来，gatheringRef 表达内容回流到哪次共同行动。为空即普通内容；作者删除或取消关联不影响内容本身的所有权与可见性。消费方：行动详情共同经历聚合、个人主页经历资产区、recommendation 的 coExperiencedGathering 交集事实与四锚点社会证明计数（经历级）。Gathering 不因此成为新的 Post 类型。
    role: authoritative_state
  - name: primaryHomepageType
    source: primaryHomepageType
    type: enum
    enum_ref: HomepageType
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 绑定主页的类型快照
    role: projection
  - name: primaryHomepageSnapshot
    source: primaryHomepageSnapshot
    type: PostHomepageSnapshot
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 绑定主页的轻量快照（标题、副标题、封面）
    role: owned_value
  - name: status
    source: status
    type: enum
    enum_ref: PostStatus
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    observe_metric: post_status_gauge
    role: authoritative_state
  - name: visibility
    source: visibility
    type: enum
    enum_ref: Visibility
    constraints:
      - NOT_NULL
      - DEFAULT_PUBLIC
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: assistantUsePolicy
    source: assistantUsePolicy
    type: enum
    enum_ref: AssistantUsePolicy
    constraints:
      - NOT_NULL
      - DEFAULT_INHERIT
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 小趣内容消费策略。inherit=遵循全局授权，exclude=排除当前内容
    role: authoritative_state
  - name: sourcePostId
    source: sourcePostId
    type: ObjectId
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 转发/引用来源 postId
    role: authoritative_state
    reference: true
  - name: sourceType
    source: sourceType
    type: enum
    enum_ref: PostSourceType
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: original/repost/quote（记录数据可为空，读取时按 original 处理）
    role: authoritative_state
  - name: summary
    source: summary
    type: string
    constraints:
      - NULLABLE
      - MAX_LENGTH_240
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 文章摘要（模型生成后可人工编辑）
    role: authoritative_state
  - name: illustrationAssetId
    source: illustrationAssetId
    type: ObjectId
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 文章插图媒体 ID（可选，最多 1 张）
    role: authoritative_state
    reference: true
  - name: publishLocation
    source: publishLocation
    type: PostPublishLocation
    constraints:
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: read
    ops_exposure: read
    description: 发布位置（国家/省/市，来自 IP 归属）
    role: owned_value
  - name: deviceInfo
    source: deviceInfo
    type: PostDeviceInfo
    constraints:
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: read
    ops_exposure: read
