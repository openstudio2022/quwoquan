types:
  PostSafetyRuntimeAuthorization:
    description: 环境authority对唯一初始化动作的强类型签名授权。Prod/prod-hosted签发始终是仓外正式前驱，本仓只验签，绝不自签或fallback；唯一例外是gamma-local target-owned冷启动producer可复用仓库现役local-managed Environment Ops Ed25519私钥 provisioning 与仓内keyring签发，且必须先以真实provider读回生成独立account-closure subject key、九集合闭包及现役source-allocation current，其他target不得使用该producer。签名覆盖除signature外全部字段的canonical JSON经固定DSSE PAE；environment/target/candidate/data-plane/startup attempt/runtime generation及evidencePredecessor逐项绑定，action只能initialize_post_safety_runtime，issuedAt仅审计且不得替代generation防重放。
    fields:
      - {name: environment, type: enum, values: [alpha, beta, gamma], constraints: [NOT_NULL]}
      - {name: target, type: string, constraints: [NOT_BLANK]}
      - {name: candidateDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: dataPlaneBindingDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: startupAttemptId, type: string, constraints: [NOT_BLANK]}
      - {name: runtimeGeneration, type: string, constraints: [NOT_BLANK]}
      - {name: action, type: enum, values: [initialize_post_safety_runtime], constraints: [NOT_NULL]}
      - {name: issuedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: authorityIdentity, type: string, constraints: [NOT_BLANK]}
      - {name: evidencePredecessor, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL]}
      - {name: signature, type: string, constraints: [NOT_BLANK]}
  PostSafetyRuntimeBinding:
    description: Post安全runtime的唯一部署身份值，非release activation状态。candidateDigest取现役部署candidate摘要，dataPlaneBindingDigest取其canonical bindingDigest；resourceRef/namespace取content Mongo绑定，physicalInstanceId取受管创建流程独占分配并由挂载/数据库连接实测核验的存储实例身份，禁止取可复用地址或进程PID。runtimeGeneration是环境owner在独占创建/恢复切换中分配的不可复用标识，不是Post sourceVersion或Content revision；同一物理安全空间普通进程重启不另分配。
    fields:
      - {name: environment, type: enum, values: [alpha, beta, gamma, prod], constraints: [NOT_NULL]}
      - {name: target, type: string, constraints: [NOT_BLANK]}
      - {name: candidateDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: dataPlaneBindingDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: resourceRef, type: string, constraints: [NOT_BLANK]}
      - {name: namespace, type: string, constraints: [NOT_BLANK]}
      - {name: physicalInstanceId, type: string, constraints: [NOT_BLANK]}
      - {name: runtimeGeneration, type: string, constraints: [NOT_BLANK]}
      - {name: hmacKeyIdentity, type: string, format: canonical_sha256, constraints: [NOT_NULL], description: SHA256域分隔固定challenge的HMAC结果，resolver从专用至少32随机字节密钥重算；不是secret locator的摘要，不输出密钥本身，不授予权限。}
  PostSafetyRuntimeEvidence:
    description: 受管动作产生的不可变非PII证据引用。ref只允许在当前受保护target evidence根内的相对文件，digest为exact文件bytes SHA256；ref与digest均required。拥有写权不等于内容已核验，consumer必须严格解析被引用的现役创建/备份/恢复事实并回读实际实例；不能仅校验hash或接受restoreVerified=true。
    fields:
      - {name: ref, type: string, constraints: [NOT_BLANK]}
      - {name: digest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  PostSafetyRuntimeClosure:
    description: 初始开放前的完整恢复闭包摘要。safety覆盖post_safety_states全量排序canonical记录，含终止记录且无TTL；accountClosure覆盖现役主体关闭事实及其本地投影已追齐水位。recordCount可为零仅当受管新实例创建证明和真实读回均证零。watermark为该owner冻结写入后读出的opaque checkpoint，不是caller时间或空字符串；非生产新owner空间用创建证据摘要作为初始水位，不凭空声称既有User关闭authority为零。多分区水位由ownerEvidence指向的完整闭包表达，不能截取最大值。
    fields:
      - {name: kind, type: enum, values: [post_safety, account_closure], constraints: [NOT_NULL]}
      - {name: recordCount, type: int64, min: 0, constraints: [NOT_NULL]}
      - {name: canonicalDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: watermark, type: string, constraints: [NOT_BLANK]}
      - {name: ownerEvidence, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL], description: account_closure必须引用content/content_account_closure_workflow/fields.yaml唯一声明的ContentAccountClosureRuntimeEvidence；由该owner严格解析并核验集合UUID、源创建或追齐位置、独立主体key及当前绑定。外层count/digest必须等于该证据recordCount/canonicalDigest，watermark取该证据exact bytes digest。Post不复制其schema，不用PostSafetyRuntimeCreationReceipt或两份相同hash冒充主体闭包；post_safety仍引用本Post创建/恢复读回。}
  PostSafetyRuntimeCreationReceipt:
    description: 环境owner受管创建流程的具体readback格式，由Post同源生成；不是任意caller附件。创建时目标namespace/volume必须是本次独占创建，既存实例不得补发new凭证。physicalAllocationId为provider真实分配身份，allocationAttemptId对应现役target startup attempt；从当前candidate和实际provider读取而非请求自述。审批只决定能否开始，openedForBusinessAt不在此事实中，创建事实不声称服务ready。
    fields:
      - {name: binding, type: PostSafetyRuntimeBinding, constraints: [NOT_NULL]}
      - {name: allocationAttemptId, type: string, constraints: [NOT_BLANK]}
      - {name: physicalAllocationId, type: string, constraints: [NOT_BLANK]}
      - {name: namespaceReadback, type: string, constraints: [NOT_BLANK]}
      - {name: initialSafetyRecordCount, type: int64, min: 0, constraints: [NOT_NULL]}
      - {name: initialSafetyCanonicalDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: allocatedAt, type: timestamp, constraints: [NOT_NULL]}
  PostSafetyRuntimeRecoveryReceipt:
    description: 现役隔离恢复流程补出的Post owner精确读回事实，不代替原backup/recovery receipt或新建ledger。必须停写后完整读取source与target闭包，引用原备份plan及receipt并验证其成员归属；两闭包逐kind的count/digest/watermark一致才可产出，不能把原readback boolean转为此事实。原安全日志追齐后冻结的水位必须来自owner事实而非仅业务备份；缺源不能声明零。
    fields:
      - {name: previousBinding, type: PostSafetyRuntimeBinding, constraints: [NOT_NULL]}
      - {name: binding, type: PostSafetyRuntimeBinding, constraints: [NOT_NULL]}
      - {name: backupPlan, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL]}
      - {name: backupReceipt, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL]}
      - {name: sourceClosures, type: '[]PostSafetyRuntimeClosure', max_items: 2, constraints: [NOT_NULL]}
      - {name: restoredClosures, type: '[]PostSafetyRuntimeClosure', max_items: 2, constraints: [NOT_NULL]}
      - {name: completedAt, type: timestamp, constraints: [NOT_NULL]}
  PostSafetyRuntimeFact:
    description: 本Post owner唯一安全runtime开放事实格式，环境owner受管动作生产，Content只读验证；不新建业务对象、HTTP command或Mongo collection。mode仅区分真实创建和恢复动作，无协议版本分支；全部字段显式存在，条件不适用为null，未知字段拒绝。canonical摘要由配置中的当前绑定pin，不加自签字段；文件系统写权限为本地非生产信任根，跨主机复制不可继承可信。
    fields:
      - {name: mode, type: enum, values: [new_runtime, restored], constraints: [NOT_NULL]}
      - {name: binding, type: PostSafetyRuntimeBinding, constraints: [NOT_NULL]}
      - {name: authorization, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL], description: 现役环境owner动作授权引用，限定target及创建/恢复范围；Human意图只授权动作，不证明时钟/数据库完整性。}
      - {name: creation, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL], description: 指向PostSafetyRuntimeCreationReceipt，binding必须与本fact一致；恢复到独立实例也必须有此证明，new_runtime的initialSafetyRecordCount必须为0且摘要来自实测。}
      - {name: previousBinding, type: PostSafetyRuntimeBinding, constraints: [NULLABLE], description: new_runtime必须null，restored必须完整原物理安全空间身份；restored目标使用新runtimeGeneration且同hmacKeyIdentity。}
      - {name: recovery, type: PostSafetyRuntimeEvidence, constraints: [NULLABLE], description: new_runtime必须null；restored指向PostSafetyRuntimeRecoveryReceipt，前后binding和restoredClosures必须与本fact完全一致，备份计划或布尔receipt本身不充分。}
      - {name: closures, type: '[]PostSafetyRuntimeClosure', max_items: 2, constraints: [NOT_NULL], description: 必须恰好post_safety和account_closure各一项、按kind排序、无重复或缺项；restored两项均与恢复源及新实例readback完全相等。}
      - {name: recordedAt, type: timestamp, constraints: [NOT_NULL], description: 仅审计时间，不以时间或签名新鲜度替代current generation防重放。}
  PostSafetyRuntimeCurrentBinding:
    description: 现役target启动/运行材料中Post安全身份的窄绑定，不是第二发布pointer/状态机。仅环境owner在实例创建/恢复及受控部署切换时于既有target执行锁内比较前值并原子发布；Content只读。绑定文件与业务备份隔离且service只读挂载，缺失不从fact补造；旧fact和旧binding一起复制到新namespace仍须被实际实例及当前deployment candidate核验拒绝。
    fields:
      - {name: binding, type: PostSafetyRuntimeBinding, constraints: [NOT_NULL]}
      - {name: fact, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL]}
  PostSafetySecretRefDescriptor:
    description: deployment owner 声明的仓外受管秘密定位；secretRef仅为既有connection/secret factory的键名，不是秘密值，禁止输出解析后的原文。
    fields:
      - {name: secretRef, type: string, constraints: [NOT_BLANK]}
  PostSafetyMaterialRootLocator:
    description: deployment owner 从canonical target布局解析的exact material root；只能直接定位，不允许扫描目录、latest或从待验evidence反推。
    fields:
      - {name: path, type: string, constraints: [NOT_BLANK]}
  PostSafetySourceAllocationCurrentDescriptor:
    description: 现役source-allocation current的完整定位，allocationAttemptId、materialRoot及sourceCreation exact ref/digest必须来自同一deployment owner输入，并受本startup authorization predecessor约束。
    fields:
      - {name: allocationAttemptId, type: string, constraints: [NOT_BLANK]}
      - {name: materialRoot, type: PostSafetyMaterialRootLocator, constraints: [NOT_NULL]}
      - {name: sourceCreation, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL]}
  PostSafetyContentMongoAuthorityDescriptor:
    description: Content Mongo管理读回连接及数据库身份；secretRef仅交既有受管connection factory解析，database与namespace必须逐字相同且匹配data-plane binding。
    fields:
      - {name: admin, type: PostSafetySecretRefDescriptor, constraints: [NOT_NULL]}
      - {name: database, type: string, constraints: [NOT_BLANK]}
      - {name: namespace, type: string, constraints: [NOT_BLANK]}
  PostSafetyAccountClosureAuthorityDescriptor:
    description: deployment-control持有的单一accountClosureAuthority组合descriptor；全部成员绑定外层相同environment/target/candidateDigest/dataPlaneBindingDigest/startupAttemptId/runtimeGeneration。accountClosureEvidence及sourceCreation均为exact ref/digest，material root为canonical locator；所有credential只以relative secretRef交受管factory解析，原文不得进入plan、日志或evidence。若source writer尚未提供descriptor，本值只能由deployment owner显式输入且authorization.evidencePredecessor必须等于accountClosureEvidence，禁止猜测、扫描、CLI/env传evidence ref或从待验evidence反推expected。
    fields:
      - {name: environment, type: enum, values: [alpha, beta, gamma], constraints: [NOT_NULL]}
      - {name: target, type: string, constraints: [NOT_BLANK]}
      - {name: candidateDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: dataPlaneBindingDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: startupAttemptId, type: string, constraints: [NOT_BLANK]}
      - {name: runtimeGeneration, type: string, constraints: [NOT_BLANK]}
      - {name: accountClosureEvidence, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL]}
      - {name: materialRoot, type: PostSafetyMaterialRootLocator, constraints: [NOT_NULL]}
      - {name: subjectHmacKey, type: PostSafetySecretRefDescriptor, constraints: [NOT_NULL]}
      - {name: sourceAllocationCurrent, type: PostSafetySourceAllocationCurrentDescriptor, constraints: [NOT_NULL]}
      - {name: postgresAdminReadback, type: PostSafetySecretRefDescriptor, constraints: [NOT_NULL]}
      - {name: redisAdminReadback, type: PostSafetySecretRefDescriptor, constraints: [NOT_NULL]}
      - {name: oldPostgresPrincipalProbe, type: PostSafetySecretRefDescriptor, constraints: [NOT_NULL]}
      - {name: oldRedisPrincipalProbe, type: PostSafetySecretRefDescriptor, constraints: [NOT_NULL]}
      - {name: contentMongo, type: PostSafetyContentMongoAuthorityDescriptor, constraints: [NOT_NULL]}
  PostSafetyDeploymentStartupMaterial:
    description: deployment owner 在既有 target startup material 中维护的唯一 Post safety 指针合同，同时供 immutable candidate startup、mutable alpha/beta/gamma startup 与后续 prod-hosted deployment 消费；不是第二 runtime 状态源。environment/target/candidateDigest/dataPlaneBindingDigest 从已校验 candidate/deployment projection 固定，startupAttemptId/runtimeGeneration 由同一 deployment execution 分配且不可复用。authorization 与单一accountClosureAuthority descriptor由deployment owner持有；authorization predecessor必须等于descriptor.accountClosureEvidence。postSafetyCurrent在apply前必须显式null，成功后只允许在target执行锁内以旧exact bytes为expected做一次create-once/CAS原子替换。禁止CLI/env注入evidence ref、latest查找、runtime目录扫描、caller自选ref、缺字段兼容或双读。
    fields:
      - {name: environment, type: enum, values: [alpha, beta, gamma, prod], constraints: [NOT_NULL]}
      - {name: target, type: string, constraints: [NOT_BLANK]}
      - {name: candidateDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: dataPlaneBindingDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: startupAttemptId, type: string, constraints: [NOT_BLANK]}
      - {name: runtimeGeneration, type: string, constraints: [NOT_BLANK]}
      - {name: authorization, type: PostSafetyRuntimeEvidence, constraints: [NOT_NULL]}
      - {name: accountClosureAuthority, type: PostSafetyAccountClosureAuthorityDescriptor, constraints: [NOT_NULL]}
      - {name: postSafetyCurrent, type: PostSafetyRuntimeEvidence, constraints: [NULLABLE]}
  PostSafetyState:
    description: Post aggregate内部长期安全状态，不是新对象/通用registry。objectDigest为独立受管Post安全密钥HMAC-SHA256(canonical environment/sourceOwner/content.post/objectId)，scopeDigest为同密钥隔离用途的环境来源摘要；ordinary使用Content owner命名空间，Data使用qwq_data，不按ID前缀推断。只保存最小可链接内部摘要，不称匿名；禁止正文/作者ID/URL/JWT密钥。初始化必须来自可信create/stage安全核验，记录缺失或密钥/恢复水位不可证均not-ready。
    fields:
      - {name: objectDigest, type: string, format: canonical_sha256, constraints: [PK, NOT_NULL]}
      - {name: scopeDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: safetyRevision, type: int64, min: 1, constraints: [NOT_NULL], description: 仅真实安全决定递增；禁止activation序号替代。}
      - {name: fenceGeneration, type: int64, min: 1, constraints: [NOT_NULL], description: 安全命令和候选CAS同键真实事务写入递增，只用于并发冲突，不是event版本。}
      - {name: state, type: enum, values: [allowed, restricted, terminated], constraints: [NOT_NULL]}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL], description: 最新决定所绑定的Post对象提交版本，不能取candidate或pointer版本冒充。}
      - {name: decisionDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: reason, type: enum, values: [verified_source, visibility_restricted, moderation_rejected, author_deleted, privacy_redacted, purged, account_closed, authorized_reallow], constraints: [NOT_NULL]}
      - {name: decidedAt, type: timestamp, constraints: [NOT_NULL]}
  PostSourceCommitMetadata:
    description: 仅供Post owner Load/Commit内部端口使用的来源metadata，不是caller可写payload。environment来自部署；ordinary来源四字段均显式null，Data sourceOwner/releaseId/manifestDigest完整且releaseDigest只审计。expectedObjectVersion绑定本次已加载对象版本，objectDigest由独立安全authority派生；不从生成Post缺字段推ordinary。Commit原子重读匹配来源再执行原授权，失配拒绝不覆盖Data字段。
    fields:
      - {name: environment, type: string, constraints: [NOT_NULL]}
      - {name: sourceOwner, type: string, constraints: [NULLABLE]}
      - {name: releaseId, type: string, constraints: [NULLABLE]}
      - {name: manifestDigest, type: string, constraints: [NULLABLE]}
      - {name: releaseDigest, type: string, constraints: [NULLABLE]}
      - {name: objectDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: expectedObjectVersion, type: int64, min: 0, constraints: [NOT_NULL]}
      - {name: expectedSafetyRevision, type: int64, min: 1, constraints: [NOT_NULL]}
  PostCandidateSafetyMember:
    description: Content candidate控制状态中的对象安全绑定，不修改immutable内容源，不携带正文/原作者。集合必须与verified候选postId集合一对一且按objectDigest排序，无重复/缺少/额外项。
    fields:
      - {name: objectDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: safetyRevision, type: int64, min: 1, constraints: [NOT_NULL]}
  PostCandidateSafetyBinding:
    description: 保存在既有data_release_state candidate控制行中的显式安全绑定。仅可信stage或显式owner重验可创建，无记录不推allowed。release/snapshotDigest绑定现役源查询快照；members为空只在可信验证的零Post集合成立。安全记录改变使原绑定失效，不默默刷新原candidate的revision或改proof；合法新candidate重新prepare。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: snapshotDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: members, type: '[]PostCandidateSafetyMember', max_items: 1000, constraints: [NOT_NULL]}
      - {name: bindingDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  ReadPostCandidateSafetyQuery:
    description: 受信查询当前exact candidate安全资格，不接受caller安全boolean、HMAC或revision。并非CAS写锁/跨服务水位证明，不初始化状态。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: snapshotDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  PostCandidateSafetyResult:
    description: 只有完整安全绑定与当前记录均已核实才返回；restricted/terminated或缺状态返回typed失败，不返回部分allowed。此结果不授权CAS，事务必须再次同键写入验证且持续Provider保护仍required。
    fields:
      - {name: binding, type: PostCandidateSafetyBinding, constraints: [NOT_NULL]}
      - {name: checkedAt, type: timestamp, constraints: [NOT_NULL]}
  ContentReleaseFenceChangedPayload:
    description: 唯一已提交release转换事实；before/after直接引用ContentActiveReleaseFence。before等于CAS实际前值，after为同environment/sourceOwner且revision=before.revision+1的found=true结果；首次before保持现役found=false完整形状。与pointer和active stage receipt同事务写入content_outbox，不包含Post对象删除或公开源版本。envelope eventId绑定environment/sourceOwner/after.revision，aggregateVersion等于after.revision，aggregateId为environment/sourceOwner控制分区而非postId，occurredAt等于after.activatedAt。严格拒绝未知字段及不完整fence。
    fields:
      - {name: before, type: ContentActiveReleaseFence, constraints: [NOT_NULL]}
      - {name: after, type: ContentActiveReleaseFence, constraints: [NOT_NULL]}
  ReadContentReleaseCommitReceiptQuery:
    description: 按现役releaseActivationAttemptID的目标和expected输入定位data_release_stage_receipts中stage=active的唯一提交回执，不接受caller自述已提交或新ledger身份。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: expected, type: ContentActiveReleaseFence, constraints: [NOT_NULL]}
  ContentReleaseCommitReceipt:
    description: 只投影既有active stage receipt保存的确切已提交transition及其outbox身份；不从当前pointer或expectedRevision推导历史after。payloadDigest为transition规范摘要，eventId和完整transition必须与同事务outbox一致；历史缺字段保持不可证明，不补写或兼容解码。
    fields:
      - {name: eventId, type: string, constraints: [NOT_BLANK]}
      - {name: transition, type: ContentReleaseFenceChangedPayload, constraints: [NOT_NULL]}
      - {name: payloadDigest, type: string, constraints: [NOT_NULL], format: canonical_sha256}
  PostLifecycleProjectionPayload:
    description: Post owner唯一canonical公开投影，prepare源与真实对象lifecycle由同一纯mapper派生。activation/rollback只发ContentReleaseFenceChanged，不发本payload冒充内容更新。所有source字段必须显式存在；ordinary的environment/sourceOwner/releaseId/manifestDigest/releaseDigest为null，Data的前四字段为非空完整源tuple，releaseDigest仅可作为审计摘要。sourceVersion为对象owner权威正版本且等于envelope aggregateVersion，不能使用activation序号；同源版本不同公开摘要冲突。未知字段、空字符串来源及部分tuple拒绝，消费者不能默认补null。
    fields:
      - {name: postId, type: string, constraints: [NOT_NULL]}
      - {name: authorId, type: string, constraints: [NOT_NULL]}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NOT_NULL], description: 对象身份轴，只允许 canonical ContentType 成员。退役成员（micro）不是本 payload 的合法取值；存量事件若仍携带闭集外取值，消费者必须落到自己管线的显式未知成员并停在该事实上，不得按最宽松成员放行。}
      - {name: status, type: string, constraints: [NOT_NULL]}
      - {name: visibility, type: string, constraints: [NOT_NULL]}
      - {name: moderationStatus, type: string, constraints: [NOT_NULL]}
      - {name: title, type: string, constraints: [NOT_NULL]}
      - {name: body, type: string, constraints: [NOT_NULL]}
      - {name: summary, type: string, constraints: [NOT_NULL]}
      - name: semanticDocument
        type: semantic_document
        go_type_ref: semantic_document.DocumentEnvelope
        go_import: quwoquan_service/services/content-service/generated/content/post/semantic_document
        constraints: [NULLABLE]
        description: canonical semantic document 公开投影；非文章及历史记录可显式为 null，存在时消费者按完整 DocumentEnvelope 严格解码。
      - {name: authorDisplayNameSnapshot, type: string, constraints: [NOT_NULL]}
      - {name: authorAvatarUrlSnapshot, type: string, constraints: [NOT_NULL]}
      - {name: mediaUrls, type: '[]string', constraints: [NULLABLE]}
      - {name: coverUrl, type: string, constraints: [NOT_NULL]}
      - {name: thumbnailUrl, type: string, constraints: [NOT_NULL]}
      - {name: videoUrl, type: string, constraints: [NOT_NULL]}
      - {name: width, type: int64, constraints: [NOT_NULL]}
      - {name: height, type: int64, constraints: [NOT_NULL]}
      - {name: durationMs, type: int64, constraints: [NOT_NULL]}
      - {name: tagRefs, type: '[]string', constraints: [NULLABLE]}
      - {name: entityRefs, type: '[]string', constraints: [NULLABLE]}
      - {name: contentVertical, type: string, constraints: [NOT_NULL]}
      - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: publishedAt, type: timestamp, constraints: [NULLABLE], description: 字段必须显式存在；首次审核拒绝且从未发布为null，已真实发布的Post必须为非空UTC时间；不得以空字符串/createdAt或当前时间补造。}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: publishIntentId, type: string, constraints: [NULLABLE]}
      - {name: localDraftId, type: string, constraints: [NULLABLE]}
      - {name: contentDigest, type: string, constraints: [NULLABLE]}
      - {name: assistantUsePolicy, type: string, constraints: [NULLABLE]}
      - {name: coverStrategy, type: string, constraints: [NULLABLE]}
      - {name: coverFrameTimeMs, type: int64, constraints: [NULLABLE]}
      - {name: likeCount, type: int64, constraints: [NULLABLE]}
      - {name: commentCount, type: int64, constraints: [NULLABLE]}
      - {name: shareCount, type: int64, constraints: [NULLABLE]}
      - {name: mediaItems, type: '[]PostMediaItem', constraints: [NULLABLE]}
      - {name: semanticMentions, type: '[]PostSemanticMention', constraints: [NULLABLE]}
      - {name: primaryHomepageId, type: string, constraints: [NULLABLE]}
      - {name: primaryHomepageSnapshot, type: PostLifecycleHomepagePayload, constraints: [NULLABLE]}
      - {name: visitedAt, type: timestamp, constraints: [NULLABLE], description: producer的未设置时间若发空字符串则必须修正为null，消费者不得把空字符串猜成时间。}
      - {name: gatheringRef, type: string, constraints: [NULLABLE]}
      - {name: captureDisclosure, type: '[]string', constraints: [NULLABLE]}
      - {name: sourcePostId, type: string, constraints: [NULLABLE]}
      - {name: sourcePostAuthorId, type: string, constraints: [NULLABLE]}
      - {name: contentId, type: string, constraints: [NULLABLE]}
      - {name: contentVersion, type: int64, constraints: [NULLABLE]}
      - {name: variantPurpose, type: string, constraints: [NULLABLE]}
      - {name: usageScope, type: string, constraints: [NULLABLE]}
      - {name: environment, type: string, constraints: [NULLABLE], description: 必须显式存在；ordinary为null，Data与受管部署环境相同。}
      - {name: sourceOwner, type: string, constraints: [NULLABLE], description: 必须显式存在；ordinary为null，Data为qwq_data；禁止空字符串和按缺失猜来源。}
      - {name: releaseId, type: string, constraints: [NULLABLE], description: ordinary为null，Data为源release身份，不代表删除目标候选。}
      - {name: releaseDigest, type: string, constraints: [NULLABLE], description: 显式null或源审计sha256摘要，不得替代manifestDigest。}
      - {name: manifestDigest, type: string, constraints: [NULLABLE], description: ordinary为null，Data为完整visibility manifest的sha256摘要。}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL], description: 对象owner权威版本，必须等于envelope aggregateVersion；不是Content revision或activation分配序号。}
      - {name: safetyRevision, type: int64, min: 1, constraints: [NOT_NULL], description: 同事务Post安全状态的当前revision，只有真实安全变化才递增；普通内容更新携带当前值，不由sourceVersion推算。}
  PostLifecycleHomepagePayload:
    description: postHomepageSnapshotForEvent实际公开载荷，不包含聚合私有字段。
    fields:
      - {name: canonicalEntityId, type: string, constraints: [NOT_NULL]}
      - {name: title, type: string, constraints: [NOT_NULL]}
      - {name: subtitle, type: string, constraints: [NOT_NULL]}
      - {name: coverUrl, type: string, constraints: [NOT_NULL]}
  PostDeletedPayload:
    description: 仅真实owner删除，DeletePost原授权不变，status为删除前状态；release退出不得产生此事实。source字段全部显式存在，ordinary全null，Data携带environment/sourceOwner/releaseId/manifestDigest完整源tuple，releaseDigest仅审计；安全删除针对同来源canonical postId的所有保留候选，不限定在该源tuple。同sourceVersion等于envelope aggregateVersion，未知/部分来源拒绝。
    fields:
      - {name: postId, type: string, constraints: [NOT_NULL]}
      - {name: authorId, type: string, constraints: [NOT_NULL]}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NOT_NULL], description: 对象身份轴，只允许 canonical ContentType 成员。退役成员（micro）不是本 payload 的合法取值；存量事件若仍携带闭集外取值，消费者必须落到自己管线的显式未知成员并停在该事实上，不得按最宽松成员放行。}
      - {name: status, type: string, constraints: [NOT_NULL]}
      - {name: deletedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: environment, type: string, constraints: [NULLABLE]}
      - {name: sourceOwner, type: string, constraints: [NULLABLE]}
      - {name: releaseId, type: string, constraints: [NULLABLE]}
      - {name: manifestDigest, type: string, constraints: [NULLABLE]}
      - {name: releaseDigest, type: string, constraints: [NULLABLE]}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: safetyRevision, type: int64, min: 1, constraints: [NOT_NULL]}
  PostPrivacyRedactedPayload:
    description: owner隐私清除完成事实，未定位producer故不声称已实现。source字段必须显式存在；ordinary全null，Data前四来源字段完整，releaseDigest仅审计。sourceVersion是唯一对象版本且等于envelope aggregateVersion，无postVersion同义字段。所有含该canonical对象的候选失去准入，保留期结束不能允许旧事件复活；未知字段/部分tuple拒绝。
    fields:
      - {name: postId, type: string, constraints: [NOT_NULL]}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: safetyRevision, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: redactedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: retentionExpiresAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: environment, type: string, constraints: [NULLABLE]}
      - {name: sourceOwner, type: string, constraints: [NULLABLE]}
      - {name: releaseId, type: string, constraints: [NULLABLE]}
      - {name: manifestDigest, type: string, constraints: [NULLABLE]}
      - {name: releaseDigest, type: string, constraints: [NULLABLE]}
  PostPurgedPayload:
    description: owner最终清除事实，未定位producer故不声称已实现；同PostPrivacyRedactedPayload来源/唯一sourceVersion校验。清除派生可识别字节并保留最小不可复活标记，不能被新activationRevision、候选重建或迟到upsert解除。未知字段/部分tuple拒绝。
    fields:
      - {name: postId, type: string, constraints: [NOT_NULL]}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: safetyRevision, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: purgedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: environment, type: string, constraints: [NULLABLE]}
      - {name: sourceOwner, type: string, constraints: [NULLABLE]}
      - {name: releaseId, type: string, constraints: [NULLABLE]}
      - {name: manifestDigest, type: string, constraints: [NULLABLE]}
      - {name: releaseDigest, type: string, constraints: [NULLABLE]}
