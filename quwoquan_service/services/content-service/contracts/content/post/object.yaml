kind: aggregate_root
description: '内容聚合。图片/视频/微趣/文章四种内容类型统一建模（contentType 判别，通用框架 + 按类型扩展）。

  设计详见 specs/feature-tree/discovery-content/content-type-framework/。

  Comment、ContentReaction、MediaUploadSession、MediaAsset 与 CirclePostPlacement

  按独立生命周期治理，不作为 Post 的无界聚合成员；站外分享只追加 OutboundShareFact。

  MongoDB 存储支撑高并发读写和水平扩展。

  热数据 + 互动状态走 Redis 缓存，热点计数 Redis 原子递增后异步回写。

  '
identity:
  fields:
  - _id
  version_field: version
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: author
  on_delete: retain
  reference_fields:
  - authorId
  target_object: user.Persona
- access: named_reader
  cardinality: N:N
  consistency: eventual
  kind: reference
  name: mediaAssets
  on_delete: restrict
  reference_fields:
  - mediaAssetIds
  - illustrationAssetId
  target_object: content.MediaAsset
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: primaryHomepage
  on_delete: detach
  reference_fields:
  - primaryHomepageId
  target_object: entity.Homepage
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: sourcePost
  on_delete: retain
  reference_fields:
  - sourcePostId
  target_object: content.Post
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: creatorPersona
  on_delete: retain
  reference_fields:
  - creatorProfileId
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: pinnedComment
  on_delete: detach
  reference_fields:
  - pinnedCommentId
  target_object: content.Comment
local_identity_reasons:
  localDraftId: 端侧草稿在所属作者内的稳定去重键，不是 Post 聚合主身份
  publishIntentId: 一次发布意图在所属作者内的永久幂等键，不是 Post 聚合主身份
counter_strategy:
  description: 'Post 只承载可重建计数投影，不拥有互动事实。like 来自 ContentReaction

    权威去重集合，comment 来自 Comment 权威集合，share 来自

    OutboundShareFact 权威集合；三者均在 outbox 重放时重算精确值并以 $set

    投影到 posts 与 rm_discovery_feed。view 来自服务端确认的 impressed 行为事实，

    以持久 relay 事件 ID 作为水位执行幂等 $inc。禁止另建 Redis 计数真相源或由

    客户端 shareIntent/shareClick 直接驱动 shareCount。

    '
  projection_only: true
  sources:
    like: content.ContentReaction
    comment: content.Comment
    share: content.OutboundShareFact
    view: content.ContentBehaviorFact.impressed
  targets:
  - posts
  - rm_discovery_feed
  replay:
    exact_set:
    - like
    - comment
    - share
    event_watermark_increment:
    - view
search_policy:
  exposed: remote_index
  object_type_refs:
  - content.post
  - location.place
  eligibility_ref: quwoquan_service/services/content-service/internal/content/post/infrastructure/searchindex/projector.go#searchEligible
  index_projector_ref: quwoquan_service/services/content-service/internal/content/post/application/searchprojection/post_projection.go#ProjectPostToSearchDocument
  privacy_filter_ref: quwoquan_service/runtime/search/core.go#isPrivateVisibility
assistant_access:
  read:
    mode: public
    scopes:
    - assistant.content.post.read
    reader:
      descriptor_id: content.post_context
      resolver_ref: content.current_context
      owner_service: content-service
      owner_operation_ref: content.post.GetPost
      input_schema_ref: content.ContentPostDetailQuery
      output_schema_ref: assistant.ContextSegment
      object_type_ref: content.Post
      authority: domain_canonical
      sensitivity: public
      accepted_source_kinds: [domain]
      surface_kinds: [personal, shared, public]
      max_freshness_seconds: 300
      cache_ttl_seconds: 30
      artifact_policy: inline_bounded
      citation_policy: entity_reference
  cite:
    mode: public_citation
    scopes:
    - assistant.content.post.cite
  write:
    mode: proposal_only
    scopes:
    - assistant.content.post.write
    requires_user_consent: true
    consent_scope_ref: assistant.content.post.write
business_rules:
- PostSafetyRuntimeFact及PostSafetyRuntimeCurrentBinding是Post-owned内部值，环境创建/恢复流程负责生产、Content负责验证消费；不新增aggregate/registry/HTTP command/collection。fields.yaml为唯一格式源，producer后续从同源生成DTO/validator，不在Ops另复制schema。当前authoring不声明恢复producer或bootstrap成功已实现。
- 本地信任根明确限定alpha/beta/gamma受管target：环境owner执行账户独占写material_root，目录0700、材料文件0600，Content仅只读mount；完整ancestor权限、UID及dev/inode须由部署挂载验证，不以payload自报UID授信。同UID开发测试只证明本地信任模型，不声称抵御同UID恶意写。Prod必须用正式受管部署writer和只读mount建立同等隔离，未交付则拒绝；非生产producer及测试fact必须硬拒environment=prod，不能用参数改名绕过。
- new_runtime仅允许已批准alpha/beta/gamma新物理安全空间：environment owner在现役target执行锁下O_EXCL创建generation材料和独占namespace/volume，读取provider分配的不可复用instance身份后产出creation evidence，不以空表/缺目录推断新建。以新专用key隔离被明确放弃的旧运行态；必须证明旧实例/旧outbox/旧candidate/旧备份没有通向新namespace的写路。现有Gamma从封存release重建授权只覆盖其明确target及丢弃范围，不扩展到Prod或任意旧备份；封存内容依然经过当前Content/账号关闭资格检查，不能把new事实当旧被删对象的重新授权。
- restored必须先停写并隔离恢复，previousBinding完整、目标generation不同而hmacKeyIdentity相同。recovery证据须绑定现役备份plan/receipt exact摘要及post_safety和account_closure完整源集合/watermark，逐条读回目标核对count/canonicalDigest/所有分区checkpoint，无缺失终止记录；既有backup_recovery.py布尔readback或Human签名不能单独证明完整性。业务备份落后于安全日志时先恢复并追齐安全日志；源无可信完整水位或稳定密钥丢失拒绝，禁止转new_runtime逃逸。
- fact摘要统一SHA256(exact文件bytes)，producer使用UTF-8规范JSON闭集格式；记录canonicalDigest按对应owner既有规范化规则算，不能将二者混用。事实文件create-once，current binding由环境owner既有target锁内比较前值、原子替换并fsync；同generation同binding/fact重放只读，异摘要冲突，不覆盖原件。candidate升级复用同物理空间/key时必须在停写核验当前闭包后签发新的部署绑定事实，不沿用旧candidate摘要；不是release pointer回滚。运行期间每次安全port admission重验current绑定，旧generation无写权；跨进程切换必须先终止旧执行权再切换mount/namespace，不能依靠首尾读取宣称分布式租约。
- 初始化闭包只在受管首次开放或恢复停写窗口核验；正常Post提交会推进安全记录，不能每请求把当前集合与初始fact摘要比较。ordinary通过已验证runtime且当前原账号/Persona权限、publication admission成立后同事务初始化自身新Post记录，不要求Data候选、release proof或Provider/GC保护；draft/pending_review记录可初始化restricted，不因非public自动拒绝原合法创建。缺记录的已有Post/历史candidate不得走新建分支。Data stage仍须额外验证source/主体安全，完整activation仍需要现役evaluator/GenerationProtection。
- Post安全runtime成功装配次序为读取受管current binding及实际部署身份、只读secret resolver核对key identity、验证fact及创建/恢复证据和owner闭包、构造PostSafetyAuthority/Manager、BindSafety到真实MongoPostStore并注入candidate reader/HTTP/CLI上下文，最后开放HTTP。验证只读，不替环境owner创建或批准材料；任一步缺失以现役query_barrier_invalid/not_ready/unavailable启动失败并脱敏，不允许恒失败壳代替成功分支。后续VerifyRecovery验证同一已核验runtime的当前执行权和恢复完成绑定，VerifySource只做来源适用的当前owner检查，不以stub true实现。
- PostSafetyState由本aggregate独占并与原Post CAS/receipt/outbox同事务维护，不新增业务对象或安全服务；DeletedPostTombstone继续30天410语义，主体关闭HMAC集合仅存主体否定，不存Post状态。安全对象摘要以独立受管密钥和域分隔派生，密钥/恢复完整性无证据not-ready，禁止JWT密钥/缺值fallback。
- owning Load返回PostSourceCommitMetadata，Commit按expectedObjectVersion及实际Data来源事务重验，不在生成Post丢失来源时自动填ordinary；删除/设置仍按post_owner，审核拒绝/重新批准仅接受现役PostModerationCase exact PostVersion/ContentDigest决定。当前拒写Data行仅止损，不能报告安全命令完成；没有平台Creator合法删除actor不伪造账号、不新增任意service删除路由。
- 可信create/stage先验证当前公开/审核/主体关闭资格及恢复水位，再显式初始化安全记录；读侧缺记录不得视作safe，历史candidate缺safetyBinding保持not-ready。stage内从同一canonical mapper计算源快照再封存安全绑定，不能调用依赖该绑定的公开query形成初始化循环。含restricted/terminated或旧安全revision的候选整体失效，不改源字节/摘要、不删减集合沿用旧proof。
- safetyRevision仅安全决定递增，sourceVersion是对象同次提交版本，fenceGeneration为安全命令/activation的实际Mongo同键写冲突代际。candidate准入事务按objectDigest排序写入并校验每条已初始化allowed记录后才可物化及pointer CAS；readonly safety query或首尾两读不是执行权。安全否定先提交时CAS拒绝；CAS先提交时安全命令仍可随后生效，保留租约不得延迟撤回。
- terminated不可恢复；restricted仅按原合法owner权限恢复为allowed并递增safetyRevision，原candidate绑定不随之更新，只允许安全合法新candidate重新prepare。privacy字节按隐私合同删除，最小终止标记无TTL并覆盖replay/backup恢复，恢复前安全水位不可证则不允许source/proof/CAS；Search/Rec公开追齐和持续Provider/GC保护均为后续独立required依赖，本slice不声称已实现。
- ContentReleaseFenceChanged唯一表达已提交activation/rollback，完整before/after与pointer及既有active stage receipt/content_outbox同事务；release退出不产生PostDeleted/PostPublished，不删除保留候选或触发对象权威级联。所有消费者从本owner事件类型生成，不在Search/Rec复制payload或扩跨域parser。
- 真实Post删除/privacy/purge/审核拒绝和公开资格收紧由本owner唯一授权与事务事实决定；同来源canonical对象在所有保留候选失效，旧proof不能准入，rollback不复活。候选整体拒绝而非静默删对象沿用原摘要，安全清理优先；现役30天删除墓碑不证明跨候选长期防复活，缺安全authority仍not_ready。
- Post lifecycle专属payload来源字段必须显式存在：ordinary的environment/sourceOwner/releaseId/manifestDigest/releaseDigest全null，Data完整前四字段，releaseDigest仅审计。sourceVersion是唯一对象版本且等于envelope aggregateVersion，activationRevision不进入对象事件；未知字段/空串来源/缺tuple拒绝。prepare和lifecycle由同一canonical公开mapper生成，不从live反猜源身份。
- ReadContentReleaseCommitReceipt仅以既有releaseActivationAttemptID目标/expected定位active成功回执；缺完整transition/eventId/payloadDigest不返回superseded资格，不从当前pointer推导，不改历史原件或新建ledger。
- ReadPostReleaseCandidate只读exact verified源候选并生成完整typed公开快照，校验Post/outbox/media闭包与Entity同tuple公开映射；不读取active、不把receipt/数量当查询ready，不截断超界候选。
- PreparePostReleaseQueries只接受四个不同对象slice且release完全相同的binding；Creator/Post/Homepage调用Search唯一PrepareSearchRelease/ReadSearchReleasePreparation，Recommendation只发布一次PostReleaseCandidatePrepared并由原projector消费。删除旧Creator-only入口与客户端分支，无active仍可prepare，不产生曝光或activation。
- 全部activation/rollback/CLI/importer复用RequiredReleaseQueries evaluator，真实回读Creator/Post/Homepage/Search/Recommendation/premium及四域/媒体/必要详情，缺依赖不CAS。query本身不推进prepare也不取得切换权。
- proof验证至CAS必须持有受管Provider/schema generation持续保护并阻止候选GC；该生产authority尚未实现，缺失即query_barrier_not_ready，不以VerifyHeld接口、caller boolean/token或首尾相等采样冒充保护。premium有效期覆盖窗口，撤权不被保护锁阻止；CAS后依赖故障按ambiguous恢复。
- ActivateContentReleaseAtSearchBarrier以及CLI/importer等所有同域activation入口必须共用同一application admission，CAS前回读Search ReadSearchReleasePreparation的completed proof并重验User source closure；仅收调用方proof副本、四域counts或旧receipt不能准入。
- Creator准备proof只闭合Creator slice；Tag/Homepage/Content/media及Post/Entity/Recommendation所有required candidate barrier继续required，缺契约或证据必须阻断，不因Creator完成放行完整release。
- activation/显式rollback由环境owner选择目标，Content仅按expected tuple+revision CAS；首次expected.found=false不得猜空，结果未知先调用ReadActiveReleaseFence，不能盲重试。rollback复用已保留verified目标，生成新revision，不降低Search sourceVersion。
- Content ReadActiveReleaseFence的route、scope、500ms预算和完整found/not-found wire不变；Search准备/证明不是第二active authority。
- 用户发布前内容只存在于端侧 LocalPostDraft；远端 Post 不承载编辑中的草稿
- SubmitPostPublication 只接受本地草稿唯一且不可变的 publishIntentId，同一意图的任意重放返回同一 Post
- mediaAssetIds 必须全部 ready、归调用者所有并在 Post 提交前完成公开 slice 物化
- SubmitPostPublication 必须依次通过 publication_policy.yaml 的长度、Persona 频控和内容安全准入；安全依赖不可用时只允许创建不可公开的 pending_review
  Post 并打开人工 Case，禁止 fail-open 发布
- sourcePostId 仅表达引用发布，不复制或修改源 Post
- Post 不保存互动计数、Circle placement、审核状态、搜索向量或 URL 投影真相
- 首次发布不接受调用方版本字段；服务端按 publishIntentId/localDraftId 唯一约束、聚合 CAS、永久字段和事务 outbox 保证幂等
- 发布后设置修改由服务端内部 version CAS 保护；只有确有多写者覆盖写的操作才可显式声明 If-Match
lifecycle:
  state_field: status
  states:
  - pending_review
  - published
  - rejected
  - deleted
  optimistic_concurrency: server_owned_version
  idempotency: publish_intent_unique_fields_plus_command_receipt
  source_events:
  - content.comment.CommentCreated
  - content.comment.CommentDeleted
  - content.comment.CommentModerated
  - content.comment.CommentsTombstoned
  - content.post_moderation_case.PostModerationCaseDecided
  event_consumers:
  - name: ProjectCommentCount
    kind: event_handler
    facet: CommentCountProjectionHandler
    method: apply
    idempotency: event_id
  - name: ApplyPostModerationDecision
    kind: event_handler
    facet: PostModerationDecisionHandler
    method: applyPostModerationDecision
    idempotency: event_id
