      - outcome
      - emptyReason
      - nextCursor
      - previousCursor
      - paginationExpiresAt
      - feedRequestId
      - policyDigest
      - objectCards
      - releaseId
      - manifestDigest
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: ContentDiscoveryFeedQuery
    request_body_kind: none
