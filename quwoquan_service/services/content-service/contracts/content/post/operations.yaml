description: 内容发布、浏览、互动、评论与媒体管理
externalDependencies:
  - capability: content.embedding.generation
    port: EmbeddingGenerationPort
    operations: [embed]
    conformance: embedding_generation
    adapterContracts:
      ext.embed.protocol_fixture:
        endpointEnvs: {endpoint: CONTENT_EMBEDDING_ENDPOINT}
        secretRefs: []
        defaultTimeoutMs: 10000
      ext.embed.openai_compatible:
        endpointEnvs: {endpoint: CONTENT_EMBEDDING_ENDPOINT}
        secretRefs: [CONTENT_EMBEDDING_API_KEY]
        defaultTimeoutMs: 10000
  - capability: runtime.object.storage
    port: ObjectStoragePort
    operations: [presignPut, presignGet]
    conformance: object_storage
    adapterContracts:
      infra.minio.object_storage:
        endpointEnvs:
          endpoint: CONTENT_OSS_ENDPOINT
          bucket: CONTENT_OSS_BUCKET
          region: CONTENT_OSS_REGION
          media_delivery_base_url: CONTENT_MEDIA_DELIVERY_BASE_URL
          media_upload: CONTENT_MEDIA_UPLOAD_BASE_URL
        secretRefs:
          - CONTENT_OSS_ACCESS_KEY_ID
          - CONTENT_OSS_ACCESS_KEY_SECRET
          - CONTENT_CDN_SIGN_KEY
        defaultTimeoutMs: 5000
      ext.oss.s3_compatible:
        endpointEnvs:
          endpoint: CONTENT_OSS_ENDPOINT
          bucket: CONTENT_OSS_BUCKET
          region: CONTENT_OSS_REGION
          media_delivery_base_url: CONTENT_MEDIA_DELIVERY_BASE_URL
          media_upload: CONTENT_MEDIA_UPLOAD_BASE_URL
        secretRefs:
          - CONTENT_OSS_ACCESS_KEY_ID
          - CONTENT_OSS_ACCESS_KEY_SECRET
          - CONTENT_CDN_SIGN_KEY
        defaultTimeoutMs: 10000
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [appendDurable, consumeDurable]
    scenes: [general, realtime]
