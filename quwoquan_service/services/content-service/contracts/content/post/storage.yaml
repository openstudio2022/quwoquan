backend: mongodb
collections:
  posts:
    publication_role: not_published
    entity: Post
    indexes:
    - name: idx_posts_author_status
      keys:
        authorId: 1
        status: 1
        publishedAt: -1
    - name: idx_posts_content_type
      keys:
        contentType: 1
        publishedAt: -1
    - name: idx_posts_visibility
      keys:
        visibility: 1
        publishedAt: -1
    - name: idx_posts_status_published
      keys:
        status: 1
        publishedAt: -1
    - name: idx_posts_last_active
      keys:
        lastActiveAt: -1
      sparse: true
    - name: idx_posts_tag_refs
      keys:
        tagRefs: 1
    - name: idx_posts_entity_refs
      keys:
        entityRefs: 1
    - name: idx_posts_media_asset_status
      keys:
        mediaAssetIds: 1
        status: 1
    - name: idx_posts_illustration_asset_status
      keys:
        illustrationAssetId: 1
        status: 1
      sparse: true
    - name: idx_posts_location
      keys:
        location: 2dsphere
      sparse: true
    - name: idx_posts_moderation
      keys:
        moderationStatus: 1
        createdAt: -1
    - name: idx_posts_source
      keys:
        sourceType: 1
        sourcePostId: 1
      sparse: true
    - name: idx_posts_article_markdown_digest
      keys:
        articleMarkdownDigest: 1
      sparse: true
    - name: idx_posts_canonical_entity
      keys:
        canonicalEntityId: 1
        publishedAt: -1
      sparse: true
    - name: idx_posts_gathering_ref
      keys:
        gatheringRef: 1
        publishedAt: -1
      sparse: true
    - name: idx_posts_publish_intent
      keys:
        authorId: 1
        publishIntentId: 1
      unique: true
      partial_filter:
        publishIntentId:
          type: string
    - name: idx_posts_local_draft
      keys:
        authorId: 1
        localDraftId: 1
      unique: true
      partial_filter:
        localDraftId:
          type: string
    - name: idx_posts_version
      keys:
        _id: 1
        version: 1
      unique: true
  post_command_receipts:
    publication_role: not_published
    entity: Post
    description: Post command 幂等结果；与聚合版本和 outbox 在同一 Mongo transaction 提交
    indexes:
    - name: idx_post_command_receipts_key
      keys:
        _id: 1
      unique: true
    - name: idx_post_command_receipts_aggregate
      keys:
        aggregateId: 1
        aggregateVersion: -1
    - name: idx_post_command_receipts_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  content_outbox:
    publication_role: transactional_outbox
    entity: Post
    description: Mongo authoritative aggregate 的同库事务 outbox；projection worker 以 checkpoint 幂等消费
    indexes:
    - name: idx_content_outbox_event
      keys:
        _id: 1
      unique: true
    - name: idx_content_outbox_sequence
      keys:
        outboxSequence: 1
      unique: true
    - name: idx_content_outbox_aggregate_version
      keys:
        aggregateType: 1
        aggregateId: 1
        aggregateVersion: 1
      unique: true
  content_outbox_sequences:
    publication_role: publication_accessory
    entity: Post
    role: authoritative
    description: Post 事务 outbox 的单调全序分配器；仅与聚合状态和 outbox 在同一事务中推进。
  projection_checkpoints:
    publication_role: publication_accessory
    entity: Post
    description: Feed/Search/Recommendation/Homepage/Circle replay/rebuild checkpoint
    indexes:
    - name: idx_projection_checkpoint_consumer
      keys:
        _id: 1
      unique: true
  data_release_state:
    publication_role: not_published
    entity: Post
    role: authoritative
    description: canonical immutable content release 的单轨候选状态；只能按 prepared -> imported -> projected -> verified -> active 单调推进。active pointer 仅在 verified 后切换；任何阶段失败都保留 previous active，不得把导入成功伪装成激活成功。
    indexes:
    - name: uq_data_release_state_environment_candidate
      keys: {environment: 1, releaseId: 1, manifestDigest: 1}
      unique: true
    - name: idx_data_release_state_active_pointer
      keys: {environment: 1, status: 1, activatedAt: -1}
  data_release_stage_receipts:
    publication_role: not_published
    entity: Post
    role: append_only
    description: 每次 prepared/imported/projected/verified/active 尝试的脱敏持久化回执；保留 duration、attempted/success count、checkpoint 与 first typed blocker。失败回执不可覆盖成功阶段，且不得推进 active pointer。
    indexes:
    - name: uq_data_release_stage_receipt_attempt
      keys: {environment: 1, releaseId: 1, manifestDigest: 1, stage: 1, attemptId: 1}
      unique: true
    - name: idx_data_release_stage_receipt_timeline
      keys: {environment: 1, releaseId: 1, recordedAt: 1}
  post_import_task_outbox:
    publication_role: not_published
    entity: Post
    role: authoritative
    description: 不可变 Data release 中单个 Post import job 的宣告 outbox；与 Integration reliable-task 物理隔离。
    indexes:
    - name: uq_post_import_task_outbox_idempotency
      keys: {idempotencyKey: 1}
      unique: true
      partial_filter:
        idempotencyKey: {type: string}
    - name: uq_post_import_task_outbox_pending_dedupe
      keys: {dedupeKey: 1, status: 1}
      unique: true
      partial_filter:
        status: pending
  post_import_task:
    publication_role: not_published
    entity: Post
    role: authoritative
    description: Post import job 的租约、重试与终态；仅 data-content-worker 的 typed store 可读写。
    indexes:
    - name: uq_post_import_task_active_dedupe
      keys: {dedupeKey: 1, status: 1}
      unique: true
      partial_filter:
        status: {in: [ready, processing, retry_wait]}
  post_import_task_recovery_receipt:
    publication_role: not_published
    entity: Post
    role: authoritative
    description: 已审计 dead Post import task 的幂等恢复回执。
    indexes:
    - name: idx_post_import_task_recovery_task
      keys: {taskId: 1}
    - name: idx_post_import_task_recovery_expiry
      keys: {expiresAt: 1}
      expire_after_seconds: 0
  rm_search_intent:
    publication_role: not_published
    entity: SearchIntentProjection
    role: projection
    description: 搜索 query/click 形成的 24 小时短期推荐特征；与长期 rm_recommend_feature 物理隔离。
    indexes:
    - name: idx_rm_search_intent_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  content_persona_access_projection:
    publication_role: not_published
    entity: Post
    role: projection
    description: Content 为 Post/Comment/Feed 服务端可见性维护的 Persona 拉黑访问投影；只保存 block/unblock，不复制 User follow 状态。
    indexes:
    - name: uq_content_persona_access_direction
      keys:
        sourcePersonaId: 1
        targetPersonaId: 1
      unique: true
    - name: idx_content_persona_access_source
      keys:
        sourcePersonaId: 1
        blocked: 1
        targetPersonaId: 1
    - name: idx_content_persona_access_target
      keys:
        targetPersonaId: 1
        blocked: 1
        sourcePersonaId: 1
  content_persona_access_projection_inbox:
    publication_role: not_published
    entity: Post
    role: inbox
    description: Persona relationship durable stream 的 Content 访问投影幂等 checkpoint；账号关闭时按 source/target Persona 删除。
    indexes:
    - name: uq_content_persona_access_event
      keys:
        eventId: 1
      unique: true
streams:
  events.content.post_lifecycle:
    publication_role: publication_accessory
    entity: Post
    role: append_only
    idempotency_key: eventId
    retention_seconds: 604800
    description: Post outbox 的唯一 durable 生命周期 transport；Circle、Recommendation 等只消费 typed event。
  events.search.recommendation_signals.dlq:
    publication_role: not_published
    entity: Post
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Content 旧推荐 signal consumer 的脱敏失败记录；该 consumer 随推荐逻辑迁出一并删除。
  events.user.persona_access.dlq:
    publication_role: not_published
    entity: Post
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Content Persona 访问控制投影无法解码或应用 User typed relationship event 时的脱敏失败记录。
redis_cache:
- key: cache:post:{postId}
  ttl_seconds: 300
  entity: Post
  invalidate_on:
  - PostUpdated
  - PostDeleted
- key: counter:{postId}:{type}
  ttl_seconds: null
  type: string
  description: 热点内容计数缓冲（INCR + 异步回写）
- key: content_analysis:{postId}
  ttl_seconds: 86400
  type: hash
  description: 内容多模态分析缓存
role: authoritative
