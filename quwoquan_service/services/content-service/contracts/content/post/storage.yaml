backend: mongodb
collections:
  posts:
    entity: Post
    indexes:
    - name: idx_posts_author_status
      keys:
        authorId: 1
        status: 1
        publishedAt: -1
    - name: idx_posts_content_type
      keys:
        contentType: 1
        publishedAt: -1
    - name: idx_posts_visibility
      keys:
        visibility: 1
        publishedAt: -1
    - name: idx_posts_status_published
      keys:
        status: 1
        publishedAt: -1
    - name: idx_posts_last_active
      keys:
        lastActiveAt: -1
      sparse: true
    - name: idx_posts_tag_refs
      keys:
        tagRefs: 1
    - name: idx_posts_entity_refs
      keys:
        entityRefs: 1
    - name: idx_posts_media_asset_status
      keys:
        mediaAssetIds: 1
        status: 1
    - name: idx_posts_illustration_asset_status
      keys:
        illustrationAssetId: 1
        status: 1
      sparse: true
    - name: idx_posts_semantic_candidate
      keys:
        semanticMentions.candidateId: 1
      sparse: true
    - name: idx_posts_semantic_target
      keys:
        semanticMentions.targetRef: 1
      sparse: true
    - name: idx_posts_location
      keys:
        location: 2dsphere
      sparse: true
    - name: idx_posts_moderation
      keys:
        moderationStatus: 1
        createdAt: -1
    - name: idx_posts_source
      keys:
        sourceType: 1
        sourcePostId: 1
      sparse: true
    - name: idx_posts_article_markdown_digest
      keys:
        articleMarkdownDigest: 1
      sparse: true
    - name: idx_posts_canonical_entity
      keys:
        canonicalEntityId: 1
        publishedAt: -1
      sparse: true
    - name: idx_posts_geo_visited
      keys:
        geoTagRef: 1
        visitedAt: -1
      sparse: true
      description: 「同地同期到访」交集召回：按行政区 tagRef + 作者声明到访时间取交，只覆盖同时具备两者的带定位发布
    - name: idx_posts_publish_intent
      keys:
        authorId: 1
        publishIntentId: 1
      unique: true
      partial_filter:
        publishIntentId:
          type: string
    - name: idx_posts_local_draft
      keys:
        authorId: 1
        localDraftId: 1
      unique: true
      partial_filter:
        localDraftId:
          type: string
    - name: idx_posts_version
      keys:
        _id: 1
        version: 1
      unique: true
    search_indexes:
    - name: search_posts_text
      source: search_posts_text
      type: text
      fields:
      - title
      - body
      - locationName
      - tagRefs
      - entityRefs
      - articleMarkdown
      weights:
        title: 10
        tagRefs: 5
        entityRefs: 5
        locationName: 3
        body: 1
        articleMarkdown: 1
    vector_indexes:
    - name: vector_posts_embedding
      field: embedding
      dimensions: 1536
      similarity: cosine
    change_streams:
    - pipeline:
      - $match:
          operationType:
            $in:
            - insert
            - update
      consumers:
      - recommendation-projector
      - search-indexer
    sharding:
      key:
        _id: hashed
      description: 按 _id 哈希分片，均匀分布
  post_command_receipts:
    entity: Post
    description: Post command 幂等结果；与聚合版本和 outbox 在同一 Mongo transaction 提交
    indexes:
    - name: idx_post_command_receipts_key
      keys:
        _id: 1
      unique: true
    - name: idx_post_command_receipts_aggregate
      keys:
        aggregateId: 1
        aggregateVersion: -1
    - name: idx_post_command_receipts_expire
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
  content_outbox:
    entity: Post
    description: Mongo authoritative aggregate 的同库事务 outbox；projection worker 以 checkpoint 幂等消费
    indexes:
    - name: idx_content_outbox_event
      keys:
        _id: 1
      unique: true
    - name: idx_content_outbox_replay
      keys:
        aggregateType: 1
        occurredAt: 1
        _id: 1
    - name: idx_content_outbox_aggregate_version
      keys:
        aggregateType: 1
        aggregateId: 1
        aggregateVersion: 1
      unique: true
  projection_checkpoints:
    entity: Post
    description: Feed/Search/Recommendation/Homepage/Circle replay/rebuild checkpoint
    indexes:
    - name: idx_projection_checkpoint_consumer
      keys:
        _id: 1
      unique: true
  rm_search_intent:
    entity: SearchIntentProjection
    role: projection
    description: 搜索 query/click 形成的 24 小时短期推荐特征；与长期 rm_recommend_feature 物理隔离。
    indexes:
    - name: idx_rm_search_intent_expire
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
redis_cache:
- key: cache:post:{postId}
  ttl_seconds: 300
  entity: Post
  invalidate_on:
  - PostUpdated
  - PostDeleted
- key: counter:{postId}:{type}
  ttl_seconds: null
  type: string
  description: 热点内容计数缓冲（INCR + 异步回写）
- key: content_analysis:{postId}
  ttl_seconds: 86400
  type: hash
  description: 内容多模态分析缓存
role: authoritative
