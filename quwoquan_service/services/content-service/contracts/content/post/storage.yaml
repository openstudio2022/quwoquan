backend: mongodb
transaction:
  scope: [data_release_query_publications, content_outbox]
  isolation: mongo_transaction
  mechanism: unique_constraint
  guarantees: [publication_binding_unique_winner, command_receipt_atomicity]
resources:
  post_store:
    engine: mongodb
    role: authority
    required: true
  search_documents:
    engine: elasticsearch
    role: query_projection
    required: true
  post_runtime_cache:
    engine: redis
    role: runtime
    required: true
collections:
  post_safety_states:
    entity: PostSafetyState
    publication_role: not_published
    role: authoritative
    description: Post owner内部安全资格唯一长期记录，无TTL且禁止原对象/作者ID、正文、URL。objectDigest唯一；新建只允许可信create/stage已核验安全/主体关闭/恢复资格的事务显式初始化，缺记录不allowed。真实安全决定和candidate activation/rollback事务均匹配同一记录实际$inc fenceGeneration；安全决定才递增safetyRevision，重复决定按原Post command receipt/decisionDigest幂等。仅读或无实际修改的条件检查不产生串行证据。terminated不可恢复，restricted可由原合法命令重新允许但不更新旧candidate安全绑定。HMAC稳定独立密钥及恢复完整性必须由现役部署authority提供，未交付保持not-ready。
    indexes:
      - {name: uq_post_safety_object, keys: {objectDigest: 1}, unique: true}
  data_release_query_publications:
    entity: PostReleaseCandidatePrepared
    publication_role: not_published
    description: Content纯准备命令唯一冻结publication依据，与content_outbox同Mongo事务。binding唯一，publicationId幂等；同binding不同snapshot拒绝，不拥有查询ready状态或active权。
    indexes:
    - {name: uq_data_release_query_publication, keys: {publicationId: 1}, unique: true}
    - {name: uq_data_release_query_binding, keys: {binding.release.environment: 1, binding.release.sourceOwner: 1, binding.release.releaseId: 1, binding.release.manifestDigest: 1, binding.slice: 1, binding.providerBindingGeneration: 1, binding.schemaGeneration: 1}, unique: true}
  posts:
    publication_role: not_published
    entity: Post
    indexes:
    - name: idx_posts_author_status
      keys:
        authorId: 1
        status: 1
        publishedAt: -1
    - name: idx_posts_content_type
      keys:
        contentType: 1
        publishedAt: -1
    - name: idx_posts_visibility
      keys:
        visibility: 1
        publishedAt: -1
    - name: idx_posts_status_published
      keys:
        status: 1
        publishedAt: -1
    - name: idx_posts_last_active
      keys:
        lastActiveAt: -1
      sparse: true
    - name: idx_posts_tag_refs
      keys:
        tagRefs: 1
    - name: idx_posts_entity_refs
      keys:
        entityRefs: 1
    - name: idx_posts_media_asset_status
      keys:
        mediaAssetIds: 1
        status: 1
    - name: idx_posts_illustration_asset_status
      keys:
        illustrationAssetId: 1
        status: 1
      sparse: true
    - name: idx_posts_location
      keys:
        location: 2dsphere
      sparse: true
    - name: idx_posts_moderation
      keys:
        moderationStatus: 1
        createdAt: -1
    - name: idx_posts_source
      keys:
        sourceType: 1
        sourcePostId: 1
      sparse: true
    - name: idx_posts_article_markdown_digest
      keys:
        articleMarkdownDigest: 1
      sparse: true
    - name: idx_posts_canonical_entity
      keys:
        canonicalEntityId: 1
        publishedAt: -1
      sparse: true
    - name: idx_posts_gathering_ref
      keys:
        gatheringRef: 1
        publishedAt: -1
      sparse: true
    - name: idx_posts_publish_intent
      keys:
        authorId: 1
        publishIntentId: 1
      unique: true
      partial_filter:
        publishIntentId:
          type: string
    - name: idx_posts_local_draft
      keys:
        authorId: 1
        localDraftId: 1
      unique: true
      partial_filter:
        localDraftId:
          type: string
    - name: idx_posts_version
      keys:
        _id: 1
        version: 1
      unique: true
  post_command_receipts:
    publication_role: not_published
    entity: Post
    description: Post command 幂等结果；与聚合版本和 outbox 在同一 Mongo transaction 提交
    indexes:
    - name: idx_post_command_receipts_key
      keys:
        _id: 1
      unique: true
    - name: idx_post_command_receipts_aggregate
      keys:
        aggregateId: 1
        aggregateVersion: -1
    - name: idx_post_command_receipts_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  content_outbox:
    publication_role: transactional_outbox
    entity: Post
    description: Mongo authoritative aggregate 的同库事务 outbox；projection worker 以 checkpoint 幂等消费
    indexes:
    - name: idx_content_outbox_event
      keys:
        _id: 1
      unique: true
    - name: idx_content_outbox_sequence
      keys:
        outboxSequence: 1
      unique: true
    - name: idx_content_outbox_aggregate_version
      keys:
        aggregateType: 1
        aggregateId: 1
        aggregateVersion: 1
      unique: true
  content_outbox_sequences:
    publication_role: publication_accessory
    entity: Post
    role: authoritative
    description: Post 事务 outbox 的单调全序分配器；仅与聚合状态和 outbox 在同一事务中推进。
  projection_checkpoints:
    publication_role: publication_accessory
    entity: Post
    description: Feed/Search/Recommendation/Homepage/Circle replay/rebuild checkpoint
    indexes:
    - name: idx_projection_checkpoint_consumer
      keys:
        _id: 1
      unique: true
  data_release_sequences:
    publication_role: publication_accessory
    entity: Post
    role: authoritative
    description: Content release stage与live物化使用的现役全局单调分配器，仅事务$inc推进。candidate冻结时取得的sourceVersion不随activation重分配；live物化序号不是对象源版本。ContentReleaseFenceChanged的envelope aggregateVersion使用after.revision，outbox传输顺序使用content_outbox_sequences，不互相替代。
  data_release_state:
    # safetyBinding只属于现有candidate控制行，不新建安全绑定ledger。
    publication_role: not_published
    entity: Post
    role: authoritative
    description: canonical immutable content release 的 Content owner-local 控制面。全流程为 prepared -> imported -> projected -> verified -> active，但 kind=candidate 的 status 只允许到 verified；kind=active_pointer 是每个 environment/sourceOwner 唯一 active binding，并由 application/public.ActiveReleaseFenceQueryPort 以 environment + sourceOwner exact key 提供跨服务 typed 只读 seam（transport adapter 可复用，禁止共享 Mongo）；既有 cmd/import --read-active-report 继续作为运维报告 adapter。Activate 在同一 Mongo transaction 中先把 verified candidate 原子物化到 posts/content_outbox/media_assets、对缺失旧Post仅标记release退出的live物化不可见状态，再以revision和expected-current tuple CAS pointer；同事务追加唯一ContentReleaseFenceChanged及其active提交回执，不发PostDeleted/PostPublished、不触发权威删除级联、不改保留candidate。任一步失败全部回滚。旧单文档 active shape 必须 fail closed，禁止 dual-read；candidate stage 或失败不得改变 previous active。所有activate/rollback写入必须先经同一application admission回读当前Search completed proof与User Creator source closure，并验证其余required查询/媒体/四域闭包；缺失不进入Mongo事务。candidate行额外持有safetyBinding:PostCandidateSafetyBinding，绑定verified完整Post集合及source snapshotDigest；只有显式stage/owner重验可记录，历史缺绑定not-ready且不得query补字段。source/proof组合查询匹配当前PostSafetyState，activation事务在live物化与pointer CAS前按objectDigest排序逐项真实写入fenceGeneration并核对allowed/safetyRevision；与Post安全命令写同键产生Mongo冲突。任何不匹配拒绝整candidate，不删减集合沿用原proof。proof来源为Search preparation持久终态，Content不另建Search进度集合或pointer；source/Provider generation与candidate保留在CAS/readback期间不得被并发部署/GC改写，查询证明不冒充跨Mongo/ES事务。
    indexes:
    - name: uq_data_release_state_environment_candidate
      keys: {environment: 1, sourceOwner: 1, kind: 1, releaseId: 1, manifestDigest: 1}
      unique: true
      partial_filter:
        kind: candidate
    - name: uq_data_release_state_active_pointer
      keys: {environment: 1, sourceOwner: 1, kind: 1}
      unique: true
      partial_filter:
        kind: active_pointer
  data_release_stage_receipts:
    publication_role: not_published
    entity: Post
    role: append_only
    description: 每次prepared/imported/projected/verified/active尝试的现役append-only回执，保持既有tuple/stage/attemptId唯一身份及duration/count/checkpoint/blocker。新的成功active回执在pointer事务内额外保存transition:ContentReleaseFenceChangedPayload、eventId:string、payloadDigest:string(sha256)，完整before/after来自同事务实际pointer而非事后推导；ReadContentReleaseCommitReceipt仅从该既有回执投影，不建第二ledger。缺完整transition的历史原件只保留审计，不补字段、不作为迟到事件提交资格；同意图精确active replay不追加重复事实。失败回执不得覆盖成功阶段或推进pointer。
    indexes:
    - name: uq_data_release_stage_receipt_attempt
      keys: {environment: 1, sourceOwner: 1, releaseId: 1, manifestDigest: 1, stage: 1, attemptId: 1}
      unique: true
    - name: idx_data_release_stage_receipt_timeline
      keys: {environment: 1, sourceOwner: 1, releaseId: 1, recordedAt: 1}
  data_release_candidate_posts:
    publication_role: not_published
    entity: Post
    role: projection
    description: 按environment/sourceOwner/releaseId/manifestDigest create-once隔离的verified candidate Post闭包，保存canonical源字段/documentDigest；源审计releaseDigest不替代manifestDigest。prepare和lifecycle使用同一Content公开mapper，verified replay只读不得改原摘要。Activate/rollback仅owner-bound物化live，不因旧live退出写candidate墓碑。保留服从privacy安全清理；含权威删除/隐私撤权/不可公开对象的候选整体失去activation/rollback资格，不能删减集合沿用原proof或借重新prepare复活；清理义务优先，不以immutable为豁免，合法新候选重新封存。
    indexes:
    - name: uq_data_release_candidate_post
      keys: {environment: 1, sourceOwner: 1, releaseId: 1, manifestDigest: 1, postId: 1}
      unique: true
    - name: idx_data_release_candidate_post_ref
      keys: {environment: 1, sourceOwner: 1, releaseId: 1, manifestDigest: 1, postRef: 1}
      unique: true
    - name: idx_data_release_candidate_post_safety_identity
      keys: {environment: 1, sourceOwner: 1, postId: 1}
      description: Data安全提交按canonical Post查全部保留候选引用，用于失效核验与清理清点；不把当前active当唯一目标。作者全候选索引待账户关闭集成实际使用时声明。
  data_release_candidate_outbox:
    publication_role: not_published
    entity: Post
    role: append_only
    description: candidate-scoped Post identity facts，只冻结target身份/binding/documentDigest，不是已发布对象lifecycle。每次Activate/rollback在既有pointer事务提交一条ContentReleaseFenceChanged到content_outbox并由content_outbox_sequences分配传输全序，不再为release转换产生逐Post PostPublished/PostDeleted。before/after及payloadDigest与既有active stage receipt一致；候选源版本与after.revision不互代，Search/Recommendation仅对账已准备exact候选，不补首次可读。
    indexes:
    - name: uq_data_release_candidate_outbox_event
      keys: {environment: 1, sourceOwner: 1, releaseId: 1, manifestDigest: 1, postId: 1}
      unique: true
  data_release_candidate_media_assets:
    publication_role: not_published
    entity: MediaAsset
    role: projection
    description: candidate-scoped importer-owned MediaAsset projection，create-once 保存 documentDigest。Stage 不写 live media_assets；Activate/rollback 先校验 assetId/sourceSessionId/ownerId/sha256，再以 owner-bound $set 更新 importer-owned 字段，保留 live rich descriptors；任一冲突回滚全部 live 写与 pointer。
    indexes:
    - name: uq_data_release_candidate_media_asset
      keys: {environment: 1, sourceOwner: 1, releaseId: 1, manifestDigest: 1, assetId: 1}
      unique: true
  rm_search_intent:
    publication_role: not_published
    entity: SearchIntentProjection
    role: projection
    description: 搜索 query/click 形成的 24 小时短期推荐特征；与长期 rm_recommend_feature 物理隔离。
    indexes:
    - name: idx_rm_search_intent_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  content_persona_access_projection:
    publication_role: not_published
    entity: Post
    role: projection
    description: Content 为 Post/Comment/Feed 服务端可见性维护的 Persona 拉黑访问投影；只保存 block/unblock，不复制 User follow 状态。
    indexes:
    - name: uq_content_persona_access_direction
      keys:
        sourcePersonaId: 1
        targetPersonaId: 1
      unique: true
    - name: idx_content_persona_access_source
      keys:
        sourcePersonaId: 1
        blocked: 1
        targetPersonaId: 1
    - name: idx_content_persona_access_target
      keys:
        targetPersonaId: 1
        blocked: 1
        sourcePersonaId: 1
  content_persona_access_projection_inbox:
    publication_role: not_published
    entity: Post
    role: inbox
    description: Persona relationship durable stream 的 Content 访问投影幂等 checkpoint；账号关闭时按 source/target Persona 删除。
    indexes:
    - name: uq_content_persona_access_event
      keys:
        eventId: 1
      unique: true
streams:
  events.content.post_release_candidate:
    entity: PostReleaseCandidatePrepared
    publication_role: publication_accessory
    role: append_only
    idempotency_key: publicationId
    retention_seconds: 604800
    description: 仅由Post content_outbox dispatcher发布不可变准备事实；source准备不等于active，也不允许Search/Recommendation直读本Mongo。
  events.content.post_lifecycle:
    publication_role: publication_accessory
    entity: Post
    role: append_only
    idempotency_key: eventId
    retention_seconds: 604800
    description: Content Post outbox唯一durable生命周期transport，同时承载专属ContentReleaseFenceChanged。consumer须按源event_ref的exact payload分派；fence事件aggregateId为environment/sourceOwner控制分区，普通Post事件aggregateId=postId，版本各自校验。评论/Reaction/媒体等删除consumer只处理权威PostDeleted，不能以同topic或缺postId把fence当删除/兼容事件；未知payload保留typed失败，不quiet ACK。
  events.search.recommendation_signals.dlq:
    publication_role: not_published
    entity: Post
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Content 旧推荐 signal consumer 的脱敏失败记录；该 consumer 随推荐逻辑迁出一并删除。
  events.user.persona_access.dlq:
    publication_role: not_published
    entity: Post
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Content Persona 访问控制投影无法解码或应用 User typed relationship event 时的脱敏失败记录。
redis_cache:
- key: cache:post:{postId}
  ttl_seconds: 300
  entity: Post
  invalidate_on:
  - PostUpdated
  - PostDeleted
- key: counter:{postId}:{type}
  ttl_seconds: null
  type: string
  description: 热点内容计数缓冲（INCR + 异步回写）
- key: content_analysis:{postId}
  ttl_seconds: 86400
  type: hash
  description: 内容多模态分析缓存
role: authoritative
