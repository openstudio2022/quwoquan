read_model: EntityWishlistState
description: >-
  当前登录 persona 对 canonical object 的显式想去状态，只读自 ContentBehaviorFact
  所拥有的 entity_wishlist_events，不承载写入语义。
source_entities: [ContentBehaviorFact]
consumers: [app]
fields:
  - {name: objectId, type: string, nullable: false}
  - {name: objectKind, type: string, nullable: false}
  - {name: wishlisted, type: bool, nullable: false}
