read_model: VideoPost
description: '视频类帖子 ReadModel（视频频道）。

  从 Post（contentType=video）投影，供发现页视频 Tab 消费。

  width/height 存储视频分辨率，在上传时由处理管道写入。

  '
storage_backend: mongodb
collection: rm_discovery_feed
source_entities:
- Post
consumers:
- app (discovery/video tab)
fields:
- name: postId
  type: ObjectId
- name: contentType
  type: enum
  description: 固定为 video
- name: contentIdentity
  type: enum
  description: 内容身份层。视频作品固定为 work
- name: authorId
  type: string
- name: authorDisplayName
  type: string
  description: 作者显示名（反范式）
- name: authorAvatarUrl
  type: string
  description: 作者头像（反范式）
- name: authorBackgroundUrl
  type: string
  nullable: true
  description: 作者主页背景图（反范式，null 表示未配置）
- name: authorRoleLabel
  type: string
  description: 作者角色短标签（反范式，如「旅行创作者」）
- name: authorIdentityTags
  type: '[]string'
  description: 作者身份标签（反范式，首页卡片最多展示 2 个）
- name: authorVerified
  type: bool
  description: 作者认证标记（反范式，驱动卡片认证角标）
- name: body
  type: string
  description: 视频简介（可选）
- name: sourceAttribution
  type: SourceAttribution
  nullable: true
  description: 外部来源视频原创者与权利事实；与平台发布作者分离
- name: videoUrl
  type: string
  description: 视频流 URL
- name: thumbnailUrl
  type: string
  description: 未播放态主封面 URL
- name: coverUrl
  type: string
  description: 通用封面 URL；视频时与 thumbnailUrl 同源或作兼容回退
- name: coverStrategy
  type: enum
  description: 视频封面策略 first_frame/manual
- name: coverFrameTimeMs
  type: int
  description: 视频封面帧时间点（毫秒）
- name: width
  type: int
  description: 视频分辨率宽（px），处理管道写入
- name: height
  type: int
  description: 视频分辨率高（px），处理管道写入
- name: mediaAssetId
  type: string
  description: ready MediaAsset 业务 ID；视频交付和 descriptor 的版本绑定锚点
- name: mediaAssetVersion
  type: int
  description: ready MediaAsset 版本；不得由客户端时长或上传会话替代
- name: durationMs
  type: int
  description: ready MediaAsset 服务端探测的权威视频时长（毫秒）
- name: previewTrackManifestUrl
  type: string
  nullable: true
  description: asset/version 绑定的 storyboard manifest 公开交付 URL；缺失时仅时间浮标降级
- name: previewTrackVersion
  type: int
  nullable: true
  description: storyboard 预览轨版本
- name: hlsCmafMasterManifestUrl
  type: string
  nullable: true
  description: ready MediaAsset 的 HLS/CMAF master manifest URL；渐进式 videoUrl 始终保留为同资产同版本回退
- name: hlsCmafDescriptorVersion
  type: int
  nullable: true
  description: HLS/CMAF descriptor 版本
- name: likeCount
  type: int
- name: commentCount
  type: int
- name: shareCount
  type: int
- name: publishedAt
  type: timestamp
- name: createdAt
  type: timestamp
  description: 内容首次进入系统时间（仅插入时写一次，永不变）
- name: updatedAt
  type: timestamp
  description: 内容最后实质变更时间（无实质变更不推进）
- name: contentVertical
  type: string
  nullable: true
  description: 推荐垂类归一结果，用于行为归因与观测分桶
- name: recallPath
  type: string
  nullable: true
  description: 推荐召回路径，用于行为归因与观测分桶
- name: supplySource
  type: string
  nullable: true
  description: 内容供给来源 user_generated/data_engineering/product_ops 等
