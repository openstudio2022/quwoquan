read_model: VideoPost
description: '视频类帖子 ReadModel（视频频道）。

  从 Post（contentType=video）投影，供发现页视频 Tab 消费。

  width/height 存储视频分辨率，在上传时由处理管道写入。

  '
storage_backend: mongodb
collection: rm_discovery_feed
source_entities:
- Post
consumers:
- app (discovery/video tab)
fields:
- name: postId
  type: ObjectId
- name: contentType
  type: enum
  description: 固定为 video
- name: contentIdentity
  type: enum
  description: 内容身份层。视频作品固定为 work
- name: authorId
  type: string
- name: authorDisplayName
  type: string
  description: 作者显示名（反范式）
- name: authorAvatarUrl
  type: string
  description: 作者头像（反范式）
- name: authorBackgroundUrl
  type: string
  nullable: true
  description: 作者主页背景图（反范式，null 表示未配置）
- name: authorRoleLabel
  type: string
  description: 作者角色短标签（反范式，如「旅行创作者」）
- name: authorIdentityTags
  type: '[]string'
  description: 作者身份标签（反范式，首页卡片最多展示 2 个）
- name: authorVerified
  type: bool
  description: 作者认证标记（反范式，驱动卡片认证角标）
- name: body
  type: string
  description: 视频简介（可选）
- name: sourceAttribution
  type: SourceAttribution
  nullable: true
  description: 外部来源视频原创者与权利事实；与平台发布作者分离
- name: videoUrl
  type: string
  description: 视频流 URL
- name: thumbnailUrl
  type: string
  description: 未播放态主封面 URL
- name: coverUrl
  type: string
  description: 通用封面 URL；视频时与 thumbnailUrl 同源或作兼容回退
- name: coverStrategy
  type: enum
  description: 视频封面策略 first_frame/manual
- name: coverFrameTimeMs
  type: int
  description: 视频封面帧时间点（毫秒）
- name: width
  type: int
  description: 视频分辨率宽（px），处理管道写入
- name: height
  type: int
  description: 视频分辨率高（px），处理管道写入
- name: mediaAssetId
  type: string
  description: ready MediaAsset 业务 ID；视频交付和 descriptor 的版本绑定锚点
- name: mediaAssetVersion
  type: int
  description: ready MediaAsset 版本；不得由客户端时长或上传会话替代
- name: durationMs
  type: int
  description: ready MediaAsset 服务端探测的权威视频时长（毫秒）
- name: previewTrackManifestUrl
  type: string
  nullable: true
  description: asset/version 绑定的 storyboard manifest 公开交付 URL；缺失时仅时间浮标降级
- name: previewTrackVersion
  type: int
  nullable: true
  description: storyboard 预览轨版本
- name: likeCount
  type: int
- name: commentCount
  type: int
- name: shareCount
  type: int
- name: publishedAt
  type: timestamp
- name: createdAt
  type: timestamp
  description: 内容首次进入系统时间（仅插入时写一次，永不变）
- name: updatedAt
  type: timestamp
  description: 内容最后实质变更时间（无实质变更不推进）
- name: contentVertical
  type: string
  nullable: true
  description: 推荐垂类归一结果，用于行为归因与观测分桶
- name: recallPath
  type: string
  nullable: true
  description: 推荐召回路径，用于行为归因与观测分桶
- name: supplySource
  type: string
  nullable: true
  description: 内容供给来源 user_generated/data_engineering/product_ops 等
client_projection:
  dart_class: VideoPostDto
  base_class: PostBaseDto
  output_path: cloud/runtime/generated/content/video_post_dto.g.dart
  dart_imports:
  - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
  - source_attribution_dto.g.dart
  computed_getters:
  - name: displayFormat
    source: displayFormat
    dart_return_type: String
    nullable: false
    description: 展示格式。视频作品固定为 video。
    body: return 'video';
  - name: aspectRatio
    source: aspectRatio
    dart_return_type: double?
    nullable: true
    description: 视频宽高比（w/h）。未记录分辨率时返回 null。
    body: 'if (width == null || height == null || height! <= 0) return null;

      return width! / height!;

      '
  fields:
  - name: id
    dart_type: String
    nullable: false
    source: postId
    default: ''''''
  - name: type
    dart_type: String
    nullable: false
    source: contentType
    default: '''video'''
  - name: identity
    dart_type: String
    nullable: false
    source: contentIdentity
    default: '''work'''
  - name: assistantUsePolicy
    dart_type: String
    nullable: false
    source: assistantUsePolicy
    default: '''inherit'''
  - name: authorId
    dart_type: String
    nullable: false
    source: authorId
    default: ''''''
  - name: displayName
    dart_type: String
    nullable: false
    source: authorDisplayName
    default: ''''''
  - name: avatarUrl
    dart_type: String
    nullable: false
    source: authorAvatarUrl
    default: ''''''
  - name: authorBackgroundUrl
    dart_type: String
    nullable: true
    source: authorBackgroundUrl
    default: 'null'
    description: 作者主页背景图（反范式）；null 时 UI 显示默认渐变背景
  - name: authorRoleLabel
    dart_type: String
    nullable: false
    source: authorRoleLabel
    default: ''''''
    description: 作者角色短标签（反范式），首页推荐卡顶部展示
  - name: authorIdentityTags
    dart_type: List<String>
    nullable: false
    source: authorIdentityTags
    default: <String>[]
    description: 作者身份标签（反范式），首页推荐卡顶部最多展示 2 个
  - name: authorVerified
    dart_type: bool
    nullable: false
    source: authorVerified
    default: 'false'
    description: 作者认证标记（反范式），驱动卡片认证角标
  - name: body
    dart_type: String
    nullable: true
    source: body
    default: 'null'
    description: 视频简介（可选）
  - name: sourceAttribution
    dart_type: SourceAttributionDto
    nullable: true
    source: sourceAttribution
    map_from_string_key_class: SourceAttributionDto
    default: 'null'
    description: 外部来源视频原创者与权利事实；与平台发布作者分离
  - name: videoUrl
    dart_type: String
    nullable: false
    source: videoUrl
    default: ''''''
    description: 视频流 URL
  - name: thumbnailUrl
    dart_type: String
    nullable: false
    source: thumbnailUrl
    default: ''''''
    description: 视频未播放态主封面图
  - name: coverUrl
    dart_type: String
    nullable: false
    source: coverUrl
    default: ''''''
    description: 通用封面图；视频时与 thumbnailUrl 同源或作为兼容回退
  - name: coverStrategy
    dart_type: String
    nullable: true
    source: coverStrategy
    default: 'null'
    description: 视频封面策略 first_frame/manual
  - name: coverFrameTimeMs
    dart_type: int
    nullable: true
    source: coverFrameTimeMs
    default: 'null'
    description: 视频封面帧时间点（毫秒）
  - name: width
    dart_type: int
    nullable: true
    source: width
    default: 'null'
    description: 视频分辨率宽（px）
  - name: height
    dart_type: int
    nullable: true
    source: height
    default: 'null'
    description: 视频分辨率高（px）
  - name: durationMs
    dart_type: int
    nullable: true
    source: durationMs
    default: 'null'
    description: ready MediaAsset 服务端探测的权威视频时长（毫秒）
  - name: mediaAssetId
    dart_type: String
    nullable: true
    source: mediaAssetId
    default: 'null'
    description: ready MediaAsset 业务 ID；播放 descriptor 的版本绑定锚点
  - name: mediaAssetVersion
    dart_type: int
    nullable: true
    source: mediaAssetVersion
    default: 'null'
    description: ready MediaAsset 版本
  - name: previewTrackManifestUrl
    dart_type: String
    nullable: true
    source: previewTrackManifestUrl
    default: 'null'
    description: asset/version 绑定的 storyboard manifest 公开交付 URL；不可用时 UI 仅显示时间浮标
  - name: previewTrackVersion
    dart_type: int
    nullable: true
    source: previewTrackVersion
    default: 'null'
    description: storyboard 预览轨版本
  - name: likeCount
    dart_type: int
    nullable: false
    source: likeCount
    default: '0'
  - name: commentCount
    dart_type: int
    nullable: false
    source: commentCount
    default: '0'
  - name: shareCount
    dart_type: int
    nullable: false
    source: shareCount
    default: '0'
  - name: createdAt
    dart_type: DateTime
    nullable: false
    source: createdAt
    default: DateTime(0)
    description: 创作时间（首次进入系统）。唯一源为 createdAt/created_at；不再以 publishedAt 借壳。
  - name: updatedAt
    dart_type: DateTime
    nullable: true
    source: updatedAt
    default: 'null'
    description: 最后实质更新时间；与 createdAt 相等或更早时 UI 只显示创作时间，更晚时显示创作+更新。
  - name: publishedAt
    dart_type: DateTime
    nullable: true
    source: publishedAt
    default: 'null'
    description: 首次公开时间（仅首次发布置位）。
  - name: contentVertical
    dart_type: String
    nullable: true
    source: contentVertical
    default: 'null'
    description: 推荐垂类归一结果；端侧行为上报透传，不参与 UI 展示。
  - name: recallPath
    dart_type: String
    nullable: true
    source: recallPath
    default: 'null'
    description: 推荐召回路径；端侧行为上报透传，不参与 UI 展示。
  - name: supplySource
    dart_type: String
    nullable: true
    source: supplySource
    default: 'null'
    description: 内容供给来源；端侧行为上报透传，不参与 UI 展示。
  - name: intersectionReasons
    dart_type: List<IntersectionReason>
    nullable: true
    source: intersectionReasons
    list_element_dart_class: IntersectionReason
    default: 'null'
    description: 交集理由（云侧推荐管线预生成；端只读展示，无来源时为 null）
