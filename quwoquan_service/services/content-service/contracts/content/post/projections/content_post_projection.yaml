read_model: ContentPostProjection
description: >-
  Feed、作者列表、足迹和 Post mutation 共用的公开内容投影；它不是 Post 聚合，
  不包含 CAS version、审核内部状态、幂等 receipt 或存储键。
source_entities: [Post, MediaAsset]
consumers: [app]
fields:
  - {name: postId, type: string, nullable: false}
  - {name: contentType, type: string, nullable: false}
  - {name: contentIdentity, type: string, nullable: true}
  - {name: assistantUsePolicy, type: enum, enum_ref: AssistantUsePolicy, nullable: true}
  - {name: authorId, type: string, nullable: true}
  - {name: authorDisplayName, type: string, nullable: true}
  - {name: authorAvatarUrl, type: string, nullable: true}
  # 作者头像的媒体资产标识与交付访问模式（DEC-033）：signed_grant 时 App 以
  # avatarAssetId 换取短签，禁止以 authorId 冒充媒体资产标识。
  - {name: authorAvatarAssetId, type: string, nullable: true}
  - {name: authorAvatarAccessMode, type: enum, enum_ref: MediaDeliveryAccessMode, nullable: true}
  - {name: authorBackgroundUrl, type: string, nullable: true}
  - {name: authorRoleLabel, type: string, nullable: true}
  - {name: authorIdentityTags, type: '[]string', nullable: true}
  - {name: authorVerified, type: bool, nullable: true}
  - {name: title, type: string, nullable: true}
  - {name: body, type: string, nullable: true}
  - {name: summary, type: string, nullable: true}
  - {name: coverUrl, type: string, nullable: true}
  - {name: articleTemplate, type: string, nullable: true}
  - {name: articleFontPreset, type: string, nullable: true}
  - {name: mediaUrls, type: '[]string', nullable: true}
  - {name: videoUrl, type: string, nullable: true}
  - {name: mediaAssetId, type: string, nullable: true}
  - {name: mediaAssetVersion, type: int, nullable: true}
  # 逐媒体交付绑定（DEC-033）：每条媒体（含逐图与 video 主媒体/poster）携带
  # 资产标识与 accessMode；为空时端按 mediaUrls/videoUrl 派生 public 单一序列。
  - {name: mediaItems, type: '[]PostMediaItem', nullable: true}
  - {name: hlsCmafMasterManifestUrl, type: string, nullable: true}
  - {name: hlsCmafDescriptorVersion, type: int, nullable: true}
  - {name: thumbnailUrl, type: string, nullable: true}
  - {name: width, type: int, nullable: true}
  - {name: height, type: int, nullable: true}
  - {name: durationMs, type: int, nullable: true}
  - {name: likeCount, type: int, nullable: false}
  - {name: commentCount, type: int, nullable: false}
  - {name: shareCount, type: int, nullable: false}
  # viewer 维度点赞态：true/false 为服务端权威值；null 表示本次响应未附着
  # viewer 态（匿名请求或读路径未 decorate），端侧不得据 null 回滚本地状态。
  - {name: viewerLiked, type: bool, nullable: true}
  # 内容的主实体锚点（canonical homepage 引用）：想去 CTA、实体跳转与
  # 地点类交集的意图信号源；无实体锚点的内容两字段均为 null。
  - {name: primaryHomepageId, type: string, nullable: true}
  - {name: primaryHomepageType, type: string, nullable: true}
  # 共同经历回流引用（作者主动关联的 canonical Gathering ID）：feed/沉浸卡
  # 溯源标「他们从这条内容出发一起去了」的物理载体；作者删除或取消关联为 null。
  - {name: gatheringRef, type: string, nullable: true}
  - {name: createdAt, type: timestamp, nullable: true}
  - {name: updatedAt, type: timestamp, nullable: true}
  - {name: publishedAt, type: timestamp, nullable: true}
  - {name: contentVertical, type: string, nullable: true}
  - {name: recallPath, type: string, nullable: true}
  - {name: supplySource, type: string, nullable: true}
  - {name: intersectionReasons, type: '[]IntersectionReason', nullable: true}
