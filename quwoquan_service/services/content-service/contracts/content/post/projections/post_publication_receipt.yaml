read_model: PostPublicationReceipt
description: 'SubmitPostPublication 的稳定提交回执。同一 PublishIntent 的任意重放返回同一 postId、

  pending_review/published 状态与首次接受时间；只有 published 允许 App 清理本地草稿。

  '
source_entities:
- Post
consumers:
- app
client_projection:
  dart_class: PostPublicationReceiptDto
  base_class: ''
  output_path: cloud/runtime/generated/content/content/post_publication_receipt_dto.g.dart
  fields:
  - name: publishIntentId
    dart_type: String
    nullable: false
    source: publishIntentId
    default: ''''''
  - name: localDraftId
    dart_type: String
    nullable: false
    source: localDraftId
    default: ''''''
  - name: postId
    dart_type: String
    nullable: false
    source: id
    default: ''''''
  - name: state
    dart_type: String
    nullable: false
    source: status
    default: ''''''
  - name: committedVersion
    dart_type: int
    nullable: false
    source: version
    default: '0'
  - name: acceptedAt
    dart_type: DateTime
    nullable: false
    source: createdAt
    default: 'DateTime.fromMillisecondsSinceEpoch(0, isUtc: true)'
