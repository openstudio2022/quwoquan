read_model: PostPublicationReceipt
description: >-
  SubmitPostPublication 的稳定提交回执；同一 PublishIntent 重放必须返回同一 postId、
  state、committedVersion 与首次 acceptedAt。
source_entities: [Post]
consumers: [app]
fields:
  - {name: publishIntentId, type: string, nullable: false}
  - {name: localDraftId, type: string, nullable: false}
  - {name: postId, type: string, nullable: false}
  - {name: state, type: string, nullable: false}
  - {name: committedVersion, type: int, nullable: false}
  - {name: acceptedAt, type: timestamp, nullable: false}
