realtime_contract: RecommendationFeedPatch
description: "低风险首页推荐实时 patch 契约（商用化阶段 7 · §G）。\n\n语义边界（与领域事件区分，禁止混入 events.yaml）：\n  - 这是「推荐 → 端」的瞬时提示通道，不是领域事件：不进\
  \ event_store、不跨服务消费、\n    不做 30 天持久化重放（避免用户重开 App 时重放一堆过期 refresh/hint）。\n  - 服务端只在安全边界发射，绝不主动重排用户正在看的内容；端侧只在不打断阅读位置的\n\
  \    前提下消费（合并到 discovery_feed_provider 的安全边界，不跳动当前位置）。\n\n三类 P1 patch：\n  - new_candidate_hint     \
  \   有新候选可刷新的提示（仅提示，不强插）。\n  - negative_feedback_removal 用户负反馈后，对应内容从当前 feed 剔除的 patch。\n  - refresh_suggestion\
  \        建议刷新（疲劳 / 时效启发式）。\n\n唯一真相源：本文件声明 envelope 字段、patch 类型、reason 码与剔除维度。\n  - Go 端 runtime/recommendation/realtime_patch.go\
  \ 的强类型 struct/常量必须与本文件一致\n    （由 realtime_patch_test.go 契约测试锁定，禁止第二套定义）。\n  - App 端强类型 DTO 由 codegen_app_metadata\
  \ 生成（DO NOT EDIT 产物），供下一波端侧消费对齐。\n"
realtime_channel_template: rt:rec:feed:user:{userId}
client_codegen:
  output_path: cloud/runtime/generated/recommendation/feed_realtime_patch.g.dart
  patch_type_enum: FeedRealtimePatchType
  reason_code_enum: FeedPatchReasonCode
  removal_dimension_enum: FeedPatchRemovalDimension
  envelope_class: FeedRealtimePatch
patch_types:
- id: new_candidate_hint
  disruption: hint
  description: 有新候选可纳入推荐（如用户关注图扩展），提示可刷新；端侧仅展示「有更新」入口，不强插。
- id: negative_feedback_removal
  disruption: silent_removal
  description: 用户负反馈后，端侧从当前 feed 剔除匹配内容；只剔除非当前阅读 / 未在视口的项。
- id: refresh_suggestion
  disruption: suggestion
  description: 疲劳 / 时效启发式触发，建议用户刷新；端侧仅提示，不自动刷新打断浏览。
reason_codes:
- id: negative_dislike
  patch_type: negative_feedback_removal
  description: 用户「不感兴趣」
- id: negative_hide_author
  patch_type: negative_feedback_removal
  description: 用户「减少该作者」
- id: negative_hide_content_type
  patch_type: negative_feedback_removal
  description: 用户「减少此类内容」
- id: negative_report
  patch_type: negative_feedback_removal
  description: 用户举报内容
- id: relationship_expanded
  patch_type: new_candidate_hint
  description: 关注/进圈/加联系人扩展了关系图，有新社交召回候选
- id: new_candidates_available
  patch_type: new_candidate_hint
  description: 命中兴趣的新内容入库可纳入
- id: session_fatigue
  patch_type: refresh_suggestion
  description: 会话内负反馈/快速跳过比例高，疲劳信号
- id: feed_staleness
  patch_type: refresh_suggestion
  description: 当前 feed 下发过久，时效信号
removal_dimensions:
- id: post
  description: 单条内容（targetPostIds 直接命中）
- id: author
  description: 同作者（removalDimensionValue=authorId）
- id: content_type
  description: 同内容类型（removalDimensionValue=contentType）
envelope_fields:
- name: patchId
  type: string
  dart_type: String
  nullable: false
  required: true
  default: ''''''
  description: 幂等去重 id，端侧据此去重已应用 patch
- name: patchType
  type: enum
  dart_type: FeedRealtimePatchType
  enum_ref: patch_type
  nullable: false
  required: true
  description: patch 类型
- name: userId
  type: string
  dart_type: String
  nullable: false
  required: true
  default: ''''''
  description: 目标用户（per-user 通道；游客不发）
- name: feedRequestId
  type: string
  dart_type: String
  nullable: true
  default: 'null'
  description: 关联的 feed 下发请求 id；端侧据此定位当前 feed，跨请求可空
- name: channelId
  type: string
  dart_type: String
  nullable: true
  default: 'null'
  description: feed 频道（recommend/following/video）
- name: targetPostIds
  type: '[]string'
  dart_type: List<String>
  nullable: false
  default: <String>[]
  description: 受影响 postId（removal 必填；hint/refresh 可空）
- name: reasonCode
  type: enum
  dart_type: FeedPatchReasonCode
  enum_ref: reason_code
  nullable: false
  required: true
  description: 触发原因码
- name: removalDimension
  type: enum
  dart_type: FeedPatchRemovalDimension
  enum_ref: removal_dimension
  nullable: true
  default: 'null'
  description: 剔除维度（仅 removal）
- name: removalDimensionValue
  type: string
  dart_type: String
  nullable: true
  default: 'null'
  description: 维度取值（authorId/contentType；维度=post 时为空）
- name: affectedCount
  type: int
  dart_type: int
  nullable: false
  default: '0'
  description: 受影响/新增候选数量（提示用，端侧可展示「N 条更新」）
- name: rankingVersion
  type: string
  dart_type: String
  nullable: true
  default: 'null'
  description: 关联精排版本（与 DiscoveryFeedPage.rankingVersion 同源）
- name: reasonVersion
  type: string
  dart_type: String
  nullable: true
  default: 'null'
  description: 理由生成版本，用于端云解释一致性
- name: safeToApplyWhileViewing
  type: bool
  dart_type: bool
  nullable: false
  default: 'false'
  description: 是否可在用户浏览时应用（恒为非打断式提示；端侧仍不得跳动当前阅读位置）
- name: emittedAt
  type: string
  dart_type: String
  nullable: false
  required: true
  default: ''''''
  description: 服务端发射时间（RFC3339）
