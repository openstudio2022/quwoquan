read_model: ContentDiscoveryFeedPageSlice
description: '首页发现流唯一响应 envelope。items 与 objectCards 均为已完成展示投影，

  outcome/emptyReason 明确区分内容页与合法空页；分页只使用绑定当前 feed 会话的

  nextCursor/previousCursor，不暴露兼容 cursor。

  releaseId/manifestDigest 是运行时内容激活身份（ContentActivationIdentity）：

  有内容、no_eligible_content 与 continuation 页必须携带完整身份；

  emptyReason=no_active_release 时两者必须同时缺席；解码或 Remote 失败只能是

  failure，不得编码为空态或缺席身份。

  '
source_entities:
- Post
- MediaAsset
- Homepage
source_projections:
- ContentPostProjection
- FeedObjectCard
consumers:
- app
fields:
- name: items
  type: '[]ContentPostProjection'
- name: outcome
  type: enum
  enum_ref: ContentFeedOutcome
- name: emptyReason
  type: enum
  enum_ref: ContentFeedEmptyReason
  nullable: true
- name: nextCursor
  type: string
  nullable: true
- name: previousCursor
  type: string
  nullable: true
- name: paginationExpiresAt
  type: timestamp
  nullable: true
- name: feedRequestId
  type: string
- name: policyDigest
  type: string
  nullable: true
- name: objectCards
  type: '[]FeedObjectCard'
- name: releaseId
  type: string
  nullable: true
- name: manifestDigest
  type: string
  nullable: true
