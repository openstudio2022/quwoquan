read_model: ContentPostDetailSlice
description: 'GetPost 返回的单对象详情 Slice，组合 Post 公开字段与详情扩展；

  端侧使用同名 pure contract 严格解码。媒体序列保留公开

  `mediaItems`，以便 Work Browser 使用与单视频字段同源的时长、封面和尺寸。

  '
source_entities:
- Post
- MediaAsset
consumers:
- app
client_projection:
