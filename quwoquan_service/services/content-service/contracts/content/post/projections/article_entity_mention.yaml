read_model: ArticleEntityMention
description: 'QWQ Rich Markdown 文章行内实体标签投影。实体标签由 Markdown 解析/数据工程出稿产生，

  端侧只根据结构化 span 渲染与导航，禁止 UI 正则识别正文。

  '
consumers:
- app
client_projection:
  dart_class: ArticleEntityMentionDto
  base_class: ''
  output_path: cloud/runtime/generated/content/article_entity_mention_dto.g.dart
  fields:
  - name: subjectType
    dart_type: String
    nullable: false
    source: subjectType
    default: ''''''
    description: 实体目标类型；V1.0 支持 homepage。
  - name: subjectId
    dart_type: String
    nullable: false
    source: subjectId
    default: ''''''
  - name: homepageId
    dart_type: String
    nullable: false
    source: homepageId
    default: ''''''
    description: 实体服务解析后的 canonical Homepage 标识；实体导航只允许消费该字段。
  - name: displayName
    dart_type: String
    nullable: false
    source: displayName
    default: ''''''
  - name: rangeStart
    dart_type: int
    nullable: false
    source: rangeStart
    default: '0'
  - name: rangeEnd
    dart_type: int
    nullable: false
    source: rangeEnd
    default: '0'
