client_projection:
  computed_getters:
  - body: 'if (type == ''video'' || (videoUrl != null && videoUrl!.isNotEmpty)) return ''video'';

      if (type == ''article'') return ''note'';

      if (type == ''image'') return ''image'';

      if (imageUrls.isNotEmpty) return ''image'';

      return ''note'';

      '
    dart_return_type: String
    description: 发现流展示格式：moment 由素材组合推导，work 由 type 映射。
    name: displayFormat
    nullable: false
  dart_class: FeedItemDto
  dart_imports:
  - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
  fields:
  - dart_type: String
    default: ''''''
    name: id
    nullable: false
    source: postId
  - dart_type: String
    default: ''''''
    description: photo / video / article / moment（客户端展示类型，micro→moment 在服务侧已处理）
    name: type
    nullable: false
    source: contentType
  - dart_type: String
    default: '(m[''type'']?.toString() == ''micro'' ? ''moment'' : ''work'')'
    name: identity
    nullable: false
    source: contentIdentity
  - dart_type: String
    default: '''inherit'''
    name: assistantUsePolicy
    nullable: false
    source: assistantUsePolicy
  - dart_type: String
    default: ''''''
    name: authorId
    nullable: false
    source: authorId
  - dart_type: String
    default: ''''''
    name: displayName
    nullable: false
    source: authorDisplayName
  - dart_type: String
    default: ''''''
    name: avatarUrl
    nullable: false
    source: authorAvatarUrl
  - dart_type: String
    default: ''''''
    description: 作者角色短标签（反范式），首页推荐卡顶部展示
    name: authorRoleLabel
    nullable: false
    source: authorRoleLabel
  - dart_type: List<String>
    default: <String>[]
    description: 作者身份标签（反范式），首页推荐卡顶部最多展示 2 个
    name: authorIdentityTags
    nullable: false
    source: authorIdentityTags
  - dart_type: bool
    default: 'false'
    description: 作者认证标记（反范式），驱动卡片认证角标
    name: authorVerified
    nullable: false
    source: authorVerified
  - dart_type: String
    default: 'null'
    name: title
    nullable: true
    source: title
  - dart_type: String
    default: 'null'
    description: 微趣/文章正文；图片/视频可选配文
    name: body
    nullable: true
    source: body
  - dart_type: String
    default: ''''''
    name: coverUrl
    nullable: false
    source: coverUrl
  - dart_type: String
    default: ''''''
    description: 视频封面/图片缩略图；优先 thumbnailUrl，回退 coverUrl
    name: thumbnailUrl
    nullable: false
    source: thumbnailUrl
  - dart_type: String
    default: 'null'
    name: videoUrl
    nullable: true
    source: videoUrl
  - dart_type: String
    default: 'null'
    description: ready MediaAsset 业务 ID；首页 progressive 与 HLS/CMAF 的版本绑定锚点
    name: mediaAssetId
    nullable: true
    source: mediaAssetId
  - dart_type: int
    default: 'null'
    description: ready MediaAsset 版本；必须同时约束 progressive 与 adaptive 候选
    name: mediaAssetVersion
    nullable: true
    source: mediaAssetVersion
  - dart_type: String
    default: 'null'
    description: HLS/CMAF master manifest URL；端侧 capability 与 feature flag 未同时开启时忽略
    name: hlsCmafMasterManifestUrl
    nullable: true
    source: hlsCmafMasterManifestUrl
  - dart_type: int
    default: 'null'
    description: HLS/CMAF descriptor 版本；非法或缺失时继续使用 progressive videoUrl
    name: hlsCmafDescriptorVersion
    nullable: true
    source: hlsCmafDescriptorVersion
  - dart_type: List<String>
    default: <String>[]
    description: 图片帖子的图片列表
    name: imageUrls
    nullable: false
    source: mediaUrls
  - dart_type: int
    default: 'null'
    description: 视频时长（毫秒）；图片帖子为 null
    name: durationMs
    nullable: true
    source: durationMs
  - dart_type: String
    default: 'null'
    description: 视频封面策略 first_frame/manual；非视频内容为 null
    name: coverStrategy
    nullable: true
    source: coverStrategy
  - dart_type: int
    default: 'null'
    description: 视频封面帧时间点（毫秒）；非视频内容为 null
    name: coverFrameTimeMs
    nullable: true
    source: coverFrameTimeMs
  - dart_type: int
    default: 'null'
    description: 主媒体宽度（px）；Mock/沉浸布局用，可为空
    name: width
    nullable: true
    source: width
  - dart_type: int
    default: 'null'
    description: 主媒体高度（px）；Mock/沉浸布局用，可为空
    name: height
    nullable: true
    source: height
  - dart_type: int
    default: '0'
    name: likeCount
    nullable: false
    source: likeCount
  - dart_type: int
    default: '0'
    name: commentCount
    nullable: false
    source: commentCount
  - dart_type: int
    default: '0'
    name: shareCount
    nullable: false
    source: shareCount
  - dart_type: DateTime
    default: DateTime(0)
    description: 创作时间（首次进入系统）。唯一源为 createdAt/created_at；不再以 publishedAt 借壳。
    name: createdAt
    nullable: false
    source: createdAt
  - dart_type: DateTime
    default: 'null'
    description: 最后实质更新时间；与 createdAt 相等或更早时 UI 只显示创作时间，更晚时显示创作+更新。
    name: updatedAt
    nullable: true
    source: updatedAt
  - dart_type: DateTime
    default: 'null'
    description: 首次公开时间（仅首次发布置位）。
    name: publishedAt
    nullable: true
    source: publishedAt
  - dart_type: List<String>
    default: 'null'
    name: tagRefs
    nullable: true
    source: tagRefs
  - dart_type: String
    default: 'null'
    name: visibility
    nullable: true
    source: visibility
  - dart_type: String
    default: 'null'
    name: summary
    nullable: true
    source: summary
  - dart_type: String
    default: 'null'
    name: authorBackgroundUrl
    nullable: true
    source: authorBackgroundUrl
  - dart_type: String
    default: 'null'
    name: articleTemplate
    nullable: true
    source: articleTemplate
  - dart_type: String
    default: 'null'
    name: articleFontPreset
    nullable: true
    source: articleFontPreset
  - dart_type: String
    default: 'null'
    name: articleMarkdownDigest
    nullable: true
    source: articleMarkdownDigest
  - dart_type: Map<String, dynamic>
    default: 'null'
    name: articleRenderProfile
    nullable: true
    source: articleRenderProfile
  - dart_type: String
    default: 'null'
    name: contentVertical
    nullable: true
    source: contentVertical
  - dart_type: String
    default: 'null'
    description: 推荐召回路径；端侧行为上报原样透传，不参与 UI 展示。
    name: recallPath
    nullable: true
    source: recallPath
  - dart_type: String
    default: 'null'
    description: 内容供给来源；端侧行为上报原样透传，用于 UGC/数据工程分桶。
    name: supplySource
    nullable: true
    source: supplySource
  - dart_type: String
    default: 'null'
    name: paperThemeMode
    nullable: true
    source: paperThemeMode
  - dart_type: String
    default: 'null'
    name: paperTexture
    nullable: true
    source: paperTexture
  - dart_type: List<Map<String, dynamic>>
    default: 'null'
    name: cards
    nullable: true
    source: cards
  - dart_type: int
    default: 'null'
    name: articlePresentationVersion
    nullable: true
    source: articlePresentationVersion
  - dart_type: List<IntersectionReason>
    default: 'null'
    list_element_dart_class: IntersectionReason
    name: intersectionReasons
    nullable: true
    source: intersectionReasons
  - dart_type: String
    default: 'null'
    description: 内容溯源——生成此内容的数据工程任务 id
    name: sourceTaskId
    nullable: true
    source: sourceTaskId
  - dart_type: Map<String, dynamic>
    default: 'null'
    description: 条件画像 {regions:[]string, seasons:[]string, altitudeMeters:int?}（从主实体冗余）
    name: conditionProfile
    nullable: true
    source: conditionProfile
  output_path: cloud/runtime/generated/content/feed_item_dto.g.dart
collection: rm_discovery_feed
consumers:
- app (feed)
- recommendation-engine
description: '发现流 ReadModel。聚合 Post + 用户行为 + 推荐特征，

  供 App 信息流消费。由 Projector 从 Post 和行为事件投影构建。

  '
read_contract:
  limit:
    minimum: 1
    maximum: 20
    default: 20
  pagination:
    strategy: sealed_continuation
    cursor: opaque_aes_gcm
    ttl_seconds: 600
    max_continuation_depth: 50
    invalid_cursor: fail_closed_invalid_argument
fields:
- name: postId
  type: ObjectId
  max_utf8_bytes: 256
- name: contentType
  type: enum
- description: 内容身份层。moment/work，用于跨面统一过滤
  name: contentIdentity
  type: enum
- name: authorId
  type: string
- description: 系统/平台创作者画像 ID
  name: creatorProfileId
  type: string
- description: 创作者类型，用于推荐多样性与作者分布控制
  name: creatorArchetype
  type: string
- description: 内容写入时绑定的作者画像版本
  name: creatorProfileVersion
  type: string
- description: 用户可见的虚拟创作者披露
  name: creatorDisclosure
  type: object
- description: 经验声明模式，禁止伪真实亲历
  name: experienceClaimMode
  type: string
- description: 作者质量/疲劳/风险调度信号
  name: authorQualitySignals
  type: object
- name: title
  type: string
- name: tagRefs
  type: '[]string'
- description: 实体引用（POI/主页等），承载交集实体维度与推荐实体亲和
  name: entityRefs
  type: '[]string'
- name: coverUrl
  type: string
- description: 视频未播放态主封面；默认首帧，手工选帧覆盖
  name: thumbnailUrl
  type: string
- description: 视频播放 URL；非视频内容为空
  name: videoUrl
  type: string
- description: ready MediaAsset 业务 ID；绑定首页 progressive 与 HLS/CMAF 候选
  name: mediaAssetId
  type: string
- description: ready MediaAsset 版本；与 mediaAssetId 共同约束播放候选
  name: mediaAssetVersion
  type: int
- description: HLS/CMAF master manifest URL；始终保留同资产同版本 progressive videoUrl 回退
  name: hlsCmafMasterManifestUrl
  type: string
- description: HLS/CMAF descriptor 版本；缺失时 adaptive 未就绪
  name: hlsCmafDescriptorVersion
  type: int
- description: 视频封面策略 first_frame/manual；非视频内容为空
  name: coverStrategy
  type: enum
- description: 视频封面帧时间点；非视频内容为空
  name: coverFrameTimeMs
  type: int
- description: 视频时长（毫秒）；非视频内容为空
  name: durationMs
  type: int
- description: 主媒体宽度（px）；可为空
  name: width
  type: int
- description: 主媒体高度（px）；可为空
  name: height
  type: int
- name: likeCount
  type: int
- name: commentCount
  type: int
- name: viewCount
  type: int
- description: 行为投影最后成功应用的 rm_behavior_events ObjectID 十六进制水位；仅用于 $inc 幂等重放，不进入客户端 DTO
  name: behaviorProjectionLastId
  type: string
- name: publishedAt
  type: timestamp
- description: 内容首次进入系统时间（仅插入时写一次，永不变）
  name: createdAt
  type: timestamp
- description: 内容最后实质变更时间（无实质变更不推进）
  name: updatedAt
  type: timestamp
- description: 推荐分（实时计算）
  name: recScore
  type: float
- description: 内容质量分投影；推荐读路径只消费该投影，不同步打分
  name: qualityScore
  type: float
- description: 本次下发命中的具名读路径（tag/hot/social/collab_i2i/collab_u2i/explore/post_query 等），用于行为归因与运营分桶
  name: recallPath
  type: string
- description: 推荐垂类归一结果（general/travel_photography/...），用于垂类推荐与观测分桶
  name: contentVertical
  type: string
- description: 内容供给来源 user_generated/data_engineering/product_ops 等，用于 UGC 与数据工程内容效果分桶
  name: supplySource
  type: string
- description: canonical 第一方供给 owner；环境发布内容固定为 qwq_data
  name: sourceOwner
  type: string
- description: immutable Data release 身份；推荐首刷必须与 ActiveSupply snapshot 一致
  name: releaseId
  type: string
- description: immutable release payload digest；用于供给 readback 与 hydration 一致性
  name: manifestDigest
  type: string
- description: release 投影生命周期；只有 active 可进入首刷召回
  name: lifecycleStatus
  type: enum
- description: 内容发布状态；推荐召回只消费 published
  name: status
  type: enum
- description: 内容可见性；公开发现流只消费 public
  name: visibility
  type: enum
- description: 作者显示名（反范式）
  name: authorDisplayName
  type: string
- description: 作者头像（反范式）
  name: authorAvatarUrl
  type: string
- description: 作者角色短标签（反范式，如「旅行创作者」）
  name: authorRoleLabel
  type: string
- description: 作者身份标签（反范式，首页卡片最多展示 2 个）
  name: authorIdentityTags
  type: '[]string'
- description: 作者认证标记（反范式，驱动卡片认证角标）
  name: authorVerified
  type: bool
- description: 交集理由（云侧推荐管线预生成，B1；端只读展示，无来源时为空）
  name: intersectionReasons
  type: '[]object'
- description: 内容溯源——生成此内容的数据工程任务 id（效果回流按 sourceTask 归因；从 Post 冗余）
  name: sourceTaskId
  type: string
- description: 条件画像（从主实体冗余）：结构化子键 {regions:[]string, seasons:[]string, altitudeMeters:int?}，供地域/季节召回与精排匹配
  name: conditionProfile
  type: object
indexes:
- keys:
    postId: 1
  name: uq_df_post_id
  unique: true
- keys:
    status: 1
    visibility: 1
    recScore: -1
    publishedAt: -1
    postId: -1
  name: idx_df_recommend_recency
- keys:
    status: 1
    visibility: 1
    contentVertical: 1
    recScore: -1
    publishedAt: -1
    postId: -1
  name: idx_df_recommend_vertical_recency
- keys:
    status: 1
    visibility: 1
    sourceOwner: 1
    releaseId: 1
    manifestDigest: 1
    lifecycleStatus: 1
    recScore: -1
    publishedAt: -1
    postId: -1
  name: idx_df_active_release_recency
- keys:
    status: 1
    visibility: 1
    sourceOwner: 1
    releaseId: 1
    manifestDigest: 1
    lifecycleStatus: 1
    contentVertical: 1
    recScore: -1
    publishedAt: -1
    postId: -1
  name: idx_df_active_release_vertical_recency
- keys:
    status: 1
    visibility: 1
    contentType: 1
    publishedAt: -1
    postId: -1
  name: idx_df_type_recency
- keys:
    status: 1
    visibility: 1
    authorId: 1
    publishedAt: -1
    postId: -1
  name: idx_df_author_recency
read_model: DiscoveryFeed
source_entities:
- Post
- ContentReaction
- VisitRecord
source_events:
- PostPublished
- ContentReactionSet
- ContentReactionCleared
- BehaviorBatchReported
storage_backend: mongodb
