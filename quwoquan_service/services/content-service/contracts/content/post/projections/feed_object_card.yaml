read_model: FeedObjectCard
description: '首页混合对象卡（B4 阶段一插卡模式）：随 GET /content/feed 响应 envelope 的

  objectCards 字段下发，由独立对象召回器产出（S0 仅 entity_homepage；

  user_card/circle_card 契约同批定义、S1 触发开启）。anchorIndex 指示该卡应

  插入在 items[anchorIndex] 之前；对象卡不占用内容候选池，客户端渲染后按

  objectId/objectKind 走既有行为归因（behaviors.yaml common_fields）。

  '
source_entities:
- Post
- Homepage
consumers:
- app
- recommendation
client_projection:
  dart_class: FeedObjectCardDto
  base_class: ''
  output_path: cloud/runtime/generated/content/feed_object_card_dto.g.dart
  fields:
  - name: objectKind
    dart_type: String
    nullable: false
    source: objectKind
    default: ''''''
  - name: objectId
    dart_type: String
    nullable: false
    source: objectId
    default: ''''''
  - name: title
    dart_type: String
    nullable: false
    source: title
    default: ''''''
  - name: subtitle
    dart_type: String
    nullable: false
    source: subtitle
    default: ''''''
  - name: coverUrl
    dart_type: String
    nullable: false
    source: coverUrl
    default: ''''''
  - name: tagRefs
    dart_type: List<String>
    nullable: false
    source: tagRefs
  - name: reasonText
    dart_type: String
    nullable: false
    source: reasonText
    default: ''''''
  - name: recallPath
    dart_type: String
    nullable: false
    source: recallPath
    default: ''''''
  - name: anchorIndex
    dart_type: int
    nullable: false
    source: anchorIndex
    default: '0'
