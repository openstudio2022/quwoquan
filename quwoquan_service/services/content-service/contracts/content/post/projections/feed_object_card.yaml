read_model: FeedObjectCard
description: >-
  Content 在 Post hydration 后随 FeedDeliveryPage 交付的对象卡公开快照；候选身份、
  标签、理由和召回路径来自不可变 RankedRecommendationWindow，Content 只确定 anchorIndex。
source_entities: [Post, Homepage]
consumers: [app]
fields:
  - {name: objectKind, type: string, nullable: false}
  - {name: objectId, type: string, nullable: false}
  - {name: title, type: string, nullable: false}
  - {name: subtitle, type: string, nullable: true}
  - {name: coverUrl, type: string, nullable: true}
  - {name: tagRefs, type: '[]string', nullable: false}
  - {name: reasonText, type: string, nullable: true}
  - {name: recallPath, type: string, nullable: true}
  - {name: anchorIndex, type: int, nullable: false}
