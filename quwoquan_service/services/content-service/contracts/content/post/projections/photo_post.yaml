read_model: PhotoPost
description: '图片类帖子 ReadModel（美图频道）。

  从 Post（contentType=image）投影，供发现页美图 Tab 消费。

  width/height 在内容上传时写入，前端直接计算宽高比，无需运行时请求图片元数据。

  '
storage_backend: mongodb
collection: rm_discovery_feed
source_entities:
- Post
consumers:
- app (discovery/photo tab)
fields:
- name: postId
  type: ObjectId
- name: contentType
  type: enum
  description: 固定为 image
- name: contentIdentity
  type: enum
  description: 内容身份层。图片作品固定为 work
- name: authorId
  type: string
- name: authorDisplayName
  type: string
  description: 作者显示名（反范式）
- name: authorAvatarUrl
  type: string
  description: 作者头像（反范式）
- name: authorBackgroundUrl
  type: string
  nullable: true
  description: 作者主页背景图（反范式，null 表示未配置）
- name: authorRoleLabel
  type: string
  description: 作者角色短标签（反范式，如「旅行创作者」）
- name: authorIdentityTags
  type: '[]string'
  description: 作者身份标签（反范式，首页卡片最多展示 2 个）
- name: authorVerified
  type: bool
  description: 作者认证标记（反范式，驱动卡片认证角标）
- name: body
  type: string
  description: 配文（可选）
- name: coverUrl
  type: string
  description: 主图 URL
- name: mediaUrls
  type: '[]string'
  description: 图片列表
- name: width
  type: int
  description: 主图宽度（px），上传时写入，用于布局计算宽高比
- name: height
  type: int
  description: 主图高度（px），上传时写入，用于布局计算宽高比
- name: likeCount
  type: int
- name: commentCount
  type: int
- name: shareCount
  type: int
- name: publishedAt
  type: timestamp
- name: createdAt
  type: timestamp
  description: 内容首次进入系统时间（仅插入时写一次，永不变）
- name: updatedAt
  type: timestamp
  description: 内容最后实质变更时间（无实质变更不推进）
- name: contentVertical
  type: string
  nullable: true
  description: 推荐垂类归一结果，用于行为归因与观测分桶
- name: recallPath
  type: string
  nullable: true
  description: 推荐召回路径，用于行为归因与观测分桶
- name: supplySource
  type: string
  nullable: true
  description: 内容供给来源 user_generated/data_engineering/product_ops 等
