read_model: PhotoPost
description: '图片类帖子 ReadModel（美图频道）。

  从 Post（contentType=image）投影，供发现页美图 Tab 消费。

  width/height 在内容上传时写入，前端直接计算宽高比，无需运行时请求图片元数据。

  '
storage_backend: mongodb
collection: rm_discovery_feed
source_entities:
- Post
consumers:
- app (discovery/photo tab)
fields:
- name: postId
  type: ObjectId
- name: contentType
  type: enum
  description: 固定为 image
- name: contentIdentity
  type: enum
  description: 内容身份层。图片作品固定为 work
- name: authorId
  type: string
- name: authorDisplayName
  type: string
  description: 作者显示名（反范式）
- name: authorAvatarUrl
  type: string
  description: 作者头像（反范式）
- name: authorBackgroundUrl
  type: string
  nullable: true
  description: 作者主页背景图（反范式，null 表示未配置）
- name: authorRoleLabel
  type: string
  description: 作者角色短标签（反范式，如「旅行创作者」）
- name: authorIdentityTags
  type: '[]string'
  description: 作者身份标签（反范式，首页卡片最多展示 2 个）
- name: authorVerified
  type: bool
  description: 作者认证标记（反范式，驱动卡片认证角标）
- name: body
  type: string
  description: 配文（可选）
- name: coverUrl
  type: string
  description: 主图 URL
- name: mediaUrls
  type: '[]string'
  description: 图片列表
- name: width
  type: int
  description: 主图宽度（px），上传时写入，用于布局计算宽高比
- name: height
  type: int
  description: 主图高度（px），上传时写入，用于布局计算宽高比
- name: likeCount
  type: int
- name: commentCount
  type: int
- name: shareCount
  type: int
- name: publishedAt
  type: timestamp
- name: createdAt
  type: timestamp
  description: 内容首次进入系统时间（仅插入时写一次，永不变）
- name: updatedAt
  type: timestamp
  description: 内容最后实质变更时间（无实质变更不推进）
- name: contentVertical
  type: string
  nullable: true
  description: 推荐垂类归一结果，用于行为归因与观测分桶
- name: recallPath
  type: string
  nullable: true
  description: 推荐召回路径，用于行为归因与观测分桶
- name: supplySource
  type: string
  nullable: true
  description: 内容供给来源 user_generated/data_engineering/product_ops 等
client_projection:
  dart_class: PhotoPostDto
  base_class: PostBaseDto
  output_path: cloud/runtime/generated/content/photo_post_dto.g.dart
  dart_imports:
  - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
  computed_getters:
  - name: displayFormat
    source: displayFormat
    dart_return_type: String
    nullable: false
    description: 展示格式。图片作品固定为 image。
    body: return 'image';
  - name: aspectRatio
    source: aspectRatio
    dart_return_type: double?
    nullable: true
    description: 宽高比（w/h）。未记录尺寸时返回 null，调用方可使用默认比例。
    body: 'if (width == null || height == null || height! <= 0) return null;

      return width! / height!;

      '
  fields:
  - name: id
    dart_type: String
    nullable: false
    source: postId
    default: ''''''
  - name: type
    dart_type: String
    nullable: false
    source: contentType
    default: '''image'''
  - name: identity
    dart_type: String
    nullable: false
    source: contentIdentity
    default: '''work'''
  - name: assistantUsePolicy
    dart_type: String
    nullable: false
    source: assistantUsePolicy
    default: '''inherit'''
  - name: authorId
    dart_type: String
    nullable: false
    source: authorId
    default: ''''''
  - name: displayName
    dart_type: String
    nullable: false
    source: authorDisplayName
    default: ''''''
  - name: avatarUrl
    dart_type: String
    nullable: false
    source: authorAvatarUrl
    default: ''''''
  - name: authorBackgroundUrl
    dart_type: String
    nullable: true
    source: authorBackgroundUrl
    default: 'null'
    description: 作者主页背景图（反范式）；null 时 UI 显示默认渐变背景
  - name: authorRoleLabel
    dart_type: String
    nullable: false
    source: authorRoleLabel
    default: ''''''
    description: 作者角色短标签（反范式），首页推荐卡顶部展示
  - name: authorIdentityTags
    dart_type: List<String>
    nullable: false
    source: authorIdentityTags
    default: <String>[]
    description: 作者身份标签（反范式），首页推荐卡顶部最多展示 2 个
  - name: authorVerified
    dart_type: bool
    nullable: false
    source: authorVerified
    default: 'false'
    description: 作者认证标记（反范式），驱动卡片认证角标
  - name: body
    dart_type: String
    nullable: true
    source: body
    default: 'null'
    description: 配文（可选）
  - name: coverUrl
    dart_type: String
    nullable: false
    source: coverUrl
    default: ''''''
    description: 主图 URL（通常为第一张图）
  - name: imageUrls
    dart_type: List<String>
    nullable: false
    source: mediaUrls
    default: <String>[]
    description: 图片列表（含全部图片）
  - name: width
    dart_type: int
    nullable: true
    source: width
    default: 'null'
    description: 主图宽度（px），上传时写入，布局计算用
  - name: height
    dart_type: int
    nullable: true
    source: height
    default: 'null'
    description: 主图高度（px），上传时写入，布局计算用
  - name: likeCount
    dart_type: int
    nullable: false
    source: likeCount
    default: '0'
  - name: commentCount
    dart_type: int
    nullable: false
    source: commentCount
    default: '0'
  - name: shareCount
    dart_type: int
    nullable: false
    source: shareCount
    default: '0'
  - name: createdAt
    dart_type: DateTime
    nullable: false
    source: createdAt
    default: DateTime(0)
    description: 创作时间（首次进入系统）。唯一源为 createdAt/created_at；不再以 publishedAt 借壳。
  - name: updatedAt
    dart_type: DateTime
    nullable: true
    source: updatedAt
    default: 'null'
    description: 最后实质更新时间；与 createdAt 相等或更早时 UI 只显示创作时间，更晚时显示创作+更新。
  - name: publishedAt
    dart_type: DateTime
    nullable: true
    source: publishedAt
    default: 'null'
    description: 首次公开时间（仅首次发布置位）。
  - name: contentVertical
    dart_type: String
    nullable: true
    source: contentVertical
    default: 'null'
    description: 推荐垂类归一结果；端侧行为上报透传，不参与 UI 展示。
  - name: recallPath
    dart_type: String
    nullable: true
    source: recallPath
    default: 'null'
    description: 推荐召回路径；端侧行为上报透传，不参与 UI 展示。
  - name: supplySource
    dart_type: String
    nullable: true
    source: supplySource
    default: 'null'
    description: 内容供给来源；端侧行为上报透传，不参与 UI 展示。
  - name: intersectionReasons
    dart_type: List<IntersectionReason>
    nullable: true
    source: intersectionReasons
    list_element_dart_class: IntersectionReason
    default: 'null'
    description: 交集理由（云侧推荐管线预生成；端只读展示，无来源时为 null）
