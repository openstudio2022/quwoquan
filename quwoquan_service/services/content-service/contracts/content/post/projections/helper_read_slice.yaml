read_model: HelperReadSlice
description: >-
  GetHelperRead 的公开最小读模型。仅包含通过 published/public/approved
  可见性门禁后的文章身份与摘要，不承载聚合状态或私有字段。
source_entities:
- Post
consumers:
- app
fields:
- {name: postId, type: string, nullable: false}
- {name: contentType, type: string, nullable: false}
- {name: title, type: string, nullable: false}
- {name: summary, type: string, nullable: false}
