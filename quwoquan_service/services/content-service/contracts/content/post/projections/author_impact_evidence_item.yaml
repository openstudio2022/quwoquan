read_model: AuthorImpactEvidenceItem
description: Privacy-safe content-anchored evidence row; actor identity is never exposed.
source_entities: [RecommendationFeatureProfileView, Post]
consumers: [app]
fields:
  - {name: evidenceId, type: string, nullable: false}
  - {name: impactId, type: string, nullable: false}
  - {name: helpType, type: string, nullable: false}
  - {name: action, type: string, nullable: false}
  - {name: intersectionDimension, type: string, nullable: false}
  - {name: occurredAt, type: timestamp, nullable: false}
  - {name: summaryText, type: string, nullable: false}
  - {name: sampleVisual, type: IntersectionVisual, nullable: true}
  - {name: representativeActor, type: IntersectionRepresentativeActor, nullable: true}
  - {name: actionHints, type: '[]IntersectionActionHint', nullable: false}
  - {name: contentTarget, type: IntersectionTarget, nullable: true}
