aggregate: Post
description: 'Post 实体端侧 UI 可配置项声明。

  codegen 从本文件生成 Dart ContentUIConfig（DO NOT EDIT），

  端侧 UI 代码通过 ContentUIConfig 消费配置，消除硬编码。

  label_key 引用 UITextConstants，icon 引用 Material Icons name（字符串）。

  feature_flags 为编译期常量（修改需发版）；

  预留 runtime_overridable: true 标记，便于未来接入 Remote Config 覆盖。

  '
home_channels:
- id: following
  label_key: home_tab_following
  template: single_column_relations
  layout_template: singleColumnRelations
  phone_columns: 1
  supports_full_span_modules: false
  intersection_module_policy: none
  content_card_policy: richRelation
  feed_query:
    channel: following
  mood_copy_key: home_mood_following
  order: 0
  runtime_overridable: true
- id: recommend
  label_key: home_tab_recommend
  template: single_column_multiform
  layout_template: singleColumnMultiForm
  phone_columns: 1
  supports_full_span_modules: false
  intersection_module_policy: inlineOnly
  content_card_policy: richMultiForm
  feed_query:
    channel: recommend
  mood_copy_key: home_mood_recommend
  order: 1
  runtime_overridable: true
- id: campus
  label_key: home_tab_campus
  template: single_column_multiform
  layout_template: singleColumnMultiForm
  phone_columns: 1
  supports_full_span_modules: false
  intersection_module_policy: inlineOnly
  content_card_policy: richMultiForm
  feed_query:
    channel: campus
  mood_copy_key: home_mood_campus
  order: 2
  runtime_overridable: true
- id: travel
  label_key: home_tab_travel
  template: single_column_multiform
  layout_template: singleColumnMultiForm
  phone_columns: 1
  supports_full_span_modules: false
  # 交集只随内容卡自然出现，避免顶部 spotlight 与卡内主句形成双模块。
  intersection_module_policy: inlineOnly
  content_card_policy: richMultiForm
  feed_query:
    channel: travel
  mood_copy_key: home_mood_travel
  order: 3
  runtime_overridable: true
- id: photography
  label_key: home_tab_photography
  template: single_column_multiform
  layout_template: singleColumnMultiForm
  phone_columns: 1
  supports_full_span_modules: false
  intersection_module_policy: inlineOnly
  content_card_policy: richMultiForm
  feed_query:
    channel: photography
  mood_copy_key: home_mood_photography
  order: 4
  runtime_overridable: true
- id: tech
  label_key: home_tab_tech
  template: single_column_multiform
  layout_template: singleColumnMultiForm
  phone_columns: 1
  supports_full_span_modules: false
  intersection_module_policy: inlineOnly
  content_card_policy: richMultiForm
  feed_query:
    channel: tech
  mood_copy_key: home_mood_tech
  order: 5
  runtime_overridable: true
- id: car
  label_key: home_tab_car
  template: single_column_multiform
  layout_template: singleColumnMultiForm
  phone_columns: 1
  supports_full_span_modules: false
  intersection_module_policy: inlineOnly
  content_card_policy: richMultiForm
  feed_query:
    channel: car
  mood_copy_key: home_mood_car
  order: 6
  runtime_overridable: true
# ContentUiSurface 的布局策略（DEC-003）。列数是「该 Surface 对当前窗口尺寸」的函数，
# 既不是对象字段，也不是推荐字段：信封不携带 columns/wideLayout，云也不下发列数。
# 每个 ContentUiSurface 成员必须恰好被某个服务的 ui_config 声明一次，缺成员或重复声明
# 都让 codegen fail-closed；本文件只拥有 content 自己的三个面。
# 数值只是把现网已有实现收口到单轨，不改变产品数值。
surface_layout_policies:
- surface: home_feed
  layout_kind: responsive_grid
  compact_columns: 1
  chrome_family: feed_presentation_recipe
  # 首页是唯一存在多种卡片家族的面，chrome 由云物化的 presentationRecipe 选择。
  recipe_driven_chrome: true
  responsive_grid:
    expanded_breakpoint_dp: 600
    min_columns: 2
    max_columns: 4
    ideal_column_width_dp: 220
- surface: media_immersive
  layout_kind: full_bleed_pager
  compact_columns: 1
  chrome_family: immersive_media_pager
  recipe_driven_chrome: false
- surface: article_reader
  layout_kind: full_bleed_pager
  compact_columns: 1
  chrome_family: article_document_reader
  recipe_driven_chrome: false
# 只登记「该分类固定按某个 ContentType 过滤」的入口。recommended / following 是
# 混排入口，不按内容类型过滤，因此不在表内：缺席即不下发 type 过滤，不是默认值。
feed_request_type_by_category:
  images: image
  video: video
  article: article
discovery_tabs:
- id: photo
  label_key: tab_photo
  icon: photo_camera_outlined
  content_type: image
  layout: waterfall_grid
  columns: 2
  card_aspect_ratio: from_metadata
  preload_count: 4
  order: 0
- id: video
  label_key: tab_video
  icon: play_circle_outline
  content_type: video
  layout: full_width_vertical_pager
  card_aspect_ratio: '9:16'
  autoplay: true
  mute_by_default: true
  preload_count: 2
  order: 1
- id: article
  label_key: tab_article
  icon: article_outlined
  content_type: article
  layout: list_with_cover
  show_reading_time: true
  preload_count: 6
  order: 3
