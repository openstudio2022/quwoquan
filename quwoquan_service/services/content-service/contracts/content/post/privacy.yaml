description: 'Post 实体隐私与安全策略。

  app_log_policy.classification 是 App 日志的有效分类，只能等于或严于 fields.yaml 字段基线；

  其余声明只描述 fields.yaml 无法表达的：

  - 端侧 app log 的具体 mask 策略（补充 fields.yaml log_policy 的实现细节）

  - GDPR 数据生命周期（删除级联顺序与策略）

  - 存储字段到 API 字段的 canonical 映射

  - 字段暴露范围（补充 api_exposure 的精细化 consumer 控制）

  '
app_log_policy:
- field: location
  classification: PII
  app_log: mask
  mask_strategy: city_level_only
  description: 仅记录城市名，不记录精确坐标
- field: locationName
  classification: PII
  app_log: mask
  mask_strategy: strip_detail
  description: 仅记录省份级别，不记录具体地名
- field: body
  classification: PUBLIC
  app_log: truncate
  truncate_chars: 200
  description: 长文本截断200字符，避免日志泄露完整内容
- field: title
  classification: PUBLIC
  app_log: truncate
  truncate_chars: 100
- field: embedding
  classification: SENSITIVE
  app_log: drop
  description: 向量嵌入不记录日志，体积大且无排查价值
- field: tagRefs
  classification: PUBLIC
  app_log: allow
- field: mediaUrls
  classification: PUBLIC
  app_log: count_only
  description: 仅记录数量，不记录完整 URL 列表
- field: publishLocation
  classification: PII
  app_log: mask
  mask_strategy: city_level_only
  description: 发布位置仅记录城市级别，不记录精确信息
- field: deviceInfo
  classification: PII
  app_log: mask
  mask_strategy: strip_detail
  description: 设备信息脱敏，不记录完整型号/版本
data_lifecycle:
  retention_days: 1825
  deletion_on_user_request: true
  deletion_cascade:
  - object_id: content.comment
    strategy: soft_delete
    description: PostDeleted 事件经 CommentTombstoneProjector 把该帖 active|hidden 评论批量迁到
      tombstoned，行与正文保留、查询期不可见。评论由他人撰写，物理删除会连带销毁第三方内容，
      因此保留是有意的产品行为而非缺口；tombstoned 评论无 TTL 也无后续清理作业。
  - object_id: content.media_asset
    strategy: soft_delete_then_cdn_purge
    soft_delete_first: true
    cdn_purge_delay_hours: 24
    description: 先软删，24小时后 CDN 清理，避免 CDN 回源错误
  - object_id: content.post
    strategy: soft_delete
    description: 帖子本身标记删除，数据保留至 retention_days
  anonymization_on_delete:
  - field: authorId
    strategy: replace_with_placeholder
    placeholder: '[deleted_user]'
  - field: locationName
    strategy: drop
field_visibility:
- field: _id
  visibility:
  - never_expose
  description: API/wire 唯一键为 postId；存储层 Mongo _id 不进入客户端 wire；拒绝 _id 与 id 旧键别名
- field: embedding
  visibility:
  - never_expose
  description: 向量嵌入对任何 API consumer 不可见（仅内部推荐服务直接查询 DB）
- field: moderationStatus
  visibility:
  - platform-ops
  - first_party_service_internal
  description: 审核状态仅运营后台和第一方服务内部消费者可见，app 端不返回此字段
- field: authorId
  visibility:
  - all
  description: PUBLIC，所有 consumer 可见
- field: location
  visibility:
  - app
  - content-service-internal
  description: 精确位置仅 app 和服务内部，不对推荐引擎暴露原始坐标（特征化后传递）
