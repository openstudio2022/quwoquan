backend: mongodb
collections:
  deleted_post_tombstones:
    entity: DeletedPostTombstone
    role: authoritative
    indexes:
    - name: idx_tombstone_post
      keys:
        postId: 1
      unique: true
    - name: idx_tombstone_deleted_at
      keys:
        deletedAt: -1
    - name: idx_tombstone_expire
      keys:
        expireAt: 1
      expire_after_seconds: 0
role: append_only
codegen:
  enabled: true
