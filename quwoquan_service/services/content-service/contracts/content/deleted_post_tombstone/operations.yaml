commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: CONTENT_DELETED_POST_TOMBSTONE_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 'DeletedPostTombstone 无独立 transport；GetPost 的具名 Reader 在 Post 不存在时

  查询本事实并返回 410，禁止暴露 tombstone 写 API。

  '
api_routes: []
runtime_entrypoints:
- name: AppendDeletedPostTombstone
  kind: internal_port
  phase: transactional_append
  source_objects: [content.Post]
  idempotency: transaction_identity
  application: {kind: command, facet: DeletedPostTombstonePort, method: appendIfAbsent, object_owner: DeletedPostTombstone}
  telemetry:
    metric: content_deleted_post_tombstone_append
    trace: true
    attributes: [outcome]
  slo:
    latency_p95_ms: 500
    failure_ratio_percent: 0.5
consumers:
- name: content-service
  capabilities:
  - resolve_deleted_post
- name: projection-rebuild
  capabilities:
  - reconcile_deleted_post
readiness_cases:
- case_id: append-deleted-post-tombstone-local
  spec_ref: specs/feature-tree/discovery-content/publish-comment-reaction/spec.md#sit-002
  producer: service
  layer: local_contract
  target: {kind: operation, id: AppendDeletedPostTombstone}
  runner_source_path: quwoquan_service/services/content-service/tests/local_contract/content/deleted_post_tombstone/application/store_port__functional__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: append-deleted-post-tombstone-api
  spec_ref: specs/feature-tree/discovery-content/publish-comment-reaction/spec.md#sit-002
  producer: service
  layer: api_integration
  target: {kind: operation, id: AppendDeletedPostTombstone}
  runner_source_path: quwoquan_service/services/content-service/tests/api_integration/content/deleted_post_tombstone/mongo_transaction__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
