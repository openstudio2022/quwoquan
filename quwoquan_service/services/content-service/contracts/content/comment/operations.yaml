commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: CONTENT_COMMENT_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: Comment 独立聚合操作包。路由、认证、错误语义和 App transport 均由本契约与生成路由同源。
api_routes:
  - method: POST
    path: /content/posts/{postId}/comments
    operation: CreateComment
    actor: persona
    application:
      kind: command
      facet: CommentCommandFacet
      method: createComment
      aggregate_owner: Comment
      mutation_target: Comment
      invariant_target: Comment
    authorization:
      principal: persona
      ownership_policy: author_self
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.post_not_found
      - CONTENT.USER.comment_parent_invalid
      - CONTENT.USER.comment_too_long
      - CONTENT.USER.comment_attachment_limit_exceeded
      - CONTENT.USER.comment_attachment_not_ready
      - CONTENT.USER.comment_rate_limited
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: redacted
    telemetry:
      metric: content_comment_create
      trace: true
      attributes:
        - post_id
        - reply
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 发表评论或回复；replyToCommentId 可选，服务端规范化 parentCommentId。
    request_entity: CreateContentCommentCommand
    request_body_kind: object
    request_bindings:
      path:
        - name: postId
          field: postId
    response_entity: CommentCommandResult
    response_body: CommentCommandResult
    response_body_kind: object
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: DELETE
    path: /content/posts/{postId}/comments/{commentId}
    operation: DeleteComment
    actor: persona
    application:
      kind: command
      facet: CommentCommandFacet
      method: deleteComment
      aggregate_owner: Comment
      mutation_target: Comment
      invariant_target: Comment
    authorization:
      principal: persona
      ownership_policy: comment_author
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.comment_not_found
      - CONTENT.USER.comment_forbidden_delete
      - CONTENT.USER.comment_status_transition_invalid
      - CONTENT.USER.version_conflict
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_comment_delete
      trace: true
      attributes:
        - post_id
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 评论作者软删自己的评论；写入 CommentDeleted outbox 事实。
    request_bindings:
      path:
        - name: postId
          field: postId
        - name: commentId
          field: commentId
    response_entity: CommentCommandResult
    response_body: CommentCommandResult
    response_body_kind: object
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: DeleteContentCommentCommand
    request_body_kind: none
  - method: POST
    path: /content/posts/{postId}/comments/{commentId}/pin
    operation: PinComment
    actor: persona
    application:
      kind: command
      facet: CommentCommandFacet
      method: pinComment
      aggregate_owner: Comment
      mutation_target: Comment
      invariant_target: Comment
    authorization:
      principal: persona
      ownership_policy: referenced_post_author
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.comment_not_found
      - CONTENT.USER.comment_pin_forbidden
      - CONTENT.USER.comment_pin_invalid_target
      - CONTENT.USER.comment_status_transition_invalid
      - CONTENT.USER.version_conflict
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: content_comment_pin
      trace: true
      attributes:
        - post_id
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 被引用 Post 作者置顶一级评论；不直接修改 Post 聚合。
    request_bindings:
      path:
        - name: postId
          field: postId
        - name: commentId
          field: commentId
    response_entity: CommentCommandResult
    response_body: CommentCommandResult
    response_body_kind: object
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ChangeContentCommentPinCommand
    request_body_kind: none
  - method: DELETE
    path: /content/posts/{postId}/comments/{commentId}/pin
    operation: UnpinComment
    actor: persona
    application:
      kind: command
      facet: CommentCommandFacet
      method: unpinComment
      aggregate_owner: Comment
      mutation_target: Comment
      invariant_target: Comment
    authorization:
      principal: persona
      ownership_policy: referenced_post_author
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.comment_not_found
      - CONTENT.USER.comment_pin_forbidden
      - CONTENT.USER.comment_pin_invalid_target
      - CONTENT.USER.comment_status_transition_invalid
      - CONTENT.USER.version_conflict
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: content_comment_unpin
      trace: true
      attributes:
        - post_id
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 被引用 Post 作者取消置顶一级评论。
    request_bindings:
      path:
        - name: postId
          field: postId
        - name: commentId
          field: commentId
    response_entity: CommentCommandResult
    response_body: CommentCommandResult
    response_body_kind: object
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ChangeContentCommentPinCommand
    request_body_kind: none
  - method: POST
    path: /content/comments/{commentId}/media:bind
    operation: BindMediaAssetsToComment
    actor: persona
    application:
      kind: command
      facet: CommentCommandFacet
      method: bindAttachments
      aggregate_owner: Comment
      mutation_target: Comment
      invariant_target: Comment
    authorization:
      principal: persona
      ownership_policy: comment_author
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.comment_not_found
      - CONTENT.USER.comment_forbidden_delete
      - CONTENT.USER.comment_attachment_limit_exceeded
      - CONTENT.USER.comment_attachment_not_ready
      - CONTENT.USER.comment_status_transition_invalid
      - CONTENT.USER.version_conflict
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: content_comment_attachments_bind
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 绑定已验证的 comment_attachment MediaAsset 引用。
    request_entity: BindContentCommentAttachmentsCommand
    request_body_kind: object
    request_bindings:
      path:
        - name: commentId
          field: commentId
    response_entity: CommentCommandResult
    response_body: CommentCommandResult
    response_body_kind: object
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: GET
    path: /content/posts/{postId}/comments
    operation: ListComments
    pagination: {default_items: 20, maximum_items: 100}
    actor: none
    application:
      kind: query
      facet: CommentQueryFacet
      method: listComments
      reader: CommentPageReader
      slice: CommentPageSlice
    authorization:
      principal: public
      ownership_policy: post_visibility
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.USER.comment_sort_invalid
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: content_comment_page_list
      trace: true
      attributes:
        - post_id
        - sort
        - outcome
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    request_bindings:
      path:
        - name: postId
          field: postId
      query:
        - name: limit
          field: limit
        - name: cursor
          field: cursor
          required: false
        - name: sort
          field: sort
    response_entity: CommentPageSlice
    response_body: CommentPageSlice
    response_body_kind: page
    description: '一级评论 named page reader；仅 BSON projection，不返回 Comment aggregate。

      sort=hot（默认，hotScore 投影分驱动）或 latest；置顶段永远在前；仅返回 active。

      投影组合 authorIpLocation 快照、authorLiked（Post 作者赞过事实）与

      viewerRelation（viewer→评论作者关注/互关事实，来自 Comment 对 PersonaRelationship 事件维护的对象本地具名投影）。

'
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: ListContentCommentsQuery
    request_body_kind: none
  - method: GET
    path: /content/posts/{postId}/comments/{commentId}/replies
    operation: ListCommentReplies
    pagination: {default_items: 10, maximum_items: 100}
    actor: none
    application:
      kind: query
      facet: CommentQueryFacet
      method: listReplies
      reader: ReplyPageReader
      slice: ReplyPageSlice
    authorization:
      principal: public
      ownership_policy: post_visibility
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
