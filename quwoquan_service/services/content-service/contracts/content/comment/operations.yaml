    response_entity: ReceivedCommentPageSlice
    response_body: ReceivedCommentPageSlice
    response_body_kind: page
    description: 当前 persona 作为被引用 Post 作者收到的评论 named page reader。
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ContentCommentPageQuery
    request_body_kind: none
  - method: POST
    path: /internal/content/comments/{commentId}:hide
    operation: HideComment
    actor: account
    application:
      kind: command
      facet: CommentCommandFacet
      method: hideComment
      aggregate_owner: Comment
      mutation_target: Comment
      invariant_target: Comment
    authorization:
      principal: operator
      scopes:
        - ops.case.write
      permissions:
        - content.moderation.decide
      ownership_policy: moderation_queue
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.comment_not_found
      - CONTENT.USER.comment_moderation_forbidden
      - CONTENT.USER.comment_status_transition_invalid
      - CONTENT.USER.version_conflict
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_comment_hide
      trace: true
      attributes:
        - post_id
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: operator 治理隐藏评论（active → hidden）；写入 CommentModerated 审计事实。举报处置（ResolveReport）与运营后台经此命令执行。
    request_entity: ModerateContentCommentCommand
    request_body_kind: object
    request_bindings:
      path:
        - {name: commentId, field: commentId, required: true}
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
  - method: POST
    path: /internal/content/comments/{commentId}:restore
    operation: RestoreComment
    actor: account
    application:
      kind: command
      facet: CommentCommandFacet
      method: restoreComment
      aggregate_owner: Comment
      mutation_target: Comment
      invariant_target: Comment
    authorization:
      principal: operator
      scopes:
        - ops.case.write
      permissions:
        - content.moderation.decide
      ownership_policy: moderation_queue
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.comment_not_found
      - CONTENT.USER.comment_moderation_forbidden
      - CONTENT.USER.comment_status_transition_invalid
      - CONTENT.USER.version_conflict
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_comment_restore
      trace: true
      attributes:
        - post_id
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: operator 恢复治理隐藏的评论（hidden → active）；写入 CommentModerated 审计事实。deleted/tombstoned 为终态不可恢复。
    request_entity: ModerateContentCommentCommand
    request_body_kind: object
    request_bindings:
      path:
        - {name: commentId, field: commentId, required: true}
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
consumers:
  - name: app
    capabilities:
      - create_comment
      - delete_comment
      - pin_comment
      - unpin_comment
      - list_comments
      - list_comment_replies
      - list_authored_comments
      - list_received_comments
  - name: platform-ops
    capabilities:
      - hide_comment
      - restore_comment
