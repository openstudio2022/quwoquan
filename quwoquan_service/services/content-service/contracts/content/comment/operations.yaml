          field: postId
        - name: commentId
          field: commentId
      query:
        - name: limit
          field: limit
        - name: cursor
          field: cursor
          required: false
    response_entity: ReplyPageSlice
    response_body: ReplyPageSlice
    response_body_kind: page
    description: 二级回复 named page reader；仅 BSON projection，不返回 Comment aggregate。
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: ListContentCommentRepliesQuery
    request_body_kind: none
