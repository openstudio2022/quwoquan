description: 'Comment 对象专属错误码。共享错误码（unauthorized/invalid_argument/version_conflict/

  idempotency_conflict/storage_*）唯一定义于 content/content/post/errors.yaml；

  content 域 codegen 与端云 parity 按固定文件列表合并，code 全域唯一。

  '
errors:
- code: CONTENT.USER.comment_not_found
  reason: comment_not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [DeleteComment, PinComment, UnpinComment, BindMediaAssetsToComment, HideComment, RestoreComment]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentNotFound
  go_const: ErrCommentNotFound
  user_message:
    zh: 评论不存在或已删除
    en: Comment not found or deleted
- code: CONTENT.USER.comment_forbidden_delete
  reason: comment_forbidden_delete
  http_status: 403
  emitted_by:
  - surface: http
    operations: [DeleteComment, BindMediaAssetsToComment]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentForbiddenDelete
  go_const: ErrCommentForbiddenDelete
  user_message:
    zh: 无权删除此评论
    en: Not allowed to delete this comment
- code: CONTENT.USER.comment_pin_forbidden
  reason: comment_pin_forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations: [PinComment, UnpinComment]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentPinForbidden
  go_const: ErrCommentPinForbidden
  user_message:
    zh: 仅内容作者可置顶评论
    en: Only the referenced post author can pin a comment
- code: CONTENT.USER.comment_pin_invalid_target
  reason: comment_pin_invalid_target
  http_status: 400
  emitted_by:
  - surface: http
    operations: [PinComment, UnpinComment]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentPinInvalidTarget
  go_const: ErrCommentPinInvalidTarget
  user_message:
    zh: 只能置顶一级评论
    en: Only a top-level comment can be pinned
- code: CONTENT.USER.comment_parent_invalid
  reason: comment_parent_invalid
  http_status: 409
  emitted_by:
  - surface: http
    operations: [CreateComment]
  recovery_action: retry
  disruption_level: snackbar
  dart_const: commentParentInvalid
  go_const: ErrCommentParentInvalid
  user_message:
    zh: 回复目标已变更或不属于当前内容
    en: The reply target changed or belongs to another post
- code: CONTENT.USER.comment_too_long
  reason: comment_too_long
  http_status: 400
  emitted_by:
  - surface: http
    operations: [CreateComment]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentTooLong
  go_const: ErrCommentTooLong
  user_message:
    zh: 评论超出字数限制
    en: Comment exceeds the length limit
- code: CONTENT.USER.comment_rate_limited
  reason: comment_rate_limited
  http_status: 429
  emitted_by:
  - surface: http
    operations: [CreateComment]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 60
  dart_const: commentRateLimited
  go_const: ErrCommentRateLimited
  user_message:
    zh: 评论太频繁，请稍后重试
    en: Too many comments, please retry later
- code: CONTENT.USER.comment_attachment_limit_exceeded
  reason: comment_attachment_limit_exceeded
  http_status: 400
  emitted_by:
  - surface: http
    operations: [CreateComment, BindMediaAssetsToComment]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentAttachmentLimitExceeded
  go_const: ErrCommentAttachmentLimitExceeded
  user_message:
    zh: 评论图片数量超出限制
    en: Too many comment images
- code: CONTENT.USER.comment_attachment_not_ready
  reason: comment_attachment_not_ready
  http_status: 400
  emitted_by:
  - surface: http
    operations: [CreateComment, BindMediaAssetsToComment]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 3
  dart_const: commentAttachmentNotReady
  go_const: ErrCommentAttachmentNotReady
  user_message:
    zh: 评论图片正在处理中，请稍后重试
    en: Comment image is still processing, please retry shortly
- code: CONTENT.USER.comment_moderation_forbidden
  reason: comment_moderation_forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations: [HideComment, RestoreComment]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentModerationForbidden
  go_const: ErrCommentModerationForbidden
  user_message:
    zh: 无权执行评论治理操作
    en: Not allowed to moderate this comment
- code: CONTENT.USER.comment_status_transition_invalid
  reason: comment_status_transition_invalid
  http_status: 409
  emitted_by:
  - surface: http
    operations: [DeleteComment, PinComment, UnpinComment, BindMediaAssetsToComment, HideComment, RestoreComment]
  recovery_action: retry
  disruption_level: snackbar
  dart_const: commentStatusTransitionInvalid
  go_const: ErrCommentStatusTransitionInvalid
  user_message:
    zh: 评论状态已变更，无法执行该操作
    en: Comment state changed; the action is no longer valid
- code: CONTENT.USER.comment_sort_invalid
  reason: comment_sort_invalid
  http_status: 400
  emitted_by:
  - surface: http
    operations: [ListComments]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: commentSortInvalid
  go_const: ErrCommentSortInvalid
  user_message:
    zh: 不支持的评论排序方式
    en: Unsupported comment sort
