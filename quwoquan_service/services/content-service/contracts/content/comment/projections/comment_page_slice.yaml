read_model: CommentPageSlice
description: >-
  一级评论商用投影分页；组合 Comment、ContentReaction、MediaAsset、Post ownership
  与对象本地 viewer relationship projection，按服务端 hot/latest keyset 排序且置顶段优先。
source_entities: [Comment, ContentReaction, MediaAsset, Post]
source_projections: [comment_viewer_relationship_projection]
consumers: [app]
reply_preview_limit: 1
fields:
  - {name: items, type: '[]CommentListItem', nullable: false}
  - {name: nextCursor, type: string, nullable: true}
  - {name: total, type: int, nullable: false}
