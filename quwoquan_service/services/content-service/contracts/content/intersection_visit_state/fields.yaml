types:
  MarkIntersectionsVisitedRequest:
    description: 推进交集已读水位的命令输入；dimension 为空表示推进全部维度。
    fields:
    - name: dimension
      type: enum
      enum_ref: IntersectionDimension
      constraints:
      - NULLABLE
  MarkIntersectionsVisitedAck:
    description: 水位推进回执；返回本次实际推进的维度集合。
    fields:
    - name: dimensions
      type: '[]string'
      constraints:
      - NOT_NULL
    - name: status
      type: string
      constraints:
      - NOT_NULL
