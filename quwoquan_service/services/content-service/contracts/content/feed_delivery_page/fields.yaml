description: 首页 feed 已交付页的有界只追加运行时事实
fields:
- name: deliveryPageId
  source: deliveryPageId
  type: string
  max_utf8_bytes: 26
  semantic_type: identifier
  constraints: [PK, NOT_NULL]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: scopeHash
  source: scopeHash
  type: string
  max_utf8_bytes: 64
  constraints: [NOT_NULL]
  classification: SENSITIVE
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: actor/session/route/pageSize 的 SHA-256 摘要；原始主体不进入 Redis key 或日志
- name: feedRequestId
  source: feedRequestId
  type: string
  max_utf8_bytes: 128
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: pageSize
  source: pageSize
  type: int
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: depth
  source: depth
  type: int
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: previousPageId
  source: previousPageId
  type: string
  max_utf8_bytes: 26
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  reference: true
- name: items
  source: items
  type: '[]FeedDeliveryPostReference'
  max_items: 20
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: objectCards
  source: objectCards
  type: '[]FeedDeliveryObjectCard'
  max_items: 20
  constraints: [NULLABLE]
  classification: PUBLIC
  log_policy: metadata_only
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: outboundCursor
  source: outboundCursor
  type: string
  max_utf8_bytes: 4096
  semantic_type: cursor
  constraints: [NULLABLE]
  classification: SENSITIVE
  log_policy: drop
  api_exposure: none
  ops_exposure: none
  role: append_only_fact
- name: releaseId
  source: releaseId
  type: string
  max_utf8_bytes: 256
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: manifestDigest
  source: manifestDigest
  type: string
  max_utf8_bytes: 128
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: policyDigest
  source: policyDigest
  type: string
  max_utf8_bytes: 128
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: 本次推荐唯一策略内容摘要；非推荐具名查询为空
- name: createdAt
  source: createdAt
  type: timestamp
  semantic_type: instant
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: expiresAt
  source: expiresAt
  type: timestamp
  semantic_type: instant
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
types:
  FeedDeliveryPostReference:
    description: 已交付 Post identity 与推荐归因快照；不复制可变 Post 展示字段
    fields:
    - name: postId
      source: postId
      type: string
      max_utf8_bytes: 256
      semantic_type: identifier
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: hash
      api_exposure: none
      ops_exposure: read
    - name: qualityScore
      source: qualityScore
      type: float
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: recallPath
      source: recallPath
      type: string
      max_utf8_bytes: 64
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: contentVertical
      source: contentVertical
      type: string
      max_utf8_bytes: 64
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: supplySource
      source: supplySource
      type: string
      max_utf8_bytes: 64
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
  FeedDeliveryObjectCard:
    description: 已交付对象卡的短期公开展示快照与页内锚点
    fields:
    - name: objectKind
      source: objectKind
      type: string
      max_utf8_bytes: 64
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: objectId
      source: objectId
      type: string
      max_utf8_bytes: 256
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: hash
      api_exposure: none
      ops_exposure: read
    - name: title
      source: title
      type: string
      max_utf8_bytes: 512
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: drop
      api_exposure: none
      ops_exposure: none
    - name: subtitle
      source: subtitle
      type: string
      max_utf8_bytes: 1024
      constraints: [NULLABLE]
      classification: PUBLIC
      log_policy: drop
      api_exposure: none
      ops_exposure: none
    - name: coverUrl
      source: coverUrl
      type: string
      max_utf8_bytes: 4096
      constraints: [NULLABLE]
      classification: PUBLIC
      log_policy: drop
      api_exposure: none
      ops_exposure: none
    - name: tagRefs
      source: tagRefs
      type: '[]string'
      max_items: 20
      item_max_utf8_bytes: 256
      constraints: [NULLABLE]
      classification: PUBLIC
      log_policy: metadata_only
      api_exposure: none
      ops_exposure: read
    - name: reasonText
      source: reasonText
      type: string
      max_utf8_bytes: 512
      constraints: [NULLABLE]
      classification: PUBLIC
      log_policy: drop
      api_exposure: none
      ops_exposure: none
    - name: recallPath
      source: recallPath
      type: string
      max_utf8_bytes: 64
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: anchorIndex
      source: anchorIndex
      type: int
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
  FeedPageDeliveredRecommendationItem:
    description: Content 权限 hydration 后实际进入响应的一项推荐归因；ordinal 与特征只能来自 Recommendation 稳定窗口。
    fields:
    - {name: ordinal, source: ordinal, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: contentId, source: contentId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: contentType, source: contentType, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: featureSnapshotDigest, source: featureSnapshotDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: itemFeatureSnapshot, source: itemFeatureSnapshot, type: object, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
  FeedPageDelivered:
    description: FeedDeliveryPage 成功持久化后发布的推荐交付事件；只包含最终响应项，不包含 hydration/权限过滤丢弃项。
    fields:
    - {name: deliveryPageId, source: deliveryPageId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: feedRequestId, source: feedRequestId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: subjectId, source: subjectId, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: personaId, source: personaId, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: scenario, source: scenario, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: windowId, source: windowId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: modelBucket, source: modelBucket, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: modelChannel, source: modelChannel, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: modelReleaseId, source: modelReleaseId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: rankingSnapshotDigest, source: rankingSnapshotDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: featureSnapshotAt, source: featureSnapshotAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: userFeatureSnapshot, source: userFeatureSnapshot, type: object, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: items, source: items, type: '[]FeedPageDeliveredRecommendationItem', constraints: [NOT_NULL, MIN_ITEMS_1], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: occurredAt, source: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
