description: 首页 feed 已交付页的有界只追加运行时事实
fields:
- name: deliveryPageId
  source: deliveryPageId
  type: string
  max_utf8_bytes: 26
  semantic_type: identifier
  constraints: [PK, NOT_NULL]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: scopeHash
  source: scopeHash
  type: string
  max_utf8_bytes: 64
  constraints: [NOT_NULL]
  classification: SENSITIVE
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: >-
    SHA-256 摘要绑定 actor/session/route/pageSize、clientPresentationContract.contractDigest 与推荐原窗口冻结 contextDigest；按固定字段名的 canonical JSON 编码，不能拼接未分隔字符串。
    contractDigest 必须经 canonical 闭集规范化与服务端重算校验。
    contextDigest 只取 Recommendation admission 结果并由 cursor AEAD 认证，续页/回翻不能按新 viewport/device、时钟或 profile/policy 重算；非推荐具名查询使用稳定 not_applicable sentinel。
    原始主体及原 region 不进入 Redis key 或日志；无摘要或摘要不匹配的推荐旧 cursor/window 必须拒绝，不设 dual-read。
- name: feedRequestId
  source: feedRequestId
  type: string
  max_utf8_bytes: 128
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: pageSize
  source: pageSize
  type: int
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: depth
  source: depth
  type: int
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: previousPageId
  source: previousPageId
  type: string
  max_utf8_bytes: 26
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  reference: true
- name: items
  source: items
  type: '[]FeedDeliveryListItem'
  max_items: 20
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: 已交付页的唯一混排序列；按 envelope 的 objectKind 与对应 Post/Homepage 引用确定稳定身份并去重，保留原序及决策，不保存可变展示快照。实体主页作为 objectKind=entity_homepage 的一项直接进入本序列，不存在与之并存的 objectCards + anchorIndex 插卡旁路。
- name: clientPresentationContract
  source: clientPresentationContract
  type: ClientContentPresentationContract
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: 本次交付所依据且已由服务端验证的客户端能力闭集（DEC-006）。其 contractDigest 同时进入 scopeHash 与前后向 cursor 的认证身份；每次续页、回翻均核对当前请求、cursor 与交付页的摘要一致，不一致按 canonical typed 失败恢复首刷，禁止复用或重新解释旧页。
- name: outboundCursor
  source: outboundCursor
  type: string
  max_utf8_bytes: 4096
  semantic_type: cursor
  constraints: [NULLABLE]
  classification: SENSITIVE
  log_policy: drop
  api_exposure: none
  ops_exposure: none
  role: append_only_fact
- name: releaseId
  source: releaseId
  type: string
  max_utf8_bytes: 256
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: manifestDigest
  source: manifestDigest
  type: string
  max_utf8_bytes: 128
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: policyDigest
  source: policyDigest
  type: string
  max_utf8_bytes: 128
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: 本次推荐唯一策略内容摘要；非推荐具名查询为空
- name: contextDigest
  source: contextDigest
  type: string
  max_utf8_bytes: 64
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: hash
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: Recommendation 返回的原窗口冻结上下文 SHA-256 hex；推荐页必须存在并参与 scopeHash 和 cursor AEAD，非推荐具名查询为空且 scope 使用 not_applicable。不得存储或返回原始 requestContext。
- name: experimentBucket
  source: experimentBucket
  type: string
  max_utf8_bytes: 64
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
  description: 推荐页的服务端权威实验分桶；非推荐具名查询为空，且不得由实际 modelBucket 降级结果反推
- name: createdAt
  source: createdAt
  type: timestamp
  semantic_type: instant
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
- name: expiresAt
  source: expiresAt
  type: timestamp
  semantic_type: instant
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: none
  ops_exposure: read
  role: append_only_fact
types:
  FeedDeliveryListItem:
    description: 已交付列表项的自描述信封与推荐归因快照；不复制可变展示字段，也不携带 columns/wideLayout/surface
    fields:
    - name: envelope
      source: envelope
      type: ListItemPresentationEnvelope
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: metadata_only
      api_exposure: none
      ops_exposure: read
    - name: qualityScore
      source: qualityScore
      type: float
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: recallPath
      source: recallPath
      type: string
      max_utf8_bytes: 64
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: contentVertical
      source: contentVertical
      type: string
      max_utf8_bytes: 64
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: supplySource
      source: supplySource
      type: string
      max_utf8_bytes: 64
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
  FeedPageDeliveredRecommendationItem:
    description: Content 当前权限 hydration 后实际进入响应的一项推荐归因；envelope 原样保留共享稳定身份与决策，ordinal 与特征只能来自同一 Recommendation 稳定窗口，过滤后不得重编号。主页使用 homepage 引用且 envelope.contentType 为 null，不伪造 Post 字段。
    fields:
    - {name: ordinal, source: ordinal, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: envelope, source: envelope, type: ListItemPresentationEnvelope, constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: featureSnapshotDigest, source: featureSnapshotDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: itemFeatureSnapshot, source: itemFeatureSnapshot, type: object, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
  FeedPageDelivered:
    description: FeedDeliveryPage 成功持久化后发布的推荐交付事件；只包含最终响应的统一列表项，不包含 hydration/权限过滤丢弃项。items 按原窗口 ordinal 保序且 ordinal 唯一，按 envelope 的对象种类与稳定引用去重；不将 Homepage 当作 Post 归因。
    fields:
    - {name: deliveryPageId, source: deliveryPageId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: feedRequestId, source: feedRequestId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: subjectId, source: subjectId, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: personaId, source: personaId, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: scenario, source: scenario, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: windowId, source: windowId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: experimentBucket, source: experimentBucket, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: modelBucket, source: modelBucket, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: modelChannel, source: modelChannel, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: modelReleaseId, source: modelReleaseId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: rankingSnapshotDigest, source: rankingSnapshotDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: featureSnapshotAt, source: featureSnapshotAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: userFeatureSnapshot, source: userFeatureSnapshot, type: object, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: items, source: items, type: '[]FeedPageDeliveredRecommendationItem', constraints: [NOT_NULL, MIN_ITEMS_1], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: occurredAt, source: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
