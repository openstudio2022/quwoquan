commercial_defaults:
  status: blocked
  block_reason: candidate release device and product-ops readback evidence remains open
  gap_id: CONTENT_FEED_DELIVERY_PAGE_COMMERCIAL_EVIDENCE
  target_story: streaming-feed-performance
description: FeedDeliveryPage 不暴露独立 transport，只由 Post.GetFeed 经 application port append/load
api_routes: []
runtime_entrypoints:
- name: AppendFeedDeliveryPage
  kind: internal_port
  phase: transactional_append
  source_objects: [content.Post]
  idempotency: identity_payload_digest
  application: {kind: command, facet: FeedDeliveryPagePort, method: append, object_owner: FeedDeliveryPage}
  telemetry:
    metric: content_feed_delivery_page_append
    trace: true
    attributes: [outcome]
  slo:
    latency_p95_ms: 500
    failure_ratio_percent: 0.5
consumers:
- name: content.Post.GetFeed
  capabilities:
  - append_delivered_page
  - replay_previous_page
readiness_cases:
- case_id: append-feed-delivery-page-local
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/streaming-feed-performance/spec.md#gwt-001
  producer: service
  layer: local_contract
  target: {kind: operation, id: AppendFeedDeliveryPage}
  runner_source_path: quwoquan_service/services/content-service/tests/local_contract/content/feed_delivery_page/application/delivery_port__functional__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: append-feed-delivery-page-api
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/streaming-feed-performance/spec.md#gwt-001
  producer: service
  layer: api_integration
  target: {kind: operation, id: AppendFeedDeliveryPage}
  runner_source_path: quwoquan_service/services/content-service/tests/api_integration/content/feed_delivery_page/real_redis_delivery_port__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: redis, digest_binding: candidate}
- case_id: feed_delivery_page_edge_recovery_app_uat
  spec_ref: specs/feature-tree/runtime/runtime-client-foundation/error-permission-display-semantics/spec.md#gwt-009
  producer: app
  layer: user_acceptance
  target: {kind: page, id: content.home}
  runner_source_path: quwoquan_app/test/user_acceptance/service/content_service/content/feed_delivery_page/feed_controlled_edge_recovery__user_acceptance_test.dart
  executions:
    - {env: gamma, platform: android, device: physical, provider: first-party-https, digest_binding: candidate}
    - {env: gamma, platform: ios, device: physical, provider: first-party-https, digest_binding: candidate}
