description: ContentBehaviorFact typed append sink。
commercial_defaults:
  status: blocked
  block_reason: 对象归位后需补齐四环境真实行为回放与页面 UAT 证据
  gap_id: CONTENT_BEHAVIOR_FACT_COMMERCIAL_CLOSURE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /content/behaviors
    operation: ReportBehaviors
    actor: persona_or_device
    application:
      kind: command
      facet: ContentBehaviorCommandFacet
      method: reportBehaviors
      append_sink: ContentBehaviorFact
      mutation_target: ContentBehaviorFact
      invariant_target: ContentBehaviorFact
    request_entity: ReportContentBehaviorsCommand
    authorization:
      principal: persona_or_device
      ownership_policy: authenticated_persona_or_derived_device_actor
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.SYSTEM.required_dependency_unavailable
      - CONTENT.SYSTEM.storage_write_failed
      - CONTENT.MIDDLEWARE.upstream_timeout
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: content_behavior_batch_report
      trace: true
      attributes: [actor_dimension, event_count, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    response_entity: ContentBehaviorReportReceipt
    response_body: ContentBehaviorReportReceipt
    response_body_kind: object
    description: 行为批量上报；Post 仅作为 contentId 引用，不拥有行为事实。
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
consumers:
  - name: app
    capabilities: [report_behavior]
  - name: recommendation-engine
    capabilities: [read_behaviors]
readiness_cases:
- case_id: report-behaviors-local
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/feedback-ingestion-sampling/spec.md#gwt-001
  producer: service
  layer: local_contract
  target: {kind: operation, id: ReportBehaviors}
  runner_source_path: quwoquan_service/services/content-service/tests/local_contract/content/content_behavior_fact/adapters/inbound/http/report_behaviors_typed_wire__contract__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: report-behaviors-api
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/feedback-ingestion-sampling/spec.md#gwt-001
  producer: service
  layer: api_integration
  target: {kind: operation, id: ReportBehaviors}
  runner_source_path: quwoquan_service/services/content-service/tests/api_integration/content/content_behavior_fact/http_mongo_append__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb-redis, digest_binding: candidate}
- case_id: content_behavior_fact_report_behaviors_app_local
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/feedback-ingestion-sampling/spec.md#gwt-001
  producer: app
  layer: local_contract
  target: {kind: operation, id: ReportBehaviors}
  runner_source_path: quwoquan_app/test/local_contract/service/content_service/content/content_behavior_fact/content_behavior_command_remote__local_contract_test.dart
  executions:
  - {env: alpha, platform: app, device: runner, provider: none, digest_binding: candidate}
- case_id: content_behavior_fact_report_behaviors_app_api
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/feedback-ingestion-sampling/spec.md#gwt-001
  producer: app
  layer: api_integration
  target: {kind: operation, id: ReportBehaviors}
