description: ContentBehaviorFact 的持久化公共骨架；行为专属 payload 与闭集由同目录 behaviors.yaml 拥有。
fields:
  - name: clientEventId
    type: string
    constraints: [PK, NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: personaId
    type: string
    constraints: [NULLABLE]
    classification: PERSONAL
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: append_only_fact
    reference: true
  - name: userId
    type: string
    constraints: [NOT_NULL]
    classification: PII
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: append_only_fact
    description: 由可信 principal 派生的业务 actor id；与 clientEventId 共同构成幂等事实身份，公共 payload 不得写入。
  - name: deviceActorId
    type: string
    constraints: [NULLABLE]
    classification: PII
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: append_only_fact
  - name: sessionId
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: append_only_fact
  - name: contentId
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
    reference: true
  - name: action
    type: enum
    enum_ref: BehaviorEventType
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: state
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: contentType
    type: enum
    enum_ref: ContentType
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: tagRefs
    type: '[]string'
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: metadata_only
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: duration
    type: float64
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: authorId
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
    reference: true
  - {name: objectId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: objectKind, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: displayName, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: redacted, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: sourceSurface, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: taxonomyReleaseId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: referralSource, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: engagementDepth, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: consumedRatio, type: float64, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: totalUnits, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: effectivePlayMs, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: feedSessionId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: playbackSessionId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: entityRefs, type: '[]string', constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: pageVisitId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: position, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: commentLength, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - name: impactHelpType
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: append_only_fact
    description: 服务端基于权威 Post author 与影响力注册表派生；客户端不得写入，Recommendation 只消费该标准值形成作者影响投影。
  - name: feedRequestId
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: channelId
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: policyDigest
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
    description: 仅接受 canonical sha256 内容摘要，用于 feed 策略归因。
  - name: recallPath
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: contentVertical
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: supplySource
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: intersectionId
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: intersectionDimension
    type: enum
    enum_ref: IntersectionDimension
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: intersectionClass
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: intersectionSourceRef
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: intersectionEvidenceId
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - {name: intersectionTagRefs, type: '[]string', constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: subjectId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - {name: feedbackKind, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read, role: append_only_fact}
  - name: direction
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: motionProfile
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: settleMs
    type: int
    constraints: [NULLABLE, MIN_0]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: reducedMotion
    type: bool
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: committed
    type: bool
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: occurredAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: write
    ops_exposure: read
    role: append_only_fact
  - name: createdAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: append_only_fact
types:
