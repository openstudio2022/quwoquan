      - {name: playbackSessionId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: entityRefs, type: '[]string', constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: write, ops_exposure: read}
      - {name: pageVisitId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: intersectionDimension, type: enum, enum_ref: IntersectionDimension, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: intersectionSourceRef, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: intersectionTagRefs, type: '[]string', constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: write, ops_exposure: read}
