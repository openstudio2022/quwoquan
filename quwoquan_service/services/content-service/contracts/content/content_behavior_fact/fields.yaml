      - {name: duration, type: float64, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: feedRequestId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: write, ops_exposure: read}
      - {name: position, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: channelId, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: policyDigest, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: recallPath, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: contentVertical, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: supplySource, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: commentLength, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: authorId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: referralSource, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: engagementDepth, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: consumedRatio, type: float64, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: totalUnits, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: effectivePlayMs, type: int, constraints: [NULLABLE, MIN_0], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
