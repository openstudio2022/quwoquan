      - {name: committed, type: bool, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
  ReportContentBehaviorsCommand:
    fields:
      - name: events
        type: '[]ContentBehaviorEventWire'
        constraints: [NOT_NULL, MIN_ITEMS_1]
        classification: SENSITIVE
        log_policy: metadata_only
        api_exposure: write
        ops_exposure: read
  ContentBehaviorReportReceipt:
    description: ContentBehaviorFact 批量上报的真实幂等回执；acceptedCount 与 replayedCount 之和等于成功请求的事件数。
    fields:
      - name: acceptedCount
        type: int
        constraints: [NOT_NULL, MIN_0]
        classification: INTERNAL
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: replayedCount
        type: int
        constraints: [NOT_NULL, MIN_0]
        classification: INTERNAL
        log_policy: allow
        api_exposure: read
        ops_exposure: read
