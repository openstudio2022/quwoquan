      - {name: objectId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: objectKind, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: displayName, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: redacted, api_exposure: write, ops_exposure: read}
      - {name: sourceSurface, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
