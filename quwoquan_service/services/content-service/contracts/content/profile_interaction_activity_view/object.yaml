kind: projection
description: '个人主页互动活动只读投影。每条 ContentReaction、Comment 与 OutboundShareFact

  durable outbox 事实分别物化 received/sent 行；查询只读取本投影，不在请求期扫描、

  关联或合成源对象。

  '
identity:
  fields:
  - ownerPersonaId
  - direction
  - activityId
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: ownerPersona
  on_delete: retain
  reference_fields:
  - ownerPersonaId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: actorPersona
  on_delete: retain
  reference_fields:
  - actorPersonaId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: counterpartPersona
  on_delete: retain
  reference_fields:
  - counterpartPersonaId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: displayPersona
  on_delete: retain
  reference_fields:
  - displayPersonaId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: targetPersona
  on_delete: retain
  reference_fields:
  - targetPersonaId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: targetContent
  on_delete: tombstone
  reference_fields:
  - targetContentId
  target_object: content.Post
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: previewObject
  on_delete: tombstone
  reference_fields:
  - previewObjectId
  target_objects:
  - content.Post
  - content.Comment
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: comment
  on_delete: tombstone
  reference_fields:
  - commentId
  target_object: content.Comment
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: parentComment
  on_delete: tombstone
  reference_fields:
  - parentCommentId
  target_object: content.Comment
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: outboundShare
  on_delete: retain
  reference_fields:
  - outboundShareEventId
  target_object: content.OutboundShareFact
local_identity_reasons:
  displayUserRouteId: generated route, surface, or operation registry key used only for navigation or
    telemetry attribution
  previewRouteId: generated route, surface, or operation registry key used only for navigation or telemetry
    attribution
  sourceEventId: immutable source outbox identity used only for projector dedupe and replay traceability
business_rules:
- received 与 sent 方向由源事件参与者语义确定，查询参数不得重解释方向。
- 同一 sourceEventId 只物化一次活动行，稳定分页使用 occurredAt 与 activityId 复合游标。
- 源内容 tombstone 后必须清除正文预览，但保留用户可理解的互动历史与审计水位。
lifecycle:
  source_events:
  - content.content_reaction.ContentReactionSet
  - content.content_reaction.ContentReactionCleared
  - content.comment.CommentCreated
  - content.comment.CommentDeleted
  - content.outbound_share_fact.OutboundShareRecorded
  - content.post.PostDeleted
  - content.profile_interaction_read_fact.ProfileInteractionReadFactAppended
  checkpoint: per_source_outbox_publication_state
  rebuild: replay_reaction_comment_share_post_and_read_fact_outboxes
  tombstone: deactivate_source_activity_or_mark_target_unavailable
  idempotency: aggregate_version
  event_consumers:
  - name: ProjectProfileInteractionActivity
    kind: projector
    facet: ProfileInteractionActivityViewProjector
    method: apply
    idempotency: aggregate_version
