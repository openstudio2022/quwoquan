types:
  ProfileInteractionActivityPageSlice:
    description: Owner-scoped keyset page of durable profile interaction projection rows.
    fields:
      - {name: items, type: '[]ProfileInteractionActivityView', constraints: [NOT_NULL], classification: PII, log_policy: metadata_only, api_exposure: read, ops_exposure: redacted}
      - {name: nextCursor, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: redacted}
      - {name: hasMore, type: bool, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  ContentProfileInteractionPageQuery:
    fields:
      - name: personaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: type
        type: enum
        enum_ref: InteractionActivityType
      - name: cursor
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
