      - NULLABLE
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: expireAt
      source: expireAt
      type: timestamp
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
