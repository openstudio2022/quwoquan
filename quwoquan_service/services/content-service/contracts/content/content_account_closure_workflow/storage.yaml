backend: mongodb
collections:
  user_account_closed_inbox:
    entity: ContentAccountClosureWorkflow
    role: append_only
    description: Content 按 eventId+digest 幂等清理自有对象的 durable inbox；不得作为 Recommendation、User 或 Search 的清理入口。
    indexes:
    - name: idx_user_account_closed_completed
      keys:
        completedAt: -1
  user_account_closed_failures:
    entity: UserAccountClosedProjectionFailure
    role: append_only
    description: pending reclaim 有限重试状态；只保存 source stream/message reference、
      event/error digest、attempts 与时间戳，禁止保存 payload 或主体标识。普通重试记录按
      expireAt 回收；terminal DLQ marker 必须移除 expireAt，直到受控 recovery 释放 source
      PEL，禁止让 TTL 自动恢复带原始 payload 的消费。
    indexes:
    - name: idx_user_account_closed_failure_expire
      keys:
        expireAt: 1
      expireAfterSeconds: 0
  user_account_closed_search_work:
    entity: UserAccountClosedSearchWork
    role: projection
    description: Content 搜索文档删除工作项；外部索引成功后才推进 inbox 完成。
    indexes:
    - name: idx_user_account_closed_search_work
      keys:
        eventId: 1
        doneAt: 1
        _id: 1
    - name: idx_user_account_closed_search_work_expire
      keys:
        expireAt: 1
      expireAfterSeconds: 0
  user_account_closed_media_artifact_work:
    entity: UserAccountClosedMediaArtifactWork
    role: projection
    description: 账户关闭后公开媒体 slice、资产专属派生前缀和无引用私有对象的耐久清理工作；
      仅保存内部 object key，公共 slice 必须先物理撤销，私有 CAS 仅在剩余引用为零时删除。
    indexes:
    - name: idx_user_account_closed_media_artifact_work
      keys:
        eventId: 1
        doneAt: 1
        _id: 1
    - name: idx_user_account_closed_media_artifact_work_expire
      keys:
        expireAt: 1
      expireAfterSeconds: 0
  closed_account_subjects:
    entity: ClosedAccountAudit
    role: append_only
    description: 不含账号原始标识的注销事件审计摘要，不作为写入防复活查询源。
    indexes:
    - name: idx_closed_account_event_digest
      keys:
        eventDigest: 1
      unique: true
  closed_account_subject_tombstones:
    entity: ClosedAccountSubjectTombstone
    role: append_only
    description: '按独立密钥 HMAC-SHA256(subjectId) 标识的 Content 永久防复活栅栏；不得保存原始 userId/personaId，不设 TTL。所有 Content
      聚合、事实与投影写入必须先检查；其他服务维护各自的关闭事实。

      '
    indexes:
    - name: idx_closed_account_subject_closed_at
      keys:
        closedAt: -1
  content_user_account_restrictions:
    entity: ContentAccountClosureWorkflow
    role: projection
    description: Content 自有对象的可逆账号限制状态，不读取 User 数据库。
  content_user_account_restriction_inbox:
    entity: ContentAccountClosureWorkflow
    role: projection
    description: UserSuspended/UserRestored typed event 的幂等 inbox。
  content_user_account_restriction_watermarks:
    entity: ContentAccountClosureWorkflow
    role: projection
    description: 账号限制单调水位；UserAccountClosed 后写入不可逆 terminal marker。
role: authoritative
streams:
  events.user.account.content-service.dlq:
    entity: ContentAccountClosureWorkflow
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Content 账号生命周期 consumer 的脱敏失败记录；原 payload 只留在 source PEL。
