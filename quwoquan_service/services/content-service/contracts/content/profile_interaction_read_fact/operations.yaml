commercial_defaults:
  status: blocked
  block_reason: Profile interaction read fact awaits gamma environment replay and page UAT evidence
  gap_id: CONTENT_PROFILE_INTERACTION_READ_ENV_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /content/personas/{personaId}/interactions/{interactionId}/read-facts
    operation: AppendProfileInteractionReadFact
    actor: persona
    application:
      kind: command
      facet: ProfileInteractionReadFactAppendFacet
      method: appendReadFact
      append_sink: ProfileInteractionReadFact
      mutation_target: ProfileInteractionReadFact
      invariant_target: ProfileInteractionReadFact
    authorization:
      principal: persona
      ownership_policy: active_persona_received_activity_owner
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.profile_interaction_read_fact_owner_forbidden
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
      - CONTENT.SYSTEM.profile_interaction_read_fact_target_unavailable
    privacy:
      request_classification: PII
      response_classification: PII
      log_policy: metadata_only
    telemetry:
      metric: content_profile_interaction_state_update
      trace: true
      attributes:
        - state
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    request_bindings:
      path:
        - name: personaId
          field: personaId
        - name: interactionId
          field: interactionId
    description: '当前 active owner persona 追加 received activity 的 seen/read 事实。

      事实语义键 ownerPersonaId+activityId+state 唯一；命令不直接修改 projection，

      仅由 durable outbox consumer 单调投影 seenAt/readAt。

'
    request_entity: AppendContentProfileInteractionReadFactCommand
    response_entity: ProfileInteractionReadFactAck
    response_body: ProfileInteractionReadFactAck
    response_body_kind: object
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
consumers:
  - name: app
    capabilities:
      - append_profile_interaction_read_fact
readiness_cases:
- case_id: append-profile-interaction-read-fact-local
  spec_ref: specs/feature-tree/user-identity-profile-relationship/profile-homepage-redesign/owner-persona-homepage-unification/spec.md#gwt-004
  producer: service
  layer: local_contract
  target: {kind: operation, id: AppendProfileInteractionReadFact}
  runner_source_path: quwoquan_service/services/content-service/tests/local_contract/content/profile_interaction_read_fact/application/read_fact__local_contract_test.go
  executions:
