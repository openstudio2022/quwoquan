overrides:
  sys.content-service.user_account_security_authority.base_url: http://user-service:18081
  sys.content-service.user_account_security_authority.timeout_ms: 300
  sys.content-service.embedding.enabled: true
  sys.content-service.es.enabled: true
  sys.content-service.es.shards: 3
  sys.content-service.oss.endpoint: ''
  sys.content-service.rec_model_service.timeout_ms: 80
  sys.content-service.rec_model_service.url: ${REC_MODEL_SERVICE_URL}
  sys.content-service.tag_service.url: http://tag-service:18092
  sys.content-service.redis.rec.mode: cluster
  sys.content-service.redis.rec.tls: true
secretRefs:
  sys.content-service.mongo.uri: CONTENT_MONGO_URI
  sys.content-service.oss.access_key_id: CONTENT_OSS_ACCESS_KEY_ID
  sys.content-service.oss.access_key_secret: CONTENT_OSS_ACCESS_KEY_SECRET
  sys.content-service.redis.general.password: CONTENT_REDIS_GENERAL_PASSWORD
  sys.content-service.redis.realtime.password: CONTENT_REDIS_REALTIME_PASSWORD
  sys.content-service.redis.rec.password: CONTENT_REDIS_REC_PASSWORD
externalBindings:
  content.embedding.generation:
    state: enabled
    adapter: ext.embed.openai_compatible
    endpointRef: environment_binding:content.embedding
  runtime.object.storage:
    state: enabled
    adapter: ext.oss.s3_compatible
    endpointRef: environment_binding:content.object_storage
