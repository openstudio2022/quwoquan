overrides:
  sys.content-service.accountSecurityAuthority.baseUrl: http://user-service:18081
  sys.content-service.accountSecurityAuthority.timeoutMs: 300
  sys.content-service.embedding.enabled: true
  sys.content-service.oss.use_ssl: true
  sys.content-service.rec_model_service.timeout_ms: 200
  sys.content-service.rec_model_service.url: http://recommendation-service:8000
  sys.content-service.redis.rec.addr: 127.0.0.1:6379
  sys.content-service.tag_service.url: http://tag-service:18092
secretRefs:
  sys.content-service.mongo.uri: MONGO_URI
  sys.content-service.oss.access_key_id: CONTENT_OSS_ACCESS_KEY_ID
  sys.content-service.oss.access_key_secret: CONTENT_OSS_ACCESS_KEY_SECRET
  sys.content-service.redis.general.password: CONTENT_REDIS_GENERAL_PASSWORD
  sys.content-service.redis.realtime.password: CONTENT_REDIS_REALTIME_PASSWORD
  sys.content-service.redis.rec.password: CONTENT_REDIS_REC_PASSWORD
externalBindings:
  runtime.message.transport:
    state: enabled
  content.embedding.generation:
    state: enabled
    adapter: ext.embed.protocol_fixture
    endpointRef: environment_binding:content.embedding_fixture
    endpointEnvs:
      endpoint: CONTENT_EMBEDDING_FIXTURE_ENDPOINT
    secretRefs:
    - CONTENT_EMBEDDING_FIXTURE_API_KEY
    timeoutMs: 1000
  runtime.object.storage:
    state: enabled
    adapter: infra.minio.object_storage
    endpointRef: environment_binding:content.object_storage
    endpointEnvs:
      endpoint: CONTENT_OSS_ENDPOINT
    secretRefs:
    - CONTENT_OSS_ACCESS_KEY_ID
    - CONTENT_OSS_ACCESS_KEY_SECRET
    timeoutMs: 5000
