schema: content-release-readiness
policyId: content-release
# 只有一套内容就绪契约；环境能力由本配置显式声明，不从内容类别推断。
# 准备、导入与激活是生命周期动作，不属于此策略的选择维度。
# 每个能力显式声明 healthScope 或 doctor 探针；端口、URL、Secret 留在环境拓扑真相源。
capabilityProbes:
  content_api:
    healthScope: edge
  content_media:
    healthScope: media
  content_services:
    healthScope: content-import
  app_consumer:
    healthScope: content-consumer
  telemetry_log_sink:
    logSinkControl: all
  trace_query:
    doctor: true
  slo_query:
    doctor: true
environments:
  alpha:
    target: alpha-local
    workload: full
    healthScope: full
    capabilities: [content_api, content_media, content_services, app_consumer, telemetry_log_sink, trace_query, slo_query]
  beta:
    target: beta-local
    workload: full
    healthScope: full
    capabilities: [content_api, content_media, content_services, app_consumer, telemetry_log_sink, trace_query, slo_query]
  gamma:
    target: gamma-local
    workload: full
    healthScope: full
    capabilities: [content_api, content_media, content_services, app_consumer, telemetry_log_sink, trace_query, slo_query]
  prod:
    target: prod-hosted
    workload: full
    healthScope: full
    capabilities: [content_api, content_media, content_services, app_consumer, telemetry_log_sink, trace_query, slo_query]