# prod overrides (container/k8s)
# Recommend injecting APP_ENV=prod, CONFIG_VERSION, IMAGE_VERSION, CONFIG_ROOT via env.
service:
  http:
    addr: ":18080"

mongo:
  uri: "${MONGO_URI}"
  database: "quwoquan_content"
  collection: "posts"

redis:
  rec:
    mode: cluster
    addrs: []
    tls: true

rec_model_service:
  url: "${REC_MODEL_SERVICE_URL}"
  timeout_ms: 80
  enabled: true

# prod runs the shared ES cluster; endpoints/credentials are injected as deploy
# secrets via SEARCH_ES_ENDPOINTS / SEARCH_ES_* (same cluster/index as search-service).
es:
  enabled: true
  endpoints: []
  index: "quwoquan_objects"
  shards: 3
  replicas: 1

