# beta overrides (developer local cloud-client integration)
service:
  http:
    addr: ":18080"

mongo:
  uri: ""

redis:
  rec:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 0

rec_model_service:
  url: "http://recommendation-service:8000"
  enabled: true
  timeout_ms: 200

# beta 的 content embedding 由受控 Binding 注入；缺 endpoint 或凭据时启动失败。
embedding:
  enabled: true
  vector_recall_enabled: false

oss:
  use_ssl: true

# Beta uses the real local content data plane but does not provision an ES cluster;
# the search-index projector therefore remains disabled until an ES endpoint is set.
es:
  enabled: false
  endpoints: []
