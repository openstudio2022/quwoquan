# beta overrides (developer local cloud-client integration)
service:
  http:
    addr: ":18080"

mongo:
  uri: ""

redis:
  rec:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 0

rec_model_service:
  url: "http://recommendation-service:8000"
  enabled: true
  timeout_ms: 200

# beta runs against local mock data (no mongo): the search-index projector stays a
# no-op. Flip to enabled once a beta ES cluster is provisioned (endpoints via env).
es:
  enabled: false
  endpoints: []
