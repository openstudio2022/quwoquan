# gamma overrides (cloud integration env)
service:
  http:
    addr: ":18080"

mongo:
  uri: "${MONGO_URI}"
  database: "quwoquan_content"
  collection: "posts"

# gamma-local 的 MinIO edge 启用内部 CA TLS；若沿用 default 的 HTTP，会生成
# http presign URL 并在 object-storage 的 TLS listener 上得到 400。
oss:
  use_ssl: true

redis:
  rec:
    mode: standalone
    addr: ""
    db: 0

rec_model_service:
  url: "http://recommendation-service:8000"
  timeout_ms: 100
  enabled: true

# gamma embedding 写入管线（PostPublished → posts.embedding）由唯一
# content.embedding.EmbeddingGateway Binding 提供。endpoint 与凭据只在
# infrastructure adapter 中读取；缺失时启动前检查必须失败。
embedding:
  enabled: true
  vector_recall_enabled: false

# gamma runs the dedicated ES cluster; endpoints are injected via SEARCH_ES_ENDPOINTS
# (shared with search-service — same cluster/index).
es:
  enabled: true
  endpoints: []
  index: "quwoquan_objects"
  # gamma-local ES 为 amd64 模拟（R-S06-S-1），冷启动/单请求可超默认 800ms；
  # 放宽硬超时避免 EnsureIndex fail-fast 把服务打死，真集群另行校准。
  requestTimeoutMs: 5000
  shards: 1
  replicas: 1
