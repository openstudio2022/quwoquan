service:
  name: content-service
  http:
    addr: ":18080"

config:
  # Config release contract
  # CONFIG_VERSION must be injected by deployment pipeline in prod.
  version: "v0.0.1"
  min_image_version: "0.0.1"
  max_image_version: "9.9.9"

# MongoDB/PostgreSQL are mandatory production-composition data ports. Alpha
# fixtures run from the separate mock runner; this service never falls back to
# an in-memory aggregate store.
mongo:
  uri: ""
  database: "quwoquan_content"
  collection: "posts"

postgres:
  report_dsn: ""

# 评论创建时的 IP 属地快照。beta/gamma/prod 只允许加载镜像内固定版本的
# ip2region IPv4/IPv6 离线库；原始 IP 不落 Comment、不写日志。
ip_location:
  provider: "ip2region"
  ipv4_database_path: "/etc/quwoquan/geoip/ip2region_v4.xdb"
  ipv6_database_path: "/etc/quwoquan/geoip/ip2region_v6.xdb"
  data_version: "2026-07-09"

comment_rate_limit:
  burst_window_seconds: 30
  burst_max: 5
  daily_window_seconds: 86400
  daily_max: 200

# Redis scenes (defaults)
redis:
  rec:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 0
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 100
      write_timeout_ms: 100
      dial_timeout_ms: 500
  general:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 1
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 200
      write_timeout_ms: 200
      dial_timeout_ms: 500
  realtime:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 2
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 200
      write_timeout_ms: 200
      dial_timeout_ms: 500

# rec-model-service (default: disabled; gamma/prod enable via env override)
rec_model_service:
  url: ""
  timeout_ms: 50
  enabled: false

# Embedding service (default: disabled)
embedding:
  enabled: false
  vector_recall_enabled: false

# Object storage (default: local MinIO)
oss:
  endpoint: "127.0.0.1:9000"
  bucket: "quwoquan-media"
  region: "us-east-1"
  access_key_id: ""
  access_key_secret: ""
  cdn_domain: ""
  cdn_sign_key: ""
  presign_ttl_minutes: 15
  cdn_ttl_minutes: 60
  use_ssl: false

# alpha/beta/gamma/prod 共享的强制 media outbox consumer。环境 overlay 只注入
# 拓扑和密钥，不另行定义第二套 Worker。
media_processing:
  interval_ms: 2000
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  job_timeout_ms: 900000
  min_work_dir_free_bytes: 536870912

# Unified search index — WRITE side (content.search_index_worker).
# content-service is the indexing producer for the shared ES/OpenSearch index that
# search-service reads; both target the same cluster + index. Endpoints/credentials
# are injected per-env via the shared SEARCH_ES_ENDPOINTS / SEARCH_ES_* env (deploy
# secrets); committed config never hardcodes cluster URLs/secrets. When disabled or
# endpoints empty, the write-time projector is a no-op and the post write path is
# unaffected.
es:
  enabled: false
  endpoints: []
  index: "quwoquan_objects"
  requestTimeoutMs: 800
  insecureTls: false
  shards: 1
  replicas: 1
  embeddingDims: 0
  synonyms: []

metadata:
  dir: "../../../contracts/metadata"
