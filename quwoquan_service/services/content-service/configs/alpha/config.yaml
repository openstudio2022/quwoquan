# alpha overrides (developer single-instance validation)
service:
  http:
    addr: ":18080"

mongo:
  uri: ""

# alpha 使用确定性数据以稳定验证端云契约；非 alpha 环境由启动门禁拒绝此 provider。
ip_location:
  provider: "deterministic"

redis:
  rec:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 0

rec_model_service:
  url: "http://localhost:18090"
  enabled: true
  timeout_ms: 200

# alpha has no dedicated ES infra: the search-index projector stays a no-op so the
# content write path is exercisable without an ES cluster (search degrades to the
# native backend in search-service).
es:
  enabled: false
  endpoints: []
