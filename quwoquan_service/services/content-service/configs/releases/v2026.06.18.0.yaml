config:
  version: "v2026.06.18.0"
  min_image_version: "0.0.1"
  max_image_version: "9.9.9"

service:
  name: content-service

# Homepage commercialization release snapshot.
# Cuts a new content-service config version alongside the intersection /
# recommendation observability SLO refresh (degradation SLIs + alert rules for the
# Redis-unavailable persistent fallback and the Graph/Lifecycle/Propagation/Affinity
# async materialization). Runtime write-side contracts are unchanged from
# v2026.06.16.0; observability SLO thresholds live in
# configs/observability/{intersection_slo,recommendation_slo}.yaml.

# Unified search index — WRITE side contract snapshot.
# content-service is an indexing producer for the shared ES/OpenSearch index that
# search-service reads. Endpoints/credentials are injected per-env via the shared
# SEARCH_ES_ENDPOINTS / SEARCH_ES_* deploy secrets; committed config never hardcodes
# cluster URLs or secrets. enabled=false / empty endpoints => write-time projector is
# a no-op and the post write path is unaffected. Enabling/endpoints/insecureTls are
# infra-sensitive and roll out via risky-config gray release.
es:
  enabled: false
  endpoints: []
  index: "quwoquan_objects"
  requestTimeoutMs: 800
  insecureTls: false
  shards: 1
  replicas: 1
  embeddingDims: 0
  synonyms: []
