apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  labels:
    app.kubernetes.io/name: recommendation-service
  annotations:
    quwoquan.io/config-version: package-required
    quwoquan.io/image-version: package-required
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation-service
      annotations:
        quwoquan.io/config-version: package-required
        quwoquan.io/image-version: package-required
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: recommendation-service
          image: quwoquan/recommendation-service:package-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: recommendation-service-runtime-secrets
          env:
            - name: SERVICE_NAME
              value: recommendation-service
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['quwoquan.io/environment']
            - name: CONFIG_ROOT
              value: /etc/qwq/config
            - name: CONFIG_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['quwoquan.io/config-version']
            - name: IMAGE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['quwoquan.io/image-version']
            - name: CIRCLE_SERVICE_BASE_URL
              value: http://circle-service:18082
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/qwq/config/recommendation-service.yaml
              subPath: recommendation-service.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: runtime-config
          configMap:
            name: recommendation-service-runtime-config
