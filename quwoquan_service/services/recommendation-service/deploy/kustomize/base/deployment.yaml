apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  labels:
    app.kubernetes.io/name: recommendation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation-service
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: recommendation-service
      initContainers:
        - name: recommendation-service-config-bootstrap
          image: ghcr.io/openstudio2022/quwoquan/recommendation-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              mkdir -p \
                /work/configs/recommendation-service/default \
                /work/configs/recommendation-service/alpha \
                /work/configs/recommendation-service/beta \
                /work/configs/recommendation-service/gamma \
                /work/configs/recommendation-service/prod \
                /work/quwoquan_service/services/recommendation-service
              cp /app/configs/default/config.yaml /work/configs/recommendation-service/default/config.yaml
              cp /app/configs/alpha/config.yaml /work/configs/recommendation-service/alpha/config.yaml
              cp /app/configs/beta/config.yaml /work/configs/recommendation-service/beta/config.yaml
              cp /app/configs/gamma/config.yaml /work/configs/recommendation-service/gamma/config.yaml
              cp /app/configs/prod/config.yaml /work/configs/recommendation-service/prod/config.yaml
              if [ -d /app/quwoquan_service/services/recommendation-service ]; then
                cp -R /app/quwoquan_service/services/recommendation-service/. /work/quwoquan_service/services/recommendation-service/
              fi
          volumeMounts:
            - name: recommendation-service-config-root
              mountPath: /work
      containers:
        - name: recommendation-service
          image: ghcr.io/openstudio2022/quwoquan/recommendation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: rec-http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: gamma
            - name: SERVICE_NAME
              value: recommendation-service
            - name: CONFIG_ROOT
              value: /etc/seed-box-config
            - name: CONFIG_VERSION
              value: v0.0.0
            - name: IMAGE_VERSION
              value: v0.0.0
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: recommendation-service-secrets
                  key: MONGODB_URI
                  optional: true
            - name: MONGODB_DATABASE
              value: quwoquan_content
            - name: MODEL_ARTIFACT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: recommendation-service-secrets
                  key: MODEL_ARTIFACT_ENDPOINT
                  optional: true
            - name: MODEL_ARTIFACT_BUCKET
              value: quwoquan-models
            - name: MODEL_ARTIFACT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: recommendation-service-secrets
                  key: MODEL_ARTIFACT_ACCESS_KEY
                  optional: true
            - name: MODEL_ARTIFACT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: recommendation-service-secrets
                  key: MODEL_ARTIFACT_SECRET_KEY
                  optional: true
            - name: MODEL_CACHE_DIR
              value: /app/cache
          volumeMounts:
            - name: recommendation-service-config-root
              mountPath: /etc/seed-box-config
            - name: recommendation-service-cache
              mountPath: /app/cache
          readinessProbe:
            httpGet:
              path: /health
              port: rec-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: rec-http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: rec-http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: recommendation-service-config-root
          emptyDir: {}
        - name: recommendation-service-cache
          emptyDir: {}
