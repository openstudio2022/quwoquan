apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/base
  # prod-only 弹性：HPA 2..6 管理副本数；replicas: 2 是初始/回退值，与
  # minReplicas 一致（apply 瞬时重置后由 HPA 重新接管）。
  - hpa.yaml
namespace: quwoquan-prod
labels:
  - pairs:
      quwoquan.io/environment: prod
    includeSelectors: false
replicas:
  - name: recommendation-service
    count: 2
patches:
  - path: rollout.yaml
