description: 固定排序窗口创建与续读的对象级错误语义。
errors:
- code: RECOMMENDATION.RELEASE.invalid_candidate
  reason: invalid_candidate
  http_status: 422
  emitted_by: [{surface: http, operations: [ReadRecommendationReleaseReadiness]}]
  recovery_action: surface
  disruption_level: inlineCard
  go_const: ErrReleaseInvalidCandidate
  dart_const: releaseInvalidCandidate
  user_message: {zh: 推荐候选身份或闭包不一致, en: Recommendation candidate mismatch}
- code: RECOMMENDATION.RELEASE.not_ready
  reason: not_ready
  http_status: 409
  emitted_by: [{surface: http, operations: [ReadRecommendationReleaseReadiness]}]
  recovery_action: surface
  disruption_level: inlineCard
  go_const: ErrReleaseNotReady
  dart_const: releaseNotReady
  user_message: {zh: 推荐或精选候选尚未就绪, en: Recommendation or premium candidate not ready}
- code: RECOMMENDATION.RELEASE.unavailable
  reason: unavailable
  http_status: 503
  emitted_by: [{surface: http, operations: [ReadRecommendationReleaseReadiness]}]
  recovery_action: surface
  disruption_level: inlineCard
  go_const: ErrReleaseUnavailable
  dart_const: releaseUnavailable
  user_message: {zh: 推荐候选查询暂不可用, en: Recommendation candidate query unavailable}
- code: RECOMMENDATION.USER.ranked_window_unauthorized
  reason: ranked_window_unauthorized
  http_status: 401
  emitted_by:
  - {surface: http, operations: [CreateRankedRecommendationWindow, GetRankedRecommendationPage]}
  recovery_action: absorb
  disruption_level: silent
  dart_const: rankedWindowUnauthorized
  go_const: ErrRankedWindowUnauthorized
  user_message: {zh: 服务身份无效, en: Invalid service identity}
- code: RECOMMENDATION.USER.ranked_window_forbidden
  reason: ranked_window_forbidden
  http_status: 403
  emitted_by:
  - {surface: http, operations: [CreateRankedRecommendationWindow, GetRankedRecommendationPage]}
  recovery_action: absorb
  disruption_level: silent
  dart_const: rankedWindowForbidden
  go_const: ErrRankedWindowForbidden
  user_message: {zh: 服务身份无权读取推荐窗口, en: Service identity cannot access ranked windows}
- code: RECOMMENDATION.USER.ranked_window_invalid_argument
  reason: ranked_window_invalid_argument
  http_status: 400
  emitted_by:
  - {surface: http, operations: [CreateRankedRecommendationWindow, GetRankedRecommendationPage]}
  recovery_action: absorb
  disruption_level: silent
  dart_const: rankedWindowInvalidArgument
  go_const: ErrRankedWindowInvalidArgument
  user_message: {zh: 推荐窗口参数无效, en: Invalid ranked window request}
- code: RECOMMENDATION.USER.ranked_window_not_found
  reason: ranked_window_not_found
  http_status: 404
  emitted_by:
  - {surface: http, operations: [GetRankedRecommendationPage]}
  recovery_action: retry
  disruption_level: snackbar
  dart_const: rankedWindowNotFound
  go_const: ErrRankedWindowNotFound
  user_message: {zh: 推荐窗口已过期，请重新刷新, en: Ranked window expired; refresh the feed}
- code: RECOMMENDATION.USER.ranked_window_conflict
  reason: ranked_window_conflict
  http_status: 409
  emitted_by:
  - {surface: http, operations: [CreateRankedRecommendationWindow, GetRankedRecommendationPage]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: rankedWindowConflict
  go_const: ErrRankedWindowConflict
  user_message: {zh: 推荐窗口请求或内容版本已变化，请重新获取首屏, en: Ranked window request or content fence changed; restart from the first page}
- code: RECOMMENDATION.USER.ranked_window_subject_closed
  reason: ranked_window_subject_closed
  http_status: 410
  emitted_by:
  - {surface: http, operations: [CreateRankedRecommendationWindow, GetRankedRecommendationPage]}
  recovery_action: absorb
  disruption_level: silent
  dart_const: rankedWindowSubjectClosed
  go_const: ErrRankedWindowSubjectClosed
  user_message: {zh: 账号已关闭，不能继续生成或读取推荐窗口, en: The account is closed and cannot use ranked windows}
- code: RECOMMENDATION.SYSTEM.ranked_window_failed
  reason: ranked_window_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [CreateRankedRecommendationWindow, GetRankedRecommendationPage]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 1
  dart_const: rankedWindowFailed
  go_const: ErrRankedWindowFailed
  user_message: {zh: 推荐窗口暂时不可用, en: Ranked window is temporarily unavailable}
