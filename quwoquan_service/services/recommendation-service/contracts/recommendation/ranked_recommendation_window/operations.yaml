api_routes:
- method: POST
  path: /internal/recommendation/release-readiness:query
  operation: ReadRecommendationReleaseReadiness
  actor: none
  commercial: {status: blocked, block_reason: release候选隔离与完整home/premium查询证明尚待实现, gap_id: RECOMMENDATION_RELEASE_QUERY_BARRIER, target_story: environment-topology-and-packaging}
  application: {kind: query, facet: RankedRecommendationWindowQueryFacade, method: readReleaseReadiness, reader: RecommendationReleaseReadinessReader, slice: ReleaseQueryReadinessProof}
  authorization: {principal: service, scopes: [recommendation.release.readiness], ownership_policy: content_release_preparation}
  security: {auth_mode: required, principal: service, token_transport: bearer, anonymous_policy: deny, visibility: internal}
  reliability: {timeout_ms: 3000, cancellation: supported, retry_mode: none, max_attempts: 1, idempotency: none}
  request_entity: ReadRecommendationReleaseReadinessQuery
  request_body_kind: object
  response_entity: ReleaseQueryReadinessProof
  error_codes: [RECOMMENDATION.RELEASE.invalid_candidate, RECOMMENDATION.RELEASE.not_ready, RECOMMENDATION.RELEASE.unavailable]
  privacy: {request_classification: INTERNAL, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: recommendation_release_readiness, trace: true, attributes: [outcome]}
  slo: {latency_p95_ms: 2500, availability_percent: 99.9}
  description: >-
    只接受Content，slice=recommendation且部署Provider/schema匹配；同域named reader重验完整源checkpoint、对象集合和文档摘要。
    复用home/premium召回与硬过滤纯计算，premium必须exact source/version/digest且approved/global/未过期未下架，非空work+video可播放集合才ready。
    required_detail只证明来自Content冻结快照的完整引用/媒体依据，Content evaluator还需用自身candidate reader验证权威hydration，不能以此代替Content事实。
    缺checkpoint/部分投影/缺审批/required空为not_ready409，identity/digest/generation错配422，不可读503；无active可query，不写checkpoint/window/session/exposure或远端库。
