backend: redis
resources:
  ranked_window_cache:
    engine: redis
    role: runtime
    required: true
  experiment_policy_projection:
    engine: mongodb
    role: query_projection
    required: true
role: runtime
description: Content生产的contentFence与窗口同一Redis值原子存储；续页完整tuple/revision不一致直接拒绝。旧无fence窗口到期或拒绝，不重构成新世代窗口，不回落旧GET协议。readReleaseReadiness仅查询本域候选和checkpoint，不创建Redis窗口或曝光。
collections:
  rm_recommendation_experiment_policy:
    entity: RecommendationExperimentPolicyView
    role: projection
    description: Product Ops ExperimentPolicyActivated 的单调本地投影；Recommendation 不维护私有实验配置真相源。
streams:
  events.ops.experiment_policy_activated.recommendation.dlq:
    entity: RecommendationExperimentPolicyView
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Recommendation 无法解释的 ExperimentPolicyActivated typed contract 消息。
redis_cache:
- key: rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:{windowId}
  key_prefix: 'rec:ranked_feed_window:'
  hash_tag: rfw-<quotaShard>
  atomic_keys:
  - rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:{windowId}
  - rec:ranked_feed_window_index:{rfw-<quotaShard>}
  - rec:ranked_feed_window_metadata:{rfw-<quotaShard>}
  eviction_consequence: reconstruct
  durability: ephemeral
  type: string
  ttl_seconds: 600
  scene: rec
  max_value_bytes: 2097152
  max_items: 300
  max_object_cards: 20
  quota_shards: 256
  quota_index: rec:ranked_feed_window_index:{rfw-<quotaShard>}
  quota_metadata: rec:ranked_feed_window_metadata:{rfw-<quotaShard>}
  max_active_per_scope: 8
  max_live_records_per_quota_shard: 128
  max_live_bytes_per_quota_shard: 134217728
  global_max_live_records: 32768
  global_max_live_bytes: 34359738368
  create_operation: lua_same_quota_shard_set_nx_with_key_and_byte_admission
  description: >-
    固化 subject、scenario、模型身份、用户特征、逐项候选特征与对象卡的有界不可变排序窗口；subjectHash 为 subjectId 的 SHA-256 前 128 bit，分片满只拒绝 contender，读取禁止 EXPIRE 续期。
    value 必须保存冻结 requestContext/contextDigest、包含 contextDigest 的 requestDigest/rankingSnapshotDigest，以及绑定实际 boost 参数的 policyDigest。windowId 一经 create-once 即与该 contextDigest 一一绑定，故该 cache key 只代表原冻结上下文，不增设原 region key 或另一份幂等映射。
    SET NX 命中只允许相同冻结 requestDigest，异上下文必须 conflict，不得覆盖、重排或使用新时间桶/画像/配置续写；读时验证 contextDigest 与规范冻结 context、request/ranking 身份一致。缺失或损坏的旧缓存 fail-closed，不双读。
- key: rec:ranked_feed_window_index:{rfw-<quotaShard>}
  key_prefix: 'rec:ranked_feed_window_index:'
  hash_tag: rfw-<quotaShard>
  atomic_keys:
  - rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:{windowId}
  - rec:ranked_feed_window_index:{rfw-<quotaShard>}
  - rec:ranked_feed_window_metadata:{rfw-<quotaShard>}
  eviction_consequence: reconstruct
  durability: ephemeral
  type: sorted_set
  ttl_seconds: 600
  scene: rec
  max_members: 128
  member: rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:{windowId}
  score: redis_server_expires_at_microseconds
  description: 同槽有界准入索引；score 为 Redis server expiry 微秒，每分片最多 128 个 live member。
- key: rec:ranked_feed_window_metadata:{rfw-<quotaShard>}
  key_prefix: 'rec:ranked_feed_window_metadata:'
  hash_tag: rfw-<quotaShard>
  atomic_keys:
  - rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:{windowId}
  - rec:ranked_feed_window_index:{rfw-<quotaShard>}
  - rec:ranked_feed_window_metadata:{rfw-<quotaShard>}
  eviction_consequence: reconstruct
  durability: ephemeral
  type: hash
  ttl_seconds: 600
  scene: rec
  max_fields: 128
  field: rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:{windowId}
  value: <subjectHash>:<payloadBytes>
  description: 同槽 owner digest 与精确 payload bytes；与 index/value 一一对应，不维护可漂移计数器。
