kind: append_only_fact
lifecycle:
  immutable: true
  subject_closure: hard_delete_identifying_fact_after_terminal_closure_is_persisted
  source_events:
  - content.feed_delivery_page.FeedPageDelivered
  event_consumers:
  - name: AppendRecommendationExposure
    kind: subscription
    facet: FeedPageDeliveredConsumer
    method: processOnce
    idempotency: event_id
description: Content 确认 FeedDeliveryPage 后由 Recommendation 幂等追加的交付曝光事实，绑定模型发布、窗口序号与目标。
identity:
  fields:
  - id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: none
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: modelRelease
  on_delete: retain
  reference_fields:
  - modelReleaseId
  target_object: recommendation.RecommendationModelRelease
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: persona
  on_delete: cascade
  reference_fields:
  - personaId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: target
  on_delete: tombstone
  reference_fields:
  - targetType
  - targetId
  target_objects:
  - user.Persona
  - entity.Homepage
  - circle.Circle
  - content.Post
  - tag.TagNodeView
local_identity_reasons:
  deliveryPageId: FeedDeliveryPage 的跨上下文事件归因坐标；它只参与本事实幂等，不是 Recommendation 域对象身份。
  sourceEventId: FeedPageDelivered 的不可变消费幂等身份，不是业务对象引用。
  requestId: immutable correlation or idempotency key scoped to this fact or command; it is not a business-object
    reference
  windowId: RankedRecommendationWindow 的短期归因坐标；窗口过期后仍作为不可变审计字段，不形成新的对象所有权。
  userId: recommendation actor key; persona is preferred but device/anonymous actors have no canonical
    Persona aggregate reference
business_rules:
- 只有 FeedPageDelivered 可形成曝光，候选生成、排序或被 Content 丢弃都不得记为曝光。
- 同一 deliveryPageId、ordinal 与 contentId 至多追加一次，重放保持同一 exposure identity；windowId 与 rankingSnapshotDigest 必须绑定实际排序窗口。
- 账号关闭阻断事实生效后不得为该 subject 追加新曝光；关闭事实先持久化，再硬删除历史可识别曝光，closure checkpoint 阻止旧事件重建。
