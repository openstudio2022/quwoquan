description: Content 确认 FeedDeliveryPage 后由 Recommendation 形成的不可变交付曝光事实。
fields:
- name: id
  source: eventId
  type: string
  constraints:
  - PK
  - NOT_NULL
  description: 从 deliveryPageId+ordinal+targetId 确定性派生的 dedupe 身份
  role: append_only_fact
- name: sourceEventId
  source: eventId
  type: string
  constraints: [NOT_NULL]
  description: FeedPageDelivered 源事件身份
  role: append_only_fact
- name: deliveryPageId
  source: deliveryPageId
  type: string
  constraints: [NOT_NULL]
  role: append_only_fact
- name: requestId
  source: context.feedRequestId
  type: string
  constraints:
  - NOT_NULL
  description: feedRequestId，曝光批次的归因键
  role: append_only_fact
- name: windowId
  source: context.windowId
  type: string
  constraints: [NOT_NULL]
  description: Recommendation 稳定排序窗口身份
  role: append_only_fact
- name: userId
  source: userId
  type: string
  constraints:
  - NOT_NULL
  description: 推荐状态的业务 actor 键；persona 优先、无 persona 时可为匿名/设备 actor
  role: append_only_fact
- name: personaId
  source: personaId
  type: string
  constraints:
  - NULLABLE
  description: 经过认证的 persona 身份；匿名或设备 actor 时为空
  role: append_only_fact
  reference: true
- name: scenario
  source: scenario
  type: string
  constraints:
  - NOT_NULL
  role: append_only_fact
- name: targetType
  source: labels.contentType
  type: string
  constraints:
  - NOT_NULL
  role: append_only_fact
  reference: true
- name: targetId
  source: targetId
  type: string
  constraints:
  - NOT_NULL
  role: append_only_fact
  reference: true
- name: ordinal
  source: ordinal
  type: int
  constraints:
  - NOT_NULL
  description: 服务端稳定窗口的零基序位，禁止消费端侧 position
  role: append_only_fact
- name: experimentBucket
  source: context.experimentBucket
  type: string
  constraints:
  - NOT_NULL
  description: 服务端权威实验分桶，从 FeedPageDelivered 原样固化；独立于可能降级的实际 modelBucket
  role: append_only_fact
- name: modelBucket
  source: context.modelBucket
  type: string
  constraints:
  - NOT_NULL
  description: 本次命中的评分轨道（rule/model，AB 分桶结果）
  role: append_only_fact
- name: modelChannel
  source: context.modelChannel
  type: string
  constraints:
  - NULLABLE
  description: model 分桶时请求的 champion/challenger 发布通道；它不是模型内容身份，rule 分桶为空
  role: append_only_fact
- name: modelReleaseId
  source: context.modelReleaseId
  type: string
  constraints:
  - NULLABLE
  description: 模型服务实际命中的 registry 发布身份；rule 或模型故障降级时为空
  role: append_only_fact
  reference: true
- name: featureSnapshotAt
  source: context.featureSnapshotAt
  type: timestamp
  constraints:
  - NOT_NULL
  description: 在线评分读取用户与候选特征后的统一快照时刻
  role: append_only_fact
- name: featureSnapshotDigest
  source: context.featureSnapshotDigest
  type: string
  constraints: [NOT_NULL]
  description: 对本次 user/item snapshot 的 canonical SHA-256 绑定
  role: append_only_fact
- name: rankingSnapshotDigest
  source: context.rankingSnapshotDigest
  type: string
  constraints: [NOT_NULL]
  description: 包含候选集合、序位、模型身份与逐项特征摘要的窗口级 canonical SHA-256
  role: append_only_fact
- name: userFeatureSnapshot
  source: context.userFeatureSnapshot
  type: object
  constraints:
  - NOT_NULL
  description: 本次候选在线评分实际消费的稀疏用户特征；训练只允许消费此不可变快照
  role: append_only_fact
- name: itemFeatureSnapshot
  source: context.itemFeatureSnapshot
  type: object
  constraints:
  - NOT_NULL
  description: 本次候选在线评分实际消费的候选特征；训练只允许消费此不可变快照
  role: append_only_fact
- name: exposedAt
  source: occurredAt
  type: timestamp
  constraints:
  - NOT_NULL
  role: append_only_fact
- name: recordedAt
  source: recordedAt
  type: timestamp
  constraints: [NOT_NULL]
  role: append_only_fact
