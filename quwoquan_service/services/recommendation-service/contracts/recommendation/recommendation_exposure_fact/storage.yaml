backend: mongodb
role: append_only
collections:
  recommendation_exposure_facts:
    entity: RecommendationExposureFact
    role: append_only
    description: 只保存 FeedPageDelivered 对应的交付曝光；不与反馈共用信封，不接受 Content 直写。
    indexes:
    - name: uq_recommendation_exposure_delivery_item
      keys:
        deliveryPageId: 1
        ordinal: 1
        targetId: 1
      unique: true
    - name: idx_recommendation_exposure_attribution
      keys:
        requestId: 1
        targetId: 1
        exposedAt: -1
    - name: ttl_recommendation_exposure_facts
      keys:
        recordedAt: 1
      expire_after_seconds: 2592000
  recommendation_exposure_failures:
    entity: RecommendationExposureFailure
    role: reliable_task
    description: events.content.feed_page_delivered 消费失败的有界尝试状态，成功或进入脱敏 DLQ 后删除。
    indexes:
    - {name: ttl_recommendation_exposure_failures, keys: {updatedAt: 1}, expire_after_seconds: 604800}
streams:
  events.content.feed_page_delivered.recommendation-exposure.dlq:
    entity: RecommendationExposureFact
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: FeedPageDelivered 曝光事实消费达到重试上限后的脱敏终止记录。
