description: 推荐点击、停留、隐藏等不可变反馈事实；只接受能解析到已持久化 exposure 的 ContentBehaviorFact。
fields:
- name: id
  source: eventId
  type: string
  constraints:
  - PK
  - NOT_NULL
  role: append_only_fact
- name: sourceEventId
  source: sourceEventId
  type: string
  constraints: [NOT_NULL]
  description: ContentBehaviorFact 的 clientEventId/source eventId
  role: append_only_fact
- name: exposureId
  source: exposureId
  type: string
  constraints: [NOT_NULL]
  role: append_only_fact
  reference: true
- name: requestId
  source: context.feedRequestId
  type: string
  constraints:
  - NOT_NULL
  description: feedRequestId，与曝光同批归因
  role: append_only_fact
- name: experimentBucket
  source: context.experimentBucket
  type: string
  constraints:
  - NOT_NULL
  description: 从已持久化 RecommendationExposureFact 复制的服务端权威实验分桶；不接受客户端行为 payload 提供
  role: append_only_fact
- name: userId
  source: userId
  type: string
  constraints:
  - NOT_NULL
  description: 推荐状态的业务 actor 键；persona 优先、无 persona 时可为匿名/设备 actor
  role: append_only_fact
- name: personaId
  source: personaId
  type: string
  constraints:
  - NULLABLE
  description: 经过认证的 persona 身份；匿名或设备 actor 时为空
  role: append_only_fact
  reference: true
- name: targetType
  source: context.contentType
  type: string
  constraints:
  - NOT_NULL
  role: append_only_fact
  reference: true
- name: targetId
  source: targetId
  type: string
  constraints:
  - NOT_NULL
  role: append_only_fact
  reference: true
- name: feedbackType
  source: labels.action
  type: string
  constraints:
  - NOT_NULL
  role: append_only_fact
- name: value
  source: context.duration
  type: float64
  constraints:
  - NULLABLE
  description: 停留时长/评分等数值信号
  role: append_only_fact
- name: occurredAt
  source: occurredAt
  type: timestamp
  constraints:
  - NOT_NULL
  role: append_only_fact
- name: recordedAt
  source: recordedAt
  type: timestamp
  constraints: [NOT_NULL]
  role: append_only_fact
