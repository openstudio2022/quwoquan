description: 反馈事实 stream consumer 的对象级错误语义（无 HTTP 面）。
errors:
- code: RECOMMENDATION.SYSTEM.feedback_fact_source_event_invalid
  reason: feedback_fact_source_event_invalid
  emitted_by:
  - {surface: consumer}
  recovery_action: absorb
  disruption_level: silent
  description: >-
    ContentBehaviorRecorded 事件解码或曝光归因校验失败。重试穷尽后进入
    events.content.behavior_facts 的 recommendation-feedback DLQ。
  user_message: {zh: 推荐反馈事件无效, en: Invalid recommendation feedback source event}
- code: RECOMMENDATION.SYSTEM.feedback_fact_append_unavailable
  reason: feedback_fact_append_unavailable
  emitted_by:
  - {surface: consumer}
  recovery_action: retry
  recovery_after_seconds: 5
  disruption_level: silent
  description: >-
    反馈事实 Mongo 追加暂时不可用；consumer 按有界重试推进，超过阈值进入 DLQ。
  user_message: {zh: 推荐反馈记录暂时不可用, en: Recommendation feedback append is temporarily unavailable}
