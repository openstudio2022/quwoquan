kind: append_only_fact
lifecycle:
  immutable: true
description: RecommendationFeedbackFact 的领域对象契约。
identity:
  fields:
  - id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: none
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: exposure
  on_delete: retain
  reference_fields:
  - targetId
  target_object: recommendation.RecommendationExposureFact
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: persona
  on_delete: cascade
  reference_fields:
  - personaId
  target_object: user.Persona
local_identity_reasons:
  requestId: immutable correlation or idempotency key scoped to this fact or command; it is not a business-object
    reference
  userId: recommendation actor key; persona is preferred but device/anonymous actors have no canonical
    Persona aggregate reference
