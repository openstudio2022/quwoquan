description: RecommendationFeedbackFact 只消费 ContentBehaviorFact 可重放事实流，不暴露写 API。
api_routes: []
runtime_entrypoints:
- name: AppendRecommendationFeedback
  kind: subscription
  phase: event_ingest
  source_events: [content.ContentBehaviorRecorded]
  idempotency: event_id
  application: {kind: command, facet: RecommendationFeedbackFactAppender, method: append, object_owner: RecommendationFeedbackFact}
consumers:
- {name: content-behavior-facts, channel: events.content.behavior_facts, source_event: ContentBehaviorRecorded, capabilities: [resolve_exposure, append_feedback_fact]}
