kind: aggregate_root
description: 场景模型发布的可审计读模型与评分 Reader 根。生命周期命令 deferred：登记/晋升/回滚由 recommendation-service 的 model_registry_cli（含
  promotion gate）与 CI 训练管线写入 rec_model_registry；在线只暴露按已激活发布评分的 named Reader。
identity:
  fields:
  - id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships: []
capabilities:
- queryable
taggable: false
vector_enabled: false
business_rules:
- release_id_and_model_digest_are_immutable
- feature_contract_digest_is_canonical_and_immutable
- one_scenario_has_at_most_one_active_release
- promotion_and_rollback_pass_registry_promotion_gate
lifecycle:
  initial: staged
  terminal:
  - retired
  transitions: []
deferred_operations:
  reason: 零 API 调用方；模型晋升/回滚/灰度由 model_registry_cli + CI promotion gate + AB policy 闭环承载。恢复前置条件：出现真实 operator
    消费面（Portal 或跨服务命令），并补 PostgreSQL Store/outbox/facade/transport packet 与三层测试。
  operations:
  - StageRecommendationModelRelease
  - ActivateRecommendationModelRelease
  - RollbackRecommendationModelRelease
