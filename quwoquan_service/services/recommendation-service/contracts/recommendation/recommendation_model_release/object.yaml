kind: aggregate_root
description: 场景模型发布的唯一可变聚合；Stage 固化模型与特征摘要，Activate 以 CAS 切换场景当前发布，回滚只允许重新激活既有已验证发布。
identity:
  fields:
  - id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships: []
capabilities:
- commandable
- queryable
- idempotent_commands
taggable: false
vector_enabled: false
business_rules:
- release_id_and_model_digest_are_immutable
- feature_contract_digest_is_canonical_and_immutable
- artifact_uri_model_digest_and_verification_evidence_are_immutable
- one_scenario_has_at_most_one_active_release
- activation_requires_a_staged_verified_release_and_compare_and_swap
- rollback_reuses_activate_with_a_previous_verified_release
- rollout_assignment_is_owned_by_product_ops_experiment_not_model_release
lifecycle:
  state_field: status
  states: [staged, active, retired]
  optimistic_concurrency: version
  idempotency: command_receipt
