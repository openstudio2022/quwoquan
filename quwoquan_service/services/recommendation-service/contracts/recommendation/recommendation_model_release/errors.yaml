description: RecommendationModelRelease 生命周期与评分 Reader 的稳定错误语义。
errors:
- code: RECOMMENDATION.USER.unauthorized
  reason: unauthorized
  http_status: 401
  emitted_by:
  - {surface: http, operations: [StageRecommendationModelRelease, ActivateRecommendationModelRelease, ScoreRecommendationCandidates, BatchScoreRecommendationCandidates]}
  recovery_action: absorb
  disruption_level: silent
  dart_const: unauthorized
  go_const: ErrUnauthorized
  user_message:
    zh: 服务身份无效
    en: Invalid service identity
- code: RECOMMENDATION.USER.forbidden
  reason: forbidden
  http_status: 403
  emitted_by:
  - {surface: http, operations: [StageRecommendationModelRelease, ActivateRecommendationModelRelease, ScoreRecommendationCandidates, BatchScoreRecommendationCandidates]}
  recovery_action: absorb
  disruption_level: silent
  dart_const: forbidden
  go_const: ErrForbidden
  user_message:
    zh: 服务身份无权执行评分
    en: Service identity is not allowed to score
- code: RECOMMENDATION.USER.invalid_argument
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - {surface: http, operations: [StageRecommendationModelRelease, ActivateRecommendationModelRelease, ScoreRecommendationCandidates, BatchScoreRecommendationCandidates]}
  recovery_action: absorb
  disruption_level: silent
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 评分请求参数无效
    en: Invalid scoring request
- code: RECOMMENDATION.USER.model_release_conflict
  reason: model_release_conflict
  http_status: 409
  emitted_by:
  - {surface: http, operations: [StageRecommendationModelRelease, ActivateRecommendationModelRelease]}
  recovery_action: retry
  disruption_level: snackbar
  dart_const: modelReleaseConflict
  go_const: ErrModelReleaseConflict
  user_message:
    zh: 模型发布状态已变化，请刷新后重试
    en: Model release state changed; refresh and retry
- code: RECOMMENDATION.SYSTEM.model_registry_write_failed
  reason: model_registry_write_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [StageRecommendationModelRelease, ActivateRecommendationModelRelease]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 1
  dart_const: modelRegistryWriteFailed
  go_const: ErrModelRegistryWriteFailed
  user_message:
    zh: 模型发布暂时不可用
    en: Model release is temporarily unavailable
- code: RECOMMENDATION.SYSTEM.scoring_failed
  reason: scoring_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [ScoreRecommendationCandidates, BatchScoreRecommendationCandidates]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 1
  dart_const: scoringFailed
  go_const: ErrScoringFailed
  user_message:
    zh: 评分暂时不可用
    en: Scoring is temporarily unavailable
