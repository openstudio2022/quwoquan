events:
- name: RecommendationModelReleaseStaged
  delivery_semantics: transactional_outbox
  payload_entity: RecommendationModelRelease
  payload_fields:
  - id
  - scenario
  - modelDigest
  - featureContractDigest
  - status
  - createdAt
- name: RecommendationModelReleaseActivated
  delivery_semantics: transactional_outbox
  payload_entity: RecommendationModelRelease
  payload_fields:
  - id
  - scenario
  - modelDigest
  - featureContractDigest
  - status
  - activatedAt
- name: RecommendationModelReleaseRetired
  delivery_semantics: transactional_outbox
  payload_entity: RecommendationModelRelease
  payload_fields:
  - id
  - scenario
  - status
  - retiredAt
