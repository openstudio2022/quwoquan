read_model: IntersectionActionHint
description: |
  交集/影响力下一步行动建议。云侧按 kind/helpType 选择主 CTA 与次 CTA，端只读
  actionKey、label、target、actionTier、requiredGates 与 dispatch 渲染和分发，禁止按
  kind 猜测行动。actionKey 与 dispatch 的唯一真相源是 intersection_kind_registry.yaml；
  当前注册表只包含已有真实承接的行动，未就绪行动不进入 wire。
consumers:
- app
client_projection:
  dart_class: IntersectionActionHint
  base_class: ''
  output_path: cloud/runtime/generated/recommendation/intersection_action_hint.g.dart
  dart_imports:
  - intersection_target.g.dart
  fields:
  - name: actionKey
    dart_type: String
    nullable: false
    source: actionKey
    default: ''''''
  - name: label
    dart_type: String
    nullable: false
    source: label
    default: ''''''
  - name: target
    dart_type: IntersectionTarget
    nullable: true
    source: target
    map_from_string_key_class: IntersectionTarget
  - name: isPrimary
    dart_type: bool
    nullable: false
    source: isPrimary
    default: 'false'
  - name: priority
    dart_type: int
    nullable: false
    source: priority
    default: '0'
  - name: actionTier
    dart_type: String
    nullable: false
    source: actionTier
    default: '''light'''
  - name: requiredGates
    dart_type: List<String>
    nullable: false
    source: requiredGates
  - name: dispatch
    dart_type: String
    nullable: false
    source: dispatch
    default: '''navigate'''
