read_model: IntersectionActionHint
description: "交集/影响力下一步行动建议（统一交互子契约）。\n交集必须可行动；本值对象承载云侧按 kind/helpType 选择的主 CTA 与次 CTA。\n端只读 actionKey、label、target\
  \ 渲染按钮或行内动作，禁止端侧按 kind 猜测行动。\n\n闭集 actionKey（唯一真相源 intersection_kind_registry.yaml `actionHintLegend`，20\
  \ 项）：\n  follow_person | greet_person | message_person | view_shared_people\n  join_circle | open_discussion\
  \ | open_content | open_object | follow_object\n  open_route | create_followup | ask_assistant\n  join_topic_room\
  \ | start_gathering | join_gathering\n  meet_nearby | express_interest\n\
  \  view_official_deals | book_ticket | book_hotel\n\n§24 行动阶梯附加字段（M0.1/M0.3/M0.7，真相源 registry.actionKeyMeta，云侧按\
  \ actionKey 填充下发）：\n  actionTier         light（轻查看/关注）| heavy（重社交，需破冰阶梯/请求）。\n  requiredGates      重行动前置安全门列表（⊆\
  \ registry.gateKeys）；端未满足则优雅降级为查看证据/进对象，\n                     绝不静默失败/死循环（守 15-auth-entry-no-loop），拦截语义走\
  \ errors.yaml。\n  targetAvailability available（有真实承接页）| deferred（承接页/数据源未就绪，端不得伪造成行，§24.10 诚实红线）。\n\
  \  dispatch           端交互 handler 路由类别 ∈ registry.actionDispatch（assistant|navigate|message|gathering|connect|commerce）；\n\
  \                     端 navigator/徽标/助手分发一律读本字段，禁止端手写「哪些 actionKey 属助手/聚集」第二份枚举（M0.7）；\n           \
  \          缺省 navigate（对象下钻，最安全兜底，不误触发聚集/私信/助手）。\n"
consumers:
- app
client_projection:
  dart_class: IntersectionActionHint
  base_class: ''
  output_path: cloud/runtime/generated/recommendation/intersection_action_hint.g.dart
  dart_imports:
  - intersection_target.g.dart
  fields:
  - name: actionKey
    dart_type: String
    nullable: false
    source: actionKey
    default: ''''''
  - name: label
    dart_type: String
    nullable: false
    source: label
    default: ''''''
  - name: target
    dart_type: IntersectionTarget
    nullable: true
    source: target
    map_from_string_key_class: IntersectionTarget
  - name: isPrimary
    dart_type: bool
    nullable: false
    source: isPrimary
    default: 'false'
  - name: priority
    dart_type: int
    nullable: false
    source: priority
    default: '0'
  - name: actionTier
    dart_type: String
    nullable: false
    source: actionTier
    default: '''light'''
  - name: requiredGates
    dart_type: List<String>
    nullable: false
    source: requiredGates
  - name: targetAvailability
    dart_type: String
    nullable: false
    source: targetAvailability
    default: '''available'''
  - name: dispatch
    dart_type: String
    nullable: false
    source: dispatch
    default: '''navigate'''
