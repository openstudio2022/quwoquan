read_model: ExposureState
description: '内容曝光治理读模型。承载内容级曝光池、生命周期、动态预算与窗口统计。

  P0 仅消费 served/impressed/negative 热路径状态与基础曝光健康；P1 起由动态预算

  作业写入 pool/lifecycle/budget 结果，读路径只消费已物化字段。

  '
storage_backend: mongodb
collection: rm_exposure_state
source_entities:
- Post
source_events:
- PostCreated
- BehaviorBatchReported
- RecommendationServed
- ExposureBudgetEvaluated
producers:
- content-service
- recommendation-engine
consumers:
- recommendation-engine
- recommendation-service
- ops-portal
fields:
- name: contentId
  type: string
- name: contentType
  type: string
- name: authorId
  type: string
- name: lifecycleState
  type: string
  description: candidate/trial/rising/mature/evergreen/dormant/revived/retired
- name: exposurePool
  type: string
  description: candidate/trial/rising/mature/evergreen/retired
- name: experimentBucket
  type: string
- name: servedCount24h
  type: int
- name: impressedCount24h
  type: int
- name: interactionCount24h
  type: int
- name: negativeCount24h
  type: int
- name: dwellMsP50
  type: float
- name: completionRate24h
  type: float
- name: ctr24h
  type: float
- name: negativeRate24h
  type: float
- name: budgetScore
  type: float
- name: budgetQuota
  type: int
- name: lastServedAt
  type: timestamp
- name: lastImpressedAt
  type: timestamp
- name: updatedAt
  type: timestamp
indexes:
- name: idx_exposure_content
  keys:
    contentId: 1
  unique: true
- name: idx_exposure_pool_score
  keys:
    exposurePool: 1
    budgetScore: -1
- name: idx_exposure_lifecycle_updated
  keys:
    lifecycleState: 1
    updatedAt: -1
