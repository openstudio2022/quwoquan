read_model: RecommendationReplayDatasets
description: 'rec_replay_samples 保存用于跨模型版本评估的完整样本快照，rec_replay_datasets 保存

  dataset 清单。冻结后禁止覆盖；若任一样本 owner 触发 UserAccountClosed，物理删除该

  owner 的 replay 样本，并将关联 dataset 标为 privacy_invalidated。失效 dataset 不得

  用于 evaluate、train、发布证据或以同一 datasetId 重新冻结。

  '
storage_backend: mongodb
collections:
  rec_replay_samples:
    fields:
    - name: _id
      type: ObjectId
    - name: datasetId
      type: string
    - name: sourceSampleId
      type: ObjectId
    - name: scenario
      type: string
    - name: userId
      type: string
    - name: targetId
      type: string
    - name: userFeatures
      type: object
    - name: itemFeatures
      type: object
    - name: labels
      type: object
    - name: ts
      type: timestamp
    indexes:
    - name: idx_rec_replay_dataset
      keys:
        datasetId: 1
    - name: idx_rec_replay_user_dataset
      keys:
        userId: 1
        datasetId: 1
  rec_replay_datasets:
    fields:
    - name: _id
      type: string
    - name: scenario
      type: string
    - name: frozenAt
      type: timestamp
    - name: sampleCount
      type: int
    - name: snapshotCollection
      type: string
    - name: privacyStatus
      type: enum
      values:
      - building
      - active
      - privacy_invalidated
    - name: privacyInvalidatedAt
      type: timestamp
      nullable: true
    - name: privacyInvalidationReason
      type: enum
      values:
      - account_closed
      nullable: true
    indexes:
    - name: idx_rec_replay_scenario_frozen
      keys:
        scenario: 1
        frozenAt: -1
    - name: idx_rec_replay_privacy_status
      keys:
        privacyStatus: 1
        frozenAt: -1
privacy_lifecycle:
  owner_field: rec_replay_samples.userId
  on_user_account_closed:
    samples: delete
    dataset: transition_to_privacy_invalidated
  anti_resurrection_guard: closed_account_subjects
