read_model: IntersectionActorEvidence
description: "交集人数句背后的逐人证据项。用于解释首页内容卡 / spotlight / 对象页交集句里\n「林清越等 8 人」中的每一个人分别是谁、来自哪里、在当前对象上做过什么。\n\n\
  端侧只消费本投影展示下钻列表，禁止从 primaryText 反解析人数、关系来源或互动动作。\n当 IntersectionReason 的人数 span 可点击进入完整列表时：\n  - actorEvidenceCompleteness\
  \ 必须为 complete；\n  - actorEvidenceTotalCount 必须等于该人数 N；\n  - actorEvidence.length 必须覆盖可见且可点击的 N 个 actor；\n\
  \  - 每个 actor 必须具备 relationLabel 与 actionSummaryText，分别说明「来自哪里」和「TA 做了什么」。\n若云侧只能提供样本或隐私过滤后的不完整列表，端不得把人数\
  \ N 渲染成可打开的完整列表入口。\n"
consumers:
- app
- recommendation
client_projection:
  dart_class: IntersectionActorEvidence
  base_class: ''
  output_path: cloud/runtime/generated/recommendation/intersection_actor_evidence.g.dart
  dart_imports:
  - intersection_target.g.dart
  fields:
  - name: actorId
    dart_type: String
    nullable: false
    source: actorId
    default: ''''''
  - name: displayName
    dart_type: String
    nullable: false
    source: displayName
    default: ''''''
  - name: avatarUrl
    dart_type: String
    nullable: false
    source: avatarUrl
    default: ''''''
  - name: relationLabel
    dart_type: String
    nullable: false
    source: relationLabel
    default: ''''''
  - name: relationSourceRef
    dart_type: String
    nullable: false
    source: relationSourceRef
    default: ''''''
  - name: relationObjectId
    dart_type: String
    nullable: false
    source: relationObjectId
    default: ''''''
  - name: relationObjectName
    dart_type: String
    nullable: false
    source: relationObjectName
    default: ''''''
  - name: sourcePointId
    dart_type: String
    nullable: false
    source: sourcePointId
    default: ''''''
  - name: sourceRef
    dart_type: String
    nullable: false
    source: sourceRef
    default: ''''''
  - name: actionSummaryText
    dart_type: String
    nullable: false
    source: actionSummaryText
    default: ''''''
  - name: likeCount
    dart_type: int
    nullable: false
    source: likeCount
    default: '0'
  - name: commentCount
    dart_type: int
    nullable: false
    source: commentCount
    default: '0'
  - name: shareCount
    dart_type: int
    nullable: false
    source: shareCount
    default: '0'
  - name: privacyState
    dart_type: String
    nullable: false
    source: privacyState
    default: '''visible'''
  - name: target
    dart_type: IntersectionTarget
    nullable: true
    source: target
    map_from_string_key_class: IntersectionTarget
  - name: evidenceRank
    dart_type: int
    nullable: false
    source: evidenceRank
    default: '0'
  - name: snapshotVersion
    dart_type: String
    nullable: false
    source: snapshotVersion
    default: ''''''
  - name: sortKey
    dart_type: int
    nullable: false
    source: sortKey
    default: '0'
