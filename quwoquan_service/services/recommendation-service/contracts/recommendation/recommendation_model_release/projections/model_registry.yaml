read_model: ModelRegistry
description: RecommendationModelRelease 的当前生命周期投影；仅对象 Facade 写入，推理 Reader 只解析 status=active 的不可变 artifact。
storage_backend: mongodb
collection: rec_model_registry
producers:
- recommendation-service
consumers:
- recommendation-service
fields:
- name: _id
  type: string
- name: scenario
  type: string
- name: modelDigest
  type: string
- name: featureContractDigest
  type: string
- name: artifactUri
  type: string
- name: verificationDigest
  type: string
- name: evaluationMetrics
  type: object
- name: status
  type: string
- name: version
  type: int64
- name: createdAt
  type: timestamp
- name: activatedAt
  type: timestamp
- name: retiredAt
  type: timestamp
- name: updatedAt
  type: timestamp
indexes:
- name: idx_scenario_status_updated
  keys:
    scenario: 1
    status: 1
    updatedAt: -1
- name: idx_scenario_model_digest
  keys:
    scenario: 1
    modelDigest: 1
  unique: true
