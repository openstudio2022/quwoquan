read_model: RecommendFeature
description: '推荐特征宽表 ReadModel。多源聚合用户特征 + 内容特征 + 上下文特征。

  供推荐引擎做特征检索。

  '
storage_backend: mongodb
collection: rm_recommend_feature
source_entities:
- UserProfile
- Post
- PersonaRelationship
- ContentReaction
- Circle
- CircleMembership
- VisitRecord
- SearchQuery
source_events:
- UserProfileUpdated
- PostCreated
- ContentReactionSet
- ContentReactionCleared
- BehaviorBatchReported
- CircleMembershipJoined
- PersonaFollowStateChanged
- SearchRecommendationSignalPublished
consumers:
- recommendation-engine
fields:
- name: userId
  type: string
- name: userFeatures
  source: userFeatures
  type: object
  description: '用户侧特征：tagInteraction / authorInteraction /

    topicAffinities / audienceAffinities / formatAffinities / entityAffinities /

    entityInstanceAffinities / typeImpressions / typeEngagements / depthDistribution /

    searchTermAffinity / searchTopObjectAffinity / searchTermHeat / searchTermUpdatedAt / ...

    engagementDepthSum / engagementDepthCount 是行为 relay 原子累计的充分统计量；

    FeatureStore 只在读时由二者派生 avgEngagementDepth，禁止持久化单条行为覆盖的均值。

    InterestDecayJob 按半衰期衰减四维 affinities，解原始 $inc 单调增长。

    SearchRecommendationSignalPublished 以 24h 新鲜度窗口写入 search* 在线意图特征；

    FeatureStore 读时按 searchTermUpdatedAt 过期剔除，避免 stale search intent 长期污染 Feed。

    totalLikes 仅由 ContentReaction aggregate outbox 驱动，按 persona 的 active

    relation 权威集合精确重算后 $set；device actor 不进入公开用户特征。

    注：对外兴趣画像 interestProfile(T4-1) 由 content 派生后经 UserInterestRecomputed 事件

    投影到 user 域 rm_user_profile_view.interestProfile，不在本宽表持久化(单一真相源)。

    '
- name: contentFeatures
  type: '[]object'
  description: 候选内容特征
- name: socialFeatures
  source: socialFeatures
  type: object
  description: "社交图谱特征。intersection 子对象（事实 + 概率分通道，与 IntersectionReason 对齐）：\n  sharedFolloweesCount /\
    \ sharedCircleCount / coCommentedCount / coVisitedEntityCount /\n  followeeInObjectActive / followeeViewingActive\
    \ / affinityIntersectionScore /\n  intersectionSourceRefTop（viewer 与 object 间最强 fact kind，§5.4 标准名）\n\
    其中 intersection.kindCounts.<kind> 是按 BehaviorBatchReported 中 intersectionSourceRef\n在「真正参与」事件上 $inc\
    \ 的揭示偏好直方图（曝光不计入）；FeatureStore 由该直方图派生上述\n6 个事实计数字段 + intersectionSourceRefTop，经 ModelPredictRequest.UserFeatures\
    \ 单点注入精排\n（ranking-signal-fusion）。affinityIntersectionScore 属概率分通道，由 affinity 模型旁路填充。\n"
- name: contextFeatures
  type: object
  description: 上下文特征（时间/设备/位置）
- name: segments
  source: segments
  type: '[]string'
  description: '规则人群 segment 命中集(顶层)。content 在派生 interestProfile 后按

    recommendation/recommendation/recommendation_model_release/segments.yaml 结构化 predicate 匹配(MatchSegments 单一计算源)，

    $set 回写本宽表供推荐引擎 FeatureStore 直接加载，驱动 policy.yaml segmentTargeting

    (preset 覆盖 / weightDeltas) 与实验 eligibleSegments 定向；同一计算还经 UserInterestRecomputed

    事件投影到 user 域 rm_user_profile_view.segments(供小艺主动)。两处均为该计算的 CQRS 投影，非第二真相源。

    '
- name: behaviorProjectionLastId
  type: string
  description: '行为投影最后成功应用的 rm_behavior_events ObjectID 十六进制水位。

    与同次 $inc 原子写入，供 relay checkpoint 重放幂等收敛；共享 checkpoint

    由 behavior relay lease 串行推进，禁止多副本乱序跨越该水位。

    '
- name: segmentsUpdatedAt
  type: timestamp
  description: segments 最近回写时间
- name: updatedAt
  type: timestamp
indexes:
- name: idx_rf_user
  keys:
    userId: 1
  unique: true
