description: 可审计、可回滚的场景模型发布聚合。
fields:
- name: id
  type: string
  constraints:
  - PK
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: scenario
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: modelDigest
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: featureContractDigest
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
  description: canonical feature contract payload 的小写十六进制 SHA-256 内容身份
- name: artifactUri
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: drop
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
  description: 由 modelDigest 寻址且已完成可访问性校验的不可变模型 artifact URI
- name: verificationDigest
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
  description: Stage 前质量门与 artifact 校验结果的 canonical payload 小写十六进制 SHA-256 内容身份
- name: evaluationMetrics
  type: json
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
  description: verificationDigest 所覆盖的场景化评估指标快照
- name: status
  type: enum
  enum_ref: RecommendationModelReleaseStatus
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: version
  type: int64
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: createdAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: activatedAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: retiredAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: updatedAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
types:
  StageRecommendationModelReleaseCommand:
    description: 固化一份尚未激活的模型发布；releaseId 与摘要共同形成不可变身份。
    fields:
    - {name: releaseId, type: string, constraints: [NOT_BLANK]}
    - {name: scenario, type: string, constraints: [NOT_BLANK]}
    - {name: modelDigest, type: string, constraints: [NOT_BLANK, SHA256]}
    - {name: featureContractDigest, type: string, constraints: [NOT_BLANK, SHA256]}
    - {name: artifactUri, type: string, constraints: [NOT_BLANK]}
    - {name: verificationDigest, type: string, constraints: [NOT_BLANK, SHA256]}
    - {name: evaluationMetrics, type: json, constraints: [NOT_NULL]}
    - {name: idempotencyKey, type: string, constraints: [NOT_BLANK]}
  ActivateRecommendationModelReleaseCommand:
    description: 对场景当前发布执行 compare-and-swap；回滚使用同一命令激活先前已验证发布。
    fields:
    - {name: releaseId, type: string, constraints: [NOT_BLANK]}
    - {name: scenario, type: string, constraints: [NOT_BLANK]}
    - {name: expectedActiveReleaseId, type: string, constraints: [NULLABLE]}
    - {name: idempotencyKey, type: string, constraints: [NOT_BLANK]}
  RecommendationModelReleaseCommandResult:
    description: Stage 或 Activate 的聚合提交结果。
    fields:
    - {name: releaseId, type: string, constraints: [NOT_NULL]}
    - {name: scenario, type: string, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: RecommendationModelReleaseStatus, constraints: [NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL]}
    - {name: activeReleaseId, type: string, constraints: [NULLABLE]}
    - {name: idempotentReplay, type: bool, constraints: [NOT_NULL]}
  RecommendationModelReleaseCommandReceipt:
    description: 模型发布命令的事务内幂等回执。
    fields:
    - {name: id, type: string, constraints: [PK, NOT_NULL]}
    - {name: commandDigest, type: string, constraints: [NOT_NULL]}
    - {name: releaseId, type: string, constraints: [NOT_NULL]}
    - {name: scenario, type: string, constraints: [NOT_NULL]}
    - {name: aggregateVersion, type: int64, constraints: [NOT_NULL]}
    - {name: result, type: object, object_ref: RecommendationModelReleaseCommandResult, constraints: [NOT_NULL]}
    - {name: expiresAt, type: timestamp, constraints: [NOT_NULL]}
  RecommendationModelReleaseOutbox:
    description: Stage/Activate 与聚合状态同事务追加的事件记录。
    fields:
    - {name: id, type: string, constraints: [PK, NOT_NULL]}
    - {name: eventType, type: string, constraints: [NOT_NULL]}
    - {name: aggregateId, type: string, constraints: [NOT_NULL]}
    - {name: aggregateVersion, type: int64, constraints: [NOT_NULL]}
    - {name: payloadJson, type: json, constraints: [NOT_NULL]}
    - {name: occurredAt, type: timestamp, constraints: [NOT_NULL]}
  ModelScoreRequest:
    description: 已激活 RecommendationModelRelease 的多场景评分 transport DTO，不是业务对象。
    fields:
    - name: scenario
      type: string
      constraints:
      - NOT_NULL
    - name: userId
      type: string
      constraints:
      - NOT_NULL
    - name: sessionId
      type: string
      constraints:
      - NOT_NULL
    - name: modelChannel
      type: string
      constraints:
      - NULLABLE
      description: champion/challenger 发布路由通道；不是模型内容身份
    - name: userFeatures
      type: object
      constraints:
      - NULLABLE
    - name: sessionSignals
      type: object
      constraints:
      - NULLABLE
    - name: candidates
      type: '[]CandidateInput'
      constraints:
      - NOT_NULL
    - name: context
      type: object
      constraints:
      - NULLABLE
  CandidateInput:
    description: '评分 Reader 的候选 transport DTO，不登记为业务对象。

      N3-3 特征偏斜收口：publishHour 由服务端从 publishedAt 派生随请求下发

      （训练-在线同源）；bodyLength/aspectRatio/hasCover 因在线召回投影不携带

      已从特征 registry 退役（S1 召回投影补齐后再启用），wire 不传。

      '
    fields:
    - name: contentId
      type: string
    - name: contentType
      type: string
    - name: authorId
      type: string
    - name: tagRefs
      type: '[]string'
    - name: entityRefs
      type: '[]string'
    - name: intersectionEdgeWeight
      type: float64
      description: 当前 viewer 与本候选作者或实体引用命中的最强物化交集边权；由 Go StrongestIntersectionEdgeFor 单点投影。
    - name: intersectionEdgeFreshness
      type: float64
      description: 与 intersectionEdgeWeight 同一条物化交集边的新鲜度；未命中为 0。
    - name: intersectionEdgeKind
      type: string
      description: 与 intersectionEdgeWeight 同一条物化交集边的 canonical kind；未命中为空。
    - name: ageHours
      type: float64
    - name: publishHour
      type: int
    - name: viewCount
      type: int64
    - name: likeCount
      type: int64
    - name: commentCount
      type: int64
    - name: shareCount
      type: int64
    - name: recallPath
      type: string
    - name: qualityScore
      type: float64
    - name: contentVertical
      type: string
    - name: supplySource
      type: string
    - name: intersectionFactStrength
      type: float64
    - name: intersectionFreshness
      type: float64
    - name: affinityIntersectionScore
      type: float64
    - name: intersectionSourceRefTop
      type: string
    - name: intersectionConfidenceLabel
      type: string
    - name: intersectionClass
      type: string
  ModelScoreResponse:
    description: 单次评分 Reader 的 transport 结果；模型命中时必须返回具体发布身份供曝光事实审计。
    fields:
    - name: scores
      type: '[]CandidateScore'
      constraints:
      - NOT_NULL
    - name: modelReleaseId
      type: string
      constraints:
      - NULLABLE
  BatchModelScoreRequest:
    description: 同一调用上下文中的强类型批量评分请求。
    fields:
    - name: requests
      type: '[]ModelScoreRequest'
      constraints:
      - NOT_NULL
  BatchModelScoreResponse:
    description: 与批量评分请求顺序一一对应的强类型结果。
    fields:
    - name: results
      type: '[]ModelScoreResponse'
      constraints:
      - NOT_NULL
  CandidateScore:
    description: 单条候选评分 transport 结果。
    fields:
    - name: contentId
      type: string
    - name: score
      type: float64
    - name: detail
      type: object
      constraints:
      - NULLABLE
enums:
  RecommendationModelReleaseStatus:
    values: [staged, active, retired]
