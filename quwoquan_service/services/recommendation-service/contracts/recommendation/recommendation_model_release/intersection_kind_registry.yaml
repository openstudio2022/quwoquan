computabilityLegend:
  R1: 关系投影与成员集合直接求交（persona_follow_projection / circle_memberships），最易、最可靠、可请求期算。
  R2: 行为边集合求交（rm_behavior_events 行为边真相源），需扫描+求交，请求期或预投影。
  R3: 身份/通讯录/标签维度（需 profile / contact 映射 / 实体标签），成本与隐私约束更高。
  R4: >-
    当前无稳定数据源或为概率推断，暂不产出 fact。五个 R4 kind
    （coPresentHere / nearbyAffinity / coPlannedTrip / wantToMeetSameInterest / coCreatedContent）
    的阻断不是「producer 还没写」，而是缺前置能力：在场上报（前两个）、行程对象（coPlannedTrip）、
    显式结识意向（wantToMeetSameInterest）、多作者署名（coCreatedContent）。
    每个 kind 的 deferredReason 写明了可核对的解除条件，未满足前不得用邻近语义借壳产出。

iconKeyLegend:
  # §21.5.2 交集 iconKey 语义闭集（端 IntersectionIconResolver 真相源）。
  # 闭集去单调：同维度内按"自身共同 / 第三方桥接 / 联系人 / 关注的人正在看"细分到可辨识 glyph，
  # 但 tone 仍按维度族收敛（relationship→sage、location→tea、identity/work→mist、content→clay、interest→stone）。
  place: 共同地点（coVisitedEntity / coWishlistedEntity）
  placeHere: 关注的人来过此地（followeeVisited，桥接）
  circle: 共同圈子 / 同圈成员（sharedCircle / coMemberCircle）
  people: 共同关注的人 / 共同被关注（sharedFollowees / commonFollower）
  contact: 共同联系人（commonContact，contactVisible 隐私门）
  followHere: 关注的人在此对象内（followeeInObject，桥接）
  viewing: 关注的人正在看此内容（followeeViewing，桥接）
  alumni: 校友 / 同校 / 同专业（sameSchool / sameMajor / sameCohort / alumni / alumniHere）
  work: 同公司 / 同团队 / 同行业 / 同事在此 / 共创（sameCompany / sameTeam / sameIndustry / colleagueHere / coCreatedContent）
  discussion: 共同讨论 / 都评论过 / 关注的人讨论（sharedDiscussion / coCommented / followeeDiscussedThis）
  share: 共同传播（coSharedContent）
  like: 共同点赞（coLiked，T4 最低权重，§21.9 恢复）
  interest: 共同兴趣标签（sharedTagSample）
  attention: 共同关注对象 / 品牌（sharedEntityAttention）

visualToneByIconKey:
  # §21.5.2 低饱和语义色调。端侧可按 iconKey 查 tone，不得在页面按 kind 硬编码颜色。
  place: tea
  placeHere: tea
  circle: sage
  people: sage
  contact: sage
  followHere: sage
  viewing: sage
  alumni: mist
  work: mist
  discussion: clay
  share: clay
  like: clay
  interest: stone
  attention: stone

iconAssetByIconKey:
  # iconKey → 远程图标资源（alpha 蒙版图）在数据发布 media 根下的相对路径。
  # 端侧用 BlendMode.srcIn 以 tone 着色后绘制，加载中/失败一律退回本地 glyph，
  # 因此本表可以为空，也可以只覆盖部分 iconKey——两种情况端侧表现都不退化。
  # 登记一行 + 发一次数据 = 新增交集类型图标，不需要发端（零发版视觉扩展位）。
  # 约束：必须是相对路径（禁止绝对 URL / 前导斜杠，CDN 域名属环境配置）。
  {}

iconKeyByDimension:
  # §21.5.2 dimension → iconKey 末级回退（未登记 kind / 旧数据 / affinity 概率类降级用）。
  # 端 IntersectionIconResolver 与 inbox 归一层共用此唯一回退表，不再各写一份 dimension switch。
  # 每个键必须 ∈ dimensions 闭集，每个值必须 ∈ iconKeyLegend 闭集（verify 脚本校验）。
  identity: alumni
  location: place
  content: discussion
  interest: interest
  relationship: people

coldStartSupply:
  # 冷启动稀释闸门（P0 横切）。
  #
  # 交集的信息量来自「区分度」：语料里只有 1 个实体时，「你和 TA 都看过西湖」对每个
  # 用户都成立，等价于没有交集，却会占满 Feed / 收件箱 / 对象页三个入口并稀释真实信号。
  # 因此每个 kind 声明一个最小候选池规模：该 kind 依赖的对象供给（语料中可被交集命中的
  # 去重对象数）低于阈值时，整类交集不展示，而不是展示一句人人相同的话。
  #
  # supplyKey 是该 kind 的供给计量口径（供给探针按 key 计数去重对象），
  # 缺省的 kind 不受闸门约束（例如共同关注的人：对象池天然等于用户池）。
  # 消费方：IntersectionService.Feed / List / ObjectIntersections 三入口统一执行。
  defaultMinDistinctObjects: 3
  supplyKeyByKind:
    sharedEntityAttention: entity_page_view
    followeeViewedObject: entity_page_view
    # 到访类按「被声明到访过的地点数」计量：与浏览池不同源，因为声明到访的地点
    # 天然远少于被浏览的地点，用浏览池当分母会高估到访交集的区分度。
    coVisitedEntity: post_declared_visit
    followeeVisited: post_declared_visit
    coWishlistedEntity: entity_wishlist
    sharedCircle: circle_membership
    coMemberCircle: circle_membership
  minDistinctObjectsByKind:
    # 地点/实体类：语料只有个位数 POI 时「都看过同一个地方」没有区分度，阈值最高。
    sharedEntityAttention: 8
    followeeViewedObject: 8
    # 到访池比浏览池小一个量级，阈值相应下调，但仍要求多于个位数的一两个地点，
    # 否则「都去过」在语料里同样退化成人人成立。
    coVisitedEntity: 5
    followeeVisited: 5
    coWishlistedEntity: 5
    # 圈子类：圈子总量本身就少，阈值低于实体类但仍需要多于 2 个才有区分度。
    sharedCircle: 3
    coMemberCircle: 3

actionHintLegend:
  # §21.5.3 行动建议闭集。服务端按 kind 查 actionKey，下发 IntersectionActionHint；
  # 端侧只渲染，不按 kind 猜测下一步。
  follow_person: 关注代表人或对象人
  greet_person: 打招呼
  message_person: 私信
  view_shared_people: 查看共同关注 / 共同联系人来源
  join_circle: 加入圈子
  open_discussion: 进入讨论 / 跟帖
  open_content: 回到内容
  open_object: 进入实体 / 地点 / 学校 / 公司主页
  follow_object: 关注对象
  open_route: 查看路线 / 地点内容
  create_followup: 写续篇 / 发布跟进
  ask_assistant: 让助手解释这条交集
  # §交集行动深化：同趣 / 聚集 / 实时 / 意图 行动阶梯（端只读渲染，不按 kind 猜测）。
  join_topic_room: 进入同趣话题群
  # 聚集只有两个动作：发起与加入，对应单一 Gathering 对象的两侧。
  # start_gathering 在 Gathering 对象落地前的承接是发起群聊页（带交集对象与归因上下文），
  # 因此文案只承诺「拉一个群谈同行」，不承诺行程、日期或成行。
  start_gathering: 发起聚集（把想去同一地点的人拉进同一个群谈同行）
  join_gathering: 加入聚集（结伴同行或报名线下相聚）
  meet_nearby: 附近碰头（默认模糊位置 + 双向同意）
  express_interest: 心动打招呼（带意图的打招呼变体，复用打招呼请求，不新增关系等级）
  # §交集商用闭环：commerce 契约位。真实渠道、返佣披露和商业化条款未完成前保持 deferred。
  view_official_deals: 查看官方优惠 / 导购入口
  book_ticket: 预订门票 / 活动票
  book_hotel: 预订住宿

# actionLabelByKey 各条的 l10nKey 前缀，约定同 presentationText：
# l10nKey = prefix + "." + snake(actionKey)。运营态覆盖
# （sys.intersection_text.<l10nKey>.<locale>）按同一批 key 生效。
actionLabelL10nKeyPrefix: intersection.action

actionLabelByKey:
  # §21.5.3 行动建议的终端 UI 短标签（按钮文案）。与 actionHintLegend 区分：
  # legend 是给运营/契约读者的语义描述，本表是端最终渲染/服务端下发 Label 的短文案。
  # 键集必须与 actionHintLegend 完全一致（verify 脚本校验），服务端 actionLabelForKey 查本表。
  follow_person: 关注TA
  greet_person: 打招呼
  message_person: 私信
  view_shared_people: 查看共同来源
  join_circle: 加入圈子
  open_discussion: 进入讨论
  open_content: 查看内容
  open_object: 查看对象
  follow_object: 关注对象
  open_route: 查看路线
  create_followup: 发布跟进
  ask_assistant: 解释这条交集
  join_topic_room: 进话题群
  # 按钮文案与承接一致：点下去是「拉个群」，不是「加入一次已成立的行程」。
  start_gathering: 发起聚集
  join_gathering: 加入聚集
  meet_nearby: 附近碰头
  express_interest: 打个招呼
  view_official_deals: 看官方优惠
  book_ticket: 订门票
  book_hotel: 订住宿

actionKeyMeta:
  # §24 行动阶梯元数据（M0.1 requiredGates + M0.3 tier/targetAvailability + M0.7 dispatch 的统一真相源）。
  # 键集必须 == actionHintLegend（verify 校验）。端下发 IntersectionActionHint 时按本表填充
  #   actionTier / requiredGates / targetAvailability / dispatch，端只读渲染并据此决定「可执行 / 优雅降级 / 落点」。
  #   tier:               light（轻查看/关注，即时可做）| heavy（重社交，需破冰阶梯/请求/建群/报名）。
  #   requiredGates:      ⊆ gateKeys，重行动必须声明；空=无门（轻查看类）。
  #   targetAvailability: available（有真实承接页可执行）| deferred（承接页/数据源未就绪，端不得伪造成行，
  #                       只展示不可执行规划口径或跳真实替代面，对应 §24.10 诚实红线 + UAT-8）。
  #   dispatch:           ∈ actionDispatch 闭集（assistant|navigate|message|companion|connect|commerce），端交互 handler 路由；
  #                       与 tier 正交（tier=heavy 的 message vs companion 落点不同）。端 navigator / 徽标 / 助手分发
  #                       一律读本字段，禁止端手写「助手 / 约伴 / 重社交」分类的第二份枚举（M0.7 收敛）。
  follow_person:      { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  # 打招呼落点是对方主页的 greeting 破冰状态机（POST /user/greeting-request，
  # 对方回复后才升级为正式会话），不是普通主页下钻，因此 dispatch 必须是 message：
  # 端按 dispatch 路由，navigate 会让「打招呼」按钮只跳主页、不兑现承诺（UAT-001）。
  greet_person:       { tier: light, requiredGates: [login, greetPreference, blocked], targetAvailability: available, dispatch: message }
  message_person:     { tier: heavy, requiredGates: [login, mutualConsent, blocked, rateLimit], targetAvailability: available, dispatch: message }
  view_shared_people: { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  join_circle:        { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  open_discussion:    { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  open_content:       { tier: light, requiredGates: [], targetAvailability: available, dispatch: navigate }
  open_object:        { tier: light, requiredGates: [], targetAvailability: available, dispatch: navigate }
  follow_object:      { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  open_route:         { tier: light, requiredGates: [], targetAvailability: available, dispatch: navigate }
  create_followup:    { tier: heavy, requiredGates: [login, realName], targetAvailability: available, dispatch: assistant }
  ask_assistant:      { tier: light, requiredGates: [], targetAvailability: available, dispatch: assistant }
  # 话题群没有承接对象：仓内只有圈子（circleDetail），没有按兴趣自动成群的话题房，
  # 端把它路由到圈子会变成「点进话题群 → 落到无关圈子」。承接就位前保持 deferred。
  join_topic_room:    { tier: heavy, requiredGates: [login, minorMode], targetAvailability: deferred, dispatch: connect }
  # start_gathering = 公开聚集邀约：发起是「开放邀约」，任何人可响应，故发起环节不需事先双向同意；
  #   mutualConsent（双向同意）属「响应后建立联系」阶段，由群聊/私信自身 gate 承接，不入发起 requiredGates
  #   （对照 meet_nearby 线下面基是点对点碰头，保留 mutualConsent+fuzzyLocation 才正确）。
  #   承接页复用既有建群落点（available）；来源 kind coWishlistedEntity 的数据源门由 kinds.coWishlistedEntity.status
  #   表达，与发起环节安全门正交（无稳定 wishlist 源时按 kind status GATE_BLOCK）。
  start_gathering:    { tier: heavy, requiredGates: [login, realName, minorMode, blocked, rateLimit], targetAvailability: available, dispatch: gathering }
  # 心动打招呼按 legend 的定义就是「复用打招呼请求」，承接与 greet_person 同一条状态机
  # （POST /user/greeting-request → reply → 正式会话），因此 dispatch 必须是 message：
  # connect 表达的是话题房/语音房这类同频房间落点，仓内没有该落点，用 connect 会让
  # 这个按钮永远无处可去（端对无落点的 dispatch 一律 fail-closed 不渲染）。
  express_interest:   { tier: heavy, requiredGates: [login, greetPreference, blocked, rateLimit], targetAvailability: available, dispatch: message }
  # 以下重行动承接仍 deferred（§24.10 诚实红线）。
  # join_gathering 的阻断是对象缺位而非页面未接线：objectKinds 里 gathering 声明的 routeId
  #   （gatheringDetail）与 Gathering 领域模型、参与者名单、写入口都要由
  #   circle-community/gathering-coordination 一次落地。解除条件是发起人 + 目标对象引用 +
  #   startAt/endAt 时间区间 + capacity + joinPolicy + 参与者名单 + conversationId 绑定全部就位，
  #   在此之前「结伴」只能走 start_gathering 的群聊承接。
  join_gathering:     { tier: heavy, requiredGates: [login, realName, minorMode], targetAvailability: deferred, dispatch: gathering }
  # meet_nearby 的阻断是数据源缺位：需要持续实时模糊位置上报（耗电 + 最高隐私成本），
  #   且它的价值本身取决于同城活跃用户密度（附近没人时「附近同趣」零信息量，与 coldStartSupply
  #   的稀释逻辑同理）。解除条件写在 kinds.coPresentHere / nearbyAffinity 的 deferredReason。
  meet_nearby:        { tier: heavy, requiredGates: [login, realName, minorMode, mutualConsent, fuzzyLocation, rateLimit], targetAvailability: deferred, dispatch: gathering }
  # commerce actionKey 仅冻结契约位：真实官方渠道/CPS/法务条款未就绪前不得展示可交易入口。
  view_official_deals: { tier: light, requiredGates: [], targetAvailability: deferred, dispatch: commerce }
  book_ticket:        { tier: heavy, requiredGates: [login], targetAvailability: deferred, dispatch: commerce }
  book_hotel:         { tier: heavy, requiredGates: [login], targetAvailability: deferred, dispatch: commerce }

