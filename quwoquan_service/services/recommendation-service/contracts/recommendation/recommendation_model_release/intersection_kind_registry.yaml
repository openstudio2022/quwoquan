# 一次性迁移映射（旧名 → 标准名，迁移后旧名零残留；与 §5.4 对齐）。
migrations:
  mutualFriend: sharedFollowees
  commonFollow: sharedFollowees
  friendInCircle: followeeInObject
  contactInCircle: followeeInObject
  friendActiveHere: followeeInObject
  friendVisited: followeeVisited
  contactVisited: followeeVisited
  friendJoinedRelatedCircle: followeeInObject
  coCollectedEntity: coWishlistedEntity
  coCity: coVisitedEntity
  coCohort: sameCohort
  sameOrg: sameCompany
  sameBrand: sharedEntityAttention
  # coLiked 已于 §21.9（2026-06-18）恢复为 T4 轻量交集，移出废弃迁移；见 kinds.coLiked。
  coFavorited: ""    # 废弃：内容无长期动作（收藏退场 §14A 不翻转）
  coFollowedContent: ""
  followeeFollowedContent: ""
  friendFavorited: ""
  coEra: ""
  youInteracted: ""

# 概念收敛迁移（旧名 → 标准名）。与 migrations 同为一次性映射：迁移完成后旧名在
# registry / codegen 产物 / 端侧常量 / 服务端实现里零残留，禁止保留别名或双读。
# 收敛依据：承接对象只有一个 Gathering（发起人 + 目标对象引用 + startAt/endAt 时间区间 +
#   capacity + joinPolicy + 参与者名单 + conversationId 绑定），trip 与 meetup 的差别只有
#   时间确定性，语音房复用绑定会话内既有群通话，因此四个 actionKey 收敛为两个、
#   两个 objectKind 收敛为一个、dispatch 类别改用覆盖全部聚集形态的名字。
actionKeyMigrations:
  start_companion: start_gathering
  join_trip: join_gathering
  join_meetup: join_gathering
  start_voice_room: ""    # 删除：群会话内已有群通话入口，不需要独立 actionKey

objectKindMigrations:
  trip: gathering
  meetup: gathering

actionDispatchMigrations:
  companion: gathering
