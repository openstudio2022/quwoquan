  followeeDiscussedThis: [open_discussion, open_content]
  # §交集行动深化：实时 / 附近 / 计划 / 意图 态新 kind 的行动阶梯（kind 暂 deferred，先登记契约）。
  coPresentHere: [meet_nearby, join_gathering, greet_person]
