    status: deferred
    deferredReason: >-
      「此刻同地」缺实时在场数据源与同意前置。端侧有 LocationGateway（geolocator）
      但唯一消费方是发布流程的地点选择（create_location_coordinator），没有任何
      在场上报接口：服务侧无 presence/heartbeat operation，无 TTL 在场读模型。
      不得用「最近发布过带该地点的内容」冒充此刻在场：那是过去到访事实（coVisitedEntity），
      时态不同，误报会把陌生人引到用户当前物理位置。
      解除条件：先落地在场上报契约（显式开关 + 短 TTL + 模糊到 POI 粒度 + 双向同意，
      两侧都开启才可下发），再补 producer；在场语义必须能被用户单向关闭且立即失效。

