registry: IntersectionKindRegistry
description: |
  交集 kind 机器可读唯一注册表。

  这是全仓交集 kind（IntersectionPoint.sourceRef / 证据组 kind）的唯一真相源，
  取代此前「specs markdown 表 + Go switch」双源。规则：

  - 只有标准名，零兼容别名；契约 / Go / Dart / fixture / mock / 测试一次性迁移到标准名。
  - 任何 kind 必须先在本表登记，才能在云侧产出或在 fixtures 铺设。
  - 未登记 kind 在云侧排序落兜底 rank（evidenceRank=500，不丢弃，便于灰度发现漂移），
    但禁止新增未登记 kind 的产出。
  - 与人类可读说明对齐：specs/feature-tree/object-homepage-network/intersection-unified-experience/spec.md §5.4 / §7 / §20 / §21。
  - 与策略对齐：recommendation/recommendation/recommendation_model_release/policy.yaml `intersection` 块（factWeight/affinityWeight/
    maxAffinityPerSurface/cooldownDays/freshnessTtlDaysByDimension/graphWeights/lifecycleWeights/propagation）。

  字段语义：
    kind             标准 sourceRef（唯一 id）。
    entry            §7 词典条目编号。
    level            sharedFact 共同型 / bridgeFact 桥接型 / impactFact 影响型 / affinity 概率。
    intersectionClass fact | affinity（affinity 必须标注「推荐」，不得伪装事实）。
    dimensions       五维闭集子集：identity | location | content | interest | relationship。
    objectKind       主对象品牌角标闭集：person | circle | school | place | enterprise。
    countObjectKind  被计数对象类型（数字下钻列表对象）：person | circle | content | place | entity | tag。
    valueTier        产品价值层级 T1(最高) > T2 > T3 > T4，用于选择得分 valueWeight。
    computability    可计算性 R1(最易/最可靠) → R3(身份/标签事实)，只登记已有生产链。
    confidenceThreshold affinity 入选最低置信；fact 恒为 0（达数量门槛即可产出）。
    privacyScope     public | contactVisible | mutualVisible（commonContact 必须先过可见性）。
    dedupeKey        去重主键模板（同 viewer 同窗口内同主键只保留一条最强证据）。
    timeWindowDays   保鲜窗口天数（与 policy.freshnessTtlDaysByDimension 对齐）。
    evidenceRank     云侧 evidenceKindRank 排序键（值越小越靠前；与 intersection_service.go 对齐）。
    sampleVisualsRequired 是否要求结构化 sampleVisuals（R1/R2 人级 kind 必填，禁头像冒充非人对象）。
    iconKey          端侧类型图标语义键（§21.5.2 闭集，IntersectionIconResolver 消费，禁端硬编码 switch）：
                     place | placeHere | circle | people | contact | followHere | viewing |
                     alumni | work | discussion | share | like | interest | attention | experience。
    propagationRole  传播图角色（§21.4）：none(共同型，自身不传播) | bridge(桥接型) | source(影响源)。
    lifecycleApplicable 该交集是否适用 Lifecycle 状态机弱标（§21.3）：
                     静态身份(同校/同司/校友在此)为 false，动态连接/行为/关注为 true。
    vertical         §23.4 垂类正交标注（缺省 general）；闭集见顶层 `verticals`。垂类扩展只改本字段 +
                     必要的 objectKind，禁止新增 travel.* 独立 kind（三元组 kind+vertical+objectKind 正交）。
    moment           意图时态（缺省 current）：retrospective 回溯 / current 当下 / prospective 前瞻；
                     与 lifecycleState 正交（lifecycleState 表边强弱变化，moment 表交集指向过去/当下/未来）。

  顶层闭集（§23.3 去桥接：端枚举 / 文案表键 / verify 校验唯一真相源，codegen 下发，禁端硬编码第二份）：
    dimensions       五维闭集：identity | location | content | interest | relationship。
    lifecycleStates  Lifecycle 状态机闭集（§21.3 五态 + §22.3 archived/expired 历史/不展示两态）。
    verticals        垂类闭集：general（缺省）| travel_photography。
    moments          §24 意图时态闭集：retrospective | current | prospective（每 kind moment ∈ 本集，缺省 current）。
    gateKeys         §24.6 安全门闭集（M0.1）：login | realName | minorMode | blocked | greetPreference |
                     mutualConsent | fuzzyLocation | rateLimit；actionKeyMeta.requiredGates ⊆ 本集。
    feedbackKinds    §24.4 负反馈闭集（M0.4）：notInterested | dismiss | rejectGreeting | leaveCircle（驱动降权/冷却）。
    actionDispatch   §24 行动路由类别闭集（M0.7）：assistant | navigate | message | gathering；
                     端交互 handler 路由维度（区别于 tier 权限成本维度），端据此分发落点，
                     禁止端手写「哪些 actionKey 属助手/聚集」的第二份枚举。
    actionKeyMeta    §24 行动阶梯元数据（M0.1/M0.3/M0.7）：actionKey → {tier(light|heavy) /
                     requiredGates(⊆gateKeys) / dispatch(∈actionDispatch)}；键集 == actionHintLegend。
    objectKinds      统一对象类型闭集（§23.3 B：objectKind 与 countObjectKind 合并为同一闭集 + 可计数子集标注）。
                     每项：kind / roles(object 主对象品牌角标 / count 被计数对象) / routeId(端路由逻辑名，空=不可导航)
                     / assetKind(对象视觉资产类型，roles 含 object 时必填)。kind 的 objectKind 取 roles 含 object 的子集，
                     countObjectKind 取 roles 含 count 的子集；端 UnifiedObjectKind 枚举 + objectKind→routeId 由本闭集 codegen。

  Graph 加权元数据（§21.2，edgeWeight = relationStrength × interactionFrequency × recencyDecay）：
    本期数值真算后置；派生口径单一真相源、零逐条占位（避免 27×未实现技术债）：
    - relationStrengthBase    由 valueTier 派生（= valueTierWeights[tier]）。
    - interactionFrequencyKey 由 computability/level 指向行为源（R1=关系边 / R2=行为边 / R3=身份·标签）。
    - recencyHalfLifeDays     由 timeWindowDays 派生（默认 = timeWindowDays），供 recencyDecay。
    数值化在云侧算法会话落地（policy.intersection.graphWeights 配置位）；本表只登记口径。

valueTierWeights:
  # 选择得分 score = valueWeight(tier) × freshness(decay) × confidence × diversityPenalty × cooldownGate
  T1: 1.0
  T2: 0.75
  T3: 0.5
  T4: 0.3

# ─── 顶层闭集（§23.3 去桥接：单一真相源 + codegen 下发 + verify 校验） ───
dimensions:
  # §21 五维闭集（稳定用户语言来源）。每 kind 的 dimensions 必须是本闭集子集。
  - identity
  - location
  - content
  - interest
  - relationship

lifecycleStates:
  # §21.3 五态状态机 + §22.3 历史/不展示两态（archived/expired，端默认列表过滤）。
  # active/resurfaced/cooling 是 stable/reactivated/weakened 的展示同义，不是独立状态机态，故不入闭集。
  - new
  - strengthened
  - stable
  - weakened
  - reactivated
  - archived
  - expired

verticals:
  # §23.4 垂类正交闭集。每 kind 的 vertical 缺省 general。
  - general
  - travel_photography

verticalExtensionContract:
  # §23.4 垂类扩展契约（新增垂类的唯一合法路径，verify_intersection_kind_registry.py 强制）。
  #
  # 新增一个垂类 == 只做这四件事：
  #   1. 在 verticals 闭集注册一个 vertical 值；
  #   2. 在 objectKinds 注册若干 objectKind，且每个必须映射到已有 homepage 类型或已有对象
  #      （routeId 必须是 app_routes.yaml 已存在的逻辑名，不得引入悬空路由）；
  #   3. 建一棵 taxonomy 子树（tagRef 前缀），承载该垂类的可证事实标签；
  #   4. 建一个事实生产者，把原始素材或行为转成 tagRef 与对象引用，喂给既有通用 kind。
  #
  # 明令禁止：新增 kind、新增 dimension、新增 actionKey、在端侧引入任何垂类分支。
  # 理由：kind + vertical + objectKind 是正交三元组。垂类的差异化只体现在「事实的丰富度」，
  #   不体现在结构分叉；端侧因此完全垂类无关（IntersectionTargetNavigator 只按
  #   actionKeyMeta.dispatch 分发，消息域只消费通用 intersection_reason）。
  #   一旦为垂类开 kind，同一件事就会有 general 与 travel.* 两套句子与两套排序权重，
  #   即第二真相源；同时端侧不得不按 vertical 分叉渲染，垂类数量与端侧分支数线性绑定。
  #
  # 不可导航事实不得升格为交集：objectKind=tag 只有 count 角色且 routeId 为空，
  #   把「同焦段 / 同光线窗口 / 同曝光参数」做成交集句会产出不可导航的主对象。
  #   这类事实的价值在推荐召回与内容理解（recommend_feature 通道），登记在
  #   recommendationOnlyFacts，明确不产出交集句。
  forbidNewKind: true
  forbidNewDimension: true
  forbidNewActionKey: true
  forbidClientVerticalBranch: true
  verticals:
    travel_photography:
      objectKinds: [route, photo_spot, gear]
      taxonomyRoots: ["Topic/摄影"]
      # 只引用本文件 factProducerShapes；禁止用自然语言字符串另写生产者合同。
      factProducers:
        - post_declared_visit
        - entity_wishlist
      # 本垂类实例化的既有通用 kind（零新 kind）。
      instantiatedKinds:
        - coVisitedEntity
        - followeeVisited
        - sharedEntityAttention
        - coWishlistedEntity
      # 只进推荐特征与内容标签、明确不产出交集句的事实（不可导航主对象）。
      recommendationOnlyFacts:
        - "Topic/摄影/拍摄参数/焦段"
        - "Topic/摄影/拍摄参数/快门"
        - "Topic/摄影/拍摄参数/光圈"
        - "Topic/摄影/拍摄参数/感光度"
        - "Topic/摄影/光线条件"
      newKinds: []
# 垂类事实生产者的唯一 shape 合同。这里只登记已有生产链；outputKinds 只允许引用下方既有通用 kind，
# recommendation_only 不得输出交集 kind，object_derivation 不得直接伪造交集事实。
factProducerShapes:
  post_declared_visit:
    visibility: intersection
    inputRefs: [content.post.visitedAt, content.post.geoTagRef]
    outputKinds: [coVisitedEntity, followeeVisited]
    outputObjectKinds: [place]
    outputTaxonomyRoots: []
  entity_wishlist:
    visibility: intersection
    inputRefs: [entity.entity_wishlist]
    outputKinds: [coWishlistedEntity]
    outputObjectKinds: [place]
    outputTaxonomyRoots: []
  # 共同经历生产者（交集飞轮回流环）：双方在同一 Gathering 均持有 active Participation，
  # 且各自主动发布了关联该 Gathering（content.post.gatheringRef）的公开内容后才产出
  # coExperiencedGathering。时间到达、聊天频率、位置或单方声明均不得触发（诚实红线延伸）。
  gathering_shared_experience:
    visibility: intersection
    inputRefs: [circle.gathering.participation, content.post.gatheringRef]
    outputKinds: [coExperiencedGathering]
    outputObjectKinds: [gathering]
    outputTaxonomyRoots: []
moments:
  # 意图时态闭集。moment 表达交集的「时态意图」，与 lifecycleState（边生命周期强弱）正交：
  #   lifecycleState 回答「这条边现在多强/是否新」；moment 回答「这条交集指向过去/当下/未来」。
  #   端据 moment 决定语气与可行动性（回溯=已发生可回看，当下=此刻可连接，前瞻=想去可约伴）。
  #   每个 kind 必须标注 moment ∈ 本闭集（verify 校验）。
  - retrospective   # 回溯：过去已发生的共同（去过同地 / 共同评论过 / 共同点赞过）
  - current         # 当下：此刻持续的状态（同校在读 / 正在看 / 共同关注 / 此刻同地）
  - prospective     # 前瞻：指向未来的意图（共同想去 / 计划同期出行 / 想认识同趣）

gateKeys:
  # §24.6 安全门闭集（M0.1）。重行动（约伴 / 私信 / 心动打招呼等）下发前必须声明 requiredGates ⊆ 本闭集；
  #   端按 gate 是否满足决定「可执行 / 优雅降级为查看证据或进对象」，未满足绝不静默失败或死循环（守 15-auth-entry-no-loop）。
  #   拦截语义与用户提示/恢复动作走所属对象 errors.yaml（MODULE.KIND.REASON + RuntimeFailure）。
  - login           # 需登录（游客触发 → 登录门，成功后续接原行动）
  - realName        # 需实名（重社交行动如约伴要求实名，未实名 → 引导实名）
  - minorMode       # 青少年模式受限（未成年人不开放约伴 / 私信等重行动）
  - blocked         # 拉黑关系（任一方拉黑 → 不下发重行动，静默隐藏入口）
  - greetPreference # 对方打招呼偏好（对方关闭陌生人打招呼 → 降级）
  - mutualConsent   # 需双向同意（约伴 / 私信需对方接受后建立）
  - fuzzyLocation   # 位置模糊化门（涉位置行动只暴露 geohash 降精度，禁精确实时位置）
  - rateLimit       # 频控配额（防骚扰，超配额 → 冷却提示）
  # gate → errors.yaml 拦截码映射（M0.1 契约闭环，C0/C 承接行动被拦时按此映射优雅降级）：
  #   login         → 端侧登录门（15-auth-entry-no-loop，非服务错误码，续接原行动）
  #   realName      → USER.GREETING.sender_realname_required（新增）
  #   minorMode     → USER.GREETING.minor_restricted（新增）
  #   blocked       → USER.GREETING.target_blocked_sender / CHAT.USER.blocked
  #   greetPreference → USER.GREETING.target_blocked_sender（对方 allowStrangerGreeting=false）
  #   mutualConsent → CHAT.USER.not_mutual（未互关 → 先打招呼 CHAT.USER.greeting_required）
  #   fuzzyLocation → 非拦截门（geohash 降精度，无错误码；违规精确位置由 location 域校验）
  #   rateLimit     → USER.GREETING.rate_limited / CHAT.USER.rate_limited

feedbackKinds:
  # §24.4 负反馈一等闭集（M0.4）。用户对交集/推荐的显式负反馈，驱动降权与冷却（消费在 F 推荐差异化）；
  #   本表是负反馈动作的唯一真相源，端上报与云侧降权/冷却读同一集合，禁止端各写一份。
  - notInterested   # 不感兴趣（对交集条目降权）
  - dismiss         # 忽略/关闭（进入冷却窗口，短期不再出现）
  - rejectGreeting  # 拒绝打招呼（对该来源人降权 + 冷却）
  - leaveCircle     # 退出圈子（对该圈子相关交集降权）

actionDispatch:
  # §24 行动路由类别闭集（M0.7）。表达「端用哪个交互 handler 消费这个 actionKey」，是**路由维度**，
  #   与 actionKeyMeta.tier（light|heavy 权限成本维度）正交：tier=heavy 的 message_person 与 start_gathering
  #   路由到完全不同的落点（私信会话 vs 聚集邀约），不能用 tier 表达分发。
  #   端 IntersectionTargetNavigator / 徽标 / 助手分发一律读 actionKeyMeta.dispatch，禁止端手写
  #   「哪些 actionKey 属助手 / 聚集 / 重社交」的第二份枚举（守 R06 元数据驱动 + R24 单一真相源）。
  - assistant   # 打开小艺解释 / 追问 / 续写（ask_assistant / create_followup），非导航到对象页
  - navigate    # 经统一导航到 target（对象 / 关系 / 内容 / 圈子 / 路线下钻 + 关注/打招呼轻动作），即时可做
  - message     # 私信会话落点（message_person），需 mutualConsent
  # gathering（原名 companion）：结伴 / 线下相聚 / 实时附近的唯一落点类别，驱动「有人同行」徽标。
  #   改名是概念收敛的一部分：承接对象只有一个 Gathering，路由类别不再用只覆盖「约伴」的旧词。
  - gathering   # 聚集邀约落点（发起 / 加入 Gathering、附近碰头）

objectKinds:
  # §23.3 B 统一对象类型闭集（合并 objectKind + countObjectKind，可计数子集靠 roles 标注，不再两套集合）。
  # roles: object = 主对象品牌角标（端 UnifiedObjectKind 枚举 + 可导航）；count = 被计数对象（数字下钻列表对象类型）。
  # routeId 为端路由逻辑名（与 ui_config / app_routes 对齐，空=不可导航纯文本）；assetKind 为对象视觉资产类型。
  # dimension / label 是共享标签 reason 的交集维度与兜底称谓：两者由 objectKind 决定而不是
  # 由 objectType 决定，因为「同游」成立的理由是对象是地点，与它是博物馆还是温泉无关。
  # objectType 到 objectKind 的收口写在 objectTypeBindings，服务端不得再手写 switch。
  - kind: person
    roles: [object, count]
    routeId: userProfile
    assetKind: avatar
    dimension: interest
    label: 同好
  - kind: circle
    roles: [object, count]
    routeId: circleDetail
    assetKind: circleAvatar
    dimension: relationship
    label: 同圈
  - kind: school
    roles: [object]
    routeId: homepageDetail
    assetKind: emblem
    dimension: identity
    label: 同校
  - kind: place
    roles: [object, count]
    routeId: homepageDetail
    assetKind: coverImage
    dimension: location
    label: 同游
  - kind: enterprise
    roles: [object]
    routeId: homepageDetail
    assetKind: logo
    dimension: interest
    label: 同好
  # §22.2 旅行摄影 objectKind 扩展（route/photo_spot/gear）；结构就位，open_route 落点走实体主页。
  - kind: route
    roles: [object]
    routeId: homepageDetail
    assetKind: coverImage
    dimension: location
    label: 同游
  - kind: photo_spot
    roles: [object]
    routeId: homepageDetail
    assetKind: coverImage
    dimension: location
    label: 同游
  # gear 的维度是 interest 而非 location：共用同一台机身是兴趣事实，不是同地事实。
  - kind: gear
    roles: [object]
    routeId: homepageDetail
    assetKind: coverImage
    dimension: interest
    label: 同好
  # 内容可作为交集主句宾语（文章/图片/视频），routeId 走 workBrowser；
  # tag 仍仅作被计数对象，不能作为可见主句宾语。
  - kind: content
    roles: [object, count]
    routeId: workBrowser
    assetKind: coverImage
    dimension: interest
    label: 同好
  - kind: entity
    roles: [count]
    routeId: homepageDetail
    dimension: location
    label: 同游
  - kind: tag
    roles: [count]
    routeId: ""
    dimension: interest
    label: 同好
  # 聚集对象用 startAt + 可空 endAt 一个时间区间同时表达
  # 「这周末想去 XX 有人一起吗」（跨天窗口）与「周六 14:00 XX 集合」（精确时间点），
  # routeId 指向 Gathering 的唯一详情入口。
  - kind: gathering
    roles: [object, count]
    routeId: gatheringDetail
    assetKind: coverImage
    dimension: relationship
    label: 同圈

objectTypeBindings:
  # 把开放的 objectType 词汇（HomepageType 全集 + 人/圈/企的同义写法）声明式收口到
  # 上面的 objectKind 闭集。这里是唯一真相源：服务端禁止再按 objectType 手写 switch，
  # 也禁止从 objectId 子串反推类型。新增一个 HomepageType 只需在此加一行并重跑 codegen，
  # 不需要发 Go 版本；缺失绑定由 verify_intersection_kind_registry.py 阻断，
  # 避免像历史上那样静默落进 default 而被误判成人物、错误路由到 userProfile。
  - objectType: user
    objectKind: person
  - objectType: person
    objectKind: person
  - objectType: circle
    objectKind: circle
  # 泛化占位：端直连与 search-service 只知道自己在看一个主页/实体，拿不到具体 HomepageType。
  # 它们与具体地点类型同样按地点处理，否则同一个对象会因调用方不同而换一套维度与称谓。
  - objectType: homepage
    objectKind: place
  - objectType: entity
    objectKind: place
  - objectType: place
    objectKind: place
  # HomepageType 全集（_shared/types.yaml#HomepageType），逐值绑定，不留 default。
  - objectType: sight
    objectKind: place
  - objectType: travel_photo
    objectKind: place
  - objectType: hotel
    objectKind: place
  - objectType: restaurant
    objectKind: place
  - objectType: museum
    objectKind: place
  - objectType: heritage_site
    objectKind: place
  - objectType: ancient_town
    objectKind: place
  - objectType: religious_site
    objectKind: place
  - objectType: check_in_spot
    objectKind: place
  - objectType: natural_landscape
    objectKind: place
  - objectType: park
    objectKind: place
  - objectType: hot_spring
    objectKind: place
  - objectType: theme_park
    objectKind: place
  - objectType: transport_hub
    objectKind: place
  - objectType: city
    objectKind: place
  - objectType: university
    objectKind: school
  - objectType: route
    objectKind: route
  - objectType: photo_spot
    objectKind: photo_spot
  - objectType: gear
    objectKind: gear
  # vehicle 归 gear：车型主页与相机机身一样是「带着走的装备」，共用一台是兴趣事实而非同地事实。
  # 归 place 会产出「你们都去过这台车」的错误句式。
  - objectType: vehicle
    objectKind: gear
  # 非 HomepageType 的既有写法，保留以免调用方改口径即失配。
  - objectType: school
    objectKind: school
  - objectType: brand
    objectKind: enterprise
  - objectType: enterprise
    objectKind: enterprise
  - objectType: company
    objectKind: enterprise

computabilityLegend:
  R1: 关系投影与成员集合直接求交（persona_follow_projection / circle_memberships），最易、最可靠、可请求期算。
  R2: 行为边集合求交（rm_behavior_events 行为边真相源），需扫描+求交，请求期或预投影。
  R3: 身份/通讯录/标签维度（需 profile / contact 映射 / 实体标签），成本与隐私约束更高。

iconKeyLegend:
  # §21.5.2 交集 iconKey 语义闭集（端 IntersectionIconResolver 真相源）。
  # 闭集去单调：同维度内按"自身共同 / 第三方桥接 / 联系人 / 关注的人正在看"细分到可辨识 glyph，
  # 但 tone 仍按维度族收敛（relationship→sage、location→tea、identity/work→mist、content→clay、interest→stone）。
  place: 共同地点（coVisitedEntity / coWishlistedEntity）
  placeHere: 关注的人来过此地（followeeVisited，桥接）
  circle: 共同圈子（sharedCircle）
  people: 共同关注的人 / 共同被关注（sharedFollowees / commonFollower）
  followHere: 关注的人在此对象内（followeeInObject，桥接）
  viewing: 关注的人正在看此内容（followeeViewing，桥接）
  alumni: 身份维度兜底图标
  work: 同行业（sameIndustry）
  discussion: 都评论过 / 关注的人讨论（coCommented / followeeDiscussedThis）
  share: 共同传播（coSharedContent）
  like: 共同点赞（coLiked，T4 最低权重，§21.9 恢复）
  interest: 共同兴趣标签（sharedTagSample）
  attention: 共同关注对象 / 品牌（sharedEntityAttention）
  experience: 共同经历（coExperiencedGathering，一起参加过同一 Gathering 并各自主动发布关联回顾）

visualToneByIconKey:
  # §21.5.2 低饱和语义色调。端侧可按 iconKey 查 tone，不得在页面按 kind 硬编码颜色。
  place: tea
  placeHere: tea
  circle: sage
  people: sage
  followHere: sage
  viewing: sage
  alumni: mist
  work: mist
  discussion: clay
  share: clay
  like: clay
  interest: stone
  attention: stone
  # 共同经历归 relationship 维度族（sage）：它表达的是「我们之间发生过什么」，不是地点事实。
  experience: sage

iconAssetByIconKey:
  # iconKey → 远程图标资源（alpha 蒙版图）在数据发布 media 根下的相对路径。
  # 端侧用 BlendMode.srcIn 以 tone 着色后绘制，加载中/失败一律退回本地 glyph，
  # 因此本表可以为空，也可以只覆盖部分 iconKey——两种情况端侧表现都不退化。
  # 登记一行 + 发一次数据 = 新增交集类型图标，不需要发端（零发版视觉扩展位）。
  # 约束：必须是相对路径（禁止绝对 URL / 前导斜杠，CDN 域名属环境配置）。
  {}

iconKeyByDimension:
  # §21.5.2 dimension → iconKey 末级回退（未登记 kind / 旧数据 / affinity 概率类降级用）。
  # 端 IntersectionIconResolver 与 inbox 归一层共用此唯一回退表，不再各写一份 dimension switch。
  # 每个键必须 ∈ dimensions 闭集，每个值必须 ∈ iconKeyLegend 闭集（verify 脚本校验）。
  identity: alumni
  location: place
  content: discussion
  interest: interest
  relationship: people

coldStartSupply:
  # 冷启动稀释闸门（P0 横切）。
  #
  # 交集的信息量来自「区分度」：语料里只有 1 个实体时，「你和 TA 都看过西湖」对每个
  # 用户都成立，等价于没有交集，却会占满 Feed / 收件箱 / 对象页三个入口并稀释真实信号。
  # 因此每个 kind 声明一个最小候选池规模：该 kind 依赖的对象供给（语料中可被交集命中的
  # 去重对象数）低于阈值时，整类交集不展示，而不是展示一句人人相同的话。
  #
  # supplyKey 是该 kind 的供给计量口径（供给探针按 key 计数去重对象），
  # 缺省的 kind 不受闸门约束（例如共同关注的人：对象池天然等于用户池）。
  # 消费方：IntersectionService.Feed / List / ObjectIntersections 三入口统一执行。
  defaultMinDistinctObjects: 3
  supplyKeyByKind:
    sharedEntityAttention: entity_page_view
    followeeViewedObject: entity_page_view
    # 到访类按「被声明到访过的地点数」计量：与浏览池不同源，因为声明到访的地点
    # 天然远少于被浏览的地点，用浏览池当分母会高估到访交集的区分度。
    coVisitedEntity: post_declared_visit
    followeeVisited: post_declared_visit
    coWishlistedEntity: entity_wishlist
    sharedCircle: circle_membership
  minDistinctObjectsByKind:
    # 地点/实体类：语料只有个位数 POI 时「都看过同一个地方」没有区分度，阈值最高。
    sharedEntityAttention: 8
    followeeViewedObject: 8
    # 到访池比浏览池小一个量级，阈值相应下调，但仍要求多于个位数的一两个地点，
    # 否则「都去过」在语料里同样退化成人人成立。
    coVisitedEntity: 5
    followeeVisited: 5
    coWishlistedEntity: 5
    # 圈子类：圈子总量本身就少，阈值低于实体类但仍需要多于 2 个才有区分度。
    sharedCircle: 3

actionHintLegend:
  # §21.5.3 行动建议闭集。服务端按 kind 查 actionKey，下发 IntersectionActionHint；
  # 端侧只渲染，不按 kind 猜测下一步。
  follow_person: 关注代表人或对象人
  greet_person: 打招呼
  message_person: 私信
  view_shared_people: 查看共同关注 / 共同联系人来源
  join_circle: 加入圈子
  open_discussion: 进入讨论 / 跟帖
  open_content: 回到内容
  open_object: 进入实体 / 地点 / 学校 / 公司主页
  follow_object: 关注对象
  open_route: 查看路线 / 地点内容
  create_followup: 写续篇 / 发布跟进
  ask_assistant: 让助手解释这条交集
  # start_gathering 绑定真实 Gathering 创建入口与 coWishlistedEntity 证据。
  start_gathering: 发起聚集（把想去同一地点的人拉进同一个群谈同行）

# actionLabelByKey 各条的 l10nKey 前缀，约定同 presentationText：
# l10nKey = prefix + "." + snake(actionKey)。运营态覆盖
# （sys.intersection_text.<l10nKey>.<locale>）按同一批 key 生效。
actionLabelL10nKeyPrefix: intersection.action

actionLabelByKey:
  # §21.5.3 行动建议的终端 UI 短标签（按钮文案）。与 actionHintLegend 区分：
  # legend 是给运营/契约读者的语义描述，本表是端最终渲染/服务端下发 Label 的短文案。
  # 键集必须与 actionHintLegend 完全一致（verify 脚本校验），服务端 actionLabelForKey 查本表。
  follow_person: 关注TA
  greet_person: 打招呼
  message_person: 私信
  view_shared_people: 查看共同来源
  join_circle: 加入圈子
  open_discussion: 进入讨论
  open_content: 查看内容
  open_object: 查看对象
  follow_object: 关注对象
  open_route: 查看路线
  create_followup: 发布跟进
  ask_assistant: 解释这条交集
  start_gathering: 发起聚集

actionKeyMeta:
  # §24 行动阶梯元数据（M0.1 requiredGates + M0.3 tier + M0.7 dispatch 的统一真相源）。
  # 键集必须 == actionHintLegend（verify 校验）。端下发 IntersectionActionHint 时按本表填充
  #   actionTier / requiredGates / dispatch，端只读渲染并据此决定「可执行 / 优雅降级 / 落点」。
  #   tier:               light（轻查看/关注，即时可做）| heavy（重社交，需破冰阶梯/请求/建群/报名）。
  #   requiredGates:      ⊆ gateKeys，重行动必须声明；空=无门（轻查看类）。
  #   dispatch:           ∈ actionDispatch 闭集（assistant|navigate|message|gathering），端交互 handler 路由；
  #                       与 tier 正交（tier=heavy 的 message vs companion 落点不同）。端 navigator / 徽标 / 助手分发
  #                       一律读本字段，禁止端手写「助手 / 约伴 / 重社交」分类的第二份枚举（M0.7 收敛）。
  follow_person:      { tier: light, requiredGates: [login], dispatch: navigate }
  # 打招呼落点是对方主页的 greeting 破冰状态机（POST /user/greeting-request，
  # 对方回复后才升级为正式会话），不是普通主页下钻，因此 dispatch 必须是 message：
  # 端按 dispatch 路由，navigate 会让「打招呼」按钮只跳主页、不兑现承诺（UAT-001）。
  greet_person:       { tier: light, requiredGates: [login, greetPreference, blocked], dispatch: message }
  message_person:     { tier: heavy, requiredGates: [login, mutualConsent, blocked, rateLimit], dispatch: message }
  view_shared_people: { tier: light, requiredGates: [login], dispatch: navigate }
  join_circle:        { tier: light, requiredGates: [login], dispatch: navigate }
  open_discussion:    { tier: light, requiredGates: [login], dispatch: navigate }
  open_content:       { tier: light, requiredGates: [], dispatch: navigate }
  open_object:        { tier: light, requiredGates: [], dispatch: navigate }
  follow_object:      { tier: light, requiredGates: [login], dispatch: navigate }
  open_route:         { tier: light, requiredGates: [], dispatch: navigate }
  create_followup:    { tier: heavy, requiredGates: [login, realName], dispatch: assistant }
  ask_assistant:      { tier: light, requiredGates: [], dispatch: assistant }
  # start_gathering = 公开聚集邀约：发起是「开放邀约」，任何人可响应，故发起环节不需事先双向同意；
  #   mutualConsent（双向同意）属「响应后建立联系」阶段，由群聊/私信自身 gate 承接，不入发起 requiredGates
  #   （对照 meet_nearby 线下面基是点对点碰头，保留 mutualConsent+fuzzyLocation 才正确）。
  #   承接页复用既有建群落点（available）；来源 kind coWishlistedEntity 的数据源门由 kinds.coWishlistedEntity.status
  #   表达，与发起环节安全门正交（无稳定 wishlist 源时按 kind status GATE_BLOCK）。
  start_gathering:    { tier: heavy, requiredGates: [login, realName, minorMode, blocked, rateLimit], dispatch: gathering }

actionHintsByKind:
  # 共同经历的行动阶梯首位是「再约一次」（交集飞轮的复利环）：经历过一次的双方
  # 再次发起的信任成本最低；其次回看行动详情（共同经历聚合区），最后私信。
  coExperiencedGathering: [start_gathering, open_object, message_person]
  sharedFollowees: [follow_person, greet_person, view_shared_people]
  commonFollower: [follow_person, message_person, view_shared_people]
  # sameIndustry 的对象是人本身，没有可打开的组织对象，行动阶梯只到人。
  sameIndustry: [message_person, follow_person]
  sharedCircle: [join_circle, open_discussion]
  coCommented: [open_content, open_discussion]
  coSharedContent: [open_content, create_followup]
  coLiked: [open_content, follow_person]
  coVisitedEntity: [open_object, open_route]
  sharedEntityAttention: [open_object, follow_object]
  coWishlistedEntity: [start_gathering, open_route, follow_object]
  sharedTagSample: [open_object, join_circle]
  followeeInObject: [join_circle, view_shared_people]
  followeeVisited: [open_object, open_route]
  followeeViewedObject: [open_object, view_shared_people]
  followeeViewing: [open_content, view_shared_people]
  followeeDiscussedThis: [open_discussion, open_content]

statementTemplates:
  # §17.1 结论句模板的唯一真相源。此前每个 kind 的谓语在 Go 里写了两遍
  # （ExplainPrimaryText 的 fmt.Sprintf 一份、primaryStatementSpansForReason 的 plainSpan 一份），
  # 改一句文案要同时改两处并发一次服务，且没有任何 l10n key，国际化不可行。
  #
  # 现在文本与 spans 由同一个模板渲染：join(primarySpans.text) == primaryText 由渲染器
  # 结构性保证，而不是靠两份模板手工对齐。
  #
  # 槽位闭集（slots）：
  #   subject         代表人主语（「林清越等4人」/「3位校友」/「你」），渲染为可点击 spans
  #   countedSubject  纯计数主语（「3位你关注的人」），followee* 桥接型用
  #   object          第三方对象或对方本人，渲染为 object span（可点击，带 target）
  #   count           锚点真实计数（计数降级句用，plain）
  #   occupation      共享职业标签名（identity 事实的谓语补足语，plain）
  #   place           点级地名样本（人级地点交集用，plain）
  #   action          实测互动动词短语（赞过/评论过/转发过组合），缺省用 actionFallback
  #
  # 每条模板必须带 l10nKey：服务端下发 primaryTextL10nKey，端未来接入本地化资源时按 key
  # 取译文并回填同名槽位；key 命名 = intersection.statement.<snake_kind>[.<variant>]。
  #
  # counted：容器对象名缺失时的计数降级句（§20.4 降级链第二级：具名 → 纯计数 → 隐藏）。
  #   没有 counted 的 kind 表示不可降级，缺名时整条隐藏（不造名）。
  # variants：
  #   personPlace  对象位是对方本人、地点在点级证据里（对象页宿主是人）
  #   circleTag    圈子标签样本（sharedTagSample 的 source == circleTag）
  slots: [subject, countedSubject, object, count, occupation, place, action]
  byKind:
    sharedFollowees:
      l10nKey: intersection.statement.shared_followees
      template: "{subject}也关注了{object}"
    commonFollower:
      l10nKey: intersection.statement.common_follower
      template: "{subject}也关注了{object}"
    sharedCircle:
      l10nKey: intersection.statement.shared_circle
      template: "{subject}都加入了{object}"
      counted:
        l10nKey: intersection.statement.shared_circle.counted
        template: "{subject}和你都加入了{count}个共同圈子"
    coCommented:
      l10nKey: intersection.statement.co_commented
      template: "{subject}{action}{object}"
      actionFallback: 都讨论过
      counted:
        l10nKey: intersection.statement.co_commented.counted
        template: "{subject}和你都讨论过{count}条相同内容"
    coSharedContent:
      l10nKey: intersection.statement.co_shared_content
      template: "{subject}{action}{object}"
      actionFallback: 都转发过
      counted:
        l10nKey: intersection.statement.co_shared_content.counted
        template: "{subject}和你都转发过{count}条相同内容"
    coLiked:
      l10nKey: intersection.statement.co_liked
      template: "{subject}都点赞过{object}"
      counted:
        l10nKey: intersection.statement.co_liked.counted
        template: "{subject}和你都点赞过{count}条相同内容"
    coVisitedEntity:
      l10nKey: intersection.statement.co_visited_entity
      template: "{subject}都去过{object}"
      counted:
        l10nKey: intersection.statement.co_visited_entity.counted
        template: "{subject}和你都去过{count}个相同的地方"
      variants:
        personPlace:
          l10nKey: intersection.statement.co_visited_entity.person_place
          template: "你和{object}都去过{place}"
    coWishlistedEntity:
      l10nKey: intersection.statement.co_wishlisted_entity
      template: "{subject}都想去{object}"
      counted:
        l10nKey: intersection.statement.co_wishlisted_entity.counted
        template: "{subject}和你都想去{count}个相同的地方"
      variants:
        personPlace:
          l10nKey: intersection.statement.co_wishlisted_entity.person_place
          template: "你和{object}都想去{place}"
    sharedEntityAttention:
      l10nKey: intersection.statement.shared_entity_attention
      template: "{subject}也看过{object}"
      counted:
        l10nKey: intersection.statement.shared_entity_attention.counted
        template: "{subject}和你都看过{count}个相同对象"
    followeeVisited:
      l10nKey: intersection.statement.followee_visited
      template: "{countedSubject}来过{object}"
    followeeViewedObject:
      l10nKey: intersection.statement.followee_viewed_object
      template: "{countedSubject}也看过{object}"
    followeeInObject:
      l10nKey: intersection.statement.followee_in_object
      template: "{subject}在{object}"
    followeeViewing:
      l10nKey: intersection.statement.followee_viewing
      template: "{subject}正在看{object}"
    followeeDiscussedThis:
      l10nKey: intersection.statement.followee_discussed_this
      template: "{subject}正在讨论{object}"
    # 共享职业标签只能证明「同行」：宾语是对方本人，谓语补足语是双方都声明的职业标签，
    # 不得升级为不存在可证组织实例的同公司/同团队语义。
    sameIndustry:
      l10nKey: intersection.statement.same_industry
      template: "你和{object}都是{occupation}"
    sharedTagSample:
      l10nKey: intersection.statement.shared_tag_sample
      template: "{subject}都关注{object}"
      variants:
        circleTag:
          l10nKey: intersection.statement.shared_tag_sample.circle_tag
          template: "{subject}在圈子里常看{object}"
    # 共同经历只说「一起参加过」：occurred 语义由 Gathering Outcome 独立承载，
    # 本句只断言双方 active Participation + 双方主动发布关联回顾这一可证事实。
    coExperiencedGathering:
      l10nKey: intersection.statement.co_experienced_gathering
      template: "{subject}一起参加过{object}"
      counted:
        l10nKey: intersection.statement.co_experienced_gathering.counted
        template: "{subject}和你一起参加过{count}次行动"

presentationText:
  # §17.2 结论句「谓语」之外的全部用户可见词汇的唯一真相源。
  #
  # statementTemplates 只管谓语；主语称谓、计数语法、互动动词、维度名、类别名、
  # 对象名装饰与概率通道话术此前散落在 intersection_source.go（32 处）、
  # intersection_hydration_explain.go（46 处）、intersection_hydration.go（19 处）与
  # intersection_service.go（8 处），改一个词要发一次服务且端云会各自漂移。
  # 两块合起来使 Go 侧不再持有任何中文。
  #
  # l10nKey 约定：每张表声明 l10nKeyPrefix，条目 l10nKey = prefix + "." + snake(条目键)。
  # 逐条手写 key 会引入近百行只能靠人眼保持一致的样板，故按前缀推导，
  # 由 verify_intersection_kind_registry.py 校验推导结果全局唯一。
  # 运营态覆盖（sys.intersection_text.<l10nKey>.<locale>）按同一批 key 生效。

  # 代表人关系限定词：kind(= anchor.sourceRef) → 称谓。
  # 未登记 kind 取 default（空串），此时主语退化为不带关系限定的计数式。
  relationLabels:
    l10nKeyPrefix: intersection.relation
    default: ""
    byKind:
      sharedFollowees: 你关注的人
      followeeInObject: 你关注的人
      followeeVisited: 你关注的人
      followeeViewedObject: 你关注的人
      followeeViewing: 你关注的人
      followeeDiscussedThis: 你关注的人
      # 共同粉丝是「关注你」的方向，不是「你关注」：套用「你关注的人」会把关系方向说反。
      commonFollower: 关注你的人
      commonContact: 联系人
      sameSchool: 校友
      sameDepartment: 校友
      sameMajor: 校友
      sameCohort: 校友
      alumni: 校友
      alumniHere: 校友
      sameCompany: 同事
      sameTeam: 同事
      colleagueHere: 同事
      # 同行业 ≠ 同公司：共享职业标签只能证明「同行」，说「同事」是把行业相似
      # 伪装成组织归属（§24.10 诚实红线）。
      sameIndustry: 同行
      sharedCircle: 同圈成员
      coMemberCircle: 同圈成员
      coExperiencedGathering: 同行过的人

  # 无具名代表人时的匿名主语。与 relationLabels 不同表：并非所有有关系称谓的 kind
  # 都能匿名成句（如 sharedFollowees 匿名后是「一位用户」而非「一位你关注的人」）。
  anonymousActorLabels:
    l10nKeyPrefix: intersection.anonymous_actor
    default: 一位用户
    byKind:
      sameSchool: 一位校友
      sameDepartment: 一位校友
      sameMajor: 一位校友
      sameCohort: 一位校友
      alumni: 一位校友
      alumniHere: 一位校友
      sameCompany: 一位同事
      sameTeam: 一位同事
      colleagueHere: 一位同事
      sameIndustry: 一位同行
      commonContact: 一位联系人

  # 主语的计数与组合语法。槽位：{relation} {count} {name} {subject} {unit}。
  subjectPatterns:
    l10nKeyPrefix: intersection.subject
    patterns:
      anonymousWithRelation: "一位{relation}"
      singleWithRelation: "1位{relation}"
      singleUnknownRelation: 1位用户
      countedWithRelation: "{count}位{relation}"
      countedUnknownRelation: "{count}位用户"
      countedPlain: "{count}人"
      relationPrefixedName: "{relation}{name}"
      namedWithMore: "{subject}等{count}人"
      namedWithMoreUnit: "{subject}等{count}{unit}"

  # 宿主对象即观察者自身时的主语（sharedTagSample 在对象页/圈子页的视角）。
  viewerSubjects:
    l10nKeyPrefix: intersection.viewer_subject
    selfOnly: 你
    byObjectType:
      homepage: 你和这里
      circle: 你和这个圈子

  # 实测互动动词短语。有几种动作就取几个词，按 joiners 连接。
  interactionVerbs:
    l10nKeyPrefix: intersection.interaction_verb
    byAction:
      like: 赞过
      comment: 评论过
      share: 转发过
    joiners:
      pair: 和
      list: 、
      last: 并

  dimensionLabels:
    l10nKeyPrefix: intersection.dimension
    byDimension:
      identity: 身份
      location: 地点
      content: 内容
      interest: 兴趣
      relationship: 关系

  pointClassLabels:
    l10nKeyPrefix: intersection.point_class
    byPointClass:
      fact: 事实交集
      recommended: 推荐交集

  # 对象名的引号装饰：作品类用书名号，其余用直角引号。
  objectNameDecorations:
    l10nKeyPrefix: intersection.object_name
    default:
      prefix: 「
      suffix: 」
    workTitle:
      prefix: 《
      suffix: 》
    workTitleKinds:
      [
        coCommented,
        sharedDiscussion,
        coSharedContent,
        coCreatedContent,
        followeeViewing,
        followeeDiscussedThis,
      ]

  # 概率通道话术（affinity）。必须配 confidenceLabel 标注「推荐」，§17.5/§3.4。
  affinityStatements:
    l10nKeyPrefix: intersection.affinity
    byChannel:
      circle:
        named: "你的圈子里最近在看{object}"
        unnamed: 你的圈子里最近在看这些
      followee:
        named: "你关注的人最近在看{object}"
        unnamed: 你关注的人最近在看这些
      general:
        named: "为你推荐{object}"
        unnamed: 为你推荐的相关内容
    defaultConfidenceLabel: 可能感兴趣
    confidenceLabelByDimension:
      relationship: 推荐认识
      identity: 推荐认识

  connectionSummary:
    l10nKeyPrefix: intersection.connection_summary
    template: "你们已有{count}个共同点"

  secondaryText:
    l10nKeyPrefix: intersection.secondary_text
    itemWithCount: "{label} {count}"
    separator: " · "

  # 样本名列表分隔符（locale 敏感：中文顿号 vs 西文逗号）。
  listSeparator:
    l10nKeyPrefix: intersection.list_separator
    text: 、

  # 占位名黑名单：这些是历史上被当成真实对象名/关系称谓下发的通用词，
  # 命中即视为「没有具名对象」并走降级链，禁止出现在结论句里。
  placeholderObjectNames:
    [同游, 同好, 同校, 这里, 这个对象, 这些内容, 这些主题, 相同内容, 相同的人]
  placeholderRelationLabels:
    [共同点赞, 共同讨论, 共同传播, 共同关注, 都关注此标签, 同行足迹, 同好]

  # 交集点的计数短句（point.displayText）。此前由 intersection_source.go 逐点拼接。
  # 槽位：
  #   count   锚点真实计数（point.count）
  #   object  reason 的对象展示名（人名或地点名，视 kind 而定）
  #   sample  点级样本首项（职业名 / 地名 / 实体名，取自 point.sampleText 第一段）
  # 未登记 kind 不产出点级短句（不造句），由端按 label + count 降级展示。
  pointTemplates:
    l10nKeyPrefix: intersection.point
    byKind:
      sharedFollowees: "{count}位共同关注的人"
      commonFollower: "{count}位共同粉丝"
      sharedCircle: "{count}个共同圈子"
      coCommented: "讨论过{count}篇相同内容"
      sameIndustry: "都是{sample}"
      coSharedContent: "转发过{count}篇相同内容"
      coLiked: "点赞过{count}篇相同内容"
      sharedEntityAttention: "都看过{count}个相同对象"
      coWishlistedEntity: "你和{object}都想去{sample}"
      coVisitedEntity: "你和{object}都去过{sample}"
      coExperiencedGathering: "你和{object}一起参加过{sample}"
      followeeVisited: "{count}位你关注的人来过{object}"
      followeeViewedObject: "{count}位你关注的人看过"
      followeeInObject: "{count}位你关注的人在这里"

  # 逐人证据里「TA 做了什么」的动作摘要（actorEvidence.actionSummaryText）。
  # 与 relationLabels 的「TA 来自哪里」正交，两者合起来构成下钻列表的一行。
  actorActionSummaries:
    l10nKeyPrefix: intersection.actor_action
    byKind:
      followeeVisited: 来过这里
      followeeViewedObject: 看过
      followeeInObject: 在这里

  # 点级短标签：交集点在证据列表里的名词化标题。
  # 此前由 intersection_source.go 逐点硬编码（13 处 Label:），生产者不再产出文本后由此表驱动。
  kindLabels:
    l10nKeyPrefix: intersection.kind_label
    byKind:
      sharedFollowees: 共同关注的人
      commonFollower: 共同粉丝
      sharedCircle: 共同圈子
      coCommented: 共同讨论
      sameIndustry: 同行
      coSharedContent: 共同转发
      coLiked: 共同点赞
      sharedEntityAttention: 共同关注的对象
      coWishlistedEntity: 共同想去
      coVisitedEntity: 共同去过
      coExperiencedGathering: 共同经历
      followeeVisited: 关注的人来过
      followeeViewedObject: 你关注的人看过
      followeeInObject: 你关注的人在这里

kinds:
  # ---- A. 人与人：共同型事实 ----
  - kind: sharedFollowees
    vertical: general
    entry: A1
    level: sharedFact
    intersectionClass: fact
    dimensions: [relationship]
    objectKind: person
    countObjectKind: person
    valueTier: T1
    computability: R1
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "sharedFollowees:{objectId}"
    timeWindowDays: 30
    evidenceRank: 10
    sampleVisualsRequired: true
    iconKey: people
    propagationRole: none
    lifecycleApplicable: true

  - kind: commonFollower
    vertical: general
    entry: A2
    level: sharedFact
    intersectionClass: fact
    dimensions: [relationship]
    objectKind: person
    countObjectKind: person
    valueTier: T2
    computability: R1
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "commonFollower:{objectId}"
    timeWindowDays: 30
    evidenceRank: 10
    sampleVisualsRequired: true
    iconKey: people
    propagationRole: none
    lifecycleApplicable: true

  - kind: sameIndustry
    vertical: general
    entry: A5
    level: sharedFact
    intersectionClass: fact
    dimensions: [identity]
    # 可证事实只有「双方都声明了同一职业标签」，句式落在「你和<对方>都是<职业>」：
    # 宾语是对方本人（可导航），职业标签是分类树节点（不可导航，纯文本）。
    # 不写 enterprise —— 职业标签没有企业实例，写成企业会把行业相似说成组织归属。
    objectKind: person
    countObjectKind: person
    valueTier: T3
    computability: R3
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "sameIndustry:{objectId}"
    timeWindowDays: 30
    evidenceRank: 20
    sampleVisualsRequired: false
    iconKey: work
    propagationRole: none
    lifecycleApplicable: false

  # ---- B. 人与圈子 / 讨论：共同参与事实 ----
  - kind: sharedCircle
    vertical: general
    entry: B1
    level: sharedFact
    intersectionClass: fact
    dimensions: [relationship, interest]
    objectKind: circle
    countObjectKind: circle
    valueTier: T1
    computability: R1
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "sharedCircle:{objectId}"
    timeWindowDays: 30
    evidenceRank: 20
    sampleVisualsRequired: false
    iconKey: circle
    propagationRole: none
    lifecycleApplicable: true

  - kind: coCommented
    vertical: general
    entry: C1
    level: sharedFact
    intersectionClass: fact
    dimensions: [content]
    objectKind: person
    countObjectKind: content
    valueTier: T2
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "coCommented:{objectId}"
    moment: retrospective
    timeWindowDays: 7
    evidenceRank: 40
    sampleVisualsRequired: false
    iconKey: discussion
    propagationRole: none
    lifecycleApplicable: true

  - kind: coSharedContent
    vertical: general
    entry: C2
    level: sharedFact
    intersectionClass: fact
    dimensions: [content]
    objectKind: person
    countObjectKind: content
    valueTier: T3
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "coSharedContent:{objectId}"
    moment: retrospective
    timeWindowDays: 7
    evidenceRank: 40
    sampleVisualsRequired: false
    iconKey: share
    propagationRole: none
    lifecycleApplicable: true

  - kind: coLiked
    vertical: general
    entry: C4
    level: sharedFact
    intersectionClass: fact
    dimensions: [content]
    objectKind: person
    countObjectKind: content
    valueTier: T4
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "coLiked:{objectId}"
    moment: retrospective
    timeWindowDays: 7
    evidenceRank: 70
    sampleVisualsRequired: false
    iconKey: like
    propagationRole: none
    lifecycleApplicable: true
    note: §21.9 赞红线恢复（2026-06-18）；T4 最低权重、evidenceRank 最末；§21.7 禁请求期全量求交，云侧预投影/采样/上限就位后产出（本期端 Mock 原型先行）。

  # ---- D. 人与地点 / 对象：共同对象事实 ----
  - kind: coVisitedEntity
    vertical: general
    entry: D1
    level: sharedFact
    intersectionClass: fact
    dimensions: [location]
    objectKind: place
    countObjectKind: place
    valueTier: T2
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "coVisitedEntity:{objectId}"
    moment: retrospective
    timeWindowDays: 14
    evidenceRank: 30
    sampleVisualsRequired: false
    iconKey: place
    propagationRole: none
    lifecycleApplicable: true
    # 事实口径：双方都在 posts 上声明过到访同一地点（visitedAt + primaryHomepageId，
    # 只有行政区时地点同一性降级到区域级）。浏览语义归 sharedEntityAttention，
    # 意图语义归 coWishlistedEntity，三者不得互相替代。
    # 结论句只说「都去过」，不说「同期」：同期需要双方到访时间落在同一窗口才能断言。

  - kind: sharedEntityAttention
    vertical: general
    entry: D2
    level: sharedFact
    intersectionClass: fact
    dimensions: [interest, identity]
    objectKind: place
    countObjectKind: entity
    valueTier: T3
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "sharedEntityAttention:{objectId}"
    timeWindowDays: 14
    evidenceRank: 20
    sampleVisualsRequired: false
    iconKey: attention
    propagationRole: none
    lifecycleApplicable: true

  - kind: coWishlistedEntity
    vertical: general
    entry: D3
    level: sharedFact
    intersectionClass: fact
    dimensions: [location]
    objectKind: place
    countObjectKind: place
    valueTier: T4
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "coWishlistedEntity:{objectId}"
    moment: prospective
    timeWindowDays: 14
    evidenceRank: 20
    sampleVisualsRequired: false
    iconKey: place
    propagationRole: none
    lifecycleApplicable: true
    source: entity_wishlist_events

  - kind: sharedTagSample
    vertical: general
    entry: 共同兴趣
    level: sharedFact
    intersectionClass: fact
    dimensions: [interest]
    objectKind: circle
    countObjectKind: tag
    valueTier: T3
    computability: R3
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "sharedTagSample:{objectId}"
    timeWindowDays: 7
    evidenceRank: 60
    sampleVisualsRequired: false
    iconKey: interest
    propagationRole: none
    lifecycleApplicable: true

  # ---- F. 共同经历：交集飞轮的回流环（强度最高的事实交集） ----
  - kind: coExperiencedGathering
    vertical: general
    entry: F1
    level: sharedFact
    intersectionClass: fact
    dimensions: [relationship]
    objectKind: gathering
    countObjectKind: gathering
    valueTier: T1
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "coExperiencedGathering:{objectId}"
    moment: retrospective
    timeWindowDays: 30
    evidenceRank: 5
    sampleVisualsRequired: false
    iconKey: experience
    propagationRole: none
    lifecycleApplicable: true
    source: gathering_shared_experience_events
    # 事实口径（诚实红线延伸到经历）：双方在同一 Gathering 均持有 active Participation，
    # 且各自主动发布了关联该 Gathering（content.post.gatheringRef）的公开内容后才产出。
    # 时间到达、聊天频率、位置或单方声明均不得触发；「成形」与「经历」两级不得互相冒充。
    # evidenceRank=5 高于一切既有 kind：一起完成过一次行动是最强的可证共同点。
    # timeWindowDays 对齐 policy relationship 维度 TTL（30 天，指推荐保鲜/冷却窗口，
    # 不是经历资产的保存期——经历内容与聚合区长期存在于 Content/Circle owner）。

  # ---- E. 桥接型交集（第三方桥接） ----
  - kind: followeeInObject
    vertical: general
    entry: E1
    level: bridgeFact
    intersectionClass: fact
    dimensions: [relationship]
    objectKind: person
    countObjectKind: person
    valueTier: T1
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "followeeInObject:{objectId}"
    timeWindowDays: 30
    evidenceRank: 10
    sampleVisualsRequired: true
    iconKey: followHere
    propagationRole: bridge
    lifecycleApplicable: true

  - kind: followeeVisited
    vertical: general
    entry: E2
    level: bridgeFact
    intersectionClass: fact
    dimensions: [relationship, location]
    objectKind: person
    countObjectKind: person
    valueTier: T1
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "followeeVisited:{objectId}"
    moment: retrospective
    timeWindowDays: 14
    evidenceRank: 10
    sampleVisualsRequired: true
    iconKey: placeHere
    propagationRole: bridge
    lifecycleApplicable: true
    # 事实口径：关注的人在 posts 上声明过到访本对象（visitedAt + 地点绑定）。
    # 「来过」只能由声明到访支撑；只看过对象页的走 followeeViewedObject（「也看过」）。

  - kind: followeeViewedObject
    vertical: general
    entry: E2
    level: bridgeFact
    intersectionClass: fact
    dimensions: [relationship, interest]
    objectKind: person
    countObjectKind: person
    valueTier: T2
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "followeeViewedObject:{objectId}"
    moment: retrospective
    timeWindowDays: 14
    evidenceRank: 10
    sampleVisualsRequired: true
    iconKey: viewing
    propagationRole: bridge
    lifecycleApplicable: true
    source: rm_behavior_events{action:entity_page_view}

  - kind: followeeViewing
    vertical: general
    entry: E2
    level: bridgeFact
    intersectionClass: fact
    dimensions: [relationship, content]
    objectKind: person
    countObjectKind: person
    valueTier: T2
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "followeeViewing:{objectId}"
    timeWindowDays: 7
    evidenceRank: 10
    sampleVisualsRequired: true
    iconKey: viewing
    propagationRole: bridge
    lifecycleApplicable: true

  - kind: followeeDiscussedThis
    vertical: general
    entry: E4
    level: bridgeFact
    intersectionClass: fact
    dimensions: [relationship, content]
    objectKind: person
    countObjectKind: person
    valueTier: T2
    computability: R2
    confidenceThreshold: 0.0
    privacyScope: public
    dedupeKey: "followeeDiscussedThis:{objectId}"
    moment: retrospective
    timeWindowDays: 7
    evidenceRank: 10
    sampleVisualsRequired: true
    iconKey: discussion
    propagationRole: bridge
    lifecycleApplicable: true
