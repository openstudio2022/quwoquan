kind: projection
description: 内容、主页、圈子与标签事件构建的推荐候选索引视图，唯一拥有发现候选、premium pool 与实体标签索引。
identity:
  fields: [scenario, contentId]
  version_source: checkpoint
access:
  commands: none
  queries: named_reader
  cross_context: public_contract_only
relationships:
- {name: content, target_object: content.Post, reference_fields: [contentId], kind: projection_source, cardinality: 'N:1', consistency: eventual, access: event, on_delete: tombstone}
- {name: author, target_object: user.Persona, reference_fields: [authorId], kind: projection_source, cardinality: 'N:1', consistency: eventual, access: event, on_delete: detach}
- {name: primary_homepage, target_object: entity.Homepage, reference_fields: [primaryHomepageId], kind: projection_source, cardinality: 'N:1', consistency: eventual, access: event, on_delete: detach}
- {name: tags, target_object: tag.TagNodeView, reference_fields: [entityTagIds], kind: projection_source, cardinality: 'N:N', consistency: eventual, access: event, on_delete: detach}
business_rules:
- 候选只由上游 typed 事件构建，不跨库读取 Content、Entity、Circle 或 Tag 私有集合。
- scenario 与 contentId 唯一定位 Post 候选；Gathering 子投影以 gatheringId 作为 sourceKey、aggregateVersion 作为 sourceVersion，任一旧事件都不得覆盖较新状态或复活 tombstone。
- UserSuspended/UserRestored 以 accountVersion 单调维护本地作者限制投影；限制状态必须在候选查询 limit 前过滤，账号关闭后候选与可逆限制原值均不可保留。
- following 场景只能消费 PersonaFollowStateChanged/PersonaBlocked/PersonaUnblocked 维护的本地关系投影筛选 authorId；不得跨库读取 User 私有关系表，拉黑后不得恢复历史关注。
- premium pool 和实体标签是同一候选身份的具名索引，不得形成第二候选真相源。
- 对象卡只能从 Post lifecycle 携带的 canonical Homepage 公开快照或 Circle 签发的裁剪 GatheringPublicCard 选择；不得回查上游私有集合或复制 Participation、申请答案与精确私密地点。
lifecycle:
  source_events:
  - content.post.PostPublished
  - content.post.PostUpdated
  - content.post.PostSettingsUpdated
  - content.post.PostPromotedToWork
  - content.post.PostDeleted
  - content.post.PostPrivacyRedacted
  - content.post.PostPurged
  - ops.premium_pool_entry.PremiumPoolEntryUpserted
  - ops.premium_pool_entry.PremiumPoolEntryRolledBack
  - ops.premium_pool_entry.PremiumPoolEntryTakedownEjected
  - user.persona_relationship.PersonaFollowStateChanged
  - user.persona_relationship.PersonaBlocked
  - user.persona_relationship.PersonaUnblocked
  - user.user_account.UserSuspended
  - user.user_account.UserRestored
  - circle.gathering.GatheringPublished
  - circle.gathering.GatheringRevisionAppended
  - circle.gathering.GatheringParticipationChanged
  - circle.gathering.GatheringAdmissionControlChanged
  - circle.gathering.GatheringCancelled
  - circle.gathering.GatheringCompleted
  checkpoint: per_source_partition_sequence
  rebuild: recreate_candidate_indexes_then_replay_all_source_events
  tombstone: remove_candidate_and_auxiliary_indexes_keep_checkpoint
  event_consumers:
  - name: ProjectRecommendationCandidatePostLifecycle
    kind: projector
    facet: PostLifecycleConsumer
    method: processOnce
    idempotency: aggregate_version
  - name: ProjectRecommendationPremiumPool
    kind: projector
    facet: PremiumPoolConsumer
    method: processOnce
    idempotency: aggregate_version
  - name: ProjectRecommendationPersonaRelationship
    kind: projector
    facet: PersonaRelationshipConsumer
    method: processOnce
    idempotency: aggregate_version
  - name: ProjectRecommendationAccountRestriction
    kind: projector
    facet: UserAccountRestrictionConsumer
    method: processOnce
    idempotency: aggregate_version
  - name: ProjectRecommendationCandidateGatheringLifecycle
    kind: projector
    facet: GatheringLifecycleConsumer
    method: processOnce
    idempotency: aggregate_version
