description: 推荐候选与附属索引的统一投影视图。
fields:
- {name: sourcePartition, type: string, constraints: [PK, NOT_NULL], role: projection, description: 普通来源固定ordinary，Data为releaseBinding canonical SHA256；不是新业务ID，不是调用方可选值。}
- {name: releaseSource, type: ReleaseCandidateObjectIdentity, constraints: [NULLABLE], role: projection, description: Data必填完整tuple与source版本，非Data必须null；不得按ID前缀或缺字段猜ordinary。}
- {name: releaseBinding, type: ReleaseQueryPreparationBinding, constraints: [NULLABLE], role: projection, description: Data recommendation分区，slice必须recommendation；revision不进入此身份。}
- {name: scenario, source: scenario, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: contentId, source: contentId, type: string, constraints: [PK, NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: none, ops_exposure: read, role: projection, reference: true}
- {name: contentType, source: contentType, type: enum, enum_ref: ContentType, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: authorId, source: authorId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: none, ops_exposure: read, role: projection, reference: true}
- {name: tagRefs, source: tagRefs, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: none, ops_exposure: read, role: projection, tag_ref: true}
- {name: entityRefs, source: entityRefs, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: none, ops_exposure: read, role: projection}
- {name: primaryHomepageId, source: primaryHomepageId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: none, ops_exposure: read, role: projection, reference: true}
- {name: primaryHomepageSnapshot, source: primaryHomepageSnapshot, type: RecommendationObjectCardCandidate, constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: projection}
- {name: publishedAt, source: publishedAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: projection}
- {name: viewCount, source: viewCount, type: int64, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: likeCount, source: likeCount, type: int64, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: commentCount, source: commentCount, type: int64, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: shareCount, source: shareCount, type: int64, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: qualityScore, source: qualityScore, type: decimal, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: contentVertical, source: contentVertical, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: supplySource, source: supplySource, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: intersectionFeatures, source: intersectionFeatures, type: object, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: projection}
- {name: premiumEligible, source: premiumEligible, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: premiumExpiresAt, source: premiumExpiresAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: projection}
- {name: premiumAdmissionUpdatedAt, source: premiumAdmissionUpdatedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: projection}
- {name: entityTagIds, source: entityTagIds, type: '[]string', constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read, role: projection, reference: true}
- {name: sourceSequence, source: sourceSequence, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: projection}
- {name: updatedAt, source: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: projection}
types:
  CandidateContentFenceReceipt:
    description: 本owner独立Content fence消费依据，无正文/第二active；同事件或revision不同摘要冲突，迟到必须Content确切提交可证，不从当前revision猜superseded。永久保留最小摘要以支持ACK失败重放，不授予安全资格或activation。
    fields:
      - {name: eventDigest, type: string, format: canonical_sha256, constraints: [PK, NOT_NULL]}
      - {name: scopeDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: revision, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: payloadDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: proofEvidenceDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: outcome, type: enum, values: [reconciled, superseded], constraints: [NOT_NULL]}
      - {name: consumedAt, type: timestamp, constraints: [NOT_NULL]}
  RecommendationReleaseSourceCheckpoint:
    description: 原投影checkpoint的release准备分支，不是新准备流程或ready registry。完整snapshot保存规范化源依据供重验，缺写项不推进checkpoint；id为binding摘要。
    fields:
    - {name: checkpointId, type: string, format: canonical_sha256, constraints: [PK, NOT_NULL]}
    - {name: binding, type: ReleaseQueryPreparationBinding, constraints: [NOT_NULL]}
    - {name: publicationId, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
    - {name: snapshot, type: ReleasePostCandidateSnapshot, constraints: [NOT_NULL]}
    - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL]}
    - {name: sourceEventDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  RecommendationReleasePremiumProjection:
    description: ProductOps签发准入的单轨派生索引，不合成审批。唯一key为source完整tuple+objectId，source版本/摘要与Post候选必须一致；归同CandidateIndexView。
    fields:
    - {name: admission, type: ReleasePremiumAdmission, constraints: [NOT_NULL]}
    - {name: sourceEventId, type: string, constraints: [NOT_NULL]}
    - {name: sourceEventDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  RecommendationObjectCardCandidate:
    description: 从 Post lifecycle 冻结的可路由 Homepage 公开候选快照；Recommendation 只选择，不回查 Entity 私有存储。
    fields:
    - {name: homepageId, source: homepageId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: canonicalEntityId, source: canonicalEntityId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: title, source: title, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: subtitle, source: subtitle, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: coverUrl, source: coverUrl, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
    - {name: tagRefs, source: tagRefs, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
  RecommendationGatheringCandidateProjection:
    description: Circle GatheringPublicCard 的发现最小裁剪；sourceKey 始终为 gatheringId，不含参与、申请答案或精确私密地点。
    fields:
    - {name: objectKind, source: objectKind, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: sourceKey, source: sourceKey, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read, reference: true}
    - {name: sourceVersion, source: sourceVersion, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, semantic_type: aggregate_version}
    - {name: cardDigest, source: cardDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: hostSubjectKind, source: hostSubjectKind, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: hostSubjectId, source: hostSubjectId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read, reference: true}
    - {name: title, source: title, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: summary, source: summary, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: coverRef, source: coverRef, type: object, constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
    - {name: tagRefs, source: tagRefs, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: startAt, source: startAt, type: timestamp, constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read, semantic_type: instant}
    - {name: endAt, source: endAt, type: timestamp, constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read, semantic_type: instant}
    - {name: dateLabel, source: dateLabel, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: placeMode, source: placeMode, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: coarsePlaceRef, source: coarsePlaceRef, type: object, constraints: [NULLABLE], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
    - {name: coarsePlaceLabel, source: coarsePlaceLabel, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: lifecycleStatus, source: lifecycleStatus, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: updatedAt, source: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read, semantic_type: instant}
