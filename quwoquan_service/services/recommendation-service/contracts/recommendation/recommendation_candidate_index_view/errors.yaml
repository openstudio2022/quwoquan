description: 候选索引投影 stream consumer 的对象级错误语义（无 HTTP 面）。
errors:
- code: RECOMMENDATION.SYSTEM.candidate_index_source_event_invalid
  reason: candidate_index_source_event_invalid
  emitted_by:
  - {surface: consumer}
  recovery_action: absorb
  disruption_level: silent
  description: >-
    上游 lifecycle 事件解码或身份校验失败。重试穷尽后进入对象 DLQ
    （events.content.post_lifecycle 等源 stream 的 recommendation-candidate DLQ），
    不阻塞后续消息。
  user_message: {zh: 推荐候选事件无效, en: Invalid recommendation candidate source event}
- code: RECOMMENDATION.SYSTEM.candidate_index_projection_unavailable
  reason: candidate_index_projection_unavailable
  emitted_by:
  - {surface: consumer}
  recovery_action: retry
  recovery_after_seconds: 5
  disruption_level: silent
  description: >-
    候选投影 Mongo 写入暂时不可用；consumer 按有界重试推进，超过阈值进入 DLQ。
  user_message: {zh: 推荐候选投影暂时不可用, en: Recommendation candidate projection is temporarily unavailable}
