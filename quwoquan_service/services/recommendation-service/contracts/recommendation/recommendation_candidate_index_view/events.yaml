description: 消费行为说明（canonical authored edge仅在object.yaml.lifecycle.source_events）。ContentReleaseFenceChanged消费Content源专属before/after，仅只读对账已准备候选，保留previous与premium事实，迟到需inbox或exact Content提交receipt才可superseded，缺失阻断。真实Post对象事件的显式来源与唯一sourceVersion由Content payload约束，普通来源全null，Data完整tuple，releaseDigest只审计。删除/隐私/清除/撤权覆盖该canonical对象全部保留候选及特征，旧proof失效且不可复活；不把release退出当删除，不静默改集合。既有行为如下：[{"source_event":"PostPublished","source_service":"content-service","topic":"events.content.post_lifecycle","behavior":"以
  aggregateVersion 为单调 sourceSequence，事务内写候选、实体标签索引与 eventId inbox。"},{"source_event":"PostUpdated","source_service":"content-service","topic":"events.content.post_lifecycle","behavior":"仅更新
  Post 生命周期字段，保留 Recommendation 自有计数、质量、premium 与特征状态。"},{"source_event":"PostSettingsUpdated","source_service":"content-service","topic":"events.content.post_lifecycle","behavior":"public/published/approved
  时重建候选，否则按同一 sequence 移除候选并写 tombstone。"},{"source_event":"PostDeleted","source_service":"content-service","topic":"events.content.post_lifecycle","behavior":"事务内删除候选、premium
  与实体标签索引，保留单调 tombstone 与 inbox。"},{"source_event":"PostPrivacyRedacted","source_service":"content-service","topic":"events.content.post_lifecycle","behavior":"与删除相同地清除所有可识别候选字段，不允许旧事件复活。"},{"source_event":"PostPurged","source_service":"content-service","topic":"events.content.post_lifecycle","behavior":"确认最终清除候选与辅助索引，保留不可逆
  sourceSequence 水位。"},{"source_event":"PremiumPoolEntryUpserted","source_service":"product-ops-service","topic":"events.ops.premium_pool_entry","behavior":"以
  eventId inbox 与 updatedAt 水位幂等更新 Recommendation 自有 premium 投影；只有 active、approved、未过期条目可标记候选 eligible。"},{"source_event":"PremiumPoolEntryRolledBack","source_service":"product-ops-service","topic":"events.ops.premium_pool_entry","behavior":"原子撤销
  premium eligibility 并保留运营审计投影，不修改 Content 生命周期字段。"},{"source_event":"PremiumPoolEntryTakedownEjected","source_service":"product-ops-service","topic":"events.ops.premium_pool_entry","behavior":"原子写入不可用状态并清除候选
  premium eligibility；重复或旧 updatedAt 事件不得恢复资格。"}]
