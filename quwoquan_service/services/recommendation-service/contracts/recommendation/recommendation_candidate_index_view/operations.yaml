description: RecommendationCandidateIndexView 仅通过对象 Reader 供排序管线读取。
api_routes: []
# 入口绑定 object.yaml lifecycle.event_consumers 的主 handler（PostLifecycleConsumer）；
# 五个上游流消费者在实现侧共用指标 recommendation_candidate_index_projection，
# consumer 标签定位具体消费者（object/kind/phase 唯一约束下只声明一条入口）。
runtime_entrypoints:
- name: ProjectRecommendationCandidatePostLifecycle
  kind: projector
  phase: event_projection
  application:
    kind: command
    facet: PostLifecycleConsumer
    method: processOnce
    object_owner: RecommendationCandidateIndexView
  telemetry:
    metric: recommendation_candidate_index_projection
    trace: true
    attributes: [consumer, outcome]
  slo:
    freshness_p95_seconds: 60
    backlog_max_events: 1000
    failure_ratio_percent: 1
consumers:
- {name: recommendation-ranking, capabilities: [list_candidates, list_premium_candidates, list_entity_tag_candidates]}
readiness_cases:
- case_id: project-candidate-index-local
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/spec.md#sit-001
  producer: service
  layer: local_contract
  target: {kind: object, id: recommendation.recommendation_candidate_index_view}
  runner_source_path: quwoquan_service/services/recommendation-service/tests/local_contract/recommendation/recommendation_candidate_index_view/test_post_lifecycle_consumer__durability__local_contract_test.py
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: project-candidate-index-api
  spec_ref: specs/feature-tree/discovery-content/feed-orchestration-recommendation/spec.md#sit-001
  producer: service
  layer: api_integration
  target: {kind: object, id: recommendation.recommendation_candidate_index_view}
  runner_source_path: quwoquan_service/services/recommendation-service/tests/api_integration/recommendation/recommendation_candidate_index_view/test_mongo_candidate_projection__api_integration_test.py
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
- case_id: project-candidate-gathering-local
