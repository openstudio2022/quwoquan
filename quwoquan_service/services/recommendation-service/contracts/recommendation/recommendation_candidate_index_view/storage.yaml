backend: mongodb
role: projection
transaction:
  scope: [rm_release_discovery_candidates, recommendation_release_source_checkpoints, recommendation_candidate_source_inbox, rm_release_premium_candidates, recommendation_candidate_projection_checkpoints]
  isolation: mongo_transaction
  mechanism: version_cas
  guarantees: [checkpoint_version_cas]
description: >-
  Data候选只写独立release分区，普通投影保持原路径，无双读fallback。data候选、完整source checkpoint与原source inbox同Mongo事务提交；
  proof由真实named reader临时派生不持久化。索引缺失或旧Data共享键未完成受管迁移即not-ready，不能把旧Data行当ordinary放行。
  原Post lifecycle迟到事件只对账目标tuple，旧candidate/准入/checkpoint保留至回滚窗口与活跃引用结束，不使用TTL清理恢复依据。
collections:
  recommendation_candidate_content_fence_receipts:
    entity: CandidateContentFenceReceipt
    role: append_only
    description: 本owner专属fence去重与revision凭据，不复用Post/premium inbox、不保存payload，无TTL；对账只读原candidate与proof，迟到核实Content exact receipt，失败不写成功、不ACK；唯一索引原子拒绝同revision异事实。
    indexes:
      - {name: uq_rec_candidate_fence_event, keys: {eventDigest: 1}, unique: true}
      - {name: uq_rec_candidate_fence_revision, keys: {scopeDigest: 1, revision: 1}, unique: true}
  rm_release_discovery_candidates:
    entity: RecommendationCandidateIndexView
    role: projection
    indexes:
    - {name: uq_rec_release_candidate, keys: {releaseBinding.release.environment: 1, releaseBinding.release.sourceOwner: 1, releaseBinding.release.releaseId: 1, releaseBinding.release.manifestDigest: 1, releaseBinding.providerBindingGeneration: 1, releaseBinding.schemaGeneration: 1, scenario: 1, contentId: 1}, unique: true}
  recommendation_release_source_checkpoints:
    entity: RecommendationReleaseSourceCheckpoint
    role: checkpoint
    indexes:
    - {name: uq_rec_release_checkpoint, keys: {checkpointId: 1}, unique: true}
  rm_release_premium_candidates:
    entity: RecommendationReleasePremiumProjection
    role: projection
    indexes:
    - {name: uq_rec_release_premium, keys: {admission.source.release.environment: 1, admission.source.release.sourceOwner: 1, admission.source.release.releaseId: 1, admission.source.release.manifestDigest: 1, admission.source.objectId: 1}, unique: true}
  rm_discovery_feed:
    entity: RecommendationCandidateIndexView
    role: projection
    writers: [content-service]
    description: recommendation-service 是唯一存储 owner；content-service 仅作为 specs/feature-tree/discovery-content/feed-orchestration-recommendation/spec.md#open-001 关闭前的受控过渡 projector writer，OPEN-001 关闭时必须同步移除本 writer 声明。
  rm_gathering_candidates:
    entity: RecommendationGatheringCandidateProjection
    role: projection
    description: Circle 签发 PublicCard 的最小发现索引；以 gatheringId 为 sourceKey，和 Post/Entity 对象卡共用 ranked candidate reader。
    indexes:
    - name: uq_recommendation_gathering_candidate_source
      keys: {sourceKey: 1}
      unique: true
    - name: idx_recommendation_gathering_candidate_rank_scan
      keys: {updatedAt: -1, sourceKey: 1}
  rm_premium_pool: {entity: RecommendationPremiumCandidateProjection, role: projection}
  rm_entity_tags: {entity: RecommendationEntityTagProjection, role: projection}
  recommendation_candidate_tombstones:
    entity: RecommendationCandidateTombstone
    role: projection_checkpoint
    indexes:
    - name: idx_recommendation_candidate_tombstone_sequence
      keys: {sourceSequence: 1}
  recommendation_candidate_projection_checkpoints: {entity: RecommendationCandidateProjectionCheckpoint, role: checkpoint}
  recommendation_candidate_source_inbox:
    entity: RecommendationCandidateSourceInbox
    role: inbox
    indexes:
    - name: uq_recommendation_candidate_source_event
      keys: {_id: 1}
      unique: true
  recommendation_candidate_source_failures:
    entity: RecommendationCandidateSourceFailure
    role: append_only
    indexes:
    - name: idx_recommendation_candidate_source_failure_updated
      keys: {updatedAt: 1}
  recommendation_candidate_account_restrictions:
    entity: RecommendationCandidateAccountRestriction
    role: projection
    description: UserSuspended/UserRestored 的可逆作者限制投影；只在账号未关闭期间保留 subjectIds，关闭时由 RecommendationSubjectClosureFact consumer 物理删除。
    indexes:
    - name: uq_recommendation_candidate_account_restriction
      keys: {_id: 1}
      unique: true
    - name: idx_recommendation_candidate_restricted_subject
      keys: {subjectIds: 1, restricted: 1}
  recommendation_candidate_account_restriction_inbox:
    entity: RecommendationCandidateAccountRestrictionInbox
    role: inbox
    description: UserSuspended/UserRestored 的 eventId+digest 幂等回执；不复制主体 payload。
    indexes:
    - name: uq_recommendation_candidate_account_restriction_event
      keys: {_id: 1}
      unique: true
  recommendation_candidate_persona_relationships:
    entity: RecommendationCandidatePersonaRelationshipProjection
    role: projection
    description: PersonaFollowStateChanged/PersonaBlocked/PersonaUnblocked 的对象本地有序投影，仅用于 following 候选资格与双向拉黑排除。
    indexes:
    - name: uq_recommendation_candidate_persona_relationship_direction
      keys: {sourcePersonaId: 1, targetPersonaId: 1}
      unique: true
    - name: idx_recommendation_candidate_following_subject
      keys: {sourcePersonaId: 1, following: 1, blocked: 1, targetPersonaId: 1}
  recommendation_candidate_persona_relationship_inbox:
    entity: RecommendationCandidatePersonaRelationshipInbox
    role: inbox
    description: Persona relationship stream 的 eventId 幂等回执；不复制 User 私有聚合。
    indexes:
    - name: uq_recommendation_candidate_persona_relationship_event
      keys: {_id: 1}
      unique: true
streams:
  events.circle.gathering.recommendation_candidate.dlq:
    entity: RecommendationCandidateIndexView
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Gathering lifecycle 发现投影达到重试上限后的脱敏终止记录。
  events.user.persona_relationship.recommendation-candidate.dlq:
    entity: RecommendationCandidateIndexView
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Persona relationship 投影消费达到重试上限后的脱敏终止记录。
  events.content.post_lifecycle.recommendation_candidate.dlq:
    entity: RecommendationCandidateIndexView
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: Post lifecycle 候选投影消费达到重试上限后的脱敏终止记录。
  events.ops.premium_pool_entry.recommendation_candidate.dlq:
    entity: RecommendationCandidateIndexView
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: PremiumPoolEntry 候选投影消费达到重试上限后的脱敏终止记录。
  events.user.account.recommendation-candidate-restriction.dlq:
    entity: RecommendationCandidateIndexView
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: 账号限制候选投影消费达到重试上限后的脱敏终止记录。
