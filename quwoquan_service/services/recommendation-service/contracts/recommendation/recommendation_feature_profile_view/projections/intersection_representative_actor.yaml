read_model: IntersectionRepresentativeActor
description: '交集/影响力人数句的代表人锚点（统一交互子契约）。

  所有包含人数的 primaryText 必须由云侧从同一证据快照中选出一个代表人：

  代表人是用户最可能点击、最能解释这条连接的证据样本。

  当同一人数句存在多种来源时，代表人按关系密切度择优，不代表所有计数对象来自同一来源：

  联系人/共同联系人 > 你关注的人/共同关注的人 > 同圈圈友 > 你曾互动过其内容的用户。

  人数 N 的解释归属于 IntersectionReason / IntersectionPoint 的同一快照，点击后列表必须逐人说明来源与动作。


  隐私红线：

  - 不可见 actor、被拉黑、未授权通讯录联系人不得下发真实姓名或头像。

  - 可降级为匿名但可证的锚点，如「一位校友」「一位联系人」。

  - 端侧只读渲染，不得本地猜测代表人或重排代表人。

  '
consumers:
- app
- recommendation-service
- content-service
fields:
- name: actorId
  type: string
- name: displayName
  type: string
- name: avatarUrl
  type: string
- name: relationLabel
  type: string
- name: privacyState
  type: string
- name: target
  type: IntersectionTarget
  nullable: true
- name: evidenceRank
  type: int
- name: snapshotVersion
  type: string
