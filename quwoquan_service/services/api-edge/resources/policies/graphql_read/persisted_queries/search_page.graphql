query SearchPage($input: SearchPageInput!) {
  searchPage(input: $input) {
    items {
      objectRef
      resultType
      contentType
      title
      subtitle
      snippet
      thumbnailUrl
      action
      rankPosition
      rankReason
    }
    facets {
      key
      count
    }
    suggestions
    matchedTerms
    degradeSignals {
      code
      message
      objectType
    }
    searchRequestId
    nextCursor
  }
}
