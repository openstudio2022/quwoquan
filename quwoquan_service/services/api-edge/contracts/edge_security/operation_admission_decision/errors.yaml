description: >-
  统一入口默认拒绝边界的 canonical HTTP 错误。gateway surface 对全部 generated operation
  生效，因此这些码不绑定单个 operation：它们由 runtime/auth 的 generated operation guard
  与 runtime/streaming 的流式传输判定在 owner handler 之前产出。
errors:
- code: GATEWAY.USER.route_not_found
  reason: route_not_found
  http_status: 404
  emitted_by:
  - {surface: gateway}
  recovery_action: surface
  disruption_level: inlineCard
  go_const: ErrRouteNotFound
  description: 请求的 method+path 没有匹配到任何已登记的 generated operation descriptor，默认拒绝。
  user_message:
    zh: 接口不存在或已下线
    en: This endpoint does not exist or has been retired
- code: GATEWAY.USER.unauthorized
  reason: unauthorized
  http_status: 401
  emitted_by:
  - {surface: gateway}
  recovery_action: surface
  disruption_level: inlineCard
  go_const: ErrUnauthorized
  description: operation 契约要求可信 principal，但请求没有携带可验证凭据。
  user_message:
    zh: 请先登录后再继续
    en: Please sign in to continue
- code: GATEWAY.USER.forbidden
  reason: forbidden
  http_status: 403
  emitted_by:
  - {surface: gateway}
  recovery_action: surface
  disruption_level: inlineCard
  go_const: ErrForbidden
  description: operation 拒绝全部调用方，或当前 principal 的 actor/scope/permission 不满足授权判定。
  user_message:
    zh: 当前账号没有该操作权限
    en: This account is not allowed to perform this action
- code: GATEWAY.USER.invalid_argument
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - {surface: gateway}
  recovery_action: surface
  disruption_level: inlineCard
  go_const: ErrInvalidArgument
  description: operation 契约要求的 Idempotency-Key 或 If-Match 前置条件缺失、格式非法或不被该 operation 允许。
  user_message:
    zh: 请求参数不完整，请重试
    en: The request is incomplete, please retry
- code: GATEWAY.MIDDLEWARE.unavailable
  reason: unavailable
  http_status: 503
  emitted_by:
  - {surface: gateway}
  recovery_action: retry
  recovery_after_seconds: 5
  disruption_level: snackbar
  go_const: ErrStreamTransportUnavailable
  description: 流式 operation 所需的传输能力在当前连接上不具备，无法建立实时流。
  user_message:
    zh: 当前连接不支持实时流，请稍后重试
    en: Realtime streaming is unavailable on this connection, please retry
