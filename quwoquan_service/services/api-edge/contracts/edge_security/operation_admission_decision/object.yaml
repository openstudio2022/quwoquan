kind: external_reference
description: >-
  统一入口对每个 generated operation 请求作出的准入判定：路由是否已登记、调用方是否具备
  可信 principal 与授权、请求前置条件头是否满足 operation 契约，以及流式 operation 所需的
  传输能力是否具备。判定输入全部来自 generated ContractGraph operation descriptor，运行时
  不持有第二份路由或授权表，因此本对象没有可写状态，只有由契约派生的判定事实与拒绝语义。
identity:
  fields: [canonicalOperationId]
  version_source: external
access:
  commands: none
  queries: external_port
  cross_context: public_contract_only
relationships: []
taggable: false
vector_enabled: false
business_rules:
- 判定只能读取 generated operation descriptor；运行时不得维护第二份路由、授权或前置条件表。
- 未匹配到 descriptor 的请求一律 fail-closed，不得回落到 owner handler。
- 拒绝原因必须区分未登记路由、缺可信 principal、授权不满足与请求前置条件不合法，不得合并成同一个通用拒绝码。
lifecycle:
  refresh_semantics: replace_only_with_regenerated_contract_graph_descriptors
  tombstone: retain_last_generated_descriptor_table_until_replaced
external_authority:
  owner: generated_contract_graph
  identity_contract: canonical_operation_id_and_contract_graph_sha256
