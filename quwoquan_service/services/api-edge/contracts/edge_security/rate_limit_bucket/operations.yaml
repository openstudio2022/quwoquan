description: >-
  RateLimitBucket 仅由每个 generated business operation 的 api-edge
  RateLimitAdmissionFacade 内部消费；真实入口是授权之后、owner proxy 之前的 admission
  middleware，不公开第二条 admission API，也不复制 ContractGraph operation 表。
api_routes: []
runtime_entrypoints:
- name: SharedAdmission
  kind: middleware
  phase: post_authorization_pre_owner_proxy
  application:
    kind: session
    facet: RateLimitAdmissionFacade
    method: admit
    object_owner: RateLimitBucket
readiness_cases:
- case_id: shared-admission-local
  spec_ref: specs/feature-tree/gateway-orchestrator-foundation/unified-entry-security/rate-limit-protection/spec.md#gwt-001
  producer: service
  layer: local_contract
  target:
    kind: operation
    id: SharedAdmission
  runner_source_path: quwoquan_service/services/api-edge/tests/local_contract/edge_security/rate_limit_bucket/rate_limit_bucket__local_contract_test.go
  executions:
  - env: alpha
    platform: service
    device: runner
    provider: none
    digest_binding: candidate
- case_id: shared-admission-api
  spec_ref: specs/feature-tree/gateway-orchestrator-foundation/unified-entry-security/spec.md#sit-001
  producer: service
  layer: api_integration
  target:
    kind: operation
    id: SharedAdmission
  runner_source_path: quwoquan_service/services/api-edge/tests/api_integration/edge_security/rate_limit_bucket/shared_admission__api_integration_test.go
  executions:
  - env: beta
    platform: service
    device: runner
    provider: redis
    digest_binding: candidate
