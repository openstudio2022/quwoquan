kind: runtime_session
description: >-
  统一业务 HTTP 入口按 environment、可信 subject 与 generated ContractGraph operation
  形成的 TTL admission session；所有 api-edge 副本与 prod stable/gray stage 共享同一
  Redis 原子状态。它只在请求进入时由 RateLimitAdmissionFacade 消费，不是可独立管理的
  业务聚合，也不公开第二条 admission HTTP API。
identity:
  fields: [bucketKeyDigest]
  version_source: session
access:
  commands: session_facade
  queries: named_reader
  cross_context: public_contract_only
relationships: []
local_identity_reasons:
  canonicalOperationId: generated ContractGraph operation ID 是授权与限流共同使用的协议标识，不是业务对象外键
search_policy:
  exposed: none
  not_exposed_reason: "易失运行时状态，过期即消失，没有可供检索的稳定对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "认证凭据、会话密钥与风控状态对小趣完全关闭，不存在可开放的子集。"
business_rules:
- bucketKeyDigest 只能由 environment、可信 subject 与 canonical operationId 派生，客户端不得指定。
- admission 必须使用 Redis 原子计数与过期，任何副本不得持有第二份本地限流真相。
- 请求结束、取消或重试不得延长 bucket 的固定过期边界。
lifecycle:
  ttl_seconds: 60
  expiry_semantics: fixed_window_delete
  renewal: forbidden
