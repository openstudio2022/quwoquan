apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-edge
  labels:
    app.kubernetes.io/name: api-edge
  annotations:
    quwoquan.io/config-version: package-required
    quwoquan.io/image-version: package-required
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-edge
      annotations:
        quwoquan.io/config-version: package-required
        quwoquan.io/image-version: package-required
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: api-edge
        image: quwoquan/api-edge:package-required
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 18079
        env:
        - name: SERVICE_NAME
          value: api-edge
        - name: APP_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['quwoquan.io/environment']
        - name: SERVICE_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONFIG_ROOT
          value: /etc/qwq/config
        - name: CONFIG_VERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['quwoquan.io/config-version']
        - name: IMAGE_VERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['quwoquan.io/image-version']
        envFrom:
        - secretRef:
            name: api-edge-runtime-secrets
        volumeMounts:
        - name: runtime-config
          mountPath: /etc/qwq/config
          readOnly: true
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 10
          periodSeconds: 15
        startupProbe:
          httpGet: {path: /healthz, port: http}
          failureThreshold: 30
          periodSeconds: 2
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
      volumes:
      - name: runtime-config
        configMap:
          name: api-edge-runtime-config
