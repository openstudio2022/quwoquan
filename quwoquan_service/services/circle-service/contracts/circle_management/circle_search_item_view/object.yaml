kind: projection
description: Circle 主档与关联 Homepage 事件构建的可重建搜索条目，供 search-service 只读消费 canonical 字段。
identity:
  fields:
  - circleId
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: circleEvents
  on_delete: tombstone
  reference_fields:
  - circleId
  target_object: circle.Circle
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: homepage
  on_delete: tombstone
  reference_fields:
  - linkedHomepageId
  target_object: entity.Homepage
local_identity_reasons:
  categoryId: stable catalog or release key; resolved through its typed catalog reader and never used
    as an aggregate Store identity
  domainId: stable catalog or release key; resolved through its typed catalog reader and never used as
    an aggregate Store identity
search_policy:
  exposed: remote_index
  eligibility_ref: quwoquan_service/services/circle-service/internal/circle_management/circle/application/circle_search_projection.go#CircleSearchEligible
  index_projector_ref: quwoquan_service/services/circle-service/internal/circle_management/circle/application/circle_search_projection.go#ProjectCircleToSearchDocument
  privacy_filter_ref: quwoquan_service/runtime/search/core.go#isPrivateVisibility
assistant_access:
  read:
    mode: public
    scopes:
    - assistant.circle.circle_search_item_view.read
  cite:
    mode: public_citation
    scopes:
    - assistant.circle.circle_search_item_view.cite
  write:
    mode: none
    scopes: []
business_rules:
- 搜索条目只投影 Circle 的公开字段和 canonical homepage 引用，不复制成员或私密治理状态。
- 同一 circleId 的版本必须单调应用，重复事件不得产生第二条搜索条目。
- Circle 或 Homepage tombstone 必须从可搜索集合移除对应条目。
lifecycle:
  source_events:
  - circle.circle.CircleCreated
  - circle.circle.CircleUpdated
  - circle.circle.CircleArchived
  checkpoint: circle_outbox_sequence
  rebuild: replay_circle_public_events
  tombstone: delete_search_item_keep_checkpoint
  idempotency: aggregate_version
  event_consumers:
  - name: ProjectCircleSearchItem
    kind: projector
    facet: CircleSearchItemViewProjector
    method: apply
    idempotency: aggregate_version
