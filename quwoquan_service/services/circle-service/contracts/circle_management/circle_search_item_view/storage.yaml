backend: elasticsearch
description: >-
  CircleSearchItemView 以稳定 circle.circle:circleId 作为 Elasticsearch _id，并由 sourceVersion
  external versioning 在 Elasticsearch shard 内原子裁决；严格更高版本才生效，同版本 replay
  与低版本均为 no-op。删除写入持久 soft tombstone，查询排除 deleted=true。Mongo collection
  只保存 typed outbox durable consumer checkpoint，失败不推进且不作为 Elasticsearch 写入顺序
  真相源；本对象不另建 watermark collection。
resources:
  circle_search_documents:
    engine: elasticsearch
    role: query_projection
    required: true
  projection_checkpoint:
    engine: mongodb
    role: query_projection
    required: true
role: projection
collections:
  circle_search_item_view_checkpoints:
    entity: CircleSearchItemView
    role: projection
    description: Circle typed outbox 的 durable consumer checkpoint；失败不推进，重放只覆盖同一稳定 document identity。
