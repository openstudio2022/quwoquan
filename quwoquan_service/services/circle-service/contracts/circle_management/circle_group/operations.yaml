contract_test:
  coverage_requirements:
    - aggregate invariants, parent cycle and optimistic version conflicts covered
    - actor and group membership BOLA negative cases covered
    - aggregate, command receipt and outbox commit in one real Mongo transaction
    - Reader never exposes aggregate storage identity or derived state as writable fields
  test_strategy:
    service_side:
      description: 使用 MongoDB 7 replica set testcontainers，不 mock Store/outbox/Reader
      real_engines:
        mongodb: testcontainers (mongo:7 replica set)
      data_management:
        seed: 仅插入目标 Circle 与 actor CircleMembership policy；CircleGroup 必须经真实 HTTP 创建
        cleanup: DeleteMany all circle_group_* collections
      scenarios:
        - name: group_transaction_and_replay
          commands:
            - CreateCircleGroup
            - UpdateCircleGroup
            - ArchiveCircleGroup
          assertions:
            - forged actor header returns 401 before persistence
            - same Idempotency-Key and command replays one receipt
            - same key with changed command returns CIRCLE.USER.group_idempotency_conflict
            - state, receipt and outbox remain unique
        - name: group_reader_and_bola
          commands:
            - ListCircleGroups
            - SearchCircleGroups
            - GetCircleGroup
          assertions:
            - non-member cannot enumerate private group data
            - reader emits CircleGroupSlice without _id or createdByPersonaId
