          required: false
        - name: visibility
          field: visibility
          required: false
        - name: parentGroupId
          field: parentGroupId
          required: false
        - name: nodeType
          field: nodeType
          required: false
        - name: cursor
          field: cursor
          required: false
        - name: limit
          field: limit
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
      kind: query
      facet: CircleGroupQueryFacet
      method: listCircleGroups
      reader: CircleGroupReader
      slice: CircleGroupPageSlice
    response_entity: CircleGroupPageSlice
    authorization:
      principal: persona
      ownership_policy: active_circle_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.SYSTEM.group_storage_write_failed
