description: CircleGroup 对象专属 Command Facade 与 named Reader。
commercial_defaults:
  status: blocked
  block_reason: 新增 operation 需按 B4 商用水位补齐三层证据后逐个翻牌
  gap_id: CIRCLE_GROUP_COMMERCIAL_CLOSURE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: GET
    path: /circles/{circleId}/groups
    operation: ListCircleGroups
    request_bindings:
      path:
        - name: circleId
          field: circleId
      query:
        - name: groupType
          field: groupType
          required: false
        - name: visibility
          field: visibility
          required: false
        - name: parentGroupId
          field: parentGroupId
          required: false
        - name: nodeType
          field: nodeType
          required: false
        - name: cursor
          field: cursor
          required: false
        - name: limit
          field: limit
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
      kind: query
      facet: CircleGroupQueryFacet
      method: listCircleGroups
      reader: CircleGroupReader
      slice: CircleGroupPageSlice
    response_entity: CircleGroupSlice
    authorization:
      principal: persona
      ownership_policy: active_circle_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.SYSTEM.group_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_group_list
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    client_contract:
      dart_import: ../circle/group_contracts.dart
      response_type: CircleGroupPageSlice
      response_decoder: decodeCircleGroupPageSlice
    request_entity: CircleGroupListQuery
    request_body_kind: none
  - method: GET
    path: /circles/{circleId}/groups/search
    operation: SearchCircleGroups
    request_bindings:
      path:
        - name: circleId
          field: circleId
      query:
        - name: query
          field: query
        - name: visibility
          field: visibility
          required: false
        - name: groupType
          field: groupType
          required: false
        - name: cursor
          field: cursor
          required: false
        - name: limit
          field: limit
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
      kind: query
      facet: CircleGroupQueryFacet
      method: searchCircleGroups
      reader: CircleGroupSearchReader
      slice: CircleGroupPageSlice
    response_entity: CircleGroupSlice
    authorization:
      principal: persona
      ownership_policy: active_circle_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.SYSTEM.group_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_group_search
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    client_contract:
      dart_import: ../circle/group_contracts.dart
      response_type: CircleGroupPageSlice
      response_decoder: decodeCircleGroupPageSlice
    request_entity: CircleGroupSearchQuery
    request_body_kind: none
  - method: POST
    path: /circles/{circleId}/groups
    operation: CreateCircleGroup
    request_bindings:
      path:
        - name: circleId
          field: circleId
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
