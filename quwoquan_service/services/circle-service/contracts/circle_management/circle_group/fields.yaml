description: Circle 内群组或组织节点的权威聚合；角色与派生计数不属于本聚合。
fields:
  - name: _id
    type: string
    constraints:
      - PK
      - NOT_NULL
    role: authoritative_state
  - name: version
    type: int64
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: circleId
    type: ObjectId
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: parentGroupId
    type: ObjectId
    constraints:
      - NULLABLE
    role: authoritative_state
    reference: true
  - name: groupType
    type: enum
    enum_ref: CircleGroupType
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: nodeType
    type: enum
    enum_ref: OrganizationNodeType
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: name
    type: string
    constraints:
      - NOT_NULL
    search_field: true
    role: authoritative_state
  - name: description
    type: string
    constraints:
      - NULLABLE
    search_field: true
    role: authoritative_state
  - name: visibility
    type: enum
    enum_ref: CircleGroupVisibility
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: joinPolicy
    type: enum
    enum_ref: CircleGroupJoinPolicy
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: createdByPersonaId
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: conversationId
    type: ObjectId
    constraints:
      - NULLABLE
    role: authoritative_state
    reference: true
  - name: storageEnabled
    type: bool
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: noticeEnabled
    type: bool
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: isDefaultPublicGroup
    type: bool
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: status
    type: enum
    enum_ref: CircleGroupStatus
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
types:
