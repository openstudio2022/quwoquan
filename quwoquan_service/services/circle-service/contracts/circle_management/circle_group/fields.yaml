      - name: circleId
        type: ObjectId
        constraints:
          - NOT_NULL
      - name: parentGroupId
        type: ObjectId
        constraints:
          - NULLABLE
      - name: groupType
        type: enum
        enum_ref: CircleGroupType
        constraints:
          - NOT_NULL
      - name: nodeType
        type: enum
        enum_ref: OrganizationNodeType
        constraints:
          - NULLABLE
      - name: name
        type: string
        constraints:
          - NOT_NULL
      - name: description
        type: string
        constraints:
          - NULLABLE
      - name: visibility
        type: enum
        enum_ref: CircleGroupVisibility
        constraints:
          - NOT_NULL
      - name: joinPolicy
        type: enum
        enum_ref: CircleGroupJoinPolicy
