events:
- name: CircleGroupCreated
  delivery_semantics: transactional_outbox
  wire_event_type: CircleGroupCreated
  payload_entity: CircleGroup
  payload_fields:
  - groupId
  - version
  - circleId
  - groupType
  - name
  - createdByPersonaId
  - status
  - createdAt
- name: CircleGroupUpdated
  delivery_semantics: transactional_outbox
  wire_event_type: CircleGroupUpdated
  payload_entity: CircleGroup
  payload_fields:
  - _id
  - version
  - circleId
  - status
- name: CircleGroupArchived
  delivery_semantics: transactional_outbox
  wire_event_type: CircleGroupArchived
  payload_entity: CircleGroup
  payload_fields:
  - groupId
  - version
  - circleId
  - status
  - updatedAt
