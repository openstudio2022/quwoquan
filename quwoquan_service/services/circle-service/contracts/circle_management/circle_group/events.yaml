events:
- name: CircleGroupCreated
  producer: circle-service
  consumers:
  - circle-group-membership-projector
  - circle-group-stream
  - chat-circle-group-conversation-provisioner
  - circle-group-search-index-projector
  channel: transactional_outbox
  payload_entity: CircleGroup
  payload_fields:
  - groupId
  - version
  - circleId
  - groupType
  - name
  - createdByPersonaId
  - status
  - createdAt
- name: CircleGroupUpdated
  producer: circle-service
  consumers:
  - circle-group-stream
  - circle-group-search-index-projector
  channel: event_store
  payload_entity: CircleGroup
  payload_fields:
  - _id
  - version
  - circleId
  - status
- name: CircleGroupArchived
  producer: circle-service
  consumers:
  - circle-group-membership-projector
  - circle-group-stream
  - chat-circle-group-conversation-provisioner
  - circle-group-search-index-projector
  channel: transactional_outbox
  payload_entity: CircleGroup
  payload_fields:
  - groupId
  - version
  - circleId
  - status
  - updatedAt
