kind: aggregate_root
description: Circle 内公共群、自建群或组织节点的主档与治理策略聚合。
identity:
  fields:
  - _id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: command_facade
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: circle
  on_delete: tombstone
  reference_fields:
  - circleId
  target_object: circle.Circle
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: parent_group
  on_delete: detach
  reference_fields:
  - parentGroupId
  target_object: circle.CircleGroup
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: creator_persona
  on_delete: tombstone
  reference_fields:
  - createdByPersonaId
  target_object: user.Persona
- access: event
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: conversation
  on_delete: detach
  reference_fields:
  - conversationId
  target_object: chat.Conversation
search_policy:
  exposed: hybrid
  object_type_refs:
  - circle.group
  eligibility_ref: quwoquan_service/services/circle-service/internal/circle_management/circle_group/application/circle_group_search_projection.go#CircleGroupSearchEligible
  index_projector_ref: quwoquan_service/services/circle-service/internal/circle_management/circle_group/application/circle_group_search_projection.go#ProjectCircleGroupToSearchDocument
  privacy_filter_ref: quwoquan_service/runtime/search/core.go#isPrivateVisibility
assistant_access:
  read:
    mode: public
    scopes:
    - assistant.circle.circle_group.read
  cite:
    mode: public_citation
    scopes:
    - assistant.circle.circle_group.cite
  write:
    mode: none
    scopes: []
business_rules:
- circleId 与 groupType 创建后不可变
- parentGroupId 必须属于同一 Circle 且层级关系无环
- default public group 在同一 Circle 内唯一
- conversationId 只能由 Chat Facade 成功事件绑定，不由 Circle 直接创建
- archived group 不接受新成员或文件
- owner/manager/member 角色只由 CircleGroupMembership 聚合维护
- memberCount 与活跃度只由 named Reader/投影派生，不写入权威聚合
lifecycle:
  state_field: status
  states:
  - active
  - archived
  optimistic_concurrency: version
  idempotency: command_receipt
  source_events:
  - circle.circle_group.CircleGroupCreated
  - circle.circle_group.CircleGroupUpdated
  - circle.circle_group.CircleGroupArchived
  - chat.conversation.CircleGroupConversationProvisioned
  event_consumers:
  - name: ProjectCircleGroupSearchIndex
    kind: event_handler
    facet: CircleGroupSearchIndexHandler
    method: apply
    idempotency: event_id
  - name: BindProvisionedConversation
    kind: event_handler
    facet: ConversationBindingProjector
    method: apply
    idempotency: event_id
