contract_test:
  coverage_requirements:
    - aggregate state transitions, owner invariants and optimistic version conflicts covered
    - actor, Circle membership and group manager BOLA negative cases covered
    - aggregate, receipt and outbox commit in one real Mongo transaction
    - Reader never exposes storage identity or decision actor
    - outbox replay cannot duplicate Chat ConversationMembership side effects
  test_strategy:
    service_side:
      description: 使用 MongoDB 7 replica set 与 Redis 7 testcontainers，不 mock Store、outbox、Reader 或 stream
      real_engines:
        mongodb: testcontainers (mongo:7 replica set)
        redis: testcontainers (redis:7)
      data_management:
        seed: 仅插入 Circle、CircleMembership 与 CircleGroup policy；CircleGroupMembership 必须经真实 HTTP Command Facade 创建
        cleanup: DeleteMany all circle_group_membership_* collections and FLUSHDB isolated Redis
      scenarios:
        - name: group_membership_transaction_and_replay
          commands:
            - ApplyJoinCircleGroup
            - ApproveCircleGroupMember
            - LeaveCircleGroup
            - RemoveCircleGroupMember
            - UpdateCircleGroupMemberRole
          assertions:
            - same key and semantic command replays exactly one receipt
            - same key with changed command returns idempotency conflict
            - state, receipt and outbox remain unique
        - name: group_membership_reader_and_bola
          commands:
            - GetMyCircleGroupMembership
            - ListCircleGroupMemberships
          assertions:
            - non-member cannot enumerate the roster
            - applicant cannot approve self
            - reader omits _id and decidedByPersonaId
