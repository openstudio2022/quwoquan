backend: mongodb
collections:
  circle_group_memberships:
    publication_role: not_published
    entity: CircleGroupMembership
    role: authoritative
    indexes:
    - name: idx_circle_group_membership_identity
      keys:
        groupId: 1
        personaId: 1
      unique: true
    - name: idx_circle_group_membership_roster
      keys:
        groupId: 1
        state: 1
        joinedAt: 1
        _id: 1
  circle_group_membership_capacity_counters:
    publication_role: not_published
    entity: CircleGroupMembership
    role: authoritative
    description: 每个 groupId 一条的事务容量账本；与成员状态、命令回执和 outbox 同一 Mongo transaction 提交，用于串行化 active 成员上限检查。
  circle_group_membership_command_receipts:
    publication_role: not_published
    entity: CircleGroupMembershipCommandReceipt
    role: authoritative
    indexes:
    - name: idx_circle_group_membership_receipt_expiry
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  circle_group_membership_outbox:
    publication_role: transactional_outbox
    entity: CircleGroupMembershipOutbox
    role: append_only
    indexes:
    - name: idx_circle_group_membership_outbox_version
      keys:
        aggregateId: 1
        aggregateVersion: 1
      unique: true
    - name: idx_circle_group_membership_outbox_sequence
      keys:
        outboxSequence: 1
      unique: true
  circle_group_membership_outbox_sequences:
    publication_role: publication_accessory
    entity: CircleGroupMembershipOutboxSequence
    role: authoritative
  circle_group_membership_projection_checkpoints:
    publication_role: publication_accessory
    entity: CircleGroupMembershipProjectionCheckpoint
    role: projection
role: authoritative
