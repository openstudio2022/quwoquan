description: 单一 Persona 在 CircleGroup 中的权威申请、审批、角色与退出生命周期。
fields:
  - name: _id
    type: string
    constraints:
      - PK
      - NOT_NULL
    role: authoritative_state
  - name: version
    type: int64
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: groupId
    type: ObjectId
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: circleId
    type: ObjectId
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: personaId
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: role
    type: enum
    enum_ref: CircleGroupMembershipRole
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: state
    type: enum
    enum_ref: CircleGroupMembershipState
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: joinedAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: leftAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: decidedAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: decidedByPersonaId
    type: string
    constraints:
      - NULLABLE
    role: authoritative_state
    reference: true
  - name: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
types:
  CircleGroupMembershipSlice:
    description: CircleGroupMembershipReader 返回的强类型只读切片，不暴露 Mongo _id。
    fields:
      - name: membershipId
        type: string
        constraints:
          - NOT_NULL
      - name: version
        type: int64
        constraints:
          - NOT_NULL
      - name: groupId
        type: ObjectId
        constraints:
          - NOT_NULL
      - name: circleId
        type: ObjectId
        constraints:
          - NOT_NULL
      - name: personaId
        type: string
        constraints:
          - NOT_NULL
      - name: role
        type: enum
        enum_ref: CircleGroupMembershipRole
        constraints:
          - NOT_NULL
      - name: state
        type: enum
        enum_ref: CircleGroupMembershipState
        constraints:
          - NOT_NULL
      - name: joinedAt
        type: timestamp
        constraints:
          - NULLABLE
      - name: leftAt
        type: timestamp
        constraints:
          - NULLABLE
      - name: decidedAt
        type: timestamp
        constraints:
          - NULLABLE
      - name: createdAt
        type: timestamp
        constraints:
          - NOT_NULL
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
  CircleGroupMembershipPageSlice:
    description: CircleGroupMembershipReader 的稳定游标分页结果。
    fields:
      - name: items
        type: '[]CircleGroupMembershipSlice'
        constraints:
          - NOT_NULL
      - name: cursor
        type: string
        constraints:
          - NULLABLE
  CircleGroupMembershipCommandResult:
    description: CircleGroupMembership 命令的稳定提交回执。
    fields:
      - name: membershipId
        type: string
        constraints:
          - NOT_NULL
      - name: version
        type: int64
        constraints:
          - NOT_NULL
      - name: role
        type: enum
        enum_ref: CircleGroupMembershipRole
        constraints:
          - NOT_NULL
      - name: state
        type: enum
        enum_ref: CircleGroupMembershipState
        constraints:
          - NOT_NULL
      - name: idempotentReplay
        type: bool
        constraints:
          - NOT_NULL
  UpdateCircleGroupMembershipRoleRequest:
    fields:
      - name: role
        type: enum
        enum_ref: CircleGroupMembershipRole
        constraints:
          - NOT_NULL
  CircleGroupMembershipCommandReceipt:
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: commandDigest
        type: string
        constraints:
          - NOT_NULL
      - name: membershipId
        type: string
        constraints:
          - NOT_NULL
      - name: version
        type: int64
        constraints:
          - NOT_NULL
      - name: role
        type: enum
        enum_ref: CircleGroupMembershipRole
        constraints:
          - NOT_NULL
      - name: state
        type: enum
        enum_ref: CircleGroupMembershipState
        constraints:
          - NOT_NULL
      - name: expiresAt
        type: timestamp
        constraints:
          - NOT_NULL
  CircleGroupMembershipOutbox:
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: outboxSequence
        type: int64
        constraints:
          - NOT_NULL
      - name: eventType
        type: string
        constraints:
          - NOT_NULL
      - name: aggregateId
        type: string
        constraints:
          - NOT_NULL
      - name: aggregateVersion
        type: int64
        constraints:
          - NOT_NULL
      - name: payloadJson
        type: string
        constraints:
          - NOT_NULL
      - name: occurredAt
        type: timestamp
        constraints:
          - NOT_NULL
  CircleGroupMembershipOutboxSequence:
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: sequence
        type: int64
        constraints:
          - NOT_NULL
  CircleGroupMembershipProjectionCheckpoint:
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: sequence
        type: int64
        constraints:
          - NOT_NULL
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
  ApplyCircleGroupMembershipCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  LeaveCircleGroupMembershipCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  CircleGroupMembershipListQuery:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: state
        type: enum
        enum_ref: CircleGroupMembershipState
        constraints:
          - NULLABLE
      - name: cursor
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
  RemoveCircleGroupMembershipCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: personaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  DecideCircleGroupMembershipCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: personaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  UpdateCircleGroupMembershipRoleCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: personaId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: role
        type: enum
        enum_ref: CircleGroupMembershipRole
  MyCircleGroupMembershipQuery:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
