description: 'CircleBehaviorFact 对象专属错误码。格式：MODULE.KIND.REASON。'
errors:
- code: CIRCLE.SYSTEM.behavior_fact_write_failed
  reason: behavior_fact_write_failed
  emitted_by:
  - surface: http
    operations:
    - ReportCircleBehavior
  http_status: 500
  recovery_action: retry
  disruption_level: snackbar
  dart_const: behaviorFactWriteFailed
  go_const: ErrBehaviorFactWriteFailed
  user_message:
    zh: 行为记录失败，请稍后重试
    en: Failed to record circle behavior, retry later
- code: CIRCLE.USER.behavior_fact_idempotency_conflict
  reason: behavior_fact_idempotency_conflict
  emitted_by:
  - surface: http
    operations:
    - ReportCircleBehavior
  http_status: 409
  recovery_action: retry
  disruption_level: snackbar
  dart_const: behaviorFactIdempotencyConflict
  go_const: ErrBehaviorFactIdempotencyConflict
  user_message:
    zh: 重复行为请求与原请求不一致
    en: Idempotency key was reused for another circle behavior
