description: CircleBehaviorFact typed append sink。
commercial_defaults:
  status: blocked
  block_reason: 新增 operation 需按 B4 商用水位补齐三层证据后逐个翻牌
  gap_id: CIRCLE_BEHAVIOR_FACT_COMMERCIAL_CLOSURE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /circles/behaviors
    operation: ReportCircleBehavior
    commercial:
      status: ready
    actor: persona_or_device
    security:
      auth_mode: optional
    application:
      kind: command
      facet: CircleBehaviorFactWriter
      method: appendCircleBehavior
      append_sink: CircleBehaviorFact
      mutation_target: CircleBehaviorFact
      invariant_target: CircleBehaviorFact
    request_entity: AppendCircleBehaviorFactCommand
    response_entity: AppendResult
    response_body: AppendResult
    response_body_kind: object
    authorization:
      principal: public
      ownership_policy: authenticated_persona_or_derived_device_actor
    reliability:
      timeout_ms: 1000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.behavior_fact_idempotency_conflict
      - CIRCLE.SYSTEM.behavior_fact_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_behavior_fact_append
      trace: true
      attributes:
        - outcome
        - event_type
        - actor_kind
    slo:
      latency_p95_ms: 300
      availability_percent: 99.9
    request_body_kind: object
