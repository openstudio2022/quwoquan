kind: append_only_fact
description: 圈子曝光、点击、停留等不可变行为事实；身份与会话归因只来自可信 Runtime Context。
identity:
  fields:
  - _id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: none
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: circle
  on_delete: retain
  reference_fields:
  - circleId
  target_object: circle.Circle
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: deviceActor
  on_delete: retain
  reference_fields:
  - deviceActorId
  target_object: user.DeviceRegistration
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: personaActor
  on_delete: retain
  reference_fields:
  - personaId
  target_object: user.Persona
local_identity_reasons:
  requestId: immutable correlation or idempotency key scoped to this fact or command; it is not a business-object
    reference
  sessionId: runtime session correlation key injected by OperationInvocationContext, not an aggregate
    reference
capabilities:
- append_only
- idempotent_append
- outbox
business_rules:
- actor 必须是可信 persona 或服务端派生 device actor，业务请求体不得携带 actor 标识
- sessionId、requestId 与 occurredAt 必须由 OperationInvocationContext 注入
- 同一 actor 与 Idempotency-Key 只能产生一个事实；语义不同的重复键必须冲突
- 事实不可更新或删除，投影仅经独立 checkpoint 重放
lifecycle:
  states:
  - recorded
  immutable: true
