    fields:
    - {name: gatheringId, type: string, constraints: [NOT_NULL]}
    - {name: aggregateVersion, type: int64, constraints: [NOT_NULL], semantic_type: aggregate_version}
    - {name: lifecycleStatus, type: enum, enum_ref: GatheringLifecycleStatus, constraints: [NOT_NULL]}
    - {name: actorPersonaId, type: string, constraints: [NULLABLE]}
