  GatheringLifecycleStatus:
    values: [draft, published, cancelled, completed]
  GatheringOutcomeStatus:
    values: [occurred, did_not_happen, ended_early, safety_terminated, disputed, unverified]
  GatheringParticipationState:
    values: [invited_pending, application_pending, active, closed]
  GatheringAdmissionSource:
    values: [open, application, invitation]
  GatheringParticipationClosedReason:
    values: [declined, revoked, expired, withdrawn, rejected, left, removed, safety_removed]
  GatheringAttendanceStatus:
    values: [not_declared, arrived, left_early, completed, no_show]
  GatheringRevisionAcknowledgementStatus:
    values: [not_required, pending, accepted, declined, expired]
  GatheringRoomBindingStatus:
    values: [pending, ready, failed]
  GatheringTemporalPhase:
    values: [upcoming, in_progress, ended]
  GatheringAdmissionState:
    values: [accepting, full, paused, closed]
  GatheringApplicationReviewDecision:
    values: [approve, reject]
  GatheringRevisionAcknowledgementDecision:
    values: [accept, decline]
  GatheringAvailabilityWatchStatus:
    values: [active, cancelled, notified]
  GatheringInvitationStatus:
    values: [pending, accepted, declined, revoked, cancelled, expired]
  GatheringInvitationAction:
    values: [accept, decline]
