    - {name: conversationId, type: string, constraints: [NULLABLE]}
    - {name: admissionControlStatus, type: enum, enum_ref: GatheringAdmissionControlStatus, constraints: [NOT_NULL]}
    - {name: outcomeStatus, type: enum, enum_ref: GatheringOutcomeStatus, constraints: [NULLABLE]}
    - {name: watchStatus, type: enum, enum_ref: GatheringAvailabilityWatchStatus, constraints: [NULLABLE]}
    - {name: sourceRefs, type: '[]GatheringEventSourceRef', constraints: [NULLABLE], description: 发起溯源引用（objectKind + objectId）；仅 GatheringPublished 携带，供 recommendation 社会证明四锚点按实体/内容/创作者归集，禁止携带私密名单或申请事实。}
    - {name: maxParticipants, type: int, constraints: [NULLABLE], description: 发布时冻结的公开容量政策；仅 GatheringPublished 携带，供漏斗按活动特征（duo/group）诚实切片。}
    - {name: admissionPolicy, type: enum, enum_ref: GatheringAdmissionPolicy, constraints: [NULLABLE], description: 发布时冻结的公开准入政策；仅 GatheringPublished 携带，与 maxParticipants 共同派生 capacityTier。}
    - {name: occurredAt, type: timestamp, constraints: [NOT_NULL], semantic_type: instant}
