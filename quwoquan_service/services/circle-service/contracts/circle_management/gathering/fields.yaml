    description: 事件载荷内的最小 canonical 溯源引用；只含对象类型与 ID，不复制标题或快照。
    fields:
    - {name: objectKind, type: string, constraints: [NOT_NULL]}
    - {name: objectId, type: string, constraints: [NOT_NULL]}
  GatheringInvitationScheduleSnapshot:
    description: 邀请事件中按未加入 viewer 披露策略裁剪的日程快照；after_join 禁止携带精确时间。
    fields:
    - {name: timezone, type: string, constraints: [NOT_NULL]}
    - {name: startAt, type: timestamp, constraints: [NULLABLE], semantic_type: instant}
    - {name: endAt, type: timestamp, constraints: [NULLABLE], semantic_type: instant}
    - {name: dateLabel, type: string, constraints: [NULLABLE]}
  GatheringInvitationPlaceSnapshot:
    description: 邀请事件中按未加入 viewer 披露策略裁剪的地点快照；禁止携带群内容、名单与 after_join 精确地点。
    fields:
    - {name: mode, type: enum, enum_ref: GatheringPlaceMode, constraints: [NOT_NULL]}
    - {name: coarsePlaceLabel, type: string, constraints: [NULLABLE]}
    - {name: exactMeetingPoint, type: string, constraints: [NULLABLE]}
  GatheringInvitationActionIntent:
    description: App 将 intent 映射到 Circle typed operation；Notification/Chat 不得据此直接改写 Participation。
    fields:
    - {name: action, type: enum, enum_ref: GatheringInvitationAction, constraints: [NOT_NULL]}
    - {name: expectedGatheringVersion, type: int64, constraints: [NOT_NULL], semantic_type: aggregate_version}
    - {name: expectedParticipationVersion, type: int64, constraints: [NOT_NULL]}
  GatheringInvitationEventPayload:
    description: Circle 事务 outbox 发布给 Notification 的最小邀请投影；不含 conversationId、群消息、名单、申请答案或未披露地点。
    fields:
    - {name: gatheringId, type: string, constraints: [NOT_NULL]}
    - {name: inviterPersonaId, type: string, constraints: [NOT_NULL]}
    - {name: recipientPersonaId, type: string, constraints: [NOT_NULL]}
    - {name: purposeSummary, type: string, constraints: [NOT_NULL]}
    - {name: schedule, type: GatheringInvitationScheduleSnapshot, constraints: [NOT_NULL]}
    - {name: place, type: GatheringInvitationPlaceSnapshot, constraints: [NOT_NULL]}
    - {name: participationVersion, type: int64, constraints: [NOT_NULL]}
    - {name: status, type: enum, enum_ref: GatheringInvitationStatus, constraints: [NOT_NULL]}
    - {name: actionIntents, type: '[]GatheringInvitationActionIntent', constraints: [NOT_NULL], max_items: 2}
    - {name: expiresAt, type: timestamp, constraints: [NULLABLE], semantic_type: instant}
    - {name: occurredAt, type: timestamp, constraints: [NOT_NULL], semantic_type: instant}
  GatheringOutbox:
    fields:
    - {name: _id, type: string, constraints: [PK, NOT_NULL]}
    - {name: outboxSequence, type: int64, constraints: [NOT_NULL], semantic_type: sequence}
    - {name: eventType, type: string, constraints: [NOT_NULL]}
    - {name: aggregateId, type: string, constraints: [NOT_NULL]}
    - {name: aggregateVersion, type: int64, constraints: [NOT_NULL], semantic_type: aggregate_version}
    - {name: payloadJson, type: json, constraints: [NOT_NULL]}
    - {name: occurredAt, type: timestamp, constraints: [NOT_NULL], semantic_type: instant}
  GatheringReconciliationCheckpoint:
    description: Gathering 到 Chat 的对象本地投影 checkpoint；version 只允许单调递增。
    fields:
    - {name: _id, type: string, constraints: [PK, NOT_NULL]}
    - {name: version, type: int64, constraints: [NOT_NULL], semantic_type: watermark_sequence}
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL], semantic_type: instant}
