backend: mongodb
role: authoritative
collections:
  gatherings:
    entity: Gathering
    role: authoritative
    indexes:
    - name: uq_gathering_conversation
      keys: {conversationId: 1}
      sparse: true
      unique: true
    - name: idx_gathering_status_start
      keys: {status: 1, startAt: 1}
  gathering_command_receipts:
    entity: GatheringCommandReceipt
    role: authoritative
    description: 与 Gathering state 和 outbox 在同一 MongoDB transaction 提交的幂等回执。
  gathering_outbox:
    entity: GatheringOutbox
    role: append_only
  gathering_outbox_sequences:
    entity: GatheringOutbox
    role: authoritative
