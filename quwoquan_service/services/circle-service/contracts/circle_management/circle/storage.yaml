backend: mongodb
collections:
  circles:
    entity: Circle
    role: authoritative
    indexes:
    - name: idx_circles_owner
      keys:
        ownerId: 1
    - name: idx_circles_category
      keys:
        category: 1
        memberCount: -1
    - name: idx_circles_tags
      keys:
        tags: 1
    - name: idx_circles_status
      keys:
        status: 1
        createdAt: -1
    - name: idx_circles_weekly_active
      keys:
        weeklyActiveCount: -1
    search_indexes:
    - name: search_circles_text
      source: search_circles_text
      type: text
      fields:
      - name
      - description
      - tags
      weights:
        name: 10
        tags: 5
        description: 1
  circle_command_receipts:
    entity: CircleCommandReceipt
    role: authoritative
    indexes:
    - name: idx_circle_receipt_expiry
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
  circle_outbox:
    entity: CircleOutbox
    role: append_only
    indexes:
    - name: idx_circle_outbox_version
      keys:
        aggregateId: 1
        aggregateVersion: 1
      unique: true
    - name: idx_circle_outbox_sequence
      keys:
        outboxSequence: 1
      unique: true
  circle_outbox_sequences:
    entity: CircleOutboxSequence
    role: authoritative
  circle_user_account_closed_inbox:
    entity: Circle
    role: projection
    description: UserAccountClosed 清理的不可逆幂等 inbox，不保存账号或 persona 原值。
    indexes:
    - name: idx_circle_user_account_closed_inbox_event
      keys:
        eventDigest: 1
  circle_user_account_closed_failures:
    entity: Circle
    role: projection
    description: UserAccountClosed 有限重试状态，只保存 source message reference、
      event/error digest、attempts 与时间戳，禁止保存 payload 或主体标识。普通失败按 expiresAt
      回收；terminal marker 必须移除 expiresAt，原 source PEL 只能由受控 recovery 释放。
    indexes:
    - name: idx_circle_user_account_closed_failure_event
      keys:
        eventDigest: 1
    - name: ttl_circle_user_account_closed_failures
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
  circle_closed_account_subjects:
    entity: Circle
    role: projection
    description: UserAccountClosed 的不可逆本地主体阻断投影；Circle 与 CirclePostPlacement 只能经本域 port 查询。
  circle_user_account_restrictions:
    entity: Circle
    role: projection
    description: UserSuspended/UserRestored 的 Circle 本地可逆阻断状态。
  circle_user_account_restriction_inbox:
    entity: Circle
    role: projection
    description: 账号限制事件的幂等 inbox；与 Circle 自有状态 mutation 同事务。
  circle_user_account_restriction_watermarks:
    entity: Circle
    role: projection
    description: 账号限制单调水位；账号关闭后 terminal，不允许迟到恢复事件复活状态。
  circle_projection_checkpoints:
    entity: Circle
    role: projection
    description: Circle 对象本地 projector 的可重建 checkpoint。
redis_cache:
- key: cache:circle-discovery:{generation}:{scope}:{personaHash}:{category}:{subCategory}:{sort}:{cursor}:{limit}
  ttl_seconds: 60
  entity: CircleDiscoveryFeedPageSlice
  isolation: persona_scope
  invalidate_on:
  - CircleCreated
  - CircleUpdated
  - CircleArchived
  - CircleMembershipJoined
  - CircleMembershipApproved
  - CircleMembershipLeft
  - PostPublished
  - PostDeleted
  - CirclePostPlaced
  - CirclePostPlacementPresentationChanged
  - CirclePostPlacementRemoved
  description: 圈子频道聚合读切片；generation 在任一源事实变更后递增，personaHash 只允许由服务端 actor 上下文生成，匿名 mine 不写缓存。
- key: cache:circle:{circleId}
  ttl_seconds: 600
  entity: Circle
  invalidate_on:
  - CircleUpdated
  - CircleMembershipJoined
  - CircleMembershipLeft
  - CirclePostPlaced
  - CirclePostPlacementRemoved
  - CircleSectionsUpdated
- key: cache:circle-group:{groupId}
  ttl_seconds: 600
  entity: CircleGroup
  invalidate_on:
  - CircleGroupUpdated
  - CircleGroupMemberJoined
  - CircleGroupMemberLeft
object_storage:
  bucket_prefix: circle-files
  key_pattern: '{circleId}/{fileId}/{filename}'
  max_file_size_bytes: 52428800
  allowed_mime_types:
  - image/*
  - video/*
  - audio/*
  - application/pdf
  - application/zip
  - application/x-rar-compressed
  - application/msword
  - application/vnd.openxmlformats-officedocument.*
  - text/plain
  - text/markdown
role: authoritative
