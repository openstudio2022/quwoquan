domain: CIRCLE
aggregate: Circle
description: 'Circle 对象专属及跨对象入口错误码。格式：MODULE.KIND.REASON。'
errors:
- code: CIRCLE.USER.invalid_argument
  kind: USER
  reason: invalid_argument
  emitted_by:
  - surface: http
    operations:
    - ArchiveCircle
    - CreateCircle
    - GetCircleFeed
    - ListCircleDiscoveryFeed
    - ListCircles
    - RecoverCircleAccountClosureDeadLetter
    - SearchCircles
    - UpdateCircle
    - UpdateCircleSections
    - circle.circle_behavior_fact.ReportCircleBehavior
    - circle.circle_file.CreateCircleFile
    - circle.circle_file.DeleteCircleFile
    - circle.circle_file.GetCircleFile
    - circle.circle_file.ListCircleFiles
    - circle.circle_file.UpdateCircleFile
    - circle.circle_group.ArchiveCircleGroup
    - circle.circle_group.CreateCircleGroup
    - circle.circle_group.GetCircleGroup
    - circle.circle_group.ListCircleGroups
    - circle.circle_group.SearchCircleGroups
    - circle.circle_group.UpdateCircleGroup
    - circle.circle_group_membership.ApplyJoinCircleGroup
    - circle.circle_group_membership.ApproveCircleGroupMember
    - circle.circle_group_membership.GetMyCircleGroupMembership
    - circle.circle_group_membership.LeaveCircleGroup
    - circle.circle_group_membership.ListCircleGroupMemberships
    - circle.circle_group_membership.RejectCircleGroupMember
    - circle.circle_group_membership.RemoveCircleGroupMember
    - circle.circle_group_membership.UpdateCircleGroupMemberRole
    - circle.circle_membership.ApproveCircleMember
    - circle.circle_membership.GetMyCircleMembership
    - circle.circle_membership.JoinCircle
    - circle.circle_membership.LeaveCircle
    - circle.circle_membership.ListCircleMemberships
    - circle.circle_membership.ListPendingCircleMemberships
    - circle.circle_membership.ListPersonaCircles
    - circle.circle_membership.RejectCircleMember
    - circle.circle_membership.UpdateCircleMembershipRole
    - circle.circle_post_placement.PlacePostInCircle
    - circle.gathering.ApproveGatheringParticipant
    - circle.gathering.CancelGathering
    - circle.gathering.CompleteGathering
    - circle.gathering.CreateGathering
    - circle.gathering.GetGathering
    - circle.gathering.JoinGathering
    - circle.gathering.LeaveGathering
  http_status: 400
  recovery_action: surface
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 请求参数无效
    en: Invalid request
- code: CIRCLE.USER.not_found
  kind: USER
  reason: not_found
  emitted_by:
  - surface: http
    operations:
    - ArchiveCircle
    - GetCircle
    - GetCircleFeed
    - GetCircleImpact
    - GetCircleStats
    - UpdateCircle
    - UpdateCircleSections
  http_status: 404
  recovery_action: surface
  dart_const: circleNotFound
  go_const: ErrCircleNotFound
  user_message:
    zh: 圈子不存在
    en: Circle not found
- code: CIRCLE.USER.circle_archived
  kind: USER
  reason: circle_archived
  emitted_by:
  - surface: http
    operations:
    - UpdateCircle
    - UpdateCircleSections
  http_status: 409
  recovery_action: refresh
  dart_const: circleArchived
  go_const: ErrCircleArchived
  user_message:
    zh: 圈子已归档，无法修改
    en: Circle is archived and cannot be modified
- code: CIRCLE.USER.circle_version_conflict
  kind: USER
  reason: circle_version_conflict
  emitted_by:
  - surface: http
    operations:
    - ArchiveCircle
    - UpdateCircle
    - UpdateCircleSections
  http_status: 409
  recovery_action: refresh
  dart_const: circleVersionConflict
  go_const: ErrCircleVersionConflict
  user_message:
    zh: 圈子信息已被更新，请刷新后重试
    en: Circle was updated concurrently, refresh and retry
- code: CIRCLE.USER.circle_idempotency_conflict
  kind: USER
  reason: circle_idempotency_conflict
  emitted_by:
  - surface: http
    operations:
    - ArchiveCircle
    - CreateCircle
    - UpdateCircle
    - UpdateCircleSections
  http_status: 409
  recovery_action: refresh
  dart_const: circleIdempotencyConflict
  go_const: ErrCircleIdempotencyConflict
  user_message:
    zh: 重复请求与原命令不一致
    en: Idempotency key was reused for another circle command
- code: CIRCLE.SYSTEM.circle_storage_write_failed
  kind: SYSTEM
  reason: circle_storage_write_failed
  emitted_by:
  - surface: http
    operations:
    - ArchiveCircle
    - CreateCircle
    - UpdateCircle
    - UpdateCircleSections
  http_status: 500
  recovery_action: retry
  dart_const: circleStorageWriteFailed
  go_const: ErrCircleStorageWriteFailed
  user_message:
    zh: 圈子操作失败，请稍后重试
    en: Circle operation failed, retry later
- code: CIRCLE.USER.permission_denied
  kind: USER
  reason: forbidden
  emitted_by:
  - surface: http
    operations:
    - ArchiveCircle
    - UpdateCircle
    - UpdateCircleSections
    - circle.circle_file.DeleteCircleFile
    - circle.circle_file.UpdateCircleFile
    - circle.circle_group.ArchiveCircleGroup
    - circle.circle_group.CreateCircleGroup
    - circle.circle_group.UpdateCircleGroup
    - circle.circle_group_membership.ApproveCircleGroupMember
    - circle.circle_group_membership.ListCircleGroupMemberships
    - circle.circle_group_membership.RejectCircleGroupMember
    - circle.circle_group_membership.RemoveCircleGroupMember
    - circle.circle_group_membership.UpdateCircleGroupMemberRole
    - circle.circle_membership.ApproveCircleMember
    - circle.circle_membership.ListPendingCircleMemberships
    - circle.circle_membership.RejectCircleMember
    - circle.circle_membership.UpdateCircleMembershipRole
    - circle.circle_post_placement.FeatureCirclePost
    - circle.circle_post_placement.PinCirclePost
    - circle.circle_post_placement.PlacePostInCircle
    - circle.circle_post_placement.RemovePostFromCircle
  http_status: 403
  recovery_action: surface
  dart_const: permissionDenied
  go_const: ErrPermissionDenied
  user_message:
    zh: 权限不足
    en: Permission denied
- code: CIRCLE.SYSTEM.internal_error
  kind: SYSTEM
  reason: internal_error
  emitted_by:
  - surface: http
    operations:
    - GetCircle
    - GetCircleFeed
    - GetCircleImpact
    - GetCircleStats
    - ListCircleDiscoveryFeed
    - ListCircles
    - RecoverCircleAccountClosureDeadLetter
    - SearchCircles
  http_status: 500
  recovery_action: surface
  dart_const: internalError
  go_const: ErrInternalError
  user_message:
    zh: 服务异常，请稍后重试
    en: Service error, please try again
