      log_policy: allow
      api_exposure: read_write
      ops_exposure: read
      role: authoritative_state
    - name: order
      type: int
      constraints:
      - NOT_NULL
      - DEFAULT_0
      classification: PUBLIC
      log_policy: allow
      api_exposure: read_write
      ops_exposure: read
      role: authoritative_state
    - name: customTitle
      source: customTitle
      type: string
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read_write
      ops_exposure: read
