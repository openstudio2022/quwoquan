  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  description: 圈子独立头像（主页头部头像簇主体），缺省时端侧回退 coverUrl
  role: authoritative_state
- name: ownerId
  source: ownerId
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
