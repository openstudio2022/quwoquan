  type: ObjectId
  constraints:
  - PK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: name
  source: name
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  recommend_feature: true
  search_field: true
  role: authoritative_state
- name: description
  source: description
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  recommend_feature: true
  search_field: true
  role: authoritative_state
- name: rulesText
