      role: authoritative_state
    description: 圈子主页板块配置项（嵌入文档，非独立集合）
types:
  CircleAccountClosureDeadLetterRecoveryRequest:
    description: operator 释放 Circle 注销清理 terminal marker 的强类型命令；只接受 Redis source PEL 坐标。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: write
      ops_exposure: write
  CircleAccountClosureDeadLetterRecoveryAccepted:
    description: Circle 注销清理 source PEL 已受理重新消费。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - PK
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: recoveryAccepted
      source: recoveryAccepted
      type: bool
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  CircleCommandReceipt:
    description: Circle 聚合 actor-scoped idempotency receipt。
    fields:
    - name: _id
      type: string
      constraints:
      - PK
      - NOT_NULL
    - name: commandDigest
      type: string
      constraints:
      - NOT_NULL
    - name: circleId
      type: string
      constraints:
      - NOT_NULL
    - name: version
      type: int64
      constraints:
      - NOT_NULL
    - name: status
      type: enum
      enum_ref: CircleStatus
      constraints:
      - NOT_NULL
    - name: expiresAt
      type: timestamp
      constraints:
      - NOT_NULL
  CircleOutbox:
    description: 与 Circle aggregate/version/receipt 同事务提交的不可变事实。
    fields:
    - name: _id
      type: string
      constraints:
      - PK
      - NOT_NULL
    - name: outboxSequence
      type: int64
      constraints:
      - NOT_NULL
    - name: eventType
      type: string
      constraints:
      - NOT_NULL
    - name: aggregateId
      type: string
      constraints:
      - NOT_NULL
    - name: aggregateVersion
      type: int64
      constraints:
      - NOT_NULL
    - name: payloadJson
      type: string
      constraints:
      - NOT_NULL
    - name: occurredAt
      type: timestamp
      constraints:
      - NOT_NULL
  CircleOutboxSequence:
    fields:
    - name: _id
      type: string
      constraints:
      - PK
      - NOT_NULL
    - name: sequence
      type: int64
      constraints:
      - NOT_NULL
  CircleCommandResult:
    description: Circle 聚合命令的稳定提交回执。
    fields:
    - name: circleId
      source: circleId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: version
      source: version
      type: int64
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: status
      source: status
      type: enum
      enum_ref: CircleStatus
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: idempotentReplay
      source: idempotentReplay
      type: boolean
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  CircleSectionConfig:
    description: 圈子主页板块配置项（嵌入文档，非独立集合）
    embedded: true
    fields:
    - name: sectionType
      source: sectionType
      type: enum
      enum_ref: CircleSectionType
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read_write
      ops_exposure: read
      description: 板块类型（works/members/chat/storage/custom）
    - name: visible
      source: visible
      type: boolean
      constraints:
      - NOT_NULL
      - DEFAULT_TRUE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read_write
      ops_exposure: read
    - name: order
      type: int
      constraints:
      - NOT_NULL
      - DEFAULT_0
      classification: PUBLIC
      log_policy: allow
      api_exposure: read_write
      ops_exposure: read
    - name: customTitle
      source: customTitle
      type: string
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read_write
      ops_exposure: read
      description: 自定义板块标题（覆盖默认）
  CircleFacetBucketView:
    description: 群组搜索 facet bucket，用于频道/分类投影视图
