events:
- name: CircleCreated
  description: 圈子创建
  producer: circle-service
  consumers:
  - recommendation-engine
  - notification-service
  - chat-service
  - circle-search-index-projector
  channel: event_store
  payload_entity: Circle
  payload_fields:
  - _id
  - name
  - ownerId
  - category
  - tags
  - rulesText
  - welcomeMessage
  - iconUrl
  - autoSyncChat
  recommend_impact: circle_index_refresh
- name: CircleUpdated
  description: 圈子信息更新
  producer: circle-service
  consumers:
  - recommendation-engine
  - circle-search-index-projector
  channel: event_store
  payload_entity: Circle
  payload_fields:
  - _id
  - name
  - description
  - rulesText
  - welcomeMessage
  - iconUrl
  - autoSyncChat
  - tags
  - category
- name: CircleArchived
  description: 圈子归档
  producer: circle-service
  consumers:
  - recommendation-engine
  - notification-service
  - circle-search-index-projector
  channel: event_store
  payload_entity: Circle
  payload_fields:
  - _id
  - status
- name: CircleSectionsUpdated
  description: 圈子板块配置更新
  producer: circle-service
  consumers: []
  channel: event_store
  no_consumer_reason: Circle aggregate state is the only read source; the event is retained for audit/replay and has no independent service projection.
  payload_entity: Circle
  payload_fields:
  - circleId
  - sectionConfig
