events:
- name: CircleCreated
  description: '圈子创建

    非 canonical 结构字段迁移注记：recommend_impact="circle_index_refresh"。'
  delivery_semantics: transactional_outbox
  wire_event_type: CircleCreated
  payload_entity: Circle
  payload_fields:
  - id
  - name
  - ownerId
  - category
  - tags
  - rulesText
  - welcomeMessage
  - iconUrl
  - autoSyncChat
- name: CircleUpdated
  description: 圈子信息更新
  delivery_semantics: transactional_outbox
  wire_event_type: CircleUpdated
  payload_entity: Circle
  payload_fields:
  - id
  - name
  - description
  - rulesText
  - welcomeMessage
  - iconUrl
  - autoSyncChat
  - tags
  - category
- name: CircleArchived
  description: 圈子归档
  delivery_semantics: transactional_outbox
  wire_event_type: CircleArchived
  payload_entity: Circle
  payload_fields:
  - id
  - status
- name: CircleSectionsUpdated
  description: 圈子板块配置更新
  delivery_semantics: transactional_event_log
  payload_entity: Circle
  payload_fields:
  - circleId
  - sectionConfig
  no_consumer_reason: Circle aggregate state is the only read source; the event is retained for audit/replay and has no independent
    service projection.
