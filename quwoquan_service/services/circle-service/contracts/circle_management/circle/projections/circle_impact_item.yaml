read_model: CircleImpactItem
description: '圈子影响单条事实（「圈子影响」模块行真相源）。

  云侧按真实下游动作聚合连接型结果，并产出 primaryText 结论句

  （如「328人在这里建立了新连接」「189人加入相关圈子」）。

  端只读直出，禁止本地拼装文案（全局验收 G2）；禁止下发收藏、关注内容、稍后看等内容长期动作。

  与 AuthorImpactItem / IntersectionReason 单通道对齐，禁止保留 displayText 第二文案字段。

  '
consumers:
- app
fields:
- name: helpType
  type: string
- name: action
  type: string
- name: intersectionDimension
  type: string
- name: tagRef
  type: string
- name: source
  type: string
- name: count
  type: int64
- name: primaryText
  type: string
- name: subtitleText
  type: string
- name: impactId
  type: string
- name: primarySpans
  type: '[]IntersectionTextSpan'
- name: sampleVisuals
  type: '[]IntersectionVisual'
- name: representativeActor
  type: IntersectionRepresentativeActor
  nullable: true
- name: actionHints
  type: '[]IntersectionActionHint'
- name: countTarget
  type: IntersectionTarget
  nullable: true
- name: evidenceSnapshotId
  type: string
- name: countObjectKind
  type: string
- name: propagationPath
  type: IntersectionPropagationPath
  nullable: true
- name: iconKey
  type: string
