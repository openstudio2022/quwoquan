read_model: CircleStatsWire
description: '圈子统计接口 `GetCircleStats` 的稳定响应投影。

  只允许下列 canonical wire keys；禁止 `totalMembers`、`weeklyActive`、

  `totalPosts`、`totalDiscussions` 或其他 alias。

  '
consumer: app
client_projection:
  dart_class: CircleStatsWireDto
  base_class: ''
  output_path: cloud/runtime/generated/circle/circle_stats_wire_dto.dart
  fields:
  - name: circleId
    dart_type: String
    nullable: false
    source: circleId
    default: ''''''
  - name: memberCount
    dart_type: int
    nullable: false
    source: memberCount
    default: '0'
  - name: postCount
    dart_type: int
    nullable: false
    source: postCount
    default: '0'
  - name: discussionCount
    dart_type: int
    nullable: false
    source: discussionCount
    default: '0'
  - name: weeklyActiveCount
    dart_type: int
    nullable: false
    source: weeklyActiveCount
    default: '0'
  - name: likeCount
    dart_type: int
    nullable: false
    source: likeCount
    default: '0'
  - name: storageUsedBytes
    dart_type: int
    nullable: false
    source: storageUsedBytes
    default: '0'
  - name: storageQuotaBytes
    dart_type: int
    nullable: false
    source: storageQuotaBytes
    default: '0'
