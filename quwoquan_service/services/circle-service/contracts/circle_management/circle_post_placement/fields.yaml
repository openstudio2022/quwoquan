description: Circle Feed 中的权威 Post 放置关系。
fields:
  - name: _id
    type: ObjectId
    constraints:
      - PK
      - NOT_NULL
    role: authoritative_state
  - name: version
    type: int64
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: postId
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: ownerPersonaId
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: circleId
    type: ObjectId
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: groupId
    type: ObjectId
    constraints:
      - NULLABLE
    role: authoritative_state
    reference: true
  - name: state
    type: enum
    enum_ref: CirclePostPlacementState
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: pinned
    type: bool
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: pinnedAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: featured
    type: bool
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: featuredAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: lastActiveAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
types:
  PlacePostInCircleRequest:
    description: 创建圈内放置的强类型命令输入。
    fields:
      - name: postId
        type: string
        constraints:
          - NOT_NULL
      - name: groupId
        type: string
        constraints:
          - NULLABLE
  UpdateCirclePostPlacementRequest:
    description: 更新放置运营状态的强类型命令输入。
    fields:
      - name: enabled
        type: bool
        constraints:
          - NOT_NULL
  CirclePostPlacementCommandResult:
    description: 放置命令提交回执。
    fields:
      - name: placementId
        type: string
        constraints:
          - NOT_NULL
      - name: version
        type: int64
        constraints:
          - NOT_NULL
      - name: state
        type: string
        constraints:
          - NOT_NULL
      - name: idempotentReplay
        type: bool
        constraints:
          - NOT_NULL
  CirclePostPlacementCommandReceipt:
    description: actor-scoped idempotency receipt；不是业务聚合成员。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: commandDigest
        type: string
        constraints:
          - NOT_NULL
      - name: placementId
        type: string
        constraints:
          - NOT_NULL
      - name: version
        type: int64
        constraints:
          - NOT_NULL
      - name: state
        type: enum
        enum_ref: CirclePostPlacementState
        constraints:
          - NOT_NULL
      - name: expiresAt
        type: timestamp
        constraints:
          - NOT_NULL
  CirclePostPlacementOutbox:
    description: 与聚合提交同事务写入的待投递事件。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: eventType
        type: string
        constraints:
          - NOT_NULL
      - name: aggregateId
        type: string
        constraints:
          - NOT_NULL
      - name: aggregateVersion
        type: int64
        constraints:
          - NOT_NULL
      - name: outboxSequence
        type: int64
        constraints:
          - NOT_NULL
      - name: payloadJson
        type: string
        constraints:
          - NOT_NULL
      - name: occurredAt
        type: timestamp
        constraints:
          - NOT_NULL
  CirclePostPlacementOutboxSequence:
    description: placement outbox 的事务内全局序号分配器。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: sequence
        type: int64
        constraints:
          - NOT_NULL
  CirclePostPlacementProjectionCheckpoint:
    description: 每个 placement outbox 消费者的持久水位。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: sequence
        type: int64
        constraints:
          - NOT_NULL
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
  CirclePostPlacementProjectionInbox:
    description: placement 本地投影已应用事件集合。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: aggregateId
        type: string
        constraints:
          - NOT_NULL
      - name: aggregateVersion
        type: int64
        constraints:
          - NOT_NULL
      - name: appliedAt
        type: timestamp
        constraints:
          - NOT_NULL
  CirclePostOwnerView:
    description: Circle placement 授权所需的最小 Post 外部引用投影。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: ownerPersonaId
        type: string
        constraints:
          - NOT_NULL
      - name: state
        type: string
        constraints:
          - NOT_NULL
      - name: postVersion
        type: int64
        constraints:
          - NOT_NULL
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
  CircleContentPostInbox:
    description: Circle 已应用的 Content Post lifecycle eventId。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: postId
        type: string
        constraints:
          - NOT_NULL
      - name: postVersion
        type: int64
        constraints:
          - NOT_NULL
      - name: appliedAt
        type: timestamp
        constraints:
          - NOT_NULL
  CircleContentPostFailure:
    description: Content Post pending message 的持久失败计数。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
      - name: eventId
        type: string
        constraints:
          - NOT_NULL
      - name: attempts
        type: int64
        constraints:
          - NOT_NULL
      - name: lastError
        type: string
        constraints:
          - NOT_NULL
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
  PinCirclePostCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: placementId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: enabled
        type: bool
        client_dart_type: bool
  PlaceCirclePostCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: postId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: groupId
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
  RemoveCirclePostCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: placementId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  FeatureCirclePostCommand:
    fields:
      - name: circleId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: placementId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: enabled
        type: bool
        client_dart_type: bool
