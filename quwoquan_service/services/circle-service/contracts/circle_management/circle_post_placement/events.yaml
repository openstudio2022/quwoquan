events:
- name: CirclePostPlaced
  delivery_semantics: transactional_outbox
  wire_event_type: CirclePostPlaced
  payload_entity: CirclePostPlacement
  payload_fields:
  - _id
  - version
  - postId
  - ownerPersonaId
  - circleId
  - groupId
  - state
  - createdAt
- name: CirclePostPlacementRemoved
  delivery_semantics: transactional_outbox
  wire_event_type: CirclePostPlacementRemoved
  payload_entity: CirclePostPlacement
  payload_fields:
  - _id
  - version
  - postId
  - circleId
  - groupId
  - state
  - updatedAt
- name: CirclePostPlacementPresentationChanged
  delivery_semantics: transactional_outbox
  wire_event_type: CirclePostPlacementPresentationChanged
  payload_entity: CirclePostPlacement
  payload_fields:
  - _id
  - version
  - postId
  - circleId
  - pinned
  - pinnedAt
  - featured
  - featuredAt
  - updatedAt
