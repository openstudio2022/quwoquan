backend: mongodb
collections:
  circle_post_placements:
    entity: CirclePostPlacement
    role: authoritative
    indexes:
    - name: idx_circle_post_placement_identity
      keys:
        postId: 1
        circleId: 1
        groupId: 1
      unique: true
    - name: idx_circle_post_placement_feed
      keys:
        circleId: 1
        state: 1
        pinned: -1
        featured: -1
        lastActiveAt: -1
  circle_post_placement_command_receipts:
    entity: CirclePostPlacementCommandReceipt
    role: authoritative
    indexes:
    - name: idx_circle_post_placement_receipt_key
      keys:
        _id: 1
      unique: true
    - name: idx_circle_post_placement_receipt_expiry
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
  circle_post_placement_outbox:
    entity: CirclePostPlacementOutbox
    role: append_only
    indexes:
    - name: idx_circle_post_placement_outbox_event
      keys:
        _id: 1
      unique: true
    - name: idx_circle_post_placement_outbox_version
      keys:
        aggregateId: 1
        aggregateVersion: 1
      unique: true
    - name: idx_circle_post_placement_outbox_sequence
      keys:
        outboxSequence: 1
      unique: true
  circle_post_placement_outbox_sequences:
    entity: CirclePostPlacementOutboxSequence
    role: authoritative
    description: 与 placement 事务内分配的全局单调 outbox sequence；只允许原子递增。
  circle_post_placement_projection_checkpoints:
    entity: CirclePostPlacementProjectionCheckpoint
    role: projection
    description: 每个外部传输或本地读模型消费者的独立 durable checkpoint。
    indexes:
    - name: idx_circle_post_placement_checkpoint_consumer
      keys:
        _id: 1
      unique: true
  circle_post_placement_projection_inbox:
    entity: CirclePostPlacementProjectionInbox
    role: append_only
    description: placement 计数投影的 eventId inbox，防止 checkpoint 写入前崩溃导致重复增减。
    indexes:
    - name: idx_circle_post_placement_projection_inbox_event
      keys:
        _id: 1
      unique: true
  circle_post_owner_views:
    entity: CirclePostOwnerView
    role: projection
    description: Circle 对 Content Post 的具名外部引用投影，仅保存 placement 授权所需 owner/state/version。
    indexes:
    - name: idx_circle_post_owner_view_state
      keys:
        state: 1
        updatedAt: -1
  circle_feed_items:
    entity: CircleFeedItemView
    role: projection
    description: Content Post lifecycle typed fact 在 Circle 边界形成的本地展示投影；圈子 feed 只能读取本集合，禁止读取 Content 的 posts。
    indexes:
    - name: idx_circle_feed_item_author_state
      keys:
        authorId: 1
        status: 1
        updatedAt: -1
  circle_content_post_inbox:
    entity: CircleContentPostInbox
    role: append_only
    description: Content Post lifecycle consumer 的 eventId 去重 inbox，与 owner view 在同一 Mongo transaction
      提交。
    indexes:
    - name: idx_circle_content_post_inbox_event
      keys:
        _id: 1
      unique: true
  circle_content_post_failures:
    entity: CircleContentPostFailure
    role: append_only
    description: pending reclaim 的持久失败次数与最后错误；达到上限后写 DLQ 并清除。
role: authoritative
