description: CirclePostPlacement 对象专属 Command Facade。
commercial_defaults:
  status: blocked
  block_reason: 新增 operation 需按 B4 商用水位补齐三层证据后逐个翻牌
  gap_id: CIRCLE_POST_PLACEMENT_WIRING
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /circles/{circleId}/post-placements
    operation: PlacePostInCircle
    request_bindings:
      path:
        - name: circleId
          field: circleId
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: CirclePostPlacementCommandFacade
      method: place
      aggregate_owner: CirclePostPlacement
      mutation_target: CirclePostPlacement
      invariant_target: CirclePostPlacement
    request_entity: PlaceCirclePostCommand
    response_entity: CirclePostPlacementCommandResult
    security:
      auth_mode: required
    authorization:
      principal: persona
      ownership_policy: post_owner_or_circle_moderator
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    response_fields:
      - placementId
      - version
      - state
      - idempotentReplay
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.permission_denied
      - CIRCLE.USER.placement_already_exists
      - CIRCLE.USER.placement_idempotency_conflict
      - CIRCLE.SYSTEM.placement_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_post_placement_place
      trace: true
      attributes:
        - outcome
        - actor_role
    slo:
      latency_p95_ms: 600
      availability_percent: 99.9
    request_body_kind: object
  - method: DELETE
    path: /circles/{circleId}/post-placements/{placementId}
    operation: RemovePostFromCircle
    request_bindings:
      path:
        - name: circleId
          field: circleId
        - name: placementId
          field: placementId
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: CirclePostPlacementCommandFacade
      method: remove
      aggregate_owner: CirclePostPlacement
      mutation_target: CirclePostPlacement
      invariant_target: CirclePostPlacement
    response_entity: CirclePostPlacementCommandResult
    security:
      auth_mode: required
    authorization:
      principal: persona
      ownership_policy: post_owner_or_circle_moderator
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CIRCLE.USER.placement_not_found
      - CIRCLE.USER.permission_denied
      - CIRCLE.USER.placement_version_conflict
      - CIRCLE.USER.placement_idempotency_conflict
      - CIRCLE.SYSTEM.placement_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_post_placement_remove
      trace: true
      attributes:
        - outcome
        - actor_role
    slo:
      latency_p95_ms: 600
      availability_percent: 99.9
    description: 删除是服务端加载当前版本并重放的命名状态迁移；幂等键只来自 OperationInvocationContext。
    request_entity: RemoveCirclePostCommand
    request_body_kind: none
  - method: PATCH
    path: /circles/{circleId}/post-placements/{placementId}/pin
    operation: PinCirclePost
    request_bindings:
      path:
        - name: circleId
          field: circleId
        - name: placementId
          field: placementId
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: CirclePostPlacementCommandFacade
      method: setPinned
      aggregate_owner: CirclePostPlacement
      mutation_target: CirclePostPlacement
      invariant_target: CirclePostPlacement
    request_entity: PinCirclePostCommand
    response_entity: CirclePostPlacementCommandResult
    security:
      auth_mode: required
    authorization:
      principal: persona
      ownership_policy: circle_moderator
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CIRCLE.USER.placement_not_found
      - CIRCLE.USER.permission_denied
      - CIRCLE.USER.placement_version_conflict
      - CIRCLE.USER.placement_idempotency_conflict
      - CIRCLE.SYSTEM.placement_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_post_placement_pin
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 600
      availability_percent: 99.9
    request_body_kind: object
  - method: PATCH
    path: /circles/{circleId}/post-placements/{placementId}/feature
    operation: FeatureCirclePost
    request_bindings:
      path:
        - name: circleId
          field: circleId
        - name: placementId
          field: placementId
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: CirclePostPlacementCommandFacade
      method: setFeatured
      aggregate_owner: CirclePostPlacement
      mutation_target: CirclePostPlacement
      invariant_target: CirclePostPlacement
    request_entity: FeatureCirclePostCommand
    response_entity: CirclePostPlacementCommandResult
    security:
      auth_mode: required
    authorization:
      principal: persona
      ownership_policy: circle_moderator
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CIRCLE.USER.placement_not_found
      - CIRCLE.USER.permission_denied
      - CIRCLE.USER.placement_version_conflict
      - CIRCLE.USER.placement_idempotency_conflict
      - CIRCLE.SYSTEM.placement_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_post_placement_feature
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 600
      availability_percent: 99.9
    request_body_kind: object
