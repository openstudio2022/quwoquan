backend: mongodb
collections:
  circle_memberships:
    publication_role: not_published
    entity: CircleMembership
    role: authoritative
    indexes:
    - name: idx_circle_membership_identity
      keys:
        circleId: 1
        personaId: 1
      unique: true
    - name: idx_circle_membership_roster
      keys:
        circleId: 1
        state: 1
        joinedAt: 1
        _id: 1
    - name: idx_circle_membership_persona
      keys:
        personaId: 1
        state: 1
        joinedAt: -1
        _id: 1
  circle_membership_command_receipts:
    publication_role: not_published
    entity: CircleMembershipCommandReceipt
    role: authoritative
    indexes:
    - name: idx_circle_membership_receipt_expiry
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  circle_membership_outbox:
    publication_role: transactional_outbox
    entity: CircleMembershipOutbox
    role: append_only
    indexes:
    - name: idx_circle_membership_outbox_version
      keys:
        aggregateId: 1
        aggregateVersion: 1
      unique: true
    - name: idx_circle_membership_outbox_sequence
      keys:
        outboxSequence: 1
      unique: true
  circle_membership_outbox_sequences:
    publication_role: publication_accessory
    entity: CircleMembershipOutboxSequence
    role: authoritative
  circle_membership_projection_checkpoints:
    publication_role: publication_accessory
    entity: CircleMembershipProjectionCheckpoint
    role: projection
  circle_membership_projection_inbox:
    publication_role: publication_accessory
    entity: CircleMembershipProjectionInbox
    role: append_only
role: authoritative
