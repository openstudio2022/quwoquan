description: 单一 Persona 在 Circle 中的权威成员关系聚合。
fields:
  - name: _id
    type: string
    constraints:
      - PK
      - NOT_NULL
    role: authoritative_state
  - name: version
    type: int64
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: circleId
    type: ObjectId
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: personaId
    type: string
    constraints:
      - NOT_NULL
    role: authoritative_state
    reference: true
  - name: role
    type: enum
    enum_ref: CircleMemberRole
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: state
    type: enum
    enum_ref: CircleMembershipState
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: joinedAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: leftAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: lastActiveAt
    type: timestamp
    constraints:
      - NULLABLE
    role: authoritative_state
  - name: contribution
    type: int64
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
  - name: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    role: authoritative_state
types:
  CircleMembershipLifecyclePayload:
    description: 六类membership事件共同的owner公开载荷，由membershipEventPayload一次序列化，不从聚合_id推导wire别名。id为真实membership身份且等于envelope aggregateId，version为同次提交版本且等于aggregateVersion；role/state沿用本owner枚举。id/version/circleId/personaId/role/state/joinedAt/createdAt/updatedAt必须存在。joinedAt未实际加入为显式null，不以createdAt或当前时间补造；首次Requested/Rejected可为null，再次申请保留真实历史加入时间。leftAt仅真实退出时出现，否则省略；circleOwnerPersonaId仅事务内读到非空圈主时出现，否则省略；这两个可选字段允许null解码但producer不发null或空字符串。createdAt/updatedAt来自已验证ChangeSet的非零UTC时间，额外字段拒绝。
    fields:
      - {name: id, type: string, constraints: [NOT_NULL]}
      - {name: version, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: circleId, type: ObjectId, constraints: [NOT_NULL]}
      - {name: personaId, type: string, constraints: [NOT_NULL]}
      - {name: role, type: enum, enum_ref: CircleMemberRole, constraints: [NOT_NULL]}
      - {name: state, type: enum, enum_ref: CircleMembershipState, constraints: [NOT_NULL]}
      - {name: joinedAt, type: timestamp, constraints: [NULLABLE]}
      - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: leftAt, type: timestamp, constraints: [NULLABLE]}
      - {name: circleOwnerPersonaId, type: string, constraints: [NULLABLE]}
  CircleMembershipCommandResult:
    description: Membership 命令的稳定提交回执。
    fields:
      - name: membershipId
        type: string
        constraints:
          - NOT_NULL
      - name: version
        type: int64
        constraints:
          - NOT_NULL
      - name: state
        type: enum
        enum_ref: CircleMembershipState
        constraints:
          - NOT_NULL
      - name: role
        type: enum
        enum_ref: CircleMemberRole
        constraints:
          - NOT_NULL
      - name: idempotentReplay
        type: bool
        constraints:
          - NOT_NULL
  CircleMembershipSlice:
    description: CircleMembershipReader 返回的强类型只读切片；不暴露 Mongo _id 或允许跨边界修改聚合。
    fields:
      - name: membershipId
        type: string
        constraints:
          - NOT_NULL
      - name: version
        type: int64
        constraints:
          - NOT_NULL
      - name: circleId
        type: ObjectId
        constraints:
          - NOT_NULL
      - name: personaId
        type: string
        constraints:
          - NOT_NULL
      - name: role
        type: enum
        enum_ref: CircleMemberRole
        constraints:
          - NOT_NULL
      - name: state
        type: enum
        enum_ref: CircleMembershipState
        constraints:
          - NOT_NULL
      - name: joinedAt
        type: timestamp
        constraints:
          - NOT_NULL
      - name: leftAt
        type: timestamp
        constraints:
          - NULLABLE
      - name: lastActiveAt
        type: timestamp
        constraints:
          - NULLABLE
      - name: contribution
        type: int64
        constraints:
          - NOT_NULL
      - name: createdAt
        type: timestamp
        constraints:
          - NOT_NULL
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
  CircleMembershipPageSlice:
    description: CircleMembershipReader 的稳定游标分页结果。
    fields:
      - name: items
        type: '[]CircleMembershipSlice'
        constraints:
          - NOT_NULL
      - name: cursor
        type: string
        constraints:
          - NULLABLE
  PersonaCircleSlice:
    description: PersonaCircleReader 返回的公开 Circle 摘要投影；它不是 Circle 聚合且不暴露存储字段名。
    fields:
      - name: circleId
        type: ObjectId
        constraints:
          - NOT_NULL
      - name: name
        type: string
        constraints:
          - NOT_NULL
      - name: description
        type: string
        constraints:
          - NULLABLE
      - name: coverUrl
        type: string
        constraints:
          - NULLABLE
      - name: iconUrl
        type: string
        constraints:
          - NULLABLE
      - name: ownerPersonaId
        type: string
        constraints:
          - NOT_NULL
      - name: ownerDisplayNameSnapshot
        type: string
        constraints:
          - NULLABLE
      - name: category
        type: string
        constraints:
          - NULLABLE
      - name: subCategory
        type: string
        constraints:
          - NULLABLE
      - name: tags
        type: '[]string'
        constraints:
          - NULLABLE
      - name: memberCount
        type: int64
        constraints:
          - NOT_NULL
      - name: postCount
        type: int64
        constraints:
          - NOT_NULL
      - name: weeklyActiveCount
        type: int64
        constraints:
          - NOT_NULL
      - name: status
        type: enum
        enum_ref: CircleStatus
        constraints:
          - NOT_NULL
      - name: visibility
        type: enum
        enum_ref: CircleVisibility
        constraints:
          - NOT_NULL
      - name: joinPolicy
        type: enum
        enum_ref: CircleJoinPolicy
        constraints:
          - NOT_NULL
      - name: kind
        type: enum
        enum_ref: CircleKind
        constraints:
          - NOT_NULL
      - name: displaySubjectType
        type: enum
        enum_ref: CircleDisplaySubjectType
        constraints:
          - NOT_NULL
      - name: followEnabled
        type: bool
        constraints:
          - NOT_NULL
      - name: defaultPublicGroupId
        type: string
        constraints:
          - NULLABLE
      - name: linkedHomepageId
        type: string
        constraints:
          - NULLABLE
      - name: linkedHomepageType
        type: enum
        enum_ref: HomepageType
        constraints:
          - NULLABLE
      - name: linkedHomepageTitle
        type: string
        constraints:
          - NULLABLE
      - name: createdAt
        type: timestamp
        constraints:
          - NOT_NULL
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
  PersonaCirclePageSlice:
    description: PersonaCircleReader 的稳定游标分页结果。
    fields:
      - name: items
        type: '[]PersonaCircleSlice'
        constraints:
          - NOT_NULL
      - name: cursor
        type: string
        constraints:
          - NULLABLE
  UpdateCircleMembershipRoleRequest:
    description: 管理员变更目标 membership 角色的强类型命令。
    fields:
      - name: role
        type: enum
        enum_ref: CircleMemberRole
        constraints:
          - NOT_NULL
  CircleMembershipCommandReceipt:
