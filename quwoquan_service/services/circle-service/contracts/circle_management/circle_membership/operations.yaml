contract_test:
  coverage_requirements:
    - aggregate invariants and version conflicts covered
    - generated authorization rejects forged actor headers
    - aggregate, command receipt and outbox commit in one real Mongo transaction
    - every sink owns an independent durable checkpoint
    - replay cannot double-apply Circle memberCount or stream side effects
  test_strategy:
    service_side:
      description: 使用 MongoDB 7 replica set 与 Redis 7 testcontainers，不 mock Store、outbox、投影或消息链路
      real_engines:
        mongodb: testcontainers (mongo:7 replica set)
        redis: testcontainers (redis:7)
      data_management:
        seed: 仅插入目标 Circle policy projection；CircleMembership 必须经真实 HTTP Command Facade 创建
        cleanup: DeleteMany all circle_membership_* collections and FLUSHDB isolated Redis
      scenarios:
        - name: membership_transaction_and_replay
          commands:
            - JoinCircle
            - LeaveCircle
          assertions:
            - forged actor header returns 401 before persistence
            - same Idempotency-Key and semantic command returns idempotentReplay=true
            - same Idempotency-Key with another command returns CIRCLE.USER.membership_idempotency_conflict
            - circle_memberships, command receipt and outbox counts remain unique
        - name: membership_projection_and_stream
          commands:
            - JoinCircle
            - LeaveCircle
            - replay
          assertions:
            - Circle.memberCount converges once
            - projection inbox prevents duplicate increments
            - failed or replayed sink never shares another sink checkpoint
            - events.circle.memberships contains typed immutable envelopes
        - name: owner_and_moderator_invariants
          commands:
            - JoinCircle
            - LeaveCircle
            - UpdateCircleMembershipRole
          assertions:
            - owner cannot leave
            - only owner or active admin can change a non-owner role
