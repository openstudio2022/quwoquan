kind: aggregate_root
description: 单一 Persona 在 Circle 中的加入状态、角色与贡献水位聚合。
identity:
  fields:
  - _id
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: command_facade
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: circle
  on_delete: tombstone
  reference_fields:
  - circleId
  target_object: circle.Circle
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: persona
  on_delete: tombstone
  reference_fields:
  - personaId
  target_object: user.Persona
capabilities:
- commandable
- queryable
- idempotent_commands
business_rules:
- identity 固定为 circleId + personaId
- 同一 persona 在同一 circle 只有一个 membership
- owner membership 不得自行 leave，管理员变更不得移除最后一个 owner
- role 变更必须由 Circle 治理策略授权
- membership 不直接修改 Circle memberCount，只发布事件供投影收敛
- joinPolicy=approval 的圈子 Join 进入 pending；Approve/Reject 仅 owner/active admin，且只对 pending 态生效（否则 membership_state_conflict）
- Approve 达成 active 发布 CircleMembershipJoined；Reject 发布 CircleMembershipRejected，被拒 persona 可重新申请
lifecycle:
  states:
  - pending
  - active
  - rejected
  - left
  - removed
  optimistic_concurrency: version
  idempotency: command_receipt
