events:
- name: CircleMembershipRequested
  delivery_semantics: transactional_outbox
  payload_entity: CircleMembership
  payload_fields:
  - id
  - version
  - circleId
  - circleOwnerPersonaId
  - personaId
  - role
  - state
  - createdAt
- name: CircleMembershipJoined
  delivery_semantics: transactional_outbox
  payload_entity: CircleMembership
  payload_fields:
  - id
  - version
  - circleId
  - circleOwnerPersonaId
  - personaId
  - role
  - state
  - joinedAt
- name: CircleMembershipApproved
  delivery_semantics: transactional_outbox
  payload_entity: CircleMembership
  payload_fields:
  - id
  - version
  - circleId
  - circleOwnerPersonaId
  - personaId
  - role
  - state
  - joinedAt
- name: CircleMembershipLeft
  delivery_semantics: transactional_outbox
  payload_entity: CircleMembership
  payload_fields:
  - id
  - version
  - circleId
  - circleOwnerPersonaId
  - personaId
  - role
  - state
  - leftAt
- name: CircleMembershipRoleChanged
  delivery_semantics: transactional_outbox
  payload_entity: CircleMembership
  payload_fields:
  - id
  - version
  - circleId
  - personaId
  - role
  - state
  - updatedAt
- name: CircleMembershipRejected
  delivery_semantics: transactional_outbox
  payload_entity: CircleMembership
  payload_fields:
