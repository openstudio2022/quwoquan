    path: /circles/{circleId}/files/{fileId}
    operation: DeleteCircleFile
    request_bindings:
      path:
        - name: circleId
          field: circleId
        - name: fileId
          field: fileId
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
      kind: command
      facet: CircleFileCommandFacet
      method: deleteCircleFile
      aggregate_owner: CircleFile
      mutation_target: CircleFile
      invariant_target: CircleFile
    response_entity: CircleFileCommandResult
    authorization:
      principal: persona
      ownership_policy: uploader_or_space_manager
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.USER.permission_denied
      - CIRCLE.USER.file_not_found
      - CIRCLE.USER.file_version_conflict
      - CIRCLE.USER.file_idempotency_conflict
      - CIRCLE.SYSTEM.file_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_file_delete
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 700
      availability_percent: 99.9
    request_entity: DeleteCircleFileCommand
    request_body_kind: none
contract_test:
  coverage_requirements:
    - file 只能引用 actor 自己已 ready 的 MediaAsset，folder 禁止 assetId
    - CircleFile 只保存 assetId，不暴露 object key、上传凭证或 storage URL
    - parentFolderId 必须属于同一 Circle 和可选 Group，目录环与跨空间父引用被拒绝
    - aggregate、version、command receipt 与 outbox 在同一真实 Mongo transaction 提交
    - list/get 通过 named Reader 返回 typed Slice，并覆盖 Circle/Group membership BOLA
    - App Remote、alpha fixture 与真实页面使用同一 typed contract，旧 Repository/DTO 不可达
  test_strategy:
    service_side:
      description: MongoDB 7 replica set、Redis 7 与真实 Content MediaAsset owner Reader；不 mock Store/outbox/Reader
      real_engines:
        mongodb: testcontainers (mongo:7 replica set)
        redis: testcontainers (redis:7)
      data_management:
        seed: 仅创建目标 Circle、CircleMembership、可选 CircleGroupMembership 与真实 ready MediaAsset
        cleanup: DeleteMany all circle_file_* collections and FLUSHDB isolated Redis
      scenarios:
        - name: circle_file_transaction_and_replay
          commands:
            - CreateCircleFile
            - UpdateCircleFile
            - DeleteCircleFile
          assertions:
            - same Idempotency-Key and digest replays one receipt
            - changed digest with same key returns CIRCLE.USER.file_idempotency_conflict
            - stale If-Match returns CIRCLE.USER.file_version_conflict
            - state, receipt and outbox remain unique
        - name: circle_file_reader_and_bola
          commands:
            - ListCircleFiles
            - GetCircleFile
          assertions:
            - non-member and wrong group member cannot enumerate file metadata
            - owner mismatch and non-ready MediaAsset are rejected before commit
            - Reader response contains no objectKey, uploadUrl or actor alias
