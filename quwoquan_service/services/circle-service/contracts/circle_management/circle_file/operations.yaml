description: CircleFile 对象专属 command/query packet；上传统一由 Media bounded context 完成。
commercial_defaults:
  status: blocked
  block_reason: 新增 operation 需按 B4 商用水位补齐三层证据后逐个翻牌
  gap_id: CIRCLE_FILE_COMMERCIAL_CLOSURE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: GET
    path: /circles/{circleId}/files
    operation: ListCircleFiles
    pagination: {default_items: 20, maximum_items: 100}
    request_bindings:
      path:
        - name: circleId
          field: circleId
      query:
        - name: groupId
          field: groupId
          required: false
        - name: parentFolderId
          field: parentFolderId
          required: false
        - name: cursor
          field: cursor
          required: false
        - name: limit
          field: limit
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
      kind: query
      facet: CircleFileQueryFacet
      method: listCircleFiles
      reader: CircleFileReader
      slice: CircleFilePageSlice
    response_entity: CircleFilePageSlice
    authorization:
      principal: persona
      ownership_policy: active_circle_and_optional_group_member
    reliability:
      timeout_ms: 1000
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.SYSTEM.file_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_file_list
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    request_entity: CircleFileListQuery
    request_body_kind: none
  - method: POST
    path: /circles/{circleId}/files
    operation: CreateCircleFile
    request_bindings:
      path:
        - name: circleId
          field: circleId
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
      kind: command
      facet: CircleFileCommandFacet
      method: createCircleFile
      aggregate_owner: CircleFile
      mutation_target: CircleFile
      invariant_target: CircleFile
    response_entity: CircleFileCommandResult
    authorization:
      principal: persona
      ownership_policy: active_circle_and_optional_group_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.USER.file_parent_invalid
      - CIRCLE.USER.file_asset_invalid
      - CIRCLE.USER.storage_quota_exceeded
      - CIRCLE.USER.file_idempotency_conflict
      - CIRCLE.SYSTEM.file_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_file_create
      trace: true
      attributes:
        - outcome
        - file_type
    slo:
      latency_p95_ms: 900
      availability_percent: 99.9
    request_entity: CreateCircleFileCommand
    request_body_kind: object
  - method: GET
    path: /circles/{circleId}/files/{fileId}
    operation: GetCircleFile
    request_bindings:
      path:
        - name: circleId
          field: circleId
        - name: fileId
          field: fileId
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    application:
      kind: query
      facet: CircleFileQueryFacet
      method: getCircleFile
      reader: CircleFileDetailReader
      slice: CircleFileSlice
    response_entity: CircleFileSlice
    authorization:
      principal: persona
      ownership_policy: active_circle_and_file_group_member
    reliability:
      timeout_ms: 1000
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.USER.file_not_found
      - CIRCLE.SYSTEM.file_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_file_get
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 350
      availability_percent: 99.9
    request_entity: CircleFileQuery
    request_body_kind: none
  - method: PATCH
    path: /circles/{circleId}/files/{fileId}
    operation: UpdateCircleFile
    request_bindings:
      path:
        - name: circleId
          field: circleId
        - name: fileId
          field: fileId
      header:
        - name: If-Match
          field: expectedVersion
    commercial:
      status: ready
    actor: persona
    security:
      auth_mode: required
    concurrency:
      version_precondition: if_match
    application:
      kind: command
      facet: CircleFileCommandFacet
      method: updateCircleFile
      aggregate_owner: CircleFile
      mutation_target: CircleFile
      invariant_target: CircleFile
    response_entity: CircleFileCommandResult
    authorization:
      principal: persona
      ownership_policy: uploader_or_space_manager
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CIRCLE.USER.invalid_argument
      - CIRCLE.USER.not_member
      - CIRCLE.USER.permission_denied
      - CIRCLE.USER.file_not_found
      - CIRCLE.USER.file_parent_invalid
      - CIRCLE.USER.file_version_conflict
      - CIRCLE.USER.file_idempotency_conflict
      - CIRCLE.SYSTEM.file_storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: circle_file_update
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 700
      availability_percent: 99.9
    request_entity: UpdateCircleFileCommand
    request_body_kind: object
