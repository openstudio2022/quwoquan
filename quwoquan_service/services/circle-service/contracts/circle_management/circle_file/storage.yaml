backend: mongodb
collections:
  circle_files:
    publication_role: not_published
    entity: CircleFile
    role: authoritative
  circle_files_command_receipts:
    publication_role: not_published
    entity: CircleFileCommandReceipt
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。
  circle_files_outbox:
    publication_role: transactional_outbox
    entity: CircleFileOutbox
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
  circle_files_outbox_sequences:
    publication_role: publication_accessory
    entity: CircleFileOutboxSequence
    role: authoritative
  circle_files_projection_checkpoints:
    publication_role: publication_accessory
    entity: CircleFileProjectionCheckpoint
    role: projection
  circle_files_quota_locks:
    publication_role: not_published
    entity: CircleFileQuotaLock
    role: authoritative
    description: 仅用于串行化同一 Circle 的容量不变量检查，不承载业务对象状态。
role: authoritative
