events:
- name: CircleFileCreated
  delivery_semantics: transactional_event_log
  payload_entity: CircleFile
  payload_fields:
  - _id
  - version
  - circleId
  - groupId
  - fileType
  - assetId
  - uploaderPersonaId
  - status
  - updatedAt
  no_consumer_reason: 文件创建结果已由 CircleFile 聚合持久化；事件只作为对象级事务审计日志保留，没有下游接收方。
- name: CircleFileUpdated
  delivery_semantics: transactional_event_log
  payload_entity: CircleFile
  payload_fields:
  - _id
  - version
  - circleId
  - groupId
  - parentFolderId
  - name
  - status
  - updatedAt
  no_consumer_reason: 文件更新结果已由 CircleFile 聚合持久化；事件只作为对象级事务审计日志保留，没有下游接收方。
- name: CircleFileDeleted
  delivery_semantics: transactional_event_log
  payload_entity: CircleFile
  payload_fields:
  - _id
  - version
  - circleId
  - groupId
  - assetId
  - status
  - updatedAt
  no_consumer_reason: 文件删除结果已由 CircleFile 聚合持久化；事件只作为对象级事务审计日志保留，没有下游接收方。
