apiVersion: apps/v1
kind: Deployment
metadata:
  name: circle-service
  labels:
    app.kubernetes.io/name: circle-service
  annotations:
    quwoquan.io/config-version: package-required
    quwoquan.io/image-version: package-required
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: circle-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: circle-service
      annotations:
        quwoquan.io/config-version: package-required
        quwoquan.io/image-version: package-required
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: circle-service
          image: quwoquan/circle-service:package-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18082
          envFrom:
            - secretRef:
                name: circle-service-runtime-secrets
          env:
            - name: SERVICE_NAME
              value: circle-service
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['quwoquan.io/environment']
            - name: CONFIG_ROOT
              value: /etc/qwq/config
            - name: CONFIG_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['quwoquan.io/config-version']
            - name: IMAGE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['quwoquan.io/image-version']
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/qwq/config/circle-service.yaml
              subPath: circle-service.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: runtime-config
          configMap:
            name: circle-service-runtime-config
