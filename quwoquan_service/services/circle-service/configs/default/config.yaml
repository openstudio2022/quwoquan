config:
  version: "1.0.0"

service:
  http:
    addr: ":18082"

mongo:
  uri: "mongodb://localhost:27017"
  database: "quwoquan_circle"

redis:
  addr: ""
  password: ""
  db: 0

# Unified search index — WRITE side (circle.search_index_worker).
# circle-service is the indexing producer for the shared ES/OpenSearch index that
# search-service reads; both target the same cluster + index. Endpoints/credentials
# are injected per-env via the shared SEARCH_ES_ENDPOINTS / SEARCH_ES_* env (deploy
# secrets); committed config never hardcodes cluster URLs/secrets. When disabled or
# endpoints empty, the write-time projector is a no-op and the circle write path is
# unaffected.
es:
  enabled: false
  endpoints: []
  index: "quwoquan_objects"
  requestTimeoutMs: 800
  insecureTls: false
  shards: 1
  replicas: 1
  embeddingDims: 0
  synonyms: []
