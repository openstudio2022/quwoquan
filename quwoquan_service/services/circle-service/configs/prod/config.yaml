config:
  min_image_version: "1.0.0"
  max_image_version: "1.99.99"

service:
  http:
    addr: ":18082"

mongo:
  database: "quwoquan_circle"

# prod enables the write-time index; endpoints/credentials come from SEARCH_ES_*.
es:
  enabled: true
  endpoints: []
  index: "quwoquan_objects"
  shards: 3
  replicas: 1
