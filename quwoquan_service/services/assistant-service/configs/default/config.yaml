service:
  name: assistant-service
  http:
    addr: ":18087"

config:
  version: "v0.0.1"
  min_image_version: "0.0.1"
  max_image_version: "9.9.9"

postgres:
  dsn: ""
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime_minutes: 30

mongodb:
  uri: ""
  database: quwoquan_assistant

redis:
  rec:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 0
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 100
      write_timeout_ms: 100
      dial_timeout_ms: 500
  general:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 0
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 200
      write_timeout_ms: 200
      dial_timeout_ms: 500

# app_search 只调用 search-service canonical SearchQuery；检索与引用语义不在助手内复制。
search_service:
  base_url: "http://search-service:18095"
  timeout_ms: 3000

entity_service:
  base_url: "http://entity-service:18084"
  timeout_ms: 3000

content_service:
  base_url: "http://content-service:18080"
  timeout_ms: 3000

# 主动 skill 个性化：读取 user-service 兴趣画像（GET /users/{userId}/interest-profile）。
# 默认空（主动输出不个性化）；各环境可注入真实 user-service 地址。
user_profile:
  base_url: ""
  timeout_ms: 5000

# Assistant 仅通过 typed command client 写 Notification；缺失即启动失败。
notification_service:
  base_url: ""
  timeout_ms: 5000
