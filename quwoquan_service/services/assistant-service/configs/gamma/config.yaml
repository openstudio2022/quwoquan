# gamma overrides (cloud integration env)
service:
  http:
    addr: ":18087"

postgres:
  dsn: "postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable"

mongodb:
  uri: ""
  database: quwoquan_assistant

redis:
  rec:
    mode: standalone
    addr: ""
    db: 0
  general:
    mode: standalone
    addr: ""
    db: 1

model_provider:
  provider: openai_compatible
  base_url: "https://api.xiaomimimo.com/v1"
  model: "mimo-v2-flash"
  api_key_env: "PERSONAL_ASSISTANT_MIMO_API_KEY"
  timeout_ms: 60000

search_provider:
  provider: duckduckgo_html
  timeout_ms: 30000

notification_service:
  base_url: "http://notification-service:18087"
  timeout_ms: 5000
