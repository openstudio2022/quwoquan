types:
  GetSkillCatalogItemQuery:
    description: GetSkillCatalogItem 的 path 与可信 transport 注入参数。
    fields:
    - name: skillId
      source: skillId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: accountId
      source: accountId
      type: string
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: deny
      api_exposure: drop
      ops_exposure: none
  ListSkillsQuery:
    description: ListSkills 的 query 与可信 transport 注入参数。
    fields:
    - name: limit
      source: limit
      type: int
      constraints:
      - NULLABLE
      - POSITIVE
      - MAX_100
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: accountId
      source: accountId
      type: string
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: deny
      api_exposure: drop
      ops_exposure: none
