- {code: ASSISTANT.USER.skill_activity_unauthorized, reason: skill_activity_unauthorized, http_status: 401, emitted_by: [{surface: http, operations: [ListSkillActivities]}], recovery_action: surface, disruption_level: inlineCard, dart_const: skillActivityUnauthorized, go_const: ErrSkillActivityUnauthorized, user_message: {zh: 请先登录后查看 Skill 活动, en: Please sign in to view Skill activity}}
- {code: ASSISTANT.SYSTEM.skill_activity_unavailable, reason: skill_activity_unavailable, http_status: 503, emitted_by: [{surface: http, operations: [ListSkillActivities]}], recovery_action: retry, disruption_level: snackbar, recovery_after_seconds: 3, dart_const: skillActivityUnavailable, go_const: ErrSkillActivityUnavailable, user_message: {zh: Skill 活动暂不可用，请稍后重试, en: Skill activity is temporarily unavailable}}
