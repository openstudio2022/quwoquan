domain: ASSISTANT
aggregate: SkillActivityView
description: Skill 活动查询输入、身份与来源不可用错误。
errors:
- {code: ASSISTANT.USER.skill_activity_invalid_argument, kind: USER, reason: skill_activity_invalid_argument, http_status: 400, emitted_by: [{surface: http, operations: [ListSkillActivities]}], recovery_action: surface, dart_const: skillActivityInvalidArgument, go_const: ErrSkillActivityInvalidArgument, l10n_key: assistant.error.skill_activity_invalid_argument, user_message: {zh: 活动筛选条件无效, en: Skill activity filter is invalid}}
- {code: ASSISTANT.USER.skill_activity_unauthorized, kind: USER, reason: skill_activity_unauthorized, http_status: 401, emitted_by: [{surface: http, operations: [ListSkillActivities]}], recovery_action: surface, dart_const: skillActivityUnauthorized, go_const: ErrSkillActivityUnauthorized, l10n_key: assistant.error.skill_activity_unauthorized, user_message: {zh: 请先登录后查看 Skill 活动, en: Please sign in to view Skill activity}}
- {code: ASSISTANT.SYSTEM.skill_activity_unavailable, kind: SYSTEM, reason: skill_activity_unavailable, http_status: 503, emitted_by: [{surface: http, operations: [ListSkillActivities]}], recovery_action: retry, recovery_after_seconds: 3, dart_const: skillActivityUnavailable, go_const: ErrSkillActivityUnavailable, l10n_key: assistant.error.skill_activity_unavailable, user_message: {zh: Skill 活动暂不可用，请稍后重试, en: Skill activity is temporarily unavailable}}
