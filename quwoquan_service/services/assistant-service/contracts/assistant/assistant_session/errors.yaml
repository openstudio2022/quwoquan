description: 'AssistantSession 聚合错误码。格式：MODULE.KIND.REASON。

  覆盖 AssistantSession 创建、归属校验与幂等重放冲突。

  '
errors:
- code: ASSISTANT.USER.session_unauthorized
  reason: session_unauthorized
  http_status: 401
  emitted_by:
  - surface: http
    operations: [CreateAssistantSession, GetAssistantSession, ListAssistantSessions]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: sessionUnauthorized
  go_const: ErrSessionUnauthorized
  user_message:
    zh: 请先登录后使用助手会话
    en: Please sign in to use assistant sessions
- code: ASSISTANT.USER.session_not_found
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations:
    - GetAssistantSession
    - assistant.assistant_turn_view.ListSessionTurns
    - assistant.assistant_run.StartAssistantRun
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: sessionNotFound
  go_const: ErrSessionNotFound
  user_message:
    zh: 小趣 Session 不存在或已失效
    en: Assistant session not found or expired
- code: ASSISTANT.USER.session_invalid_argument
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [CreateAssistantSession, ListAssistantSessions]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: sessionInvalidArgument
  go_const: ErrSessionInvalidArgument
  user_message:
    zh: 小趣 Session 请求参数有误
    en: Assistant session request is invalid
- code: ASSISTANT.USER.session_idempotency_conflict
  reason: idempotency_conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations: [CreateAssistantSession]
  recovery_action: retry
  disruption_level: snackbar
  dart_const: sessionIdempotencyConflict
  go_const: ErrSessionIdempotencyConflict
  user_message:
    zh: 请求重复提交，请刷新后重试
    en: Duplicate request, please refresh and retry
- code: ASSISTANT.SYSTEM.session_storage_unavailable
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [CreateAssistantSession, ListAssistantSessions, GetAssistantSession]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 3
  dart_const: sessionStorageUnavailable
  go_const: ErrSessionStorageUnavailable
  user_message:
    zh: 小趣 Session 服务暂不可用，请稍后重试
    en: Assistant session service is temporarily unavailable
