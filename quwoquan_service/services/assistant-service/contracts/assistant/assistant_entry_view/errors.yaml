description: AssistantEntryView 身份、查询参数与投影读取错误。
errors:
- code: ASSISTANT.USER.entry_unauthorized
  reason: entry_unauthorized
  http_status: 401
  emitted_by: [{surface: http, operations: [GetAssistantEntry]}]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: entryUnauthorized
  go_const: ErrEntryUnauthorized
  user_message: {zh: 请先登录后使用助手入口, en: Please sign in to use the assistant entry}
- code: ASSISTANT.USER.entry_invalid_argument
  reason: entry_invalid_argument
  http_status: 400
  emitted_by: [{surface: http, operations: [GetAssistantEntry]}]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: entryInvalidArgument
  go_const: ErrEntryInvalidArgument
  user_message: {zh: 当前页面上下文无效, en: The current page context is invalid}
- code: ASSISTANT.SYSTEM.entry_projection_unavailable
  reason: entry_projection_unavailable
  http_status: 503
  emitted_by: [{surface: http, operations: [GetAssistantEntry]}]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 3
  dart_const: entryProjectionUnavailable
  go_const: ErrEntryProjectionUnavailable
  user_message: {zh: 助手入口暂不可用，请稍后重试, en: Assistant entry is temporarily unavailable}
