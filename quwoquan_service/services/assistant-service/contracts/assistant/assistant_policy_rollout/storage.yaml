backend: mongodb
collections:
  assistant_policy_rollouts:
    entity: AssistantPolicyRollout
    description: 每个 policyId 唯一 current/previous cohort mapping。
    indexes:
    - name: uq_assistant_policy_rollout_policy
      keys:
        policyId: 1
      unique: true
    - name: idx_assistant_policy_rollout_revision
      keys:
        policyId: 1
        revision: -1
      unique: true
  assistant_policy_rollout_receipts:
    entity: AssistantPolicyRollout
    description: Activate/Rollback command receipt，与 rollout CAS 在同一事务提交。
    indexes:
    - name: idx_assistant_policy_rollout_receipt_policy
      keys:
        policyId: 1
        revision: -1
  assistant_policy_rollout_outbox:
    entity: AssistantPolicyRollout
    description: 激活与回滚审计 outbox；payload 仅含 bounded policy/revision/release attribution。
    indexes:
    - name: idx_assistant_policy_rollout_outbox_pending
      keys:
        publishedAt: 1
        occurredAt: 1
role: authoritative
