events:
- name: AssistantPolicyRolloutActivated
  delivery_semantics: transactional_event_log
  payload_entity: AssistantPolicyRollout
  payload_fields:
  - policyId
  - revision
  - status
  - assignments
  - activatedAt
  no_consumer_reason: 事件经事务 outbox 追加到耐久 policy audit stream；运行时按当前 rollout store 解析，不订阅该审计记录。
- name: AssistantPolicyRolloutRolledBack
  delivery_semantics: transactional_event_log
  payload_entity: AssistantPolicyRollout
  payload_fields:
  - policyId
  - revision
  - status
  - assignments
  - activatedAt
  no_consumer_reason: 事件经事务 outbox 追加到耐久 policy audit stream；运行时按当前 rollout store 解析，不订阅该审计记录。
