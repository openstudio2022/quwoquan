domain: ASSISTANT
aggregate: AssistantPreference
description: 'AssistantPreference 聚合错误码。覆盖偏好校验、owner 隔离、撤销恢复窗口与存储失败。

  '
errors:
- code: ASSISTANT.USER.preference_unauthorized
  kind: USER
  reason: preference_unauthorized
  http_status: 401
  emitted_by:
  - surface: http
    operations: [SetAssistantPreference, ListAssistantPreferences, RevokeAssistantPreference, RestoreAssistantPreference]
  recovery_action: surface
  dart_const: preferenceUnauthorized
  go_const: ErrPreferenceUnauthorized
  l10n_key: assistant.error.preference_unauthorized
  user_message:
    zh: 请先登录后管理助手偏好
    en: Please sign in to manage assistant preferences
- code: ASSISTANT.USER.preference_invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [SetAssistantPreference, ListAssistantPreferences]
  recovery_action: surface
  dart_const: preferenceInvalidArgument
  go_const: ErrPreferenceInvalidArgument
  l10n_key: assistant.error.preference_invalid_argument
  user_message:
    zh: 偏好设置无效，请重新选择
    en: Preference setting is invalid
- code: ASSISTANT.USER.preference_not_found
  kind: USER
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [SetAssistantPreference, RevokeAssistantPreference, RestoreAssistantPreference]
  recovery_action: refresh
  dart_const: preferenceNotFound
  go_const: ErrPreferenceNotFound
  l10n_key: assistant.error.preference_not_found
  user_message:
    zh: 偏好不存在或已失效
    en: Preference not found or expired
- code: ASSISTANT.USER.preference_restore_expired
  kind: USER
  reason: restore_expired
  http_status: 409
  emitted_by:
  - surface: http
    operations: [RestoreAssistantPreference]
  recovery_action: refresh
  dart_const: preferenceRestoreExpired
  go_const: ErrPreferenceRestoreExpired
  l10n_key: assistant.error.preference_restore_expired
  user_message:
    zh: 撤销恢复时间已过，请重新设置偏好
    en: The restore window has expired; set the preference again
- code: ASSISTANT.SYSTEM.preference_storage_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [SetAssistantPreference, ListAssistantPreferences, RevokeAssistantPreference, RestoreAssistantPreference]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: preferenceStorageUnavailable
  go_const: ErrPreferenceStorageUnavailable
  l10n_key: assistant.error.preference_storage_unavailable
  user_message:
    zh: 偏好服务暂不可用，请稍后重试
    en: Preference service is temporarily unavailable
