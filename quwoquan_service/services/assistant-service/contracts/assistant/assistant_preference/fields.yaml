description: owner 可见、可撤销恢复的结构化助手偏好事实
fields:
- name: preferenceId
  source: preferenceId
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: userId
  source: userId
  type: string
  constraints:
  - NOT_NULL
  classification: SENSITIVE
  log_policy: redact
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
  reference: true
- name: scope
  source: scope
  type: enum
  enum_ref: AssistantPreferenceScope
  constraints:
  - NOT_NULL
  classification: SENSITIVE
  log_policy: metadata_only
  api_exposure: read_write
  ops_exposure: read
  role: authoritative_state
- name: sessionId
  source: sessionId
  type: string
  constraints:
  - NULLABLE
  classification: SENSITIVE
  log_policy: redact
  api_exposure: read_write
  ops_exposure: read
  role: authoritative_state
  reference: true
- name: kind
  source: kind
  type: enum
  enum_ref: AssistantPreferenceKind
  constraints:
  - NOT_NULL
  classification: SENSITIVE
  log_policy: metadata_only
  api_exposure: read_write
  ops_exposure: read
  role: authoritative_state
- name: value
  source: value
  type: string
  constraints:
  - NOT_NULL
  classification: SENSITIVE
  log_policy: redact
  api_exposure: read_write
  ops_exposure: read
  description: 文风 kind 使用 allowlist；事实记忆 kind 使用显式确认后的有界规范化文本
  role: authoritative_state
- name: sourceType
  source: sourceType
  type: enum
  enum_ref: AssistantPreferenceSourceType
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: read_write
  ops_exposure: read
  role: authoritative_state
- name: sourceSessionId
  source: sourceSessionId
  type: string
  constraints:
  - NULLABLE
  classification: SENSITIVE
  log_policy: redact
  api_exposure: read_write
  ops_exposure: read
  description: 事实记忆经显式确认时的 owner AssistantSession 来源；文风设置和管理页录入可为空
  role: authoritative_state
  reference: true
- name: confirmedAt
  source: confirmedAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: SENSITIVE
  log_policy: redact
  api_exposure: read
  ops_exposure: read
  description: 事实型长期记忆的显式确认时间
  role: authoritative_state
- name: status
  source: status
  type: enum
  enum_ref: AssistantPreferenceStatus
  constraints:
  - NOT_NULL
  classification: SENSITIVE
  log_policy: metadata_only
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: revokedAt
  source: revokedAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: SENSITIVE
  log_policy: redact
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: revocationDeadline
  source: revocationDeadline
  type: string
  constraints:
  - NULLABLE
  classification: SENSITIVE
  log_policy: redact
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: createdAt
  source: createdAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: updatedAt
  source: updatedAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: version
  source: version
  type: int
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
types:
  ListAssistantPreferencesQuery:
    description: 按可选作用域、会话与状态读取当前 owner 偏好事实的查询。
    fields:
    - {name: scope, source: scope, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: none}
    - {name: sessionId, source: sessionId, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: status, source: status, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: none}
  AssistantPreferenceByIdRequest:
    description: 以 path 中的 canonical preferenceId 定位 owner 偏好事实的无 body 命令。
    fields:
    - {name: preferenceId, source: preferenceId, type: string, constraints: [NOT_BLANK], classification: SENSITIVE, log_policy: hash, api_exposure: write, ops_exposure: none}
  SetAssistantPreferenceRequest:
    description: 创建或覆盖结构化助手偏好事实的请求体；userId 只从已验证主体注入。
    fields:
    - name: scope
      source: scope
      type: enum
      enum_ref: AssistantPreferenceScope
      constraints: [NOT_NULL]
      classification: SENSITIVE
      log_policy: metadata_only
      api_exposure: write
      ops_exposure: none
    - name: sessionId
      source: sessionId
      type: string
      constraints: [NULLABLE]
      classification: SENSITIVE
      log_policy: redact
      api_exposure: write
      ops_exposure: none
    - name: kind
      source: kind
      type: enum
      enum_ref: AssistantPreferenceKind
      constraints: [NOT_NULL]
      classification: SENSITIVE
      log_policy: metadata_only
      api_exposure: write
      ops_exposure: none
    - name: value
      source: value
      type: string
      constraints: [NOT_NULL]
      classification: SENSITIVE
      log_policy: redact
      api_exposure: write
      ops_exposure: none
    - name: sourceType
      source: sourceType
      type: enum
      enum_ref: AssistantPreferenceSourceType
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: write
      ops_exposure: none
    - name: sourceSessionId
      source: sourceSessionId
      type: string
      constraints: [NULLABLE]
      classification: SENSITIVE
      log_policy: redact
      api_exposure: write
      ops_exposure: none
    - name: confirmed
      source: confirmed
      type: bool
      constraints: [NOT_NULL]
      classification: SENSITIVE
      log_policy: metadata_only
      api_exposure: write
      ops_exposure: none
  AssistantPreferenceListView:
    description: owner 的偏好事实列表
    fields:
    - name: items
      source: items
      type: '[]AssistantPreference'
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: metadata_only
      api_exposure: read
      ops_exposure: read
