kind: aggregate_root
description: '小趣助手显式偏好事实。session scope 仅作用于指定 AssistantSession，

  long_term scope 作用于 owner 后续 AssistantSession；用户可遗忘并在受控窗口内恢复。

  '
identity:
  fields:
  - preferenceId
  version_field: version
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: accountOwner
  on_delete: retain
  reference_fields:
  - userId
  target_object: user.UserAccount
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: session
  on_delete: retain
  reference_fields:
  - sessionId
  target_object: assistant.AssistantSession
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: sourceSession
  on_delete: retain
  reference_fields:
  - sourceSessionId
  target_object: assistant.AssistantSession
capabilities:
- queryable
- owner_mutable
taggable: false
vector_enabled: false
business_rules:
- actor persona 必须等于 trusted principal，禁止请求体覆盖 userId
- session scope 必须绑定 owner 的 sessionId，long_term scope 禁止绑定 sessionId
- session_confirmed 的事实型 long_term 记忆必须绑定 owner 的 sourceSessionId
- 同一 owner、scope、sessionId、kind 仅有一个当前事实，Set 为幂等 upsert
- revoked 事实不得进入 AssistantRun 上下文
- 非 owner 对读取、遗忘和恢复统一返回 not_found 防枚举
- 仅在 revocationDeadline 之前允许将 revoked 事实恢复为 active
lifecycle:
  state_field: status
  states:
  - active
  - revoked
  optimistic_concurrency: version
  idempotency: natural_identity
