events:
- {name: SkillDataControlRequested, description: 用户创建待确认 Skill 数据控制请求, producer: assistant-service, consumers: [projection-workers], channel: event_store, payload_entity: SkillDataControlRequest, payload_fields: [requestId, accountId, skillId, requestedActions, status, revision, createdAt]}
- {name: SkillDataControlConfirmed, description: 用户明确确认执行请求, producer: assistant-service, consumers: [projection-workers], channel: event_store, payload_entity: SkillDataControlRequest, payload_fields: [requestId, accountId, skillId, status, confirmedAt, revision, updatedAt]}
- {name: SkillDataControlCompleted, description: 请求内全部 Assistant-owned action 已完成, producer: assistant-service, consumers: [projection-workers], channel: event_store, payload_entity: SkillDataControlRequest, payload_fields: [requestId, accountId, skillId, completedActions, status, completedAt, revision, updatedAt]}
- {name: SkillDataControlCancelled, description: 用户未确认并取消请求, producer: assistant-service, consumers: [projection-workers], channel: event_store, payload_entity: SkillDataControlRequest, payload_fields: [requestId, accountId, skillId, status, completedAt, revision, updatedAt]}
- {name: SkillDataControlFailed, description: owner action 失败且请求进入可重试失败终态, producer: assistant-service, consumers: [projection-workers], channel: event_store, payload_entity: SkillDataControlRequest, payload_fields: [requestId, accountId, skillId, completedActions, status, failedAction, failureCode, revision, updatedAt]}
