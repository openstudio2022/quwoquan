description: 'assistant_run 域结构化错误码声明。格式：MODULE.KIND.REASON。

  覆盖流式执行、Markdown 结构块解析、技能授权与推荐动作链路。

  '
errors:
- code: ASSISTANT.USER.run_unauthorized
  reason: run_unauthorized
  http_status: 401
  emitted_by:
  - surface: http
    operations: [StartAssistantRun, GetAssistantRun, CancelAssistantRun, PauseAssistantRun, ResumeAssistantRun, SteerAssistantRun, ApproveAssistantToolUse, SubmitDeviceActionReceipt, StreamAssistantRunEvents]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: runUnauthorized
  go_const: ErrRunUnauthorized
  user_message:
    zh: 请先登录后使用助手能力
    en: Please sign in to use assistant capabilities
- code: ASSISTANT.USER.run_not_found
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [GetAssistantRun, CancelAssistantRun, PauseAssistantRun, ResumeAssistantRun, SteerAssistantRun, ApproveAssistantToolUse, SubmitDeviceActionReceipt, StreamAssistantRunEvents]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: runNotFound
  go_const: ErrRunNotFound
  user_message:
    zh: 本次执行不存在或已失效
    en: Assistant run not found or expired
- code: ASSISTANT.USER.run_invalid_argument
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [StartAssistantRun, SteerAssistantRun, ApproveAssistantToolUse, SubmitDeviceActionReceipt, assistant.assistant_turn_view.ListSessionTurns, StreamAssistantRunEvents]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: runInvalidArgument
  go_const: ErrRunInvalidArgument
  user_message:
    zh: 执行请求参数有误
    en: Assistant run request is invalid
- code: ASSISTANT.USER.run_state_conflict
  reason: state_conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations: [PauseAssistantRun, ResumeAssistantRun, SteerAssistantRun, ApproveAssistantToolUse, SubmitDeviceActionReceipt]
  recovery_action: retry
  disruption_level: snackbar
  dart_const: runStateConflict
  go_const: ErrRunStateConflict
  user_message:
    zh: 本次任务状态已经变化，请刷新后重试
    en: The assistant run state has changed; refresh and try again
- code: ASSISTANT.SYSTEM.device_action_unavailable
  reason: device_action_unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [SubmitDeviceActionReceipt]
  recovery_action: fallback
  disruption_level: inlineCard
  dart_const: deviceActionUnavailable
  go_const: ErrDeviceActionUnavailable
  user_message:
    zh: 当前设备暂不支持此操作，请手动完成
    en: This action is unavailable on this device; complete it manually
- code: ASSISTANT.USER.device_action_permission_denied
  reason: device_action_permission_denied
