  recovery_action: surface
  disruption_level: permissionCard
  dart_const: deviceActionPermissionDenied
  go_const: ErrDeviceActionPermissionDenied
  user_message:
    zh: 请在系统设置中允许此设备操作后重试
    en: Allow this device action in system settings and try again
- code: ASSISTANT.SYSTEM.device_action_failed
