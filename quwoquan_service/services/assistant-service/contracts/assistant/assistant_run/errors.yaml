domain: ASSISTANT
aggregate: AssistantRun
description: 'assistant_run 域结构化错误码声明。格式：MODULE.KIND.REASON。

  覆盖流式执行、Markdown 结构块解析、技能授权与推荐动作链路。

  '
errors:
- code: ASSISTANT.USER.run_not_found
  kind: USER
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [GetAssistantRun, CancelAssistantRun, StreamAssistantRunEvents]
  recovery_action: surface
  dart_const: runNotFound
  go_const: ErrRunNotFound
  l10n_key: assistant.error.run_not_found
  user_message:
    zh: 本次执行不存在或已失效
    en: Assistant run not found or expired
- code: ASSISTANT.USER.run_invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [SearchXiaoquResults, StartAssistantRun, ListConversationTurns, StreamAssistantRunEvents, ReportPageContext, GetSuggestedActions, SuggestCreationAssistance]
  recovery_action: surface
  dart_const: runInvalidArgument
  go_const: ErrRunInvalidArgument
  l10n_key: assistant.error.run_invalid_argument
  user_message:
    zh: 执行请求参数有误
    en: Assistant run request is invalid
- code: ASSISTANT.USER.intersection_evidence_not_found
  kind: USER
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: refresh
  dart_const: intersectionEvidenceNotFound
  go_const: ErrIntersectionEvidenceNotFound
  l10n_key: assistant.error.intersection_evidence_not_found
  user_message:
    zh: 这条交集线索已失效或不可访问
    en: This intersection evidence is no longer available
- code: ASSISTANT.MIDDLEWARE.intersection_evidence_unavailable
  kind: MIDDLEWARE
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: intersectionEvidenceUnavailable
  go_const: ErrIntersectionEvidenceUnavailable
  l10n_key: assistant.error.intersection_evidence_unavailable
  user_message:
    zh: 交集证据暂时无法核验，请稍后重试
    en: Intersection evidence cannot be verified right now
- code: ASSISTANT.SYSTEM.page_context_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [ReportPageContext]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: pageContextUnavailable
  go_const: ErrPageContextUnavailable
  l10n_key: assistant.error.page_context_unavailable
  user_message:
    zh: 页面上下文暂时无法保存，请稍后重试
    en: Page context cannot be saved right now
- code: ASSISTANT.USER.run_idempotency_conflict
  kind: USER
  reason: idempotency_conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: refresh
  dart_const: runIdempotencyConflict
  go_const: ErrRunIdempotencyConflict
  l10n_key: assistant.error.run_idempotency_conflict
  user_message:
    zh: 请求重复提交，请刷新后重试
    en: Duplicate request, please refresh and retry
- code: ASSISTANT.SYSTEM.run_storage_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [StartAssistantRun, GetAssistantRun, ListConversationTurns, CancelAssistantRun, StreamAssistantRunEvents]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: runStorageUnavailable
  go_const: ErrRunStorageUnavailable
  l10n_key: assistant.error.run_storage_unavailable
  user_message:
    zh: 助手执行服务暂不可用，请稍后重试
    en: Assistant run service is temporarily unavailable
- code: ASSISTANT.SYSTEM.run_policy_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: runPolicyUnavailable
  go_const: ErrRunPolicyUnavailable
  l10n_key: assistant.error.run_policy_unavailable
  user_message:
    zh: 助手策略暂不可用，请稍后重试
    en: Assistant policy is temporarily unavailable
- code: ASSISTANT.USER.skill_consent_required
  kind: USER
  reason: forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations: [StartAssistantRun, SuggestCreationAssistance]
  recovery_action: surface
  dart_const: skillConsentRequired
  go_const: ErrSkillConsentRequired
  l10n_key: assistant.error.skill_consent_required
  user_message:
    zh: 该能力需要先授权后使用
    en: This capability requires consent before use
- code: ASSISTANT.SYSTEM.stream_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [SearchXiaoquResults, StreamAssistantRunEvents]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: streamUnavailable
  go_const: ErrStreamUnavailable
  l10n_key: assistant.error.stream_unavailable
  user_message:
    zh: 流式服务暂不可用，请稍后重试
    en: Streaming is temporarily unavailable; please try again later
- code: ASSISTANT.MIDDLEWARE.upstream_timeout
  kind: MIDDLEWARE
  reason: timeout
  http_status: 504
  emitted_by:
  - surface: http
    operations: [SearchXiaoquResults, SuggestCreationAssistance]
  recovery_action: retry
  recovery_after_seconds: 8
  dart_const: upstreamTimeout
  go_const: ErrUpstreamTimeout
  l10n_key: assistant.error.upstream_timeout
  user_message:
    zh: 请求超时，请稍后重试
    en: Request timed out, please try again later
- code: ASSISTANT.MIDDLEWARE.model_provider_unavailable
  kind: MIDDLEWARE
  reason: unavailable
  emitted_by:
  - surface: terminal_snapshot
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: modelProviderUnavailable
  go_const: ErrModelProviderUnavailable
  l10n_key: assistant.error.model_provider_unavailable
  user_message:
    zh: 助手模型服务暂不可用，请稍后重试
    en: Assistant model service is temporarily unavailable
- code: ASSISTANT.MIDDLEWARE.public_search_provider_unavailable
  kind: MIDDLEWARE
  reason: unavailable
  emitted_by:
  - surface: app
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: publicSearchProviderUnavailable
  go_const: ErrPublicSearchProviderUnavailable
  l10n_key: assistant.error.public_search_provider_unavailable
  user_message:
    zh: 公开信息检索暂不可用，请稍后重试
    en: Public search is temporarily unavailable
- code: ASSISTANT.MIDDLEWARE.weather_provider_unavailable
  kind: MIDDLEWARE
  reason: unavailable
  emitted_by:
  - surface: app
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: weatherProviderUnavailable
  go_const: ErrWeatherProviderUnavailable
  l10n_key: assistant.error.weather_provider_unavailable
  user_message:
    zh: 天气数据暂不可用，请稍后重试
    en: Weather data is temporarily unavailable
- code: ASSISTANT.MIDDLEWARE.finance_provider_unavailable
  kind: MIDDLEWARE
  reason: unavailable
  emitted_by:
  - surface: app
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: financeProviderUnavailable
  go_const: ErrFinanceProviderUnavailable
  l10n_key: assistant.error.finance_provider_unavailable
  user_message:
    zh: 金融行情数据暂不可用，请稍后重试
    en: Financial market data is temporarily unavailable
