  user_message:
    zh: 助手技能包暂不可用，请稍后重试
    en: Assistant Skill package is temporarily unavailable
- code: ASSISTANT.USER.run_skill_disabled
  kind: USER
  reason: skill_disabled
  http_status: 409
  emitted_by:
  - surface: http
