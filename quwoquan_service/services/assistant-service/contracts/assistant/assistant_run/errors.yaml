  l10n_key: assistant.error.run_skill_disabled
  user_message:
    zh: 该技能在当前场景未启用，请检查个人或群聊技能设置
    en: This skill is disabled by the current personal or shared-surface policy
- code: ASSISTANT.USER.skill_consent_required
