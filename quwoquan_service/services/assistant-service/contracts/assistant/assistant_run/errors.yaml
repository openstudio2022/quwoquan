domain: ASSISTANT
aggregate: AssistantRun
description: 'assistant_run 域结构化错误码声明。格式：MODULE.KIND.REASON。

  覆盖流式执行、Markdown 结构块解析、技能授权与推荐动作链路。

  '
errors:
- code: ASSISTANT.USER.run_unauthorized
  kind: USER
  reason: run_unauthorized
  http_status: 401
  emitted_by:
  - surface: http
    operations: [StartAssistantRun, GetAssistantRun, CancelAssistantRun, PauseAssistantRun, ResumeAssistantRun, SteerAssistantRun, ContinueAssistantToolUse, StreamAssistantRunEvents]
  recovery_action: surface
  dart_const: runUnauthorized
  go_const: ErrRunUnauthorized
  l10n_key: assistant.error.run_unauthorized
  user_message:
    zh: 请先登录后使用助手能力
    en: Please sign in to use assistant capabilities
- code: ASSISTANT.USER.run_not_found
  kind: USER
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [GetAssistantRun, CancelAssistantRun, PauseAssistantRun, ResumeAssistantRun, SteerAssistantRun, ContinueAssistantToolUse, StreamAssistantRunEvents]
  recovery_action: surface
  dart_const: runNotFound
  go_const: ErrRunNotFound
  l10n_key: assistant.error.run_not_found
  user_message:
    zh: 本次执行不存在或已失效
    en: Assistant run not found or expired
- code: ASSISTANT.USER.run_invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [StartAssistantRun, SteerAssistantRun, ContinueAssistantToolUse, assistant.assistant_turn_view.ListSessionTurns, StreamAssistantRunEvents]
  recovery_action: surface
  dart_const: runInvalidArgument
  go_const: ErrRunInvalidArgument
  l10n_key: assistant.error.run_invalid_argument
  user_message:
    zh: 执行请求参数有误
    en: Assistant run request is invalid
- code: ASSISTANT.USER.run_state_conflict
  kind: USER
  reason: state_conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations: [PauseAssistantRun, ResumeAssistantRun, SteerAssistantRun, ContinueAssistantToolUse]
  recovery_action: refresh
  dart_const: runStateConflict
  go_const: ErrRunStateConflict
  l10n_key: assistant.error.run_state_conflict
  user_message:
    zh: 本次任务状态已经变化，请刷新后重试
    en: The assistant run state has changed; refresh and try again
- code: ASSISTANT.USER.intersection_evidence_not_found
  kind: USER
  reason: not_found
  http_status: 404
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: refresh
  dart_const: intersectionEvidenceNotFound
  go_const: ErrIntersectionEvidenceNotFound
  l10n_key: assistant.error.intersection_evidence_not_found
  user_message:
    zh: 这条交集线索已失效或不可访问
    en: This intersection evidence is no longer available
- code: ASSISTANT.MIDDLEWARE.intersection_evidence_unavailable
  kind: MIDDLEWARE
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: intersectionEvidenceUnavailable
  go_const: ErrIntersectionEvidenceUnavailable
  l10n_key: assistant.error.intersection_evidence_unavailable
  user_message:
    zh: 交集证据暂时无法核验，请稍后重试
    en: Intersection evidence cannot be verified right now
- code: ASSISTANT.USER.run_idempotency_conflict
  kind: USER
  reason: idempotency_conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: refresh
  dart_const: runIdempotencyConflict
  go_const: ErrRunIdempotencyConflict
  l10n_key: assistant.error.run_idempotency_conflict
  user_message:
    zh: 请求重复提交，请刷新后重试
    en: Duplicate request, please refresh and retry
- code: ASSISTANT.SYSTEM.run_storage_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [StartAssistantRun, GetAssistantRun, assistant.assistant_turn_view.ListSessionTurns, CancelAssistantRun, PauseAssistantRun, ResumeAssistantRun, SteerAssistantRun, ContinueAssistantToolUse, StreamAssistantRunEvents]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: runStorageUnavailable
  go_const: ErrRunStorageUnavailable
  l10n_key: assistant.error.run_storage_unavailable
  user_message:
    zh: 助手执行服务暂不可用，请稍后重试
    en: Assistant run service is temporarily unavailable
- code: ASSISTANT.SYSTEM.run_policy_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [StartAssistantRun]
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: runPolicyUnavailable
  go_const: ErrRunPolicyUnavailable
  l10n_key: assistant.error.run_policy_unavailable
  user_message:
    zh: 助手策略暂不可用，请稍后重试
    en: Assistant policy is temporarily unavailable
- code: ASSISTANT.SYSTEM.run_skill_package_unavailable
