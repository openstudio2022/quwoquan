read_model: AssistantStreamEventWire
description: 'Assistant Run 的流式事件是由独立共享 wire contract 承载的短生命周期读模型。

  它只用于 SSE 解码，不是持久化业务实体，也不在此处生成第二份 Dart DTO。

  '
source_entities:
- AssistantRun
fields:
- {name: schema}
- {name: eventId}
- {name: sessionId}
- {name: runId}
- {name: seq}
- {name: eventType}
- {name: traceId}
- {name: payload}
- {name: runtimeFailure}
- {name: createdAt}
consumers:
- app
