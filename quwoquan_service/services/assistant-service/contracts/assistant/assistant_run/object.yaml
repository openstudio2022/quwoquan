kind: process_manager
description: '助手执行契约入口。记录每次小趣助手执行的上下文与输入输出。

  会话、订阅、授权和 AssistantLearningFact 均有独立生命周期，不属于 AssistantRun 聚合成员；

  轮次是由执行事件投影出的 AssistantTurnView；所有反馈、交互结果与内部 metric 统一通过

  AssistantLearningFact typed append-only sink 写入，也不嵌入 AssistantRun 一致性边界。

  MongoDB 存储，支撑高频写入和灵活 schema（LLM 输出多变）。

  '
identity:
  fields:
  - _id
  version_source: checkpoint
access:
  commands: process_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: session
  on_delete: retain
  reference_fields:
  - sessionId
  target_object: assistant.AssistantSession
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: accountOwner
  on_delete: retain
  reference_fields:
  - userId
  target_object: user.UserAccount
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: personaActor
  on_delete: retain
  reference_fields:
  - personaId
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: strong
  kind: reference
  name: frozenSkillPackage
  on_delete: retain
  reference_fields:
  - skillPackageId
  - skillPackageReleaseDigest
  target_object: assistant.SkillPackageRelease
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: pageObject
  on_delete: tombstone
  reference_fields:
  - pageType
  - pageObjectId
  target_objects:
  - content.Post
  - content.Comment
  - circle.Circle
  - entity.Homepage
  - chat.Conversation
  - chat.Message
  - user.Persona
  - integration.Location
local_identity_reasons:
  clientRequestId: immutable command idempotency key scoped to one owner/session; it is not a business-object identity or relationship
  skillId: stable catalog or release key; resolved through its typed catalog reader and never used as
    an aggregate Store identity
  sourceSurfaceId: generated route, surface, or operation registry key used only for navigation or telemetry
    attribution
search_policy:
  exposed: remote_provider
  object_type_refs:
  - web.document
  provider_egress_ref: quwoquan_service/services/assistant-service/internal/assistant/assistant_run/application/orchestration/external_web_search_handler.go#NewPublicWebSearchHandler
  privacy_filter_ref: quwoquan_service/services/assistant-service/internal/assistant/assistant_run/application/orchestration/citation_destination.go#normalizedHTTPSURL
assistant_access:
  read:
    mode: owner_scoped
    scopes:
    - assistant.assistant.assistant_run.read
  cite:
    mode: internal_reference
    scopes:
    - assistant.assistant.assistant_run.cite
  write:
    mode: consented_command
    scopes:
    - assistant.assistant.assistant_run.write
    requires_user_consent: true
    consent_scope_ref: assistant.assistant.assistant_run.write
business_rules:
- StartAssistantRun 的 intent 是 answer、search、creation_assistance 三选一判别联合，只允许与 kind 对应的一份载荷。
- 搜索与创作辅助必须进入同一 AssistantRun 状态机、事务 outbox、终态快照和 SSE journal，不存在独立模型执行路由。
- run 必须绑定 actor persona、sessionId、输入摘要与当前 consent snapshot
- run 创建时必须原子读取并固化最多 16 个 session 与 16 个 long_term active 偏好快照
- run 创建时必须读取当前 active SkillPackageRelease 并冻结 packageId/releaseDigest；恢复、重放和后台续跑只能消费该不可变发布，不得追随后续 active pointer
- 同一 clientRequestId 只启动一个 run，重放返回同一 run identity
- run 从 accepted 经定向、规划、执行、观察、反思、检查点、综合与验证阶段推进；等待、暂停和终态转换必须由同一 CAS revision 约束
- tool 可用集合必须是 active Skill capability allowlist、平台策略、surface 策略、用户 Consent、当前 Connector grant 与运行时 availability 的交集；任一 required 输入缺失都 fail closed
- 每次 PreToolUse 安全边界必须按 Tool metadata 的 capability policy 重新读取 Consent 与 ConnectorConnection；Run 启动时的 snapshot 不得授权撤权后的调用，群/圈不得读取个人 connection
- tool 调用必须经过 operation allowlist 与目标上下文公开 Facade
- AssistantLearningFact 与 Turn 均在 Run 聚合边界外独立产生和投影，不嵌入 Run 聚合
lifecycle:
  state_field: status
  states:
  - accepted
  - orienting
  - planning
  - executing
  - observing
  - reflecting
  - checkpointing
  - waiting_user
  - waiting_approval
  - waiting_external
  - paused
  - synthesizing
  - verifying
  - completed
  - failed
  - cancelled
  optimistic_concurrency: version
  idempotency: command_receipt
