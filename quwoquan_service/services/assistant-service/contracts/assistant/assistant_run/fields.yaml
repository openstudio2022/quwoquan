    description: '助手与搜索引用的唯一跳转目标。internal 只由 canonical object type/id

      组成并在 App 以 link_templates codegen 解析；external 仅允许校验后的 HTTPS URL。

      未知对象、缺失目标或非 HTTPS 外链不得构造成可点击引用。

