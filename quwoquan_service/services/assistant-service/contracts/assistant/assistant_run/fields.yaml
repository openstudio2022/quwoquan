    - {name: summaryId, source: summaryId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read}
    - {name: text, source: text, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: drop, api_exposure: drop, ops_exposure: drop}
    - {name: fromTurnId, source: fromTurnId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read, reference: true}
    - {name: toTurnId, source: toTurnId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: read, reference: true}
    - {name: turnCount, source: turnCount, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read}
    - {name: currentGoal, source: currentGoal, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: drop, api_exposure: drop, ops_exposure: drop}
    - {name: confirmedFacts, source: confirmedFacts, type: '[]string', constraints: [NULLABLE], classification: SENSITIVE, log_policy: drop, api_exposure: drop, ops_exposure: drop}
    - {name: pendingItems, source: pendingItems, type: '[]string', constraints: [NULLABLE], classification: SENSITIVE, log_policy: drop, api_exposure: drop, ops_exposure: drop}
    - {name: confirmedSlots, source: confirmedSlots, type: object, constraints: [NULLABLE], classification: SENSITIVE, log_policy: drop, api_exposure: drop, ops_exposure: drop}
