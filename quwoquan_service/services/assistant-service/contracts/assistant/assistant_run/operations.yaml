contract_test:
  mock_strategy:
    app_side:
      mock_target: assistant-service API
      data_source: fields.yaml
      scenarios:
      - name: page_context_report
        route: POST /assistant/page-context
        variants:
        - content_detail
        - feed
        - chat
        - circle
        assertions:
        - status_200
        - context_cached
      - name: suggested_actions
        route: GET /assistant/suggested-actions
        assertions:
        - status_200
        - actions_relevant_to_page
      - name: entry_personalization
        route: GET /assistant/personalization
        assertions:
        - status_200
        - welcome_and_chips_returned
      - name: skill_consent_flow
        routes:
        - POST /assistant/skills/{skillId}/consent
        - DELETE /assistant/skills/{skillId}/consent
        assertions:
        - consent_granted
        - consent_revoked
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: miniredis/v2
      spy_targets:
      - event_publisher
      mock_targets:
      - llm_client
      - cross_service_clients
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: DeleteMany for assistant_runs, assistant_interaction_events
        redis_cleanup: miniredis.FlushAll()
      scenarios:
      - name: page_context_to_redis
        command: ReportPageContext (with contextSnapshot)
        seed: []
        assertions:
        - miniredis.Get('page_ctx:{userId}') → typed contextSnapshot JSON
        - miniredis.TTL('page_ctx:{userId}') → ~300s
      - name: run_persisted_and_replayable
        command: StartAssistantRun (stable clientRequestId replayed)
        seed:
        - fixture.NewAssistantConversation()
        assertions:
        - 'db.assistant_runs.FindOne({_id: runId}) → status streaming/completed'
        - replay same clientRequestId → same runId, no second run
        - restart service → GET /assistant/runs/{runId} still returns envelope
      - name: feedback_learning_loop
        command: ReportInteractionEvent (feedback)
        seed:
        - fixture.NewAssistantRun()
        assertions:
        - db.assistant_interaction_events.FindOne({runId}) → feedbackType + score correct
        - learning profile projection updated
        - eventSpy.AssertPublished('AssistantFeedbackReceived')
  coverage_requirements:
  - all page types covered in page_context scenarios
  - skill consent enforcement verified
  - learning feedback loop end-to-end
  - run persistence and idempotent replay covered
