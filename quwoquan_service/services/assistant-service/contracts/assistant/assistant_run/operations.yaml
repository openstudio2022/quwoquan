api_routes:

- method: POST
  path: /assistant/sessions/{sessionId}/runs
  operation: StartAssistantRun
  actor: persona
  commercial:
    status: blocked
    block_reason: Prod model Provider conformance for the frozen generation policy is unproven; four-environment Provider evidence is still missing
    gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  application:
    kind: command
    facet: AssistantRunCommandFacade
    method: startRun
    aggregate_owner: AssistantRun
    mutation_target: AssistantRun
    invariant_target: AssistantRun
  description: 统一启动助手执行；流式结果是该 Run 的 transport，不存在 CreateTurn/StreamTurn 第二主线
  request_entity: AssistantStartRunRequest
  request_body_kind: object
  request_bindings:
    path:
    - {name: sessionId, field: sessionId}
  response_entity: AssistantRunEnvelopeWire
  success_status: 201
  reliability:
    timeout_ms: 5000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - ASSISTANT.USER.run_invalid_argument
  - ASSISTANT.USER.session_not_found
  - ASSISTANT.USER.run_idempotency_conflict
  - ASSISTANT.USER.skill_consent_required
  - ASSISTANT.USER.intersection_evidence_not_found
  - ASSISTANT.USER.run_unauthorized
  - ASSISTANT.MIDDLEWARE.intersection_evidence_unavailable
  - ASSISTANT.SYSTEM.consent_unavailable
  - ASSISTANT.SYSTEM.run_policy_unavailable
  - ASSISTANT.SYSTEM.run_skill_package_unavailable
  - ASSISTANT.USER.run_skill_disabled
  - ASSISTANT.SYSTEM.skill_setting_storage_unavailable
  - ASSISTANT.SYSTEM.skill_placement_storage_unavailable
  - ASSISTANT.SYSTEM.run_storage_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_run_command
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
    - replayed
  slo:
    latency_p95_ms: 1500
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: session_owner
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
