commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 小趣助手执行、上下文感知、Skill 路由与学习反馈
externalDependencies:
- capability: integration.connector_grant.read
  port: ConnectorCapabilityGrantReaderPort
  operations: [resolveCapabilityGrant]
  conformance: connector_capability_grant
api_routes:

- method: POST
  path: /assistant/sessions/{sessionId}/runs
  operation: StartAssistantRun
  actor: persona
  commercial:
    status: blocked
    block_reason: AssistantRun domain/store/HTTP adapter remain physically mixed with AssistantSession orchestration, and Prod model Provider conformance is unproven
    gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  application:
    kind: command
    facet: AssistantRunCommandFacade
    method: startRun
    aggregate_owner: AssistantRun
    mutation_target: AssistantRun
    invariant_target: AssistantRun
  description: 统一启动助手执行；流式结果是该 Run 的 transport，不存在 CreateTurn/StreamTurn 第二主线
  request_entity: AssistantStartRunRequest
  request_body_kind: object
  request_bindings:
    path:
    - {name: sessionId, field: sessionId}
  response_entity: AssistantRunEnvelope
  success_status: 201
  reliability:
    timeout_ms: 5000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - ASSISTANT.USER.run_invalid_argument
  - ASSISTANT.USER.session_not_found
  - ASSISTANT.USER.run_idempotency_conflict
  - ASSISTANT.USER.skill_consent_required
  - ASSISTANT.USER.intersection_evidence_not_found
  - ASSISTANT.USER.run_unauthorized
  - ASSISTANT.MIDDLEWARE.intersection_evidence_unavailable
  - ASSISTANT.SYSTEM.consent_unavailable
  - ASSISTANT.SYSTEM.run_policy_unavailable
  - ASSISTANT.SYSTEM.run_skill_package_unavailable
  - ASSISTANT.USER.run_skill_disabled
  - ASSISTANT.SYSTEM.skill_setting_storage_unavailable
  - ASSISTANT.SYSTEM.skill_placement_storage_unavailable
  - ASSISTANT.SYSTEM.run_storage_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_run_command
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
    - replayed
  slo:
    latency_p95_ms: 1500
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: session_owner
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: GET
  path: /assistant/runs/{runId}
  operation: GetAssistantRun
  actor: persona
  request_entity: AssistantRunByIdQuery
  request_body_kind: none
  commercial:
    status: blocked
    block_reason: AssistantRun domain model, Mongo store and HTTP adapter remain physically mixed with AssistantSession orchestration
    gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  application:
    kind: query
    facet: AssistantRunQueryFacade
    method: getRun
    reader: AssistantRunReader
    slice: AssistantRunEnvelope
  description: 读取已启动助手 Run 的当前信封；终态 answer/process/citation/failure/policy 只来自无 TTL terminalSnapshot。
  request_bindings:
    path:
    - {name: runId, field: runId}
  response_entity: AssistantRunEnvelope
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - ASSISTANT.USER.run_not_found
  - ASSISTANT.USER.run_unauthorized
  - ASSISTANT.SYSTEM.run_storage_unavailable
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_run_query
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
  slo:
    latency_p95_ms: 300
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: run_owner
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: POST
  path: /assistant/runs/{runId}/cancel
  operation: CancelAssistantRun
  actor: persona
  commercial:
    status: blocked
    block_reason: AssistantRun cancel aggregate/store/HTTP adapter remain physically mixed with AssistantSession orchestration
    gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  application:
    kind: command
    facet: AssistantRunCommandFacade
    method: cancelRun
    aggregate_owner: AssistantRun
    mutation_target: AssistantRun
    invariant_target: AssistantRun
  description: 取消运行中的助手 Run（running→cancelled CAS 并中断执行）；已终态取消幂等返回当前信封，不报错。
  request_entity: AssistantRunCommandRequest
  request_body_kind: none
  request_bindings:
    path:
    - {name: runId, field: runId}
    injected:
    - {name: Idempotency-Key, field: idempotencyKey}
  response_entity: AssistantRunEnvelope
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - ASSISTANT.USER.run_not_found
  - ASSISTANT.USER.run_unauthorized
  - ASSISTANT.SYSTEM.run_storage_unavailable
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_run_command
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
  slo:
    latency_p95_ms: 300
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: run_owner
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: POST
  path: /assistant/runs/{runId}/pause
  operation: PauseAssistantRun
  actor: persona
  commercial: {status: blocked, block_reason: 后台 Worker lease 与跨实例暂停恢复仍需真实环境证据, gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE, target_story: durable-agent-run-orchestration}
  application: {kind: command, facet: AssistantRunCommandFacade, method: pauseRun, aggregate_owner: AssistantRun, mutation_target: AssistantRun, invariant_target: AssistantRun}
  description: 在安全 Item/Task 边界暂停 Run；重复暂停幂等返回同一状态。
  request_entity: AssistantPauseRunRequest
  request_body_kind: object
  request_bindings:
    path: [{name: runId, field: runId}]
    injected: [{name: Idempotency-Key, field: idempotencyKey}]
  response_entity: AssistantRunEnvelope
  reliability: {timeout_ms: 1500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [ASSISTANT.USER.run_not_found, ASSISTANT.USER.run_unauthorized, ASSISTANT.USER.run_state_conflict, ASSISTANT.SYSTEM.run_storage_unavailable]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: assistant_run_control, trace: true, attributes: [operation, outcome, error_code, state]}
  slo: {latency_p95_ms: 300, availability_percent: 99.9}
  authorization: {principal: persona, ownership_policy: run_owner}
  security: {auth_mode: required, principal: owner, token_transport: bearer, anonymous_policy: deny, visibility: private}
- method: POST
  path: /assistant/runs/{runId}/resume
  operation: ResumeAssistantRun
  actor: persona
  commercial: {status: blocked, block_reason: 后台 Worker lease 与跨实例暂停恢复仍需真实环境证据, gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE, target_story: durable-agent-run-orchestration}
  application: {kind: command, facet: AssistantRunCommandFacade, method: resumeRun, aggregate_owner: AssistantRun, mutation_target: AssistantRun, invariant_target: AssistantRun}
  description: 从 paused 或可继续的等待状态恢复同一 Run；不会创建第二条执行主线。
  request_entity: AssistantRunCommandRequest
  request_body_kind: none
  request_bindings:
    path: [{name: runId, field: runId}]
    injected: [{name: Idempotency-Key, field: idempotencyKey}]
  response_entity: AssistantRunEnvelope
  reliability: {timeout_ms: 1500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [ASSISTANT.USER.run_not_found, ASSISTANT.USER.run_unauthorized, ASSISTANT.USER.run_state_conflict, ASSISTANT.SYSTEM.run_storage_unavailable]
  privacy: {request_classification: INTERNAL, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: assistant_run_control, trace: true, attributes: [operation, outcome, error_code, state]}
  slo: {latency_p95_ms: 300, availability_percent: 99.9}
  authorization: {principal: persona, ownership_policy: run_owner}
  security: {auth_mode: required, principal: owner, token_transport: bearer, anonymous_policy: deny, visibility: private}
- method: POST
  path: /assistant/runs/{runId}/steer
  operation: SteerAssistantRun
  actor: persona
  commercial: {status: blocked, block_reason: 安全边界 goal revision CAS 与恢复回放仍需真实环境证据, gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE, target_story: durable-agent-run-orchestration}
  application: {kind: command, facet: AssistantRunCommandFacade, method: steerRun, aggregate_owner: AssistantRun, mutation_target: AssistantRun, invariant_target: AssistantRun}
  description: 追加新的用户约束并在下一个安全边界形成 goal revision；不改写既有 Item 与证据。
  request_entity: AssistantSteerRunRequest
  request_body_kind: object
  request_bindings:
    path: [{name: runId, field: runId}]
    injected: [{name: Idempotency-Key, field: idempotencyKey}]
  response_entity: AssistantRunEnvelope
  reliability: {timeout_ms: 1500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [ASSISTANT.USER.run_not_found, ASSISTANT.USER.run_unauthorized, ASSISTANT.USER.run_invalid_argument, ASSISTANT.USER.run_state_conflict, ASSISTANT.SYSTEM.run_storage_unavailable]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: assistant_run_control, trace: true, attributes: [operation, outcome, error_code, state]}
  slo: {latency_p95_ms: 300, availability_percent: 99.9}
  authorization: {principal: persona, ownership_policy: run_owner}
  security: {auth_mode: required, principal: owner, token_transport: bearer, anonymous_policy: deny, visibility: private}
- method: POST
  path: /assistant/runs/{runId}/tool-uses/{toolUseId}/continue
  operation: ContinueAssistantToolUse
  actor: persona
  commercial: {status: blocked, block_reason: 设备动作 confirmation 与 continuation 端云回执尚需真机证据, gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE, target_story: adaptive-presentation-runtime}
  application: {kind: command, facet: AssistantRunCommandFacade, method: continueToolUse, aggregate_owner: AssistantRun, mutation_target: AssistantRun, invariant_target: AssistantRun}
  description: 对等待确认的 typed ActionIntent 明确批准或拒绝；设备动作仅在批准且携带原生成功回执时产生 continuation。
  request_entity: AssistantContinueToolUseRequest
  request_body_kind: object
  request_bindings:
    path: [{name: runId, field: runId}, {name: toolUseId, field: toolUseId}]
    injected: [{name: Idempotency-Key, field: idempotencyKey}]
  response_entity: AssistantRunEnvelope
  reliability: {timeout_ms: 1500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required}
  error_codes: [ASSISTANT.USER.run_not_found, ASSISTANT.USER.run_unauthorized, ASSISTANT.USER.run_invalid_argument, ASSISTANT.USER.run_state_conflict, ASSISTANT.SYSTEM.run_storage_unavailable]
  privacy: {request_classification: SENSITIVE, response_classification: SENSITIVE, log_policy: metadata_only}
  telemetry: {metric: assistant_tool_continuation, trace: true, attributes: [operation, outcome, error_code, decision]}
  slo: {latency_p95_ms: 500, availability_percent: 99.9}
  authorization: {principal: persona, ownership_policy: run_owner}
  security: {auth_mode: required, principal: owner, token_transport: bearer, anonymous_policy: deny, visibility: private}
- method: GET
  path: /assistant/runs/{runId}/events
  operation: StreamAssistantRunEvents
  actor: persona
  request_entity: AssistantRunEventStreamQuery
  request_body_kind: none
  commercial:
    status: blocked
    block_reason: AssistantRun event journal and SSE adapter remain physically mixed with AssistantSession orchestration
    gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  application:
    kind: query
    facet: AssistantRunEventTransport
    method: streamEvents
    reader: AssistantRunEventReader
    slice: AssistantStreamEventWire
  description: 已启动助手 Run 的只读 SSE 事件 transport；journal 过期后的终态重放必须由 terminalSnapshot 生成，不是第二条创建或执行主线。
  request_bindings:
    path:
    - {name: runId, field: runId}
    query:
    - {name: resumeToken, field: resumeToken, required: false}
  response_entity: AssistantStreamEventWire
  transport: sse
  streaming:
    resume_request_field: resumeToken
    resume_response_field: eventId
    terminal_field: eventType
    terminal_values: [completed, failed, cancelled]
  response_admission: {maximum_body_bytes: 1048576}
  reliability:
    timeout_ms: 190000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 3
    idempotency: none
  error_codes:
  - ASSISTANT.USER.run_not_found
  - ASSISTANT.USER.run_invalid_argument
  - ASSISTANT.USER.run_unauthorized
  - ASSISTANT.SYSTEM.stream_unavailable
  - ASSISTANT.SYSTEM.run_storage_unavailable
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_run_stream
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
    - resumed
  slo:
    latency_p95_ms: 2000
    availability_percent: 99.5
  authorization:
    principal: persona
    ownership_policy: run_owner
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private

consumers:
- name: app
  capabilities:
  - start_run
  - read_run
  - control_run
  - stream_run_events
- name: platform-ops
  capabilities:
  - read_runs
  - manage_policy
  - manage_skills
- name: recommendation-engine
  capabilities:
  - read_runs
contract_test:
  mock_strategy:
    app_side:
      mock_target: assistant-service API
      data_source: fields.yaml
      scenarios:
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: miniredis/v2
      spy_targets:
      - learning_fact_outbox
      mock_targets:
      - llm_client
      - cross_service_clients
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: DeleteMany for assistant_runs, assistant_learning_facts, rm_assistant_learning_projection
        redis_cleanup: miniredis.FlushAll()
      scenarios:
      - name: run_persisted_and_replayable
        command: StartAssistantRun (stable clientRequestId replayed)
        seed:
        - fixture.NewAssistantSession()
        assertions:
        - 'db.assistant_runs.FindOne({_id: runId}) → status streaming/completed'
        - replay same clientRequestId → same runId, no second run
        - restart service → GET /assistant/runs/{runId} still returns envelope
      - name: feedback_learning_loop
        command: AppendAssistantLearningFact (feedback)
        seed:
        - fixture.NewAssistantRun()
        assertions:
        - db.assistant_learning_facts.FindOne({assistantTurnId}) → feedbackType + score correct
        - rm_assistant_learning_projection updated from canonical append sequence
        - learning_fact_outbox contains redacted AssistantLearningFactAppended payload
  coverage_requirements:
  - learning feedback loop end-to-end
  - run persistence and idempotent replay covered
