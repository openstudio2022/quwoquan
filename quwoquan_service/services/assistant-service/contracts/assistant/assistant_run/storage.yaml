backend: mongodb
collections:
  assistant_runs:
    publication_role: not_published
    entity: AssistantRun
    description: AssistantRun aggregate 与 terminalSnapshot 的 authoritative 无 TTL 存储；事件日志过期不得影响 GetRun、SSE 终态重放或历史恢复。
    indexes:
    - name: idx_runs_user_created
      keys:
        userId: 1
        createdAt: -1
    - name: idx_runs_session
      keys:
        sessionId: 1
        createdAt: -1
    - name: uq_runs_client_request
      keys:
        userId: 1
        sessionId: 1
        clientRequestId: 1
      unique: true
      sparse: true
    - name: idx_runs_skill_activity
      keys:
        userId: 1
        snapshot.frozenPolicySelection.template.skillId: 1
        updatedAt: -1
    - name: idx_runs_status
      keys:
        status: 1
        createdAt: -1
  assistant_run_events:
    publication_role: not_published
    entity: AssistantRun
    description: AssistantRun 拥有的 SSE 有序事件日志；支持 Last-Event-ID 断线续传，保留 7 天。
    indexes:
    - name: uq_run_events_run_seq
      keys:
        runId: 1
        seq: 1
      unique: true
    - name: idx_run_events_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  assistant_run_command_receipts:
    publication_role: not_published
    entity: AssistantRun
    description: 非 Start 命令的持久幂等回执；同一 runId/commandId 同载荷不重复执行，异载荷冲突。
    indexes:
    - name: uq_run_command_receipt
      unique: true
      keys:
        runId: 1
        commandId: 1
  assistant_run_worker_leases:
    publication_role: not_published
    entity: AssistantRun
    description: Worker claim、heartbeat 与 fencing token 的短租约；过期后允许其他实例接管，旧 token 永远不能继续提交。
    indexes:
    - name: idx_run_worker_lease_expiry
      keys:
        expiresAt: 1
  assistant_run_work_queue:
    publication_role: not_published
    entity: AssistantRun
    description: AssistantRun durable worker 的唯一待执行队列；claim 使用 fencing token，租约过期后才允许重新领取。
    indexes:
    - name: idx_run_work_ready
      keys:
        status: 1
        availableAt: 1
        expiresAt: 1
  assistant_run_terminal_outbox:
    publication_role: transactional_outbox
    entity: AssistantRun
    description: AssistantRun 终态与学习事实订阅之间的事务 outbox；终态 snapshot、journal 与该事件在同一 Mongo 事务提交，消费端以稳定 eventId 幂等追加 AssistantLearningFact。
    indexes:
    - name: idx_run_terminal_outbox_pending
      keys:
        processedAt: 1
        nextAttemptAt: 1
        claimUntil: 1
        occurredAt: 1
  assistant_run_hook_outbox:
    publication_role: not_published
    entity: AssistantRun
    role: reliable_task
    description: AssistantRun 从 runnable 进入 completed、failed、cancelled、paused 或 waiting_* 时，与 Run snapshot、journal 及 work queue 在同一 Mongo transaction 写入的 HookOnStop 持久任务。_id 固定为 runId:on_stop:runRevision；只保存 phase、outcome、runRevision、protectedFactsDigest、有界 data、claim/attempt、processedAt、receiptDigest 与脱敏 lastError，不保存 prompt、CoT、凭证或工具 payload。
    indexes:
    - name: uq_run_hook_outbox_invocation
      keys:
        runId: 1
        phase: 1
        runRevision: 1
      unique: true
    - name: idx_run_hook_outbox_claimable
      keys:
        processedAt: 1
        nextAttemptAt: 1
        claimUntil: 1
        createdAt: 1
  assistant_run_web_evidence:
    publication_role: not_published
    entity: AssistantRun
    description: Public Web Fetch Runtime 提交的 authoritative Target、Source、Document 与 Artifact ledger；四类不可变记录单次抓取事务写入，所有回查均由 runId 约束。
    indexes:
    - name: uq_web_evidence_run_target
      keys:
        runId: 1
        targetId: 1
      unique: true
      partial_filter:
        targetId:
          $type: string
    - name: uq_web_evidence_run_document
      keys:
        runId: 1
        documentId: 1
      unique: true
      partial_filter:
        documentId:
          $type: string
    - name: uq_web_evidence_run_source
      keys:
        runId: 1
        sourceId: 1
      unique: true
      partial_filter:
        sourceId:
          $type: string
    - name: uq_web_evidence_run_artifact
      keys:
        runId: 1
        artifactId: 1
      unique: true
      partial_filter:
        artifactId:
          $type: string
    - name: idx_web_evidence_run_link
      keys:
        runId: 1
        linkIds: 1
    - name: idx_web_evidence_run_fetched
      keys:
        runId: 1
        fetchedAt: -1
  assistant_run_web_budgets:
    publication_role: not_published
    entity: AssistantRun
    description: Public Web Fetch Runtime 的持久页面、字节与在途 reservation 预算；服务重启不得重置已消费预算，过期 reservation 只能回收为未消费额度。
    indexes:
    - name: idx_web_budgets_updated
      keys:
        updatedAt: -1
transaction:
  scope:
  - assistant_runs
  - assistant_run_events
  - assistant_run_command_receipts
  - assistant_run_work_queue
  - assistant_run_terminal_outbox
  - assistant_run_hook_outbox
  isolation: mongo_transaction
  guarantees:
  - aggregate_revision_cas
  - work_claim_fencing
  - journal_receipt_outbox_atomicity
  - stop_hook_delivery_intent_atomicity
redis_cache:
- key: page_ctx:{userId}
  ttl_seconds: 300
  type: hash
  description: 页面上下文
- key: suggested_actions:{userId}:{pageType}:{objectId}
  ttl_seconds: 300
  type: string
  description: Suggested Actions 缓存
- key: assistant:run:cancel:{runId}
  ttl_seconds: 600
  type: string
  description: AssistantRun 跨实例取消信号
role: authoritative
