events:
- name: AssistantRunStarted
  description: 助手执行开始
  delivery_semantics: not_published
  payload_entity: AssistantRun
  payload_fields:
  - _id
  - userId
  - personaId
  - personaContextVersion
  - sessionId
  - skillId
  - triggerType
  - pageType
  no_consumer_reason: aggregate_event_journal_only
- name: AssistantRunCompleted
  description: '助手执行完成

    非 canonical 结构字段迁移注记：recommend_impact="assistant_quality_signal"。'
  delivery_semantics: transactional_outbox
  payload_entity: AssistantRun
  payload_fields:
  - _id
  - userId
  - personaId
  - personaContextVersion
  - status
  - toolsCalled
  - llmModel
  - llmTokensUsed
  - latencyMs
  - satisfactionScore
- name: ToolCalled
  description: Tool 被调用
  delivery_semantics: not_published
  payload_entity: AssistantToolCallEventPayload
  payload_fields:
  - runId
  - userId
  - toolName
  - latencyMs
  - success
  no_consumer_reason: aggregate_event_journal_only
- name: SuggestedActionClicked
  description: '用户点击建议操作

    非 canonical 结构字段迁移注记：recommend_impact="engagement_signal"。'
  delivery_semantics: synchronous_call
  payload_entity: AssistantSuggestedActionClickEventPayload
  payload_fields:
  - runId
  - userId
  - actionId
  - pageType
  - pageObjectId
  no_consumer_reason: 当前没有 canonical object.yaml.lifecycle.source_events 反向边；若 delivery_semantics 要求投递，commercial closure 保持
    GATE_BLOCK。
