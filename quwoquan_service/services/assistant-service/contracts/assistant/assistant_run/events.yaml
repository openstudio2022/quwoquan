events:
- name: AssistantRunStarted
  description: 助手执行开始
  producer: assistant-service
  consumers: []
  no_consumer_reason: aggregate_event_journal_only
  channel: event_store
  payload_entity: AssistantRun
  payload_fields:
  - _id
  - userId
  - personaId
  - personaContextVersion
  - conversationId
  - skillId
  - triggerType
  - pageType
- name: AssistantRunCompleted
  description: 助手执行完成
  producer: assistant-service
  consumers:
  - recommendation-engine
  channel: event_store
  payload_entity: AssistantRun
  payload_fields:
  - _id
  - userId
  - personaId
  - personaContextVersion
  - status
  - toolsCalled
  - llmModel
  - llmTokensUsed
  - latencyMs
  - satisfactionScore
  recommend_impact: assistant_quality_signal
- name: ToolCalled
  description: Tool 被调用
  producer: assistant-service
  consumers: []
  no_consumer_reason: aggregate_event_journal_only
  channel: event_store
  payload_entity: AssistantToolCallEventPayload
  payload_fields:
  - runId
  - userId
  - toolName
  - latencyMs
  - success
- name: SuggestedActionClicked
  description: 用户点击建议操作
  producer: assistant-service
  consumers:
  - recommendation-engine
  channel: direct
  payload_entity: AssistantSuggestedActionClickEventPayload
  payload_fields:
  - runId
  - userId
  - actionId
  - pageType
  - pageObjectId
  recommend_impact: engagement_signal
