commercial_defaults:
  block_reason: Mongo Store/outbox 与 generated transport 尚未完成生产装配
  gap_id: ASSISTANT_CONVERSATION_WIRING
  status: blocked
  target_story: app-cloud-business-object-commercial-closure
description: AssistantConversation 对象专属命令与查询 packet。
externalDependencies:
  - capability: assistant.model.generation
    port: ModelCompletionPort
    operations: [complete, stream]
    conformance: model_generation
  - capability: assistant.public.search
    port: PublicSearchPort
    operations: [search]
    conformance: public_search
  - capability: assistant.weather.forecast
    port: WeatherForecastPort
    operations: [forecast]
    conformance: weather_forecast
  - capability: assistant.finance.quote
    port: FinanceQuotePort
    operations: [quote]
    conformance: finance_quote
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [appendDurable, consumeDurable]
    scenes: [general]
api_routes:
  - actor: persona
    application:
      aggregate_owner: AssistantConversation
      mutation_target: AssistantConversation
      invariant_target: AssistantConversation
      facet: AssistantConversationCommandFacade
      kind: command
      method: createConversation
    method: POST
    operation: CreateAssistantConversation
    path: /assistant/conversations
    description: 一次创建助手会话；clientRequestId 为稳定 intent，重放返回首个结果。
    request_entity: AssistantCreateConversationRequest
    request_body_kind: object
    response_entity: AssistantConversation
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ASSISTANT.USER.conversation_invalid_argument
      - ASSISTANT.USER.conversation_idempotency_conflict
      - ASSISTANT.USER.unauthorized
      - ASSISTANT.SYSTEM.conversation_storage_unavailable
    privacy:
      request_classification: SENSITIVE
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: assistant_conversation_command
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
        - replayed
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: conversation_owner
    commercial:
      status: blocked
      block_reason: conversation aggregate mutation does not yet commit its declared domain event through a transactional outbox
      gap_id: ASSISTANT_CONVERSATION_WIRING
      target_story: app-cloud-business-object-commercial-closure
    security:
      anonymous_policy: deny
      auth_mode: required
      principal: owner
      token_transport: bearer
      visibility: private
  - actor: persona
    application:
      facet: AssistantConversationQueryFacade
      kind: query
      method: listConversations
      reader: AssistantConversationReader
      slice: AssistantConversationListView
    method: GET
    operation: ListAssistantConversations
    path: /assistant/conversations
    description: owner 会话列表；updatedAt desc + conversationId tiebreak 的 keyset 分页，历史抽屉与最近会话的唯一数据源。
    request_bindings:
      query:
        - name: limit
          field: limit
        - name: cursor
          field: cursor
          required: false
    response_entity: AssistantConversationListView
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - ASSISTANT.USER.conversation_invalid_argument
      - ASSISTANT.USER.unauthorized
      - ASSISTANT.SYSTEM.conversation_storage_unavailable
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: assistant_conversation_query
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: requester_self
    commercial:
      status: ready
    client_contract:
      dart_import: ../assistant/assistant_contracts.dart
      response_type: AssistantConversationListProjection
      response_decoder: decodeAssistantConversationList
    security:
      anonymous_policy: deny
      auth_mode: required
      principal: owner
      token_transport: bearer
      visibility: private
    request_entity: AssistantConversationListQuery
    request_body_kind: none
  - actor: persona
    application:
      facet: AssistantConversationQueryFacade
      kind: query
      method: getConversation
      reader: AssistantConversationReader
      slice: AssistantConversation
    method: GET
    operation: GetAssistantConversation
    path: /assistant/conversations/{conversationId}
    description: 读取 owner 自己的会话快照；非 owner 返回 not_found 防枚举。
    request_bindings:
      path:
        - name: conversationId
          field: conversationId
    response_entity: AssistantConversation
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - ASSISTANT.USER.conversation_not_found
      - ASSISTANT.USER.unauthorized
      - ASSISTANT.SYSTEM.conversation_storage_unavailable
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: assistant_conversation_query
      trace: true
      attributes:
        - operation
        - outcome
        - error_code
    slo:
      latency_p95_ms: 300
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: conversation_owner
    commercial:
      status: ready
    client_contract:
      dart_import: ../assistant/assistant_contracts.dart
      response_type: AssistantConversationProjection
      response_decoder: decodeAssistantConversation
    security:
      anonymous_policy: deny
      auth_mode: required
      principal: owner
      token_transport: bearer
      visibility: private
    request_entity: AssistantConversationByIdQuery
    request_body_kind: none
