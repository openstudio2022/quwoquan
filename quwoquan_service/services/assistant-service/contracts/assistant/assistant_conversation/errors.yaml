domain: ASSISTANT
aggregate: AssistantConversation
description: 'AssistantConversation 聚合错误码。格式：MODULE.KIND.REASON。

  覆盖会话创建、归属校验与幂等重放冲突。

  '
errors:
- code: ASSISTANT.USER.conversation_not_found
  kind: USER
  reason: not_found
  http_status: 404
  recovery_action: surface
  dart_const: conversationNotFound
  go_const: ErrConversationNotFound
  l10n_key: assistant.error.conversation_not_found
  user_message:
    zh: 对话不存在或已失效
    en: Conversation not found or expired
- code: ASSISTANT.USER.conversation_invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: conversationInvalidArgument
  go_const: ErrConversationInvalidArgument
  l10n_key: assistant.error.conversation_invalid_argument
  user_message:
    zh: 对话请求参数有误
    en: Conversation request is invalid
- code: ASSISTANT.USER.conversation_idempotency_conflict
  kind: USER
  reason: idempotency_conflict
  http_status: 409
  recovery_action: refresh
  dart_const: conversationIdempotencyConflict
  go_const: ErrConversationIdempotencyConflict
  l10n_key: assistant.error.conversation_idempotency_conflict
  user_message:
    zh: 请求重复提交，请刷新后重试
    en: Duplicate request, please refresh and retry
- code: ASSISTANT.SYSTEM.conversation_storage_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: conversationStorageUnavailable
  go_const: ErrConversationStorageUnavailable
  l10n_key: assistant.error.conversation_storage_unavailable
  user_message:
    zh: 对话服务暂不可用，请稍后重试
    en: Conversation service is temporarily unavailable
