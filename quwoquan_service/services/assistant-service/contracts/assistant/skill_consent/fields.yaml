- name: skillId
  source: skillId
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: grantedScope
  source: grantedScope
  type: string
