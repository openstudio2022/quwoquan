fields:
- name: id
  source: id
  type: string
  constraints:
  - PK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: accountId
  source: accountId
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
  reference: true
- name: skillId
  source: skillId
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: grantedScope
  source: grantedScope
  type: string
  constraints:
  - NOT_NULL
  classification: SENSITIVE
  log_policy: mask
  api_exposure: read
  ops_exposure: read
  description: 授权范围（上下文维度 + tool 权限）
  role: authoritative_state
- name: grantedAt
  source: grantedAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: revokedAt
  source: revokedAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: granted
  source: revokedAt IS NULL
  type: boolean
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  description: 仅由 revokedAt 是否为空推导的生效性 projection，不持久化。
  role: projection
unique_constraints:
- columns:
  - accountId
  - skillId
  condition: revokedAt IS NULL
  description: 每账号每 Skill 只有一个生效授权
