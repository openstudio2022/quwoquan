commercial_defaults:
  block_reason: 未声明的 SkillConsent operation 默认阻断；已声明操作仍需同一候选四环境 Remote UAT、SLI/SLO 读回与回滚证据
  gap_id: ASSISTANT_SKILL_CONSENT_COMMERCIAL_EVIDENCE
  status: blocked
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- actor: account
  application:
    aggregate_owner: SkillConsent
    mutation_target: SkillConsent
    invariant_target: SkillConsent
    facet: SkillConsentCommandFacade
    kind: command
    method: grantConsent
  description: 授权 Skill；命名状态迁移，重复授权持久化 no-op receipt，仅真实状态变化追加不可变事实与审计事件。
  method: POST
  operation: GrantSkillConsent
  path: /assistant/skills/{skillId}/consent
  commercial:
    status: blocked
    block_reason: 对象专属领域模型、PG 事务回执、审计事件与 HTTP facade 已闭合；仍缺同一候选四环境 Remote UAT、SLI/SLO 读回和回滚证据
    gap_id: ASSISTANT_SKILL_CONSENT_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  request_bindings:
    path:
    - {name: skillId, field: skillId}
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - ASSISTANT.USER.consent_invalid_argument
  - ASSISTANT.USER.consent_idempotency_conflict
  - ASSISTANT.USER.consent_unauthorized
  - ASSISTANT.SYSTEM.consent_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_skill_consent_command
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
    - replayed
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: account
    ownership_policy: consent_owner
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private
