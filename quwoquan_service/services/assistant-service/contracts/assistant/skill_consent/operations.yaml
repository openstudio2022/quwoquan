commercial_defaults:
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: ASSISTANT_SKILL_CONSENT_COMMERCIAL_EVIDENCE
  status: blocked
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- actor: account
  application:
    aggregate_owner: SkillConsent
    mutation_target: SkillConsent
    invariant_target: SkillConsent
    facet: SkillConsentCommandFacade
    kind: command
    method: grantConsent
  description: 授权 Skill；命名状态迁移，重复授权持久化 no-op receipt，产生版本化事实与事件。
  method: POST
  operation: GrantSkillConsent
  path: /assistant/skills/{skillId}/consent
  commercial:
    status: blocked
    block_reason: command ignores Idempotency-Key and persists neither command receipt nor declared SkillConsentGranted outbox event; store/domain model remain under AssistantConversation
    gap_id: ASSISTANT_SKILL_CONSENT_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  request_bindings:
    path:
    - {name: skillId, field: skillId}
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - ASSISTANT.USER.consent_invalid_argument
  - ASSISTANT.USER.unauthorized
  - ASSISTANT.SYSTEM.consent_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_skill_consent_command
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
    - replayed
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: account
    ownership_policy: consent_owner
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private
- actor: account
  application:
    aggregate_owner: SkillConsent
    mutation_target: SkillConsent
    invariant_target: SkillConsent
    facet: SkillConsentCommandFacade
    kind: command
    method: revokeConsent
  description: 撤销 Skill 授权；命名状态迁移，撤权即时生效，执行点失败关闭。
