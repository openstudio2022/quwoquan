consumers:
- capabilities:
  - grant
  - revoke
  - list
  name: app
- capabilities:
  - read
  - revoke_any
  name: platform-ops
contract_test:
  mock_strategy:
    app_side:
      scenarios:
      - assertions:
        - consent_granted
        - consent_revoked
        name: consent_lifecycle
        routes:
        - POST /assistant/skills/{skillId}/consent
        - DELETE /assistant/skills/{skillId}/consent
    service_side:
      data_management:
        cleanup: TRUNCATE skill_consent_events, skill_consent_command_receipts, skill_consents CASCADE
        seed: fixture 工厂预制到真实 PG
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        postgres: embedded-postgres
      scenarios:
      - assertions:
        - SELECT * FROM skill_consents WHERE account_id=? AND skill_id=? → row exists, revoked_at IS NULL
        - skill_consent_command_receipts contains canonical response
        - skill_consent_events contains SkillConsentGranted
        command: GrantSkillConsent
        name: grant_consent
        seed: []
      - assertions:
        - distinct Idempotency-Key 的重复授权返回 changed=false/replayed=false
        - partial unique index 保持一个 active fact，命令回执分别持久化
        command: GrantSkillConsent x2 (same user+skill)
        name: duplicate_consent_rejected
        seed:
        - fixture.NewSkillConsent()
      - assertions:
        - SELECT revoked_at FROM skill_consents → NOT NULL
        - skill_consent_command_receipts contains canonical response
        - skill_consent_events contains SkillConsentRevoked
        command: RevokeSkillConsent
        name: revoke_consent
        seed:
        - fixture.NewSkillConsent()
