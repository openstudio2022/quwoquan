backend: postgres
tables:
  skill_consents:
    entity: SkillConsent
    pk: id
    columns:
    - name: id
      type: VARCHAR(36)
      constraints:
      - PK
    - name: account_id
      type: VARCHAR(36)
      constraints:
      - NOT_NULL
    - name: skill_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: granted_scope
      type: TEXT
      constraints:
      - NOT_NULL
    - name: granted_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    - name: revoked_at
      type: TIMESTAMPTZ
    indexes:
    - name: idx_skill_consents_account_active
      columns:
      - account_id
      - granted_at
      condition: revoked_at IS NULL
    unique_constraints:
    - name: uq_skill_consents_account_skill_active
      columns:
      - account_id
      - skill_id
      condition: revoked_at IS NULL
  skill_consent_command_receipts:
    entity: SkillConsent
    role: authoritative
    description: 与授权事实及事件在同一 PostgreSQL 事务提交的命令回执；同一账号的 Idempotency-Key 只能对应同一 operation 与 payload digest。
  skill_consent_events:
    entity: SkillConsent
    role: append_only
    description: 与授权事实及命令回执同事务追加的 SkillConsentGranted/SkillConsentRevoked 审计事件存储。
role: authoritative
