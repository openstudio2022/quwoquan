kind: aggregate_root
description: >-
  SkillPackageRelease 是 manifest、catalog、activation、input、input_schema、
  context、capability、orchestration、trigger、memory、presentation、
  presentation_template、evaluation、prompt 与 replay 资产的一次不可变发布；active 指针只通过
  compare-and-swap 激活或回滚到已验证 release。
identity:
  fields:
  - packageId
  - releaseDigest
  version_field: revision
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: aggregate_root
  cardinality: 1:N
  consistency: strong
  kind: owned
  name: assets
  on_delete: cascade
  reference_fields: []
  target_object: assistant.SkillPackageAsset
- access: aggregate_root
  cardinality: 1:N
  consistency: strong
  kind: owned
  name: capabilityGrants
  on_delete: cascade
  reference_fields: []
  target_object: assistant.SkillCapabilityGrant
search_policy:
  exposed: none
  not_exposed_reason: "目录与发布对象由所属域按版本直接读取，不进入统一检索索引。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "运营控制面不是用户助手面，小趣既不读取也不写入运营对象。"
business_rules:
- packageId、packageVersion、releaseDigest、assets、runtimeCompatibility、provenance、signature 与 capabilityGrants 在 Stage 后不可改写
- releaseDigest 必须等于 canonical package descriptor 的 SHA-256，所有 assetDigest 必须在暴露资产前逐项复算
- manifest、catalog、activation、input、input_schema、context、capability、orchestration、trigger、memory、presentation、presentation_template、evaluation、prompt 与 replay 资产种类缺一不可
- runtimeCompatibility 不匹配、签名无可信 key、能力未授权或 Consent 不可用时必须 fail-closed
- 同一 packageId 最多一个 active release；Activate 必须 compare-and-swap，Rollback 只能精确恢复 previousReleaseDigest
- 运行时缓存只允许以 releaseDigest 为键缓存完整验证后的不可变发布；每次解析仍须读取 active 指针
- package 只能声明数据与 capability grants，不得动态装载或执行任意代码
lifecycle:
  state_field: status
  states: [staged, active, retired]
  optimistic_concurrency: revision
  idempotency: command_receipt
members:
  SkillPackageAsset:
    kind: owned_entity
    identity: [assetId]
    cardinality: many
    max_cardinality: 512
    ownership: aggregate
    write_access: aggregate_facade_only
    description: 发布内按 assetId 唯一、以 digest 固定的不可变资产。
  SkillCapabilityGrant:
    kind: owned_entity
    identity: [capabilityId]
    cardinality: many
    max_cardinality: 256
    ownership: aggregate
    write_access: aggregate_facade_only
    description: 发布可请求的最小能力集合；平台策略与用户 Consent 仍可进一步收紧。
  SkillRuntimeCompatibility:
    kind: value_object
    cardinality: one
    max_cardinality: 1
    ownership: aggregate
    description: Skill runtime API 与最低/最高运行时版本边界。
  SkillPackageProvenance:
    kind: value_object
    cardinality: one
    max_cardinality: 1
    ownership: aggregate
    description: 可追溯到源码 revision 与构建身份的发布来源。
  SkillPackageSignature:
    kind: value_object
    cardinality: one
    max_cardinality: 1
    ownership: aggregate
    description: 由受信 key 对 releaseDigest 签名的发布证明。
