description: 不可变 Skill Package 发布、active 指针与原子激活结果。
fields:
- name: packageId
  type: string
  constraints: [PK, NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: releaseDigest
  type: string
  constraints: [PK, NOT_NULL, UNIQUE]
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: packageVersion
  type: string
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: assets
  type: '[]SkillPackageAsset'
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: drop
  ops_exposure: read
  role: owned_value
- name: runtimeCompatibility
  type: SkillRuntimeCompatibility
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: drop
  ops_exposure: read
  role: owned_value
- name: provenance
  type: SkillPackageProvenance
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: drop
  ops_exposure: read
  role: owned_value
- name: signature
  type: SkillPackageSignature
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: drop
  ops_exposure: read
  role: owned_value
- name: capabilityGrants
  type: '[]SkillCapabilityGrant'
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: drop
  ops_exposure: read
  role: owned_value
- name: status
  type: enum
  enum_ref: SkillPackageReleaseStatus
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: revision
  type: int
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: stagedAt
  type: timestamp
  constraints: [NOT_NULL]
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: activatedAt
  type: timestamp
  constraints: [NULLABLE]
  classification: INTERNAL
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
members:
  SkillPackageAsset:
    kind: owned_entity
    fields:
    - {name: assetId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: kind, type: enum, enum_ref: SkillPackageAssetKind, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: locator, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: drop, ops_exposure: none, role: authoritative_state}
    - {name: assetDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    description: 内容寻址且禁止跨 release 改写的单个 Skill 资产。
  SkillCapabilityGrant:
    kind: owned_entity
    fields:
    - {name: capabilityId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: scope, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    description: Skill Package 请求的声明式能力；不是越过平台策略或 Consent 的授权。
  SkillRuntimeCompatibility:
    kind: value_object
    fields:
    - {name: apiVersion, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: minimumRuntimeVersion, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: maximumRuntimeVersion, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
  SkillPackageProvenance:
    kind: value_object
    fields:
    - {name: sourceRepository, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: drop, ops_exposure: none, role: authoritative_state}
    - {name: sourceRevision, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: buildId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: builtAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
  SkillPackageSignature:
    kind: value_object
    fields:
    - {name: algorithm, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: keyId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read, role: authoritative_state}
    - {name: value, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: drop, ops_exposure: none, role: authoritative_state}
types:
  SkillPackageActivation:
    description: 每次 ResolveActive 都读取的单一 active 指针；缓存不得替代它。
    fields:
    - {name: packageId, type: string, constraints: [NOT_NULL]}
    - {name: activeReleaseDigest, type: string, constraints: [NOT_NULL]}
    - {name: previousReleaseDigest, type: string, constraints: [NULLABLE]}
    - {name: revision, type: int, constraints: [NOT_NULL]}
    - {name: activatedAt, type: timestamp, constraints: [NOT_NULL]}
    - {name: activatedBy, type: string, constraints: [NOT_NULL]}
  ActivateSkillPackageCommand:
    description: 校验目标 release 后以 expectedRevision 原子切换 active 指针。
    fields:
    - {name: packageId, type: string, constraints: [NOT_NULL]}
    - {name: releaseDigest, type: string, constraints: [NOT_NULL]}
    - {name: expectedRevision, type: int, constraints: [NOT_NULL]}
    - {name: activatedBy, type: string, constraints: [NOT_NULL]}
  RollbackSkillPackageCommand:
    description: 以 expectedRevision 将 active 指针精确切回 previousReleaseDigest。
    fields:
    - {name: packageId, type: string, constraints: [NOT_NULL]}
    - {name: expectedRevision, type: int, constraints: [NOT_NULL]}
    - {name: activatedBy, type: string, constraints: [NOT_NULL]}
  SkillPackageReleaseStagedEventPayload:
    description: 不含资产正文与签名值的发布审计载荷。
    fields:
    - {name: packageId, type: string, constraints: [NOT_NULL]}
    - {name: packageVersion, type: string, constraints: [NOT_NULL]}
    - {name: releaseDigest, type: string, constraints: [NOT_NULL]}
    - {name: stagedAt, type: timestamp, constraints: [NOT_NULL]}
  SkillPackageActivationEventPayload:
    description: 不含调用者隐私信息的 active 指针审计载荷。
    fields:
    - {name: packageId, type: string, constraints: [NOT_NULL]}
    - {name: releaseDigest, type: string, constraints: [NOT_NULL]}
    - {name: revision, type: int, constraints: [NOT_NULL]}
    - {name: activatedAt, type: timestamp, constraints: [NOT_NULL]}
enums:
  SkillPackageReleaseStatus:
    values: [staged, active, retired]
  SkillPackageAssetKind:
    values: [manifest, prompt, activation, context, capability, presentation, evaluation, replay]
