description: PageContext 的唯一上报入口。
api_routes:
- method: POST
  path: /assistant/page-context
  operation: ReportPageContext
  actor: persona
  commercial: {status: ready}
  application: {kind: session, facet: PageContextSessionFacade, method: report, session_owner: PageContext}
  request_entity: ReportPageContextCommand
  request_body_kind: object
  response_entity: PageContextReceipt
  reliability: {timeout_ms: 300, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: optional}
  error_codes: [ASSISTANT.USER.page_context_invalid_argument, ASSISTANT.USER.page_context_unauthorized, ASSISTANT.SYSTEM.page_context_unavailable]
  privacy: {request_classification: SENSITIVE, response_classification: INTERNAL, log_policy: metadata_only}
  telemetry: {metric: assistant_page_context_session, trace: true, attributes: [operation, outcome, error_code]}
  slo: {latency_p95_ms: 300, availability_percent: 99.5}
  authorization: {principal: persona, ownership_policy: requester_self}
  security: {auth_mode: required, principal: owner, token_transport: bearer, anonymous_policy: deny, visibility: private}
readiness_cases:
- case_id: report-page-context-local
  spec_ref: specs/feature-tree/runtime/system-architecture-and-engineering-guide/app-cloud-business-object-commercial-closure/spec.md#gwt-001
  producer: service
  layer: local_contract
  target: {kind: operation, id: ReportPageContext}
  runner_source_path: quwoquan_service/services/assistant-service/tests/local_contract/assistant/page_context/page_context__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: report-page-context-api
  spec_ref: specs/feature-tree/runtime/runtime-assistant/context-grounded-answering/spec.md#gwt-001
  producer: service
  layer: api_integration
  target: {kind: operation, id: ReportPageContext}
  runner_source_path: quwoquan_service/services/assistant-service/tests/api_integration/assistant/page_context/report_ttl__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: redis, digest_binding: candidate}
- case_id: page_context_report_page_context_app_local
  spec_ref: specs/feature-tree/runtime/runtime-assistant/context-grounded-answering/spec.md#gwt-001
  producer: app
  layer: local_contract
  target: {kind: operation, id: ReportPageContext}
  runner_source_path: quwoquan_app/test/local_contract/service/assistant_service/assistant/page_context/page_context_remote__local_contract_test.dart
  executions:
