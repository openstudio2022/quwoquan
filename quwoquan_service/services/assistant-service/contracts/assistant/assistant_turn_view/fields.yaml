    - name: turnId
      source: turnId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: sessionId
      source: sessionId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: status
      source: status
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
      description: completed/failed/cancelled 终态
    - name: inputText
      source: inputText
      type: string
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: deny
      api_exposure: read
      ops_exposure: none
    - name: terminalSnapshot
      source: terminalSnapshot
      type: AssistantRunTerminalSnapshotView
      constraints:
      - NULLABLE
      classification: SENSITIVE
      log_policy: deny
      api_exposure: read
      ops_exposure: none
    - name: skillId
      source: skillId
      type: string
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: domainId
      source: domainId
      type: string
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: createdAt
      source: createdAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: completedAt
      source: completedAt
      type: timestamp
      constraints:
      - NULLABLE
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  AssistantTurnListView:
    description: ListSessionTurns 响应体（createdAt desc keyset 分页切片）
    fields:
