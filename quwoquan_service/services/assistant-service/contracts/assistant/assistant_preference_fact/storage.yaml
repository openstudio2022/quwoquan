backend: mongodb
collections:
  assistant_preference_facts:
    entity: AssistantPreferenceFact
    role: authoritative
    description: owner 结构化偏好事实真相源；自然身份由 userId+scope+conversationId+kind 唯一约束承载。
    indexes:
    - name: uq_assistant_preference_identity
      keys:
        userId: 1
        scope: 1
        conversationId: 1
        kind: 1
      unique: true
    - name: idx_assistant_preference_owner_status
      keys:
        userId: 1
        status: 1
        updatedAt: -1
    - name: idx_assistant_preference_revocation_deadline
      keys:
        status: 1
        revocationDeadline: 1
      sparse: true
role: authoritative
