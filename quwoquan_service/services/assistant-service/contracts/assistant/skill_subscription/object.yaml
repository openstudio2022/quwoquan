kind: aggregate_root
description: Persona 主动式 Skill 的触发器、目的地、状态和调度租约聚合。
identity:
  fields:
  - subscriptionId
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: accountCreator
  on_delete: retain
  reference_fields:
  - createdByUserId
  target_object: user.UserAccount
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: personaCreator
  on_delete: retain
  reference_fields:
  - createdByPersonaId
  target_object: user.Persona
local_identity_reasons:
  domainId: stable catalog or release key; resolved through its typed catalog reader and never used as
    an aggregate Store identity
  skillId: stable catalog or release key; resolved through its typed catalog reader and never used as
    an aggregate Store identity
search_policy:
  exposed: none
  not_exposed_reason: "仅所属用户可见的私有状态，进入任何共享索引即构成越权披露。"
assistant_access:
  read:
    mode: owner_scoped
    scopes:
    - assistant.assistant.skill_subscription.read
  cite:
    mode: none
    scopes: []
  write:
    mode: proposal_only
    scopes:
    - assistant.assistant.skill_subscription.write
    requires_user_consent: true
    consent_scope_ref: assistant.assistant.skill_subscription.write
business_rules:
- owner persona、skillId 和 trigger 创建后不可变
- cron 必须在 trigger.timezone 指定的 IANA 时区计算并将 nextAttemptAt 持久化为 UTC；禁止使用 Worker 本地时区或把 App 本地时刻误当 UTC
- destination 必须在当前 consent scope 内
- 只有 active subscription 可获取调度租约
- 同一 schedule window 只能产生一次触发事件
- paused 可恢复，archived 为终态
lifecycle:
  state_field: status
  states:
  - active
  - paused
  - archived
  optimistic_concurrency: version
  idempotency: command_receipt
