dart_class: SkillSubscriptionWire
library_path: assistant/generated/contracts/skill_subscription.g.dart
output_path: assistant/generated/contracts/skill_subscription.g.dart
contract: skill_subscription
kind: entity_wire_contract
fields:
- name: subscriptionId
  type: string
  required: true
- name: owner
  type: object
  ref: subscription_owner
  default: {}
- name: createdByUserId
  type: string
  required: true
- name: createdByPersonaId
  type: string
  default: ''
- name: skillId
  type: string
  required: true
- name: domainId
  type: string
  default: ''
- name: tagRefs
  type: list<string>
  default: []
- name: status
  type: enum
  enum_ref: SkillSubscriptionStatus
  default: active
  strict: true
- name: searchQueryPlan
  type: object
  ref: search_query_plan
  default: {}
- name: trigger
  type: object
  ref: subscription_trigger
  default: {}
- name: destination
  type: object
  ref: subscription_destination
  default: {}
- name: deliveryState
  type: object
  ref: delivery_state
  default: {}
- name: createdAt
  type: string
  required: true
- name: updatedAt
  type: string
  required: true
subcontracts:
  subscription_owner:
    class_name: SkillSubscriptionOwnerWire
    fields:
    - name: ownerType
      type: string
      default: user
    - name: ownerId
      type: string
      default: ''
  search_query_plan:
    class_name: SkillSubscriptionSearchQueryPlanWire
    fields:
    - name: rawText
      type: string
      default: ''
    - name: queries
      type: list<string>
      default: []
  subscription_trigger:
    class_name: SkillSubscriptionTriggerWire
    fields:
    - name: type
      type: string
      default: cron
    - name: cron
      type: string
      default: ''
  subscription_destination:
    class_name: SkillSubscriptionDestinationWire
    fields:
    - name: destinationType
      type: string
      default: user
      description: user | conversation | group
    - name: destinationId
      type: string
      default: ''
    - name: maxPerDay
      type: int
      default: 1
    - name: cooldownMinutes
      type: int
      default: 60
    - name: quietHoursPolicy
      type: string
      default: inherit_user_setting
  delivery_state:
    class_name: SkillSubscriptionDeliveryStateWire
    fields:
    - name: pendingDeliveryId
      type: string
      default: ''
    - name: lastAttemptAt
      type: string
      default: ''
    - name: lastDeliveredAt
      type: string
      default: ''
    - name: nextAttemptAt
      type: string
      default: ''
    - name: consecutiveFailures
      type: int
      default: 0
    - name: lastErrorCode
      type: string
      default: ''
