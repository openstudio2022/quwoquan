events:
- name: SkillSubscriptionCreated
  delivery_semantics: transactional_event_log
  payload_entity: SkillSubscription
  payload_fields:
  - subscriptionId
  no_consumer_reason: 事件经事务 outbox 追加到耐久 subscription activity journal；SkillActivityView 通过 owner named reader 联邦读取。
