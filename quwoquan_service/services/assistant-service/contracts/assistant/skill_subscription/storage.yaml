backend: mongodb
collections:
  skill_subscriptions:
    publication_role: not_published
    entity: SkillSubscription
    role: authoritative
    description: 订阅聚合真相源；所有外部 command 通过 version CAS、独立 receipt 与 outbox 单事务提交。
    indexes:
    - name: idx_skill_subscriptions_owner_status
      keys:
        owner.ownerId: 1
        status: 1
        updatedAt: -1
    - name: idx_skill_subscriptions_status_updated
      keys:
        status: 1
        updatedAt: -1
    - name: idx_skill_subscriptions_trigger
      keys:
        status: 1
        trigger.type: 1
    - name: idx_skill_subscriptions_delivery
      keys:
        status: 1
        deliveryState.nextAttemptAt: 1
        updatedAt: 1
        _id: 1
  skill_subscription_command_receipts:
    publication_role: not_published
    entity: SkillSubscriptionCommandReceipt
    role: authoritative
    description: 外部创建与状态命令的不可变幂等回执；同一 owner/commandId 只允许一个 canonical command digest。
    indexes:
    - name: uq_skill_subscription_command_receipt
      keys:
        ownerId: 1
        commandId: 1
      unique: true
  skill_subscription_outbox:
    publication_role: transactional_outbox
    entity: SkillSubscriptionOutboxEvent
    role: authoritative
    description: 与聚合版本和 command receipt 同事务提交的生命周期事件；禁止同步发布替代 outbox。
    indexes:
    - name: uq_skill_subscription_outbox_version
      keys:
        subscriptionId: 1
        aggregateVersion: 1
        eventType: 1
      unique: true
    - name: idx_skill_subscription_outbox_pending
      keys:
        publishedAt: 1
        nextAttemptAt: 1
        claimUntil: 1
        occurredAt: 1
description: UpdateSkillSubscriptionStatus 使用内部 version CAS；目标状态已满足时只提交 command receipt，聚合版本、updatedAt 和 outbox 均保持不变。
redis_cache:
- key: assistant:subscription:lease:{subscriptionId}:{deliveryId}
  ttl_seconds: 300
  type: string
  description: 订阅投递租约（SetNX + TTL）；首次调度及失败补偿共用 deliveryId，同一投递只有一个实例进入外部副作用。
- key: assistant:subscription:delivery_slot:{subscriptionId}:{utcDate}:{slot}
  ttl_seconds: 172800
  type: string
  description: 订阅 UTC 自然日投递配额槽；成功后保留到 TTL，失败时按持有值校验后释放，原子限制 maxPerDay。
role: authoritative
