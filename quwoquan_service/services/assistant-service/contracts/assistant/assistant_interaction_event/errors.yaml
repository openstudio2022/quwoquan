domain: ASSISTANT
aggregate: AssistantInteractionEvent
description: 'AssistantInteractionEvent append-only fact 错误码。格式：MODULE.KIND.REASON。

  重复 eventId 是幂等重放（非错误），只声明校验与可用性错误。

  '
errors:
- code: ASSISTANT.USER.learning_event_invalid
  kind: USER
  reason: invalid_argument
  http_status: 400
  recovery_action: surface
  dart_const: learningEventInvalid
  go_const: ErrLearningEventInvalid
  l10n_key: assistant.error.learning_event_invalid
  user_message:
    zh: 反馈数据格式有误
    en: Feedback payload is invalid
- code: ASSISTANT.SYSTEM.learning_sink_unavailable
  kind: SYSTEM
  reason: unavailable
  http_status: 503
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: learningSinkUnavailable
  go_const: ErrLearningSinkUnavailable
  l10n_key: assistant.error.learning_sink_unavailable
  user_message:
    zh: 反馈通道暂不可用，稍后会自动重试
    en: Feedback channel is unavailable; will retry automatically
