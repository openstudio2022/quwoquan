kind: append_only_fact
description: AssistantRun 的用户交互反馈不可变事实，仅经 typed append sink 写入。
identity:
  fields:
  - eventId
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: none
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: run
  on_delete: retain
  reference_fields:
  - runId
  target_object: assistant.AssistantRun
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: accountActor
  on_delete: retain
  reference_fields:
  - userId
  target_object: user.UserAccount
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: feedbackMessage
  on_delete: retain
  reference_fields:
  - feedbackTargetMessageId
  target_object: chat.Message
local_identity_reasons:
  domainId: stable catalog or release key; resolved through its typed catalog reader and never used as
    an aggregate Store identity
  sessionId: runtime session correlation key injected by OperationInvocationContext, not an aggregate
    reference
  traceId: immutable correlation or idempotency key scoped to this fact or command; it is not a business-object
    reference
capabilities:
- append_only
- deduplicated_append
business_rules:
- eventId 与 runId 创建后不可变
- actor persona 必须等于 trusted principal，禁止请求体覆盖
- 同一 eventId 只追加一次，事实不提供 update 或 delete
lifecycle:
  states:
  - recorded
