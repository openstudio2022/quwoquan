events:
- name: AssistantLearningFactAppended
  delivery_semantics: transactional_event_log
  payload_entity: AssistantLearningFact
  payload_fields:
  - eventId
  - appendSequence
  - factType
  - userId
  - personaId
  - assistantTurnId
  - triggerMessageId
  - referralSource
  - traceId
  - clientSessionId
  - pageVisitId
  - pageId
  - surfaceId
  - routeId
  - operationId
  - experimentBucket
  - domainId
  - eventType
  - feedbackType
  - feedbackScore
  - reasonCodes
  - actionType
  - suggestedActionId
  - durationMs
  - metricId
  - metricValue
  - metricSource
  - queryTextDigest
  - trainingEligible
  - occurredAt
  - recordedAt
  no_consumer_reason: 事实经事务 outbox 追加到耐久 learning audit stream；当前没有下游订阅者，SkillActivityView 通过 owner named reader 联邦读取。
