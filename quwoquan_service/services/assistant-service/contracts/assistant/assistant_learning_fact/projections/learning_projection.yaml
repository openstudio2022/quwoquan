read_model: AssistantLearningProjection
description: 单一 AssistantLearningFact 流按 appendSequence 构建的 owner-scoped 脱敏聚合；canonical definition 以严格 SHA-256 digest 标识，generationId 仅标识一次原子重建，带 receipt、watermark 和 CAS revision，可从事实确定性重建。
storage_backend: mongodb
collection: rm_assistant_learning_projection
source_entities:
- AssistantLearningFact
source_events:
- AssistantLearningFactAppended
consumers:
- assistant-service
- recommendation-service
- product-ops-service
fields:
- name: userId
  type: string
- name: personaId
  type: string
- name: definitionDigest
  type: string
- name: generationId
  type: string
- name: revision
  type: int64
- name: watermarkSequence
  type: int64
- name: lastAssistantTurnId
  type: string
- name: lastEventId
  type: string
- name: lastFeedbackType
  type: string
- name: lastFeedbackScore
  type: float
- name: lastFeedbackAt
  type: timestamp
- name: lastMetricId
  type: string
- name: lastMetricScore
  type: float
- name: totalFeedbackCount
  type: int64
- name: positiveFeedbackCount
  type: int64
- name: negativeFeedbackCount
  type: int64
- name: textFeedbackCount
  type: int64
- name: highPriorityCount
  type: int64
- name: mediumPriorityCount
  type: int64
- name: metricSampleCounts
  type: object
- name: metricScoreSums
  type: object
- name: latestMetricScores
  type: object
- name: reasonCodeCounts
  type: object
- name: dailyBuckets
  type: object
- name: updatedAt
  type: timestamp
indexes:
- name: idx_assistant_learning_projection_owner_updated
  keys:
    userId: 1
    personaId: 1
    updatedAt: -1
- name: idx_assistant_learning_projection_watermark
  keys:
    watermarkSequence: 1
