dart_class: AssistantReplayCaseWire
library_path: test/support/generated/assistant/assistant_replay_case.g.dart
output_path: test/support/generated/assistant/assistant_replay_case.g.dart
contract: assistant_replay_case
kind: test_fixture_contract
fields:
  - { name: replayCaseId, type: string, required: true }
  - { name: title, type: string, default: '' }
  - { name: request, type: object, ref: request, default: {} }
  - { name: fakeModelScript, type: list<object>, ref: model_step, default: [] }
  - { name: fakeToolScript, type: list<object>, ref: tool_step, default: [] }
  - { name: fakeDeviceContext, type: map, default: {} }
  - { name: expectedStreamEvents, type: list<object>, ref: AssistantStreamEventWire, default: [] }
  - { name: expectedTraceEvents, type: list<object>, ref: AssistantTraceEventWire, default: [] }
  - { name: expectations, type: object, ref: expectations, default: {} }
  - { name: expectedRunResponse, type: object, ref: AssistantRunResponseWire, default: {} }
subcontracts:
  request:
    class_name: AssistantReplayRequestWire
    fields:
      - { name: sessionId, type: string, required: true }
      - { name: turnId, type: string, required: true }
      - { name: userId, type: string, default: '' }
      - { name: inputText, type: string, default: '' }
      - { name: skillId, type: string, required: true }
      - { name: domainId, type: string, required: true }
      # 空值表示 reactive(必须经 production routing);"proactive" 表示订阅触发,
      # 必须携带 trustedTriggerIdentity,缺失时执行 fail-closed。
      - { name: triggerType, type: string, default: '' }
      - { name: trustedTriggerIdentity, type: object, ref: trusted_trigger_identity, default: {} }
      - { name: clientContext, type: map, default: {} }
  trusted_trigger_identity:
    class_name: AssistantReplayTrustedTriggerIdentityWire
    fields:
      - { name: kind, type: string, default: '' }
      - { name: triggerId, type: string, default: '' }
      - { name: occurredAt, type: string, default: '' }
      - { name: subscriptionRef, type: string, default: '' }
      - { name: signalRefs, type: list<string>, default: [] }
      - { name: reason, type: string, default: '' }
      - { name: dedupeKey, type: string, default: '' }
      - { name: deliveryPolicyRef, type: string, default: '' }
  model_step:
    class_name: AssistantReplayModelStepWire
    fields:
      - { name: stage, type: string, required: true }
      - { name: text, type: string, default: '' }
      - { name: structuredDelta, type: map, default: {} }
      - { name: usage, type: map, default: {} }
      - { name: finishReason, type: string, default: '' }
  tool_step:
    class_name: AssistantReplayToolStepWire
    fields:
      - { name: toolName, type: string, required: true }
      - { name: input, type: map, default: {} }
      - { name: result, type: map, default: {} }
      - { name: failure, type: map, default: {} }
      # 空值表示 completed;"waiting_confirmation" 模拟需要用户审批的工具提案。
      - { name: status, type: string, default: '' }
  expectations:
    class_name: AssistantReplayExpectationsWire
    fields:
      - { name: selectedSkillId, type: string, required: true }
      - { name: selectedDomainId, type: string, required: true }
      - { name: expectedToolNames, type: list<string>, default: [] }
      - { name: expectedClarificationSlotIds, type: list<string>, default: [] }
      - { name: expectedReferenceUrls, type: list<string>, default: [] }
      - { name: finalAnswerMode, type: enum, enum_ref: FinalAnswerMode, required: true }
