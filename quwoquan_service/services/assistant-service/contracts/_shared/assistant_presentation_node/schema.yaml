dart_class: AssistantPresentationNodeWire
library_path: package:quwoquan_cloud_contracts/src/generated/assistant/assistant_presentation_node.g.dart
output_path: packages/quwoquan_cloud_contracts/lib/src/generated/assistant/assistant_presentation_node.g.dart
contract: assistant_presentation_node
kind: shared_wire_contract
imports:
  - assistant_runtime_enums.g.dart
fields:
  - { name: nodeId, type: string, required: true }
  - { name: parentNodeId, type: string, default: '' }
  - { name: order, type: int, default: 0 }
  # 未知节点是 capability negotiation 的预期降级输入，不是旧 wire alias。
  - { name: kind, type: enum, enum_ref: AssistantPresentationNodeKind, required: true, allow_unknown: true }
  - { name: title, type: string, default: '' }
  - { name: body, type: string, default: '' }
  - { name: data, type: map, default: {} }
  - { name: binding, type: map, default: {} }
  - { name: dataPolicyRef, type: string, default: '' }
  - { name: style, type: object, ref: style, default: {} }
  - { name: media, type: object, ref: media_ref }
  - { name: action, type: object, ref: action_intent }
  - { name: accessibility, type: object, ref: accessibility, default: {} }
subcontracts:
  style:
    class_name: AssistantPresentationStyleWire
    fields:
      - { name: tone, type: enum, enum_ref: AssistantPresentationTone, default: neutral }
      - { name: density, type: enum, enum_ref: AssistantPresentationDensity, default: standard }
      - { name: emphasis, type: string, default: normal }
      - { name: variant, type: string, default: standard }
      - { name: alignment, type: string, default: start }
      - { name: spacingRole, type: string, default: related }
      - { name: aspectRatio, type: double, default: 0.0 }
      - { name: responsiveSpan, type: int, default: 1 }
  media_ref:
    class_name: AssistantPresentationMediaRefWire
    fields:
      - { name: mediaAssetId, type: string, required: true }
      - { name: alt, type: string, required: true }
      - { name: width, type: int, default: 0 }
      - { name: height, type: int, default: 0 }
      - { name: provenanceRef, type: string, required: true }
  action_intent:
    class_name: AssistantActionIntentWire
    fields:
      - { name: intentId, type: string, required: true }
      # 闭集：Navigate / ApproveTool / ExecuteDeviceAction / ProvideInput。
      # runtime 必须拒绝未知 kind，禁止 operation + payload Map 或版本信封。
      - { name: kind, type: string, required: true }
      - { name: requestDigest, type: string, required: true }
      - { name: jti, type: string, required: true }
      - { name: issuedAt, type: timestamp, required: true }
      - { name: expiresAt, type: timestamp, required: true }
      - { name: navigate, type: object, ref: navigate_intent }
      - { name: approveTool, type: object, ref: approve_tool_intent }
      - { name: executeDeviceAction, type: object, ref: execute_device_action_intent }
      - { name: provideInput, type: object, ref: provide_input_intent }
  navigate_intent:
    class_name: AssistantNavigateIntentWire
    fields:
      - { name: routeId, type: string, required: true }
      - { name: objectTypeRef, type: string, required: true }
      - { name: objectId, type: string, required: true }
  approve_tool_intent:
    class_name: AssistantApproveToolIntentWire
    fields:
      - { name: runId, type: string, required: true }
      - { name: toolInvocationId, type: string, required: true }
      - { name: decision, type: string, required: true }
      - { name: capability, type: string, required: true }
      - { name: inputDigest, type: string, required: true }
      - { name: approvalPermit, type: string, required: true }
  execute_device_action_intent:
    class_name: AssistantExecuteDeviceActionIntentWire
    fields:
      - { name: runId, type: string, required: true }
      - { name: toolInvocationId, type: string, required: true }
      - { name: installationId, type: string, required: true }
      - { name: deviceId, type: string, required: true }
      - { name: capability, type: string, required: true }
      - { name: inputDigest, type: string, required: true }
      - { name: idempotencyKey, type: string, required: true }
      - { name: deviceActionPermit, type: string, required: true }
  provide_input_intent:
    class_name: AssistantProvideInputIntentWire
    fields:
      - { name: runId, type: string, required: true }
      - { name: toolInvocationId, type: string, required: true }
      - { name: inputName, type: string, required: true }
      - { name: inputSchemaRef, type: string, required: true }
      - { name: inputPermit, type: string, required: true }
  accessibility:
    class_name: AssistantPresentationAccessibilityWire
    fields:
      - { name: semanticLabel, type: string, default: '' }
      - { name: semanticHint, type: string, default: '' }
      - { name: excludeFromSemantics, type: bool, default: false }
