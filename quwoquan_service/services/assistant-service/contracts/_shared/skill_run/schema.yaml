# SkillRun：与 AssistantTurnOutput.skillRuns 项对齐；代码由 codegen_app_metadata 生成。
dart_class: SkillRun
library_path: service/assistant_service/assistant/assistant_run/domain/skill_run.dart
output_path: service/assistant_service/assistant/assistant_run/domain/generated/skill_run.g.dart
fields:
  - name: runId
    source: runId
    dart_type: String
    json_key: runId
  - name: domainId
    source: domainId
    dart_type: String
    json_key: domainId
  - name: goal
    source: goal
    dart_type: String
    json_key: goal
  - name: problemClass
    source: problemClass
    dart_type: String
    enum_ref: ProblemClass
    json_key: problemClass
  - name: shell
    source: shell
    dart_type: Map<String, dynamic>
    json_key: shell
    default: const <String, dynamic>{}
  - name: slotState
    source: slotState
    dart_type: Map<String, dynamic>
    json_key: slotState
    default: const <String, dynamic>{}
  - name: answerReady
    source: answerReady
    dart_type: bool
    json_key: answerReady
    default: false
  - name: stopReason
    source: stopReason
    dart_type: String
    json_key: stopReason
    default: "''"
  - name: references
    source: references
    dart_type: List<Map<String, dynamic>>
    json_key: references
    default: const <Map<String, dynamic>>[]
  - name: resultSummary
    source: resultSummary
    dart_type: String
    json_key: resultSummary
    default: "''"
