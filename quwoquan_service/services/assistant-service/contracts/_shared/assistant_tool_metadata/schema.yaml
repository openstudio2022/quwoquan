dart_class: AssistantToolMetadataWire
library_path: assistant/generated/contracts/assistant_tool_metadata.g.dart
output_path: assistant/generated/contracts/assistant_tool_metadata.g.dart
contract: assistant_tool_metadata
kind: shared_wire_contract
fields:
  - { name: toolName, type: string, required: true }
  - { name: displayName, type: string, default: '' }
  - { name: description, type: string, default: '' }
  - { name: namespace, type: string, required: true }
  - { name: placement, type: string, default: cloud }
  - { name: inputSchema, type: map, default: {} }
  - { name: outputSchema, type: map, default: {} }
  - { name: requiresConfirmation, type: bool, default: false }
  - { name: idempotency, type: string, default: none }
  - { name: sensitivity, type: string, default: internal }
  - { name: environmentScopes, type: list<string>, default: [] }
  - { name: serverInjectedInputs, type: list<string>, default: [] }
  - { name: readOnly, type: bool, default: true }
  - { name: capability, type: object, ref: capability_policy, default: {} }
  - { name: research, type: object, ref: research_policy, default: {} }
  - { name: confirmation, type: object, ref: confirmation_policy, default: {} }
  - { name: resilience, type: object, ref: resilience_policy, default: {} }
  - { name: recovery, type: object, ref: recovery_policy, default: {} }
subcontracts:
  capability_policy:
    class_name: AssistantToolCapabilityPolicyWire
    fields:
      - { name: capabilityKey, type: string, default: '' }
      - { name: connectorRequirement, type: string, default: none }
      - { name: consentScopes, type: list<string>, default: [] }
      - { name: allowedSurfaceKinds, type: list<string>, default: [] }
      - { name: recheckAtExecution, type: bool, default: false }
  research_policy:
    class_name: AssistantToolResearchPolicyWire
    fields:
      - { name: operation, type: string, default: none }
      - { name: parallelInputField, type: string, default: '' }
      - { name: targetInputField, type: string, default: '' }
      - { name: targetKindField, type: string, default: '' }
      - { name: targetValueField, type: string, default: '' }
      - { name: reusableSourceTargetKinds, type: list<string>, default: [] }
      - { name: childTargetKinds, type: list<string>, default: [] }
  confirmation_policy:
    class_name: AssistantToolConfirmationPolicyWire
    fields:
      - { name: templateRef, type: string, default: '' }
      - { name: title, type: string, default: '' }
      - { name: description, type: string, default: '' }
      - { name: completionSummary, type: string, default: '' }
      - { name: displayFields, type: list<object>, ref: confirmation_display_field, default: [] }
  confirmation_display_field:
    class_name: AssistantToolConfirmationDisplayFieldWire
    fields:
      - { name: inputKey, type: string, required: true }
      - { name: label, type: string, required: true }
  resilience_policy:
    class_name: AssistantToolResiliencePolicyWire
    fields:
      - { name: timeoutMs, type: int, default: 5000 }
      - { name: maxAttempts, type: int, default: 1 }
      - { name: retryBackoffMs, type: int, default: 0 }
      - { name: loopDetectionWindow, type: int, default: 3 }
  recovery_policy:
    class_name: AssistantToolRecoveryPolicyWire
    fields:
      - { name: action, type: enum, enum_ref: ToolRecoveryAction, default: fail_turn }
      - { name: disruptionLevel, type: enum, enum_ref: ToolDisruptionLevel, default: partial }
      - { name: userVisibleSummary, type: string, default: '' }
