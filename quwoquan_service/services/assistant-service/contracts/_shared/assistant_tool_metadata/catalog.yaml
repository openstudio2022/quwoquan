                additionalProperties: false
                properties:
                  entries:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        entryId: {type: string, minLength: 1}
                        content: {type: string, minLength: 1}
                        checked: {type: boolean}
