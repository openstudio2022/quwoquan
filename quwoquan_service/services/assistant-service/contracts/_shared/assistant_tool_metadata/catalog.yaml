catalog: assistant_tool_metadata
description: Assistant Tool Fabric 的唯一工具目录；运行时注册表由本文件生成，不允许在 Go 中复制工具 schema。
tools:
  - toolName: app_search
    displayName: 应用信息检索
    description: 通过 search-service 检索趣我圈站内公开对象，并返回可核验引用。
    namespace: app
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1, description: 站内检索词。}
      required: [query]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        provider: {type: string}
        summary: {type: string}
        results: {type: array}
        citations: {type: array}
        emergedTagRefs:
          type: array
          items: {type: string, minLength: 1}
        provenance: {type: object}
        evidenceAssessment:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [accepted, insufficient, rejected]}
            evidenceSufficient: {type: boolean}
            replanRequired: {type: boolean}
            reason: {type: string}
            targetIds: {type: array, items: {type: string}}
            documentIds: {type: array, items: {type: string}}
            artifactRefs: {type: array, items: {type: string}}
            sourceIds: {type: array, items: {type: string}}
          required: [status, evidenceSufficient, replanRequired, reason, targetIds, documentIds, artifactRefs, sourceIds]
      required: [provider, summary, results, citations, emergedTagRefs, provenance, evidenceAssessment]
    requiresConfirmation: false
    idempotency: read_only
    sensitivity: public
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: []
    readOnly: true
    research: {operation: discover}
    resilience: {timeoutMs: 5000, maxAttempts: 1, retryBackoffMs: 0, loopDetectionWindow: 3}
    recovery: {action: fail_turn, disruptionLevel: partial}

  - toolName: calendar_create_reminder
    displayName: 创建系统日程提醒
    description: 在用户设备的系统日历中创建带提醒的日程；必须先展示完整提案并取得用户明确确认。
    namespace: device
    placement: device_action
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200, description: 日程标题。}
        startsAt: {type: string, minLength: 1, description: 带时区的 ISO-8601 开始时间。}
        durationMinutes: {type: integer, minimum: 1, maximum: 1440}
        reminderMinutes: {type: integer, minimum: 0, maximum: 10080}
        notes: {type: string, maxLength: 2000}
      required: [title, startsAt]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [created, rejected, unavailable, failed]}
        deviceObjectId: {type: string}
      required: [status]
    requiresConfirmation: true
    idempotency: idempotency_key
    sensitivity: private
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: []
    readOnly: false
    capability:
      capabilityKey: calendar.event.create
      connectorRequirement: none
      consentScopes: [calendar.event.create]
      allowedSurfaceKinds: [personal]
      recheckAtExecution: true
    bindingPolicy:
      priority: [device_capability, user_connector]
      resultType: ResolvedCapabilityGrant
      noFallbackAfterSelection: true
    executionPermit:
      required: true
      bindTo: [capabilityKey, accountId, typedInputDigest, idempotencyKey]
    confirmation:
      templateRef: assistant.tool_confirmation
      title: 确认创建系统日程
      description: 确认后，小趣会请求当前设备创建以下日程提醒。
      completionSummary: 设备上的系统日程已创建。
      displayFields:
        - {inputKey: title, label: 标题}
        - {inputKey: startsAt, label: 开始时间}
        - {inputKey: durationMinutes, label: 时长（分钟）}
        - {inputKey: reminderMinutes, label: 提前提醒（分钟）}
        - {inputKey: notes, label: 备注}
    resilience: {timeoutMs: 30000, maxAttempts: 1, retryBackoffMs: 0, loopDetectionWindow: 1}
    recovery: {action: ask_user, disruptionLevel: partial}

  - toolName: calendar_update_event
    displayName: 更新日历事项
    description: 更新当前设备或已授权用户日历连接中的既有事项；必须先展示 typed 变更并取得用户明确确认。
    namespace: device
    placement: device_action
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        eventId: {type: string, minLength: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        startsAt: {type: string, minLength: 1}
        durationMinutes: {type: integer, minimum: 1, maximum: 1440}
        reminderMinutes: {type: integer, minimum: 0, maximum: 10080}
        notes: {type: string, maxLength: 2000}
      required: [eventId]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [updated, rejected, unavailable, failed]}
        eventId: {type: string}
      required: [status]
    requiresConfirmation: true
    idempotency: idempotency_key
    sensitivity: private
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: []
    readOnly: false
    capability:
      capabilityKey: calendar.event.update
      connectorRequirement: none
      consentScopes: [calendar.event.update]
      allowedSurfaceKinds: [personal]
      recheckAtExecution: true
    bindingPolicy:
      priority: [device_capability, user_connector]
      resultType: ResolvedCapabilityGrant
      noFallbackAfterSelection: true
    executionPermit:
      required: true
      bindTo: [capabilityKey, accountId, typedInputDigest, idempotencyKey]
    confirmation:
      templateRef: assistant.tool_confirmation
      title: 确认更新日历事项
      description: 确认后，小趣会按以下变更更新日历事项。
      completionSummary: 日历事项已更新。
      displayFields:
        - {inputKey: eventId, label: 日历事项}
        - {inputKey: title, label: 标题}
        - {inputKey: startsAt, label: 开始时间}
        - {inputKey: durationMinutes, label: 时长（分钟）}
        - {inputKey: reminderMinutes, label: 提前提醒（分钟）}
        - {inputKey: notes, label: 备注}
    resilience: {timeoutMs: 30000, maxAttempts: 1, retryBackoffMs: 0, loopDetectionWindow: 1}
    recovery: {action: ask_user, disruptionLevel: partial}

  - toolName: calendar_delete_event
    displayName: 删除日历事项
    description: 删除当前设备或已授权用户日历连接中的既有事项；必须先展示目标并取得用户明确确认。
    namespace: device
    placement: device_action
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        eventId: {type: string, minLength: 1}
        displaySummary: {type: string, minLength: 1, maxLength: 300}
      required: [eventId, displaySummary]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [deleted, rejected, unavailable, failed]}
        eventId: {type: string}
      required: [status]
    requiresConfirmation: true
    idempotency: idempotency_key
    sensitivity: private
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: []
    readOnly: false
    capability:
      capabilityKey: calendar.event.delete
      connectorRequirement: none
      consentScopes: [calendar.event.delete]
      allowedSurfaceKinds: [personal]
      recheckAtExecution: true
    bindingPolicy:
      priority: [device_capability, user_connector]
      resultType: ResolvedCapabilityGrant
      noFallbackAfterSelection: true
    executionPermit:
      required: true
      bindTo: [capabilityKey, accountId, typedInputDigest, idempotencyKey]
    confirmation:
      templateRef: assistant.tool_confirmation
      title: 确认删除日历事项
      description: 确认后，小趣会删除以下日历事项。
      completionSummary: 日历事项已删除。
      displayFields:
        - {inputKey: displaySummary, label: 日历事项}
    resilience: {timeoutMs: 30000, maxAttempts: 1, retryBackoffMs: 0, loopDetectionWindow: 1}
    recovery: {action: ask_user, disruptionLevel: partial}

  - toolName: web_search
    displayName: 网络搜索
    description: 检索公开网络页面并返回可核验引用；天气与行情由各自的 typed capability tool 提供。
    namespace: public_web
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        runId: {type: string, minLength: 1}
        skillId: {type: string}
        query: {type: string, minLength: 1, description: 检索主查询词。}
        searchQueries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              dimension: {type: string}
              query: {type: string}
            required: [dimension, query]
      required: [query]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        summary: {type: string}
        references: {type: array}
        reliable: {type: boolean}
        evidenceAssessment:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [accepted, insufficient, rejected]}
            evidenceSufficient: {type: boolean}
            replanRequired: {type: boolean}
            reason: {type: string}
            targetIds: {type: array, items: {type: string}}
            documentIds: {type: array, items: {type: string}}
            artifactRefs: {type: array, items: {type: string}}
            sourceIds: {type: array, items: {type: string}}
          required: [status, evidenceSufficient, replanRequired, reason, targetIds, documentIds, artifactRefs, sourceIds]
      required: [summary, references, reliable, evidenceAssessment]
    requiresConfirmation: false
    idempotency: read_only
    sensitivity: public
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: [runId, skillId]
    readOnly: true
    research: {operation: discover, parallelInputField: searchQueries}
    failure: {providerFailureCode: ASSISTANT.MIDDLEWARE.public_search_provider_unavailable}
    resilience: {timeoutMs: 12000, maxAttempts: 2, retryBackoffMs: 200, loopDetectionWindow: 3}
    recovery: {action: degrade_answer, disruptionLevel: partial}

  - toolName: location_poi_search
    displayName: 地点搜索
    description: 通过环境绑定的公共地图 Provider 搜索标准化 POI；无用户 Connector 生命周期，不按平台名称分支。
    namespace: location
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        runId: {type: string, minLength: 1}
        skillId: {type: string}
        query: {type: string, minLength: 1, maxLength: 200}
        cityCode: {type: string, minLength: 1}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        limit: {type: integer, minimum: 1, maximum: 50}
      required: [query]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              locationRef: {type: string}
              name: {type: string}
              address: {type: string}
              latitude: {type: number}
              longitude: {type: number}
            required: [locationRef, name, latitude, longitude]
        references: {type: array}
      required: [items, references]
    requiresConfirmation: false
    idempotency: read_only
    sensitivity: private
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: [runId, skillId]
    readOnly: true
    capability:
      capabilityKey: location.poi.search
      connectorRequirement: none
      consentScopes: []
      allowedSurfaceKinds: [personal, conversation, circle]
      recheckAtExecution: true
    bindingPolicy:
      priority: [public_provider]
      resultType: ResolvedCapabilityGrant
      noFallbackAfterSelection: true
    resilience: {timeoutMs: 5000, maxAttempts: 2, retryBackoffMs: 200, loopDetectionWindow: 3}
    recovery: {action: ask_user, disruptionLevel: partial}

  - toolName: location_route_read
    displayName: 路线查询
    description: 通过环境绑定的公共地图 Provider 读取两点间标准化路线；无用户 Connector 生命周期。
    namespace: location
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        runId: {type: string, minLength: 1}
        skillId: {type: string}
        originLocationRef: {type: string, minLength: 1}
        destinationLocationRef: {type: string, minLength: 1}
        travelMode: {type: string, enum: [walking, cycling, driving, transit]}
      required: [originLocationRef, destinationLocationRef, travelMode]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        summary: {type: string}
        distanceMeters: {type: integer, minimum: 0}
        durationSeconds: {type: integer, minimum: 0}
        routeRef: {type: string}
        references: {type: array}
      required: [summary, distanceMeters, durationSeconds, routeRef, references]
    requiresConfirmation: false
    idempotency: read_only
    sensitivity: private
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: [runId, skillId]
    readOnly: true
    capability:
      capabilityKey: location.route.read
      connectorRequirement: none
      consentScopes: []
      allowedSurfaceKinds: [personal, conversation, circle]
      recheckAtExecution: true
    bindingPolicy:
      priority: [public_provider]
      resultType: ResolvedCapabilityGrant
      noFallbackAfterSelection: true
    resilience: {timeoutMs: 8000, maxAttempts: 2, retryBackoffMs: 200, loopDetectionWindow: 3}
    recovery: {action: ask_user, disruptionLevel: partial}

