    namespace: finance
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        runId: {type: string, minLength: 1}
        skillId: {type: string}
        query: {type: string, minLength: 1, description: 要核验的行情问题。}
        symbol: {type: string, minLength: 1}
        symbols: {type: array, items: {type: string, minLength: 1}, maxItems: 20}
      required: [query]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        summary: {type: string}
        references: {type: array}
        reliable: {type: boolean}
        evidenceAssessment:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [accepted, insufficient, rejected]}
            evidenceSufficient: {type: boolean}
            replanRequired: {type: boolean}
            reason: {type: string}
            targetIds: {type: array, items: {type: string}}
            documentIds: {type: array, items: {type: string}}
            artifactRefs: {type: array, items: {type: string}}
            sourceIds: {type: array, items: {type: string}}
          required: [status, evidenceSufficient, replanRequired, reason, targetIds, documentIds, artifactRefs, sourceIds]
      required: [summary, references, reliable, evidenceAssessment]
    requiresConfirmation: false
    idempotency: read_only
    sensitivity: public
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: [runId, skillId]
    readOnly: true
    research: {operation: discover}
    failure: {providerFailureCode: ASSISTANT.MIDDLEWARE.finance_provider_unavailable}
    resilience: {timeoutMs: 10000, maxAttempts: 2, retryBackoffMs: 200, loopDetectionWindow: 3}
    recovery: {action: degrade_answer, disruptionLevel: partial}

  - toolName: web_open
    displayName: 公开网页读取
    description: 读取公开 HTTPS URL、搜索来源或已读文档链接，并提交不可伪造的来源血缘。
    namespace: public_web
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        runId: {type: string, minLength: 1}
        skillId: {type: string}
        target:
          type: object
          additionalProperties: false
          properties:
            kind: {type: string, enum: [url, source, document_link]}
            value: {type: string, minLength: 1}
          required: [kind, value]
      required: [runId, target]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        document: {type: object}
        reference: {type: object}
        evidenceAssessment:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [accepted, insufficient, rejected]}
            evidenceSufficient: {type: boolean}
            replanRequired: {type: boolean}
            reason: {type: string}
            targetIds: {type: array, items: {type: string}}
            documentIds: {type: array, items: {type: string}}
            artifactRefs: {type: array, items: {type: string}}
            sourceIds: {type: array, items: {type: string}}
          required: [status, evidenceSufficient, replanRequired, reason, targetIds, documentIds, artifactRefs, sourceIds]
      required: [document, reference, evidenceAssessment]
    requiresConfirmation: false
    idempotency: content_addressed
    sensitivity: public
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: [runId, skillId]
    readOnly: true
    research:
      operation: navigate
      targetInputField: target
      targetKindField: kind
      targetValueField: value
      reusableSourceTargetKinds: [source]
      childTargetKinds: [document_link]
    resilience: {timeoutMs: 15000, maxAttempts: 2, retryBackoffMs: 250, loopDetectionWindow: 3}
    recovery: {action: degrade_answer, disruptionLevel: partial}

  - toolName: web_find
    displayName: 网页内容查找
    description: 在当前 Run 已读取并持久化的网页文档中查找文本，不发起新的网络请求。
    namespace: public_web
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        runId: {type: string, minLength: 1}
        documentId: {type: string, minLength: 1}
        pattern: {type: string, minLength: 1, maxLength: 256}
        maxMatches: {type: integer, minimum: 1, maximum: 20}
      required: [runId, documentId, pattern]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        result: {type: object}
        reference: {type: object}
        evidenceAssessment:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [accepted, insufficient, rejected]}
            evidenceSufficient: {type: boolean}
            replanRequired: {type: boolean}
            reason: {type: string}
            targetIds: {type: array, items: {type: string}}
            documentIds: {type: array, items: {type: string}}
            artifactRefs: {type: array, items: {type: string}}
            sourceIds: {type: array, items: {type: string}}
          required: [status, evidenceSufficient, replanRequired, reason, targetIds, documentIds, artifactRefs, sourceIds]
      required: [result, reference, evidenceAssessment]
    requiresConfirmation: false
    idempotency: read_only
    sensitivity: public
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: [runId]
    readOnly: true
    research: {operation: inspect}
    resilience: {timeoutMs: 2000, maxAttempts: 1, retryBackoffMs: 0, loopDetectionWindow: 3}
    recovery: {action: degrade_answer, disruptionLevel: partial}

  - toolName: gathering.search_public
    displayName: 搜索公开聚会
    description: 按 canonical source object 搜索公开 Gathering 摘要，不读取私密地点、参与者或申请内容。
    namespace: gathering
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        sourceObjectTypeRef: {type: string, minLength: 1}
        sourceObjectId: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 50}
        cursor: {type: string}
      required: [sourceObjectTypeRef, sourceObjectId, limit]
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        gatherings:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              gatheringId: {type: string}
              title: {type: string}
              summary: {type: string}
              startAt: {type: string}
              endAt: {type: string}
              meetingPointLabel: {type: string}
              remainingCapacity: {type: integer}
              admissionMode: {type: string}
            required: [gatheringId, title, summary, startAt, endAt, meetingPointLabel, remainingCapacity, admissionMode]
        nextCursor: {type: string}
      required: [gatherings]
    requiresConfirmation: false
    idempotency: read_only
    sensitivity: public
    environmentScopes: [alpha, beta, gamma, prod]
    serverInjectedInputs: []
    readOnly: true
    riskTier: low
    ownerService: circle-service
    ownerOperationId: circle.gathering.ListGatheringsBySource
    ownerRequestEntity: GatheringListBySourceQuery
    ownerResponseEntity: GatheringBySourcePageSlice
    contractDigest: sha256:72f226a75c02f37994ba81c37150dbe61fcb67c5c099ea5e43e0aad7b43a9e4f
    requiredAuth:
      grantKind: delegated_query
      scopes: [circle.gathering.public.search]
      resourceType: circle.gathering.source
      resourceIdSource: sourceObjectTypeRef+sourceObjectId
    requiredCapability: circle.gathering.public.search
    capability:
      capabilityKey: circle.gathering.public.search
      connectorRequirement: none
      consentScopes: [circle.gathering.public.search]
      allowedSurfaceKinds: [conversation]
      recheckAtExecution: true
    approvalPolicy: {mode: none, userConfirmationRequiredBeforeEffect: false}
    redaction:
      policy: public_summary_only
      omittedFields: [exactPlace, participantRoster, applicationAnswers]
    audit:
      eventName: assistant.gathering.public_search
      includeRequestDigest: true
      includeGrantJti: true
      neverLog: [delegatedGrant]
    resilience: {timeoutMs: 5000, maxAttempts: 1, retryBackoffMs: 0, loopDetectionWindow: 3}
    recovery: {action: fail_turn, disruptionLevel: partial}

  - toolName: gathering.read_public
    displayName: 读取公开聚会
    description: 读取一个 Gathering 的公开详情，不返回私密地点、参与者或申请内容。
    namespace: gathering
    placement: cloud
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        gatheringId: {type: string, minLength: 1}
