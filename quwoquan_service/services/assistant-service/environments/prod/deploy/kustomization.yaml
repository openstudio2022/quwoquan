apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/base
  - policy-publish-job.yaml
namespace: quwoquan-prod
patches:
  - path: policy-publish-init.yaml
  - path: rollout.yaml
labels:
  - pairs:
      quwoquan.io/environment: prod
    includeSelectors: false
replicas:
  - name: assistant-service
    count: 2
