overrides:
  sys.assistant-service.account_security_authority.base_url: http://user-service:18081
  sys.assistant-service.account_security_authority.timeout_ms: 300
  sys.assistant-service.notification_service.base_url: http://notification-service:18087
  # service-core 镜像不再内嵌 skill release 资产；本地环境经 config-root 挂载供给。
  sys.assistant-service.skill_package.asset_root: /etc/qwq-config/skill-packages/official
  sys.assistant-service.policy_publication.release_artifact_ref: assistant/assistant-default/releases/6579402860644c0273747b33c23962cff013caec0839407afbe7dffdcc50f8e7.json
  sys.assistant-service.policy_publication.rollout_artifact_ref: assistant/assistant-default/rollouts/revision-4.json
  sys.assistant-service.redis.general.addr: redis:6379
  sys.assistant-service.redis.rec.addr: redis:6379
secretRefs:
  sys.assistant-service.skill_package.trusted_public_keys_json: ASSISTANT_SKILL_PACKAGE_TRUSTED_PUBLIC_KEYS_JSON
  sys.assistant-service.mongodb.uri: MONGODB_URI
  sys.assistant-service.postgres.dsn: POSTGRES_DSN
  sys.assistant-service.redis.general.password: REDIS_GENERAL_PASSWORD
  sys.assistant-service.redis.rec.password: REDIS_REC_PASSWORD
externalBindings:
  integration.connector_grant.read:
    state: enabled
    adapter: ext.first_party.http_authority
    endpointRef: service_topology:integration-service
  chat.conversation.membership.read:
    state: enabled
    adapter: ext.first_party.http_authority
    endpointRef: service_topology:chat-service
  circle.membership.self.read:
    state: enabled
    adapter: ext.first_party.http_authority
    endpointRef: service_topology:circle-service
  assistant.model.generation:
    state: enabled
    adapter: ext.llm.protocol_fixture
    endpointRef: local_topology:provider-protocol-substitute
  assistant.public.search:
    state: enabled
    adapter: ext.search.protocol_fixture
    endpointRef: local_topology:provider-protocol-substitute
  assistant.weather.forecast:
    state: enabled
    adapter: ext.weather.protocol_fixture
    endpointRef: local_topology:provider-protocol-substitute
  assistant.finance.quote:
    state: enabled
    adapter: ext.finance.protocol_fixture
    endpointRef: local_topology:provider-protocol-substitute
