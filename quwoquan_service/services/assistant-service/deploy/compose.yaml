# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  assistant-service:
    profiles: ["assistant-runtime"]
    image: "${QWQ_COMPOSE_ASSISTANT_SERVICE_IMAGE:?fixed assistant-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/assistant-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: assistant-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      QWQ_ARTIFACT_IDENTITY_FILE: /etc/quwoquan/artifact-identity.json
      CONFIG_VERSION: "${QWQ_COMPOSE_ASSISTANT_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_ASSISTANT_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      ASSISTANT_SERVICE_ADDR: ":18087"
      ASSISTANT_POLICY_RESOURCE_ROOT: /app/resources/policies
      ASSISTANT_MONGO_URI: mongodb://mongodb:27017
      ASSISTANT_MONGO_DATABASE: quwoquan_assistant
      ASSISTANT_POSTGRES_DSN: "${ASSISTANT_POSTGRES_DSN:-postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable}"
      ASSISTANT_REDIS_GENERAL_ADDR: redis:6379
      ASSISTANT_REDIS_REC_ADDR: redis:6379
      ASSISTANT_MODEL_COMPLETION_URL: "${ASSISTANT_MODEL_COMPLETION_URL:-}"
      ASSISTANT_CHAT_BASE_URL: "http://chat-service:18081"
      ASSISTANT_CIRCLE_BASE_URL: "http://circle-service:18082"
      ASSISTANT_NOTIFICATION_BASE_URL: "http://notification-service:18087"
      ASSISTANT_INTEGRATION_BASE_URL: "http://integration-service:18086"
      ASSISTANT_USER_SERVICE_BASE_URL: "http://user-service:18081"
      ASSISTANT_MODEL_API_KEY: "${ASSISTANT_MODEL_API_KEY:-}"
      ASSISTANT_PUBLIC_SEARCH_URL: "${ASSISTANT_PUBLIC_SEARCH_URL:-}"
      ASSISTANT_WEATHER_GEOCODING_URL: "${ASSISTANT_WEATHER_GEOCODING_URL:-}"
      ASSISTANT_WEATHER_FORECAST_URL: "${ASSISTANT_WEATHER_FORECAST_URL:-}"
      ASSISTANT_FINANCE_CHART_URL: "${ASSISTANT_FINANCE_CHART_URL:-}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      ASSISTANT_SKILL_PACKAGE_TRUSTED_PUBLIC_KEYS_JSON: "${ASSISTANT_SKILL_PACKAGE_TRUSTED_PUBLIC_KEYS_JSON:?ASSISTANT_SKILL_PACKAGE_TRUSTED_PUBLIC_KEYS_JSON is required}"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      circle-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${QWQ_COMPOSE_ARTIFACT_IDENTITY_FILE:?artifact identity mount is required}:/etc/quwoquan/artifact-identity.json:ro
    ports:
      - "${QWQ_COMPOSE_ASSISTANT_PORT:-19230}:18087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18087/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
