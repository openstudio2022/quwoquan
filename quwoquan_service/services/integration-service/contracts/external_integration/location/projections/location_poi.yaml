read_model: LocationPoi
description: integration/external_integration/location 附近与搜索 API 返回的 POI 标准化视图；端侧只使用由 fields.yaml 派生的 generated wire 类型。
source_entities:
- LocationPoi
consumers:
- app (create/entry location selector)
fields:
- name: id
  type: string
- name: name
  type: string
- name: latitude
  type: double
- name: longitude
  type: double
- name: address
  type: string
  nullable: true
- name: distanceMeters
  type: int
  nullable: true
