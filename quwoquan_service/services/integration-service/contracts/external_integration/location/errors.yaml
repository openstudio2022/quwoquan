description: 'integration/external_integration/location 结构化错误码声明。

  '
errors:
- code: INTEGRATION.USER.invalid_argument
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - {surface: http, operations: [SearchLocations, ReadLocationRoute]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 请求参数无效，请检查后重试
    en: Request parameters are invalid
- code: INTEGRATION.USER.location_permission_required
  reason: permission_denied
  http_status: 403
  emitted_by:
  - {surface: http, operations: [GetNearbyLocations]}
  recovery_action: surface
  disruption_level: permissionCard
  dart_const: locationPermissionRequired
  go_const: ErrLocationPermissionRequired
  user_message:
    zh: 请在设置中为本应用开启定位权限
    en: Please enable location permission for this app in Settings
- code: INTEGRATION.MIDDLEWARE.upstream_timeout
  reason: timeout
  http_status: 504
  emitted_by:
  - {surface: http, operations: [GetNearbyLocations, SearchLocations, ReadLocationRoute]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: upstreamTimeout
  go_const: ErrUpstreamTimeout
  user_message:
    zh: 位置服务响应超时，请稍后重试
    en: Location upstream timed out, please retry
- code: INTEGRATION.MIDDLEWARE.location_provider_unavailable
  reason: location_provider_unavailable
  http_status: 503
  emitted_by:
  - {surface: http, operations: [GetNearbyLocations, SearchLocations, ReadLocationRoute]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: locationProviderUnavailable
  go_const: ErrLocationProviderUnavailable
  user_message:
    zh: 位置服务暂不可用，请稍后重试
    en: Location provider is temporarily unavailable, please retry
- code: INTEGRATION.MIDDLEWARE.location_provider_rate_limited
  reason: location_provider_rate_limited
  http_status: 503
  emitted_by:
  - {surface: http, operations: [SearchLocations, ReadLocationRoute]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 30
  dart_const: locationProviderRateLimited
  go_const: ErrLocationProviderRateLimited
  user_message:
    zh: 位置服务请求繁忙，请稍后重试
    en: Location provider is rate limited, please retry later
- code: INTEGRATION.MIDDLEWARE.location_provider_invalid_response
  reason: location_provider_invalid_response
  http_status: 502
  emitted_by:
  - {surface: http, operations: [SearchLocations, ReadLocationRoute]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: locationProviderInvalidResponse
  go_const: ErrLocationProviderInvalidResponse
  user_message:
    zh: 位置服务返回异常，请稍后重试
    en: Location provider returned an invalid response
- code: INTEGRATION.SYSTEM.location_internal_error
  reason: internal_error
  http_status: 500
  emitted_by:
  - {surface: http, operations: [GetNearbyLocations, SearchLocations, ReadLocationRoute]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: locationInternalError
  go_const: ErrLocationInternalError
  user_message:
    zh: 位置服务异常，请稍后重试
    en: Location service internal error
