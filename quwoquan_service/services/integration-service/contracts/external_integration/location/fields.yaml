description: Location 外部能力引用、标准化 POI 与查询审计事件的唯一字段真相源。
fields:
  - name: locationRef
    source: locationRef
    type: string
    constraints: [PK, NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: transport_only
types:
  LocationPoi:
    description: 外部位置 provider 返回的标准化 POI 读模型。
    fields:
      - {name: id, type: string, constraints: [PK, NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: name, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: latitude, type: double, constraints: [NOT_NULL], classification: PII, log_policy: drop, api_exposure: read, ops_exposure: none}
      - {name: longitude, type: double, constraints: [NOT_NULL], classification: PII, log_policy: drop, api_exposure: read, ops_exposure: none}
      - {name: address, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: mask, api_exposure: read, ops_exposure: read}
      - {name: distanceMeters, type: int, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  LocationPoiListSlice:
    description: 附近与关键词位置查询共用的有界 POI 结果切片。
    fields:
      - name: items
        source: items
        type: '[]LocationPoi'
        constraints: [NOT_NULL]
        classification: PII
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read
  LocationNearbyQueriedEvent:
    fields:
      - {name: provider, type: enum, enum_ref: LocationProvider, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: latitude, type: double, constraints: [NOT_NULL], classification: PII, log_policy: drop, api_exposure: none, ops_exposure: none}
      - {name: longitude, type: double, constraints: [NOT_NULL], classification: PII, log_policy: drop, api_exposure: none, ops_exposure: none}
      - {name: radiusMeters, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: limit, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
  LocationSearchQueriedEvent:
    fields:
      - {name: provider, type: enum, enum_ref: LocationProvider, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: query, type: string, constraints: [NOT_NULL], classification: PII, log_policy: hash, api_exposure: none, ops_exposure: none}
      - {name: cityCode, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: limit, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
  LocationProviderSwitchedEvent:
    fields:
      - {name: fromProvider, type: enum, enum_ref: LocationProvider, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: toProvider, type: enum, enum_ref: LocationProvider, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: reason, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
  LocationSearchQueryParams:
    fields:
      - name: q
        type: string
        client_dart_name: query
        client_dart_type: String
      - name: cityCode
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_omit_empty: true
      - name: lat
        type: double
        constraints:
          - NULLABLE
        client_dart_name: latitude
        client_dart_type: double?
      - name: lng
        type: double
        constraints:
          - NULLABLE
        client_dart_name: longitude
        client_dart_type: double?
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
  NearbyLocationQueryParams:
    fields:
      - name: lat
        type: double
        constraints:
          - NULLABLE
        client_dart_name: latitude
        client_dart_type: double?
      - name: lng
        type: double
        constraints:
          - NULLABLE
        client_dart_name: longitude
        client_dart_type: double?
      - name: radiusMeters
        type: int
        constraints:
          - NULLABLE
        client_dart_type: int?
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
