backend: mongodb
role: external
collections:
  location_pois:
    entity: Location
    role: projection
    description: 外部位置 authority 的规范化只读目录缓存；不得成为位置事实权威源。
    indexes:
    - name: uq_location_poi_id
      keys:
        poiId: 1
      unique: true
    - name: idx_location_poi_geo
      keys:
        location: 2dsphere
    - name: idx_location_poi_city_name
      keys:
        cityCode: 1
        name: 1
