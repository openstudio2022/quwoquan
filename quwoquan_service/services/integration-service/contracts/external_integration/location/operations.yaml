commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: INTEGRATION_LOCATION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 外部能力集成网关（先覆盖 location）
externalDependencies:
- capability: integration.location.lookup
  port: LocationLookupPort
  operations: [nearby, search]
  conformance: location_lookup
response_list_key: items
api_routes:
- method: GET
  path: /integration/location/nearby
  operation: GetNearbyLocations
  actor: persona_or_device
  application:
    kind: query
    facet: LocationQueryFacade
    method: getNearbyLocations
    reader: NearbyLocationReader
    slice: LocationPoiListSlice
  authorization:
    principal: public
    ownership_policy: public_read
  commercial:
    status: ready
  reliability:
    timeout_ms: 3000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - INTEGRATION.USER.location_unavailable
  - INTEGRATION.USER.location_permission_required
  - INTEGRATION.MIDDLEWARE.upstream_timeout
  - INTEGRATION.MIDDLEWARE.location_provider_unavailable
  - INTEGRATION.SYSTEM.internal_error
  privacy:
    request_classification: PII
    response_classification: PUBLIC
    log_policy: metadata_only
  telemetry:
    metric: integration_location_nearby
    trace: true
    attributes:
    - outcome
    - provider
  slo:
    latency_p95_ms: 1200
    availability_percent: 99.5
  client_contract:
    dart_import: ../integration/location_queries.dart
    request_type: NearbyLocationQueryParams
    response_type: LocationPoiListSlice
    request_encoder: encodeNearbyLocationQuery
    response_decoder: decodeLocationPoiListSlice
  description: 获取当前位置附近 POI 列表（统一输出，不暴露供应商差异）
  query_params:
  - lat
  - lng
  - radiusMeters
  - limit
  response_entity: LocationPoi
  security:
    auth_mode: optional
    principal: owner
    token_transport: bearer
    anonymous_policy: allow
    visibility: public
- method: GET
  path: /integration/location/search
  operation: SearchLocations
  actor: none
  application:
    kind: query
    facet: LocationQueryFacade
    method: searchLocations
    reader: LocationSearchReader
    slice: LocationPoiListSlice
  authorization:
    principal: public
    ownership_policy: public_read
  commercial:
    status: ready
  reliability:
    timeout_ms: 3000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - INTEGRATION.USER.location_unavailable
  - INTEGRATION.USER.invalid_argument
  - INTEGRATION.MIDDLEWARE.upstream_timeout
  - INTEGRATION.MIDDLEWARE.location_provider_unavailable
  - INTEGRATION.SYSTEM.internal_error
  privacy:
    request_classification: PII
    response_classification: PUBLIC
    log_policy: metadata_only
  telemetry:
    metric: integration_location_search
    trace: true
    attributes:
    - outcome
    - provider
  slo:
    latency_p95_ms: 1200
    availability_percent: 99.5
  client_contract:
    dart_import: ../integration/location_queries.dart
    request_type: LocationSearchQueryParams
    response_type: LocationPoiListSlice
    request_encoder: encodeLocationSearchQuery
    response_decoder: decodeLocationPoiListSlice
  description: 按关键词实时搜索 POI（支持城市与当前位置增强）
  query_params:
  - q
  - cityCode
  - lat
  - lng
  - limit
  response_entity: LocationPoi
  security:
    auth_mode: optional
    principal: owner
    token_transport: bearer
    anonymous_policy: allow
    visibility: public
consumers:
- name: app
  capabilities:
  - location_nearby
  - location_search
- name: content-service
  capabilities:
  - location_nearby
  - location_search
- name: circle-service
  capabilities:
  - location_nearby
  - location_search
- name: platform-ops
  capabilities:
  - provider_switch
  - quota_management
