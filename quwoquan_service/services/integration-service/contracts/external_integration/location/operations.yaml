commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: INTEGRATION_LOCATION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 外部能力集成网关（先覆盖 location）
externalDependencies:
  - capability: integration.location.lookup
    port: LocationLookupPort
    operations: [nearby]
    conformance: location_lookup
    adapterContracts:
      ext.map.protocol_fixture:
        endpointEnvs: {base: INTEGRATION_LOCATION_FIXTURE_BASE_URL}
        secretRefs: []
        defaultTimeoutMs: 1200
      ext.map.baidu:
        endpointEnvs: {base: INTEGRATION_LOCATION_BAIDU_BASE_URL}
        secretRefs: [INTEGRATION_LOCATION_BAIDU_AK]
        defaultTimeoutMs: 1200
  - capability: location.poi.search
    port: LocationPoiSearchPort
    operations: [search]
    conformance: location_poi_search
    adapterContracts:
      ext.map.nominatim:
        endpointEnvs: {base: INTEGRATION_LOCATION_NOMINATIM_BASE_URL}
        secretRefs: []
        defaultTimeoutMs: 5000
      ext.map.nominatim.protocol_substitute:
        endpointEnvs: {base: INTEGRATION_LOCATION_NOMINATIM_BASE_URL}
        secretRefs: []
        defaultTimeoutMs: 5000
  - capability: location.route.read
    port: LocationRouteReadPort
    operations: [route]
    conformance: location_route_read
    adapterContracts:
      ext.route.osrm:
        endpointEnvs: {base: INTEGRATION_LOCATION_OSRM_BASE_URL}
        secretRefs: []
        defaultTimeoutMs: 8000
      ext.route.osrm.protocol_substitute:
        endpointEnvs: {base: INTEGRATION_LOCATION_OSRM_BASE_URL}
        secretRefs: []
        defaultTimeoutMs: 8000
response_list_key: items
api_routes:
  - method: GET
    path: /integration/location/nearby
    operation: GetNearbyLocations
    actor: persona_or_device
    application:
      kind: query
      facet: LocationQueryFacade
      method: getNearbyLocations
      reader: NearbyLocationReader
      slice: LocationPoiListSlice
    authorization:
      principal: public
      ownership_policy: public_read
    commercial:
      status: ready
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - INTEGRATION.USER.location_permission_required
      - INTEGRATION.MIDDLEWARE.upstream_timeout
      - INTEGRATION.MIDDLEWARE.location_provider_unavailable
      - INTEGRATION.SYSTEM.location_internal_error
    privacy:
      request_classification: PII
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: integration_location_nearby
      trace: true
      attributes:
        - outcome
        - provider
    slo:
      latency_p95_ms: 1200
      availability_percent: 99.5
    description: 获取当前位置附近 POI 列表（统一输出，不暴露供应商差异）
    request_bindings:
      query:
        - name: lat
          field: lat
          required: false
        - name: lng
          field: lng
          required: false
        - name: radiusMeters
          field: radiusMeters
          required: false
        - name: limit
          field: limit
    response_entity: LocationPoiListSlice
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: NearbyLocationQueryParams
    request_body_kind: none
  - method: GET
    path: /integration/location/search
    operation: SearchLocations
    actor: none
    application:
      kind: query
      facet: LocationQueryFacade
      method: searchLocations
      reader: LocationSearchReader
      slice: LocationPoiListSlice
    authorization:
      principal: public
      ownership_policy: public_read
    commercial:
      status: ready
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - INTEGRATION.USER.invalid_argument
      - INTEGRATION.MIDDLEWARE.upstream_timeout
      - INTEGRATION.MIDDLEWARE.location_provider_rate_limited
      - INTEGRATION.MIDDLEWARE.location_provider_invalid_response
      - INTEGRATION.MIDDLEWARE.location_provider_unavailable
      - INTEGRATION.SYSTEM.location_internal_error
    privacy:
      request_classification: PII
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: integration_location_search
      trace: true
      attributes:
        - outcome
        - provider
    slo:
      latency_p95_ms: 1200
      availability_percent: 99.5
    description: 按关键词实时搜索 POI（支持城市与当前位置增强）
    request_bindings:
      query:
        - name: q
          field: q
        - name: cityCode
          field: cityCode
          required: false
        - name: lat
          field: lat
          required: false
        - name: lng
          field: lng
          required: false
        - name: limit
          field: limit
    response_entity: LocationPoiListSlice
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: LocationSearchQueryParams
    request_body_kind: none
  - method: GET
    path: /integration/location/route
    operation: ReadLocationRoute
    actor: none
    application:
      kind: query
      facet: LocationQueryFacade
      method: readLocationRoute
      reader: LocationRouteReader
      slice: LocationRoute
    authorization:
      principal: public
      ownership_policy: public_read
    commercial:
      status: ready
    reliability:
      timeout_ms: 8000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 1
      idempotency: none
    error_codes:
      - INTEGRATION.USER.invalid_argument
      - INTEGRATION.MIDDLEWARE.upstream_timeout
      - INTEGRATION.MIDDLEWARE.location_provider_rate_limited
      - INTEGRATION.MIDDLEWARE.location_provider_invalid_response
      - INTEGRATION.MIDDLEWARE.location_provider_unavailable
      - INTEGRATION.SYSTEM.location_internal_error
    privacy:
      request_classification: PII
      response_classification: PII
      log_policy: metadata_only
    telemetry:
      metric: integration_location_route_read
      trace: true
      attributes: [outcome, provider, travel_mode]
    slo:
      latency_p95_ms: 2500
      availability_percent: 99.0
    description: 读取 canonical WGS84 起终点间路线；输出统一 polyline、时长与距离，不暴露供应商 wire。
    request_bindings:
      query:
        - {name: originLat, field: originLat}
        - {name: originLng, field: originLng}
        - {name: destinationLat, field: destinationLat}
        - {name: destinationLng, field: destinationLng}
        - {name: travelMode, field: travelMode, required: false}
    response_entity: LocationRoute
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: LocationRouteReadQueryParams
    request_body_kind: none
consumers:
  - name: app
    capabilities:
      - location_nearby
      - location_search
      - location_route_read
  - name: content-service
    capabilities:
      - location_nearby
      - location_search
      - location_route_read
  - name: circle-service
    capabilities:
      - location_nearby
      - location_search
      - location_route_read
  - name: platform-ops
    capabilities:
      - provider_switch
      - quota_management
