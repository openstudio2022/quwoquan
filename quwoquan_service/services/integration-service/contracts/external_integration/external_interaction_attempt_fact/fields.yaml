description: 每一次 provider 调用审计记录，号码等敏感对象只能存 hash 或脱敏值。
fields:
- name: attemptId
  source: attemptId
  type: string
  constraints:
  - PK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: requestId
  source: requestId
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
  reference: true
- name: provider
  source: provider
  type: enum
  enum_ref: ExternalInteractionProvider
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: providerRequestId
  source: providerRequestId
  type: string
  constraints:
  - NULLABLE
  classification: PRIVATE
  log_policy: hash
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: providerRequestDigest
  source: providerRequestDigest
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: hash
  api_exposure: read
  ops_exposure: read
  description: providerRequestId 的不可逆 SHA-256 摘要；跨服务事件只传递此字段。
  role: append_only_fact
- name: maskedRecipient
  source: maskedRecipient
  type: string
  constraints:
  - NULLABLE
  classification: PRIVATE
  log_policy: mask
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: latencyMs
  source: latencyMs
  type: int
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: status
  source: status
  type: enum
  enum_ref: ExternalInteractionStatus
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: normalizedError
  source: normalizedError
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: recoveryAction
  source: recoveryAction
  type: string
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: createdAt
  source: createdAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
enums:
  ExternalInteractionOperation:
    values:
    - sms_otp.send
    - push_delivery.send
    - one_tap_phone.resolve
    - webhook.deliver
  ExternalInteractionStatus:
    values:
    - accepted
    - pending_dispatch
    - processing
    - sent_unconfirmed
    - delivered
    - failed
    - dead_letter
  ExternalInteractionSensitivity:
    values:
    - public
    - private
    - secret
  ExternalInteractionProvider:
    values:
    - mock_sms
    - aliyun_sms
    - tencent_sms
    - apns_voip
    - fcm
    - alpha_fake
    - webhook
