description: 四类 capability binding 由内部 ResolveCapabilityGrant worker 解析的稳定 fail-closed 语义；不声明 HTTP producer。
errors:
- {code: INTEGRATION.MIDDLEWARE.capability_provider_unavailable, reason: capability_provider_unavailable, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: retry, disruption_level: snackbar, recovery_after_seconds: 3, go_const: ErrCapabilityProviderUnavailable, user_message: {zh: 公共能力服务暂不可用，请稍后重试}}
- {code: INTEGRATION.USER.connector_authorization_revoked, reason: connector_authorization_revoked, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: surface, disruption_level: inlineCard, go_const: ErrConnectorAuthorizationRevoked, user_message: {zh: 外部账号授权已撤销，请重新连接}}
- {code: INTEGRATION.USER.device_capability_unavailable, reason: device_capability_unavailable, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: fallback, disruption_level: inlineCard, go_const: ErrDeviceCapabilityUnavailable, user_message: {zh: 当前设备不支持此能力}}
- {code: INTEGRATION.USER.device_permission_denied, reason: device_permission_denied, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: surface, disruption_level: permissionCard, go_const: ErrDevicePermissionDenied, user_message: {zh: 请授权设备权限后重试}}
- {code: INTEGRATION.USER.capability_confirmation_required, reason: capability_confirmation_required, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: surface, disruption_level: inlineCard, go_const: ErrCapabilityConfirmationRequired, user_message: {zh: 请先确认本次写入操作}}
- {code: INTEGRATION.USER.capability_permit_required, reason: capability_permit_required, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: surface, disruption_level: inlineCard, go_const: ErrCapabilityPermitRequired, user_message: {zh: 本次操作许可已失效，请重新确认}}
- {code: INTEGRATION.USER.capability_idempotency_required, reason: capability_idempotency_required, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: retry, disruption_level: snackbar, go_const: ErrCapabilityIdempotencyRequired, user_message: {zh: 操作幂等凭据缺失，请重试}}
- {code: INTEGRATION.SYSTEM.capability_binding_invalid, reason: capability_binding_invalid, emitted_by: [{surface: worker, operation: ResolveCapabilityGrant}], recovery_action: escalate, disruption_level: inlineCard, go_const: ErrCapabilityBindingInvalid, user_message: {zh: 能力绑定配置无效，请稍后重试}}
