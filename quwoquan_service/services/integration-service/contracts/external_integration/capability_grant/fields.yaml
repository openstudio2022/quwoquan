description: 四类能力绑定与短期 ResolvedCapabilityGrant tagged result。
fields:
- {name: resolutionId, source: resolutionId, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: accountId, source: trustedAccountId, type: string, constraints: [NULLABLE], classification: PRIVATE, log_policy: hash, api_exposure: none, ops_exposure: none, role: authoritative_state, reference: true}
- {name: capabilityKey, source: capabilityKey, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: bindingKind, source: bindingKind, type: enum, enum_ref: CapabilityBindingKind, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: publicProviderBinding, source: publicProviderBinding, type: PublicProviderBinding, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: userConnectorConnection, source: userConnectorConnection, type: UserConnectorConnection, constraints: [NULLABLE], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: deviceCapabilityBinding, source: deviceCapabilityBinding, type: DeviceCapabilityBinding, constraints: [NULLABLE], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: domainOperationBinding, source: domainOperationBinding, type: DomainOperationBinding, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: requiresConfirmation, source: requiresConfirmation, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: requiresPermit, source: requiresPermit, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: requiresIdempotency, source: requiresIdempotency, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: inputDigest, source: inputDigest, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: resolvedAt, source: resolvedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: expiresAt, source: expiresAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read, role: authoritative_state}
types:
  PublicProviderBinding:
    description: 环境级公共 Provider adapter、受控配置引用与探针状态；禁止包含账号、授权、连接、endpoint 值或 credential 字段。
    fields:
    - {name: capabilityKey, source: capabilityKey, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: supportedRegionCodes, source: supportedRegionCodes, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: adapterId, source: adapterId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: contractDigest, source: contractDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: configRef, source: configRef, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: timeoutMs, source: timeoutMs, type: int, constraints: [NOT_NULL, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: ratePolicyRef, source: ratePolicyRef, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: state, source: state, type: enum, enum_ref: PublicProviderBindingState, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: probeState, source: probeState, type: enum, enum_ref: PublicProviderProbeState, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
  UserConnectorConnection:
    description: 已由 Integration 授权、scope probe、expiry 与 revocation 复核的用户连接候选，不携带 credentialRef。
    fields:
    - {name: capabilityKey, source: capabilityKey, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: accountId, source: trustedAccountId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PRIVATE, log_policy: hash, api_exposure: none, ops_exposure: none}
    - {name: connectionId, source: connectionId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: SENSITIVE, log_policy: hash, api_exposure: none, ops_exposure: none}
    - {name: connectorId, source: connectorId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: grantedCapabilities, source: grantedCapabilities, type: '[]string', constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: grantState, source: grantState, type: enum, enum_ref: UserConnectorGrantState, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: providerAccountSubjectDigest, source: providerAccountSubjectDigest, type: string, constraints: [NOT_NULL], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none}
    - {name: freshnessAt, source: freshnessAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: expiresAt, source: expiresAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: revision, source: revision, type: int64, constraints: [NOT_NULL, POSITIVE], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
  DeviceCapabilityBinding:
    description: 当前 installation 的 PlatformCapabilities/NativeBridge attestation；不存云端 OAuth credential。
    fields:
    - {name: capabilityKey, source: capabilityKey, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: bridgeCapability, source: bridgeCapability, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: availability, source: availability, type: enum, enum_ref: DeviceCapabilityAvailability, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: permission, source: permission, type: enum, enum_ref: DeviceCapabilityPermission, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: attestationDigest, source: attestationDigest, type: string, constraints: [NOT_NULL], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none}
  DomainOperationBinding:
    description: 只引用 owner operationId 与当前 contract digest；owner payload 与 invariant 必须经 generated client 重验。
    fields:
    - {name: ownerOperationId, source: ownerOperationId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: contractDigest, source: contractDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
  CapabilityGrantResolutionRequest:
    description: 由受信 composition 组装的解析输入；四类候选物理分离，禁止开放客户端 map 或 universal Connector。
    fields:
    - {name: resolutionId, source: resolutionId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: none}
    - {name: accountId, source: trustedAccountId, type: string, constraints: [NULLABLE], classification: PRIVATE, log_policy: hash, api_exposure: none, ops_exposure: none}
    - {name: capabilityKey, source: capabilityKey, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: regionCode, source: regionCode, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: bindingPriority, source: bindingPriority, type: '[]CapabilityBindingKind', constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: write, source: write, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: confirmationRef, source: confirmationRef, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none}
    - {name: permitRef, source: permitRef, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none}
    - {name: idempotencyKey, source: idempotencyKey, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: none, ops_exposure: none}
    - {name: inputDigest, source: inputDigest, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none}
    - {name: publicProviders, source: publicProviders, type: '[]PublicProviderBinding', constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: userConnectors, source: userConnectors, type: '[]UserConnectorConnection', constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: deviceBindings, source: deviceBindings, type: '[]DeviceCapabilityBinding', constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: domainOperations, source: domainOperations, type: '[]DomainOperationBinding', constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
  ResolvedCapabilityGrant:
    description: exactly-one tagged 解析结果；五分钟内仍需在执行边界重验 revoke、permission、permit 与 owner contract digest。
    fields:
    - {name: resolutionId, source: resolutionId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: accountId, source: trustedAccountId, type: string, constraints: [NULLABLE], classification: PRIVATE, log_policy: hash, api_exposure: none, ops_exposure: none}
    - {name: capabilityKey, source: capabilityKey, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: bindingKind, source: bindingKind, type: enum, enum_ref: CapabilityBindingKind, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: publicProviderBinding, source: publicProviderBinding, type: PublicProviderBinding, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: userConnectorConnection, source: userConnectorConnection, type: UserConnectorConnection, constraints: [NULLABLE], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: deviceCapabilityBinding, source: deviceCapabilityBinding, type: DeviceCapabilityBinding, constraints: [NULLABLE], classification: SENSITIVE, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: domainOperationBinding, source: domainOperationBinding, type: DomainOperationBinding, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: none}
    - {name: requiresConfirmation, source: requiresConfirmation, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: requiresPermit, source: requiresPermit, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: requiresIdempotency, source: requiresIdempotency, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: inputDigest, source: inputDigest, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none}
    - {name: resolvedAt, source: resolvedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: expiresAt, source: expiresAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
enums:
  CapabilityBindingKind:
    values: [public_provider, user_connector, device_capability, domain_operation]
  PublicProviderBindingState:
    values: [ready, disabled, unavailable]
  PublicProviderProbeState:
    values: [passed, failed, not_run]
  UserConnectorGrantState:
    values: [active, revoked, expired]
  DeviceCapabilityAvailability:
    values: [available, unavailable]
  DeviceCapabilityPermission:
    values: [granted, denied]
