  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: append-external-interaction-dead-letter-api
  spec_ref: specs/feature-tree/runtime/runtime-external-integration/integration-service-foundation/spec.md#gwt-001
  producer: service
  layer: api_integration
  target: {kind: operation, id: AppendExternalInteractionDeadLetter}
  runner_source_path: quwoquan_service/services/integration-service/tests/api_integration/external_integration/external_interaction_dead_letter_fact/terminal_fact__api_integration_test.go
