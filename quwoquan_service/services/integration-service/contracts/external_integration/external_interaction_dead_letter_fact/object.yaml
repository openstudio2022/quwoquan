kind: append_only_fact
description: Integration 在外部交互达到不可再重试终态时追加的不可变 dead-letter 事实，作为恢复与审计的唯一依据。
identity:
  fields:
  - deadLetterId
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: request
  on_delete: retain
  reference_fields:
  - requestId
  target_object: integration.ExternalInteraction
lifecycle:
  immutable: true
local_identity_reasons:
  taskId: reliable-task terminal work item key scoped to this dead-letter fact; it is not a business-object reference
search_policy:
  exposed: none
  not_exposed_reason: "追加事实只服务于后台聚合、审计与回放，不构成用户可检索的对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "原始行为与遥测事实不对小趣开放；小趣只读所属域的公开投影结果。"
business_rules:
- 每个终态 requestId 至多一个 active dead-letter identity，恢复尝试另行追加审计事件而不修改原事实。
- dead-letter 只保存稳定错误分类与脱敏上下文，不复制 provider 原始响应或凭据。
- 清理、恢复和保留策略只由 integration-service 执行，其他服务不得跨库访问。
