kind: process_manager
description: '外部可靠交互请求聚合。统一承载短信与推送的异步受理和请求生命周期；

  provider attempt ledger 与死信分别由 ExternalInteractionAttemptFact 和

  ExternalInteractionDeadLetterFact 拥有，本聚合不内联第二份状态。

  '
identity:
  fields:
  - requestId
  version_source: checkpoint
access:
  commands: process_facade
  cross_context: public_contract_only
  queries: named_reader
relationships: []
search_policy:
  exposed: none
  not_exposed_reason: "流程编排对象只表达内部推进状态与补偿进度，没有用户可检索语义。"
assistant_access:
  read:
    mode: owner_scoped
    scopes:
    - assistant.integration.external_interaction.read
  cite:
    mode: none
    scopes: []
  write:
    mode: consented_command
    scopes:
    - assistant.integration.external_interaction.write
    requires_user_consent: true
    consent_scope_ref: assistant.integration.external_interaction.write
business_rules:
- interaction type、destination digest 与 payload digest 创建后不可变
- provider attempt 只能由 ExternalInteractionAttemptFact typed append sink 追加；除 UserAccountClosed 隐私删除外不得更新或删除
- 同一 idempotency key 与 payload digest 只产生一个 interaction
- provider callback 必须验证签名、时效和 interaction identity
- 超过重试预算后只能进入 dead_letter，人工恢复产生新 attempt
- 死信恢复必须把任务状态与 Idempotency-Key command receipt 在同一事务提交；同键异 taskId 返回冲突
lifecycle:
  state_field: status
  states:
  - accepted
  - pending_dispatch
  - processing
  - sent_unconfirmed
  - delivered
  - failed
  - dead_letter
  optimistic_concurrency: version
  idempotency: command_receipt
  terminal_events:
  - UserAccountClosed
  terminal_behavior: 删除已关闭 subject 关联的待处理请求、死信、恢复凭据与结果 outbox，并以对象自有 inbox 幂等提交
  source_events:
  - user.user_account.UserAccountClosed
  event_consumers:
  - name: ApplyExternalInteractionAccountClosure
    kind: event_handler
    facet: UserAccountClosedProjection
    method: applyUserAccountClosed
    idempotency: event_id
