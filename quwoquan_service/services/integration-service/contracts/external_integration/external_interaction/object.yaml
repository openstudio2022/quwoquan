kind: aggregate_root
description: '外部可靠交互请求聚合。统一承载短信与推送的异步受理和请求生命周期；

  provider attempt ledger 与死信分别由 ExternalInteractionAttemptFact 和

  ExternalInteractionDeadLetterFact 拥有，本聚合不内联第二份状态。

  '
identity:
  fields:
  - requestId
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships: []
capabilities:
- reliable_async
- auditable
- callback_enabled
taggable: false
vector_enabled: false
business_rules:
- interaction type、destination digest 与 payload digest 创建后不可变
- provider attempt 只能由 ExternalInteractionAttemptFact typed append sink 追加；除 UserAccountClosed 隐私删除外不得更新或删除
- 同一 idempotency key 与 payload digest 只产生一个 interaction
- provider callback 必须验证签名、时效和 interaction identity
- 超过重试预算后只能进入 dead_letter，人工恢复产生新 attempt
- 死信恢复必须把任务状态与 Idempotency-Key command receipt 在同一事务提交；同键异 taskId 返回冲突
lifecycle:
  state_field: status
  states:
  - accepted
  - pending_dispatch
  - processing
  - sent_unconfirmed
  - delivered
  - failed
  - dead_letter
  optimistic_concurrency: version
  idempotency: command_receipt
  terminal_events:
  - UserAccountClosed
  terminal_behavior: 删除已关闭 subject 关联的待处理请求、死信、恢复凭据与结果 outbox，并以对象自有 inbox 幂等提交
