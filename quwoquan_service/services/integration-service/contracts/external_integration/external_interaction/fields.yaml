enums:
  SmsOtpDeliveryAvailability:
  - ready
  - temporarily_unavailable
types:
  SmsOtpDeliveryReadiness:
    description: identity.sms.otp 能力对第一方 service caller 暴露的有界就绪切片；内部检查详情与 Provider 身份不得进入 wire。
    fields:
    - name: availability
      source: availability
      type: enum
      enum_ref: SmsOtpDeliveryAvailability
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: retryAfterSeconds
      source: retryAfterSeconds
      type: int
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  ExternalInteractionResultReportedEvent:
    description: provider attempt 与结果 outbox 同事务提交后，由 durable relay 发布的唯一外部交互结果事件。
    fields:
    - {name: eventId, source: eventId, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: attemptId, source: attemptId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: requestId, source: requestId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: operation, source: operation, type: enum, enum_ref: ExternalInteractionOperation, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: status, source: status, type: enum, enum_ref: ExternalInteractionStatus, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: provider, source: provider, type: enum, enum_ref: ExternalInteractionProvider, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: providerRequestDigest, source: providerRequestDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
    - {name: normalizedError, source: normalizedError, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: none, ops_exposure: read}
    - {name: recoveryAction, source: recoveryAction, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
    - {name: occurredAt, source: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
  ExternalInteractionAccepted:
    description: 可靠接收外部交互请求后的 202 Accepted 响应。
    fields:
    - name: requestId
      source: requestId
      type: string
      constraints:
      - PK
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: status
      source: status
      type: enum
      enum_ref: ExternalInteractionStatus
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: acceptedAt
      source: acceptedAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  ExternalInteractionRecoverRequest:
    description: operator 恢复死信任务的强类型命令。
    fields:
    - name: taskId
      source: taskId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: write
      ops_exposure: read
  ExternalInteractionRecoverAccepted:
    description: 死信恢复受理结果。
    fields:
    - name: taskId
      source: taskId
      type: string
      constraints:
      - PK
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: recovered
      source: recovered
      type: bool
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  ExternalInteractionRecoveryReceipt:
    description: 死信恢复命令的持久化幂等凭据；同一 Idempotency-Key 只能绑定一个 taskId。
    fields:
    - name: idempotencyKey
      source: idempotencyKey
      type: string
      constraints:
      - PK
      - NOT_NULL
      classification: PRIVATE
      log_policy: hash
      api_exposure: none
      ops_exposure: read
    - name: taskId
      source: taskId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: recoveredAt
      source: recoveredAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: expiresAt
      source: expiresAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
  ExternalInteractionRequest:
    description: 指定外部交互请求的归一化当前状态。
    fields:
    - name: requestId
      source: requestId
      type: string
      constraints:
      - PK
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: operation
      source: operation
      type: enum
      enum_ref: ExternalInteractionOperation
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: status
      source: status
      type: enum
      enum_ref: ExternalInteractionStatus
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: updatedAt
      source: updatedAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  ExternalInteractionResultOutbox:
    description: provider attempt 与同一 Mongo transaction 提交的结果事件 outbox；relay 只租约和更新该对象。
    fields:
    - name: eventId
      source: eventId
      type: string
      constraints:
      - PK
      - NOT_NULL
      classification: INTERNAL
      log_policy: hash
      api_exposure: none
      ops_exposure: read
      description: 等于 immutable attemptId；一个 provider attempt 至多产生一个业务 result receipt。
    - name: requestId
      source: requestId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: operation
      source: operation
      type: enum
      enum_ref: ExternalInteractionOperation
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: status
      source: status
      type: enum
      enum_ref: ExternalInteractionStatus
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: provider
      source: provider
      type: enum
      enum_ref: ExternalInteractionProvider
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: providerRequestDigest
      source: providerRequestDigest
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: hash
      api_exposure: none
      ops_exposure: read
    - name: normalizedError
      source: normalizedError
      type: string
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: none
      ops_exposure: read
    - name: recoveryAction
      source: recoveryAction
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: occurredAt
      source: occurredAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: deliveryStatus
      source: deliveryStatus
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
      description: pending | publishing | published
    - name: leaseOwner
      source: leaseOwner
      type: string
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: hash
      api_exposure: none
      ops_exposure: none
    - name: leaseExpiresAt
      source: leaseExpiresAt
      type: timestamp
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: publishedAt
      source: publishedAt
      type: timestamp
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: createdAt
      source: createdAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: updatedAt
      source: updatedAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
  ExternalInteractionMetricsSnapshot:
    description: 可靠任务队列深度、重试与死信的权威指标快照。
    fields:
    - name: pendingCount
      source: pendingCount
      type: int
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: retryWaitCount
      source: retryWaitCount
      type: int
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: deadLetterCount
      source: deadLetterCount
      type: int
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: snapshotAt
      source: snapshotAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
