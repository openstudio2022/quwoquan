commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: INTEGRATION_EXTERNAL_INTERACTION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 外部可靠交互请求收口。短信、推送、一键登录与 webhook 统一经 SubmitExternalInteractionRequest 提交（payload.operation
  区分类型），不设按类型的第二套提交/回调路由。
externalDependencies:
- capability: identity.sms.otp
  port: SmsDeliveryPort
  operations: [sendOtp]
  conformance: sms_delivery
  adapterContracts:
    ext.sms.local_capture:
      endpointEnvs: {endpoint: INTEGRATION_SMS_ENDPOINT}
      secretRefs: [INTEGRATION_SMS_TOKEN]
      defaultTimeoutMs: 10000
    ext.sms.aliyun:
      endpointEnvs: {endpoint: INTEGRATION_SMS_ENDPOINT}
      secretRefs:
      - INTEGRATION_SMS_TOKEN
      - OTP_CODE_REF_KEYS_JSON
      - INTEGRATION_SERVICE_MTLS_CA_FILE
      - INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE
      - INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE
      defaultTimeoutMs: 10000
- capability: integration.push.delivery
  port: PushDeliveryPort
  operations: [deliver]
  conformance: push_delivery
  adapterContracts:
    ext.push.protocol_substitute:
      endpointEnvs: {endpoint: INTEGRATION_PUSH_SUBSTITUTE_ENDPOINT}
      secretRefs: []
      defaultTimeoutMs: 10000
    ext.push.dispatch:
      endpointEnvs:
        user_service_base_url: INTEGRATION_PUSH_USER_SERVICE_BASE_URL
        apns_environment: INTEGRATION_PUSH_APNS_ENVIRONMENT
        apns_key_id: INTEGRATION_PUSH_APNS_KEY_ID
        apns_team_id: INTEGRATION_PUSH_APNS_TEAM_ID
        apns_topic: INTEGRATION_PUSH_APNS_TOPIC
        fcm_project_id: INTEGRATION_PUSH_FCM_PROJECT_ID
      secretRefs:
      - INTEGRATION_PUSH_APNS_KEY_FILE
      - INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE
      defaultTimeoutMs: 10000
- capability: runtime.message.transport
  role: use
  port: MessageTransportPort
  operations: [appendDurable]
  scenes: [general]
response_list_key: items
privacy_contract:
  user_account_closed_consumer:
    source_event_contract: user.UserAccountClosed
    failure_persistence: irreversible_event_and_error_digests_only
    dead_letter_retained:
    - dead_letter_id
    - source_stream
    - source_stream_id
    - event_class
    - irreversible_event_digest
    - irreversible_content_digest
    - attempt
    - controlled_error_class
    - irreversible_error_digest
    - dead_lettered_at
    dead_letter_prohibited:
    - account_id
    - user_id
    - persona_ids
    - raw_payload
    - raw_error
    recovery: source_stream_pending_reference_only
    logs: digest_only
api_routes:
- method: POST
  path: /integrations/external-requests
  operation: SubmitExternalInteractionRequest
  actor: none
  application:
    kind: command
    facet: ExternalInteractionCommandFacade
    method: submitRequest
    aggregate_owner: ExternalInteraction
    mutation_target: ExternalInteraction
    invariant_target: ExternalInteraction
  authorization:
    principal: service
    scopes:
    - integration.external_interaction.submit
    ownership_policy: caller_service_owns_idempotency_scope
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - INTEGRATION.USER.invalid_external_request
  - INTEGRATION.USER.unsupported_operation
  - INTEGRATION.SYSTEM.external_interaction_internal_error
  privacy:
    request_classification: SECRET
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: integration_external_interaction_submit
    trace: true
    attributes:
    - outcome
    - operation
    - caller_service
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: 提交外部交互异步请求；只表示可靠受理，不表示供应商已成功。
  request_entity: ExternalInteractionRequest
  response_entity: ExternalInteractionAccepted
  success_status: 202
  security:
    auth_mode: required
    principal: service
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
- method: GET
  path: /integrations/external-requests/{requestId}
  operation: GetExternalInteractionRequest
  actor: none
  application:
    kind: query
    facet: ExternalInteractionQueryFacade
    method: getRequest
    reader: ExternalInteractionRequestReader
    slice: ExternalInteractionRequestSlice
  authorization:
    principal: service
    scopes:
    - integration.external_interaction.read
    ownership_policy: caller_service_owns_idempotency_scope
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - INTEGRATION.USER.invalid_external_request
  - INTEGRATION.SYSTEM.external_interaction_internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: integration_external_interaction_request_read
    trace: true
    attributes:
    - outcome
    - operation
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: 查询外部交互请求当前状态与归一化结果。
  request_bindings:
    path:
    - name: requestId
      field: requestId
  response_entity: ExternalInteractionRequest
  security:
    auth_mode: required
    principal: service
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
- method: GET
  path: /integrations/external-requests/{requestId}/attempts
  operation: ListExternalInteractionAttempts
  actor: none
  application:
    kind: query
    facet: ExternalInteractionQueryFacade
    method: listAttempts
    reader: ExternalInteractionAttemptReader
    slice: ExternalInteractionAttemptListSlice
  authorization:
    principal: operator
    scopes:
    - ops.integration.read
    permissions:
    - integration.external_interaction.audit
    ownership_policy: operator_delivery_plane
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - INTEGRATION.USER.invalid_external_request
  - INTEGRATION.SYSTEM.external_interaction_internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: integration_external_interaction_attempt_list
    trace: true
    attributes:
    - outcome
    - result_count
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: 查询 provider attempt ledger，用于审计、SLO 与人工补偿定位。
  request_bindings:
    path:
    - name: requestId
      field: requestId
  response_entity: ExternalInteractionAttemptFact
  security:
    auth_mode: required
    principal: operator
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
- method: GET
  path: /integrations/external-requests/dead-letters
  operation: ListExternalInteractionDeadLetters
  actor: none
  application:
    kind: query
    facet: ExternalInteractionQueryFacade
    method: listDeadLetters
    reader: ExternalInteractionDeadLetterReader
    slice: ExternalInteractionDeadLetterListSlice
  authorization:
    principal: operator
    scopes:
    - ops.integration.read
    permissions:
    - integration.external_interaction.audit
    ownership_policy: operator_delivery_plane
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - INTEGRATION.USER.invalid_external_request
  - INTEGRATION.SYSTEM.external_interaction_internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: integration_external_interaction_dead_letter_list
    trace: true
    attributes:
    - outcome
    - operation
    - result_count
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: 查询指定请求超过重试上限或不可恢复失败的外部交互死信。
  request_bindings:
    query:
    - name: requestId
      field: requestId
      required: true
  response_entity: ExternalInteractionDeadLetterFact
  security:
    auth_mode: required
    principal: operator
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
- method: POST
  path: /integrations/external-requests/dead-letters:recover
  operation: RecoverExternalInteractionDeadLetter
  actor: none
  application:
    kind: command
    facet: ExternalInteractionCommandFacade
    method: recoverDeadTask
    aggregate_owner: ExternalInteraction
    mutation_target: ExternalInteraction
    invariant_target: ExternalInteraction
  authorization:
    principal: operator
    scopes:
    - ops.integration.write
    permissions:
    - integration.external_interaction.recover
    ownership_policy: operator_delivery_plane
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - INTEGRATION.USER.invalid_external_request
  - INTEGRATION.USER.dead_letter_recovery_conflict
  - INTEGRATION.SYSTEM.external_interaction_internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: integration_external_interaction_dead_letter_recover
    trace: true
    attributes:
    - outcome
    - operation
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: operator 将死信任务恢复为可重试状态并重置退避。
  request_entity: ExternalInteractionRecoverRequest
  response_entity: ExternalInteractionRecoverAccepted
  success_status: 202
  security:
    auth_mode: required
    principal: operator
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
- method: GET
  path: /integrations/external-requests/metrics:snapshot
  operation: GetExternalInteractionMetricsSnapshot
  actor: none
  application:
    kind: query
    facet: ExternalInteractionQueryFacade
    method: metricsSnapshot
    reader: ExternalInteractionMetricsReader
    slice: ExternalInteractionMetricsSnapshot
  authorization:
    principal: operator
    scopes:
    - ops.integration.read
    permissions:
    - integration.external_interaction.audit
    ownership_policy: operator_delivery_plane
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - INTEGRATION.SYSTEM.external_interaction_internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: integration_external_interaction_metrics_read
    trace: true
    attributes:
    - outcome
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: operator 读取可靠任务队列深度、重试与死信的权威指标快照。
  response_entity: ExternalInteractionMetricsSnapshot
  security:
    auth_mode: required
    principal: operator
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
consumers:
- name: user-service
  capabilities:
  - sms_otp_send_via_submit
  - sms_otp_delivery_callback
- name: notification-service
  capabilities:
  - push_delivery_send_via_submit
  - push_delivery_callback
- name: platform-ops
  capabilities:
  - provider_attempt_audit
  - dead_letter_compensation
contract_test:
  service_side:
    real_engines:
      mongodb: testcontainers (mongo:7 replica set)
    mock_targets:
    - external-provider-endpoint
    scenarios:
    - name: submit_typed_request_and_idempotent_replay
      command: SubmitExternalInteractionRequest
      assertions:
      - 缺 operation/idempotencyKey/expiresAt 的请求返回 INTEGRATION.USER.invalid_external_request
      - 不在 ExternalInteractionOperation 枚举内的 operation 返回 INTEGRATION.USER.unsupported_operation
      - push_delivery.send 只接受 PushDeliveryPayload 九个字段且枚举/过期时间严格校验
      - 同一 idempotencyKey 重放返回同一 requestId 受理结果
    - name: request_state_and_attempt_ledger
      assertions:
      - GetExternalInteractionRequest 返回归一化状态
      - ListExternalInteractionAttempts 返回 append-only attempt ledger
    - name: dead_letter_recover_roundtrip
      command: RecoverExternalInteractionDeadLetter
      assertions:
      - 死信任务恢复后离开 dead_letter 列表并可再次尝试
      - 恢复不存在的任务返回结构化错误
    - name: removed_typed_delivery_routes_unavailable
      assertions:
      - POST /integrations/push-deliveries 返回 404
      - POST /integrations/sms-otp:send 返回 404
