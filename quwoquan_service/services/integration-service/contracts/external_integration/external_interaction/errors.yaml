description: ExternalInteraction HTTP 受理/查询与异步 provider worker 的对象本地稳定错误语义。
errors:
- code: INTEGRATION.USER.invalid_external_request
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - {surface: http, operations: [SubmitExternalInteractionRequest, GetExternalInteractionRequest, ListExternalInteractionAttempts, ListExternalInteractionDeadLetters, RecoverExternalInteractionDeadLetter]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: invalidExternalRequest
  go_const: ErrInvalidExternalRequest
  user_message:
    zh: 外部请求参数不完整
    en: External request is invalid
- code: INTEGRATION.USER.unsupported_operation
  reason: unsupported_operation
  http_status: 400
  emitted_by:
  - {surface: http, operations: [SubmitExternalInteractionRequest]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: unsupportedOperation
  go_const: ErrUnsupportedOperation
  user_message:
    zh: 暂不支持该外部交互能力
    en: External interaction operation is not supported
- code: INTEGRATION.USER.dead_letter_recovery_conflict
  reason: dead_letter_recovery_conflict
  http_status: 409
  emitted_by:
  - {surface: http, operations: [RecoverExternalInteractionDeadLetter]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: deadLetterRecoveryConflict
  go_const: ErrDeadLetterRecoveryConflict
  user_message:
    zh: 该恢复请求与已确认的任务不一致
    en: The recovery request conflicts with the confirmed command receipt
- code: INTEGRATION.MIDDLEWARE.provider_timeout
  reason: timeout
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: providerTimeout
  go_const: ErrProviderTimeout
  user_message:
    zh: 外部供应商响应超时，请稍后重试
    en: External provider timed out, please retry
- code: INTEGRATION.MIDDLEWARE.provider_rejected
  reason: upstream_rejected
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: providerRejected
  go_const: ErrProviderRejected
  user_message:
    zh: 外部供应商暂时拒绝请求，请稍后重试
    en: External provider rejected the request
- code: INTEGRATION.USER.external_interaction_readiness_forbidden
  reason: forbidden
  http_status: 403
  emitted_by:
  - {surface: http, operations: [GetSmsOtpDeliveryReadiness]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: externalInteractionReadinessForbidden
  go_const: ErrExternalInteractionReadinessForbidden
  user_message:
    zh: 当前服务无权读取短信投递就绪状态
    en: The calling service cannot read SMS delivery readiness
- code: INTEGRATION.SYSTEM.external_interaction_internal_error
  reason: internal_error
  http_status: 500
  emitted_by:
  - {surface: http, operations: [GetSmsOtpDeliveryReadiness, SubmitExternalInteractionRequest, GetExternalInteractionRequest, ListExternalInteractionAttempts, ListExternalInteractionDeadLetters, RecoverExternalInteractionDeadLetter, GetExternalInteractionMetricsSnapshot]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: externalInteractionInternalError
  go_const: ErrExternalInteractionInternalError
  user_message:
    zh: 外部集成网关异常，请稍后重试
    en: External integration gateway internal error
- code: INTEGRATION.MIDDLEWARE.sms_provider_timeout
  reason: timeout
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: smsProviderTimeout
  go_const: ErrSmsProviderTimeout
  user_message:
    zh: 短信供应商响应超时，请稍后重试
    en: SMS provider timed out
- code: INTEGRATION.MIDDLEWARE.sms_provider_rejected
  reason: upstream_rejected
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: smsProviderRejected
  go_const: ErrSmsProviderRejected
  user_message:
    zh: 短信供应商暂时不可用，请稍后重试
    en: SMS provider is temporarily unavailable
- code: INTEGRATION.SYSTEM.sms_otp_code_ref_invalid
  reason: secret_invalid
  emitted_by: [worker]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: smsOtpCodeRefInvalid
  go_const: ErrSmsOtpCodeRefInvalid
  user_message:
    zh: 验证码投递凭据无效，请重新获取验证码
    en: Verification delivery credential is invalid; request a new code
