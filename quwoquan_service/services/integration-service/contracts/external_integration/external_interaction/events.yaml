events:
- name: ExternalInteractionResultReported
  description: 已记录的 provider attempt 通过 durable event relay 输出；只表示 provider
    接受或拒绝，不表示终端设备已展示或已送达。
  producer: integration-service
  consumers:
  - user-service
  - notification-service
  - platform-ops
  channel: event_store
  payload_entity: ExternalInteractionResultReportedEvent
  payload_fields:
  - eventId
  - attemptId
  - requestId
  - operation
  - status
  - provider
  - providerRequestDigest
  - normalizedError
  - recoveryAction
  - occurredAt
