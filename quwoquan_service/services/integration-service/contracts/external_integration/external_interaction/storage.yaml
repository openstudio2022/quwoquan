backend: mongodb
collections:
  reliable_task_outbox:
    entity: ExternalInteractionRequest
    indexes:
    - name: idx_ext_outbox_dedupe_status
      keys:
        dedupeKey: 1
        status: 1
    - name: idx_ext_outbox_start_status
      keys:
        startAt: 1
        status: 1
    - name: idx_reliable_task_outbox_subject_cleanup
      keys:
        payload.subjectDigest: 1
  reliable_async_task:
    entity: ExternalInteractionRequest
    indexes:
    - name: idx_ext_task_dedupe_status
      keys:
        dedupeKey: 1
        status: 1
    - name: idx_ext_task_next_status
      keys:
        nextAttemptAt: 1
        status: 1
    - name: idx_reliable_async_task_subject_cleanup
      keys:
        payload.subjectDigest: 1
  external_interaction_result_outbox:
    entity: ExternalInteractionResultOutbox
    role: authoritative
    indexes:
    - name: idx_ext_result_outbox_pending
      keys:
        deliveryStatus: 1
        leaseExpiresAt: 1
        createdAt: 1
    - name: idx_ext_result_outbox_subject_cleanup
      keys:
        subjectDigest: 1
  reliable_task_recovery_receipts:
    entity: ExternalInteractionRecoveryReceipt
    role: authoritative
    description: RecoverExternalInteractionDeadLetter 与任务状态同一 Mongo transaction 提交的 command receipt。
    indexes:
    - name: idx_reliable_task_recovery_receipt_task
      keys:
        taskId: 1
    - name: idx_reliable_task_recovery_receipt_expiry
      keys:
        expiresAt: 1
      ttl_seconds: 0
  integration_user_account_closed_inbox:
    entity: ExternalInteractionAccountClosureReceipt
    role: authoritative
    indexes:
    - name: idx_integration_account_closed_applied
      keys:
        appliedAt: -1
  integration_user_account_closed_failures:
    entity: ExternalInteractionAccountClosureFailure
    role: operational
    indexes:
    - name: idx_integration_account_closed_failure_event
      keys:
        eventDigest: 1
    - name: ttl_integration_account_closed_failures
      keys:
        expireAt: 1
      ttl_seconds: 0
  otp_code_reference_vault:
    entity: ExternalInteractionRequest
    role: operational
    description: 外部 OTP provider 引用的短期密文 vault；只保存 opaque reference，绝不进入业务响应。
    indexes:
    - name: ttl_otp_code_reference_vault
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
redis_cache:
- key: ready:integration:external_interaction:{taskType}
  ttl_seconds: 60
  entity: ExternalInteractionRequest
  invalidate_on:
  - ExternalInteractionResultReported
  - ExternalInteractionDeadLettered
role: authoritative
