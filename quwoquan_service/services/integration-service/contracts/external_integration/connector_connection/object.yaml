kind: aggregate_root
description: >-
  账号对一个官方 Connector 的连接与 capability grant 聚合。凭证只以受保护 credentialRef
  关联，Assistant 和 App 只能读取 connectionRef、授权 capability、状态与时效。
identity:
  fields: [connectionId]
  version_field: revision
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- {name: accountOwner, kind: reference, target_object: user.UserAccount, cardinality: 'N:1', reference_fields: [accountId], access: named_reader, consistency: eventual, on_delete: cascade}
- {name: connectorDefinition, kind: reference, target_object: integration.ConnectorDefinition, cardinality: 'N:1', reference_fields: [connectorId], access: named_reader, consistency: strong, on_delete: restrict}
search_policy:
  exposed: none
  not_exposed_reason: "仅所属用户可见的私有状态，进入任何共享索引即构成越权披露。"
assistant_access:
  read:
    mode: metadata_only
    scopes:
    - assistant.integration.connector_connection.read
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
business_rules:
- 同一 accountId + connectorId 最多一个未撤销连接；连接不得跨账号或共享 surface 暴露
- credentialRef 仅由 protected credential store 写入和解析，禁止进入 HTTP DTO、Assistant context、日志、trace、metric label 或 evidence 正文
- 创建或重连只接受 ConnectorAuthorization 产生的未过期 opaque grantReceiptRef；native/OAuth proof、credential 和 Provider callback 不进入本对象的公开命令
- grantedCapabilities 必须是 ConnectorDefinition.capabilities 的子集；撤权或过期后下一个安全边界立即 fail-closed
- 连接、幂等回执、审计事件与 credential 生命周期变更必须原子提交；撤权不得返回 secret 或历史调用正文
lifecycle:
  state_field: status
  states: [pending, active, expired, revoked, failed]
  optimistic_concurrency: revision
  idempotency: command_receipt
  terminal_events: [ConnectorConnectionRevoked]
