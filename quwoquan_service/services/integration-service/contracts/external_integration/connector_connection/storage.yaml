backend: mongodb
role: authoritative
collections:
  connector_connections:
    entity: ConnectorConnection
    role: authoritative
    indexes:
    - {name: uq_connector_connections_account_connector, keys: {accountId: 1, connectorId: 1}, unique: true}
    - {name: idx_connector_connections_account_status, keys: {accountId: 1, status: 1, updatedAt: -1}}
    - {name: idx_connector_connections_expiry, keys: {status: 1, expiresAt: 1}}
  connector_connection_command_receipts:
    entity: ConnectorConnection
    role: authoritative
    description: 与连接聚合和 outbox 同一 Mongo transaction 提交的账号级幂等回执。
    indexes:
    - {name: uq_connector_connection_receipt_owner_key, keys: {accountId: 1, idempotencyKey: 1}, unique: true}
  connector_connection_outbox:
    entity: ConnectorConnection
    role: append_only
    description: 与连接聚合、credential lifecycle 和命令回执原子提交的脱敏状态事件。
