description: Connector 调用状态、脱敏回执与服务命令输入。
fields:
- {name: invocationId, source: invocationId, type: string, constraints: [PK, NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: accountId, source: accountId, type: string, constraints: [NOT_NULL], classification: PRIVATE, log_policy: hash, api_exposure: none, ops_exposure: read, role: authoritative_state, reference: true}
- {name: connectionId, source: connectionId, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: read, ops_exposure: read, role: authoritative_state, reference: true}
- {name: assistantRunId, source: assistantRunId, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: none, ops_exposure: read, role: authoritative_state, reference: true}
- {name: capability, source: capability, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: status, source: status, type: enum, enum_ref: ConnectorInvocationStatus, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: requestDigest, source: requestDigest, type: string, constraints: [NOT_NULL], classification: PRIVATE, log_policy: hash, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: confirmationRef, source: confirmationRef, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: continuationRef, source: continuationRef, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: read, ops_exposure: none, role: authoritative_state}
- {name: resultRef, source: resultRef, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: resultDigest, source: resultDigest, type: string, constraints: [NULLABLE], classification: PRIVATE, log_policy: hash, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: normalizedFailureCode, source: normalizedFailureCode, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: recoveryAction, source: recoveryAction, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: revision, source: revision, type: int64, constraints: [NOT_NULL, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: attempt, source: attempt, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: leaseOwner, source: leaseOwner, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: none, role: authoritative_state}
- {name: leaseExpiresAt, source: leaseExpiresAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read, role: authoritative_state}
- {name: createdAt, source: createdAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: updatedAt, source: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
- {name: completedAt, source: completedAt, type: timestamp, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, role: authoritative_state}
types:
  ConnectorInvocationView:
    description: App/Assistant 可读取的脱敏调用活动；不含 account、Run、request/result secret、内部 attempt 或 lease。
    fields:
    - {name: invocationId, source: invocationId, type: string, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: none}
    - {name: connectionId, source: connectionId, type: string, constraints: [NOT_BLANK], classification: SENSITIVE, log_policy: hash, api_exposure: read, ops_exposure: none}
    - {name: capability, source: capability, type: string, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: none}
    - {name: status, source: status, type: enum, enum_ref: ConnectorInvocationStatus, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: none}
    - {name: continuationRef, source: continuationRef, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: read, ops_exposure: none}
    - {name: normalizedFailureCode, source: normalizedFailureCode, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: none}
    - {name: recoveryAction, source: recoveryAction, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: none}
    - {name: revision, source: revision, type: int64, constraints: [NOT_NULL, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: none}
    - {name: createdAt, source: createdAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: none}
    - {name: updatedAt, source: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: none}
    - {name: completedAt, source: completedAt, type: timestamp, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: none}
  ListConnectorInvocationsQuery:
    fields:
    - {name: connectionId, source: connectionId, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: limit, source: limit, type: int, constraints: [NULLABLE, POSITIVE, MAX_100], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: none}
  GetConnectorInvocationQuery:
    fields:
    - {name: invocationId, source: path.invocationId, type: string, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: hash, api_exposure: write, ops_exposure: none}
  ConnectorInvocationListSlice:
    fields:
    - {name: items, source: items, type: '[]ConnectorInvocationView', constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: read, ops_exposure: none}
  InvokeConnectorCapabilityRequest:
    description: Assistant 服务命令；payloadRef 仅指向受保护 artifact，Integration 不回显正文。
    fields:
    - {name: accountId, source: accountId, type: string, constraints: [NOT_BLANK], classification: PRIVATE, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: connectionId, source: connectionId, type: string, constraints: [NOT_BLANK], classification: SENSITIVE, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: assistantRunId, source: assistantRunId, type: string, constraints: [NOT_BLANK], classification: SENSITIVE, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: capability, source: capability, type: string, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: none}
    - {name: payloadRef, source: payloadRef, type: string, constraints: [NOT_BLANK], classification: SECRET, log_policy: drop, api_exposure: write, ops_exposure: none}
    - {name: confirmationRef, source: confirmationRef, type: string, constraints: [NULLABLE], classification: SECRET, log_policy: drop, api_exposure: write, ops_exposure: none}
    - {name: continuationRef, source: continuationRef, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: write, ops_exposure: none}
  ContinueConnectorInvocationRequest:
    description: 用户确认或设备/外部回执到达后，在 invocation 安全边界续接。
    fields:
    - {name: invocationId, source: path.invocationId, type: string, constraints: [NOT_BLANK], classification: PUBLIC, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: accountId, source: accountId, type: string, constraints: [NOT_BLANK], classification: PRIVATE, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: confirmationRef, source: confirmationRef, type: string, constraints: [NOT_BLANK], classification: SECRET, log_policy: drop, api_exposure: write, ops_exposure: none}
    - {name: continuationRef, source: continuationRef, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: hash, api_exposure: write, ops_exposure: none}
    - {name: expectedRevision, source: expectedRevision, type: int64, constraints: [NOT_NULL, POSITIVE], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: none}
  ConnectorInvocationMutationReceipt:
    fields:
    - {name: invocation, source: invocation, type: ConnectorInvocation, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: metadata_only, api_exposure: read, ops_exposure: none}
    - {name: replayed, source: replayed, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
