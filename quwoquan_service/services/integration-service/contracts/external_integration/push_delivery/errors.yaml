errors:
- code: INTEGRATION.USER.push_delivery_invalid_request
  reason: invalid_argument
  emitted_by: [worker]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: pushDeliveryInvalidRequest
  go_const: ErrPushDeliveryInvalidRequest
  user_message:
    zh: 推送请求参数不完整
    en: Push delivery request is invalid
- code: INTEGRATION.MIDDLEWARE.push_endpoint_resolution_failed
  reason: dependency_unavailable
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: pushEndpointResolutionFailed
  go_const: ErrPushEndpointResolutionFailed
  user_message:
    zh: 推送端点暂时无法解析
    en: Push endpoint cannot be resolved temporarily
- code: INTEGRATION.MIDDLEWARE.push_provider_timeout
  reason: timeout
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: pushProviderTimeout
  go_const: ErrPushProviderTimeout
  user_message:
    zh: 推送供应商响应超时，请稍后重试
    en: Push provider timed out
- code: INTEGRATION.MIDDLEWARE.push_provider_rate_limited
  reason: rate_limited
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: pushProviderRateLimited
  go_const: ErrPushProviderRateLimited
  user_message:
    zh: 推送供应商请求繁忙，请稍后重试
    en: Push provider rate limited the request
- code: INTEGRATION.MIDDLEWARE.push_provider_rejected
  reason: upstream_rejected
  emitted_by: [worker]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: pushProviderRejected
  go_const: ErrPushProviderRejected
  user_message:
    zh: 推送供应商暂时不可用，请稍后重试
    en: Push provider is temporarily unavailable
- code: INTEGRATION.MIDDLEWARE.push_endpoint_permanently_invalid
