kind: external_reference
description: 'ExternalInteraction 的强类型来电 push delivery 引用。它不拥有独立 transport

  operation 或 token 生命周期；worker 只在调用 user-service secret reader 后，

  将一次内存 token 交给 APNs VoIP/FCM provider。

  '
identity:
  fields:
  - endpointRef
  - deliveryKey
  version_source: external
access:
  commands: none
  cross_context: public_contract_only
  queries: external_port
relationships:
- name: endpoint
  target_object: user.DeviceRegistration
  reference_fields: [endpointRef]
  kind: reference
  cardinality: N:1
  consistency: runtime
  access: external_port
  on_delete: detach
taggable: false
vector_enabled: false
business_rules:
- endpoint secret 只在单次 provider 调用内经 user-service typed reader 获取，不持久化到 Integration 账本。
- deliveryKey 对同一业务通知与 endpoint 幂等，attempt 与 dead-letter 只由 Integration 事实对象追加。
- provider result 必须映射为 canonical ExternalInteraction 状态，不向调用方泄漏第三方原始错误。
lifecycle:
  refresh_semantics: resolve_endpoint_at_delivery_time
  tombstone: detach_immediately_when_device_registration_is_revoked
external_authority:
  owner: apns_voip_or_fcm_provider
  identity_contract: endpoint_ref_and_delivery_key
