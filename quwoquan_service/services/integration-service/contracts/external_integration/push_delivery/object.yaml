kind: external_reference
description: 'ExternalInteraction 的强类型 push delivery 引用，承载两类消息：

  来电信令（action=ring/cancel，callId/callType 等来电字段必填）与通用可见

  alert（action=alert，title/body/targetType/targetId 语义锚点，供离线消息

  等场景在设备通知栏可见展示，无 callId）。它不拥有独立 transport

  operation 或 token 生命周期；worker 只在调用 user-service secret reader 后，

  将一次内存 token 交给 APNs VoIP/FCM provider。alert 类别当前仅 FCM 承接；

  APNs VoIP 通道按平台约束拒绝 alert 并返回结构化不可用。

  '
identity:
  fields:
  - endpointRef
  - deliveryKey
  version_source: external
access:
  commands: none
  cross_context: public_contract_only
  queries: external_port
relationships:
- name: endpoint
  target_object: user.DeviceRegistration
  reference_fields: [endpointRef]
  kind: reference
  cardinality: N:1
  consistency: runtime
  access: external_port
  on_delete: detach
search_policy:
  exposed: none
  not_exposed_reason: "易失运行时状态，过期即消失，没有可供检索的稳定对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "服务内部投影与编排状态不构成小趣可用上下文，只服务所属域自身推进。"
business_rules:
- endpoint secret 只在单次 provider 调用内经 user-service typed reader 获取，不持久化到 Integration 账本。
- deliveryKey 对同一业务通知与 endpoint 幂等，attempt 与 dead-letter 只由 Integration 事实对象追加。
- provider result 必须映射为 canonical ExternalInteraction 状态，不向调用方泄漏第三方原始错误。
lifecycle:
  refresh_semantics: resolve_endpoint_at_delivery_time
  tombstone: detach_immediately_when_device_registration_is_revoked
external_authority:
  owner: apns_voip_or_fcm_provider
  identity_contract: endpoint_ref_and_delivery_key
