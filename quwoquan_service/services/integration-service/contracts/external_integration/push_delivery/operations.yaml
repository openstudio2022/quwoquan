commercial_defaults:
  status: blocked
  block_reason: APNs/FCM 实现与本地协议证据已具备；beta/gamma 仍需经 Port 对等本地替身完成第一方真机证据，prod 仍需真实凭据、Provider 回执和发布环境 SLO 证据
  gap_id: INTEGRATION_PUSH_DELIVERY_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: 'PushDelivery 是 ExternalInteraction 的类型化外部引用，不拥有 transport operation。

  提交统一由 integration/external_integration/external_interaction/operations.yaml 的

  SubmitExternalInteractionRequest（payload.operation=push_delivery.send）声明，

  禁止恢复 /integrations/push-deliveries 兼容路由。integration-service 在 worker

  调用时以 endpointRef 临时向 user-service 解析 token，并严格按 endpointKind

  选择 APNs VoIP 或 FCM；不跨 provider fallback。action=ring/cancel 共用同一

  deliveryKey collapse 语义，cancel 必须关闭来电面并压制乱序迟到 ring。

  '
upstreams:
  user_push_endpoint_secret:
    owner: user.DeviceRegistration
    operation: ResolvePushEndpointSecret
  user_push_endpoint_invalidate:
    owner: user.DeviceRegistration
    operation: InvalidateDevicePushEndpoint
delivery_slo:
  accepted_to_provider_p95_ms: 3000
  provider_request_timeout_ms: 5000
  provider_acceptance_success_percent: 99.9
  endpoint_secret_retention_seconds: 0
  retry_budget_max_attempts: 5
privacy_contract:
  endpoint_token: transient_memory_only
  provider_key_source: secret_file_only
  logs: metadata_only
  trace_attributes:
  - request_id
  - endpoint_kind
  - outcome
  - error_code
api_routes: []
runtime_entrypoints:
- name: InvokePushDeliveryProvider
  kind: external_port
  phase: outbound_invocation
  source_objects: [integration.ExternalInteraction, user.DeviceRegistration]
  idempotency: transaction_identity
  application: {kind: command, facet: PushDeliveryPort, method: send, object_owner: PushDelivery}
  telemetry:
    metric: integration_push_delivery_provider_invoke
    trace: true
    attributes: [outcome]
  slo:
    latency_p95_ms: 3000
    failure_ratio_percent: 1
    dead_letter_ratio_percent: 0.1
consumers:
- name: external-interaction
  capabilities:
  - push_delivery_payload
  - endpoint_kind_dispatch
  - permanent_endpoint_invalidation
contract_test:
  service_side:
    real_engines:
      apns: httptest TLS HTTP/2
      fcm: httptest TLS HTTP/2
    mock_targets:
    - user_push_endpoint_secret_reader
    - user_push_endpoint_invalidator
    scenarios:
    - name: apns_voip_protocol_and_permanent_invalidation
      assertions:
      - APNs token JWT 使用临时 EC P-256 key 的 ES256 签名
      - voip topic/push-type/priority/expiration/collapse-id 全部存在
      - 2xx 归一化为 sent_unconfirmed
      - BadDeviceToken 与 Unregistered 不重试并调用 endpoint invalidate
    - name: fcm_v1_protocol_oauth_cache_and_retry_classification
      assertions:
      - service-account RSA key 只从临时 secret file 读取并以 RS256 换取 OAuth token
      - high priority data/ttl/collapse_key 全部存在
      - OAuth token 在有效期内复用
      - UNREGISTERED 永久失效并 invalidate；429/5xx 可重试
    - name: exact_endpoint_kind_dispatch
      assertions:
      - apns_voip 只调用 APNs
      - fcm 只调用 FCM
      - 任一 provider 失败都不跨 provider fallback
readiness_cases:
- case_id: invoke-push-delivery-provider-local
  spec_ref: specs/feature-tree/runtime/runtime-external-integration/integration-service-foundation/spec.md#gwt-001
  producer: service
  layer: local_contract
  target: {kind: operation, id: InvokePushDeliveryProvider}
  runner_source_path: quwoquan_service/services/integration-service/tests/local_contract/external_integration/push_delivery/push_delivery_dispatch__reliability__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: https-provider, digest_binding: candidate}
- case_id: invoke-push-delivery-provider-api
  spec_ref: specs/feature-tree/runtime/runtime-external-integration/integration-service-foundation/spec.md#gwt-001
  producer: service
  layer: api_integration
  target: {kind: operation, id: InvokePushDeliveryProvider}
  runner_source_path: quwoquan_service/services/integration-service/tests/api_integration/external_integration/push_delivery/push_delivery_worker__idempotency__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb-https-provider, digest_binding: candidate}
