overrides:
  sys.integration-service.account_security_authority.base_url: http://user-service:18081
  sys.integration-service.account_security_authority.timeout_ms: 300
  sys.integration-service.redis.general.addr: redis:6379
  sys.integration-service.redis.rec.addr: redis:6379
secretRefs:
  sys.integration-service.integration.external_interaction.push.apns.key_file: INTEGRATION_PUSH_APNS_KEY_FILE
  sys.integration-service.integration.external_interaction.push.fcm.service_account_file: INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE
  sys.integration-service.integration.external_interaction.sms.token: INTEGRATION_SMS_TOKEN
  sys.integration-service.mongodb.uri: INTEGRATION_MONGO_URI
externalBindings:
  runtime.message.transport:
    state: enabled
  identity.sms.otp:
    state: enabled
    adapter: ext.sms.aliyun
    endpointRef: environment_binding:integration.sms
    endpointEnvs:
      endpoint: INTEGRATION_SMS_ENDPOINT
    secretRefs:
    - INTEGRATION_SMS_TOKEN
    - OTP_CODE_REF_KEYS_JSON
    - INTEGRATION_SERVICE_MTLS_CA_FILE
    - INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE
    - INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE
    timeoutMs: 10000
  integration.push.delivery:
    state: enabled
    adapter: ext.push.dispatch
    endpointRef: environment_binding:integration.push
    endpointEnvs:
      user_service_base_url: INTEGRATION_PUSH_USER_SERVICE_BASE_URL
      apns_environment: INTEGRATION_PUSH_APNS_ENVIRONMENT
      apns_key_id: INTEGRATION_PUSH_APNS_KEY_ID
      apns_team_id: INTEGRATION_PUSH_APNS_TEAM_ID
      apns_topic: INTEGRATION_PUSH_APNS_TOPIC
      fcm_project_id: INTEGRATION_PUSH_FCM_PROJECT_ID
    secretRefs:
    - INTEGRATION_PUSH_APNS_KEY_FILE
    - INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE
    timeoutMs: 10000
  integration.location.lookup:
    state: enabled
    adapter: ext.map.baidu
    endpointRef: environment_binding:integration.location
    endpointEnvs:
      base: INTEGRATION_LOCATION_BAIDU_BASE_URL
    secretRefs:
    - INTEGRATION_LOCATION_BAIDU_AK
    timeoutMs: 1200
