# beta overrides (developer local cloud-client integration)
service:
  http:
    addr: ":18086"

integration:
  location:
    nearby_default_radius_meters: 3000
    nearby_default_limit: 20
    search_default_limit: 20
    default_latitude: 30.6586
    default_longitude: 104.0648
  external_interaction:
    push:
      enabled: true
      mode: "real"
      timeout_ms: 5000
      apns:
        environment: "sandbox"

redis:
  rec:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 0
