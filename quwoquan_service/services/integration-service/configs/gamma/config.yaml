# gamma overrides (cloud integration env)
service:
  http:
    addr: ":18086"

integration:
  location:
    provider: "catalog"
    primary_provider: "catalog"
    backup_provider: "baidu"
    timeout_ms: 1200
    nearby_default_radius_meters: 3000
    nearby_default_limit: 20
    search_default_limit: 20
    default_latitude: 30.6586
    default_longitude: 104.0648
  external_interaction:
    push:
      enabled: true
      mode: "real"
      timeout_ms: 5000
      apns:
        environment: "sandbox"

redis:
  rec:
    mode: standalone
    addr: ""
    db: 0
