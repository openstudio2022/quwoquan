# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  integration-service:
    image: "${QWQ_COMPOSE_INTEGRATION_SERVICE_IMAGE:?fixed integration-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/integration-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: integration-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${QWQ_COMPOSE_INTEGRATION_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_INTEGRATION_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      INTEGRATION_SERVICE_ADDR: ":18086"
      INTEGRATION_MONGO_URI: mongodb://mongodb:27017
      INTEGRATION_MONGO_DATABASE: quwoquan_integration
      INTEGRATION_PUSH_ENABLED: "true"
      INTEGRATION_LOCATION_BAIDU_BASE_URL: "${INTEGRATION_LOCATION_BAIDU_BASE_URL:-}"
      INTEGRATION_LOCATION_BAIDU_AK: "${INTEGRATION_LOCATION_BAIDU_AK:-}"
      INTEGRATION_SMS_ENDPOINT: "${INTEGRATION_SMS_ENDPOINT:-}"
      INTEGRATION_SMS_TOKEN: "${INTEGRATION_SMS_TOKEN:-}"
      OTP_CODE_REF_KEYS_JSON: "${OTP_CODE_REF_KEYS_JSON:-}"
      INTEGRATION_SERVICE_MTLS_CA_FILE: "${INTEGRATION_SERVICE_MTLS_CA_FILE:-}"
      INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE: "${INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE:-}"
      INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE: "${INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE:-}"
      INTEGRATION_PUSH_USER_SERVICE_BASE_URL: "${INTEGRATION_PUSH_USER_SERVICE_BASE_URL:-}"
      INTEGRATION_PUSH_APNS_ENVIRONMENT: "${INTEGRATION_PUSH_APNS_ENVIRONMENT:-sandbox}"
      INTEGRATION_PUSH_APNS_KEY_ID: "${INTEGRATION_PUSH_APNS_KEY_ID:-}"
      INTEGRATION_PUSH_APNS_TEAM_ID: "${INTEGRATION_PUSH_APNS_TEAM_ID:-}"
      INTEGRATION_PUSH_APNS_TOPIC: "${INTEGRATION_PUSH_APNS_TOPIC:-}"
      INTEGRATION_PUSH_APNS_KEY_FILE: "${INTEGRATION_PUSH_APNS_KEY_FILE:-}"
      INTEGRATION_PUSH_FCM_PROJECT_ID: "${INTEGRATION_PUSH_FCM_PROJECT_ID:-}"
      INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE: "${INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE:-}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${QWQ_COMPOSE_INTEGRATION_PORT:-19310}:18086"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${INTEGRATION_SERVICE_MTLS_CA_FILE:?INTEGRATION_SERVICE_MTLS_CA_FILE is required}:${INTEGRATION_SERVICE_MTLS_CA_FILE}:ro
      - ${INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE:?INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE is required}:${INTEGRATION_SERVICE_MTLS_CLIENT_CERT_FILE}:ro
      - ${INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE:?INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE is required}:${INTEGRATION_SERVICE_MTLS_CLIENT_KEY_FILE}:ro
      - ${INTEGRATION_PUSH_APNS_KEY_FILE:?INTEGRATION_PUSH_APNS_KEY_FILE is required}:${INTEGRATION_PUSH_APNS_KEY_FILE}:ro
      - ${INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE:?INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE is required}:${INTEGRATION_PUSH_FCM_SERVICE_ACCOUNT_FILE}:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18086/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
