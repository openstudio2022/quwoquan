description: notification-service 自治运行配置；环境只维护差异和 secret reference。
configs:
- key: sys.notification-service.accountSecurityAuthority.baseUrl
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.notification-service.accountSecurityAuthority.timeoutMs
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.notification-service.service.http.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: :18087
- key: sys.notification-service.mongo.uri
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.notification-service.mongo.database
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: quwoquan_notification
- key: sys.notification-service.integration_service.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: http://integration-service:18086
- key: sys.notification-service.integration_service.timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1500
- key: sys.notification-service.user_service.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: http://user-service:18081
- key: sys.notification-service.realtime_gateway.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: http://realtime-gateway:18090
- key: sys.notification-service.dependencies.timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 500
- key: sys.notification-service.notification.delivery.claim_per_second
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 100
- key: sys.notification-service.notification.delivery.dispatch_per_second
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 100
- key: sys.notification-service.notification.delivery.retry_per_second
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 20
- key: sys.notification-service.notification.consumers.interaction
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: notification-interaction-projector
- key: sys.notification-service.notification.consumers.account_closure
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: notification-user-account-closed-projector
- key: sys.notification-service.notification.consumers.incoming_call
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: notification-incoming-call-worker
- key: sys.notification-service.redis.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: redis:6379
- key: sys.notification-service.redis.password
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.notification-service.redis.general_db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1
- key: sys.notification-service.redis.realtime_db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 4
