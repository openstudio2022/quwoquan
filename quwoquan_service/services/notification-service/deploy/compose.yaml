# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  notification-service:
    image: "${QWQ_COMPOSE_NOTIFICATION_SERVICE_IMAGE:?fixed notification-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/notification-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: notification-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${QWQ_COMPOSE_NOTIFICATION_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_NOTIFICATION_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      NOTIFICATION_SERVICE_ADDR: ":18087"
      NOTIFICATION_MONGO_URI: "mongodb://mongodb:27017/?replicaSet=rs0"
      NOTIFICATION_MONGO_DATABASE: quwoquan_notification
      NOTIFICATION_INTEGRATION_BASE_URL: "http://integration-service:18086"
      NOTIFICATION_INTEGRATION_TIMEOUT_MS: "1500"
      NOTIFICATION_USER_BASE_URL: "http://user-service:18081"
      NOTIFICATION_REALTIME_BASE_URL: "http://realtime-gateway:18090"
      NOTIFICATION_CLAIM_PER_SECOND: "100"
      NOTIFICATION_DISPATCH_PER_SECOND: "100"
      NOTIFICATION_RETRY_PER_SECOND: "20"
      NOTIFICATION_REDIS_ADDR: "redis:6379"
      NOTIFICATION_REDIS_GENERAL_DB: "1"
      NOTIFICATION_REDIS_REALTIME_DB: "4"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      integration-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${QWQ_COMPOSE_NOTIFICATION_PORT:-19320}:18087"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18087/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
