events:
- name: NotificationDeliveryJobCreated
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  no_consumer_reason: 任务创建已在 NotificationDeliveryJob 事务中持久化；事件只作为投递工作流审计日志保留，没有下游订阅方。
- name: NotificationDeliveryJobDispatched
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  no_consumer_reason: 调度结果已在 NotificationDeliveryJob 事务中持久化；事件只作为投递工作流审计日志保留，没有下游订阅方。
- name: NotificationDeliveryJobDeadLettered
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  no_consumer_reason: 死信终态已在 NotificationDeliveryJob 事务中持久化；事件只作为投递工作流审计日志保留，没有下游订阅方。
- name: NotificationDeliveryJobRecovered
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  no_consumer_reason: 恢复结果已在 NotificationDeliveryJob 事务中持久化；事件只作为投递工作流审计日志保留，没有下游订阅方。
- name: IncomingCallRealtimeDispatched
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - targetPersonaId
  - deviceId
  - deliveryKey
  - ackDeadlineAt
  no_consumer_reason: realtime 外送由 owning coordinator 直接完成；本事件只记录 NotificationDeliveryJob 的持久工作流审计。
- name: IncomingCallRealtimePresented
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - deviceId
  - deliveryKey
  - presentedAt
  no_consumer_reason: 设备展示回执已写入 NotificationDeliveryJob；本事件只记录对象的持久工作流审计。
- name: IncomingCallPushQueued
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - deviceId
  - deliveryKey
  - expiresAt
  no_consumer_reason: push 提交由 owning coordinator 直接完成；本事件只记录 NotificationDeliveryJob 的持久工作流审计。
- name: IncomingCallExternalInteractionAccepted
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - deviceId
  - deliveryKey
  - externalInteractionId
  - externalInteractionAcceptedAt
  no_consumer_reason: 外部交互受理由 owning coordinator 直接完成；本事件只记录 NotificationDeliveryJob 的持久工作流审计。
- name: IncomingCallSentUnconfirmed
  delivery_semantics: transactional_event_log
  payload_entity: IncomingCallProviderResultRecordedEvent
  payload_fields:
  - jobId
  - callId
  - deviceId
  - deliveryKey
  - action
  - attemptId
  - requestId
  - operation
  - provider
  - providerRequestDigest
  - resultStatus
  - recoveryAction
  - occurredAt
  - jobStatus
  no_consumer_reason: 未确认终态已写入 NotificationDeliveryJob；本事件只记录对象的持久工作流审计。
- name: IncomingCallProviderResultRecorded
  description: ring provider 的失败或可重试 receipt 已按 attemptId 幂等记录；不表示设备展示。
  delivery_semantics: transactional_event_log
  payload_entity: IncomingCallProviderResultRecordedEvent
  payload_fields:
  - jobId
  - callId
  - deviceId
  - deliveryKey
  - action
  - attemptId
  - requestId
  - operation
  - provider
  - providerRequestDigest
  - resultStatus
  - recoveryAction
  - occurredAt
  - jobStatus
  no_consumer_reason: Provider receipt 已写入 NotificationDeliveryJob；本事件只记录对象的持久工作流审计。
- name: IncomingCallDeliveryCancelled
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - deviceId
  - deliveryKey
  - status
  no_consumer_reason: 取消终态已写入 NotificationDeliveryJob；本事件只记录对象的持久工作流审计。
- name: IncomingCallCancellationPushSubmitted
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - deviceId
  - deliveryKey
  - cancellationExternalInteractionId
  - cancellationPushSubmittedAt
  no_consumer_reason: 取消 push 由 owning coordinator 直接提交；本事件只记录 NotificationDeliveryJob 的持久工作流审计。
- name: IncomingCallCancellationExternalInteractionAccepted
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - deviceId
  - deliveryKey
  - cancellationExternalInteractionId
  - cancellationExternalInteractionAcceptedAt
  no_consumer_reason: 取消外部交互由 owning coordinator 直接受理；本事件只记录 NotificationDeliveryJob 的持久工作流审计。
- name: IncomingCallCancellationProviderResultRecorded
  delivery_semantics: transactional_event_log
  payload_entity: IncomingCallProviderResultRecordedEvent
  payload_fields:
  - jobId
  - callId
  - deviceId
  - deliveryKey
  - action
  - attemptId
  - requestId
  - operation
  - provider
  - providerRequestDigest
  - resultStatus
  - recoveryAction
  - occurredAt
  - jobStatus
  no_consumer_reason: 取消 Provider receipt 已写入 NotificationDeliveryJob；本事件只记录对象的持久工作流审计。
- name: IncomingCallCancellationRealtimeDispatched
  delivery_semantics: transactional_event_log
  payload_entity: NotificationDeliveryJob
  payload_fields:
  - id
  - callId
  - targetPersonaId
  - cancellationEventId
  - cancellationRealtimeDispatchedAt
  no_consumer_reason: 取消 realtime 外送由 owning coordinator 直接完成；本事件只记录 NotificationDeliveryJob 的持久工作流审计。
