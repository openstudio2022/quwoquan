types:
  ExternalInteractionResultInboxReceipt:
    description: Notification 拥有的 provider result 幂等 inbox receipt；原始 provider request identifier 与 payload 禁止写入。
    fields:
    - name: attemptId
      type: string
      constraints: [PK, NOT_NULL]
      classification: INTERNAL
      log_policy: hash
      api_exposure: none
      ops_exposure: read
    - name: requestId
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: hash
      api_exposure: none
      ops_exposure: read
    - name: operation
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: provider
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: providerRequestDigest
      type: string
      constraints: [NOT_NULL]
      classification: SENSITIVE
      log_policy: hash
      api_exposure: none
      ops_exposure: read
    - name: normalizedError
      type: string
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: none
      ops_exposure: read
    - name: recoveryAction
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: status
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: occurredAt
      type: timestamp
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
    - name: createdAt
      type: timestamp
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: none
      ops_exposure: read
  IncomingCallProviderReceipt:
    description: provider attempt 的 operator-safe receipt；attempt 与 provider request 均只暴露摘要。
    fields:
    - {name: attemptDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: action, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: status, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: provider, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: providerRequestDigest, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: recoveryAction, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
  IncomingCallDeliveryTimelineItem:
    description: 一个受信设备 endpoint 的脱敏 ring/cancel/presentation 时间线。
    fields:
    - {name: jobDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: deviceDigest, type: string, constraints: [NOT_NULL], classification: PRIVATE, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: deliveryKeyDigest, type: string, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: hash, api_exposure: read, ops_exposure: read}
    - {name: status, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: externalInteractionAcceptedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: presentedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: cancelledAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - {name: cancellationExternalInteractionAcceptedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
    - name: receipts
      type: array
      item_type: IncomingCallProviderReceipt
      constraints: [NOT_NULL]
      classification: SENSITIVE
      log_policy: redacted
      api_exposure: read
      ops_exposure: read
  IncomingCallDeliveryTimeline:
    description: 同一 call 的 operator-safe per-device 投递时间线。
    fields:
    - {name: callDigest, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
    - name: items
      type: array
      item_type: IncomingCallDeliveryTimelineItem
      constraints: [NOT_NULL]
      classification: SENSITIVE
      log_policy: redacted
      api_exposure: read
      ops_exposure: read
    - {name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
  AckIncomingCallPresentationCommand:
    description: App 表示指定 deliveryKey 已在当前 trusted device 展示来电 UI
    fields:
    - name: deliveryKey
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: hash
      api_exposure: write
      ops_exposure: read
  AckIncomingCallPresentationResult:
    description: 设备级 presentation ACK 的 CAS 结果；迟到 ACK 只返回 raced=true
    fields:
    - name: deliveryKey
      type: string
      constraints:
      - PK
      - NOT_NULL
      classification: INTERNAL
      log_policy: hash
      api_exposure: read
      ops_exposure: read
    - name: deviceId
      type: string
      constraints:
      - NOT_NULL
      classification: PRIVATE
      log_policy: hash
      api_exposure: read
      ops_exposure: read
    - name: status
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: raced
      type: bool
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: acknowledgedAt
      type: timestamp
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
