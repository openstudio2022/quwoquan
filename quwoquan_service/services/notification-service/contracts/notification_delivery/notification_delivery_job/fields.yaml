types:
  AckIncomingCallPresentationCommand:
    description: App 表示指定 deliveryKey 已在当前 trusted device 展示来电 UI
    fields:
    - name: deliveryKey
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: hash
      api_exposure: write
      ops_exposure: read
  AckIncomingCallPresentationResult:
    description: 设备级 presentation ACK 的 CAS 结果；迟到 ACK 只返回 raced=true
    fields:
    - name: deliveryKey
      type: string
      constraints:
      - PK
      - NOT_NULL
      classification: INTERNAL
      log_policy: hash
      api_exposure: read
      ops_exposure: read
