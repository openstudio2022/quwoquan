description: Notification/AppMessage 端云稳定错误语义。
errors:
- code: NOTIFICATION.USER.unauthorized
  reason: unauthorized
  http_status: 401
  emitted_by:
  - {surface: http, operations: [ListAppMessages, GetAppMessage, AckAppMessage, ReadAppMessage, GetAppMessageUnreadCount]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: unauthorized
  go_const: ErrUnauthorized
  user_message:
    zh: 请先登录
    en: Please sign in
- code: NOTIFICATION.USER.invalid_argument
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - {surface: http, operations: [CreateAppMessage, ListAppMessages, GetAppMessage, AckAppMessage, ReadAppMessage, RecoverNotificationAccountClosureDeadLetter]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 消息参数有误，请检查后重试
    en: Invalid app message request
- code: NOTIFICATION.USER.app_message_not_found
  reason: not_found
  http_status: 404
  emitted_by:
  - {surface: http, operations: [GetAppMessage, AckAppMessage, ReadAppMessage]}
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: appMessageNotFound
  go_const: ErrAppMessageNotFound
  user_message:
    zh: 消息不存在或已过期
    en: App message not found
- code: NOTIFICATION.USER.idempotency_conflict
  reason: idempotency_conflict
  http_status: 409
  emitted_by:
  - {surface: http, operations: [CreateAppMessage]}
  recovery_action: retry
  disruption_level: snackbar
  dart_const: idempotencyConflict
  go_const: ErrIdempotencyConflict
  user_message:
    zh: 重复请求与原消息不一致，请刷新后重试
    en: Idempotency key conflicts with the existing message
- code: NOTIFICATION.SYSTEM.storage_read_failed
  reason: storage_read_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [CreateAppMessage, ListAppMessages, GetAppMessage, GetAppMessageUnreadCount]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: storageReadFailed
  go_const: ErrStorageReadFailed
  user_message:
    zh: 读取消息失败，请稍后重试
    en: Failed to read app messages
- code: NOTIFICATION.SYSTEM.storage_write_failed
  reason: storage_write_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [CreateAppMessage, AckAppMessage, ReadAppMessage]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: storageWriteFailed
  go_const: ErrStorageWriteFailed
  user_message:
    zh: 更新消息失败，请稍后重试
    en: Failed to update app message
- code: NOTIFICATION.SYSTEM.internal_error
  reason: internal_error
  http_status: 500
  emitted_by:
  - {surface: http, operations: [RecoverNotificationAccountClosureDeadLetter]}
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: internalError
  go_const: ErrInternalError
  user_message:
    zh: 通知服务暂时无法完成该操作
    en: Notification service could not complete the operation
