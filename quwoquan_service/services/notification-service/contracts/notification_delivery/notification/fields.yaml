fields:
  - name: _id
    source: _id
    type: string
    constraints:
      - PK
      - NOT_NULL
    classification: PII
    log_policy: hash
    api_exposure: read
    ops_exposure: read
    description: app message stable ID，HTTP 响应字段为 messageId。
    role: authoritative_state
  - name: idempotencyKey
    source: idempotencyKey
    type: string
    constraints:
      - NOT_NULL
      - UNIQUE
    classification: SECRET
    log_policy: drop
    api_exposure: drop
    ops_exposure: drop
    role: authoritative_state
  - name: userId
    source: userId
    type: string
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: hash
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: messageType
    source: messageType
    type: enum
    enum_ref: NotificationType
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: source
    source: source
    type: string
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: sourceId
    source: sourceId
    type: string
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: hash
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: destination
    source: destination
    type: AppMessageDestination
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: metadata_only
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: title
    source: title
    type: string
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: drop
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: summary
    source: summary
    type: string
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: drop
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: target
    source: target
    type: AppMessageTarget
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: metadata_only
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: provenance
    source: provenance
    type: AppMessageProvenance
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: metadata_only
    api_exposure: drop
    ops_exposure: read
    description: Assistant 等 producer 提交的个性化归因；只用于审计与行为回流，不向 App 暴露。
    role: authoritative_state
  - name: read
    source: read
    type: bool
    constraints:
      - NOT_NULL
      - DEFAULT_FALSE
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: createdAt
    source: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: deliveredAt
    source: deliveredAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: ackedAt
    source: ackedAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: readAt
    source: readAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
types:
  AppMessageDestination:
    description: App 消息投递目标。
    fields:
      - {name: type, source: type, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read_write, ops_exposure: read}
      - {name: id, source: id, type: string, constraints: [NOT_NULL], classification: PII, log_policy: hash, api_exposure: read_write, ops_exposure: none}
  AppMessageRouteQuery:
    description: App 消息目标路由的规范化查询参数。
    fields:
      - {name: dimension, source: dimension, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read_write, ops_exposure: read}
  AppMessageTarget:
    description: App 消息的业务对象目标与 canonical route。
    fields:
      - {name: targetType, source: targetType, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read_write, ops_exposure: read}
      - {name: targetId, source: targetId, type: string, constraints: [NOT_NULL], classification: PII, log_policy: hash, api_exposure: read_write, ops_exposure: none}
      - {name: routeId, source: routeId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read_write, ops_exposure: read}
      - {name: routePath, source: routePath, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: read_write, ops_exposure: read}
      - {name: query, source: query, type: AppMessageRouteQuery, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read_write, ops_exposure: read}
  AppMessageProvenance:
    description: 生产者提交的个性化归因事实，仅用于审计与行为回流。
    fields:
      - {name: personalized, source: personalized, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read}
      - {name: interestTags, source: interestTags, type: '[]string', constraints: [NULLABLE], classification: SENSITIVE, log_policy: metadata_only, api_exposure: write, ops_exposure: read}
      - {name: matchedSegments, source: matchedSegments, type: '[]string', constraints: [NULLABLE], classification: SENSITIVE, log_policy: metadata_only, api_exposure: write, ops_exposure: read}
      - {name: lifecycleStage, source: lifecycleStage, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: metadata_only, api_exposure: write, ops_exposure: read}
  AppMessage:
    description: 当前账户可见的统一应用消息；messageId 是 HTTP canonical identity。
    fields:
      - {name: messageId, source: messageId, type: string, constraints: [PK, NOT_NULL, NOT_BLANK], classification: PII, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: userId, source: userId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PII, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: messageType, source: messageType, type: enum, enum_ref: NotificationType, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: source, source: source, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: sourceId, source: sourceId, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PII, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: destination, source: destination, type: AppMessageDestination, constraints: [NOT_NULL], classification: PII, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: title, source: title, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PII, log_policy: drop, api_exposure: read, ops_exposure: read}
      - {name: summary, source: summary, type: string, constraints: [NOT_NULL, NOT_BLANK], classification: PII, log_policy: drop, api_exposure: read, ops_exposure: read}
      - {name: target, source: target, type: AppMessageTarget, constraints: [NOT_NULL], classification: PII, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: read, source: read, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: createdAt, source: createdAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: deliveredAt, source: deliveredAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: ackedAt, source: ackedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: readAt, source: readAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
  AppMessageInboxSlice:
    description: 当前账户 AppMessage 的有界游标切片。
    fields:
      - {name: items, source: items, type: '[]AppMessage', constraints: [NOT_NULL], classification: PII, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: nextCursor, source: nextCursor, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read}
  AppMessageUnreadCountSlice:
    description: 当前账户实时计算的未读消息数量。
    fields:
      - {name: unreadCount, source: unreadCount, type: int, constraints: [NOT_NULL, NON_NEGATIVE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read}
  NotificationPushRequestedEvent:
    description: Notification 与 NotificationDeliveryJob 同事务创建后写入投递 outbox 的严格载荷。
    fields:
      - {name: messageId, source: messageId, type: string, constraints: [PK, NOT_NULL], classification: PII, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: messageType, source: messageType, type: enum, enum_ref: NotificationType, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: title, source: title, type: string, constraints: [NOT_NULL], classification: PII, log_policy: drop, api_exposure: none, ops_exposure: none}
      - {name: summary, source: summary, type: string, constraints: [NOT_NULL], classification: PII, log_policy: drop, api_exposure: none, ops_exposure: none}
      - {name: targetType, source: targetType, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: targetId, source: targetId, type: string, constraints: [NOT_NULL], classification: PII, log_policy: hash, api_exposure: none, ops_exposure: none}
  CreateAppMessageRequest:
    description: 受信服务创建统一 App 消息的请求体；Idempotency-Key 仅由受信请求头提供，不进入 body。
    fields:
      - name: userId
        source: userId
        type: string
        constraints: [NOT_NULL]
        classification: PII
        log_policy: hash
        api_exposure: write
        ops_exposure: write
      - name: messageType
        source: messageType
        type: enum
        enum_ref: NotificationType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: write
        ops_exposure: write
      - name: source
        source: source
        type: string
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: allow
        api_exposure: write
        ops_exposure: write
      - name: sourceId
        source: sourceId
        type: string
        constraints: [NOT_NULL]
        classification: PII
        log_policy: hash
        api_exposure: write
        ops_exposure: write
      - name: destination
        source: destination
        type: AppMessageDestination
        constraints: [NOT_NULL]
        classification: PII
        log_policy: metadata_only
        api_exposure: write
        ops_exposure: write
      - name: title
        source: title
        type: string
        constraints: [NOT_NULL]
        classification: PII
        log_policy: drop
        api_exposure: write
        ops_exposure: write
      - name: summary
        source: summary
        type: string
        constraints: [NOT_NULL]
        classification: PII
        log_policy: drop
        api_exposure: write
        ops_exposure: write
      - name: target
        source: target
        type: AppMessageTarget
        constraints: [NOT_NULL]
        classification: PII
        log_policy: metadata_only
        api_exposure: write
        ops_exposure: write
      - name: provenance
        source: provenance
        type: AppMessageProvenance
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: metadata_only
        api_exposure: write
        ops_exposure: write
  NotificationAccountClosureDeadLetterRecoveryRequest:
    description: operator 释放 Notification 注销清理 terminal marker 的强类型命令；只接受 Redis source PEL 坐标。
    fields:
      - name: sourceStreamId
        source: sourceStreamId
        type: string
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: allow
        api_exposure: write
        ops_exposure: write
  NotificationAccountClosureDeadLetterRecoveryAccepted:
    description: Notification 注销清理 source PEL 已受理重新消费。
    fields:
      - name: sourceStreamId
        source: sourceStreamId
        type: string
        constraints:
          - PK
        classification: INTERNAL
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: recoveryAccepted
        source: recoveryAccepted
        type: bool
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  ListAppMessagesQuery:
    fields:
      - name: type
        type: string
        constraints:
          - NULLABLE
        client_dart_name: messageType
        client_dart_type: String?
      - name: read
        type: bool
        constraints:
          - NULLABLE
        client_dart_type: bool?
      - name: cursor
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
  AckAppMessageCommand:
    fields:
      - name: messageId
        type: string
        client_dart_type: String
  GetAppMessageUnreadCountQuery:
    fields: []
  ReadAppMessageCommand:
    fields:
      - name: messageId
        type: string
        client_dart_type: String
  GetAppMessageQuery:
    fields:
      - name: messageId
        type: string
        client_dart_type: String
