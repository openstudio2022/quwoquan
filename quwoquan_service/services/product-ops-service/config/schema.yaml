- key: sys.product-ops-service.redis.general.db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  # 跨服务 durable 事实流（events.ops.experiment_policy_activated 等）经
  # general scene 发布，消费方（recommendation/探针/realtime-gateway）统一
  # 读 db0；共享单实例时 scene db 必须一致为 0，隔离靠 key 前缀而非 db。
  # 此前默认 1 使激活事实写入 db1，全栈冷启动在「策略已激活但事实不可见」
  # 上死锁。
  default: 0
