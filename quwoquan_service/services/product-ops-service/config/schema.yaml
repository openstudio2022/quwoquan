# ES 聚合告警评估循环：policy_path 与 alertmanager_url 均非空才启动；
# 策略文件真相源是 quwoquan_ops/observability/elasticsearch/product_telemetry_alerts.yaml，
# 部署时经 configMap/volume 挂载。
