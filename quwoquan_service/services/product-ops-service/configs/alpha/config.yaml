# alpha overrides (developer single-instance validation)
service:
  http:
    addr: ":18086"

mongodb:
  uri: "${MONGO_URI}"
  database: "quwoquan_product_ops"

postgres:
  dsn: "${POSTGRES_DSN}"

sls:
  region: "${PRODUCT_OPS_SLS_REGION}"
  endpoint: "${PRODUCT_OPS_SLS_ENDPOINT}"
  project: "${PRODUCT_OPS_SLS_PROJECT}"

redis:
  rec:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 0
  general:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 1
