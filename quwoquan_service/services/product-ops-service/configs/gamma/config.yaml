# gamma overrides (cloud integration env)
service:
  http:
    addr: ":18086"

mongodb:
  uri: "${MONGO_URI}"
  database: "quwoquan_product_ops"

postgres:
  dsn: "${POSTGRES_DSN}"

sls:
  region: "${PRODUCT_OPS_SLS_REGION}"
  endpoint: "${PRODUCT_OPS_SLS_ENDPOINT}"
  project: "${PRODUCT_OPS_SLS_PROJECT}"

redis:
  rec:
    mode: standalone
    addr: ""
    db: 0
  general:
    mode: standalone
    addr: ""
    db: 1
