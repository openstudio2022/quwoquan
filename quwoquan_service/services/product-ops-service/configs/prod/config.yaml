# prod overrides (container/k8s)
# Recommend injecting APP_ENV=prod, CONFIG_VERSION, IMAGE_VERSION, CONFIG_ROOT via env.
service:
  http:
    addr: ":18086"

mongodb:
  uri: "${MONGO_URI}"
  database: "quwoquan_product_ops"

postgres:
  dsn: "${POSTGRES_DSN}"

sls:
  region: "${PRODUCT_OPS_SLS_REGION}"
  endpoint: "${PRODUCT_OPS_SLS_ENDPOINT}"
  project: "${PRODUCT_OPS_SLS_PROJECT}"

redis:
  rec:
    mode: cluster
    addrs: []
    tls: true
  general:
    mode: cluster
    addrs: []
    tls: true
