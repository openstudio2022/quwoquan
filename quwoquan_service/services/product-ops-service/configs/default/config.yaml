service:
  name: product-ops-service
  http:
    addr: ":18080"

config:
  # Config release contract
  # CONFIG_VERSION must be injected by deployment pipeline in prod.
  version: "v0.0.1"
  min_image_version: "0.0.1"
  max_image_version: "9.9.9"

mongodb:
  uri: ""
  database: "quwoquan_product_ops"

postgres:
  dsn: ""

sls:
  region: "${PRODUCT_OPS_SLS_REGION}"
  endpoint: "${PRODUCT_OPS_SLS_ENDPOINT}"
  project: "${PRODUCT_OPS_SLS_PROJECT}"
  raw_logstore: "app-product-telemetry-raw"
  startup_diagnostic_logstore: "app-startup-diagnostic-raw"
  runtime_logstore: "runtime-diagnostics-raw"
  aggregate_logstore: "app-product-telemetry-hourly"
  timeout_ms: 1200

# Redis scenes (defaults)
redis:
  rec:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 0
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 100
      write_timeout_ms: 100
      dial_timeout_ms: 500
  general:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 1
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 200
      write_timeout_ms: 200
      dial_timeout_ms: 500
