apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-ops-service
  labels:
    app.kubernetes.io/name: product-ops-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: product-ops-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-ops-service
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: product-ops-service
      containers:
        - name: product-ops-service
          image: ghcr.io/openstudio2022/quwoquan/product-ops-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18086
          env:
            - name: APP_ENV
              value: gamma
            - name: SERVICE_NAME
              value: product-ops-service
            - name: CONFIG_ROOT
              value: /etc/product-ops-service
            - name: CONFIG_VERSION
              value: v0.0.0
            - name: IMAGE_VERSION
              value: v0.0.0
            - name: PRODUCT_OPS_SERVICE_ADDR
              value: ":18086"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: MONGO_URI
                  optional: true
            - name: PRODUCT_OPS_REDIS_REC_ADDR
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: PRODUCT_OPS_REDIS_REC_ADDR
                  optional: true
            - name: PRODUCT_OPS_REDIS_GENERAL_ADDR
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: PRODUCT_OPS_REDIS_GENERAL_ADDR
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
