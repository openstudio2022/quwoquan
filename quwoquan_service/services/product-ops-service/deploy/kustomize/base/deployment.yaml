apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-ops-service
  labels:
    app.kubernetes.io/name: product-ops-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: product-ops-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-ops-service
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: product-ops-service
      containers:
        - name: product-ops-service
          image: ghcr.io/openstudio2022/quwoquan/product-ops-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18086
          env:
            - name: APP_ENV
              value: gamma
            - name: SERVICE_NAME
              value: product-ops-service
            - name: CONFIG_ROOT
              value: /etc/product-ops-service
            - name: CONFIG_VERSION
              value: v0.0.0
            - name: IMAGE_VERSION
              value: v0.0.0
            - name: PRODUCT_OPS_SERVICE_ADDR
              value: ":18086"
            # prod fail-fast 依赖：main.go 在 APP_ENV=prod 且缺 PROMETHEUS_URL 时
            # 直接退出；缺 PLATFORM_OPS_BASE_URL 时 config_sync 同样 fail-fast。
            - name: PROMETHEUS_URL
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: PROMETHEUS_URL
                  optional: false
            - name: PLATFORM_OPS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: PLATFORM_OPS_BASE_URL
                  optional: false
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: MONGO_URI
                  optional: false
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: POSTGRES_DSN
                  optional: false
            - name: PRODUCT_OPS_REDIS_REC_ADDR
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: PRODUCT_OPS_REDIS_REC_ADDR
                  optional: false
            - name: PRODUCT_OPS_REDIS_GENERAL_ADDR
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: PRODUCT_OPS_REDIS_GENERAL_ADDR
                  optional: false
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_JWT_SECRET
                  optional: false
            - name: AUTH_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_JWT_ISSUER
                  optional: false
            - name: AUTH_JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_JWT_AUDIENCE
                  optional: false
            - name: AUTH_JWT_TOKEN_VERSION
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_JWT_TOKEN_VERSION
                  optional: false
            - name: AUTH_DEVICE_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_DEVICE_TICKET_SECRET
                  optional: false
            - name: AUTH_DEVICE_TICKET_ISSUER
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_DEVICE_TICKET_ISSUER
                  optional: false
            - name: AUTH_DEVICE_TICKET_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_DEVICE_TICKET_AUDIENCE
                  optional: false
            - name: AUTH_DEVICE_TICKET_TOKEN_VERSION
              valueFrom:
                secretKeyRef:
                  name: product-ops-service-secrets
                  key: AUTH_DEVICE_TICKET_TOKEN_VERSION
                  optional: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
