apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: seed-box-prod
images:
  - name: ghcr.io/openstudio2022/quwoquan/product-ops-service
    newTag: v2026.02.28.1
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: product-ops-deploy-params
    literals:
      - APP_ENV=prod
      - CONFIG_VERSION=v2026.02.28.1
      - IMAGE_VERSION=v2026.02.28.1
      - REPLICAS=2
      - HPA_MIN_REPLICAS=2
      - HPA_MAX_REPLICAS=8
      - HPA_CPU_AVG=70
      - HPA_MEM_AVG=75
replacements:
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.APP_ENV
    targets:
      - select:
          kind: Deployment
          name: product-ops-service
        fieldPaths:
          - spec.template.spec.containers.[name=product-ops-service].env.[name=APP_ENV].value
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.CONFIG_VERSION
    targets:
      - select:
          kind: Deployment
          name: product-ops-service
        fieldPaths:
          - spec.template.spec.containers.[name=product-ops-service].env.[name=CONFIG_VERSION].value
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.IMAGE_VERSION
    targets:
      - select:
          kind: Deployment
          name: product-ops-service
        fieldPaths:
          - spec.template.spec.containers.[name=product-ops-service].env.[name=IMAGE_VERSION].value
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.REPLICAS
    targets:
      - select:
          kind: Deployment
          name: product-ops-service
        fieldPaths:
          - spec.replicas
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.HPA_MIN_REPLICAS
    targets:
      - select:
          kind: HorizontalPodAutoscaler
          name: product-ops-service
        fieldPaths:
          - spec.minReplicas
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.HPA_MAX_REPLICAS
    targets:
      - select:
          kind: HorizontalPodAutoscaler
          name: product-ops-service
        fieldPaths:
          - spec.maxReplicas
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.HPA_CPU_AVG
    targets:
      - select:
          kind: HorizontalPodAutoscaler
          name: product-ops-service
        fieldPaths:
          - spec.metrics.0.resource.target.averageUtilization
  - source:
      kind: ConfigMap
      name: product-ops-deploy-params
      fieldPath: data.HPA_MEM_AVG
    targets:
      - select:
          kind: HorizontalPodAutoscaler
          name: product-ops-service
        fieldPaths:
          - spec.metrics.1.resource.target.averageUtilization
