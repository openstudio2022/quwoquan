# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  product-ops-service:
    profiles: ["commercial-observability"]
    image: "${QWQ_COMPOSE_PRODUCT_OPS_SERVICE_IMAGE:?fixed product-ops-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/product-ops-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: product-ops-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${QWQ_COMPOSE_PRODUCT_OPS_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_PRODUCT_OPS_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      PRODUCT_OPS_SERVICE_ADDR: ":18086"
      MONGO_URI: mongodb://mongodb:27017
      POSTGRES_DSN: postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable
      PRODUCT_OPS_REDIS_REC_ADDR: redis:6379
      PRODUCT_OPS_REDIS_GENERAL_ADDR: redis:6379
      # 配置热更与 drift ACK 回报的平台控制面地址（config_sync 循环）。
      PLATFORM_OPS_BASE_URL: "${QWQ_COMPOSE_PLATFORM_OPS_BASE_URL:-http://platform-ops-service:18088}"
      # 四环境统一 Elasticsearch；Prod API key 仅由受保护部署环境注入。
      PRODUCT_OPS_ELASTICSEARCH_ENDPOINT: "${PRODUCT_OPS_ELASTICSEARCH_ENDPOINT:-}"
      PRODUCT_OPS_ELASTICSEARCH_API_KEY: "${PRODUCT_OPS_ELASTICSEARCH_API_KEY:-}"
      PRODUCT_OPS_ELASTICSEARCH_RAW_INDEX: "${PRODUCT_OPS_ELASTICSEARCH_RAW_INDEX:-}"
      PRODUCT_OPS_ELASTICSEARCH_STARTUP_DIAGNOSTIC_INDEX: "${PRODUCT_OPS_ELASTICSEARCH_STARTUP_DIAGNOSTIC_INDEX:-}"
      PRODUCT_OPS_ELASTICSEARCH_RUNTIME_LOG_INDEX: "${PRODUCT_OPS_ELASTICSEARCH_RUNTIME_LOG_INDEX:-}"
      PRODUCT_OPS_ELASTICSEARCH_AGGREGATE_INDEX: "${PRODUCT_OPS_ELASTICSEARCH_AGGREGATE_INDEX:-}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      AUTH_DEVICE_TICKET_SECRET: "${AUTH_DEVICE_TICKET_SECRET:?AUTH_DEVICE_TICKET_SECRET is required}"
      AUTH_DEVICE_TICKET_ISSUER: "${AUTH_DEVICE_TICKET_ISSUER:?AUTH_DEVICE_TICKET_ISSUER is required}"
      AUTH_DEVICE_TICKET_AUDIENCE: "${AUTH_DEVICE_TICKET_AUDIENCE:?AUTH_DEVICE_TICKET_AUDIENCE is required}"
      AUTH_DEVICE_TICKET_TOKEN_VERSION: "${AUTH_DEVICE_TICKET_TOKEN_VERSION:?AUTH_DEVICE_TICKET_TOKEN_VERSION is required}"
      # Alpha/Beta/Gamma local 可保持为空并使用 target-scoped 非生产 operator port；
      # Prod/release 必须由受保护部署面注入真实 OIDC，且禁止降级为 HS256。
      OPS_OIDC_ISSUER: "${OPS_OIDC_ISSUER:-}"
      OPS_OIDC_AUDIENCE: "${OPS_OIDC_AUDIENCE:-}"
      OPS_OIDC_JWKS_URL: "${OPS_OIDC_JWKS_URL:-}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 启动期 EnsureIndices 对 telemetry 索引/ILM 做 fail-fast 初始化，
      # 功能上强依赖 Elasticsearch；不声明该依赖时，冷启动调度里 ES 尚未
      # 就绪（或未创建）会让本服务在 DNS 解析处直接退出。
      elasticsearch:
        condition: service_healthy
      # /healthz 对公开 AccountSecurityAuthority 做 fail-closed 探测；若不把
      # 真实 owner 纳入启动依赖，首次全栈 up 会在 Product Ops unhealthy 上
      # 等待，而 user-service 尚未创建，形成确定的启动顺序死锁。
      user-service:
        condition: service_healthy
    ports:
      - "${QWQ_COMPOSE_PRODUCT_OPS_SERVICE_PORT:-19250}:18086"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      # ES 告警评估循环的执行策略（真相源在 quwoquan_ops）；是否启用由
      # telemetry_alerts.policy_path / alertmanager_url 配置决定。
      - ../../../../quwoquan_ops/observability/elasticsearch/product_telemetry_alerts.yaml:/etc/qwq/observability/product_telemetry_alerts.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18086/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
