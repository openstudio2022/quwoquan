# Product Ops 在 Alpha/Beta/Gamma 的唯一 Elasticsearch workload。
# stackctl package 从本文件选择目标架构的不可变镜像与 JVM 参数，并把解析后的
# Compose 复制进 candidate；up 只允许消费该 candidate artifact。
#
# quwoquan/elasticsearch-cjk 是官方 8.13.4 基镜像 + analysis-ik/analysis-pinyin
# 中文检索插件（specs/feature-tree/global-search-experience/design.md#dec-002）。
# 本地由 services/product-ops-service/build/elasticsearch/ 的 fetch_plugins.sh +
# Dockerfile 构建（tag 8.13.4，非浮动）；推送私有 registry 后必须回填为
# @sha256 digest pin（beta/gamma/prod 只接受 digest 形态）。
x-qwq-package-elasticsearch:
  runtimeEndpoint: "http://elasticsearch:9200"
  platforms:
    arm64:
      image: "quwoquan/elasticsearch-cjk:8.13.4"
      cliJavaOpts: "-XX:UseSVE=0"
      esJavaOpts: "-XX:UseSVE=0 -Xms512m -Xmx512m"
    amd64:
      image: "quwoquan/elasticsearch-cjk:8.13.4"
      cliJavaOpts: ""
      esJavaOpts: "-Xms512m -Xmx512m"
services:
  elasticsearch:
    # This expression is a checked-in source default only. The packaged copy
    # contains the exact platform image and no runtime selector.
    image: "${QWQ_COMPOSE_ELASTICSEARCH_IMAGE:-quwoquan/elasticsearch-cjk:8.13.4}"
    networks:
      - default
      - edge
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.name: "quwoquan-${QWQ_LOCAL_RELEASE_TARGET:?QWQ_LOCAL_RELEASE_TARGET is required}-logs"
      node.name: "${QWQ_LOCAL_RELEASE_TARGET:?QWQ_LOCAL_RELEASE_TARGET is required}-logs-0"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      CLI_JAVA_OPTS: "${QWQ_COMPOSE_ELASTICSEARCH_CLI_JAVA_OPTS:-}"
      ES_JAVA_OPTS: "${QWQ_COMPOSE_ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ports:
      - "${QWQ_COMPOSE_ELASTICSEARCH_PORT:?QWQ_COMPOSE_ELASTICSEARCH_PORT is required}:9200"
    volumes:
      - product-ops-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS 'http://localhost:9200/_ilm/status' >/dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 1200s
      retries: 60

  product-ops-service:
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  product-ops-elasticsearch-data:
