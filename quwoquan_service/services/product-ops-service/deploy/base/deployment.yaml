apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-ops-service
  labels:
    app.kubernetes.io/name: product-ops-service
  annotations:
    quwoquan.io/config-version: package-required
    quwoquan.io/image-version: package-required
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-ops-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-ops-service
      annotations:
        quwoquan.io/config-version: package-required
        quwoquan.io/image-version: package-required
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: product-ops-service
          image: quwoquan/product-ops-service:package-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18086
          envFrom:
            - secretRef:
                name: product-ops-service-runtime-secrets
          env:
            - name: SERVICE_NAME
              value: product-ops-service
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['quwoquan.io/environment']
            - name: CONFIG_ROOT
              value: /etc/qwq/config
            - name: CONFIG_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['quwoquan.io/config-version']
            - name: IMAGE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['quwoquan.io/image-version']
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/qwq/config/product-ops-service.yaml
              subPath: product-ops-service.yaml
              readOnly: true
            - name: telemetry-alert-policy
              mountPath: /etc/qwq/observability
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: runtime-config
          configMap:
            name: product-ops-service-runtime-config
        # 内容来自 quwoquan_ops/observability/elasticsearch/product_telemetry_alerts.yaml；
        # 环境未投放该 configMap 时评估循环按配置保持关闭。
        - name: telemetry-alert-policy
          configMap:
            name: product-ops-telemetry-alert-policy
            optional: true
