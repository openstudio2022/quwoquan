overrides:
  sys.product-ops-service.account_security_authority.base_url: http://user-service:18081
  sys.product-ops-service.account_security_authority.timeout_ms: 300
  sys.product-ops-service.redis.general.mode: cluster
  sys.product-ops-service.redis.general.tls: true
  sys.product-ops-service.redis.rec.mode: cluster
  sys.product-ops-service.redis.rec.tls: true
secretRefs:
  sys.product-ops-service.mongodb.uri: MONGODB_URI
  sys.product-ops-service.postgres.dsn: POSTGRES_DSN
  sys.product-ops-service.redis.general.password: PRODUCT_OPS_REDIS_GENERAL_PASSWORD
  sys.product-ops-service.redis.rec.password: PRODUCT_OPS_REDIS_REC_PASSWORD
externalBindings:
  runtime.message.transport:
    state: enabled
  runtime.log.sink:
    state: enabled
    adapter: ext.obs.aliyun_sls
    endpointRef: environment_binding:product_ops.sls_sink
    endpointEnvs:
      endpoint: PRODUCT_OPS_SLS_ENDPOINT
      region: PRODUCT_OPS_SLS_REGION
      project: PRODUCT_OPS_SLS_PROJECT
    secretRefs:
    - ALIBABA_CLOUD_ACCESS_KEY_ID
    - ALIBABA_CLOUD_ACCESS_KEY_SECRET
    timeoutMs: 10000
