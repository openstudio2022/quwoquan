overrides:
  sys.product-ops-service.account_security_authority.base_url: http://127.0.0.1:18081
  sys.product-ops-service.account_security_authority.timeout_ms: 300
  sys.product-ops-service.redis.general.addr: 127.0.0.1:6379
  sys.product-ops-service.redis.rec.addr: 127.0.0.1:6379
secretRefs:
  sys.product-ops-service.mongodb.uri: MONGODB_URI
  sys.product-ops-service.postgres.dsn: POSTGRES_DSN
  sys.product-ops-service.redis.general.password: PRODUCT_OPS_REDIS_GENERAL_PASSWORD
  sys.product-ops-service.redis.rec.password: PRODUCT_OPS_REDIS_REC_PASSWORD
externalBindings:
  runtime.message.transport:
    state: enabled
  runtime.log.sink:
    state: enabled
    adapter: ext.obs.postgres_telemetry_local
    endpointRef: service_config:product_ops.postgres
    timeoutMs: 1000
