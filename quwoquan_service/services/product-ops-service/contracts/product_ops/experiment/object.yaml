kind: aggregate_root
description: 实验定义、变体、受众约束、启停窗口与发布版本的唯一生命周期根。
identity:
  fields:
  - id
  version_field: version
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships: []
search_policy:
  exposed: none
  not_exposed_reason: "运营与控制面对象，只由运营台按 operator scope 访问，不进入用户检索面。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "运营控制面不是用户助手面，小趣既不读取也不写入运营对象。"
business_rules:
- experiment key 与 assignment unit 创建后不可变
- variant weights 总和必须为 10000 basis points
- 只有 draft 可以修改受众和变体，running 只能暂停或结束
- assignment 由稳定 hash 与激活版本决定，同一 unit 结果确定
- aggregate、receipt 与 outbox 必须在同一 PostgreSQL transaction 提交
lifecycle:
  state_field: status
  states:
  - draft
  - scheduled
  - running
  - paused
  - ended
  optimistic_concurrency: version
  idempotency: command_receipt
