externalDependencies:
- role: use
  capability: runtime.message.transport
  port: MessageTransportPort
  operations: [appendDurable]
  scenes: [general]
api_routes:
- method: POST
  path: /control-plane/product/experiments
  operation: CreateExperiment
  actor: account
  security:
    auth_mode: required
  request_entity: CreateExperimentRequest
  request_body_kind: object
  response_entity: CreateExperimentResult
  authorization:
    principal: operator
    scopes:
    - ops.experiment.write
    ownership_policy: operator_scope
  reliability:
    timeout_ms: 2000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - OPS.USER.experiment_invalid_argument
  - OPS.USER.version_conflict
  - OPS.USER.idempotency_conflict
  - OPS.SYSTEM.experiment_storage_write_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: redacted
  telemetry:
    metric: ops_experiment_create
    trace: true
    attributes:
    - operation
    - experiment_id
    - outcome
  slo:
    latency_p95_ms: 1000
    availability_percent: 99.9
  commercial:
    status: ready
  application:
    kind: command
    facet: ExperimentCommandFacade
    method: createExperiment
    aggregate_owner: Experiment
    mutation_target: Experiment
    invariant_target: Experiment
  description: 经授权 operator 原子创建首个 Experiment revision 并发布唯一 ExperimentPolicyActivated fact。
- method: GET
  path: /control-plane/product/experiments
  operation: ListExperiments
  actor: account
  security:
    auth_mode: required
  response_entity: ExperimentCatalogSlice
  authorization:
    principal: operator
    scopes:
    - ops.experiment.read
    ownership_policy: operator_scope
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - OPS.SYSTEM.experiment_storage_read_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: redacted
  telemetry:
    metric: ops_experiment_list
    trace: true
    attributes:
    - operation
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  commercial:
    status: ready
  application:
    kind: query
    facet: ExperimentQueryFacade
    method: listExperiments
    reader: ExperimentCatalogReader
    slice: ExperimentCatalogSlice
  description: 读取实验聚合目录和当前 experimentRevision 统计。
- method: POST
  path: /control-plane/product/experiments/{experimentId}:rollout
  operation: UpdateExperimentRollout
  actor: account
  security:
    auth_mode: required
  concurrency:
    version_precondition: if_match
  request_entity: UpdateExperimentRolloutRequest
  request_body_kind: object
  request_bindings:
    path:
    - name: experimentId
      field: experimentId
    header:
    - name: If-Match
      field: expectedVersion
  response_entity: UpdateExperimentRolloutResult
  authorization:
    principal: operator
    scopes:
    - ops.experiment.write
    ownership_policy: operator_scope
  reliability:
    timeout_ms: 2000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - OPS.USER.experiment_invalid_argument
  - OPS.USER.experiment_not_found
  - OPS.USER.version_conflict
  - OPS.USER.idempotency_conflict
  - OPS.SYSTEM.experiment_storage_read_failed
  - OPS.SYSTEM.experiment_storage_write_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: redacted
  telemetry:
    metric: ops_experiment_rollout
    trace: true
    attributes:
    - operation
    - experiment_id
    - outcome
  slo:
    latency_p95_ms: 1000
    availability_percent: 99.9
  commercial:
    status: ready
  application:
    kind: command
    facet: ExperimentCommandFacade
    method: updateRollout
    aggregate_owner: Experiment
    mutation_target: Experiment
    invariant_target: Experiment
  description: 通过 Experiment 聚合根更新流量、变体和启停状态。
consumers:
- name: platform-ops
  capabilities:
  - create_experiment
  - list_experiments
  - update_experiment_rollout
