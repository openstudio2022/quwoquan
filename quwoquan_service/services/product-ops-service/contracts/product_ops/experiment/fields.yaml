description: 可发布的实验定义
fields:
- name: id
  type: string
  constraints:
  - PK
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: key
  type: string
  constraints:
  - NOT_NULL
  - UNIQUE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: version
  type: int
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: status
  type: enum
  enum_ref: ExperimentStatus
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: variants
  type: '[]Variant'
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: audienceRule
  type: AudienceRule
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: metadata_only
  api_exposure: drop
  ops_exposure: read
  role: authoritative_state
- name: startsAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: endsAt
  type: timestamp
  constraints:
  - NULLABLE
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: createdAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
- name: updatedAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: INTERNAL
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: authoritative_state
types:
  Variant:
    description: Experiment 聚合内的不可独立访问变体值对象
    fields:
    - name: key
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: allocationBasisPoints
      type: int
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  AudienceRule:
    description: Experiment 聚合内的不可独立访问受众规则值对象
    fields:
    - name: kind
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
  CreateExperimentRequest:
    description: 创建首个 Experiment revision 的唯一强类型请求；服务端生成 version、createdAt 与 updatedAt
    fields:
    - name: id
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
    - name: key
      type: string
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
    - name: status
      type: enum
      enum_ref: ExperimentStatus
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
    - name: variants
      type: '[]Variant'
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: write
    - name: audienceRule
      type: AudienceRule
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: write
    - name: startsAt
      type: timestamp
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
    - name: endsAt
      type: timestamp
      constraints: [NULLABLE]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
  CreateExperimentResult:
    description: 首个 Experiment revision 与 durable policy activation 的提交结果
    fields:
    - name: id
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: key
      type: string
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: status
      type: enum
      enum_ref: ExperimentStatus
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: experimentRevision
      type: int
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: variants
      type: '[]Variant'
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: read
  UpdateExperimentRolloutRequest:
    description: 更新 Experiment 状态和当前 revision 变体权重的唯一强类型请求实体；运行中 rollout 允许原子重分配非负权重但总和必须精确为 10000 且至少一个变体为正；experimentId 只从 path 绑定，expectedVersion 只从 If-Match 绑定
    fields:
    - name: experimentId
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
    - name: expectedVersion
      type: int
      constraints:
      - NOT_NULL
      - POSITIVE
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
    - name: status
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: write
    - name: variants
      type: '[]Variant'
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: write
  UpdateExperimentRolloutResult:
    description: Experiment rollout 提交后的聚合修订结果
    fields:
    - name: id
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: status
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: experimentRevision
      type: int
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: variants
      type: '[]Variant'
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: read
  ExperimentCatalogItem:
    description: 运营实验目录中的强类型只读条目，与 HTTP handler 输出逐字段一致。
    fields:
    - name: id
      type: string
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: key
      type: string
      constraints: [NOT_NULL]
      classification: PUBLIC
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: status
      type: enum
      enum_ref: ExperimentStatus
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: experimentRevision
      type: int
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
    - name: variants
      type: '[]Variant'
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: read
    - name: variantStats
      type: object
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: read
    - name: assignedSubjects
      type: int
      constraints: [NOT_NULL]
      classification: INTERNAL
      log_policy: allow
      api_exposure: drop
      ops_exposure: read
  ExperimentCatalogSlice:
    description: 运营端实验目录的具名只读 Slice
    fields:
    - name: items
      type: '[]ExperimentCatalogItem'
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: metadata_only
      api_exposure: drop
      ops_exposure: read
enums:
  ExperimentStatus:
    values: [draft, scheduled, running, paused, ended]
