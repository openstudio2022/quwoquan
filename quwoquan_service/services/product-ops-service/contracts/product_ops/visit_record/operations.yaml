commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: OPS_VISIT_RECORD_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
- method: POST
  path: /ops/visits
  operation: RecordVisit
  actor: persona_or_device
  application:
    kind: command
    facet: VisitRecordCommandFacade
    method: recordVisit
    aggregate_owner: VisitRecord
    mutation_target: VisitRecord
    invariant_target: VisitRecord
  authorization:
    principal: public
    ownership_policy: authenticated_persona_or_derived_device_actor
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  request_entity: RecordVisitRequest
  request_body_kind: object
  request_bindings:
    injected:
    - name: Idempotency-Key
      field: idempotencyKey
  response_entity: RecordVisitReceipt
  response_body_kind: object
  error_codes:
  - OPS.USER.visit_invalid_argument
  - OPS.USER.visit_idempotency_conflict
  - OPS.SYSTEM.visit_storage_write_failed
  privacy:
    request_classification: SENSITIVE
    response_classification: PUBLIC
    log_policy: redacted
  telemetry:
    metric: ops_visit_record
    trace: true
    attributes:
    - actor_dimension
    - target_type
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  description: 记录访问并推进计数状态；服务端从已验证主体派生访问 actor，拒绝客户端指定 userId；相同 Idempotency-Key 重放不重复累加。
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: GET
  path: /ops/visits/stats
  operation: GetVisitStats
  actor: account
  application:
    kind: query
    facet: VisitAnalyticsQueryFacade
    method: getStats
    reader: VisitStatsReader
    slice: VisitStatsSlice
  authorization:
    principal: operator
    ownership_policy: operator_scope
    scopes:
    - ops.visit.read
  commercial:
    status: ready
  reliability:
    timeout_ms: 3000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - OPS.USER.visit_invalid_argument
  - OPS.SYSTEM.visit_storage_read_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: ops_visit_stats
    trace: true
    attributes:
    - target_type
    - outcome
  slo:
    latency_p95_ms: 1500
    availability_percent: 99.9
  request_bindings:
    query:
    - name: targetType
      field: targetType
      required: false
    - name: targetKey
      field: targetKey
      required: false
  description: 访问统计（运营/推荐读路径），按目标聚合 visitCount。
  security:
    auth_mode: required
    principal: operator
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
consumers:
- name: app
  capabilities:
  - record_visit
- name: platform-ops
  capabilities:
  - read_stats
- name: recommendation-engine
  capabilities:
  - read_visits
contract_test:
  test_strategy:
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: db.visit_records 与 db.visit_record_command_receipts 按 case 清理
      scenarios:
      - name: visit_committed
        command: RecordVisit
        seed: []
        assertions:
        - db.visit_records.FindOne({userId, targetType, targetKey}) → document exists
      - name: visit_count_increment
        command: RecordVisit x3 (distinct Idempotency-Key, same target)
        seed: []
        assertions:
        - db.visit_records.FindOne({userId, targetKey}).visitCount → 3
        - db.visit_records.FindOne({...}).occurredAt → latest server timestamp
      - name: visit_idempotent_replay
        command: RecordVisit x2 (same Idempotency-Key)
        seed: []
        assertions:
        - db.visit_records.FindOne({userId, targetKey}).visitCount → 1
        - db.visit_record_command_receipts.CountDocuments({actor, key}) → 1
        - aggregate 与 receipt 在同一 MongoDB transaction 提交

