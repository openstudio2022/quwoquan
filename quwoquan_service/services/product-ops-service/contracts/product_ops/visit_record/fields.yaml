  ops_exposure: read
  role: authoritative_state
- name: targetType
  source: targetType
  type: enum
  enum_ref: VisitTargetType
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: drop
  ops_exposure: read
  description: page/post/circle/user
  role: authoritative_state
- name: targetKey
  source: targetKey
  type: string
  constraints:
  - NOT_NULL
  - MAX_LENGTH_256
