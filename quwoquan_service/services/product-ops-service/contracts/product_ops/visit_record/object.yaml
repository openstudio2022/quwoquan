kind: aggregate_root
description: '用户对页面/内容/圈子/用户的访问计数状态：以 userId+targetType+targetKey 为身份的

  单文档，visitCount 单调递增、occurredAt 随真实访问推进，TTL 随最近访问刷新。

  服务端从已验证主体派生访问 actor；重试经 Idempotency-Key 去重后不得重复累加。

  统计读取经具名 Reader（GetVisitStats），不暴露事实流。

  '
identity:
  fields:
  - userId
  - targetType
  - targetKey
  version_source: store_commit
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships: []
capabilities:
- commandable
- queryable
- aggregatable
taggable: false
vector_enabled: false
business_rules:
- userId + targetType + targetKey 唯一（一目标一文档）
- visitCount 只增不减；occurredAt 只由服务端时钟在真实访问时推进
- 同一 actor 与 Idempotency-Key 的重放返回首次回执，不得重复累加计数
- 同一 actor 与 Idempotency-Key 不得用于不同目标
- targetKey 与 Idempotency-Key 必须非空且各不超过 256 字符
- VisitRecord 与幂等回执必须在同一 MongoDB transaction 提交
- VisitRecord 只是访问聚合与统计读模型；推荐反馈只来自 BehaviorSignal，不发布第二路访问事件
lifecycle:
  optimistic_concurrency: none
  idempotency: idempotency_key_dedup
