backend: postgres
role: authoritative
tables:
  account_enforcement_cases:
    entity: AccountEnforcementCase
    role: authoritative
    pk: id
    columns:
    - {name: id, type: VARCHAR(128), constraints: [PK, NOT_NULL]}
    - {name: case_kind, type: VARCHAR(32), constraints: [NOT_NULL]}
    - {name: account_id, type: VARCHAR(128), constraints: [NOT_NULL]}
    - {name: status, type: VARCHAR(32), constraints: [NOT_NULL]}
    - {name: policy_ref, type: VARCHAR(256), constraints: [NULLABLE]}
    - {name: source_decision_id, type: VARCHAR(128), constraints: [NULLABLE]}
    - {name: intake_ref, type: VARCHAR(256), constraints: [NULLABLE]}
    - {name: evidence_refs, type: JSONB, constraints: [NOT_NULL]}
    - {name: opened_by, type: VARCHAR(160), constraints: [NOT_NULL]}
    - {name: version, type: BIGINT, constraints: [NOT_NULL]}
    - {name: opened_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    indexes:
    - name: uq_account_enforcement_pending_account
      columns: [account_id]
      unique: true
      predicate: status = 'pending_approval'
    - name: idx_account_enforcement_case_status_updated
      columns: [status, updated_at]
    optimistic_lock: version
  account_enforcement_case_reviews:
    entity: AccountEnforcementCase
    role: authoritative
    pk: [case_id, reviewer_id]
    columns:
    - {name: case_id, type: VARCHAR(128), constraints: [PK, NOT_NULL]}
    - {name: reviewer_id, type: VARCHAR(160), constraints: [PK, NOT_NULL]}
    - {name: verdict, type: VARCHAR(16), constraints: [NOT_NULL]}
    - {name: reviewed_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
  account_enforcement_decisions:
    entity: AccountEnforcementCase
    role: append_only
    pk: decision_id
    columns:
    - {name: decision_id, type: VARCHAR(128), constraints: [PK, NOT_NULL]}
    - {name: decision_sequence, type: BIGINT, constraints: [NOT_NULL, UNIQUE]}
    - {name: case_id, type: VARCHAR(128), constraints: [NOT_NULL, UNIQUE]}
    - {name: account_id, type: VARCHAR(128), constraints: [NOT_NULL]}
    - {name: action, type: VARCHAR(16), constraints: [NOT_NULL]}
    - {name: case_ref, type: VARCHAR(256), constraints: [NOT_NULL]}
    - {name: decision_digest, type: VARCHAR(64), constraints: [NOT_NULL]}
    - {name: approved_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
  account_enforcement_command_receipts:
    entity: AccountEnforcementCase
    role: authoritative
    pk: idempotency_key
    description: 每个 operator command 的摘要与稳定结果；与对应聚合提交同事务写入。
    columns:
    - {name: idempotency_key, type: VARCHAR(160), constraints: [PK, NOT_NULL]}
    - {name: command_digest, type: VARCHAR(64), constraints: [NOT_NULL]}
    - {name: case_id, type: VARCHAR(128), constraints: [NOT_NULL]}
    - {name: result_version, type: BIGINT, constraints: [NOT_NULL]}
    - {name: result_snapshot, type: JSONB, constraints: [NOT_NULL]}
    - {name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
  account_enforcement_delivery_outbox:
    entity: AccountEnforcementCase
    role: authoritative
    pk: decision_id
    description: 只投递 UserAccount internal Suspend/Restore contract；不存在消息与同步调用双轨。
    columns:
    - {name: decision_id, type: VARCHAR(128), constraints: [PK, NOT_NULL]}
    - {name: status, type: VARCHAR(32), constraints: [NOT_NULL]}
    - {name: attempts, type: INTEGER, constraints: [NOT_NULL]}
    - {name: retry_generation, type: INTEGER, constraints: [NOT_NULL]}
    - {name: next_attempt_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: lease_owner, type: VARCHAR(160), constraints: [NULLABLE]}
    - {name: leased_until, type: TIMESTAMPTZ, constraints: [NULLABLE]}
    - {name: last_error_class, type: VARCHAR(64), constraints: [NOT_NULL]}
    - {name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    indexes:
    - name: idx_account_enforcement_delivery_due
      columns: [status, next_attempt_at, created_at]
  account_enforcement_delivery_receipts:
    entity: AccountEnforcementCase
    role: append_only
    pk: decision_id
    columns:
    - {name: decision_id, type: VARCHAR(128), constraints: [PK, NOT_NULL]}
    - {name: account_state, type: VARCHAR(32), constraints: [NOT_NULL]}
    - {name: auth_epoch, type: BIGINT, constraints: [NOT_NULL]}
    - {name: remote_idempotent_replay, type: BOOLEAN, constraints: [NOT_NULL]}
    - {name: remote_occurred_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
    - {name: delivered_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
  account_enforcement_delivery_dead_letters:
    entity: AccountEnforcementCase
    role: append_only
    pk: [decision_id, retry_generation]
    description: terminal DLQ 只保存不透明 decision id、代次、错误类别与次数，禁止 PII/证据/审核人。
    columns:
    - {name: decision_id, type: VARCHAR(128), constraints: [PK, NOT_NULL]}
    - {name: retry_generation, type: INTEGER, constraints: [PK, NOT_NULL]}
    - {name: error_class, type: VARCHAR(64), constraints: [NOT_NULL]}
    - {name: attempt_count, type: INTEGER, constraints: [NOT_NULL]}
    - {name: failed_at, type: TIMESTAMPTZ, constraints: [NOT_NULL]}
