    request_classification: SENSITIVE
    response_classification: PUBLIC
    log_policy: redacted
  telemetry:
    metric: ops_event_batch_report
    trace: true
    attributes:
    - actor_dimension
    - event_count
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  description: 已验证 persona/device actor 的产品事件与异常单轨入口；严格目录校验并同步等待所选 ObservabilityLogSink ACK。
