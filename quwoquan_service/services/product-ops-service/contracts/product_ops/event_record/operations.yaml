    kind: command
    facet: EventRecordCommandFacade
    method: appendBatch
    append_sink: EventRecord
    mutation_target: EventRecord
    invariant_target: EventRecord
  authorization:
    principal: public
    ownership_policy: authenticated_persona_or_derived_device_actor
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
