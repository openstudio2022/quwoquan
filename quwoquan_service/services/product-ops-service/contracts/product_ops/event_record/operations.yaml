commercial_defaults:
  status: blocked
  block_reason: Alpha/Beta/Gamma/Prod Elasticsearch evidence is required before commercial readiness
  gap_id: OPS_EVENT_RECORD_PROVIDER_EVIDENCE
  target_story: event-schema-governance
externalDependencies:
- capability: runtime.log.sink
  port: ObservabilityLogSinkPort
  operations: [appendEvents]
  conformance: observability_log_sink
  adapterContracts:
    ext.obs.elasticsearch:
      endpointEnvs: {endpoint: PRODUCT_OPS_ELASTICSEARCH_ENDPOINT}
      secretRefs: []
      defaultTimeoutMs: 5000
      allowEnvironmentOverrides: [secretRefs, timeoutMs]
api_routes:
- method: POST
  path: /ops/events
  operation: ReportEventBatch
  actor: persona_or_device
  request_entity: EventRecordBatchRequest
  request_body_kind: object
  response_entity: EventRecordBatchReceipt
  response_fields:
  - acceptedCount
  - duplicateBatch
  application:
    kind: command
    facet: EventRecordCommandFacade
    method: appendBatch
    append_sink: EventRecord
    mutation_target: EventRecord
    invariant_target: EventRecord
  authorization:
    principal: public
    ownership_policy: authenticated_persona_or_derived_device_actor
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - OPS.USER.event_batch_invalid
  - OPS.USER.idempotency_key_invalid
  - OPS.SYSTEM.logstore_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: PUBLIC
    log_policy: redacted
  telemetry:
    metric: ops_event_batch_report
    trace: true
    attributes:
    - actor_dimension
    - event_count
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  description: 已验证 persona/device actor 的产品事件与异常单轨入口；严格目录校验并同步等待所选 ObservabilityLogSink ACK。
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: GET
  path: /ops/runtime-logs/summary
  operation: GetRuntimeLogSummary
  actor: account
  request_bindings:
    query:
    - {name: signal, field: signal, required: false}
    - {name: severity, field: severity, required: false}
    - {name: errorCode, field: errorCode, required: false}
    - {name: fingerprint, field: fingerprint, required: false}
    - {name: sourceType, field: sourceType, required: false}
    - {name: service, field: service, required: false}
    - {name: appVersion, field: appVersion, required: false}
    - {name: from, field: from, required: false}
    - {name: to, field: to, required: false}
  application:
    kind: query
    facet: RuntimeLogQueryFacet
    method: getSummary
    reader: RuntimeLogSummaryReader
    slice: RuntimeLogSummarySlice
  authorization:
    principal: account
    permissions:
    - ops.runtime_log.read
    ownership_policy: ops_runtime_log_reader
  commercial:
    status: blocked
    block_reason: Alpha/Beta/Gamma/Prod Elasticsearch aggregate evidence is required before commercial readiness
    gap_id: OPS_EVENT_RECORD_PROVIDER_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  reliability:
    timeout_ms: 5000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: ops_runtime_log_summary
    trace: true
    attributes:
    - signal
    - outcome
  slo:
    latency_p95_ms: 3000
    availability_percent: 99.5
  error_codes:
  - OPS.USER.query_window_invalid
  - OPS.SYSTEM.runtime_logstore_unavailable
  response_fields:
  - totalCount
  - dimensions
  - sourceKind
  - freshness
  - generatedThrough
  - lagSeconds
  - actualFrom
  - actualTo
  description: 从闭合小时运行诊断聚合读取分级、signal、错误码与指纹趋势；响应声明中立 sourceKind、freshness、水位与实际窗口。
  security:
    auth_mode: required
    principal: admin
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: GET
  path: /ops/runtime-logs/drilldown
  operation: GetRuntimeLogDrilldown
  actor: account
  request_bindings:
    query:
    - {name: signal, field: signal, required: false}
    - {name: severity, field: severity, required: false}
    - {name: errorCode, field: errorCode, required: false}
    - {name: fingerprint, field: fingerprint, required: false}
    - {name: sourceType, field: sourceType, required: false}
    - {name: service, field: service, required: false}
    - {name: appVersion, field: appVersion, required: false}
    - {name: actorHash, field: actorHash, required: false}
    - {name: messageContains, field: messageContains, required: false}
    - {name: from, field: from, required: false}
    - {name: to, field: to, required: false}
    - {name: limit, field: limit, required: false}
    - {name: revealCorrelation, field: revealCorrelation, required: false}
  application:
    kind: query
    facet: RuntimeLogQueryFacet
    method: getDrilldown
    reader: RuntimeLogDrilldownReader
    slice: RuntimeLogDrilldownSlice
  authorization:
    principal: account
    permissions:
    - ops.runtime_log.read
    ownership_policy: ops_runtime_log_reader
  commercial:
    status: blocked
    block_reason: Alpha/Beta/Gamma/Prod Elasticsearch raw-index evidence is required before commercial readiness
    gap_id: OPS_EVENT_RECORD_PROVIDER_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  reliability:
    timeout_ms: 5000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: ops_runtime_log_drilldown
    trace: true
    attributes:
    - signal
    - outcome
  slo:
    latency_p95_ms: 3000
    availability_percent: 99.5
  error_codes:
  - OPS.USER.query_window_invalid
  - OPS.USER.event_drilldown_forbidden
  - OPS.SYSTEM.runtime_logstore_unavailable
  description: 从三天原始运行诊断分区读取经脱敏的明细；关联键默认隐藏，仅持有敏感诊断权限时可显式展开。
  security:
    auth_mode: required
    principal: admin
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: POST
  path: /ops/runtime-logs
  operation: ReportRuntimeLogBatch
  actor: persona_or_device
  request_entity: RuntimeLogBatchRequest
  request_body_kind: object
  response_entity: EventRecordBatchReceipt
  response_fields:
  - acceptedCount
  - duplicateBatch
  application:
    kind: command
    facet: RuntimeLogCommandFacet
    method: appendAppRuntimeBatch
    append_sink: EventRecord
    mutation_target: EventRecord
    invariant_target: EventRecord
  authorization:
    principal: public
    ownership_policy: authenticated_persona_or_derived_device_actor
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - OPS.USER.runtime_log_batch_invalid
  - OPS.USER.idempotency_key_invalid
  - OPS.SYSTEM.runtime_logstore_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: PUBLIC
    log_policy: redacted
  telemetry:
    metric: ops_runtime_log_batch_report
    trace: true
    attributes:
    - record_count
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  description: Dart、Go、Python 与 TypeScript runtime logger 的唯一远端入口；只接受 runtime_observability 目录声明的 signal、sourceType、关联键和脱敏属性。
  security:
    auth_mode: required
    principal: owner
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: POST
  path: /ops/startup-events
  operation: ReportStartupEventBatch
  actor: device
  request_entity: ReportStartupEventBatchCommand
  request_body_kind: object
  request_bindings:
    header:
    - {name: X-Qwq-Startup-Proof, field: proof, required: true}
  response_entity: StartupTelemetryBatchReceipt
  application:
    kind: command
    facet: StartupTelemetryCommandFacet
    method: appendStartupBatch
    append_sink: EventRecord
    mutation_target: EventRecord
    invariant_target: EventRecord
  authorization:
    principal: public
    ownership_policy: restricted_anonymous_startup_proof
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - OPS.USER.startup_event_invalid
  - OPS.SYSTEM.startup_telemetry_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: PUBLIC
    log_policy: metadata_only
  telemetry:
    metric: ops_startup_event_batch_report
    trace: true
    attributes:
    - phase
    - platform
    - runtime_env
    - outcome
    - recovery_lifecycle
    - recovery_mount
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  description: 唯一匿名 Ops 入口；同一批次单轨接收固定启动阶段或 page.app.startup_recovery 的受限恢复生命周期、脱敏字段与 startup proof，禁止产品、身份、URL、route、原始异常或堆栈字段。
  security:
    auth_mode: optional
    principal: owner
    token_transport: bearer
    anonymous_policy: allow
    visibility: public
