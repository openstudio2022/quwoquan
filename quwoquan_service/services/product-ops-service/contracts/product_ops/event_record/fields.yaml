description: EventRecord 固定九字段公共信封；eventType 专属字段只由 event_catalog.yaml 的 typed extension 定义拥有。
fields:
- name: logType
  source: logType
  type: string
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: eventType
  source: eventType
  type: string
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: sessionId
  source: sessionId
  type: string
  constraints: [NOT_NULL]
  classification: SENSITIVE
  log_policy: mask
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: pageName
  source: pageName
  type: string
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: occurredAt
  source: occurredAt
  type: timestamp
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: deviceManufacturer
  source: deviceManufacturer
  type: string
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: deviceModel
  source: deviceModel
  type: string
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: appVersion
  source: appVersion
  type: string
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
- name: networkClass
  source: networkClass
  type: string
  constraints: [NOT_NULL]
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
types:
  EventRecordBatchRequest:
    description: 产品事件批次请求体；单项字段由本对象固定信封与 event_catalog.yaml typed extension 联合约束。
    fields:
    - name: events
      source: events
      type: '[]object'
      constraints: [NOT_NULL, MIN_ITEMS_1]
      classification: SENSITIVE
      log_policy: metadata_only
      api_exposure: write
      ops_exposure: none
  RuntimeLogBatchRequest:
    description: App 运行诊断批次请求体；单项为 RuntimeLogService 严格校验并归一化的结构化诊断记录。
    fields:
    - name: records
      source: records
      type: '[]object'
      constraints: [NOT_NULL, MIN_ITEMS_1]
      classification: SENSITIVE
      log_policy: metadata_only
      api_exposure: write
      ops_exposure: none
typed_extensions:
  catalog: event_catalog.yaml
  discriminator: eventType
  definitions_key: extension_fields
  required_by_event_key: required_extensions
  optional_by_event_key: optional_extensions
  wire_encoding: flattened
  unknown_field_policy: reject
unique_constraints: []
