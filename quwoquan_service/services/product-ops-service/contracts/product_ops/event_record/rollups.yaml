entity: EventRecord
description: 'Product telemetry rollup algebra executed by the single Elasticsearch adapter in all environments.
  An environment may change capacity, but may not change the row identity, late-arrival, privacy, or percentile semantics.

  '
common:
  source_time_field: ingestedAt
  business_time_field: occurredAt
  business_window: '[businessHour,businessHour+1h)'
  destination_time_field: businessHour
  row_identity:
    fields:
    - _batchKey
    - _batchIndex
    digest: sha256_hex_256_bits
    duplicate_policy: keep_one_complete_row
  output:
    row_kind_field: rowKind
    freshness_field: freshness
    generated_through_field: generatedThrough
    lag_seconds_field: lagSeconds
  privacy:
    forbidden_fields:
    - sessionId
    - userId
    - callStack
    - _batchKey
    - _batchIndex
jobs:
- row_kind: event_dimensions
  source: raw_records
  dimensions:
  - logType
  - eventType
  - pageName
  - appVersion
  - networkClass
  - deviceManufacturer
  - deviceModel
  - journey
  - action
  - result
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: sessionHll
    algebra: mergeable_hll(sessionId)
    error_bound: 0.02
- row_kind: product_action_funnel
  source: raw_records
  filter: eventType = product_action
  dimensions:
  - journey
  - action
  - pageName
  - result
  - failReasonCode
  - recoveryAction
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: sessionHll
    algebra: mergeable_hll(sessionId)
    error_bound: 0.02
  - name: durationHistogram
    algebra: fixed_histogram(durationMs)
    buckets_ms: [0, 50, 100, 250, 500, 1000, 2000, 3000, 5000, 10000, 30000]
- row_kind: login_lifecycle
  source: raw_records
  filter: (eventType = login_funnel OR eventType = login_operation)
  dimensions:
  - eventType
  - action
  - operationId
  - step
  - provider
  - otpPurpose
  - consentState
  - result
  - failReasonCode
  - failureKind
  - recoveryAction
  - copyKey
  - feedbackSurface
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: sessionHll
    algebra: mergeable_hll(sessionId)
    error_bound: 0.02
  - name: durationHistogram
    algebra: fixed_histogram(durationMs)
    buckets_ms: [0, 50, 100, 250, 500, 800, 1200, 2000, 3000, 5000, 10000, 15000, 30000, 60000, 90000, 300000]
- row_kind: chat_funnel
  source: raw_records
  filter: eventType = chat_interaction_outcome
  dimensions:
  - pageName
  - chatAction
  - chatOutcome
  - chatSource
  - mentionScope
  - governanceAction
  - watermarkResult
  - memberCountBucket
  - unreadCountBucket
  - failReasonCode
  - recoveryAction
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: sessionHll
    algebra: mergeable_hll(sessionId)
    error_bound: 0.02
- row_kind: content_publication_funnel
  source: raw_records
  filter: eventType = content_publication
  dimensions:
  - pageName
  - publicationStage
  - contentType
  - objectState
  - surfaceId
  - result
  - backgroundRetryTerminal
  - failReasonCode
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: publishToVisibleHistogram
    algebra: fixed_histogram(durationMs)
    buckets_ms: [0, 1000, 5000, 15000, 30000, 60000, 120000, 300000, 600000, 1800000, 3600000]
- row_kind: article_reader_lifecycle
  source: raw_records
  filter: eventType IN (article_reader_enter, article_reader_dwell, article_reader_exit, article_reader_error, article_reader_recovery)
  dimensions:
  - eventType
  - pageName
  - surfaceId
  - objectType
  - result
  - errorCode
  - recoveryAction
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: sessionHll
    algebra: mergeable_hll(sessionId)
    error_bound: 0.02
  - name: durationHistogram
    algebra: fixed_histogram(durationMs)
    buckets_ms: [0, 50, 100, 250, 500, 800, 1200, 2000, 3000, 5000, 10000, 30000, 60000, 300000, 1800000]
- row_kind: video_preview_track_load
  source: raw_records
  filter: eventType = video_preview_track_load
  dimensions: [pageName, result, failReasonCode]
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: durationHistogram
    algebra: fixed_histogram(durationMs)
    buckets_ms: [0, 50, 100, 250, 500, 1000, 2000, 3000, 5000, 10000, 30000]
- row_kind: search_funnel
  source: raw_records
  filter: eventType IN (search_query_submit, search_result_impression, search_result_click, search_refine, search_zero_result, search_result_dwell)
  dimensions: [action]
  measures:
  - name: querySubmitCount
    algebra: count_distinct_where(requestId, eventType = search_query_submit)
  - name: nonEmptyResultCount
    algebra: count_distinct_where(requestId, eventType = search_result_impression)
  - name: effectiveActionRequestCount
    algebra: count_distinct_where(requestId, eventType = search_result_click OR (eventType = search_result_dwell AND durationMs >= 3000))
  - name: firstActionableHistogram
    algebra: fixed_histogram_where(durationMs, eventType = search_result_impression)
    buckets_ms: [0, 50, 100, 250, 500, 750, 1000, 1500, 2000, 3000, 5000, 10000]
- row_kind: performance
  source: raw_records
  filter: (eventType = performance_sample OR eventType = app_startup)
  dimensions:
  - eventType
  - operationId
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: durationHistogram
    algebra: fixed_histogram(durationMs)
    buckets_ms:
    - 0
    - 50
    - 100
    - 250
    - 500
    - 1000
    - 2000
    - 3000
    - 5000
    - 10000
    - 30000
  - name: errorCount
    algebra: count_distinct_row_identity_where(hasError = true)
  - name: firstFrameHistogram
    algebra: fixed_histogram(tClickToFirstFrameMs)
    buckets_ms: [0, 50, 100, 250, 500, 1000, 2000, 3000, 5000, 10000, 30000]
  - name: shellHistogram
    algebra: fixed_histogram(tFirstFrameToShellMs)
    buckets_ms: [0, 50, 100, 250, 500, 1000, 2000, 3000, 5000, 10000, 30000]
  - name: contentHistogram
    algebra: fixed_histogram(tClickToContentMs)
    buckets_ms: [0, 50, 100, 250, 500, 1000, 2000, 3000, 5000, 10000, 30000]
- row_kind: video_qoe
  source: raw_records
  filter: eventType = video_playback_qoe
  dimensions:
  - devicePlatform
  - networkClass
  - playbackMode
  - result
  - rendererMode
  - decoderQueueMode
  - decoderFallbackEnabled
  - seekEvidenceSource
  measures:
  - name: readyCount
    algebra: count_distinct_row_identity
  - name: readyHistogram
    algebra: fixed_histogram(readyMs)
    buckets_ms:
    - 0
    - 100
    - 250
    - 500
    - 1000
    - 2000
    - 3000
    - 5000
    - 10000
    - 30000
  - name: ttffHistogram
    algebra: fixed_histogram(ttffMs)
    buckets_ms:
    - 0
    - 100
    - 250
    - 500
    - 1000
    - 2000
    - 3000
    - 5000
    - 10000
    - 30000
  - name: rebufferCount
    algebra: sum(rebufferCount)
  - name: rebufferSessionCount
    algebra: count_distinct_row_identity_where(rebufferCount > 0)
  - name: rebufferMs
    algebra: sum(rebufferMs)
  - name: effectivePlaybackMs
    algebra: sum(effectivePlaybackMs)
  - name: seekCount
    algebra: sum(seekCount)
  - name: seekFailureCount
    algebra: sum(seekFailureCount)
  - name: seekCommandHistogram
    algebra: fixed_histogram(seekCommandMaxMs)
    buckets_ms:
    - 0
    - 25
    - 50
    - 100
    - 250
    - 500
    - 1000
    - 2000
    - 5000
  - name: seekSettleHistogram
    algebra: fixed_histogram(seekSettleMaxMs)
    buckets_ms:
    - 0
    - 25
    - 50
    - 100
    - 250
    - 500
    - 1000
    - 2000
    - 5000
  - name: nativeFirstFrameSuccessCount
    algebra: count_distinct_row_identity_where(ttffMs IS NOT NULL)
  - name: droppedFrames
    algebra: sum(droppedFrames)
  - name: processedVideoFrames
    algebra: sum(processedVideoFrames)
  - name: audioUnderrunCount
    algebra: sum(audioUnderrunCount)
  - name: terminalFailureCount
    algebra: count_distinct_row_identity_where(result != success)
- row_kind: rtc_qoe
  source: raw_records
  filter: eventType = rtc_media_qoe
  dimensions:
  - callType
  - result
  - mediaConnected
  - networkQuality
  - disconnectReason
  - failReasonCode
  measures:
  - name: count
    algebra: count_distinct_row_identity
  - name: connectTimeHistogram
    algebra: fixed_histogram(connectTimeMs)
    buckets_ms:
    - 0
    - 250
    - 500
    - 1000
    - 2000
    - 3000
    - 5000
    - 8000
    - 10000
    - 30000
  - name: reconnectCount
    algebra: sum(reconnectCount)
- row_kind: error_dimensions
  source: raw_records
  filter: logType = error
  dimensions:
  - errorCode
  - operationId
  - httpStatus
  - pageName
  - appVersion
  - deviceManufacturer
  - deviceModel
  - networkClass
  measures:
  - name: count
    algebra: count_distinct_row_identity
- row_kind: runtime_diagnostics
  source: runtime_records
  dimensions:
  - logKind
  - severity
  - signal
  - errorCode
  - fingerprint
  - resourceSourceType
  - resourceService
  - resourceAppVersion
  - resourceServiceVersion
  - resourceEnvironment
  measures:
  - name: count
    algebra: count_distinct_row_identity
late_arrival:
  accepted_window_hours: 72
  policy: emit_increment_for_business_hour
  recomputation:
    mode: overwrite
    run_identity:
    - job
    - ingest_window
    - dimension_digest
    lock: advisory_lock
