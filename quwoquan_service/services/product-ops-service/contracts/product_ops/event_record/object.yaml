kind: append_only_fact
description: 'App 产品事件与异常的严格目录化明细。公共信封固定为九字段，具体 eventType

  只允许 event_catalog.yaml 声明的强类型扩展。四环境原始明细统一写入 Elasticsearch 并保留三天，

  Portal 只能经 product-ops 查询门面访问；推荐反馈不属于本对象。

  '
identity:
  fields:
  - sessionId
  - eventType
  - occurredAt
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships: []
lifecycle:
  immutable: true
  append_command_admission:
    status: evaluated
    instance_invariant: none
    commands:
      - ReportEventBatch
      - ReportRuntimeLogBatch
      - ReportStartupEventBatch
    rationale: 运营事件/运行日志/启动事件批量上报；三条命令均为固定字段匿名事实追加，约束只有 canonical identity 幂等，无实例级可变计数或额度。
    evaluated_at: '2026-08-07'
search_policy:
  exposed: none
  not_exposed_reason: "追加事实只服务于后台聚合、审计与回放，不构成用户可检索的对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "原始行为与遥测事实不对小趣开放；小趣只读所属域的公开投影结果。"
business_rules:
- eventType 必须存在于 canonical event catalog，未知事件拒绝写入且不得降级为 generic payload。
- 公共九字段信封由可信 runtime context 补齐，客户端不得覆盖身份、环境或 trace 归属。
- 原始明细只写 Elasticsearch 并按声明保留期清理；Mongo 仅保存可从 EventRecord 重放的 UserActivityDailyView 与 ActorFirstSeenView，不得成为第二权威来源。
- 推荐学习事实不得混入本对象。
