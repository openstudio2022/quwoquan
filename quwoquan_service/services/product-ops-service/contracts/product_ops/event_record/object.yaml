kind: append_only_fact
description: 'App 产品事件与异常的严格目录化明细。公共信封固定为九字段，具体 eventType

  只允许 event_catalog.yaml 声明的强类型扩展。原始明细写入阿里云 SLS 三天，

  Portal 只能经 product-ops 查询门面访问；推荐反馈不属于本对象。

  '
identity:
  fields:
  - sessionId
  - eventType
  - occurredAt
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships: []
capabilities:
- queryable
- aggregatable
taggable: false
vector_enabled: false
lifecycle:
  immutable: true
business_rules:
- eventType 必须存在于 canonical event catalog，未知事件拒绝写入且不得降级为 generic payload。
- 公共九字段信封由可信 runtime context 补齐，客户端不得覆盖身份、环境或 trace 归属。
- 原始明细只写 SLS 并按声明保留期清理，推荐学习事实不得混入本对象。
