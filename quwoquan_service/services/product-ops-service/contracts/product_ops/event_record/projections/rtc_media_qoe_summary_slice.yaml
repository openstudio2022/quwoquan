read_model: RtcMediaQoeSummarySlice
description: '最近 24 个 UTC 小时桶的 RTC 媒体 QoE 权威查询结果。有效样本排除

  result=abandoned；媒体接通率分母为有效样本，connection_lost 率分母为

  mediaConnected=true 的样本；P95 只消费真实接通样本的 connectTimeMs。

  reader 直接查询 rtc_media_qoe raw，避免从 generic summary 或小时 P95

  二次推导整体 P95。

  '
storage_backend: aliyun_sls
projection_mode: authoritative_query
source_entities:
- EventRecord
consumers:
- product-ops-service
- ops-portal
fields:
- name: hasSamples
  type: bool
- name: windowHours
  type: int
- name: actualFrom
  type: timestamp
- name: actualTo
  type: timestamp
- name: effectiveSampleCount
  type: int64
- name: mediaConnectedCount
  type: int64
- name: mediaConnectedRate
  type: float64
  nullable: true
- name: connectP95Ms
  type: float64
  nullable: true
- name: connectionLostCount
  type: int64
- name: connectionLostRate
  type: float64
  nullable: true
- name: reconnectCount
  type: int64
- name: series
  type: '[]RtcMediaQoeHourlyPoint'
- name: sourceKind
  type: string
- name: freshness
  type: string
- name: generatedThrough
  type: timestamp
  nullable: true
- name: lagSeconds
  type: int64
  nullable: true
