backend: observability_log_sink
environment_backends:
  alpha:
    adapter: ext.obs.elasticsearch
    backend: elasticsearch
  beta:
    adapter: ext.obs.elasticsearch
    backend: elasticsearch
  gamma:
    adapter: ext.obs.elasticsearch
    backend: elasticsearch
  prod:
    adapter: ext.obs.elasticsearch
    backend: elasticsearch
fallback: forbidden
collections:
  ops_user_activity_daily:
    entity: EventRecord
    description: EventRecord 产品事件按 UTC 日期形成的可重建增长聚合；原始事件是唯一权威来源。
    indexes:
    - name: pk_user_activity_date
      keys:
        _id: 1
      unique: true
  ops_actor_first_seen:
    entity: EventRecord
    description: 不可逆 actor hash 的首见日期投影，用于新增与留存口径；可由 EventRecord 重放重建。
    indexes:
    - name: idx_actor_first_seen_date
      keys:
        firstSeenDate: 1
logstores:
  raw:
    provider_config_keys:
      elasticsearch: elasticsearch.raw_index
    default_name: app-product-telemetry-raw
    ttl_days: 3
    time_field: ingestedAt
    business_time_field: occurredAt
    internal_fields:
    - _batchKey
    - _batchIndex
    - ingestedAt
    indexed_fields:
    - logType
    - eventType
    - pageName
    - appVersion
    - networkClass
    - deviceManufacturer
    - deviceModel
    - errorCode
    - operationId
    - httpStatus
    - occurredAt
    - sessionId
    - _batchKey
    - _batchIndex
    - journey
    - action
    - flowId
    - entryMode
    - step
    - fromStep
    - toStep
    - provider
    - otpPurpose
    - consentState
    - result
    - durationMs
    - failReasonCode
    - failureKind
    - recoveryAction
    - copyKey
    - feedbackSurface
    - requestId
    - traceId
    - resultCount
    - rankPosition
    - objectType
    - devicePlatform
    - playbackMode
    - readyMs
    - ttffMs
    - rebufferCount
    - rebufferMs
    - effectivePlaybackMs
    - seekCount
    - seekFailureCount
    - seekCommandMaxMs
    - seekSettleMaxMs
    - droppedFrames
    - processedVideoFrames
    - audioUnderrunCount
    - rendererMode
    - decoderQueueMode
    - decoderFallbackEnabled
    - seekEvidenceSource
    - durationMismatch
    - chatAction
    - chatOutcome
    - chatSource
    - mentionScope
    - governanceAction
    - watermarkResult
    - memberCountBucket
    - unreadCountBucket
    non_indexed_fields:
    - callStack
  startup_diagnostic:
    provider_config_keys:
      elasticsearch: elasticsearch.startup_diagnostic_index
    default_name: app-startup-diagnostic-raw
    ttl_days: 3
    forbidden_fields:
    - sessionId
    - userId
    - pageName
    - callStack
  runtime_diagnostic:
    provider_config_keys:
      elasticsearch: elasticsearch.runtime_log_index
    default_name: runtime-diagnostics-raw
    ttl_days: 3
    forbidden_fields:
    - schemaVersion
    - eventVersion
    - contractVersion
    - protocolVersion
    - releaseVersion
    - releaseId
    - dataReleaseId
    - rawCredential
    - rawToken
    - rawEndpoint
  aggregate:
    provider_config_keys:
      elasticsearch: elasticsearch.aggregate_index
    default_name: app-product-telemetry-hourly
    ttl_days: 90
    internal_fields:
    - sessionHashes
    forbidden_fields:
    - sessionId
    - userId
    - callStack
    - _batchKey
role: append_only
redis_cache:
- key: ops:telemetry:batch:{batchKey}
  type: hash
  ttl_seconds: 259200
  entity: EventRecord
  description: EventRecord ingest batch 的幂等完成 ledger；key 只使用 canonical batch digest。
