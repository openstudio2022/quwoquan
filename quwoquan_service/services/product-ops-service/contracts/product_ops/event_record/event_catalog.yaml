log_types:
- event
- error
network_classes:
- wifi
- ethernet
- 5g
- 4g
- mobile
- other
- none
ingestion:
  max_batch_items: 50
  max_canonical_body_bytes: 131072
  occurred_at_max_age_hours: 72
  occurred_at_max_future_minutes: 5
common_fields:
- logType
- eventType
- sessionId
- pageName
- occurredAt
- deviceManufacturer
- deviceModel
- appVersion
- networkClass
context_extensions:
- devicePlatform
extension_fields:
