backend: postgres
tables:
  experiment_assignment_facts:
    entity: ExperimentAssignmentFact
    role: append_only
    pk:
    - id
    columns:
    - name: id
      type: VARCHAR(36)
      constraints:
      - PK
    - name: experiment_id
      type: VARCHAR(64)
      constraints:
      - NOT_NULL
    - name: subject_key
      type: VARCHAR(128)
      constraints:
      - NOT_NULL
    - name: variant
      type: VARCHAR(32)
      constraints:
      - NOT_NULL
    - name: experiment_revision
      type: BIGINT
      constraints:
      - NOT_NULL
    - name: assigned_at
      type: TIMESTAMPTZ
      constraints:
      - NOT_NULL
      default: NOW()
    indexes:
    - name: idx_assignment_experiment
      columns:
      - experiment_id
      - variant
    - name: idx_assignment_subject
      columns:
      - subject_key
    unique_constraints:
    - name: uq_assignment_subject
      columns:
      - experiment_id
      - experiment_revision
      - subject_key
role: append_only
streams:
  events.ops.experiment_assignment_observed:
    entity: ExperimentAssignmentFact
    role: append_only
    idempotency_key: eventId
    retention_seconds: 604800
    writers: [recommendation-service, search-service]
    description: Recommendation 与 Search 发布的确定性分桶观察事实；Product Ops 按精确 Experiment revision 校验后投影。
  events.ops.experiment_assignment_observed.product_ops.dlq:
    entity: ExperimentAssignmentFact
    role: dead_letter
    idempotency_key: sourceStreamId
    retention_seconds: 604800
    description: 仅保存违反 ExperimentAssignmentObserved typed contract 的不可重试消息。
