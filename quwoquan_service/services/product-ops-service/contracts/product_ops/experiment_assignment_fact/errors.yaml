domain: OPS
aggregate: ExperimentAssignmentFact
description: ExperimentAssignmentFact 查询、追加与统计的对象本地稳定错误语义。
errors:
- code: OPS.USER.experiment_assignment_unauthorized
  kind: USER
  reason: unauthorized
  http_status: 401
  emitted_by:
  - {surface: http, operations: [GetExperimentAssignment, AssignExperimentVariant]}
  recovery_action: reauth
  dart_const: experimentAssignmentUnauthorized
  go_const: ErrExperimentAssignmentUnauthorized
  user_message:
    zh: 请先使用可信角色或设备身份
    en: Sign in with a trusted persona or device
- code: OPS.USER.experiment_assignment_invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - {surface: http, operations: [GetExperimentAssignment, AssignExperimentVariant, GetExperimentStats]}
  recovery_action: surface
  dart_const: experimentAssignmentInvalidArgument
  go_const: ErrExperimentAssignmentInvalidArgument
  user_message:
    zh: 实验分配请求参数无效
    en: Invalid experiment assignment request
- code: OPS.USER.experiment_assignment_experiment_not_found
  kind: USER
  reason: experiment_not_found
  http_status: 404
  emitted_by:
  - {surface: http, operations: [GetExperimentAssignment, AssignExperimentVariant, GetExperimentStats]}
  recovery_action: refresh
  dart_const: experimentAssignmentExperimentNotFound
  go_const: ErrExperimentAssignmentExperimentNotFound
  user_message:
    zh: 待分配的实验不存在
    en: Experiment for assignment was not found
- code: OPS.USER.experiment_assignment_not_found
  kind: USER
  reason: assignment_not_found
  http_status: 404
  emitted_by:
  - {surface: http, operations: [GetExperimentAssignment]}
  recovery_action: retry
  dart_const: experimentAssignmentNotFound
  go_const: ErrExperimentAssignmentNotFound
  user_message:
    zh: 实验分配尚未生成
    en: Experiment assignment has not been created
- code: OPS.USER.experiment_assignment_not_running
  kind: USER
  reason: experiment_not_running
  http_status: 409
  emitted_by:
  - {surface: http, operations: [AssignExperimentVariant]}
  recovery_action: refresh
  dart_const: experimentAssignmentNotRunning
  go_const: ErrExperimentAssignmentNotRunning
  user_message:
    zh: 实验当前不可分配
    en: Experiment is not available for assignment
- code: OPS.SYSTEM.experiment_assignment_storage_read_failed
  kind: SYSTEM
  reason: storage_read_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [GetExperimentAssignment, AssignExperimentVariant, GetExperimentStats]}
  recovery_action: retry
  recovery_after_seconds: 2
  dart_const: experimentAssignmentStorageReadFailed
  go_const: ErrExperimentAssignmentStorageReadFailed
  user_message:
    zh: 实验分配读取失败，请稍后重试
    en: Experiment assignment read failed, please retry
- code: OPS.SYSTEM.experiment_assignment_storage_write_failed
  kind: SYSTEM
  reason: storage_write_failed
  http_status: 500
  emitted_by:
  - {surface: http, operations: [AssignExperimentVariant]}
  recovery_action: retry
  recovery_after_seconds: 2
  dart_const: experimentAssignmentStorageWriteFailed
  go_const: ErrExperimentAssignmentStorageWriteFailed
  user_message:
    zh: 实验分配写入失败，请稍后重试
    en: Experiment assignment write failed, please retry
