commercial_defaults:
  block_reason: Product Ops assignment fact 未绑定推荐/搜索线上 runtime policy；为消除双轨统计， assignment 查询/写入在真实 durable
    binding 完成前冻结
  gap_id: OPS_EXPERIMENT_RUNTIME_BINDING_FROZEN
  status: blocked
  target_story: bucketing-strategy-engine
api_routes:
- actor: persona_or_device
  security:
    auth_mode: required
  application:
    facet: ExperimentAssignmentQueryFacade
    kind: query
    method: getAssignment
    reader: ExperimentAssignmentReader
    slice: ExperimentAssignmentSlice
  authorization:
    principal: public
    ownership_policy: trusted_persona_or_device_subject
  reliability:
    timeout_ms: 1000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - OPS.USER.experiment_assignment_unauthorized
  - OPS.USER.experiment_assignment_invalid_argument
  - OPS.USER.experiment_assignment_experiment_not_found
  - OPS.USER.experiment_assignment_not_found
  - OPS.SYSTEM.experiment_assignment_storage_read_failed
  privacy:
    request_classification: PUBLIC
    response_classification: SENSITIVE
    log_policy: redacted
  telemetry:
    metric: ops_experiment_assignment_read
    trace: true
    attributes:
    - operation
    - experiment_id
    - actor_dimension
    - outcome
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  description: 通过具名 Reader 查询当前已验签 Persona/Device 的不可变实验分配事实
  method: GET
  operation: GetExperimentAssignment
  path: /ops/experiments/{experimentId}/assignment
  request_bindings:
    path:
    - name: experimentId
      field: experimentId
  response_entity: ExperimentAssignmentFact
- actor: account
  security:
    auth_mode: required
  application:
    facet: ExperimentAnalyticsQueryFacade
    kind: query
    method: getStats
    reader: ExperimentStatsReader
    slice: ExperimentStatsSlice
  description: 实验统计（运营）
  authorization:
    principal: operator
    scopes:
    - ops.experiment.read
    ownership_policy: operator_scope
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - OPS.USER.experiment_assignment_invalid_argument
  - OPS.USER.experiment_assignment_experiment_not_found
  - OPS.SYSTEM.experiment_assignment_storage_read_failed
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: redacted
  telemetry:
    metric: ops_experiment_assignment_stats
    trace: true
    attributes:
    - operation
    - experiment_id
    - outcome
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  method: GET
  operation: GetExperimentStats
  path: /ops/experiments/{experimentId}/stats
  request_bindings:
    path:
    - name: experimentId
      field: experimentId
  response_entity: ExperimentStatsSlice
consumers:
- capabilities:
  - read_experiment_assignment
  - read_stats
  name: platform-ops
contract_test:
  coverage_requirements:
  - deterministic assignment and trusted subject derivation verified
  - PostgreSQL unique constraint and immutable replay verified
  - assignment fact is the single immutable truth; replay creates neither a second fact nor a dead integration event
  - generated commercial guard remains default-deny until recommendation/search runtime binding exists
  current_evidence:
    local_contract:
    - services/product-ops-service/internal/domain/product_ops/product_ops/experiment/model/experiment__local_contract_test.go
    - services/product-ops-service/tests/local_contract/ops/product_ops/event_record/experiment_http_boundary__local_contract_test.go
    api_integration:
    - services/product-ops-service/tests/api_integration/ops/product_ops/event_record/control_plane_postgres_store__api_integration_test.go
    - services/product-ops-service/tests/api_integration/ops/product_ops/event_record/experiment_http_boundary__api_integration_test.go
    real_engines:
      postgres: embedded-postgres
    assertions:
    - trusted Persona/Device principal derives subject_key; request body cannot spoof actor identity
    - repeated assignment returns one PostgreSQL fact for experiment_id + experiment_revision + subject_key
    - assignment persistence has no unconsumed outbox side effect
  commercial_block:
    gap_id: OPS_EXPERIMENT_RUNTIME_BINDING_FROZEN
    reason: assignment fact 尚未由推荐/搜索线上 runtime 分桶结果写入；当前统计不得冒充线上真相源。 控制面保持冻结，只有 durable runtime binding、实际流量回写与
      gamma 对账证据同时闭合后才能翻 ready。
