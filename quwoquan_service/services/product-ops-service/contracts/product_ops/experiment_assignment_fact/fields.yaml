fields:
- name: id
  source: id
  type: string
  constraints:
  - PK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: experimentId
  source: experimentId
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
  reference: true
- name: subjectKey
  source: subjectKey
  type: string
  constraints:
  - NOT_NULL
  classification: PII
  log_policy: hash
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: variant
  source: variant
  type: string
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: experimentRevision
  source: experimentRevision
  type: int
  constraints:
  - NOT_NULL
  - POSITIVE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: assignedAt
  source: assignedAt
  type: timestamp
  constraints:
  - NOT_NULL
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
types:
  AssignExperimentVariantRequest:
    description: 分配实验变体的唯一请求实体；experimentId 只从 path 绑定，受试主体只从已验签 Persona 或 Device 派生。
    fields:
    - name: experimentId
      type: string
      constraints:
      - NOT_NULL
      classification: PUBLIC
      log_policy: allow
      api_exposure: write
      ops_exposure: read
  ExperimentStatsSlice:
    fields:
    - name: experimentId
      type: string
      constraints:
      - NOT_NULL
    - name: experimentRevision
      type: int
      constraints:
      - NOT_NULL
      - POSITIVE
    - name: status
      type: string
      constraints:
      - NOT_NULL
    - name: variantStats
      type: object
      constraints:
      - NOT_NULL
    - name: assignedSubjects
      type: int
      constraints:
      - NOT_NULL
unique_constraints:
- columns:
  - experimentId
  - experimentRevision
  - subjectKey
  description: 同一 Experiment 聚合修订号内的分配确定性；该修订号不是 runtime 策略身份
