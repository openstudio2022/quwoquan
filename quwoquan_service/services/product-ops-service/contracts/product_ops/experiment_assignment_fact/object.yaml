kind: append_only_fact
lifecycle:
  immutable: true
description: 'A/B 实验的不可变确定性 assignment fact。Experiment 聚合拥有实验生命周期；

  分配经 typed append sink 以 (experimentId, experimentRevision, trustedSubjectKey) 幂等追加；

  trustedSubjectKey 只能由已验签 Persona 或 Device Actor 派生，禁止客户端指定。

  '
identity:
  fields:
  - id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: experiment
  on_delete: retain
  reference_fields:
  - experimentId
  target_object: ops.Experiment
taggable: false
vector_enabled: false
business_rules:
- assignment 只能由已激活 ExperimentPolicy 与可信 subject key 通过同一确定性算法计算。
- 同一 experimentId、revision 与 subject key 只追加一次，客户端不得主动指定 bucket。
- Recommendation 与 Search 只发布观察事实，不维护私有实验配置真相源。
