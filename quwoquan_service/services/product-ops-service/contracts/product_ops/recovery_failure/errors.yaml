errors:
- code: OPS.USER.recovery_failure_invalid
  reason: recovery_failure_invalid
  http_status: 400
  emitted_by:
  - {surface: http, operations: [ReportRecoveryFailure]}
  recovery_action: absorb
  disruption_level: silent
  go_const: ErrRecoveryFailureInvalid
  user_message:
    zh: 异常记录无效
    en: The recovery failure record is invalid.
- code: OPS.SYSTEM.recovery_failure_unavailable
  reason: recovery_failure_unavailable
  http_status: 503
  emitted_by:
  - {surface: http, operations: [ReportRecoveryFailure]}
  recovery_action: retry
  recovery_after_seconds: 5
  disruption_level: silent
  go_const: ErrRecoveryFailureUnavailable
  user_message:
    zh: 异常记录暂未接收
    en: The recovery failure record was not accepted.
