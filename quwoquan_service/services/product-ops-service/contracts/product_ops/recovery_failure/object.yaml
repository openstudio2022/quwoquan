kind: append_only_fact
lifecycle:
  immutable: true
description: 启动或运行时不可恢复异常的匿名十字段诊断事实；复用现有 runtime log store，不生成客户端诊断标识或异常指纹。
identity:
  fields: [occurredAt, buildNumber, errorSource, errorType]
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships: []
capabilities: [append_only, queryable]
taggable: false
vector_enabled: false
business_rules:
- 只接受固定匿名字段，禁止错误消息、堆栈、账号、设备广告标识或动态诊断编号。
- 同一启动或运行时失败按 canonical identity 幂等追加，不修改历史事实。
- 采集失败不得阻断用户仍可执行的安全恢复动作。
