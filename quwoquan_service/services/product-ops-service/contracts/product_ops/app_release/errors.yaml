errors:
- code: OPS.USER.app_release_query_invalid
  reason: app_release_query_invalid
  http_status: 400
  emitted_by:
  - {surface: http, operations: [GetAppRecoveryVersion]}
  recovery_action: fallback
  disruption_level: inlineCard
  go_const: ErrAppReleaseQueryInvalid
  user_message:
    zh: 版本查询参数无效
    en: The app release query parameters are invalid.
- code: OPS.SYSTEM.app_release_unavailable
  reason: app_release_unavailable
  http_status: 503
  emitted_by:
  - {surface: http, operations: [GetAppRecoveryVersion]}
  recovery_action: fallback
  disruption_level: inlineCard
  go_const: ErrAppReleaseUnavailable
  user_message:
    zh: 版本信息暂不可用
    en: App release information is temporarily unavailable.
