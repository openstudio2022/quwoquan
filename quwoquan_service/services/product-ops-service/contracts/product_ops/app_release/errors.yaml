errors:
- code: OPS.USER.app_release_query_invalid
  kind: VALIDATION
  http_status: 400
  message_key: opsAppReleaseQueryInvalid
  default_message: 版本查询参数无效
  recovery:
    action: use_web
    disruption_level: fullPage
- code: OPS.SYSTEM.app_release_unavailable
  kind: UNAVAILABLE
  http_status: 503
  message_key: opsAppReleaseUnavailable
  default_message: 版本信息暂不可用
  recovery:
    action: use_web
    disruption_level: fullPage
