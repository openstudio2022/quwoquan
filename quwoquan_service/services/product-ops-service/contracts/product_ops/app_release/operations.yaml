api_routes:
- method: GET
  path: /ops/app-recovery/version
  operation: GetAppRecoveryVersion
  actor: none
  application:
    kind: query
    facet: AppReleaseRecoveryQueryFacade
    method: getRecoveryVersion
    reader: AppReleaseRecoveryReader
    slice: AppReleaseRecoveryView
  authorization:
    principal: public
    ownership_policy: public_recovery_read
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 1
    idempotency: none
  request_entity: GetAppRecoveryVersionQuery
  request_body_kind: none
  response_entity: AppReleaseRecoveryView
  response_body_kind: object
  error_codes:
  - OPS.USER.app_release_query_invalid
  - OPS.SYSTEM.app_release_unavailable
  privacy:
    request_classification: PUBLIC
    response_classification: PUBLIC
    log_policy: metadata_only
  telemetry:
    metric: ops_app_recovery_version_query
    trace: true
    attributes: [platform, outcome]
  slo:
    latency_p95_ms: 800
    availability_percent: 99.9
  request_bindings:
    query:
    - name: platform
      field: platform
      required: true
    - name: appVersion
      field: appVersion
      required: true
    - name: buildNumber
      field: buildNumber
      required: true
  description: 按平台读取当前已发布版本；客户端只以 latestBuild 与当前 Build 比较，不从缓存或失败响应推断版本状态。
  security:
    auth_mode: optional
    principal: public
    token_transport: none
    anonymous_policy: allow
    visibility: public
consumers:
- name: app
  capabilities: [get_app_recovery_version]
- name: public-web
  capabilities: [get_app_recovery_version]
contract_test:
  test_strategy:
    service_side:
      description: 使用环境 release 配置验证平台分流、Build 比较与受信 URL，不使用数据库或第三方商店替身。
      scenarios:
      - name: android_official_download
        command: GetAppRecoveryVersion platform=android
        assertions: [official_https_download_page, current_release_build]
      - name: ios_pwa_recovery
        command: GetAppRecoveryVersion platform=ios
        assertions: [empty_update_url, official_pwa_recovery_url, current_release_build]

readiness_cases:
- case_id: get-app-recovery-version-local
  spec_ref: specs/feature-tree/product-ops-growth/product-control-plane-foundation/app-release-recovery-routing/spec.md#gwt-001
  producer: service
  layer: local_contract
  target: {kind: operation, id: GetAppRecoveryVersion}
  runner_source_path: quwoquan_service/services/product-ops-service/tests/local_contract/product_ops/app_release/app_release_recovery__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: get-app-recovery-version-api
  spec_ref: specs/feature-tree/product-ops-growth/product-control-plane-foundation/app-release-recovery-routing/spec.md#gwt-001
  producer: service
  layer: api_integration
  target: {kind: operation, id: GetAppRecoveryVersion}
  runner_source_path: quwoquan_service/services/product-ops-service/tests/api_integration/product_ops/app_release/version_and_download_http__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: app_release_get_app_recovery_version_app_local
  spec_ref: specs/feature-tree/runtime/runtime-client-foundation/cold-start-performance/spec.md#gwt-002
  producer: app
  layer: local_contract
  target: {kind: operation, id: GetAppRecoveryVersion}
  runner_source_path: quwoquan_app/test/local_contract/service/product_ops_service/product_ops/app_release/app_release_recovery__local_contract_test.dart
  executions:
  - {env: alpha, platform: app, device: runner, provider: none, digest_binding: candidate}
