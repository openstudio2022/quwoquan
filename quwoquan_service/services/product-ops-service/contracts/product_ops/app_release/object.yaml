kind: external_reference
description: Android、iOS 与 Web 当前已发布应用版本、最小支持 Build、受信更新/恢复地址和 Android 正式 APK 校验事实的只读发布配置引用；唯一真相源是随环境发布包进入运行态的 product-ops 配置。
identity:
  fields:
  - platform
  version_source: external
access:
  commands: none
  cross_context: public_contract_only
  queries: external_port
relationships: []
search_policy:
  exposed: none
  not_exposed_reason: "目录与发布对象由所属域按版本直接读取，不进入统一检索索引。"
assistant_access:
  read:
    mode: metadata_only
    scopes:
    - assistant.ops.app_release.read
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
business_rules:
- 每个平台同时只有一个 current release，latestBuild 与 minimumSupportedBuild 均为正十进制整数、minimumSupportedBuild 不得大于 latestBuild，Build 只增不减
- Android、iOS 与 Web 必须同时声明受信 updateUrl 与 recoveryUrl；iOS 更新地址只能指向官方 App Store，恢复地址只能属于官方 Web Origin
- Android updateUrl 只能是官方 Web Origin 的 HTTPS 下载端点，APK URL 只能属于官方 CDN 白名单
- Android latest 指针只能在生产签名、包名、Build、证书摘要、文件大小和 SHA-256 全部验证后切换
- updateState 只由当前 Build、minimumSupportedBuild 与 latestBuild 确定：低于 minimum 为 required，低于 latest 为 available，其余为 none
- 发布配置没有在线写路径；版本变更仅由新的环境发布包原子替换，回滚即切回经验证的上一发布包
lifecycle:
  refresh_semantics: replace_only_with_verified_environment_release_package
  tombstone: retain_last_verified_release_until_replaced
external_authority:
  owner: environment_release_package
  identity_contract: platform_build_and_artifact_digest
