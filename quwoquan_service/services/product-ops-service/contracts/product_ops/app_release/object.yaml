kind: external_reference
description: iOS 与 Android 当前已发布应用版本、受信恢复地址和 Android 正式 APK 校验事实的只读发布配置引用；唯一真相源是随环境发布包进入运行态的 product-ops 配置。
identity:
  fields:
  - platform
  version_source: external
access:
  commands: none
  cross_context: public_contract_only
  queries: external_port
relationships: []
capabilities:
- queryable
taggable: false
vector_enabled: false
business_rules:
- 每个平台同时只有一个 current release，Build 为正十进制整数且只增不减
- 公众 iOS 不提供原生更新地址，恢复地址只能是趣我圈官方 PWA；受控 Ad Hoc 地址不得进入公众版本接口
- Android updateUrl 只能是趣我圈官网 HTTPS 下载端点，APK URL 只能属于官方 CDN 白名单
- Android latest 指针只能在生产签名、包名、Build、证书摘要、文件大小和 SHA-256 全部验证后切换
- 发布配置没有在线写路径；版本变更仅由新的环境发布包原子替换，回滚即切回经验证的上一发布包
lifecycle:
  refresh_semantics: replace_only_with_verified_environment_release_package
  tombstone: retain_last_verified_release_until_replaced
external_authority:
  owner: environment_release_package
  identity_contract: platform_build_and_artifact_digest
