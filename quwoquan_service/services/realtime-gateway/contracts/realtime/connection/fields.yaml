description: WebSocket 或 long-poll 连接存续期间的临时会话状态
fields:
  - name: connectionId
    source: connectionId
    type: string
    constraints: [PK]
    classification: INTERNAL
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: accountId
    source: accountId
    type: string
    constraints: [NOT_NULL]
    classification: SENSITIVE
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: personaId
    source: personaId
    type: string
    constraints: [NOT_NULL]
    classification: SENSITIVE
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: deviceId
    source: deviceId
    type: string
    constraints: [NOT_NULL]
    classification: SENSITIVE
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: nodeId
    source: nodeId
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: transport
    source: transport
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: fencingToken
    source: fencingToken
    type: int64
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: lastHeartbeatAt
    source: lastHeartbeatAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: expiresAt
    source: expiresAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
types:
  RealtimeAccountClosureDeadLetterRecoveryRequest:
    description: operator 释放 Realtime 账号安全 terminal marker 的强类型命令；只接受 Redis source PEL 坐标。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: write
      ops_exposure: write
  RealtimeAccountClosureDeadLetterRecoveryAccepted:
    description: Realtime 账号安全 source PEL 已受理重新消费。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - PK
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: recoveryAccepted
      source: recoveryAccepted
      type: bool
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
