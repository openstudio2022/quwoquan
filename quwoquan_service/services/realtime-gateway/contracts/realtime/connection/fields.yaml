description: WebSocket 或 long-poll 连接存续期间的临时会话状态
fields:
  - name: connectionId
    source: connectionId
    type: string
    constraints: [PK]
    classification: INTERNAL
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: accountId
    source: accountId
    type: string
    constraints: [NOT_NULL]
    classification: SENSITIVE
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: personaId
    source: personaId
    type: string
    constraints: [NOT_NULL]
    classification: SENSITIVE
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: deviceId
    source: deviceId
    type: string
    constraints: [NOT_NULL]
    classification: SENSITIVE
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: nodeId
    source: nodeId
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: transport
    source: transport
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: fencingToken
    source: fencingToken
    type: int64
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: lastHeartbeatAt
    source: lastHeartbeatAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
  - name: expiresAt
    source: expiresAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: none
    ops_exposure: read
    role: authoritative_state
types:
  LongPollResponse:
    description: 每个设备独立持久 cursor 的实时事件切片；events 只是投递提示，Chat seq gap 仍由消息同步接口修复。
    fields:
    - name: events
      source: events
      type: '[]RealtimeEventEnvelope'
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: metadata_only
      api_exposure: read
      ops_exposure: none
    - name: nextCursor
      source: nextCursor
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: hash
      api_exposure: read
      ops_exposure: none
    - name: transportResumed
      source: transportResumed
      type: bool
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
  IssueConnectionTicketRequest:
    description: 签发连接票据的唯一请求实体；账号、Persona 与设备身份只从已验签安全上下文注入，不接受客户端输入。
    fields:
    - name: accountId
      source: accountId
      type: string
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: hash
      api_exposure: none
      ops_exposure: drop
    - name: personaId
      source: personaId
      type: string
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: hash
      api_exposure: none
      ops_exposure: drop
    - name: deviceId
      source: deviceId
      type: string
      constraints:
      - NOT_NULL
      classification: SENSITIVE
      log_policy: hash
      api_exposure: none
      ops_exposure: drop
  LongPollRequest:
    description: LongPoll 的唯一客户端 query 实体；cursor 是设备持久的 Redis stream 坐标，timeout 只表示本次 hold 上限。
    fields:
    - name: timeout
      source: timeout
      type: int
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: allow
      api_exposure: write
      ops_exposure: none
    - name: cursor
      source: cursor
      type: string
      constraints:
      - NULLABLE
      classification: INTERNAL
      log_policy: hash
      api_exposure: write
      ops_exposure: none
  RealtimeAccountClosureDeadLetterRecoveryRequest:
    description: operator 释放 Realtime 账号安全 terminal marker 的强类型命令；只接受 Redis source PEL 坐标。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: write
      ops_exposure: write
  RealtimeAccountClosureDeadLetterRecoveryAccepted:
    description: Realtime 账号安全 source PEL 已受理重新消费。
    fields:
    - name: sourceStreamId
      source: sourceStreamId
      type: string
      constraints:
      - PK
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
    - name: recoveryAccepted
      source: recoveryAccepted
      type: bool
      constraints:
      - NOT_NULL
      classification: INTERNAL
      log_policy: allow
      api_exposure: read
      ops_exposure: read
