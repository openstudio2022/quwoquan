kind: runtime_session
description: 'realtime-gateway 连接运行时会话。

  Connection 仅在 WebSocket 连接期间存在，不作为持久化业务聚合。

  可信连接身份由 accountId + personaId + deviceId 三元组构成；RTC 业务路由只使用

  personaId。设备在线状态由独立 PresenceView 对象消费 Connection 生命周期维护。

  realtime-gateway 作为平台级基础设施，不属于任何业务域，独立部署。

  '
identity:
  fields:
  - connectionId
  version_source: session
access:
  commands: session_facade
  queries: named_reader
  cross_context: public_contract_only
relationships:
  - name: account
    target_object: user.UserAccount
    reference_fields: [accountId]
    kind: reference
    cardinality: N:1
    consistency: runtime
    access: named_reader
    on_delete: retain
  - name: persona
    target_object: user.Persona
    reference_fields: [personaId]
    kind: reference
    cardinality: N:1
    consistency: runtime
    access: named_reader
    on_delete: retain
  - name: device
    target_object: user.DeviceRegistration
    reference_fields: [deviceId]
    kind: reference
    cardinality: N:1
    consistency: runtime
    access: named_reader
    on_delete: detach
local_identity_reasons:
  nodeId: 运行节点路由标识，不是业务对象引用
search_policy:
  exposed: none
  not_exposed_reason: "易失运行时状态，过期即消失，没有可供检索的稳定对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "易失运行时传输状态对小趣没有可用语义，读取只会产生不可复现的上下文。"
business_rules:
- connectionId 只在一次已验签 WebSocket 连接中有效，断开后不得复用或续期。
- accountId、personaId 与 deviceId 必须来自同一可信 principal，客户端 payload 不得覆盖。
- 业务消息只路由 typed channel，不在 Connection 保存业务聚合或通知可靠任务状态。
lifecycle:
  ttl_seconds: 120
  expiry_semantics: disconnect_or_heartbeat_timeout_delete
  renewal: authenticated_heartbeat_only
