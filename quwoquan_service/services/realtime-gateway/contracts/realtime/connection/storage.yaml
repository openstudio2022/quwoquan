backend: redis
description: 'realtime-gateway Connection 会话状态全部存储在 Redis（realtime scene）。

  Connection 实体存在于进程内存中（Hub map），不持久化。

  '
redis_cache:
- key: rt:ticket:{ticket}
  ttl_seconds: 30
  type: string
  scene: realtime
  description: '短期一次性连接 ticket。value = JSON{accountId, personaId, deviceId, issuedAt}。

    签发时 SET NX EX 30 写入；WS/LongPoll 升级时 GETDEL 一次性消费，

    不存在=invalid、已消费=replayed、超 TTL 自动过期=expired。

    '
- key: rt:account:tickets:{accountId}
  ttl_seconds: 30
  type: set
  scene: realtime
  description: '账户待消费 ticket 索引。签发时追加 ticket，消费/终态时删除；UserAccountClosed
    与 UserSuspended 必须先清除该集合关联 ticket，再允许事件 ACK。

    '
- key: rt:account:security:{accountId}
  ttl_seconds: 0
  type: string
  scene: realtime
  description: '账户安全 admission fence。value = JSON{accountState,authEpoch,updatedAt}；
    closed 不可逆，suspended/active 仅允许更高 authEpoch 推进。连接登记前后均读取该值，
    以阻断终态事件与重连并发。

    '
- key: rt:account:sessions:{accountId}
  ttl_seconds: 0
  type: set
  scene: realtime
  description: 账户当前连接 ID 索引；终态事件据此清除 lease、presence 和本地连接。
- key: rt:account:session:{accountId}:{connId}
  ttl_seconds: 0
  type: string
  scene: realtime
  description: '账户连接清理记录。当前 schema 的 value = JSON{accountId,personaId,deviceId,
    connectionId,fence}；fence 是该会话 Acquire 时捕获的 token，终态回收必须将它传给
    lease compare-and-delete，不得先读取当前 lease value 再释放。迁移前缺 fence 的有界旧格式
    记录只能删除其明确命名的旧式 rt:conn:lease:{personaId}:{deviceId}:{connId} key，不得伪造
    token 或触碰 digest-based 新 lease；随后继续撤销 presence 并删除 session record/index。无法
    解析或 identity 不一致时 fail-closed，保留记录供同一 durable event 重试/recovery 收敛。
    该记录仅用于终态会话回收，不对 API 或日志暴露。

    '
- key: rt:account:security-events:{accountId}
  ttl_seconds: 2592000
  type: set
  scene: realtime
  description: UserAccount security eventId 的不可逆摘要去重集合。
- key: rt:account:security-failure:{digest}
  ttl_seconds: 2592000
  type: string
  scene: realtime
  description: durable security consumer 的 source stream/message reference、失败次数、
    事件/错误摘要和 DLQ 状态；不得保存原始 payload 或账户标识。ttl_seconds 只约束普通重试，
    terminal marker 必须无 TTL 持有原 source PEL，直到受控 recovery。
- key: rt:conn:lease:{identitySlot}:lease:{connectionDigest}
  key_prefix: 'rt:conn:lease:'
  ttl_seconds: 120
  type: string
  scene: realtime
  hash_tag: identitySlot
  atomic_keys:
  - rt:conn:fence:{identitySlot}
  - rt:conn:lease:{identitySlot}:lease:{connectionDigest}
  fence: token_value
  eviction_consequence: fail_closed
  durability: ephemeral
  description: '连接租约（lease + fencing）。identitySlot = SHA-256(personaId + NUL + deviceId)，
    connectionDigest = SHA-256(connectionId)；key 不暴露原始 identity，两个 key 通过同一
    {identitySlot} 落入 Redis Cluster 同 slot。value = fencing token + SHA-256(connectionId)
    owner digest；token 与 owner 必须同时匹配，防止 authority 异常丢失后相同数字令旧 lease ABA。
    Acquire 用单个 Lua 原子执行 fence INCR/PERSIST 与 lease SET PX；Renew 只在
    non-expiring fence authority 等于 expected token，且 lease token/owner 同时匹配并存在时
    PEXPIRE；Release 只在上述三者都匹配时 compare-and-delete。任一权威丢失、失配或 lease
    过期都 fail-closed，旧连接绝不续租或删除新状态；若 authority 丢失但同 connection key
    的 lease 仍存活，Acquire 也 fail-closed，避免覆盖未知 owner。节点崩溃后 lease 按 TTL 自动
    出清。恢复来源：lease 本身 ephemeral 且不需要恢复——被 eviction 或丢失后，持有该连接的
    网关节点下一次 Renew fail-closed 并主动断开，客户端按 realtime 重连协议重新 Acquire，
    新代际 token 由 aof 持久的 rt:conn:fence 权威签发；不存在从 lease 残留反推当前代际的路径。

    '
- key: rt:conn:fence:{identitySlot}
  key_prefix: 'rt:conn:fence:'
  ttl_seconds: 0
  type: string
  scene: realtime
  hash_tag: identitySlot
  atomic_keys:
  - rt:conn:fence:{identitySlot}
  - rt:conn:lease:{identitySlot}:lease:{connectionDigest}
  fence: current_counter
  eviction_consequence: fail_closed
  durability: aof
  description: '每 persona/device 的受控持久 fencing authority。identitySlot 使用与 lease
    相同的脱敏摘要和 hash tag；只由 Acquire Lua 原子 INCR，并以 PERSIST 清除迁移前遗留
    TTL。authority 无 TTL，必须绑定 AOF/复制且不允许 eviction；这是已经签发 token 不再复用
    的唯一恢复依据。authority 丢失或与 expected token 不符时 Renew/Release 均 fail-closed，
    服务不得仅凭残留 lease 合成当前代际或继续 presence 写入；在受控 Redis 恢复 authority
    前，该 identity 的新 Acquire 不具备跨数据丢失的不复用证明，因此 production admission
    必须由 binding/readiness 阻断。

    '
- key: rt:account:security-relay
  type: pubsub_channel
  scene: realtime
  description: 已持久化账户终态的跨节点即时踢出通知；admission 真相仍是 rt:account:security。
role: runtime
