commercial_defaults:
  status: blocked
  block_reason: gamma full cold-start and websocket runtime evidence blocked by missing controlled product
    telemetry SLS credential
  gap_id: REALTIME_CONNECTION_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
privacy_contract:
  user_account_closed_consumer:
    source_event_contract: user.UserAccountClosed
    failure_persistence: irreversible_event_and_error_digests_only
    dead_letter_retained:
    - dead_letter_id
    - source_stream
    - source_stream_id
    - event_class
    - irreversible_event_digest
    - irreversible_content_digest
    - attempt
    - controlled_error_class
    - irreversible_error_digest
    - dead_lettered_at
    dead_letter_prohibited:
    - account_id
    - user_id
    - persona_ids
    - raw_payload
    - raw_error
    recovery: source_stream_pending_reference_only
    logs: digest_only
  user_account_enforcement_consumer:
    source_event_contract: user.UserSuspended
    restore_event_contract: user.UserRestored
    failure_persistence: irreversible_event_and_error_digests_only
    dead_letter_retained:
    - dead_letter_id
    - source_stream
    - source_stream_id
    - event_class
    - irreversible_event_digest
    - irreversible_content_digest
    - attempt
    - controlled_error_class
    - irreversible_error_digest
    - dead_lettered_at
    dead_letter_prohibited:
    - account_id
    - user_id
    - persona_ids
    - raw_payload
    - raw_error
    recovery: source_stream_pending_reference_only
    logs: digest_only
description: 统一实时通信网关（WebSocket + Long-polling），平台级基础设施
externalDependencies:
- role: use
  capability: runtime.message.transport
  port: MessageTransportPort
  operations: [consumeDurable]
  scenes: [realtime]
api_routes:
- method: POST
  path: /realtime/tickets
  operation: IssueConnectionTicket
  actor: persona
  application:
    kind: session
    facet: ConnectionSessionFacet
    method: issueTicket
    session_owner: Connection
  description: 签发绑定可信 accountId+personaId+deviceId 的短期一次性连接 ticket（WS 升级 query 只携带 ticket）
  request_entity: IssueConnectionTicketRequest
  request_body_kind: none
  request_bindings:
    injected:
    - {name: authenticatedAccountId, field: accountId}
    - {name: authenticatedPersonaId, field: personaId}
    - {name: authenticatedDeviceId, field: deviceId}
  response_entity: ConnectionTicket
  response_body: ConnectionTicket
  response_body_kind: object
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: none
    max_attempts: 1
    idempotency: none
  error_codes:
  - REALTIME.USER.unauthorized
  - REALTIME.USER.rate_limited
  - REALTIME.SYSTEM.account_security_authority_unavailable
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: realtime_connection_ticket
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
  slo:
    latency_p95_ms: 200
    availability_percent: 99.9
  authorization:
    principal: account
    ownership_policy: ticket_self
  security:
    auth_mode: required
    principal: account
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: GET
  path: /realtime/ws
  operation: WebSocketUpgrade
  actor: persona
  application:
    kind: session
    facet: ConnectionSessionFacet
    method: openWebSocket
    session_owner: Connection
  description: WebSocket Upgrade（query 携带一次性 ticket；服务端消费 ticket 派生可信身份后下发 auth_ack）
  request_bindings:
    query:
    - name: ticket
      field: ticket
      required: true
  error_codes:
  - REALTIME.USER.ticket_invalid
  - REALTIME.USER.ticket_replayed
  - REALTIME.SYSTEM.account_security_authority_unavailable
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: realtime_connection_session
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
    - transport
  slo:
    latency_p95_ms: 300
    availability_percent: 99.9
  authorization:
    principal: account
    ownership_policy: ticket_self
  reliability:
    timeout_ms: 1000
    cancellation: supported
    retry_mode: none
    max_attempts: 1
    idempotency: none
  security:
    auth_mode: required
    principal: account
    token_transport: query_ticket
    anonymous_policy: deny
    visibility: private
- method: GET
  path: /realtime/poll
  operation: LongPoll
  actor: persona
  application:
    kind: query
    facet: ConnectionQueryFacet
    method: longPoll
    reader: ConnectionEventReader
    slice: ConnectionEventBatchSlice
  description: Long-polling 兜底端点（标准 Bearer 鉴权；按可信 accountId 派生 durable stream，cursor 为空从保留窗口起点读取；返回 nextCursor 与 transportResumed，Chat seq gap 由消息同步接口修复）
  response_entity: LongPollResponse
  response_body: LongPollResponse
  response_body_kind: object
  request_bindings:
    query:
    - name: timeout
      field: timeout
      required: false
    - name: cursor
      field: cursor
      required: false
  error_codes:
  - REALTIME.USER.invalid_argument
  - REALTIME.USER.unauthorized
  - REALTIME.SYSTEM.account_security_authority_unavailable
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: realtime_connection_session
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
    - transport
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: account
    ownership_policy: connection_self
  reliability:
    timeout_ms: 30000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  security:
    auth_mode: required
    principal: account
    token_transport: bearer
    anonymous_policy: deny
    visibility: private
- method: GET
  path: /internal/realtime/personas/{personaId}/presence
  operation: GetPersonaPresence
  actor: none
  application:
    kind: query
    facet: PresenceViewQueryFacet
    method: getPersonaPresence
    reader: PresenceViewReader
    slice: PresenceView
  description: notification-service 按 persona 读取当前仍有有效 heartbeat 的设备级在线投影；读取时逐 field 清理陈旧项
  request_bindings:
    path:
    - name: personaId
      field: personaId
  response_body: PresenceView
  response_body_kind: object
  authorization:
    principal: service
    scopes:
    - realtime.presence.read
    ownership_policy: notification_incoming_call_coordinator
  commercial:
    status: ready
  reliability:
    timeout_ms: 500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: realtime_presence_view_device_count
    trace: true
    attributes:
    - operation
    - outcome
  slo:
    latency_p95_ms: 100
    availability_percent: 99.95
  security:
    auth_mode: required
    principal: service
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
- method: GET
  path: /config/realtime
  operation: GetRealtimeConfig
  actor: none
  application:
    kind: query
    facet: RealtimeConfigQueryFacet
    method: getRealtimeConfig
    reader: RealtimeConfigReader
    slice: RealtimeConfigSlice
  description: 获取自适应传输系统配置参数（运维可热更新）
  authorization:
    principal: public
    ownership_policy: public_read
  commercial:
    status: ready
  reliability:
    timeout_ms: 500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: PUBLIC
    response_classification: PUBLIC
    log_policy: none
  telemetry:
    metric: realtime_config_read
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
  slo:
    latency_p95_ms: 100
    availability_percent: 99.95
  security:
    auth_mode: public
    principal: public
    token_transport: none
    anonymous_policy: allow
    visibility: public
- method: GET
  path: /healthz
  operation: HealthCheck
  actor: none
  application:
    kind: query
    facet: RuntimeHealthQueryFacet
    method: healthCheck
    reader: HealthStatusReader
    slice: HealthStatusSlice
  description: 健康检查
  authorization:
    principal: public
    ownership_policy: internal_probe
  commercial:
    status: ready
  reliability:
    timeout_ms: 500
    cancellation: supported
    retry_mode: none
    max_attempts: 1
    idempotency: none
  error_codes:
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: none
  telemetry:
    metric: realtime_health_probe
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
  slo:
    latency_p95_ms: 100
    availability_percent: 99.99
  security:
    auth_mode: public
    principal: public
    token_transport: none
    anonymous_policy: allow
    visibility: internal
- method: GET
  path: /readyz
  operation: ReadinessCheck
  actor: none
  application:
    kind: query
    facet: RuntimeHealthQueryFacet
    method: readinessCheck
    reader: HealthStatusReader
    slice: HealthStatusSlice
  description: 检查账户安全 authority、Redis 和 UserAccount security durable consumer 是否可接收流量
  authorization:
    principal: public
    ownership_policy: internal_probe
  commercial:
    status: ready
  reliability:
    timeout_ms: 1000
    cancellation: supported
    retry_mode: none
    max_attempts: 1
    idempotency: none
  error_codes:
  - REALTIME.SYSTEM.readiness_unavailable
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: none
  telemetry:
    metric: realtime_readiness_probe
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
  slo:
    latency_p95_ms: 500
    availability_percent: 99.95
  security:
    auth_mode: public
    principal: public
    token_transport: none
    anonymous_policy: allow
    visibility: internal
- method: GET
  path: /metrics
  operation: Metrics
  actor: none
  application:
    kind: query
    facet: RuntimeMetricsQueryFacet
    method: metrics
    reader: RuntimeMetricsReader
    slice: RuntimeMetricsSlice
  description: Prometheus 指标端点
  authorization:
    principal: public
    ownership_policy: internal_probe
  commercial:
    status: ready
  reliability:
    timeout_ms: 1000
    cancellation: supported
    retry_mode: none
    max_attempts: 1
    idempotency: none
  error_codes:
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: none
  telemetry:
    metric: realtime_metrics_probe
    trace: true
    attributes:
    - operation
    - outcome
    - error_code
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  security:
    auth_mode: public
    principal: public
    token_transport: none
    anonymous_policy: allow
    visibility: internal
- method: POST
  path: /internal/realtime/account-closure/dead-letters:recover
  operation: RecoverRealtimeAccountClosureDeadLetter
  actor: none
  application:
    kind: session
    facet: ConnectionAccountClosureRecoveryFacet
    method: recoverAccountClosureDeadLetter
    session_owner: Connection
  authorization:
    principal: operator
    scopes:
    - ops.account_closure.write
    permissions:
    - realtime.account_closure.recover
    ownership_policy: service_owned_projection_delivery
  commercial:
    status: ready
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - REALTIME.USER.invalid_argument
  - REALTIME.USER.unauthorized
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: realtime_account_closure_dead_letter_recover
    trace: true
    attributes:
    - outcome
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  request_entity: RealtimeAccountClosureDeadLetterRecoveryRequest
  response_entity: RealtimeAccountClosureDeadLetterRecoveryAccepted
  success_status: 202
  security:
    auth_mode: required
    principal: operator
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
  description: operator 只释放 Realtime 自有 terminal marker，使原 events.user.account PEL 重新进入有限重试；禁止从脱敏 DLQ 重建 payload。
consumers:
- name: app
  capabilities:
  - issue_ticket
  - websocket_connect
  - long_poll
  - get_config
- name: chat-service
  capabilities: []
  description: chat-service 通过 Redis Pub/Sub 推送消息，不直接调用 API
- name: notification-service
  capabilities: []
  description: realtime-gateway 通过事件通知离线推送
