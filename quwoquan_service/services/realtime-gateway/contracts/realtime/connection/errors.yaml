domain: REALTIME
aggregate: Connection
description: 'realtime 域结构化错误码声明。格式：MODULE.KIND.REASON。

  codegen 从本文件生成 Dart RealtimeErrorCode enum + RealtimeErrorMessages，

  以及 Go errors.go 常量。ticket 二态（invalid/replayed）：TTL 过期与伪造

  在存储上均表现为键不存在，统一归并 invalid；已消费标记命中为 replayed。

  '
errors:
- code: REALTIME.USER.invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - {surface: http, operations: [LongPoll, RecoverRealtimeAccountClosureDeadLetter]}
  recovery_action: surface
  dart_const: invalidArgument
  go_const: ErrInvalidArgument
  user_message:
    zh: 实时操作请求格式无效
    en: Invalid realtime operation request
- code: REALTIME.USER.unauthorized
  kind: USER
  reason: unauthorized
  http_status: 401
  emitted_by:
  - {surface: http, operations: [IssueConnectionTicket, LongPoll, RecoverRealtimeAccountClosureDeadLetter]}
  recovery_action: surface
  dart_const: unauthorized
  go_const: ErrUnauthorized
  user_message:
    zh: 请先登录
    en: Please sign in
- code: REALTIME.USER.ticket_invalid
  kind: USER
  reason: unauthorized
  http_status: 401
  emitted_by:
  - {surface: http, operations: [WebSocketUpgrade]}
  recovery_action: retry
  recovery_after_seconds: 1
  dart_const: ticketInvalid
  go_const: ErrTicketInvalid
  user_message:
    zh: 实时连接凭据无效，正在重新连接
    en: Realtime credential invalid, reconnecting
- code: REALTIME.USER.ticket_replayed
  kind: USER
  reason: unauthorized
  http_status: 401
  emitted_by:
  - {surface: http, operations: [WebSocketUpgrade]}
  recovery_action: retry
  recovery_after_seconds: 1
  dart_const: ticketReplayed
  go_const: ErrTicketReplayed
  user_message:
    zh: 实时连接凭据已被使用，正在重新连接
    en: Realtime credential already used, reconnecting
- code: REALTIME.USER.rate_limited
  kind: USER
  reason: rate_limited
  http_status: 429
  emitted_by:
  - {surface: http, operations: [IssueConnectionTicket]}
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: rateLimited
  go_const: ErrRateLimited
  user_message:
    zh: 操作太频繁，请稍后重试
    en: Too many requests, please wait
- code: REALTIME.SYSTEM.account_security_authority_unavailable
  kind: SYSTEM
  reason: dependency_unavailable
  http_status: 503
  emitted_by:
  - {surface: http, operations: [IssueConnectionTicket, WebSocketUpgrade, LongPoll]}
  recovery_action: retry
  recovery_after_seconds: 1
  dart_const: accountSecurityAuthorityUnavailable
  go_const: ErrAccountSecurityAuthorityUnavailable
  user_message:
    zh: 账户安全校验暂不可用，请稍后重试
    en: Account security verification is temporarily unavailable
- code: REALTIME.SYSTEM.internal_error
  kind: SYSTEM
  reason: internal_error
  http_status: 500
  emitted_by:
  - {surface: http, operations: [IssueConnectionTicket, WebSocketUpgrade, LongPoll, realtime.presence_view.GetPersonaPresence, GetRealtimeConfig, HealthCheck, Metrics, RecoverRealtimeAccountClosureDeadLetter]}
  recovery_action: retry
  recovery_after_seconds: 3
  dart_const: internalError
  go_const: ErrInternalError
  user_message:
    zh: 实时服务异常，请稍后重试
    en: Realtime service error, please try again
- code: REALTIME.SYSTEM.readiness_unavailable
  kind: SYSTEM
  reason: dependency_unavailable
  http_status: 503
  emitted_by:
  - {surface: http, operations: [ReadinessCheck]}
  recovery_action: retry
  recovery_after_seconds: 1
  dart_const: readinessUnavailable
  go_const: ErrReadinessUnavailable
  user_message:
    zh: 实时服务尚未就绪，请稍后重试
    en: Realtime service is not ready, please try again
