description: PresenceView 只由可信 Connection 与账号关闭事件投影，并由内部 named reader 查询。
api_routes:
- method: GET
  path: /internal/realtime/personas/{personaId}/presence
  operation: GetPersonaPresence
  actor: none
  application:
    kind: query
    facet: PresenceViewQueryFacet
    method: getPersonaPresence
    reader: PresenceViewReader
    slice: PresenceView
  description: notification-service 按 persona 读取仍有有效 heartbeat 的设备投影；读取时以原子 compare-and-delete 逐 field 清理陈旧项。
  request_bindings:
    path:
    - name: personaId
      field: personaId
  response_body: PresenceView
  response_body_kind: object
  authorization:
    principal: service
    scopes:
    - realtime.presence.read
    ownership_policy: notification_incoming_call_coordinator
  commercial:
    status: ready
  reliability:
    timeout_ms: 500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: realtime_presence_view_device_count
    trace: true
    attributes:
    - operation
    - outcome
  slo:
    latency_p95_ms: 100
    availability_percent: 99.95
  security:
    auth_mode: required
    principal: service
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
runtime_entrypoints:
- name: ProjectPresence
  kind: projector
  phase: event_projection
  source_events:
  - realtime.ConnectionOpened
  - realtime.ConnectionHeartbeatObserved
  - realtime.ConnectionClosed
  - user.UserAccountClosed
  checkpoint: realtime_connection_event_sequence
  rebuild: replay_connection_journal_with_current_ttl_boundary
  tombstone: delete_presence_keep_checkpoint
  idempotency: aggregate_version
  application:
    kind: command
    facet: PresenceViewProjector
    method: apply
    object_owner: PresenceView
