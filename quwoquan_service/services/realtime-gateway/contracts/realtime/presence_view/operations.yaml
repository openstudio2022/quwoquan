description: PresenceView 只由可信 Connection 与账号关闭事件投影，并由内部 named reader 查询。
api_routes:
- method: GET
  path: /internal/realtime/personas/{personaId}/presence
  operation: GetPersonaPresence
  actor: none
  application:
    kind: query
    facet: PresenceViewQueryFacet
    method: getPersonaPresence
    reader: PresenceViewReader
    slice: PresenceView
  description: notification-service 按 persona 读取仍有有效 heartbeat 的设备投影；读取时以原子 compare-and-delete 逐 field 清理陈旧项。
  request_bindings:
    path:
    - name: personaId
      field: personaId
  response_body: PresenceView
  response_body_kind: object
  authorization:
    principal: service
    scopes:
    - realtime.presence.read
    ownership_policy: notification_incoming_call_coordinator
  commercial:
    status: ready
  reliability:
    timeout_ms: 500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - REALTIME.SYSTEM.internal_error
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: realtime_presence_view_device_count
    trace: true
    attributes:
    - operation
    - outcome
  slo:
    latency_p95_ms: 100
    availability_percent: 99.95
  security:
    auth_mode: required
    principal: service
    token_transport: bearer
    anonymous_policy: deny
    visibility: internal
readiness_cases:
- case_id: get-persona-presence-local
  spec_ref: specs/feature-tree/gateway-orchestrator-foundation/realtime-gateway/realtime-channel-delivery/spec.md#gwt-002
  producer: service
  layer: local_contract
  target: {kind: operation, id: GetPersonaPresence}
  runner_source_path: quwoquan_service/services/realtime-gateway/tests/local_contract/realtime/presence_view/projection_store__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: get-persona-presence-api
  spec_ref: specs/feature-tree/gateway-orchestrator-foundation/realtime-gateway/realtime-channel-delivery/spec.md#gwt-002
  producer: service
  layer: api_integration
  target: {kind: operation, id: GetPersonaPresence}
  runner_source_path: quwoquan_service/services/realtime-gateway/tests/api_integration/realtime/presence_view/query_projection__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: redis, digest_binding: candidate}
