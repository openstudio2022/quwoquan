description: realtime-gateway 自治运行配置；环境只维护差异和 secret reference。
configs:
- key: sys.realtime-gateway.service.http.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: :18090
- key: sys.realtime-gateway.redis.realtime.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.realtime-gateway.redis.realtime.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: redis:6379
- key: sys.realtime-gateway.redis.realtime.addrs
  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: []
- key: sys.realtime-gateway.redis.realtime.password
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.realtime-gateway.user_account_security_authority.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.realtime-gateway.user_account_security_authority.timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
