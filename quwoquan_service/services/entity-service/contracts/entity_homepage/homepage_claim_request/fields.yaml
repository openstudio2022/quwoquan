description: 共享主页认领申请及其审核状态
fields:
  - name: claimRequestId
    source: _id
    type: ObjectId
    constraints:
      - PK
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: version
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: homepageId
    type: ObjectId
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: requesterPersonaId
    type: string
    constraints:
      - NOT_NULL
    classification: PRIVATE
    log_policy: hash
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: claimTier
    type: enum
    enum_ref: HomepageClaimTier
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: businessLicenseUrl
    type: string
    constraints:
      - NULLABLE
    classification: SENSITIVE
    log_policy: drop
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
    description: 可选的营业执照材料地址；仅允许无用户信息的绝对 HTTPS URL。
  - name: contactPhone
    type: string
    constraints:
      - NULLABLE
    classification: PII
    log_policy: mask
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: identityCardFrontUrl
    type: string
    constraints:
      - NULLABLE
    classification: SENSITIVE
    log_policy: drop
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
    description: 可选的身份证正面材料地址；仅允许无用户信息的绝对 HTTPS URL。
  - name: identityCardBackUrl
    type: string
    constraints:
      - NULLABLE
    classification: SENSITIVE
    log_policy: drop
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
    description: 可选的身份证反面材料地址；仅允许无用户信息的绝对 HTTPS URL。
  - name: note
    type: string
    constraints:
      - NULLABLE
    classification: PRIVATE
    log_policy: mask
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: status
    type: enum
    enum_ref: HomepageClaimReviewStatus
    constraints:
      - NOT_NULL
      - DEFAULT_PENDING_REVIEW
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    role: authoritative_state
  - name: reviewerAccountId
    type: string
    constraints:
      - NULLABLE
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: reviewNote
    type: string
    constraints:
      - NULLABLE
    classification: PRIVATE
    log_policy: mask
    api_exposure: read
    ops_exposure: read_write
    role: authoritative_state
  - name: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: reviewedAt
    type: timestamp
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
types:
  HomepageClaimRequestView:
    fields:
      - {name: claimRequestId, type: string, constraints: [NOT_BLANK]}
      - {name: homepageId, type: string, constraints: [NOT_BLANK]}
      - {name: requesterPersonaId, type: string, constraints: [NOT_BLANK]}
      - {name: claimTier, type: enum, enum_ref: HomepageClaimTier, constraints: [NOT_NULL]}
      - {name: status, type: enum, enum_ref: HomepageClaimReviewStatus, constraints: [NOT_NULL]}
      - {name: reviewNote, type: string, constraints: [NULLABLE]}
      - {name: createdAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: reviewedAt, type: timestamp, constraints: [NULLABLE]}
  ReviewHomepageClaimRequestCommand:
    fields:
      - name: homepageId
        type: string
        constraints:
          - NOT_BLANK
      - name: claimRequestId
        type: string
        constraints:
          - NOT_BLANK
      - name: status
        type: enum
        enum_ref: HomepageClaimReviewStatus
        constraints:
          - NOT_NULL
      - name: reviewNote
        type: string
        constraints:
          - NULLABLE
  CreateHomepageClaimRequestCommand:
    fields:
      - name: homepageId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: claimTier
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: businessLicenseUrl
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: contactPhone
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: identityCardFrontUrl
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: identityCardBackUrl
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: note
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
