backend: mongodb
collections:
  homepage_claim_requests:
    publication_role: not_published
    entity: HomepageClaimRequest
    role: authoritative
    indexes:
    - name: idx_claim_requests_homepage_status
      keys:
        homepageId: 1
        status: 1
        createdAt: -1
    - name: idx_claim_requests_requester
      keys:
        requesterPersonaId: 1
        createdAt: -1
    - name: idx_claim_requests_pending_unique
      keys:
        homepageId: 1
        requesterPersonaId: 1
      unique: true
      partial_filter:
        status: pending_review
      description: 同一 persona 对同一 homepage 仅一条待审核申请
    - name: idx_claim_requests_version
      keys:
        _id: 1
        version: 1
      unique: true
      description: HomepageClaimRequest CAS commit predicate
  homepage_claim_request_command_receipts:
    publication_role: not_published
    entity: HomepageClaimRequest
    description: HomepageClaimRequest command 幂等回执；与聚合版本和 outbox 在同一 Mongo transaction 提交。
    indexes:
    - name: idx_claim_request_receipts_aggregate
      keys:
        aggregateId: 1
        aggregateVersion: -1
    - name: idx_claim_request_receipts_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  homepage_claim_request_outbox:
    publication_role: transactional_outbox
    entity: HomepageClaimRequest
    description: 认领申请领域事实 outbox；审核 approved 由 Homepage 投影消费者幂等推进认领态。
    indexes:
    - name: idx_claim_request_outbox_replay
      keys:
        occurredAt: 1
        _id: 1
    - name: idx_claim_request_outbox_aggregate_version
      keys:
        aggregateId: 1
        aggregateVersion: 1
      unique: true
  homepage_claim_request_projection_checkpoints:
    publication_role: publication_accessory
    entity: HomepageClaimRequest
    role: projection
    indexes:
    - name: idx_claim_request_checkpoint_consumer
      keys:
        _id: 1
      unique: true
transaction:
  scope:
  - homepage_claim_requests
  - homepage_claim_request_command_receipts
  - homepage_claim_request_outbox
  isolation: mongo_transaction
  guarantees:
  - version_cas
  - idempotency_digest
  - aggregate_and_outbox_atomic_commit
role: authoritative
