description: HomepageClaimRequest 对象命令操作包。
api_routes:
  - method: GET
    path: /homepage-claim-requests
    operation: ListHomepageClaimRequests
    actor: account
    commercial:
      status: ready
    application:
      kind: query
      facet: HomepageClaimQueryFacade
      method: listQueue
      reader: HomepageClaimQueueReader
      slice: HomepageClaimRequestSlice
    authorization:
      principal: operator
      ownership_policy: entity_governance_operator
      scopes: [ops.case.read]
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes:
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.permission_denied
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: redacted
    telemetry:
      metric: entity_homepage_claim_queue
      trace: true
      attributes:
        - status
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: Ops Portal 查询主页认领治理队列
    request_bindings:
      query:
        - {name: homepageId, field: homepageId, required: false}
        - {name: status, field: status, required: false}
        - {name: cursor, field: cursor, required: false}
        - {name: limit, field: limit, required: false}
    response_entity: HomepageClaimRequest
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: POST
    path: /homepages/{homepageId}/claim-requests
    operation: CreateHomepageClaimRequest
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: HomepageClaimCommandFacade
      method: create
      aggregate_owner: HomepageClaimRequest
      mutation_target: HomepageClaimRequest
      invariant_target: HomepageClaimRequest
    authorization:
      principal: persona
      ownership_policy: author_self
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.homepage_not_found
      - ENTITY.USER.homepage_offline
      - ENTITY.USER.claim_material_missing
      - ENTITY.USER.already_claimed
      - ENTITY.USER.duplicate_pending_claim
      - ENTITY.USER.invalid_claim_material_url
      - ENTITY.USER.permission_denied
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: SENSITIVE
      response_classification: SENSITIVE
      log_policy: redacted
    telemetry:
      metric: entity_homepage_claim_create
      trace: true
      attributes:
        - homepage_id
        - claim_tier
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_bindings:
      path:
        - name: homepageId
          field: homepageId
    description: 发起主页认领申请；同一 persona 对同一主页仅允许一条 pending_review 申请
    request_entity: CreateHomepageClaimRequestCommand
    response_entity: HomepageClaimRequestView
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: POST
    path: /homepages/{homepageId}/claim-requests/{claimRequestId}:review
    operation: ReviewHomepageClaimRequest
    commercial:
      status: ready
    actor: account
    application:
      kind: command
      facet: HomepageClaimCommandFacade
      method: review
      aggregate_owner: HomepageClaimRequest
      mutation_target: HomepageClaimRequest
      invariant_target: HomepageClaimRequest
    authorization:
      principal: operator
      ownership_policy: entity_governance_operator
      scopes: [ops.case.write]
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.claim_not_found
      - ENTITY.USER.permission_denied
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.version_conflict
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_claim_review
      trace: true
      attributes:
        - homepage_id
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_bindings:
      path:
        - {name: homepageId, field: homepageId}
        - {name: claimRequestId, field: claimRequestId}
    description: 审核主页认领申请；治理动作，仅 platform-ops 消费；approved 经 HomepageClaimReviewed 事件幂等推进 Homepage 认领态
    request_entity: ReviewHomepageClaimRequestCommand
    request_body_kind: object
    response_entity: HomepageClaimRequest
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
consumers:
  - name: app
    capabilities:
      - create_homepage_claim_request
  - name: platform-ops
    capabilities:
      - list_homepage_claim_requests
      - review_homepage_claim_request
