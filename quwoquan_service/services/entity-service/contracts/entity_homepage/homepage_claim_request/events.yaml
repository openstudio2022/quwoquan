events:
- name: HomepageClaimRequested
  delivery_semantics: transactional_outbox
  wire_event_type: HomepageClaimRequested
  payload_entity: HomepageClaimRequest
  payload_fields:
  - claimRequestId
  - homepageId
  - requesterPersonaId
  - claimTier
  - status
  - createdAt
  - version
- name: HomepageClaimReviewed
  delivery_semantics: transactional_outbox
  wire_event_type: HomepageClaimReviewed
  payload_entity: HomepageClaimRequest
  payload_fields:
  - claimRequestId
  - homepageId
  - status
  - reviewerAccountId
  - reviewedAt
  - version
