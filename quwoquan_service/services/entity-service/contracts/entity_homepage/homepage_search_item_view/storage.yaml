backend: elasticsearch
description: >-
  HomepageSearchItemView 以稳定 entity.homepage:homepageId 作为 Elasticsearch _id，并由
  sourceVersion external versioning 在 Elasticsearch shard 内原子裁决；严格更高版本才生效，
  同版本 replay 与低版本均为 no-op。删除写入持久 soft tombstone，查询排除 deleted=true。
  Mongo homepage_search_item_versions 仅是投影消费进度/checkpoint，单调记录已观察版本，
  不参与 Elasticsearch 写前仲裁。
resources:
  homepage_search_documents:
    engine: elasticsearch
    role: query_projection
    required: true
  source_version_checkpoint:
    engine: mongodb
    role: query_projection
    required: true
role: projection
collections:
  homepage_search_item_versions:
    entity: HomepageSearchItemViewCheckpoint
    role: checkpoint
    description: Homepage 公开事件投影到 Elasticsearch 后的单调 sourceVersion 与 tombstone 水位。
    indexes:
      - name: idx_homepage_search_item_source_version
        keys: {sourceVersion: 1}
