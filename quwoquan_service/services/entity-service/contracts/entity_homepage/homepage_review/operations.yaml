description: HomepageReview 对象专属 command/query packet。
api_routes:
  - method: POST
    path: /homepages/{homepageId}/reviews
    operation: CreateHomepageReview
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: HomepageReviewCommandFacade
      method: create
      aggregate_owner: HomepageReview
      mutation_target: HomepageReview
      invariant_target: HomepageReview
    authorization:
      principal: persona
      ownership_policy: author_self
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.homepage_not_found
      - ENTITY.USER.homepage_offline
      - ENTITY.USER.permission_denied
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.version_conflict
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_review_create
      trace: true
      attributes:
        - homepage_id
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_bindings:
      path:
        - name: homepageId
          field: homepageId
    description: 发表主页评价；同一 persona 对同一主页复用一条记录，软删后再次发表为复活
    request_entity: CreateHomepageReviewCommand
    response_entity: HomepageReview
    client_contract:
      dart_import: ../entity/homepage_review_contracts.dart
      response_type: HomepageReviewView
      response_decoder: decodeHomepageReviewView
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: PATCH
    path: /homepage-reviews/{reviewId}
    operation: UpdateHomepageReview
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: HomepageReviewCommandFacade
      method: update
      aggregate_owner: HomepageReview
      mutation_target: HomepageReview
      invariant_target: HomepageReview
    authorization:
      principal: persona
      ownership_policy: review_author
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.review_not_found
      - ENTITY.USER.permission_denied
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.version_conflict
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_review_update
      trace: true
      attributes:
        - homepage_id
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_bindings:
      path:
        - name: reviewId
          field: reviewId
    description: 作者修改自己的评价；服务端内部 version CAS
    request_entity: UpdateHomepageReviewCommand
    response_entity: HomepageReview
    client_contract:
      dart_import: ../entity/homepage_review_contracts.dart
      response_type: HomepageReviewView
      response_decoder: decodeHomepageReviewView
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: DELETE
    path: /homepage-reviews/{reviewId}
    operation: DeleteHomepageReview
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: HomepageReviewCommandFacade
      method: delete
      aggregate_owner: HomepageReview
      mutation_target: HomepageReview
      invariant_target: HomepageReview
    authorization:
      principal: persona
      ownership_policy: review_author
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.review_not_found
      - ENTITY.USER.permission_denied
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.version_conflict
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_review_delete
      trace: true
      attributes:
        - homepage_id
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_bindings:
      path:
        - name: reviewId
          field: reviewId
    description: 作者软删自己的评价；目标状态已满足时持久化 no-op receipt
    response_entity: HomepageReview
    client_contract:
      dart_import: ../entity/homepage_review_contracts.dart
      response_type: HomepageReviewView
      response_decoder: decodeHomepageReviewView
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: DeleteHomepageReviewCommand
    request_body_kind: none
  - method: GET
    path: /homepages/{homepageId}/reviews
    operation: ListHomepageReviews
    commercial:
      status: ready
    actor: none
    application:
      kind: query
      facet: HomepageReviewQueryFacade
      method: listByHomepage
      reader: HomepageReviewPageReader
      slice: HomepageReviewPageSlice
    authorization:
      principal: public
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - ENTITY.USER.homepage_not_found
      - ENTITY.USER.invalid_argument
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_review_list
      trace: true
      attributes:
        - homepage_id
        - outcome
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    description: 主页评价 keyset 分页列表（createdAt desc），仅返回 active 评价
    request_bindings:
      path:
        - name: homepageId
          field: homepageId
      query:
        - name: cursor
          field: cursor
          required: false
        - name: limit
          field: limit
    response_entity: HomepageReview
    client_contract:
      dart_import: ../entity/homepage_review_contracts.dart
      response_type: HomepageReviewPageSlice
      response_decoder: decodeHomepageReviewPageSlice
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: HomepageReviewListQuery
    request_body_kind: none
  - method: GET
    path: /homepages/{homepageId}/reviews/mine
    operation: GetMyHomepageReview
    commercial:
      status: ready
    actor: persona
    application:
      kind: query
      facet: HomepageReviewQueryFacade
      method: getMine
      reader: MyHomepageReviewReader
      slice: HomepageReviewSlice
    authorization:
      principal: persona
      ownership_policy: review_author
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - ENTITY.USER.review_not_found
      - ENTITY.USER.permission_denied
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_review_mine_get
      trace: true
      attributes:
        - homepage_id
        - outcome
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    request_bindings:
      path:
        - name: homepageId
          field: homepageId
    description: 当前 persona 对该主页的评价（active 或 deleted 均返回，供编辑/复活表单预填；从未评价过返回 404）
    response_entity: HomepageReview
    client_contract:
      dart_import: ../entity/homepage_review_contracts.dart
      response_type: HomepageReviewView
      response_decoder: decodeHomepageReviewView
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: MyHomepageReviewQuery
    request_body_kind: none
consumers:
  - name: app
    capabilities:
      - create_homepage_review
      - update_homepage_review
      - delete_homepage_review
      - list_homepage_reviews
      - read_my_homepage_review
contract_test:
  mock_strategy:
    app_side:
      mock_target: entity-service API
      scenarios:
        - name: list_homepage_reviews
          route: GET /homepages/{homepageId}/reviews
          assertions:
            - status_200
            - items_match_schema
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
      spy_targets:
        - event_publisher
      data_management:
        seed: fixture 工厂预制已发布主页
        cleanup: DeleteMany for homepage_reviews, homepage_review_command_receipts, homepage_review_outbox
      scenarios:
        - name: create_update_delete_review
          command: CreateHomepageReview -> UpdateHomepageReview -> DeleteHomepageReview
          seed: []
          assertions:
            - review summary projection converges to real aggregation
            - eventSpy.AssertPublished('HomepageReviewPublished')
