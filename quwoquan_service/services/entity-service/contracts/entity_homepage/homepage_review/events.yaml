events:
- name: HomepageReviewPublished
  delivery_semantics: transactional_outbox
  wire_event_type: HomepageReviewPublished
  payload_entity: HomepageReview
  payload_fields:
  - reviewId
  - homepageId
  - authorPersonaId
  - rating
  - tagRefs
  - status
  - createdAt
  - version
- name: HomepageReviewUpdated
  delivery_semantics: transactional_outbox
  wire_event_type: HomepageReviewUpdated
  payload_entity: HomepageReview
  payload_fields:
  - reviewId
  - homepageId
  - authorPersonaId
  - rating
  - tagRefs
  - status
  - updatedAt
  - version
- name: HomepageReviewRemoved
  delivery_semantics: transactional_outbox
  wire_event_type: HomepageReviewRemoved
  payload_entity: HomepageReview
  payload_fields:
  - reviewId
  - homepageId
  - status
  - updatedAt
  - version
