backend: mongodb
collections:
  homepage_reviews:
    publication_role: not_published
    entity: HomepageReview
    role: authoritative
    indexes:
    - name: idx_homepage_review_homepage_status
      keys:
        homepageId: 1
        status: 1
        createdAt: -1
      description: 主页评价 keyset page（active 过滤）
    - name: idx_homepage_review_author_homepage
      keys:
        authorPersonaId: 1
        homepageId: 1
      unique: true
      description: 一人一主页一条记录；软删复活复用同一文档
    - name: idx_homepage_review_version
      keys:
        _id: 1
        version: 1
      unique: true
      description: HomepageReview CAS commit predicate
  homepage_review_command_receipts:
    publication_role: not_published
    entity: HomepageReview
    description: HomepageReview command 幂等回执；与聚合版本和 homepage_review_outbox 在同一 Mongo transaction 提交。
    indexes:
    - name: idx_homepage_review_receipts_aggregate
      keys:
        aggregateId: 1
        aggregateVersion: -1
    - name: idx_homepage_review_receipts_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  homepage_review_outbox:
    publication_role: transactional_outbox
    entity: HomepageReview
    description: HomepageReview 领域事实 outbox；同事务写入，供 Homepage 评价摘要投影与推荐消费异步重放。
    indexes:
    - name: idx_homepage_review_outbox_replay
      keys:
        occurredAt: 1
        _id: 1
    - name: idx_homepage_review_outbox_aggregate_version
      keys:
        aggregateId: 1
        aggregateVersion: 1
      unique: true
  homepage_review_projection_checkpoints:
    publication_role: publication_accessory
    entity: HomepageReview
    role: projection
    description: HomepageReview outbox projector 的可重建消费水位。
transaction:
  scope:
  - homepage_reviews
  - homepage_review_command_receipts
  - homepage_review_outbox
  isolation: mongo_transaction
  guarantees:
  - version_cas
  - idempotency_digest
  - aggregate_and_outbox_atomic_commit
role: authoritative
