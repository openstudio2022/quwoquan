description: Persona 对 Homepage 的独立评价聚合
fields:
  - name: reviewId
    source: _id
    type: ObjectId
    constraints:
      - PK
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: homepageId
    type: ObjectId
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: authorPersonaId
    type: string
    constraints:
      - NOT_NULL
    classification: PRIVATE
    log_policy: hash
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
    reference: true
  - name: authorDisplayNameSnapshot
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 发表/更新时的作者昵称快照，列表展示用，不回填
    role: authoritative_state
  - name: authorAvatarUrlSnapshot
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 发表/更新时的作者头像快照，列表展示用，不回填
    role: authoritative_state
  - name: rating
    type: int
    constraints:
      - NOT_NULL
      - MIN_1
      - MAX_5
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: body
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: mask
    api_exposure: read_write
    ops_exposure: read
    role: authoritative_state
  - name: tagRefs
    type: '[]string'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    tag_ref: true
    role: authoritative_state
  - name: status
    type: enum
    enum_ref: HomepageReviewStatus
    constraints:
      - NOT_NULL
      - DEFAULT_ACTIVE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    role: authoritative_state
  - name: version
    type: int
    constraints:
      - NOT_NULL
      - DEFAULT_1
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
  - name: updatedAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: authoritative_state
types:
  DeleteHomepageReviewCommand:
    fields:
      - name: reviewId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  MyHomepageReviewQuery:
    fields:
      - name: homepageId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
  HomepageReviewListQuery:
    fields:
      - name: homepageId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: cursor
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
  UpdateHomepageReviewCommand:
    fields:
      - name: reviewId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: rating
        type: int
        client_dart_type: int
      - name: body
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: tagRefs
        type: '[]string'
        client_dart_type: List<String>
        client_default: const <String>[]
        client_normalization: trim_dedupe_drop_empty
      - name: authorDisplayNameSnapshot
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: authorAvatarUrlSnapshot
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
  CreateHomepageReviewCommand:
    fields:
      - name: homepageId
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: rating
        type: int
        client_dart_type: int
      - name: body
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: tagRefs
        type: '[]string'
        client_dart_type: List<String>
        client_default: const <String>[]
        client_normalization: trim_dedupe_drop_empty
      - name: authorDisplayNameSnapshot
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: authorAvatarUrlSnapshot
        type: string
        constraints:
          - NULLABLE
        client_dart_type: String?
        client_normalization: trim_to_null
