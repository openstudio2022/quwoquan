kind: aggregate_root
description: '共享主页下线或纠错上报。拥有提交、审核与审计生命周期；仅通过 homepageId 引用

  Homepage，不作为 Homepage 的无界 owned member。

  '
identity:
  fields:
  - reportId
  version_field: version
  version_source: field
access:
  commands: aggregate_facade
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: command_facade
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: homepage
  on_delete: restrict
  reference_fields:
  - homepageId
  target_object: entity.Homepage
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: reporter
  on_delete: retain
  reference_fields:
  - reporterPersonaId
  target_object: user.Persona
- access: named_reader
  cardinality: N:1
  consistency: eventual
  kind: reference
  name: reviewerAccount
  on_delete: retain
  reference_fields:
  - reviewerAccountId
  target_object: user.UserAccount
capabilities:
- auditable
business_rules:
- reporter persona、homepageId 与 evidence 创建后不可变
- 同一 reporter 对同一 homepage 的相同原因活动上报必须去重
- reviewer 必须具备 status report review 权限
- confirmed_offline 或 dismissed 后不可再次裁决
lifecycle:
  state_field: status
  states:
  - pending_review
  - confirmed_offline
  - dismissed
  transitions:
  - from: pending_review
    command: ReviewHomepageStatusReport.confirm_offline
    to: confirmed_offline
  - from: pending_review
    command: ReviewHomepageStatusReport.dismiss
    to: dismissed
  optimistic_concurrency: version
  idempotency: command_receipt
