events:
- name: HomepageStatusReported
  delivery_semantics: transactional_outbox
  wire_event_type: HomepageStatusReported
  payload_entity: HomepageStatusReport
  payload_fields:
  - reportId
  - homepageId
  - reporterPersonaId
  - reason
  - status
  - createdAt
  - version
- name: HomepageStatusReportReviewed
  delivery_semantics: transactional_outbox
  wire_event_type: HomepageStatusReportReviewed
  payload_entity: HomepageStatusReport
  payload_fields:
  - reportId
  - homepageId
  - status
  - reviewerAccountId
  - reviewedAt
  - version
