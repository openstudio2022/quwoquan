description: HomepageStatusReport 对象命令操作包。
api_routes:
  - method: GET
    path: /homepage-status-reports
    operation: ListHomepageStatusReports
    actor: account
    commercial:
      status: ready
    application:
      kind: query
      facet: HomepageStatusReportQueryFacade
      method: listQueue
      reader: HomepageStatusReportQueueReader
      slice: HomepageStatusReportSlice
    authorization:
      principal: operator
      ownership_policy: entity_governance_operator
      scopes: [ops.case.read]
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes:
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.permission_denied
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: redacted
    telemetry:
      metric: entity_homepage_status_report_queue
      trace: true
      attributes:
        - status
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: Ops Portal 查询主页状态上报治理队列
    request_bindings:
      query:
        - {name: homepageId, field: homepageId, required: false}
        - {name: status, field: status, required: false}
        - {name: cursor, field: cursor, required: false}
        - {name: limit, field: limit, required: false}
    response_entity: HomepageStatusReport
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: POST
    path: /homepages/{homepageId}/status-reports
    operation: CreateHomepageStatusReport
    commercial:
      status: ready
    actor: persona
    application:
      kind: command
      facet: HomepageStatusReportCommandFacade
      method: create
      aggregate_owner: HomepageStatusReport
      mutation_target: HomepageStatusReport
      invariant_target: HomepageStatusReport
    authorization:
      principal: persona
      ownership_policy: author_self
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.homepage_not_found
      - ENTITY.USER.invalid_status_report_evidence_url
      - ENTITY.USER.permission_denied
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: SENSITIVE
      response_classification: INTERNAL
      log_policy: redacted
    telemetry:
      metric: entity_homepage_status_report_create
      trace: true
      attributes:
        - homepage_id
        - reason
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_bindings:
      path:
        - name: homepageId
          field: homepageId
    description: 提交主页下线/纠错上报
    request_entity: CreateHomepageStatusReportCommand
    response_entity: HomepageStatusReportView
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: POST
    path: /homepages/{homepageId}/status-reports/{reportId}:review
    operation: ReviewHomepageStatusReport
    commercial:
      status: ready
    actor: account
    application:
      kind: command
      facet: HomepageStatusReportCommandFacade
      method: review
      aggregate_owner: HomepageStatusReport
      mutation_target: HomepageStatusReport
      invariant_target: HomepageStatusReport
    authorization:
      principal: operator
      ownership_policy: entity_governance_operator
      scopes: [ops.case.write]
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.status_report_not_found
      - ENTITY.USER.permission_denied
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.version_conflict
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_status_report_review
      trace: true
      attributes:
        - homepage_id
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_bindings:
      path:
        - {name: homepageId, field: homepageId}
        - {name: reportId, field: reportId}
    description: 审核主页下线/纠错上报；治理动作，仅 platform-ops 消费；confirmed_offline 经 HomepageStatusReportReviewed 事件幂等驱动 Homepage 下线
    request_entity: ReviewHomepageStatusReportCommand
    request_body_kind: object
    response_entity: HomepageStatusReport
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
consumers:
  - name: app
    capabilities:
      - create_homepage_status_report
  - name: platform-ops
    capabilities:
      - list_homepage_status_reports
      - review_homepage_status_report
