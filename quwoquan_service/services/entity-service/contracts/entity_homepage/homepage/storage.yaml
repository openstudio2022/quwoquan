backend: mongodb
collections:
  homepages:
    publication_role: not_published
    entity: Homepage
    role: authoritative
    indexes:
    - name: idx_homepages_status_updated
      keys:
        status: 1
        updatedAt: -1
    - name: idx_homepages_type_city
      keys:
        homepageType: 1
        city: 1
        updatedAt: -1
      sparse: true
    - name: idx_homepages_canonical_entity
      keys:
        canonicalEntityId: 1
      unique: true
    - name: idx_homepages_source
      keys:
        sourceOwner: 1
        sourceEntityRef: 1
      unique: true
      sparse: true
      description: 数据工程 importer 的幂等身份
    - name: idx_homepages_lookup_aliases
      keys:
        lookupAliases: 1
      sparse: true
      description: homepageId/canonicalEntityId/sourceEntityRef/受控旧链接精确查找
    - name: idx_homepages_template_type
      keys:
        objectPageTemplate: 1
        homepageType: 1
        updatedAt: -1
    - name: idx_homepages_location
      keys:
        location: 2dsphere
      sparse: true
      description: location 以 GeoJSON Point 落库（type=Point，coordinates=[longitude, latitude]）；wire/domain 仍是 latitude/longitude，翻译在存储层完成
    - name: idx_homepages_version
      keys:
        _id: 1
        version: 1
      unique: true
      description: Homepage CAS commit predicate
    - name: search_homepages_text
      source: search_homepages_text
      type: text
      fields:
      - title
      - subtitle
      - address
      - city
      weights:
        title: 10
        subtitle: 5
        address: 3
        city: 2
  homepage_command_receipts:
    publication_role: not_published
    entity: Homepage
    description: Homepage command 幂等回执；与聚合版本和 homepage_outbox 在同一 Mongo transaction 提交。
    indexes:
    - name: idx_homepage_command_receipts_aggregate
      keys:
        aggregateId: 1
        aggregateVersion: -1
    - name: idx_homepage_command_receipts_expire
      keys:
        expiresAt: 1
      expire_after_seconds: 0
  homepage_outbox:
    publication_role: transactional_outbox
    entity: Homepage
    description: Homepage 领域事实 outbox；同事务写入，供投影与事件消费异步重放。
    indexes:
    - name: idx_homepage_outbox_replay
      keys:
        occurredAt: 1
        _id: 1
    - name: idx_homepage_outbox_aggregate_version
      keys:
        aggregateId: 1
        aggregateVersion: 1
      unique: true
  homepage_detail_views:
    publication_role: not_published
    entity: HomepageDetailView
    role: projection
    description: 跨对象事实组成的 Homepage 详情读投影；评分、预览、关系边和助手上下文不得写回 homepages 聚合文档
    indexes:
    - name: idx_homepage_detail_views_updated
      keys:
        updatedAt: -1
  homepage_follower_projection:
    publication_role: not_published
    entity: HomepageFollowerProjection
    role: projection
    description: user.SubjectFollow 事实的 entity 域可重建投影；Homepage 不拥有关注关系
    indexes:
    - name: idx_homepage_follower_identity
      keys:
        homepageId: 1
        personaId: 1
      unique: true
    - name: idx_homepage_follower_count
      keys:
        homepageId: 1
        following: 1
    - name: idx_homepage_follower_source_version
      keys:
        homepageId: 1
        personaId: 1
        sourceVersion: -1
  homepage_projection_checkpoints:
    publication_role: publication_accessory
    entity: Homepage
    role: projection
    description: claim/report/review/follow 投影消费者的 durable checkpoint
    indexes:
    - name: idx_homepage_projection_checkpoint_consumer
      keys:
        _id: 1
      unique: true
transaction:
  scope:
  - homepages
  - homepage_command_receipts
  - homepage_outbox
  isolation: mongo_transaction
  guarantees:
  - version_cas
  - idempotency_digest
  - aggregate_and_outbox_atomic_commit
role: authoritative
