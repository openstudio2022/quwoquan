events:
- name: HomepageCandidateIntaken
  description: 候选共享主页创建
  delivery_semantics: transactional_outbox
  payload_entity: Homepage
  payload_fields:
  - homepageId
  - title
  - homepageType
  - status
  - sourceType
  - createdAt
- name: HomepagePublished
  description: 候选共享主页发布
  delivery_semantics: transactional_outbox
  payload_entity: Homepage
  payload_fields:
  - homepageId
  - title
  - homepageType
  - status
  - claimStatus
  - publishedAt
