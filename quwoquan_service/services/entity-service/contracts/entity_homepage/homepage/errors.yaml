  http_status: 410
  emitted_by:
  - surface: http
    operations: [GetHomepageDetail, GetHomepageShell, GetHomepageIntroduction, GetObjectPageBundle, GetEntityImpact, GetHomepageReviewSummary, GetHomepageRelatedGroups, entity.homepage_claim_request.CreateHomepageClaimRequest, entity.homepage_review.CreateHomepageReview]
