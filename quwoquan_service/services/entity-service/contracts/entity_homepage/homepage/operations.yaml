consumers:
  - name: app
    capabilities:
      - search
      - suggest
      - read_homepage
      - read_homepage_introduction
      - maintain
  - name: platform-ops
    capabilities:
      - intake_candidate
      - publish_candidate
      - reload_state
  - name: content-service
    capabilities:
      - read_homepage
  - name: circle-service
    capabilities:
      - read_homepage
contract_test:
  test_strategy:
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
      spy_targets:
        - event_publisher
      data_management:
        seed: fixture 工厂预制主页候选与已发布主页
        cleanup: DeleteMany for homepages, homepage_claim_requests, homepage_status_reports
      scenarios:
        - name: intake_publish_search
          command: IntakeHomepageCandidate -> PublishHomepageCandidate -> SearchHomepages
          seed: []
          assertions:
            - published homepage appears in search results
            - eventSpy.AssertPublished('HomepagePublished')
readiness_cases:
  - case_id: search-homepages-local
    spec_ref: specs/feature-tree/shared-homepage-network/homepage-discovery-and-attach/homepage-search-and-picker/spec.md#gwt-001
    producer: service
    layer: local_contract
    target: {kind: operation, id: SearchHomepages}
    runner_source_path: quwoquan_service/services/entity-service/tests/local_contract/entity_homepage/homepage/operation_facades__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
  - case_id: search-homepages-api
    spec_ref: specs/feature-tree/shared-homepage-network/homepage-discovery-and-attach/homepage-search-and-picker/spec.md#gwt-001
    producer: service
    layer: api_integration
    target: {kind: operation, id: SearchHomepages}
    runner_source_path: quwoquan_service/services/entity-service/tests/api_integration/entity_homepage/homepage/homepage_handler__api_integration_test.go
    executions:
      - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
  - case_id: list-homepage-candidates-local
    spec_ref: specs/feature-tree/object-homepage-network/spec.md#dom-002
    producer: service
    layer: local_contract
    target: {kind: operation, id: ListHomepageCandidates}
    runner_source_path: quwoquan_service/services/entity-service/tests/local_contract/entity_homepage/homepage/operation_facades__local_contract_test.go
    executions:
      - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
  - case_id: list-homepage-candidates-api
    spec_ref: specs/feature-tree/object-homepage-network/spec.md#dom-002
    producer: service
    layer: api_integration
    target: {kind: operation, id: ListHomepageCandidates}
