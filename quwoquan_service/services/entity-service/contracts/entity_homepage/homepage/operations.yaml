        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: 补充缺失主页
    request_entity: SuggestHomepageCandidateCommand
    response_entity: HomepageDetailView
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: POST
    path: /homepages/candidates/{homepageId}:publish
    operation: PublishHomepageCandidate
    actor: account
    commercial:
      status: ready
    application:
      kind: command
      facet: HomepageLifecycleCommandFacade
      method: publishCandidate
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    authorization:
