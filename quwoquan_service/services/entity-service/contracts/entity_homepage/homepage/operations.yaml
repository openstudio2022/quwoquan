description: 共享主页主档、搜索选择、认领与下线治理
externalDependencies:
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [appendDurable, consumeDurable]
    scenes: [general]
api_routes:
  - method: GET
    path: /homepages/search
    operation: SearchHomepages
    pagination: {default_items: 20, maximum_items: 500}
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: published_homepage_search
    reliability:
      timeout_ms: 6000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes:
      - ENTITY.USER.invalid_argument
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_search
      trace: true
      attributes: [homepage_type, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: search
      reader: HomepageSearchReader
      slice: HomepageSearchSlice
    description: 通过 Homepage aggregate 的公开查询 facade 搜索共享主页；HomepageSearchItemView 只负责跨域搜索索引投影。
    request_bindings:
      query:
        - {name: query, field: query}
        - {name: homepageType, field: homepageType, required: false}
        - {name: city, field: city, required: false}
        - {name: status, field: status, required: false}
        - {name: cursor, field: cursor, required: false}
        - {name: limit, field: limit}
    response_entity: HomepageSearchSlice
    response_entity_ref: entity.HomepageSearchItemView
    request_entity: HomepageSearchQuery
    request_body_kind: none
  - method: GET
    path: /homepages/candidates
    operation: ListHomepageCandidates
    actor: account
    commercial:
      status: ready
    application:
      kind: query
      facet: HomepageGovernanceQueryFacade
      method: listCandidates
      reader: HomepageSearchReader
      slice: HomepageCandidateQueueSlice
    authorization:
      principal: operator
      ownership_policy: entity_governance_operator
      scopes: [ops.case.read]
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes:
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.permission_denied
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_candidate_queue
      trace: true
      attributes:
        - homepage_type
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: Ops Portal 查询待发布候选主页治理队列
    request_bindings:
      query:
        - {name: query, field: query, required: false}
        - {name: homepageType, field: homepageType, required: false}
        - {name: city, field: city, required: false}
        - {name: cursor, field: cursor, required: false}
        - {name: limit, field: limit, required: false}
    response_entity: HomepageSearchItemView
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: POST
    path: /homepages/candidates
    operation: IntakeHomepageCandidate
    actor: account
    commercial:
      status: ready
    application:
      kind: command
      facet: HomepageImportCommandFacade
      method: intakeCandidate
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    authorization:
      principal: operator
      ownership_policy: entity_governance_operator
      scopes: [ops.case.write]
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - ENTITY.USER.invalid_argument
      - ENTITY.USER.invalid_homepage_type
      - ENTITY.USER.permission_denied
      - ENTITY.USER.idempotency_conflict
      - ENTITY.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_candidate_intake
      trace: true
      attributes:
        - homepage_type
        - outcome
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: 创建候选共享主页（introductionMarkdown/introductionAssets 承载数据工程 page.md 三段结构投影）；治理动作，仅 platform-ops 消费
    request_entity: IntakeHomepageCandidateCommand
    request_body_kind: object
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
