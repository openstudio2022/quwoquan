read_model: EntityImpactItem
description: '实体（共享主页）影响单条事实（实体主页「影响力」模块行真相源）。

  云侧按真实下游动作聚合连接型结果，并产出 primaryText 结论句

  （如「328人在这里建立了新连接」「189人为这里留下了记录」）。

  端只读直出，禁止本地拼装文案（全局验收 G2）；禁止下发收藏、关注内容、稍后看等内容长期动作。

  与 CircleImpactItem / AuthorImpactItem / IntersectionReason 单通道对齐，禁止保留 displayText 第二文案字段。

  '
consumers:
- app
client_projection:
  dart_class: EntityImpactItem
  base_class: ''
  output_path: cloud/runtime/generated/entity/entity_impact_item.g.dart
  dart_imports:
  - ../recommendation/intersection_text_span.g.dart
  - ../recommendation/intersection_visual.g.dart
  - ../recommendation/intersection_target.g.dart
  - ../recommendation/intersection_propagation_path.g.dart
  - ../recommendation/intersection_representative_actor.g.dart
  - ../recommendation/intersection_action_hint.g.dart
  fields:
  - name: helpType
    dart_type: String
    nullable: false
    source: helpType
    default: ''''''
  - name: action
    dart_type: String
    nullable: false
    source: action
    default: ''''''
  - name: intersectionDimension
    dart_type: String
    nullable: false
    source: intersectionDimension
    default: ''''''
  - name: tagRef
    dart_type: String
    nullable: false
    source: tagRef
    default: ''''''
  - name: source
    dart_type: String
    nullable: false
    source: source
    default: ''''''
  - name: count
    dart_type: int
    nullable: false
    source: count
    default: '0'
  - name: primaryText
    dart_type: String
    nullable: false
    source: primaryText
    default: ''''''
  - name: subtitleText
    dart_type: String
    nullable: false
    source: subtitleText
    default: ''''''
  - name: impactId
    dart_type: String
    nullable: false
    source: impactId
    default: ''''''
  - name: primarySpans
    dart_type: List<IntersectionTextSpan>
    nullable: false
    source: primarySpans
    list_element_dart_class: IntersectionTextSpan
  - name: sampleVisuals
    dart_type: List<IntersectionVisual>
    nullable: false
    source: sampleVisuals
    list_element_dart_class: IntersectionVisual
  - name: representativeActor
    dart_type: IntersectionRepresentativeActor
    nullable: true
    source: representativeActor
    map_from_string_key_class: IntersectionRepresentativeActor
  - name: actionHints
    dart_type: List<IntersectionActionHint>
    nullable: false
    source: actionHints
    list_element_dart_class: IntersectionActionHint
  - name: countTarget
    dart_type: IntersectionTarget
    nullable: true
    source: countTarget
    map_from_string_key_class: IntersectionTarget
  - name: evidenceSnapshotId
    dart_type: String
    nullable: false
    source: evidenceSnapshotId
    default: ''''''
  - name: countObjectKind
    dart_type: String
    nullable: false
    source: countObjectKind
    default: ''''''
  - name: propagationPath
    dart_type: IntersectionPropagationPath
    nullable: true
    source: propagationPath
    map_from_string_key_class: IntersectionPropagationPath
  - name: iconKey
    dart_type: String
    nullable: false
    source: iconKey
    default: ''''''
