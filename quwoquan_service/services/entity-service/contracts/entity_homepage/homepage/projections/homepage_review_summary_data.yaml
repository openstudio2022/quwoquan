read_model: HomepageReviewSummaryData
description: '主页评价摘要 wire（壳层 / getHomepageReviewSummary）；由 HomepageReview 事件投影

  真实聚合：平均分、评分数与亮点标签（review tagRefs 频次聚合）。

  '
source_entities:
- Homepage
consumers:
- app
client_projection:
  dart_class: HomepageReviewSummaryData
  base_class: ''
  output_path: cloud/runtime/generated/entity/entity_homepage/homepage_review_summary_data.g.dart
  fields:
  - name: averageRating
    dart_type: double
    nullable: true
    source: averageRating
  - name: ratingCount
    dart_type: int
    nullable: false
    source: ratingCount
    default: '0'
  - name: highlightTags
    dart_type: List<String>
    nullable: false
    source: highlightTags
