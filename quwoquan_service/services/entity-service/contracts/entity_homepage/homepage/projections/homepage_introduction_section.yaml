read_model: HomepageIntroductionSection
description: '主页完整介绍页分节。kind 为稳定展示闭集：

  overview | keyFacts | timeline | history | relatedPeople | relatedObjects | map | gallery | body | relatedImages。

  端侧按 kind 选择渲染形态；canonical semanticDocument 在场时为唯一正文语义来源。

  bodyMarkdown 仅在 canonical semanticDocument 不可用时提供来源正文的只读投影，不得用于新写入或隐式升级 canonical。

  body：数据工程 page.md 正文章节投影，bodyMarkdown 可含 `:::figure id="..." caption="..."`

  块级内嵌图指令（上图下文 + 单行原图注），assets 提供 role=inline 的图片绑定。

  relatedImages：page.md 页尾「相关图片」小节投影，assets 全部 role=related。

  '
source_entities:
- Homepage
consumers:
- app
fields:
- name: kind
  type: string
- name: title
  type: string
- name: semanticDocument
  type: semantic_document
  go_type_ref: semantic_document.DocumentEnvelope
  go_import: quwoquan_service/services/entity-service/generated/entity_homepage/homepage/semantic_document
  nullable: true
- name: bodyMarkdown
  type: string
  nullable: true
- name: assets
  type: '[]HomepageIntroductionAsset'
- name: timelineItems
  type: '[]HomepageIntroductionTimelineItem'
