read_model: ObjectPageBundle
description: '对象页统一 Bundle。用户主页、圈子/群组主页和共享主页可消费同构字段，

  由具体领域服务填充身份与内容区，端侧用共享对象页组件渲染。

  交集唯一下发通道为 intersectionReasons（List<IntersectionReason>）；禁止并行 intersections 第二通道。

  '
source_entities:
- Homepage
consumers:
- app
- assistant
- recommendation
fields:
- name: objectType
  type: string
- name: objectId
  type: string
- name: canonicalEntityId
  type: string
- name: title
  type: string
- name: subtitle
  type: string
  nullable: true
- name: coverUrl
  type: string
  nullable: true
- name: objectPageTemplate
  type: string
- name: tagRefs
  type: '[]string'
- name: stats
  type: object
- name: intersectionReasons
  type: '[]IntersectionReason'
- name: highlightItems
  type: '[]HomepageContentPreview'
- name: contentSections
  type: object
- name: relatedObjects
  type: '[]HomepageRelatedGroupSummary'
- name: relationEdges
  type: '[]ObjectRelationEdge'
- name: assistantContext
  type: ObjectPageContext
  nullable: true
- name: rolloutContext
  type: ObjectPageRolloutContext
  nullable: true
