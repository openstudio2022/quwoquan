read_model: HomepageIntroductionAsset
description: '主页完整介绍页中的图片/媒体资产。由数据工程实体主页三件套 page.md / manifest.json

  映射而来；来源引用保留在服务端 evidence chain，不进入客户端投影。

  role 为三段结构闭集：cover（封面，仅 frontmatter）| inline（正文块级内嵌图，

  上图下文 + 单行原图注）| related（页尾「相关图片」小节）。

  '
source_entities:
- Homepage
consumers:
- app
fields:
- name: assetId
  type: string
- name: url
  type: string
# 交付访问模式（DEC-033）：signed_grant 时 url 为相对私有引用，App 必须按
# assetId 换取短签；null 只允许出现在存量 public 交付。
- name: accessMode
  type: enum
  enum_ref: MediaDeliveryAccessMode
  nullable: true
- name: caption
  type: string
  nullable: true
- name: role
  type: string
