read_model: HomepageIntroductionAsset
description: '主页完整介绍页中的图片/媒体资产。由数据工程实体主页三件套 page.md / manifest.json

  映射而来；来源引用保留在服务端 evidence chain，不进入客户端投影。

  role 为三段结构闭集：cover（封面，仅 frontmatter）| inline（正文块级内嵌图，

  上图下文 + 单行原图注）| related（页尾「相关图片」小节）。

  '
source_entities:
- Homepage
consumers:
- app
fields:
- name: assetId
  type: string
- name: url
  type: string
# 交付访问模式（DEC-033/DEC-040）：新 release/projected asset 必须显式 public
# 或 signed_grant；null/absent 只允许在具名 previous-version public migration adapter 边界
# 适配，正常消费必须 fail closed。signed_grant 时 url 为相对私有引用且 assetId
# 必须在场；private HLS 当前 unsupported。
- name: accessMode
  type: enum
  enum_ref: MediaDeliveryAccessMode
  nullable: true
- name: caption
  type: string
  nullable: true
- name: role
  type: string
