read_model: HomepageIntroductionAsset
description: '主页完整介绍页中的图片/媒体资产。由数据工程实体主页三件套 page.md / manifest.json

  映射而来；来源引用保留在服务端 evidence chain，不进入客户端投影。

  role 为三段结构闭集：cover（封面，仅 frontmatter）| inline（正文块级内嵌图，

  上图下文 + 单行原图注）| related（页尾「相关图片」小节）。

  '
source_entities:
- Homepage
consumers:
- app
client_projection:
  dart_class: HomepageIntroductionAsset
  base_class: ''
  output_path: cloud/runtime/generated/entity/entity_homepage/homepage_introduction_asset.g.dart
  fields:
  - name: assetId
    dart_type: String
    nullable: false
    source: assetId
    default: ''''''
  - name: url
    dart_type: String
    nullable: false
    source: url
    default: ''''''
  - name: caption
    dart_type: String
    nullable: true
    source: caption
  - name: role
    dart_type: String
    nullable: false
    source: role
    default: '''related'''
