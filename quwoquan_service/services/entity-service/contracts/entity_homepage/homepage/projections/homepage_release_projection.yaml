read_model: HomepageReleaseProjection
description: >-
  Homepage owner 按 exact environment/sourceOwner/releaseId/manifestDigest 保存的
  create-once stage candidate。它独立于 Homepage aggregate 的 governance status；
  公开读只能由 Content active tuple 精确选中，不存在 latest/旧版本 fallback。
source_entities:
- Homepage
consumers:
- entity-service
fields:
- {name: environment, type: string}
- {name: sourceOwner, type: string}
- {name: releaseId, type: string}
- {name: manifestDigest, type: string}
- {name: homepageId, type: string}
- {name: entityRef, type: string}
- {name: title, type: string}
- {name: homepageType, type: string}
- {name: city, type: string, nullable: true}
- {name: location, type: HomepageGeoPoint, nullable: true}
- {name: categoryTags, type: '[]string'}
- {name: coverUrl, type: string, nullable: true}
- {name: introductionMarkdown, type: string, nullable: true}
- {name: introductionAssets, type: '[]HomepageIntroductionAsset'}
- {name: structuredFacts, type: HomepageStructuredFactsView, nullable: true}
- {name: primarySource, type: HomepageSource, nullable: true}
- {name: sourceUrls, type: '[]string'}
- {name: projectionVersion, type: int64}
- {name: closureDigest, type: string}
- {name: documentDigest, type: string}
- {name: verifiedAt, type: timestamp}
