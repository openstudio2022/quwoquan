read_model: HomepageIntroduction
description: '主页完整介绍页读模型。用户前台文案为「认识{对象名}」，禁止展示「实体介绍」等工程词。

  内容来源为数据工程实体主页三件套或维护后台导入；App 只消费公开 primarySource/sourceUrls，

  内部 sourceRefs/primaryEvidenceRef 不进入客户端投影。

  '
source_entities:
- Homepage
consumers:
- app
fields:
- name: homepageId
  type: string
- name: displayName
  type: string
- name: homepageType
  type: string
- name: coverUrl
  type: string
  nullable: true
- name: summary
  type: string
- name: sections
  type: '[]HomepageIntroductionSection'
- name: relatedObjects
  type: '[]HomepageRelatedGroupSummary'
- name: primarySource
  type: HomepageSource
  nullable: true
- name: sourceUrls
  type: '[]string'
- name: updatedAt
  type: string
