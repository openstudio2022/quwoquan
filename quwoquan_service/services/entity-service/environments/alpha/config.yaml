# Alpha content-release 无 ES 集群。schema 默认 es.enabled=false；
# 禁止在此覆盖为 true（空 endpoints 会 fail-closed）。回归由
# quwoquan_ops/tests/local_contract/test_alpha_entity_es_disabled__local_contract_test.py 锁定。
overrides:
  sys.entity-service.redis.rec.addr: redis:6379
  sys.entity-service.user_account_security_authority.base_url: http://user-service:18081
secretRefs:
  sys.entity-service.mongo.uri: ENTITY_MONGO_URI
  sys.entity-service.redis.general.password: ENTITY_REDIS_PASSWORD
  sys.entity-service.redis.rec.password: ENTITY_REDIS_PASSWORD
externalBindings:
  runtime.message.transport:
    state: enabled
