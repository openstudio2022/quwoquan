# Alpha content-release 无 ES 集群。schema 默认 es.enabled=false；
# 禁止在此覆盖为 true（空 endpoints 会 fail-closed）。回归由
# quwoquan_ops/tests/local_contract/environment/test_alpha_entity_es_disabled__local_contract_test.py 锁定。
#
# redis.general.addr 不在此声明：message transport 的物理组网只由环境装配注入
# ENTITY_REDIS_GENERAL_ADDR，快照里写死地址会让宿主机进程与 compose 网络两种
# 形态共用一个错误的值。
overrides: {}
secretRefs:
  sys.entity-service.mongo.uri: ENTITY_MONGO_URI
  sys.entity-service.redis.general.password: ENTITY_REDIS_GENERAL_PASSWORD
externalBindings:
