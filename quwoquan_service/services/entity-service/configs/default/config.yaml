service:
  name: entity-service
  http:
    addr: ":18084"

mongo:
  uri: ""
  database: "quwoquan_entity"

content_service:
  base_url: ""
  object_intersections_path: "/content/intersections/object"

# Unified search index — WRITE side (entity.search_index_worker).
# entity-service is the indexing producer for the shared ES/OpenSearch index that
# search-service reads; both target the same cluster + index. Endpoints/credentials
# are injected per-env via the shared SEARCH_ES_ENDPOINTS / SEARCH_ES_* env (deploy
# secrets); committed config never hardcodes cluster URLs/secrets. When disabled or
# endpoints empty, the write-time projector is a no-op and the homepage write path is
# unaffected.
es:
  enabled: false
  endpoints: []
  index: "quwoquan_objects"
  requestTimeoutMs: 800
  insecureTls: false
  shards: 1
  replicas: 1
  embeddingDims: 0
  synonyms: []

config:
  # Config release contract
  # CONFIG_VERSION must be injected by deployment pipeline in prod.
  version: "v0.0.1"
  min_image_version: "0.0.1"
  max_image_version: "9.9.9"

# Redis scenes (defaults)
redis:
  rec:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 0
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 100
      write_timeout_ms: 100
      dial_timeout_ms: 500
  general:
    mode: standalone
    addr: ""
    addrs: []
    password: ""
    db: 1
    tls: false
    pool:
      size: 0
      min_idle: 0
      read_timeout_ms: 200
      write_timeout_ms: 200
      dial_timeout_ms: 500