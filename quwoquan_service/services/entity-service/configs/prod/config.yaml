# prod overrides (container/k8s)
# Recommend injecting APP_ENV=prod, CONFIG_VERSION, IMAGE_VERSION, CONFIG_ROOT via env.
service:
  http:
    addr: ":18084"

redis:
  rec:
    mode: cluster
    addrs: []
    tls: true

# prod enables the write-time index; endpoints/credentials come from SEARCH_ES_*.
es:
  enabled: true
  endpoints: []
  index: "quwoquan_objects"
  shards: 3
  replicas: 1