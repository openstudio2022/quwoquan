# 第一方工作负载 Compose 基线；环境值由环境入口/启动器注入。
services:
  entity-service:
    image: "${QWQ_COMPOSE_ENTITY_SERVICE_IMAGE:?fixed entity-service source image reference is required}"
    build:
      context: ../../../quwoquan_service
      dockerfile: services/entity-service/build/Dockerfile
      args:
        GO_BASE_IMAGE: "${QWQ_COMPOSE_GO_BASE_IMAGE:?QWQ_COMPOSE_GO_BASE_IMAGE is required}"
        ALPINE_BASE_IMAGE: "${QWQ_COMPOSE_ALPINE_BASE_IMAGE:?QWQ_COMPOSE_ALPINE_BASE_IMAGE is required}"
        GO_BUILD_FLAGS: "${QWQ_COMPOSE_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: entity-service
      APP_ENV: "${QWQ_COMPOSE_ENV:-gamma}"
      CONFIG_ROOT: /etc/qwq-config
      QWQ_ARTIFACT_IDENTITY_FILE: /etc/quwoquan/artifact-identity.json
      CONFIG_VERSION: "${QWQ_COMPOSE_ENTITY_SERVICE_CONFIG_VERSION:?QWQ_COMPOSE_ENTITY_SERVICE_CONFIG_VERSION is required}"
      IMAGE_VERSION: "${QWQ_COMPOSE_IMAGE_VERSION:?immutable image version is required}"
      ENTITY_MONGO_URI: mongodb://mongodb:27017
      ENTITY_MONGO_DATABASE: quwoquan_entity
      ENTITY_REDIS_ADDR: redis:6379
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}"
      AUTH_JWT_TOKEN_VERSION: "${AUTH_JWT_TOKEN_VERSION:?AUTH_JWT_TOKEN_VERSION is required}"
      # 共享 ES 召回索引（与 search-service / content backfill 同一 quwoquan_objects）：
      # 主页 write-time projection 走 SEARCH_ES_*，与 gamma config es.enabled=true 一致。
      SEARCH_ES_ENABLED: "${QWQ_COMPOSE_SEARCH_ES_ENABLED:-true}"
      SEARCH_ES_ENDPOINTS: "${QWQ_COMPOSE_SEARCH_ES_ENDPOINTS:-http://elasticsearch:9200}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    ports:
      - "${QWQ_COMPOSE_ENTITY_PORT:-19290}:18084"
    volumes:
      - ${QWQ_COMPOSE_CONFIG_ROOT:?QWQ_COMPOSE_CONFIG_ROOT is required}:/etc/qwq-config:ro
      - ${QWQ_COMPOSE_ARTIFACT_IDENTITY_FILE:?artifact identity mount is required}:/etc/quwoquan/artifact-identity.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18084/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10
