  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: []
- key: sys.entity-service.redis.general.db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  # 跨服务 durable 事实流的发布/消费方必须共用同一 db（运行时事实为 db0）；
  # 共享单实例时 scene 隔离靠 key 前缀而非 db。
  default: 0
- key: sys.entity-service.redis.general.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.entity-service.redis.general.password
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.entity-service.redis.general.pool.dial_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 500
- key: sys.entity-service.redis.general.pool.min_idle
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
