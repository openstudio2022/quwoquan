  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1
- key: sys.entity-service.es.requestTimeoutMs
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 800
- key: sys.entity-service.es.shards
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1
- key: sys.entity-service.es.synonyms
  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: []
- key: sys.entity-service.mongo.database
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: quwoquan_entity
- key: sys.entity-service.mongo.uri
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.entity-service.redis.general.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: ''
