  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 200
- key: sys.entity-service.redis.general.pool.size
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.entity-service.redis.general.pool.write_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 200
- key: sys.entity-service.redis.general.tls
  type: bool
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: false
- key: sys.entity-service.service.http.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: :18084
