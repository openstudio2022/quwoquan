description: 该自治边界的运行配置定义与默认值；环境只维护差异和引用。
configs:
- key: sys.entity-service.content_service.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: ''
- key: sys.entity-service.content_service.object_intersections_path
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: /content/intersections/object
- key: sys.entity-service.user_account_security_authority.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: ''
- key: sys.entity-service.user_account_security_authority.timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 250
- key: sys.entity-service.es.embeddingDims
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.entity-service.es.enabled
  type: bool
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: false
- key: sys.entity-service.es.endpoints
  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
