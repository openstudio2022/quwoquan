# alpha overrides (developer single-instance validation)
# alpha has no dedicated ES infra: search-service runs the native backend over
# seeded data so the contract path is exercisable without an ES cluster.
service:
  http:
    addr: ":18095"

es:
  enabled: false
  endpoints: []

redis:
  rec:
    mode: standalone
    addr: "127.0.0.1:6379"
    db: 0
