commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: SEARCH_INDEX_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: >-
  SearchIndexView 拥有 canonical search(request) 的无版本 POST /search。
  mode=suggest|result|retrieval 共用同一 query facade；suggest/result 面向
  App/public principal，retrieval 只允许持有对象 read scope 的已验签
  assistant-service principal（scope=assistant.search.search_index_view.read）；API Edge
  owner read 只允许已验签 api-edge principal
  （scope=search.search_index_view.graphql.read）。公开 operation 不声明这两条 owner scope，避免已登录 App/guest
  被 generated edge guard 当成 owner principal 拒绝；两条 owner transport
  仍只认 verified service principal，并在
  before executor 阶段 fail-closed。生产召回只使用
  Elasticsearch/OpenSearch 派生读库，依赖不可用时返回结构化错误，
  不切换第二召回后端。迁移期 POST /search 仅为旧 minimum build 与 typed
  owner client 保留；它不是 GraphQL fallback，也不产生第二 canonical operation。
api_routes:
  - method: POST
    path: /search
    operation: Search
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: public_search_discovery
    reliability:
      timeout_ms: 6000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes:
      - SEARCH.USER.invalid_argument
      - SEARCH.USER.forbidden
      - SEARCH.MIDDLEWARE.unavailable
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: search_index_lookup
      trace: true
      attributes: [mode, target_count, outcome]
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: SearchIndexFacade
      method: search
      reader: SearchIndexReader
      slice: OwnerSearchResponseView
    description: 统一对象检索；query 为主输入，objectTypes/filters 为受控收窄条件。
    request_entity: CanonicalSearchQuery
    response_entity: SearchResponseView
    request_body_kind: object
    request_bindings:
      header:
        - name: X-Session-Id
          field: sessionId
          required: false
consumers:
  - name: app
    capabilities: [search, suggest]
  - name: assistant-service
    capabilities: [search]
contract_test:
  test_strategy:
    service_side:
      description: 使用 ES HTTP 契约替身验证 wire adapter；生产组合只允许 ES 单轨。
      real_engines:
        elasticsearch: httptest fake (search_test)
      spy_targets: [search_request_fact_recorder, event_publisher]
      scenarios:
        - name: retrieve_with_single_es_backend
          command: Search(es_ok) -> Search(es_down)
          assertions:
            - es-backed hits returned when ES healthy
            - structured 503 returned when ES unavailable
            - no secondary recall backend selected
