description: 跨对象搜索索引统一投影
fields:
- {name: releaseSliceBinding, type: ReleaseQueryPreparationBinding, constraints: [NULLABLE], role: projection, description: 全部Data Creator/Post/Homepage必填，UGC/普通账户必须null；不是公开caller选择器。}
- {name: releaseSourceIdentity, type: ReleaseCandidateObjectIdentity, constraints: [NULLABLE], role: projection, description: 完整source身份，同物理分区按sourceVersion/digest拒绝冲突。}
- name: objectType
  type: string
  constraints:
  - NOT_NULL
  role: projection
- name: objectId
  type: string
  constraints:
  - NOT_NULL
  role: projection
  reference: true
- name: title
  type: string
  constraints:
  - NOT_NULL
  role: projection
- name: summary
  type: string
  constraints:
  - NULLABLE
  role: projection
- name: payload
  type: CanonicalSearchPayload
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: metadata_only
  api_exposure: read
  ops_exposure: read
  description: 各对象公开展示切片；ES 仅保存在 _source 且禁止参与动态字段索引，结果页不得回源拼装
  role: projection
- name: tagRefs
  type: '[]string'
  constraints:
  - NULLABLE
  role: projection
- name: visibility
  type: enum
  enum_ref: Visibility
  constraints:
  - NOT_NULL
  role: projection
- name: sourceVersion
  type: int
  constraints:
  - NOT_NULL
  role: projection
- name: indexedAt
  type: timestamp
  constraints:
  - NOT_NULL
  role: projection
types:
  SearchContentFenceReceipt:
    description: 永久保留的exact已消费Content提交依据，只含身份摘要/顺序/proof摘要，不含payload正文或第二active指针。eventDigest唯一且scopeDigest/revision唯一，同revision异摘要冲突，proofEvidenceDigest绑定实际对账结果而非授予activation；superseded只在Content确切原提交回执可证时成立。
    fields:
      - {name: eventDigest, type: string, format: canonical_sha256, constraints: [PK, NOT_NULL]}
      - {name: scopeDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: revision, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: payloadDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: proofEvidenceDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: outcome, type: enum, values: [reconciled, superseded], constraints: [NOT_NULL]}
      - {name: consumedAt, type: timestamp, constraints: [NOT_NULL]}
  SearchContentPostInbox:
    description: ordinary Content事件持久去重证据，不保存payload/标题/作者/媒体URL。eventId摘要为唯一键，事件规范摘要冲突拒绝，Provider成功后与checkpoint同事务提交；不设置TTL解除重放保护。
    fields:
      - {name: eventDigest, type: string, format: canonical_sha256, constraints: [PK, NOT_NULL]}
      - {name: payloadDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: objectDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: appliedAt, type: timestamp, constraints: [NOT_NULL]}
  SearchContentPostCheckpoint:
    description: ordinary canonical Post身份摘要的单调消费checkpoint；不是ES版本比较authority，也不是Content active pointer。deletionVersion记录不可复活终态，权限暂不可见只影响deleted，不将其误作永久对象删除；不可逆标记不设置TTL。
    fields:
      - {name: objectDigest, type: string, format: canonical_sha256, constraints: [PK, NOT_NULL]}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: projectionDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: deleted, type: bool, constraints: [NOT_NULL]}
      - {name: deletionVersion, type: int64, min: 0, constraints: [NOT_NULL]}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  SearchReleaseCandidateDocument:
    description: 仅由准备流程调用typed projector生成的ES候选输入；physicalId含完整binding+canonical对象，业务ID仍是snapshot.objectId。
    fields:
      - {name: physicalId, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: sourceKind, type: enum, values: [release_candidate], constraints: [NOT_NULL]}
      - {name: binding, type: ReleaseQueryPreparationBinding, constraints: [NOT_NULL]}
      - {name: snapshot, type: SearchReleaseCandidateSnapshot, constraints: [NOT_NULL]}
      - {name: documentDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  SearchReleaseCandidateQueryResult:
    description: typed内部query的实际readback，必须逐对象验证完整集合与digest；不存在或不可读不能返回ready。
    fields:
      - {name: binding, type: ReleaseQueryPreparationBinding, constraints: [NOT_NULL]}
      - {name: objectSetDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: documentsDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: objectCount, type: int64, constraints: [NOT_NULL], min: 0}
  SearchAccountRestrictionView:
    description: SearchIndexView 的主体可见性阻断投影。
    fields:
      - {name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: subjects, type: '[]string', constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: none}
      - {name: restricted, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: accountVersion, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: authEpoch, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: eventDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: decisionRef, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
  SearchAccountRestrictionInbox:
    description: 可逆主体限制事件的幂等应用凭据。
    fields:
      - {name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: eventDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: accountDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: accountVersion, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: stale, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: affected, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: appliedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
  SearchAccountRestrictionWatermark:
    description: 主体限制投影的单调账号版本与关闭终态水位。
    fields:
      - {name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: accountVersion, type: int64, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: eventDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read}
      - {name: terminal, type: bool, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read}
  CanonicalSearchEvidence:
    description: 命中证据，不包含原始私有 query。
    fields:
      - name: field
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: snippet
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  CanonicalSearchRankReason:
    description: 服务端排序理由与权重。
    fields:
      - name: code
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: label
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: weight
        type: float64
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  CanonicalSearchGeoPoint:
    description: 搜索命中的 WGS84 坐标。
    fields:
      - name: lat
        type: float64
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: lng
        type: float64
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  CanonicalSearchIntersectionReason:
    description: 由统一交集真相源附加的只读理由。
    fields:
      - {name: primaryText, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: intersectionId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: dimension, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: class, type: string, client_dart_name: intersectionClass, client_wire_name: class, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: sourceRef, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  CanonicalSearchContentHit:
    description: content.post 命中的强类型展示切片；不得再从 payload 二次组装 Post。
    fields:
      - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: title, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: summary, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: coverUrl, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      # 封面的配对媒体资产标识与交付访问模式（DEC-033）：research 相位的
      # coverUrl 是相对私有 CAS 引用，App 必须按 coverAssetId 换短签。
      - {name: coverAssetId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: coverAccessMode, type: enum, enum_ref: MediaDeliveryAccessMode, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: authorId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: authorDisplayName, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: authorAvatarUrl, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: categoryId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: subCategory, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: likeCount, type: int, constraints: [NOT_NULL, DEFAULT_0], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: publishedAt, type: timestamp, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  CanonicalSearchCitation:
    description: 搜索结果引用证据，字段与 runtime/search.Citation 的公开 wire 完全一致。
    fields:
      - {name: citationId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: objectType, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: objectId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: title, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: snippet, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: url, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: deepLink, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: badgeLabel, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: sourceDomain, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: score, type: float64, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  CanonicalSearchFacet:
    description: 搜索聚合分面。
    fields:
      - {name: key, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: label, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: count, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  CanonicalSearchDegradeSignal:
    description: 搜索降级信号；只表达失败边界，不承载替代召回轨。
    fields:
      - {name: code, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: message, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: objectType, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  CanonicalSearchProvenance:
    description: 本次搜索结果的唯一召回提供者及生成时间。
    fields:
      - {name: provider, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: generatedAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  OwnerSearchInterpretedQuery:
    description: Search owner 对 query 的唯一解释结果，不包含 backend DSL。
    fields:
      - {name: normalized, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: tokens, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: variants, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: detectedEntities, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: detectedTags, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read}
      - {name: selectedObjectTypes, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  OwnerSearchHit:
    description: Search owner bounded flat-card projection；objectRef 为 opaque token，action 只来自 canonical Document.DeepLink，thumbnailUrl 只来自 bounded thumbnailUrl/coverUrl，禁止外泄 raw objectId/score/index/features/payload。
    fields:
      - {name: objectRef, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: objectType, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: title, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: snippet, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: action, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: thumbnailUrl, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      # 缩略的配对媒体资产标识与交付访问模式（DEC-033），与 thumbnailUrl 同源。
      - {name: thumbnailAssetId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: thumbnailAccessMode, type: enum, enum_ref: MediaDeliveryAccessMode, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: rankPosition, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, description: 服务端最终排序位置（0 起）；端侧只读消费，不得客户端重排}
      - {name: matchedTerms, type: '[]string', constraints: [NOT_NULL], classification: PUBLIC, log_policy: metadata_only, api_exposure: read, ops_exposure: read, description: 命中的归一化查询词，用于端侧高亮}
      - {name: rankReasons, type: '[]CanonicalSearchRankReason', constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: evidence, type: '[]CanonicalSearchEvidence', constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read, description: 命中字段与高亮片段；snippet 由服务端 highlighter 产出}
  OwnerSearchCitation:
    description: 与 opaque objectRef 绑定的公开引用；不包含 raw score 或 backend identity。
    fields:
      - {name: citationId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: objectRef, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: objectType, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: title, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: snippet, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: url, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
      - {name: deepLink, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: hash, api_exposure: read, ops_exposure: read}
  OwnerSearchProvenance:
    description: Search owner 归因；source 固定为 search_index_view，不暴露 ES index/backend/model/features。
    fields:
      - {name: source, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: generatedAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  CanonicalSearchQuery:
    fields:
      - name: clientPresentationContract
        type: ClientContentPresentationContract
        constraints: [NULLABLE]
        description: 正常 App 上送生成的四集合能力声明；仅服务端计算缺席声明的 effective 能力。内容命中按能力过滤并补页，非内容命中保留原对象语义，cursor 绑定有效能力摘要；不得将 contentTypes 查询筛选器当作能力声明。
      - name: sessionId
        type: string
        constraints: [NULLABLE]
        description: 匿名搜索的稳定会话身份；通过 X-Session-Id header 传入，登录态使用可信 principal，禁止用逐请求 requestId 重分桶
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: query
        type: string
        constraints: [NOT_BLANK]
        client_dart_type: String
        client_normalization: trim
      - name: mode
        type: enum
        enum_ref: CanonicalSearchMode
        client_default: CanonicalSearchMode.result
      - name: objectTypes
        type: '[]string'
        description: canonical 对象词汇过滤，取值域固定为 content.post/user.profile/entity.homepage/circle.circle/circle.group/location.place；内部召回 target 词汇（article/photo/video 等）不得出现在 wire 上
        client_dart_type: List<String>
        client_parameter_type: Iterable<String>
        client_default: const <String>[]
        client_normalization: trim_drop_empty
      - name: contentTypes
        type: '[]string'
        description: content.post 命中的内容形态过滤，取值域固定为 article/image/video；仅当过滤范围含 content.post 时生效
        client_dart_type: List<String>
        client_parameter_type: Iterable<String>
        client_default: const <String>[]
        client_normalization: trim_drop_empty
        client_omit_empty: true
      - name: ids
        type: '[]string'
        client_dart_type: List<String>
        client_parameter_type: Iterable<String>
        client_default: const <String>[]
        client_normalization: trim_drop_empty
        client_omit_empty: true
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
      - name: cursor
        type: string
        constraints: [NULLABLE]
        description: Search owner AEAD opaque continuation；绑定 normalized query、筛选 scope、可信 principal、candidate 与 active policy，禁止 raw offset/ES search_after
enums:
  CanonicalSearchMode:
    values: [suggest, result, retrieval]
