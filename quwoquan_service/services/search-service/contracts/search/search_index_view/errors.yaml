description: SearchIndexView 查询输入与索引依赖不可用的对象专属错误语义。
errors:
- code: SEARCH.USER.invalid_argument
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [Search, search.search_request_fact.RecoverSearchAccountClosureDeadLetter]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: searchInvalidArgument
  go_const: ErrSearchInvalidArgument
  user_message:
    zh: 搜索请求格式不正确
    en: Invalid search request
- code: SEARCH.MIDDLEWARE.unavailable
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [Search]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: searchUnavailable
  go_const: ErrSearchUnavailable
  user_message:
    zh: 搜索暂时不可用，请稍后再试
    en: Search is temporarily unavailable, please retry later
- code: SEARCH.USER.forbidden
  reason: forbidden
  http_status: 403
  emitted_by:
  - surface: http
    operations: [Search]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: searchForbidden
  go_const: ErrSearchForbidden
  user_message:
    zh: 当前身份不能执行该检索模式
    en: The current principal cannot use this search mode
