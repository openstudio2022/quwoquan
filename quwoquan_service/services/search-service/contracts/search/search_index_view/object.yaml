kind: projection
description: SearchIndexView 的领域对象契约。
identity:
  fields:
  - objectId
  version_source: checkpoint
access:
  commands: none
  cross_context: public_contract_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: projection_source
  name: canonicalObject
  on_delete: tombstone
  reference_fields:
  - objectId
  target_objects:
  - content.Post
  - entity.Homepage
  - circle.Circle
  - circle.CircleGroup
  - user.Persona
