description: RecommendationSignalFact 只由 Search 请求与反馈事实的本地终态归并追加。
api_routes: []
runtime_entrypoints:
- name: AppendRecommendationSignal
  kind: internal_port
  phase: transactional_append
  source_objects:
  - search.SearchRequestFact
  - search.SearchFeedbackFact
  idempotency: identity_payload_digest
  application:
    kind: command
    facet: RecommendationSignalFactAppender
    method: append
    object_owner: RecommendationSignalFact

readiness_cases:
- case_id: append-recommendation-signal-local
  spec_ref: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-storage-topology-and-elasticity/spec.md#gwt-004
  producer: service
  layer: local_contract
  target: {kind: operation, id: AppendRecommendationSignal}
  runner_source_path: quwoquan_service/services/search-service/tests/local_contract/search/recommendation_signal_fact/search_signal_publisher__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: append-recommendation-signal-api
  spec_ref: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-storage-topology-and-elasticity/spec.md#gwt-004
  producer: service
  layer: api_integration
  target: {kind: operation, id: AppendRecommendationSignal}
  runner_source_path: quwoquan_service/services/search-service/tests/api_integration/search/recommendation_signal_fact/search_signal_stream__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: redis, digest_binding: candidate}
