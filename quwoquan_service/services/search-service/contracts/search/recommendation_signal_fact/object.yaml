kind: append_only_fact
description: 一次搜索会话完成后由 Search 聚合点击与停留结果追加的不可变推荐信号事实。
lifecycle:
  immutable: true
identity:
  fields:
  - signalId
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: query
  on_delete: retain
  reference_fields:
  - searchRequestId
  target_object: search.SearchRequestFact
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: persona
  on_delete: retain
  reference_fields:
  - userId
  target_object: user.Persona
- access: event
  cardinality: N:N
  consistency: eventual
  kind: event_source
  name: clickedObjects
  on_delete: retain
  reference_fields:
  - engagedObjectIds
  target_objects:
  - content.Post
  - content.Comment
  - circle.Circle
  - entity.Homepage
  - chat.Conversation
  - chat.Message
  - user.Persona
  - integration.Location
local_identity_reasons:
  sessionId: runtime session correlation key injected by OperationInvocationContext, not an aggregate
    reference
search_policy:
  exposed: none
  not_exposed_reason: "追加事实只服务于后台聚合、审计与回放，不构成用户可检索的对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "原始行为与遥测事实不对小趣开放；小趣只读所属域的公开投影结果。"
business_rules:
- 信号只从已落盘 SearchRequestFact 与 SearchFeedbackFact 汇总，禁止请求期直接写 Recommendation 存储。
- 同一 searchRequestId 只产生一个终态信号，重放必须保持 payload digest 相同。
- Recommendation 仅经 typed event 消费该事实，Search 不调用其私有 Store。
