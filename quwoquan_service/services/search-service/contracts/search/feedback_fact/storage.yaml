backend: mongodb
role: append_only
collections:
  search_feedback_events:
    entity: FeedbackFact
    indexes:
    - name: idx_search_feedback_request
      keys:
        searchRequestId: 1
        createdAt: -1
    - name: idx_search_feedback_viewer_created
      keys:
        viewerId: 1
        createdAt: -1
    - name: uq_search_feedback_dedupe
      keys:
        searchRequestId: 1
        eventType: 1
        objectId: 1
      unique: true
    - name: idx_search_feedback_object
      keys:
        objectId: 1
        eventType: 1
        createdAt: -1
    ttl:
      field: createdAt
      seconds: 7776000
  search_feedback_command_receipts:
    entity: SearchFeedbackCommandReceipt
    role: authoritative
    indexes:
    - name: idx_search_feedback_receipt_viewer_created
      keys:
        viewerId: 1
        createdAt: -1
    - name: idx_search_feedback_receipt_request
      keys:
        searchRequestId: 1
    - name: idx_search_feedback_receipt_expiry
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
  search_feedback_signal_deliveries:
    entity: SearchFeedbackSignalDelivery
    role: authoritative
    indexes:
    - name: idx_search_feedback_signal_delivery_pending
      keys:
        status: 1
        leaseExpiresAt: 1
        createdAt: 1
    - name: idx_search_feedback_signal_delivery_expiry
      keys:
        expiresAt: 1
      expireAfterSeconds: 0
