  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
  reference: true
- name: viewerId
  source: viewerId
  type: string
  constraints:
  - NULLABLE
  classification: PII
  log_policy: hash
  api_exposure: none
  ops_exposure: read
