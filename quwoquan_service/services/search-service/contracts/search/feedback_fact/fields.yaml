description: 搜索结果交互反馈事件，驱动排序信号(CTR/停留)与去位置偏置
fields:
- name: _id
  source: _id
  type: ObjectId
  constraints:
  - PK
  classification: PUBLIC
  log_policy: allow
  api_exposure: read
  ops_exposure: read
  role: append_only_fact
- name: searchRequestId
  source: searchRequestId
  type: string
  constraints:
