  role: append_only_fact
- name: objectId
  source: objectId
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
  reference: true
- name: target
  source: target
  type: string
  constraints:
  - NULLABLE
  classification: PUBLIC
  log_policy: allow
  api_exposure: read_write
  ops_exposure: read
  role: append_only_fact
  reference: true
- name: rankPosition
  source: rankPosition
