kind: append_only_fact
description: FeedbackFact 的领域对象契约。
lifecycle:
  immutable: true
identity:
  fields:
  - _id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: query
  on_delete: retain
  reference_fields:
  - searchRequestId
  target_object: search.SearchQuery
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: targetObject
  on_delete: tombstone
  reference_fields:
  - target
  - objectId
  target_objects:
  - content.Post
  - content.Comment
  - circle.Circle
  - entity.Homepage
  - chat.Conversation
  - chat.Message
  - user.Persona
  - integration.Location
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: viewerPersona
  on_delete: retain
  reference_fields:
  - viewerId
  target_object: user.Persona
local_identity_reasons:
  feedRequestId: immutable correlation or idempotency key scoped to this fact or command; it is not a
    business-object reference
