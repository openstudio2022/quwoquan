read_model: RecentSearchEntryWire
description: '最近搜索条目 wire（ListRecentSearches / UpsertRecentSearch 响应体）。

  entryId 由服务端从语义键（scope + facet + normalized query）派生。

  '
source_entities:
- RecentSearchState
consumers:
- app
fields:
- {name: entryId, type: string, nullable: false}
- {name: query, type: string, nullable: false}
- {name: scope, type: string, nullable: false}
- {name: facet, type: string, nullable: true}
- {name: updatedAt, type: timestamp, nullable: false}
