description: 'RecentSearchState 对象专属 packet。最近搜索是搜索体验域的 persona 有界状态：

  entries 按归一化语义键（scope + facet + normalized query）去重，entryId 由服务端

  从语义键派生（sha256），客户端不生成也不提交条目标识以外的版本信息；

  并发由服务端内部 version CAS + Idempotency-Key receipt 承载。

'
commercial_defaults:
  status: blocked
  block_reason: search-service 对象专属 Store/transport 与 App typed port 装配中；beta/gamma 环境证据未取得
  gap_id: SEARCH_RECENT_STATE_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: GET
    path: /search/recent
    operation: ListRecentSearches
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: RecentSearchQueryFacade
      method: listRecentSearches
      reader: ListRecentSearchesReader
      slice: ListRecentSearchesSlice
    authorization:
      principal: persona
      ownership_policy: owner_persona
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - SEARCH.SYSTEM.recent_storage_failed
    privacy:
      request_classification: INTERNAL
      response_classification: PII
      log_policy: metadata_only
    telemetry:
      metric: search_recent_list
      trace: true
      attributes:
        - scope
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 获取当前 Persona 的有界最近搜索状态（按最近使用倒序）
    request_bindings:
      query:
        - name: scope
          field: scope
          required: false
    response_entity: RecentSearchEntrySlice
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ListRecentSearchesQuery
    request_body_kind: none
  - method: POST
    path: /search/recent
    operation: UpsertRecentSearch
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: RecentSearchCommandFacade
      method: upsertRecentSearch
      aggregate_owner: RecentSearchState
      mutation_target: RecentSearchState
      invariant_target: RecentSearchState
    authorization:
      principal: persona
      ownership_policy: owner_persona
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - SEARCH.USER.recent_invalid_argument
      - SEARCH.USER.recent_version_conflict
      - SEARCH.USER.recent_idempotency_conflict
      - SEARCH.SYSTEM.recent_storage_failed
    privacy:
      request_classification: PII
      response_classification: PII
      log_policy: metadata_only
    telemetry:
      metric: search_recent_upsert
      trace: true
      attributes:
        - scope
        - outcome
        - replayed
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: '记录或提升一条最近搜索。entryId 由服务端从语义键派生并返回；同语义键重复

      提交为命名 set 操作，服务端内部 CAS 有限重放，公开请求不携带版本字段。

'
    request_entity: UpsertRecentSearchCommand
    response_entity: RecentSearchEntryWire
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_body_kind: object
  - method: DELETE
    path: /search/recent/{entryId}
    operation: DeleteRecentSearch
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: RecentSearchCommandFacade
      method: deleteRecentSearch
      aggregate_owner: RecentSearchState
      mutation_target: RecentSearchState
      invariant_target: RecentSearchState
    authorization:
      principal: persona
      ownership_policy: owner_persona
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - SEARCH.USER.recent_entry_not_found
      - SEARCH.USER.recent_version_conflict
      - SEARCH.USER.recent_idempotency_conflict
      - SEARCH.SYSTEM.recent_storage_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: search_recent_delete
      trace: true
      attributes:
        - outcome
        - replayed
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    request_bindings:
      path:
        - name: entryId
          field: entryId
    description: 删除单条最近搜索记录；目标已不存在时按 no-op receipt 重放安全处理
    response_entity: RecentSearchCommandAck
    response_body_kind: ack
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: DeleteRecentSearchCommand
    request_body_kind: none
  - method: DELETE
    path: /search/recent
    operation: ClearRecentSearches
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: RecentSearchCommandFacade
      method: clearRecentSearches
      aggregate_owner: RecentSearchState
      mutation_target: RecentSearchState
      invariant_target: RecentSearchState
    authorization:
      principal: persona
      ownership_policy: owner_persona
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - SEARCH.USER.recent_version_conflict
      - SEARCH.USER.recent_idempotency_conflict
      - SEARCH.SYSTEM.recent_storage_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: search_recent_clear
      trace: true
      attributes:
        - scope
        - outcome
        - replayed
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 清空当前 Persona 最近搜索记录（可按 scope 收窄）；已清空时 no-op receipt 重放安全
    request_bindings:
      query:
        - name: scope
          field: scope
          required: false
    response_entity: RecentSearchCommandAck
    response_body_kind: ack
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    request_entity: ClearRecentSearchesCommand
    request_body_kind: none
consumers:
  - name: app
    capabilities:
      - list_recent_searches
      - upsert_recent_search
      - delete_recent_search
      - clear_recent_searches
contract_test:
  test_strategy:
    service_side:
      description: 真实 Mongo（testcontainers）验证 CAS、bounded entries、receipt 重放
      real_engines:
        mongodb: testcontainers (mongo:7)
      scenarios:
        - name: recent_upsert_cas_and_receipt
          command: UpsertRecentSearch(replay same Idempotency-Key)
          assertions:
            - 同语义键重复 upsert 只保留一条 entry 并提升顺序
            - 相同 Idempotency-Key 重放返回首次结果
            - entries 数量不超过上限，最旧条目被淘汰

