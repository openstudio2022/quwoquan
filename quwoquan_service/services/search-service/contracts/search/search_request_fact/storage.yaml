backend: mongodb
collections:
  search_queries:
    entity: SearchRequestFact
    indexes:
    - name: idx_search_queries_request
      keys:
        searchRequestId: 1
      unique: true
    - name: idx_search_queries_created
      keys:
        createdAt: -1
    - name: idx_search_queries_query_created
      keys:
        query: 1
        createdAt: -1
    - name: idx_search_queries_viewer_created
      keys:
        viewerId: 1
        createdAt: -1
    ttl:
      field: createdAt
      seconds: 7776000
  search_user_account_closed_inbox:
    entity: UserAccountClosedProjectionInbox
    role: append_only
    description: 'Search 对 UserAccountClosed 的 eventId+digest 幂等 inbox；与私有搜索状态、 查询日志、反馈事实和受影响热词删除在同一 Mongo
      transaction 提交。

      '
    indexes:
    - name: idx_search_user_account_closed_applied
      keys:
        appliedAt: -1
  search_user_account_closed_failures:
    entity: UserAccountClosedProjectionFailure
    role: append_only
    description: pending reclaim 的有限重试状态，只保存 source stream/message reference、
      event/error digest、attempts 与时间戳，禁止保存 payload 或主体标识。普通失败由 expireAt
      回收；terminal DLQ marker 必须移除 expireAt，保留原 source PEL 直到受控恢复。
    indexes:
    - name: idx_search_user_account_closed_failure_event
      keys:
        eventDigest: 1
    - name: ttl_search_user_account_closed_failures
      keys:
        expireAt: 1
      expireAfterSeconds: 0
external_read_index:
  backend: elasticsearch
  index: quwoquan_objects
  note: 派生检索读库，由 search-service indexer 从各业务域 change-stream 灌入；可重建/回放。
derived_read_models:
  rm_search_term_heat:
    backend: mongodb
    entity: SearchTermHeatView
    description: 搜索词热力/相关性聚合（词频 + 时间衰减 + CTR 加权 + query→点击对象相关性）
    write_source:
    - search_queries
    - search_feedback_events
    indexes:
    - name: idx_search_term_heat_term
      keys:
        normalizedTerm: 1
      unique: true
    - name: idx_search_term_heat_relevance
      keys:
        relevance: -1
    - name: idx_search_term_heat_ttl
      keys:
        updatedAt: 1
    ttl:
      field: updatedAt
      seconds: 86400
role: append_only
