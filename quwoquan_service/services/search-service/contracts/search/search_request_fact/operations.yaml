commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: SEARCH_QUERY_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: SearchRequestFact 的查询热力读模型入口；不拥有搜索执行与结果生命周期。
externalDependencies:
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [appendDurable, consumeDurable]
    scenes: [general]
api_routes:
  - method: GET
    path: /search/hot-queries
    operation: ListHotQueries
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: public_search_discovery
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    pagination:
      default_items: 10
      maximum_items: 20
    error_codes:
      - SEARCH.USER.hot_query_invalid_argument
      - SEARCH.MIDDLEWARE.hot_query_unavailable
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: search_hot_queries
      trace: true
      attributes:
        - outcome
        - result_count
    slo:
      latency_p95_ms: 500
      availability_percent: 99.5
    application:
      kind: query
      facet: SearchHotQueryFacade
      method: listHotQueries
      reader: TermHeatReader
      slice: HotQuerySlice
    description: 返回 search term-heat 读模型中全局 relevance 最高的搜索词，供默认页「猜你想搜」展示
    request_bindings:
      query:
        - name: limit
          field: limit
    response_entity: SearchTermHeatSlice
    response_fields:
      - query
      - relevance
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: ListHotQueriesQuery
    request_body_kind: none
  - method: POST
    path: /internal/search/account-closure/dead-letters:recover
    operation: RecoverSearchAccountClosureDeadLetter
    actor: none
    application:
      kind: command
      facet: SearchRequestAccountClosureRecoveryCommandFacet
      method: recoverDeadLetter
      lifecycle_owner: SearchRequestFact
      mutation_target: SearchRequestFact
      invariant_target: SearchRequestFact
    authorization:
      principal: operator
      scopes:
        - ops.account_closure.write
      permissions:
        - search.account_closure.recover
      ownership_policy: service_owned_projection_delivery
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - SEARCH.USER.invalid_argument
      - SEARCH.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: search_account_closure_dead_letter_recover
      trace: true
      attributes:
        - outcome
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    request_entity: SearchAccountClosureDeadLetterRecoveryRequest
    request_body_kind: object
    response_entity: SearchAccountClosureDeadLetterRecoveryAccepted
    response_body_kind: object
    success_status: 202
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
    description: operator 只释放 SearchRequestFact 消费链的 terminal marker，使原 events.user.account PEL 重新进入有限重试；禁止从脱敏 DLQ 重建 payload。
consumers:
  - name: app
    capabilities:
      - hot_queries
contract_test:
  test_strategy:
    service_side:
      description: 使用 Mongo 真实读模型验证 term-heat 查询与有界返回。
      real_engines:
        mongodb: required
      scenarios:
        - name: list_hot_queries
          command: ListHotQueries
          assertions:
            - relevance_order_is_stable
            - limit_is_bounded

