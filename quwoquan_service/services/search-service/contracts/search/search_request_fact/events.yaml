events:
- name: SearchQueryLogged
  description: 一次搜索请求被记录，进入查询日志用于搜索词热力聚合（事实即存储，无独立事件通道）
  delivery_semantics: not_published
  payload_entity: SearchRequestFact
  payload_fields:
  - searchRequestId
  - query
  - mode
  - objectTypes
  - resultCount
  - experimentBucket
  - createdAt
  no_consumer_reason: SearchRequestFact 本身即 append-only 查询日志；热词聚合直接读取事实集合。
- name: SearchFeedbackRecorded
  description: 搜索结果交互反馈被记录，驱动 CTR/停留信号与去位置偏置（事实即存储，无独立事件通道）
  delivery_semantics: not_published
  payload_entity: SearchFeedbackFact
  payload_fields:
  - searchRequestId
  - eventType
  - objectId
  - target
  - rankPosition
  - referralSource
  - feedRequestId
  - dwellMs
  - createdAt
  no_consumer_reason: SearchFeedbackFact 本身即 append-only 反馈记录；排序评测直接读取事实集合。
