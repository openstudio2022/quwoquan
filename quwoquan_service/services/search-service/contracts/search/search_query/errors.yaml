entity: SearchQuery
domain: SEARCH
errors:
- code: SEARCH.USER.invalid_argument
  kind: USER
  reason: invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [SearchQuery, ListHotQueries, search.feedback_fact.ReportSearchFeedback, search.recent_search_state.RecoverSearchAccountClosureDeadLetter, search.recent_search_state.UpsertRecentSearch]
  recovery_action: surface
  dart_const: searchInvalidArgument
  go_const: ErrSearchInvalidArgument
  user_message:
    zh: 搜索请求格式不正确
    en: Invalid search request
- code: SEARCH.MIDDLEWARE.unavailable
  kind: MIDDLEWARE
  reason: unavailable
  http_status: 503
  emitted_by:
  - surface: http
    operations: [SearchQuery, ListHotQueries]
  recovery_action: retry
  recovery_after_seconds: 5
  dart_const: searchUnavailable
  go_const: ErrSearchUnavailable
  user_message:
    zh: 搜索暂时不可用，请稍后再试
    en: Search is temporarily unavailable, please retry later
