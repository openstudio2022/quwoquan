description: 一次搜索请求的查询日志，用于搜索词热力与 relevance 评测
fields:
  - name: _id
    source: _id
    type: ObjectId
    constraints:
      - PK
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
  - name: searchRequestId
    source: searchRequestId
    type: string
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 单次搜索请求 ID，串联 impression/click/dwell 等反馈与排序观测
    role: append_only_fact
  - name: query
    source: query
    type: string
    constraints:
      - NOT_NULL
    classification: PII
    log_policy: deny
    api_exposure: read
    ops_exposure: read
    description: 归一化后的私有查询词串；仅用于搜索质量计算，禁止原文日志
    role: append_only_fact
  - name: mode
    source: mode
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: suggest 或 result
    role: append_only_fact
  - name: viewerId
    source: viewerId
    type: string
    constraints:
      - NULLABLE
    classification: PII
    log_policy: hash
    api_exposure: none
    ops_exposure: read
    description: 登录态用户 ID，仅用于会话级个性化与去偏，匿名态为空
    role: append_only_fact
    reference: true
  - name: objectTypes
    source: objectTypes
    type: '[]string'
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
  - name: resultCount
    source: resultCount
    type: int
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
  - name: experimentBucket
    source: experimentBucket
    type: string
    constraints:
      - NULLABLE
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
  - name: createdAt
    source: createdAt
    type: timestamp
    constraints:
      - NOT_NULL
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    role: append_only_fact
types:
  CanonicalSearchEvidence:
    description: 命中证据，不包含原始私有 query。
    fields:
      - name: field
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: snippet
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  CanonicalSearchRankReason:
    description: 服务端排序理由与权重。
    fields:
      - name: code
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: label
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: weight
        type: float64
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  CanonicalSearchGeoPoint:
    description: 搜索命中的 WGS84 坐标。
    fields:
      - name: lat
        type: float64
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: lng
        type: float64
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  CanonicalSearchIntersectionReason:
    description: 由统一交集真相源附加的只读理由。
    fields:
      - {name: primaryText, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: intersectionId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: dimension, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: class, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: sourceRef, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  CanonicalSearchContentHit:
    description: content.post 命中的强类型展示切片；不得再从 payload 二次组装 Post。
    fields:
      - {name: postId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: contentIdentity, type: enum, enum_ref: ContentIdentity, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: title, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: summary, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: coverUrl, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: authorId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: authorDisplayName, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: authorAvatarUrl, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: categoryId, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: subCategory, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: likeCount, type: int, constraints: [NOT_NULL, DEFAULT_0], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
      - {name: publishedAt, type: timestamp, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read}
  HotQueryView:
    description: 搜索词热力读模型的商用展示切片，供全局搜索默认页「猜你想搜」使用
    fields:
      - name: query
        type: string
        constraints:
          - NOT_NULL
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: relevance
        type: float64
        constraints:
          - NOT_NULL
          - DEFAULT_0
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
  UserAccountClosedProjectionInbox:
    description: Search 已原子应用 UserAccountClosed 的不可逆幂等凭据，不保存账号或 persona 原值。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
        classification: INTERNAL
        log_policy: hash
        api_exposure: none
        ops_exposure: read
      - name: eventDigest
        type: string
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: hash
        api_exposure: none
        ops_exposure: read
      - name: appliedAt
        type: timestamp
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: allow
        api_exposure: none
        ops_exposure: read
  UserAccountClosedProjectionFailure:
    description: Search 账户关闭投影的有限重试状态，仅保存不可逆事件与错误摘要；terminal marker 由受控 recovery 删除，不能被普通 TTL 自动释放。
    fields:
      - name: _id
        type: string
        constraints:
          - PK
          - NOT_NULL
        classification: INTERNAL
        log_policy: hash
        api_exposure: none
        ops_exposure: read
      - name: eventDigest
        type: string
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: hash
        api_exposure: none
        ops_exposure: read
      - name: errorDigest
        type: string
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: hash
        api_exposure: none
        ops_exposure: read
      - name: attempts
        type: int64
        constraints:
          - NOT_NULL
          - DEFAULT_0
        classification: INTERNAL
        log_policy: allow
        api_exposure: none
        ops_exposure: read
      - name: createdAt
        type: timestamp
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: allow
        api_exposure: none
        ops_exposure: read
      - name: updatedAt
        type: timestamp
        constraints:
          - NOT_NULL
        classification: INTERNAL
        log_policy: allow
        api_exposure: none
        ops_exposure: read
      - name: expireAt
        type: timestamp
        constraints:
          - NULLABLE
        classification: INTERNAL
        log_policy: allow
        api_exposure: none
        ops_exposure: read
      - name: deadLetteredAt
        type: timestamp
        constraints:
          - NULLABLE
        classification: INTERNAL
        log_policy: allow
        api_exposure: none
        ops_exposure: read
  ListHotQueriesQuery:
    fields:
      - name: limit
        type: int
        client_dart_type: int
  CanonicalSearchQuery:
    fields:
      - name: sessionId
        type: string
        constraints:
          - NULLABLE
        description: 匿名搜索的稳定会话身份；通过 X-Session-Id header 传入，登录态使用可信 principal，禁止用逐请求 requestId 重分桶
        client_dart_type: String?
        client_normalization: trim_to_null
      - name: query
        type: string
        constraints:
          - NOT_BLANK
        client_dart_type: String
        client_normalization: trim
      - name: mode
        type: string
        enum_ref: CanonicalSearchMode
        client_dart_type: CanonicalSearchMode
        client_default: CanonicalSearchMode.result
        client_wire: canonicalEnum
      - name: objectTypes
        type: '[]string'
        client_dart_type: List<String>
        client_parameter_type: Iterable<String>
        client_default: const <String>[]
        client_normalization: trim_drop_empty
      - name: ids
        type: '[]string'
        client_dart_type: List<String>
        client_parameter_type: Iterable<String>
        client_default: const <String>[]
        client_normalization: trim_drop_empty
        client_omit_empty: true
      - name: limit
        type: int
        client_dart_type: int
        client_default: "20"
enums:
  CanonicalSearchMode:
    values: [suggest, result]
