commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: SEARCH_QUERY_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: '云侧统一搜索服务。承载 canonical search(request) 的 POST /search

  （mode=suggest|result）与 POST /search/feedback，复用 runtime/search.Retrieve

  单趟跨类型排序；召回后端 ES 主 + native 透明回退（FallbackBackend）。

  '
externalDependencies:
- role: use
  capability: runtime.message.transport
  port: MessageTransportPort
  operations: [appendDurable, consumeDurable]
  scenes: [general]
api_routes:
- method: POST
  path: /search
  operation: SearchQuery
  actor: none
  commercial:
    status: ready
  authorization:
    principal: public
    ownership_policy: public_search_discovery
  reliability:
    timeout_ms: 6000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: optional
  error_codes:
  - SEARCH.USER.invalid_argument
  - SEARCH.MIDDLEWARE.unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: PUBLIC
    log_policy: metadata_only
  telemetry:
    metric: search_query
    trace: true
    attributes:
    - mode
    - target_count
    - outcome
  slo:
    latency_p95_ms: 1500
    availability_percent: 99.5
  security:
    auth_mode: optional
    principal: public
    token_transport: bearer
    anonymous_policy: allow
    visibility: public
  application:
    kind: query
    facet: SearchFacade
    method: search
    reader: ObjectSearchReader
    slice: SearchResponseView
  client_contract:
    dart_import: ../search/search_query_contracts.dart
    request_type: CanonicalSearchQuery
    response_type: CanonicalSearchResult
    request_encoder: encodeCanonicalSearchQuery
    response_decoder: decodeCanonicalSearchResult
  description: 统一对象检索（mode=suggest|result）；query 为主输入，objectTypes/filters 为受控收窄条件
  request_entity: SearchQuery
  writable_fields:
  - query
  - mode
  - objectTypes
  - limit
  response_entity: SearchResponseView
- method: GET
  path: /search/hot-queries
  operation: ListHotQueries
  actor: none
  commercial:
    status: ready
  authorization:
    principal: public
    ownership_policy: public_search_discovery
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
  - SEARCH.USER.invalid_argument
  - SEARCH.MIDDLEWARE.unavailable
  privacy:
    request_classification: PUBLIC
    response_classification: PUBLIC
    log_policy: metadata_only
  telemetry:
    metric: search_hot_queries
    trace: true
    attributes:
    - outcome
    - result_count
  slo:
    latency_p95_ms: 500
    availability_percent: 99.5
  application:
    kind: query
    facet: SearchHotQueryFacade
    method: listHotQueries
    reader: TermHeatReader
    slice: HotQuerySlice
  description: 返回 search term-heat 读模型中全局 relevance 最高的搜索词，供默认页「猜你想搜」展示
  query_params:
  - limit
  response_entity: HotQueryView
  response_fields:
  - query
  - relevance
  client_contract:
    dart_import: ../search/hot_query_contracts.dart
    request_type: ListHotQueriesQuery
    response_type: HotQuerySlice
    request_encoder: encodeListHotQueriesQuery
    response_decoder: decodeHotQuerySlice
  security:
    auth_mode: optional
    principal: public
    token_transport: bearer
    anonymous_policy: allow
    visibility: public
consumers:
- name: app
  capabilities:
  - search
  - suggest
- name: assistant-service
  capabilities:
  - search
contract_test:
  mock_strategy:
    app_side:
      mock_target: search-service API
      scenarios:
      - name: search_result
        route: POST /search
        assertions:
        - status_200
        - hits_match_schema
      - name: report_feedback
        route: POST /search/feedback
        assertions:
        - status_202
        - feedback_accepted
    service_side:
      description: 使用 ES httptest 替身 + native 回退；不 mock runtime/search 排序
      real_engines:
        elasticsearch: httptest fake (search_test)
      spy_targets:
      - event_publisher
      scenarios:
      - name: retrieve_with_es_then_fallback
        command: SearchQuery(es_ok) -> SearchQuery(es_down -> native fallback)
        assertions:
        - es-backed hits returned when ES healthy
        - native fallback hits returned when ES unavailable
