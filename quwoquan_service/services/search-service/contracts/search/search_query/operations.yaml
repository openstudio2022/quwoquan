commercial_defaults:
  status: blocked
  block_reason: canonical operation awaits object-centered commercial migration
  gap_id: SEARCH_QUERY_COMMERCIAL_EVIDENCE
  target_story: app-cloud-business-object-commercial-closure
description: '云侧统一搜索服务。承载 canonical search(request) 的 POST /search

  （mode=suggest|result）与 POST /search/feedback，复用 runtime/search.Retrieve

  单趟跨类型排序；生产召回只使用 Elasticsearch/OpenSearch 派生读库。 ES 不可用时返回结构化不可用，不得回退到第二召回后端。

'
externalDependencies:
  - role: use
    capability: runtime.message.transport
    port: MessageTransportPort
    operations: [appendDurable, consumeDurable]
    scenes: [general]
api_routes:
  - method: POST
    path: /search
    operation: SearchQuery
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: public_search_discovery
    reliability:
      timeout_ms: 6000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes:
      - SEARCH.USER.invalid_argument
      - SEARCH.MIDDLEWARE.unavailable
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: search_query
      trace: true
      attributes:
        - mode
        - target_count
        - outcome
    slo:
      latency_p95_ms: 1500
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: SearchFacade
      method: search
      reader: ObjectSearchReader
      slice: SearchResponseView
    client_contract:
      dart_import: ../search/search_query_contracts.dart
      response_type: CanonicalSearchResult
      response_decoder: decodeCanonicalSearchResult
    description: 统一对象检索（mode=suggest|result）；query 为主输入，objectTypes/filters 为受控收窄条件
    request_entity: CanonicalSearchQuery
    response_entity: SearchResponseView
    request_body_kind: object
    request_bindings:
      header:
        - name: X-Session-Id
          field: sessionId
          required: false
  - method: GET
    path: /search/hot-queries
    operation: ListHotQueries
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: public_search_discovery
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    pagination:
      default_items: 10
      maximum_items: 20
    error_codes:
      - SEARCH.USER.invalid_argument
      - SEARCH.MIDDLEWARE.unavailable
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: search_hot_queries
      trace: true
      attributes:
        - outcome
        - result_count
    slo:
      latency_p95_ms: 500
      availability_percent: 99.5
    application:
      kind: query
      facet: SearchHotQueryFacade
      method: listHotQueries
      reader: TermHeatReader
      slice: HotQuerySlice
    description: 返回 search term-heat 读模型中全局 relevance 最高的搜索词，供默认页「猜你想搜」展示
    request_bindings:
      query:
        - name: limit
          field: limit
    response_entity: HotQueryView
    response_fields:
      - query
      - relevance
    client_contract:
      dart_import: ../search/hot_query_contracts.dart
      response_type: HotQuerySlice
      response_decoder: decodeHotQuerySlice
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    request_entity: ListHotQueriesQuery
    request_body_kind: none
consumers:
  - name: app
    capabilities:
      - search
      - suggest
  - name: assistant-service
    capabilities:
      - search
contract_test:
  mock_strategy:
    app_side:
      mock_target: search-service API
      scenarios:
        - name: search_result
          route: POST /search
          assertions:
            - status_200
            - hits_match_schema
        - name: report_feedback
          route: POST /search/feedback
          assertions:
            - status_202
            - feedback_accepted
    service_side:
      description: 使用 ES HTTP 契约替身验证 wire adapter，确定性内存 backend 仅验证 runtime/search 排序；生产组合只允许 ES 单轨
      real_engines:
        elasticsearch: httptest fake (search_test)
      spy_targets:
        - event_publisher
      scenarios:
        - name: retrieve_with_single_es_backend
          command: SearchQuery(es_ok) -> SearchQuery(es_down)
          assertions:
            - es-backed hits returned when ES healthy
            - structured 503 returned when ES unavailable
            - no secondary recall backend selected
