description: SearchFeedbackFact 幂等追加与持久化失败的对象专属错误语义。
errors:
- code: SEARCH.USER.feedback_invalid_argument
  reason: feedback_invalid_argument
  http_status: 400
  emitted_by:
  - surface: http
    operations: [ReportSearchFeedback]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: searchFeedbackInvalidArgument
  go_const: ErrSearchFeedbackInvalidArgument
  user_message:
    zh: 搜索反馈格式不正确
    en: Invalid search feedback
- code: SEARCH.USER.feedback_conflict
  reason: feedback_conflict
  http_status: 409
  emitted_by:
  - surface: http
    operations: [ReportSearchFeedback]
  recovery_action: surface
  disruption_level: inlineCard
  dart_const: searchFeedbackConflict
  go_const: ErrSearchFeedbackConflict
  user_message:
    zh: 该搜索反馈已记录
    en: This search feedback has already been recorded
- code: SEARCH.SYSTEM.storage_write_failed
  reason: storage_write_failed
  http_status: 500
  emitted_by:
  - surface: http
    operations: [ReportSearchFeedback]
  recovery_action: retry
  disruption_level: snackbar
  recovery_after_seconds: 5
  dart_const: searchStorageWriteFailed
  go_const: ErrSearchStorageWriteFailed
  user_message:
    zh: 搜索反馈暂时无法记录，请稍后重试
    en: Unable to record search feedback, please retry
