- case_id: report-search-feedback-local
  spec_ref: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-storage-topology-and-elasticity/spec.md#gwt-004
  producer: service
  layer: local_contract
  target: {kind: operation, id: ReportSearchFeedback}
  runner_source_path: quwoquan_service/services/search-service/tests/local_contract/search/search_feedback_fact/feedback_signal_idempotency__local_contract_test.go
  executions:
  - {env: alpha, platform: service, device: runner, provider: none, digest_binding: candidate}
- case_id: report-search-feedback-api
  spec_ref: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-storage-topology-and-elasticity/spec.md#gwt-004
  producer: service
  layer: api_integration
  target: {kind: operation, id: ReportSearchFeedback}
  runner_source_path: quwoquan_service/services/search-service/tests/api_integration/search/search_feedback_fact/feedback_contract__api_integration_test.go
  executions:
  - {env: beta, platform: service, device: runner, provider: mongodb, digest_binding: candidate}
- case_id: search_feedback_fact_report_search_feedback_app_local
  spec_ref: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-storage-topology-and-elasticity/spec.md#gwt-004
  producer: app
  layer: local_contract
  target: {kind: operation, id: ReportSearchFeedback}
  runner_source_path: quwoquan_app/test/local_contract/service/search_service/search/search_feedback_fact/search_feedback_remote__local_contract_test.dart
  executions:
  - {env: alpha, platform: app, device: runner, provider: none, digest_binding: candidate}
- case_id: search_feedback_fact_report_search_feedback_app_api
  spec_ref: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-storage-topology-and-elasticity/spec.md#gwt-004
