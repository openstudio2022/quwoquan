kind: append_only_fact
description: 搜索结果曝光、点击、长按与负反馈关联到 SearchRequestFact 的不可变反馈事实。
lifecycle:
  immutable: true
  append_command_admission:
    status: evaluated
    instance_invariant: none
    commands:
      - ReportSearchFeedback
    rationale: 搜索反馈事实追加；约束仅为 (personaId, queryId, feedbackKind) 语义键去重，反馈聚合由离线派生，写入侧无实例级可变不变式。
    evaluated_at: '2026-08-07'
identity:
  fields:
  - _id
  version_source: immutable
access:
  commands: append_only_sink
  cross_context: event_only
  queries: named_reader
relationships:
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: query
  on_delete: retain
  reference_fields:
  - searchRequestId
  target_object: search.SearchRequestFact
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: targetObject
  on_delete: tombstone
  reference_fields:
  - target
  - objectId
  target_objects:
  - content.Post
  - content.Comment
  - circle.Circle
  - entity.Homepage
  - chat.Conversation
  - chat.Message
  - user.Persona
  - integration.Location
- access: event
  cardinality: N:1
  consistency: eventual
  kind: event_source
  name: viewerPersona
  on_delete: retain
  reference_fields:
  - viewerId
  target_object: user.Persona
local_identity_reasons:
  feedRequestId: immutable correlation or idempotency key scoped to this fact or command; it is not a
    business-object reference
search_policy:
  exposed: none
  not_exposed_reason: "追加事实只服务于后台聚合、审计与回放，不构成用户可检索的对象身份。"
assistant_access:
  read:
    mode: none
    scopes: []
  cite:
    mode: none
    scopes: []
  write:
    mode: none
    scopes: []
  denied_reason: "原始行为与遥测事实不对小趣开放；小趣只读所属域的公开投影结果。"
business_rules:
- 每条反馈必须绑定 searchRequestId 与 canonical target reference，客户端不得提交任意对象类型。
- 同一来源行为 eventId 只追加一次，查询服务不得就地修改反馈事实。
- 删除目标只触发引用 tombstone，不删除用于离线 relevance 审计的匿名反馈。
