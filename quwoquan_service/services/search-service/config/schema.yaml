description: 该自治边界的运行配置定义与默认值；环境只维护差异和引用。
configs:
- key: sys.search-service.user_account_security_authority.base_url
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.search-service.user_account_security_authority.timeout_ms
  # 不设默认值：缺失时 authority 客户端构造 fail-closed，四环境必须显式声明。
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.search-service.contentService.baseUrl
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: http://127.0.0.1:18080
- key: sys.search-service.es.embeddingDims
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.search-service.es.enabled
  type: bool
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: false
- key: sys.search-service.es.endpoints
  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: []
- key: sys.search-service.es.index
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: quwoquan_objects
- key: sys.search-service.es.insecureTls
  type: bool
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: false
- key: sys.search-service.es.replicas
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1
- key: sys.search-service.es.requestTimeoutMs
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 800
- key: sys.search-service.es.shards
  # 分片策略（search-storage-topology REQ-007）：单主分片消除跨分片 IDF 评分抖动，
  # 当前数据量远低于官方单分片 10-50GB 区间下限；QPS 增长加副本，数据量逼近
  # 单分片上限时经 split/alias 重建扩分片。
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1
- key: sys.search-service.es.synonyms
  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: []
- key: sys.search-service.mongo.database
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: quwoquan
- key: sys.search-service.mongo.uri
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.search-service.ranking.termHeatBoost
  type: float
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1.5
- key: sys.search-service.redis.general.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: ''
- key: sys.search-service.redis.general.addrs
  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: []
- key: sys.search-service.redis.general.db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  # 跨服务 durable 事实流的发布/消费方必须共用同一 db（运行时事实为 db0）；
  # 共享单实例时 scene 隔离靠 key 前缀而非 db。
  default: 0
- key: sys.search-service.redis.general.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.search-service.redis.general.password
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.search-service.redis.general.pool.dial_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 500
- key: sys.search-service.redis.general.pool.min_idle
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.search-service.redis.general.pool.read_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 200
- key: sys.search-service.redis.general.pool.size
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.search-service.redis.general.pool.write_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 200
- key: sys.search-service.redis.general.tls
  type: bool
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: false
- key: sys.search-service.redis.rec.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: ''
- key: sys.search-service.redis.rec.addrs
  type: list
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: []
- key: sys.search-service.redis.rec.db
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.search-service.redis.rec.mode
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
- key: sys.search-service.redis.rec.password
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: true
- key: sys.search-service.redis.rec.pool.dial_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 500
- key: sys.search-service.redis.rec.pool.min_idle
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.search-service.redis.rec.pool.read_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 100
- key: sys.search-service.redis.rec.pool.size
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 0
- key: sys.search-service.redis.rec.pool.write_timeout_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 100
- key: sys.search-service.redis.rec.tls
  type: bool
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: false
- key: sys.search-service.serving.max_inflight
  # 单实例在途并发上界：ES 变慢时主动以 typed 503 卸载，而不是堆积到实例崩溃。
  # 默认值沿用迁移前的启动期取值；observability/slo/search_slo.yaml 的
  # load_model 按容量档给出 100-150 的规划值，收敛到哪一档由容量评审决定，
  # 现在可按环境覆盖而不必改代码。
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 256
- key: sys.search-service.serving.related_terms_cache_max
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 1024
- key: sys.search-service.serving.related_terms_cache_ttl_ms
  type: int
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: 2000
- key: sys.search-service.service.http.addr
  type: string
  scope: workload
  reload: restart
  rollout: progressive
  sensitive: false
  default: :18095
