services:
  postgres:
    image: "${LOCAL_GAMMA_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}"
    environment:
      POSTGRES_USER: quwoquan
      POSTGRES_PASSWORD: quwoquan
      POSTGRES_DB: quwoquan
    ports:
      - "${LOCAL_GAMMA_POSTGRES_PORT:-19400}:5432"
    volumes:
      - local-gamma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quwoquan"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "${LOCAL_GAMMA_MONGO_CACHE_SIZE_GB:-0.25}",
      ]
    ports:
      - "${LOCAL_GAMMA_MONGO_PORT:-19410}:27017"
    volumes:
      - local-gamma-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: "${LOCAL_GAMMA_MONGO_IMAGE:-docker.io/library/mongo:7-jammy}"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
          }
        '
    restart: "no"

  redis:
    image: "${LOCAL_GAMMA_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LOCAL_GAMMA_REDIS_PORT:-19420}:6379"
    volumes:
      - local-gamma-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rec-model-service:
    # 对外 DNS 名与 prod K8s Service 统一为 recommendation-service；rec-model-service 仅作工件名/兼容别名。
    networks:
      default:
        aliases:
          - recommendation-service
          - rec-model-service
    image: "${LOCAL_GAMMA_RECOMMENDATION_SERVICE_IMAGE:-localhost/quwoquan_service_rec-model-service:latest}"
    build:
      context: ..
      dockerfile: quwoquan_service/services/rec-model-service/Dockerfile
      args:
        PYTHON_BASE_IMAGE: "${LOCAL_GAMMA_PYTHON_BASE_IMAGE:-python:3.11}"
        PIP_INDEX_URL: "${LOCAL_GAMMA_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${LOCAL_GAMMA_PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
    environment:
      SERVICE_NAME: recommendation-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DATABASE: quwoquan_content
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      PYTHONUNBUFFERED: "1"
      MODEL_CACHE_DIR: /app/cache
      REC_MODEL_UVICORN_WORKERS: "${LOCAL_GAMMA_REC_MODEL_WORKERS:-2}"
      REC_MODEL_SCORE_CACHE_TTL_MS: "${LOCAL_GAMMA_REC_MODEL_SCORE_CACHE_TTL_MS:-500}"
      REC_MODEL_SCORE_CACHE_MAX_ENTRIES: "${LOCAL_GAMMA_REC_MODEL_SCORE_CACHE_MAX_ENTRIES:-4096}"
      REC_MODEL_MICROBATCH_WINDOW_MS: "${LOCAL_GAMMA_REC_MODEL_MICROBATCH_WINDOW_MS:-2}"
      REC_MODEL_FEATURE_BUDGET_MS: "${LOCAL_GAMMA_REC_MODEL_FEATURE_BUDGET_MS:-20}"
      REC_MODEL_MODEL_BUDGET_MS: "${LOCAL_GAMMA_REC_MODEL_MODEL_BUDGET_MS:-80}"
      REC_MODEL_RETRY_BUDGET_MS: "${LOCAL_GAMMA_REC_MODEL_RETRY_BUDGET_MS:-15}"
      REC_MODEL_GUARDRAIL_MODE: suggest_only
    ports:
      - "${LOCAL_GAMMA_REC_MODEL_PORT:-19240}:8000"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
      - local-gamma-model-cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 5

  content-service:
    image: "${LOCAL_GAMMA_CONTENT_SERVICE_IMAGE:-localhost/quwoquan_service_content-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/content-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: content-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      MONGO_URI: mongodb://mongodb:27017
      CONTENT_REDIS_REC_ADDR: redis:6379
      CONTENT_REDIS_GENERAL_ADDR: redis:6379
      REC_MODEL_SERVICE_ENABLED: "true"
      REC_MODEL_SERVICE_URL: http://recommendation-service:8000
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rec-model-service:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_CONTENT_PORT:-19220}:18080"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  chat-service:
    image: "${LOCAL_GAMMA_CHAT_SERVICE_IMAGE:-localhost/quwoquan_service_chat-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/chat-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: chat-service
      MODULE_PACKAGE: chat-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      CHAT_SERVICE_ADDR: ":18081"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: quwoquan_chat
      CHAT_REDIS_REALTIME_ADDR: redis:6379
      CHAT_REDIS_GENERAL_ADDR: redis:6379
      CHAT_REDIS_RELIABLE_TASK_ADDR: redis:6379
      RELIABLE_TASK_READY_INDEX_ENABLED: "true"
      RELIABLE_TASK_READY_INDEX_STREAM: reliabletask:chat:avatar:ready:local-gamma
      RELIABLE_TASK_READY_INDEX_GROUP: chat.group_avatar_worker.local-gamma
      RELIABLE_TASK_READY_INDEX_QUEUE: reliabletask.chat.avatar
      CHAT_GROUP_AVATAR_CDN_BASE_URL: "${LOCAL_GAMMA_MEDIA_PUBLIC_BASE_URL:-${LOCAL_GAMMA_MEDIA_BASE_URL:-http://127.0.0.1:19100}}"
      CHAT_GROUP_AVATAR_LOCAL_MEDIA_ROOT: /var/lib/quwoquan/chat-media
      RUNTIME_SYNC_PATCH_TTL_HOURS: "720"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_CHAT_PORT:-19200}:18081"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
      - ../state/local/gamma/media:/var/lib/quwoquan/chat-media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18081/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  user-service:
    image: "${LOCAL_GAMMA_USER_SERVICE_IMAGE:-localhost/quwoquan_service_user-service:latest}"
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: user-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      USER_SERVICE_ADDR: ":18082"
      POSTGRES_DSN: postgres://quwoquan:quwoquan@postgres:5432/quwoquan?sslmode=disable
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: quwoquan_user
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_USER_PORT:-19210}:18082"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18082/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  assistant-service:
    image: "${LOCAL_GAMMA_ASSISTANT_SERVICE_IMAGE:-localhost/quwoquan_service_assistant-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/assistant-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: assistant-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      ASSISTANT_SERVICE_ADDR: ":18087"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: quwoquan_assistant
      REDIS_GENERAL_ADDR: redis:6379
      REDIS_REC_ADDR: redis:6379
      ASSISTANT_MODEL_PROVIDER: "${ASSISTANT_MODEL_PROVIDER:-deterministic}"
      ALLOW_DETERMINISTIC_BETA: "${ALLOW_DETERMINISTIC_BETA:-1}"
      ASSISTANT_SCENARIO_SEED_REFS: "${ASSISTANT_SCENARIO_SEED_REFS:-assistant_p0_core}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    ports:
      - "${LOCAL_GAMMA_ASSISTANT_PORT:-19230}:18087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18087/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  product-ops-service:
    image: "${LOCAL_GAMMA_PRODUCT_OPS_SERVICE_IMAGE:-localhost/quwoquan_service_product-ops-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/product-ops-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: product-ops-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      PRODUCT_OPS_SERVICE_ADDR: ":18086"
      MONGO_URI: mongodb://mongodb:27017
      PRODUCT_OPS_REDIS_REC_ADDR: redis:6379
      PRODUCT_OPS_REDIS_GENERAL_ADDR: redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_PRODUCT_OPS_SERVICE_PORT:-19250}:18086"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18086/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  tag-service:
    image: "${LOCAL_GAMMA_TAG_SERVICE_IMAGE:-localhost/quwoquan_service_tag-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/tag-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: tag-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      TAG_SERVICE_ADDR: ":18092"
      TAG_MONGO_URI: mongodb://mongodb:27017
      TAG_MONGO_DATABASE: quwoquan_tag
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    ports:
      - "${LOCAL_GAMMA_TAG_PORT:-19270}:18092"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18092/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  # 专用 ES/OpenSearch 读模型的本地替身：prod/gamma 用托管/专用集群，local-gamma 用单节点容器
  # 承载同一检索读模型（与 postgres/mongo/redis 同属本地数据面替身）。单节点、安全关闭。
  elasticsearch:
    image: "${LOCAL_GAMMA_ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}"
    # Apple Silicon/Colima 下 ES 8.x 自带 arm64 JDK 会在 JVM 初始化期 SIGILL（非法指令）崩溃，
    # 与 deploy/observability/es/docker-compose.yml 参考一致，固定 amd64 由 VM 翻译层运行；
    # 模拟启动较慢（~3min），故 start_period 放宽。prod/gamma 真集群不受此约束。
    platform: linux/amd64
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${LOCAL_GAMMA_ES_PORT:-19430}:9200"
    volumes:
      - local-gamma-es:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 240s
      retries: 40

  search-service:
    image: "${LOCAL_GAMMA_SEARCH_SERVICE_IMAGE:-localhost/quwoquan_service_search-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/search-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: search-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      # ES 召回主链路：endpoints 经 SEARCH_ES_* 注入（部署密钥口径），gamma config es.enabled=true。
      SEARCH_ES_ENABLED: "true"
      SEARCH_ES_ENDPOINTS: "http://elasticsearch:9200"
      # query log / feedback / 搜索词热力读模型落 Mongo（R-S07 闭环）。
      SEARCH_MONGO_URI: "mongodb://mongodb:27017"
      SEARCH_MONGO_DATABASE: "quwoquan_search"
      # R-S07-5：搜索信号发布到 Redis Stream，供 content-service 消费注入推荐特征。
      SEARCH_REDIS_GENERAL_MODE: standalone
      SEARCH_REDIS_GENERAL_ADDR: redis:6379
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_SEARCH_PORT:-19280}:18095"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18095/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  entity-service:
    image: "${LOCAL_GAMMA_ENTITY_SERVICE_IMAGE:-localhost/quwoquan_service_entity-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/entity-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: entity-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      ENTITY_MONGO_URI: mongodb://mongodb:27017
      ENTITY_MONGO_DATABASE: quwoquan_entity
      # 共享 ES 召回索引（与 search-service / content backfill 同一 quwoquan_objects）：
      # 主页 write-time projection 走 SEARCH_ES_*，与 gamma config es.enabled=true 一致。
      SEARCH_ES_ENABLED: "true"
      SEARCH_ES_ENDPOINTS: "http://elasticsearch:9200"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_ENTITY_PORT:-19290}:18084"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18084/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  circle-service:
    image: "${LOCAL_GAMMA_CIRCLE_SERVICE_IMAGE:-localhost/quwoquan_service_circle-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/circle-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: circle-service
      APP_ENV: gamma
      CONFIG_ROOT: /etc/qwq-config
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      CIRCLE_SERVICE_ADDR: ":18082"
      CIRCLE_MONGO_URI: mongodb://mongodb:27017
      CIRCLE_MONGO_DATABASE: quwoquan_circle
      CIRCLE_REDIS_ADDR: redis:6379
      SEARCH_ES_ENABLED: "true"
      SEARCH_ES_ENDPOINTS: "http://elasticsearch:9200"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_CIRCLE_PORT:-19300}:18082"
    volumes:
      - ../state/local/gamma/config-root:/etc/qwq-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18082/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  gamma-proxy:
    image: "${LOCAL_GAMMA_CADDY_IMAGE:-docker.io/library/caddy:2.8.4-alpine}"
    depends_on:
      content-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
      product-ops-service:
        condition: service_healthy
      tag-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      entity-service:
        condition: service_healthy
      circle-service:
        condition: service_healthy
    environment:
      LOCAL_GAMMA_TLS_MODE: "${LOCAL_GAMMA_TLS_MODE:-internal}"
    ports:
      - "${LOCAL_GAMMA_HTTP_PORT:-19000}:443"
      - "${LOCAL_GAMMA_PRODUCT_OPS_PORT:-19010}:443"
      - "${LOCAL_GAMMA_MEDIA_EDGE_PORT:-19100}:443"
      - "${LOCAL_GAMMA_ADMIN_PORT:-2019}:2019"
    volumes:
      - ../state/local/gamma/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../state/local/gamma/media:/srv/media:ro
      - ${LOCAL_GAMMA_CADDY_DATA_ROOT:-../state/local/gamma/caddy-data}:/data
      - ${LOCAL_GAMMA_CADDY_CONFIG_ROOT:-../state/local/gamma/caddy-config}:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 10

  # ── edge-media 平面（与 prod 同集群独立 workload 对齐；逻辑独立、当前统一在本 compose、按需 profile 组装）──
  # 默认主栈不启动；`docker compose --profile edge-media up` 在主栈之上叠加实时/媒体面。
  livekit-sfu:
    profiles: ["edge-media"]
    image: "${LOCAL_GAMMA_LIVEKIT_IMAGE:-docker.io/livekit/livekit-server:v1.7.2}"
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "${LOCAL_GAMMA_LIVEKIT_HTTP_PORT:-19280}:7880"
      - "${LOCAL_GAMMA_LIVEKIT_RTC_TCP_PORT:-19281}:7881"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

  rtc-service:
    profiles: ["edge-media"]
    image: "${LOCAL_GAMMA_RTC_SERVICE_IMAGE:-localhost/quwoquan_service_rtc-service:latest}"
    build:
      context: .
      dockerfile: ../deploy/service/rtc-service/Dockerfile
      args:
        GO_BASE_IMAGE: "${LOCAL_GAMMA_GO_ALPINE_BASE_IMAGE:-golang:1.24-bookworm}"
        ALPINE_BASE_IMAGE: "${LOCAL_GAMMA_ALPINE_BASE_IMAGE:-alpine:3.19}"
        GO_BUILD_FLAGS: "${LOCAL_GAMMA_GO_BUILD_FLAGS:--p=1}"
    environment:
      SERVICE_NAME: rtc-service
      APP_ENV: gamma
      # rtc-service 自带镜像内 config（/etc/rtc-service），不复用 seed config-root。
      CONFIG_ROOT: /etc/rtc-service
      CONFIG_VERSION: "${LOCAL_GAMMA_CONFIG_VERSION:-local-gamma-v1}"
      IMAGE_VERSION: "${LOCAL_GAMMA_IMAGE_VERSION:-0.0.1}"
      RTC_SERVICE_ADDR: ":18083"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: quwoquan_rtc
      REDIS_ADDR: redis:6379
      LIVEKIT_URL: ws://livekit-sfu:7880
      LIVEKIT_API_KEY: "${LOCAL_GAMMA_LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LOCAL_GAMMA_LIVEKIT_API_SECRET:-secret}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit-sfu:
        condition: service_healthy
    ports:
      - "${LOCAL_GAMMA_RTC_PORT:-19260}:18083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18083/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 10

  coturn:
    profiles: ["edge-media"]
    image: "${LOCAL_GAMMA_COTURN_IMAGE:-docker.io/coturn/coturn:4.6-alpine}"
    # 本地用端口映射替代 prod 的 hostNetwork；UDP 在部分本机/虚拟化下能力受限，仅供信令/中继联调。
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=rtc.quwoquan.local"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=quwoquan:${LOCAL_GAMMA_TURN_SECRET:-devsecret}"
    ports:
      - "${LOCAL_GAMMA_TURN_TCP_PORT:-19478}:3478/tcp"
      - "${LOCAL_GAMMA_TURN_UDP_PORT:-19478}:3478/udp"

  realtime-gateway:
    # 实现未就绪：仅有 K8s 骨架 + 占位镜像，无源码/Dockerfile。
    # 占位定义保证 gamma-local 与 prod 服务集“名册一致”；实现就绪后补 build/healthcheck，
    # 并把 profile 从 edge-media-pending 改为 edge-media、纳入主验证链。
    profiles: ["edge-media-pending"]
    image: "${LOCAL_GAMMA_REALTIME_GATEWAY_IMAGE:-realtime-gateway/realtime-gateway:latest}"
    environment:
      SERVICE_NAME: realtime-gateway
      APP_ENV: gamma
      REDIS_ADDR: redis:6379
    ports:
      - "${LOCAL_GAMMA_REALTIME_PORT:-19290}:8080"

volumes:
  local-gamma-postgres:
  local-gamma-model-cache:
  local-gamma-mongo:
  local-gamma-redis:
  local-gamma-go-cache:
  local-gamma-es:
