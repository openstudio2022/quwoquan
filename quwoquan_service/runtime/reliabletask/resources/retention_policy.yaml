# reliabletask 数据保留与限流技术策略；由 module_catalog.yaml 引用并随 package 投影。
policies:
  reliabletask.retention.standard:
    outbox:
      dispatchedTtl: 168h
      failedTtl: 720h
      archiveAfter: 24h
    task:
      doneTtl: 168h
      deadTtl: 2160h
      archiveAfter: 24h
    notification:
      dispatchedTtl: 168h
      failedTtl: 720h
      archiveAfter: 24h
    dlq:
      ttl: 2160h
      requiresManualRecoveryPlan: true
  reliabletask.retention.notification:
    outbox:
      dispatchedTtl: 168h
      failedTtl: 2160h
      archiveAfter: 24h
    task:
      doneTtl: 168h
      deadTtl: 2160h
      archiveAfter: 24h
    notification:
      dispatchedTtl: 168h
      failedTtl: 2160h
      archiveAfter: 24h
    deliveryLedger:
      deliveredTtl: 168h
      failedTtl: 2160h
      archiveAfter: 24h
    dlq:
      ttl: 2160h
      requiresManualRecoveryPlan: true

rateLimits:
  reliabletask.rate.chat_avatar:
    dispatchPerSecond: 50
    claimPerSecond: 20
    retryPerSecond: 10
    priority: high
  reliabletask.rate.projection:
    dispatchPerSecond: 200
    claimPerSecond: 100
    retryPerSecond: 30
    priority: normal
  reliabletask.rate.notification_fanout:
    dispatchPerSecond: 100
    claimPerSecond: 50
    retryPerSecond: 20
    priority: low
  reliabletask.rate.data_content_supply:
    dispatchPerSecond: 500
    claimPerSecond: 200
    retryPerSecond: 50
    priority: normal
