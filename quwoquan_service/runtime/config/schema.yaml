description: 该自治边界的运行配置定义与默认值；环境只维护差异和引用。
configs:
- key: sys.config_center.disk_fallback_enabled
  type: bool
  owner: platform-ops
  default: true
  scope: environment
  reload: hot
  rollout: progressive
  risk_level: high
  ui_editable: false
- key: sys.config_center.poll_interval_sec
  type: int
  owner: platform-ops
  default: 30
  scope: environment
  reload: hot
  rollout: progressive
  risk_level: medium
  ui_editable: false
- key: sys.error_message
  key_namespace: true
  type: string
  owner: platform-ops
  scope: environment
  reload: hot
  rollout: progressive
  risk_level: high
  ui_editable: false
- key: sys.intersection_text
  key_namespace: true
  type: string
  owner: platform-ops
  scope: environment
  reload: hot
  rollout: progressive
  risk_level: medium
  ui_editable: false