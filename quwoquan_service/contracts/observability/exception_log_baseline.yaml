name: exception_log_baseline
schema: 2
description: Short exception log schema written to dedicated error sink.
enums:
  origin:
    - app.http
    - app.grpc
    - service.http
    - service.grpc
    - service.mq
    - job.internal
    - cron.internal
  direction:
    - inbound
    - outbound
required_fields:
  - ts
  - level
  - err
  - msg
optional_fields:
  - req
  - trace
  - debug
  - stackHash
  - failurePoint
  - businessObject
  - functionModule
  - io.inputKv
  - io.outputKv
collector_context:
  app_labels:
    - platform
    - appVersion
    - sessionHash
  service_labels:
    - service
    - instanceId
  run_manifest:
    - env
    - runId
    - releaseId
io_kv:
  input_field: io.inputKv
  output_field: io.outputKv
  source: metadata_driven
  default_strategy: minimal
forbidden_fields:
  - schema
  - signal
  - logKind
  - env
  - sourceType
  - service
  - component
  - instanceId
  - runId
  - releaseId
  - dataReleaseId
  - sessionId
  - timestamp
  - severity
  - message
  - requestId
  - traceId
  - spanId
  - headers
  - statusCode
  - logType
  - phase
  - parentTraceId
  - causationId
error_code_format: "MODULE.KIND.REASON"
notes:
  - "exception_log always goes to dedicated error sink."
  - "exception_log is emitted regardless of normal trace log level."
