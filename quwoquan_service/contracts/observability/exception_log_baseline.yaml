name: exception_log_baseline
catalog: observability.slim
description: Canonical exception runtime log written to the dedicated error sink.
enums:
  origin:
    - app.http
    - app.grpc
    - service.http
    - service.grpc
    - service.mq
    - job.internal
    - cron.internal
  direction:
    - inbound
    - outbound
required_fields:
  - schema
  - occurredAt
  - observedAt
  - logKind
  - severity
  - signal
  - message
  - resource
  - errorCode
optional_fields:
  - recordId
  - correlation
  - fingerprint
  - attributes
resource_fields:
  required: [sourceType, service]
  optional: [environment, component, appVersion, service.version]
forbidden_fields:
  - schemaVersion
  - eventVersion
  - contractVersion
  - releaseId
  - dataReleaseId
  - sessionId
  - headers
  - statusCode
  - logType
error_code_format: "MODULE.KIND.REASON"
notes:
  - "exception_log always goes to dedicated error sink."
  - "exception_log is emitted regardless of normal trace log level."
