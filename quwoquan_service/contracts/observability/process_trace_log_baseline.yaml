name: process_trace_log_baseline
catalog: observability.slim
description: Canonical runtime event log with metadata-driven attributes.
enums:
  origin:
    - app.http
    - app.grpc
    - service.http
    - service.grpc
    - service.mq
    - job.internal
    - cron.internal
  direction:
    - inbound
    - outbound
  level:
    - info
    - debug
required_fields:
  - schema
  - occurredAt
  - observedAt
  - logKind
  - severity
  - signal
  - message
  - resource
  - event
  - result
optional_fields:
  - recordId
  - correlation
  - step
  - attributes
resource_fields:
  required: [sourceType, service]
  optional: [environment, component, appVersion, service.version]
forbidden_fields:
  - schemaVersion
  - eventVersion
  - contractVersion
  - releaseId
  - dataReleaseId
  - sessionId
  - headers
  - statusCode
  - logType
notes:
  - "Process runtime logs do not carry error objects."
  - "attributes only include fields allowed by metadata."
