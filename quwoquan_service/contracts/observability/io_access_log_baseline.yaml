name: io_access_log_baseline
catalog: observability.slim
description: Canonical access runtime log; resource and correlation are encoded in each record.
enums:
  origin:
    - app.http
    - app.grpc
    - service.http
    - service.grpc
    - service.mq
    - job.internal
    - cron.internal
  direction:
    - inbound
    - outbound
  status:
    - success
    - failed
    - timeout
    - retry
required_fields:
  - schema
  - occurredAt
  - observedAt
  - logKind
  - severity
  - signal
  - message
  - resource
  - method
  - route
  - status
  - durationMs
optional_fields:
  - recordId
  - correlation
  - errorCode
  - attributes
resource_fields:
  required: [sourceType, service]
  optional: [environment, component, appVersion, service.version]
forbidden_fields:
  - schemaVersion
  - eventVersion
  - contractVersion
  - releaseId
  - dataReleaseId
  - sessionId
  - headers
  - logType
  - statusCode
error_code_format: "MODULE.KIND.REASON"
notes:
  - "One request/message produces only one terminal log."
  - "API and messaging logs use the same schema."
