aggregate: CallSession

enums:
  CallType:
    values: [audio, video]
    description: 通话类型

  CallStatus:
    values: [initiated, ringing, connecting, in_call, ended]
    description: 通话状态机

  EndReason:
    values: [normal, cancelled, rejected, no_answer, error, timeout, last_leave]
    description: 通话结束原因

  ParticipantRole:
    values: [initiator, invitee]
    description: 参与者角色

  ParticipantStatus:
    values: [invited, ringing, connecting, connected, left, timeout]
    description: 参与者状态

  TrustRelation:
    values: [known, possibly_unknown]
    description: >-
      信任关系两态：known=联系人/同好/当前会话或群成员（可信）；
      possibly_unknown=其他群成员/链接加入者/无共同关系者（提示注意隐私）。富信息（共同关注的人数量等）后续增强。

  CallInviteStatus:
    values: [pending, ringing, accepted, declined, expired, cancelled]
    description: 通话邀请生命周期状态（用于通话中加人/链接入会的结果反馈）

entities:
  CallSession:
    description: 通话会话（聚合根）
    fields:
      - name: _id
        source: _id
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        client_dart_name: callId
        description: RFC 4122 UUID；同时作为 iOS CallKit / Android Telecom 的稳定通话标识

      - name: callType
        source: callType
        type: enum
        enum_ref: CallType
        constraints: [NOT_NULL]
        client_default: audio
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: audio/video

      - name: status
        source: status
        type: enum
        enum_ref: CallStatus
        constraints: [NOT_NULL]
        client_default: initiated
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 通话状态

      - name: initiatorId
        source: initiatorId
        type: string
        constraints: [NOT_NULL]
        client_default: ""
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 发起者 userId

      - name: initiatorRingtoneId
        source: initiatorRingtoneId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 发起通话时快照的发起方官方呼叫铃声 ID；群邀请后续加人沿用该值

      - name: conversationId
        source: conversationId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 关联会话（来自哪个聊天发起的通话）

      - name: circleId
        source: circleId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 关联圈子（圈子通话入口）

      - name: roomId
        source: roomId
        type: string
        constraints: [NOT_NULL]
        client_default: ""
        classification: INTERNAL
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: LiveKit Room ID

      - name: maxParticipants
        source: maxParticipants
        type: int
        constraints: [NOT_NULL]
        client_default: "32"
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 最大参与人数（1v1=2, 多人≤32）

      - name: participantCount
        source: participantCount
        type: int
        constraints: [NOT_NULL]
        client_default: "0"
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 当前参与人数

      - name: participants
        source: participants
        type: embedded_list
        item_entity: CallParticipant
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: API JSON 嵌入参与者列表（非存储字段，客户端 DTO 合成）

      - name: isScreenSharing
        source: isScreenSharing
        type: bool
        constraints: [NOT_NULL]
        client_default: "false"
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 是否有人正在共享屏幕

      - name: screenShareUserId
        source: screenShareUserId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 当前屏幕共享者 userId

      - name: endReason
        source: endReason
        type: enum
        enum_ref: EndReason
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 通话结束原因

      - name: durationMs
        source: durationMs
        type: long
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 通话时长（毫秒，通话结束后写入）

      - name: startedAt
        source: startedAt
        type: datetime
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 通话建连时间（至少两个参与者 connected、会话首次进入 in_call 时）

      - name: endedAt
        source: endedAt
        type: datetime
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 通话结束时间

      - name: createdAt
        source: createdAt
        type: datetime
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: updatedAt
        source: updatedAt
        type: datetime
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  CallParticipant:
    description: 通话参与者（嵌入 CallSession）
    fields:
      - name: userId
        source: userId
        type: string
        constraints: [NOT_NULL]
        client_default: ""
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: role
        source: role
        type: enum
        enum_ref: ParticipantRole
        constraints: [NOT_NULL]
        client_default: invitee
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: initiator/invitee

      - name: status
        source: status
        type: enum
        enum_ref: ParticipantStatus
        constraints: [NOT_NULL]
        client_default: invited
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: invited/ringing/connecting/connected/left/timeout

      - name: isMuted
        source: isMuted
        type: bool
        constraints: [NOT_NULL]
        client_default: "false"
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: isCameraOn
        source: isCameraOn
        type: bool
        constraints: [NOT_NULL]
        client_default: "true"
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: joinedAt
        source: joinedAt
        type: datetime
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: leftAt
        source: leftAt
        type: datetime
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: inviteStatus
        source: inviteStatus
        type: enum
        enum_ref: CallInviteStatus
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 邀请生命周期状态（加人/链接入会结果反馈）

      - name: invitedBy
        source: invitedBy
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 邀请发起者 userId（区分原始发起人与会中加人邀请方）
