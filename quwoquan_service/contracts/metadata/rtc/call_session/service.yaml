      response_decoder: decodeRtcCallSession
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - RTC.USER.call_not_found
      - RTC.USER.not_participant
      - RTC.USER.invalid_call_action
      - RTC.USER.version_conflict
      - RTC.USER.idempotency_conflict
      - RTC.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: rtc_call_lifecycle_command
      trace: true
      attributes: [operation, outcome, error_code, replayed]
    slo:
