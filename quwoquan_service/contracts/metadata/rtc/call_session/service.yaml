
service:
  name: rtc-service
  domain: rtc
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: gamma full cold-start and LiveKit runtime evidence blocked by missing controlled product telemetry SLS credential
    gap_id: RTC_CALL_SESSION_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 实时音视频通话信令编排、LiveKit Room 管理、Token 签发、屏幕共享控制

api_routes:
  # ── 通话生命周期 ──────────────────────────────────
  - method: POST
    path: /rtc/calls

    operation: InitiateCall
    actor: persona
    application:
      kind: command
      facet: CallLifecycleCommandFacet
      method: initiateCall
      aggregate_owner: CallSession
      mutation_target: CallSession
      invariant_target: CallSession
    description: 发起通话（一次创建：CallSession + LiveKit Room + 发起方 Token + 来电通知；同 actor 活跃通话唯一约束防双呼）
    request_fields: [callType, inviteeIds, conversationId, circleId, maxParticipants]
    response_fields: [session, token, livekitUrl]
    client_contract:
      dart_import: ../rtc/call_session_contracts.dart
      request_type: RtcInitiateCallCommand
      response_type: RtcInitiateCallResultDto
      request_encoder: encodeRtcInitiateCallCommand
      response_decoder: decodeRtcInitiateCallResult
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - RTC.USER.unauthorized
      - RTC.USER.already_in_call
      - RTC.USER.not_mutual
      - RTC.USER.blocked
      - RTC.USER.idempotency_conflict
      - RTC.USER.rate_limited
      - RTC.SYSTEM.livekit_unavailable
      - RTC.SYSTEM.token_generation_failed
      - RTC.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: rtc_call_lifecycle_command
      trace: true
      attributes: [operation, outcome, error_code, replayed]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: initiator_self
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: POST
    path: /rtc/calls/{callId}/answer

    operation: AnswerCall
    actor: persona
    application:
      kind: command
      facet: CallLifecycleCommandFacet
      method: answerCall
      aggregate_owner: CallSession
      mutation_target: CallSession
      invariant_target: CallSession
    description: 接听通话（命名状态迁移；签发接听方 Token）
    response_fields: [session, token, roomId, livekitUrl]
    client_contract:
      dart_import: ../rtc/call_session_contracts.dart
      request_type: RtcCallIdCommand
      response_type: RtcAnswerCallResultDto
      request_encoder: encodeRtcCallIdCommand
      response_decoder: decodeRtcAnswerCallResult
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - RTC.USER.call_not_found
      - RTC.USER.not_participant
      - RTC.USER.cannot_answer
      - RTC.USER.call_ended
      - RTC.USER.version_conflict
      - RTC.USER.idempotency_conflict
      - RTC.SYSTEM.livekit_unavailable
      - RTC.SYSTEM.token_generation_failed
      - RTC.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: rtc_call_lifecycle_command
      trace: true
      attributes: [operation, outcome, error_code, replayed]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: call_participant
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: POST
    path: /rtc/calls/{callId}/reject

    operation: RejectCall
    actor: persona
    application:
      kind: command
      facet: CallLifecycleCommandFacet
      method: rejectCall
      aggregate_owner: CallSession
      mutation_target: CallSession
      invariant_target: CallSession
    description: 拒绝通话（命名状态迁移；已结束时按 no-op receipt 幂等）
    client_contract:
      dart_import: ../rtc/call_session_contracts.dart
      request_type: RtcCallIdCommand
      response_type: CallSessionDto
      request_encoder: encodeRtcCallIdCommand
      response_decoder: decodeRtcCallSession
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - RTC.USER.call_not_found
      - RTC.USER.not_participant
      - RTC.USER.invalid_call_action
      - RTC.USER.version_conflict
      - RTC.USER.idempotency_conflict
      - RTC.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: rtc_call_lifecycle_command
      trace: true
