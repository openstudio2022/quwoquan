  # ── 屏幕共享 ────────────────────────────────────
  - method: POST
    path: /rtc/calls/{callId}/screen-share/start

    operation: StartScreenShare
    actor: persona
    application:
      kind: command
      facet: CallScreenShareCommandFacet
      method: startScreenShare
      aggregate_owner: CallSession
      mutation_target: CallSession
