    authorization:
      principal: persona
      ownership_policy: call_participant
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
consumers:
  - name: app
    capabilities: [initiate_call, answer_call, reject_call, cancel_call, hangup_call, join_call, leave_call, invite_to_call, report_media_connected, get_call, list_calls, toggle_mute, toggle_camera, start_screen_share, stop_screen_share]
  - name: platform-ops
    capabilities: [get_call, list_calls]
  - name: chat-service
    capabilities: [get_call]

contract_test:
  mock_strategy:
    app_side:
      mock_target: rtc-service API
      data_source: fields.yaml
      scenarios:
        - name: initiate_1v1_audio_call
          route: POST /rtc/calls
          assertions: [status_201, callId_returned, token_returned, roomId_returned, livekit_url_returned]

        - name: initiate_group_video_call
          route: POST /rtc/calls
          assertions: [status_201, callId_returned, max_participants_32]

        - name: answer_call
          route: POST /rtc/calls/{callId}/answer
          assertions: [status_200, token_returned, livekit_url_returned]

        - name: reject_call
          route: POST /rtc/calls/{callId}/reject
          assertions: [status_200, call_status_ended, end_reason_rejected]

        - name: hangup_call
          route: POST /rtc/calls/{callId}/hangup
          assertions: [status_200, call_status_ended]

        - name: cancel_call_before_answer
          route: POST /rtc/calls/{callId}/cancel
          assertions: [status_200, call_status_ended, end_reason_cancelled]

        - name: leave_group_call_keeps_session
          route: POST /rtc/calls/{callId}/leave
          assertions: [status_200, call_still_active_for_others]

        - name: join_group_call
          route: POST /rtc/calls/{callId}/join
          assertions: [status_200, token_returned, participant_count_incremented]

        - name: report_media_connected
          route: POST /rtc/calls/{callId}/connected
          assertions: [status_200, second_connected_enters_in_call, started_at_recorded, repeat_is_noop]

        - name: call_full_error
          route: POST /rtc/calls/{callId}/join
          assertions: [status_409, error_code_call_full]

        - name: list_calls_with_missed_filter
          route: GET /rtc/calls?missed=true
          assertions: [status_200, only_missed_calls]

    service_side:
      description: 使用真实测试数据库与 operation guard 在链的鉴权中间件，LiveKit 通过 mock adapter
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: miniredis/v2
      spy_targets: [event_publisher]
      mock_targets: [livekit_adapter, cross_service_clients]
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: "DeleteMany for call_sessions / call_session_command_receipts / call_session_outbox"
        redis_cleanup: miniredis.FlushAll()
      scenarios:
        - name: full_1v1_call_lifecycle
          commands: [InitiateCall, AnswerCall, ReportMediaConnected(caller), ReportMediaConnected(callee), HangupCall]
          seed: []
          assertions:
            - "db.call_sessions.FindOne({_id}).status → ringing → connecting → in_call → ended"
            - "eventSpy.AssertPublished('CallInitiated')"
            - "eventSpy.AssertPublished('CallAnswered')"
            - "eventSpy.AssertPublished('CallConnected')"
            - "eventSpy.AssertPublished('CallEnded', {endReason: 'normal'})"
            - "livekitMock.AssertCreateRoom(callId)"
            - "livekitMock.AssertDeleteRoom(callId)"

        - name: server_owned_cas_and_noop_receipt
          commands: [ToggleMute(muted=true), ToggleMute(muted=true, new key), HangupCall, HangupCall(new key)]
          assertions:
            - "request 不携带版本字段，纯 CAS 冲突由服务端重载重放"
            - "目标状态已满足的命名意图持久化 no-op receipt 且不递增 aggregate version"
            - "同一 Idempotency-Key 重放返回原始结果"

        - name: call_no_answer_timeout
          commands: [InitiateCall, RingTimeout(1v1=30s, group=60s)]
          assertions:
            - "db.call_sessions.FindOne({_id}).status → ended"
            - "db.call_sessions.FindOne({_id}).endReason → no_answer"
            - "db.call_session_command_receipts.FindOne({commandName: 'RingTimeout'}) exists"
            - "db.call_session_outbox.FindOne({eventType: 'CallEnded'}).payload.type → call.ended"

        - name: group_call_32_limit
          commands: [InitiateCall(32 targets), JoinCall(33rd)]
          assertions:
            - "error returned: call_full"
            - "db.call_sessions.FindOne({_id}).participantCount → 32"

        - name: concurrent_initiate_500
          description: 500 并发发起通话基准测试
          assertions:
            - "p95 latency < 200ms"
            - "error rate < 1%"

  coverage_requirements:
    - 全状态机路径覆盖（initiated→ringing→connecting→in_call→ended × 7 种 endReason）
    - 多人通话 join/leave/invite 全路径
    - ReportMediaConnected 的 connecting→connected、≥2 人进入 in_call 与目标态 no-op
    - 32 人上限边界测试
    - 屏幕共享互斥测试
    - 服务端内部 CAS 有限重放与 no-op receipt 幂等
    - operation guard 与 auth 中间件在链的越权负例（非参与者 403/404）
    - 500 并发基准测试
