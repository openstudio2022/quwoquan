  # ── 通话查询 ──────────────────────────────────────
  - method: GET
    path: /rtc/calls/{callId}

    operation: GetCall
    actor: persona
    application:
      kind: query
      facet: CallQueryFacet
      method: getCall
      reader: CallDetailReader
      slice: CallDetailSlice
    description: 获取通话详情（仅参与者可读）
    response_entity: CallSession
    client_contract:
      dart_import: ../rtc/call_session_contracts.dart
      request_type: RtcGetCallQuery
      response_type: CallSessionDto
      request_encoder: encodeRtcGetCallQuery
      response_decoder: decodeRtcCallSession
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - RTC.USER.call_not_found
      - RTC.USER.not_participant
      - RTC.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: rtc_call_query
      trace: true
      attributes: [operation, outcome, error_code]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: call_participant
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: GET
    path: /rtc/calls

    operation: ListCalls
    actor: persona
    application:
      kind: query
      facet: CallQueryFacet
      method: listCalls
      reader: CallHistoryReader
      slice: CallHistoryPageSlice
    description: 通话记录列表（含 missed calls 筛选，仅返回当前 persona 参与的通话）
    query_params: [cursor, limit, status, missed]
    response_entity: CallSession
    client_contract:
      dart_import: ../rtc/call_session_contracts.dart
      request_type: RtcListCallsQuery
      response_type: RtcCallHistoryPage
