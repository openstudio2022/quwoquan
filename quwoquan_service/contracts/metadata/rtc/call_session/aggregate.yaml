domain: rtc
aggregate_root: CallSession
object_kind: aggregate_root

description: |
  实时通话会话聚合。支持 1v1 和多人（≤32人）音视频通话。
  CallSession 为聚合根，管理通话生命周期（状态机）和参与者列表。
  媒体传输通过 LiveKit SFU 转发，rtc-service 负责信令编排。
  MongoDB 存储通话记录，Redis 缓存活跃通话状态。

storage_backend: mongodb
cache_layer: redis
cache_ttl_seconds: 60

capabilities:
  - queryable

taggable: false
vector_enabled: false

business_rules:
  - initiator 必须是 trusted persona 且满足 Relationship capability
  - participants 只能由 CallSession 行为修改且最多 32 个
  - LiveKit token 必须短期有效并绑定 roomId、participantId 与 grants
  - 所有命令由服务端加载当前 version 执行内部 CAS 并对纯竞态做有限重放；公开请求不携带版本字段
  - InitiateCall 是一次创建命令，同一 actor 的活跃通话由存储唯一约束防止并发双呼
  - ReportMediaConnected 只允许 connecting 参与者进入 connected；至少两人 connected 时首次进入 in_call 并写 startedAt
  - ringing 超时为 1v1 30 秒、群通话 60 秒，由确定性 system command 经同一 CAS/receipt/outbox 管道迁移 ended/no_answer
  - ended 为终态；重复 answer、join、leave 与 hangup 按 actor-scoped command receipt 幂等，目标状态已满足时持久化 no-op receipt 且不递增版本
  - 参与者展示信息（昵称/头像/信任标签）不是聚合状态；来电提示经 CallRinging 事件负载快照，通话中列表由端侧组合 user 域数据
  - 通话记录的商用主形态是 CallEnded 事实投影到关联 chat Conversation 的 system_call_log Message；独立 ListCalls 页面 deferred，operation 仅保留对象查询合同
lifecycle:
  states: [initiated, ringing, connecting, in_call, ended]
  optimistic_concurrency: version
  idempotency: command_receipt

members:
  - entity: CallParticipant
    relation: 1:N
    object_kind: owned_entity
    aggregate_owner: CallSession
    max_cardinality: 32
    cascade_delete: true
    description: 通话参与者（嵌入 CallSession 文档，≤32人无需独立 collection）

ddd_layer_mapping:
  domain_model: internal/domain/call_session/model
  ports: internal/domain/call_session/ports
  application: internal/application
  adapter_rest: internal/adapters/http
  adapter_event: internal/adapters/mq

livekit_integration:
  description: |
    LiveKit Room 与 CallSession 一一映射。
    Token 由 rtc-service 签发（JWT，含 roomName + participantId + grants）。
    连接地址 livekitUrl 由服务端配置下发（Initiate/Answer/Join 响应），端侧禁止硬编码。
  room_name_pattern: "rtc-room-{callId}"
  token_ttl_seconds: 21600
  max_participants: 32
