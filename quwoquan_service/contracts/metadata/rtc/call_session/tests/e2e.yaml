aggregate: CallSession
layer: e2e

description: |
  RTC 域端云验收场景。call UI / realtime gateway / rtc-service / SFU 辅助链路全链路，
  用于验证弱网下的建连、恢复与控制面策略提示可被 onboarding 矩阵消费。

execution:
  environment: integration
  ci_strategy: advisory
  trigger: daily + pre-release
  runners:
    api_contract: integration HTTP client
    ui_journey: flutter_test widget journey + gamma Patrol

scenarios:
  - name: rtc_call_answer_hangup_journey
    source: rtc_call_answer_hangup_journey
    description: 来电经 realtime 单通道推送，接听建连后挂断，通话记录回读
    test_type: ui_journey
    user_acceptance_status: pending
    user_acceptance_block_reason: 需要 Gamma production Remote、真实媒体传输 adapter 轨道与双设备 readback；禁止用 Provider override 或假 adapter 代替
    api_contract_flow: quwoquan_service/services/rtc-service/tests/api_integration/call_timeout_and_connected_contract__api_integration_test.go
    actors:
      app: lib/ui/rtc/pages/incoming_call_page.dart
      gateway: realtime-gateway /realtime/ws (ticket + auth_ack)
      service: rtc-service POST /rtc/calls
      media: livekit-sfu
    steps:
      - caller initiates a one-to-one call
      - callee receives call.ringing through rt:rtc:user channel
      - callee answers, both join the media room via server-issued mediaAccess
      - caller and callee invoke ReportMediaConnected after media transport becomes connected
      - caller hangs up and both ends observe call.ended
    assertions:
      - ringing arrives over the single realtime channel (no /rtc/signal endpoint)
      - answer/ReportMediaConnected/hangup are server-owned CAS commands with command receipts
      - the second connected participant transitions CallSession to in_call with startedAt
      - CallEnded durable stream projects one chat system_call_log message

  - name: rtc_call_reconnect_after_network_jitter
    source: rtc_call_reconnect_after_network_jitter
    description: 建连成功后发生短暂抖动，RTC 服务恢复会话并保持控制面策略一致
    test_type: ui_journey
    user_acceptance_status: pending
    user_acceptance_block_reason: 需要 Gamma production Remote 弱网注入、真实媒体传输 adapter 重连与 QoE series readback
    api_contract_flow: quwoquan_service/services/rtc-service/tests/api_integration/call_timeout_and_connected_contract__api_integration_test.go
    actors:
      app: lib/ui/rtc/pages/voice_call_page.dart
      gateway: realtime-gateway websocket upgrade
      service: rtc-service POST /rtc/calls
      media: livekit-sfu
    steps:
      - user starts a one-to-one call
      - rtc-service creates call session and returns transport policy
      - app reports media connected through ReportMediaConnected
      - network jitter disconnects media path for a short interval
      - app reconnects and rtc-service restores the call session
    assertions:
      - reconnect completes without creating a duplicate session
      - repeated ReportMediaConnected is a target-state no-op without a duplicate CallConnected fact
      - transport policy remains consistent before and after reconnect
      - recovery event is recorded in rtc audit timeline

  - name: rtc_ringing_timeout_service_contract
    source: rtc_ringing_timeout_service_contract
    description: 1v1/群通话无人接听由服务进程内 sweeper 可靠结束并下发 call.ended
    test_type: api_contract
    api_contract_flow: quwoquan_service/services/rtc-service/tests/api_integration/call_timeout_and_connected_contract__api_integration_test.go
    actors:
      service: rtc-service
      store: MongoDB call_sessions + call_session_command_receipts + call_session_outbox
      gateway: realtime-gateway per-user channel
    steps:
      - caller invokes InitiateCall and no invitee answers
      - sweeper queries 1v1 30s and group 60s overdue ringing sessions
      - RingTimeout system command reloads aggregate and calls HandleTimeout
      - atomic commit writes ended/no_answer state, receipt and CallEnded outbox
    assertions:
      - the system actor and idempotency key are deterministic
      - answered connecting sessions are never swept
      - CallEnded wire type is call.ended and reaches every participant
