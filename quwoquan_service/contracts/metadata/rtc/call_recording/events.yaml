version: 1
aggregate: CallRecording
events:
  - name: CallRecordingStarted
    producer: rtc-service
    consumers: [projection-workers]
    channel: event_store
    payload_entity: CallRecording
    payload_fields: [id]
  - name: CallRecordingStopped
    producer: rtc-service
    consumers: [projection-workers]
    channel: event_store
    payload_entity: CallRecording
    payload_fields: [id]
  - name: CallRecordingMediaReady
    producer: rtc-service
    consumers: [projection-workers]
    channel: event_store
    payload_entity: CallRecording
    payload_fields: [id]
