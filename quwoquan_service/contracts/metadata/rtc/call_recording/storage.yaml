version: 1
aggregate: CallRecording
backend: mongodb
collections:
  call_recordings:
    entity: CallRecording
    role: authoritative
  call_recordings_command_receipts:
    entity: CallRecording
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。
  call_recordings_outbox:
    entity: CallRecording
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
