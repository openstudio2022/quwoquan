version: 1
aggregate: PushDelivery

events:
  - name: PushDeliveryQueued
    description: 外部推送请求已进入可靠队列。
    producer: integration-service
    consumers: [notification-service, platform-ops]
    channel: event_store
    payload_fields: [requestId, notificationId, recipientId, providerHint, queuedAt]

  - name: PushDeliveryProviderAttempted
    description: 一次推送 provider 调用尝试已完成并写入 ledger。
    producer: integration-service
    consumers: [platform-ops]
    channel: event_store
    payload_fields: [requestId, provider, providerMessageId, status, latencyMs, normalizedError]

  - name: PushDeliverySucceeded
    description: 外部推送已被供应商接收或送达。
    producer: integration-service
    consumers: [notification-service, platform-ops]
    channel: callback_or_event
    payload_fields: [requestId, notificationId, recipientId, providerMessageId, status]

  - name: PushDeliveryFailed
    description: 外部推送最终失败。
    producer: integration-service
    consumers: [notification-service, platform-ops]
    channel: callback_or_event
    payload_fields: [requestId, notificationId, recipientId, normalizedError, recoveryAction]
