aggregate: PushDelivery
domain: INTEGRATION

errors:
  - code: INTEGRATION.USER.push_delivery_invalid_request
    kind: USER
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: pushDeliveryInvalidRequest
    l10n_key: pushDeliveryInvalidRequest
    go_const: ErrPushDeliveryInvalidRequest
    user_message:
      zh: "推送请求参数不完整"
      en: "Push delivery request is invalid"

  - code: INTEGRATION.MIDDLEWARE.push_endpoint_resolution_failed
    kind: MIDDLEWARE
    reason: dependency_unavailable
    http_status: 503
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: pushEndpointResolutionFailed
    l10n_key: pushEndpointResolutionFailed
    go_const: ErrPushEndpointResolutionFailed
    user_message:
      zh: "推送端点暂时无法解析"
      en: "Push endpoint cannot be resolved temporarily"

  - code: INTEGRATION.MIDDLEWARE.push_provider_timeout
    kind: MIDDLEWARE
    reason: timeout
    http_status: 504
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: pushProviderTimeout
    l10n_key: pushProviderTimeout
    go_const: ErrPushProviderTimeout
    user_message:
      zh: "推送供应商响应超时，请稍后重试"
      en: "Push provider timed out"

  - code: INTEGRATION.MIDDLEWARE.push_provider_rate_limited
    kind: MIDDLEWARE
    reason: rate_limited
    http_status: 429
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: pushProviderRateLimited
    l10n_key: pushProviderRateLimited
    go_const: ErrPushProviderRateLimited
    user_message:
      zh: "推送供应商请求繁忙，请稍后重试"
      en: "Push provider rate limited the request"

  - code: INTEGRATION.MIDDLEWARE.push_provider_rejected
    kind: MIDDLEWARE
    reason: upstream_rejected
    http_status: 502
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: pushProviderRejected
    l10n_key: pushProviderRejected
    go_const: ErrPushProviderRejected
    user_message:
      zh: "推送供应商暂时不可用，请稍后重试"
      en: "Push provider is temporarily unavailable"

  - code: INTEGRATION.MIDDLEWARE.push_endpoint_permanently_invalid
    kind: MIDDLEWARE
    reason: resource_gone
    http_status: 410
    recovery_action: absorb
    dart_const: pushEndpointPermanentlyInvalid
    l10n_key: pushEndpointPermanentlyInvalid
    go_const: ErrPushEndpointPermanentlyInvalid
    user_message:
      zh: "推送端点已失效"
      en: "Push endpoint is no longer valid"

  - code: INTEGRATION.SYSTEM.push_provider_credentials_invalid
    kind: SYSTEM
    reason: credentials_invalid
    http_status: 500
    recovery_action: escalate
    dart_const: pushProviderCredentialsInvalid
    l10n_key: pushProviderCredentialsInvalid
    go_const: ErrPushProviderCredentialsInvalid
    user_message:
      zh: "推送供应商凭据无效"
      en: "Push provider credentials are invalid"

  - code: INTEGRATION.MIDDLEWARE.push_endpoint_invalidation_failed
    kind: MIDDLEWARE
    reason: dependency_unavailable
    http_status: 503
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: pushEndpointInvalidationFailed
    l10n_key: pushEndpointInvalidationFailed
    go_const: ErrPushEndpointInvalidationFailed
    user_message:
      zh: "推送端点失效状态暂时无法同步"
      en: "Push endpoint invalidation cannot be synchronized temporarily"
