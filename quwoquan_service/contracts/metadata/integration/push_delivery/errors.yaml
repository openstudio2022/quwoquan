aggregate: PushDelivery
domain: INTEGRATION

errors:
  - code: INTEGRATION.USER.push_delivery_invalid_request
    kind: USER
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: pushDeliveryInvalidRequest
    l10n_key: pushDeliveryInvalidRequest
    go_const: ErrPushDeliveryInvalidRequest
    user_message:
      zh: "推送请求参数不完整"
      en: "Push delivery request is invalid"

  - code: INTEGRATION.MIDDLEWARE.push_provider_timeout
    kind: MIDDLEWARE
    reason: timeout
    http_status: 504
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: pushProviderTimeout
    l10n_key: pushProviderTimeout
    go_const: ErrPushProviderTimeout
    user_message:
      zh: "推送供应商响应超时，请稍后重试"
      en: "Push provider timed out"

  - code: INTEGRATION.MIDDLEWARE.push_provider_rejected
    kind: MIDDLEWARE
    reason: upstream_rejected
    http_status: 502
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: pushProviderRejected
    l10n_key: pushProviderRejected
    go_const: ErrPushProviderRejected
    user_message:
      zh: "推送供应商暂时不可用，请稍后重试"
      en: "Push provider is temporarily unavailable"

  - code: INTEGRATION.SYSTEM.push_callback_signature_invalid
    kind: SYSTEM
    reason: signature_invalid
    http_status: 401
    recovery_action: surface
    dart_const: pushCallbackSignatureInvalid
    l10n_key: pushCallbackSignatureInvalid
    go_const: ErrPushCallbackSignatureInvalid
    user_message:
      zh: "推送回执签名校验失败"
      en: "Push callback signature is invalid"
