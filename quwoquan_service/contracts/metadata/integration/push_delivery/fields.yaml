aggregate: PushDelivery

enums:
  PushProvider:
    values: [apns_voip, fcm, alpha_fake]
  PushDeliveryStatus:
    values: [queued, sent_unconfirmed, delivered, failed, dead_letter]

entities:
  PushDeliveryPayload:
    description: notification-service 经 SubmitExternalInteractionRequest 提交的 push_delivery.send 强类型 payload。
    fields:
      - name: action
        source: action
        type: enum
        enum_ref: PushDeliveryAction
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: write
        ops_exposure: read
        description: ring 展示来电；cancel 关闭同 deliveryKey/callId 的来电面并压制迟到 ring
      - name: endpointRef
        source: endpointRef
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: write
        ops_exposure: read
        description: user-service PushEndpoint 的 64 位小写 hex SHA-256 不透明引用；不是设备 token
      - name: deliveryKey
        source: deliveryKey
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: write
        ops_exposure: read
        description: APNs collapse-id / FCM collapse_key 与业务幂等键
      - name: callId
        source: callId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: write
        ops_exposure: read
      - name: targetPersonaId
        source: targetPersonaId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: write
        ops_exposure: drop
        description: 原生来电信封的目标 persona；由 notification-service 从可信 CallRinging 事件注入
      - name: callType
        source: callType
        type: enum
        enum_ref: CallType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: write
        ops_exposure: read
      - name: callerName
        source: callerName
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: mask
        api_exposure: write
        ops_exposure: read
      - name: sourceLabel
        source: sourceLabel
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: mask
        api_exposure: write
        ops_exposure: read
      - name: trustRelation
        source: trustRelation
        type: enum
        enum_ref: TrustRelation
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: write
        ops_exposure: read
      - name: expiresAt
        source: expiresAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: write
        ops_exposure: read
      - name: occurredAt
        source: occurredAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: write
        ops_exposure: read
        description: ring 创建或首次终态取消的服务端时刻；终端据此拒绝乱序迟到 ring

  PushEndpointSecret:
    description: user-service 内部短时解析结果；明文 token 只存在于单次 provider 调用内存。
    fields:
      - name: endpointRef
        source: endpointRef
        type: string
        constraints: [PK]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: endpointKind
        source: endpointKind
        type: enum
        enum_ref: DevicePushEndpointKind
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: token
        source: token
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: drop
        api_exposure: drop
        ops_exposure: drop

  PushDeliveryAttempt:
    description: provider attempt ledger 中的推送外送事实；禁止写入 endpoint token。
    fields:
      - name: attemptId
        source: attemptId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: requestId
        source: requestId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: provider
        source: provider
        type: enum
        enum_ref: PushProvider
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: providerRequestId
        source: providerRequestId
        type: string
        constraints: [NULLABLE]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: status
        source: status
        type: enum
        enum_ref: PushDeliveryStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: normalizedError
        source: normalizedError
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: latencyMs
        source: latencyMs
        type: int
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: failureDisposition
        source: failureDisposition
        type: enum
        enum_ref: PushFailureDisposition
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: createdAt
        source: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
