aggregate: PushDelivery
layer: e2e

description: |
  PushDelivery worker 的真实存储幂等场景。测试使用真实 MongoDB、TLS HTTP/2
  协议服务器与临时 EC/RSA key；不依赖或伪造 beta/gamma/prod 凭据。

scenarios:
  - name: duplicate_submit_dispatches_provider_once
    steps:
      - notification-service 以相同 deliveryKey 和 idempotencyKey 重复提交
      - integration-service 持久化 outbox 后重启 worker
      - worker 临时解析 endpoint secret 并调用匹配 provider
    assertions:
      - reliable_task_outbox 只有一条
      - provider 请求只有一次
      - provider attempt ledger 只有一条 sent_unconfirmed
      - completed reliable task 只有一条
      - MongoDB 文档不包含明文 endpoint token

  - name: transient_failure_preserves_single_provider_route
    steps:
      - 匹配 provider 首次返回 429 或 5xx
      - worker 按可靠任务预算重试
    assertions:
      - 每次 attempt 使用同一 endpointKind provider
      - 不调用另一 provider
      - endpoint 不因暂时错误被 invalidate
