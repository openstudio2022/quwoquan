aggregate: PushDelivery
layer: service_side

description: |
  alpha 只装配显式 fake push provider，用于可靠任务链路开发验证；beta/gamma/prod
  不可装配 fake，启用真实 push 时缺任一 user/APNs/FCM 凭据必须启动失败。

scenarios:
  - name: alpha_fake_is_environment_scoped
    assertions:
      - APP_ENV=alpha 且 push.mode=fake 才允许装配 alpha fake
      - fake 仍验证完整强类型 payload 并返回 sent_unconfirmed
      - APP_ENV=beta/gamma/prod 拒绝 push.mode=fake
      - fake 不被计作任何真实环境 readiness 证据
