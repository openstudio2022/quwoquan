
service:
  name: integration-service
  domain: integration
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: INTEGRATION_PUSH_DELIVERY_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: |
    PushDelivery 是 ExternalInteraction 的类型化外部引用，不拥有 transport operation。
    提交与回调统一由 integration/external_interaction/service.yaml 声明，禁止恢复
    /integrations/push-deliveries 兼容路由。

api_routes: []

consumers:
  - name: external-interaction
    capabilities: [push_delivery_payload, push_delivery_callback_payload]
