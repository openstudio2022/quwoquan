version: 1
domain: integration
aggregate_root: PushDelivery

description: |
  手机外部推送聚合。notification-service 保持内部通知语义中心，
  integration-service 负责 APNs、FCM 与厂商推送 provider 适配和回执归一。

storage_backend: mongodb
cache_layer: redis
cache_ttl_seconds: 60

capabilities:
  - reliable_async
  - provider_fallback
  - callback_enabled

taggable: false
vector_enabled: false

ddd_layer_mapping:
  domain_model: services/integration-service/internal/domain/push_delivery/model
  repository: services/integration-service/internal/domain/push_delivery/repository
  application: services/integration-service/internal/application/push_delivery
  adapter_rest: services/integration-service/internal/adapters/http/push_delivery
  adapter_event: services/integration-service/internal/adapters/mq/push_delivery
