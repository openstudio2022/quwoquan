aggregate: PushDelivery
backend: mongodb

collections:
  external_provider_attempt_ledger:
    entity: PushDeliveryCallback
    indexes:
      - { name: idx_push_attempt_request_created, keys: { requestId: 1, createdAt: 1 } }
      - { name: idx_push_attempt_provider_status, keys: { provider: 1, status: 1 } }

redis_cache:
  - key: "ready:integration:push_delivery:{provider}:{shard}"
    ttl_seconds: 60
    entity: PushDeliveryRequest
    invalidate_on: [PushDeliverySucceeded, PushDeliveryFailed]
