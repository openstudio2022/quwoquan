aggregate: ExternalInteraction

enums:
  ExternalInteractionOperation:
    values:
      - sms_otp.send
      - push_delivery.send
      - one_tap_phone.resolve
      - webhook.deliver
  ExternalInteractionStatus:
    values:
      - accepted
      - pending_dispatch
      - processing
      - sent_unconfirmed
      - delivered
      - failed
      - dead_letter
  ExternalInteractionSensitivity:
    values: [public, private, secret]
  ExternalInteractionProvider:
    values: [mock_sms, aliyun_sms, tencent_sms, apns, fcm, vendor_push, webhook]

entities:
  ExternalInteractionRequest:
    description: 跨域外部交互可靠异步请求；业务服务只依赖 request/challenge 生命周期，不依赖 Redis 临时状态。
    fields:
      - name: requestId
        source: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: operation
        source: operation
        type: enum
        enum_ref: ExternalInteractionOperation
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: tenant
        source: tenant
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: env
        source: env
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: idempotencyKey
        source: idempotencyKey
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: callbackUrl
        source: callbackUrl
        type: string
        constraints: [NULLABLE]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: callbackEvent
        source: callbackEvent
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: payloadRef
        source: payloadRef
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: payloadDigest
        source: payloadDigest
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: sensitivity
        source: sensitivity
        type: enum
        enum_ref: ExternalInteractionSensitivity
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: status
        source: status
        type: enum
        enum_ref: ExternalInteractionStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: expiresAt
        source: expiresAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: createdAt
        source: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: updatedAt
        source: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  ExternalInteractionAccepted:
    description: 可靠接收外部交互请求后的 202 Accepted 响应。
    fields:
      - name: requestId
        source: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: status
        source: status
        type: enum
        enum_ref: ExternalInteractionStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: acceptedAt
        source: acceptedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  ExternalInteractionAttempt:
    description: 每一次 provider 调用审计记录，号码等敏感对象只能存 hash 或脱敏值。
    fields:
      - name: attemptId
        source: attemptId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: requestId
        source: requestId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: provider
        source: provider
        type: enum
        enum_ref: ExternalInteractionProvider
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: providerRequestId
        source: providerRequestId
        type: string
        constraints: [NULLABLE]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: maskedRecipient
        source: maskedRecipient
        type: string
        constraints: [NULLABLE]
        classification: PRIVATE
        log_policy: mask
        api_exposure: read
        ops_exposure: read
      - name: latencyMs
        source: latencyMs
        type: int
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: status
        source: status
        type: enum
        enum_ref: ExternalInteractionStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: normalizedError
        source: normalizedError
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: recoveryAction
        source: recoveryAction
        type: bool
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: createdAt
        source: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  ExternalInteractionDeadLetter:
    description: 外部交互死信，用于 ops 审计和人工补偿。
    fields:
      - name: deadLetterId
        source: deadLetterId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: requestId
        source: requestId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: operation
        source: operation
        type: enum
        enum_ref: ExternalInteractionOperation
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: finalError
        source: finalError
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: recoveryAction
        source: recoveryAction
        type: bool
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: createdAt
        source: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
