version: 1
aggregate: ExternalInteraction

events:
  - name: ExternalInteractionAccepted
    description: integration-service 已可靠接收外部交互请求，并写入 outbox。
    producer: integration-service
    consumers: [user-service, notification-service, platform-ops]
    channel: event_store
    payload_fields: [requestId, operation, idempotencyKey, status, acceptedAt]

  - name: ExternalInteractionAttemptRecorded
    description: provider attempt ledger 已记录一次外部供应商调用。
    producer: integration-service
    consumers: [platform-ops]
    channel: event_store
    payload_fields: [requestId, operation, provider, status, latencyMs, normalizedError, retryable]

  - name: ExternalInteractionResultReported
    description: 外部交互结果已归一化，供业务服务回调或事件消费。
    producer: integration-service
    consumers: [user-service, notification-service, platform-ops]
    channel: callback_or_event
    payload_fields: [requestId, operation, status, provider, providerRequestId, normalizedError, retryable]

  - name: ExternalInteractionDeadLettered
    description: 外部交互超过重试上限或不可恢复失败，进入死信。
    producer: integration-service
    consumers: [platform-ops]
    channel: event_store
    payload_fields: [deadLetterId, requestId, operation, finalError, retryable, createdAt]

  - name: ExternalInteractionPassThroughDebtUsed
    description: 非生产短信验证码 pass-through 债务配置被使用，必须带 debtId、owner 和过期时间。
    producer: user-service
    consumers: [platform-ops]
    channel: event_store
    payload_fields: [requestId, challengeId, passThroughMode, debtId, owner, expiresAt]
