aggregate: ExternalInteraction

scenarios:
  - name: submit_typed_request_idempotent
    operation: SubmitExternalInteractionRequest
    go_func: TestExternalInteractionSubmitTypedIdempotent
    evidence: api_integration
    assertions:
      - 请求经强类型解码，缺 operation/idempotencyKey 返回 INTEGRATION.USER.invalid_external_request
      - 非法 operation 返回 INTEGRATION.USER.unsupported_operation
      - push_delivery.send 只接受 endpointRef/deliveryKey/callId/targetPersonaId/callType/callerName/sourceLabel/trustRelation/expiresAt
      - 同一 idempotencyKey 重放返回同一 requestId 受理结果
      - 受理只表示可靠接收，不表示 provider 成功

  - name: attempt_ledger_append_only
    operation: ListExternalInteractionAttempts
    go_func: TestExternalInteractionAttemptLedger
    evidence: api_integration
    assertions:
      - 每次 provider 调用追加一条 attempt，敏感字段只存 hash/脱敏值
      - attempt ledger 不可更新或删除

  - name: dead_letter_recover_roundtrip
    operation: RecoverExternalInteractionDeadLetter
    go_func: TestExternalInteractionDeadLetterRecover
    evidence: api_integration
    assertions:
      - 死信恢复后离开 dead_letter 列表并重置退避
      - 恢复不存在的任务返回结构化错误
      - metrics 快照的 pending/retry/dead 计数收敛

  - name: removed_typed_delivery_routes_unavailable
    operation: SubmitExternalInteractionRequest
    go_func: TestRemovedTypedDeliveryRoutesUnavailable
    evidence: local_contract
    assertions:
      - POST /integrations/push-deliveries 返回 404
      - POST /integrations/sms-otp:send 返回 404
      - 短信与推送只经 SubmitExternalInteractionRequest 的 payload.operation 表达
