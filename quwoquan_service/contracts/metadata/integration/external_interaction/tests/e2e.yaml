aggregate: ExternalInteraction
layer: e2e

description: |
  外部交互可靠受理的端到端场景（integration/staging）。
  push provider V1 deferred；短信真实外送依赖真实凭据（R-AUTH-001）。

scenarios:
  - name: reliable_submit_survives_worker_restart
    steps:
      - a service submits an external request with a stable idempotency key
      - the reliable task worker restarts before dispatch completes
    assertions:
      - request_not_lost_after_restart
      - no_duplicate_provider_attempt_for_same_key

  - name: dead_letter_visible_and_recoverable
    steps:
      - a request exhausts its retry budget against a failing provider endpoint
      - operator lists dead letters and recovers the task
    assertions:
      - dead_letter_listed_with_normalized_error
      - recovered_task_leaves_dead_letter_list
