version: 1

service:
  name: integration-service
  domain: integration
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: INTEGRATION_SMS_OTP_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: |
    SmsOtp 是 ExternalInteraction 的类型化外部引用，OTP challenge 归 User/Auth。
    发送与回调统一由 integration/external_interaction/service.yaml 声明，禁止恢复
    /v1/integrations/sms-otp 兼容路由。

api_routes: []

consumers:
  - name: external-interaction
    capabilities: [sms_otp_payload, sms_otp_callback_payload]
