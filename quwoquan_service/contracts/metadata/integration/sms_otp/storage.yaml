aggregate: SmsOtp
backend: mongodb

collections:
  external_provider_attempt_ledger:
    entity: SmsOtpProviderCallback
    indexes:
      - { name: idx_sms_attempt_request_created, keys: { requestId: 1, createdAt: 1 } }
      - { name: idx_sms_attempt_provider_status, keys: { provider: 1, status: 1 } }

redis_cache:
  - key: "rate:integration:sms_otp:{phoneHash}:cooldown"
    ttl_seconds: 60
    entity: SmsOtpSendPayload
    invalidate_on: [SmsOtpDeliverySucceeded, SmsOtpDeliveryFailed]
  - key: "rate:integration:sms_otp:{phoneHash}:hourly"
    ttl_seconds: 3600
    entity: SmsOtpSendPayload
    invalidate_on: [SmsOtpDeliverySucceeded, SmsOtpDeliveryFailed]
