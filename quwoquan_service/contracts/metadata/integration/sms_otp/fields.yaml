version: 1
aggregate: SmsOtp

enums:
  SmsOtpDeliveryStatus:
    values: [queued, sent_unconfirmed, delivered, failed, pass_through]
  SmsOtpPassThroughMode:
    values: [disabled, enabled]

entities:
  SmsOtpSendPayload:
    description: 短信验证码发送 payload，验证码明文不得进入日志或 provider attempt ledger。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: challengeId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: phoneHash
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: maskedPhone
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: mask
        api_exposure: read
        ops_exposure: read
      - name: codeRef
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: redact
        api_exposure: none
        ops_exposure: none
      - name: templateId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: callbackUrl
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: expiresAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  SmsOtpAccepted:
    description: 验证码短信请求已排队。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: status
        type: enum
        enum_ref: SmsOtpDeliveryStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: queuedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  SmsOtpProviderCallback:
    description: 短信供应商回执，进入 integration-service 后归一为 ExternalInteractionResult。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: challengeId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: providerMessageId
        type: string
        constraints: [NULLABLE]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: status
        type: enum
        enum_ref: SmsOtpDeliveryStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: signature
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: redact
        api_exposure: none
        ops_exposure: none
      - name: timestamp
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  SmsOtpCallbackAccepted:
    description: 短信回调已验签并幂等接收。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: accepted
        type: bool
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  SmsOtpPassThroughDebt:
    description: 非生产验证码跳过正确性校验临时债务，prod 必须 gate block。
    fields:
      - name: passThroughMode
        type: enum
        enum_ref: SmsOtpPassThroughMode
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: debtId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: owner
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: expiresAt
        type: date
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
