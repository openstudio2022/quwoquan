version: 1
aggregate: SmsOtp

enums:
  SmsOtpDeliveryStatus:
    values: [queued, sent_unconfirmed, delivered, failed]

entities:
  SmsOtpSendPayload:
    description: 短信验证码发送 payload，验证码明文不得进入日志或 provider attempt ledger。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: challengeId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: phoneHash
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: maskedPhone
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: mask
        api_exposure: read
        ops_exposure: read
      - name: codeRef
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: redact
        api_exposure: none
        ops_exposure: none
        description: >-
          AES-256-GCM 密封的短时 OTP dispatch 引用，密文内包含收件号码与验证码；
          AAD 绑定 requestId/challengeId/expiresAt。仅 integration-service 在供应商
          调用前于内存中解封，禁止进入日志、指标、attempt ledger 或公开响应。
      - name: templateId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: callbackUrl
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: expiresAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  SmsOtpAccepted:
    description: 验证码短信请求已排队。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: status
        type: enum
        enum_ref: SmsOtpDeliveryStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: queuedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  SmsOtpProviderCallback:
    description: 短信供应商回执，进入 integration-service 后归一为 ExternalInteractionResult。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: challengeId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: providerMessageId
        type: string
        constraints: [NULLABLE]
        classification: PRIVATE
        log_policy: hash
        api_exposure: read
        ops_exposure: read
      - name: status
        type: enum
        enum_ref: SmsOtpDeliveryStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: signature
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: redact
        api_exposure: none
        ops_exposure: none
      - name: timestamp
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  SmsOtpCallbackAccepted:
    description: 短信回调已验签并幂等接收。
    fields:
      - name: requestId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: accepted
        type: bool
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
