aggregate: Location

scenarios:
  - name: nearby_typed_query
    operation: GetNearbyLocations
    go_func: TestLocationNearbyTypedQuery
    evidence: api_integration
    assertions:
      - 经 generated path 常量与 typed query 参数访问，返回归一化 POI 列表
      - 非法坐标返回结构化 INTEGRATION.* 错误码，不透传 provider 原始错误

  - name: search_provider_failover
    operation: SearchLocations
    go_func: TestLocationSearchProviderFailover
    evidence: api_integration
    assertions:
      - 主 provider 超时切换备用 provider，端侧仍拿到位置候选
      - provider fallback 记录进审计元数据

  - name: external_reference_no_write_surface
    operation: SearchLocations
    go_func: TestLocationExternalReferenceReadOnly
    evidence: local_contract
    assertions:
      - Location 为 external_reference，只暴露只读查询
      - 无任何 mutation operation 或并发状态
