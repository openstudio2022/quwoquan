aggregate: Location
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  分层：
    dto_scenarios → quwoquan_app/test/local_contract/cloud/integration/**（location_poi_dto、location client contract）

dto_scenarios:
  - name: location_poi_wire_decode
    description: LocationPoi wire 解码只认 canonical 键，缺坐标 fail closed
    assertions:
      - poiId/title/coordinates 非空
      - 未知字段被忽略且不进入 DTO

  - name: location_error_codes_typed
    description: INTEGRATION location 错误码经 codegen 枚举消费
    assertions:
      - provider 超时映射结构化 RuntimeFailure
      - UI 展示统一降级提示而非原始错误

widget_scenarios:
  - name: publish_location_selector_degrades
    description: 定位能力不可用时发布地点选择页一致降级
    assertions:
      - 无系统定位权限仍可关键字搜索
      - 空结果展示独立空态
