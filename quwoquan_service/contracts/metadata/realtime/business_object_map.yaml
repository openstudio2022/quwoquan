domain: realtime
decision_refs:
- DDD-OBJ-001
- CTX-OWNERSHIP-007
- LEASE-009
bounded_contexts:
- name: Realtime
  context_id: realtime.realtime
  role: supporting
  access_policy:
    commands: aggregate_facade_only
    queries: named_reader_slice_only
    child_objects: aggregate_root_only
    cross_context: public_contract_only
objects:
- canonical_object: Connection
  bounded_context: Realtime
  object_kind: runtime_session
  identity:
    fields:
    - connectionId
    version_source: session
  invariant_refs: []
  member_bounds: {}
  storage_role: runtime
  mutation_entrypoints:
  - WebSocketUpgrade
  event_consumers: []
  lifecycle_refs: []
  storage_backend: redis
  access:
    commands: session_facade
    queries: named_reader
    cross_context: public_contract_only
  relationships: []
  field_roles:
    authoritative_state: []
    owned_value: []
    reference: []
    append_only_fact: []
    projection: []
    transport_only: []
- canonical_object: ChannelIngressReceipt
  bounded_context: Realtime
  object_kind: append_only_fact
  identity:
    fields:
    - id
    version_source: immutable
  invariant_refs: []
  member_bounds: {}
  storage_role: append_only
  mutation_entrypoints:
  - ChannelWebhook
  event_consumers: []
  lifecycle_refs: []
  storage_backend: postgresql
  source_document: realtime/channel_ingress_receipt/fields.yaml
  source_entity: ChannelIngressReceipt
  access:
    commands: append_only_sink
    queries: none
    cross_context: event_only
  relationships: []
  field_roles:
    authoritative_state: []
    owned_value: []
    reference: []
    append_only_fact:
    - id
    - channelType
    - providerEventId
    - payloadDigest
    - receivedAt
    projection: []
    transport_only: []
  local_identity_reasons:
    providerEventId: immutable correlation or idempotency key scoped to this fact or command; it is not a business-object
      reference
- canonical_object: PresenceView
  bounded_context: Realtime
  object_kind: projection
  identity:
    fields:
    - userId
    version_source: checkpoint
  invariant_refs: []
  member_bounds: {}
  storage_role: projection
  mutation_entrypoints: []
  event_consumers: []
  lifecycle_refs: []
  storage_backend: redis
  source_document: realtime/connection/fields.yaml
  source_entity: PresenceEntry
  access:
    commands: none
    queries: named_reader
    cross_context: public_contract_only
  relationships:
  - name: connectionSession
    target_object: realtime.Connection
    reference_fields:
    - connId
    kind: projection_source
    cardinality: N:1
    consistency: runtime
    access: event
    on_delete: detach
  field_roles:
    authoritative_state: []
    owned_value: []
    reference:
    - connId
    append_only_fact: []
    projection:
    - userId
    - connId
    - nodeId
    - transport
    - lastHeartbeatAt
    transport_only: []
  local_identity_reasons:
    nodeId: ephemeral realtime topology node key with no authoritative business-object lifecycle
