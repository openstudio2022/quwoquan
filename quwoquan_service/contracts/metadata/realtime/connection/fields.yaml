aggregate: Connection

entities:
  Connection:
    description: WebSocket/Long-polling 连接实体（内存态，不持久化）
    fields:
      - name: connId
        source: connId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 连接唯一标识（UUID）

      - name: accountId
        source: accountId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 可信 access principal 的账号安全主体，只用于账号级通道与审计

      - name: personaId
        source: personaId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 可信 access principal 的当前公开业务主体，RTC 与 presence 只按此身份路由

      - name: deviceId
        source: deviceId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: drop
        ops_exposure: read
        description: 可信设备主体；presentation ACK 与 PresenceView 的设备级 identity

      - name: transport
        source: transport
        type: enum
        enum_ref: TransportType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: websocket/long_poll

      - name: topics
        source: topics
        type: "[]string"
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 已订阅的 topic 列表

      - name: nodeId
        source: nodeId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 所在网关节点 ID

      - name: connectedAt
        source: connectedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: lastActiveAt
        source: lastActiveAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

  PresenceEntry:
    description: Persona 的设备级在线状态（Redis Hash，多节点共享）
    fields:
      - name: personaId
        source: personaId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: accountId
        source: accountId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: deviceId
        source: deviceId
        type: string
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: hash
        api_exposure: drop
        ops_exposure: read

      - name: connId
        source: connId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: nodeId
        source: nodeId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: transport
        source: transport
        type: enum
        enum_ref: TransportType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: lastHeartbeatAt
        source: lastHeartbeatAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

  PresenceView:
    description: notification-service 使用的设备级内部 named reader 结果
    fields:
      - name: personaId
        source: personaId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: devices
        source: devices
        type: embedded_list
        item_entity: PresenceEntry
        constraints: [NOT_NULL]
        classification: PRIVATE
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read
