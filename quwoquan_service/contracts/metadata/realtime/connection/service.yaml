
service:
  name: realtime-gateway
  domain: realtime
  owner: infra-team
  commercial_defaults:
    status: blocked
    block_reason: gamma full cold-start and websocket runtime evidence blocked by missing controlled product telemetry SLS credential
    gap_id: REALTIME_CONNECTION_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 统一实时通信网关（WebSocket + Long-polling），平台级基础设施

api_routes:
  # ── 连接凭据 ──────────────────────────────────
  - method: POST
    path: /realtime/tickets

    operation: IssueConnectionTicket
    actor: persona
    application:
      kind: session
      facet: ConnectionSessionFacet
      method: issueTicket
      session_owner: Connection
    description: 签发绑定可信 accountId+personaId+deviceId 的短期一次性连接 ticket（WS 升级 query 只携带 ticket）
    request_body_kind: none
    response_entity: ConnectionTicket
    response_body: ConnectionTicket
    response_body_kind: object
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - REALTIME.USER.unauthorized
      - REALTIME.USER.rate_limited
      - REALTIME.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: realtime_connection_ticket
      trace: true
      attributes: [operation, outcome, error_code]
    slo:
      latency_p95_ms: 200
      availability_percent: 99.9
    authorization:
      principal: account
      ownership_policy: ticket_self
    security:
      auth_mode: required
      principal: account
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  # ── WebSocket ──────────────────────────────────
  - method: GET
    path: /realtime/ws

    operation: WebSocketUpgrade
    actor: persona
    application:
      kind: session
      facet: ConnectionSessionFacet
      method: openWebSocket
      session_owner: Connection
    description: WebSocket Upgrade（query 携带一次性 ticket；服务端消费 ticket 派生可信身份后下发 auth_ack）
    query_params: [ticket]
    error_codes:
      - REALTIME.USER.ticket_invalid
      - REALTIME.USER.ticket_replayed
      - REALTIME.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: realtime_connection_session
      trace: true
      attributes: [operation, outcome, error_code, transport]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.9
    security:
      auth_mode: required
  # ── Long-polling ──────────────────────────────
  - method: GET
    path: /realtime/poll

    operation: LongPoll
    actor: persona
    application:
      kind: query
      facet: ConnectionQueryFacet
      method: longPoll
      reader: ConnectionEventReader
      slice: ConnectionEventBatchSlice
    description: Long-polling 兜底端点（标准 Bearer 鉴权，无需 ticket；hold ≤ timeout 秒，有消息立即返回，超时 204）
    query_params: [timeout]
    error_codes:
      - REALTIME.USER.unauthorized
      - REALTIME.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: realtime_connection_session
      trace: true
      attributes: [operation, outcome, error_code, transport]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    security:
      auth_mode: required

  # ── 设备级 Presence named reader ─────────────────
  - method: GET
    path: /internal/realtime/personas/{personaId}/presence
    operation: GetPersonaPresence
    actor: none
    application:
      kind: query
      facet: PresenceViewQueryFacet
      method: getPersonaPresence
      reader: PresenceViewReader
      slice: PresenceView
    description: notification-service 按 persona 读取当前仍有有效 heartbeat 的设备级在线投影；读取时逐 field 清理陈旧项
    path_params: [personaId]
    response_body: PresenceView
    response_body_kind: object
    authorization:
      principal: service
      scopes: [realtime.presence.read]
      ownership_policy: notification_incoming_call_coordinator
    commercial:
      status: ready
    reliability:
      timeout_ms: 500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - REALTIME.SYSTEM.internal_error
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: realtime_presence_view_device_count
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 100
      availability_percent: 99.95
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
  # ── 配置 ──────────────────────────────────────
  - method: GET
    path: /config/realtime

    operation: GetRealtimeConfig
    actor: none
    application:
      kind: query
      facet: RealtimeConfigQueryFacet
      method: getRealtimeConfig
      reader: RealtimeConfigReader
      slice: RealtimeConfigSlice
    description: 获取自适应传输系统配置参数（运维可热更新）
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: none

  # ── 健康检查 ──────────────────────────────────
  - method: GET
    path: /healthz
    operation: HealthCheck
    actor: none
    application:
      kind: query
      facet: RuntimeHealthQueryFacet
      method: healthCheck
      reader: HealthStatusReader
      slice: HealthStatusSlice
    description: 健康检查
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: none

  - method: GET
    path: /metrics
    operation: Metrics
    actor: none
    application:
      kind: query
      facet: RuntimeMetricsQueryFacet
      method: metrics
      reader: RuntimeMetricsReader
      slice: RuntimeMetricsSlice
    description: Prometheus 指标端点
    privacy:
      request_classification: PUBLIC
      response_classification: INTERNAL
      log_policy: none

consumers:
  - name: app
    capabilities: [issue_ticket, websocket_connect, long_poll, get_config]
  - name: chat-service
    capabilities: []
    description: chat-service 通过 Redis Pub/Sub 推送消息，不直接调用 API
  - name: notification-service
    capabilities: []
    description: realtime-gateway 通过事件通知离线推送
