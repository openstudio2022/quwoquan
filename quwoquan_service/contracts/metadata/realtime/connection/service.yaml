version: 1

service:
  name: realtime-gateway
  domain: realtime
  owner: infra-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: REALTIME_CONNECTION_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 统一实时通信网关（WebSocket + Long-polling），平台级基础设施

api_routes:
  # ── WebSocket ──────────────────────────────────
  - method: GET
    path: /v1/realtime/ws
    operation: WebSocketUpgrade
    actor: account
    application:
      kind: session
      facet: ConnectionSessionFacet
      method: openWebSocket
      session_owner: Connection
    description: WebSocket Upgrade（JWT query param 鉴权）
    auth: required

  # ── Long-polling ──────────────────────────────
  - method: GET
    path: /v1/realtime/poll
    operation: LongPoll
    actor: account
    application:
      kind: query
      facet: ConnectionQueryFacet
      method: longPoll
      reader: ConnectionEventReader
      slice: ConnectionEventBatchSlice
    description: Long-polling 端点（hold ≤ poll_interval_sec，有消息立即返回，超时 204）
    query_params: [topics, lastSeq, timeout]
    auth: required

  # ── 配置 ──────────────────────────────────────
  - method: GET
    path: /v1/config/realtime
    operation: GetRealtimeConfig
    actor: none
    application:
      kind: query
      facet: RealtimeConfigQueryFacet
      method: getRealtimeConfig
      reader: RealtimeConfigReader
      slice: RealtimeConfigSlice
    description: 获取自适应传输系统配置参数（运维可热更新）

  # ── 健康检查 ──────────────────────────────────
  - method: GET
    path: /healthz
    operation: HealthCheck
    actor: none
    application:
      kind: query
      facet: RuntimeHealthQueryFacet
      method: healthCheck
      reader: HealthStatusReader
      slice: HealthStatusSlice
    description: 健康检查

  - method: GET
    path: /metrics
    operation: Metrics
    actor: none
    application:
      kind: query
      facet: RuntimeMetricsQueryFacet
      method: metrics
      reader: RuntimeMetricsReader
      slice: RuntimeMetricsSlice
    description: Prometheus 指标端点

consumers:
  - name: app
    capabilities: [websocket_connect, long_poll, get_config]
  - name: chat-service
    capabilities: []
    description: chat-service 通过 Redis Pub/Sub 推送消息，不直接调用 API
  - name: notification-service
    capabilities: []
    description: realtime-gateway 通过事件通知离线推送
