aggregate: Connection
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  覆盖：ticket 流、传输栈状态机、事件 envelope 解码、alpha fixture 注入。
  分层（与仓库实际目录对齐）：
    transport_scenarios → quwoquan_app/test/local_contract/cloud/realtime/realtime_transport_contract__local_contract_test.dart
    manager_scenarios   → quwoquan_app/test/local_contract/cloud/realtime/（connection manager / delegate）
    fixture_scenarios   → quwoquan_app/test/local_contract/cloud/realtime/realtime_fixture_delegate__local_contract_test.dart

transport_scenarios:
  - name: ticket_before_upgrade
    description: 连接前先经 IssueConnectionTicket 换取一次性 ticket；WS/LongPoll query 只携带 ticket
    assertions:
      - 长期 access token 不出现在任何 URL query
      - ticket 获取失败按结构化错误重试（ticket 三态语义与云侧同源）

  - name: auth_ack_handshake
    description: 升级成功后等待服务端 auth_ack 帧；超时按重连退避处理
    assertions:
      - auth_ack 前不投递业务事件
      - prod 环境不再 fail-closed（凭据链路对全环境可用）

  - name: reconnect_backoff_state_machine
    description: 断线重连指数退避与心跳保活
    assertions:
      - 重连成功后事件流恢复且不重复投递

manager_scenarios:
  - name: event_envelope_decode
    description: 事件 envelope（type/payload）解码与订阅分发
    assertions:
      - chat 与 rtc 事件类型经同一通道分发到各自订阅者
      - 未知事件类型忽略且结构化记录

fixture_scenarios:
  - name: alpha_fixture_injection
    description: alpha runner 从 immutable bundle 注入 realtime fixture 事件
    assertions:
      - production composition 不可达 fixture delegate
