entity: Connection

scenarios:
  - name: connection_ticket_one_time_consumption
    operation: IssueConnectionTicket
    go_func: TestConnectionTicketOneTimeConsumption
    evidence: api_integration
    assertions:
      - Bearer 鉴权签发 ticket；无凭据返回 REALTIME.USER.unauthorized
      - ticket 一次性消费（GETDEL）；重放返回 ticket_replayed
      - 伪造或超 TTL 的 ticket 均归并 ticket_invalid（存储上键不存在）

  - name: websocket_upgrade_trusted_identity
    operation: WebSocketUpgrade
    go_func: TestEventsAreRoutedByTrustedIdentityOnly
    test_file: quwoquan_service/services/realtime-gateway/tests/local_contract/gateway__local_contract_test.go
    evidence: local_contract
    assertions:
      - 升级只接受 query ticket；不读取客户端身份 header 与长期 access token
      - 服务端消费 ticket 派生可信 accountId+personaId+deviceId 后下发 auth_ack 帧
      - accountId 与 personaId 不相等时，RTC 只订阅 rt:rtc:persona:{personaId}
      - 不订阅 rt:rtc:user/account alias，Persona A 收不到 Persona B 的事件

  - name: connection_lease_fencing
    operation: WebSocketUpgrade
    go_func: TestConnectionLeaseFencing
    evidence: api_integration
    assertions:
      - 每连接持有 lease，心跳续租，租约过期自动出清 presence
      - 新连接取号后旧连接 fencing token 失效，旧连接写入被拒绝

  - name: longpoll_fallback_contract
    operation: LongPoll
    go_func: TestLongPollFallbackContract
    evidence: api_integration
    assertions:
      - 有事件立即返回批次；无事件 hold 至 timeout 返回 204
      - lastSeq 游标不丢事件、不重复投递

  - name: persona_device_presence_view
    operation: GetPersonaPresence
    go_func: TestPresenceViewRemovesStaleDeviceFieldsIndependently
    test_file: quwoquan_service/services/realtime-gateway/tests/local_contract/gateway__local_contract_test.go
    evidence: local_contract
    assertions:
      - presence key 仅为 presence:persona:{personaId}，field 为 trusted deviceId
      - accountId/personaId/deviceId 三元组来自 trusted ticket/principal，客户端 topic 不参与路由
      - reader 按每个 field 的 lastHeartbeatAt 判断新鲜度并 HDEL 陈旧设备
      - 一个活跃设备的 heartbeat 不得延长同 persona 下其它 stale field 的在线状态

  - name: persona_device_targeted_rtc_delivery
    operation: WebSocketUpgrade
    go_func: TestRTCPersonaChannelFiltersDeviceTargetedFrames
    test_file: quwoquan_service/services/realtime-gateway/tests/local_contract/gateway__local_contract_test.go
    evidence: local_contract
    assertions:
      - 同 persona 的多个设备共享 rt:rtc:persona:{personaId}，但带 deviceId 的来电帧只交付匹配 trusted deviceId 的连接
      - 不带 deviceId 的 CallAnswered/CallEnded 展示取消帧广播到该 persona 的全部在线设备
      - accountId 与 personaId 不同不会改变 RTC persona 路由或设备过滤
