version: 1
entity: UserLifeItem

fields:
  - { name: id,          type: string,    constraints: [PK, NOT_NULL],  api_exposure: public }
  - { name: userId,      type: string,    constraints: [NOT_NULL],      api_exposure: public }
  - { name: category,    type: enum,      enum_ref: LifeItemCategory, constraints: [NOT_NULL], api_exposure: public, description: "生活 Tab 子分类：footprint=足迹/soul=书影音/taste=味蕾/private=爱物" }
  - { name: title,       type: string,    constraints: [NOT_NULL],      api_exposure: public, description: "记录标题（端侧主文案）" }
  - { name: subtitle,    type: string,                                   api_exposure: public, description: "记录副标题/描述" }
  - { name: imageUrl,    type: string,                                   api_exposure: public, description: "封面图（绝对 URL 或对象键）" }
  - { name: refId,       type: string,                                   api_exposure: public, description: "关联内容引用（作品/圈子等）" }
  - { name: sortOrder,   type: int,       constraints: [NOT_NULL],      api_exposure: public }
  - { name: createdAt,   type: timestamp, constraints: [NOT_NULL],      api_exposure: public }
  - { name: updatedAt,   type: timestamp, constraints: [NOT_NULL],      api_exposure: public }
