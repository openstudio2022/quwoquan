version: 1
domain: user
entity_name: UserLifeItem
aggregate_root: false

description: |
  用户主页「生活」Tab 展示的生活记录项。
  按 category 归类（LifeItemCategory：footprint=足迹 / soul=书影音 / taste=味蕾 / private=爱物），可自定义排序。
  通过 refId 关联内容（作品、圈子等）。

storage_backend: postgres
cache_layer: none

ddd_layer_mapping:
  domain_model: internal/domain/user/model
  repository: internal/domain/user/repository
  application: internal/application
