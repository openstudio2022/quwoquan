version: 1
read_model: UserLifeItem

description: |
  GET /v1/users/{userId}/life-items 分页列表元素。该读模型来自
  user/user_life_item 独立 aggregate，供 user_profile 主页生活 Tab
  作为跨 metadata 响应模型引用。

client_projection:
  dart_class: UserLifeItemDto
  output_path: cloud/runtime/generated/user/user_life_item_dto.g.dart

source_entities:
  - UserLifeItem

consumers:
  - app

fields:
  - { name: id, type: string }
  - { name: userId, type: string }
  - { name: category, type: enum, enum_ref: LifeItemCategory, description: "footprint/soul/taste/private" }
  - { name: title, type: string }
  - { name: subtitle, type: string, nullable: true }
  - { name: imageUrl, type: string, nullable: true }
  - { name: refId, type: string, nullable: true }
  - { name: sortOrder, type: int }
  - { name: createdAt, type: timestamp }
  - { name: updatedAt, type: timestamp }
