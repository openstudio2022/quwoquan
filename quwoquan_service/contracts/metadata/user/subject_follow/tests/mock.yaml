aggregate: SubjectFollow
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: subject_follow_command_result_parse
    description: SubjectFollowCommandResult 强类型解析
    assertions:
      - subject_type_enum_valid
      - state_enum_valid
      - idempotent_replay_parsed

  - name: alpha_facet_follow_unfollow_toggle
    description: alpha mock facet 的 follow/unfollow 状态机与 production 契约同型
    assertions:
      - follow_sets_state_following
      - unfollow_sets_state_unfollowed
      - repeated_follow_idempotent

  - name: error_code_mapping
    description: subject_follow 错误码端侧映射
    cases:
      - http_status: 400
        code: USER.SUBJECT_FOLLOW.invalid_subject_type
        expected_dart_const: subjectFollowInvalidSubjectType
