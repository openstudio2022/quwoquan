- actor: account
  application:
    kind: command
    facet: AccountLifecycleCommandFacade
    method: closeAccount
    aggregate_owner: UserAccount
    mutation_target: UserAccount
    invariant_target: UserAccount
  description: >-
    账号注销（Apple App Review 5.1.1(v)：App 内自助发起）。closed 为终态：
    同事务落 accountState=closed，吊销全部 AccountSession、失效全部
    CredentialBinding、退役全部 Persona，并发布 UserAccountClosed 事件驱动
    下游（content/chat/circle/search/notification）删除或匿名化关联数据。
    已 closed 账号重放返回幂等成功；匿名（guest）账号同样可注销。
