aggregate: UserAccount
backend: postgres

tables:
  user_profiles:
    entity: UserAccount
    pk: user_id
    columns:
      - { name: user_id, type: VARCHAR(96), constraints: [PK] }
      - { name: account_state, type: VARCHAR(32), constraints: [NOT_NULL], default: "'active'" }
      - { name: auth_epoch, type: BIGINT, constraints: [NOT_NULL], default: 1 }
      - { name: suspension_case_ref, type: VARCHAR(128) }
      - { name: suspended_at, type: TIMESTAMPTZ }
      - { name: identity_origin, type: VARCHAR(32), constraints: [NOT_NULL], default: "'phone'" }
      - { name: logical_shard, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: anonymous_retention_policy, type: VARCHAR(32), constraints: [NOT_NULL], default: "'preserve'" }
      - { name: phone, type: VARCHAR(64), constraints: [UNIQUE] }
      - { name: nickname, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: nickname_customized, type: BOOLEAN, constraints: [NOT_NULL], default: false }
      - { name: avatar_url, type: TEXT }
      - { name: avatar_asset_id, type: VARCHAR(64) }
      - { name: avatar_version, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: background_url, type: TEXT }
      - { name: background_asset_id, type: VARCHAR(64) }
      - { name: bio, type: VARCHAR(500) }
      - { name: identity_tags, type: TEXT }
      - { name: gender, type: VARCHAR(16) }
      - { name: birth_date, type: DATE }
      - { name: region, type: VARCHAR(128) }
      - { name: region_code, type: VARCHAR(32) }
      - { name: status, type: VARCHAR(16), constraints: [NOT_NULL], default: "'active'" }
      - { name: profile_version, type: INTEGER, constraints: [NOT_NULL], default: 1 }
      - { name: follower_count, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: following_count, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: post_count, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: circle_count, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: like_count, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: owner_display_name, type: VARCHAR(64) }
      - { name: sub_account_count, type: INTEGER, constraints: [NOT_NULL], default: 1 }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
    indexes:
      - { name: idx_user_profiles_nickname, columns: [nickname] }
      - { name: idx_user_profiles_phone, columns: [phone] }
      - { name: idx_user_profiles_status, columns: [status] }
      - { name: idx_user_profiles_account_state, columns: [account_state] }
    search_indexes:
      - { name: gin_user_profiles_search, columns: [nickname, bio], type: GIN_TRGM }

  anonymous_device_bindings:
    entity: AnonymousDeviceBinding
    pk: id
    fk: { column: owner_id, references: user_profiles.user_id, on_delete: CASCADE }
    columns:
      - { name: id, type: VARCHAR(64), constraints: [PK] }
      - { name: owner_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: install_id_hash, type: VARCHAR(256), constraints: [NOT_NULL] }
      - { name: device_fingerprint_hash, type: VARCHAR(256), constraints: [NOT_NULL] }
      - { name: platform, type: VARCHAR(16), constraints: [NOT_NULL] }
      - { name: app_version, type: VARCHAR(32) }
      - { name: last_seen_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
    indexes:
      - { name: idx_anonymous_device_bindings_owner_id, columns: [owner_id] }
      - { name: idx_anonymous_device_bindings_install_id_hash, columns: [install_id_hash] }
    unique_constraints:
      - { name: uq_anonymous_device_bindings_fingerprint, columns: [device_fingerprint_hash] }
    cache_excluded: true

  profile_qr_tokens:
    entity: ProfileQrToken
    pk: token_id
    fk: { column: owner_user_id, references: user_profiles.user_id, on_delete: CASCADE }
    columns:
      - { name: token_id, type: VARCHAR(64), constraints: [PK] }
      - { name: token_hash, type: VARCHAR(128), constraints: [NOT_NULL, UNIQUE] }
      - { name: owner_user_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: sub_account_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: user_handle, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: style_version, type: VARCHAR(16), constraints: [NOT_NULL], default: "'v1'" }
      - { name: status, type: VARCHAR(16), constraints: [NOT_NULL], default: "'active'" }
      - { name: expires_at, type: TIMESTAMPTZ }
      - { name: revoked_at, type: TIMESTAMPTZ }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
    indexes:
      - { name: idx_profile_qr_tokens_owner_status, columns: [owner_user_id, status] }
      - { name: idx_profile_qr_tokens_handle, columns: [user_handle] }
      - { name: idx_profile_qr_tokens_hash, columns: [token_hash] }
    unique_constraints:
      - { name: uq_profile_qr_tokens_hash, columns: [token_hash] }
    cache_excluded: true

  user_auth:
    entity: UserAuth
    pk: user_id
    fk: { column: user_id, references: user_profiles.user_id, on_delete: CASCADE }
    description: 仅承载登录失败计数与锁定状态；refresh 会话归 account_sessions（只存哈希）。
    columns:
      - { name: user_id, type: VARCHAR(96), constraints: [PK] }
      - { name: password_hash, type: VARCHAR(256), constraints: [NOT_NULL] }
      - { name: otp_secret, type: VARCHAR(128) }
      - { name: last_login_at, type: TIMESTAMPTZ }
      - { name: last_login_ip, type: VARCHAR(45) }
      - { name: login_fail_count, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: locked_until, type: TIMESTAMPTZ }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
    cache_excluded: true

  consent_records:
    entity: ConsentRecord
    pk: id
    fk: { column: owner_id, references: user_profiles.user_id, on_delete: CASCADE }
    columns:
      - { name: id, type: VARCHAR(64), constraints: [PK] }
      - { name: owner_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: agreement_version, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: privacy_version, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: accepted_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: device_id, type: VARCHAR(128) }
      - { name: platform, type: VARCHAR(32) }
      - { name: source_operation, type: VARCHAR(64), constraints: [NOT_NULL] }
    indexes:
      - { name: idx_consent_records_owner_id, columns: [owner_id] }
      - { name: idx_consent_records_source_operation, columns: [source_operation] }

redis_cache:
  - key: "cache:user_profile:{userId}"
    ttl_seconds: 600
    entity: UserAccount
    invalidate_on: [UserProfileUpdated]

  - key: "device_tokens:{userId}"
    ttl_seconds: 3600
    entity: UserDevice
    type: set
    description: 推送 token 集合

  - key: "login_fail:{userId}"
    ttl_seconds: 1800
    type: string
    description: 登录失败滑动窗口计数
