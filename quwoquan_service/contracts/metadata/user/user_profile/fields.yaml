version: 1
aggregate: UserAccount

# 语义说明：
#   UserAccount = 账号生命周期根
#   Persona     = 子账号主体容器（内部实现仍沿用 Persona 命名，但只保留 subAccountId 作为主体 ID）

entities:
  UserAccount:
    description: 用户根实体——登录凭证、设备、恢复、审计与多分身管理容器
    fields:
      - name: userId
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 全局唯一 owner ID；匿名与注册账号都使用同一稳定主键规则

      - name: accountState
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write
        recommend_feature: false
        description: 账号生命周期状态：anonymous | active | suspended | deleted

      - name: identityOrigin
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 首次创建来源：anonymous_device | phone | wechat | alipay | qq | apple | passkey | migrated_seed

      - name: logicalShard
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 固定逻辑槽位；由结构化 ownerId 生成并长期稳定

      - name: anonymousRetentionPolicy
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write
        recommend_feature: false
        description: 匿名痕迹保留策略；当前固定为 preserve

      - name: phone
        type: string
        constraints: [UK, NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: drop
        ops_exposure: mask
        recommend_feature: false
        description: 手机号（登录凭证）；匿名账号允许为空

      - name: nickname
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        search_field: true
        description: 昵称（显示名，允许重复，不再作为唯一标识；唯一性由 userId/subAccountId/userHandle 承担）

      - name: nicknameCustomized
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 用户是否手动修改过昵称；首次创建的系统默认昵称为 false，用户改名后置 true，端侧据此决定是否展示昵称编辑画笔

      - name: avatarUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: false

      - name: avatarAssetId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 用户头像资产主键；作为头像真相源的稳定引用

      - name: avatarVersion
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 用户头像版本号；用于群头像重算与 patch 幂等

      - name: backgroundUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: false
        description: owner 基线主页头图 URL

      - name: backgroundAssetId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 用户主页头图资产主键；作为封面图真相源的稳定引用

      - name: bio
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        search_field: true
        description: 个人签名

      - name: identityTags
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        search_field: true
        description: 主页单行身份标签（用户语言短词，如「AI产品 / 摄影 / 旅行 / 北京」），端侧以 · 分隔单行展示；与 bio 互补不重复

      - name: interestTags
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        tag_ref: true
        description: 声明式用户兴趣（路径制 tagRef，真相源 control_plane/governance/taxonomy）；与行为派生兴趣互补，用于兴趣维度交集与冷启动召回

      - name: gender
        type: enum
        enum_ref: Gender
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read_write
        ops_exposure: mask
        recommend_feature: true

      - name: birthDate
        type: date
        constraints: [NULLABLE]
        classification: PII
        log_policy: drop
        api_exposure: read_write
        ops_exposure: drop
        recommend_feature: false

      - name: region
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 地区（ipResidenceProfile 落库）

      - name: regionTagRef
        type: tag_ref
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 省市两级结构化行政区 tagRef，公开展示由 tag-service 派生

      - name: status
        type: enum
        enum_ref: UserStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write
        recommend_feature: false
        observe_metric: user_status_gauge

      - name: profileVersion
        type: int
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 画像快照版本号（端侧增量校验）

      - name: followerCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 关注该用户主页的人数；人页统计前台展示为「粉丝」（字段名 followerCount 不变，禁止使用「关注者」）

      - name: followingCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: postCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: circleCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 已加入圈子数（由 circle-service 成员变更事件驱动更新）

      - name: likeCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 获赞总数（由 content-service 点赞事件驱动更新）

      - name: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: ownerDisplayName
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: drop
        ops_exposure: read
        recommend_feature: false
        description: 主控账号管理视角名称（仅自己控制台可见，不对外展示）

      - name: subAccountCount
        type: int
        constraints: [NOT_NULL, DEFAULT_1]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 当前持有子账号数量（冗余计数）

      - name: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false

  LoginAccountHint:
    description: 登录页历史账号或运营商命中账号的脱敏摘要；只用于展示和二次登录，不是认证事实
    cache_excluded: true
    fields:
      - name: displayName
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 登录页展示昵称；优先 ownerDisplayName，其次 nickname

      - name: nicknameCustomized
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 昵称是否为用户主动设置或第三方授权同步的有效公开昵称；端侧不得通过昵称格式猜测

      - name: avatarUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: avatarAssetId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: maskedPhone
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: mask
        description: 脱敏手机号，如 138****8888；端侧不得接触真实手机号

      - name: identityOrigin
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: lastLoginAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  OneTapLoginHintResponse:
    description: 运营商一键登录提示响应；不签发 token，只返回脱敏号码和账号摘要
    cache_excluded: true
    fields:
      - name: state
        type: enum
        enum_ref: OneTapLoginHintState
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: maskedPhone
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: mask

      - name: registered
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: accountHint
        type: object
        object_ref: LoginAccountHint
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: mask

      - name: expiresInSeconds
        type: int
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: providerRequestId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

    enums:
      OneTapLoginHintState:
        values: [registered, new_phone, unavailable]
        description: 运营商号码是否命中已有账号

  CarrierProviderAuditContext:
    description: 运营商服务商审计上下文；禁止记录真实手机号和 carrier token
    cache_excluded: true
    fields:
      - name: provider
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: providerRequestId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: latencyMs
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: resultCode
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: occurredAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

  ConsentRecord:
    description: 登录前用户协议与隐私政策同意记录；用于登录、数据权利与法务审计
    cache_excluded: true
    fields:
      - name: id
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: ownerId
        type: string
        constraints: [FK_user_profiles_CASCADE, NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: agreementVersion
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: privacyVersion
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: acceptedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: deviceId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: platform
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: sourceOperation
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

    business_rules:
      - id: last_credential_protection
        description: OwnerAccount 至少保留 1 个 isActive=true 的凭证，不能全部解绑

  AnonymousDeviceBinding:
    description: 匿名设备到 owner 账号的稳定绑定，不直接暴露或依赖原始设备标识
    cache_excluded: true
    fields:
      - name: id
        type: string
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: ownerId
        type: string
        constraints: [FK_user_profiles_CASCADE, NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 绑定到的匿名或已升级 owner ID

      - name: installIdHash
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: drop
        api_exposure: drop
        ops_exposure: drop
        description: 安装实例标识的哈希值，仅用于审计和定位

      - name: deviceFingerprintHash
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: drop
        api_exposure: drop
        ops_exposure: drop
        description: 设备指纹摘要；同设备稳定命中同一匿名 owner

      - name: platform
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: appVersion
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: lastSeenAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

    unique_constraints:
      - columns: [deviceFingerprintHash]
        description: 同一设备指纹只能绑定到一个 owner

  ProfileQrToken:
    description: 我的二维码可撤销 token 存储；仅保存 token hash，不保存手机号、ownerId 或 bearer token
    fields:
      - name: tokenId
        type: string
        constraints: [PK]
        classification: INTERNAL
        log_policy: mask
        api_exposure: drop
        ops_exposure: mask

      - name: tokenHash
        type: string
        constraints: [NOT_NULL, UK]
        classification: INTERNAL
        log_policy: drop
        api_exposure: drop
        ops_exposure: mask

      - name: ownerUserId
        type: string
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: subAccountId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: userHandle
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: styleVersion
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: status
        type: string
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: expiresAt
        type: timestamp
        constraints: [NULLABLE]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: revokedAt
        type: timestamp
        constraints: [NULLABLE]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

  UserAuth:
    description: 认证凭证（安全隔离，不缓存到 Redis）
    cache_excluded: true
    fields:
      - name: userId
        type: string
        constraints: [PK, FK_user_profiles_CASCADE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: drop
        description: 1:1 关联

      - name: passwordHash
        type: string
        constraints: [NOT_NULL]
        classification: SECRET
        log_policy: drop
        api_exposure: drop
        ops_exposure: drop

      - name: otpSecret
        type: string
        constraints: [NULLABLE]
        classification: SECRET
        log_policy: drop
        api_exposure: drop
        ops_exposure: drop

      - name: refreshToken
        type: string
        constraints: [NULLABLE]
        classification: SECRET
        log_policy: drop
        api_exposure: drop
        ops_exposure: drop

      - name: refreshTokenExpiresAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: drop

      - name: lastLoginAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: lastLoginIp
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: drop
        ops_exposure: mask

      - name: loginFailCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        observe_metric: login_fail_counter

      - name: lockedUntil
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read

      - name: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: drop

      - name: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: drop

  AppearanceSettingsView:
    description: 聚合 owner 默认值与当前子账号 override 后的 appearance 快照
    fields:
      - name: themeMode
        type: enum
        enum_ref: ThemeModeSetting
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: fontSizePreset
        type: enum
        enum_ref: FontSizePreset
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: source
        type: enum
        enum_ref: AppearanceSource
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: ownerDefaultThemeMode
        type: enum
        enum_ref: ThemeModeSetting
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: ownerDefaultFontSizePreset
        type: enum
        enum_ref: FontSizePreset
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: hasSubAccountOverride
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: version
        type: int
        constraints: [NOT_NULL, DEFAULT_1]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  AppearanceSettingsMutation:
    description: 写入外观与字号偏好的统一 mutation
    fields:
      - name: themeMode
        type: enum
        enum_ref: ThemeModeSetting
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
      - name: fontSizePreset
        type: enum
        enum_ref: FontSizePreset
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: applyScope
        type: enum
        enum_ref: AppearanceApplyScope
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 当前子账号 / 全部账号 / 恢复继承

  ProfileInheritanceStateView:
    description: 用户基线与分身 override 合成后的继承状态视图
    fields:
      - name: inheritsFromOwner
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
