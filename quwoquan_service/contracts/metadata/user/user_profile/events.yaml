aggregate: UserAccount

events:
  - name: UserProfileUpdated
    description: 用户资料已更新
    producer: user-service
    consumers: [recommendation-engine, notification-service, search-service]
    channel: event_store
    payload_entity: UserAccount
    payload_fields: [userId, nickname, profileVersion, updatedAt]

  - name: UserAvatarUpdated
    description: 用户头像已更新
    producer: user-service
    consumers: [content-service, search-service]
    channel: event_store
    payload_entity: UserAccount
    payload_fields: [userId, avatarUrl, avatarVersion, profileVersion, updatedAt]

  - name: UserRegistered
    description: 用户注册完成
    producer: user-service
    consumers: [recommendation-engine, notification-service, assistant-service]
    channel: event_store
    payload_entity: UserAccount
    payload_fields: [userId, nickname, gender, region, createdAt]
    recommend_impact: cold_start_profile

  - name: UserSuspended
    description: 用户账户停用
    producer: user-service
    consumers: [content-service, chat-service, circle-service, notification-service]
    channel: event_store
    payload_entity: UserAccount
    payload_fields: [userId, status]
