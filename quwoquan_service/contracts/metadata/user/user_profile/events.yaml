aggregate: UserAccount

events:
  - name: UserProfileUpdated
    description: 用户资料已更新
    producer: user-service
    consumers: [recommendation-engine, notification-service, search-service]
    channel: event_store
    payload_entity: UserAccount
    payload_fields: [userId, nickname, profileVersion, updatedAt]

  - name: UserAvatarUpdated
    description: 用户头像已更新
    producer: user-service
    consumers: [content-service, search-service]
    channel: event_store
    payload_entity: UserAccount
    payload_fields: [userId, avatarUrl, avatarVersion, profileVersion, updatedAt]

  - name: UserRegistered
    description: 用户注册完成
    producer: user-service
    consumers: [recommendation-engine, notification-service, assistant-service]
    channel: event_store
    payload_entity: UserAccount
    payload_fields: [userId, nickname, gender, region, createdAt]
    recommend_impact: cold_start_profile

  - name: UserSuspended
    description: >
      受信运营 Suspend decision 已原子生效。下游必须落可逆 restriction projection，
      隐藏可见性/拒绝写入/抑制投递；不得调用 UserAccountClosed 的删除或匿名化路径。
    producer: user-service
    consumers: [content-service, chat-service, circle-service, notification-service, search-service]
    channel: events.user.account
    payload_entity: UserAccountEnforcementPayload
    payload_fields: [userId, personaIds, accountState, authEpoch, decisionRef, occurredAt]

  - name: UserRestored
    description: >
      受信 Restore decision 已原子生效。下游只能恢复可逆 restriction projection；
      不得恢复 closed 账号、旧 session/token、已删除数据或已过期通知。
    producer: user-service
    consumers: [content-service, chat-service, circle-service, notification-service, search-service]
    channel: events.user.account
    payload_entity: UserAccountEnforcementPayload
    payload_fields: [userId, personaIds, accountState, authEpoch, decisionRef, occurredAt]

  - name: UserAccountClosed
    description: >
      账号已注销（closed 终态）；下游必须删除或匿名化该账号关联的可见数据与索引。
      有状态 recommendation-engine 由 content-service 内 accountclosure 子步骤负责；
      无账号私有持久状态的 rec-model-service 不建立重复 consumer。
    producer: user-service
    consumers: [content-service, chat-service, circle-service, notification-service, search-service]
    channel: events.user.account
    payload_entity: UserAccountClosedPayload
    payload_fields: [userId, personaIds, accountState, updatedAt]
    responsibility_bindings:
      recommendation-engine: content-service
      rec-model-service: stateless_excluded
