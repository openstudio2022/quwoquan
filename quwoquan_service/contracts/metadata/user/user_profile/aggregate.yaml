domain: user
aggregate_root: UserAccount
object_kind: aggregate_root

description: |
  用户档案聚合（当前 ContractGraph 中保留 UserAccount 名称的 UserAccount 语义根）。
  该根只拥有账号认证与安全状态；Persona、CredentialBinding、UserDevice、
  UserSetting、ProfileUpdateProposal 均按独立生命周期对象治理，不作为 owned member。
  对这些对象的关联只在 business_object_map 中登记，跨聚合读取由具名 Reader
  组装，禁止通过聚合 members 或数据库 join 暗示直接访问。

storage_backend: postgres
cache_layer: redis
cache_ttl_seconds: 600

capabilities:
  - queryable
  - searchable

taggable: true
vector_enabled: false

members: []

business_rules:
  - accountState、identityOrigin 与 logicalShard 仅由账号生命周期命令或受信事件修改
  - UserAccount 不保存公开 Persona 资料、凭证 secret、Session token、设备 token 或设置值
  - 一个 Account 可以引用多个 Persona，但不得跨聚合事务直接修改 Persona
  - close 为终态并通过 outbox 驱动 credential、session 与 device 吊销
  - CloseAccount 由账号本人 App 内自助发起（Apple 5.1.1(v)）；已 closed 重放为幂等成功
  - actor、accountId 与审计元数据只来自 trusted principal 和 invocation context
lifecycle:
  states: [anonymous, active, suspended, closed]
  optimistic_concurrency: version
  idempotency: event_or_command_receipt


ddd_layer_mapping:
  domain_model: internal/domain/user/model
  ports: internal/domain/account/user_account/ports
  application: internal/application/user
  adapter_rest: internal/adapter/rest/user
  adapter_event: internal/adapter/event/user
