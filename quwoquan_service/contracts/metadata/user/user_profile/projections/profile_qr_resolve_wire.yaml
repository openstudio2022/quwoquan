version: 1
read_model: ProfileQrResolveWire

description: |
  GET /v1/public/profile/qr/resolve 返回的公开扫码解析结果。只返回规范主页目标，
  不包含手机号、ownerId 或 bearer token。

source_entities:
  - ProfileQrToken
  - Persona

consumers:
  - app

client_projection:
  dart_class: ProfileQrResolveWireDto
  base_class: ""
  output_path: cloud/runtime/generated/user/profile_qr_resolve_wire_dto.g.dart
  fields:
    - name: subAccountId
      dart_type: String
      nullable: false
      source: subAccountId
      aliases: [subAccountId]
      default: "''"

    - name: userHandle
      dart_type: String
      nullable: false
      source: userHandle
      aliases: [userHandle]
      default: "''"

    - name: publicProfileUrl
      dart_type: String
      nullable: false
      source: publicProfileUrl
      aliases: [publicProfileUrl]
      default: "''"

    - name: scanStatus
      dart_type: String
      nullable: false
      source: scanStatus
      aliases: [scanStatus]
      default: "'accepted'"
