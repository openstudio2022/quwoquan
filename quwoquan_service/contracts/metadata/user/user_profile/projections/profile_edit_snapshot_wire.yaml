version: 1
read_model: ProfileEditSnapshotWire

description: |
  GET /v1/user/profile/edit-snapshot 返回的本人资料编辑私有快照，合并 owner/profile、
  active persona、凭证摘要、二维码摘要与标签选择。userHandle 为服务端系统分配，只读展示。

source_entities:
  - UserProfile
  - Persona
  - CredentialBinding

consumers:
  - app

client_projection:
  dart_class: ProfileEditSnapshotWireDto
  base_class: ""
  output_path: cloud/runtime/generated/user/profile_edit_snapshot_wire_dto.g.dart
  fields:
    - name: ownerUserId
      dart_type: String
      nullable: false
      source: ownerUserId
      aliases: [ownerUserId]
      default: "''"

    - name: subAccountId
      dart_type: String
      nullable: false
      source: subAccountId
      aliases: [subAccountId, userId]
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      aliases: [avatarUrl]
      default: "''"

    - name: avatarAssetId
      dart_type: String
      nullable: false
      source: avatarAssetId
      aliases: [avatarAssetId]
      default: "''"

    - name: avatarVersion
      dart_type: int
      nullable: false
      source: avatarVersion
      aliases: [avatarVersion]
      default: "0"

    - name: backgroundUrl
      dart_type: String
      nullable: false
      source: backgroundUrl
      aliases: [backgroundUrl, backgroundImage]
      default: "''"

    - name: backgroundAssetId
      dart_type: String
      nullable: false
      source: backgroundAssetId
      aliases: [backgroundAssetId]
      default: "''"

    - name: nickname
      dart_type: String
      nullable: false
      source: nickname
      aliases: [nickname, displayName]
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      aliases: [displayName, nickname]
      default: "''"

    - name: gender
      dart_type: String
      nullable: false
      source: gender
      aliases: [gender]
      default: "'unspecified'"

    - name: birthDate
      dart_type: String
      nullable: false
      source: birthDate
      aliases: [birthDate]
      default: "''"

    - name: region
      dart_type: String
      nullable: false
      source: region
      aliases: [region]
      default: "''"

    - name: regionTagRef
      dart_type: String
      nullable: false
      source: regionTagRef
      aliases: [regionTagRef]
      default: "''"

    - name: userHandle
      dart_type: String
      nullable: false
      source: userHandle
      aliases: [userHandle, username]
      default: "''"

    - name: bio
      dart_type: String
      nullable: false
      source: bio
      aliases: [bio]
      default: "''"

    - name: identityTags
      dart_type: List<String>
      nullable: false
      source: identityTags
      aliases: [identityTags]

    - name: occupationTagRef
      dart_type: String
      nullable: false
      source: occupationTagRef
      aliases: [occupationTagRef]
      default: "''"

    - name: interestTagRefs
      dart_type: List<String>
      nullable: false
      source: interestTagRefs
      aliases: [interestTagRefs]

    - name: phoneCredential
      dart_type: Map<String, dynamic>
      nullable: true
      source: phoneCredential
      aliases: [phoneCredential]

    - name: qrCard
      dart_type: Map<String, dynamic>
      nullable: true
      source: qrCard
      aliases: [qrCard]

    - name: updatedAt
      dart_type: DateTime
      nullable: true
      source: updatedAt
      aliases: [updatedAt]
