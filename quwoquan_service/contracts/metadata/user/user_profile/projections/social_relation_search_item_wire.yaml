read_model: SocialRelationSearchItemWire

description: |
  SearchSocialRelations 列表元素 wire；嵌套 capability 缺失时由 View 用整行 Map 回退解析。

source_entities:
  - UserProfile

consumers:
  - app

client_projection:
  dart_class: SocialRelationSearchItemWireDto
  base_class: ""
  output_path: cloud/runtime/generated/user/social_relation_search_item_wire_dto.g.dart
  fields:
    - name: subAccountId
      dart_type: String
      nullable: false
      source: subAccountId
      default: "''"
    - name: username
      dart_type: String
      nullable: false
      source: username
      default: "''"

    - name: userHandle
      dart_type: String
      nullable: false
      source: userHandle
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: true
      source: avatarUrl
      default: "null"

    - name: avatarVersion
      dart_type: int
      nullable: false
      source: avatarVersion
      default: "0"

    - name: headline
      dart_type: String
      nullable: true
      source: headline
      default: "null"

    - name: chatAvailable
      dart_type: bool
      nullable: false
      source: chatAvailable
      default: "false"

    - name: relationshipCapability
      dart_type: Map<String, dynamic>
      nullable: true
      source: relationshipCapability
      default: "null"
