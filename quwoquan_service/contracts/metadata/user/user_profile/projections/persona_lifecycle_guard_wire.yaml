read_model: PersonaLifecycleGuardWire

description: |
  子账号生命周期守卫 wire（getSubAccountLifecycleGuard）。

source_entities:
  - UserProfile

consumers:
  - app

client_projection:
  dart_class: PersonaLifecycleGuardWireDto
  base_class: ""
  output_path: cloud/runtime/generated/user/persona_lifecycle_guard_wire_dto.g.dart
  fields:
    - name: subAccountId
      dart_type: String
      nullable: false
      source: subAccountId
      default: "''"
    - name: requestedAction
      dart_type: String
      nullable: false
      source: requestedAction
      default: "'retire'"
    - name: allowed
      dart_type: bool
      nullable: false
      source: allowed
      default: "false"
    - name: reason
      dart_type: String
      nullable: false
      source: reason
      default: "'allowed'"
    - name: requiresSuccessor
      dart_type: bool
      nullable: false
      source: requiresSuccessor
      default: "false"
