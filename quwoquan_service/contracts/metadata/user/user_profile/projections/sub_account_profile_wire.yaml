read_model: SubAccountProfileWire

description: |
  GET /me/profile 与分身档案 GET 响应体 wire，与 App SubAccountProfileViewData 字段对齐。
  解码后由 SubAccountProfileViewData.fromSubAccountProfileWire 做展示名回退（nickname / subjectId）。

source_entities:
  - UserProfile

consumers:
  - app

client_projection:
  dart_class: SubAccountProfileWireDto
  base_class: ""
  output_path: cloud/runtime/generated/user/sub_account_profile_wire_dto.g.dart
  fields:
    - name: subAccountId
      dart_type: String
      nullable: false
      source: subAccountId
      default: "''"
    - name: ownerUserId
      dart_type: String
      nullable: false
      source: ownerUserId
      default: "''"
    - name: userHandle
      dart_type: String
      nullable: false
      source: userHandle
      default: "''"

    - name: nickname
      dart_type: String
      nullable: false
      source: nickname
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      default: "''"

    - name: username
      dart_type: String
      nullable: false
      source: username
      default: "''"

    - name: subjectType
      dart_type: String
      nullable: false
      source: subjectType
      default: "''"

    - name: nicknameCustomized
      dart_type: bool
      nullable: false
      source: nicknameCustomized
      default: "false"

    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      default: "''"

    - name: avatarVersion
      dart_type: int
      nullable: false
      source: avatarVersion
      default: "0"

    - name: backgroundUrl
      dart_type: String
      nullable: false
      source: backgroundUrl
      default: "''"

    - name: bio
      dart_type: String
      nullable: false
      source: bio
      default: "''"

    - name: identityTags
      dart_type: List<String>
      nullable: false
      source: identityTags
    # 认证标识（蓝勾）。本期云侧未实现，契约预留，alpha mock 提供；端只读展示。
    - name: verified
      dart_type: bool
      nullable: false
      source: verified
      default: "false"

    - name: followerCount
      dart_type: int
      nullable: false
      source: followerCount
      default: "0"
      # 人页统计前台展示为「粉丝」；见 specs/00_GLOBAL_TERMINOLOGY.md

    - name: followingCount
      dart_type: int
      nullable: false
      source: followingCount
      default: "0"

    - name: postCount
      dart_type: int
      nullable: false
      source: postCount
      default: "0"

    - name: circleCount
      dart_type: int
      nullable: false
      source: circleCount
      default: "0"

    - name: likeCount
      dart_type: int
      nullable: false
      source: likeCount
      default: "0"

    # 主页完善度（0-100）。本期 alpha seed 驱动，端只读展示「完善主页」提示。
    - name: profileCompleteness
      dart_type: int
      nullable: false
      source: profileCompleteness
      default: "100"

    # 主页待补全项（avatar / tags / circles / entities 等开放字符串），端用于引导补全。
    - name: profileCompletenessMissingItems
      dart_type: List<String>
      nullable: false
      source: profileCompletenessMissingItems
    - name: profileVisibility
      dart_type: String
      nullable: false
      source: profileVisibility
      default: "'public'"

    - name: isolationLevel
      dart_type: String
      nullable: false
      source: isolationLevel
      default: "'open'"

    - name: inheritsFromOwner
      dart_type: bool
      nullable: false
      source: inheritsFromOwner
      default: "false"

    - name: overriddenFields
      dart_type: List<String>
      nullable: true
      source: overriddenFields
      default: "null"

    - name: updatedAt
      dart_type: DateTime
      nullable: true
      source: updatedAt
      default: "null"
