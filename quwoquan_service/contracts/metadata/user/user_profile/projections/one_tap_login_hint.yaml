read_model: OneTapLoginHint

description: |
  POST /auth/login/one-tap/hint 响应 wire。该响应只用于登录页展示
  脱敏号码和账号摘要，不签发 token。

source_entities:
  - OneTapLoginHintResponse

consumers:
  - app

client_projection:
  dart_class: OneTapLoginHintDto
  base_class: ""
  output_path: cloud/runtime/generated/user/one_tap_login_hint_dto.g.dart
  fields:
    - name: state
      dart_type: String
      nullable: false
      source: state
      default: "''"

    - name: maskedPhone
      dart_type: String
      nullable: false
      source: maskedPhone
      default: "''"

    - name: registered
      dart_type: bool
      nullable: false
      source: registered
      default: "false"

    - name: accountHint
      dart_type: Map<String, dynamic>
      nullable: true
      source: accountHint
      default: "null"

    - name: expiresInSeconds
      dart_type: int
      nullable: false
      source: expiresInSeconds
      default: "0"

    - name: providerRequestId
      dart_type: String
      nullable: false
      source: providerRequestId
      default: "''"
