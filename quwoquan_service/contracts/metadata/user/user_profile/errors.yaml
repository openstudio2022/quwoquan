version: 1
domain: USER
aggregate: UserProfile

description: |
  user 域结构化错误码声明。格式：MODULE.KIND.REASON。
  codegen 从本文件生成 Dart UserErrorCode enum + UserErrorMessages，
  以及 Go errors.go 常量（绑定 runtime/errors.AppError）。

errors:
  - code: USER.USER.not_found
    kind: USER
    reason: not_found
    http_status: 404
    recovery_action: surface
    dart_const: userNotFound
    go_const: ErrUserNotFound
    user_message:
      zh: "用户不存在"
      en: "User not found"

  - code: USER.USER.unauthorized
    kind: USER
    reason: unauthorized
    http_status: 401
    recovery_action: surface
    dart_const: unauthorized
    go_const: ErrUnauthorized
    user_message:
      zh: "请先登录"
      en: "Please sign in to continue"

  - code: USER.USER.forbidden
    kind: USER
    reason: forbidden
    http_status: 403
    recovery_action: surface
    dart_const: forbidden
    go_const: ErrForbidden
    user_message:
      zh: "无权访问该资源"
      en: "Access denied"

  - code: USER.USER.nickname_taken
    kind: USER
    reason: conflict
    http_status: 409
    recovery_action: surface
    dart_const: nicknameTaken
    go_const: ErrNicknameTaken
    user_message:
      zh: "该昵称已被使用，请换一个"
      en: "Nickname already taken, please choose another"

  - code: USER.USER.invalid_argument
    kind: USER
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: invalidArgument
    go_const: ErrInvalidArgument
    user_message:
      zh: "请求参数有误"
      en: "Invalid request parameters"

  - code: USER.USER.rate_limited
    kind: USER
    reason: rate_limited
    http_status: 429
    recovery_action: retry
    recovery_after_seconds: 60
    dart_const: rateLimited
    go_const: ErrRateLimited
    user_message:
      zh: "操作太频繁，请稍后重试"
      en: "Too many requests, please retry later"

  - code: USER.SETTING.invalid_call_ringtone
    kind: SETTING
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: invalidCallRingtone
    go_const: ErrInvalidCallRingtone
    user_message:
      zh: "所选铃声不可用，请从官方铃声库中重新选择"
      en: "Selected ringtone is unavailable, please choose from the official library"

  - code: USER.SETTING.invalid_appearance_scope
    kind: SETTING
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: invalidAppearanceScope
    go_const: ErrInvalidAppearanceScope
    user_message:
      zh: "外观设置作用范围无效，请重试"
      en: "Appearance settings scope is invalid, please try again"

  - code: USER.SYSTEM.internal_error
    kind: SYSTEM
    reason: internal_error
    http_status: 500
    recovery_action: surface
    dart_const: internalError
    go_const: ErrInternalError
    user_message:
      zh: "服务异常，请稍后重试"
      en: "Service error, please try again later"

  # ── 认证与凭证错误 ─────────────────────────────────────────────────────────

  - code: USER.AUTH.otp_expired
    kind: AUTH
    reason: otp_expired
    http_status: 400
    recovery: {action: retry, disruptionLevel: inlineCard}
    l10n_key: userAuthOtpExpired
    dart_const: otpExpired
    go_const: ErrOtpExpired
    user_message:
      zh: "验证码已过期，请重新获取"
      en: "Verification code expired, please request a new one"

  - code: USER.AUTH.otp_mismatch
    kind: AUTH
    reason: otp_mismatch
    http_status: 400
    recovery: {action: retry, disruptionLevel: inlineCard}
    l10n_key: userAuthOtpMismatch
    dart_const: otpMismatch
    go_const: ErrOtpMismatch
    user_message:
      zh: "验证码错误，请重新输入"
      en: "Incorrect verification code, please try again"

  - code: USER.AUTH.otp_attempts_exceeded
    kind: AUTH
    reason: otp_attempts_exceeded
    http_status: 429
    recovery: {action: retry, disruptionLevel: inlineCard, afterSeconds: 60}
    l10n_key: userAuthOtpAttemptsExceeded
    dart_const: otpAttemptsExceeded
    go_const: ErrOtpAttemptsExceeded
    user_message:
      zh: "验证码错误次数过多，请重新获取"
      en: "Too many incorrect attempts, please request a new code"

  - code: USER.AUTH.otp_rate_limited
    kind: AUTH
    reason: rate_limited
    http_status: 429
    recovery: {action: retry, disruptionLevel: inlineCard, afterSeconds: 60}
    l10n_key: userAuthOtpRateLimited
    dart_const: otpRateLimited
    go_const: ErrOtpRateLimited
    user_message:
      zh: "发送过于频繁，请稍后再试"
      en: "Verification code requests are too frequent, please retry later"

  - code: USER.AUTH.otp_provider_failed
    kind: AUTH
    reason: third_party_failure
    http_status: 502
    recovery: {action: retry, disruptionLevel: inlineCard}
    l10n_key: userAuthOtpProviderFailed
    dart_const: otpProviderFailed
    go_const: ErrOtpProviderFailed
    user_message:
      zh: "验证码发送失败，请重试或换其它方式"
      en: "Failed to send verification code, please retry or use another method"

  - code: USER.AUTH.credential_conflict
    kind: AUTH
    reason: conflict
    http_status: 409
    recovery: {action: surface, disruptionLevel: inlineCard}
    l10n_key: userAuthCredentialConflict
    dart_const: credentialConflict
    go_const: ErrCredentialConflict
    user_message:
      zh: "该账号已被其他用户绑定"
      en: "This account is already linked to another user"

  - code: USER.AUTH.last_credential
    kind: AUTH
    reason: constraint_violation
    http_status: 400
    recovery: {action: surface, disruptionLevel: inlineCard}
    l10n_key: userAuthLastCredential
    dart_const: lastCredential
    go_const: ErrLastCredential
    user_message:
      zh: "无法解绑，这是您唯一的登录方式"
      en: "Cannot unlink the only login method"

  - code: USER.AUTH.login_locked
    kind: AUTH
    reason: locked
    http_status: 423
    recovery: {action: retry, disruptionLevel: inlineCard, afterSeconds: 1800}
    l10n_key: userAuthLoginLocked
    dart_const: loginLocked
    go_const: ErrLoginLocked
    user_message:
      zh: "账号因多次失败已暂时锁定，请30分钟后重试"
      en: "Account temporarily locked due to multiple failed attempts, please retry in 30 minutes"

  - code: USER.AUTH.wechat_auth_failed
    kind: AUTH
    reason: third_party_failure
    http_status: 502
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthWechatFailed
    dart_const: wechatAuthFailed
    go_const: ErrWechatAuthFailed
    user_message:
      zh: "微信授权失败，请重试"
      en: "WeChat authorization failed, please try again"

  - code: USER.AUTH.alipay_auth_failed
    kind: AUTH
    reason: third_party_failure
    http_status: 502
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthAlipayFailed
    dart_const: alipayAuthFailed
    go_const: ErrAlipayAuthFailed
    user_message:
      zh: "支付宝授权失败，请重试"
      en: "Alipay authorization failed, please try again"

  - code: USER.AUTH.qq_auth_failed
    kind: AUTH
    reason: third_party_failure
    http_status: 502
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthQqFailed
    dart_const: qqAuthFailed
    go_const: ErrQqAuthFailed
    user_message:
      zh: "QQ 授权失败，请重试"
      en: "QQ authorization failed, please try again"

  - code: USER.AUTH.social_provider_cancelled
    kind: AUTH
    reason: cancelled
    http_status: 400
    recovery: {action: absorb, disruptionLevel: silent}
    l10n_key: userAuthSocialProviderCancelled
    dart_const: socialProviderCancelled
    go_const: ErrSocialProviderCancelled
    user_message:
      zh: "已取消第三方授权"
      en: "Third-party authorization was cancelled"

  - code: USER.AUTH.social_provider_unavailable
    kind: AUTH
    reason: third_party_unavailable
    http_status: 503
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthSocialProviderUnavailable
    dart_const: socialProviderUnavailable
    go_const: ErrSocialProviderUnavailable
    user_message:
      zh: "第三方登录暂不可用，请改用其他方式"
      en: "Third-party login is unavailable, please use another method"

  - code: USER.AUTH.apple_auth_failed
    kind: AUTH
    reason: third_party_failure
    http_status: 502
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthAppleFailed
    dart_const: appleAuthFailed
    go_const: ErrAppleAuthFailed
    user_message:
      zh: "Apple 登录失败，请重试"
      en: "Apple sign-in failed, please try again"

  - code: USER.AUTH.passkey_auth_failed
    kind: AUTH
    reason: third_party_failure
    http_status: 502
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthPasskeyFailed
    dart_const: passkeyAuthFailed
    go_const: ErrPasskeyAuthFailed
    user_message:
      zh: "Passkey 登录失败，请重试或改用其他方式"
      en: "Passkey sign-in failed, please retry or use another method"

  - code: USER.AUTH.token_expired
    kind: AUTH
    reason: token_expired
    http_status: 401
    recovery: {action: surface, disruptionLevel: inlineCard}
    l10n_key: userAuthTokenExpired
    dart_const: tokenExpired
    go_const: ErrTokenExpired
    user_message:
      zh: "登录已过期，请重新登录"
      en: "Session expired, please sign in again"

  - code: USER.AUTH.carrier_unavailable
    kind: AUTH
    reason: third_party_unavailable
    http_status: 503
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthCarrierUnavailable
    dart_const: carrierUnavailable
    go_const: ErrCarrierUnavailable
    user_message:
      zh: "本机号码登录暂不可用，请使用短信验证码"
      en: "Carrier sign-in is unavailable; use SMS verification instead"

  - code: USER.AUTH.carrier_token_invalid
    kind: AUTH
    reason: invalid_token
    http_status: 400
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthCarrierTokenInvalid
    dart_const: carrierTokenInvalid
    go_const: ErrCarrierTokenInvalid
    user_message:
      zh: "本机号码授权已失效，请使用短信验证码"
      en: "Carrier authorization expired; use SMS verification instead"

  - code: USER.AUTH.carrier_provider_timeout
    kind: AUTH
    reason: upstream_timeout
    http_status: 504
    recovery: {action: retry, disruptionLevel: inlineCard}
    l10n_key: userAuthCarrierProviderTimeout
    dart_const: carrierProviderTimeout
    go_const: ErrCarrierProviderTimeout
    user_message:
      zh: "本机号码校验超时，请使用短信验证码"
      en: "Carrier verification timed out; use SMS verification instead"

  - code: USER.AUTH.carrier_phone_mismatch
    kind: AUTH
    reason: conflict
    http_status: 409
    recovery: {action: fallback, disruptionLevel: inlineCard}
    l10n_key: userAuthCarrierPhoneMismatch
    dart_const: carrierPhoneMismatch
    go_const: ErrCarrierPhoneMismatch
    user_message:
      zh: "本机号码与上次账号不一致，请使用其他手机号或其他方式登录"
      en: "Carrier phone does not match the remembered account; use another phone or sign-in method"

  - code: USER.AUTH.consent_required
    kind: AUTH
    reason: consent_required
    http_status: 400
    recovery: {action: surface, disruptionLevel: inlineCard}
    l10n_key: userAuthConsentRequired
    dart_const: consentRequired
    go_const: ErrConsentRequired
    user_message:
      zh: "请先阅读并同意用户协议与隐私政策"
      en: "Please agree to the user agreement and privacy policy first"

  - code: USER.AUTH.account_suspended
    kind: AUTH
    reason: suspended
    http_status: 403
    recovery: {action: escalate, disruptionLevel: inlineCard}
    l10n_key: userAuthAccountSuspended
    dart_const: accountSuspended
    go_const: ErrAccountSuspended
    user_message:
      zh: "账号已被限制登录，请按页面提示处理"
      en: "This account is currently restricted"

  - code: USER.AUTH.account_deleted
    kind: AUTH
    reason: deleted
    http_status: 410
    recovery: {action: escalate, disruptionLevel: inlineCard}
    l10n_key: userAuthAccountDeleted
    dart_const: accountDeleted
    go_const: ErrAccountDeleted
    user_message:
      zh: "账号已注销或进入删除流程，无法直接登录"
      en: "This account has been deleted or is being deleted"

  # ── 子账号错误 ─────────────────────────────────────────────────────────────

  - code: USER.SUB_ACCOUNT.not_found
    kind: SUB_ACCOUNT
    reason: not_found
    http_status: 404
    recovery_action: surface
    dart_const: subAccountNotFound
    go_const: ErrSubAccountNotFound
    user_message:
      zh: "子账号不存在"
      en: "Sub-account not found"

  - code: USER.SUB_ACCOUNT.last_sub_account
    kind: SUB_ACCOUNT
    reason: constraint_violation
    http_status: 400
    recovery_action: surface
    dart_const: lastSubAccount
    go_const: ErrLastSubAccount
    user_message:
      zh: "无法删除，这是您的最后一个账号"
      en: "Cannot delete the last sub-account"

  - code: USER.SUB_ACCOUNT.strict_isolation
    kind: SUB_ACCOUNT
    reason: not_found
    http_status: 404
    recovery_action: surface
    dart_const: subAccountStrictIsolation
    go_const: ErrSubAccountStrictIsolation
    user_message:
      zh: "该用户不存在"
      en: "User not found"

  - code: USER.SUB_ACCOUNT.quota_reached
    kind: SUB_ACCOUNT
    reason: constraint_violation
    http_status: 400
    recovery_action: surface
    dart_const: subAccountQuotaReached
    go_const: ErrSubAccountQuotaReached
    user_message:
      zh: "分身数量已达上限，请先整理现有分身"
      en: "Persona limit reached, please manage existing personas first"

  - code: USER.SUB_ACCOUNT.primary_guard
    kind: SUB_ACCOUNT
    reason: constraint_violation
    http_status: 400
    recovery_action: surface
    dart_const: primarySubAccountGuard
    go_const: ErrPrimarySubAccountGuard
    user_message:
      zh: "主分身不能直接删除或退役"
      en: "Primary persona cannot be deleted or retired directly"

  - code: USER.SUB_ACCOUNT.active_guard
    kind: SUB_ACCOUNT
    reason: constraint_violation
    http_status: 400
    recovery_action: surface
    dart_const: activeSubAccountGuard
    go_const: ErrActiveSubAccountGuard
    user_message:
      zh: "请先切换到其他分身后再继续"
      en: "Please switch to another persona before continuing"

  - code: USER.SUB_ACCOUNT.retire_required
    kind: SUB_ACCOUNT
    reason: constraint_violation
    http_status: 409
    recovery_action: surface
    dart_const: subAccountRetireRequired
    go_const: ErrSubAccountRetireRequired
    user_message:
      zh: "该分身已有记录数据，请使用退役而不是删除"
      en: "This persona has history and must be retired instead of deleted"

  - code: USER.SUB_ACCOUNT.retired_guard
    kind: SUB_ACCOUNT
    reason: invalid_status_transition
    http_status: 400
    recovery_action: surface
    dart_const: retiredSubAccountGuard
    go_const: ErrRetiredSubAccountGuard
    user_message:
      zh: "该分身已退役，当前操作不可继续"
      en: "This persona is retired and cannot continue this action"

  - code: USER.SUB_ACCOUNT.delete_empty_only
    kind: SUB_ACCOUNT
    reason: invalid_status_transition
    http_status: 400
    recovery_action: surface
    dart_const: deleteEmptySubAccountOnly
    go_const: ErrDeleteEmptySubAccountOnly
    user_message:
      zh: "空白分身请直接删除，无需退役"
      en: "Empty persona should be deleted directly instead of retired"

  - code: USER.SUB_ACCOUNT.handle_taken
    kind: SUB_ACCOUNT
    reason: conflict
    http_status: 409
    recovery_action: surface
    dart_const: subAccountHandleTaken
    go_const: ErrSubAccountHandleTaken
    user_message:
      zh: "该分身号已被占用，请换一个"
      en: "This persona handle is already taken, please choose another"

  - code: USER.SUB_ACCOUNT.handle_readonly
    kind: SUB_ACCOUNT
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: subAccountHandleReadonly
    go_const: ErrSubAccountHandleReadonly
    user_message:
      zh: "趣我圈号由系统分配，暂不支持手动修改"
      en: "Profile handle is system assigned and cannot be changed"

  # ── 资料编辑与二维码错误 ─────────────────────────────────────────────────────

  - code: USER.PROFILE.invalid_region
    kind: PROFILE
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: profileInvalidRegion
    go_const: ErrProfileInvalidRegion
    user_message:
      zh: "请选择有效的省市地区"
      en: "Please choose a valid region"

  - code: USER.PROFILE.invalid_tag_ref
    kind: PROFILE
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: profileInvalidTagRef
    go_const: ErrProfileInvalidTagRef
    user_message:
      zh: "所选标签不可用，请重新选择"
      en: "Selected tags are unavailable, please choose again"

  - code: USER.PROFILE.invalid_media_asset
    kind: PROFILE
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: profileInvalidMediaAsset
    go_const: ErrProfileInvalidMediaAsset
    user_message:
      zh: "图片上传未完成，请重新选择并保存"
      en: "Image upload is incomplete, please choose and save again"

  - code: USER.PROFILE.qr_token_invalid
    kind: PROFILE
    reason: not_found
    http_status: 404
    recovery_action: surface
    dart_const: profileQrTokenInvalid
    go_const: ErrProfileQrTokenInvalid
    user_message:
      zh: "二维码已失效，请让对方重新分享"
      en: "QR code is invalid, please ask for a new share"

  - code: USER.PROFILE.qr_token_expired
    kind: PROFILE
    reason: expired
    http_status: 410
    recovery_action: surface
    dart_const: profileQrTokenExpired
    go_const: ErrProfileQrTokenExpired
    user_message:
      zh: "二维码已过期，请让对方重新分享"
      en: "QR code expired, please ask for a new share"
