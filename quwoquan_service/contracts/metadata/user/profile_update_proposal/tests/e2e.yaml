aggregate: ProfileUpdateProposal
layer: e2e

description: |
  用户从编辑资料页审查、确认并应用资料提案的真实页面旅程。
  local/alpha 使用物理隔离 mock；beta/gamma 使用 Remote + 预置 Persona。

execution:
  environments: [alpha, beta, gamma]
  ci_strategy: pre-release

scenarios:
  - name: proposal_review_apply_journey
    test_type: user_acceptance
    app_test: quwoquan_app/test/user_acceptance/pages/user/profile_update_proposal_journey__user_acceptance_test.dart
    steps:
      - 用户进入编辑资料页并打开待确认资料提案
      - 用户确认提案，服务端推进 confirmed/applying
      - Persona 更新完成后 Proposal 进入 applied
      - 页面刷新展示已应用结果
    assertions:
      - 关闭 review sheet 不改变 proposal 状态
      - 重试使用稳定 idempotency key
      - apply 失败显示结构化错误且可继续安全应用

  - name: proposal_reject_journey
    test_type: user_acceptance
    app_test: quwoquan_app/test/user_acceptance/pages/user/profile_update_proposal_journey__user_acceptance_test.dart
    assertions:
      - pending proposal 可拒绝并从待办列表消失
      - applying/applied proposal 不显示拒绝入口

  - name: profile_proposal_http_store_roundtrip
    test_type: api_integration
    service_test: quwoquan_service/services/user-service/tests/api_integration/profile_update_proposal_store__api_integration_test.go
    go_func: TestProfileUpdateProposalPostgresCommitIsAtomicAndReplayable
    assertions:
      - Postgres state/receipt/outbox 原子提交
      - owner 隔离、CAS 重载与 no-op receipt 可重放
