aggregate: ProfileUpdateProposal
layer: app_side

description: |
  ProfileUpdateProposal alpha/test adapter 必须由 quwoquan_cloud_mock 注入，
  production composition 只装配 RemoteProfileUpdateProposalAdapter。

dto_scenarios:
  - name: proposal_contract_is_strict_typed
    dart_test: quwoquan_app/test/local_contract/cloud/user/profile_update_proposal_facets__local_contract_test.dart
    assertions:
      - command/result/list slice 只使用 generated typed ABI
      - wire 不包含 expectedVersion 或动态 Map
      - unknown status/field fail closed

widget_scenarios:
  - name: review_sheet_state_and_recovery
    dart_test: quwoquan_app/test/local_contract/ui/user/profile_update_proposal_review_sheet__local_contract_test.dart
    assertions:
      - pending 可确认或拒绝
      - applying 只允许继续安全应用，不允许拒绝
      - command failure 保持可见并可重试

alpha_scenarios:
  - name: alpha_adapter_parity
    adapter: quwoquan_app/packages/quwoquan_cloud_mock/lib/src/user/alpha_profile_update_proposal_facets.dart
    test: quwoquan_app/packages/quwoquan_cloud_mock/test/local_contract/alpha_profile_update_proposal_facets__local_contract_test.dart
    assertions:
      - Create/Confirm/Apply/Reject/Get/List 与 Remote Facet 签名一致
      - 相同 idempotency key 重放同一 typed result
