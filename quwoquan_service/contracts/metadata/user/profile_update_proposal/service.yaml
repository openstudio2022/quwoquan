consumers:
  - name: app
    capabilities: [create_profile_proposal, confirm_profile_proposal, apply_profile_proposal, reject_profile_proposal, read_profile_proposal]

contract_test:
  scenarios:
    - name: owner_and_bola
      assertions: [verified_persona_only, foreign_persona_returns_not_found, no_state_change]
    - name: version_and_idempotency
      assertions: [expected_version_required, same_key_same_result, same_key_different_command_conflict]
    - name: aggregate_outbox_atomicity
      assertions: [state_receipt_outbox_same_transaction, one_event_per_version]
