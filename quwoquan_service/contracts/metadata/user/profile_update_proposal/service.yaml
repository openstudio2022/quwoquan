version: 1

service:
  name: user-service
  domain: user
  owner: identity-platform
  description: ProfileUpdateProposal 对象专属 command/query packet。
  commercial_defaults:
    status: blocked
    block_reason: Gamma Remote 行为、页面 user_acceptance 与四环境证据尚未完成
    gap_id: USER_PROFILE_UPDATE_PROPOSAL_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure

api_routes:
  - method: POST
    path: /v1/user/personas/{personaId}/profile-proposals
    operation: CreateProfileUpdateProposal
    actor: persona
    application:
      kind: command
      facet: ProfileProposalCommandFacade
      method: createProposal
      aggregate_owner: ProfileUpdateProposal
      mutation_target: ProfileUpdateProposal
      invariant_target: ProfileUpdateProposal
    request_entity: CreateProfileUpdateProposalRequest
    request_body_kind: object
    response_entity: ProfileUpdateProposalCommandResult
    response_body: ProfileUpdateProposalCommandResult
    response_body_kind: object
    client_contract:
      dart_import: ../user/profile_update_proposal_contracts.dart
      request_type: CreateProfileUpdateProposalCommand
      response_type: ProfileUpdateProposalCommandResult
      request_encoder: encodeCreateProfileUpdateProposalCommand
      response_decoder: decodeProfileUpdateProposalCommandResult
    description: 为目标 Persona 创建强类型资料修改提案
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.PROFILE_PROPOSAL.not_found
      - USER.PROFILE_PROPOSAL.invalid_argument
      - USER.PROFILE_PROPOSAL.invalid_transition
      - USER.PROFILE_PROPOSAL.version_conflict
      - USER.PROFILE_PROPOSAL.idempotency_conflict
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SENSITIVE
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_profile_proposal_command
      trace: true
      attributes: [operation, outcome, error_code, replayed]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    authorization:
      principal: persona
      ownership_policy: target_persona_owner
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

