
service:
  name: user-service
  domain: user
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: USER_INVITE_RECORD_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 邀请归因——SubAccount 发起邀请，追踪从生成到激活的全链路状态

api_routes:
  - method: POST
    path: /me/invites

    operation: GenerateInvite
    actor: persona
    application:
      kind: command
      facet: InviteRecordCommandFacade
      method: generateInvite
      aggregate_owner: InviteRecord
      mutation_target: InviteRecord
      invariant_target: InviteRecord
    description: 生成邀请（幂等，同 subAccountId+channel+inviteePhone 复用已有记录）
    security:
      auth_mode: required
    request_fields: [channel, inviteePhone]
    response_fields: [id, linkCode, expireAt, status]
    rate_limit: 1000次/24h/subAccountId

  - method: GET
    path: /me/invites

    operation: ListMyInvites
    actor: persona
    application:
      kind: query
      facet: InviteRecordQueryFacade
      method: listMyInvites
      reader: ListMyInvitesReader
      slice: ListMyInvitesSlice
    description: 查看我发出的邀请列表（按状态筛选）
    security:
      auth_mode: required
    query_params: [status, cursor, limit]
    response_entity: InviteRecord
    response_fields: [id, channel, status, generatedAt, acceptedAt, convertedAt]

  - method: GET
    path: /invites/{linkCode}

    operation: GetInviteByCode
    actor: persona_or_device
    application:
      kind: query
      facet: InviteRecordQueryFacade
      method: getInviteByCode
      reader: GetInviteByCodeReader
      slice: GetInviteByCodeSlice
    description: 根据邀请码获取邀请信息（注册页使用，无需登录）
    security:
      auth_mode: public
    response_fields: [inviterDisplayName, inviterAvatarUrl, channel, expireAt, status]
    security_note: 不暴露 inviterSubAccountId / inviterOwnerAccountId

  - method: POST
    path: /invites/{linkCode}/accept

    operation: AcceptInvite
    actor: persona
    application:
      kind: command
      facet: InviteRecordCommandFacade
      method: acceptInvite
      aggregate_owner: InviteRecord
      mutation_target: InviteRecord
      invariant_target: InviteRecord
    description: 接受邀请（注册成功后调用，幂等）
    security:
      auth_mode: required
    response_fields: [id, status, acceptedAt]

consumers:
  - name: app
    capabilities: [generate_invite, list_my_invites, view_invite, accept_invite]

contract_test:
  scenarios:
    - name: generate_invite_idempotent
      description: 同参数重复调用返回相同记录
      assertions:
        - "两次 POST /me/invites 同参数 → 相同 id"

    - name: invite_attribution
      description: 被邀请人注册后归因到正确 subAccountId
      assertions:
        - "AcceptInvite → status=accepted"
        - "InviteAccepted 事件 payload.inviterSubAccountId 正确"

    - name: invite_expired
      description: 过期邀请不可接受
      assertions:
        - "expire_at 已过期 → USER.INVITE.expired"

    - name: owner_id_not_exposed
      description: API 不暴露 inviterOwnerAccountId
      assertions:
        - "GET /invites/{code} response 不含 inviterOwnerAccountId"
        - "GET /me/invites response 不含 inviterOwnerAccountId"
