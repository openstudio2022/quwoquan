read_model: RelationshipViewWire

description: |
  GET .../relationship 响应 wire；与 RelationshipView（PersonaRelationship fields.yaml）1:1。
  isFollowing/isFollowedBy/isMutual 等派生布尔不在 wire 上，由端侧 view model 从
  relationState 派生。

source_entities:
  - PersonaRelationship

consumers:
  - app

client_projection:
  dart_class: RelationshipViewWireDto
  base_class: ""
  output_path: cloud/runtime/generated/user/relationship_view_wire_dto.g.dart
  fields:
    - name: viewerSubAccountId
      dart_type: String
      nullable: false
      source: viewerSubAccountId
      default: "''"

    - name: targetSubAccountId
      dart_type: String
      nullable: false
      source: targetSubAccountId
      default: "''"

    - name: relationState
      dart_type: String
      nullable: false
      source: relationState
      default: "'not_following'"

    - name: isBlocked
      dart_type: bool
      nullable: false
      source: isBlocked
      default: "false"

    - name: isBlockedBy
      dart_type: bool
      nullable: false
      source: isBlockedBy
      default: "false"
