aggregate: PersonaRelationship
backend: postgres
tables:
  persona_relationships:
    entity: PersonaRelationship
    role: authoritative
    pk: pair_id
    columns:
      - { name: pair_id, type: VARCHAR(64), constraints: [PK, NOT_NULL] }
      - { name: lower_persona_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: upper_persona_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: version, type: BIGINT, constraints: [NOT_NULL], default: 1 }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
    indexes:
      - { name: uq_persona_relationship_pair, columns: [lower_persona_id, upper_persona_id], unique: true }
  persona_relationship_directions:
    entity: RelationshipDirection
    role: owned
    pk: pair_id
    fk: { column: pair_id, references: persona_relationships.pair_id, on_delete: CASCADE }
    columns:
      - { name: pair_id, type: VARCHAR(64), constraints: [PK, NOT_NULL] }
      - { name: source_persona_id, type: VARCHAR(96), constraints: [PK, NOT_NULL] }
      - { name: target_persona_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: following, type: BOOLEAN, constraints: [NOT_NULL], default: false }
      - { name: blocked, type: BOOLEAN, constraints: [NOT_NULL], default: false }
      - { name: follow_source, type: VARCHAR(64), constraints: [NULLABLE] }
      - { name: followed_at, type: TIMESTAMPTZ, constraints: [NULLABLE] }
      - { name: blocked_at, type: TIMESTAMPTZ, constraints: [NULLABLE] }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
    indexes:
      - { name: uq_persona_relationship_direction, columns: [pair_id, source_persona_id], unique: true }
      - { name: idx_persona_relationship_following, columns: [source_persona_id, following, followed_at DESC] }
      - { name: idx_persona_relationship_followers, columns: [target_persona_id, following, followed_at DESC] }
      - { name: idx_persona_relationship_blocked, columns: [source_persona_id, blocked, blocked_at DESC] }
    max_rows_per_aggregate: 2
  persona_relationship_command_receipts:
    role: authoritative
    pk: receipt_id
    columns:
      - { name: receipt_id, type: VARCHAR(64), constraints: [PK, NOT_NULL] }
      - { name: actor_persona_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: idempotency_key, type: VARCHAR(128), constraints: [NOT_NULL] }
      - { name: operation, type: VARCHAR(32), constraints: [NOT_NULL] }
      - { name: target_persona_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: pair_id, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: aggregate_version, type: BIGINT, constraints: [NOT_NULL] }
      - { name: response_json, type: JSONB, constraints: [NOT_NULL] }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
    indexes:
      - { name: uq_persona_relationship_command_receipt, columns: [actor_persona_id, idempotency_key], unique: true }
  persona_relationship_outbox:
    role: append_only
    pk: event_id
    columns:
      - { name: event_id, type: VARCHAR(64), constraints: [PK, NOT_NULL] }
      - { name: aggregate_id, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: aggregate_version, type: BIGINT, constraints: [NOT_NULL] }
      - { name: event_name, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: payload_json, type: JSONB, constraints: [NOT_NULL] }
      - { name: occurred_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: claim_owner, type: VARCHAR(64), constraints: [NULLABLE] }
      - { name: claimed_at, type: TIMESTAMPTZ, constraints: [NULLABLE] }
      - { name: published_at, type: TIMESTAMPTZ, constraints: [NULLABLE] }
    indexes:
      - { name: uq_persona_relationship_outbox_version, columns: [aggregate_id, aggregate_version], unique: true }
      - { name: idx_persona_relationship_outbox_pending, columns: [published_at, claimed_at, occurred_at] }
