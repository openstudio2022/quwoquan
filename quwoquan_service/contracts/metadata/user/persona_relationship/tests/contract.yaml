aggregate: PersonaRelationship
layer: service_side

description: |
  云侧契约测试场景（真实 PostgreSQL）。
  执行：go test ./services/user-service/...

real_engines:
  postgres: embedded-postgres

spy_targets: [event_publisher]

scenarios:
  - name: follow_creates_pair_and_event
    command: FollowUser
    assertions:
      - db_pair_row_exists_with_canonical_lower_upper
      - event_PersonaFollowStateChanged_published_once
      - state_receipt_outbox_same_transaction

  - name: duplicate_follow_idempotent_replay
    command: FollowUser x2 (same pair)
    assertions:
      - direction_row_exactly_1
      - second_call_idempotent_replay_true
      - outbox_not_appended_on_replay

  - name: block_clears_bidirectional_follow
    command: BlockUser
    seed: [mutual_follow_pair]
    assertions:
      - both_directions_following_false_same_commit
      - pending_greeting_marked_blocked
      - outbox_identifies_each_cleared_follow_direction

  - name: counter_projection_replay_safe
    event: PersonaFollowStateChanged
    assertions:
      - command_path_does_not_count_relationship_rows
      - projection_updates_follower_and_following_once
      - replayed_event_does_not_double_increment
      - periodic_reconciler_repairs_drift_outside_command_latency

  - name: follow_blocked_pair_rejected
    command: FollowUser
    seed: [block_direction_target_to_actor]
    assertions:
      - error_USER.RELATIONSHIP.follow_blocked
      - no_state_change

  - name: capability_view_wire_shape
    query: GetRelationshipCapability
    assertions:
      - response_fields_match_RelationshipCapabilityView_16_fields
      - no_unregistered_wire_field
