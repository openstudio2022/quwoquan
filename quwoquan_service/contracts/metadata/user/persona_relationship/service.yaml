version: 1

service:
  name: user-service
  domain: user
  owner: user-platform
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: USER_PERSONA_RELATIONSHIP_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure

api_routes:
  - method: POST
    path: /v1/user/sub-accounts/{targetSubAccountId}/follow
    operation: FollowUser
    actor: persona
    application:
      kind: command
      facet: PersonaRelationshipCommandFacade
      method: followUser
      aggregate_owner: PersonaRelationship
      mutation_target: PersonaRelationship
      invariant_target: PersonaRelationship
    description: 关注公开主体（subAccount 级别）
    request_entity: FollowCommandRequest
    request_fields: [actorSubAccountId, source, clientRequestId]
    response_entity: FollowCommandResult
    response_fields: [actorSubAccountId, targetSubAccountId, relationState, idempotentReplay, updatedAt]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: DELETE
    path: /v1/user/sub-accounts/{targetSubAccountId}/follow
    operation: UnfollowUser
    actor: persona
    application:
      kind: command
      facet: PersonaRelationshipCommandFacade
      method: unfollowUser
      aggregate_owner: PersonaRelationship
      mutation_target: PersonaRelationship
      invariant_target: PersonaRelationship
    description: 取消关注公开主体（subAccount 级别）

  - method: GET
    path: /v1/user/sub-accounts/{subAccountId}/following
    operation: ListFollowing
    actor: persona_or_device
    application:
      kind: query
      facet: RelationshipQueryFacade
      method: listFollowing
      reader: ListFollowingReader
      slice: ListFollowingSlice
    description: 关注列表（按 subAccount 读取）
    query_params: [query, cursor, limit]
    response_entity: FollowingListItemView
    response_fields: [subAccountId, username, userHandle, displayName, avatarUrl, profileVisibility, relationState, followedAt, relationshipCapability]

  - method: GET
    path: /v1/user/sub-accounts/{subAccountId}/followers
    operation: ListFollowers
    actor: persona_or_device
    application:
      kind: query
      facet: RelationshipQueryFacade
      method: listFollowers
      reader: ListFollowersReader
      slice: ListFollowersSlice
    description: 粉丝列表（按 subAccount 读取）
    query_params: [query, cursor, limit]
    response_entity: FollowerListItemView
    response_fields: [subAccountId, username, userHandle, displayName, avatarUrl, profileVisibility, relationState, followedAt, relationshipCapability]

  - method: GET
    path: /v1/user/sub-accounts/{subAccountId}/relationship
    operation: GetRelationship
    actor: persona_or_device
    application:
      kind: query
      facet: RelationshipQueryFacade
      method: getRelationship
      reader: GetRelationshipReader
      slice: GetRelationshipSlice
    description: 关系查询（subAccount 级别的基础关系态）
    response_entity: RelationshipView
    response_fields: [viewerSubAccountId, targetSubAccountId, relationState, isBlocked, isBlockedBy]

  - method: GET
    path: /v1/user/sub-accounts/{subAccountId}/relationship/capability
    operation: GetRelationshipCapability
    actor: persona_or_device
    application:
      kind: query
      facet: RelationshipQueryFacade
      method: getRelationshipCapability
      reader: GetRelationshipCapabilityReader
      slice: GetRelationshipCapabilitySlice
    description: "关系能力位投影（统一真相源）。基于 PersonaRelationship + Persona 计算 relationState 与消息/通话能力。端侧用户主页按钮矩阵和 RTC 门禁直接消费。"
    response_entity: RelationshipCapabilityView
    response_fields: [viewerSubAccountId, targetSubAccountId, relationState, canFollow, canUnfollow, canOpenConversation, canFollowBack, canStartVoiceCall, canStartVideoCall, isBlocked, isBlockedBy]

  - method: POST
    path: /v1/user/sub-accounts/{targetSubAccountId}/block
    operation: BlockUser
    actor: persona
    application:
      kind: command
      facet: PersonaRelationshipCommandFacade
      method: blockUser
      aggregate_owner: PersonaRelationship
      mutation_target: PersonaRelationship
      invariant_target: PersonaRelationship
    description: 屏蔽目标 persona，并在同一 commit 中清除 pair 双向 follow
    auth: required

  - method: DELETE
    path: /v1/user/sub-accounts/{targetSubAccountId}/block
    operation: UnblockUser
    actor: persona
    application:
      kind: command
      facet: PersonaRelationshipCommandFacade
      method: unblockUser
      aggregate_owner: PersonaRelationship
      mutation_target: PersonaRelationship
      invariant_target: PersonaRelationship
    description: 取消屏蔽但不恢复历史 follow
    auth: required

  - method: GET
    path: /v1/user/blocked
    operation: ListBlockedUsers
    actor: persona
    application:
      kind: query
      facet: RelationshipQueryFacade
      method: listBlockedUsers
      reader: ListBlockedUsersReader
      slice: ListBlockedUsersSlice
    description: 当前 persona 的已屏蔽对象切片
    response_entity: BlockedListItemView
    response_fields: [targetSubAccountId, blockedAt]
    auth: required

consumers:
  - name: app
    capabilities: [follow, unfollow, block, unblock, list_blocked, list_following, list_followers, check_relationship]
  - name: recommendation-engine
    capabilities: [read_graph]
  - name: notification-service
    capabilities: [read_follow]

contract_test:
  mock_strategy:
    app_side:
      mock_target: user-service API (follow)
      data_source: fields.yaml
      scenarios:
        - name: follow_unfollow_toggle
          routes:
            - POST /v1/user/sub-accounts/{targetSubAccountId}/follow
            - DELETE /v1/user/sub-accounts/{targetSubAccountId}/follow
          assertions: [follow_created, follow_removed, idempotent]

        - name: mutual_follow_detection
          route: GET /v1/user/sub-accounts/{subAccountId}/relationship
          assertions: [status_200, mutual_flag_correct]

        - name: follower_list_pagination
          route: GET /v1/user/sub-accounts/{subAccountId}/followers
          assertions: [status_200, cursor_pagination_works]

    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        postgres: testcontainers (postgres:16)
      spy_targets: [event_publisher]
      mock_targets: [user_service_client]
      data_management:
        seed: fixture 工厂预制到真实 PostgreSQL
        cleanup: "TRUNCATE persona_relationships, persona_relationship_directions, persona_relationship_command_receipts, persona_relationship_outbox CASCADE"
      scenarios:
        - name: follow_with_counter_sync
          command: FollowUser
          seed: []
          assertions:
            - "SELECT pair_id FROM persona_relationships WHERE lower_persona_id=? AND upper_persona_id=? → row exists"
            - "eventSpy.AssertPublished('PersonaFollowStateChanged', {sourcePersonaId, targetPersonaId, following:true})"

        - name: unfollow
          command: UnfollowUser
          seed: [fixture.NewPersonaRelationship()]
          assertions:
            - "direction following=false 且 pair aggregate 仍保留版本历史"
            - "eventSpy.AssertPublished('PersonaFollowStateChanged', {following:false})"

        - name: duplicate_follow_idempotent
          command: FollowUser x2 (same pair)
          seed: []
          assertions:
            - "persona_relationship_directions 同方向 exactly 1"
            - "no error on second call"

  coverage_requirements:
    - idempotency tested
    - counter sync verified
    - mutual follow scenario covered
