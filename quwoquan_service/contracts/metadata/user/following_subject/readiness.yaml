  api_integration:
    - quwoquan_service/services/user-service/tests/api_integration/subject_follow_contract__api_integration_test.go
  user_acceptance:
    - quwoquan_app/test/user_acceptance/journeys/discovery/following_channel_red_dot_journey__user_acceptance_test.dart
environments: []
