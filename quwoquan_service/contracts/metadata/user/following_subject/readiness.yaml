object: FollowingSubject
operations:
  - ListFollowingSubjects
implementation:
  store:
    - quwoquan_service/services/user-service/internal/infrastructure/persistence/mongo_following_subject_store.go
  reader:
    # projector 是投影写入器，与 query_service 同按 reader 证据登记。
    - quwoquan_service/services/user-service/internal/application/relationship/following_subject/projector.go
    - quwoquan_service/services/user-service/internal/application/relationship/following_subject/query_service.go
  transport:
