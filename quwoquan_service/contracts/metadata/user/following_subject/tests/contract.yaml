aggregate: FollowingSubject
layer: service_side

description: |
  云侧契约测试场景（真实 MongoDB 投影）。
  执行：go test ./services/user-service/...

real_engines:
  mongodb: testcontainers

scenarios:
  - name: projector_consumes_follow_events
    events: [PersonaFollowStateChanged, SubjectFollowStateChanged, CircleJoined, CircleLeft]
    assertions:
      - projection_rows_upserted_per_viewer_subject
      - unfollow_or_leave_removes_row
      - checkpoint_monotonic_per_source

  - name: visit_event_clears_unread
    events: [FollowedSubjectVisited]
    assertions:
      - has_unread_changes_false_after_visit
      - unread_change_count_reset

  - name: list_following_subjects_viewer_scoped
    query: ListFollowingSubjects
    assertions:
      - only_authenticated_viewer_rows_returned
      - cursor_pagination_stable
      - subject_type_filter_applied

  - name: projection_rebuildable
    assertions:
      - replay_from_zero_checkpoint_converges_to_same_rows
