aggregate: FollowingSubject
layer: e2e

description: |
  端云集成测试场景（gamma 环境）。
  执行：CI gamma，非 PR 门禁（advisory）。

scenarios:
  - name: channel_reflects_cross_domain_follows
    steps:
      - user follows another user, a homepage and joins a circle
      - user opens home following channel
    assertions:
      - strip_contains_all_three_subjects
      - ordering_by_latest_change
