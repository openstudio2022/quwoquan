version: 1
entity: FollowingSubject

service:
  name: user-service
  domain: user

api_routes:
  - method: GET
    path: /v1/user/following-subjects
    operation: ListFollowingSubjects
    description: 首页关注频道顶部关注对象列表（用户 / 圈子 / 地点和事物主页）
    query_params: [cursor, limit, subjectType]
    response_entity: FollowingSubjectItemView
    response_fields: [subjectId, subjectType, displayName, avatarUrl, coverUrl, subtitle, targetRouteId, targetObjectId, followedAt, lastVisitedAt, latestChangedAt, unreadChangeCount, hasUnreadChanges, latestChangeReason]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /v1/user/following-subjects/{subjectType}/{subjectId}:mark-visited
    operation: MarkFollowingSubjectVisited
    description: 标记关注对象已访问，清除“上次访问后变化”提示
    path_params: [subjectType, subjectId]
    request_entity: MarkFollowingSubjectVisitedRequest
    request_fields: [subjectId, subjectType, visitedAt, clientRequestId]
    response_entity: FollowingSubjectVisitResult
    response_fields: [subjectId, subjectType, lastVisitedAt, hasUnreadChanges]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

consumers:
  - name: app
    capabilities: [list_following_subjects, mark_following_subject_visited]
  - name: recommendation-engine
    capabilities: [read_following_subjects]

contract_test:
  mock_strategy:
    app_side:
      mock_target: user-service API (following subjects)
      data_source: ../test_fixtures/scenarios/user_scenarios.json -> seedSets.following_subject_core
      scenarios:
        - name: list_three_subject_types
          route: GET /v1/user/following-subjects
          assertions: [contains_user_circle_homepage, unread_flags_present]
        - name: mark_visited_clears_unread
          route: POST /v1/user/following-subjects/{subjectType}/{subjectId}:mark-visited
          assertions: [hasUnreadChanges_false, lastVisitedAt_updated]
