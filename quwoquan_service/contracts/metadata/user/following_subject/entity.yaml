version: 1
domain: user
entity: FollowingSubject
is_aggregate: false
description: |
  当前身份关注对象的统一读模型。它聚合用户关注、圈子加入/关注、地点和事物主页关注，
  供首页关注频道顶部“关注动态”横向列表消费。该模型不替代各对象域的关系写入，
  只维护 viewer 维度访问水位与未读变化投影。

service:
  name: user-service
  domain: user

ownership:
  owner_team: app-foundation
  lifecycle: active

storage:
  backend: mongodb
