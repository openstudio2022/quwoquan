version: 1
aggregate: CredentialBinding
backend: postgres
tables:
  credential_bindings:
    entity: CredentialBinding
    role: authoritative
  credential_bindings_command_receipts:
    entity: CredentialBinding
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 postgres transaction 提交的幂等回执。
  credential_bindings_outbox:
    entity: CredentialBinding
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
