version: 1
service:
  name: user-service
  domain: user
  owner: identity-platform
  description: CredentialBinding 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: 对象专属 Store/outbox、transport 与 generated client 尚未完成生产装配
    gap_id: ACCOUNT_OBJECT_PACKET_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /v1/owner/credentials/bind
    operation: BindCredential
    actor: account
    application:
      kind: command
      facet: CredentialCommandFacade
      method: bindCredential
      aggregate_owner: CredentialBinding
      mutation_target: CredentialBinding
      invariant_target: CredentialBinding
    description: 绑定新凭证（wechat/alipay/qq/apple/passkey 等非手机号凭证；手机号必须走专用 OTP/运营商绑定契约）
    request_fields: [credentialType, credentialKey, displayLabel]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /v1/owner/credentials/phone/bind
    operation: BindPhoneCredential
    actor: account
    application:
      kind: command
      facet: CredentialCommandFacade
      method: bindPhoneCredential
      aggregate_owner: CredentialBinding
      mutation_target: CredentialBinding
      invariant_target: CredentialBinding
    description: 绑定手机号；必须先通过 SendOtp(sourceOperation=bind_phone) 下发并校验 OTP
    request_fields: [phone, otpCode, displayLabel]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /v1/owner/credentials/carrier-phone/bind
    operation: BindCarrierPhoneCredential
    actor: account
    application:
      kind: command
      facet: CredentialCommandFacade
      method: bindCarrierPhoneCredential
      aggregate_owner: CredentialBinding
      mutation_target: CredentialBinding
      invariant_target: CredentialBinding
    description: 绑定运营商本机号码；App 只上传 carrierToken，服务端置换真实手机号并写入 carrier_phone 凭证
    request_fields: [vendor, carrierToken, deviceId, platform, displayLabel]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: DELETE
    path: /v1/owner/credentials/{credentialType}
    operation: UnbindCredential
    actor: account
    application:
      kind: command
      facet: CredentialCommandFacade
      method: unbindCredential
      aggregate_owner: CredentialBinding
      mutation_target: CredentialBinding
      invariant_target: CredentialBinding
    description: 解绑凭证（不能解绑最后一个）
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  # ── 分身管理（用户私有视图，需登录） ───────────────────────────────────
