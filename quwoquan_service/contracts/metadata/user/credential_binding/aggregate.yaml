domain: user
aggregate_root: CredentialBinding
object_kind: aggregate_root
description: Account 与 phone、carrier、OAuth 等认证凭证的绑定和吊销生命周期聚合。
storage_backend: postgres
capabilities: [commandable, queryable, idempotent_commands]
members: []
business_rules:
  - credentialType + credentialKey 全局唯一且 secret 仅保存不可逆引用
  - 绑定必须消费已完成且未消费的 AuthenticationChallenge
  - Account 必须始终保留至少一种可恢复凭证，除非账号 closed
  - revoked 绑定不可恢复，重新绑定创建新 identity
  - bind/revoke 与安全审计 outbox 在同一 PostgreSQL transaction 提交
lifecycle:
  states: [active, revoked]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/account/credential_binding/model
  ports: internal/domain/account/credential_binding/ports
  application: internal/application/account/credential_binding
  persistence: internal/infrastructure/account/credential_binding/persistence
