aggregate: CredentialBinding
layer: service_side

description: |
  云侧契约测试场景（真实 PostgreSQL）。
  执行：go test ./services/user-service/...

real_engines:
  postgres: embedded-postgres

spy_targets: [outbox]
mock_targets: [carrier_provider]

scenarios:
  - name: bind_phone_consumes_challenge
    command: BindPhoneCredential
    assertions:
      - completed_challenge_consumed_exactly_once
      - db_credential_binding_active
      - outbox_CredentialBound_same_transaction

  - name: duplicate_bind_is_idempotent_noop
    command: BindVerifiedCredential internal coordinator x2 (same credentialKey, same account)
    assertions:
      - unique_constraint_holds_single_row
      - second_bind_returns_existing_binding_without_new_outbox

  - name: credential_conflict_across_accounts
    command: BindVerifiedCredential internal coordinator (credentialKey owned by another account)
    assertions:
      - rejected_with_credential_conflict
      - no_state_change

  - name: unbind_last_credential_forbidden
    command: UnbindCredential (only recoverable credential)
    assertions:
      - rejected_with_last_credential
      - binding_remains_active

  - name: unbind_writes_audit_outbox
    command: UnbindCredential (with remaining credential)
    assertions:
      - binding_revoked
      - outbox_CredentialRevoked_same_transaction
