aggregate: CredentialBinding
layer: e2e

description: |
  端云集成测试场景（gamma 环境）。
  执行：CI gamma，非 PR 门禁（advisory）。

scenarios:
  - name: bind_phone_then_visible_in_credentials
    steps:
      - logged-in user requests otp for bind_phone
      - user submits code to bind phone credential
      - user opens credential list
    assertions:
      - phone_credential_listed_with_masked_label
      - unbind_of_last_credential_rejected
