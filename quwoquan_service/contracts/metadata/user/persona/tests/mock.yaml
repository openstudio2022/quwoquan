aggregate: Persona
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: persona_management_item_parse
    description: 分身管理列表 DTO 解析与守卫字段
    assertions:
      - lifecycle_guard_fields_parsed
      - user_handle_read_only

  - name: error_code_mapping
    description: 分身错误码端侧映射
    cases:
      - http_status: 409
        code: USER.SUB_ACCOUNT.quota_reached
        expected_dart_const: quotaReached
      - http_status: 409
        code: USER.SUB_ACCOUNT.primary_guard
        expected_dart_const: primaryGuard
      - http_status: 404
        code: USER.SUB_ACCOUNT.not_found
        expected_dart_const: subAccountNotFound
