aggregate: Persona
layer: service_side

description: |
  云侧契约测试场景（真实 PostgreSQL）。
  执行：go test ./services/user-service/...

real_engines:
  postgres: embedded-postgres

spy_targets: [outbox]
mock_targets: []

scenarios:
  - name: create_persona_receipt_idempotency
    command: CreatePersona x2 (same Idempotency-Key)
    assertions:
      - single_persona_row_created
      - replay_returns_original_receipt
      - state_receipt_outbox_same_transaction

  - name: commands_commit_cas_receipt_outbox
    command: UpdatePersona / RetirePersona
    assertions:
      - version_incremented_per_commit
      - personas_command_receipts_row_per_command
      - personas_outbox_event_per_version
      - Persona 不提供硬删除；所有移除统一进入 retired 终态并保留跨域归因

  - name: activate_persona_exclusive
    command: ActivatePersona
    assertions:
      - exactly_one_active_persona_per_account
      - switch_is_transactionally_atomic

  - name: retire_guards
    command: RetirePersona (primary / last / active persona)
    assertions:
      - primary_guard_enforced
      - last_sub_account_guard_enforced
      - active_guard_enforced

  - name: update_user_profile_typed_command
    command: UpdateUserProfile
    assertions:
      - unknown_fields_rejected_with_invalid_argument
      - nickname_uniqueness_enforced
      - version_cas_commit_with_receipt_and_outbox
