aggregate: Persona

entities:
  Persona:
    description: 用户子账号——应用内真实身份主体；只保留 subAccountId 作为主体 ID
    fields:
      - name: userId
        source: userId
        type: string
        constraints: [FK_user_profiles_CASCADE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: displayName
        source: displayName
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: userHandle
        source: userHandle
        type: string
        constraints: [NULLABLE, UK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 分身用户号；全局唯一、用户可修改、用于公开标识

      - name: phone
        source: phone
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read_write
        ops_exposure: mask
        description: 当前分身绑定手机号；默认继承主分身，可单独改写

      - name: email
        source: email
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read_write
        ops_exposure: mask
        description: 当前分身绑定邮箱；默认继承主分身，可单独改写

      - name: avatarUrl
        source: avatarUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: avatarMediaAssetId
        source: avatarMediaAssetId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: MediaAsset identity；delivery URL 仅为可重建投影字段。

      - name: avatarVersion
        source: avatarVersion
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: false
        description: 子账号头像版本号；用于 persona 头像缓存失效与继承头像对齐

      - name: backgroundUrl
        source: backgroundUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 子账号主页头图 URL；为空时继承 owner 基线

      - name: backgroundMediaAssetId
        source: backgroundMediaAssetId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 主页头图 MediaAsset identity。

      - name: bio
        source: bio
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 子账号简介；为空时继承 owner 基线

      - name: callerRingtoneId
        source: callerRingtoneId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 发起实时通话时对外使用的官方呼叫铃声 ID；为空时回退平台默认铃声

      - name: themeModeOverride
        source: themeModeOverride
        type: enum
        enum_ref: ThemeModeSetting
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 子账号对 owner 默认主题模式的覆盖；为空表示继承 owner 默认值

      - name: fontSizePresetOverride
        source: fontSizePresetOverride
        type: enum
        enum_ref: FontSizePreset
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 子账号对 owner 默认字号预设的覆盖；为空表示继承 owner 默认值

      - name: appearanceOverrideUpdatedAt
        source: appearanceOverrideUpdatedAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 子账号 appearance override 最后更新时间

      - name: isPrimary
        source: isPrimary
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: isPrivate
        source: isPrivate
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: isActive
        source: isActive
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: status
        source: status
        type: enum
        enum_ref: PersonaStatus
        constraints: [NOT_NULL]
        default_value: active
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 分身生命周期状态；retired 后不可再作为新动作主体

      - name: retiredAt
        source: retiredAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 分身退役时间；为空表示仍可作为活跃主体

      - name: createdAt
        source: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: subAccountId
        source: subAccountId
        type: string
        constraints: [PK, NOT_NULL, UK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 全局唯一子账号 ID；也是跨域上下文唯一主体 ID

      - name: isolationLevel
        source: isolationLevel
        type: enum
        enum_ref: IsolationLevel
        constraints: [NOT_NULL]
        default_value: open
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: "隔离等级：open（公开可发现）/ semi（半隔离）/ strict（不对外暴露）"

      - name: purposeHint
        source: purposeHint
        type: string
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: drop
        ops_exposure: read
        description: 用户自定义用途备注（仅主控账号视角可见）

      - name: inheritsProfileFromOwner
        source: inheritsProfileFromOwner
        type: bool
        constraints: [NOT_NULL, DEFAULT_TRUE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 是否默认继承 owner 资料基线

      - name: overriddenProfileFields
        source: overriddenProfileFields
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 当前子账号已覆写的资料字段列表

      - name: lastProfileSyncAt
        source: lastProfileSyncAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 最近一次资料同步时间

      - name: lastProfileSyncSource
        source: lastProfileSyncSource
        type: enum
        enum_ref: ProfileSyncSource
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 最近一次资料同步来源

      - name: updatedAt
        source: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: version
        source: version
        type: int
        constraints: [NOT_NULL, DEFAULT_1]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: Persona aggregate optimistic concurrency version。

    unique_constraints:
      - columns: [userId, isPrimary]
        condition: "isPrimary = true"
        description: 每主控账号恰好一个主子账号
      - columns: [userId, isActive]
        condition: "isActive = true"
        description: 每主控账号同时恰好一个激活子账号
      - columns: [subAccountId]
        description: 子账号 ID 全局唯一

    enums:
      IsolationLevel:
        values: [open, semi, strict]
        description: >
          open: 可被通讯录发现，可关注；
          semi: 可关注但不被通讯录推荐；
          strict: 完全不被外部发现，仅受邀可见
