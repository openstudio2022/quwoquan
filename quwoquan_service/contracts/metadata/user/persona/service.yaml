version: 1
service:
  name: user-service
  domain: user
  owner: identity-platform
  description: Persona 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: 对象专属 Store/outbox、transport 与 generated client 尚未完成生产装配
    gap_id: ACCOUNT_OBJECT_PACKET_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /v1/user/personas
    operation: CreatePersona
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: createPersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 创建新分身；userHandle/趣我圈号由服务端按 subAccountId 系统分配，客户端不提交
    request_entity: Persona
    request_fields: [displayName, avatarUrl, isolationLevel, purposeHint]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaManagementItemView
    response_fields: [subAccountId, displayName, userHandle, phone, email, avatarUrl, backgroundUrl, bio, isolationLevel, isActive, isPrimary, status, retiredAt, inheritsProfileFromOwner, overriddenProfileFields, lastProfileSyncAt, lastProfileSyncSource, profileVisibility, purposeHint, hasAttributedHistory, updatedAt, lastActivatedAt]

  - method: PATCH
    path: /v1/user/personas/{subAccountId}
    operation: UpdatePersona
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: updatePersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 更新分身资料或隔离等级；userHandle/趣我圈号只读，不允许客户端修改
    request_entity: SubAccountProfileMutation
    request_fields: [displayName, phone, email, avatarUrl, isolationLevel, purposeHint, applyScope, syncTargetIds, fieldsMask]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaManagementItemView
    response_fields: [subAccountId, displayName, userHandle, phone, email, avatarUrl, backgroundUrl, bio, isolationLevel, isActive, isPrimary, status, retiredAt, inheritsProfileFromOwner, overriddenProfileFields, lastProfileSyncAt, lastProfileSyncSource, profileVisibility, purposeHint, hasAttributedHistory, updatedAt, lastActivatedAt]

  - method: POST
    path: /v1/user/personas/{subAccountId}/profile-sync
    operation: ApplyPersonaProfileSync
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: applyPersonaProfileSync
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 将某个分身的资料字段同步到全部或指定其它分身
    request_entity: SubAccountProfileMutation
    request_fields: [applyScope, syncTargetIds, fieldsMask]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /v1/user/personas/{subAccountId}/retire
    operation: RetirePersona
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: retirePersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 退役已有记录归因的分身，保留记录对象作者归因
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: PersonaLifecycleGuardView
    response_fields: [subAccountId, requestedAction, allowed, reason, hasAttributedHistory, requiresSuccessor]

  - method: DELETE
    path: /v1/user/personas/{subAccountId}/delete-empty
    operation: DeleteEmptyPersona
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: deleteEmptyPersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 删除无记录归因的空白分身
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /v1/user/personas/{subAccountId}/activate
    operation: ActivatePersona
    actor: account
    application:
      kind: command
      facet: PersonaManagementCommandFacade
      method: activatePersona
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: 切换激活分身（强一致，排他写）
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: ActivePersonaContextView
    response_fields: [ownerUserId, subAccountId, isolationLevel, profileVisibility, contextVersion, personaSnapshotVersion, sourceSurfaceId, explicitOverride, switchedAt]

  # ── 用户主页（公开身份视图） ─────────────────────────────────────────────

  - method: PATCH
    path: /v1/user/profile
    operation: UpdateUserProfile
    actor: persona
    application:
      kind: command
      facet: ProfileCommandFacade
      method: updateUserProfile
      aggregate_owner: Persona
      mutation_target: Persona
      invariant_target: Persona
    description: "[已有] 更新主控账号资料"
    request_entity: SubAccountProfileMutation
    request_fields: [nickname, displayName, avatarAssetId, avatarUrl, backgroundAssetId, backgroundUrl, bio, gender, birthDate, regionTagRef, occupationTagRef, interestTagRefs, identityTags, profileVisibility, applyScope, syncTargetIds, fieldsMask]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
