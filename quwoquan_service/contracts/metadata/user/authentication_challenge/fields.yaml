version: 1
aggregate: AuthenticationChallenge

entities:
  AuthenticationChallenge:
    description: 一次密码、OTP、passkey 或联合登录挑战的短生命周期根
    fields:
      - { name: id, type: string, constraints: [PK, NOT_NULL] }
      - { name: accountId, type: string, constraints: [NULLABLE] }
      - { name: purpose, type: string, constraints: [NOT_NULL] }
      - { name: channel, type: string, constraints: [NOT_NULL] }
      - { name: destinationHash, type: string, constraints: [NULLABLE] }
      - { name: secretRef, type: string, constraints: [NOT_NULL] }
      - { name: status, type: string, constraints: [NOT_NULL] }
      - { name: attemptCount, type: int, constraints: [NOT_NULL] }
      - { name: expiresAt, type: timestamp, constraints: [NOT_NULL] }
      - { name: createdAt, type: timestamp, constraints: [NOT_NULL] }
      - { name: completedAt, type: timestamp, constraints: [NULLABLE] }
