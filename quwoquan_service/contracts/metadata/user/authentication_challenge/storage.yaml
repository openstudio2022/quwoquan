version: 1
aggregate: AuthenticationChallenge
backend: postgres
tables:
  authentication_challenges:
    entity: AuthenticationChallenge
    role: authoritative
  authentication_challenges_command_receipts:
    entity: AuthenticationChallenge
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 postgres transaction 提交的幂等回执。
  authentication_challenges_outbox:
    entity: AuthenticationChallenge
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
