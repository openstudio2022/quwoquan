aggregate: AuthenticationChallenge
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: send_otp_request_shape
    description: SendOtp 请求只携带 phone/purpose，不携带任何码值
    assertions:
      - request_never_contains_code
      - resend_cooldown_rendered_from_server_response

  - name: error_code_mapping
    description: OTP 错误码端侧映射与文案
    cases:
      - http_status: 400
        code: USER.AUTH.otp_mismatch
        expected_dart_const: otpMismatch
      - http_status: 410
        code: USER.AUTH.otp_expired
        expected_dart_const: otpExpired
      - http_status: 429
        code: USER.AUTH.otp_rate_limited
        expected_dart_const: otpRateLimited
      - http_status: 423
        code: USER.AUTH.otp_attempts_exceeded
        expected_dart_const: otpAttemptsExceeded
