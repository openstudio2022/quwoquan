domain: user
aggregate_root: AuthenticationChallenge
object_kind: aggregate_root
description: OTP、OAuth authorization 与 one-tap hint 的短期验证挑战聚合。
storage_backend: postgres
capabilities: [commandable, queryable, expiring, idempotent_commands]
members: []
business_rules:
  - purpose、channel、destinationHash 与 secretRef 创建后不可变
  - secret 明文不得进入 aggregate、日志、事件或 API 响应
  - verify attempt 有界，超过上限或 expiresAt 后立即失效
  - completed、expired 与 locked 为终态，重复成功验证返回同一 receipt
lifecycle:
  states: [pending, completed, expired, locked, cancelled]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/account/authentication_challenge/model
  ports: internal/domain/account/authentication_challenge/ports
  application: internal/application/account/authentication_challenge
  persistence: internal/infrastructure/account/authentication_challenge/persistence
