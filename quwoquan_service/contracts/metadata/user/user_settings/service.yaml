version: 1
service:
  name: user-service
  domain: user
  owner: identity-platform
  description: UserSettings 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: 对象专属 Store/outbox、transport 与 generated client 尚未完成生产装配
    gap_id: ACCOUNT_OBJECT_PACKET_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: PATCH
    path: /v1/user/settings/notifications
    operation: UpdateNotificationSettings
    actor: account
    application:
      kind: command
      facet: UserSettingsCommandFacade
      method: updateNotificationSettings
      aggregate_owner: UserSettings
      mutation_target: UserSettings
      invariant_target: UserSettings
    request_entity: UserSetting
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: PATCH
    path: /v1/user/settings/privacy
    operation: UpdatePrivacySettings
    actor: account
    application:
      kind: command
      facet: UserSettingsCommandFacade
      method: updatePrivacySettings
      aggregate_owner: UserSettings
      mutation_target: UserSettings
      invariant_target: UserSettings
    request_entity: UserSetting
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: PATCH
    path: /v1/user/settings/calls
    operation: UpdateCallSettings
    actor: account
    application:
      kind: command
      facet: UserSettingsCommandFacade
      method: updateCallSettings
      aggregate_owner: UserSettings
      mutation_target: UserSettings
      invariant_target: UserSettings
    description: 更新来电与铃声设置（仅支持官方铃声库 ID）
    request_entity: UserSetting
    request_fields: [defaultIncomingCallRingtoneId, allowCallerRingtoneOverride, enableCallVibration, enableGroupCallRing]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: PATCH
    path: /v1/user/settings/appearance
    operation: UpdateAppearanceSettings
    actor: account
    application:
      kind: command
      facet: UserSettingsCommandFacade
      method: updateAppearanceSettings
      aggregate_owner: UserSettings
      mutation_target: UserSettings
      invariant_target: UserSettings
    description: 更新外观与字号设置；支持全账号同步、当前子账号覆盖、恢复继承 owner 默认
    request_entity: AppearanceSettingsMutation
    request_fields: [themeMode, fontSizePreset, applyScope]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    response_entity: AppearanceSettingsView
    response_fields: [themeMode, fontSizePreset, source, ownerDefaultThemeMode, ownerDefaultFontSizePreset, hasSubAccountOverride, version, updatedAt]
