version: 1

service:
  name: user-service
  domain: user
  owner: app-foundation
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: USER_FOLLOWED_SUBJECT_VISIT_STATE_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: FollowedSubjectVisitState 私有水位命令操作包。

api_routes:
  - method: POST
    path: /v1/user/followed-subjects/{subjectType}/{subjectId}:mark-visited
    operation: MarkFollowedSubjectVisited
    actor: persona
    application:
      kind: command
      facet: FollowedSubjectVisitCommandFacade
      method: markFollowedSubjectVisited
      aggregate_owner: FollowedSubjectVisitState
      mutation_target: FollowedSubjectVisitState
      invariant_target: FollowedSubjectVisitState
    description: 标记关注对象已访问，清除“上次访问后变化”提示
    path_params: [subjectType, subjectId]
    request_entity: MarkFollowedSubjectVisitedRequest
    request_fields: [subjectId, subjectType, visitedAt, clientRequestId]
    response_entity: FollowedSubjectVisitResult
    response_fields: [subjectId, subjectType, lastVisitedAt, hasUnreadChanges]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

consumers:
  - name: app
    capabilities: [mark_following_subject_visited]
