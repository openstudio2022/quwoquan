aggregate: FollowedSubjectVisitState
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: visit_result_parse
    description: FollowedSubjectVisitResult 强类型解析
    assertions:
      - last_visited_at_non_empty
      - has_unread_changes_cleared_after_mark

  - name: mark_visited_clears_unread_dot
    description: alpha facet 标记访问后关注频道红点清除
    assertions:
      - unread_count_zero_after_mark
      - repeated_mark_idempotent
