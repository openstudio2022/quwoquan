version: 1
entity: BlockEdge

events:
  - name: UserBlocked
    description: 用户拉黑；写入成功后必须同步清理双方关注边、失效双方 pending 打招呼请求，并通知下游收敛可见性
    producer: user-service
    consumers: [chat-service, recommendation-engine, content-service]
    channel: event_store
    payload_fields: [blockerId, blockedId]
    cross_domain_impact:
      - domain: chat
        effect: existing direct conversation becomes read-only for new messages
      - domain: recommendation
        effect: exclude blocked user content
      - domain: content
        effect: hide comments from blocked user

  - name: UserUnblocked
    description: 用户取消拉黑；不自动恢复关注边或 blocked 打招呼请求
    producer: user-service
    consumers: [chat-service, recommendation-engine, content-service]
    channel: event_store
    payload_fields: [blockerId, blockedId]
