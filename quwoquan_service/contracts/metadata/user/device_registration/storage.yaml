aggregate: DeviceRegistration
backend: postgres
tables:
  device_registrations:
    entity: UserDevice
    role: authoritative
  device_registrations_command_receipts:
    entity: UserDevice
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 postgres transaction 提交的幂等回执。
  device_registrations_outbox:
    entity: UserDevice
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
