domain: user
aggregate_root: DeviceRegistration
object_kind: aggregate_root
description: Account 的设备身份、平台能力、push token 与安全吊销生命周期聚合。
storage_backend: postgres
capabilities: [commandable, queryable, idempotent_commands]
members: []
business_rules:
  - identity 固定为 accountId + deviceId
  - pushToken 必须加密存储且同一 token 同时只属于一个 active registration
  - platform capability 由受信 App attestation 提供，客户端 actor 字段无效
  - logout 或安全事件可吊销设备，吊销后必须重新登记
lifecycle:
  states: [active, revoked, stale]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/account/device_registration/model
  ports: internal/domain/account/device_registration/ports
  application: internal/application/account/device_registration
  persistence: internal/infrastructure/account/device_registration/persistence
