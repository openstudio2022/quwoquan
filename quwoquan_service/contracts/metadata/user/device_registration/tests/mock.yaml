aggregate: DeviceRegistration
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: upsert_device_push_endpoint_request_shape
    description: UpsertDevicePushEndpoint typed command 与脱敏回执
    assertions:
      - request_contains_deviceId_endpointKind_token_appVersion
      - response_contains_no_token_or_fingerprint
      - endpointKind_accepts_only_apns_voip_or_fcm

  - name: error_code_mapping
    description: DevicePushEndpoint 对象错误码端侧映射
    cases:
      - http_status: 400
        code: USER.DEVICE_PUSH.invalid_endpoint_kind
        expected_dart_const: devicePushInvalidEndpointKind
      - http_status: 409
        code: USER.DEVICE_PUSH.token_conflict
        expected_dart_const: devicePushTokenConflict
