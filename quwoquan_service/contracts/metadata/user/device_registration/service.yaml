version: 1
service:
  name: user-service
  domain: user
  owner: identity-platform
  description: DeviceRegistration 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: 对象专属 Store/outbox、transport 与 generated client 尚未完成生产装配
    gap_id: ACCOUNT_OBJECT_PACKET_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /v1/user/devices/push-tokens
    operation: RegisterDevice
    actor: account
    application:
      kind: command
      facet: DeviceRegistrationCommandFacade
      method: registerDevice
      aggregate_owner: DeviceRegistration
      mutation_target: DeviceRegistration
      invariant_target: DeviceRegistration
    request_entity: UserDevice
