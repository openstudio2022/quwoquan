version: 1
domain: USER
entity: GreetingRequest

errors:
  - code: USER.GREETING.target_blocked_sender
    kind: GREETING
    reason: target_blocked_sender
    http_status: 403
    recovery_action: surface
    go_const: ErrGreetingTargetBlockedSender
    dart_const: greetingTargetBlockedSender
    l10n_key: error_greeting_target_blocked_sender
    user_message:
      zh: 发送失败，对方不接收你的打招呼
      en: Failed to send, the recipient does not accept greetings
    debug_hint: target has blocked sender or has allowStrangerGreeting=false

  - code: USER.GREETING.duplicate_pending
    kind: GREETING
    reason: duplicate_pending
    http_status: 409
    recovery_action: surface
    go_const: ErrGreetingDuplicatePending
    dart_const: greetingDuplicatePending
    l10n_key: error_greeting_duplicate_pending
    user_message:
      zh: 已发送过打招呼，请等待对方回复
      en: You have already sent a greeting request, please wait for a reply
    debug_hint: pending greeting already exists between same pair

  - code: USER.GREETING.rate_limited
    kind: GREETING
    reason: rate_limited
    http_status: 429
    recovery_action: retry
    recovery_after_seconds: 86400
    go_const: ErrGreetingRateLimited
    dart_const: greetingRateLimited
    l10n_key: error_greeting_rate_limited
    user_message:
      zh: 打招呼发送频率超限，请稍后再试
      en: Greeting rate limit exceeded, please try again later
    debug_hint: sender exceeded daily greeting quota

  # §24 M0.1 safetyGate 重行动拦截：realName / minorMode 两类前置门在 greeting/conversation/circle
  #   现有码中均缺失；约伴（start_companion）复用 GreetingRequest 破冰流程，是这两个门最自然的承接。
  #   端消费 IntersectionActionHint.requiredGates=[realName]/[minorMode]，被拦时映射到本组码优雅降级，
  #   不静默失败、不死循环（守 15-auth-entry-no-loop），拦截语义与 gateKeys 闭集同源。
  - code: USER.GREETING.sender_realname_required
    kind: GREETING
    reason: sender_realname_required
    http_status: 403
    recovery_action: surface
    go_const: ErrGreetingSenderRealnameRequired
    dart_const: greetingSenderRealnameRequired
    l10n_key: error_greeting_sender_realname_required
    user_message:
      zh: 完成实名认证后才能发起打招呼或约伴
      en: Complete real-name verification before greeting or inviting a companion
    debug_hint: safetyGate realName not satisfied for heavy social action

  - code: USER.GREETING.minor_restricted
    kind: GREETING
    reason: minor_restricted
    http_status: 403
    recovery_action: surface
    go_const: ErrGreetingMinorRestricted
    dart_const: greetingMinorRestricted
    l10n_key: error_greeting_minor_restricted
    user_message:
      zh: 青少年模式下暂不支持向陌生人打招呼或约伴
      en: Greeting or companion invites to strangers are unavailable in minor mode
    debug_hint: safetyGate minorMode restricts stranger social actions

  - code: USER.GREETING.already_contact
    kind: GREETING
    reason: already_contact
    http_status: 409
    recovery_action: surface
    go_const: ErrGreetingAlreadyContact
    dart_const: greetingAlreadyContact
    l10n_key: error_greeting_already_contact
    user_message:
      zh: 已互相关注，可直接进入正式私信
      en: Already mutual followers, you can enter the formal direct conversation
    debug_hint: requester and target are already mutual followers

  - code: USER.GREETING.not_found
    kind: GREETING
    reason: not_found
    http_status: 404
    recovery_action: surface
    go_const: ErrGreetingNotFound
    dart_const: greetingNotFound
    l10n_key: error_greeting_not_found
    user_message:
      zh: 打招呼请求不存在
      en: Greeting request not found
    debug_hint: greeting request id not found or access denied

  - code: USER.GREETING.invalid_status_transition
    kind: GREETING
    reason: invalid_status_transition
    http_status: 409
    recovery_action: surface
    go_const: ErrGreetingInvalidStatusTransition
    dart_const: greetingInvalidStatusTransition
    l10n_key: error_greeting_invalid_status
    user_message:
      zh: 操作不可用，请求状态已变更
      en: Operation not available, request status has changed
    debug_hint: attempted status transition is not allowed
