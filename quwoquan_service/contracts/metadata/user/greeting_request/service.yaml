
service:
  name: user-service
  domain: user
  owner: user-platform

api_routes:
  - method: POST
    path: /user/greeting-request

    operation: SendGreetingRequest
    actor: persona
    application:
      kind: command
      facet: GreetingRequestCommandFacade
      method: sendGreetingRequest
      aggregate_owner: GreetingRequest
      mutation_target: GreetingRequest
      invariant_target: GreetingRequest
    description: 发起打招呼（创建请求箱条目，未回复前不进入聊天列表）
    writable_fields: [targetSubAccountId, requestMessage, source]
    client_contract:
      dart_import: ../user/greeting_request_contracts.dart
      request_type: SendGreetingCommand
      response_type: GreetingRequestRecord
      request_encoder: encodeSendGreetingCommand
      response_decoder: decodeGreetingRequestRecord
    authorization:
      principal: persona
      ownership_policy: actor_self
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.invalid_argument
      - USER.GREETING.target_blocked_sender
      - USER.GREETING.duplicate_pending
      - USER.GREETING.already_contact
      - USER.GREETING.rate_limited
      - USER.GREETING.sender_realname_required
      - USER.GREETING.minor_restricted
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: SENSITIVE
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: user_greeting_request_command
      trace: true
      attributes: [operation, outcome, error_code]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /user/greeting-request/inbox

    operation: ListGreetingInbox
    actor: persona
    application:
      kind: query
      facet: GreetingRequestQueryFacade
      method: listGreetingInbox
      reader: ListGreetingInboxReader
      slice: ListGreetingInboxSlice
    description: 收件箱（我收到的待处理请求）
    query_params: [status, cursor, limit]
    client_contract:
      dart_import: ../user/greeting_request_contracts.dart
      request_type: ListGreetingRequestsQuery
      response_type: GreetingRequestSlice
      request_encoder: encodeListGreetingRequestsQuery
      response_decoder: decodeGreetingRequestSlice
    authorization:
      principal: persona
      ownership_policy: self
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.invalid_argument
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: PUBLIC
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_greeting_request_query
      trace: true
      attributes: [operation, outcome, error_code]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /user/greeting-request/outbox

    operation: ListGreetingOutbox
    actor: persona
    application:
      kind: query
      facet: GreetingRequestQueryFacade
      method: listGreetingOutbox
      reader: ListGreetingOutboxReader
      slice: ListGreetingOutboxSlice
    description: 发件箱（我发出的请求）
    query_params: [status, cursor, limit]
    client_contract:
      dart_import: ../user/greeting_request_contracts.dart
      request_type: ListGreetingRequestsQuery
      response_type: GreetingRequestSlice
      request_encoder: encodeListGreetingRequestsQuery
      response_decoder: decodeGreetingRequestSlice
    authorization:
      principal: persona
      ownership_policy: self
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - USER.USER.unauthorized
      - USER.USER.invalid_argument
      - USER.SYSTEM.internal_error
    privacy:
      request_classification: PUBLIC
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: user_greeting_request_query
      trace: true
      attributes: [operation, outcome, error_code]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
