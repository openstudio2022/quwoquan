    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    commercial:
      status: ready
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: DELETE
    path: /user/greeting-request/{requestId}

    operation: CancelGreetingRequest
    actor: persona
    application:
      kind: command
      facet: GreetingRequestCommandFacade
      method: cancelGreetingRequest
      aggregate_owner: GreetingRequest
      mutation_target: GreetingRequest
      invariant_target: GreetingRequest
    description: 撤回打招呼（仅发起方可操作，仅 pending 状态可撤回）
    path_params: [requestId]
    client_contract:
      dart_import: ../user/greeting_request_contracts.dart
