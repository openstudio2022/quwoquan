aggregate: GreetingRequest
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: greeting_request_wire_parse
    description: GreetingRequest wire 强类型解析（codegen DTO）
    assertions:
      - status_enum_valid
      - promoted_conversation_id_nullable

  - name: inbox_outbox_pagination
    description: 收件箱/发件箱 cursor 分页与状态过滤
    assertions:
      - cursor_pagination_stable
      - status_filter_applied

  - name: error_code_mapping
    description: greeting 错误码端侧映射
    cases:
      - http_status: 403
        code: USER.GREETING.target_blocked_sender
        expected_dart_const: greetingTargetBlockedSender
      - http_status: 409
        code: USER.GREETING.duplicate_pending
        expected_dart_const: greetingDuplicatePending
      - http_status: 429
        code: USER.GREETING.rate_limited
        expected_dart_const: greetingRateLimited
