aggregate: GreetingRequest
layer: e2e

description: |
  端云集成测试场景（gamma 环境）。
  执行：CI gamma，非 PR 门禁（advisory）。

scenarios:
  - name: greet_reply_upgrades_to_conversation
    steps:
      - user A sends greeting to user B from profile action bar
      - user B replies from greeting inbox
    assertions:
      - conversation_created_and_entered
      - greeting_status_replied
      - inbox_badge_cleared

  - name: greet_ignore_stays_out_of_chat_list
    steps:
      - user A sends greeting to user C
      - user C ignores the request
    assertions:
      - no_conversation_created
      - request_status_ignored
