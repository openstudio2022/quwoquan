aggregate: AccountSession
backend: postgres
tables:
  account_sessions:
    entity: AccountSession
    role: authoritative
  account_sessions_command_receipts:
    entity: AccountSession
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 postgres transaction 提交的幂等回执。
  account_sessions_outbox:
    entity: AccountSession
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
