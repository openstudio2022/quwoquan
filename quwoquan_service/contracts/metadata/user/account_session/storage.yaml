aggregate: AccountSession
backend: postgres
tables:
  account_sessions:
    entity: AccountSession
    role: authoritative
    description: refresh token 只保存不可逆哈希；rotation lineage 支持重放检测后整链吊销。
    columns:
      - { name: session_id, type: VARCHAR(64), constraints: [PK, NOT_NULL] }
      - { name: account_id, type: VARCHAR(96), constraints: [NOT_NULL] }
      - { name: device_id, type: VARCHAR(128), constraints: [NOT_NULL] }
      - { name: refresh_token_hash, type: VARCHAR(64), constraints: [NOT_NULL, UNIQUE] }
      - { name: lineage_id, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: rotated_from_hash, type: VARCHAR(64) }
      - { name: status, type: VARCHAR(16), constraints: [NOT_NULL], default: "'active'" }
      - { name: issued_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: expires_at, type: TIMESTAMPTZ, constraints: [NOT_NULL] }
      - { name: revoked_at, type: TIMESTAMPTZ }
      - { name: revoke_reason, type: VARCHAR(64) }
      - { name: version, type: BIGINT, constraints: [NOT_NULL], default: "1" }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
  account_sessions_outbox:
    entity: AccountSession
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
