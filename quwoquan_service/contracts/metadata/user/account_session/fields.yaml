version: 1
aggregate: AccountSession

entities:
  AccountSession:
    description: 登录会话、刷新轮换与吊销的独立生命周期根
    fields:
      - { name: id, type: string, constraints: [PK, NOT_NULL] }
      - { name: accountId, type: string, constraints: [NOT_NULL] }
      - { name: deviceId, type: string, constraints: [NOT_NULL] }
      - { name: refreshTokenHash, type: string, constraints: [NOT_NULL] }
      - { name: status, type: string, constraints: [NOT_NULL] }
      - { name: issuedAt, type: timestamp, constraints: [NOT_NULL] }
      - { name: expiresAt, type: timestamp, constraints: [NOT_NULL] }
      - { name: rotatedAt, type: timestamp, constraints: [NULLABLE] }
      - { name: revokedAt, type: timestamp, constraints: [NULLABLE] }
