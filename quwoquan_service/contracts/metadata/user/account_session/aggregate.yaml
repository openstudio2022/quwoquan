domain: user
aggregate_root: AccountSession
object_kind: aggregate_root
description: 登录后 refresh rotation、设备绑定、过期与吊销的 Account Session 聚合。
storage_backend: postgres
capabilities: [commandable, queryable, idempotent_commands]
members: []
business_rules:
  - access/refresh token 明文不得持久化，只保存 refreshTokenHash 与 rotation lineage
  - refresh 必须单次轮换，重放旧 token 立即吊销整条 lineage
  - session 必须绑定 accountId、deviceId、issuer 与 audience
  - logout、security revoke 或 expiresAt 后不可恢复
  - anonymous login 也创建受限 AccountSession，不使用 prod mock fallback
lifecycle:
  states: [active, rotated, revoked, expired]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/account/account_session/model
  ports: internal/domain/account/account_session/ports
  application: internal/application/account/account_session
  persistence: internal/infrastructure/account/account_session/persistence
