aggregate: AccountSession
layer: service_side

description: |
  云侧契约测试场景（真实 PostgreSQL）。
  执行：go test ./services/user-service/...

real_engines:
  postgres: embedded-postgres

spy_targets: [outbox]
mock_targets: [cross_service_clients]

scenarios:
  - name: login_creates_session_with_hash_only
    command: LoginWithPhone / LoginAnonymous
    assertions:
      - db_account_sessions_row_exists
      - refresh_token_stored_as_hash_only_no_plaintext_column
      - outbox_AccountSessionAuthenticated_same_transaction

  - name: refresh_single_rotation
    command: RefreshToken
    assertions:
      - old_hash_marked_rotated_new_hash_active
      - lineage_id_preserved_across_rotation
      - response_returns_new_token_pair

  - name: refresh_replay_revokes_lineage
    command: RefreshToken (replay old token)
    assertions:
      - replayed_hash_rejected_with_token_expired
      - entire_lineage_revoked
      - outbox_AccountSessionRevoked_published

  - name: logout_idempotent_noop
    command: Logout x2
    assertions:
      - first_logout_revokes_session
      - second_logout_returns_success_without_state_change
