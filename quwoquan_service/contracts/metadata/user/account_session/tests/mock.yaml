aggregate: AccountSession
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: login_result_dto_parse
    description: AuthLoginResult 字段解析与 token 安全存储
    assertions:
      - required_fields_non_empty
      - tokens_never_logged

  - name: refresh_single_flight
    description: 端侧 refresh 单飞，多请求共享同一次轮换
    assertions:
      - concurrent_401_triggers_exactly_one_refresh
      - refreshed_token_replayed_to_pending_requests

  - name: error_code_mapping
    description: auth 域错误码端侧映射
    cases:
      - http_status: 401
        code: USER.AUTH.token_expired
        expected_dart_const: tokenExpired
      - http_status: 423
        code: USER.AUTH.login_locked
        expected_dart_const: loginLocked
