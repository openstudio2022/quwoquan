aggregate: AccountSession
layer: e2e

description: |
  端云集成测试场景（gamma 环境）。
  执行：CI gamma，非 PR 门禁（advisory）。

scenarios:
  - name: phone_login_refresh_logout_roundtrip
    steps:
      - app sends otp and logs in with phone
      - app refreshes token before expiry
      - app logs out
    assertions:
      - refreshed_access_token_authorizes_requests
      - old_refresh_token_rejected_after_rotation
      - logged_out_refresh_token_rejected
