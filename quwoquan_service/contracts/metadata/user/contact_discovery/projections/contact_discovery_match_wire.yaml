version: 1
read_model: ContactDiscoveryMatchWire

description: |
  GetLatestContactDiscovery 响应中 matches[] 列表元素 wire。
  在仅暴露 subAccountId 的隐私基线上，附带发起者自己上传的 hashedPhone（用于端侧把命中用户映射回本地通讯录显示名）、
  精简 profile 与关系能力位（驱动「添加 / 已添加」按钮）。不含 ownerAccountId、不回显其它用户的手机号。

source_entities:
  - ContactDiscoveryRecord
  - UserProfile

consumers:
  - app

client_projection:
  dart_class: ContactDiscoveryMatchWireDto
  base_class: ""
  output_path: cloud/runtime/generated/user/contact_discovery_match_wire_dto.g.dart
  fields:
    - name: hashedPhone
      dart_type: String
      nullable: false
      source: hashedPhone
      aliases: [hashedPhone, phoneHash]
      default: "''"

    - name: subAccountId
      dart_type: String
      nullable: false
      source: subAccountId
      aliases: [subAccountId, userId]
      default: "''"
      skip_empty_string_aliases: true

    - name: userHandle
      dart_type: String
      nullable: false
      source: userHandle
      aliases: [userHandle, username, subAccountId]
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      aliases: [displayName, nickname]
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: true
      source: avatarUrl
      aliases: [avatarUrl]
      default: "null"

    - name: avatarVersion
      dart_type: int
      nullable: false
      source: avatarVersion
      aliases: [avatarVersion]
      default: "0"

    - name: region
      dart_type: String
      nullable: true
      source: region
      aliases: [region]
      default: "null"

    - name: relationshipCapability
      dart_type: Map<String, dynamic>
      nullable: true
      source: relationshipCapability
      aliases: [relationshipCapability]
      default: "null"
