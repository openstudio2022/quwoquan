aggregate: ContactDiscoveryRecord
layer: service_side

description: |
  云侧契约测试场景（真实 PostgreSQL）。
  执行：go test ./services/user-service/...

real_engines:
  postgres: embedded-postgres

spy_targets: [event_publisher]

scenarios:
  - name: initiate_matches_registered_hashes
    command: InitiateContactDiscovery
    assertions:
      - matched_sub_account_ids_only_registered
      - response_never_contains_owner_account_id
      - response_never_contains_raw_phones

  - name: rate_limit_5_per_24h
    command: InitiateContactDiscovery x6
    assertions:
      - sixth_call_error_USER.CONTACT.rate_limited

  - name: ttl_cleanup_deletes_hashed_phones
    command: InitiateContactDiscovery then advance 72h
    assertions:
      - expired_record_hashed_phones_physically_deleted
      - get_latest_returns_not_found_after_expiry

  - name: dismiss_owner_scoped
    command: DismissContactDiscovery
    assertions:
      - foreign_account_gets_not_found
      - owner_dismiss_removes_record
