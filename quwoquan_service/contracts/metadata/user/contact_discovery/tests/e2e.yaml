aggregate: ContactDiscoveryRecord
layer: e2e

description: |
  端云集成测试场景（gamma 环境）。
  执行：CI gamma，非 PR 门禁（advisory）。

scenarios:
  - name: discover_and_follow_contact
    steps:
      - user grants contacts permission and initiates discovery
      - user follows a matched contact from confirm page
    assertions:
      - matched_contacts_show_local_display_name
      - follow_action_updates_relation_state

  - name: dismiss_clears_latest_result
    steps:
      - user dismisses the discovery record
      - user reopens add-contact page
    assertions:
      - latest_result_empty_state
