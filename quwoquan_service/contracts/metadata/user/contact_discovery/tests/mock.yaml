aggregate: ContactDiscoveryRecord
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  执行：flutter test test/local_contract/cloud/user/

scenarios:
  - name: match_wire_parse
    description: ContactDiscoveryMatchWire 解析（hashedPhone 回显 + 精简 profile + 能力位）
    assertions:
      - hashed_phone_maps_back_to_local_contact
      - relationship_capability_drives_add_button

  - name: not_found_maps_to_empty_state
    description: 无发现记录时 CloudException.notFound 归一为空态而非错误
    assertions:
      - get_latest_null_on_not_found

  - name: error_code_mapping
    description: contact 错误码端侧映射
    cases:
      - http_status: 429
        code: USER.CONTACT.rate_limited
        expected_dart_const: contactRateLimited
      - http_status: 400
        code: USER.CONTACT.too_many_contacts
        expected_dart_const: contactTooManyContacts
