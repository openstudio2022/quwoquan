domain: notification
entity: Notification
object_kind: aggregate_root

description: |
  Notification/AppMessage 独立生命周期聚合，拥有创建、投递、确认、已读与
  dismiss 状态。承载社交互动、内容、圈子、系统和助手通知。

storage_backend: mongodb
cache_layer: none
capabilities:
  - commandable
  - queryable

taggable: false
vector_enabled: false

business_rules:
  - recipient、messageType、source 与 payload digest 创建后不可变
  - 同一 idempotencyKey 只创建一个 Notification
  - ack、read 与 dismiss 只能由 recipient 推进且时间戳单调
  - 外部渠道投递由 NotificationDeliveryJob 和 Integration 负责
  - Notification 状态与 outbox 必须在同一 Mongo transaction 提交
lifecycle:
  states: [created, delivered, acknowledged, read, dismissed]
  optimistic_concurrency: version
  idempotency: command_receipt

ddd_layer_mapping:
  domain_model: internal/domain/notification
  ports: internal/domain/notification/notification/ports
  application: internal/application/app_message_facades.go
  adapter_rest: internal/adapters/http/handler.go
  adapter_event: internal/infrastructure/persistence/mongo_app_message_store.go
