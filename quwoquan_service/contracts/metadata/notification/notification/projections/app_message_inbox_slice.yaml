read_model: AppMessageInboxSlice

description: |
  当前账户 AppMessage 聚合的游标分页查询切片。只由
  AppMessageInboxReader 从 notification.app_messages 权威集合读取，
  不建立第二份可写投影，也不允许跨账户查询。

storage_backend: mongodb
collection: app_messages
projection_mode: authoritative_query

source_entities:
  - Notification

consumers:
  - notification-service
  - app

client_projection:
  dart_class: AppMessageInboxSlice
  external_dart_path: quwoquan_app/packages/quwoquan_cloud_contracts/lib/src/notification/app_message_contracts.dart

fields:
  - { name: items, type: list<AppMessage> }
  - { name: nextCursor, type: string, nullable: true }
