entity: Notification

fields:
  - name: _id
    source: _id
    type: string
    constraints: [PK, NOT_NULL]
    classification: PII
    log_policy: hash
    api_exposure: read
    ops_exposure: read
    description: app message stable ID，HTTP 响应字段为 messageId。

  - name: idempotencyKey
    source: idempotencyKey
    type: string
    constraints: [NOT_NULL, UNIQUE]
    classification: SECRET
    log_policy: drop
    api_exposure: drop
    ops_exposure: drop

  - name: userId
    source: userId
    type: string
    constraints: [NOT_NULL]
    classification: PII
    log_policy: hash
    api_exposure: read
    ops_exposure: read

  - name: messageType
    source: messageType
    type: enum
    enum_ref: NotificationType
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: source
    source: source
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: sourceId
    source: sourceId
    type: string
    constraints: [NOT_NULL]
    classification: PII
    log_policy: hash
    api_exposure: read
    ops_exposure: read

  - name: destination
    source: destination
    type: object
    constraints: [NOT_NULL]
    classification: PII
    log_policy: metadata_only
    api_exposure: read
    ops_exposure: read

  - name: title
    source: title
    type: string
    constraints: [NOT_NULL]
    classification: PII
    log_policy: drop
    api_exposure: read
    ops_exposure: read

  - name: summary
    source: summary
    type: string
    constraints: [NOT_NULL]
    classification: PII
    log_policy: drop
    api_exposure: read
    ops_exposure: read

  - name: target
    source: target
    type: object
    constraints: [NOT_NULL]
    classification: PII
    log_policy: metadata_only
    api_exposure: read
    ops_exposure: read

  - name: provenance
    source: provenance
    type: object
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: metadata_only
    api_exposure: drop
    ops_exposure: read
    description: Assistant 等 producer 提交的个性化归因；只用于审计与行为回流，不向 App 暴露。

  - name: read
    source: read
    type: bool
    constraints: [NOT_NULL, DEFAULT_FALSE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: createdAt
    source: createdAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: deliveredAt
    source: deliveredAt
    type: timestamp
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: ackedAt
    source: ackedAt
    type: timestamp
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: readAt
    source: readAt
    type: timestamp
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

entities:
