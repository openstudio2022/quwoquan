version: 1
aggregate: Notification
backend: mongodb

collections:
  app_messages:
    entity: Notification
    description: Notification aggregate authoritative store。
    indexes:
      - { name: uq_app_messages_idempotency, keys: { idempotencyKey: 1 }, unique: true }
      - { name: idx_app_messages_owner_created, keys: { userId: 1, createdAt: -1, _id: -1 } }
      - { name: idx_app_messages_owner_read, keys: { userId: 1, read: 1, createdAt: -1 } }
      - { name: ttl_app_messages_created, keys: { createdAt: 1 }, expireAfterSeconds: 7776000 }
