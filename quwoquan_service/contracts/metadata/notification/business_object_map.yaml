    queries: named_reader_slice_only
  context_id: notification.notification
  name: Notification
  role: core
decision_refs:
- DDD-OBJ-001
- CTX-OWNERSHIP-007
- LEASE-009
domain: notification
objects:
- access:
    commands: aggregate_facade
    cross_context: public_contract_only
    queries: named_reader
  bounded_context: Notification
  canonical_object: Notification
  event_consumers:
  - content.CommentCreated
  - content.ContentReactionSet
  - content.PostPublished
  - user.PersonaFollowStateChanged
  - user.GreetingRequestSent
  - circle.CircleMembershipJoined
  - circle.CircleGroupMembershipRequested
  - circle.CircleGroupMembershipActivated
  - circle.CircleGroupMembershipRejected
  field_roles:
    append_only_fact: []
    authoritative_state:
    - _id
    - idempotencyKey
    - messageType
    - source
    - sourceId
    - destination
    - title
    - summary
    - target
    - provenance
    - read
    - createdAt
    - deliveredAt
    - ackedAt
    - readAt
    - userId
    owned_value: []
    projection: []
    reference:
    - userId
    transport_only: []
  identity:
    fields:
    - _id
    version_source: store_commit
  invariant_refs:
  - notification/notification/entity.yaml#business_rules
  lifecycle_refs:
  - notification/notification/entity.yaml#lifecycle
  member_bounds: {}
  mutation_entrypoints:
  - AckAppMessage
  - CreateAppMessage
  - ReadAppMessage
  object_kind: aggregate_root
  relationships:
  - access: named_reader
    cardinality: N:1
    consistency: eventual
    kind: reference
    name: accountOwner
    on_delete: cascade
    reference_fields:
    - userId
    target_object: user.UserAccount
  source_document: notification/notification/fields.yaml
  source_entity: Notification
  storage_backend: mongodb
  storage_role: authoritative
  local_identity_reasons:
    sourceId: producer-scoped provenance key; the Notification target carries the typed business destination
- access:
    commands: aggregate_facade
    cross_context: public_contract_only
    queries: named_reader
  bounded_context: Notification
  canonical_object: NotificationDeliveryJob
  event_consumers:
  - rtc.CallRinging
  - rtc.CallAnswered
  - rtc.CallEnded
