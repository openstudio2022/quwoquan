    append_only_fact: []
    authoritative_state:
    - id
    - dedupeKey
    - channel
    - destinationRef
    - status
    - attemptCount
    - nextAttemptAt
    - eventId
    - callId
    - targetPersonaId
    - deviceId
    - deliveryKey
    - callType
    - callerName
    - callerAvatarUrl
    - sourceLabel
    - trustRelation
    - expiresAt
    - ackDeadlineAt
    - version
    - realtimeDispatchedAt
    - presentedAt
    - pushQueuedAt
    - sentUnconfirmedAt
    - cancelledAt
    - cancellationEventId
    - cancellationEventType
    - cancellationActorId
    - cancellationOccurredAt
    - cancellationRealtimeDispatchedAt
    - cancellationPushRequired
    - cancellationExternalInteractionId
    - cancellationPushSubmittedAt
    - ackRaceCount
    - lastAckRaceAt
    - createdAt
    - updatedAt
    - notificationId
    - externalInteractionId
    owned_value: []
    projection: []
    reference:
    - notificationId
    - externalInteractionId
    - callId
    - targetPersonaId
    - cancellationActorId
    - cancellationExternalInteractionId
    transport_only: []
  identity:
    fields:
    - id
    version_source: store_commit
  invariant_refs:
  - notification/notification_delivery_job/entity.yaml#business_rules
  lifecycle_refs:
  - notification/notification_delivery_job/entity.yaml#lifecycle
