  - access: named_reader
    cardinality: N:1
    consistency: eventual
    kind: reference
    name: notification
    on_delete: retain
    reference_fields:
    - notificationId
    target_object: notification.Notification
  - access: command_facade
    cardinality: N:1
    consistency: eventual
    kind: reference
    name: externalDelivery
    on_delete: retain
    reference_fields:
    - externalInteractionId
    target_object: integration.ExternalInteraction
  - access: named_reader
    cardinality: N:1
    consistency: eventual
    kind: reference
    name: callSession
    on_delete: retain
    reference_fields:
    - callId
    target_object: rtc.CallSession
  - access: named_reader
    cardinality: N:1
    consistency: eventual
    kind: reference
    name: targetPersona
    on_delete: retain
    reference_fields:
    - targetPersonaId
    target_object: user.Persona
  - access: named_reader
    cardinality: N:1
    consistency: eventual
    kind: reference
    name: cancellationActor
    on_delete: retain
    reference_fields:
    - cancellationActorId
    target_object: user.Persona
  - access: command_facade
    cardinality: N:1
    consistency: eventual
    kind: reference
    name: cancellationExternalDelivery
    on_delete: retain
    reference_fields:
    - cancellationExternalInteractionId
    target_object: integration.ExternalInteraction
  source_document: notification/notification_delivery_job/fields.yaml
  source_entity: NotificationDeliveryJob
  storage_backend: mongodb
  storage_role: authoritative
  local_identity_reasons:
    cancellationEventId: immutable RTC terminal-event correlation key, not a standalone aggregate identity
    deviceId: delivery routing key scoped to one NotificationDeliveryJob; authoritative device lifecycle remains in user.DeviceRegistration
    eventId: immutable source-event correlation key, not a standalone aggregate identity
