domain: notification
entity: NotificationDeliveryJob
object_kind: aggregate_root
description: 具有独立租约、重试预算、频控与 DLQ 生命周期的通知投递作业。
storage_backend: mongodb
capabilities: [commandable, queryable, leased, attempt_budgeted]
business_rules:
  - notificationId、channel 与 destinationRef 创建后不可变
  - 同一 delivery identity 只存在一个活动 Job
  - lease 只能由一个 worker 持有且必须在 expiresAt 前提交结果
  - provider 发送只创建 Integration ExternalInteraction，不重复维护 provider ledger
  - 超过 attempt budget 或 recovery.action 非 retry 的错误进入 dead_letter，恢复创建新 attempt epoch
lifecycle:
  states: [pending, leased, dispatched, delivered, retry_wait, dead_letter, cancelled]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/notification/notification_delivery_job/model
  ports: internal/domain/notification/notification_delivery_job/ports
  application: internal/application/notification/notification_delivery_job
  persistence: internal/infrastructure/notification/notification_delivery_job/persistence
