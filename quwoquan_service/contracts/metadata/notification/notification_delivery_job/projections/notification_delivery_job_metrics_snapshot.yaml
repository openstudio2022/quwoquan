read_model: NotificationDeliveryJobMetricsSnapshot

description: NotificationDeliveryJob 的 operator-only 权威指标快照。

storage_backend: mongodb
projection_mode: authoritative_query
source_entities: [NotificationDeliveryJob]
consumers: [notification-service, platform-ops]

fields:
  - { name: jobsByStatus, type: "map<string,int64>" }
  - { name: deadJobs, type: int64 }
  - { name: updatedAt, type: timestamp }
