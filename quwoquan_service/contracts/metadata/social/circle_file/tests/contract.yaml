aggregate: CircleFile

scenarios:
  - name: file_transaction_replay_reader_bola_stream
    operation: CreateCircleFile
    go_func: TestCircleFileRealMongoTransactionReplayReaderBOLAAndStream
    evidence: api_integration
    assertions:
      - file、receipt、outbox 同一 Mongo transaction 提交
      - If-Match 更新为第三类快照覆盖；删除为命名迁移由服务端 CAS 重放
      - 非成员读写 fail closed（BOLA）

  - name: file_quota_authoritative_media_size
    operation: CreateCircleFile
    go_func: TestCircleFileQuotaUsesAuthoritativeMediaAssetSize
    evidence: api_integration
    assertions:
      - 配额以权威 MediaAsset 尺寸计并在事务内串行化校验
