aggregate: CirclePostPlacement
layer: app_side

description: |
  端侧独立测试场景。执行：flutter test test/local_contract/cloud/circle/

scenarios:
  - name: placement_typed_writer_abi
    description: place/remove/pin/feature typed ABI 与 alpha writer 同型
    assertions:
      - typed_command_rejects_blank_ids
      - decoder_rejects_unknown_keys
      - alpha_writer_matches_remote_shape

  - name: error_code_mapping
    cases:
      - http_status: 409
        code: CIRCLE.USER.placement_already_exists
        expected_dart_const: placementAlreadyExists
      - http_status: 404
        code: CIRCLE.USER.placement_not_found
        expected_dart_const: placementNotFound
