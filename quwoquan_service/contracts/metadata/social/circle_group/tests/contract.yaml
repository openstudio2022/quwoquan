aggregate: CircleGroup

scenarios:
  - name: group_transaction_replay_reader_bola_stream
    operation: CreateCircleGroup
    go_func: TestCircleGroupRealMongoTransactionReplayReaderBOLAAndStream
    evidence: api_integration
    assertions:
      - group、receipt、outbox 同一 Mongo transaction 提交
      - If-Match 更新为第三类快照覆盖；stale 版本返回 group_version_conflict
      - 非成员读写 fail closed（BOLA）
      - outbox relay 推进 Redis stream

  - name: group_chat_binding_durable_replay
    operation: CreateCircleGroup / ArchiveCircleGroup
    go_func: TestCircleGroupChatBindingDurableReplay
    evidence: api_integration
    assertions:
      - CircleGroupCreated 自包含 groupId/circleId/name/creator，chat consumer 只在 Conversation、owner 成员和用户态同事务成功后 ACK
      - Chat 成功后的 CircleGroupConversationProvisioned durable event 幂等回写唯一 CircleGroup.conversationId
      - CircleGroupArchived 终止绑定 Conversation、清理所有 ConversationUserState/ChatInbox，并投递终态 realtime 事件
      - 重复和乱序 stream 投递不产生第二 Conversation 或错误绑定
