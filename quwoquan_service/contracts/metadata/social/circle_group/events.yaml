version: 1
aggregate: CircleGroup
events:
  - name: CircleGroupCreated
    producer: circle-service
    consumers: [circle-group-membership-projector, circle-group-stream]
    channel: event_store
    payload_entity: CircleGroup
    payload_fields: [_id, version, circleId, groupType, createdByPersonaId, status]
  - name: CircleGroupUpdated
    producer: circle-service
    consumers: [circle-group-stream]
    channel: event_store
    payload_entity: CircleGroup
    payload_fields: [_id, version, circleId, status]
  - name: CircleGroupArchived
    producer: circle-service
    consumers: [circle-group-membership-projector, circle-group-stream]
    channel: event_store
    payload_entity: CircleGroup
    payload_fields: [_id, version, circleId, status]
