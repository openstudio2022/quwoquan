aggregate: CircleGroupMembership

entities:
  CircleGroupMembership:
    description: 单一 Persona 在 CircleGroup 中的权威申请、审批、角色与退出生命周期。
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL] }
      - { name: version, type: int64, constraints: [NOT_NULL] }
      - { name: groupId, type: ObjectId, constraints: [NOT_NULL] }
      - { name: circleId, type: ObjectId, constraints: [NOT_NULL] }
      - { name: personaId, type: string, constraints: [NOT_NULL] }
      - { name: role, type: enum, enum_ref: CircleGroupMembershipRole, constraints: [NOT_NULL] }
      - { name: state, type: enum, enum_ref: CircleGroupMembershipState, constraints: [NOT_NULL] }
      - { name: joinedAt, type: timestamp, constraints: [NULLABLE] }
      - { name: leftAt, type: timestamp, constraints: [NULLABLE] }
      - { name: decidedAt, type: timestamp, constraints: [NULLABLE] }
      - { name: decidedByPersonaId, type: string, constraints: [NULLABLE] }
      - { name: createdAt, type: timestamp, constraints: [NOT_NULL] }
      - { name: updatedAt, type: timestamp, constraints: [NOT_NULL] }
    unique_constraints:
      - columns: [groupId, personaId]
        description: 同一 Persona 在同一 CircleGroup 只有一个 membership 生命周期。

  CircleGroupMembershipSlice:
    description: CircleGroupMembershipReader 返回的强类型只读切片，不暴露 Mongo _id。
    fields:
      - { name: membershipId, type: string, constraints: [NOT_NULL] }
      - { name: version, type: int64, constraints: [NOT_NULL] }
      - { name: groupId, type: ObjectId, constraints: [NOT_NULL] }
      - { name: circleId, type: ObjectId, constraints: [NOT_NULL] }
      - { name: personaId, type: string, constraints: [NOT_NULL] }
      - { name: role, type: enum, enum_ref: CircleGroupMembershipRole, constraints: [NOT_NULL] }
      - { name: state, type: enum, enum_ref: CircleGroupMembershipState, constraints: [NOT_NULL] }
      - { name: joinedAt, type: timestamp, constraints: [NULLABLE] }
      - { name: leftAt, type: timestamp, constraints: [NULLABLE] }
      - { name: decidedAt, type: timestamp, constraints: [NULLABLE] }
      - { name: createdAt, type: timestamp, constraints: [NOT_NULL] }
      - { name: updatedAt, type: timestamp, constraints: [NOT_NULL] }

  CircleGroupMembershipCommandResult:
    description: CircleGroupMembership 命令的稳定提交回执。
    fields:
      - { name: membershipId, type: string, constraints: [NOT_NULL] }
      - { name: version, type: int64, constraints: [NOT_NULL] }
      - { name: role, type: enum, enum_ref: CircleGroupMembershipRole, constraints: [NOT_NULL] }
      - { name: state, type: enum, enum_ref: CircleGroupMembershipState, constraints: [NOT_NULL] }
      - { name: idempotentReplay, type: bool, constraints: [NOT_NULL] }

  UpdateCircleGroupMembershipRoleRequest:
    fields:
      - { name: role, type: enum, enum_ref: CircleGroupMembershipRole, constraints: [NOT_NULL] }

  CircleGroupMembershipCommandReceipt:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL] }
      - { name: commandDigest, type: string, constraints: [NOT_NULL] }
      - { name: membershipId, type: string, constraints: [NOT_NULL] }
      - { name: version, type: int64, constraints: [NOT_NULL] }
      - { name: role, type: enum, enum_ref: CircleGroupMembershipRole, constraints: [NOT_NULL] }
      - { name: state, type: enum, enum_ref: CircleGroupMembershipState, constraints: [NOT_NULL] }
      - { name: expiresAt, type: timestamp, constraints: [NOT_NULL] }

  CircleGroupMembershipOutbox:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL] }
      - { name: outboxSequence, type: int64, constraints: [NOT_NULL] }
      - { name: eventType, type: string, constraints: [NOT_NULL] }
      - { name: aggregateId, type: string, constraints: [NOT_NULL] }
      - { name: aggregateVersion, type: int64, constraints: [NOT_NULL] }
      - { name: payloadJson, type: string, constraints: [NOT_NULL] }
      - { name: occurredAt, type: timestamp, constraints: [NOT_NULL] }

  CircleGroupMembershipOutboxSequence:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL] }
      - { name: sequence, type: int64, constraints: [NOT_NULL] }

  CircleGroupMembershipProjectionCheckpoint:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL] }
      - { name: sequence, type: int64, constraints: [NOT_NULL] }
      - { name: updatedAt, type: timestamp, constraints: [NOT_NULL] }
