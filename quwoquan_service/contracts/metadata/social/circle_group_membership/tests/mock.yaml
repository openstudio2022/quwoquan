aggregate: CircleGroupMembership
layer: app_side

description: |
  端侧独立测试场景。执行：flutter test test/local_contract/cloud/circle/

scenarios:
  - name: group_membership_typed_facet_abi
    description: apply/approve/reject/remove/leave/role typed ABI 与 alpha mock 同型
    assertions:
      - typed_command_rejects_blank_ids
      - decoder_rejects_unknown_keys
      - alpha_facet_matches_remote_shape

  - name: error_code_mapping
    cases:
      - http_status: 409
        code: CIRCLE.USER.group_membership_state_conflict
        expected_dart_const: groupMembershipStateConflict
      - http_status: 403
        code: CIRCLE.USER.group_membership_owner_cannot_remove
        expected_dart_const: groupMembershipOwnerCannotRemove
