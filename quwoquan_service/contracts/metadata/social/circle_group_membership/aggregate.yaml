domain: circle
aggregate_root: CircleGroupMembership
object_kind: aggregate_root
description: 单一 Persona 在 CircleGroup 中的申请、审批、角色和退出状态聚合。
storage_backend: mongodb
capabilities: [commandable, queryable, idempotent_commands, event_consumer]
members: []
business_rules:
  - identity 固定为 groupId + personaId，同一身份只有一个可重入生命周期
  - persona 必须先具有同一 Circle 的 active membership
  - pending 申请只能被目标群 owner 或 manager 且非申请人审批一次
  - open joinPolicy 申请直接 active，apply_only 必须 pending 后审批
  - owner 不得自行 leave 或被 remove，manager 不得授予 owner
  - CircleGroupCreated 只为 createdByPersonaId 幂等建立 owner active membership
  - active 后才通过 outbox 同步 Chat ConversationMembership，聚合不直写 Chat
lifecycle:
  states: [pending, active, rejected, left, removed]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/circle/circle_group_membership/model
  ports: internal/domain/circle/circle_group_membership/ports
  application: internal/application/circle/circle_group_membership
  persistence: internal/infrastructure/circle/circle_group_membership/persistence
