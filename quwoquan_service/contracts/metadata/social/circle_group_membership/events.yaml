version: 1
aggregate: CircleGroupMembership
events:
  - name: CircleGroupMembershipRequested
    producer: circle-service
    consumers: [circle-group-membership-stream]
    channel: transactional_outbox
    payload_entity: CircleGroupMembership
    payload_fields: [_id, version, groupId, circleId, personaId, role, state, createdAt]
  - name: CircleGroupMembershipActivated
    producer: circle-service
    consumers: [chat-conversation-membership-projector, circle-group-membership-stream]
    channel: transactional_outbox
    payload_entity: CircleGroupMembership
    payload_fields: [_id, version, groupId, circleId, personaId, role, state, joinedAt]
  - name: CircleGroupMembershipRejected
    producer: circle-service
    consumers: [circle-group-membership-stream]
    channel: transactional_outbox
    payload_entity: CircleGroupMembership
    payload_fields: [_id, version, groupId, circleId, personaId, role, state, decidedAt]
  - name: CircleGroupMembershipLeft
    producer: circle-service
    consumers: [chat-conversation-membership-projector, circle-group-membership-stream]
    channel: transactional_outbox
    payload_entity: CircleGroupMembership
    payload_fields: [_id, version, groupId, circleId, personaId, role, state, leftAt]
  - name: CircleGroupMembershipRemoved
    producer: circle-service
    consumers: [chat-conversation-membership-projector, circle-group-membership-stream]
    channel: transactional_outbox
    payload_entity: CircleGroupMembership
    payload_fields: [_id, version, groupId, circleId, personaId, role, state, leftAt]
  - name: CircleGroupMembershipRoleChanged
    producer: circle-service
    consumers: [chat-conversation-membership-projector, circle-group-membership-stream]
    channel: transactional_outbox
    payload_entity: CircleGroupMembership
    payload_fields: [_id, version, groupId, circleId, personaId, role, state]
