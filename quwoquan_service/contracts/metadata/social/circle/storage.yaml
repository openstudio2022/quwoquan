aggregate: Circle
backend: mongodb

collections:
  circles:
    entity: Circle
    indexes:
      - { name: idx_circles_owner, keys: { ownerId: 1 } }
      - { name: idx_circles_category, keys: { category: 1, memberCount: -1 } }
      - { name: idx_circles_tags, keys: { tags: 1 } }
      - { name: idx_circles_status, keys: { status: 1, createdAt: -1 } }
      - { name: idx_circles_weekly_active, keys: { weeklyActiveCount: -1 } }
    search_indexes:
      - name: search_circles_text
        source: search_circles_text
        type: text
        fields: [name, description, tags]
        weights: { name: 10, tags: 5, description: 1 }

redis_cache:
  - key: "cache:circle:{circleId}"
    ttl_seconds: 600
    entity: Circle
    invalidate_on: [CircleUpdated, CircleMembershipJoined, CircleMembershipLeft, CirclePostPlaced, CirclePostPlacementRemoved, CircleSectionsUpdated]

  - key: "cache:circle-group:{groupId}"
    ttl_seconds: 600
    entity: CircleGroup
    invalidate_on: [CircleGroupUpdated, CircleGroupMemberJoined, CircleGroupMemberLeft]

object_storage:
  bucket_prefix: "circle-files"
  key_pattern: "{circleId}/{fileId}/{filename}"
  max_file_size_bytes: 52428800
  allowed_mime_types:
    - "image/*"
    - "video/*"
    - "audio/*"
    - "application/pdf"
    - "application/zip"
    - "application/x-rar-compressed"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.*"
    - "text/plain"
    - "text/markdown"
