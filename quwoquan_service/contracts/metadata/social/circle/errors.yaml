domain: CIRCLE
aggregate: Circle

description: |
  circle 域结构化错误码声明。格式：MODULE.KIND.REASON。

errors:
  - code: CIRCLE.USER.invalid_argument
    kind: USER
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: invalidArgument
    go_const: ErrInvalidArgument
    user_message: { zh: "请求参数无效", en: "Invalid request" }

  - code: CIRCLE.USER.group_not_found
    kind: USER
    reason: group_not_found
    http_status: 404
    recovery_action: refresh
    dart_const: groupNotFound
    go_const: ErrGroupNotFound
    user_message: { zh: "群组不存在", en: "Circle group not found" }

  - code: CIRCLE.USER.group_archived
    kind: USER
    reason: group_archived
    http_status: 409
    recovery_action: refresh
    dart_const: groupArchived
    go_const: ErrGroupArchived
    user_message: { zh: "群组已归档", en: "Circle group is archived" }

  - code: CIRCLE.USER.group_parent_invalid
    kind: USER
    reason: group_parent_invalid
    http_status: 409
    recovery_action: refresh
    dart_const: groupParentInvalid
    go_const: ErrGroupParentInvalid
    user_message: { zh: "上级群组无效或形成循环", en: "Invalid or cyclic parent group" }

  - code: CIRCLE.USER.group_default_conflict
    kind: USER
    reason: group_default_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: groupDefaultConflict
    go_const: ErrGroupDefaultConflict
    user_message: { zh: "该圈子已存在默认公共群", en: "The circle already has a default public group" }

  - code: CIRCLE.USER.group_default_cannot_archive
    kind: USER
    reason: group_default_cannot_archive
    http_status: 409
    recovery_action: surface
    dart_const: groupDefaultCannotArchive
    go_const: ErrGroupDefaultCannotArchive
    user_message: { zh: "默认公共群不能归档", en: "The default public group cannot be archived" }

  - code: CIRCLE.USER.group_version_conflict
    kind: USER
    reason: group_version_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: groupVersionConflict
    go_const: ErrGroupVersionConflict
    user_message: { zh: "群组已更新，请刷新后重试", en: "Circle group changed, refresh and retry" }

  - code: CIRCLE.USER.group_idempotency_conflict
    kind: USER
    reason: group_idempotency_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: groupIdempotencyConflict
    go_const: ErrGroupIdempotencyConflict
    user_message: { zh: "重复请求与原群组命令不一致", en: "Idempotency key was reused for another group command" }

  - code: CIRCLE.SYSTEM.group_storage_write_failed
    kind: SYSTEM
    reason: group_storage_write_failed
    http_status: 500
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: groupStorageWriteFailed
    go_const: ErrGroupStorageWriteFailed
    user_message: { zh: "群组操作失败，请稍后重试", en: "Circle group operation failed, retry later" }

  - code: CIRCLE.USER.group_membership_not_found
    kind: USER
    reason: group_membership_not_found
    http_status: 404
    recovery_action: refresh
    dart_const: groupMembershipNotFound
    go_const: ErrGroupMembershipNotFound
    user_message: { zh: "群组成员关系不存在", en: "Circle group membership not found" }

  - code: CIRCLE.USER.group_membership_already_active
    kind: USER
    reason: group_membership_already_active
    http_status: 409
    recovery_action: refresh
    dart_const: groupMembershipAlreadyActive
    go_const: ErrGroupMembershipAlreadyActive
    user_message: { zh: "已经加入该群组", en: "Already joined this circle group" }

  - code: CIRCLE.USER.group_membership_full
    kind: USER
    reason: group_membership_full
    http_status: 409
    recovery_action: surface
    dart_const: groupMembershipFull
    go_const: ErrGroupMembershipFull
    user_message: { zh: "群组成员已达上限", en: "The circle group has reached its member limit" }

  - code: CIRCLE.USER.group_membership_state_conflict
    kind: USER
    reason: group_membership_state_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: groupMembershipStateConflict
    go_const: ErrGroupMembershipStateConflict
    user_message: { zh: "群组成员状态已变化，请刷新后重试", en: "Circle group membership state changed" }

  - code: CIRCLE.USER.group_membership_owner_cannot_leave
    kind: USER
    reason: group_membership_owner_cannot_leave
    http_status: 409
    recovery_action: surface
    dart_const: groupMembershipOwnerCannotLeave
    go_const: ErrGroupMembershipOwnerCannotLeave
    user_message: { zh: "群主不能直接退出群组", en: "Circle group owner cannot leave directly" }

  - code: CIRCLE.USER.group_membership_owner_cannot_remove
    kind: USER
    reason: group_membership_owner_cannot_remove
    http_status: 409
    recovery_action: surface
    dart_const: groupMembershipOwnerCannotRemove
    go_const: ErrGroupMembershipOwnerCannotRemove
    user_message: { zh: "群主不能被移除", en: "Circle group owner cannot be removed" }

  - code: CIRCLE.USER.group_membership_role_invalid
    kind: USER
    reason: group_membership_role_invalid
    http_status: 400
    recovery_action: surface
    dart_const: groupMembershipRoleInvalid
    go_const: ErrGroupMembershipRoleInvalid
    user_message: { zh: "群组成员角色无效", en: "Invalid circle group membership role" }

  - code: CIRCLE.USER.group_membership_version_conflict
    kind: USER
    reason: group_membership_version_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: groupMembershipVersionConflict
    go_const: ErrGroupMembershipVersionConflict
    user_message: { zh: "群组成员状态已更新，请刷新后重试", en: "Circle group membership changed" }

  - code: CIRCLE.USER.group_membership_idempotency_conflict
    kind: USER
    reason: group_membership_idempotency_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: groupMembershipIdempotencyConflict
    go_const: ErrGroupMembershipIdempotencyConflict
    user_message: { zh: "重复请求与原群组成员命令不一致", en: "Idempotency key was reused for another group membership command" }

  - code: CIRCLE.SYSTEM.group_membership_storage_write_failed
    kind: SYSTEM
    reason: group_membership_storage_write_failed
    http_status: 500
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: groupMembershipStorageWriteFailed
    go_const: ErrGroupMembershipStorageWriteFailed
    user_message: { zh: "群组成员操作失败，请稍后重试", en: "Circle group membership operation failed" }

  - code: CIRCLE.USER.placement_not_found
    kind: USER
    reason: placement_not_found
    http_status: 404
    recovery_action: refresh
    dart_const: placementNotFound
    go_const: ErrPlacementNotFound
    user_message: { zh: "圈内内容放置不存在", en: "Circle post placement not found" }

  - code: CIRCLE.USER.placement_already_exists
    kind: USER
    reason: placement_already_exists
    http_status: 409
    recovery_action: refresh
    dart_const: placementAlreadyExists
    go_const: ErrPlacementAlreadyExists
    user_message: { zh: "该内容已放置到目标圈子位置", en: "The post is already placed at this circle location" }

  - code: CIRCLE.USER.placement_version_conflict
    kind: USER
    reason: placement_version_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: placementVersionConflict
    go_const: ErrPlacementVersionConflict
    user_message: { zh: "放置状态已更新，请刷新后重试", en: "Placement changed, refresh and retry" }

  - code: CIRCLE.USER.placement_idempotency_conflict
    kind: USER
    reason: placement_idempotency_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: placementIdempotencyConflict
    go_const: ErrPlacementIdempotencyConflict
    user_message: { zh: "重复请求与原操作不一致，请刷新后重试", en: "Repeated request differs from the original operation" }

  - code: CIRCLE.SYSTEM.placement_storage_write_failed
    kind: SYSTEM
    reason: placement_storage_write_failed
    http_status: 500
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: placementStorageWriteFailed
    go_const: ErrPlacementStorageWriteFailed
    user_message: { zh: "操作失败，请稍后重试", en: "Operation failed, please retry" }

  - code: CIRCLE.USER.not_found
    kind: USER
    reason: not_found
    http_status: 404
    recovery_action: surface
    dart_const: circleNotFound
    go_const: ErrCircleNotFound
    user_message:
      zh: "圈子不存在"
      en: "Circle not found"

  - code: CIRCLE.USER.circle_archived
    kind: USER
    reason: circle_archived
    http_status: 409
    recovery_action: refresh
    dart_const: circleArchived
    go_const: ErrCircleArchived
    user_message:
      zh: "圈子已归档，无法修改"
      en: "Circle is archived and cannot be modified"

  - code: CIRCLE.USER.circle_version_conflict
    kind: USER
    reason: circle_version_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: circleVersionConflict
    go_const: ErrCircleVersionConflict
    user_message:
      zh: "圈子信息已被更新，请刷新后重试"
      en: "Circle was updated concurrently, refresh and retry"

  - code: CIRCLE.USER.circle_idempotency_conflict
    kind: USER
    reason: circle_idempotency_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: circleIdempotencyConflict
    go_const: ErrCircleIdempotencyConflict
    user_message:
      zh: "重复请求与原命令不一致"
      en: "Idempotency key was reused for another circle command"

  - code: CIRCLE.SYSTEM.circle_storage_write_failed
    kind: SYSTEM
    reason: circle_storage_write_failed
    http_status: 500
    recovery_action: retry
    dart_const: circleStorageWriteFailed
    go_const: ErrCircleStorageWriteFailed
    user_message:
      zh: "圈子操作失败，请稍后重试"
      en: "Circle operation failed, retry later"

  - code: CIRCLE.USER.join_approval_required
    kind: USER
    reason: forbidden
    http_status: 403
    recovery_action: surface
    dart_const: joinApprovalRequired
    go_const: ErrJoinApprovalRequired
    user_message:
      zh: "该圈子需要审批才能加入"
      en: "This circle requires approval to join"

  - code: CIRCLE.USER.already_member
    kind: USER
    reason: conflict
    http_status: 409
    recovery_action: surface
    dart_const: alreadyMember
    go_const: ErrAlreadyMember
    user_message:
      zh: "您已经是该圈子成员"
      en: "You are already a member of this circle"

  - code: CIRCLE.USER.membership_already_active
    kind: USER
    reason: membership_already_active
    http_status: 409
    recovery_action: refresh
    dart_const: membershipAlreadyActive
    go_const: ErrMembershipAlreadyActive
    user_message: { zh: "已经加入该圈子", en: "Already joined this circle" }

  - code: CIRCLE.USER.membership_not_found
    kind: USER
    reason: membership_not_found
    http_status: 404
    recovery_action: refresh
    dart_const: membershipNotFound
    go_const: ErrMembershipNotFound
    user_message: { zh: "成员关系不存在", en: "Circle membership not found" }

  - code: CIRCLE.USER.membership_owner_cannot_leave
    kind: USER
    reason: membership_owner_cannot_leave
    http_status: 409
    recovery_action: surface
    dart_const: membershipOwnerCannotLeave
    go_const: ErrMembershipOwnerCannotLeave
    user_message: { zh: "圈主不能直接退出圈子", en: "Circle owner cannot leave directly" }

  - code: CIRCLE.USER.membership_role_invalid
    kind: USER
    reason: membership_role_invalid
    http_status: 400
    recovery_action: surface
    dart_const: membershipRoleInvalid
    go_const: ErrMembershipRoleInvalid
    user_message: { zh: "成员角色无效", en: "Invalid circle membership role" }

  - code: CIRCLE.USER.membership_state_conflict
    kind: USER
    reason: membership_state_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: membershipStateConflict
    go_const: ErrMembershipStateConflict
    user_message: { zh: "成员申请状态已变化，请刷新后重试", en: "Circle membership state changed, refresh and retry" }

  - code: CIRCLE.USER.membership_version_conflict
    kind: USER
    reason: membership_version_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: membershipVersionConflict
    go_const: ErrMembershipVersionConflict
    user_message: { zh: "成员状态已更新，请刷新后重试", en: "Membership changed, refresh and retry" }

  - code: CIRCLE.USER.membership_idempotency_conflict
    kind: USER
    reason: membership_idempotency_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: membershipIdempotencyConflict
    go_const: ErrMembershipIdempotencyConflict
    user_message: { zh: "重复请求与原命令不一致", en: "Idempotency key was reused for another membership command" }

  - code: CIRCLE.SYSTEM.membership_storage_write_failed
    kind: SYSTEM
    reason: membership_storage_write_failed
    http_status: 500
    recovery_action: retry
    dart_const: membershipStorageWriteFailed
    go_const: ErrMembershipStorageWriteFailed
    user_message: { zh: "成员操作失败，请稍后重试", en: "Membership operation failed, retry later" }

  - code: CIRCLE.SYSTEM.behavior_fact_write_failed
    kind: SYSTEM
    reason: behavior_fact_write_failed
    http_status: 500
    recovery_action: retry
    dart_const: behaviorFactWriteFailed
    go_const: ErrBehaviorFactWriteFailed
    user_message: { zh: "行为记录失败，请稍后重试", en: "Failed to record circle behavior, retry later" }

  - code: CIRCLE.USER.behavior_fact_idempotency_conflict
    kind: USER
    reason: behavior_fact_idempotency_conflict
    http_status: 409
    recovery_action: refresh
    dart_const: behaviorFactIdempotencyConflict
    go_const: ErrBehaviorFactIdempotencyConflict
    user_message: { zh: "重复行为请求与原请求不一致", en: "Idempotency key was reused for another circle behavior" }

  - code: CIRCLE.USER.rate_limited
    kind: USER
    reason: rate_limited
    http_status: 429
    recovery_action: retry
    recovery_after_seconds: 60
    dart_const: rateLimited
    go_const: ErrRateLimited
    user_message:
      zh: "操作太频繁，请稍后重试"
      en: "Too many requests, please retry later"

  - code: CIRCLE.USER.not_member
    kind: USER
    reason: forbidden
    http_status: 403
    recovery_action: surface
    dart_const: notMember
    go_const: ErrNotMember
    user_message:
      zh: "您不是该圈子成员"
      en: "You are not a member of this circle"

  - code: CIRCLE.USER.permission_denied
    kind: USER
    reason: forbidden
    http_status: 403
    recovery_action: surface
    dart_const: permissionDenied
    go_const: ErrPermissionDenied
    user_message:
      zh: "权限不足"
      en: "Permission denied"

  - code: CIRCLE.USER.storage_quota_exceeded
    kind: USER
    reason: quota_exceeded
    http_status: 413
    recovery_action: surface
    dart_const: storageQuotaExceeded
    go_const: ErrStorageQuotaExceeded
    user_message:
      zh: "存储空间已满，无法上传"
      en: "Storage quota exceeded"

  - code: CIRCLE.USER.file_not_found
    kind: USER
    reason: not_found
    http_status: 404
    recovery_action: surface
    dart_const: fileNotFound
    go_const: ErrFileNotFound
    user_message:
      zh: "文件不存在"
      en: "File not found"

  - code: CIRCLE.USER.file_parent_invalid
    kind: USER
    reason: validation_failed
    http_status: 422
    recovery_action: surface
    dart_const: fileParentInvalid
    go_const: ErrFileParentInvalid
    user_message:
      zh: "目标文件夹无效"
      en: "Target folder is invalid"

  - code: CIRCLE.USER.file_asset_invalid
    kind: USER
    reason: validation_failed
    http_status: 422
    recovery_action: resubmit
    dart_const: fileAssetInvalid
    go_const: ErrFileAssetInvalid
    user_message:
      zh: "媒体文件尚未就绪或不属于当前身份"
      en: "Media asset is not ready or not owned by the active persona"

  - code: CIRCLE.USER.file_version_conflict
    kind: USER
    reason: conflict
    http_status: 409
    recovery_action: reload
    dart_const: fileVersionConflict
    go_const: ErrFileVersionConflict
    user_message:
      zh: "文件已被更新，请刷新后重试"
      en: "File changed, reload and retry"

  - code: CIRCLE.USER.file_idempotency_conflict
    kind: USER
    reason: conflict
    http_status: 409
    recovery_action: resubmit
    dart_const: fileIdempotencyConflict
    go_const: ErrFileIdempotencyConflict
    user_message:
      zh: "重复请求内容不一致"
      en: "Idempotency key was reused with a different command"

  - code: CIRCLE.SYSTEM.file_storage_write_failed
    kind: SYSTEM
    reason: storage_write_failed
    http_status: 503
    recovery_action: retry
    dart_const: fileStorageWriteFailed
    go_const: ErrFileStorageWriteFailed
    user_message:
      zh: "文件服务暂不可用，请稍后重试"
      en: "File service is temporarily unavailable"

  - code: CIRCLE.SYSTEM.internal_error
    kind: SYSTEM
    reason: internal_error
    http_status: 500
    recovery_action: surface
    dart_const: internalError
    go_const: ErrInternalError
    user_message:
      zh: "服务异常，请稍后重试"
      en: "Service error, please try again"
