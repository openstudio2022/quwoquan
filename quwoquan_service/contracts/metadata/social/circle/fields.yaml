aggregate: Circle

entities:
  Circle:
    description: 圈子（聚合根）
    fields:
      - name: _id
        source: _id
        type: ObjectId
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: name
        source: name
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        search_field: true

      - name: description
        source: description
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        search_field: true

      - name: coverUrl
        source: coverUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: iconUrl
        source: iconUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 圈子独立头像（主页头部头像簇主体），缺省时端侧回退 coverUrl

      - name: ownerId
        source: ownerId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: ownerDisplayNameSnapshot
        source: ownerDisplayNameSnapshot
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 圈主显示名证据快照；仅由用户资料投影或环境契约种子写入，影响力读路径不得按 ownerId 或默认文案补造

      - name: category
        source: category
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true

      - name: subCategory
        source: subCategory
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        description: 二级分类 / 组织细分标签

      - name: tags
        source: tags
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        tag_ref: true
        description: 路径制 tagRef 列表；唯一真相源为数据工程 control_plane/governance/taxonomy

      - name: memberCount
        source: memberCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 圈子成员数；圈子页统计前台展示为「成员」

      - name: postCount
        source: postCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: weeklyActiveCount
        source: weeklyActiveCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 周活跃成员数（超前）

      - name: status
        source: status
        type: enum
        enum_ref: CircleStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write

      - name: visibility
        source: visibility
        type: enum
        enum_ref: CircleVisibility
        constraints: [NOT_NULL, DEFAULT_PUBLIC]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 超前

      - name: joinPolicy
        source: joinPolicy
        type: enum
        enum_ref: CircleJoinPolicy
        constraints: [NOT_NULL, DEFAULT_OPEN]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 超前

      - name: kind
        source: kind
        type: enum
        enum_ref: CircleKind
        constraints: [NOT_NULL, DEFAULT_INTEREST]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 关系主页类型（兴趣型 / 组织型）

      - name: displaySubjectType
        source: displaySubjectType
        type: enum
        enum_ref: CircleDisplaySubjectType
        constraints: [NOT_NULL, DEFAULT_CIRCLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 前台详情模板命名（圈子 / 学校主页 / 公司主页等）

      - name: followEnabled
        source: followEnabled
        type: boolean
        constraints: [NOT_NULL, DEFAULT_TRUE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 是否允许通过主页沉淀成员关系

      - name: defaultPublicGroupId
        source: defaultPublicGroupId
        type: ObjectId
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 默认公共群 / 组织默认交流节点

      - name: conversationId
        source: conversationId
        type: ObjectId
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 待删除旧字段；商用入口必须通过 defaultPublicGroupId -> CircleGroup.conversationId 承接聊天，前台不得消费

      - name: autoSyncChat
        source: autoSyncChat
        type: boolean
        constraints: [NOT_NULL, DEFAULT_TRUE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 是否自动同步成员到群聊

      - name: sectionConfig
        source: sectionConfig
        type: "[]CircleSectionConfig"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 圈子主页板块配置（顺序+可见性）

      - name: storageUsedBytes
        source: storageUsedBytes
        type: int64
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 存储空间已用字节数

      - name: storageQuotaBytes
        source: storageQuotaBytes
        type: int64
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 存储空间配额上限（字节）

      - name: domainId
        source: domainId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        description: 领域标签 ID（引用 domain_taxonomy.yaml）
        domain_taxonomy_ref: true

      - name: linkedHomepageId
        source: linkedHomepageId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 群组关联的共享主页 ID（只读摘要消费锚点）

      - name: linkedHomepageType
        source: linkedHomepageType
        type: enum
        enum_ref: HomepageType
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 关联共享主页的类型快照

      - name: linkedHomepageTitle
        source: linkedHomepageTitle
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 关联共享主页的标题快照

      - name: createdAt
        source: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: updatedAt
        source: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  CircleSectionConfig:
    description: 圈子主页板块配置项（嵌入文档，非独立集合）
    embedded: true
    fields:
      - name: sectionType
        source: sectionType
        type: enum
        enum_ref: CircleSectionType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 板块类型（works/chat/storage/interaction/custom）

      - name: visible
        source: visible
        type: boolean
        constraints: [NOT_NULL, DEFAULT_TRUE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: "order"
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: customTitle
        source: customTitle
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 自定义板块标题（覆盖默认）

  CircleSearchItemView:
    description: 群组搜索结果项视图，用于全局搜索结果分组
    fields:
      - name: circleId
        source: circleId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: name
        source: name
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: description
        source: description
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: coverUrl
        source: coverUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: categoryId
        source: categoryId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: subCategory
        source: subCategory
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: domainId
        source: domainId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: kind
        source: kind
        type: enum
        enum_ref: CircleKind
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: displaySubjectType
        source: displaySubjectType
        type: enum
        enum_ref: CircleDisplaySubjectType
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: memberCount
        source: memberCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: postCount
        source: postCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: highlightText
        source: highlightText
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: matchedField
        source: matchedField
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: linkedHomepageId
        source: linkedHomepageId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: linkedHomepageType
        source: linkedHomepageType
        type: enum
        enum_ref: HomepageType
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: linkedHomepageTitle
        source: linkedHomepageTitle
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  CircleFacetBucketView:
    description: 群组搜索 facet bucket，用于频道/分类投影视图
    fields:
      - name: facetKey
        source: facetKey
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: label
        source: label
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: categoryId
        source: categoryId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: subCategory
        source: subCategory
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: facetCount
        source: facetCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  CircleSearchResultView:
    description: 群组搜索结果视图，包含群组项与 facet buckets
    fields:
      - name: items
        source: items
        type: "[]CircleSearchItemView"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: facetBuckets
        source: facetBuckets
        type: "[]CircleFacetBucketView"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: cursor
        source: cursor
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
