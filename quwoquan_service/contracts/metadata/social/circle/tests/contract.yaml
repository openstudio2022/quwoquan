aggregate: Circle

scenarios:
  - name: circle_create_with_owner
    operation: CreateCircle
    go_func: TestCreateCircleWithOwner
    evidence: api_integration
    assertions:
      - circles、circle_command_receipts、circle_outbox 在同一 Mongo transaction 提交
      - 创建不产生隐藏跨聚合写（memberships 为 0，memberCount 由投影推进）
      - CircleCreated 经 outbox relay 投递

  - name: circle_update_owner_cas
    operation: UpdateCircle
    go_func: TestUpdateCircleSuccess
    evidence: api_integration
    assertions:
      - 仅圈主/管理员可更新；非管理成员 fail closed
      - request 不携带 Circle version；服务端内部 CAS 冲突重载聚合并重放意图
      - typed 请求体拒绝未知字段

  - name: circle_archive_named_transition
    operation: ArchiveCircle
    go_func: TestArchiveCircleSuccess
    evidence: api_integration
    assertions:
      - 仅圈主可归档；archived 为终态
      - 已归档时首个 Idempotency-Key 持久化 no-op receipt 且不递增版本
      - 相同 key 重放原始结果

  - name: circle_sections_update
    operation: UpdateCircleSections
    go_func: TestSectionConfigUpdate
    evidence: api_integration
    assertions:
      - sectionConfig 只经聚合根提交，最多 16 项且 sectionType 唯一
      - CircleSectionsUpdated 经 outbox 与状态同事务提交

  - name: circle_list_public_read
    operation: ListCircles
    go_func: TestListCirclesSuccess
    evidence: api_integration
    assertions:
      - 公共读不要求登录，分页 cursor 稳定

  - name: circle_discovery_feed_aggregate
    operation: ListCircleDiscoveryFeed
    go_func: TestListCircleDiscoveryFeed
    evidence: api_integration
    assertions:
      - 单次请求返回同范围圈子卡片与强类型已发布帖子投影
      - category/subCategory/scope 由服务端过滤，mine 仅返回当前 persona 的 active memberships
      - keyset 分页页间无重叠，草稿与归档圈子内容 fail closed

  - name: circle_detail_read
    operation: GetCircle
    go_func: TestGetCircleSuccess
    evidence: api_integration
    assertions:
      - 详情回读包含 version 与 sectionConfig
      - not_found 返回 CIRCLE.USER.not_found

  - name: circle_search_shape
    operation: SearchCircles
    go_func: TestSearchCirclesShape
    evidence: api_integration
    assertions:
      - 返回 CircleSearchItemView 形状与 facet buckets

  - name: circle_feed_pagination
    operation: GetCircleFeed
    go_func: TestGetCircleFeed_Pagination
    evidence: api_integration
    assertions:
      - keyset 分页页间无重叠，耗尽时 cursor 为空

  - name: circle_impact_owner_evidence
    operation: GetCircleImpact
    go_func: TestCircleImpactUsesPersistedOwnerEvidenceSnapshot
    evidence: api_integration
    assertions:
      - 影响事实只来自持久化 owner 证据快照，不按 ownerId 补造
