read_model: CircleStatsWire

description: |
  圈子统计接口返回体：当前为松散 JSON，键集合随版本演进。
  Flutter：`CircleStatsWireDto` 保留 raw Map（见 circle_stats_wire_dto.dart），展示层用 CircleStatsViewData.fromStatsWire 解析。

consumer: app

# 非穷尽列举，仅供契约文档与评审；客户端只认下列 canonical 键，禁止 alias 双读。
documented_keys_examples:
  - memberCount
  - postCount
  - discussionCount
  - weeklyActiveCount
  - likeCount
  - storageUsedBytes
  - storageQuotaBytes

payload_shape: opaque_object
