read_model: CircleDiscoveryFeed

description: |
  圈子频道聚合读切片。服务端在一次请求中完成分类、二级分类、成员范围和游标分页，
  返回圈子卡片与 CircleFeedItemView；App 禁止再执行 listCircles → 逐圈 getCircleFeed。

storage_backend: mongodb
collections:
  - circles
  - circle_memberships
  - posts
  - circle_post_placements

source_entities:
  - Circle
  - CircleMembership
  - Post
  - CirclePostPlacement

source_events:
  - CircleCreated
  - CircleUpdated
  - CircleArchived
  - CircleMembershipJoined
  - CircleMembershipLeft
  - PostPublished
  - PostDeleted
  - CirclePostPlaced
  - CirclePostPlacementPresentationChanged
  - CirclePostPlacementRemoved

consumers:
  - app (circlesList)

fields:
  - { name: circles, type: "[]Circle" }
  - { name: items, type: "[]CircleFeedItemView" }
  - { name: cursor, type: string }

indexes:
  - { name: idx_circle_discovery_category, collection: circles, keys: { status: 1, category: 1, subCategory: 1, memberCount: -1 } }
  - { name: idx_circle_discovery_membership, collection: circle_memberships, keys: { personaId: 1, state: 1, circleId: 1 } }
  - { name: idx_circle_discovery_posts, collection: posts, keys: { status: 1, createdAt: -1, _id: -1 } }
  - { name: idx_circle_post_placement_feed, collection: circle_post_placements, keys: { circleId: 1, state: 1, pinned: -1, featured: -1, lastActiveAt: -1 } }
