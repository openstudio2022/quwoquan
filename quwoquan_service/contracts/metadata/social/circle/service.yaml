version: 1

service:
  name: circle-service
  domain: circle
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: CIRCLE_CIRCLE_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 群组入口、圈子主页、组织主页、成员治理与群组协作

api_routes:
  - method: GET
    path: /v1/circles
    operation: ListCircles
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: public_circle_discovery
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [CIRCLE.USER.invalid_argument, CIRCLE.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: circle_list
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: CircleDiscoveryQueryFacet
      method: listCircles
      reader: CircleDiscoveryReader
      slice: CircleDiscoveryPageSlice
    description: 群组 / 主页列表（分类 + 推荐）
    query_params: [category, domainId, recommendFor, cursor, limit, sort]
    response_entity: Circle

  - method: GET
    path: /v1/circles/search
    operation: SearchCircles
    actor: persona
    application:
      kind: query
      facet: CircleSearchQueryFacet
      method: searchCircles
      reader: CircleSearchReader
      slice: CircleSearchResultSlice
    description: 全局搜索群组结果与 facet buckets
    query_params: [query, categoryId, subCategory, cursor, limit]
    response_entity: CircleSearchResultView
    auth: required

  - method: POST
    path: /v1/circles
    operation: CreateCircle
    actor: persona
    application:
      kind: command
      facet: CircleLifecycleCommandFacet
      method: createCircle
      aggregate_owner: Circle
      mutation_target: Circle
      invariant_target: Circle
    description: 创建圈子 / 组织主页
    request_entity: Circle
    writable_fields: [name, description, coverUrl, category, subCategory, tags, visibility, joinPolicy, kind, displaySubjectType, followEnabled, linkedHomepageId, linkedHomepageType, linkedHomepageTitle]

  - method: GET
    path: /v1/circles/{circleId}
    operation: GetCircle
    actor: none
    authorization:
      principal: public
      ownership_policy: public_circle_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [CIRCLE.USER.not_found, CIRCLE.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: circle_detail_get
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: CircleQueryFacet
      method: getCircle
      reader: CircleDetailReader
      slice: CircleDetailSlice
    description: 群组主页详情
    response_entity: Circle

  - method: PATCH
    path: /v1/circles/{circleId}
    operation: UpdateCircle
    actor: persona
    application:
      kind: command
      facet: CircleLifecycleCommandFacet
      method: updateCircle
      aggregate_owner: Circle
      mutation_target: Circle
      invariant_target: Circle
    description: 更新圈子 / 组织主页
    writable_fields: [name, description, coverUrl, category, subCategory, tags, visibility, joinPolicy, kind, displaySubjectType, followEnabled, linkedHomepageId, linkedHomepageType, linkedHomepageTitle]

  - method: DELETE
    path: /v1/circles/{circleId}
    operation: ArchiveCircle
    actor: persona
    application:
      kind: command
      facet: CircleLifecycleCommandFacet
      method: archiveCircle
      aggregate_owner: Circle
      mutation_target: Circle
      invariant_target: Circle
    description: 归档圈子

  - method: GET
    path: /v1/circles/{circleId}/feed
    operation: GetCircleFeed
    actor: none
    application:
      kind: query
      facet: CircleFeedQueryFacet
      method: getCircleFeed
      reader: CircleFeedReader
      slice: CircleFeedPageSlice
    description: 圈子动态流
    query_params: [identity, type, cursor, limit, sort]

  - method: GET
    path: /v1/circles/{circleId}/stats
    operation: GetCircleStats
    actor: none
    application:
      kind: query
      facet: CircleAnalyticsQueryFacet
      method: getCircleStats
      reader: CircleStatsReader
      slice: CircleStatsSlice
    description: 圈子统计

  - method: GET
    path: /v1/circles/{circleId}/impact
    operation: GetCircleImpact
    actor: persona
    application:
      kind: query
      facet: CircleAnalyticsQueryFacet
      method: getCircleImpact
      reader: CircleImpactReader
      slice: CircleImpactSlice
    description: 圈子影响摘要（连接型帮助结果，端侧圈子影响模块使用）
    response_entity: CircleImpactSummary
    auth: required

  # --- 板块配置 ---
  - method: PATCH
    path: /v1/circles/{circleId}/sections
    operation: UpdateCircleSections
    actor: persona
    application:
      kind: command
      facet: CircleConfigurationCommandFacet
      method: updateCircleSections
      aggregate_owner: Circle
      mutation_target: Circle
      invariant_target: Circle
    description: 更新圈子主页板块配置（顺序+可见性）
    request_entity: CircleSectionConfig

  # --- 存储空间 ---
consumers:
  - name: app
    capabilities: [list_circles, create_circle, join, leave, read_feed, read_members, list_groups, search_groups, create_group, manage_group_members, report_behavior, manage_files, manage_sections, pin_post, feature_post]
  - name: platform-ops
    capabilities: [read_circle, update_circle, manage_members, manage_groups, read_stats]
  - name: recommendation-engine
    capabilities: [read_circle, read_members, search]
  - name: assistant-service
    capabilities: [read_circle, read_groups, search]
  - name: chat-service
    capabilities: [read_circle, read_groups, create_conversation_for_circle, create_conversation_for_circle_group]
  - name: content-service
    capabilities: [read_circle, read_groups, read_feed]

contract_test:
  mock_strategy:
    app_side:
      mock_target: circle-service API
      data_source: fields.yaml
      scenarios:
        - name: circle_discovery
          route: GET /v1/circles
          query_params: [category=interest]
          assertions: [status_200, items_match_schema, sorted_by_member_count]

        - name: create_circle
          route: POST /v1/circles
          assertions: [circle_created, no_hidden_membership_write, member_count_projection_initialized]

        - name: circle_feed
          route: GET /v1/circles/{id}/feed
          assertions: [status_200, posts_within_circle]

        - name: visibility_and_join_policy
          variants: [public_open, private_approval, invite_only]
          assertions: [policy_enforced]

    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: testcontainers (redis:7)
      spy_targets: [event_publisher]
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: "DeleteMany for circles, circle_memberships, circle_membership_command_receipts, circle_membership_outbox, circle_membership_projection_checkpoints, circle_membership_projection_inbox"
        redis_cleanup: real Redis FLUSHDB in isolated container
      scenarios:
        - name: create_circle_without_hidden_cross_aggregate_write
          command: CreateCircle
          seed: []
          assertions:
            - "db.circles.FindOne({_id}) → document exists with correct name/tags"
            - "db.circle_memberships.CountDocuments({circleId}) → 0"
            - "db.circles.FindOne({_id}).memberCount → 0 until CircleMembership projection"
            - "eventSpy.AssertPublished('CircleCreated', {name, ownerId, tags})"

        - name: section_config_update
          route: PATCH /v1/circles/{id}/sections
          assertions: [section_config_persisted, event_published]

        - name: feed_pin_and_feature
          routes:
            - PATCH /v1/circles/{id}/feed/{postId}/pin
            - PATCH /v1/circles/{id}/feed/{postId}/feature
          assertions: [pinned_state_toggled, featured_state_toggled]

        - name: recommended_circles
          route: GET /v1/circles?recommendFor={userId}
          assertions: [status_200, sorted_by_relevance, domain_id_present]

  coverage_requirements:
    - all visibility/joinPolicy combinations covered
    - member role transitions (member → admin → owner) tested
    - circle default public group compatibility link tested
    - circle-group kernel and application flow tested
    - section config CRUD + event tested
    - feed pin/feature operations tested
    - recommended circles API tested
