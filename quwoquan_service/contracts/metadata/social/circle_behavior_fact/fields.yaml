version: 1
aggregate: CircleBehaviorFact
entities:
  CircleBehaviorFact:
    description: 不可变圈子行为事实；actor、session、request 归因仅由可信 Runtime Context 注入。
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: read, ops_exposure: read }
      - { name: actorKind, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: personaId, type: string, constraints: [NULLABLE], classification: PERSONAL, log_policy: hash, api_exposure: read, ops_exposure: read }
      - { name: deviceActorId, type: string, constraints: [NULLABLE], classification: PII, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: circleId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read }
      - { name: eventType, type: enum, enum_ref: BehaviorEventType, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read }
      - { name: sessionId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: requestId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }

  ReportCircleBehaviorRequest:
    description: 调用方只提交业务目标和行为；禁止提交 actor、session、requestId 或 occurredAt。
    fields:
      - { name: circleId, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: write, ops_exposure: read }
      - { name: eventType, type: enum, enum_ref: BehaviorEventType, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: write, ops_exposure: read }

  CircleBehaviorFactOutbox:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: outboxSequence, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }
      - { name: eventType, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }
      - { name: aggregateId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: payloadJson, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: drop, api_exposure: none, ops_exposure: read }
      - { name: occurredAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }

  CircleBehaviorFactOutboxSequence:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }
      - { name: value, type: int, constraints: [NOT_NULL, DEFAULT_0], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }

  CircleBehaviorFactProjectionCheckpoint:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: sequence, type: int, constraints: [NOT_NULL, DEFAULT_0], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }
      - { name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }

  CircleBehaviorFactProjectionInbox:
    fields:
      - { name: _id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: aggregateId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: hash, api_exposure: none, ops_exposure: read }
      - { name: appliedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: none, ops_exposure: read }
