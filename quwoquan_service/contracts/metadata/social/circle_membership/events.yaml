aggregate: CircleMembership
events:
  - name: CircleMembershipRequested
    producer: circle-service
    consumers: [notification-service]
    channel: transactional_outbox
    payload_entity: CircleMembership
    payload_fields: [id, version, circleId, circleOwnerPersonaId, personaId, role, state, createdAt]
  - name: CircleMembershipJoined
    producer: circle-service
    consumers: [circle-member-count-projector, recommendation-engine, notification-service]
    channel: transactional_outbox
    payload_entity: CircleMembership
    payload_fields: [id, version, circleId, circleOwnerPersonaId, personaId, role, state, joinedAt]
  - name: CircleMembershipLeft
    producer: circle-service
    consumers: [circle-member-count-projector, recommendation-engine, notification-service]
    channel: transactional_outbox
    payload_entity: CircleMembership
    payload_fields: [id, version, circleId, circleOwnerPersonaId, personaId, role, state, leftAt]
  - name: CircleMembershipRoleChanged
    producer: circle-service
    consumers: [circle-authorization-projector]
    channel: transactional_outbox
    payload_entity: CircleMembership
    payload_fields: [id, version, circleId, personaId, role, state, updatedAt]
  - name: CircleMembershipRejected
    producer: circle-service
    consumers: [notification-service]
    channel: transactional_outbox
    payload_entity: CircleMembership
    payload_fields: [id, version, circleId, circleOwnerPersonaId, personaId, role, state, updatedAt]
