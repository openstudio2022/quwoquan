aggregate: CircleMembership

scenarios:
  - name: membership_transaction_replay_projection_stream
    operation: JoinCircle
    go_func: TestCircleMembershipRealMongoTransactionReplayProjectionAndStream
    evidence: api_integration
    assertions:
      - membership、receipt、outbox 同一 Mongo transaction 提交
      - 相同 Idempotency-Key 重放首个结果
      - memberCount 投影与 Redis stream 收敛

  - name: membership_owner_invariant_and_moderator_role
    operation: UpdateCircleMembershipRole
    go_func: TestCircleMembershipOwnerInvariantAndModeratorRole
    evidence: api_integration
    assertions:
      - owner 不可离开或被移除
      - 角色变更仅 moderator，服务端内部 CAS 重放纯竞态
