aggregate: CircleMembership
layer: app_side

description: |
  端侧独立测试场景。执行：flutter test test/local_contract/cloud/circle/

scenarios:
  - name: membership_typed_facet_abi
    description: Join/Leave/Role 命令与 roster/self 查询 typed ABI 与 alpha mock 同型
    assertions:
      - typed_command_rejects_blank_ids
      - decoder_rejects_unknown_keys
      - alpha_facet_matches_remote_shape

  - name: error_code_mapping
    cases:
      - http_status: 409
        code: CIRCLE.USER.membership_already_active
        expected_dart_const: membershipAlreadyActive
      - http_status: 409
        code: CIRCLE.USER.membership_version_conflict
        expected_dart_const: membershipVersionConflict
