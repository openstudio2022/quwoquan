aggregate: HomepageStatusReport
backend: mongodb

collections:
  homepage_status_reports:
    entity: HomepageStatusReport
    role: authoritative
    indexes:
      - { name: idx_status_reports_homepage_status, keys: { homepageId: 1, status: 1, createdAt: -1 } }
      - { name: idx_status_reports_reporter, keys: { reporterPersonaId: 1, createdAt: -1 } }
      - { name: idx_status_reports_active_unique, keys: { homepageId: 1, reporterPersonaId: 1, reason: 1 }, unique: true, partial_filter: { status: pending_review }, description: "同一 reporter 对同一 homepage 的相同原因仅一条待审核上报" }
      - { name: idx_status_reports_version, keys: { _id: 1, version: 1 }, unique: true, description: "HomepageStatusReport CAS commit predicate" }

  homepage_status_report_command_receipts:
    entity: HomepageStatusReport
    description: HomepageStatusReport command 幂等回执；与聚合版本和 outbox 在同一 Mongo transaction 提交。
    indexes:
      - { name: idx_status_report_receipts_aggregate, keys: { aggregateId: 1, aggregateVersion: -1 } }
      - { name: idx_status_report_receipts_expire, keys: { expiresAt: 1 }, expireAfterSeconds: 0 }

  homepage_status_report_outbox:
    entity: HomepageStatusReport
    description: 状态上报领域事实 outbox；审核 confirmed_offline 由 Homepage 投影消费者幂等推进下线。
    indexes:
      - { name: idx_status_report_outbox_replay, keys: { occurredAt: 1, _id: 1 } }
      - { name: idx_status_report_outbox_aggregate_version, keys: { aggregateId: 1, aggregateVersion: 1 }, unique: true }

  homepage_status_report_projection_checkpoints:
    entity: HomepageStatusReport
    role: projection
    indexes:
      - { name: idx_status_report_checkpoint_consumer, keys: { _id: 1 }, unique: true }

transaction:
  scope: [homepage_status_reports, homepage_status_report_command_receipts, homepage_status_report_outbox]
  isolation: mongo_transaction
  guarantees:
    - version_cas
    - idempotency_digest
    - aggregate_and_outbox_atomic_commit
