aggregate: HomepageStatusReport
domain: ENTITY

description: |
  HomepageStatusReport 聚合专属错误码。通用命令错误复用 entity/homepage/errors.yaml。

errors:
  - code: ENTITY.USER.status_report_not_found
    kind: USER
    reason: not_found
    http_status: 404
    recovery_action: surface
    dart_const: statusReportNotFound
    go_const: ErrStatusReportNotFound
    user_message:
      zh: "上报记录不存在"
      en: "Status report not found"
