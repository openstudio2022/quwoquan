aggregate: HomepageStatusReport
layer: e2e

description: |
  状态上报端云集成验证。App 只提交上报；审核经 platform-ops 面。

scenarios:
  - name: report_and_offline
    steps:
      - user submits offline report with reason
      - governance operator confirms offline via platform-ops
    assertions:
      - offline_report_status_transition_valid
      - homepage_becomes_offline_and_reads_return_410
      - homepage_removed_from_search_visibility
