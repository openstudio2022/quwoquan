version: 1

service:
  name: entity-service
  domain: entity
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: ENTITY_HOMEPAGE_STATUS_REPORT_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: HomepageStatusReport 对象命令操作包。

api_routes:
  - method: POST
    path: /v1/homepages/{homepageId}/status-reports
    operation: CreateHomepageStatusReport
    actor: persona
    application:
      kind: command
      facet: HomepageStatusReportCommandFacade
      method: create
      aggregate_owner: HomepageStatusReport
      mutation_target: HomepageStatusReport
      invariant_target: HomepageStatusReport
    description: 提交主页下线/纠错上报
    request_entity: HomepageStatusReport
    writable_fields: [reason, description, evidenceUrls]
    auth: required

  - method: POST
    path: /v1/homepages/{homepageId}/status-reports/{reportId}:review
    operation: ReviewHomepageStatusReport
    actor: account
    application:
      kind: command
      facet: HomepageStatusReportCommandFacade
      method: review
      aggregate_owner: HomepageStatusReport
      mutation_target: HomepageStatusReport
      invariant_target: HomepageStatusReport
    description: 审核主页下线/纠错上报
    writable_fields: [status, reviewNote]
    auth: required

consumers:
  - name: app
    capabilities: [create_homepage_status_report]
  - name: platform-ops
    capabilities: [review_homepage_status_report]
