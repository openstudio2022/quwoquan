version: 1
domain: entity
entity: HomepageReview
object_kind: aggregate_root

description: |
  共享主页评价。每条评价拥有独立生命周期并通过 homepageId 引用 Homepage；
  Homepage 仅消费评价摘要 Slice，不拥有无界评价集合。

storage_backend: mongodb
capabilities:
  - auditable

business_rules:
  - author persona 对同一 homepage 仅有一个 active review
  - rating 必须处于 1 到 5，正文修改使用 expectedVersion
  - 只有 author 可以更新或删除自己的评价
  - Homepage 只消费评价投影，不与评价聚合强一致提交
lifecycle:
  states: [active, deleted]
  optimistic_concurrency: version
  idempotency: command_receipt
