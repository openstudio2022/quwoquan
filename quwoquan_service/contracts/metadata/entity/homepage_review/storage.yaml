aggregate: HomepageReview
backend: mongodb

collections:
  homepage_reviews:
    entity: HomepageReview
    role: authoritative
    indexes:
      - { name: idx_homepage_review_homepage_status, keys: { homepageId: 1, status: 1, createdAt: -1 } }
      - { name: idx_homepage_review_author_homepage, keys: { authorPersonaId: 1, homepageId: 1 }, unique: true }
