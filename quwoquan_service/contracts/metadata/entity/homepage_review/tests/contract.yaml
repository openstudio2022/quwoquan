aggregate: HomepageReview
layer: contract

scenarios:
  - name: create_review_server_owned_cas
    operation: CreateHomepageReview
    assertions:
      - request 不携带版本字段，幂等身份只来自 Idempotency-Key header
      - 同一 persona 对同一 homepage 重复创建返回 version_conflict 或复活既有记录
      - 成功创建产生 HomepageReviewPublished outbox 事实并推进摘要投影

  - name: update_review_author_only
    operation: UpdateHomepageReview
    assertions:
      - 非作者更新返回 permission_denied 且聚合不变
      - 纯 CAS 冲突由服务端重载重放，调用方不参与版本协商

  - name: delete_review_noop_receipt
    operation: DeleteHomepageReview
    assertions:
      - 已删除评价上的首个新 Idempotency-Key 持久化 no-op receipt，不递增版本
      - 相同 key 重放返回首次结果

  - name: revive_after_delete
    operation: CreateHomepageReview
    assertions:
      - 软删后再次创建复活同一聚合，version 单调递增
      - 唯一索引 authorPersonaId+homepageId 始终只有一条记录

  - name: list_reviews_keyset_page
    operation: ListHomepageReviews
    assertions:
      - 仅返回 active 评价，createdAt desc keyset 分页无重叠
      - items_match_schema

  - name: get_my_review
    operation: GetMyHomepageReview
    assertions:
      - 返回当前 persona 的评价（含 deleted 供复活预填）
      - 从未评价过返回 review_not_found
