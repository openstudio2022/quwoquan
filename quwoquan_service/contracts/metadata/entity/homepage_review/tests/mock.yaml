aggregate: HomepageReview
layer: app_side

description: |
  端侧主页评价 alpha mock 契约。行为必须与 api_integration 验证的服务端语义同构。

scenarios:
  - name: create_and_list_review
    assertions:
      - created_review_appears_in_list
      - summary_average_and_count_recomputed

  - name: update_own_review
    assertions:
      - rating_and_body_updated
      - non_author_update_rejected

  - name: delete_then_revive
    assertions:
      - deleted_review_hidden_from_list
      - recreate_revives_same_record
