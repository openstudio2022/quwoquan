aggregate: HomepageReview
layer: e2e

description: |
  主页评价端云集成验证。覆盖发表、编辑、删除与摘要收敛。

scenarios:
  - name: review_write_and_summary_converge
    steps:
      - user opens homepage detail
      - user submits a review with rating, body and tags
      - user edits the review rating
      - user deletes the review
    assertions:
      - review_visible_in_opinion_tab_after_create
      - summary_average_rating_converges_after_each_write
      - deleted_review_removed_from_list_and_summary

  - name: review_idempotent_replay
    steps:
      - user submits a review while network is flaky and the client retries
    assertions:
      - exactly_one_review_persisted
      - replayed_receipt_matches_first_response
