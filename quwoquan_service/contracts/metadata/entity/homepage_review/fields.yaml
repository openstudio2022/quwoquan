aggregate: HomepageReview

entities:
  HomepageReview:
    description: Persona 对 Homepage 的独立评价聚合
    fields:
      - { name: _id, type: ObjectId, constraints: [PK], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: homepageId, type: ObjectId, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: authorPersonaId, type: string, constraints: [NOT_NULL], classification: PRIVATE, log_policy: hash, api_exposure: read, ops_exposure: read }
      - { name: rating, type: int, constraints: [NOT_NULL, MIN_1, MAX_5], classification: PUBLIC, log_policy: allow, api_exposure: read_write, ops_exposure: read }
      - { name: body, type: string, constraints: [NULLABLE], classification: PUBLIC, log_policy: mask, api_exposure: read_write, ops_exposure: read }
      - { name: tagRefs, type: "[]string", constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read_write, ops_exposure: read }
      - { name: status, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read_write }
      - { name: version, type: int, constraints: [NOT_NULL, DEFAULT_1], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: createdAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
