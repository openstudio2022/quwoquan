aggregate: Homepage

entities:
  Homepage:
    description: 共享主页主档
    fields:
      - name: homepageId
        source: _id
        type: ObjectId
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: title
        source: title
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: subtitle
        source: subtitle
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: homepageType
        source: homepageType
        type: enum
        enum_ref: HomepageType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: canonicalEntityId
        source: canonicalEntityId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        description: 数据工程实体归一 ID；Homepage 与离线实体页的单一对象键

      - name: objectPageTemplate
        source: objectPageTemplate
        type: string
        constraints: [NOT_NULL, DEFAULT_STANDARD]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 对象主页展示模板，如 standard、campus、travel_photo；由 homepageType 与运营配置共同决定

      - name: status
        source: status
        type: enum
        enum_ref: HomepageStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write

      - name: sourceType
        source: sourceType
        type: enum
        enum_ref: HomepageSourceType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: sourceOwner
        source: sourceOwner
        type: string
        constraints: [NULLABLE]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 写入主页投影的受控来源所有者；仅用于 release sync 的归属隔离

      - name: sourceEntityRef
        source: sourceEntityRef
        type: string
        constraints: [NULLABLE]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 来源系统内的稳定实体引用；同 sourceOwner 下唯一定位导入主页

      - name: sourceReleaseId
        source: sourceReleaseId
        type: string
        constraints: [NULLABLE]
        classification: INTERNAL
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
        description: 最近一次写入该主页投影的不可变数据发布批次

      - name: claimStatus
        source: claimStatus
        type: enum
        enum_ref: HomepageClaimStatus
        constraints: [NOT_NULL, DEFAULT_UNCLAIMED]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write

      - name: categoryTags
        source: categoryTags
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        tag_ref: true
        description: 路径制 tagRef 列表（对象类目锚点）；真相源 control_plane/governance/taxonomy（Entity/Topic 分组）

      - name: coverUrl
        source: coverUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: address
        source: address
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: city
        source: city
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: location
        source: location
        type: GeoPoint
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: ownerUserId
        source: ownerUserId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: ownerSubAccountId
        source: ownerSubAccountId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 已认领主页的可私信公开主体 ID，端侧私信复用 user→user direct 会话

      - name: viewerFollowsHomepage
        source: viewerFollowsHomepage
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 当前 viewer 是否关注该实体主页；为空 viewer 时恒为 false

      - name: followerCount
        source: followerCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 关注该实体主页的人数；实体页统计前台展示为「关注」，不作为数据面板主视觉（禁止使用「关注者」）

      - name: verified
        source: verified
        type: bool
        constraints: [NOT_NULL, DEFAULT_FALSE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 实体主页是否官方认证（端侧头部认证标识），缺省 false 不展示

      - name: establishedYear
        source: establishedYear
        type: int
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 成立年份（基础信息行展示），缺省不展示

      - name: averageRating
        source: averageRating
        type: float64
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: ratingCount
        source: ratingCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: reviewSummary
        source: reviewSummary
        type: object
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: contentPreview
        source: contentPreview
        type: "[]object"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: questionPreview
        source: questionPreview
        type: "[]object"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: relatedGroups
        source: relatedGroups
        type: "[]object"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: relationEdges
        source: relationEdges
        type: "[]object"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 对象主页关系边快照，用于交集、推荐和小趣解释

      - name: assistantContext
        source: assistantContext
        type: object
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 小趣对象页上下文快照，由后端投影生成，端侧只读

      - name: createdAt
        source: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: updatedAt
        source: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: publishedAt
        source: publishedAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: offlineAt
        source: offlineAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

