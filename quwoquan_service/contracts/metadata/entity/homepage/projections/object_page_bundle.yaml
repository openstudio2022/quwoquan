version: 1
read_model: ObjectPageBundle

description: |
  对象页统一 Bundle。用户主页、圈子/群组主页和共享主页可消费同构字段，
  由具体领域服务填充身份与内容区，端侧用共享对象页组件渲染。
  交集唯一下发通道为 intersectionReasons（List<IntersectionReason>）；禁止并行 intersections 第二通道。

source_entities:
  - Homepage

consumers:
  - app
  - assistant
  - recommendation

client_projection:
  dart_class: ObjectPageBundle
  base_class: ""
  output_path: cloud/runtime/generated/entity/object_page_bundle.g.dart
  dart_imports:
    - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
    - homepage_content_preview.g.dart
    - homepage_related_group_summary.g.dart
    - object_relation_edge.g.dart
    - object_page_context.g.dart
    - object_page_rollout_context.g.dart
  fields:
    - name: objectType
      dart_type: String
      nullable: false
      source: objectType
      aliases: [objectType]
      default: "''"
    - name: objectId
      dart_type: String
      nullable: false
      source: objectId
      aliases: [objectId]
      default: "''"
    - name: canonicalEntityId
      dart_type: String
      nullable: false
      source: canonicalEntityId
      aliases: [canonicalEntityId]
      default: "''"
    - name: title
      dart_type: String
      nullable: false
      source: title
      aliases: [title]
      default: "''"
    - name: subtitle
      dart_type: String
      nullable: true
      source: subtitle
      aliases: [subtitle]
    - name: coverUrl
      dart_type: String
      nullable: true
      source: coverUrl
      aliases: [coverUrl]
    - name: objectPageTemplate
      dart_type: String
      nullable: false
      source: objectPageTemplate
      aliases: [objectPageTemplate]
      default: "'standard'"
    - name: tagRefs
      dart_type: List<String>
      nullable: false
      source: tagRefs
      aliases: [tagRefs]
    - name: stats
      dart_type: Map<String, dynamic>
      nullable: false
      source: stats
      aliases: [stats]
      default: "<String, dynamic>{}"
    - name: intersectionReasons
      dart_type: List<IntersectionReason>
      nullable: false
      source: intersectionReasons
      aliases: [intersectionReasons]
      list_element_dart_class: IntersectionReason
    - name: highlightItems
      dart_type: List<HomepageContentPreview>
      nullable: false
      source: highlightItems
      aliases: [highlightItems]
      list_element_dart_class: HomepageContentPreview
    - name: contentSections
      dart_type: Map<String, dynamic>
      nullable: false
      source: contentSections
      aliases: [contentSections]
      default: "<String, dynamic>{}"
    - name: relatedObjects
      dart_type: List<HomepageRelatedGroupSummary>
      nullable: false
      source: relatedObjects
      aliases: [relatedObjects]
      list_element_dart_class: HomepageRelatedGroupSummary
    - name: relationEdges
      dart_type: List<ObjectRelationEdge>
      nullable: false
      source: relationEdges
      aliases: [relationEdges]
      list_element_dart_class: ObjectRelationEdge
    - name: assistantContext
      dart_type: ObjectPageContext?
      nullable: true
      source: assistantContext
      aliases: [assistantContext]
      map_from_string_key_class: ObjectPageContext
    - name: rolloutContext
      dart_type: ObjectPageRolloutContext?
      nullable: true
      source: rolloutContext
      aliases: [rolloutContext]
      map_from_string_key_class: ObjectPageRolloutContext
