version: 1
read_model: ObjectIntersectionEvidence

description: |
  对象交集证据项。每个用户可见交集必须至少有一条可理解、可回查且满足权限的证据。

source_entities:
  - Homepage
  - Post
  - Comment
  - Circle
  - UserProfile

consumers:
  - app
  - recommendation
  - assistant

client_projection:
  dart_class: ObjectIntersectionEvidence
  base_class: ""
  output_path: cloud/runtime/generated/entity/object_intersection_evidence.g.dart
  fields:
    - name: evidenceId
      dart_type: String
      nullable: false
      source: evidenceId
      aliases: [evidenceId]
      default: "''"
    - name: evidenceType
      dart_type: String
      nullable: false
      source: evidenceType
      aliases: [evidenceType]
      default: "''"
    - name: evidenceObjectId
      dart_type: String
      nullable: false
      source: evidenceObjectId
      aliases: [evidenceObjectId]
      default: "''"
    - name: evidenceLabel
      dart_type: String
      nullable: false
      source: evidenceLabel
      aliases: [evidenceLabel]
      default: "''"
    - name: source
      dart_type: String
      nullable: false
      source: source
      aliases: [source]
      default: "''"
    - name: referralTarget
      dart_type: String
      nullable: false
      source: referralTarget
      aliases: [referralTarget]
      default: "''"
    - name: visibility
      dart_type: String
      nullable: false
      source: visibility
      aliases: [visibility]
      default: "'public'"
