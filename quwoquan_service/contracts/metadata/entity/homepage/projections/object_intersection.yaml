version: 1
read_model: ObjectIntersection

description: |
  对象交集事实。仅表达可向用户说明的真实交集；算法排序分数不在此结构中伪装成事实。

source_entities:
  - Homepage
  - Post
  - Comment
  - Circle
  - UserProfile

consumers:
  - app
  - recommendation
  - assistant

client_projection:
  dart_class: ObjectIntersection
  base_class: ""
  output_path: cloud/runtime/generated/entity/object_intersection.g.dart
  dart_imports:
    - object_intersection_evidence.g.dart
  fields:
    - name: intersectionId
      dart_type: String
      nullable: false
      source: intersectionId
      aliases: [intersectionId]
      default: "''"
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      aliases: [dimension]
      default: "''"
    - name: objectKind
      dart_type: String
      nullable: false
      source: objectKind
      aliases: [objectKind]
      default: "''"
    - name: objectId
      dart_type: String
      nullable: false
      source: objectId
      aliases: [objectId]
      default: "''"
    - name: shortLabel
      dart_type: String
      nullable: false
      source: shortLabel
      aliases: [shortLabel]
      default: "''"
    - name: evidenceLabel
      dart_type: String
      nullable: false
      source: evidenceLabel
      aliases: [evidenceLabel]
      default: "''"
    - name: actionType
      dart_type: String
      nullable: false
      source: actionType
      aliases: [actionType]
      default: "''"
    - name: actionLabel
      dart_type: String
      nullable: false
      source: actionLabel
      aliases: [actionLabel]
      default: "''"
    - name: strength
      dart_type: double
      nullable: false
      source: strength
      aliases: [strength]
      default: "0.0"
    - name: confidenceLabel
      dart_type: String
      nullable: false
      source: confidenceLabel
      aliases: [confidenceLabel]
      default: "''"
    - name: surfaceScope
      dart_type: String
      nullable: false
      source: surfaceScope
      aliases: [surfaceScope]
      default: "'objectPage'"
    - name: privacyLevel
      dart_type: String
      nullable: false
      source: privacyLevel
      aliases: [privacyLevel]
      default: "'public'"
    - name: tagRefs
      dart_type: List<String>
      nullable: false
      source: tagRefs
      aliases: [tagRefs]
    - name: relationEdgeIds
      dart_type: List<String>
      nullable: false
      source: relationEdgeIds
      aliases: [relationEdgeIds]
    - name: evidenceItems
      dart_type: List<ObjectIntersectionEvidence>
      nullable: false
      source: evidenceItems
      aliases: [evidenceItems]
      list_element_dart_class: ObjectIntersectionEvidence
