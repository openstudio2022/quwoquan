read_model: HomepageIntroduction

description: |
  主页完整介绍页读模型。用户前台文案为「认识{对象名}」，禁止展示「实体介绍」等工程词。
  内容来源为数据工程实体主页三件套或维护后台导入；App 只消费公开 primarySource/sourceUrls，
  内部 sourceRefs/primaryEvidenceRef 不进入客户端投影。

source_entities:
  - Homepage

consumers:
  - app

client_projection:
  dart_class: HomepageIntroduction
  base_class: ""
  output_path: cloud/runtime/generated/entity/homepage_introduction.g.dart
  dart_imports:
    - homepage_introduction_section.g.dart
    - homepage_related_group_summary.g.dart
    - homepage_source.g.dart
  fields:
    - name: homepageId
      dart_type: String
      nullable: false
      source: homepageId
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      default: "''"

    - name: homepageType
      dart_type: String
      nullable: false
      source: homepageType
      default: "''"

    - name: coverUrl
      dart_type: String
      nullable: true
      source: coverUrl
    - name: summary
      dart_type: String
      nullable: false
      source: summary
      default: "''"

    - name: sections
      dart_type: List<HomepageIntroductionSection>
      nullable: false
      source: sections
      list_element_dart_class: HomepageIntroductionSection

    - name: relatedObjects
      dart_type: List<HomepageRelatedGroupSummary>
      nullable: false
      source: relatedObjects
      list_element_dart_class: HomepageRelatedGroupSummary

    - name: primarySource
      dart_type: HomepageSource
      nullable: true
      source: primarySource
      map_from_string_key_class: HomepageSource

    - name: sourceUrls
      dart_type: List<String>
      nullable: false
      source: sourceUrls
    - name: updatedAt
      dart_type: String
      nullable: false
      source: updatedAt
      default: "''"
