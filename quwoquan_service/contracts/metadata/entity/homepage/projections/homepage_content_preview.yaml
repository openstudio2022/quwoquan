version: 1
read_model: HomepageContentPreview

description: |
  主页壳层内容预览项 wire。

source_entities:
  - Homepage

consumers:
  - app

client_projection:
  dart_class: HomepageContentPreview
  base_class: ""
  output_path: cloud/runtime/generated/entity/homepage_content_preview.g.dart
  dart_imports:
    - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
  fields:
    - name: postId
      dart_type: String
      nullable: false
      source: postId
      aliases: [postId]
      default: "''"

    - name: title
      dart_type: String
      nullable: false
      source: title
      aliases: [title]
      default: "''"

    - name: summary
      dart_type: String
      nullable: true
      source: summary
      aliases: [summary]

    - name: contentType
      dart_type: String
      nullable: true
      source: contentType
      aliases: [contentType]

    - name: coverUrl
      dart_type: String
      nullable: true
      source: coverUrl
      aliases: [coverUrl]

    - name: intersectionReasons
      dart_type: List<IntersectionReason>
      nullable: true
      source: intersectionReasons
      aliases: [intersectionReasons]
      list_element_dart_class: IntersectionReason
      default: "null"
      description: "记录卡卡内交集句（云侧推荐管线预生成；端只读展示，无来源时为 null 不占位）"
