
service:
  name: entity-service
  domain: entity
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: ENTITY_HOMEPAGE_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 共享主页主档、搜索选择、认领与下线治理

api_routes:
  - method: GET
    path: /homepages/search

    operation: SearchHomepages
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: published_homepage_search
    reliability:
      timeout_ms: 6000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: optional
    error_codes: [ENTITY.USER.invalid_argument, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_search
      trace: true
      attributes: [homepage_type, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: search
      reader: HomepageSearchReader
      slice: HomepageSearchSlice
    description: 搜索共享主页
    query_params: [query, homepageType, city, status, cursor, limit]
    response_entity: HomepageSearchItemView
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageSearchQuery
      response_type: HomepageSearchSlice
      request_encoder: encodeHomepageSearchQuery
      response_decoder: decodeHomepageSearchSlice

  - method: POST
    path: /homepages/candidates

    operation: IntakeHomepageCandidate
    actor: account
    application:
      kind: command
      facet: HomepageImportCommandFacade
      method: intakeCandidate
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    description: 创建候选共享主页（introductionMarkdown/introductionAssets 承载数据工程 page.md 三段结构投影）
    request_entity: Homepage
    writable_fields: [title, subtitle, homepageType, categoryTags, coverUrl, address, city, location, introductionMarkdown, introductionAssets]
    security:
      auth_mode: required
  - method: POST
    path: /homepages/candidates/suggest

    operation: SuggestHomepageCandidate
    actor: persona
    application:
      kind: command
      facet: HomepageCommandFacade
      method: suggestCandidate
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    description: 补充缺失主页
    request_entity: Homepage
    writable_fields: [title, subtitle, homepageType, categoryTags, coverUrl, address, city, location]
    security:
      auth_mode: required
  - method: POST
    path: /homepages/candidates/{homepageId}:publish

    operation: PublishHomepageCandidate
    actor: account
    application:
      kind: command
      facet: HomepageLifecycleCommandFacade
      method: publishCandidate
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    description: 将候选共享主页发布为正式主页
    security:
      auth_mode: required
  - method: GET
    path: /homepages/{homepageId}

    operation: GetHomepageDetail
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [ENTITY.USER.homepage_not_found, ENTITY.USER.homepage_offline, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_detail_get
      trace: true
      attributes: [homepage_id, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: getDetail
      reader: HomepageDetailReader
      slice: HomepageDetailSlice
    description: 获取共享主页详情
    response_entity: Homepage
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageByIdQuery
      response_type: HomepageDetailProjection
      request_encoder: encodeHomepageByIdQuery
      response_decoder: decodeHomepageDetail

  - method: GET
    path: /homepages/{homepageId}/shell

    operation: GetHomepageShell
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [ENTITY.USER.homepage_not_found, ENTITY.USER.homepage_offline, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_shell_get
      trace: true
      attributes: [homepage_id, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: getShell
      reader: HomepageShellReader
      slice: HomepageShellSlice
    description: 获取共享主页阅读壳层
    response_entity: HomepageShellView
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageByIdQuery
      response_type: HomepageShellProjection
      request_encoder: encodeHomepageByIdQuery
      response_decoder: decodeHomepageShell

  - method: POST
    path: /homepages/{homepageId}/follow

    operation: FollowHomepage
    actor: persona
    application:
      kind: command
      facet: HomepageFollowCommandFacade
      method: follow
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    path_params: [homepageId]
    response_entity: Homepage
    security:
      auth_mode: required
  - method: DELETE
    path: /homepages/{homepageId}/follow

    operation: UnfollowHomepage
    actor: persona
    application:
      kind: command
      facet: HomepageFollowCommandFacade
      method: unfollow
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    path_params: [homepageId]
    response_entity: Homepage
    security:
      auth_mode: required
  - method: GET
    path: /homepages/{homepageId}/introduction

    operation: GetHomepageIntroduction
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [ENTITY.USER.homepage_not_found, ENTITY.USER.homepage_offline, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_introduction_get
      trace: true
      attributes: [homepage_id, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: getIntroduction
      reader: HomepageIntroductionReader
      slice: HomepageIntroductionSlice
    description: 获取主页完整介绍页
    response_entity: HomepageIntroduction
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageByIdQuery
      response_type: HomepageIntroductionProjection
      request_encoder: encodeHomepageByIdQuery
      response_decoder: decodeHomepageIntroduction

  - method: GET
    path: /homepages/{homepageId}/object-page-bundle

    operation: GetObjectPageBundle
    actor: persona_or_device
    commercial:
      status: ready
    authorization:
      principal: persona
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [ENTITY.USER.homepage_not_found, ENTITY.USER.homepage_offline, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: INTERNAL
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_object_bundle_get
      trace: true
      attributes: [homepage_id, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: persona
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: getObjectPageBundle
      reader: ObjectPageBundleReader
      slice: ObjectPageBundleSlice
    description: 获取对象页统一 Bundle（身份、交集、看点、关系边、小趣上下文和灰度上下文）
    query_params: [referralSource, feedRequestId, recommendationTraceId, experimentBucket, rolloutCohort]
    response_entity: ObjectPageBundle
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageObjectPageBundleQuery
      response_type: HomepageObjectPageBundleProjection
      request_encoder: encodeHomepageObjectPageBundleQuery
      response_decoder: decodeHomepageObjectPageBundle

  - method: GET
    path: /homepages/{homepageId}/impact

    operation: GetEntityImpact
    actor: persona
    commercial:
      status: ready
    authorization:
      principal: persona
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [ENTITY.USER.homepage_not_found, ENTITY.USER.homepage_offline, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: INTERNAL
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_impact_get
      trace: true
      attributes: [homepage_id, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    application:
      kind: query
      facet: HomepageQueryFacade
      method: getImpact
      reader: EntityImpactReader
      slice: EntityImpactSlice
    description: 实体（共享主页）影响摘要（连接型帮助结果，端侧实体主页「影响力」模块使用）
    response_entity: EntityImpactSummary
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageByIdQuery
      response_type: HomepageImpactSummaryProjection
      request_encoder: encodeHomepageByIdQuery
      response_decoder: decodeHomepageImpactSummary
  - method: GET
    path: /homepages/{homepageId}/review-summary

    operation: GetHomepageReviewSummary
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [ENTITY.USER.homepage_not_found, ENTITY.USER.homepage_offline, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_review_summary_get
      trace: true
      attributes: [homepage_id, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: getReviewSummary
      reader: HomepageReviewSummaryReader
      slice: HomepageReviewSummarySlice
    description: 获取共享主页评分与口碑摘要
    response_entity: HomepageReviewSummaryView
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageByIdQuery
      response_type: HomepageReviewSummaryProjection
      request_encoder: encodeHomepageByIdQuery
      response_decoder: decodeHomepageReviewSummary

  - method: GET
    path: /homepages/{homepageId}/related-groups

    operation: GetHomepageRelatedGroups
    actor: none
    commercial:
      status: ready
    authorization:
      principal: public
      ownership_policy: published_homepage_read
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [ENTITY.USER.homepage_not_found, ENTITY.USER.homepage_offline, ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_related_groups_get
      trace: true
      attributes: [homepage_id, outcome]
    slo:
      latency_p95_ms: 300
      availability_percent: 99.5
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    application:
      kind: query
      facet: HomepageQueryFacade
      method: getRelatedGroups
      reader: HomepageRelatedGroupsReader
      slice: HomepageRelatedGroupsSlice
    description: 获取共享主页相关群组摘要
    response_entity: HomepageRelatedGroupSummaryView
    client_contract:
      dart_import: ../entity/homepage_queries.dart
      request_type: HomepageByIdQuery
      response_type: HomepageRelatedGroupsSlice
      request_encoder: encodeHomepageByIdQuery
      response_decoder: decodeHomepageRelatedGroups

  - method: PATCH
    path: /homepages/{homepageId}/claimed-basics

    operation: UpdateClaimedHomepageBasics
    actor: persona
    application:
      kind: command
      facet: HomepageCommandFacade
      method: updateClaimedBasics
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    description: 更新已认领主页的基础资料
    writable_fields: [title, subtitle, categoryTags, coverUrl, address, city, location]
    security:
      auth_mode: required
  - method: POST
    path: /homepages:reload

    operation: ReloadHomepageState
    actor: account
    commercial:
      status: ready
    authorization:
      principal: account
      ownership_policy: data_release_environment_operator
    reliability:
      timeout_ms: 15000
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    error_codes: [ENTITY.SYSTEM.internal_error]
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: entity_homepage_state_reload
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 5000
      availability_percent: 99.5
    application:
      kind: command
      facet: HomepageImportCommandFacade
      method: reloadState
      aggregate_owner: Homepage
      mutation_target: Homepage
      invariant_target: Homepage
    description: 免停服重载 homepage_state 快照（数据工程 importer 直写运行库后由 ops 触发；同 ID 覆盖、新 ID 追加，不清空运行期关注/认领状态；来源 sync 的 offline 投影同步删除搜索可见性）
    security:
      auth_mode: required
      principal: account
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
consumers:
  - name: app
    capabilities: [search, suggest, read_homepage, read_homepage_introduction, maintain]
  - name: platform-ops
    capabilities: [publish_candidate, reload_state]
  - name: content-service
    capabilities: [read_homepage]
  - name: circle-service
    capabilities: [read_homepage]

contract_test:
  mock_strategy:
    app_side:
      mock_target: entity-service API
      scenarios:
        - name: search_homepages
          route: GET /homepages/search
          assertions: [status_200, items_match_schema]
    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
      spy_targets: [event_publisher]
      data_management:
        seed: fixture 工厂预制主页候选与已发布主页
        cleanup: "DeleteMany for homepages, homepage_claim_requests, homepage_status_reports"
      scenarios:
        - name: intake_publish_search
          command: IntakeHomepageCandidate -> PublishHomepageCandidate -> SearchHomepages
          seed: []
          assertions:
            - "published homepage appears in search results"
            - "eventSpy.AssertPublished('HomepagePublished')"
