version: 1
domain: entity
aggregate_root: Homepage
object_kind: aggregate_root

description: |
  共享主页主档聚合。只承载 candidate -> published -> offline 生命周期与主档维护；
  认领、状态上报和评价各自拥有独立生命周期，页面壳层与摘要均由查询 Slice 组装。

storage_backend: mongodb
cache_layer: redis
cache_ttl_seconds: 120

capabilities:
  - queryable
  - searchable
  - aggregatable

taggable: true
vector_enabled: false

business_rules:
  - canonical identity 与 homepageType 创建后不可变
  - candidate 只能在必填主档、标签和来源证据齐全后发布
  - published 主档修改使用 expectedVersion 并生成可审计事件
  - offline 主页不可重新公开，重新上线必须创建新候选版本
  - 认领、状态上报、评价和关注均通过各自上下文公开契约
lifecycle:
  states: [candidate, published, offline]
  transitions:
    - { from: candidate, command: PublishHomepage, to: published }
    - { from: published, command: TakeHomepageOffline, to: offline }
  optimistic_concurrency: version
  idempotency: command_receipt

ddd_layer_mapping:
  domain_model: services/entity-service/internal/domain/homepage/model
  ports: services/entity-service/internal/domain/homepage/ports
  application: services/entity-service/internal/application/homepage
  adapter_rest: services/entity-service/internal/adapters/http/homepage
  adapter_event: services/entity-service/internal/adapters/mq/homepage
