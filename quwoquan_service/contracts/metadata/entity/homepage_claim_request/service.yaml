
service:
  name: entity-service
  domain: entity
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: ENTITY_HOMEPAGE_CLAIM_REQUEST_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: HomepageClaimRequest 对象命令操作包。

api_routes:
  - method: POST
    path: /homepages/{homepageId}/claim-requests

    operation: CreateHomepageClaimRequest
    actor: persona
    application:
      kind: command
      facet: HomepageClaimCommandFacade
      method: create
      aggregate_owner: HomepageClaimRequest
      mutation_target: HomepageClaimRequest
      invariant_target: HomepageClaimRequest
    description: 发起主页认领申请
    request_entity: HomepageClaimRequest
    writable_fields: [claimTier, businessLicenseUrl, contactPhone, identityCardFrontUrl, identityCardBackUrl, note]
    security:
      auth_mode: required
  - method: POST
    path: /homepages/{homepageId}/claim-requests/{claimRequestId}:review

    operation: ReviewHomepageClaimRequest
    actor: account
    application:
      kind: command
      facet: HomepageClaimCommandFacade
      method: review
      aggregate_owner: HomepageClaimRequest
      mutation_target: HomepageClaimRequest
      invariant_target: HomepageClaimRequest
    description: 审核主页认领申请
    writable_fields: [status, reviewNote]
    security:
      auth_mode: required
consumers:
  - name: app
    capabilities: [create_homepage_claim_request]
  - name: platform-ops
    capabilities: [review_homepage_claim_request]
