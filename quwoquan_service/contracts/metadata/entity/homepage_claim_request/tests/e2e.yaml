aggregate: HomepageClaimRequest
layer: e2e

description: |
  认领申请端云集成验证。App 只提交申请；审核经 platform-ops 面。

scenarios:
  - name: claim_submit_and_review
    steps:
      - user submits homepage claim with materials
      - governance operator approves via platform-ops
    assertions:
      - claim_status_transition_valid
      - homepage_claim_status_converges_to_claimed
      - claimed_owner_can_update_basics
