aggregate: HomepageClaimRequest
layer: contract

scenarios:
  - name: list_claim_governance_queue
    operation: ListHomepageClaimRequests
    assertions:
      - 默认只返回 pending_review 申请
      - 敏感资质材料仅向治理 operator 返回且日志脱敏
      - cursor 分页稳定且不重复不漏项

  - name: create_claim_request
    operation: CreateHomepageClaimRequest
    assertions:
      - status_201
      - claim_request_status_pending_review
      - 同一 persona 对同一主页重复提交 pending 申请返回 duplicate_pending_claim

  - name: review_claim_governance_only
    operation: ReviewHomepageClaimRequest
    assertions:
      - 非治理 operator 返回 permission_denied
      - approved 产生 HomepageClaimReviewed outbox 事实
      - Homepage 认领态由事件消费幂等推进，重复消费不重复变更

  - name: claim_idempotent_replay
    operation: CreateHomepageClaimRequest
    assertions:
      - 相同 Idempotency-Key 重放返回首次 receipt，不创建第二条申请
