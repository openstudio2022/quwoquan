version: 1
domain: entity
entity: HomepageClaimRequest
object_kind: aggregate_root

description: |
  共享主页认领申请。拥有申请、审核与审计生命周期；仅通过 homepageId 引用 Homepage，
  不作为 Homepage 的无界 owned member。

storage_backend: mongodb
capabilities:
  - auditable

business_rules:
  - requester persona 与 homepageId 创建后不可变
  - 同一 requester 对同一 homepage 只能有一个 pending 申请
  - reviewer 不能是 requester，且必须具备 claim review 权限
  - approved 或 rejected 后不可再次裁决
lifecycle:
  states: [pending, approved, rejected, withdrawn]
  optimistic_concurrency: version
  idempotency: command_receipt
