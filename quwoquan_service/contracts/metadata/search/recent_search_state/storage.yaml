entity: RecentSearchState
backend: mongodb
collections:
  recent_search_states:
    entity: RecentSearchState
    role: authoritative
    indexes:
      - { name: uq_recent_search_subject_scope, keys: { personaId: 1, scope: 1 }, unique: true }
      - { name: idx_recent_search_updated, keys: { updatedAt: -1 } }
      - { name: idx_recent_search_entry, keys: { personaId: 1, "entries.entryId": 1 } }

  recent_search_receipts:
    entity: RecentSearchState
    role: idempotency_receipt
    description: >
      RecentSearchState 命名 set 操作的幂等回执；状态变更时与 aggregate state
      在同一 Mongo transaction 提交，目标状态已满足时记录 no-op receipt。
      personaId 用于 UserAccountClosed 定向擦除；expiresAt 承载 24 小时重放窗口。
    ttl:
      field: expiresAt
      seconds: 86400
    indexes:
      - { name: idx_recent_search_receipts_persona, keys: { personaId: 1 } }
      - { name: idx_recent_search_receipts_expire, keys: { expiresAt: 1 }, expireAfterSeconds: 0 }

transaction:
  scope: [recent_search_states, recent_search_receipts]
  isolation: mongo_transaction
  guarantees:
    - version_cas
    - idempotency_receipt
