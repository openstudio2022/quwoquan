domain: search
entity: RecentSearchState
object_kind: aggregate_root
description: persona 的有界最近搜索状态，只经 Search Command Facade 修改。
storage_backend: mongodb
cache_layer: redis
cache_ttl_seconds: 300
capabilities: [commandable, queryable]
taggable: false
vector_enabled: false
business_rules:
  - 每个 persona 只有一个 RecentSearchState
  - entries 按 normalized query 去重并保持最近使用顺序
  - entries 数量不得超过配置的固定上限
  - 清除与新增只经 Search Command Facade，并使用服务端内部 version CAS
lifecycle:
  states: [active, cleared]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/search/recent_state
  ports: internal/domain/search/recent_search_state/ports
  application: internal/application/search
  adapter_rest: internal/adapter/rest/search
  adapter_event: internal/adapter/event/search
