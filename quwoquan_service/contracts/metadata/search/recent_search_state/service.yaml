service:
  name: search-service
  domain: search
  owner: identity-platform
  description: RecentSearchState 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: 对象专属 Store/outbox、transport 与 generated client 尚未完成生产装配
    gap_id: ACCOUNT_OBJECT_PACKET_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: GET
    path: /search/recent

    operation: ListRecentSearches
    actor: persona
    application:
      kind: query
      facet: RecentSearchQueryFacade
      method: listRecentSearches
      reader: ListRecentSearchesReader
      slice: ListRecentSearchesSlice
    description: 获取当前 Persona 的有界最近搜索状态
    response_entity: RecentSearchEntryView
    security:
      auth_mode: required
  - method: PUT
    path: /search/recent/{entryId}

    operation: UpsertRecentSearch
    actor: persona
    application:
      kind: command
      facet: RecentSearchCommandFacade
      method: upsertRecentSearch
      aggregate_owner: RecentSearchState
      mutation_target: RecentSearchState
      invariant_target: RecentSearchState
    description: 新增或更新最近搜索记录
    request_entity: RecentSearchEntryView
    request_fields: [query, scope, facet, updatedAt]
    response_entity: RecentSearchEntryView
    security:
      auth_mode: required
  - method: DELETE
    path: /search/recent/{entryId}

    operation: DeleteRecentSearch
    actor: persona
    application:
      kind: command
      facet: RecentSearchCommandFacade
      method: deleteRecentSearch
      aggregate_owner: RecentSearchState
      mutation_target: RecentSearchState
      invariant_target: RecentSearchState
    description: 删除单条最近搜索记录
    security:
      auth_mode: required
  - method: DELETE
    path: /search/recent

    operation: ClearRecentSearches
    actor: persona
    application:
      kind: command
      facet: RecentSearchCommandFacade
      method: clearRecentSearches
      aggregate_owner: RecentSearchState
      mutation_target: RecentSearchState
      invariant_target: RecentSearchState
    description: 清空当前账号最近搜索记录
    security:
      auth_mode: required