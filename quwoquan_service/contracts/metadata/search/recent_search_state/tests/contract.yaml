entity: RecentSearchState

scenarios:
  - name: recent_upsert_semantic_dedupe_and_bound
    operation: UpsertRecentSearch
    go_func: TestRecentSearchUpsertDedupesAndBounds
    evidence: api_integration
    assertions:
      - 同语义键（scope+facet+normalized query）重复 upsert 只保留一条并提升顺序
      - entryId 由服务端派生（sha256 语义键），响应回传
      - entries 超上限时淘汰最旧条目
      - 服务端内部 version CAS，公开请求不携带版本字段

  - name: recent_command_receipt_replay
    operation: UpsertRecentSearch
    go_func: TestRecentSearchIdempotencyReceiptReplay
    evidence: api_integration
    assertions:
      - 相同 Idempotency-Key 重放返回首次结果（replayed）
      - 相同 key 不同 payload 返回 SEARCH.USER.recent_idempotency_conflict

  - name: recent_delete_and_clear_noop_safe
    operation: DeleteRecentSearch
    go_func: TestRecentSearchDeleteAndClear
    evidence: api_integration
    assertions:
      - 删除不存在 entry 按 no-op receipt 重放安全（不递增版本）
      - clear 后 List 返回空；重复 clear 幂等

  - name: recent_owner_isolation
    operation: ListRecentSearches
    go_func: TestRecentSearchOwnerIsolation
    evidence: api_integration
    assertions:
      - 只返回当前 persona 的状态；未认证请求 401
