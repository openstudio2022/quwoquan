entity: RecentSearchState
layer: app_side

description: |
  端侧独立测试场景。登录态最近搜索以远端为真相源；游客态/离线使用本地
  SharedPreferences 缓存（表现层缓存，非第二真相源）。

dto_scenarios:
  - name: recent_entry_wire_roundtrip
    description: RecentSearchEntryWireDto 与 metadata 字段一致（entryId/query/scope/facet/updatedAt）
    assertions:
      - fromMap/toMap 逐字段一致
      - entryId 只读（客户端不生成）

port_scenarios:
  - name: upsert_uses_typed_port_without_client_entry_id
    description: RecentSearchCommandWriter.upsert 只提交 query/scope/facet
    assertions:
      - 请求 body keys == [query, scope, facet]
      - 不含 entryId/updatedAt/version
      - 失败经 CloudErrorMapper 产出结构化 CloudException（无裸 Exception）

  - name: coordinator_merges_remote_truth_with_guest_cache
    description: 登录态 hydrate 以远端为准；游客态回退本地缓存
    assertions:
      - 登录态远端结果覆盖本地展示
      - 远端失败时降级本地缓存并保留结构化错误日志
