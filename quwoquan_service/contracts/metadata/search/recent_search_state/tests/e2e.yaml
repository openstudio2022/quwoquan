entity: RecentSearchState
layer: e2e

description: |
  端云集成场景。app → gateway(/search/recent) → search-service → MongoDB。
  执行环境：gamma_local。CI 策略：advisory。

execution:
  environment: gamma_local
  ci_strategy: advisory
  trigger: pre-release
  runners:
    api_contract: gamma HTTP client
    ui_journey: Patrol / flutter integration_test

scenarios:
  - name: recent_search_roundtrip
    test_type: api_contract
    actors:
      app: RecentSearch typed port（Remote）
      gateway: /search/recent
      service: search-service RecentSearchCommandFacade/QueryFacade
      storage: MongoDB recent_search_states
    steps:
      - 登录 persona 执行一次搜索，端侧 upsert 最近搜索
      - List 回读按最近使用倒序
      - 删除单条后回读不含该条
      - clear 后回读为空
    assertions:
      - 同 query 重复搜索不产生重复条目
      - 跨设备（同 persona）回读一致（远端为真相源）

  - name: search_default_page_recent_journey
    test_type: ui_journey
    actors:
      app: lib/ui/search/pages/global_search_page.dart
    steps:
      - 打开搜索默认页展示最近搜索
      - 点击最近搜索词直达结果页
    assertions:
      - 游客态使用本地缓存，登录后与远端合并且远端优先
