domain: search
entity: SearchQuery
object_kind: append_only_fact

description: |
  一次 canonical 搜索请求的追加事实，承载查询日志并关联后续反馈，
  作为搜索词热力与 relevance 评测的派生数据源，不拥有搜索执行生命周期。
  搜索执行由 SearchFacade 调用具名 Reader，统一对象检索读库为派生 ES 索引
  quwoquan_objects，并由 search-service indexer 从各业务域灌入。

storage_backend: mongodb
cache_layer: redis
cache_ttl_seconds: 60

capabilities:
  - queryable
  - searchable

taggable: false
vector_enabled: false

ddd_layer_mapping:
  domain_model: services/search-service/internal/domain/query/model
  repository: services/search-service/internal/domain/query/repository
  application: services/search-service/internal/application
  adapter_rest: services/search-service/internal/adapters/http
  adapter_event: services/search-service/internal/adapters/mq
