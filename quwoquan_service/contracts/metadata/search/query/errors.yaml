entity: SearchQuery
domain: SEARCH

# search 域共享错误 + SearchQuery/ReportSearchFeedback 专属错误。
# Go 侧经 runtime/errors helper（NewInvalidArgument/NewUnavailable）或
# NewAppError(NewCode(ModuleSearch, ...)) 构造，禁止硬编码 code 字符串。

errors:
  - code: SEARCH.USER.invalid_argument
    kind: USER
    reason: invalid_argument
    http_status: 400
    recovery_action: surface
    dart_const: searchInvalidArgument
    go_const: ErrSearchInvalidArgument
    user_message:
      zh: "搜索请求格式不正确"
      en: "Invalid search request"

  - code: SEARCH.USER.feedback_conflict
    kind: USER
    reason: feedback_conflict
    http_status: 409
    recovery_action: surface
    dart_const: searchFeedbackConflict
    go_const: ErrSearchFeedbackConflict
    user_message:
      zh: "该搜索反馈已记录"
      en: "This search feedback has already been recorded"

  - code: SEARCH.MIDDLEWARE.unavailable
    kind: MIDDLEWARE
    reason: unavailable
    http_status: 503
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: searchUnavailable
    go_const: ErrSearchUnavailable
    user_message:
      zh: "搜索暂时不可用，请稍后再试"
      en: "Search is temporarily unavailable, please retry later"

  - code: SEARCH.SYSTEM.storage_write_failed
    kind: SYSTEM
    reason: storage_write_failed
    http_status: 500
    recovery_action: retry
    recovery_after_seconds: 5
    dart_const: searchStorageWriteFailed
    go_const: ErrSearchStorageWriteFailed
    user_message:
      zh: "搜索反馈暂时无法记录，请稍后重试"
      en: "Unable to record search feedback, please retry"
