entity: SearchQuery
layer: e2e

description: |
  端云集成场景。app → gateway(/search*) → search-service → ES/Mongo/Redis 全链路。
  执行环境：gamma_local。CI 策略：advisory（发布前必须全绿）。

execution:
  environment: gamma_local
  ci_strategy: advisory
  trigger: pre-release
  runners:
    api_contract: gamma HTTP client
    ui_journey: Patrol / flutter integration_test

scenarios:
  - name: hot_query_feedback_loop
    test_type: api_contract
    actors:
      app: SearchHotQueryReader
      service: search-service GET /search/hot-queries
      storage: MongoDB rm_search_term_heat
    steps:
      - 连续提交带查询词的 SearchQuery
      - term-heat rebuild 生成 relevance 排名
      - app 调用 ListHotQueries
    assertions:
      - 返回 query/relevance 且 relevance 降序
      - 默认页不维护端侧业务词表

  - name: search_result_roundtrip
    test_type: api_contract
    actors:
      app: lib/cloud/remote/search/search_query_remote.dart
      gateway: /search
      service: search-service POST /search
      storage: ES quwoquan_objects + MongoDB search_queries
    steps:
      - app 发起 result 模式搜索
      - gateway 按 /search* 路由 search-service
      - search-service 走 ES 主召回（不可用则 native 回退）
      - 响应携带 requestId + rankingVersion
      - search_queries 落一条查询日志
    assertions:
      - response.requestId 以稳定前缀返回且贯穿反馈链
      - ES 停机时结果仍可用（native fallback）或诚实 503
      - content hit 经 generated typed operation 解码，不调用 content-service 搜索旁路

  - name: search_feedback_to_recommendation_signal
    test_type: api_contract
    actors:
      app: SearchFeedback Remote writer
      service: search-service POST /search/feedback
      stream: events.search.recommendation_signals
      consumer: content-service search_signal_consumer
    steps:
      - app 上报 click 反馈（携带 requestId + rankPosition + referralSource）
      - search-service 落 search_feedback_events（语义键 dedupe）
      - 推荐信号被 content-service 消费进 rm_recommend_feature
    assertions:
      - 重复上报不产生第二条事实
      - 消费侧按 searchRequestId 幂等
