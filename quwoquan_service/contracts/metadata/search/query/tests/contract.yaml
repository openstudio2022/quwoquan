entity: SearchQuery

scenarios:
  - name: search_query_es_primary_native_fallback
    operation: SearchQuery
    go_func: TestSearchEndpointESBackedHits
    evidence: api_integration
    assertions:
      - ES 健康时返回 ES 召回结果并携带 ranking envelope
      - ES 不可用时透明回退 native 召回；纯 ES 故障且无 native 返回 503
      - 空 query 返回 SEARCH.USER.invalid_argument

  - name: search_query_logged_fact
    operation: SearchQuery
    go_func: TestSearchQueryLoggedToMongo
    evidence: api_integration
    assertions:
      - search_queries 按 searchRequestId 幂等 upsert（唯一索引 idx_search_queries_request）
      - 查询日志 TTL 与 storage.yaml 声明一致（90 天）
      - 推荐信号经 events.search.recommendation_signals Redis Stream 发布

  - name: canonical_content_hit_attribution
    operation: SearchQuery
    go_func: TestSearchEndpointReturnsTypedContentHitAttribution
    evidence: api_integration
    assertions:
      - content hit 只从 POST /search 返回，不存在 /content/posts/search 查询旁路
      - requestId、rankPosition、connectionState 与 intersectionReason 由 search-service 原样归因
      - relatedTerms 只来自 term-heat，空时客户端不合成本地词

  - name: hot_queries_from_term_heat
    operation: ListHotQueries
    go_func: TestHotQueriesReturnsTermHeatRanking
    evidence: api_integration
    assertions:
      - query log 重建 term-heat 后按 relevance 降序返回
      - 返回词来自 rm_search_term_heat，不含端侧硬编码业务词表
      - Mongo/term-heat reader 未装配时返回 SEARCH.MIDDLEWARE.unavailable

  - name: report_search_feedback_dedupe
    operation: ReportSearchFeedback
    go_func: TestFeedbackEndpointAcceptsEvent
    evidence: api_integration
    assertions:
      - 缺 searchRequestId/eventType 返回 SEARCH.USER.invalid_argument
      - 同 (searchRequestId, eventType, objectId) 语义键重复追加幂等返回首次结果
      - 事实落 search_feedback_events 且 TTL 与 storage.yaml 一致

  - name: search_feedback_signal_consumed
    operation: ReportSearchFeedback
    go_func: TestSearchRecommendationSignalEventContract
    evidence: api_integration
    assertions:
      - content-service 消费组按 searchRequestId dedupe（SetNX 24h）
      - 消费失败回滚 dedup key 并进入 DLQ
