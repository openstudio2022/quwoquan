aggregate: SearchQuery
backend: mongodb

collections:
  search_queries:
    entity: SearchQuery
    indexes:
      - { name: idx_search_queries_request, keys: { searchRequestId: 1 }, unique: true }
      - { name: idx_search_queries_created, keys: { createdAt: -1 } }
      - { name: idx_search_queries_query_created, keys: { query: 1, createdAt: -1 } }
      - { name: idx_search_queries_viewer_created, keys: { viewerId: 1, createdAt: -1 } }
    # TTL: 查询日志为派生数据，90 天后过期回收（聚合读模型由 query-heat lambda 重建）。
    ttl:
      field: createdAt
      seconds: 7776000

  search_feedback_events:
    entity: SearchFeedbackEvent
    indexes:
      - { name: idx_search_feedback_request, keys: { searchRequestId: 1, createdAt: -1 } }
      - { name: idx_search_feedback_viewer_created, keys: { viewerId: 1, createdAt: -1 } }
      - { name: idx_search_feedback_object, keys: { objectId: 1, eventType: 1, createdAt: -1 } }
    ttl:
      field: createdAt
      seconds: 7776000

  search_user_account_closed_inbox:
    entity: UserAccountClosedProjectionInbox
    role: append_only
    description: >
      Search 对 UserAccountClosed 的 eventId+digest 幂等 inbox；与私有搜索状态、
      查询日志、反馈事实和受影响热词删除在同一 Mongo transaction 提交。
    indexes:
      - { name: idx_search_user_account_closed_applied, keys: { appliedAt: -1 } }

  search_user_account_closed_failures:
    entity: UserAccountClosedProjectionFailure
    role: append_only
    description: pending reclaim 的有限重试状态，仅保存 event/error digest。
    indexes:
      - { name: idx_search_user_account_closed_failure_event, keys: { eventDigest: 1 } }
      - { name: ttl_search_user_account_closed_failures, keys: { expireAt: 1 }, expireAfterSeconds: 0 }

# Derived read store (not the aggregate's source of truth): the unified object
# index lives in the dedicated ES/OpenSearch cluster, managed by runtime/search/es.
external_read_index:
  backend: elasticsearch
  index: quwoquan_objects
  note: 派生检索读库，由 search-service indexer 从各业务域 change-stream 灌入；可重建/回放。

# Derived read models (rebuildable from the query/feedback logs above; NOT a
# source of truth). search-service 的 query-heat builder 周期性挖掘并 upsert；
# TTL 回收过期聚合，使排序消费的热力始终来自近期窗口。单一真相源：infra 常量
# 由 TestStorageTTLMatchesMetadata 锁定到这里，禁止漂移。
derived_read_models:
  rm_search_term_heat:
    backend: mongodb
    description: 搜索词热力/相关性聚合（词频 + 时间衰减 + CTR 加权 + query→点击对象相关性）
    write_source: [search_queries, search_feedback_events]
    indexes:
      - { name: idx_search_term_heat_term, keys: { normalizedTerm: 1 }, unique: true }
      - { name: idx_search_term_heat_relevance, keys: { relevance: -1 } }
      - { name: idx_search_term_heat_ttl, keys: { updatedAt: 1 } }
    ttl:
      field: updatedAt
      seconds: 86400  # 24h：热力为滑动窗口派生，过期回收并由 builder 重建
