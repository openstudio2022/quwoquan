version: 1
read_model: SearchResponseView

description: |
  POST /v1/search 响应 envelope。服务端返回 runtime/search.RetrieveResponse
  的 hits/citations/facets/degradeSignals/provenance，并补充 requestId、
  rankingVersion、experimentBucket、relatedTerms。App 结果模式按 hits 平铺消费，
  搜索反馈与推荐信号回流以 requestId/rankingVersion 归因。

source_entities:
  - SearchQuery

source_events:
  - SearchQueryLogged

consumers:
  - app
  - assistant-service
  - recommendation-engine

fields:
  - { name: hits, type: "[]object", description: "统一检索命中列表，元素字段由 runtime/search.RetrieveHit 单一真相源维护" }
  - { name: citations, type: "[]object", description: "检索证据/引用，透传 runtime/search.RetrieveResponse" }
  - { name: facets, type: "[]object", description: "检索聚合分面，透传 runtime/search.RetrieveResponse" }
  - { name: degradeSignals, type: "[]object", description: "降级信号，用于端侧提示与服务观测" }
  - { name: provenance, type: object, description: "召回后端与排序来源信息" }
  - { name: relatedTerms, type: "[]string", description: "相关搜索词，空表示未产生建议" }
  - { name: rankingVersion, type: string, description: "搜索排序版本，反馈和推荐回流归因使用" }
  - { name: experimentBucket, type: string, nullable: true, description: "搜索实验桶，低流量时可为空" }
  - { name: requestId, type: string, description: "搜索请求 ID，对齐 HTTP X-Request-Id 或服务端生成值" }
