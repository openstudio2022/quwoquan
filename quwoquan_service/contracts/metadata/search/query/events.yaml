version: 1
aggregate: SearchQuery

events:
  - name: SearchQueryLogged
    description: 一次搜索请求被记录，进入查询日志用于搜索词热力聚合
    producer: search-service
    consumers: [recommendation-engine]
    channel: event_store
    payload_entity: SearchQuery
    payload_fields: [searchRequestId, query, mode, objectTypes, resultCount, rankingVersion, experimentBucket, createdAt]

  - name: SearchFeedbackRecorded
    description: 搜索结果交互反馈被记录，驱动 CTR/停留信号与去位置偏置
    producer: search-service
    consumers: [recommendation-engine]
    channel: event_store
    payload_entity: SearchFeedbackEvent
    payload_fields: [searchRequestId, eventType, objectId, target, rankPosition, referralSource, feedRequestId, dwellMs, createdAt]

  - name: SearchRecommendationSignalPublished
    description: 搜索查询及 term-heat 相关上下文被发布到推荐在线特征流，用于首页 Feed 排序
    producer: search-service
    consumers: [content-service]
    channel: redis_stream
    stream: events.search.recommendation_signals
    payload_entity: SearchRecommendationSignal
    payload_fields: [searchRequestId, sessionId, userId, query, normalizedQuery, relatedTerms, topClickedObjectIds, rankingVersion, experimentBucket, resultCount, createdAt]
