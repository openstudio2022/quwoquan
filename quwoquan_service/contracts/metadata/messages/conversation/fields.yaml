version: 2
aggregate: Conversation

entities:
  Conversation:
    description: 会话（聚合根，v2 轻量化）
    fields:
      - name: _id
        type: ObjectId
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: type
        type: enum
        enum_ref: ConversationType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: direct/group/encrypted（既有 circle 输入与存量记录按 group 主语义解析；assistant 不再是独立会话类型，小趣通过成员邀请参与任意会话）

      - name: title
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        search_field: true

      - name: avatarUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: groupAvatarAssetId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 群头像预合成结果资产 ID；仅群聊会话使用

      - name: groupAvatarVersion
        type: int64
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 群头像版本号；服务端每次预合成成功后单调递增

      - name: groupAvatarSourceHash
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 基于 top9 成员与头像版本计算的输入哈希；未变化则可跳过重算

      - name: creatorId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: initialMemberIds
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: write
        ops_exposure: read
        description: 建群时一次性写入的初始成员 ID 列表（不包含创建者）

      - name: circleId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 关联圈子；有值时表示该会话为圈子发起/绑定的默认群，但会话主类型仍为 group

      - name: circleGroupId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 关联 CircleGroup（默认公共群 / 自建群 / 组织节点）

      - name: entityId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 关联共享实体 / Homepage；仅作为群来源快照，主页仍通过 relatedGroups 间接进入群会话，不直接拥有 conversation

      - name: originType
        type: enum
        enum_ref: ConversationOriginType
        constraints: [NOT_NULL, DEFAULT_DIRECT_INIT]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 会话创建来源；用于区分直接私信、打招呼升级、临时群、圈子默认群、圈子自建群、组织节点群、主页相关群和助手邀请等来源语义

      - name: bindingType
        type: enum
        enum_ref: ConversationBindingType
        constraints: [NOT_NULL, DEFAULT_NONE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 会话绑定对象类型；主页仅通过 related groups 间接进入群会话，不直接拥有 conversation

      - name: lifecyclePolicy
        type: enum
        enum_ref: ConversationLifecyclePolicy
        constraints: [NOT_NULL, DEFAULT_PERSISTENT]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 会话生命周期策略；临时群、自建群、圈子绑定群和组织节点群通过该字段表达生命周期差异

      - name: maxSeq
        type: int64
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 当前会话最大消息 seq（冗余，加速 gap 判定）

      - name: memberCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 当前成员数（冗余，避免 count 查询）

      - name: membersRosterRevision
        type: int64
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: |
          群 roster/设置影响面修订号，仅由 chat-service 在事务内单调递增。
          任意影响「成员列表、群名称、群管理规则（可见设置项）」的变更均须与 Conversation.updatedAt 一并更新。
          客户端用其与本地缓存比对，决定重拉 GetConversation / ListMembers / 群设置。

      - name: maxGroupSize
        type: int
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write
        description: 群上限（默认 1000，可配置）

      - name: receiptEnabled
        type: bool
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write
        description: 是否启用已读回执（≤50 人默认 true，>50 默认 false，可配置覆盖）

      - name: lastMessageId
        type: ObjectId
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: lastMessagePreview
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: lastMessageTime
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: messageCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: status
        type: enum
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: active/archived/deleted

      - name: originRequestId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 升级来源的 GreetingRequest.id（originType=greeting_reply 时有值）

      - name: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  ChatInbox:
