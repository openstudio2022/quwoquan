version: 1
aggregate: Conversation
layer: app_side

description: |
  端侧独立测试场景。执行：flutter test test/local_contract/cloud/chat/

scenarios:
  - name: chat_inbox_dto_parse
    description: ChatInboxDto 解析（含 mention/unread、讨论头像主字段、头像拼图汇总与最近消息类型）
    assertions:
      - required_fields_non_empty
      - group_avatar_url_optional
      - avatar_composite_urls_preserved
      - mention_unread_count_non_negative
      - last_message_truncated_at_100chars

  - name: inbox_badge_decrement
    description: 已读后 unreadCount / mentionUnreadCount 递减
    assertions:
      - unread_count_decremented_after_mark_read
      - mention_unread_count_decremented_after_mark_read

  - name: commercial_message_home_rows
    description: 商用消息首页行解析，覆盖 conversation 与 notification 两类行
    route: GET /v1/chat/message-home
    variants: [all, unread, group, direct, notification]
    assertions:
      - items_match_message_home_row_schema
      - group_rows_use_server_avatar_url
      - notification_rows_have_notification_id
      - app_does_not_parse_notification_from_title

  - name: commercial_contact_home_rows
    description: 商用联系首页行解析，覆盖用户、圈子和讨论
    route: GET /v1/chat/contact-home
    variants: [all, mutual, circle, group]
    assertions:
      - items_match_contact_home_row_schema
      - intersection_labels_max_two
      - group_rows_have_source_and_member_count
      - app_does_not_build_source_summary

  - name: commercial_group_home
    description: 讨论页顶部与聊天信息页共享同一个 GroupHome DTO
    route: GET /v1/chat/groups/{conversationId}/home
    assertions:
      - title_member_count_sources_present
      - capability_entries_include_album_file_event_member
      - group_avatar_url_present

  - name: error_code_mapping
    cases:
      - http_status: 429, code: CHAT.USER.rate_limited
        expected_dart_const: rateLimited
      - http_status: 400, code: CHAT.USER.message_too_long
        expected_dart_const: messageTooLong
