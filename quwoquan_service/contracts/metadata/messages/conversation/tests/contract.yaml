aggregate: Conversation
layer: service_side

description: |
  Conversation 聚合云侧契约测试场景（真实 MongoDB + Redis）。
  执行：go test ./services/chat-service/...

real_engines:
  mongodb: testcontainers (mongo:7)
  redis: miniredis/v2

spy_targets: [event_publisher]
mock_targets: [cross_service_clients, push_notification_client]

scenarios:
  - name: create_direct_conversation_unique
    command: CreateConversation
    assertions:
      - duplicate_direct_participants_return_existing_conversation
      - state_receipt_outbox_committed_in_one_transaction

  - name: create_group_conversation_idempotent
    command: CreateConversation
    assertions:
      - same_idempotency_key_replays_first_conversation
      - different_command_same_key_returns_idempotency_conflict

  - name: update_title_governance_and_noop
    command: UpdateConversationTitle
    assertions:
      - non_owner_or_admin_rejected_with_group_governance_forbidden
      - unchanged_title_persists_noop_receipt_without_new_outbox_event

  - name: dissolve_conversation_noop_replay
    command: DissolveConversation
    assertions:
      - owner_only
      - archived_state_receipt_outbox_same_transaction
      - repeat_dissolve_replays_original_receipt

  - name: conversation_events_via_outbox
    command: CreateConversation / UpdateConversationTitle
    assertions:
      - events_written_to_conversations_outbox_in_commit_transaction
      - relay_publishes_and_marks_dispatched
      - no_direct_goroutine_publish

  - name: commercial_message_home_projection
    command: ListMessageHome
    assertions:
      - chat_inbox_rows_sorted_by_pinned_then_last_active
      - notification_rows_loaded_from_persistent_app_message_inbox
      - filter_group_direct_unread_notification_are_disjoint
      - read_state_consistent_after_mark_as_read
      - group_rows_use_server_avatar_url

  - name: commercial_contact_home_projection
    command: ListContactHome
    assertions:
      - all_rows_mix_users_and_groups_by_recent_interaction
      - mutual_rows_only_relation_state_mutual
      - circle_rows_resolve_from_circle_projection
      - group_rows_resolve_from_joined_group_conversations
      - intersection_labels_max_two

  - name: commercial_group_home_projection
    command: GetGroupHome
    assertions:
      - group_home_reuses_conversation_and_member_count
      - source_entity_and_circle_are_projected
      - capabilities_include_album_file_event_member
      - can_dissolve_depends_on_binding_and_role

  - name: inbox_projection_from_outbox
    command: ListInbox
    assertions:
      - message_sent_event_advances_inbox_unread_and_last_message
      - read_watermark_event_clears_unread
      - projection_checkpoint_is_replayable
