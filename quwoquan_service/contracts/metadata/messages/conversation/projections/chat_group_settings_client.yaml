read_model: ChatGroupSettings
description: |
  群管理页治理开关与圈子绑定信息（从 GetConversation 权威字段解析）。
  仅承载有权威对象链支撑的开关；扫码进群/进群审批/隐私盾随 JoinRequest
  对象链落地后再恢复，不保留假开关。

client_projection:
  dart_class: ChatGroupSettingsDto
  base_class: ""
  output_path: cloud/runtime/generated/chat/chat_group_settings_dto.g.dart
  fields:
    - name: nameEditableByAdminOnly
      dart_type: bool
      nullable: false
      source: nameEditableByAdminOnly
      default: "false"

    - name: conversationType
      dart_type: String
      nullable: false
      source: type
      default: "'group'"

    - name: circleId
      dart_type: String
      nullable: false
      source: circleId
      default: "''"
