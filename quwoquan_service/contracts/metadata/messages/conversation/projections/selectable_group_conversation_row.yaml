read_model: SelectableGroupConversationRow
description: |
  ListSelectableGroupConversations 返回的群行（wire），用于「从群聊/圈子中选择联系人」来源列表（图四）。
  每行表示一个当前用户所在、且含互关联系人的群会话；friendMemberCount 为群成员中与当前用户互关的联系人数，
  memberCount 为群总成员数。circleId 非空表示圈子绑定群，供服务端 source 过滤与端侧来源语义展示；
  avatarUrl 为服务端会话头像（可能为空，端侧按群占位兜底）。

client_projection:
  dart_class: SelectableGroupConversationRowDto
  base_class: ""
  output_path: cloud/runtime/generated/chat/selectable_group_conversation_row_dto.g.dart
  fields:
    - name: conversationId
      dart_type: String
      nullable: false
      source: conversationId
      default: "''"

    - name: title
      dart_type: String
      nullable: false
      source: title
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      default: "''"

    - name: circleId
      dart_type: String
      nullable: false
      source: circleId
      default: "''"

    - name: friendMemberCount
      dart_type: int
      nullable: false
      source: friendMemberCount
      default: "0"

    - name: memberCount
      dart_type: int
      nullable: false
      source: memberCount
      default: "0"
