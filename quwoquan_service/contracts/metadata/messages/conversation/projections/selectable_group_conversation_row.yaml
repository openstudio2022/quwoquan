version: 2
read_model: SelectableGroupConversationRow
description: |
  ListSelectableGroupConversations 返回的群行（wire），用于「从群聊中选择联系人」群列表（图四）。
  每行表示一个当前用户所在、且含互关联系人的群会话；friendMemberCount 为群成员中与当前用户互关的联系人数，
  memberCount 为群总成员数。avatarUrl 为服务端会话头像（可能为空，端侧按群占位兜底）。

client_projection:
  dart_class: SelectableGroupConversationRowDto
  base_class: ""
  output_path: cloud/runtime/generated/chat/selectable_group_conversation_row_dto.g.dart
  fields:
    - name: conversationId
      dart_type: String
      nullable: false
      source: conversationId
      aliases: [conversationId, id, _id]
      default: "''"

    - name: title
      dart_type: String
      nullable: false
      source: title
      aliases: [title]
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      aliases: [avatarUrl, avatar]
      default: "''"

    - name: friendMemberCount
      dart_type: int
      nullable: false
      source: friendMemberCount
      aliases: [friendMemberCount, friendCount]
      default: "0"

    - name: memberCount
      dart_type: int
      nullable: false
      source: memberCount
      aliases: [memberCount]
      default: "0"
