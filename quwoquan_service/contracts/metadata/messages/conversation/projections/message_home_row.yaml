version: 1
read_model: MessageHomeRow
description: |
  商用消息首页行。由 ChatInboxProjection 与 NotificationInboxProjection 聚合。
  App 只消费本 read model，不在 UI/Provider 中根据标题或摘要推导通知、群聊或私聊分类。

client_projection:
  dart_class: MessageHomeRowDto
  base_class: ""
  output_path: cloud/runtime/generated/chat/message_home_row_dto.g.dart
  fields:
    - name: id
      dart_type: String
      nullable: false
      source: id
      aliases: [id, conversationId, messageId]
      default: "''"
    - name: kind
      dart_type: String
      nullable: false
      source: kind
      aliases: [kind, rowKind]
      default: "'conversation'"
    - name: conversationId
      dart_type: String
      nullable: false
      source: conversationId
      aliases: [conversationId]
      default: "''"
    - name: notificationId
      dart_type: String
      nullable: false
      source: notificationId
      aliases: [notificationId, appMessageId]
      default: "''"
    - name: conversationType
      dart_type: String
      nullable: false
      source: conversationType
      aliases: [conversationType, type]
      default: "''"
    - name: title
      dart_type: String
      nullable: false
      source: title
      aliases: [title]
      default: "''"
    - name: summary
      dart_type: String
      nullable: false
      source: summary
      aliases: [summary, subtitle, lastMessagePreview]
      default: "''"
    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      aliases: [avatarUrl, avatar]
      default: "''"
    - name: groupAvatarVersion
      dart_type: int
      nullable: false
      source: groupAvatarVersion
      aliases: [groupAvatarVersion]
      default: "0"
    - name: lastActiveAt
      dart_type: DateTime
      nullable: true
      source: lastActiveAt
      aliases: [lastActiveAt, lastMessageTime, createdAt, updatedAt]
      default: "null"
    - name: unreadCount
      dart_type: int
      nullable: false
      source: unreadCount
      aliases: [unreadCount]
      default: "0"
    - name: mentionUnreadCount
      dart_type: int
      nullable: false
      source: mentionUnreadCount
      aliases: [mentionUnreadCount]
      default: "0"
    - name: muted
      dart_type: bool
      nullable: false
      source: muted
      aliases: [muted]
      default: "false"
    - name: pinned
      dart_type: bool
      nullable: false
      source: pinned
      aliases: [pinned]
      default: "false"
    - name: notificationType
      dart_type: String
      nullable: false
      source: notificationType
      aliases: [notificationType, messageType]
      default: "''"
    - name: read
      dart_type: bool
      nullable: false
      source: read
      aliases: [read, isRead]
      default: "false"
