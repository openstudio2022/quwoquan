
service:
  name: chat-service
  domain: chat
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: operation 尚未逐项完成商业证据绑定
    gap_id: CHAT_CONVERSATION_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 会话管理、消息收发（seq 有序 + clientMsgId 幂等）、讨论成员、离线同步、已读回执、小趣助手会话内参与

api_routes:
  # ── 会话 ──────────────────────────────────────
  - method: GET
    path: /chat/conversations

    operation: ListConversations
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: ConversationQueryFacet
      method: listConversations
      reader: ConversationListReader
      slice: ConversationPageSlice
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 会话列表（由 ConversationUserState 驱动排序，返回 maxSeq）
    query_params: [cursor, limit]
    response_entity: Conversation
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /chat/conversations/timestamps

    operation: ListConversationTimestamps
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: ConversationQueryFacet
      method: listConversationTimestamps
      reader: ConversationTimestampReader
      slice: ConversationTimestampIndexSlice
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 会话时间戳索引（用于本地缓存增量同步）
    response_entity: Conversation
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /chat/conversations

    operation: CreateConversation
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: ConversationLifecycleCommandFacet
      method: createConversation
      aggregate_owner: Conversation
      mutation_target: Conversation
      invariant_target: Conversation
    authorization:
      principal: persona
      ownership_policy: self
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    privacy:
      request_classification: SENSITIVE
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_command
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: |
      创建会话（自动创建 ConversationMember + ConversationUserState；圈子发起的默认群仍使用 group + circleId）。
      direct 会话按参与者对唯一：重复创建返回既有会话；group 创建以 Idempotency-Key receipt 保证重放返回首个会话。
      group 的 maxGroupSize 缺省为 1000 且不可超过 1000；direct/encrypted 固定为 2。
    request_entity: Conversation
    writable_fields: [type, title, circleId, circleGroupId, originType, bindingType, lifecyclePolicy, maxGroupSize, initialMemberIds]
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.not_mutual, CHAT.USER.greeting_required, CHAT.USER.blocked, CHAT.USER.group_member_not_mutual, CHAT.USER.group_member_blocked, CHAT.USER.group_full, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /chat/conversations/batch

    operation: BatchGetConversations
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: ConversationQueryFacet
      method: batchGetConversations
      reader: BatchConversationReader
      slice: ConversationBatchSlice
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 批量拉取指定会话的完整信息（仅返回请求者为成员的会话）
    response_entity: Conversation
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /chat/conversations/{conversationId}

    operation: GetConversation
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: ConversationQueryFacet
      method: getConversation
      reader: ConversationDetailReader
      slice: ConversationDetailSlice
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 会话详情（含 maxSeq、memberCount、membersRosterRevision、updatedAt；群设置页与聊天信息页共用本事实源，App 不得另建群设置读取旁路）
    response_entity: Conversation
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: PATCH
    path: /chat/conversations/{conversationId}

    operation: UpdateConversationTitle
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: ConversationLifecycleCommandFacet
      method: updateConversationTitle
      aggregate_owner: Conversation
      mutation_target: Conversation
      invariant_target: Conversation
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_command
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: |
      更新会话展示标题。HTTP 门槛为会话成员；当群治理开关 nameEditableByAdminOnly=true 时，
      聚合 invariant 仅放行 owner/admin（否则返回 group_governance_forbidden）。
      商用路径只允许更新标题；群来源、成员数、头像和绑定对象由服务端投影维护。标题已一致为 no-op 并重放原回执。
    writable_fields: [title]
    response_entity: Conversation
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.USER.group_governance_forbidden, CHAT.USER.conversation_dissolved, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: PATCH
    path: /chat/conversations/{conversationId}/announcement

    operation: UpdateAnnouncement
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: ConversationGovernanceCommandFacet
      method: updateAnnouncement
      aggregate_owner: Conversation
      mutation_target: Conversation
      invariant_target: Conversation
    authorization:
      principal: persona
      ownership_policy: conversation_owner_or_admin
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_command
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: |
      更新群公告（仅群聊；owner/admin）。发布非空公告时同事务写入一条
      type=system_announcement 的会话消息触达全员（公告即触达）；
      公告内容一致为 no-op 并重放原回执。
    writable_fields: [announcement]
    response_entity: Conversation
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.USER.group_governance_forbidden, CHAT.USER.conversation_dissolved, CHAT.USER.message_too_long, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: PATCH
    path: /chat/conversations/{conversationId}/governance

    operation: UpdateGroupGovernanceSettings
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: ConversationGovernanceCommandFacet
      method: updateGroupGovernanceSettings
      aggregate_owner: Conversation
      mutation_target: Conversation
      invariant_target: Conversation
    authorization:
      principal: persona
      ownership_policy: conversation_owner_or_admin
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_command
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: |
      更新群治理开关（仅群聊；owner/admin）。当前唯一开关：nameEditableByAdminOnly。
      设置一致为 no-op 并重放原回执；变更递增 membersRosterRevision 并发布
      ConversationRosterUpdated(aspects=[governance]) 供端侧定点刷新。
    writable_fields: [nameEditableByAdminOnly]
    response_entity: Conversation
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.USER.group_governance_forbidden, CHAT.USER.conversation_dissolved, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  # ── 已读回执 ──────────────────────────────────
  - method: GET
    path: /chat/conversations/{conversationId}/messages/{messageId}/receipts

    operation: GetReceipts
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: MessageReceiptQueryFacet
      method: getReceipts
      reader: MessageReceiptReader
      slice: MessageReceiptPageSlice
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 获取消息回执列表（仅 receiptEnabled 会话可用；读取 MessageReceiptFact append-only 事实）
    response_entity: MessageReceipt
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.blocked, CHAT.USER.message_not_found, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: DELETE
    path: /chat/conversations/{conversationId}

    operation: DissolveConversation
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: ConversationGovernanceCommandFacet
      method: dissolveConversation
      aggregate_owner: Conversation
      mutation_target: Conversation
      invariant_target: Conversation
    authorization:
      principal: persona
      ownership_policy: conversation_owner
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_command
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: |
      解散群聊（仅群主；圈子绑定群禁止）。写入终态 status=dissolved 并发布
      ConversationDissolved 事件实时收敛成员端；已解散重复请求为 no-op 并重放原回执。
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.USER.group_governance_forbidden, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  # ── 收件箱 ──────────────────────────────────
  - method: GET
    path: /chat/inbox

    operation: ListInbox
    actor: persona
    commercial:
      status: ready
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_inbox_list
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    application:
      kind: query
      facet: ConversationInboxQueryFacet
      method: listInbox
      reader: ChatInboxReader
      slice: ChatInboxPageSlice
    description: 用户收件箱（基于 ChatInbox per-user 投影，返回最近会话列表 + unreadCount + mentionUnreadCount + 服务端预合成头像）
    query_params: [cursor, limit]
    response_entity: ChatInbox
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /chat/message-home

    operation: ListMessageHome
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: MessageHomeQueryFacet
      method: listMessageHome
      reader: MessageHomeReader
      slice: MessageHomePageSlice
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 商用消息首页聚合行。conversation 行来自 ChatInboxProjection/read watermark，MarkAsRead 后 all/unread/group/direct 中同一会话的 unreadCount 必须一致；notification 行来自 notification-service/AppMessage inbox；App 不得自行拼接通知。
    query_params: [filter, cursor, limit]
    response_entity: MessageHomeRow
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  # ── 联系人 ──────────────────────────────
  - method: GET
    path: /chat/contacts

    operation: ListContacts
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: ContactQueryFacet
      method: listContacts
      reader: ContactListReader
      slice: ContactPageSlice
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 联系人列表
    response_entity: ChatContactListRow
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /chat/contact-home

    operation: ListContactHome
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: ContactQueryFacet
      method: listContactHome
      reader: ContactHomeReader
      slice: ContactHomePageSlice
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 商用联系首页聚合行，覆盖全部/互关/圈子/讨论。来源、交集、成员数、最近互动均由云端 read model 提供；wire filter 仍为 group。
    query_params: [filter, cursor, limit]
    response_entity: ContactHomeRow
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: GET
    path: /chat/groups/{conversationId}/home

    operation: GetGroupHome
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: GroupHomeQueryFacet
      method: getGroupHome
      reader: GroupHomeReader
      slice: GroupHomeSlice
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 商用讨论主页 / 聊天信息页统一事实源，供聊天页顶部和聊天信息页消费。
    response_entity: GroupHome
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: GET
    path: /chat/group-candidates

    operation: ListGroupCandidates
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: GroupCandidateQueryFacet
      method: listGroupCandidates
      reader: GroupCandidateReader
      slice: GroupCandidatePageSlice
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 发起讨论/添加成员候选源，由 chat-service 聚合互关联系人、可复用 group 会话成员，并排除当前会话已有成员；前端不得再自行拼装 inbox + contacts + circles
    query_params: [conversationId, cursor, limit]
    response_entity: ChatContactListRow
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: GET
    path: /chat/selectable-group-conversations

    operation: ListSelectableGroupConversations
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: GroupCandidateQueryFacet
      method: listSelectableGroupConversations
      reader: SelectableGroupConversationReader
      slice: SelectableGroupConversationPageSlice
    authorization:
      principal: persona
      ownership_policy: active_persona_inbox
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: |
      「从群聊/圈子中选择联系人」来源列表（图四）。返回当前用户所在、且含与当前用户互关联系人的群会话，并给出每个群的互关好友数 friendMemberCount。
      由 chat-service 聚合会话成员与关系能力（relationship gate）计算交集，friendMemberCount==0 的群不返回；前端不得再自行多次拉取成员逐群求交集。
      可选 source=group 仅返回 circleId 为空的私建群，source=circle 仅返回 circleId 非空的圈子绑定群；其它值拒绝，避免端侧分页后过滤导致来源漏项。
    query_params: [cursor, limit, query, source]
    response_entity: SelectableGroupConversationRow
    error_codes: [CHAT.USER.unauthorized, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
  - method: GET
    path: /chat/selectable-group-conversations/{conversationId}/contact-members

    operation: ListSelectableGroupContactMembers
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: GroupCandidateQueryFacet
      method: listSelectableGroupContactMembers
      reader: SelectableGroupContactReader
      slice: SelectableGroupContactPageSlice
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_conversation_query
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: |
      「从群聊中选择联系人」群成员列表（图五）。返回指定群成员中与当前用户互关的联系人（排除当前用户、排除已屏蔽），供发起群聊/添加成员选人。
      与 ListSelectableGroupConversations 同源使用 relationship gate 判定 mutual；行形状复用联系人行。
    query_params: [cursor, limit, query]
    response_entity: ChatContactListRow
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
