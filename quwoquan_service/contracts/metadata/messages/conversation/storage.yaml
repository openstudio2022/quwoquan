aggregate: Conversation
backend: mongodb

collections:
  conversations:
    entity: Conversation
    indexes:
      - { name: idx_conv_type_updated, keys: { type: 1, updatedAt: -1 } }
      - { name: idx_conv_circle, keys: { circleId: 1 }, sparse: true }
      - { name: idx_conv_circle_group, keys: { circleGroupId: 1 }, sparse: true }
      - { name: idx_conv_status, keys: { status: 1 } }
      - { name: idx_conv_last_msg_time, keys: { lastMessageTime: -1 } }
    search_indexes:
      - name: search_conv_title
        source: search_conv_title
        type: text
        fields: [title]

  conversations_command_receipts:
    entity: Conversation
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。

  conversations_outbox:
    entity: Conversation
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。

  chat_aggregate_outbox_sequences:
    entity: Conversation
    role: authoritative
    description: chat 域三个非 Message 聚合 outbox 的共享全序分配器（_id 为 outbox 集合名），与事件写入同事务推进。

  chat_projection_checkpoints:
    entity: Conversation
    role: projection
    description: chat 域 relay/projector 各 consumer 独立保存的可重放水位。

  message_receipts:
    entity: MessageReceipt
    indexes:
      - { name: idx_mr_msg_user, keys: { messageId: 1, userId: 1 }, unique: true }
      - { name: idx_mr_conv_msg, keys: { conversationId: 1, messageId: 1 } }

redis_cache:
  - key: "cache:conversation:{conversationId}"
    ttl_seconds: 300
    entity: Conversation
    invalidate_on: [MessageSent, ConversationMemberAdded, ConversationMemberRemoved, ConversationUserSettingsChanged]
