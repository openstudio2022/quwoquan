domain: chat
aggregate_root: Message
object_kind: aggregate_root
description: Conversation 中单条消息的发送、服务端序号与撤回生命周期聚合。
storage_backend: mongodb
capabilities: [commandable, queryable, idempotent_commands]
members:
  - entity: MessageCard
    relation: 1:1
    object_kind: value_object
    aggregate_owner: Message
  - entity: MessageCardAttribute
    relation: 1:N
    object_kind: value_object
    aggregate_owner: Message
    max_cardinality: 16
business_rules:
  - clientMsgId 在 conversationId + sender persona 范围内唯一
  - sender 必须是 active ConversationMembership，actor 只能来自 trusted principal
  - seq 由服务端按 Conversation 单调分配，客户端不可指定
  - media 消息只保存 MediaAsset id，不拥有上传会话或 URL 真相
  - card 消息必须拥有一个强类型 MessageCard，非 card 消息禁止携带 card
  - MessageCard 最多 16 个同名唯一的属性；子对象只能由 Message 创建和持久化
  - content 最多 5000 个 Unicode code point，card title 最多 120 个 Unicode code point
  - mentions 最多 50 个并按首次出现顺序去重；普通目标必须是当前活跃成员
  - __all__ 只允许群 owner/admin 使用；assistant 只在助手成员已加入时合法
  - 只有 sender 或有权限 moderator 可在策略时间窗内撤回
lifecycle:
  states: [sent, recalled, deleted]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/chat/message/model
  ports: internal/domain/chat/message/ports
  application: internal/application/chat/message
  persistence: internal/infrastructure/chat/message/persistence
