service:
  name: chat-service
  domain: chat
  owner: backend-team
  description: Message 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: operation 尚未逐项完成商业证据绑定
    gap_id: CHAT_MESSAGE_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /chat/conversations/{conversationId}/messages

    operation: SendMessage
    actor: persona
    application:
      kind: command
      facet: MessageCommandFacet
      method: sendMessage
      aggregate_owner: Message
      mutation_target: Message
      invariant_target: Message
    commercial:
      status: ready
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: chat_message_send
      trace: true
      attributes: [outcome, message_type]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    client_contract:
      dart_import: ../chat/message_contracts.dart
      request_type: ChatSendMessageCommand
      response_type: ChatSendMessageResult
      request_encoder: encodeChatSendMessageCommand
      response_decoder: decodeChatSendMessageResult
    response_body: ChatSendMessageResult
    response_body_kind: object
    description: |
      发送消息（一次提交：clientMsgId 是唯一幂等身份，Idempotency-Key header 必须等于 body clientMsgId，
      不一致即拒绝；服务端按 uq_messages_client_message 唯一约束 + 事务内 seq 分配保证重放返回首个
      messageId + seq + timestamp）。群消息 mentions 由服务端去空、按首次出现顺序去重并限制 50 个；
      普通目标必须是当前活跃成员，`__all__` 仅 owner/admin 可用，assistant 仅在助手已入群时合法。
      校验后的 canonical mentions 必须同源写入 Message、MessageSent 与同步/列表投影；
      非群会话不得提交 mentions。
    request_entity: Message
    writable_fields: [type, content, mediaAssetId, card, replyToMessageId, mentions, clientMsgId, senderDisplayNameSnapshot, senderAvatarUrlSnapshot, personaContextVersion]
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.message_invalid, CHAT.USER.message_too_long, CHAT.USER.message_media_invalid, CHAT.USER.message_idempotency_conflict, CHAT.USER.not_mutual, CHAT.USER.blocked, CHAT.SYSTEM.message_media_unavailable, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /chat/conversations/{conversationId}/messages/{messageId}/recall

    operation: RecallMessage
    actor: persona
    commercial:
      status: ready
    application:
      kind: command
      facet: MessageCommandFacet
      method: recallMessage
      aggregate_owner: Message
      mutation_target: Message
      invariant_target: Message
    authorization:
      principal: persona
      ownership_policy: message_sender
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: chat_message_command
      trace: true
      attributes: [operation, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: 撤回消息（2 分钟内有效；已撤回消息重复撤回为 no-op 并重放原回执）
    response_body_kind: ack
    client_contract:
      dart_import: ../chat/message_contracts.dart
      request_type: ChatRecallMessageCommand
      response_type: ChatCommandAck
      request_encoder: encodeChatRecallMessageCommand
      response_decoder: decodeChatCommandAck
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.blocked, CHAT.USER.message_not_found, CHAT.USER.message_recall_forbidden, CHAT.USER.message_recall_expired, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /chat/conversations/{conversationId}/messages

    operation: ListMessages
    actor: persona
    commercial:
      status: ready
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.SYSTEM.internal_error]
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_message_list
      trace: true
      attributes: [conversation_id, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    application:
      kind: query
      facet: MessageQueryFacet
      method: listMessages
      reader: MessageHistoryReader
      slice: MessagePageSlice
    description: 消息列表（支持 afterSeq/beforeSeq 分页，默认按 seq DESC）
    query_params: [afterSeq, beforeSeq, limit]
    response_entity: Message
    response_body: ChatMessageClient
    response_body_kind: page
    client_contract:
      dart_import: ../chat/message_contracts.dart
      request_type: ChatListMessagesQuery
      response_type: ChatMessagePageSlice
      request_encoder: encodeChatListMessagesQuery
      response_decoder: decodeChatMessagePageSlice
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /chat/conversations/{conversationId}/sync

    operation: SyncMessages
    actor: persona
    commercial:
      status: ready
    application:
      kind: query
      facet: MessageSyncQueryFacet
      method: syncMessages
      reader: MessageSyncReader
      slice: MessageSyncSlice
    authorization:
      principal: persona
      ownership_policy: conversation_member
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: none
      max_attempts: 1
      idempotency: none
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: metadata_only
    telemetry:
      metric: chat_message_sync
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: 离线同步（上报 lastSeq，返回 gap 消息列表 + hasMore，单次最多 500 条）
    response_body: ChatMessageSyncSlice
    response_body_kind: object
    client_contract:
      dart_import: ../chat/message_contracts.dart
      request_type: ChatSyncMessagesQuery
      response_type: ChatMessageSyncSlice
      request_encoder: encodeChatSyncMessagesQuery
      response_decoder: decodeChatMessageSyncSlice
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.conversation_not_found, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
