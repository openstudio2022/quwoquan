aggregate: Message
backend: mongodb
collections:
  messages:
    entity: Message
    role: authoritative
    indexes:
      - { name: uq_messages_conversation_seq, keys: { conversationId: 1, seq: 1 }, unique: true }
      - { name: uq_messages_client_message, keys: { conversationId: 1, senderId: 1, clientMsgId: 1 }, unique: true }
      - { name: idx_messages_conversation_time, keys: { conversationId: 1, timestamp: -1 } }
      - { name: idx_messages_reply, keys: { replyToMessageId: 1 }, sparse: true }
  messages_command_receipts:
    entity: Message
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。
  messages_sequences:
    entity: Message
    role: authoritative
    description: 在 Message transaction 内按 conversationId 原子分配单调 seq，不依赖 Redis。
  messages_outbox:
    entity: Message
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
  messages_outbox_sequences:
    entity: Message
    role: authoritative
    description: Message outbox 的全序列分配器，与 outbox 记录同事务推进。
  messages_projection_checkpoints:
    entity: Message
    role: projection
    description: 各 Message event consumer 独立保存的可重放 checkpoint。
