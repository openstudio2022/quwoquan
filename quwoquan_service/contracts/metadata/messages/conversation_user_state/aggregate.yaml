version: 1
domain: chat
aggregate_root: ConversationUserState
object_kind: aggregate_root
description: Persona 对 Conversation 的已读水位、静音与置顶私有状态聚合。
storage_backend: mongodb
capabilities: [commandable, queryable, idempotent_commands]
members: []
business_rules:
  - identity 固定为 conversationId + personaId
  - readSeq 只能单调增加且不得超过 Conversation maxSeq
  - unreadCount 与 mentionUnreadCount 是投影，不接受客户端直接写入
  - muted、pinned 和 readSeq 只能由 owner persona 修改
lifecycle:
  states: [active, removed]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/chat/conversation_user_state/model
  ports: internal/domain/chat/conversation_user_state/ports
  application: internal/application/chat/conversation_user_state
  persistence: internal/infrastructure/chat/conversation_user_state/persistence
