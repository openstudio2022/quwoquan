aggregate: ConversationUserState
events:
  - name: ConversationReadWatermarkAdvanced
    producer: chat-service
    consumers: [projection-workers]
    channel: event_store
    payload_fields: [conversationId, userId, messageId, readSeq, unreadCount, mentionUnreadCount, readAt, updatedAt]
  - name: ConversationUserSettingsChanged
    producer: chat-service
    consumers: [projection-workers]
    channel: event_store
    payload_fields: [conversationId, userId, muted, pinned, updatedAt]
