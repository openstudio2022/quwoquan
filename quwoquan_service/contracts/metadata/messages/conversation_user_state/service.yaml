service:
  name: chat-service
  domain: chat
  owner: backend-team
  description: ConversationUserState 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: 对象专属 Store/outbox、transport 与 generated client 尚未完成生产装配
    gap_id: CHAT_OBJECT_PACKET_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /chat/conversations/{conversationId}/messages/{messageId}/read

    operation: MarkAsRead
    actor: persona
    application:
      kind: command
      facet: MessageReadCommandFacet
      method: markAsRead
      aggregate_owner: ConversationUserState
      mutation_target: ConversationUserState
      invariant_target: ConversationUserState
    description: 标记已读（更新 ConversationUserState.readSeq + unreadCount，receiptEnabled 时写入 MessageReceipt）
    error_codes: [CHAT.USER.unauthorized, CHAT.USER.blocked, CHAT.USER.message_not_found, CHAT.SYSTEM.internal_error]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: PATCH
    path: /chat/conversations/{conversationId}/settings

    operation: UpdateConversationSettings
    actor: persona
    application:
      kind: command
      facet: ConversationSettingsCommandFacet
      method: updateConversationSettings
      aggregate_owner: ConversationUserState
      mutation_target: ConversationUserState
      invariant_target: ConversationUserState
    description: 更新用户级会话设置（mute/pin，写入 ConversationUserState）
    security:
      auth_mode: required