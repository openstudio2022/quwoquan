aggregate: ConversationUserState
layer: service_side

description: |
  ConversationUserState 聚合云侧契约测试场景（真实 MongoDB + Redis）。
  执行：go test ./services/chat-service/...

real_engines:
  mongodb: testcontainers (mongo:7)
  redis: miniredis/v2

spy_targets: [event_publisher]
mock_targets: [cross_service_clients]

scenarios:
  - name: mark_as_read_watermark_monotonic
    command: MarkAsRead
    assertions:
      - read_seq_advances_monotonically
      - stale_watermark_replay_is_noop_returning_current_state
      - unread_count_recomputed
      - mention_unread_count_recomputed_after_read_seq
      - partial_read_preserves_messages_after_read_seq_through_conversation_max_seq
      - inbox_projected_seq_advances_to_recomputed_upper_bound
      - late_or_replayed_projection_does_not_reopen_read_messages
      - event_ConversationReadWatermarkAdvanced_written_to_outbox_same_transaction

  - name: mark_as_read_writes_receipt_fact
    command: MarkAsRead (receiptEnabled conversation)
    assertions:
      - message_receipt_fact_appended_with_dedupe_key
      - duplicate_mark_does_not_duplicate_receipt

  - name: update_settings_set_semantics
    command: UpdateConversationSettings
    assertions:
      - mute_pin_state_committed_with_receipt_and_outbox
      - identical_settings_is_noop_receipt
      - event_ConversationUserSettingsChanged_via_outbox

  - name: inbox_reflects_read_state
    command: MarkAsRead then ListInbox
    assertions:
      - unread_count_zero_after_watermark_projection
      - message_home_all_group_direct_unread_filters_reflect_read_state
