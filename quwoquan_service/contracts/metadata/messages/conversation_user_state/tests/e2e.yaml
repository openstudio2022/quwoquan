aggregate: ConversationUserState
layer: e2e

description: |
  端云集成测试（gamma）。

scenarios:
  - name: read_receipt_roundtrip
    steps:
      - user A sends message to user B
      - user B opens conversation (MarkAsRead)
      - user A queries receipts
    assertions:
      - user_b_unread_zero_in_inbox
      - receipt_visible_to_sender_when_enabled
