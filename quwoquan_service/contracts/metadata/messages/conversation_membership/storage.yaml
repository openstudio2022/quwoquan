version: 1
aggregate: ConversationMembership
backend: mongodb
collections:
  conversation_memberships:
    entity: ConversationMember
    role: authoritative
    indexes:
      - { name: uq_conversation_memberships_identity, keys: { conversationId: 1, userId: 1 }, unique: true }
      - { name: idx_conversation_memberships_role_joined, keys: { conversationId: 1, role: 1, joinedAt: 1 } }
      - { name: idx_conversation_memberships_display_name, keys: { conversationId: 1, displayName: 1, userId: 1 } }
  conversation_memberships_command_receipts:
    entity: ConversationMember
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。
  conversation_memberships_outbox:
    entity: ConversationMember
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
