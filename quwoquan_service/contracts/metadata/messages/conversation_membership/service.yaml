service:
  name: chat-service
  domain: chat
  owner: backend-team
  description: ConversationMembership 对象专属 command packet。
  commercial_defaults:
    status: blocked
    block_reason: 对象专属 Store/outbox、transport 与 generated client 尚未完成生产装配
    gap_id: CHAT_OBJECT_PACKET_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /chat/conversations/{conversationId}/members

    operation: AddMembers
    actor: persona
    application:
      kind: command
      facet: ConversationMemberCommandFacet
      method: addMembers
      aggregate_owner: ConversationMembership
      mutation_target: ConversationMembership
      invariant_target: ConversationMembership
    description: 添加成员（批量，检查 maxGroupSize 上限）
    security:
      auth_mode: required
  - method: DELETE
    path: /chat/conversations/{conversationId}/members/{userId}

    operation: RemoveMember
    actor: persona
    application:
      kind: command
      facet: ConversationMemberCommandFacet
      method: removeMember
      aggregate_owner: ConversationMembership
      mutation_target: ConversationMembership
      invariant_target: ConversationMembership
    description: 移除成员
    security:
      auth_mode: required
  # ── 助手参与 ──────────────────────────────────

  - method: POST
    path: /chat/conversations/{conversationId}/assistant

    operation: InviteAssistant
    actor: persona
    application:
      kind: command
      facet: ConversationAssistantCommandFacet
      method: inviteAssistant
      aggregate_owner: ConversationMembership
      mutation_target: ConversationMembership
      invariant_target: ConversationMembership
    description: 邀请小趣助手加入会话（创建 memberType=assistant 的 ConversationMember），可指定 skillId
    security:
      auth_mode: required
  - method: DELETE
    path: /chat/conversations/{conversationId}/assistant

    operation: RemoveAssistant
    actor: persona
    application:
      kind: command
      facet: ConversationAssistantCommandFacet
      method: removeAssistant
      aggregate_owner: ConversationMembership
      mutation_target: ConversationMembership
      invariant_target: ConversationMembership
    description: 移除小趣助手（删除 memberType=assistant 的成员）
    security:
      auth_mode: required
  # ── 用户设置 ──────────────────────────────────

  - method: PATCH
    path: /chat/conversations/{conversationId}/owner

    operation: TransferOwnership
    actor: persona
    application:
      kind: command
      facet: ConversationGovernanceCommandFacet
      method: transferOwnership
      aggregate_owner: ConversationMembership
      mutation_target: ConversationMembership
      invariant_target: ConversationMembership
    description: 转让群主
    security:
      auth_mode: required
  - method: PUT
    path: /chat/conversations/{conversationId}/admins

    operation: UpdateGroupAdmins
    actor: persona
    application:
      kind: command
      facet: ConversationGovernanceCommandFacet
      method: updateGroupAdmins
      aggregate_owner: ConversationMembership
      mutation_target: ConversationMembership
      invariant_target: ConversationMembership
    description: 设置管理员列表
    security:
      auth_mode: required
  - method: GET
    path: /chat/conversations/{conversationId}/members

    operation: ListMembers
    actor: persona
    application:
      kind: query
      facet: ConversationMembershipQueryFacet
      method: listMembers
      reader: ConversationMembershipReader
      slice: ConversationMemberPageSlice
    description: |
      成员列表只经 ConversationMembership named Reader 返回 typed Slice；不加载或暴露 Conversation 子对象。
      排序由 query `sort` 控制，默认 joined_asc；可选 display_name_asc。
    query_params: [cursor, limit, role, sort]
    response_entity: ConversationMember
    security:
      auth_mode: required