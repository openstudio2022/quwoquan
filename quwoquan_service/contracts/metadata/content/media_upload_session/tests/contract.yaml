entity: MediaUploadSession
tests:
  - name: media_upload_session_state_contract
    operation: InitMediaUpload
    go_func: TestMediaUploadSessionOwnerExpiryAndStateContracts
    command: InitMediaUpload/AbortMediaUpload/CompleteMediaUpload
  - name: media_upload_session_admission_policy_contract
    operation: InitMediaUpload
    go_func: TestMediaUploadAdmissionRejectsUnsupportedAndOversizedPayloadsBeforePersistence
    command: InitMediaUpload
  - name: media_upload_session_atomic_completion_contract
    operation: CompleteMediaUpload
    go_func: TestMediaCompleteIsIdempotentAndOutboxVersionsAreAtomic
    command: CompleteMediaUpload
  - name: media_upload_session_http_owner_and_replay_contract
    operation: GetMediaUploadSession
    go_func: TestMediaUploadSessionHTTPPacketPersistsOwnerScopedGetAbortAndReplay
    command: InitMediaUpload/GetMediaUploadSession/AbortMediaUpload
  - name: media_upload_session_completion_reconciliation_contract
    operation: GetMediaUploadSession
    go_func: TestCompletedMediaUploadSessionQueryRecoversAssetIdentity
    command: InitMediaUpload/CompleteMediaUpload/GetMediaUploadSession
  - name: media_upload_real_s3_compatible_lifecycle
    operation: CompleteMediaUpload
    go_func: TestMediaObjectGatewayUsesRealS3CompatibleObjectLifecycle
    command: PUT/HEAD/COPY/DELETE
