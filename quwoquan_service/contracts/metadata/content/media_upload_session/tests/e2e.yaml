entity: MediaUploadSession
layer: e2e

description: |
  端云集成场景：真实对象存储生命周期（init 签发 → PUT 直传 → complete 置 ready →
  abort 清理），会话过期 TTL 语义。

execution:
  environment: gamma
  ci_strategy: advisory
  real_engines:
    mongodb: testcontainer
    object_storage: s3-compatible

scenarios:
  - name: object_storage_real_lifecycle
    test_type: api_contract
    go_func: TestMediaObjectGatewayUsesRealS3CompatibleObjectLifecycle
    assertions:
      - init 签发的对象键可直传并在 complete 后可读
      - abort 后对象与会话不可复用

  - name: session_owner_expiry_replay
    test_type: api_contract
    go_func: TestMediaUploadSessionHTTPPacketPersistsOwnerScopedGetAbortAndReplay
    assertions:
      - 会话 owner-scoped 读取与 abort
      - complete 重放按摘要幂等返回同一资产
