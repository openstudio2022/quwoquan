schema: content_media_upload_policy

# 首发 Post 视频以 60 秒移动端 UGC 为产品边界；所有文件均走流式 PUT。
# Post 图片/视频 50 MiB 上限让失败重传成本可控，因此当前不暴露未实现的
# multipart/resume 契约；audio/file 保留聊天附件已有上限。
streaming_required: true

media_types:
  image:
    max_file_size_bytes: 52428800
    allowed_content_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/heic
  video:
    max_file_size_bytes: 52428800
    allowed_content_types:
      - video/mp4
      - video/quicktime
      - video/x-m4v
      - video/webm
  audio:
    max_file_size_bytes: 10485760
    allowed_content_types:
      - audio/aac
      - audio/mp4
      - audio/x-m4a
      - audio/mpeg
      - audio/wav
  file:
    max_file_size_bytes: 104857600
    allowed_content_types:
      - "*/*"

errors:
  file_too_large: CONTENT.USER.media_file_too_large
  unsupported_type: CONTENT.USER.media_type_unsupported
