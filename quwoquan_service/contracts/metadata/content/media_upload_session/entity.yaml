version: 1
domain: content
entity: MediaUploadSession
object_kind: aggregate_root

description: |
  具有 TTL 的上传会话聚合。初始化后只允许 pending -> completed|aborted；
  完成命令校验 OSS 对象摘要并按 CAS digest 产生 MediaAsset。

storage_backend: mongodb
cache_layer: none
capabilities: [queryable]
taggable: false
vector_enabled: false

business_rules:
  - objectKey 只能由 Media Facade 分配且在会话生命周期内不可变
  - CompleteMediaUpload 必须在 expiresAt 前验证对象存在、大小与 expectedSha256
  - pending 之外不得重复完成或中止；重复相同命令只返回幂等回执
  - 完成后通过同事务 outbox 产生 MediaAsset 创建事件，不直接写其他上下文
  - Chat、Profile 与 Content 只能调用本 Facade，不得建立第二套上传会话

lifecycle:
  states: [pending, completed, aborted]
  optimistic_concurrency: version
  idempotency: command_key
  ttl_field: expiresAt

ddd_layer_mapping:
  domain_model: internal/domain/media/model
  ports: internal/domain/media/media_upload_session/ports
  persistence: internal/infrastructure/media/media_upload_session/persistence
  application: internal/application/media
  adapter_rest: internal/adapters/http
  adapter_event: internal/infrastructure/messaging
