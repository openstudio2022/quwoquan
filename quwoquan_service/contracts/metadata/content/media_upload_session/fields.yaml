entity: MediaUploadSession

fields:
  - name: id
    source: id
    type: string
    constraints: [PK]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: version
    source: version
    type: int
    constraints: [NOT_NULL, DEFAULT_1]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: ownerId
    source: ownerId
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read

  - name: objectKey
    source: objectKey
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: read
    ops_exposure: read

  - name: mediaType
    source: mediaType
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: contentType
    source: contentType
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: fileSize
    source: fileSize
    type: int64
    constraints: [NOT_NULL, POSITIVE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: expectedSha256
    source: expectedSha256
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read

  - name: status
    source: status
    type: enum
    enum_ref: MediaUploadSessionStatus
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: createdAt
    source: createdAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: expiresAt
    source: expiresAt
    type: timestamp
    constraints: [NOT_NULL, TTL_INDEX]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: completedAt
    source: completedAt
    type: timestamp
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: abortedAt
    source: abortedAt
    type: timestamp
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

state_machine:
  field: status
  transitions:
    - from: pending
      to: [completed, aborted]
