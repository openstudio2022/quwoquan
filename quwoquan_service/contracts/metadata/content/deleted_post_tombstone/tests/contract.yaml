entity: DeletedPostTombstone

scenarios:
  - name: delete_appends_tombstone_atomically
    operation: DeletePost
    go_func: TestDeletePostContract
    evidence: api_integration
    assertions:
      - DeletePost 同事务追加墓碑（_id 复用 postId 作 dedupe key）
      - 重复删除不产生第二条墓碑

  - name: deleted_post_read_returns_gone
    operation: GetPost
    go_func: TestGetPostTombstoneReturnsGone
    evidence: local_contract
    assertions:
      - 保留期内读取返回 CONTENT.USER.content_deleted（HTTP 410）
      - 墓碑记录 reason 与 deletedAt；不泄露原内容
      - TTL 到期后回落 post_not_found（404）
