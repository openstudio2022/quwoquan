version: 1
domain: content
aggregate_root: Post
object_kind: aggregate_root

description: |
  内容聚合。图片/视频/微趣/文章四种内容类型统一建模（contentType 判别，通用框架 + 按类型扩展）。
  设计详见 specs/feature-tree/discovery-content/content-type-framework/。
  Comment、ContentReaction、MediaUploadSession、MediaAsset 与 CirclePostPlacement
  按独立生命周期治理，不作为 Post 的无界聚合成员；站外分享只追加 OutboundShareFact。
  MongoDB 存储支撑高并发读写和水平扩展。
  热数据 + 互动状态走 Redis 缓存，热点计数 Redis 原子递增后异步回写。

storage_backend: mongodb
cache_layer: redis
cache_ttl_seconds: 300

capabilities:
  - queryable
  - searchable
  - aggregatable
  - vector_searchable

taggable: true
vector_enabled: true

business_rules:
  - draft 仅能由 author persona 修改、发布或删除
  - PublishPost 必须绑定当前 postVersion + contentDigest 的 approved moderation case
  - mediaAssetIds 必须全部 ready 且调用者拥有访问权限
  - sourcePostId 仅表达引用发布，不复制或修改源 Post
  - Post 不保存互动计数、Circle placement、审核状态、搜索向量或 URL 投影真相
  - 所有命令使用 expectedVersion 与 idempotency receipt，并与 outbox 原子提交
lifecycle:
  states: [draft, published, deleted]
  transitions:
    - { from: none, command: CreatePost, to: draft }
    - { from: draft, command: PublishPost, to: published }
    - { from: draft, command: DeletePost, to: deleted }
    - { from: published, command: DeletePost, to: deleted }
  optimistic_concurrency: version
  idempotency: command_receipt

ddd_layer_mapping:
  domain_model: internal/domain/post/model
  ports: internal/domain/content/post/ports
  persistence: internal/infrastructure/content/post/persistence
  application: internal/application/post
  search_projection: internal/application/searchprojection
  adapter_rest: internal/adapters/http
  adapter_event: internal/infrastructure/messaging

counter_strategy:
  description: |
    热点 Post 计数使用 Redis 原子递增 + 异步批量回写 MongoDB。
    避免热点文档高频更新导致 MongoDB 写锁竞争。
  redis_key: "counter:{postId}:{type}"
  types: [like, comment, share, view]
  flush_interval_seconds: 10
  flush_batch_size: 100
