aggregate: Post
backend: mongodb

collections:
  posts:
    entity: Post
    indexes:
      - { name: idx_posts_author_status, keys: { authorId: 1, status: 1, publishedAt: -1 } }
      - { name: idx_posts_content_type, keys: { contentType: 1, publishedAt: -1 } }
      - { name: idx_posts_visibility, keys: { visibility: 1, publishedAt: -1 } }
      - { name: idx_posts_status_published, keys: { status: 1, publishedAt: -1 } }
      - { name: idx_posts_last_active, keys: { lastActiveAt: -1 }, sparse: true }
      - { name: idx_posts_tag_refs, keys: { tagRefs: 1 } }
      - { name: idx_posts_entity_refs, keys: { entityRefs: 1 } }
      - { name: idx_posts_semantic_candidate, keys: { "semanticMentions.candidateId": 1 }, sparse: true }
      - { name: idx_posts_semantic_target, keys: { "semanticMentions.targetRef": 1 }, sparse: true }
      - { name: idx_posts_location, keys: { location: "2dsphere" }, sparse: true }
      - { name: idx_posts_moderation, keys: { moderationStatus: 1, createdAt: -1 } }
      - { name: idx_posts_source, keys: { sourceType: 1, sourcePostId: 1 }, sparse: true }
      - { name: idx_posts_article_markdown_digest, keys: { articleMarkdownDigest: 1 }, sparse: true }
      - { name: idx_posts_canonical_entity, keys: { canonicalEntityId: 1, publishedAt: -1 }, sparse: true }
      - { name: idx_posts_publish_intent, keys: { authorId: 1, publishIntentId: 1 }, unique: true, partial_filter: { publishIntentId: { type: string } } }
      - { name: idx_posts_local_draft, keys: { authorId: 1, localDraftId: 1 }, unique: true, partial_filter: { localDraftId: { type: string } } }
      - { name: idx_posts_version, keys: { _id: 1, version: 1 }, unique: true }
    search_indexes:
      - name: search_posts_text
        source: search_posts_text
        type: text
        fields: [title, body, locationName, tagRefs, entityRefs, articleMarkdown]
        weights: { title: 10, tagRefs: 5, entityRefs: 5, locationName: 3, body: 1, articleMarkdown: 1 }
    vector_indexes:
      - name: vector_posts_embedding
        field: embedding
        dimensions: 1536
        similarity: cosine
    change_streams:
      - pipeline: [{ "$match": { "operationType": { "$in": ["insert", "update"] } } }]
        consumers: [recommendation-projector, search-indexer]
    sharding:
      key: { _id: "hashed" }
      description: 按 _id 哈希分片，均匀分布


  deleted_post_tombstones:
    entity: DeletedPostTombstone
    indexes:
      - { name: idx_tombstone_post, keys: { postId: 1 }, unique: true }
      - { name: idx_tombstone_deleted_at, keys: { deletedAt: -1 } }
      - { name: idx_tombstone_expire, keys: { expireAt: 1 }, expireAfterSeconds: 0 }

  post_command_receipts:
    entity: Post
    description: Post command 幂等结果；与聚合版本和 outbox 在同一 Mongo transaction 提交
    indexes:
      - { name: idx_post_command_receipts_key, keys: { _id: 1 }, unique: true }
      - { name: idx_post_command_receipts_aggregate, keys: { aggregateId: 1, aggregateVersion: -1 } }
      - { name: idx_post_command_receipts_expire, keys: { expiresAt: 1 }, expireAfterSeconds: 0 }

  content_outbox:
    entity: Post
    description: Mongo authoritative aggregate 的同库事务 outbox；projection worker 以 checkpoint 幂等消费
    indexes:
      - { name: idx_content_outbox_event, keys: { _id: 1 }, unique: true }
      - { name: idx_content_outbox_replay, keys: { aggregateType: 1, occurredAt: 1, _id: 1 } }
      - { name: idx_content_outbox_aggregate_version, keys: { aggregateType: 1, aggregateId: 1, aggregateVersion: 1 }, unique: true }

  projection_checkpoints:
    entity: Post
    description: Feed/Search/Recommendation/Homepage/Circle replay/rebuild checkpoint
    indexes:
      - { name: idx_projection_checkpoint_consumer, keys: { _id: 1 }, unique: true }

  user_account_closed_inbox:
    entity: UserAccountClosedProjectionInbox
    role: append_only
    description: Content（含 recommendation-engine）按 eventId+digest 幂等清理的 durable inbox。
    indexes:
      - { name: idx_user_account_closed_completed, keys: { completedAt: -1 } }

  user_account_closed_failures:
    entity: UserAccountClosedProjectionFailure
    role: append_only
    description: pending reclaim 有限重试状态；仅保存 event/error digest。
    indexes:
      - { name: idx_user_account_closed_failure_expire, keys: { expireAt: 1 }, expireAfterSeconds: 0 }

  user_account_closed_search_work:
    entity: UserAccountClosedSearchWork
    role: projection
    description: Content 搜索文档删除工作项；外部索引成功后才推进 inbox 完成。
    indexes:
      - { name: idx_user_account_closed_search_work, keys: { eventId: 1, doneAt: 1, _id: 1 } }
      - { name: idx_user_account_closed_search_work_expire, keys: { expireAt: 1 }, expireAfterSeconds: 0 }

  closed_account_subjects:
    entity: ClosedAccountAudit
    role: append_only
    description: 不含账号原始标识的注销事件审计摘要，不作为写入防复活查询源。
    indexes:
      - { name: idx_closed_account_event_digest, keys: { eventDigest: 1 }, unique: true }

  closed_account_subject_tombstones:
    entity: ClosedAccountSubjectTombstone
    role: append_only
    description: >
      按独立密钥 HMAC-SHA256(subjectId) 标识的永久防复活栅栏；不得保存原始
      userId/personaId，不设 TTL。所有推荐状态写入、训练和 replay 冻结必须先检查。
    indexes:
      - { name: idx_closed_account_subject_closed_at, keys: { closedAt: -1 } }

redis_cache:
  - key: "cache:post:{postId}"
    ttl_seconds: 300
    entity: Post
    invalidate_on: [PostUpdated, PostDeleted]

  - key: "counter:{postId}:{type}"
    ttl_seconds: null
    type: string
    description: 热点内容计数缓冲（INCR + 异步回写）

  - key: "content_analysis:{postId}"
    ttl_seconds: 86400
    type: hash
    description: 内容多模态分析缓存
