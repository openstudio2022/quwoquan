aggregate: Post
layer: service_side

description: |
  云侧契约测试场景（从 service.yaml contract_test.service_side 迁出）。
  服务只依赖自身，使用真实测试数据库，不 mock 存储层。
  执行：go test ./services/content-service/...

real_engines:
  mongodb: testcontainers (mongo:7)
  redis: miniredis/v2

spy_targets: [event_publisher]
mock_targets: [embedding_client, cross_service_clients, llm_client]

data_management:
  seed: 从 fields.yaml 生成 fixture 工厂（fixture.NewPost() 等）
  cleanup: "collection.DeleteMany(ctx, bson.D{}) per test"
  redis_cleanup: miniredis.FlushAll()

# ── CRUD 场景 ────────────────────────────────────────────────────────
scenarios:
  - name: submit_post_publication
    operation: SubmitPostPublication
    go_func: TestSubmitPostPublicationCreatesPublishedPost
    command: SubmitPostPublication (image type)
    seed: []
    assertions:
      - db.posts.FindOne({_id: result.id}) → document exists with correct fields
      - db.media_assets.Find({postId: result.id}) → assets created
      - eventSpy.AssertPublished("PostPublished", {_id, publishIntentId, authorId, contentType, tagRefs})
      - embedding mock called with correct input fields

  - name: submit_post_publication_all_types
    operation: SubmitPostPublication
    go_func: TestSubmitPostPublicationAllTypes
    command: SubmitPostPublication
    variants: [image, video, micro, article]
    seed: []
    assertions:
      - each variant: db.posts.FindOne → contentType matches input
      - each variant: eventSpy.AssertPublished("PostPublished")

  - name: get_post_success
    operation: GetPost
    go_func: TestGetPostSuccess
    command: GetPost
    seed: [fixture.NewPost()]
    assertions:
      - response.postId == seeded.id
      - response does not contain embedding field (privacy: never_expose)
      - response does not contain moderationStatus (visibility: platform-ops only)

  - name: get_post_not_found
    operation: GetPost
    go_func: TestGetPostNotFound
    command: GetPost(nonExistentId)
    seed: []
    assertions:
      - response.code == "CONTENT.USER.post_not_found"
      - http_status == 404

  - name: update_post_settings_forbidden
    operation: UpdatePostSettings
    go_func: TestUpdatePostSettingsForbidden
    command: UpdatePostSettings (wrong owner)
    seed: [fixture.NewPost(authorId="user_a")]
    caller: user_b
    assertions:
      - response.code == "CONTENT.USER.forbidden_edit"
      - http_status == 403

  - name: submit_post_publication_invalid_content_type
    operation: SubmitPostPublication
    go_func: TestSubmitPostPublicationInvalidContentType
    command: SubmitPostPublication (contentType="invalid_type")
    assertions:
      - response.code == "CONTENT.USER.invalid_content_type"
      - http_status == 400


  # ── Feed 场景 ─────────────────────────────────────────────────────
  - name: get_feed_by_type
    operation: GetFeed
    go_func: TestGetFeedByType
    command: GetFeed (type=image)
    seed: [fixture.NewPosts(count=10, contentType=image), fixture.NewPosts(count=5, contentType=video)]
    assertions:
      - response.items all have contentType=image
      - response.items.length == 10
      - cursor present

  - name: get_feed_by_identity
    operation: GetFeed
    go_func: TestGetFeedByIdentity
    command: GetFeed (identity=moment/work)
    seed: [fixture.NewPosts(count=6, contentType=micro), fixture.NewPosts(count=4, contentType=image)]
    assertions:
      - identity=moment -> response.items all resolve identity=moment
      - identity=work -> response.items all resolve identity=work
      - identity=moment 时忽略 type 过滤

  - name: get_feed_excludes_private_posts
    operation: GetFeed
    go_func: TestGetFeedExcludesPrivatePosts
    command: GetFeed (any type)
    seed: [post(micro,visibility=public), post(micro,visibility=private)]
    assertions:
      - response.items do not contain the private post
      - private content never appears in discovery feed

  - name: get_feed_cursor_pagination
    operation: GetFeed
    go_func: TestGetFeedCursorPagination
    command: GetFeed with cursor
    seed: [fixture.NewPosts(count=30, contentType=image)]
    assertions:
      - first page: 20 items, cursor present
      - second page using cursor: 10 items, no duplicate

  - name: get_feed_recommend_sort_with_cursor
    operation: GetFeed
    go_func: TestGetFeedRecommendSortWithCursor
    command: GetFeed (sort=recommend) with cursor
    seed: [fixture.NewPosts(count=30, contentType=image)]
    assertions:
      - first page: cursor present and opaque token format
      - second page using cursor: no overlap with page1
      - pagination remains stable for recommend sort

  - name: get_feed_future_window_changes_only
    operation: GetFeed
    go_func: TestGetFeedFutureWindowChangesOnly
    command: GetFeed (sort=recommend) after feedback update
    seed: [fixture.NewPosts(count=40, mixed contentType)]
    assertions:
      - items returned before cursor are treated as client-owned history
      - strong feedback affects only future window after cursor
      - future window keeps no duplicate guarantee

  - name: get_feed_issues_server_feed_request_id
    operation: GetFeed
    go_func: TestFeedIssuesServerFeedRequestID
    command: GetFeed (sort=recommend) issues server-authoritative feedRequestId
    seed: [fixture.NewPosts(count=10, contentType=image)]
    assertions:
      - response envelope feedRequestId is server-issued with frq_ prefix
      - response envelope carries rankingVersion + reasonVersion
      - echoing feedRequestId on next page keeps the same attribution id

  # ── 行为上报场景 ──────────────────────────────────────────────────
  - name: behavior_batch_report
    operation: ReportBehaviors
    go_func: TestBehaviorBatchReport
    command: ReportBehaviors (batch of impression+dwell+click)
    assertions:
      - http_status == 200
      - response.status == "ok"
      - response.accepted == 3

  - name: behavior_batch_empty
    operation: ReportBehaviors
    go_func: TestBehaviorBatchEmpty
    command: ReportBehaviors (empty events array)
    assertions:
      - response.code == "CONTENT.USER.invalid_argument"
      - http_status == 400

  # ── 计数回写场景 ──────────────────────────────────────────────────
  - name: counter_flush
    go_func: TestCounterFlush
    status: pending
    command: FlushCounters (timer-triggered)
    seed: [fixture.NewPost()]
    setup:
      - miniredis.Set('counter:{postId}:like', '42')
    assertions:
      - db.posts.FindOne({_id}).likeCount → 42 (flushed from Redis)
      - miniredis.Exists('counter:{postId}:like') → false or reset

  # ── 内容审核流转场景 ──────────────────────────────────────────────
  - name: post_moderation_flow
    go_func: TestPostModerationFlow
    status: pending
    command: ModeratePost (pending → approved → rejected)
    seed: [fixture.NewPost(moderationStatus=pending)]
    assertions:
      - after approve: db.posts.FindOne.moderationStatus → 'approved'
      - after reject: db.posts.FindOne.moderationStatus → 'rejected'
      - eventSpy.AssertPublished("ContentModerated") for each transition

  # ── 未覆盖 API 占位（status: pending，实施时补 go_func）────────────────
  - name: search_posts_contract
    operation: SearchPosts
    go_func: TestSearchPostsContract
    status: pending
    command: SearchPosts
  - name: list_profile_interaction_activities_received_contract
    operation: ListProfileInteractionActivitiesReceived
    go_func: TestListProfileInteractionActivitiesReceivedContract
    status: pending
    command: ListProfileInteractionActivitiesReceived
  - name: list_profile_interaction_activities_sent_contract
    operation: ListProfileInteractionActivitiesSent
    go_func: TestListProfileInteractionActivitiesSentContract
    status: pending
    command: ListProfileInteractionActivitiesSent
  - name: update_profile_interaction_state_contract
    operation: UpdateProfileInteractionState
    go_func: TestProfileShareInteractionDurableHTTPContract
    command: UpdateProfileInteractionState(read, idempotent)
  - name: submit_post_publication_replay_contract
    operation: SubmitPostPublication
    go_func: TestPostPublicationIntentConcurrentReplayCreatesOnePost
    command: SubmitPostPublication (same immutable PublishIntent replayed concurrently)
    assertions:
      - 同一 actor + publishIntentId + localDraftId 的并发重放只创建一个 Post/outbox
      - 所有并发调用返回字节稳定的首次 receipt
  - name: submit_post_publication_intent_reuse_conflict
    operation: SubmitPostPublication
    go_func: TestPostPublicationIntentRejectsReuseForAnotherDraft
    command: SubmitPostPublication (same publishIntentId with another localDraftId)
    assertions:
      - 返回 CONTENT.USER.idempotency_conflict
      - 只有首次 Post/receipt/outbox，第二草稿不创建业务对象
  - name: delete_post_contract
    operation: DeletePost
    go_func: TestDeletePostContract
    command: DeletePost
  - name: get_counters_contract
    operation: GetCounters
    go_func: TestGetCounters
    command: GetCounters
  - name: generate_article_summary_contract
    operation: GenerateArticleSummary
    go_func: TestGenerateArticleSummaryContract
    status: pending
    command: GenerateArticleSummary
  - name: get_helper_read_contract
    operation: GetHelperRead
    go_func: TestGetHelperReadContract
    status: pending
    command: GetHelperRead
  - name: update_post_settings_contract
    operation: UpdatePostSettings
    go_func: TestUpdatePostSettingsContract
    command: UpdatePostSettings
  - name: promote_post_to_work_contract
    operation: PromotePostToWork
    go_func: TestPromotePostToWorkContract
    command: PromotePostToWork
  - name: promote_post_preserves_threads_contract
    operation: PromotePostToWork
    go_func: TestPromotePostKeepsCountersAndCommentThread
    command: PromotePostToWork(retain postId/comments; ContentReaction remains linked by stable postId)
  - name: list_user_posts_contract
    operation: ListUserPosts
    go_func: TestListUserPosts
    command: ListUserPosts
  - name: list_user_posts_by_identity
    operation: ListUserPosts
    go_func: TestListUserPostsByIdentity
    command: ListUserPosts(identity=work,type=article)
  - name: post_visibility_closed_set_contract
    operation: GetPost
    go_func: TestPostDetailAllowsOnlyPublicOrOwnerVisibility
    command: GetPost(public/private only; retired circle visibility fails closed)
  - name: private_post_non_disclosure_contract
    operation: GetPost
    go_func: TestPrivatePostBlocksNonAuthorViewer
    command: GetPost(private post as non-owner)
    assertions:
      - response.code == "CONTENT.USER.post_not_found"
      - http_status == 404
  - name: assistant_access_revoked_after_settings_change
    operation: UpdatePostSettings
    go_func: TestAssistantAccessRevokedAfterSettingsChange
    command: UpdatePostSettings(assistantUsePolicy=exclude or visibility=private)
    assertions:
      - revoked non-owner GetPost returns 404 CONTENT.USER.post_not_found
      - private object existence is not disclosed as a 403 authorization result
  - name: post_projection_rebuild_replays_durable_outbox
    operation: SubmitPostPublication
    go_func: TestPostProjectionRebuildReplaysDurableOutbox
    command: replay PostPublished from a fresh projection checkpoint
    assertions:
      - deleting rm_discovery_feed does not mutate the Post aggregate
      - a fresh consumer replays durable outbox facts and rebuilds the projection
      - the saved checkpoint prevents duplicate replay
  - name: get_app_config_contract
    operation: GetAppConfig
    go_func: TestGetAppConfigUsesGenericCanaryMatrixPayload
    command: GetAppConfig
  - name: get_author_impact_contract
    operation: GetAuthorImpact
    go_func: TestGetAuthorImpactReturnsBehaviorAggregation
    command: GetAuthorImpact
  - name: list_author_impact_evidence_contract
    operation: ListAuthorImpactEvidence
    go_func: TestAuthorImpactEvidenceDrilldownIsContentAnchoredAndPrivacySafe
    command: ListAuthorImpactEvidence
  - name: get_my_footprint_contract
    operation: GetMyFootprint
    go_func: TestGetMyFootprintContract
    command: GetMyFootprint
  - name: request_original_image_access_contract
    operation: RequestOriginalImageAccess
    go_func: TestRequestOriginalImageAccessContract
    command: RequestOriginalImageAccess
  - name: submit_post_publication_with_media_contract
    operation: SubmitPostPublication
    go_func: TestSubmitPostPublicationBindsReadyOwnedMedia
    command: SubmitPostPublication (ready owned MediaAsset references)
  - name: get_my_intersection_summary_contract
    operation: GetMyIntersectionSummary
    go_func: TestIntersectionService_SummaryNewCountAndVisitClears
    command: GetMyIntersectionSummary
  - name: list_my_intersections_contract
    operation: ListMyIntersections
    go_func: TestIntersectionService_ListFiltersAndPaginates
    command: ListMyIntersections
  - name: mark_intersections_visited_contract
    operation: MarkIntersectionsVisited
    go_func: TestIntersectionService_SummaryNewCountAndVisitClears
    command: MarkIntersectionsVisited
  - name: get_object_intersections_contract
    operation: GetObjectIntersections
    go_func: TestIntersectionService_ObjectIntersectionsRanksByAnchorStrength
    command: GetObjectIntersections
