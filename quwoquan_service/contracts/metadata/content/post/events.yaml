aggregate: Post

events:
  - name: PostPublished
    description: 一次性 PublishIntent 被接受并完成发布
    producer: content-service
    consumers: [feed-projection, search-service, recommendation-engine, entity-service, circle-service, notification-service]
    channel: transactional_outbox
    payload_entity: Post
    payload_fields: [_id, publishIntentId, localDraftId, authorId, creatorProfileId, creatorArchetype, creatorProfileVersion, creatorDisclosure, experienceClaimMode, contentType, contentIdentity, status, primaryHomepageId, publishedAt, lastActiveAt, sourceTaskId]

  - name: PostUpdated
    description: 内容更新
    producer: content-service
    consumers: [feed-projection, search-service, recommendation-engine, entity-service, circle-service]
    channel: transactional_outbox
    payload_entity: Post
    payload_fields: [_id, contentIdentity, title, body, semanticMentions, tagRefs, entityRefs, primaryHomepageId, updatedAt]

  - name: PostSettingsUpdated
    description: 发布后可变设置更新（可见性 / 小趣排除 / Homepage 引用）
    producer: content-service
    consumers: [recommendation-engine, assistant-service, entity-service]
    channel: transactional_outbox
    payload_entity: Post
    payload_fields: [_id, authorId, contentIdentity, visibility, primaryHomepageId, assistantUsePolicy, updatedAt]

  - name: PostPromotedToWork
    description: 点滴原地升级为作品
    producer: content-service
    consumers: [recommendation-engine, notification-service, assistant-service, entity-service]
    channel: transactional_outbox
    payload_fields: [postId, authorId, fromIdentity, toIdentity, previousContentType, contentType, title, summary, tagRefs, entityRefs, visibility, primaryHomepageId, assistantUsePolicy, promotedAt]

  - name: PostDeleted
    description: 内容删除
    producer: content-service
    consumers: [feed-projection, search-service, recommendation-engine, entity-service, circle-service, notification-service]
    channel: transactional_outbox
    payload_entity: Post
    payload_fields: [_id, authorId, contentType, contentIdentity, status, deletedAt]

  - name: PostQuoted
    description: 用户引用后发布（按 moment 落库）
    producer: content-service
    consumers: [notification-service, recommendation-engine]
    channel: transactional_outbox
    payload_fields: [postId, sourcePostId, resharerUserId, createdAt]


  - name: ContentViewed
    description: 内容浏览
    producer: content-service
    consumers: [recommendation-engine]
    channel: direct
    payload_fields: [postId, userId, dwellMs, sessionId]
    recommend_impact: hot_path_signal

  - name: PostPrivacyRedacted
    description: 隐私删除第一阶段完成，个人字段已脱敏
    producer: content-service
    consumers: [feed-projection, search-service, recommendation-engine, entity-service, circle-service, platform-ops]
    channel: transactional_outbox
    payload_fields: [postId, postVersion, redactedAt, retentionExpiresAt]

  - name: PostPurged
    description: retention 到期后 Post 与墓碑硬清除
    producer: content-service
    consumers: [feed-projection, search-service, recommendation-engine, entity-service, circle-service, platform-ops]
    channel: transactional_outbox
    payload_fields: [postId, purgedAt]

  - name: PostImported
    description: 签名 Data/PGC release 经 BulkImportFacade 汇入在线 command pipeline
    producer: content-service
    consumers: [feed-projection, search-service, recommendation-engine, entity-service, circle-service, platform-ops]
    channel: transactional_outbox
    payload_fields: [postId, postVersion, sourceReleaseId, idempotencyKey, signatureKeyId, importedAt]

  - name: PostTombstoned
    description: 内容墓碑写入完成
    producer: content-service
    consumers: []
    channel: transactional_outbox
    payload_fields: [postId, deletedAt, reason]
