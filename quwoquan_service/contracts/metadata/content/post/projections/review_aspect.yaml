version: 1
read_model: ReviewAspect
description: |
  口碑维度反馈（contentIdentity=review）。每项是一个评价维度的打分；
  端只读展示，aspectKey 为稳定维度键，label 为展示名，score 为 1-5 星。

source_entities:
  - Post

consumers:
  - app

client_projection:
  dart_class: ReviewAspect
  base_class: ""
  output_path: cloud/runtime/generated/content/review_aspect.g.dart
  fields:
    - name: aspectKey
      dart_type: String
      nullable: false
      source: aspectKey
      aliases: [aspectKey, key]
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      aliases: [label]
      default: "''"
    - name: score
      dart_type: int
      nullable: false
      source: score
      aliases: [score]
      default: "0"
