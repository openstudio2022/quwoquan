version: 1
read_model: ContentPostDetailWire

description: |
  GET post 响应中 PostBaseDto 之外的扩展子树（详情页 / 文章投射 / 沉浸器共享）。
  与 ArticleDetailWireKeys、ContentPostImmersiveWireKeys 对齐；完整 JSON 回声仍由
  ContentPostDetailPayload 保留供 forward-compat。

source_entities:
  - Post

consumers:
  - app

client_projection:
  dart_class: ContentPostDetailWireDto
  base_class: ""
  output_path: cloud/runtime/generated/content/content_post_detail_wire_dto.g.dart
  dart_imports:
    - article_entity_mention_dto.g.dart
    - content_post_detail_circle_summary_wire_dto.g.dart
  fields:
    - name: isOfficial
      dart_type: bool
      nullable: true
      source: isOfficial
      aliases: [isOfficial]
      default: "null"

    - name: badge
      dart_type: String
      nullable: true
      source: badge
      aliases: [badge]
      default: "null"

    - name: articleTemplate
      dart_type: String
      nullable: true
      source: articleTemplate
      aliases: [articleTemplate]
      default: "null"

    - name: articleFontPreset
      dart_type: String
      nullable: true
      source: articleFontPreset
      aliases: [articleFontPreset]
      default: "null"

    - name: articleMarkdown
      dart_type: String
      nullable: true
      source: articleMarkdown
      aliases: [articleMarkdown]
      default: "null"

    - name: articleMarkdownVersion
      dart_type: String
      nullable: true
      source: articleMarkdownVersion
      aliases: [articleMarkdownVersion]
      default: "null"

    - name: articleMarkdownDigest
      dart_type: String
      nullable: true
      source: articleMarkdownDigest
      aliases: [articleMarkdownDigest]
      default: "null"

    - name: articleAssetManifest
      dart_type: Map<String, dynamic>
      nullable: true
      source: articleAssetManifest
      aliases: [articleAssetManifest]
      default: "null"

    - name: articleRenderProfile
      dart_type: Map<String, dynamic>
      nullable: true
      source: articleRenderProfile
      aliases: [articleRenderProfile]
      default: "null"

    - name: contentVertical
      dart_type: String
      nullable: true
      source: contentVertical
      aliases: [contentVertical, categoryId, category, vertical]
      default: "null"

    - name: paperThemeMode
      dart_type: String
      nullable: true
      source: paperThemeMode
      aliases: [paperThemeMode]
      default: "null"

    - name: paperTexture
      dart_type: String
      nullable: true
      source: paperTexture
      aliases: [paperTexture, articlePaperTexture]
      default: "null"

    - name: entityMentions
      dart_type: List<ArticleEntityMentionDto>
      nullable: false
      source: entityMentions
      aliases: [entityMentions]
      list_element_dart_class: ArticleEntityMentionDto
      default: "<ArticleEntityMentionDto>[]"

    - name: coverUrlWire
      dart_type: String
      nullable: true
      source: coverUrl
      aliases: [coverUrl]
      default: "null"
      description: wire 顶层 coverUrl（与 PostBaseDto.coverUrl 并存时的覆盖）

    - name: circleSummaries
      dart_type: List<ContentPostDetailCircleSummaryWireDto>
      nullable: false
      source: circleSummaries
      aliases: [circleSummaries]
      list_element_dart_class: ContentPostDetailCircleSummaryWireDto

    - name: circleIds
      dart_type: List<String>
      nullable: true
      source: circleIds
      aliases: [circleIds]
      default: "null"

    - name: circleNames
      dart_type: List<String>
      nullable: true
      source: circleNames
      aliases: [circleNames]
      default: "null"

    - name: circleId
      dart_type: String
      nullable: true
      source: circleId
      aliases: [circleId]
      default: "null"

    - name: circleName
      dart_type: String
      nullable: true
      source: circleName
      aliases: [circleName]
      default: "null"

    - name: tagRefs
      dart_type: List<String>
      nullable: true
      source: tagRefs
      aliases: [tagRefs]
      default: "null"

    - name: visibility
      dart_type: String
      nullable: true
      source: visibility
      aliases: [visibility]
      default: "null"
