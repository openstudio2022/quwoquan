read_model: ContentPostDetailWire

description: |
  GET post 响应中 PostBaseDto 之外的扩展子树（详情页 / 文章投射 / 沉浸器共享）。
  与 ArticleDetailWireKeys、ContentPostImmersiveWireKeys 对齐；不承载 CirclePostPlacement。

source_entities:
  - Post

consumers:
  - app

client_projection:
  dart_class: ContentPostDetailWireDto
  base_class: ""
  output_path: cloud/runtime/generated/content/content_post_detail_wire_dto.g.dart
  dart_imports:
    - article_entity_mention_dto.g.dart
  fields:
    - name: isOfficial
      dart_type: bool
      nullable: true
      source: isOfficial
      default: "null"

    - name: badge
      dart_type: String
      nullable: true
      source: badge
      default: "null"

    - name: articleTemplate
      dart_type: String
      nullable: true
      source: articleTemplate
      default: "null"

    - name: articleFontPreset
      dart_type: String
      nullable: true
      source: articleFontPreset
      default: "null"

    - name: articleMarkdown
      dart_type: String
      nullable: true
      source: articleMarkdown
      default: "null"

    - name: markdownDialect
      dart_type: String
      nullable: true
      source: markdownDialect
      default: "null"

    - name: articleMarkdownDigest
      dart_type: String
      nullable: true
      source: articleMarkdownDigest
      default: "null"

    - name: articleAssetManifest
      dart_type: Map<String, dynamic>
      nullable: true
      source: articleAssetManifest
      default: "null"

    - name: articleRenderProfile
      dart_type: Map<String, dynamic>
      nullable: true
      source: articleRenderProfile
      default: "null"

    - name: contentVertical
      dart_type: String
      nullable: true
      source: contentVertical
      default: "null"

    - name: paperThemeMode
      dart_type: String
      nullable: true
      source: paperThemeMode
      default: "null"

    - name: paperTexture
      dart_type: String
      nullable: true
      source: paperTexture
      default: "null"

    - name: entityMentions
      dart_type: List<ArticleEntityMentionDto>
      nullable: false
      source: entityMentions
      list_element_dart_class: ArticleEntityMentionDto
      default: "<ArticleEntityMentionDto>[]"

    - name: coverUrlWire
      dart_type: String
      nullable: true
      source: coverUrl
      default: "null"
      description: wire 顶层 coverUrl（与 PostBaseDto.coverUrl 并存时的覆盖）

    - name: tagRefs
      dart_type: List<String>
      nullable: true
      source: tagRefs
      default: "null"

    - name: visibility
      dart_type: String
      nullable: true
      source: visibility
      default: "null"
