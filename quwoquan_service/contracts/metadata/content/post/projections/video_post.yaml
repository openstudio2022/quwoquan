version: 1
read_model: VideoPost

description: |
  视频类帖子 ReadModel（视频频道）。
  从 Post（contentType=video）投影，供发现页视频 Tab 消费。
  width/height 存储视频分辨率，在上传时由处理管道写入。

storage_backend: mongodb
collection: rm_discovery_feed

source_entities:
  - Post

consumers:
  - app (discovery/video tab)

fields:
  - { name: postId,         type: ObjectId }
  - { name: contentType,    type: enum,   description: "固定为 video" }
  - { name: contentIdentity, type: enum,  description: "内容身份层。视频作品固定为 work" }
  - { name: authorId,              type: string }
  - { name: authorNickname,        type: string, description: 作者昵称（反范式） }
  - { name: authorAvatarUrl,       type: string, description: 作者头像（反范式） }
  - { name: authorBackgroundUrl,   type: string, nullable: true, description: 作者主页背景图（反范式，null 表示未配置） }
  - { name: authorRoleLabel,       type: string, description: 作者角色短标签（反范式，如「旅行创作者」） }
  - { name: authorIdentityTags,    type: "[]string", description: 作者身份标签（反范式，首页卡片最多展示 2 个） }
  - { name: authorVerified,        type: bool, description: 作者认证标记（反范式，驱动卡片认证角标） }
  - { name: body,                  type: string, description: 视频简介（可选） }
  - { name: videoUrl,       type: string, description: 视频流 URL }
  - { name: thumbnailUrl,   type: string, description: 封面图 URL }
  - { name: width,          type: int,    description: "视频分辨率宽（px），处理管道写入" }
  - { name: height,         type: int,    description: "视频分辨率高（px），处理管道写入" }
  - { name: durationMs,     type: int,    description: 视频时长（毫秒） }
  - { name: likeCount,      type: int }
  - { name: commentCount,   type: int }
  - { name: shareCount,     type: int }
  - { name: publishedAt,    type: timestamp }
  - { name: createdAt,      type: timestamp, description: "内容首次进入系统时间（仅插入时写一次，永不变）" }
  - { name: updatedAt,      type: timestamp, description: "内容最后实质变更时间（无实质变更不推进）" }

# App 端契约（client_projection）
# 由 codegen_app_metadata 读取，生成 VideoPostDto（DO NOT EDIT 产物）
# base_class: PostBaseDto（手写抽象基类，见 post_base_dto.dart）
client_projection:
  dart_class: VideoPostDto
  base_class: PostBaseDto
  output_path: cloud/runtime/generated/content/video_post_dto.g.dart
  dart_imports:
    - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
  computed_getters:
    - name: displayFormat
      dart_return_type: String
      nullable: false
      description: "展示格式。视频作品固定为 video。"
      body: "return 'video';"
    - name: aspectRatio
      dart_return_type: "double?"
      nullable: true
      description: "视频宽高比（w/h）。未记录分辨率时返回 null。"
      body: |
        if (width == null || height == null || height! <= 0) return null;
        return width! / height!;
  fields:
    - name: id
      dart_type: String
      nullable: false
      source: postId
      aliases: [postId, _id]
      default: "''"

    - name: type
      dart_type: String
      nullable: false
      source: contentType
      aliases: [contentType, category]
      default: "'video'"

    - name: identity
      dart_type: String
      nullable: false
      source: contentIdentity
      aliases: [contentIdentity, identity]
      default: "'work'"

    - name: assistantUsePolicy
      dart_type: String
      nullable: false
      source: assistantUsePolicy
      aliases: [assistantUsePolicy]
      default: "'inherit'"

    - name: authorId
      dart_type: String
      nullable: false
      source: authorId
      aliases: [userId, author_id]
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: authorNickname
      aliases: [authorNickname, nickname, username, displayName]
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: false
      source: authorAvatarUrl
      aliases: [authorAvatarUrl, avatarUrl, avatar]
      default: "''"

    - name: authorBackgroundUrl
      dart_type: String
      nullable: true
      source: authorBackgroundUrl
      aliases: [authorBackgroundUrl]
      default: "null"
      description: "作者主页背景图（反范式）；null 时 UI 显示默认渐变背景"

    - name: authorRoleLabel
      dart_type: String
      nullable: false
      source: authorRoleLabel
      aliases: [authorRoleLabel, roleLabel, authorRole]
      default: "''"
      description: "作者角色短标签（反范式），首页推荐卡顶部展示"

    - name: authorIdentityTags
      dart_type: List<String>
      nullable: false
      source: authorIdentityTags
      aliases: [authorIdentityTags, identityTags, authorTags]
      default: "<String>[]"
      description: "作者身份标签（反范式），首页推荐卡顶部最多展示 2 个"

    - name: authorVerified
      dart_type: bool
      nullable: false
      source: authorVerified
      aliases: [authorVerified, verified, isVerified]
      default: "false"
      description: "作者认证标记（反范式），驱动卡片认证角标"

    - name: body
      dart_type: String
      nullable: true
      source: body
      aliases: [body, description, content, caption]
      default: "null"
      description: "视频简介（可选）"

    - name: videoUrl
      dart_type: String
      nullable: false
      source: videoUrl
      aliases: [videoUrl, video_url, url]
      default: "''"
      description: "视频流 URL"

    - name: thumbnailUrl
      dart_type: String
      nullable: false
      source: thumbnailUrl
      aliases: [thumbnailUrl, thumbnail, coverUrl, cover]
      default: "''"
      description: "视频封面图"

    - name: width
      dart_type: int
      nullable: true
      source: width
      aliases: [width, videoWidth, video_width, w]
      default: "null"
      description: "视频分辨率宽（px）"

    - name: height
      dart_type: int
      nullable: true
      source: height
      aliases: [height, videoHeight, video_height, h]
      default: "null"
      description: "视频分辨率高（px）"

    - name: durationMs
      dart_type: int
      nullable: true
      source: durationMs
      aliases: [durationMs, duration_ms, duration]
      default: "null"
      description: "视频时长（毫秒）"

    - name: likeCount
      dart_type: int
      nullable: false
      source: likeCount
      aliases: [likeCount, likesCount, likes, like_count]
      default: "0"

    - name: commentCount
      dart_type: int
      nullable: false
      source: commentCount
      aliases: [commentCount, commentsCount, comments, comment_count]
      default: "0"

    - name: shareCount
      dart_type: int
      nullable: false
      source: shareCount
      aliases: [shareCount, shares, share_count]
      default: "0"

    - name: createdAt
      dart_type: DateTime
      nullable: false
      source: createdAt
      aliases: [createdAt, created_at]
      default: "DateTime(0)"
      description: "创作时间（首次进入系统）。唯一源为 createdAt/created_at；不再以 publishedAt 借壳。"

    - name: updatedAt
      dart_type: DateTime
      nullable: true
      source: updatedAt
      aliases: [updatedAt, updated_at]
      default: "null"
      description: "最后实质更新时间；与 createdAt 相等或更早时 UI 只显示创作时间，更晚时显示创作+更新。"

    - name: publishedAt
      dart_type: DateTime
      nullable: true
      source: publishedAt
      aliases: [publishedAt, published_at]
      default: "null"
      description: "首次公开时间（仅首次发布置位）。"

    - name: intersectionReasons
      dart_type: List<IntersectionReason>
      nullable: true
      source: intersectionReasons
      aliases: [intersectionReasons]
      list_element_dart_class: IntersectionReason
      default: "null"
      description: "交集理由（云侧推荐管线预生成；端只读展示，无来源时为 null）"
