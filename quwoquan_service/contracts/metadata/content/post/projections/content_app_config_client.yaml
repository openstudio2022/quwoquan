# GET /v1/config/app 响应中 `content` 子树：客户端运行时实际消费的键（与 OpenAPI AppConfig.content 文档对齐）。
# 解析实现：tools/codegen_app_metadata/content_app_config_client_codegen.go → content_app_config_client_dto.g.dart
version: 1
description: |
  feature_flags: Map<string, bool>，与本地 ContentUIConfig 合并。
  gray_release: experiment_bucket / current_stage / canary_matrix（行内 stage + rolloutPercent）。
  client_state_sync: 透传至 ClientStateSyncConfig.fromMap（snake_case only）。
  home_channels: 首页频道运营覆盖列表（与 ui_config.home_channels 同 schema：
    id/label_key/template/feed_query/mood_copy_key/order）；端按 order 排序、
    远程整体覆盖本地默认，缺失/解析失败回退 ContentUIConfig.homeChannels。
documented_keys:
  - feature_flags
  - gray_release
  - client_state_sync
  - home_channels
  - comment
  - comment.max_length
  - comment.reply_preview_count
  - comment.reply_first_expand_page_size
  - comment.reply_expand_page_size
  - comment.fold_line_count
  - comment.sort.default
  - comment.attachment.max_images
comment_defaults:
  max_length: 500
  # 二级回复随列表默认回显条数（对标小红书「默认 1 条」）。
  reply_preview_count: 1
  # 首次点击「展开 N 条回复」最多加载条数；后续展开用 reply_expand_page_size。
  reply_first_expand_page_size: 5
  reply_expand_page_size: 10
  fold_line_count: 3
  sort:
    default: recommended
  attachment:
    max_images: 1
