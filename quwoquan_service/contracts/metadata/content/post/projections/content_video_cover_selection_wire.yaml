version: 1
read_model: ContentVideoCoverSelectionWire

description: |
  视频封面 auto/manual 操作响应 wire（合并为单一 DTO，manual 时含 manualCoverAssetId）。

source_entities:
  - MediaAsset

consumers:
  - app

client_projection:
  dart_class: ContentVideoCoverSelectionWireDto
  base_class: ""
  output_path: cloud/runtime/generated/content/content_video_cover_selection_wire_dto.g.dart
  fields:
    - name: mediaId
      dart_type: String
      nullable: false
      source: mediaId
      aliases: [mediaId]
      default: "''"

    - name: coverStrategy
      dart_type: String
      nullable: false
      source: coverStrategy
      aliases: [coverStrategy]
      default: "''"

    - name: manualCoverAssetId
      dart_type: String
      nullable: true
      source: manualCoverAssetId
      aliases: [manualCoverAssetId]

    - name: thumbnailUrl
      dart_type: String
      nullable: false
      source: thumbnailUrl
      aliases: [thumbnailUrl, thumbnail, coverUrl, cover]
      default: "''"
      description: "本次选择后可展示的视频未播放态主封面 URL"

    - name: coverUrl
      dart_type: String
      nullable: false
      source: coverUrl
      aliases: [coverUrl, cover, thumbnailUrl, thumbnail]
      default: "''"
      description: "通用封面 URL；视频时与 thumbnailUrl 同源或作兼容回退"

    - name: coverFrameTimeMs
      dart_type: int
      nullable: true
      source: coverFrameTimeMs
      aliases: [coverFrameTimeMs, cover_frame_time_ms]
      default: "null"
      description: "选择的封面帧时间点（毫秒）；默认首帧为 0"
