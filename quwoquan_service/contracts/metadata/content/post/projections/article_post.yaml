read_model: ArticlePost

description: |
  文章类帖子 ReadModel（文章频道）。
  从 Post（contentType=article）投影，供发现页文章 Tab 消费。

storage_backend: mongodb
collection: rm_discovery_feed

source_entities:
  - Post

consumers:
  - app (discovery/article tab)

fields:
  - { name: postId,         type: ObjectId }
  - { name: contentType,    type: enum,   description: "固定为 article" }
  - { name: contentIdentity, type: enum,  description: "内容身份层。笔记作品固定为 work" }
  - { name: authorId,              type: string }
  - { name: authorDisplayName,     type: string, description: 作者显示名（反范式） }
  - { name: authorAvatarUrl,       type: string, description: 作者头像（反范式） }
  - { name: authorBackgroundUrl,   type: string, nullable: true, description: 作者主页背景图（反范式，null 表示未配置） }
  - { name: authorRoleLabel,       type: string, description: 作者角色短标签（反范式，如「旅行创作者」） }
  - { name: authorIdentityTags,    type: "[]string", description: 作者身份标签（反范式，首页卡片最多展示 2 个） }
  - { name: authorVerified,        type: bool, description: 作者认证标记（反范式，驱动卡片认证角标） }
  - { name: title,                 type: string, description: 文章标题 }
  - { name: body,           type: string, description: 文章摘要或正文 }
  - { name: coverUrl,       type: string, description: 封面图 URL }
  - { name: likeCount,      type: int }
  - { name: commentCount,   type: int }
  - { name: shareCount,     type: int }
  - { name: publishedAt,    type: timestamp }
  - { name: createdAt,      type: timestamp, description: "内容首次进入系统时间（仅插入时写一次，永不变）" }
  - { name: updatedAt,      type: timestamp, description: "内容最后实质变更时间（无实质变更不推进）" }
  - { name: contentVertical, type: string, nullable: true, description: "推荐垂类归一结果，用于行为归因与观测分桶" }
  - { name: recallPath, type: string, nullable: true, description: "推荐召回路径，用于行为归因与观测分桶" }
  - { name: supplySource, type: string, nullable: true, description: "内容供给来源 user_generated/data_engineering/product_ops 等" }

# App 端契约（client_projection）
# 由 codegen_app_metadata 读取，生成 ArticlePostDto（DO NOT EDIT 产物）
# base_class: PostBaseDto（手写抽象基类，见 post_base_dto.dart）
client_projection:
  dart_class: ArticlePostDto
  base_class: PostBaseDto
  output_path: cloud/runtime/generated/content/article_post_dto.g.dart
  dart_imports:
    - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
  computed_getters:
    - name: displayFormat
      source: displayFormat
      dart_return_type: String
      nullable: false
      description: "展示格式。作品态 article 在 UI 术语上统一映射为 note。"
      body: "return 'note';"
  fields:
    - name: id
      dart_type: String
      nullable: false
      source: postId
      default: "''"

    - name: type
      dart_type: String
      nullable: false
      source: contentType
      default: "'article'"

    - name: identity
      dart_type: String
      nullable: false
      source: contentIdentity
      default: "'work'"

    - name: assistantUsePolicy
      dart_type: String
      nullable: false
      source: assistantUsePolicy
      default: "'inherit'"

    - name: authorId
      dart_type: String
      nullable: false
      source: authorId
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: authorDisplayName
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: false
      source: authorAvatarUrl
      default: "''"

    - name: authorBackgroundUrl
      dart_type: String
      nullable: true
      source: authorBackgroundUrl
      default: "null"
      description: "作者主页背景图（反范式）；null 时 UI 显示默认渐变背景"

    - name: authorRoleLabel
      dart_type: String
      nullable: false
      source: authorRoleLabel
      default: "''"
      description: "作者角色短标签（反范式），首页推荐卡顶部展示"

    - name: authorIdentityTags
      dart_type: List<String>
      nullable: false
      source: authorIdentityTags
      default: "<String>[]"
      description: "作者身份标签（反范式），首页推荐卡顶部最多展示 2 个"

    - name: authorVerified
      dart_type: bool
      nullable: false
      source: authorVerified
      default: "false"
      description: "作者认证标记（反范式），驱动卡片认证角标"

    - name: title
      dart_type: String
      nullable: false
      source: title
      default: "''"
      description: "文章标题"

    - name: body
      dart_type: String
      nullable: false
      source: body
      default: "''"
      description: "文章正文快照（由 articleMarkdown 派生）"

    - name: summary
      dart_type: String
      nullable: false
      source: summary
      default: "''"
      description: "文章分发摘要"

    - name: coverUrl
      dart_type: String
      nullable: false
      source: coverUrl
      default: "''"
      description: "封面图 URL"

    - name: articleTemplate
      dart_type: String
      nullable: false
      source: articleTemplate
      default: "'gentle'"
      description: "文章书本模板"

    - name: articleFontPreset
      dart_type: String
      nullable: false
      source: articleFontPreset
      default: "'clean'"
      description: "文章字体预设"

    - name: likeCount
      dart_type: int
      nullable: false
      source: likeCount
      default: "0"

    - name: commentCount
      dart_type: int
      nullable: false
      source: commentCount
      default: "0"

    - name: shareCount
      dart_type: int
      nullable: false
      source: shareCount
      default: "0"

    - name: createdAt
      dart_type: DateTime
      nullable: false
      source: createdAt
      default: "DateTime(0)"
      description: "创作时间（首次进入系统）。唯一源为 createdAt/created_at；不再以 publishedAt 借壳。"

    - name: updatedAt
      dart_type: DateTime
      nullable: true
      source: updatedAt
      default: "null"
      description: "最后实质更新时间；与 createdAt 相等或更早时 UI 只显示创作时间，更晚时显示创作+更新。"

    - name: publishedAt
      dart_type: DateTime
      nullable: true
      source: publishedAt
      default: "null"
      description: "首次公开时间（仅首次发布置位）。"

    - name: contentVertical
      dart_type: String
      nullable: true
      source: contentVertical
      default: "null"
      description: "推荐垂类归一结果；端侧行为上报透传，不参与 UI 展示。"

    - name: recallPath
      dart_type: String
      nullable: true
      source: recallPath
      default: "null"
      description: "推荐召回路径；端侧行为上报透传，不参与 UI 展示。"

    - name: supplySource
      dart_type: String
      nullable: true
      source: supplySource
      default: "null"
      description: "内容供给来源；端侧行为上报透传，不参与 UI 展示。"

    - name: intersectionReasons
      dart_type: List<IntersectionReason>
      nullable: true
      source: intersectionReasons
      list_element_dart_class: IntersectionReason
      default: "null"
      description: "交集理由（云侧推荐管线预生成；端只读展示，无来源时为 null）"
