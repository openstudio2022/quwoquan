version: 1
read_model: ArticlePost

description: |
  文章类帖子 ReadModel（文章频道）。
  从 Post（contentType=article）投影，供发现页文章 Tab 消费。

storage_backend: mongodb
collection: rm_discovery_feed

source_entities:
  - Post

consumers:
  - app (discovery/article tab)

fields:
  - { name: postId,         type: ObjectId }
  - { name: contentType,    type: enum,   description: "固定为 article" }
  - { name: contentIdentity, type: enum,  description: "内容身份层。笔记作品固定为 work" }
  - { name: authorId,              type: string }
  - { name: authorNickname,        type: string, description: 作者昵称（反范式） }
  - { name: authorAvatarUrl,       type: string, description: 作者头像（反范式） }
  - { name: authorBackgroundUrl,   type: string, nullable: true, description: 作者主页背景图（反范式，null 表示未配置） }
  - { name: title,                 type: string, description: 文章标题 }
  - { name: body,           type: string, description: 文章摘要或正文 }
  - { name: coverUrl,       type: string, description: 封面图 URL }
  - { name: likeCount,      type: int }
  - { name: commentCount,   type: int }
  - { name: shareCount,     type: int }
  - { name: publishedAt,    type: timestamp }
  - { name: createdAt,      type: timestamp, description: "内容首次进入系统时间（仅插入时写一次，永不变）" }
  - { name: updatedAt,      type: timestamp, description: "内容最后实质变更时间（无实质变更不推进）" }

# App 端契约（client_projection）
# 由 codegen_app_metadata 读取，生成 ArticlePostDto（DO NOT EDIT 产物）
# base_class: PostBaseDto（手写抽象基类，见 post_base_dto.dart）
client_projection:
  dart_class: ArticlePostDto
  base_class: PostBaseDto
  output_path: cloud/runtime/generated/content/article_post_dto.g.dart
  dart_imports:
    - package:quwoquan_app/cloud/runtime/generated/recommendation/intersection_reason.g.dart
  computed_getters:
    - name: displayFormat
      dart_return_type: String
      nullable: false
      description: "展示格式。作品态 article 在 UI 术语上统一映射为 note。"
      body: "return 'note';"
  fields:
    - name: id
      dart_type: String
      nullable: false
      source: postId
      aliases: [postId, _id]
      default: "''"

    - name: type
      dart_type: String
      nullable: false
      source: contentType
      aliases: [contentType, category]
      default: "'article'"

    - name: identity
      dart_type: String
      nullable: false
      source: contentIdentity
      aliases: [contentIdentity, identity]
      default: "'work'"

    - name: assistantUsePolicy
      dart_type: String
      nullable: false
      source: assistantUsePolicy
      aliases: [assistantUsePolicy]
      default: "'inherit'"

    - name: authorId
      dart_type: String
      nullable: false
      source: authorId
      aliases: [userId, author_id]
      default: "''"

    - name: displayName
      dart_type: String
      nullable: false
      source: authorNickname
      aliases: [authorNickname, nickname, username, displayName]
      default: "''"

    - name: avatarUrl
      dart_type: String
      nullable: false
      source: authorAvatarUrl
      aliases: [authorAvatarUrl, avatarUrl, avatar]
      default: "''"

    - name: authorBackgroundUrl
      dart_type: String
      nullable: true
      source: authorBackgroundUrl
      aliases: [authorBackgroundUrl]
      default: "null"
      description: "作者主页背景图（反范式）；null 时 UI 显示默认渐变背景"

    - name: title
      dart_type: String
      nullable: false
      source: title
      aliases: [title]
      default: "''"
      description: "文章标题"

    - name: body
      dart_type: String
      nullable: false
      source: body
      aliases: [body, description, content]
      default: "''"
      description: "文章正文快照（由 articleMarkdown 派生）"

    - name: summary
      dart_type: String
      nullable: false
      source: summary
      aliases: [summary]
      default: "''"
      description: "文章分发摘要"

    - name: coverUrl
      dart_type: String
      nullable: false
      source: coverUrl
      aliases: [coverUrl, cover, thumbnail, thumbnailUrl]
      default: "''"
      description: "封面图 URL"

    - name: articleTemplate
      dart_type: String
      nullable: false
      source: articleTemplate
      aliases: [articleTemplate]
      default: "'gentle'"
      description: "文章书本模板"

    - name: articleFontPreset
      dart_type: String
      nullable: false
      source: articleFontPreset
      aliases: [articleFontPreset]
      default: "'clean'"
      description: "文章字体预设"

    - name: likeCount
      dart_type: int
      nullable: false
      source: likeCount
      aliases: [likeCount, likesCount, likes, like_count]
      default: "0"

    - name: commentCount
      dart_type: int
      nullable: false
      source: commentCount
      aliases: [commentCount, commentsCount, comments, comment_count]
      default: "0"

    - name: shareCount
      dart_type: int
      nullable: false
      source: shareCount
      aliases: [shareCount, shares, share_count]
      default: "0"

    - name: createdAt
      dart_type: DateTime
      nullable: false
      source: createdAt
      aliases: [createdAt, created_at]
      default: "DateTime(0)"
      description: "创作时间（首次进入系统）。唯一源为 createdAt/created_at；不再以 publishedAt 借壳。"

    - name: updatedAt
      dart_type: DateTime
      nullable: true
      source: updatedAt
      aliases: [updatedAt, updated_at]
      default: "null"
      description: "最后实质更新时间；与 createdAt 相等或更早时 UI 只显示创作时间，更晚时显示创作+更新。"

    - name: publishedAt
      dart_type: DateTime
      nullable: true
      source: publishedAt
      aliases: [publishedAt, published_at]
      default: "null"
      description: "首次公开时间（仅首次发布置位）。"

    - name: intersectionReasons
      dart_type: List<IntersectionReason>
      nullable: true
      source: intersectionReasons
      aliases: [intersectionReasons]
      list_element_dart_class: IntersectionReason
      default: "null"
      description: "交集理由（云侧推荐管线预生成；端只读展示，无来源时为 null）"
