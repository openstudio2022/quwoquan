version: 1
read_model: AuthorImpactItem
description: |
  创作者影响力单条事实（「TA的影响 / 我的影响力」模块行真相源）。
  云侧按 helpType + action + intersectionDimension 反向聚合真实动作计数，
  并产出 primaryText 结论句（如「23人加入相关圈子」「7人读完了TA的记录」；作者本人视角使用「你的记录」），
  端只读直出，禁止本地拼装文案（全局验收 G2）；subtitleText 为影响来源摘要
  （如「来自 AI 产品圈、摄影爱好者圈」），端只读直出；禁止下发转化率/漏斗/增长率等运营指标。
  与 IntersectionReason 单通道对齐，禁止保留 displayText 第二文案字段。

  闭集枚举（端按字符串解析）：
    helpType: relationship | community | decision | knowledge | spread

consumers:
  - app

client_projection:
  dart_class: AuthorImpactItem
  base_class: ""
  output_path: cloud/runtime/generated/content/author_impact_item.g.dart
  # 复用 recommendation 域统一交互子契约值对象（§20.7），跨域引用走相对路径。
  dart_imports:
    - ../recommendation/intersection_text_span.g.dart
    - ../recommendation/intersection_visual.g.dart
    - ../recommendation/intersection_target.g.dart
    - ../recommendation/intersection_propagation_path.g.dart
    - ../recommendation/intersection_representative_actor.g.dart
    - ../recommendation/intersection_action_hint.g.dart
  fields:
    - name: helpType
      dart_type: String
      nullable: false
      source: helpType
      aliases: [helpType]
      default: "''"
    - name: action
      dart_type: String
      nullable: false
      source: action
      aliases: [action]
      default: "''"
    - name: intersectionDimension
      dart_type: String
      nullable: false
      source: intersectionDimension
      aliases: [intersectionDimension]
      default: "''"
    - name: tagRef
      dart_type: String
      nullable: false
      source: tagRef
      aliases: [tagRef]
      default: "''"
    - name: source
      dart_type: String
      nullable: false
      source: source
      aliases: [source]
      default: "''"
    - name: count
      dart_type: int
      nullable: false
      source: count
      aliases: [count]
      default: "0"
    - name: primaryText
      dart_type: String
      nullable: false
      source: primaryText
      aliases: [primaryText]
      default: "''"
    - name: subtitleText
      dart_type: String
      nullable: false
      source: subtitleText
      aliases: [subtitleText]
      default: "''"
    # 统一交互子契约（§20.7，只附加）：
    #   impactId 为该影响事实稳定 id（明细下钻 / 埋点用）；
    #   primarySpans 是 primaryText 的结构化富文本切分，join(spans.text)==primaryText（契约不变量）；
    #   用户展示统一使用「记录」；内部 source/countObjectKind 仍可保留 content/post 闭集。
    #   sampleVisuals 为受影响样本视觉（数字下钻明细展示）；
    #   countTarget 为数字下钻目标（影响明细，可空表示暂不可下钻）；
    #   evidenceSnapshotId 为证据快照 id（完整分页明细 P1 就绪后据此拉全量）；
    #   countObjectKind 为被计数对象类型。
    - name: impactId
      dart_type: String
      nullable: false
      source: impactId
      aliases: [impactId]
      default: "''"
    - name: primarySpans
      dart_type: List<IntersectionTextSpan>
      nullable: false
      source: primarySpans
      aliases: [primarySpans]
      list_element_dart_class: IntersectionTextSpan
    - name: sampleVisuals
      dart_type: List<IntersectionVisual>
      nullable: false
      source: sampleVisuals
      aliases: [sampleVisuals]
      list_element_dart_class: IntersectionVisual
    - name: representativeActor
      dart_type: IntersectionRepresentativeActor
      nullable: true
      source: representativeActor
      aliases: [representativeActor]
      map_from_string_key_class: IntersectionRepresentativeActor
    - name: actionHints
      dart_type: List<IntersectionActionHint>
      nullable: false
      source: actionHints
      aliases: [actionHints]
      list_element_dart_class: IntersectionActionHint
    - name: countTarget
      dart_type: IntersectionTarget
      nullable: true
      source: countTarget
      aliases: [countTarget]
      map_from_string_key_class: IntersectionTarget
    - name: evidenceSnapshotId
      dart_type: String
      nullable: false
      source: evidenceSnapshotId
      aliases: [evidenceSnapshotId]
      default: "''"
    - name: countObjectKind
      dart_type: String
      nullable: false
      source: countObjectKind
      aliases: [countObjectKind]
      default: "''"
    # 架构基线 v2（§21.4 传播视图 + §21.5.2 iconKey，草案/未冻结）：
    #   propagationPath 承载可证下游传播链（路径节点 + 跳数 + 二级传播绝对人数），守红线（禁比率）；
    #   iconKey 影响类型图标语义键（helpType → connect/circle/discussion/compass/read/share）。
    - name: propagationPath
      dart_type: IntersectionPropagationPath
      nullable: true
      source: propagationPath
      aliases: [propagationPath]
      map_from_string_key_class: IntersectionPropagationPath
    - name: iconKey
      dart_type: String
      nullable: false
      source: iconKey
      aliases: [iconKey]
      default: "''"
    # 影响力时间线 + 生命周期（§21.3，只附加，端只读直出）：
    #   freshAt 为该影响事实物化锚点（ISO8601），供「我的影响力」5 年时间线分桶；
    #   timeBucket 为服务端归桶结果（today|yesterday|last7Days|thisMonth|lastMonth|year:N），缺省端按 freshAt 兜底；
    #   lifecycleState 影响事实生命周期态（§21.3 闭集 new|strengthened|stable|weakened|reactivated，仅弱标/红点，不进 primaryText）；
    #   previousStrength/strengthDelta 支撑 strengthened/weakened/reactivated 判定与 +N 弱标（缺省 0）。
    - name: freshAt
      dart_type: String
      nullable: false
      source: freshAt
      aliases: [freshAt]
      default: "''"
    - name: timeBucket
      dart_type: String
      nullable: false
      source: timeBucket
      aliases: [timeBucket]
      default: "''"
    - name: lifecycleState
      dart_type: String
      nullable: false
      source: lifecycleState
      aliases: [lifecycleState]
      default: "''"
    - name: previousStrength
      dart_type: double
      nullable: false
      source: previousStrength
      aliases: [previousStrength]
      default: "0.0"
    - name: strengthDelta
      dart_type: double
      nullable: false
      source: strengthDelta
      aliases: [strengthDelta]
      default: "0.0"
