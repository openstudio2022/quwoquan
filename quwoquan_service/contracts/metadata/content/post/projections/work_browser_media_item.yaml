read_model: WorkBrowserMediaItem
description: |
  Work Browser 统一媒体序列单元（Post.mediaItems 元素的端侧投影）。
  kind 闭集：image | video。视频集（一个作品多段视频）由该序列表达，
  禁止端侧按同作者从队列临时拼集合。

consumers:
  - app

client_projection:
  dart_class: WorkBrowserMediaItemDto
  base_class: ""
  output_path: cloud/runtime/generated/content/work_browser_media_item_dto.g.dart
  fields:
    - name: kind
      dart_type: String
      nullable: false
      source: kind
      default: "''"
    - name: url
      dart_type: String
      nullable: false
      source: url
      default: "''"
    - name: coverUrl
      dart_type: String
      nullable: true
      source: coverUrl
      default: "null"
    - name: durationMs
      dart_type: int
      nullable: true
      source: durationMs
      default: "null"
      description: "ready MediaAsset 服务端探测的权威视频时长（毫秒）"
    - name: mediaAssetId
      dart_type: String
      nullable: true
      source: mediaAssetId
      default: "null"
      description: "ready MediaAsset 业务 ID；视频分集 descriptor 版本绑定锚点"
    - name: mediaAssetVersion
      dart_type: int
      nullable: true
      source: mediaAssetVersion
      default: "null"
      description: "ready MediaAsset 版本"
    - name: previewTrackManifestUrl
      dart_type: String
      nullable: true
      source: previewTrackManifestUrl
      default: "null"
      description: "asset/version 绑定的 storyboard manifest 公开交付 URL"
    - name: previewTrackVersion
      dart_type: int
      nullable: true
      source: previewTrackVersion
      default: "null"
      description: "storyboard 预览轨版本"
    - name: width
      dart_type: int
      nullable: true
      source: width
      default: "null"
    - name: height
      dart_type: int
      nullable: true
      source: height
      default: "null"
    - name: title
      dart_type: String
      nullable: true
      source: title
      default: "null"
