
service:
  name: content-service
  domain: content
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: CONTENT_POST_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 内容发布、浏览、互动、评论与媒体管理

api_routes:
  - method: GET
    path: /content/feed

    operation: GetFeed
    # Anonymous discovery is intentionally supported. A signed account/device
    # enriches ranking, but cannot be a prerequisite for the public route.
    actor: none
    application:
      kind: query
      facet: FeedQueryFacet
      method: getFeed
      reader: DiscoveryFeedReader
      slice: DiscoveryFeedSlice
    authorization:
      principal: public
      ownership_policy: public_discovery_feed
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.USER.invalid_argument
      - CONTENT.SYSTEM.storage_read_failed
      - CONTENT.SYSTEM.internal_error
    privacy:
      request_classification: PII
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_feed_get
      trace: true
      attributes: [identity, type, sort, outcome]
    slo:
      latency_p95_ms: 500
      availability_percent: 99.9
    description: |
      发现流首页推荐唯一主链路（sort=recommend）。cursor 为 opaque token，仅用于 future window。
      feedRequestId 为服务端权威生成的归因 id：随响应 envelope 下发；客户端首刷不传，
      分页/继续加载时回显服务端下发的 feedRequestId 以保持同一 feed 会话的归因连续，
      并透传给后续行为事件（曝光/点击/停留/负反馈）。
      channelId 为首页频道路由标识（home_channels.feed_query.channel 真相源）：
      following 走关注召回主路（FeedFollow，fail-closed，关注为空返回空列表）；
      travel 走 travel_photography 垂类；其余频道走推荐引擎并按 channelId 归因。
      携带 identity/type 的请求是发现页浏览流（时间线具名查询），与频道推荐主链路互斥。
    query_params: [identity, type, sort, cursor, limit, subCategory, feedRequestId, channelId]
    response_entity: Post
    response_fields: [items, nextCursor, cursor, feedRequestId, rankingVersion, reasonVersion, objectCards]
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public

  - method: POST
    path: /content/posts:publish

    operation: SubmitPostPublication
    actor: persona
    application:
      kind: command
      facet: PostPublicationCommandFacet
      method: submitPostPublication
      aggregate_owner: Post
      mutation_target: Post
      invariant_target: Post
    authorization:
      principal: persona
      ownership_policy: creates_owned_post
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.forbidden_edit
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.invalid_content_type
      - CONTENT.USER.content_too_long
      - CONTENT.USER.rate_limited
      - CONTENT.USER.publication_rejected
      - CONTENT.USER.media_not_found
      - CONTENT.USER.media_not_ready
      - CONTENT.USER.media_processing_rejected
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.required_dependency_unavailable
      - CONTENT.SYSTEM.storage_write_failed
      - CONTENT.SYSTEM.internal_error
    privacy:
      request_classification: PII
      response_classification: PII
      log_policy: metadata_only
    telemetry:
      metric: content_post_publication_submit
      trace: true
      attributes: [content_type, outcome, admission_stage]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    client_contract:
      dart_import: ../content/post_publication_contracts.dart
      request_type: SubmitContentPostPublicationCommand
      response_type: ContentPostPublicationReceipt
      request_encoder: encodeSubmitContentPostPublicationCommand
      response_decoder: decodeContentPostPublicationReceipt
    description: 以本地草稿唯一的一次性 PublishIntent 提交发布；服务端按意图永久去重，依次通过长度、Persona 频控与内容安全 fail-closed 准入后原子创建已发布 Post；同一意图的后续请求只返回原回执
    request_entity: Post
    request_fields: [publishIntentId, localDraftId, contentType, contentIdentity, title, body, summary, semanticMentions, mediaAssetIds, mediaItems, articleMarkdown, markdownDialect, articleAssetManifest, articleRenderProfile, coverStrategy, coverFrameTimeMs, illustrationAssetId, location, locationName, primaryHomepageId, primaryHomepageType, primaryHomepageSnapshot, visibility, assistantUsePolicy, sourcePostId, sourceType, deviceInfo, publishLocation, authorDisplayNameSnapshot, authorAvatarUrlSnapshot, personaContextVersion]
    writable_fields: [publishIntentId, localDraftId, contentType, contentIdentity, title, body, summary, semanticMentions, mediaAssetIds, mediaItems, articleMarkdown, markdownDialect, articleAssetManifest, articleRenderProfile, coverStrategy, coverFrameTimeMs, illustrationAssetId, location, locationName, primaryHomepageId, primaryHomepageType, primaryHomepageSnapshot, visibility, assistantUsePolicy, sourcePostId, sourceType, deviceInfo, publishLocation, authorDisplayNameSnapshot, authorAvatarUrlSnapshot, personaContextVersion]
    response_fields: [publishIntentId, localDraftId, postId, state, committedVersion, acceptedAt]
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

