contract: content_media_variant_profiles

description: |
  内容媒体资源变体契约。Markdown、HTML、article blocks 只引用 asset://<assetId>；
  articleAssetManifest.assets[].variants 按本文件 profile 暴露展示变体。
  original 只作为受控访问能力登记，不得作为列表、正文或 SEO HTML 的默认 URL。

image_profiles:
  thumbnail:
    width: 320
    format: webp
    quality: 80
    scene: feed_grid
    direct_load: true
    original_access: false
    processing: image/resize,w_320/format,webp/quality,q_80
  display:
    width: 960
    format: webp
    quality: 82
    scene: article_body
    direct_load: true
    original_access: false
    processing: image/resize,w_960/format,webp/quality,q_82
  cover:
    width: 1280
    format: webp
    quality: 85
    scene: feed_cover
    direct_load: true
    original_access: false
    processing: image/resize,w_1280/format,webp/quality,q_85
  full:
    width: 2048
    format: webp
    quality: 90
    scene: immersive_viewer
    direct_load: true
    original_access: false
    processing: image/resize,w_2048/format,webp/quality,q_90
  original:
    format: source
    scene: original_access
    direct_load: false
    original_access: true
    requires_access: true

video_profiles:
  thumbnail:
    format: webp
    scene: video_card
    direct_load: true
    original_access: false
  poster:
    format: webp
    scene: video_player_poster
    direct_load: true
    original_access: false
  preview:
    format: mp4
    scene: short_preview
    direct_load: true
    original_access: false
  original:
    format: source
    scene: original_access
    direct_load: false
    original_access: true
    requires_access: true
