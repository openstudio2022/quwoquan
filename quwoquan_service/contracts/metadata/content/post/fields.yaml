version: 1
aggregate: Post

entities:
  Post:
    description: 内容主体（聚合根）
    fields:
      - name: _id
        type: ObjectId
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: version
        type: int
        constraints: [NOT_NULL, DEFAULT_1]
        classification: INTERNAL
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: Post 乐观并发版本；每次聚合提交原子递增

      - name: authorId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 作者稳定公开主体 ID（subAccountId）

      - name: creatorProfileId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 平台创作者画像 ID；系统作者内容必须存在，不写入标签或实体主树

      - name: creatorArchetype
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 作者类型，如 travel_blogger / landscape_photographer / campus_blogger

      - name: creatorProfileVersion
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 写入内容时绑定的作者画像版本

      - name: creatorDisclosure
        type: object
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 用户可见的虚拟创作者披露信息

      - name: experienceClaimMode
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 经验声明模式，默认 editorial_synthesis，禁止伪真实亲历

      - name: authorQualitySignals
        type: object
        constraints: [NULLABLE]
        classification: INTERNAL
        log_policy: allow
        api_exposure: none
        ops_exposure: read
        recommend_feature: true
        description: 作者质量、疲劳度、风险等级等推荐与调度信号

      - name: authorDisplayNameSnapshot
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 作者显示名快照，避免分身退役或改名后记录渲染漂移

      - name: authorAvatarUrlSnapshot
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 作者头像快照

      - name: personaContextVersion
        type: int
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 写入时绑定的 subAccount 上下文版本

      - name: contentType
        type: enum
        enum_ref: ContentType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: contentIdentity
        type: enum
        enum_ref: ContentIdentity
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 内容身份层。moment=点滴，work=作品；记录数据允许为空，读路径按 contentType 推导

      - name: title
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        search_field: true
        description: 标题（文章必填，其他可选）

      - name: body
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        search_field: true

      - name: tagRefs
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        tag_ref: true
        description: 只读活动投影；仅由 semanticMentions 中 status=published 且 targetRef 合法的 tag mention 派生

      - name: entityRefs
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 只读活动投影；仅由 semanticMentions 中 status=published 且 targetRef 合法的 entity mention 派生

      - name: semanticMentions
        type: "[]object"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: |
          标题/正文/文章中的语义标注事实：
          [{mentionId,kind,surface,location,rangeStart,rangeEnd,status,candidateId,targetRef}]。
          status 支持 published/pending_review/rejected/offline；只有 published 且 targetRef 合法的项进入活动 entityRefs/tagRefs。

      - name: mediaAssetIds
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 有序 MediaAsset ID 引用；Post 不内嵌媒体对象

      - name: mediaUrls
        type: "[]string"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: mediaItems
        type: "[]object"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: |
          统一媒体序列（Work Browser 真相源）：[{kind:image|video, url, coverUrl?, durationMs?, width?, height?, title?}]。
          视频集（一个作品多段视频）唯一契约表达；禁止端侧按同作者从队列临时拼集合。
          为空时端按 mediaUrls/videoUrl 派生单一序列。

      - name: coverUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 通用封面字段；视频时与 thumbnailUrl 同源，用于旧卡片和作品浏览器回退

      - name: thumbnailUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 视频未播放态主封面 URL，默认首帧，手工选帧时覆盖；图片/文章可为空

      - name: articleMarkdown
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        search_field: true
        description: QWQ Rich Markdown v1 原文，文章长文唯一持久化真相源

      - name: articleMarkdownVersion
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: Markdown 规范版本，当前为 qwq-rich-md/1

      - name: articleMarkdownDigest
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 规范化 articleMarkdown 的 sha256 digest，用于幂等、缓存与审计

      - name: articleAssetManifest
        type: object
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 文章素材清单，正文 asset:// 引用必须存在于该 manifest

      - name: articleRenderProfile
        type: object
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: |
          文章渲染画像。Work Browser V1.0 消费字段：
          template/fontPreset、paperThemeMode(system|manual)、paperTexture
          (darkPaper|coolGray|warmBlack|inkGreen|deepBrown)、contentVertical
          (photography|travel|history|tech|nature)。
          旧模板只保留为版心/排版气质输入，不再决定浏览器默认纸张亮度。

      - name: contentVertical
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        description: "内容垂类：photography/travel/history/tech/nature 等；Work Browser 文章纸张系统适配的唯一垂类输入。"

      - name: entityMentions
        type: "[]object"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: "文章行内实体标签列表 [{subjectType,subjectId,homepageId,displayName,rangeStart,rangeEnd}]，由 QWQ Rich Markdown 派生并由实体投影解析 canonical Homepage。"

      - name: articleTemplate
        type: enum
        enum_ref: ArticleTemplatePreset
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 从 articleRenderProfile.template 派生的文章模板只读快照

      - name: articleFontPreset
        type: enum
        enum_ref: ArticleFontPreset
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 从 articleRenderProfile.fontPreset 派生的文章字体预设只读快照

      - name: videoUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 视频播放 URL 或稳定视频资源引用派生 URL

      - name: coverStrategy
        type: enum
        enum_ref: MediaCoverStrategy
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 视频封面策略。first_frame 表示首帧派生；manual 表示用户手工选帧或手工封面资产

      - name: coverFrameTimeMs
        type: int
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 视频封面帧时间点（毫秒）。默认首帧为 0；用于审计和重新派生封面

      - name: location
        type: GeoPoint
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true

      - name: locationName
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        recommend_feature: true
        search_field: true

      - name: primaryHomepageId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 内容绑定的 canonical 共享主页 ID

      - name: primaryHomepageType
        type: enum
        enum_ref: HomepageType
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 绑定主页的类型快照

      - name: primaryHomepageSnapshot
        type: object
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 绑定主页的轻量快照（标题、副标题、封面）

      - name: status
        type: enum
        enum_ref: PostStatus
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write
        observe_metric: post_status_gauge

      - name: visibility
        type: enum
        enum_ref: Visibility
        constraints: [NOT_NULL, DEFAULT_PUBLIC]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read

      - name: assistantUsePolicy
        type: enum
        enum_ref: AssistantUsePolicy
        constraints: [NOT_NULL, DEFAULT_INHERIT]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 小趣内容消费策略。inherit=遵循全局授权，exclude=排除当前内容

      - name: sourcePostId
        type: ObjectId
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 转发/引用来源 postId

      - name: sourceType
        type: enum
        enum_ref: PostSourceType
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: original/repost/quote（记录数据可为空，读取时按 original 处理）

      - name: summary
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 文章摘要（模型生成后可人工编辑）

      - name: illustrationAssetId
        type: ObjectId
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read_write
        ops_exposure: read
        description: 文章插图媒体 ID（可选，最多 1 张）

      - name: publishLocation
        type: object
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: read
        description: 发布位置（国家/省/市，来自 IP 归属）

      - name: deviceInfo
        type: object
        constraints: [NULLABLE]
        classification: PII
        log_policy: mask
        api_exposure: read
        ops_exposure: read
        description: 发布设备（manufacturer/brand/model/os/appVersion）

      - name: likeCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: commentCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: pinnedCommentId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write
        description: 唯一置顶 Comment ID；评论本体拥有独立生命周期

      - name: shareCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: viewCount
        type: int
        constraints: [NOT_NULL, DEFAULT_0]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: embedding
        type: "[]float32"
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: drop
        api_exposure: drop
        ops_exposure: drop
        description: 内容语义向量（1536维）

      - name: helperReadSummary
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 帮读摘要缓存

      - name: moderationStatus
        type: enum
        enum_ref: ModerationStatus
        constraints: [NOT_NULL, DEFAULT_PENDING]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read_write

      - name: contentDigest
        type: string
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: hash
        api_exposure: none
        ops_exposure: read
        description: 当前可审核内容的 canonical SHA-256；PostModerationCase 必须绑定此值与 version

      - name: createdAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: updatedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: publishedAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true

      - name: lastActiveAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 最近活跃时间（发帖 / 评论 / 回复都会刷新）

      - name: sourceTaskId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        recommend_feature: true
        description: 内容溯源——生成此内容的数据工程任务 id（task trace / 效果回流按 sourceTask 归因）

      - name: deletedAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read


  DeletedPostTombstone:
    description: 删除内容墓碑记录，用于 URL 访问提示已删除
    fields:
      - name: _id
        type: ObjectId
        constraints: [PK]
        classification: PUBLIC
        log_policy: allow
        api_exposure: drop
        ops_exposure: read
      - name: postId
        type: ObjectId
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: authorId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: reason
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: deletedAt
        type: timestamp
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: expireAt
        type: timestamp
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

  ProfileInteractionActivityView:
    description: 个人主页互动活动流视图；渲染字段由云侧投影，activityType/direction 仅作观测维度
    fields:
      - name: activityId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: activityType
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: direction
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: commentKind
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: actorSubAccountId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: actorDisplayName
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: actorAvatarUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: counterpartSubAccountId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: counterpartDisplayName
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: counterpartAvatarUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: targetSubAccountId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: targetContentId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: targetContentType
        type: enum
        enum_ref: ContentType
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: targetContentSummary
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: targetKind
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: record/discussion
      - name: targetAvailability
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: active/deleted/private/reviewing/author_deactivated
      - name: targetReplyCount
        type: int
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: displaySubAccountId
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: displayName
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: displayAvatarUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: displayUserRouteId
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: primaryText
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: contextText
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: previewMediaKind
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: previewImageUrl
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
      - name: previewText
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
