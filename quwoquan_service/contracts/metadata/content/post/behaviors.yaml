version: 1
aggregate: Post

description: |
  Post 实体的用户行为采集、推荐特征声明和训练样本 schema。
  三块原散落于 _shared/types.yaml（枚举）、service.yaml（路由）、_projections/（ML schema）
  的声明统一到此文件，由 codegen 生成：
    - Dart:   ContentBehaviorTracker（批量缓冲 + auto-flush）
    - Python: ContentFeatures + ContentTrainingSample（Pydantic BaseModel）

# ── 一、用户行为事件 ────────────────────────────────────────────────────
wire_schema:
  # common_fields 为「全事件携带」的通用归因/幂等字段（单一真相源）：
  # clientEventId/feedRequestId/state/referralSource/position/channelId/rankingVersion
  # 适用于所有 behavior_events（含 dedicated_route 的 comment）；事件级 payload_fields
  # 只声明事件专属上下文（如 commentLength/shareTarget/circleId），禁止再重复列举通用归因字段。
  # channelId/rankingVersion 全事件携带且被服务端 BehaviorEventInput 实际消费（持久化 RawBehaviorEvent +
  # HotPath BehaviorSignal + 特征宽表投影），使 served/impressed 双轨记账、CTR、特征工程可直接按
  # 频道与精排版本分桶（AB / 离线 replay），无需回 join 一次 feed 下发记录（其有 TTL/留存限制），
  # 保持 metadata↔服务端消费一一对应（R08）。
  common_fields:
    - name: clientEventId
      type: string
      required: true
      description: |
        端侧生成的事件幂等 ID。云侧以 rec:event_dedup:{<userId>}:<clientEventId>
        做 SET NX 去重；重复事件不得再次进入 HotPath、训练样本或运营指标。
    - name: feedRequestId
      type: string
      required: false
      description: |
        Feed 下发时返回的请求归因 ID。端侧曝光、停留、点击、互动和负反馈必须回传
        同一个 feedRequestId，禁止点击时重生，确保召回 → 下发 → 曝光 → 互动漏斗可对齐。
    - name: referralSource
      type: enum
      enum: [organic_feed, friend_share, chat_link, circle_post, author_profile, entity_page, search, push_notification, deep_link]
      required: false
      description: |
        用户到达内容的来源渠道。曝光/点击/停留/互动/负反馈全事件回传，供推荐侧按来源加权
        （runtime/recommendation.ReferralSourceMultiplier）与归因下钻。端侧 ReferralSource 枚举与
        云侧 ReferralSourceMultiplier 键必须与本闭集一一对应（R08 端云对齐）。
    - name: position
      type: int
      required: false
      description: |
        事件发生时内容在 feed 流中的 0-based 序位。曝光/点击事件既往以 feedPosition 具名上报，
        云侧 BehaviorEventInput 同时接收 position/feedPosition 并归一到 Position；与 feedRequestId
        组合可还原「某次 feed 下发的第几位被曝光/点击」，供位置偏置校正与离线 replay 归因。
    - name: channelId
      type: string
      required: false
      description: |
        事件发生时 feed 所属频道（如 recommend / following / video）。全事件回传，服务端
        BehaviorEventInput → RawBehaviorEvent / BehaviorSignal / 特征宽表均消费，使 served/impressed
        双轨记账与 CTR、互动率可按频道分桶，供 AB 与频道级归因下钻。
    - name: rankingVersion
      type: string
      required: false
      description: |
        事件发生时 feed 下发所用的精排版本（与 DiscoveryFeedPage.rankingVersion 同源）。全事件回传，
        服务端持久化并投影到特征宽表，使离线 replay / AB 可按精排版本切分曝光与转化，
        定位某版本精排的位置偏置与 CTR 退化。
    - name: state
      type: enum
      enum: [served, visible, impressed, click, dwell, interaction, negative]
      required: false
      description: |
        反馈状态闭集（七态漏斗）。served 由云侧下发写入；visible/impressed/click/dwell/
        interaction/negative 由端侧上报。click 是独立漏斗态（CTR = click / impressed），
        与点赞/评论/分享等深度互动(interaction)分离。training_sample 只能由云侧派生，
        不允许端侧上报。
  state_derivation:
    served: 云侧 feed 返回即 write-behind 写入 rec:served day-bucket，不作为训练正样本。
    visible: 端侧进入视窗的弱信号，按 recpolicy 采样或仅本地聚合。
    impressed: 端侧达到可见面积 + 停留阈值后的真实曝光，写入 rec:impressed day-bucket。
    click: 端侧点击进入详情/沉浸态的独立漏斗态，作为 CTR 分子，区别于 interaction。
    dwell: 离开/切走/翻页时聚合停留时长，弱停留可按 recpolicy 丢弃。
    interaction: 点赞、评论、分享、关注、进圈、加联系人等强正向深度互动行为。
    negative: dislike、report、hide_author、hide_content_type 等显式负反馈，用户级即时过滤。

behavior_events:
  - type: impression
    description: 内容进入可视区域曝光
    trigger: viewport_enter_50pct_100ms
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackImpression
    payload_fields: [postId, contentType, feedPosition, intersectionId, intersectionDimension, intersectionClass, intersectionSourceRef, intersectionEvidenceId]
    ml_signal: weak_positive
    signal_weight: 0.1
    notes: |
      交集曝光归因（交集统一体验）：当帖/卡承载交集理由时，随曝光带
      intersectionId / intersectionDimension / intersectionClass(fact|affinity) /
      intersectionSourceRef(§5.4 标准 kind) / intersectionEvidenceId，闭合「交集曝光 → 点击 → 转化」漏斗，并供推荐冷却窗口判定。
      非交集曝光时这些字段为空，不影响普通内容曝光归因。

  - type: dwell
    description: 停留时长（视口内累计时长，单位毫秒）
    trigger: viewport_exit_or_scroll_away
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackDwell
    payload_fields: [postId, dwellMs, contentType]
    ml_signal: strong_positive_if_gt_10s
    signal_weight: 1.0

  - type: click
    description: 点击内容卡片进入详情
    trigger: tap_post_card
    batch: false
    batch_route: POST /v1/content/behaviors
    dart_method: trackClick
    payload_fields: [postId, contentType, feedPosition, intersectionId, intersectionDimension, intersectionClass, intersectionSourceRef, intersectionEvidenceId]
    ml_signal: strong_positive
    signal_weight: 0.5
    notes: |
      交集点击归因：交集卡点击进入对象页时，随点击带 intersectionId/dimension/class/sourceRef(§5.4 kind)/evidenceId，
      使曝光→点击→转化漏斗可按维度、标准 kind 与事实/概率类别下钻。

  - type: intersection_expand
    description: 列表入口「查看更多」展开交集列表（我的连接 / 为什么推荐TA 等）
    trigger: tap_intersection_list_expand
    batch: false
    batch_route: POST /v1/content/behaviors
    dart_method: trackIntersectionExpand
    payload_fields: [intersectionId, intersectionDimension, intersectionClass, intersectionSourceRef, surfaceId]
    ml_signal: weak_positive
    signal_weight: 0.2
    notes: |
      六场景列表入口展开归因；surfaceId 来自 ui_config codegen 常量。

  - type: dislike
    description: 用户明确标记"不感兴趣"
    trigger: user_action_long_press_or_menu
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackDislike
    payload_fields: [postId, contentType, authorId]
    ml_signal: explicit_negative
    signal_weight: -5.0

  - type: hide_author
    description: 用户明确表示减少/不想看该作者内容；推荐侧即时过滤同作者未来窗口
    trigger: user_action_more_menu_hide_author
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackHideAuthor
    payload_fields: [postId, authorId, contentType]
    ml_signal: explicit_negative
    signal_weight: -5.0

  - type: hide_content_type
    description: 用户明确表示减少此类内容；推荐侧即时过滤同内容类型未来窗口
    trigger: user_action_more_menu_hide_content_type
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackHideContentType
    payload_fields: [postId, contentType]
    ml_signal: explicit_negative
    signal_weight: -4.0

  - type: share
    description: 分享到外部/圈子
    trigger: user_action_share_sheet
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackShare
    payload_fields: [postId, contentType, shareTarget]
    ml_signal: strong_positive
    signal_weight: 3.0

  # like 走专用路由，不进 BehaviorTracker 批量队列
  - type: like
    description: 点赞（由 intent layer 处理，不走 BehaviorTracker）
    dedicated_route: POST /v1/content/posts/{postId}/like
    dart_method: null
    ml_signal: explicit_positive
    signal_weight: 2.0

  - type: comment
    description: |
      用户在内容下发表评论（由 intent layer 处理，走专用路由）。
      评论是比点赞更强的深度互动信号：用户需主动输入，代表高兴趣度。
      payload 额外携带 commentLength，供推荐侧判断内容吸引力（长评 > 短评）。
      评论走专用路由但仍须回传 common_fields 的归因字段（feedRequestId/referralSource/position），
      使评论这一深度互动可按同一次 feed 下发归因（召回 → 下发 → 曝光 → 评论漏斗对齐），
      不因专用路由而断链。
    dedicated_route: POST /v1/content/posts/{postId}/comments
    dart_method: null
    payload_fields: [postId, contentType, commentLength]
    ml_signal: very_strong_positive
    signal_weight: 2.5
    notes: |
      like/comment/report 三个显式行为均走专用路由，不进批量队列，
      以保证实时性和幂等语义。commentLength 从评论完成事件回调中获取，是评论事件的专属
      payload；feedRequestId/referralSource/position 为全事件通用归因，
      统一声明在 wire_schema.common_fields，不在此重复列举（单一真相源）。

  - type: report
    description: 举报（由专用路由处理）
    dedicated_route: POST /v1/content/reports
    dart_method: null
    ml_signal: explicit_negative
    signal_weight: -10.0

  - type: skip
    description: 快速跳过（停留 <1s 即离开，负反馈信号）
    trigger: viewport_exit_lt_1s
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackSkip
    payload_fields: [postId, contentType]
    ml_signal: weak_negative
    signal_weight: -0.3

  - type: follow
    description: 关注内容作者（强正向社交信号 + 交集转化第一类：关注人）
    trigger: user_action_follow_button
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackFollow
    payload_fields: [postId, authorId, intersectionDimension, intersectionSourceRef, intersectionTagRefs]
    ml_signal: very_strong_positive
    signal_weight: 4.0
    notes: |
      交集转化归因（S6）：intersectionDimension（identity/location/content/interest/relationship
      五维之一）+ intersectionSourceRef（§5.4 标准 kind，与曝光/点击/展开同名）+ intersectionTagRefs
      （路径制 tagRef，唯一真相源 publish/v1/tags）随关注上报，使「交集曝光 → 点击 → 转化」整条漏斗
      可按同一 sourceRef 下钻，供推荐回流与「交集转化率」北极星指标按维度/kind/tagRef 切分。

  - type: join_circle
    description: 加入圈子（交集转化第二类：进圈子）。与 follow 区分以拆分转化漏斗。
    trigger: user_action_join_circle_button
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackJoinCircle
    payload_fields: [postId, circleId, intersectionDimension, intersectionSourceRef, intersectionTagRefs]
    ml_signal: very_strong_positive
    signal_weight: 4.0
    notes: |
      交集转化三类行动（关注人 follow / 进圈子 join_circle / 加联系人 add_contact）独立成
      BehaviorAction，使「新增可解释交集数 → 交集转化」漏斗可按动作类型切分。circleId 为目标圈子。

  - type: add_contact
    description: 添加联系人/加好友（交集转化第三类：加联系人）。与 follow 区分以拆分转化漏斗。
    trigger: user_action_add_contact_button
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackAddContact
    payload_fields: [postId, authorId, intersectionDimension, intersectionSourceRef, intersectionTagRefs]
    ml_signal: very_strong_positive
    signal_weight: 4.5

  - type: author_view
    description: 进入作者主页/实体主页查看
    trigger: tap_author_avatar_or_name
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackAuthorView
    payload_fields: [postId, authorId, entityRefs]
    ml_signal: moderate_positive
    signal_weight: 1.5

  - type: tag_click
    description: 点击内容标签进入标签聚合页
    trigger: tap_tag_chip
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackTagClick
    payload_fields: [postId, tagRefs]
    ml_signal: moderate_positive
    signal_weight: 1.8

  - type: content_depth
    description: 内容消费深度（退出时汇总的归一化消费指标）
    trigger: content_exit_with_depth_data
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: null
    payload_fields: [postId, engagementDepth, consumedRatio, totalUnits]
    ml_signal: depth_proportional
    signal_weight: 1.0
    notes: |
      由 ContentEngagementTracker 在退出时自动生成，不需要独立 dart_method。
      engagementDepth 为 L0-L4 归一化等级，consumedRatio 为原始消费比例。

  - type: play_progress
    description: 视频/音频播放进度里程碑
    trigger: playback_25pct_50pct_75pct_100pct
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackPlayProgress
    payload_fields: [postId, consumedRatio, totalUnits]
    ml_signal: proportional_positive
    signal_weight: 1.0
    notes: |
      在 25%/50%/75%/100% 播放节点上报。consumedRatio 为当前播放比例，
      totalUnits 为总时长（秒）。与 content_depth 互补但语义不同：
      play_progress 是实时里程碑，content_depth 是退出时汇总。

  - type: assistant_interest
    description: 小艺对话中浮现的兴趣标签回流（对话兴趣 → 推荐特征，不绑定具体 post）
    trigger: assistant_turn_emerged_tags
    batch: true
    batch_route: POST /v1/content/behaviors
    dart_method: trackAssistantInterest
    payload_fields: [tagRefs]
    ml_signal: moderate_positive
    signal_weight: 1.6
    notes: |
      由小艺（assistant）每轮对话产出的 diagnostics.emergedTags 合成上报，
      payload 只带 tagRefs（路径制标签），不绑定 postId；
      经 ProcessBatch → RecommendFeatureProjector 进 rm_recommend_feature 的 tagInteraction。

# ── 二、推荐特征声明 ────────────────────────────────────────────────────
# 由 codegen_rec_model_python 生成 Python Pydantic ContentFeatures model
# 特征权重由推荐服务内部决定，不在此声明
recommend_features:
  feature_group: content_features
  update_trigger: PostCreated
  python_class: ContentFeatures

  features:
    - name: content_type
      source_field: contentType
      type: categorical
      python_type: str
      description: 内容类型（image/video/micro/article）

    - name: tag_count
      source_field: tagRefs
      type: int
      python_type: int
      transform: list_length
      description: 标签数量

    - name: aspect_ratio
      source_fields: [width, height]
      type: float
      python_type: "Optional[float]"
      nullable: true
      transform: "width / max(height, 1) if width and height else None"
      description: 宽高比；未记录尺寸时为 null

    - name: has_cover
      source_field: coverUrl
      type: bool
      python_type: bool
      transform: "bool(coverUrl)"
      description: 是否有封面图

    - name: body_length
      source_field: body
      type: int
      python_type: int
      transform: "len(body or '')"
      description: 正文字符数

    - name: engagement_rate_7d
      type: float
      python_type: float
      derived: true
      description: "(likeCount + commentCount) / max(viewCount, 1) 近7天，云侧计算"

    - name: publish_hour
      source_field: createdAt
      type: int
      python_type: int
      transform: "createdAt.hour"
      description: 发布时刻（0-23），用于时段偏好建模

# ── 三、训练样本 schema ─────────────────────────────────────────────────
# 由 codegen_rec_model_python 生成 Python Pydantic ContentTrainingSample model
training_sample:
  python_class: ContentTrainingSample
  label_field: user_engaged
  label_type: int                         # 1=正例，0=负例

  positive_signals:
    - type: comment
      weight: 4                            # 评论为最强深度互动信号
    - type: like
      weight: 3
    - type: dwell
      condition: dwellMs > 10000           # 停留超过10秒
      weight: 2
    - type: click
      weight: 1

  negative_signals:
    - type: dislike
      weight: 3
    - type: hide_author
      weight: 4
    - type: hide_content_type
      weight: 3
    - type: report
      weight: 5

  context_fields:
    - name: user_id
      type: str
    - name: device_actor_id
      type: str
    - name: session_id
      type: str
    - name: request_time_hour
      type: int

  item_features_ref: ContentFeatures      # 引用上面的特征 schema
