version: 1
entity: Comment

description: |
  Comment 是独立聚合；其持久化状态只描述一条评论自身。Post.commentCount、
  replyCount、列表预览和互动计数均为可重建读模型，不属于 Comment 写模型。

fields:
  - name: id
    type: string
    constraints: [PK, NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: version
    type: int
    constraints: [NOT_NULL, DEFAULT_1]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: Comment 聚合乐观并发版本；每次命令事实提交时原子递增。

  - name: postId
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 被评论内容的外部引用；不嵌入或持有 Post 聚合。

  - name: authorId
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 评论作者公开 persona/sub-account 主体。

  - name: authorDisplayNameSnapshot
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read

  - name: authorAvatarUrlSnapshot
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read

  - name: personaContextVersion
    type: int
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read

  - name: content
    type: string
    constraints: [NOT_NULL, MAX_LENGTH_1000]
    classification: PUBLIC
    log_policy: redacted
    api_exposure: read_write
    ops_exposure: read

  - name: replyToCommentId
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 实际被回复的评论；允许指向一级评论或其一级回复。

  - name: replyToUserId
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 由回复目标投影确定，客户端不可伪造。

  - name: parentCommentId
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 一级线程根；回复回复时仍指向同一一级根，禁止形成三级树。

  - name: attachmentMediaIds
    type: "[]string"
    constraints: [NULLABLE, MAX_ITEMS_9]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read
    description: 已绑定 comment_attachment MediaAsset 的外部引用。

  - name: mentions
    type: "[]CommentMention"
    constraints: [NULLABLE, MAX_ITEMS_20]
    classification: PUBLIC
    log_policy: redacted
    api_exposure: read_write
    ops_exposure: read
    description: 强类型提及值对象（subjectType、subjectId、displayName）。

  - name: assistantMentioned
    type: bool
    constraints: [NOT_NULL, DEFAULT_FALSE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 由 typed mention 值对象推导的助手触发标记。

  - name: assistantReplySource
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: assistantCorrectionStatus
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: status
    type: enum
    enum_ref: CommentStatus
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: active/deleted；删除为软删并保留审计事实。

  - name: isPinned
    type: bool
    constraints: [NOT_NULL, DEFAULT_FALSE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 仅 post 作者可变更，且二级回复不可置顶。

  - name: pinnedAt
    type: timestamp
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: createdAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: updatedAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: deletedAt
    type: timestamp
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 软删时间；CommentCreated/CommentDeleted 事实驱动 Post.commentCount 重建投影。

value_objects:
  CommentMention:
    fields:
      - { name: subjectType, type: string, constraints: [NOT_NULL] }
      - { name: subjectId, type: string, constraints: [NOT_NULL] }
      - { name: displayName, type: string, constraints: [NULLABLE] }

enums:
  CommentStatus: [active, deleted]
