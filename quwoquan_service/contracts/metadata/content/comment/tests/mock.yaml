entity: Comment
layer: app_side

description: |
  Comment 端侧独立契约场景。fixture 与 adapter 只存在于
  packages/quwoquan_cloud_mock 或 test/support，production lib 不可达。

dto_scenarios:
  - name: comment_slice_uses_canonical_wire
    source: content_comment_contract
    dart_test: quwoquan_app/test/local_contract/cloud/content/contract/content_comment_contract__local_contract_test.dart
    assertions:
      - Comment/CommentPage/CommentReplyPage 只接受 metadata canonical 字段
      - 缺 commentId/postId/authorId 的 wire fail closed

facet_scenarios:
  - name: alpha_comment_facet_matches_remote_contract
    source: alpha_content_comment_facet
    dart_test: quwoquan_app/packages/quwoquan_cloud_mock/test/local_contract/alpha_content_comment_facet__local_contract_test.dart
    adapter: quwoquan_app/packages/quwoquan_cloud_mock/lib/src/content/alpha_comment_facets.dart
    assertions:
      - Alpha adapter 与 Remote adapter 实现同一 typed command/query Facet
      - create/delete/pin/unpin/bind/list/replies 行为与 contract fixture 一致

widget_scenarios:
  - name: comment_surface_uses_typed_facets
    source: comment_facet_widget
    dart_test: quwoquan_app/test/local_contract/ui/components/comment_system/comment_facet_widget__local_contract_test.dart
    assertions:
      - Widget 只依赖 Comment command/query Facet
      - 加载、空态、结构化错误态与提交恢复可见
