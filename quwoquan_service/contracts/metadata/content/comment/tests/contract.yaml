entity: Comment

scenarios:
  - name: comment_create_outbox_and_post_projection
    operation: CreateComment
    go_func: TestCommentAggregateMongoTransactionAndCAS
    evidence: api_integration
    assertions:
      - comments、comment_command_receipts、comment_outbox 在同一 Mongo transaction 提交
      - CommentCreated 由独立 durable relay 投递
      - Post.commentCount 只由独立 checkpoint 的 projection relay 重建

  - name: comment_keyset_page
    operation: ListComments
    go_func: TestCommentMongoAdapter_ListQueryUsesDeclaredIndex
    evidence: api_integration
    assertions:
      - pinned-first、createdAt、id 构成稳定 keyset 全序
      - 页间无重叠且 nextCursor 在耗尽时为空
      - winningPlan 使用 idx_comments_post_page 且无 COLLSCAN 或 blocking SORT

  - name: comment_reply_page
    operation: ListCommentReplies
    go_func: TestCommentAggregateNormalizesTwoLevelReplyInvariant
    evidence: local_contract
    assertions:
      - 回复只允许同 Post active Comment 目标
      - parentCommentId 归一为一级线程根

  - name: comment_delete_server_owned_cas
    operation: DeleteComment
    go_func: TestDeleteComment
    evidence: api_integration
    assertions:
      - request 不携带 Comment version
      - 服务端纯 CAS 冲突重载聚合并重放删除意图
      - 成功软删产生 CommentDeleted 且 active reader 与 Post count projection 收敛

  - name: comment_pin_server_owned_cas
    operation: PinComment
    go_func: TestCommentPinContractApiIntegration
    evidence: api_integration
    assertions:
      - 仅被引用 Post 作者可置顶一级 Comment
      - 服务端重放纯 CAS 冲突，非作者与回复目标仍 fail closed

  - name: comment_unpin_server_owned_cas
    operation: UnpinComment
    go_func: TestCommentPinContractApiIntegration
    evidence: api_integration
    assertions:
      - unpin 不要求调用方传递 PinComment 返回版本
      - 成功后 CommentPage 不再包含 isPinned=true

  - name: comment_author_page
    operation: ListCommentsByAuthor
    go_func: TestListCommentsByAuthor
    evidence: api_integration
    assertions:
      - actor 仅来自 verified persona principal
      - Reader 只返回当前 persona 的 typed Slice

  - name: comment_received_page
    operation: ListCommentsForPostAuthor
    go_func: TestListCommentsForPostAuthorContract
    evidence: api_integration
    assertions:
      - owned Post IDs 由 PostOwnershipReader 获取
      - 不接受任意 authorId 查询参数

  - name: comment_bind_media_assets
    operation: BindMediaAssetsToComment
    go_func: TestBindMediaAssetsToCommentIsOwnerScopedAndIdempotent
    evidence: local_contract
    assertions:
      - 仅 Comment 作者可绑定已验证且归属自己的 MediaAsset
      - 首次绑定递增 version 并产生 CommentAttachmentsBound
      - 相同 key 重放原 receipt 且不产生第二个 outbox 事实

  - name: comment_hide_operator_moderation
    operation: HideComment
    go_func: TestHideCommentModerationLifecycle
    evidence: local_contract
    assertions:
      - typed HideCommentCommand 仅接受 operatorId、commentId 与审计 reason
      - active 经服务端 CAS 迁移为 hidden 并从 active reader 与 count 中移除
      - 相同 Idempotency-Key 重放原 receipt 且只产生一条 CommentModerated

  - name: comment_restore_operator_moderation
    operation: RestoreComment
    go_func: TestRestoreCommentModerationLifecycle
    evidence: local_contract
    assertions:
      - hidden 经服务端 CAS 恢复为 active 并清空 hiddenAt
      - deleted 与 tombstoned 终态拒绝恢复
      - CommentModerated 携带 operatorId、action、reason 与 occurredAt 审计载荷

  - name: comment_hide_http_operator_guard
    operation: HideComment
    go_func: TestCommentModerationHTTPRequiresGeneratedOperatorAuthorization
    evidence: local_contract
    assertions:
      - generated route 直接 dispatch 到 HideComment handler
      - runtime guard 同时校验 operator principal、ops.case.write scope 与 content.moderation.decide permission
      - 伪造客户端身份头、普通账号与缺 scope/permission 的 operator 均 fail closed

  - name: comment_restore_http_operator_guard
    operation: RestoreComment
    go_func: TestCommentModerationHTTPRequiresGeneratedOperatorAuthorization
    evidence: local_contract
    assertions:
      - generated route 直接 dispatch 到 RestoreComment handler
      - handler 只从 verified operator account principal 取得 operatorId
      - 成功响应返回恢复后的服务端 CAS version

  - name: comment_hide_mongo_http
    operation: HideComment
    go_func: TestCommentModerationLifecycleApiIntegration
    evidence: api_integration
    assertions:
      - generated route 经 runtime operator guard 到达 typed CommentCommandFacade
      - Mongo aggregate、receipt 与 CommentModerated outbox 原子提交
      - active page 与 Post commentCount 投影在 relay 后排除 hidden

  - name: comment_restore_mongo_http
    operation: RestoreComment
    go_func: TestCommentModerationLifecycleApiIntegration
    evidence: api_integration
    assertions:
      - Mongo 持久化恢复 active 并清空 hiddenAt
      - active page 与 Post commentCount 投影在 relay 后重新包含评论
      - hide 与 restore 的 durable audit payload 均可由 outbox 重放
