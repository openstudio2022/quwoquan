version: 1
read_model: CommentPageSlice
description: |
  一级评论商用投影分页；由 Comment 白名单字段、回复摘要、ContentReaction 批量计数与
  viewer 状态、MediaAsset 附件快照及 Post ownership capability 组合，不返回任何聚合。
source_entities: [Comment, ContentReaction, MediaAsset, Post]
consumers: [app]
reply_preview_limit: 1
client_projection:
  dart_class: ContentCommentPageSlice
  external_dart_path: quwoquan_app/packages/quwoquan_cloud_contracts/lib/src/content/comment_contracts.dart
fields:
  - attachments
  - replyCount
  - replyPreview
  - replyNextCursor
  - likeCount
  - dislikeCount
  - viewerReaction
  - isAuthor
  - canDelete
  - canReply
  - canReport
  - canPin
