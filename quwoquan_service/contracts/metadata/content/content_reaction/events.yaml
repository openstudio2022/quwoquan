entity: ContentReaction

events:
  - name: ContentReactionSet
    description: actor 对 Post 建立 like 或对 Comment 建立 like/dislike 关系
    producer: content-service
    consumers: [recommendation-engine, notification-service, post-counter-projector, discovery-feed-projector]
    channel: event_store
    payload_fields: [reactionId, version, targetKind, targetId, actorDimension, actorId, reaction, occurredAt, idempotencyKey]
    recommend_impact: hot_path_signal

  - name: ContentReactionCleared
    description: actor 将自身互动关系变更为 none
    producer: content-service
    consumers: [recommendation-engine, notification-service, post-counter-projector, discovery-feed-projector]
    channel: event_store
    payload_fields: [reactionId, version, targetKind, targetId, actorDimension, actorId, reaction, occurredAt, idempotencyKey]
    recommend_impact: hot_path_signal
