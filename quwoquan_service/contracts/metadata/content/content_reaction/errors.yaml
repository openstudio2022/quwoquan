version: 1
domain: content
aggregate: ContentReaction

errors:
  - code: CONTENT.USER.reaction_actor_invalid
    kind: USER
    reason: reaction_actor_invalid
    http_status: 400
    recovery:
      action: surface
      disruptionLevel: snackbar
    dart_const: reactionActorInvalid
    go_const: ErrReactionActorInvalid
    user_message:
      zh: "互动身份无效，请刷新后重试"
      en: "The reaction actor is invalid. Please refresh and retry."

  - code: CONTENT.USER.reaction_target_invalid
    kind: USER
    reason: reaction_target_invalid
    http_status: 400
    recovery:
      action: surface
      disruptionLevel: snackbar
    dart_const: reactionTargetInvalid
    go_const: ErrReactionTargetInvalid
    user_message:
      zh: "互动目标无效"
      en: "The reaction target is invalid."

  - code: CONTENT.USER.reaction_version_conflict
    kind: USER
    reason: reaction_version_conflict
    http_status: 409
    recovery:
      action: refresh
      disruptionLevel: snackbar
    dart_const: reactionVersionConflict
    go_const: ErrReactionVersionConflict
    user_message:
      zh: "互动状态已更新，请刷新后重试"
      en: "The reaction state changed. Please refresh and retry."

  - code: CONTENT.SYSTEM.reaction_storage_failed
    kind: SYSTEM
    reason: reaction_storage_failed
    http_status: 503
    recovery:
      action: retry
      disruptionLevel: passiveIndicator
      afterSeconds: 3
    dart_const: reactionStorageFailed
    go_const: ErrReactionStorageFailed
    user_message:
      zh: "互动暂时不可用，请稍后重试"
      en: "Reactions are temporarily unavailable. Please retry shortly."
