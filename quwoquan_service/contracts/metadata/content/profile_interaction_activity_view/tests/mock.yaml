entity: ProfileInteractionActivityView
layer: app_side

scenarios:
  - name: typed_profile_interaction_page
    assertions:
      - alpha/test adapter 只从 immutable metadata fixture bundle 返回 ContentProfileInteractionActivity
      - production query Facet 只装配 generated operation Remote
      - 云端错误进入结构化错误态，不转换为空列表

  - name: no_view_activity_without_fact_source
    assertions:
      - profile interaction 二级页签只有 likes/comments/shares
      - views/访客/浏览历史无 durable fact source 时不展示、不请求、不合成

  - name: interaction_errors_remain_structured
    assertions:
      - CONTENT.USER.interaction_type_invalid 映射为不可重试参数错误
      - CONTENT.USER.interaction_cursor_invalid 提供刷新恢复动作
      - CONTENT.USER.interaction_owner_forbidden 不伪装为空页
      - CONTENT.SYSTEM.interaction_read_model_unavailable 提供重试恢复动作
