entity: MediaAsset
layer: e2e

description: |
  端云集成场景：媒体资产就绪、公共 slice 物化、发布绑定与封面派生全链路。

execution:
  environment: gamma
  ci_strategy: advisory
  real_engines:
    mongodb: testcontainer
    object_storage: s3-compatible

scenarios:
  - name: media_ready_bind_publish
    test_type: api_contract
    go_func: TestSubmitPostPublicationBindsReadyOwnedMedia
    actors:
      service: content-service SubmitPostPublication + media packet
      storage: MongoDB media_assets + 对象存储
    assertions:
      - 仅 ready 且归属调用者的资产可绑定发布
      - 公共 slice 在发布前物化；coverUrl 由首图派生

  - name: media_commercial_operations_packet
    test_type: api_contract
    go_func: TestMediaAssetHTTPPacketExposesOnlyPublicReadyAssetsAndOwnsVideoCover
    assertions:
      - 公开读只暴露 ready 公共资产
      - 封面选择命令幂等且 owner-scoped

  - name: image_processing_and_variant_delivery
    test_type: api_contract
    go_func: TestMediaProcessingWorkerNormalizesImageAndProjectsDimensions
    assertions:
      - 上传图片在解码、方向归一和尺寸约束完成前保持 processing，损坏或超限输入进入 rejected
      - ready descriptor 持久化权威宽高、交付 MIME、私有归一化对象 key、稳定公共 slice key、主色、LQIP、渲染内容画像与 derivative policy version
      - 发布只从私有归一化对象物化公共基线切片，Feed 的 thumbnail/cover/full 只由 image_variant_policy 派生
