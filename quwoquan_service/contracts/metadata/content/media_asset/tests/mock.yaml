entity: MediaAsset
layer: app_side

description: |
  端侧独立测试场景。媒体读取/封面选择经 typed ContentMediaFacet；
  alpha 侧由 quwoquan_cloud_mock 的 AlphaContentMediaFacet 承接。

command_scenarios:
  - name: media_reference_and_delivery_read
    description: MediaDeliveryReference 解码、URL 语义与降级候选
    dart_tests:
      - quwoquan_app/test/local_contract/core/media/content_media_url__local_contract_test.dart
      - quwoquan_app/test/local_contract/cloud/media/media_operation_contract__local_contract_test.dart

  - name: video_cover_selection_wire
    description: auto/manual 封面选择 wire 与 metadata 对齐
    dart_tests:
      - quwoquan_app/test/local_contract/ui/content/create/publish_payload_cover_contract__local_contract_test.dart

  - name: media_facet_remote_thin_adapter
    description: Remote adapter 仅做 typed 映射，错误结构化，无第二套 URL/decoder
    dart_tests:
      - quwoquan_app/test/local_contract/cloud/media/media_download_cache__local_contract_test.dart
