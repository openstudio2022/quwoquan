
service:
  name: content-service
  domain: content
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: CONTENT_MEDIA_ASSET_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: MediaAsset 的对象中心命令与 owner-scoped 读取操作。

api_routes:
  - method: POST
    path: /internal/content/media/{mediaId}:processing-result

    operation: RecordMediaProcessingResult
    actor: account
    application:
      kind: command
      facet: MediaAssetCommandFacet
      method: recordMediaProcessingResult
      aggregate_owner: MediaAsset
      mutation_target: MediaAsset
      invariant_target: MediaAsset
    authorization:
      principal: service
      scopes: [content.media.process]
      ownership_policy: processing_worker
    commercial:
      status: ready
    reliability:
      timeout_ms: 8000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 3
      idempotency: required
    error_codes:
      - CONTENT.USER.media_not_found
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: redacted
    telemetry:
      metric: content_media_processing_result
      trace: true
      attributes: [outcome, processing_status]
    slo:
      latency_p95_ms: 1200
      availability_percent: 99.9
    request_fields: [processingStatus, failureReason, processorProfile, imageWidth, imageHeight, imageDeliveryContentType, imageNormalizedObjectKey, imagePublicSliceKey, verifiedDurationMs, videoWidth, videoHeight, videoCodec, videoContainer, videoAudioCodec, videoKeyframeIntervalMs, videoFastStart, videoPublicSliceKey, coverPublicSliceKey, previewTrackVersion, previewTrackManifestSliceKey]
    response_fields: [assetId, version, processingStatus, accessPolicy, imageWidth, imageHeight, imageDeliveryContentType, verifiedDurationMs, videoWidth, videoHeight, videoCodec, videoContainer, videoAudioCodec, videoKeyframeIntervalMs, videoFastStart, previewTrackVersion, replayed]
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: 处理 worker 回写 ready 或 rejected；图片与视频 ready 均必须同时携带探测、归一化后的权威 descriptor，owner 不能伪造处理结果。

  - method: PATCH
    path: /internal/content/media/{mediaId}:access-policy

    operation: UpdateMediaAssetAccessPolicy
    actor: persona
    application:
      kind: command
      facet: MediaAssetCommandFacet
      method: updateMediaAssetAccessPolicy
      aggregate_owner: MediaAsset
      mutation_target: MediaAsset
      invariant_target: MediaAsset
    authorization:
      principal: persona
      ownership_policy: asset_owner
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.media_not_found
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_media_access_policy_update
      trace: true
      attributes: [outcome, access_policy]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_fields: [accessPolicy]
    response_fields: [assetId, version, processingStatus, accessPolicy, replayed]
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: asset owner 修改 accessPolicy；任何跨 Persona 写入必须拒绝。

  - method: GET
    path: /internal/content/media/{mediaId}

    operation: GetOwnedMediaAsset
    actor: persona
    application:
      kind: query
      facet: MediaAssetQueryFacet
      method: getMediaAsset
      reader: MediaAssetOwnerReader
      slice: MediaAssetSlice
    authorization:
      principal: persona
      ownership_policy: asset_owner
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.media_not_found
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_media_asset_get
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    response_fields: [assetId, version, mediaType, contentType, fileSize, status, accessPolicy, imageWidth, imageHeight, imageDeliveryContentType, cdnUrl]
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: owner-scoped MediaAsset BSON projection；不会暴露其他 Persona 的资产。

  - method: GET
    path: /internal/content/media/{mediaId}:reference

    operation: GetMediaAssetReference
    actor: account
    application:
      kind: query
      facet: MediaAssetQueryFacet
      method: getMediaAssetReference
      reader: MediaAssetOwnerReader
      slice: MediaAssetReferenceSlice
    authorization:
      principal: service
      scopes: [content.media.reference.read]
      ownership_policy: explicit_owner_persona
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.media_not_found
      - CONTENT.USER.media_not_ready
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_media_asset_reference_get
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    query_params: [ownerPersonaId]
    response_fields: [assetId, ownerPersonaId, processingStatus, contentType, fileSize]
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      visibility: internal
    description: 仅供目标 bounded context 验证 owner-scoped ready MediaAsset 引用，不暴露对象存储键。

  - method: GET
    path: /internal/content/media/{mediaId}:delivery-reference

    operation: GetMediaAssetDeliveryReference
    actor: account
    application:
      kind: query
      facet: MediaAssetQueryFacet
      method: getMediaAssetDeliveryReference
      reader: MediaAssetOwnerReader
      slice: MediaAssetDeliveryReferenceSlice
    authorization:
      principal: service
      scopes: [content.media.delivery.read]
      ownership_policy: explicit_owner_persona
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.media_not_found
      - CONTENT.USER.media_not_ready
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_media_asset_delivery_reference_get
      trace: true
      attributes: [outcome, media_type]
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    query_params: [ownerPersonaId]
    response_fields: [assetId, ownerPersonaId, processingStatus, mediaType, contentType, fileSize, imageWidth, imageHeight, imageDeliveryContentType, cdnUrl]
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      visibility: internal
    description: Chat 等已完成自身访问控制的 bounded context 获取 owner-scoped ready MediaAsset 交付投影；不暴露 object key。

  - method: GET
    path: /content/media/{mediaId}

    operation: GetMediaAsset
    actor: none
    application:
      kind: query
      facet: MediaAssetQueryFacet
      method: getPublicMediaAsset
      reader: MediaAssetPublicReader
      slice: MediaAssetSlice
    authorization:
      principal: public
      ownership_policy: public_ready_asset_only
    commercial:
      status: blocked
      block_reason: generated typed App client and real S3-compatible API integration are complete; Gamma public-media page evidence remains required
      gap_id: CONTENT_MEDIA_GAMMA_UAT
      target_story: app-cloud-business-object-commercial-closure
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.USER.media_not_found
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: PUBLIC
      response_classification: PUBLIC
      log_policy: metadata_only
    telemetry:
      metric: content_media_asset_public_get
      trace: true
      attributes: [outcome, media_type]
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    response_fields: [assetId, version, mediaType, contentType, fileSize, status, accessPolicy, imageWidth, imageHeight, imageDeliveryContentType, cdnUrl]
    client_contract:
      dart_import: ../content/media_contracts.dart
      request_type: GetContentMediaAssetQuery
      response_type: ContentMediaAssetSlice
      request_encoder: encodeGetContentMediaAssetQuery
      response_decoder: decodeContentMediaAssetSlice
    security:
      auth_mode: optional
      principal: public
      token_transport: bearer
      anonymous_policy: allow
      visibility: public
    description: 仅返回 processingStatus=ready 且 accessPolicy=public 的媒体资产。

  - method: POST
    path: /content/media/{mediaId}/cover:auto

    operation: SelectAutoVideoCover
    actor: persona
    application:
      kind: command
      facet: MediaAssetCommandFacet
      method: selectAutoVideoCover
      aggregate_owner: MediaAsset
      mutation_target: MediaAsset
      invariant_target: MediaAsset
    authorization:
      principal: persona
      ownership_policy: asset_owner
    commercial:
      status: blocked
      block_reason: MediaAsset typed Facet and aggregate command are complete; Gamma video-cover page evidence remains required
      gap_id: CONTENT_MEDIA_GAMMA_UAT
      target_story: app-cloud-business-object-commercial-closure
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.media_not_found
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_media_cover_auto_select
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    client_contract:
      dart_import: ../content/media_contracts.dart
      request_type: SelectAutoContentMediaCoverCommand
      response_type: ContentMediaCoverSelectionResult
      request_encoder: encodeSelectAutoContentMediaCoverCommand
      response_decoder: decodeContentMediaCoverSelectionResult
    request_fields: []
    response_fields: [mediaId, coverStrategy, manualCoverAssetId, coverFrameTimeMs, thumbnailUrl, coverUrl]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    description: asset owner 选择首帧派生封面；MediaAsset 仍是封面策略唯一真相源。

  - method: POST
    path: /content/media/{mediaId}/cover:manual

    operation: SelectManualVideoCover
    actor: persona
    application:
      kind: command
      facet: MediaAssetCommandFacet
      method: selectManualVideoCover
      aggregate_owner: MediaAsset
      mutation_target: MediaAsset
      invariant_target: MediaAsset
    authorization:
      principal: persona
      ownership_policy: asset_owner
    commercial:
      status: blocked
      block_reason: MediaAsset typed Facet and aggregate command are complete; Gamma video-cover page evidence remains required
      gap_id: CONTENT_MEDIA_GAMMA_UAT
      target_story: app-cloud-business-object-commercial-closure
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.media_not_found
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_media_cover_manual_select
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    client_contract:
      dart_import: ../content/media_contracts.dart
      request_type: SelectManualContentMediaCoverCommand
      response_type: ContentMediaCoverSelectionResult
      request_encoder: encodeSelectManualContentMediaCoverCommand
      response_decoder: decodeContentMediaCoverSelectionResult
    request_fields: [coverAssetId, coverFrameTimeMs]
    response_fields: [mediaId, coverStrategy, manualCoverAssetId, coverFrameTimeMs, thumbnailUrl, coverUrl]
    security:
      auth_mode: required
      principal: persona
      token_transport: bearer
      anonymous_policy: deny
      visibility: private
    description: asset owner 选择同 owner 封面素材或指定视频帧，并更新 MediaAsset 封面策略。

consumers:
  - name: media-processing
    capabilities: [record_processing_result]
  - name: post-create-update
    capabilities: [read_media_asset, update_access_policy]
  - name: app
    capabilities: [request_original_access, select_auto_video_cover, select_manual_video_cover]
