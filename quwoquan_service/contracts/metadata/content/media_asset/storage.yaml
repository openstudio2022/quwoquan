version: 1
entity: MediaAsset
backend: mongodb

collections:
  media_assets:
    entity: MediaAsset
    description: MediaAsset 权威聚合；不从 Post 或上传会话内存 map 回退读取。
    indexes:
      - { name: idx_media_assets_owner_status, keys: { ownerId: 1, processingStatus: 1, createdAt: -1 } }
      - { name: idx_media_assets_source_session, keys: { sourceSessionId: 1 }, unique: true }
      - { name: idx_media_assets_object_key, keys: { objectKey: 1 } }
      - { name: idx_media_assets_sha256, keys: { sha256: 1 } }
      - { name: idx_media_assets_version, keys: { _id: 1, version: 1 }, unique: true }

  media_asset_command_receipts:
    entity: MediaAsset
    description: MediaAsset 创建、处理结果和访问策略变更的幂等结果；与资产版本和 outbox 同事务提交。
    indexes:
      - { name: idx_media_asset_receipts_key, keys: { _id: 1 }, unique: true }
      - { name: idx_media_asset_receipts_aggregate, keys: { aggregateId: 1, aggregateVersion: -1 } }
      - { name: idx_media_asset_receipts_expire, keys: { expiresAt: 1 }, expireAfterSeconds: 0 }

  media_asset_outbox:
    entity: MediaAsset
    description: MediaAsset 领域事实；完成上传时与 MediaUploadSession 的完成事实在同一 Mongo transaction 落盘。
    indexes:
      - { name: idx_media_asset_outbox_event, keys: { _id: 1 }, unique: true }
      - { name: idx_media_asset_outbox_replay, keys: { occurredAt: 1, _id: 1 } }
      - { name: idx_media_asset_outbox_aggregate_version, keys: { aggregateId: 1, aggregateVersion: 1 }, unique: true }
