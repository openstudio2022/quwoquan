entity: MediaAsset

fields:
  - name: id
    source: id
    type: string
    constraints: [PK]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: version
    source: version
    type: int
    constraints: [NOT_NULL, DEFAULT_1]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: ownerId
    source: ownerId
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 素材所有者 Persona ID；所有 owner 侧读取和访问策略变更均以此字段做 BOLA 边界。

  - name: sourceSessionId
    source: sourceSessionId
    type: string
    constraints: [NOT_NULL, UNIQUE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 产生该资产的上传会话；同一会话最多物化一个资产。

  - name: objectKey
    source: objectKey
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 内部对象存储 canonical key（CAS）。仅服务端边界持有；公开交付必须使用稳定 public slice key / delivery URI，禁止把本字段直接交给播放器或图片组件。

  - name: sha256
    source: sha256
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 已验证的内容摘要；用于 CAS 定址、去重，以及跨环境逻辑资产 parity 校验。

  - name: mediaType
    source: mediaType
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: contentType
    source: contentType
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: fileSize
    source: fileSize
    type: int64
    constraints: [NOT_NULL, POSITIVE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: accessPolicy
    source: accessPolicy
    type: string
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    description: owner_only、referenced_post 或 public；策略不由 Post 内存状态派生。

  - name: processingStatus
    source: processingStatus
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write
    description: processing、ready、rejected 或 deleted。图片和视频均须经服务端验证与归一化，只有 ready 后可被发布和投影。

  - name: processorProfile
    source: processorProfile
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: 处理器 profile；与 assetId、version 共同构成处理幂等键，不向 App 透传。

  - name: imageWidth
    source: imageWidth
    type: int
    constraints: [NULLABLE, POSITIVE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端解码、方向归一和尺寸约束后得到的权威图片宽度（px）；Feed 与正文布局只消费本字段。

  - name: imageHeight
    source: imageHeight
    type: int
    constraints: [NULLABLE, POSITIVE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端解码、方向归一和尺寸约束后得到的权威图片高度（px）；Feed 与正文布局只消费本字段。

  - name: imageDeliveryContentType
    source: imageDeliveryContentType
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 图片归一化基线切片的真实 MIME；CDN 可再按 media_variant_profiles 动态转为 WebP。

  - name: imageNormalizedObjectKey
    source: imageNormalizedObjectKey
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 服务端处理得到的私有归一化对象 key；发布时复制到 imagePublicSliceKey，禁止直接透传客户端。

  - name: imagePublicSliceKey
    source: imagePublicSliceKey
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 图片稳定公共基线切片 key；thumbnail/display/cover/full 由 CDN 按 metadata profile 派生。

  - name: verifiedDurationMs
    source: verifiedDurationMs
    type: int64
    constraints: [NULLABLE, NON_NEGATIVE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测后写入的权威视频时长（毫秒）；原生播放器时长只能用于运行时边界和一致性校验。

  - name: videoWidth
    source: videoWidth
    type: int
    constraints: [NULLABLE, POSITIVE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的编码视频宽度（px）。

  - name: videoHeight
    source: videoHeight
    type: int
    constraints: [NULLABLE, POSITIVE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的编码视频高度（px）。

  - name: videoCodec
    source: videoCodec
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的 codec 名称；仅用于能力降级和低基数 QoE 分桶。

  - name: videoContainer
    source: videoContainer
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的封装格式。

  - name: videoAudioCodec
    source: videoAudioCodec
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: 服务端探测的主音轨 codec；P0 商用 MP4 必须为 AAC。

  - name: videoKeyframeIntervalMs
    source: videoKeyframeIntervalMs
    type: int
    constraints: [NULLABLE, POSITIVE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: 服务端探测的最大关键帧间隔；P0 media-canary 不得超过 2000ms。

  - name: videoFastStart
    source: videoFastStart
    type: bool
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: MP4 moov 是否位于媒体数据前，可在首字节 Range 内发现；P0 ready 必须为 true。

  - name: videoPublicSliceKey
    source: videoPublicSliceKey
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 公开视频 canonical slice key；业务投影必须经受信交付边界解析，禁止向 UI 透传 objectKey 或未验证 URL。

  - name: coverPublicSliceKey
    source: coverPublicSliceKey
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 公开视频封面 canonical slice key；与 asset/version 绑定。

  - name: previewTrackVersion
    source: previewTrackVersion
    type: int
    constraints: [NULLABLE, POSITIVE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: drop
    ops_exposure: read
    description: storyboard 预览轨版本；缺失时 App 仅显示时间浮标。

  - name: previewTrackManifestSliceKey
    source: previewTrackManifestSliceKey
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: storyboard manifest 的 canonical slice key；访问与缓存必须绑定 asset/version/profile/access policy。

  - name: processingFailureReason
    source: processingFailureReason
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: redact
    api_exposure: drop
    ops_exposure: read

  - name: coverStrategy
    source: coverStrategy
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write

  - name: manualCoverAssetId
    source: manualCoverAssetId
    type: string
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: hash
    api_exposure: read
    ops_exposure: read_write

  - name: coverFrameTimeMs
    source: coverFrameTimeMs
    type: int64
    constraints: [NOT_NULL, NON_NEGATIVE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write

  - name: createdAt
    source: createdAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: processedAt
    source: processedAt
    type: timestamp
    constraints: [NULLABLE]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
