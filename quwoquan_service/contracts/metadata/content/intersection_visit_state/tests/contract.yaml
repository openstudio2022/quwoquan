entity: IntersectionVisitState

scenarios:
  - name: mark_visited_monotonic_watermark
    operation: MarkIntersectionsVisited
    go_func: TestIntersectionVisitHTTPContract
    evidence: api_integration
    assertions:
      - POST /content/intersections/visit 经 generated 路由注册可达（非 handleNotImplemented）
      - dimension 为空推进 identity/location/content/interest/relationship 全部维度
      - rm_intersection_watermark 以 $max 单调合并；晚到旧时间戳不回退水位
      - 任意重放语义收敛；Redis 宕机时耐久写成功即返回成功（降级不阻断）

  - name: mark_visited_clears_unread
    operation: MarkIntersectionsVisited
    go_func: TestIntersectionVisitHTTPContract
    evidence: api_integration
    assertions:
      - 推进水位后 GetMyIntersectionSummary 未读计数按维度清零
