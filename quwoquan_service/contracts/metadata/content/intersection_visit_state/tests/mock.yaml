entity: IntersectionVisitState
layer: app_side

description: |
  端侧「我的交集」收件箱清红点链路的独立场景（typed visit writer + provider）。

scenarios:
  - name: visit_writer_wire_shape
    source: quwoquan_app/test/local_contract/cloud/integration/intersection_response_body_contract__local_contract_test.dart
    assertions:
      - 出站 wire 只含可空 dimension；path 来自 generated 常量（/content/intersections/visit）
      - ack 形态无读模型；typed writer 调用返回 void 不抛错

  - name: inbox_load_and_mark_visited
    source: quwoquan_app/test/local_contract/ui/user/pages/my_intersection_inbox_page__local_contract_test.dart
    assertions:
      - 打开交集列表触发列表加载 + 清红点（typed writer 收到全维度推进）+ summary 刷新
      - 清红点失败不阻断列表展示（降级容忍 + 结构化遥测）
