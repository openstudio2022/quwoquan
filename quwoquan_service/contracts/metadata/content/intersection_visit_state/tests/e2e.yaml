entity: IntersectionVisitState
layer: e2e

scenarios:
  - name: inbox_red_dot_clear_journey
    steps:
      - user opens my intersection inbox on a dimension with unread items
      - app marks intersections visited through POST /content/intersections/visit
      - user re-enters the inbox after new intersections arrive
    assertions:
      - unread_badge_clears_after_visit
      - watermark_survives_redis_flush (durable Mongo source of truth)
      - new_items_after_watermark_show_as_unread
