entity: IntersectionVisitState

fields:
  - { name: userId, type: string, constraints: [PK, NOT_NULL], classification: PII, log_policy: hash, api_exposure: drop, ops_exposure: read }
  - { name: identityVisitedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
  - { name: locationVisitedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
  - { name: contentVisitedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
  - { name: interestVisitedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
  - { name: relationshipVisitedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
  - { name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }

entities:
  MarkIntersectionsVisitedRequest:
    description: 推进交集已读水位的命令输入；dimension 为空表示推进全部维度。
    fields:
      - { name: dimension, type: enum, enum_ref: IntersectionDimension, constraints: [NULLABLE] }

  MarkIntersectionsVisitedAck:
    description: 水位推进回执；返回本次实际推进的维度集合。
    fields:
      - { name: dimensions, type: "[]string", constraints: [NOT_NULL] }
      - { name: status, type: string, constraints: [NOT_NULL] }
