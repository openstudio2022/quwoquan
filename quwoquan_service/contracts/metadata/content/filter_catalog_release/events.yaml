aggregate: FilterCatalogRelease

# 聚合记录、command receipt 与以下 fact collection 共同承载发布审计。
# 当前无跨服务业务消费者；Redis active cache 由同一 application transaction 后失效，
# 不建立无消费者的 MQ/outbox 旁路。
events:
  - name: FilterCatalogReleaseStaged
    producer: content-service
    consumers: []
    channel: fact_collection
    payload_entity: FilterCatalogRelease
    payload_fields: [releaseId, canonicalDigest, categoryCount, presetCount, status, importedAt]

  - name: FilterCatalogReleaseActivated
    producer: content-service
    consumers: []
    channel: fact_collection
    payload_entity: FilterCatalogRelease
    payload_fields: [releaseId, canonicalDigest, categoryCount, presetCount, status, activatedAt]

  - name: FilterCatalogReleaseRolledBack
    producer: content-service
    consumers: []
    channel: fact_collection
    payload_entity: FilterCatalogRelease
    payload_fields: [releaseId, canonicalDigest, categoryCount, presetCount, status, activatedAt]
