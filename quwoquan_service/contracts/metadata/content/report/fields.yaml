entity: Report

fields:
  - name: id
    source: id
    type: string
    constraints: [PK]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: version
    source: version
    type: int
    constraints: [NOT_NULL, DEFAULT_1]
    classification: INTERNAL
    log_policy: allow
    api_exposure: read
    ops_exposure: read
    description: Report 乐观并发版本；每次状态迁移原子递增

  - name: reporterId
    source: reporterId
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: reporterAccountId
    source: reporterAccountId
    type: string
    constraints: [NOT_NULL]
    classification: PII
    log_policy: hash
    api_exposure: drop
    ops_exposure: read
    description: 举报创建时可信 principal 的账户归属；仅用于将结案通知投递至账户 Inbox，不得由客户端提供或回显。

  - name: targetType
    source: targetType
    type: enum
    enum_ref: ReportTargetType
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read

  - name: targetId
    source: targetId
    type: string
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read

  - name: reason
    source: reason
    type: enum
    enum_ref: ReportReason
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read

  - name: description
    source: description
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read_write
    ops_exposure: read

  - name: status
    source: status
    type: enum
    enum_ref: ReportStatus
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read_write

  - name: reviewerId
    source: reviewerId
    type: string
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: drop
    ops_exposure: read

  - name: resolution
    source: resolution
    type: enum
    enum_ref: ReportResolution
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: drop
    ops_exposure: read_write

  - name: createdAt
    source: createdAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: updatedAt
    source: updatedAt
    type: timestamp
    constraints: [NOT_NULL]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

  - name: resolvedAt
    source: resolvedAt
    type: timestamp
    constraints: [NULLABLE]
    classification: PUBLIC
    log_policy: allow
    api_exposure: read
    ops_exposure: read

state_machine:
  field: status
  transitions:
    - from: pending
      to: [reviewing]
    - from: reviewing
      to: [resolved, dismissed]
