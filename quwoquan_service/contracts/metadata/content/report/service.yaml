- capabilities:
  - create_report
  name: app
- capabilities:
  - list_reports
  - read_report
  - begin_review
  - resolve_report
  name: platform-ops
contract_test:
  coverage_requirements:
  - all target types covered
  - state machine transitions tested
  mock_strategy:
    app_side:
      mock_target: content-service API (report)
      scenarios:
      - assertions:
        - status_204
        - empty_response_body
        name: submit_report
        route: POST /v1/content/reports
        variants:
        - post
        - comment
        - user
        - circle
        - message
    service_side:
      data_management:
        cleanup: TRUNCATE reports CASCADE
        seed: fixture 工厂预制到真实 PG
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        postgres: embedded-postgres
      scenarios:
      - assertions:
        - SELECT * FROM reports WHERE id=? → status='pending'
        - SELECT status FROM reports → 'reviewing' after review start
        - SELECT status, resolution FROM reports → 'resolved' + resolution set
        - SELECT * FROM report_outbox WHERE event_type='content.report.created'
        - SELECT * FROM report_outbox WHERE event_type='content.report.resolved'
        command: CreateReport → BeginReportReview → ResolveReport
        name: report_lifecycle
        seed: []
      - assertions:
        - anonymous and forged headers are rejected before persistence
        - regular account without operator role is forbidden
        - operator role requires declared scope and permission
        commands:
        - ListReports
        - GetReport
        - BeginReportReview
        - ResolveReport
        name: operator_report_queue_authorization
      spy_targets:
      - report_outbox
service:
  commercial_defaults:
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: CONTENT_REPORT_COMMERCIAL_EVIDENCE
    status: blocked
    target_story: app-cloud-business-object-commercial-closure
  domain: content
  name: content-service
  owner: backend-team
version: 1
