entity: Report

coverage_requirements:
  - all target types covered
  - state machine transitions tested

scenarios:
  - name: report_create_persists_pending_aggregate_and_outbox
    operation: CreateReport
    go_func: TestCreateReportPersistsPendingAggregateAndOutbox
    evidence: api_integration
    assertions:
      - reports 行 status='pending'，aggregate/receipt/outbox 同一 PG 事务提交
      - report_outbox 存在 content.report.created 事实

  - name: report_create_rejects_forged_identity
    operation: CreateReport
    go_func: TestCreateReportRejectsForgedIdentityHeadersWithoutPersistence
    evidence: api_integration
    assertions:
      - 伪造 identity headers 在持久化前被拒绝
      - 无任何 reports/receipt/outbox 副作用

  - name: report_create_uses_verified_persona
    operation: CreateReport
    go_func: TestCreateReportPersistsVerifiedPersonaInsteadOfClientHeaders
    evidence: api_integration
    assertions:
      - reporterId 来自服务端可信 principal，不来自客户端 header

  - name: report_create_idempotency_replay
    operation: CreateReport
    go_func: TestCreateReportIdempotencyReplaysWithoutDuplicatePersistence
    evidence: api_integration
    assertions:
      - 同一 Idempotency-Key 重放返回首个 receipt
      - 不产生第二行 reports 或第二条 outbox

  - name: report_lifecycle_state_machine
    operation: ResolveReport
    go_func: TestReportOperatorQueueReviewResolveTransitionAndIdempotency
    evidence: local_contract
    assertions:
      - pending → reviewing → resolved 单向状态机
      - BeginReportReview/ResolveReport 为命名状态迁移，服务端内部 CAS，公开请求不携带版本
      - report_outbox 存在 content.report.resolved 事实

  - name: report_dismissed_lifecycle_and_notification
    operation: DismissReport
    go_func: TestDismissReportClosesLifecycleAndObservesSLO
    evidence: local_contract
    assertions:
      - 只有 reviewing 可迁移到 dismissed，resolution 固定为 dismiss
      - content.report.dismissed payload 含 reporterId 且不暴露给其他用户
      - 结案通知按 eventId 幂等投影为 reporter 的单条 AppMessage

  - name: report_noop_intent_persists_receipt
    operation: BeginReportReview
    go_func: TestReportNoopIntentPersistsReceiptBeforeLaterStateChange
    evidence: local_contract
    assertions:
      - 目标状态已满足的首个 Idempotency-Key 持久化 no-op receipt，不递增版本、不产伪事实
      - 状态继续演进后同 key 仍重放原 no-op 结果
      - ResolveReport 同 reviewer 同 resolution 的重复到达同样按 no-op receipt 处理

  - name: operator_report_queue_authorization
    operation: ListReports
    go_func: TestReportOperationsRejectAnonymousForgedAndUnauthorizedPrincipals
    evidence: local_contract
    assertions:
      - 匿名与伪造 header 被拒绝
      - 无 operator 角色的普通账号 forbidden
      - operator 队列操作要求声明 scope 与 permission

  - name: reporter_lists_only_own_reports
    operation: ListMyReports
    go_func: TestListMyReportsReturnsOnlyVerifiedPersonaReports
    evidence: api_integration
    assertions:
      - reporterId 只取可信 persona principal，拒绝匿名与伪造身份
      - 分页结果只包含当前 persona 自己提交的举报
      - 响应不包含 reviewerId 与内部处置字段
      - cursor 分页稳定且不会重复或跳过同 createdAt 的记录
