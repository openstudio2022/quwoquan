entity: Report
layer: e2e

description: |
  端云集成场景：app → gateway → content-service → PostgreSQL（真实存储）→
  report_outbox → moderation-projection（举报驱动审核 case 开启）。

execution:
  environment: gamma
  ci_strategy: pre-release
  real_engines:
    postgres: embedded-postgres
  data_management:
    seed: fixture 工厂预制到真实 PG
    cleanup: TRUNCATE reports CASCADE

scenarios:
  - name: report_submit_to_moderation_case
    test_type: api_contract
    actors:
      app: lib/ui/discovery/widgets/works_immersive_viewer.dart（举报入口）
      gateway: /content/reports
      service: content-service POST /content/reports
      storage: PostgreSQL reports + report_outbox
    steps:
      - app 提交举报（Idempotency-Key）
      - content-service 同事务写 aggregate/receipt/outbox
      - report outbox relay 投递 content.report.created
      - moderation-projection consumer 打开 PostModerationCase
    assertions:
      - 举报成功后 moderation case 状态为 open 且绑定目标 postId
      - 重复提交同 key 不产生第二个 case

  - name: report_progress_returns_to_reporter
    test_type: user_journey
    actors:
      app: lib/ui/settings/pages/my_reports_page.dart
      gateway: /content/users/me/reports
      service: content-service GET /content/users/me/reports
      notification: notification-service 消费 content.report.resolved
      storage: PostgreSQL reports + notification inbox
    steps:
      - reporter 提交带明确 reason 的举报
      - operator 领取并结案举报
      - reporter 收到结构化结案通知并进入我的举报
      - 我的举报只返回当前 reporter 的进度
    assertions:
      - 未登录访问被拒绝且不泄露任何举报
      - pending、reviewing、resolved 或 dismissed 状态与聚合一致
      - 通知引用 reportId 且深链回到我的举报页面
      - 列表与通知均不暴露 reviewerId 或其他举报人
      - beta/gamma 必须由对象级 lifecycle probe 实际执行创建、幂等重放、运营驳回、通知回流与 dislike 撤销
      - prod 只允许 read-only probe，必须验证真实鉴权下的 reporter 私有列表，禁止生产写探针
