version: 1
domain: content
entity: Report
is_aggregate: false

description: |
  举报记录。合规审计不可丢失，状态机需 ACID。
  PostgreSQL 存储。支持举报帖子、评论、用户、圈子、消息。

storage_backend: postgres
cache_layer: none
capabilities:
  - queryable

taggable: false
vector_enabled: false

ddd_layer_mapping:
  domain_model: internal/domain/report/model
  repository: internal/application/ports
  repository_implementation: internal/infrastructure/persistence
  application: internal/application/report
  adapter_rest: internal/adapters/http
  adapter_event: internal/infrastructure/messaging
