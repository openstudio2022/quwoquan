entity: Report
domain: CONTENT

description: |
  Report 对象专属错误码。共享错误码唯一定义于 content/post/errors.yaml；
  content 域 codegen 与端云 parity 按固定文件列表合并，code 全域唯一。

errors:
  - code: CONTENT.USER.report_not_found
    kind: USER
    reason: report_not_found
    http_status: 404
    recovery_action: surface
    dart_const: reportNotFound
    go_const: ErrReportNotFound
    user_message:
      zh: "举报不存在"
      en: "Report not found"
