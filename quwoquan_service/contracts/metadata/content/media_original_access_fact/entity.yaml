domain: content
entity: MediaOriginalAccessFact
object_kind: append_only_fact

description: |
  MediaAsset 完成访问策略与 owner 校验后追加的原始媒体授权审计事实。
  事实、幂等 receipt 与 outbox 在同一 Mongo transaction 落盘；重放不得延长授权有效期。

storage_backend: mongodb
cache_layer: none
capabilities: [append_only, idempotent_append, outbox]
taggable: false
vector_enabled: false

business_rules:
  - 只有 ready 的 image 或 video MediaAsset 可以产生授权事实
  - viewer 必须通过 MediaAsset 访问策略和 BOLA 校验
  - 同一 idempotencyKey 只产生一个 auditId、一个绝对 expiresAt 和一条 outbox 事件
  - 重放返回原绝对 expiresAt，禁止刷新或延长签名 URL 生命周期

lifecycle:
  states: [granted]
  immutable: true

ddd_layer_mapping:
  domain_model: internal/domain/media/model/original_access_fact.go
  append_port: internal/domain/media/ports/original_access_sink.go
  application: internal/application/media
  persistence: internal/infrastructure/persistence/media_original_access_mongo_sink.go
  adapter_rest: internal/adapters/http
  adapter_event: internal/infrastructure/messaging
