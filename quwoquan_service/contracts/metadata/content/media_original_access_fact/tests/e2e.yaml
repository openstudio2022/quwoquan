entity: MediaOriginalAccessFact
layer: e2e

description: 端云集成场景：原图访问授权 + 审计事实 append/dedupe。

execution:
  environment: gamma
  ci_strategy: advisory
  real_engines:
    mongodb: testcontainer

scenarios:
  - name: original_access_grant_and_audit
    test_type: api_contract
    go_func: TestRequestOriginalImageAccessContract
    assertions:
      - 授权成功追加唯一 auditId 事实（idempotencyKey dedupe）
      - 重放返回原绝对 expiresAt，禁止延长
      - 无权限/超频返回 original_access_denied / original_access_rate_limited
