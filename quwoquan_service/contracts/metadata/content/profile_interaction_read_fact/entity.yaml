domain: content
entity: ProfileInteractionReadFact
object_kind: append_only_fact
storage_backend: mongodb
description: |
  当前 owner persona 对 received profile activity 的 seen/read 追加事实。
  语义键 ownerPersonaId+activityId+state 唯一，事实不可修改；read 只会推进
  ActivityView 状态，seen 永不清除 read。

business_rules:
  - state 只允许 seen/read
  - ownerPersonaId+activityId+state 唯一，重复追加返回首次事实
  - 仅 received activity 的 owner persona 可追加
  - read 投影同时保证 seenAt 非空，seen 不得回退已存在 readAt

lifecycle:
  initial: appended
  terminal: appended

service:
  name: content-service
  domain: content

ownership:
  owner_team: content-platform
  lifecycle: immutable

storage:
  backend: mongodb
