entity: ProfileInteractionReadFact

scenarios:
  - name: append_read_fact_semantic_dedupe
    operation: UpdateProfileInteractionState
    go_func: TestProfileInteractionReadFactAppendIsIdempotent
    evidence: api_integration
    assertions:
      - ownerPersonaId+activityId+state 唯一
      - 相同语义事实重复请求返回首次 fact 且 replayed=true
      - fact 与 outbox 在同一 Mongo transaction 提交

  - name: read_fact_projects_monotonic_state
    operation: UpdateProfileInteractionState
    go_func: TestProfileInteractionReadFactProjectsMonotonicState
    evidence: api_integration
    assertions:
      - seen 仅填充 seenAt
      - read 同时保证 seenAt/readAt 非空
      - read 后追加 seen 不清除或后移 readAt

  - name: read_fact_projection_failure_keeps_checkpoint
    operation: UpdateProfileInteractionState
    go_func: TestProfileInteractionReadFactProjectionFailureKeepsCheckpoint
    evidence: local_contract
    assertions:
      - projection writer 失败时 checkpoint 不推进
      - 重试成功后 activity 状态只推进一次
