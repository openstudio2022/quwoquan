
service:
  name: content-service
  domain: content
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: CONTENT_POST_MODERATION_CASE_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: PostModerationCase 对象命令操作包。

api_routes:
  - method: POST
    path: /internal/content/posts/{postId}:open-moderation-case

    operation: OpenPostModerationCase
    actor: account
    application:
      kind: command
      facet: PostModerationCaseCommandFacet
      method: openPostModerationCase
      aggregate_owner: PostModerationCase
      mutation_target: PostModerationCase
      invariant_target: PostModerationCase
    authorization:
      principal: service
      scopes: [content.post.moderation.open]
      ownership_policy: post_revision_snapshot
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_moderation_case_open
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: 为给定 postVersion + contentDigest 打开独立审核 Case；同一 revision 只能有一个 Case。

  - method: POST
    path: /internal/content/posts/{postId}:review-moderation

    operation: ReviewPostModerationCase
    actor: account
    application:
      kind: command
      facet: PostModerationCaseCommandFacet
      method: reviewPostModerationCase
      aggregate_owner: PostModerationCase
      mutation_target: PostModerationCase
      invariant_target: PostModerationCase
    authorization:
      principal: operator
      scopes: [ops.case.write]
      permissions: [content.moderation.review]
      ownership_policy: moderation_queue
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: redacted
    telemetry:
      metric: content_moderation_case_review
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: 有审核权限的 operator 将 Case 从 pending 迁移至 reviewed，并写入 reviewer 审计。

  - method: POST
    path: /internal/content/posts/{postId}:moderate

    operation: DecidePostModeration
    actor: account
    application:
      kind: command
      facet: PostModerationCaseCommandFacet
      method: decidePostModeration
      aggregate_owner: PostModerationCase
      mutation_target: PostModerationCase
      invariant_target: PostModerationCase
    authorization:
      principal: operator
      scopes: [ops.case.write]
      permissions: [content.moderation.decide]
      ownership_policy: moderation_queue
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: redacted
    telemetry:
      metric: content_moderation_case_decide
      trace: true
      attributes: [outcome, decision]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: 对指定 postVersion + contentDigest 的 reviewed Case 作出 approved 或 rejected 决定；先前 revision 的决定不得批准当前发布。

  - method: POST
    path: /internal/content/posts/{postId}:supersede-moderation

    operation: SupersedePostModerationCase
    actor: account
    application:
      kind: command
      facet: PostModerationCaseCommandFacet
      method: supersedePostModerationCase
      aggregate_owner: PostModerationCase
      mutation_target: PostModerationCase
      invariant_target: PostModerationCase
    authorization:
      principal: service
      scopes: [content.post.moderation.supersede]
      ownership_policy: post_revision_snapshot
    commercial:
      status: ready
    reliability:
      timeout_ms: 5000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.idempotency_conflict
      - CONTENT.USER.version_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_moderation_case_supersede
      trace: true
      attributes: [outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: Post revision 变更后由 lifecycle 调用，使旧 Case 不再具备发布资格。

  - method: GET
    path: /internal/content/posts/{postId}/moderation-case

    operation: GetCurrentPostModerationCase
    actor: account
    application:
      kind: query
      facet: PostModerationCaseQueryFacet
      method: getCurrentPostModerationCase
      reader: CurrentPostModerationCaseReader
      slice: PostModerationCaseOpsSlice
    authorization:
      principal: operator
      scopes: [ops.case.read]
      permissions: [content.moderation.read]
      ownership_policy: moderation_queue
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.USER.unauthorized
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.moderation_case_not_found
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: INTERNAL
      response_classification: SENSITIVE
      log_policy: redacted
    telemetry:
      metric: content_moderation_case_get
      trace: true
      attributes: [status, outcome]
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    response_entity: PostModerationCaseOpsSlice
    response_body: PostModerationCaseOpsSlice
    response_body_kind: object
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
    description: 运营人员读取指定 Post 当前最新且未 superseded 的审核 Case。

  - method: GET
    path: /internal/content/posts/{postId}/publication-eligibility

    operation: GetPostPublicationEligibility
    actor: account
    application:
      kind: query
      facet: PublicationEligibilityQueryFacet
      method: getPostPublicationEligibility
      reader: PublicationEligibilityReader
      slice: PublicationEligibilitySlice
    authorization:
      principal: service
      scopes: [content.post.publish]
      ownership_policy: post_revision_snapshot
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: none
    error_codes:
      - CONTENT.SYSTEM.storage_read_failed
    privacy:
      request_classification: INTERNAL
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_moderation_publication_eligibility_get
      trace: true
      attributes: [eligible]
    slo:
      latency_p95_ms: 400
      availability_percent: 99.9
    security:
      auth_mode: required
      token_transport: bearer
      visibility: internal
    description: 供 Post lifecycle 接线使用的只读资格判断；仅当前 postVersion + contentDigest 的 approved Case 可返回 eligible=true。

consumers:
  - name: moderation-service
    capabilities: [decide_post_moderation]
  - name: platform-ops
    capabilities: [read_current_post_moderation_case, review_post_moderation_case, decide_post_moderation]
