version: 1
entity: PostModerationCase

events:
  - name: PostModerationCaseOpened
    description: 为指定 Post 版本与内容摘要创建待审核 Case。
    producer: content-service
    consumers: [moderation-service]
    channel: transactional_outbox
    payload_fields: [id, version, postId, postVersion, contentDigest, status]

  - name: PostModerationReviewStarted
    description: 审核员领取并完成初审，Case 进入 reviewed。
    producer: content-service
    consumers: [moderation-service]
    channel: transactional_outbox
    payload_fields: [id, version, postId, postVersion, reviewerId, status]

  - name: PostModerationDecided
    description: 审核员批准或拒绝绑定版本与摘要的 Case。
    producer: content-service
    consumers: [moderation-service, content-service]
    channel: transactional_outbox
    payload_fields: [id, version, postId, postVersion, contentDigest, reviewerId, status, decidedAt]

  - name: PostModerationSuperseded
    description: Post 已切换版本或摘要，旧审核决定不再具备发布资格。
    producer: content-service
    consumers: [moderation-service, content-service]
    channel: transactional_outbox
    payload_fields: [id, version, postId, postVersion, contentDigest, status]
