entity: PostModerationCase
layer: app_side

description: |
  审核为 internal operator 面（/internal/content/posts/*），App 无直接消费；
  端侧仅经错误码感知审核态（moderation_approval_required / moderation_decision_stale）。

command_scenarios:
  - name: moderation_error_codes_typed
    description: 端侧 ContentErrorCode 覆盖审核错误码并映射结构化恢复动作
    dart_tests:
      - quwoquan_app/test/local_contract/cloud/content/contract/content_error_code_contract__local_contract_test.dart
