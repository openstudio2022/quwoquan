entity: PostModerationCase

scenarios:
  - name: operator_reads_current_post_moderation_case
    operation: GetCurrentPostModerationCase
    go_func: TestPostModerationWorkflowEligibilityAndIdempotency
    evidence: local_contract
    assertions:
      - 只返回指定 Post 最新且未 superseded 的 Case
      - 返回 caseId/postVersion/contentDigest/status 供 Portal 继续命名审核命令
      - 无 operator scope/permission 或无 Case 时 fail closed

  - name: moderation_workflow_eligibility_and_idempotency
    operation: DecidePostModeration
    go_func: TestPostModerationWorkflowEligibilityAndIdempotency
    evidence: local_contract
    assertions:
      - open → review → decide 命名状态迁移；revision 绑定内容版本
      - 同一 Idempotency-Key 重放返回首个裁决，不产生第二个 case
      - approved 后 GetPostPublicationEligibility 返回可发布

  - name: moderation_review_claims_single_reviewer
    operation: ReviewPostModerationCase
    go_func: TestConcurrentModerationCommandsConvergeToSingleTargetTransitions
    evidence: local_contract
    assertions:
      - 只有 pending case 可迁移到 reviewed，reviewer 成为后续决定唯一操作者
      - concurrent review 收敛为同一 reviewed 状态，不重复产生 outbox 或审计记录

  - name: moderation_supersede_converges_once
    operation: SupersedePostModerationCase
    go_func: TestConcurrentModerationCommandsConvergeToSingleTargetTransitions
    evidence: local_contract
    assertions:
      - concurrent supersede 收敛为单一 superseded 状态
      - open/review/decide/supersede 各只产生一条 outbox 与审计记录

  - name: rejected_post_remains_ineligible
    operation: GetPostPublicationEligibility
    go_func: TestRejectedPostRemainsPublicationIneligible
    evidence: local_contract
    assertions:
      - rejected 裁决使内容持续不可发布
      - 内容编辑产生新 revision 后旧裁决 stale（moderation_decision_stale）

  - name: report_opens_moderation_case
    operation: OpenPostModerationCase
    go_func: TestReportOutboxOpensModerationCase
    evidence: api_integration
    assertions:
      - report outbox 经 moderation-projection consumer 自动开 case
      - 同一 report 事实重放不产生重复 case

  - name: moderation_decision_applies_post_lifecycle
    operation: DecidePostModeration
    go_func: TestModerationDecisionOutboxAppliesPostLifecycleAndVisibility
    evidence: api_integration
    assertions:
      - moderation decided outbox 只对匹配 post revision 生效
      - rejected 内容从详情、Feed 与 Search 公共读面消失
      - approved 新 revision 可恢复公共可见性且 checkpoint 重放幂等
