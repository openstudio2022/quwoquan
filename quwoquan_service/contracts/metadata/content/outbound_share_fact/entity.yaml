domain: content
entity: OutboundShareFact
object_kind: append_only_fact

description: |
  站外渠道确认成功后追加的不可变分享事实。引用发布由 Post(sourcePostId) 承担，
  圈内放置由 CirclePostPlacement 承担；本对象不存在 revoke/unshare 生命周期。

storage_backend: mongodb
cache_layer: none
capabilities: [append_only, idempotent_append, outbox]
taggable: false
vector_enabled: false

business_rules:
  - 只有渠道返回成功后才能追加事实
  - 同一 actor 与 idempotencyKey 只产生一个 eventId 和一条 outbox 事件
  - destination 只保存类型与不可逆摘要，不保存收件人明文

lifecycle:
  states: [recorded]
  immutable: true

ddd_layer_mapping:
  domain_model: internal/domain/content/outbound_share_fact/model
  append_port: internal/domain/content/outbound_share_fact/ports
  application: internal/application/content/outbound_share_fact/command
  persistence: internal/infrastructure/content/outbound_share_fact/persistence
  adapter_rest: internal/adapters/http
  adapter_event: internal/adapters/mq
