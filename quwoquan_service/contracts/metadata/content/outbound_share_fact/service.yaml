
service:
  name: content-service
  domain: content
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: 真实 Mongo append/dedupe/outbox 与 generated App client 已完成；仅差 Gamma 渠道回执旅程证据
    gap_id: OUTBOUND_SHARE_FACT_GAMMA_UAT
    target_story: app-cloud-business-object-commercial-closure
  description: 站外成功分享的不可变事实追加入口。

api_routes:
  - method: POST
    path: /content/posts/{postId}/outbound-shares

    operation: CreateOutboundShare
    actor: persona_or_device
    application:
      kind: command
      facet: OutboundShareAppendFacet
      method: appendOutboundShare
      append_sink: OutboundShareFact
      mutation_target: OutboundShareFact
      invariant_target: OutboundShareFact
    authorization:
      principal: public
      ownership_policy: authenticated_persona_or_derived_device_actor
    commercial:
      status: blocked
      block_reason: real Mongo append/dedupe/outbox and generated App client are complete; Gamma provider-receipt journey evidence remains required
      gap_id: OUTBOUND_SHARE_FACT_GAMMA_UAT
      target_story: app-cloud-business-object-commercial-closure
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - CONTENT.USER.invalid_argument
      - CONTENT.USER.idempotency_conflict
      - CONTENT.SYSTEM.storage_write_failed
    privacy:
      request_classification: PII
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: content_outbound_share_append
      trace: true
      attributes: [actor_dimension, channel, destination_kind, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    request_fields: [channel, destinationKind, destination, referralId, deliverySucceeded, providerReceiptId, clientConfirmedAt]
    response_fields: [eventId, postId, channel, referralId, occurredAt, replayed]
    client_contract:
      dart_import: ../content/outbound_share_contracts.dart
      request_type: CreateContentOutboundShareCommand
      response_type: ContentOutboundShareFactResult
      request_encoder: encodeCreateContentOutboundShareCommand
      response_decoder: decodeContentOutboundShareFactResult
    security:
      auth_mode: optional
      principal: owner
      token_transport: bearer
      anonymous_policy: allow
      visibility: public

consumers:
  - name: app
    capabilities: [record_outbound_share]
