version: 1
entity: OutboundShareFact
backend: mongodb

collections:
  outbound_share_facts:
    entity: OutboundShareFact
    role: append_only
    indexes:
      - { name: idx_outbound_share_event, keys: { eventId: 1 }, unique: true }
      - { name: idx_outbound_share_dedupe, keys: { actorDimension: 1, actorId: 1, idempotencyKey: 1 }, unique: true }
      - { name: idx_outbound_share_post_time, keys: { postId: 1, occurredAt: -1 } }
  outbound_share_outbox:
    entity: OutboundShareFact
    role: append_only
    indexes:
      - { name: idx_outbound_share_outbox_event, keys: { eventId: 1 }, unique: true }
      - { name: idx_outbound_share_outbox_replay, keys: { occurredAt: 1, eventId: 1 } }
