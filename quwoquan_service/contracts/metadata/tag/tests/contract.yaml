entity: TagNodeView

scenarios:
  - name: tag_resolve_and_children_hierarchy
    operation: ResolveTag
    go_func: TestResolveReturnsDefinition
    evidence: api_integration
    assertions:
      - 已导入 tagRef 可解析出 label/aliases/ancestors
      - 未知 tagRef 返回 TAG.USER.tag_not_found（404）
      - children 只返回 active 直接子节点（行政区完整直辖层）

  - name: tag_graph_queries
    operation: SharedTags
    go_func: TestSharedTagsTwoObjects
    evidence: api_integration
    assertions:
      - shared tagRefs 是两对象 tagRefs 的交集
      - inverted 返回引用 tagRef 的对象集合（含子孙展开）
      - cooccurrence/related-objects 与 object_tag_index 同源

  - name: tag_search_and_validate
    operation: SearchTags
    go_func: TestSearchTags
    evidence: api_integration
    assertions:
      - suggest/search 按 label/alias 匹配
      - validateRefs 区分 valid/invalid 集合

  - name: tag_error_boundary_runtime_response
    operation: ResolveTag
    go_func: TestTagHandlerRuntimeErrorResponse
    evidence: api_integration
    assertions:
      - 错误响应为 RuntimeErrorResponse 结构（code/userMessage/requestId）
      - code 与 tag/errors.yaml 声明一致，无自造 {"error"} 体
