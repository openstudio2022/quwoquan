entity: TagNodeView
layer: app_side

description: |
  端侧独立测试场景。tag mock 数据经 alpha fixture bundle（seed manifest 生成）
  注入，production lib 不包含任何 tag mock；测试消费 typed fixture adapter。

dto_scenarios:
  - name: tag_dto_field_parity
    description: 端侧 DTO 与云侧各类 View DTO 逐字段一致（resolve/children/dimension/suggest/validation/search/related/match/cooccurrence/inverted/relatedObject/sharedTag）
    assertions:
      - fromJson 逐字段与 fields.yaml 对齐
      - 未知字段忽略、缺 NOT_NULL 字段抛 FormatException

catalog_scenarios:
  - name: admin_region_hierarchy_from_fixture
    description: 行政区层级（34 省/广东 21 市/北京 16 区）来自 fixture bundle
    assertions:
      - listChildren(chinaAdminRegionRoot) 返回 34 个直辖子节点
      - 广东/北京直辖层完整

  - name: career_interest_catalog_alignment
    description: 职业/兴趣目录与 taxonomy fixture 对齐（career_interest_page 消费）
    assertions:
      - 职业 5 类、兴趣 5 类可解析
      - validateRefs 接受目录内 ref、拒绝未知 ref

facet_scenarios:
  - name: catalog_and_graph_facets_split
    description: TagCatalogQuery（7 方法）与 TagGraphQuery（5 方法）Facet 拆分后行为不变
    assertions:
      - 每个 Facet ≤10 方法（R02）
      - production provider Remote-only，无 AppDataSourceMode 分支
