entity: TagTaxonomyRelease
layer: e2e

description: |
  数据发布管道端到端：taxonomy 目录树 → cmd/import → Stage → Activate →
  tag-service 只读投影可见。执行环境：gamma_local。

execution:
  environment: gamma_local
  ci_strategy: advisory
  trigger: pre-release
  runners:
    api_contract: gamma HTTP client + go run cmd/import

scenarios:
  - name: taxonomy_import_release_roundtrip
    test_type: api_contract
    actors:
      importer: services/tag-service/cmd/import
      service: tag-service TagTaxonomyReleaseCommandFacade
      storage: MongoDB tag_nodes + tag_taxonomy_releases
    steps:
      - 从 control_plane/governance/taxonomy 导入节点树
      - 导入器 Stage 落 release 记录并 Activate
      - /tag/resolve 与 /tag/children 反映激活后的节点
    assertions:
      - 同一 taxonomy 重复导入（同 digest）不产生第二个 release
      - 同一时刻只有一个 active release
