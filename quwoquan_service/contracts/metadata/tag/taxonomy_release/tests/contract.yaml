entity: TagTaxonomyRelease

scenarios:
  - name: release_stage_digest_idempotent
    operation: StageTagTaxonomyRelease
    go_func: TestTaxonomyReleaseStageDigestIdempotent
    evidence: api_integration
    assertions:
      - Stage 落不可变 staged 记录（releaseId/sourceOwner/canonicalDigest/nodeCount）
      - 同 canonicalDigest 重复 Stage 幂等返回首次记录（唯一索引）
      - 同 Idempotency-Key 不同 payload 返回 TAG.USER.release_idempotency_conflict

  - name: release_activate_single_active_cas
    operation: ActivateTagTaxonomyRelease
    go_func: TestTaxonomyReleaseActivateSingleActive
    evidence: api_integration
    assertions:
      - 激活经服务端内部 CAS：旧 active → retired，同一时刻只有一个 active
      - 目标已 active 时 no-op receipt 重放安全（不递增版本）
      - staged 以外状态激活返回 TAG.USER.release_invalid_transition
      - 未知 releaseId 返回 TAG.USER.release_not_found

  - name: import_pipeline_stages_release
    operation: StageTagTaxonomyRelease
    go_func: TestImportCommandStagesAndActivatesRelease
    evidence: api_integration
    assertions:
      - cmd/import 导入完成后自动 Stage→Activate 落真实 releaseId/digest
      - tag_nodes 的 releaseId 与 active release 一致
