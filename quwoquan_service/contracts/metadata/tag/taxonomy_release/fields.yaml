version: 1
aggregate: TagTaxonomyRelease

entities:
  TagTaxonomyRelease:
    description: 数据工程 taxonomy 的不可变发布批次及激活状态
    fields:
      - { name: releaseId, type: string, constraints: [PK], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: sourceOwner, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: canonicalDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: nodeCount, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: status, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: importedAt, type: timestamp, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: activatedAt, type: timestamp, constraints: [NULLABLE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
