entity: TagNodeView
backend: mongodb

collections:
  tag_nodes:
    entity: TagNodeView
    indexes:
      - { name: idx_tag_ref, keys: { tagRef: 1 }, unique: true }
      - { name: idx_tag_group, keys: { group: 1 } }
      - { name: idx_parent_lifecycle_tagref, keys: { parentTagRef: 1, lifecycleStatus: 1, tagRef: 1 }, key_order: [parentTagRef, lifecycleStatus, tagRef] }
  object_tag_index:
    entity: ObjectTagIndex
    indexes:
      - { name: idx_object, keys: { objectId: 1, objectType: 1 }, unique: true }
      - { name: idx_object_tagrefs, keys: { tagRefs: 1 }, sparse: true }
