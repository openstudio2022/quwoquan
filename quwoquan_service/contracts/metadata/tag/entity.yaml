domain: tag
entity: TagNodeView
object_kind: projection

description: |
  TagTaxonomyRelease 激活事件构建的路径制标签节点只读投影。唯一真相源为数据工程
  control_plane/governance/taxonomy
  （四分组 Topic/Audience/Format/Entity，tagRef = 目录路径）。
  tag-service 只读消费离线导入产物，提供 resolve / shared-tags / inverted 查询，
  不接收命令、不产生领域事件；节点数量不进入 TagTaxonomyRelease 聚合一致性边界。

storage_backend: mongodb

cache_layer: none
capabilities:
  - queryable

ddd_layer_mapping:
  domain_model: services/tag-service/internal/domain/tag/model
  ports: services/tag-service/internal/domain/tag/ports
  application: services/tag-service/internal/application
  adapter_rest: services/tag-service/internal/adapters/http
  infrastructure: services/tag-service/internal/infrastructure/persistence
