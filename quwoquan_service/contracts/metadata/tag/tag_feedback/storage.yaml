version: 1
entity: TagFeedback
backend: mongodb

collections:
  tag_feedback:
    entity: TagFeedback
    role: authoritative
    indexes:
      - { name: idx_tag_feedback_actor_idempotency, keys: { actorId: 1, idempotencyKey: 1 }, unique: true }
      - { name: idx_tag_feedback_tag_recorded, keys: { tagRef: 1, recordedAt: -1 } }
