version: 1
entity: TagNode

service:
  name: tag-service
  domain: tag

# 唯一标签真相源为数据工程 publish/tags；tag-service 只读消费导入产物。
# 交集核心新增：ResolveTag / SharedTags / InvertedObjects（V0.5 首发实现）。
# 创作打标与搜索 API（dimensions/suggest/validate/search/related/search-by-tags/
#   feedback/cooccurrence/related-objects）保留契约，端统一走 codegen path（消除硬编码）。
# tagRef 路径制（含 /），统一走 query 参数，不放 path param。
api_routes:
  # ── 交集核心（V0.5 首发只读实现） ──
  - method: GET
    path: /v1/tag/resolve
    operation: ResolveTag
    description: 解析单个路径制 tagRef → 标签定义（label / 别名 / 祖先）
    query_params: [tagRef]
    response_entity: TagResolveView
    response_fields: [tagRef, group, label, labelEn, aliases, ancestors]

  - method: GET
    path: /v1/tag/children
    operation: ListTagChildren
    description: 列出某个 tagRef 的 active 直接子节点；行政区选择使用该公共标签层级接口，不走 user-service 本地 catalog
    query_params: [parentTagRef, limit]
    response_entity: TagChildView
    response_fields: [tagRef, label, displayLabel, labelEn, parentTagRef, depth, hasChildren, releaseId, lifecycleStatus]

  - method: GET
    path: /v1/tag/shared-tags
    operation: SharedTags
    description: 计算两个对象的共享 tagRef（交集锚点 + 强度 + 来源）
    query_params: [objectAId, objectAType, objectBId, objectBType, limit]
    response_entity: SharedTagView
    response_fields: [tagRef, label, strength, source]

  - method: GET
    path: /v1/tag/inverted
    operation: InvertedObjects
    description: 反向索引——引用某 tagRef 的对象集合；includeDescendants=true 时按路径制子孙标签展开聚合（省/市级 geo 标签反查含全部区县级叶子对象，查询侧展开、存储不变）
    query_params: [tagRef, objectType, limit, includeDescendants]
    response_entity: InvertedObjectsView
    response_fields: [tagRef, objectCount, objectIds]

  # ── 创作打标（场景2，端统一走 codegen path） ──
  - method: GET
    path: /v1/tag/dimensions
    operation: ListDimensions
    description: 列出全部维度及分组信息（创作标签面板）
    response_entity: TagDimensionView
    response_fields: [group, dimensionId, label, labelEn, maxDepth, pathPolicy]

  - method: GET
    path: /v1/tag/suggest
    operation: SuggestTags
    description: 根据输入文本模糊匹配标签
    query_params: [q, group, limit]
    response_entity: TagSuggestionView
    response_fields: [tagRef, label, labelEn, matchField]

  - method: POST
    path: /v1/tag/validate
    operation: ValidateTagRefs
    description: 批量校验 tagRefs 有效性
    request_entity: TagValidateRequest
    request_fields: [tagRefs]
    response_entity: TagValidationResultView
    response_fields: [valid, invalid]

  # ── 推荐搜索（场景3） ──
  - method: GET
    path: /v1/tag/search
    operation: SearchTags
    description: 标签全文搜索
    query_params: [q, group, limit]
    response_entity: TagSearchResultView
    response_fields: [tagRef, label, score]

  - method: GET
    path: /v1/tag/related
    operation: RelatedTags
    description: 与指定标签共现度最高的相关标签
    query_params: [tagRef, limit]
    response_entity: RelatedTagView
    response_fields: [tagRef, label, cooccurCount]

  - method: POST
    path: /v1/tag/search-by-tags
    operation: SearchByTags
    description: 多标签联合搜索对象
    request_entity: SearchByTagsRequest
    request_fields: [tagRefs, objectType, limit]
    response_entity: TagObjectMatchView
    response_fields: [objectId, objectType, matchedTags, score]

  - method: POST
    path: /v1/tag/feedback
    operation: TagFeedback
    description: 用户对标签推荐的反馈（点击/忽略/修正）
    request_entity: TagFeedbackRequest
    request_fields: [tagRef, action, context]
    response_entity: TagFeedbackResultView
    response_fields: [accepted]

  # ── 关系图谱（场景4） ──
  - method: GET
    path: /v1/tag/graph/cooccurrence
    operation: TagCooccurrence
    description: 查询标签对共现关系
    query_params: [tagRef, minCount, limit]
    response_entity: TagCooccurrenceView
    response_fields: [tagA, tagB, cooccurCount]

  - method: GET
    path: /v1/tag/related-objects
    operation: RelatedObjects
    description: 通过共享标签查找相关对象
    query_params: [objectId, objectType, limit]
    response_entity: RelatedObjectView
    response_fields: [objectId, objectType, sharedTags, sharedCount]

consumers:
  - name: app
    capabilities: [resolve, children, shared_tags, inverted, suggest, validate, search]
  - name: recommendation-engine
    capabilities: [shared_tags, inverted, related_objects]

contract_test:
  mock_strategy:
    app_side:
      mock_target: tag-service API
      data_source: fields.yaml
      scenarios:
        - name: resolve_launch_subset
          route: GET /v1/tag/resolve
          assertions: [status_200, tagref_resolvable]
        - name: shared_tags_campus_travel
          route: GET /v1/tag/shared-tags
          assertions: [status_200, shared_tagrefs_resolvable]
        - name: inverted_objects
          route: GET /v1/tag/inverted
          assertions: [status_200]
        - name: list_children_admin_regions
          route: GET /v1/tag/children
          assertions: [status_200, direct_children_only, active_only]
    service_side:
      description: 使用真实测试数据库，不 mock 存储层；只读首发子集 seed
      real_engines:
        mongodb: testcontainers (mongo:7)
      data_management:
        seed: fixture 工厂导入首发子集 tag_nodes + object_tag_index
        cleanup: "db.tag_nodes.DeleteMany({}); db.object_tag_index.DeleteMany({})"
      scenarios:
        - name: resolve_returns_definition
          route: GET /v1/tag/resolve
          assertions:
            - "db.tag_nodes.FindOne({tagRef:'Topic/旅行'}) → exists"
            - "response.label non-empty"
        - name: shared_tags_two_objects
          route: GET /v1/tag/shared-tags
          assertions:
            - "shared tagRefs ⊆ both objects' tagRefs"
  coverage_requirements:
    - resolve subset tagRefs resolvable
    - children direct hierarchy correctness
    - shared-tags intersection correctness
    - inverted returns objects referencing tagRef
