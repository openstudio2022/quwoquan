aggregate: RecommendationModelRelease

entities:
  RecommendationModelRelease:
    description: 可审计、可回滚的场景模型发布聚合。
    fields:
      - { name: id, type: string, constraints: [PK, NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: scenario, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: modelDigest, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: featureContractVersion, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: status, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: rolloutPercent, type: int, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: createdAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: activatedAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }

  ModelScoreRequest:
    description: 已激活 RecommendationModelRelease 的多场景评分 transport DTO，不是业务对象。
    fields:
      - { name: scenario, type: string, constraints: [NOT_NULL] }
      - { name: userId, type: string, constraints: [NOT_NULL] }
      - { name: sessionId, type: string, constraints: [NOT_NULL] }
      - { name: userFeatures, type: object, constraints: [NULLABLE] }
      - { name: sessionSignals, type: object, constraints: [NULLABLE] }
      - { name: candidates, type: "[]CandidateInput", constraints: [NOT_NULL] }
      - { name: context, type: object, constraints: [NULLABLE] }

  CandidateInput:
    description: |
      评分 Reader 的候选 transport DTO，不登记为业务对象。
      N3-3 特征偏斜收口：publishHour 由服务端从 publishedAt 派生随请求下发
      （训练-在线同源）；bodyLength/aspectRatio/hasCover 因在线召回投影不携带
      已从特征 registry 退役（S1 召回投影补齐后再启用），wire 不传。
    fields:
      - { name: contentId, type: string }
      - { name: contentType, type: string }
      - { name: authorId, type: string }
      - { name: tagRefs, type: "[]string" }
      - { name: entityRefs, type: "[]string" }
      - { name: ageHours, type: float64 }
      - { name: publishHour, type: int }
      - { name: viewCount, type: int64 }
      - { name: likeCount, type: int64 }
      - { name: commentCount, type: int64 }
      - { name: shareCount, type: int64 }
      - { name: recallPath, type: string }
      - { name: qualityScore, type: float64 }
      - { name: contentVertical, type: string }
      - { name: supplySource, type: string }
      - { name: intersectionFactStrength, type: float64 }
      - { name: intersectionFreshness, type: float64 }
      - { name: affinityIntersectionScore, type: float64 }
      - { name: intersectionSourceRefTop, type: string }
      - { name: intersectionConfidenceLabel, type: string }
      - { name: intersectionClass, type: string }

  ModelScoreResponse:
    description: 单次评分 Reader 的 transport 结果；模型命中时必须返回具体发布身份供曝光事实审计。
    fields:
      - { name: scores, type: "[]CandidateScore", constraints: [NOT_NULL] }
      - { name: modelReleaseId, type: string, constraints: [NULLABLE] }

  BatchModelScoreRequest:
    description: 同一调用上下文中的强类型批量评分请求。
    fields:
      - { name: requests, type: "[]ModelScoreRequest", constraints: [NOT_NULL] }

  BatchModelScoreResponse:
    description: 与批量评分请求顺序一一对应的强类型结果。
    fields:
      - { name: results, type: "[]ModelScoreResponse", constraints: [NOT_NULL] }

  CandidateScore:
    description: 单条候选评分 transport 结果。
    fields:
      - { name: contentId, type: string }
      - { name: score, type: float64 }
      - { name: detail, type: object, constraints: [NULLABLE] }
