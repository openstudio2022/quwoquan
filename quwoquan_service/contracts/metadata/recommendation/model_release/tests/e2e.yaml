entity: RecommendationModelRelease
layer: e2e

scenarios:
  - name: model_promotion_to_serving
    steps:
      - CI training pipeline promotes a scenario model via model_registry_cli (promotion gate)
      - rec-model-service hot-reloads the production-flagged release
      - content-service scores feed candidates through ScoreRecommendationCandidates
    assertions:
      - only_one_production_release_per_scenario
      - serving_uses_latest_promoted_release_without_restart
      - rollback_via_registry_cli_restores_previous_release
