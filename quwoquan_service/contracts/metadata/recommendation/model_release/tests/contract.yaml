entity: RecommendationModelRelease

scenarios:
  - name: score_active_release_service_auth
    operation: ScoreRecommendationCandidates
    go_func: test_score_api__score_contract__contract
    evidence: api_integration
    assertions:
      - 仅可信 service token 可调用；缺失/非法返回 401/403
      - 按场景 production 标记的已激活发布评分；无激活发布时结构化失败
      - 候选与评分结果按输入顺序一一对应

  - name: batch_score_order_stable
    operation: BatchScoreRecommendationCandidates
    go_func: test_api__serving_contract__contract
    evidence: api_integration
    assertions:
      - 批内每个请求独立评分，结果与请求顺序一致

  - name: lifecycle_deferred_no_transport
    operation: (deferred) StageRecommendationModelRelease
    go_func: verify_topology_contract_regression
    evidence: local_contract
    assertions:
      - Stage/Activate/Rollback 不存在于 service.yaml/OpenAPI/generated descriptor
      - 模型晋升/回滚经 model_registry_cli promotion gate（registry 契约测试覆盖）
