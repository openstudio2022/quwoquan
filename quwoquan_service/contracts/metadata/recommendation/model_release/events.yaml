version: 1
aggregate: RecommendationModelRelease

events:
  - name: RecommendationModelReleaseStaged
    producer: recommendation-service
    consumers: [recommendation-service, platform-ops]
    channel: event_store
    payload_entity: RecommendationModelRelease
    payload_fields: [id, scenario, modelDigest, featureContractVersion, status, createdAt]
  - name: RecommendationModelReleaseActivated
    producer: recommendation-service
    consumers: [content-service, circle-service, search-service, platform-ops]
    channel: event_store
    payload_entity: RecommendationModelRelease
    payload_fields: [id, scenario, modelDigest, featureContractVersion, status, rolloutPercent, activatedAt]
  - name: RecommendationModelReleaseRolledBack
    producer: recommendation-service
    consumers: [content-service, circle-service, search-service, platform-ops]
    channel: event_store
    payload_entity: RecommendationModelRelease
    payload_fields: [id, scenario, status, rolloutPercent]
