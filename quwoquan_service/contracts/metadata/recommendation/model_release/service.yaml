api_routes:
- actor: account
  application:
    aggregate_owner: RecommendationModelRelease
    mutation_target: RecommendationModelRelease
    invariant_target: RecommendationModelRelease
    facet: RecommendationModelReleaseCommandFacade
    kind: command
    method: stage
  method: POST
  operation: StageRecommendationModelRelease
  path: /internal/v1/recommendation/model-releases
  reliability:
    cancellation: supported
    idempotency: required
    max_attempts: 2
    retry_mode: idempotent
    timeout_ms: 5000
  request_entity: StageRecommendationModelReleaseRequest
  response_entity: RecommendationModelReleaseCommandResult
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: service
    token_transport: bearer
    visibility: internal
- actor: account
  application:
    aggregate_owner: RecommendationModelRelease
    mutation_target: RecommendationModelRelease
    invariant_target: RecommendationModelRelease
    facet: RecommendationModelReleaseCommandFacade
    kind: command
    method: activate
  method: POST
  operation: ActivateRecommendationModelRelease
  path: /internal/v1/recommendation/model-releases/{releaseId}:activate
  reliability:
    cancellation: supported
    idempotency: required
    max_attempts: 2
    retry_mode: idempotent
    timeout_ms: 5000
  request_entity: ActivateRecommendationModelReleaseRequest
  response_entity: RecommendationModelReleaseCommandResult
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: service
    token_transport: bearer
    visibility: internal
- actor: account
  application:
    aggregate_owner: RecommendationModelRelease
    mutation_target: RecommendationModelRelease
    invariant_target: RecommendationModelRelease
    facet: RecommendationModelReleaseCommandFacade
    kind: command
    method: rollback
  method: POST
  operation: RollbackRecommendationModelRelease
  path: /internal/v1/recommendation/model-releases/{releaseId}:rollback
  reliability:
    cancellation: supported
    idempotency: required
    max_attempts: 2
    retry_mode: idempotent
    timeout_ms: 5000
  request_entity: RollbackRecommendationModelReleaseRequest
  response_entity: RecommendationModelReleaseCommandResult
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: service
    token_transport: bearer
    visibility: internal
- actor: none
  application:
    facet: RecommendationScoringQueryFacade
    kind: query
    method: score
    reader: RecommendationModelScoringReader
    slice: ModelScoreResponse
  authorization:
    ownership_policy: active_model_release_for_scenario
    principal: service
    scopes:
    - recommendation.model.score
  method: POST
  operation: ScoreRecommendationCandidates
  path: /internal/v1/recommendation/model-releases:score
  reliability:
    cancellation: supported
    idempotency: none
    max_attempts: 2
    retry_mode: idempotent
    timeout_ms: 800
  request_entity: ModelScoreRequest
  response_entity: ModelScoreResponse
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: service
    token_transport: bearer
    visibility: internal
- actor: none
  application:
    facet: RecommendationScoringQueryFacade
    kind: query
    method: batchScore
    reader: RecommendationModelScoringReader
    slice: BatchModelScoreResponse
  authorization:
    ownership_policy: active_model_release_for_scenario
    principal: service
    scopes:
    - recommendation.model.score
  method: POST
  operation: BatchScoreRecommendationCandidates
  path: /internal/v1/recommendation/model-releases:batch-score
  reliability:
    cancellation: supported
    idempotency: none
    max_attempts: 2
    retry_mode: idempotent
    timeout_ms: 800
  request_entity: BatchModelScoreRequest
  response_entity: BatchModelScoreResponse
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: service
    token_transport: bearer
    visibility: internal
consumers:
- capabilities:
  - score
  - batch_score
  name: content-service
- capabilities:
  - score
  - batch_score
  name: circle-service
- capabilities:
  - score
  - batch_score
  name: search-service
service:
  commercial_defaults:
    block_reason: PostgreSQL Store/outbox、generated transport 和真实推理装配尚未闭环
    gap_id: RECOMMENDATION_MODEL_RELEASE_WIRING
    status: blocked
    target_story: app-cloud-business-object-commercial-closure
  description: RecommendationModelRelease 生命周期命令与按已激活发布评分的 named Reader packet。
  domain: recommendation
  name: recommendation-service
  owner: ml-platform
version: 1
