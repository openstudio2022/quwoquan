aggregate: RecommendationModelRelease
backend: mongodb

# V1 真相源是 rec-model-service 管理的 rec_model_registry（离线 CLI + CI promotion gate 写入，
# 推理服务按 production 标记热加载；投影契约见 projections/model_registry.yaml）。
# 生命周期命令 deferred，故不声明 PostgreSQL 聚合表/回执/outbox；恢复公开命令时再补
# authoritative PG packet 声明。
collections:
  rec_model_registry:
    entity: RecommendationModelRelease
    role: authoritative
    description: 场景模型发布登记与 production 激活标记；写入方为 model_registry_cli 与
      CI 训练管线，读取方为 rec-model-service 推理热加载。
    indexes:
      - { name: uq_model_registry_scenario_digest, keys: { scenario: 1, modelDigest: 1 }, unique: true }
      - { name: idx_model_registry_scenario_production, keys: { scenario: 1, production: 1, updatedAt: -1 } }
