# 学习事件流：行为上报经 FeedbackRecorder → MongoSink 写入，供样本拼接与模型训练消费
read_model: LearningEvents

description: |
  推荐学习事件集合。由 content-service（及可选其他业务服务）的 FeedbackRecorder 写入，
  SampleJoiner 读取并拼接为 rec_training_samples。含曝光、点击、停留、点赞、负反馈等。

storage_backend: mongodb
collection: rec_learning_events

producers:
  - content-service

consumers:
  - rec-model-service

fields:
  - { name: _id, type: string, description: 确定性 eventId，承担曝光/反馈事实 dedupe }
  - { name: eventId, type: string }
  - { name: userId, type: string }
  - { name: personaId, type: string }
  - { name: scenario, type: string, description: 场景如 content_feed / circle_discovery }
  - { name: eventType, type: string, description: rec_impression / rec_engagement }
  - { name: targetId, type: string, description: 内容/圈子/用户 ID 等 }
  - { name: labels, type: object, description: sessionId / contentType / recallPath / action 等稳定标签 }
  - { name: context, type: object, description: 曝光含在线 userFeatureSnapshot / itemFeatureSnapshot / featureSnapshotAt；反馈含行为上下文 }
  - { name: occurredAt, type: timestamp }
  - { name: createdAt, type: timestamp }

indexes:
  - { name: idx_rec_learning_user_type, keys: { userId: 1, eventType: 1, occurredAt: -1 } }
  - { name: idx_rec_learning_scenario_time, keys: { scenario: 1, occurredAt: -1 } }
  - { name: ttl_rec_learning_events, keys: { createdAt: 1 }, ttl_days: 30 }
