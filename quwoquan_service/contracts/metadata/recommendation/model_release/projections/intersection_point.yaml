read_model: IntersectionPoint

description: |
  交集点 / 证据组：IntersectionReason 的可见证据项真相源。事实交集点来自可枚举关系；
  推荐交集点来自算法分桶后的可解释推荐点，必须标注 recommended，不能伪装事实。

  维度与证据组类型为开放字符串（dimension / pointClass / sourceRef），端按字符串解析，
  未来新增交集 kind 不需要改契约，端侧对未知 kind 优雅降级展示 displayText/label + count，
  不得写死闭集枚举。sourceRef 是 IntersectionPoint 级的「交集 kind 一等引用」（§23：point 投影的 kind 真相源即
  sourceRef，端查 IntersectionKindMetadata.of(point.sourceRef) 得 iconKey/objectKind/actionHints/tone/vertical，
  禁止端再按点推导 kind）。sourceRef 取值必须先在交集词典 kind 唯一注册表登记
  （specs/product/intersection-definition-and-application.md §5.4 与
  recommendation/rec_model/intersection_kind_registry.yaml，标准名如
  sharedFollowees / sharedCircle / coCommented / coVisitedEntity / followeeInObject，
  无兼容别名），登记后方可在云侧产出与 fixtures 铺设。

  证据组语义：
    count            该证据组聚合到的事实条数（如「共同关注的人 4」中的 4）；端侧数字真相源。
    displayText      用户语言短句名词（≤6 汉字，如「共同关注的人」），云侧下发，端不本地拼装。
    sampleText       实例化样本（如某用户名 / 某地点名 / 某篇内容标题），让交集"可感知"。
    sampleAvatarUrls 头像簇（≤3），真实的人/对象信号，端侧视觉锚。

consumers:
  - app
  - recommendation

client_projection:
  dart_class: IntersectionPoint
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_point.g.dart
  dart_imports:
    - intersection_visual.g.dart
  fields:
    - name: pointId
      dart_type: String
      nullable: false
      source: pointId
      default: "''"
    - name: pointClass
      dart_type: String
      nullable: false
      source: pointClass
      default: "'fact'"
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      default: "''"
    - name: displayText
      dart_type: String
      nullable: false
      source: displayText
      default: "''"
    - name: sourceRef
      dart_type: String
      nullable: false
      source: sourceRef
      default: "''"
    - name: visibility
      dart_type: String
      nullable: false
      source: visibility
      default: "'public'"
    - name: count
      dart_type: int
      nullable: false
      source: count
      default: "0"
    - name: sampleText
      dart_type: String
      nullable: false
      source: sampleText
      default: "''"
    - name: sampleAvatarUrls
      dart_type: List<String>
      nullable: false
      source: sampleAvatarUrls
    # 统一交互子契约（§20.7，只附加）：sampleVisuals 升级裸 sampleAvatarUrls，
    # 携带 objectKind/assetKind/displayName/target，禁用户头像冒充非用户对象；旧字段保留过渡。
    - name: sampleVisuals
      dart_type: List<IntersectionVisual>
      nullable: false
      source: sampleVisuals
      list_element_dart_class: IntersectionVisual
