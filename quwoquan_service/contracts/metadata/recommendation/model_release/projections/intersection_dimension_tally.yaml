read_model: IntersectionDimensionTally
description: |
  「我的交集」单个维度的计数与未读统计（B1 契约）。
  dimension 与 IntersectionReason.dimension 闭集对齐；count 为该维度可见事实交集总数；
  newCount 为自上次查看（已读水位）以来的新增数，端侧据此显示红点。
  label 为后端提供的用户语言维度短名（如"身份""地点""内容""兴趣""关系"），端不本地拼装。
  briefText 为云侧实例化的一句话动态简报（如"4 位校友正在讨论 AI 产品"），
  我的主页聚合卡按 briefText 渲染动态简报行；缺省时端回落 label + newCount，不本地编造事实。
  subtitleText 为该动态简报的证据摘要（如"张晓明、王晨、阿远、陈璟"），端只读直出。
  dimension 为开放字符串，端对未知维度优雅降级（briefText 缺省走 label）。

consumers:
  - app

client_projection:
  dart_class: IntersectionDimensionTally
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_dimension_tally.g.dart
  dart_imports:
    - intersection_text_span.g.dart
    - intersection_visual.g.dart
  fields:
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      default: "''"
    - name: count
      dart_type: int
      nullable: false
      source: count
      default: "0"
    - name: newCount
      dart_type: int
      nullable: false
      source: newCount
      default: "0"
    - name: briefText
      dart_type: String
      nullable: false
      source: briefText
      default: "''"
    - name: subtitleText
      dart_type: String
      nullable: false
      source: subtitleText
      default: "''"
    # 统一交互子契约（§20.7，只附加）：
    #   briefSpans 是 briefText 的结构化富文本切分，join(spans.text)==briefText（契约不变量）；
    #   名字 span 进对应对象主页，数字 span 进 dimension(+sourceRef) 下钻列表。
    #   sampleVisuals 为该维度证据样本视觉簇；sourceRef 为数字下钻的证据组 kind（注册表标准名）；
    #   countObjectKind 为被计数对象类型（数字下钻列表对象，注册表 countObjectKind）。
    - name: briefSpans
      dart_type: List<IntersectionTextSpan>
      nullable: false
      source: briefSpans
      list_element_dart_class: IntersectionTextSpan
    - name: sampleVisuals
      dart_type: List<IntersectionVisual>
      nullable: false
      source: sampleVisuals
      list_element_dart_class: IntersectionVisual
    - name: sourceRef
      dart_type: String
      nullable: false
      source: sourceRef
      default: "''"
    - name: countObjectKind
      dart_type: String
      nullable: false
      source: countObjectKind
      default: "''"
    # 架构基线 v2（§21.3 lifecycle 分桶 + §21.5.2 iconKey，草案/未冻结）：
    #   strengthenedCount/reactivatedCount 为该维度内「增强 / 重新活跃」态计数（弱标分桶，不进 briefText）；
    #   iconKey 维度类型图标语义键（缺省回退 dimension 推导）。
    - name: strengthenedCount
      dart_type: int
      nullable: false
      source: strengthenedCount
      default: "0"
    - name: reactivatedCount
      dart_type: int
      nullable: false
      source: reactivatedCount
      default: "0"
    - name: iconKey
      dart_type: String
      nullable: false
      source: iconKey
      default: "''"
