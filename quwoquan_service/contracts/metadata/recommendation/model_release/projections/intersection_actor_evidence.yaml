version: 1
read_model: IntersectionActorEvidence
description: |
  交集人数句背后的逐人证据项。用于解释首页内容卡 / spotlight / 对象页交集句里
  「林清越等 8 人」中的每一个人分别是谁、来自哪里、在当前对象上做过什么。

  端侧只消费本投影展示下钻列表，禁止从 primaryText 反解析人数、关系来源或互动动作。
  当 IntersectionReason 的人数 span 可点击进入完整列表时：
    - actorEvidenceCompleteness 必须为 complete；
    - actorEvidenceTotalCount 必须等于该人数 N；
    - actorEvidence.length 必须覆盖可见且可点击的 N 个 actor；
    - 每个 actor 必须具备 relationLabel 与 actionSummaryText，分别说明「来自哪里」和「TA 做了什么」。
  若云侧只能提供样本或隐私过滤后的不完整列表，端不得把人数 N 渲染成可打开的完整列表入口。

consumers:
  - app
  - recommendation

client_projection:
  dart_class: IntersectionActorEvidence
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_actor_evidence.g.dart
  dart_imports:
    - intersection_target.g.dart
  fields:
    - name: actorId
      dart_type: String
      nullable: false
      source: actorId
      aliases: [actorId]
      default: "''"
    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      aliases: [displayName]
      default: "''"
    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      aliases: [avatarUrl]
      default: "''"
    - name: relationLabel
      dart_type: String
      nullable: false
      source: relationLabel
      aliases: [relationLabel]
      default: "''"
    - name: relationSourceRef
      dart_type: String
      nullable: false
      source: relationSourceRef
      aliases: [relationSourceRef]
      default: "''"
    - name: relationObjectId
      dart_type: String
      nullable: false
      source: relationObjectId
      aliases: [relationObjectId]
      default: "''"
    - name: relationObjectName
      dart_type: String
      nullable: false
      source: relationObjectName
      aliases: [relationObjectName]
      default: "''"
    - name: sourcePointId
      dart_type: String
      nullable: false
      source: sourcePointId
      aliases: [sourcePointId]
      default: "''"
    - name: sourceRef
      dart_type: String
      nullable: false
      source: sourceRef
      aliases: [sourceRef, kind, intersectionKind]
      default: "''"
    - name: actionSummaryText
      dart_type: String
      nullable: false
      source: actionSummaryText
      aliases: [actionSummaryText]
      default: "''"
    - name: likeCount
      dart_type: int
      nullable: false
      source: likeCount
      aliases: [likeCount]
      default: "0"
    - name: commentCount
      dart_type: int
      nullable: false
      source: commentCount
      aliases: [commentCount]
      default: "0"
    - name: shareCount
      dart_type: int
      nullable: false
      source: shareCount
      aliases: [shareCount]
      default: "0"
    - name: privacyState
      dart_type: String
      nullable: false
      source: privacyState
      aliases: [privacyState]
      default: "'visible'"
    - name: target
      dart_type: IntersectionTarget
      nullable: true
      source: target
      aliases: [target]
      map_from_string_key_class: IntersectionTarget
    - name: evidenceRank
      dart_type: int
      nullable: false
      source: evidenceRank
      aliases: [evidenceRank]
      default: "0"
    - name: snapshotVersion
      dart_type: String
      nullable: false
      source: snapshotVersion
      aliases: [snapshotVersion, pointSummarySnapshotId]
      default: "''"
    - name: sortKey
      dart_type: int
      nullable: false
      source: sortKey
      aliases: [sortKey]
      default: "0"
