version: 1
read_model: IntersectionTextSpan
description: |
  交集结论句的可交互片段（统一交互子契约 · A–E 横切复用值对象，Phase 0 §20.7 冻结）。
  一句话 = List<IntersectionTextSpan>，是 primaryText / briefText 的「结构化富文本切分」，
  不是第二文案通道（不违反 G2）：契约不变量 join(spans.text) == primaryText / briefText，
  端契约测试强制断言。云侧同源产出，端只读渲染。

  片段角色：
    role=object 承载名字（点击进对象主页），可带 visual 句内 inline 头像（§21.5.1 槽②）；
    role=count  承载数字（点击进维度 / sourceRef 下钻列表）；
  role=plain  普通文本（不可点击）。`displayBinding=host_plain` 时的当前宿主名也必须使用 plain，
    不得用 object span 表示 self-target。
  target 缺省（null）表示该片段不可点击；visual 缺省（null）表示无句内视觉，
  且 visual 不计入 text，不破坏 join(spans.text)==primaryText/briefText 不变量。
  端侧不得因 span target 缺省而回退到 reason.actionTargetId 或整行点击；可见交集句必须先通过
  `IntersectionReason.displayBinding` 校验。缺 primarySpans 或 join 不成立时 fail-closed 隐藏。

  闭集枚举（端按字符串解析，未知 role 当作 plain）：
    role: plain | object | count

consumers:
  - app

client_projection:
  dart_class: IntersectionTextSpan
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_text_span.g.dart
  dart_imports:
    - intersection_target.g.dart
    - intersection_visual.g.dart
  fields:
    - name: text
      dart_type: String
      nullable: false
      source: text
      aliases: [text]
      default: "''"
    - name: role
      dart_type: String
      nullable: false
      source: role
      aliases: [role]
      default: "'plain'"
    - name: target
      dart_type: IntersectionTarget
      nullable: true
      source: target
      aliases: [target]
      map_from_string_key_class: IntersectionTarget
    # 架构基线 v2（§21.5.1 槽②，草案/未冻结）：visual 为该片段句内 inline 视觉
    #   （role=object 人名 span 前置真实头像簇）；缺省（null）表示该片段无 inline 视觉，
    #   不计入 text、不破坏 join(spans.text)==text 不变量。
    - name: visual
      dart_type: IntersectionVisual
      nullable: true
      source: visual
      aliases: [visual]
      map_from_string_key_class: IntersectionVisual
