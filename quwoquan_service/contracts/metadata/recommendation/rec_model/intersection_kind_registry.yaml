version: 1
registry: IntersectionKindRegistry
description: |
  交集 kind 机器可读唯一注册表（Phase 0 漂移收口 §20d；架构基线 v2 §21）。

  这是全仓交集 kind（IntersectionPoint.sourceRef / 证据组 kind）的唯一真相源，
  取代此前「specs markdown 表 + Go switch」双源。规则：

  - 只有标准名，零兼容别名；契约 / Go / Dart / fixture / mock / 测试一次性迁移到标准名。
  - 任何 kind 必须先在本表登记，才能在云侧产出或在 fixtures 铺设。
  - 未登记 kind 在云侧排序落兜底 rank（evidenceRank=500，不丢弃，便于灰度发现漂移），
    但禁止新增未登记 kind 的产出。
  - 与人类可读说明对齐：specs/product/intersection-definition-and-application.md §5.4 / §7 / §20 / §21。
  - 与策略对齐：recommendation/rec_model/policy.yaml `intersection` 块（factWeight/affinityWeight/
    maxAffinityPerSurface/cooldownDays/freshnessTtlDaysByDimension/graphWeights/lifecycleWeights/propagation）。

  字段语义：
    kind             标准 sourceRef（唯一 id）。
    entry            §7 词典条目编号。
    level            sharedFact 共同型 / bridgeFact 桥接型 / impactFact 影响型 / affinity 概率。
    intersectionClass fact | affinity（affinity 必须标注「推荐」，不得伪装事实）。
    dimensions       五维闭集子集：identity | location | content | interest | relationship。
    objectKind       主对象品牌角标闭集：person | circle | school | place | enterprise。
    countObjectKind  被计数对象类型（数字下钻列表对象）：person | circle | content | place | entity | tag。
    valueTier        产品价值层级 T1(最高) > T2 > T3 > T4，用于选择得分 valueWeight。
    computability    可计算性 R1(最易/最可靠) → R4(暂不可算/概率)，用于实现排期与门槛。
    confidenceThreshold affinity 入选最低置信；fact 恒为 0（达数量门槛即可产出）。
    privacyScope     public | contactVisible | mutualVisible（commonContact 必须先过可见性）。
    dedupeKey        去重主键模板（同 viewer 同窗口内同主键只保留一条最强证据）。
    timeWindowDays   保鲜窗口天数（与 policy.freshnessTtlDaysByDimension 对齐）。
    evidenceRank     云侧 evidenceKindRank 排序键（值越小越靠前；与 intersection_service.go 对齐）。
    sampleVisualsRequired 是否要求结构化 sampleVisuals（R1/R2 人级 kind 必填，禁头像冒充非人对象）。
    iconKey          端侧类型图标语义键（§21.5.2 闭集，IntersectionIconResolver 消费，禁端硬编码 switch）：
                     place | placeHere | circle | people | contact | followHere | viewing |
                     alumni | work | discussion | share | like | interest | attention。
    propagationRole  传播图角色（§21.4）：none(共同型，自身不传播) | bridge(桥接型) | source(影响源)。
    lifecycleApplicable 该交集是否适用 Lifecycle 状态机弱标（§21.3）：
                     静态身份(同校/同司/校友在此)为 false，动态连接/行为/关注为 true。
    vertical         §23.4 垂类正交标注（缺省 general）；闭集见顶层 `verticals`。垂类扩展只改本字段 +
                     必要的 objectKind，禁止新增 travel.* 独立 kind（三元组 kind+vertical+objectKind 正交）。
    moment           §24 v3 意图时态（缺省 current）：retrospective 回溯 / current 当下 / prospective 前瞻；
                     与 lifecycleState 正交（lifecycleState 表边强弱变化，moment 表交集指向过去/当下/未来）。
    status           active | deferred（deferred = 已登记但当前无数据源，不得产出）。

  顶层闭集（§23.3 去桥接：端枚举 / 文案表键 / verify 校验唯一真相源，codegen 下发，禁端硬编码第二份）：
    dimensions       五维闭集：identity | location | content | interest | relationship。
    lifecycleStates  Lifecycle 状态机闭集（§21.3 五态 + §22.3 archived/expired 历史/不展示两态）。
    verticals        垂类闭集：general（缺省）| travel_photography | campus（结构预留，本轮不铺数据）。
    moments          §24 意图时态闭集：retrospective | current | prospective（每 kind moment ∈ 本集，缺省 current）。
    gateKeys         §24.6 安全门闭集（M0.1）：login | realName | minorMode | blocked | greetPreference |
                     mutualConsent | fuzzyLocation | rateLimit；actionKeyMeta.requiredGates ⊆ 本集。
    feedbackKinds    §24.4 负反馈闭集（M0.4）：notInterested | dismiss | rejectGreeting | leaveCircle（驱动降权/冷却）。
    actionDispatch   §24 行动路由类别闭集（M0.7）：assistant | navigate | message | companion | connect | commerce；
                     端交互 handler 路由维度（区别于 tier 权限成本维度），端据此分发落点，
                     禁止端手写「哪些 actionKey 属助手/约伴」的第二份枚举。
    actionKeyMeta    §24 行动阶梯元数据（M0.1/M0.3/M0.7）：actionKey → {tier(light|heavy) / requiredGates(⊆gateKeys) /
                     targetAvailability(available|deferred) / dispatch(∈actionDispatch)}；键集 == actionHintLegend。
    objectKinds      统一对象类型闭集（§23.3 B：objectKind 与 countObjectKind 合并为同一闭集 + 可计数子集标注）。
                     每项：kind / roles(object 主对象品牌角标 / count 被计数对象) / routeId(端路由逻辑名，空=不可导航)
                     / assetKind(对象视觉资产类型，roles 含 object 时必填)。kind 的 objectKind 取 roles 含 object 的子集，
                     countObjectKind 取 roles 含 count 的子集；端 UnifiedObjectKind 枚举 + objectKind→routeId 由本闭集 codegen。

  Graph 加权元数据（§21.2，edgeWeight = relationStrength × interactionFrequency × recencyDecay）：
    本期数值真算后置；派生口径单一真相源、零逐条占位（避免 27×未实现技术债）：
    - relationStrengthBase    由 valueTier 派生（= valueTierWeights[tier]）。
    - interactionFrequencyKey 由 computability/level 指向行为源（R1=关系边 / R2=行为边 / R3=身份·标签）。
    - recencyHalfLifeDays     由 timeWindowDays 派生（默认 = timeWindowDays），供 recencyDecay。
    数值化在云侧算法会话落地（policy.intersection.graphWeights 配置位）；本表只登记口径。

valueTierWeights:
  # 选择得分 score = valueWeight(tier) × freshness(decay) × confidence × diversityPenalty × cooldownGate
  T1: 1.0
  T2: 0.75
  T3: 0.5
  T4: 0.3

# ─── 顶层闭集（§23.3 去桥接：单一真相源 + codegen 下发 + verify 校验） ───
dimensions:
  # §21 五维闭集（稳定用户语言来源）。每 kind 的 dimensions 必须是本闭集子集。
  - identity
  - location
  - content
  - interest
  - relationship

lifecycleStates:
  # §21.3 五态状态机 + §22.3 历史/不展示两态（archived/expired，端默认列表过滤）。
  # active/resurfaced/cooling 是 stable/reactivated/weakened 的展示同义，不是独立状态机态，故不入闭集。
  - new
  - strengthened
  - stable
  - weakened
  - reactivated
  - archived
  - expired

verticals:
  # §23.4 垂类正交闭集。每 kind 的 vertical 缺省 general；旅行摄影先行，校园仅结构预留。
  - general
  - travel_photography
  - campus

moments:
  # §24 v3 意图时态闭集（M0.2）。moment 表达交集的「时态意图」，与 lifecycleState（边生命周期强弱）正交：
  #   lifecycleState 回答「这条边现在多强/是否新」；moment 回答「这条交集指向过去/当下/未来」。
  #   端据 moment 决定语气与可行动性（回溯=已发生可回看，当下=此刻可连接，前瞻=想去可约伴）。
  #   每个 kind 必须标注 moment ∈ 本闭集（verify 校验）。
  - retrospective   # 回溯：过去已发生的共同（去过同地 / 共同评论过 / 共同点赞过）
  - current         # 当下：此刻持续的状态（同校在读 / 正在看 / 共同关注 / 此刻同地）
  - prospective     # 前瞻：指向未来的意图（共同想去 / 计划同期出行 / 想认识同趣）

gateKeys:
  # §24.6 安全门闭集（M0.1）。重行动（约伴 / 私信 / 心动打招呼等）下发前必须声明 requiredGates ⊆ 本闭集；
  #   端按 gate 是否满足决定「可执行 / 优雅降级为查看证据或进对象」，未满足绝不静默失败或死循环（守 15-auth-entry-no-loop）。
  #   拦截语义与用户提示/恢复动作走 errors.yaml（MODULE.KIND.REASON + RuntimeFailure，见 10-runtime-error-cutover / 07-error-permission-semantics）。
  - login           # 需登录（游客触发 → 登录门，成功后续接原行动）
  - realName        # 需实名（重社交行动如约伴要求实名，未实名 → 引导实名）
  - minorMode       # 青少年模式受限（未成年人不开放约伴 / 私信等重行动）
  - blocked         # 拉黑关系（任一方拉黑 → 不下发重行动，静默隐藏入口）
  - greetPreference # 对方打招呼偏好（对方关闭陌生人打招呼 → 降级）
  - mutualConsent   # 需双向同意（约伴 / 私信需对方接受后建立）
  - fuzzyLocation   # 位置模糊化门（涉位置行动只暴露 geohash 降精度，禁精确实时位置）
  - rateLimit       # 频控配额（防骚扰，超配额 → 冷却提示）
  # gate → errors.yaml 拦截码映射（M0.1 契约闭环，C0/C 承接行动被拦时按此映射优雅降级）：
  #   login         → 端侧登录门（15-auth-entry-no-loop，非服务错误码，续接原行动）
  #   realName      → USER.GREETING.sender_realname_required（新增）
  #   minorMode     → USER.GREETING.minor_restricted（新增）
  #   blocked       → USER.GREETING.target_blocked_sender / CHAT.USER.blocked
  #   greetPreference → USER.GREETING.target_blocked_sender（对方 allowStrangerGreeting=false）
  #   mutualConsent → CHAT.USER.not_mutual（未互关 → 先打招呼 CHAT.USER.greeting_required）
  #   fuzzyLocation → 非拦截门（geohash 降精度，无错误码；违规精确位置由 location 域校验）
  #   rateLimit     → USER.GREETING.rate_limited / CHAT.USER.rate_limited

feedbackKinds:
  # §24.4 负反馈一等闭集（M0.4）。用户对交集/推荐的显式负反馈，驱动降权与冷却（消费在 F 推荐差异化）；
  #   本表是负反馈动作的唯一真相源，端上报与云侧降权/冷却读同一集合，禁止端各写一份。
  - notInterested   # 不感兴趣（对交集条目降权）
  - dismiss         # 忽略/关闭（进入冷却窗口，短期不再出现）
  - rejectGreeting  # 拒绝打招呼（对该来源人降权 + 冷却）
  - leaveCircle     # 退出圈子（对该圈子相关交集降权）

actionDispatch:
  # §24 行动路由类别闭集（M0.7）。表达「端用哪个交互 handler 消费这个 actionKey」，是**路由维度**，
  #   与 actionKeyMeta.tier（light|heavy 权限成本维度）正交：tier=heavy 的 message_person 与 start_companion
  #   路由到完全不同的落点（私信会话 vs 同行约伴），不能用 tier 表达分发。
  #   端 IntersectionTargetNavigator / 徽标 / 助手分发一律读 actionKeyMeta.dispatch，禁止端手写
  #   「哪些 actionKey 属助手 / 约伴 / 重社交」的第二份枚举（守 R06 元数据驱动 + R24 单一真相源）。
  - assistant   # 打开小艺解释 / 追问 / 续写（ask_assistant / create_followup），非导航到对象页
  - navigate    # 经统一导航到 target（对象 / 关系 / 内容 / 圈子 / 路线下钻 + 关注/打招呼轻动作），即时可做
  - message     # 私信会话落点（message_person），需 mutualConsent
  - companion   # 同行 / 线下约伴专属落点（约伴 / 行程 / 线下局 / 实时附近），唯一驱动「有人同行」徽标
  - connect     # 线上同频房间 / 心动破冰专属落点（话题房 / 语音房 / 心动表达）
  - commerce    # 官方导购 / 预订 / CPS 转化落点；真实渠道未接入时必须 deferred 或 featureDisabled

objectKinds:
  # §23.3 B 统一对象类型闭集（合并 objectKind + countObjectKind，可计数子集靠 roles 标注，不再两套集合）。
  # roles: object = 主对象品牌角标（端 UnifiedObjectKind 枚举 + 可导航）；count = 被计数对象（数字下钻列表对象类型）。
  # routeId 为端路由逻辑名（与 ui_config / app_routes 对齐，空=不可导航纯文本）；assetKind 为对象视觉资产类型。
  - kind: person
    roles: [object, count]
    routeId: userProfile
    assetKind: avatar
  - kind: circle
    roles: [object, count]
    routeId: circleDetail
    assetKind: circleAvatar
  - kind: school
    roles: [object]
    routeId: homepageDetail
    assetKind: emblem
  - kind: place
    roles: [object, count]
    routeId: homepageDetail
    assetKind: coverImage
  - kind: enterprise
    roles: [object]
    routeId: homepageDetail
    assetKind: logo
  # §22.2 旅行摄影 objectKind 扩展（route/photo_spot/gear）；结构就位，open_route 落点走实体主页。
  - kind: route
    roles: [object]
    routeId: homepageDetail
    assetKind: coverImage
  - kind: photo_spot
    roles: [object]
    routeId: homepageDetail
    assetKind: coverImage
  - kind: gear
    roles: [object]
    routeId: homepageDetail
    assetKind: coverImage
  # 内容可作为交集主句宾语（文章/图片/视频），routeId 走 workBrowser；
  # tag 仍仅作被计数对象，不能作为可见主句宾语。
  - kind: content
    roles: [object, count]
    routeId: workBrowser
    assetKind: coverImage
  - kind: entity
    roles: [count]
    routeId: homepageDetail
  - kind: tag
    roles: [count]
    routeId: ""
  # §交集行动深化：未来态/线下对象（trip 出行意图、meetup 开放线下局），可作主对象品牌角标并下钻。
  - kind: trip
    roles: [object, count]
    routeId: tripDetail
    assetKind: coverImage
  - kind: meetup
    roles: [object, count]
    routeId: meetupDetail
    assetKind: coverImage

computabilityLegend:
  R1: 关系投影与成员集合直接求交（persona_follow_projection / circle_memberships），最易、最可靠、可请求期算。
  R2: 行为边集合求交（rm_behavior_events 行为边真相源），需扫描+求交，请求期或预投影。
  R3: 身份/通讯录/标签维度（需 profile / contact 映射 / 实体标签），成本与隐私约束更高。
  R4: 当前无稳定数据源或为概率推断（coCreatedContent / coWishlistedEntity / affinity），暂不产出 fact。

iconKeyLegend:
  # §21.5.2 交集 iconKey 语义闭集（端 IntersectionIconResolver 真相源）。
  # 闭集去单调：同维度内按"自身共同 / 第三方桥接 / 联系人 / 关注的人正在看"细分到可辨识 glyph，
  # 但 tone 仍按维度族收敛（relationship→sage、location→tea、identity/work→mist、content→clay、interest→stone）。
  place: 共同地点（coVisitedEntity / coWishlistedEntity）
  placeHere: 关注的人来过此地（followeeVisited，桥接）
  circle: 共同圈子 / 同圈成员（sharedCircle / coMemberCircle）
  people: 共同关注的人 / 共同被关注（sharedFollowees / commonFollower）
  contact: 共同联系人（commonContact，contactVisible 隐私门）
  followHere: 关注的人在此对象内（followeeInObject，桥接）
  viewing: 关注的人正在看此内容（followeeViewing，桥接）
  alumni: 校友 / 同校 / 同专业（sameSchool / sameMajor / sameCohort / alumni / alumniHere）
  work: 同公司 / 同团队 / 同行业 / 同事在此 / 共创（sameCompany / sameTeam / sameIndustry / colleagueHere / coCreatedContent）
  discussion: 共同讨论 / 都评论过 / 关注的人讨论（sharedDiscussion / coCommented / followeeDiscussedThis）
  share: 共同传播（coSharedContent）
  like: 共同点赞（coLiked，T4 最低权重，§21.9 恢复）
  interest: 共同兴趣标签（sharedTagSample）
  attention: 共同关注对象 / 品牌（sharedEntityAttention）

visualToneByIconKey:
  # §21.5.2 低饱和语义色调。端侧可按 iconKey 查 tone，不得在页面按 kind 硬编码颜色。
  place: tea
  placeHere: tea
  circle: sage
  people: sage
  contact: sage
  followHere: sage
  viewing: sage
  alumni: mist
  work: mist
  discussion: clay
  share: clay
  like: clay
  interest: stone
  attention: stone

iconKeyByDimension:
  # §21.5.2 dimension → iconKey 末级回退（未登记 kind / 旧数据 / affinity 概率类降级用）。
  # 端 IntersectionIconResolver 与 inbox 归一层共用此唯一回退表，不再各写一份 dimension switch。
  # 每个键必须 ∈ dimensions 闭集，每个值必须 ∈ iconKeyLegend 闭集（verify 脚本校验）。
  identity: alumni
  location: place
  content: discussion
  interest: interest
  relationship: people

actionHintLegend:
  # §21.5.3 行动建议闭集。服务端按 kind 查 actionKey，下发 IntersectionActionHint；
  # 端侧只渲染，不按 kind 猜测下一步。
  follow_person: 关注代表人或对象人
  greet_person: 打招呼
  message_person: 私信
  view_shared_people: 查看共同关注 / 共同联系人来源
  join_circle: 加入圈子
  open_discussion: 进入讨论 / 跟帖
  open_content: 回到内容
  open_object: 进入实体 / 地点 / 学校 / 公司主页
  follow_object: 关注对象
  open_route: 查看路线 / 地点内容
  create_followup: 写续篇 / 发布跟进
  ask_assistant: 让助手解释这条交集
  # §交集行动深化：同趣 / 同行 / 线下 / 实时 / 意图 行动阶梯（端只读渲染，不按 kind 猜测）。
  join_topic_room: 进入同趣话题群
  start_companion: 发起结伴同行
  join_trip: 加入同行行程
  join_meetup: 报名线下局
  meet_nearby: 附近碰头（默认模糊位置 + 双向同意）
  start_voice_room: 进入同趣语音房
  express_interest: 心动打招呼（带意图的打招呼变体，复用打招呼请求，不新增关系等级）
  # §交集商用闭环：commerce 契约位。真实渠道、返佣披露和商业化条款未完成前保持 deferred。
  view_official_deals: 查看官方优惠 / 导购入口
  book_ticket: 预订门票 / 活动票
  book_hotel: 预订住宿

actionLabelByKey:
  # §21.5.3 行动建议的终端 UI 短标签（按钮文案）。与 actionHintLegend 区分：
  # legend 是给运营/契约读者的语义描述，本表是端最终渲染/服务端下发 Label 的短文案。
  # 键集必须与 actionHintLegend 完全一致（verify 脚本校验），服务端 actionLabelForKey 查本表。
  follow_person: 关注TA
  greet_person: 打招呼
  message_person: 私信
  view_shared_people: 查看共同来源
  join_circle: 加入圈子
  open_discussion: 进入讨论
  open_content: 查看内容
  open_object: 查看对象
  follow_object: 关注对象
  open_route: 查看路线
  create_followup: 发布跟进
  ask_assistant: 解释这条交集
  join_topic_room: 进话题群
  start_companion: 发起结伴
  join_trip: 加入同行
  join_meetup: 报名
  meet_nearby: 附近碰头
  start_voice_room: 进语音房
  express_interest: 打个招呼
  view_official_deals: 看官方优惠
  book_ticket: 订门票
  book_hotel: 订住宿

actionKeyMeta:
  # §24 行动阶梯元数据（M0.1 requiredGates + M0.3 tier/targetAvailability + M0.7 dispatch 的统一真相源）。
  # 键集必须 == actionHintLegend（verify 校验）。端下发 IntersectionActionHint 时按本表填充
  #   actionTier / requiredGates / targetAvailability / dispatch，端只读渲染并据此决定「可执行 / 优雅降级 / 落点」。
  #   tier:               light（轻查看/关注，即时可做）| heavy（重社交，需破冰阶梯/请求/建群/报名）。
  #   requiredGates:      ⊆ gateKeys，重行动必须声明；空=无门（轻查看类）。
  #   targetAvailability: available（有真实承接页可执行）| deferred（承接页/数据源未就绪，端不得伪造成行，
  #                       只展示不可执行规划口径或跳真实替代面，对应 §24.10 诚实红线 + UAT-8）。
  #   dispatch:           ∈ actionDispatch 闭集（assistant|navigate|message|companion|connect|commerce），端交互 handler 路由；
  #                       与 tier 正交（tier=heavy 的 message vs companion 落点不同）。端 navigator / 徽标 / 助手分发
  #                       一律读本字段，禁止端手写「助手 / 约伴 / 重社交」分类的第二份枚举（M0.7 收敛）。
  follow_person:      { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  greet_person:       { tier: light, requiredGates: [login, greetPreference, blocked], targetAvailability: available, dispatch: navigate }
  message_person:     { tier: heavy, requiredGates: [login, mutualConsent, blocked, rateLimit], targetAvailability: available, dispatch: message }
  view_shared_people: { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  join_circle:        { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  open_discussion:    { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  open_content:       { tier: light, requiredGates: [], targetAvailability: available, dispatch: navigate }
  open_object:        { tier: light, requiredGates: [], targetAvailability: available, dispatch: navigate }
  follow_object:      { tier: light, requiredGates: [login], targetAvailability: available, dispatch: navigate }
  open_route:         { tier: light, requiredGates: [], targetAvailability: available, dispatch: navigate }
  create_followup:    { tier: heavy, requiredGates: [login, realName], targetAvailability: available, dispatch: assistant }
  ask_assistant:      { tier: light, requiredGates: [], targetAvailability: available, dispatch: assistant }
  join_topic_room:    { tier: heavy, requiredGates: [login, minorMode], targetAvailability: available, dispatch: connect }
  # start_companion = 公开约伴邀约：发起是「开放邀约」，任何人可响应，故发起环节不需事先双向同意；
  #   mutualConsent（双向同意）属「响应后建立联系」阶段，由群聊/私信自身 gate 承接，不入发起 requiredGates
  #   （对照 meet_nearby 线下面基是点对点碰头，保留 mutualConsent+fuzzyLocation 才正确）。
  #   承接页复用既有建群/行程落点（available）；来源 kind coWishlistedEntity 的数据源门由 kinds.coWishlistedEntity.status
  #   表达，与发起环节安全门正交（无稳定 wishlist 源时按 kind status GATE_BLOCK）。
  start_companion:    { tier: heavy, requiredGates: [login, realName, minorMode, blocked, rateLimit], targetAvailability: available, dispatch: companion }
  express_interest:   { tier: heavy, requiredGates: [login, greetPreference, blocked, rateLimit], targetAvailability: available, dispatch: connect }
  # 以下重行动承接页仍 deferred（行程/线下局/实时附近/语音房无真实承接，§24.10 诚实红线）。
  join_trip:          { tier: heavy, requiredGates: [login, realName, minorMode], targetAvailability: deferred, dispatch: companion }
  join_meetup:        { tier: heavy, requiredGates: [login, realName, minorMode], targetAvailability: deferred, dispatch: companion }
  meet_nearby:        { tier: heavy, requiredGates: [login, realName, minorMode, mutualConsent, fuzzyLocation, rateLimit], targetAvailability: deferred, dispatch: companion }
  start_voice_room:   { tier: heavy, requiredGates: [login, realName, minorMode], targetAvailability: deferred, dispatch: connect }
  # commerce actionKey 仅冻结契约位：真实官方渠道/CPS/法务条款未就绪前不得展示可交易入口。
  view_official_deals: { tier: light, requiredGates: [], targetAvailability: deferred, dispatch: commerce }
  book_ticket:        { tier: heavy, requiredGates: [login], targetAvailability: deferred, dispatch: commerce }
  book_hotel:         { tier: heavy, requiredGates: [login], targetAvailability: deferred, dispatch: commerce }

