# 推荐模型服务无独立写存储；rec_model_registry 归 model_release packet，
# rec_training_samples 是训练派生集合（sample_joiner 产出，见 _projections/）。
# rec_learning_events 是曝光/反馈两类事实的物理承载（content-service 写入）。
collections:
  rec_learning_events:
    entity: RecommendationExposureFact
    role: append_only
    description: 曝光（rec_impression）与反馈（rec_engagement）事实的共用事件信封。
      dedupe 由确定性 eventId 承载并作为 _id 提交——曝光 eventId 从
      feedRequestId+targetId+eventType 派生，反馈 eventId 从
      feedRequestId+targetId+action（缺 feedRequestId 时回退 clientEventId）派生；
      重放写入被 _id 唯一约束拒绝后按已存在处理，禁止时间戳参与 eventId。
    indexes:
      - { name: idx_rec_learning_user_type, keys: { userId: 1, eventType: 1, occurredAt: -1 } }
      - { name: idx_rec_learning_scenario_time, keys: { scenario: 1, occurredAt: -1 } }
      - { name: ttl_rec_learning_events, keys: { createdAt: 1 }, ttl_days: 30 }
  rec_training_samples:
    entity: RecommendationTrainingSample
    role: projection
    description: >
      由 rec_learning_events 拼接的可删除训练投影；userId/persona 特征属于账号私有数据，
      UserAccountClosed 必须按 subject 删除，sample joiner 必须先检查 closed subject
      tombstone，禁止晚到事实重新生成样本。
    indexes:
      - { name: idx_rec_training_scenario_ts, keys: { scenario: 1, ts: -1 } }
      - { name: idx_rec_training_user_ts, keys: { userId: 1, ts: -1 } }
  rec_replay_samples:
    entity: RecommendationReplaySample
    role: projection
    description: >
      immutable replay dataset 的样本快照；账号注销时必须删除命中 subject 的样本，
      并把对应 dataset 推进到 privacy_invalidated 终态。
    indexes:
      - { name: idx_rec_replay_dataset, keys: { datasetId: 1 } }
      - { name: idx_rec_replay_user_dataset, keys: { userId: 1, datasetId: 1 } }
  rec_replay_datasets:
    entity: RecommendationReplayDataset
    role: projection
    description: >
      replay 快照清单；privacyStatus=privacy_invalidated 后永久拒绝 evaluate/train/release，
      禁止复用同一 datasetId 覆盖或恢复。
    indexes:
      - { name: idx_rec_replay_scenario_frozen, keys: { scenario: 1, frozenAt: -1 } }
      - { name: idx_rec_replay_privacy_status, keys: { privacyStatus: 1, frozenAt: -1 } }
tables: {}
