# RecommendationExposureFact / RecommendationFeedbackFact（rec_learning_events 信封）契约。
entities: [RecommendationExposureFact, RecommendationFeedbackFact]

scenarios:
  - name: exposure_deterministic_event_id
    object: RecommendationExposureFact
    go_func: TestLearningEventDedupe
    evidence: api_integration
    assertions:
      - 曝光 eventId 从 feedRequestId+targetId+eventType 确定性派生并作为 _id 提交
      - 同一 feed 批次同一内容重放写入被 _id 唯一约束拒绝且按已存在处理
      - modelReleaseId 在模型分桶命中时透传；rule 分桶为空（NULLABLE）

  - name: feedback_request_correlation
    object: RecommendationFeedbackFact
    go_func: TestLearningEventDedupe
    evidence: api_integration
    assertions:
      - 反馈 eventId 从 feedRequestId+targetId+action 派生（缺 feedRequestId 回退 clientEventId）
      - 反馈与曝光经 requestId+targetId 最终一致关联；无曝光行主键依赖
      - 客户端行为事件先经 rec:event_dedup Redis 去重再进 learning 信封

  - name: facts_are_service_internal
    object: RecommendationExposureFact
    go_func: TestCallerVersionPreconditionIsLimitedToSnapshotOverwriteOperations
    evidence: local_contract
    assertions:
      - 两类 fact 无公开 operation（mutation_entrypoints 为空）
      - 训练消费（sample_joiner）只读，不回写事实
