version: 1
read_model: IntersectionTarget
description: |
  交集可点击目标（统一交互子契约 · A–E 横切复用值对象，Phase 0 §20.7 冻结）。
  唯一表达「这一片段 / 视觉点击后去哪」：objectId + objectKind + routeId。
  端侧 IntersectionTargetNavigator 据此映射为 codegen 路由（AppRoutePaths.*）跳转，
  禁止 UI 硬编码 path（routeId 为云侧下发的「路由逻辑名」，非 path 字面量）。
  整个 target 缺省（nullable）表示该片段 / 视觉不可点击。

  闭集枚举（端按字符串解析，未知值优雅降级为不可点击）：
    objectKind: person | circle | school | place | enterprise | content | tag
    routeId:    userProfile | circleDetail | homepageDetail | postDetail | myIntersections
                （端侧路由常量逻辑名，端不本地拼装 path；空/未知时由 objectKind 兜底映射）

consumers:
  - app

client_projection:
  dart_class: IntersectionTarget
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_target.g.dart
  fields:
    - name: objectId
      dart_type: String
      nullable: false
      source: objectId
      aliases: [objectId]
      default: "''"
    - name: objectKind
      dart_type: String
      nullable: false
      source: objectKind
      aliases: [objectKind]
      default: "''"
    - name: routeId
      dart_type: String
      nullable: false
      source: routeId
      aliases: [routeId]
      default: "''"
