version: 1
read_model: IntersectionPoint

description: |
  交集点 / 证据组：IntersectionReason 的可见证据项真相源。事实交集点来自可枚举关系；
  推荐交集点来自算法分桶后的可解释推荐点，必须标注 recommended，不能伪装事实。

  维度与证据组类型为开放字符串（dimension / pointClass / sourceRef），端按字符串解析，
  未来新增交集维度（如时间 coCohort、地点 coVisitedEntity）不需要改契约，端侧对未知
  kind 优雅降级展示 displayText/label + count，不得写死闭集枚举。

  证据组语义：
    count            该证据组聚合到的事实条数（如「共同好友 4」中的 4）；端侧数字真相源。
    displayText      用户语言短句名词（≤6 汉字，如「共同好友」），云侧下发，端不本地拼装。
    sampleText       实例化样本（如某好友名 / 某地点名 / 某篇内容标题），让交集"可感知"。
    sampleAvatarUrls 头像簇（≤3），真实的人/对象信号，端侧视觉锚。

consumers:
  - app
  - recommendation

client_projection:
  dart_class: IntersectionPoint
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_point.g.dart
  fields:
    - name: pointId
      dart_type: String
      nullable: false
      source: pointId
      aliases: [pointId]
      default: "''"
    - name: pointClass
      dart_type: String
      nullable: false
      source: pointClass
      aliases: [pointClass]
      default: "'fact'"
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      aliases: [dimension]
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      aliases: [label]
      default: "''"
    - name: displayText
      dart_type: String
      nullable: false
      source: displayText
      aliases: [displayText]
      default: "''"
    - name: sourceRef
      dart_type: String
      nullable: false
      source: sourceRef
      aliases: [sourceRef]
      default: "''"
    - name: visibility
      dart_type: String
      nullable: false
      source: visibility
      aliases: [visibility]
      default: "'public'"
    - name: count
      dart_type: int
      nullable: false
      source: count
      aliases: [count]
      default: "0"
    - name: sampleText
      dart_type: String
      nullable: false
      source: sampleText
      aliases: [sampleText]
      default: "''"
    - name: sampleAvatarUrls
      dart_type: List<String>
      nullable: false
      source: sampleAvatarUrls
      aliases: [sampleAvatarUrls]
