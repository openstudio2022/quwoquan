version: 1
read_model: IntersectionPoint

description: |
  交集点是 IntersectionReason 的可见证据项真相源。事实交集点来自可枚举关系；
  推荐交集点来自算法分桶后的可解释推荐点，必须标注 recommended，不能伪装事实。

consumers:
  - app
  - recommendation

client_projection:
  dart_class: IntersectionPoint
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_point.g.dart
  fields:
    - name: pointId
      dart_type: String
      nullable: false
      source: pointId
      aliases: [pointId]
      default: "''"
    - name: pointClass
      dart_type: String
      nullable: false
      source: pointClass
      aliases: [pointClass]
      default: "'fact'"
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      aliases: [dimension]
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      aliases: [label]
      default: "''"
    - name: displayText
      dart_type: String
      nullable: false
      source: displayText
      aliases: [displayText]
      default: "''"
    - name: sourceRef
      dart_type: String
      nullable: false
      source: sourceRef
      aliases: [sourceRef]
      default: "''"
    - name: visibility
      dart_type: String
      nullable: false
      source: visibility
      aliases: [visibility]
      default: "'public'"
