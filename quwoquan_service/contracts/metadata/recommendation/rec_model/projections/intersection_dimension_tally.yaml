version: 1
read_model: IntersectionDimensionTally
description: |
  「我的交集」单个维度的计数与未读统计（B1 契约）。
  dimension 与 IntersectionReason.dimension 闭集对齐；count 为该维度可见事实交集总数；
  newCount 为自上次查看（已读水位）以来的新增数，端侧据此显示红点。
  label 为后端提供的用户语言维度短名（如"身份""地点""内容""兴趣""关系"），端不本地拼装。
  briefText 为云侧实例化的一句话动态简报（如"3 位好友新加入了你关注的圈子"），
  我的主页聚合卡按 briefText 渲染动态简报行；缺省时端回落 label + newCount，不本地编造事实。
  dimension 为开放字符串，端对未知维度优雅降级（briefText 缺省走 label）。

consumers:
  - app

client_projection:
  dart_class: IntersectionDimensionTally
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_dimension_tally.g.dart
  fields:
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      aliases: [dimension]
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      aliases: [label]
      default: "''"
    - name: count
      dart_type: int
      nullable: false
      source: count
      aliases: [count]
      default: "0"
    - name: newCount
      dart_type: int
      nullable: false
      source: newCount
      aliases: [newCount]
      default: "0"
    - name: briefText
      dart_type: String
      nullable: false
      source: briefText
      aliases: [briefText]
      default: "''"
