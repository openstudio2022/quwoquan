version: 1
read_model: RecommendFeature

description: |
  推荐特征宽表 ReadModel。多源聚合用户特征 + 内容特征 + 上下文特征。
  供推荐引擎做特征检索。

storage_backend: mongodb
collection: rm_recommend_feature

source_entities:
  - UserProfile
  - Post
  - FollowEdge
  - ContentReaction
  - Circle
  - CircleMember
  - VisitRecord

source_events:
  - UserProfileUpdated
  - PostCreated
  - ContentReacted
  - BehaviorBatchReported
  - CircleMemberJoined
  - UserFollowed

consumers:
  - recommendation-engine

fields:
  - { name: userId, type: string }
  - name: userFeatures
    type: object
    description: |
      用户侧特征(原始累加，BehaviorBatchReported 等事件 $inc)：tagInteraction / authorInteraction /
      topicAffinities / audienceAffinities / formatAffinities / entityAffinities /
      entityInstanceAffinities / typeImpressions / typeEngagements / depthDistribution / ...
      InterestDecayJob 按半衰期衰减四维 affinities，解原始 $inc 单调增长。
      注：对外兴趣画像 interestProfile(T4-1) 由 content 派生后经 UserInterestRecomputed 事件
      投影到 user 域 rm_user_profile_view.interestProfile，不在本宽表持久化(单一真相源)。
  - { name: contentFeatures, type: "[]object", description: 候选内容特征 }
  - { name: socialFeatures, type: object, description: 社交图谱特征 }
  - { name: contextFeatures, type: object, description: 上下文特征（时间/设备/位置） }
  - name: segments
    type: "[]string"
    description: |
      规则人群 segment 命中集(顶层)。content 在派生 interestProfile 后按
      recommendation/rec_model/segments.yaml 结构化 predicate 匹配(MatchSegments 单一计算源)，
      $set 回写本宽表供推荐引擎 FeatureStore 直接加载，驱动 policy.yaml segmentTargeting
      (preset 覆盖 / weightDeltas) 与实验 eligibleSegments 定向；同一计算还经 UserInterestRecomputed
      事件投影到 user 域 rm_user_profile_view.segments(供小艺主动)。两处均为该计算的 CQRS 投影，非第二真相源。
  - { name: segmentsUpdatedAt, type: timestamp, description: segments 最近回写时间 }
  - { name: updatedAt, type: timestamp }

indexes:
  - { name: idx_rf_user, keys: { userId: 1 }, unique: true }
