version: 1
read_model: IntersectionReason
description: |
  交集理由（B1 契约，跨会话基建真相源）。
  云侧推荐管线据「实时推荐结果 + 交集来源」预生成结构化交集理由随 feed / 对象详情下发；
  端只读展示，禁止本地拼装文案（全局验收 G2）。
  挂载点共用同一结构：feed item、对象推荐卡、对象页交集卡（你和这里的交集 / 你们的交集）、内容卡交集线索。

  闭集枚举（端按字符串解析）：
    dimension: identity | location | content | interest | relationship（5 源闭集，稳定用户语言来源）
    source:    tagRef | geoTagRef | entityRef | followEdge | contact
    actionType: follow | join | add_contact | view_object
    relationKind: follow | contact | mutual（relationship 维度无标签锚点时使用；禁止再承载对象类型语义）
    objectKind: person | circle | school | place | enterprise（对象类型闭集，统一品牌蓝角标「人/圈/校/地/企」真相源）
    intersectionClass: fact | affinity（fact = 可向用户说明的事实交集；affinity = 算法概率推荐，不伪装事实）
    weightTier: light | heavy（内容卡交集轻/重等级，云侧离散产出；无 reason 即无交集，承载 70/20/10 频率契约）

  展示字段（统一视觉系统消费）：
    avatarUrl / displayName 用于头像 + 名字卡（端不再用整句 displayText 占位）。
    confidenceLabel 仅对 affinity 展示"推荐认识/可能合得来"等克制文案。
    freshAt / expiresAt 为保鲜期锚点（ISO8601 字符串，过期由后端重算，端只读）。
    modelReasonBucket 为 affinity 模型理由桶（埋点与灰度用，端不直接展示原文）。
    intersectionPoints 是交集点列表真相源；摘要数字必须由同一 snapshot 下可见点派生，
    不得成为第二套事实来源。
    connectionSummary 是云侧实例化的「连接说明」一句话（由具体实例构成，如"北京大学、摄影把你们连在一起"），
    对象页交集卡顶部展示；缺省时端不展示该行，禁止端本地用维度词空说。
    primaryText 是主交集结论句（蓝色，云侧产出，端只读直出，如"4位共同好友"）；
    secondaryText 是副交集辅助说明（灰色；缺省端不展示）。
    端禁止再用 intersectionPoints/EvidenceGroup 本地拼装主/副交集文案（G2）。

consumers:
  - app

client_projection:
  dart_class: IntersectionReason
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_reason.g.dart
  dart_imports:
    - intersection_point.g.dart
    - intersection_dimension_tally.g.dart
  fields:
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      aliases: [dimension]
      default: "''"
    - name: tagRefs
      dart_type: List<String>
      nullable: false
      source: tagRefs
      aliases: [tagRefs]
    - name: relationKind
      dart_type: String
      nullable: false
      source: relationKind
      aliases: [relationKind]
      default: "''"
    - name: objectKind
      dart_type: String
      nullable: false
      source: objectKind
      aliases: [objectKind]
      default: "''"
    - name: relationObjectId
      dart_type: String
      nullable: false
      source: relationObjectId
      aliases: [relationObjectId]
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      aliases: [label]
      default: "''"
    - name: sharedCount
      dart_type: int
      nullable: false
      source: sharedCount
      aliases: [sharedCount]
      default: "0"
    - name: strength
      dart_type: double
      nullable: false
      source: strength
      aliases: [strength]
      default: "0.0"
    - name: displayText
      dart_type: String
      nullable: false
      source: displayText
      aliases: [displayText]
      default: "''"
    - name: primaryText
      dart_type: String
      nullable: false
      source: primaryText
      aliases: [primaryText]
      default: "''"
    - name: secondaryText
      dart_type: String
      nullable: false
      source: secondaryText
      aliases: [secondaryText]
      default: "''"
    - name: weightTier
      dart_type: String
      nullable: false
      source: weightTier
      aliases: [weightTier]
      default: "''"
    - name: actionType
      dart_type: String
      nullable: false
      source: actionType
      aliases: [actionType]
      default: "''"
    - name: actionTargetId
      dart_type: String
      nullable: false
      source: actionTargetId
      aliases: [actionTargetId]
      default: "''"
    - name: source
      dart_type: String
      nullable: false
      source: source
      aliases: [source]
      default: "''"
    - name: intersectionId
      dart_type: String
      nullable: false
      source: intersectionId
      aliases: [intersectionId]
      default: "''"
    - name: intersectionClass
      dart_type: String
      nullable: false
      source: intersectionClass
      aliases: [intersectionClass]
      default: "'fact'"
    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      aliases: [avatarUrl]
      default: "''"
    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      aliases: [displayName]
      default: "''"
    - name: confidenceLabel
