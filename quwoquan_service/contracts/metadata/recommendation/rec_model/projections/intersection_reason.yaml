version: 1
read_model: IntersectionReason
description: |
  交集理由（B1 契约，跨会话基建真相源）。
  云侧推荐管线据「实时推荐结果 + 交集来源」预生成结构化交集理由随 feed / 对象详情下发；
  端只读展示，禁止本地拼装文案（全局验收 G2）。
  挂载点共用同一结构：feed item、对象推荐卡、对象页交集卡（你和这里的交集 / 你们的交集）、内容卡交集线索。

  闭集枚举（端按字符串解析）：
    dimension: identity | location | content | interest | relationship（5 源闭集，稳定用户语言来源）
    source:    tagRef | geoTagRef | entityRef | followEdge | contact
    actionType: follow | join | add_contact | view_object
    relationKind: follow | contact | mutual（relationship 维度无标签锚点时使用；禁止再承载对象类型语义）
    objectKind: person | circle | school | place | enterprise（对象类型闭集，统一品牌蓝角标「人/圈/校/地/企」真相源）
    intersectionClass: fact | affinity（fact = 可向用户说明的事实交集；affinity = 算法概率推荐，不伪装事实）
    weightTier: light | heavy（内容卡交集轻/重等级，云侧离散产出；无 reason 即无交集，承载 70/20/10 频率契约）

  展示字段（统一视觉系统消费）：
    avatarUrl / displayName 用于头像 + 名字卡（端只读，禁止本地拼装）。
    confidenceLabel 仅对 affinity 展示"推荐认识/可能合得来"等克制文案。
    freshAt / expiresAt 为保鲜期锚点（ISO8601 字符串，过期由后端重算，端只读）。
    modelReasonBucket 为 affinity 模型理由桶（埋点与灰度用，端不直接展示原文）。
    intersectionPoints 是交集点列表真相源；摘要数字必须由同一 snapshot 下可见点派生，
    不得成为第二套事实来源。
    connectionSummary 是云侧实例化的「连接说明」一句话（由具体实例构成，如"北京大学、摄影把你们连在一起"），
    对象页交集卡顶部展示；缺省时端不展示该行，禁止端本地用维度词空说。
    primaryText 是主交集结论句（蓝色，云侧产出，端只读直出），统一采用「主谓宾一句话」格式：
      主语[N位 + 关系限定] + 谓语[行为动词] + 宾语[对象]，如"你的8位校友关注了Claude Code"、
      "4位共同关注的人讨论了这篇内容"、"你和8人共同关注了Claude Code"；表达规范见
      specs/product/intersection-definition-and-application.md §17（事实通道禁止朋友/好友/收藏/同趣词，affinity 明确标注推荐）。
    secondaryText 是副交集辅助说明（灰色）；仅列表入口（我的连接 / 为什么推荐TA / 我的影响力）可作辅助说明，
      紧凑 surface（首页内容卡 / spotlight）严格单句、不展示副句（§17.2）。
    端禁止再用 intersectionPoints/EvidenceGroup 本地拼装主/副交集文案（G2）。
    本契约已零兼容删除 displayText / label / sharedCount（§18.1 一次性收口）：紧凑结论句唯一来源为 primaryText，
    证据组结构化字段（count / sampleText / sampleAvatarUrls / 证据名词）一律由 IntersectionPoint 承载，
    禁止在 reason 级恢复任何第二文案/计数通道。
    本契约已零兼容收敛 recommendationTraceId（Phase 0 漂移收口 §20）：交集证据快照/追踪 id 的唯一字段为
    pointSummarySnapshotId（不再保留 recommendationTraceId 字段与别名）；导航级 recommendationTraceId 仍属于
    entity/homepage 的 object_page_context 上下文，与本 reason 无关，不得在此恢复同名字段。

consumers:
  - app

client_projection:
  dart_class: IntersectionReason
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_reason.g.dart
  dart_imports:
    - intersection_point.g.dart
    - intersection_dimension_tally.g.dart
    - intersection_text_span.g.dart
    - intersection_visual.g.dart
  fields:
    - name: dimension
      dart_type: String
      nullable: false
      source: dimension
      aliases: [dimension]
      default: "''"
    - name: tagRefs
      dart_type: List<String>
      nullable: false
      source: tagRefs
      aliases: [tagRefs]
    - name: relationKind
      dart_type: String
      nullable: false
      source: relationKind
      aliases: [relationKind]
      default: "''"
    - name: objectKind
      dart_type: String
      nullable: false
      source: objectKind
      aliases: [objectKind]
      default: "''"
    - name: relationObjectId
      dart_type: String
      nullable: false
      source: relationObjectId
      aliases: [relationObjectId]
      default: "''"
    - name: strength
      dart_type: double
      nullable: false
      source: strength
      aliases: [strength, strengthScore]
      default: "0.0"
    - name: primaryText
      dart_type: String
      nullable: false
      source: primaryText
      aliases: [primaryText]
      default: "''"
    - name: secondaryText
      dart_type: String
      nullable: false
      source: secondaryText
      aliases: [secondaryText]
      default: "''"
    - name: weightTier
      dart_type: String
      nullable: false
      source: weightTier
      aliases: [weightTier]
      default: "''"
    - name: actionType
      dart_type: String
      nullable: false
      source: actionType
      aliases: [actionType]
      default: "''"
    - name: actionTargetId
      dart_type: String
      nullable: false
      source: actionTargetId
      aliases: [actionTargetId]
      default: "''"
    - name: source
      dart_type: String
      nullable: false
      source: source
      aliases: [source, sourceRef]
      default: "''"
    - name: intersectionId
      dart_type: String
      nullable: false
      source: intersectionId
      aliases: [intersectionId]
      default: "''"
    - name: intersectionClass
      dart_type: String
      nullable: false
      source: intersectionClass
      aliases: [intersectionClass]
      default: "'fact'"
    - name: avatarUrl
      dart_type: String
      nullable: false
      source: avatarUrl
      aliases: [avatarUrl]
      default: "''"
    - name: displayName
      dart_type: String
      nullable: false
      source: displayName
      aliases: [displayName]
      default: "''"
    - name: confidenceLabel
      dart_type: String
      nullable: false
      source: confidenceLabel
      aliases: [confidenceLabel]
      default: "''"
    - name: modelReasonBucket
      dart_type: String
      nullable: false
      source: modelReasonBucket
      aliases: [modelReasonBucket]
      default: "''"
    - name: freshAt
      dart_type: String
      nullable: false
      source: freshAt
      aliases: [freshAt]
      default: "''"
    - name: expiresAt
      dart_type: String
      nullable: false
      source: expiresAt
      aliases: [expiresAt]
      default: "''"
    - name: intersectionPoints
      dart_type: List<IntersectionPoint>
      nullable: false
      source: intersectionPoints
      aliases: [intersectionPoints, evidenceItems]
      list_element_dart_class: IntersectionPoint
    - name: pointSummarySnapshotId
      dart_type: String
      nullable: false
      source: pointSummarySnapshotId
      aliases: [pointSummarySnapshotId]
      default: "''"
    - name: factPointCount
      dart_type: int
      nullable: false
      source: factPointCount
      aliases: [factPointCount]
      default: "0"
    - name: recommendedPointCount
      dart_type: int
      nullable: false
      source: recommendedPointCount
      aliases: [recommendedPointCount]
      default: "0"
    - name: totalPointCount
      dart_type: int
      nullable: false
      source: totalPointCount
      aliases: [totalPointCount]
      default: "0"
    - name: dimensionPointSummary
      dart_type: List<IntersectionDimensionTally>
      nullable: false
      source: dimensionPointSummary
      aliases: [dimensionPointSummary]
      list_element_dart_class: IntersectionDimensionTally
    - name: pointClassLabel
      dart_type: String
      nullable: false
      source: pointClassLabel
      aliases: [pointClassLabel]
      default: "''"
    - name: connectionSummary
      dart_type: String
      nullable: false
      source: connectionSummary
      aliases: [connectionSummary]
      default: "''"
    - name: lastRecommendedAt
      dart_type: String
      nullable: false
      source: lastRecommendedAt
      aliases: [lastRecommendedAt]
      default: "''"
    - name: seenAt
      dart_type: String
      nullable: false
      source: seenAt
      aliases: [seenAt]
      default: "''"
    - name: rankState
      dart_type: String
      nullable: false
      source: rankState
      aliases: [rankState]
      default: "'fresh'"
    # 统一交互子契约（§20.7，只附加；不重排已冻结字段）：
    #   primarySpans 是 primaryText 的结构化富文本切分，join(spans.text)==primaryText（契约不变量）；
    #   sampleVisuals 是按 objectKind 的结构化样本视觉（取代裸 avatarUrl/sampleAvatarUrls），端按 assetKind 渲染。
    - name: primarySpans
      dart_type: List<IntersectionTextSpan>
      nullable: false
      source: primarySpans
      aliases: [primarySpans]
      list_element_dart_class: IntersectionTextSpan
    - name: sampleVisuals
      dart_type: List<IntersectionVisual>
      nullable: false
      source: sampleVisuals
      aliases: [sampleVisuals]
      list_element_dart_class: IntersectionVisual
    # 架构基线 v2（§21）：以下字段由 content-service 交集异步物化投影真算填充
    #   （ReadModelIntersectionSource 写/刷新路径 + intersection_graph_materializer，
    #    读路径热命中零计算零同步打分消费，R-IX01 不变量保持；缺省仍走默认值兜底）。
    #   lifecycleState 交集边生命周期态（§21.3 闭集 new|strengthened|stable|weakened|reactivated，仅弱标/红点，不进 primaryText）；
    #     由 Lifecycle 状态机以上一次物化快照为基线对 edgeWeight 增量比对产出。
    #   previousStrength/strengthDelta 上一次物化边权与本轮变化量，支撑 strengthened/weakened/reactivated 判定（缺省 0）；
    #   edgeWeight Graph 边权（§21.2 = relationStrength × interactionFrequency × recencyDecay，确定性真算，[0,1]，缺省 0）；
    #   iconKey 类型图标语义键（§21.5.2 闭集，端 IntersectionIconResolver 消费，缺省回退 sourceRef/dimension 推导）；
    #   objectVisual 尾部对象封面/校徽（§21.5.1 槽③，按 assetKind 渲染，缺省回退 chevron）。
    - name: lifecycleState
      dart_type: String
      nullable: false
      source: lifecycleState
      aliases: [lifecycleState]
      default: "''"
    - name: previousStrength
      dart_type: double
      nullable: false
      source: previousStrength
      aliases: [previousStrength]
      default: "0.0"
    - name: strengthDelta
      dart_type: double
      nullable: false
      source: strengthDelta
      aliases: [strengthDelta]
      default: "0.0"
    - name: edgeWeight
      dart_type: double
      nullable: false
      source: edgeWeight
      aliases: [edgeWeight]
      default: "0.0"
    - name: iconKey
      dart_type: String
      nullable: false
      source: iconKey
      aliases: [iconKey]
      default: "''"
    - name: objectVisual
      dart_type: IntersectionVisual
      nullable: true
      source: objectVisual
      aliases: [objectVisual]
      map_from_string_key_class: IntersectionVisual
    # 我的交集高保重构（主页/详情页事实 item 排序与分组，只读字段）：
    #   timeBucket 为服务端归桶结果（today|yesterday|last7Days|thisMonth|lastMonth），
    #   dedupeKey 为 user_id + object_id + object_type 的全局去重主键，
    #   anchorUserWeight / mutualCount 用于同 strength/timeBucket 时稳定择优。
    - name: timeBucket
      dart_type: String
      nullable: false
      source: timeBucket
      aliases: [timeBucket]
      default: "''"
    - name: dedupeKey
      dart_type: String
      nullable: false
      source: dedupeKey
      aliases: [dedupeKey]
      default: "''"
    - name: anchorUserWeight
      dart_type: double
      nullable: false
      source: anchorUserWeight
      aliases: [anchorUserWeight]
      default: "0.0"
    - name: mutualCount
      dart_type: int
      nullable: false
      source: mutualCount
      aliases: [mutualCount]
      default: "0"
