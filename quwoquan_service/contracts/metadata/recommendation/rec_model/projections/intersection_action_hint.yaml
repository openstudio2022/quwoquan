version: 1
read_model: IntersectionActionHint
description: |
  交集/影响力下一步行动建议（统一交互子契约）。
  交集必须可行动；本值对象承载云侧按 kind/helpType 选择的主 CTA 与次 CTA。
  端只读 actionKey、label、target 渲染按钮或行内动作，禁止端侧按 kind 猜测行动。

  闭集 actionKey：
    follow_person | greet_person | message_person | view_shared_people
    join_circle | open_discussion | open_content | open_object | follow_object
    open_route | create_followup | ask_assistant

consumers:
  - app

client_projection:
  dart_class: IntersectionActionHint
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_action_hint.g.dart
  dart_imports:
    - intersection_target.g.dart
  fields:
    - name: actionKey
      dart_type: String
      nullable: false
      source: actionKey
      aliases: [actionKey]
      default: "''"
    - name: label
      dart_type: String
      nullable: false
      source: label
      aliases: [label]
      default: "''"
    - name: target
      dart_type: IntersectionTarget
      nullable: true
      source: target
      aliases: [target]
      map_from_string_key_class: IntersectionTarget
    - name: isPrimary
      dart_type: bool
      nullable: false
      source: isPrimary
      aliases: [isPrimary]
      default: "false"
    - name: priority
      dart_type: int
      nullable: false
      source: priority
      aliases: [priority]
      default: "0"
