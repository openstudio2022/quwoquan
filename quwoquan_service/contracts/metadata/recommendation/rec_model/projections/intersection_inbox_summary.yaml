version: 1
read_model: IntersectionInboxSummary
description: |
  我的主页「我的交集」聚合入口摘要（B1 契约）。
  云侧据 viewer_object_intersections 读模型 + per-dimension 已读水位预生成：
  总交集数 + 各维度计数与"自上次查看新增"未读数。端只读展示，禁止本地统计。

  展示规则（端侧消费）：
    - 我的主页最多展示 3 个维度 tally；超过 3 个收起，点击"展开更多"再展示其余。
    - 红色数字仅用于未读 newCount；newCount=0 时不展示红点。
    - 打开某维度列表后调用 visit 推进水位，对应 tally 的 newCount 清零。

  维度闭集与 IntersectionReason.dimension 对齐：identity | location | content | interest | relationship。

consumers:
  - app

client_projection:
  dart_class: IntersectionInboxSummary
  base_class: ""
  output_path: cloud/runtime/generated/recommendation/intersection_inbox_summary.g.dart
  dart_imports:
    - intersection_dimension_tally.g.dart
  fields:
    - name: totalCount
      dart_type: int
      nullable: false
      source: totalCount
      aliases: [totalCount]
      default: "0"
    - name: totalNewCount
      dart_type: int
      nullable: false
      source: totalNewCount
      aliases: [totalNewCount]
      default: "0"
    - name: dimensions
      dart_type: List<IntersectionDimensionTally>
      nullable: false
      source: dimensions
      aliases: [dimensions]
      list_element_dart_class: IntersectionDimensionTally
    - name: generatedAt
      dart_type: String
      nullable: false
      source: generatedAt
      aliases: [generatedAt]
      default: "''"
