# 推荐曝光与反馈不可变事实；评分 transport DTO 归属 model_release packet。
# 本文件不登记聚合根。

entities:
  RecommendationExposureFact:
    description: 推荐曝光不可变事实
    fields:
      - { name: id, type: string, constraints: [PK, NOT_NULL] }
      - { name: requestId, type: string, constraints: [NOT_NULL] }
      - { name: personaId, type: string, constraints: [NOT_NULL] }
      - { name: scenario, type: string, constraints: [NOT_NULL] }
      - { name: targetType, type: string, constraints: [NOT_NULL] }
      - { name: targetId, type: string, constraints: [NOT_NULL] }
      - { name: rank, type: int, constraints: [NOT_NULL] }
      - { name: modelReleaseId, type: string, constraints: [NOT_NULL] }
      - { name: exposedAt, type: timestamp, constraints: [NOT_NULL] }

  RecommendationFeedbackFact:
    description: 推荐点击、停留、隐藏等不可变反馈事实
    fields:
      - { name: id, type: string, constraints: [PK, NOT_NULL] }
      - { name: exposureId, type: string, constraints: [NOT_NULL] }
      - { name: feedbackType, type: string, constraints: [NOT_NULL] }
      - { name: value, type: object, constraints: [NULLABLE] }
      - { name: occurredAt, type: timestamp, constraints: [NOT_NULL] }
