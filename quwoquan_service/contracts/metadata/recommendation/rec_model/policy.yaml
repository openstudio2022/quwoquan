abAdmission:
  maxBucketSkewPct: 5.0
  minDetectableEffect: 0.02
  minSamplesPerBucket: 1000
  primaryMetric: ctr
  rollback:
    autoRollback: false
    regressionRatio: 0.95
  significanceLevel: 0.05
defaultPreset: control
experiments:
- buckets:
  - name: control
    weightPct: 60
  - name: engagement_heavy
    weightPct: 15
  - name: freshness_heavy
    weightPct: 15
  - name: explore_heavy
    weightPct: 10
  eligibleSegments: []
  enabled: true
  id: rec_scoring_weights
- buckets:
  - name: rule
    weightPct: 80
  - name: model
    weightPct: 20
  eligibleSegments: []
  enabled: true
  id: rec_model_vs_rule
- buckets:
  - name: champion
    weightPct: 90
  - name: challenger
    weightPct: 10
  eligibleSegments: []
  enabled: true
  id: rec_model_version
exposureGovernance:
  collaborativeRecall:
    enabled: true
    maxI2ICandidates: 80
    maxU2ICandidates: 80
    quotaPct: 15
  dynamicBudget:
    enabled: false
    promotionCompletionThreshold: 0.4
    promotionCtrThreshold: 0.05
    retirementNegativeRateThreshold: 0.2
    trialMinServed: 100
  frequencyAndNearDup:
    enabled: true
    maxSameAuthorPerWindow: 2
    maxSameTagPerWindow: 3
    maxSameTopicPerWindow: 3
    nearDupJaccardMax: 0.8
    softFallbackMinFillPct: 80
  memory:
    dayBucketCardinalityBudget: 10000
    fatigueHalfLifeHours: 72
    impressedTtlHours: 168
    negativeTtlHours: 168
    servedTtlHours: 48
    smembersFallbackAllowed: false
  reporting:
    behaviorBatchMaxSize: 50
    behaviorFlushIntervalMs: 5000
    clientEventIdWindowMs: 86400000
    ingestGlobalRateLimitPerSecond: 5000
    ingestInflightLimit: 256
    ingestRateLimitPerUserPerMinute: 120
  sampling:
    dwellSampleRate: 1.0
    impressionSampleRate: 1.0
    visibleSampleRate: 0.1
  visibility:
    dwellMinReportMs: 1000
    impressionAreaThreshold: 0.5
    impressionMinDwellMs: 1000
guardrails:
- action: suggest_only
  baselinePreset: control
  metric: ctr
  minRatio: 0.95
  minSamples: 1000
  window: 24h
- action: suggest_only
  baselinePreset: control
  metric: dwell
  minRatio: 0.93
  minSamples: 1000
  window: 24h
- action: suggest_only
  baselinePreset: control
  metric: next_day_retention
  minRatio: 0.97
  minSamples: 2000
  window: 168h
