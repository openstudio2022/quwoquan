entity: EventRecord
layer: app_side

description: |
  App 上报三入口的端侧独立场景（不依赖云端）。
  上报链：app_telemetry_transport（/ops/events）、runtime_log_transport（/ops/runtime-logs）、
  startup_telemetry_remote（/ops/startup-events）。

scenarios:
  - name: event_batch_canonical_key
    source: quwoquan_app/test/local_contract/core/telemetry/app_telemetry_outbox__local_contract_test.dart
    assertions:
      - 批体 canonicalJsonEncode 后 sha256 即 Idempotency-Key，字节稳定
      - 断网时批次入队本地 outbox，恢复后按原 key 补传

  - name: runtime_log_redaction
    source: quwoquan_app/test/local_contract/core/observability/runtime_logger__local_contract_test.dart
    assertions:
      - WARN/ERROR 经 redactor 脱敏后才可入 transport
      - 目录外 signal/属性在端侧即拒绝

  - name: startup_batch_no_identity
    source: quwoquan_app/test/local_contract/app/startup_telemetry__local_contract_test.dart
    assertions:
      - startup 批不携带用户身份字段
