log_types: [event, error]
network_classes: [wifi, ethernet, 5g, 4g, mobile, other, none]

ingestion:
  max_batch_items: 50
  max_canonical_body_bytes: 131072
  occurred_at_max_age_hours: 72
  occurred_at_max_future_minutes: 5

common_fields:
  - logType
  - eventType
  - sessionId
  - pageName
  - occurredAt
  - deviceManufacturer
  - deviceModel
  - appVersion
  - networkClass

extension_fields:
  durationMs: { type: int, minimum: 0 }
  result: { type: string, max_length: 128 }
  failReasonCode: { type: string, max_length: 128 }
  errorCode: { type: string, max_length: 128 }
  operationId: { type: string, max_length: 128 }
  httpStatus: { type: int, minimum: 100, maximum: 599 }
  callStack: { type: string_list, max_items: 10, item_max_length: 256, sensitive: true }
  tClickToFirstFrameMs: { type: int, minimum: 0 }
  tFirstFrameToShellMs: { type: int, minimum: 0 }
  tShellToContentMs: { type: int, minimum: 0 }
  tClickToContentMs: { type: int, minimum: 0 }
  hasError: { type: bool }
  action: { type: string, max_length: 128 }
  journey: { type: string, max_length: 128 }
  readyMs: { type: int, minimum: 0 }
  ttffMs: { type: int, minimum: 0 }
  rebufferCount: { type: int, minimum: 0 }
  rebufferMs: { type: int, minimum: 0 }
  seekCount: { type: int, minimum: 0 }
  declaredDurationMs: { type: int, minimum: 0 }
  observedDurationMs: { type: int, minimum: 0 }
  durationMismatch: { type: bool }
  playbackMode: { type: string, max_length: 32 }

events:
  - event_type: page_open
    log_type: event
    required_extensions: []
    optional_extensions: []
    normal_sample_rate: 1.0
    internal_priority: critical

  - event_type: page_return
    log_type: event
    required_extensions: [durationMs]
    optional_extensions: []
    normal_sample_rate: 1.0
    internal_priority: critical

  - event_type: app_startup
    log_type: event
    required_extensions:
      - tClickToFirstFrameMs
      - tFirstFrameToShellMs
      - tShellToContentMs
      - tClickToContentMs
      - hasError
    optional_extensions: []
    normal_sample_rate: 1.0
    slow_threshold_ms: 3000
    internal_priority: critical

  - event_type: runtime_exception
    log_type: error
    required_extensions: [errorCode]
    optional_extensions: [operationId, httpStatus, callStack]
    normal_sample_rate: 1.0
    internal_priority: error

  - event_type: product_action
    log_type: event
    required_extensions: [journey, action]
    optional_extensions: [durationMs, result, failReasonCode]
    normal_sample_rate: 1.0
    internal_priority: critical

  - event_type: performance_sample
    log_type: event
    required_extensions: [operationId, durationMs]
    optional_extensions: [result, failReasonCode]
    normal_sample_rate: 0.1
    internal_priority: normal

  - event_type: operation_result
    log_type: event
    required_extensions: [operationId, result]
    optional_extensions: [durationMs, failReasonCode]
    normal_sample_rate: 1.0
    internal_priority: critical

  - event_type: video_playback_qoe
    log_type: event
    required_extensions:
      - readyMs
      - rebufferCount
      - rebufferMs
      - seekCount
      - playbackMode
    optional_extensions:
      - ttffMs
      - declaredDurationMs
      - observedDurationMs
      - durationMismatch
      - result
      - failReasonCode
    normal_sample_rate: 1.0
    internal_priority: critical
