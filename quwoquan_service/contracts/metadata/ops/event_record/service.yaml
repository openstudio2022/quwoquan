version: 1

service:
  name: product-ops
  domain: ops
  owner: platform-ops-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: OPS_EVENT_RECORD_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure

api_routes:
  - method: POST
    path: /v1/ops/events
    operation: ReportEventBatch
    actor: persona_or_device
    application:
      kind: command
      facet: EventRecordCommandFacade
      method: appendBatch
      append_sink: EventRecord
      mutation_target: EventRecord
      invariant_target: EventRecord
    authorization:
      principal: public
      ownership_policy: authenticated_persona_or_derived_device_actor
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - OPS.USER.unauthorized
      - OPS.USER.invalid_argument
      - OPS.SYSTEM.storage_write_failed
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: redacted
    telemetry:
      metric: ops_event_batch_report
      trace: true
      attributes: [actor_dimension, event_count, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: 统一事件批量写入；服务端只接受已验证主体，并从主体派生匿名 actor hash。
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /v1/ops/events/summary
    operation: GetEventSummary
    actor: account
    application:
      kind: query
      facet: EventAnalyticsQueryFacade
      method: getSummary
      reader: EventSummaryReader
      slice: EventSummarySlice
    description: 统一事件聚合摘要

  - method: GET
    path: /v1/ops/events/drilldown
    operation: GetEventDrilldown
    actor: account
    application:
      kind: query
      facet: EventAnalyticsQueryFacade
      method: getDrilldown
      reader: EventDrilldownReader
      slice: EventDrilldownSlice
    description: 统一事件下钻明细

consumers:
  - name: app
    capabilities: [report_event_batch]
  - name: platform-ops
    capabilities: [read_event_summary, read_event_drilldown]
  - name: recommendation-engine
    capabilities: [consume_event_summary]
  - name: assistant-service
    capabilities: [consume_event_summary]

contract_test:
  mock_strategy:
    app_side:
      scenarios:
        - name: report_event_batch
          route: POST /v1/ops/events
          assertions: [status_200]

    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: miniredis/v2
      spy_targets: [event_publisher]
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: "db.event_records.DeleteMany(ctx, bson.D{})"
      scenarios:
        - name: report_batch_idempotent
          command: ReportEventBatch x2 (same eventId)
          seed: []
          assertions:
            - "db.event_records.CountDocuments({eventId}) → 1"
            - "eventSpy.AssertPublished('EventBatchReported', {eventId, eventType, eventName})"
        - name: get_event_summary_by_page
          command: GetEventSummary
          seed: [fixture.NewEventRecord(eventName='page_open', pageName='home')]
          assertions:
            - "summary.totalCount -> 1"
            - "summary.dimensions.pageName['home'] -> 1"
