domain: ops
entity: EventRecord
object_kind: append_only_fact

description: |
  App 产品事件与异常的严格目录化明细。公共信封固定为九字段，具体 eventType
  只允许 event_catalog.yaml 声明的强类型扩展。原始明细写入阿里云 SLS 三天，
  Portal 只能经 product-ops 查询门面访问；推荐反馈不属于本对象。

storage_backend: aliyun_sls
cache_layer: none
capabilities: [queryable, aggregatable]
taggable: false
vector_enabled: false

ddd_layer_mapping:
  application_ports:
    appenders:
      - services/product-ops-service/internal/application/EventBatchAppender
      - services/product-ops-service/internal/application/StartupBatchAppender
      - services/product-ops-service/internal/application/RuntimeLogBatchAppender
    readers:
      - services/product-ops-service/internal/application/EventAnalyticsReader
      - services/product-ops-service/internal/application/RuntimeLogAnalyticsReader
      - services/product-ops-service/internal/application/RtcMediaQoeSummaryReader
    ledger: services/product-ops-service/internal/application/EventBatchLedger
  adapter_rest: services/product-ops-service/internal/api
  adapter_storage:
    production: services/product-ops-service/internal/infrastructure/telemetry/sls
    integration: services/product-ops-service/internal/infrastructure/telemetry/postgreslocal
    local_contract: services/product-ops-service/internal/infrastructure/telemetry/memory
