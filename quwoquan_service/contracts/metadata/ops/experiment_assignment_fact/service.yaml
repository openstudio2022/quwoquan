api_routes:
- actor: persona_or_device
  auth: required
  application:
    facet: ExperimentAssignmentQueryFacade
    kind: query
    method: getAssignment
    reader: ExperimentAssignmentReader
    slice: ExperimentAssignmentSlice
  authorization:
    principal: public
    ownership_policy: trusted_persona_or_device_subject
  reliability: { timeout_ms: 1000, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required }
  error_codes: [OPS.USER.unauthorized, OPS.USER.forbidden, OPS.USER.experiment_not_found, OPS.USER.assignment_not_found, OPS.SYSTEM.storage_read_failed]
  privacy: { request_classification: PUBLIC, response_classification: SENSITIVE, log_policy: redacted }
  telemetry: { metric: ops_experiment_assignment_read, trace: true, attributes: [operation, experiment_id, actor_dimension, outcome] }
  slo: { latency_p95_ms: 500, availability_percent: 99.9 }
  description: 通过具名 Reader 查询当前已验签 Persona/Device 的不可变实验分配事实
  method: GET
  operation: GetExperimentAssignment
  path: /v1/ops/experiments/{experimentId}/assignment
  response_entity: ExperimentAssignmentFact
- actor: persona_or_device
  auth: required
  application:
    append_sink: ExperimentAssignmentFact
    mutation_target: ExperimentAssignmentFact
    invariant_target: ExperimentAssignmentFact
    facet: ExperimentAssignmentCommandFacade
    kind: command
    method: appendAssignment
  authorization:
    principal: public
    ownership_policy: trusted_persona_or_device_subject
  reliability: { timeout_ms: 1200, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: required }
  error_codes: [OPS.USER.unauthorized, OPS.USER.forbidden, OPS.USER.experiment_not_found, OPS.USER.experiment_not_running, OPS.SYSTEM.storage_read_failed, OPS.SYSTEM.storage_write_failed]
  privacy: { request_classification: PUBLIC, response_classification: SENSITIVE, log_policy: redacted }
  telemetry: { metric: ops_experiment_assignment_append, trace: true, attributes: [operation, experiment_id, actor_dimension, outcome] }
  slo: { latency_p95_ms: 600, availability_percent: 99.9 }
  description: 以 (experimentId, policyVersion, trustedSubjectKey) 幂等追加事实；subject 不接受客户端输入
  method: POST
  operation: AssignExperimentVariant
  path: /v1/ops/experiments/{experimentId}/assignment
  request_body_kind: none
  response_entity: ExperimentAssignmentFact
- actor: account
  auth: required
  application:
    facet: ExperimentAnalyticsQueryFacade
    kind: query
    method: getStats
    reader: ExperimentStatsReader
    slice: ExperimentStatsSlice
  description: 实验统计（运营）
  authorization:
    principal: operator
    scopes: [ops.experiment.read]
    ownership_policy: operator_scope
  reliability: { timeout_ms: 1500, cancellation: supported, retry_mode: idempotent, max_attempts: 2, idempotency: none }
  error_codes: [OPS.USER.unauthorized, OPS.USER.forbidden, OPS.USER.experiment_not_found, OPS.SYSTEM.storage_read_failed]
  privacy: { request_classification: INTERNAL, response_classification: INTERNAL, log_policy: redacted }
  telemetry: { metric: ops_experiment_assignment_stats, trace: true, attributes: [operation, experiment_id, outcome] }
  slo: { latency_p95_ms: 800, availability_percent: 99.9 }
  method: GET
  operation: GetExperimentStats
  path: /v1/ops/experiments/{experimentId}/stats
  response_entity: ExperimentStatsSlice
consumers:
- capabilities:
  - get_experiment_assignment
  name: app
- capabilities:
  - assign_experiment_variant
  - read_experiment_assignment
  - read_stats
  name: platform-ops
- capabilities:
  - get_experiment_assignment
  name: recommendation-engine
contract_test:
  coverage_requirements:
    - deterministic assignment and trusted subject derivation verified
    - PostgreSQL unique constraint and immutable replay verified
    - assignment fact and ExperimentAssigned outbox record committed atomically
    - generated commercial guard remains default-deny until App typed client evidence exists
  current_evidence:
    local_contract:
      - services/product-ops-service/internal/domain/product_ops/experiment/model/experiment__local_contract_test.go
      - services/product-ops-service/tests/local_contract/experiment_http_boundary__local_contract_test.go
    api_integration:
      - services/product-ops-service/tests/api_integration/control_plane_postgres_store__api_integration_test.go
      - services/product-ops-service/tests/api_integration/experiment_http_boundary__api_integration_test.go
    real_engines:
      postgres: embedded-postgres
    assertions:
      - trusted Persona/Device principal derives subject_key; request body cannot spoof actor identity
      - repeated assignment returns one PostgreSQL fact for experiment_id + policy_version + subject_key
      - transactional outbox dispatch retry releases lease and preserves an undispatched event
  commercial_block:
    gap_id: OPS_EXPERIMENT_ASSIGNMENT_FACT_COMMERCIAL_EVIDENCE
    reason: App operation-specific contract, typed Facet/Remote and user_acceptance evidence are not complete
service:
  commercial_defaults:
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: OPS_EXPERIMENT_ASSIGNMENT_FACT_COMMERCIAL_EVIDENCE
    status: blocked
    target_story: app-cloud-business-object-commercial-closure
  domain: ops
  name: product-ops
  owner: platform-ops-team
version: 1
