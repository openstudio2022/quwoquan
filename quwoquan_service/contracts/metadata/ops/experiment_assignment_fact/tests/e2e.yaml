entity: ExperimentAssignmentFact
layer: e2e

description: |
  Product Ops 实验控制面冻结契约。推荐/搜索线上 runtime policy 与实际曝光/查询事实
  是当前唯一商用轨；assignment fact 未完成 durable runtime binding 前不得对 Portal 暴露。

scenarios:
  - name: product_ops_experiment_control_plane_stays_frozen
    steps:
      - generated commercial guard evaluates Experiment and ExperimentAssignmentFact operations
      - operator opens Product Ops Portal
      - recommendation and search serve traffic with runtime policy
    assertions:
      - experiment_operations_default_deny
      - experiment_portal_surface_absent
      - runtime_bucket_is_returned_and_persisted_with_actual_exposure_or_query_fact
