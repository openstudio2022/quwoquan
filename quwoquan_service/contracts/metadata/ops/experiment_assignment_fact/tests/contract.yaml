entity: ExperimentAssignmentFact

scenarios:
  - name: assignment_trusted_subject_and_dedupe
    operation: AssignExperimentVariant
    go_func: TestExperimentAssignmentDerivesSubjectAndRemainsCommerciallyBlocked
    evidence: api_integration
    assertions:
      - subjectKey 由已验签 persona/device 派生；请求体伪造身份返回 400
      - (experimentId, policyVersion, subjectKey) 唯一约束下重复分配返回同一事实
      - 仅首次插入产生 ExperimentAssigned outbox；重放不追加事件
      - generated guard 对 blocked operation 保持 default-deny 403

  - name: assignment_stats_operator_read
    operation: GetExperimentStats
    go_func: TestExperimentHTTPBoundary
    evidence: api_integration
    assertions:
      - 统计只按当前 policyVersion 聚合；历史版本事实保持不可变
