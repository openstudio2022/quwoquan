entity: ConfigSnapshot
layer: user_acceptance
scenarios:
  - name: operator_reviews_release_config_snapshot
    steps:
      - operator opens the config domain catalog (cloud services / app / data / platform)
      - operator selects environment and service to view the release config snapshot
      - operator compares desired hash with instance ACK reports for drift
    assertions:
      - snapshot_files_show_source_path_and_sha256
      - release_versions_limited_to_current_and_previous
      - no_edit_entrypoint_visible_anywhere
