version: 1
domain: ops
aggregate_root: ConfigLayer
object_kind: aggregate_root
description: 平台配置在单一作用域内的版本化权威聚合；配置项值只能经该根校验和提交。
storage_backend: postgres
capabilities: [commandable, queryable, idempotent_commands, transactional_outbox]
taggable: false
vector_enabled: false
members:
  - entity: ConfigEntry
    relation: 1:N
    object_kind: owned_entity
    aggregate_owner: ConfigLayer
    max_cardinality: 256
    description: 有界配置项集合，只能通过 ConfigLayer.setValue 修改。
business_rules:
  - layerId 由完整 global/environment/cluster/service 层级规范化生成，scope 字段创建后不可变
  - 每个 layer 内 config key 唯一且必须存在于 metadata 生成的 ConfigKeyCatalog
  - value kind 必须与 ConfigKeyCatalog 声明类型一致，不接受动态 Map 或隐式类型转换
  - environment、cluster、service 必须与 scopeLevel 一致，禁止跨作用域写入
  - aggregate、idempotency receipt 与 outbox 在同一 PostgreSQL transaction 提交
lifecycle:
  states: [active, retired]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/platform_ops/config_layer/model
  ports: internal/domain/platform_ops/config_layer/ports
  application: internal/application/platform_ops/config_layer
  persistence: internal/infrastructure/platform_ops/config_layer/persistence
  adapter_rest: internal/adapters/http/config_layer
