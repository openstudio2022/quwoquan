aggregate: ConfigLayer
entities:
  ConfigLayer:
    description: 单一 global/environment/cluster/service scope 的版本化配置层
    fields:
      - { name: id, type: string, constraints: [PK, NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: version, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: scopeLevel, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: scopeId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: environment, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: cluster, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: service, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: entries, type: array, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read }
      - { name: status, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: createdAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
  ConfigEntry:
    description: ConfigLayer 拥有的强类型配置值
    fields:
      - { name: key, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: kind, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: stringValue, type: string, constraints: [NULLABLE], classification: SENSITIVE, log_policy: redacted, api_exposure: drop, ops_exposure: read }
      - { name: intValue, type: int, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: floatValue, type: float, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: boolValue, type: bool, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
  SetConfigLayerValueRequest:
    description: ConfigLayer 的强类型设置命令
    fields:
      - { name: layerId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: scopeLevel, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: scopeId, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: environment, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: cluster, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: service, type: string, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: value, type: object, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: redacted, api_exposure: drop, ops_exposure: write }
  SetConfigLayerValueResult:
    description: ConfigLayer 提交后的聚合快照和幂等回执
    fields:
      - { name: layer, type: object, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: redacted, api_exposure: drop, ops_exposure: read }
      - { name: receipt, type: object, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read }
  ConfigLayerSlice:
    description: ConfigLayer named Reader 的强类型切片
    fields:
      - { name: items, type: array, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read }
  ConfigKeyCatalogSlice:
    description: metadata 生成的配置键目录
    fields:
      - { name: items, type: array, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read }
  EffectiveConfigSlice:
    description: 按 global 到 service 优先级解析的配置值及来源
    fields:
      - { name: items, type: array, constraints: [NOT_NULL], classification: SENSITIVE, log_policy: redacted, api_exposure: drop, ops_exposure: read }
      - { name: effectiveHash, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
