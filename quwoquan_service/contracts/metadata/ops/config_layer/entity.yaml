domain: ops
entity: ConfigSnapshot
object_kind: external_reference

description: |
  IaC 配置只读快照。配置的唯一真相源是版本化发布包（服务 configs/default 与
  configs/<env> 树、release config、端侧 app 配置、数据工程 catalog）；
  平台不提供任何在线写路径，快照仅用于查看与漂移核对。

storage_backend: external

capabilities:
  - queryable

taggable: false
vector_enabled: false

ddd_layer_mapping:
  application: services/platform-ops-service/internal/application/platform_ops/config_layer
  adapter_rest: services/platform-ops-service/internal/adapters/http/config_layer

business_rules:
  - 配置值只随发布包变化；任何环境不提供在线编辑、审批或热写入端点。
  - resolve 的 sys.* 有效值 = codegen 键目录 default 叠加发布包 config.yaml 顶层平铺 sys.* 覆盖。
  - 快照必须携带来源文件与 sha256，供实例 ACK 漂移核对。
  - 云侧每个服务仅保留两个 release 配置版本：当前灰度版本与上一个版本。

lifecycle:
  states: [published]
  transitions: []
  notes: 快照无独立生命周期；生命周期由发布包版本管理（发布/回滚）。
