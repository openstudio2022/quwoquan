aggregate: ConfigLayer
backend: postgres
tables:
  platform_config_layers:
    entity: ConfigLayer
    role: authoritative
    pk: id
    columns:
      - { name: id, type: VARCHAR(160), constraints: [PK, NOT_NULL] }
      - { name: version, type: BIGINT, constraints: [NOT_NULL] }
      - { name: scope_level, type: VARCHAR(32), constraints: [NOT_NULL] }
      - { name: scope_id, type: VARCHAR(160), constraints: [NOT_NULL] }
      - { name: environment, type: VARCHAR(64), constraints: [NULLABLE] }
      - { name: cluster, type: VARCHAR(128), constraints: [NULLABLE] }
      - { name: service, type: VARCHAR(128), constraints: [NULLABLE] }
      - { name: entries, type: JSONB, constraints: [NOT_NULL] }
      - { name: status, type: VARCHAR(32), constraints: [NOT_NULL] }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL] }
      - { name: updated_at, type: TIMESTAMPTZ, constraints: [NOT_NULL] }
    indexes:
      - { name: uq_platform_config_scope, columns: [scope_level, environment, cluster, service], unique: true }
      - { name: idx_platform_config_resolution, columns: [environment, cluster, service] }
    optimistic_lock: version
  platform_config_layer_receipts:
    entity: ConfigLayer
    role: authoritative
    pk: [layer_id, idempotency_key]
    columns:
      - { name: layer_id, type: VARCHAR(160), constraints: [PK, NOT_NULL] }
      - { name: idempotency_key, type: VARCHAR(160), constraints: [PK, NOT_NULL] }
      - { name: command_digest, type: VARCHAR(64), constraints: [NOT_NULL] }
      - { name: version, type: BIGINT, constraints: [NOT_NULL] }
      - { name: created_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
  platform_ops_outbox:
    entity: ConfigLayer
    role: append_only
    pk: event_id
    columns:
      - { name: event_id, type: VARCHAR(128), constraints: [PK, NOT_NULL] }
      - { name: event_type, type: VARCHAR(128), constraints: [NOT_NULL] }
      - { name: aggregate_type, type: VARCHAR(128), constraints: [NOT_NULL] }
      - { name: aggregate_id, type: VARCHAR(160), constraints: [NOT_NULL] }
      - { name: payload, type: JSONB, constraints: [NOT_NULL] }
      - { name: occurred_at, type: TIMESTAMPTZ, constraints: [NOT_NULL] }
      - { name: dispatched_at, type: TIMESTAMPTZ, constraints: [NULLABLE] }
      - { name: retry_count, type: INTEGER, constraints: [NOT_NULL], default: 0 }
      - { name: next_attempt_at, type: TIMESTAMPTZ, constraints: [NOT_NULL], default: NOW() }
      - { name: last_error, type: TEXT, constraints: [NOT_NULL], default: "" }
    indexes:
      - { name: idx_platform_ops_outbox_ready, columns: [dispatched_at, next_attempt_at, occurred_at] }
