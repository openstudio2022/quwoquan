version: 1

service:
  name: product-ops
  domain: ops
  owner: platform-ops-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: OPS_VISIT_RECORD_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure

api_routes:
  - method: POST
    path: /v1/ops/visits
    operation: RecordVisit
    actor: persona_or_device
    application:
      kind: command
      facet: VisitRecordCommandFacade
      method: append
      append_sink: VisitRecord
      mutation_target: VisitRecord
      invariant_target: VisitRecord
    authorization:
      principal: public
      ownership_policy: authenticated_persona_or_derived_device_actor
    commercial:
      status: ready
    reliability:
      timeout_ms: 1500
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 2
      idempotency: required
    error_codes:
      - OPS.USER.unauthorized
      - OPS.USER.invalid_argument
      - OPS.SYSTEM.storage_write_failed
    privacy:
      request_classification: SENSITIVE
      response_classification: PUBLIC
      log_policy: redacted
    telemetry:
      metric: ops_visit_record
      trace: true
      attributes: [actor_dimension, target_type, outcome]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.9
    description: 记录访问；服务端从已验证主体派生访问 actor，拒绝客户端指定 userId。
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /v1/ops/visits/stats
    operation: GetVisitStats
    actor: account
    application:
      kind: query
      facet: VisitAnalyticsQueryFacade
      method: getStats
      reader: VisitStatsReader
      slice: VisitStatsSlice
    description: 访问统计（运营）

consumers:
  - name: app
    capabilities: [record_visit]
  - name: platform-ops
    capabilities: [read_stats]
  - name: recommendation-engine
    capabilities: [read_visits]

contract_test:
  mock_strategy:
    app_side:
      scenarios:
        - name: record_visit
          route: POST /v1/ops/visits
          assertions: [status_200]

    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
      spy_targets: [event_publisher]
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: "db.visit_records.DeleteMany(ctx, bson.D{})"
      scenarios:
        - name: visit_recorded
          command: RecordVisit
          seed: []
          assertions:
            - "db.visit_records.FindOne({userId, targetType, targetKey}) → document exists"
            - "eventSpy.AssertPublished('VisitRecorded', {userId, targetType, targetKey})"

        - name: visit_count_increment
          command: RecordVisit x3 (same target)
          seed: []
          assertions:
            - "db.visit_records.FindOne({userId, targetKey}).visitCount → 3"
            - "db.visit_records.FindOne({...}).lastSeenAt → latest timestamp"
