version: 1
aggregate: Experiment
entities:
  Experiment:
    description: 可发布的实验定义
    fields:
      - { name: id, type: string, constraints: [PK, NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: key, type: string, constraints: [NOT_NULL, UNIQUE], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: version, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: status, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: variants, type: array, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: read, ops_exposure: read }
      - { name: audienceRule, type: object, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read }
      - { name: allocationSeed, type: string, constraints: [NOT_NULL], classification: SECRET, log_policy: drop, api_exposure: drop, ops_exposure: drop }
      - { name: startsAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: endsAt, type: timestamp, constraints: [NULLABLE], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: createdAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: updatedAt, type: timestamp, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
  Variant:
    description: Experiment 聚合内的不可独立访问变体值对象
    fields:
      - { name: key, type: string, constraints: [NOT_NULL], classification: PUBLIC, log_policy: allow, api_exposure: read, ops_exposure: read }
      - { name: allocationBasisPoints, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: read, ops_exposure: read }
  AudienceRule:
    description: Experiment 聚合内的不可独立访问受众规则值对象
    fields:
      - { name: kind, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
  UpdateExperimentRolloutRequest:
    description: 更新 Experiment 状态和 draft 期变体权重的强类型命令
    fields:
      - { name: expectedVersion, type: int, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: status, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: write }
      - { name: variants, type: array, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: write }
  UpdateExperimentRolloutResult:
    description: Experiment rollout 提交后的版本化结果
    fields:
      - { name: id, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: status, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: policyVersion, type: string, constraints: [NOT_NULL], classification: INTERNAL, log_policy: allow, api_exposure: drop, ops_exposure: read }
      - { name: variants, type: array, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read }
  ExperimentCatalogSlice:
    description: 运营端实验目录的具名只读 Slice
    fields:
      - { name: items, type: array, constraints: [NOT_NULL], classification: INTERNAL, log_policy: metadata_only, api_exposure: drop, ops_exposure: read }
