entity: Experiment
layer: e2e

scenarios:
  - name: rollout_creates_new_assignment_policy_version
    steps:
      - operator updates experiment rollout through ExperimentCommandFacade
      - a subject requests an assignment for the new policy version
      - operator reads current-version assignment stats
    assertions:
      - previous_assignment_facts_remain_immutable
      - new_policy_version_produces_independent_assignment
      - current_stats_exclude_previous_policy_versions
