openapi: 3.0.3
info:
  title: quwoquan common components
  version: "v1"
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Create/ingest 幂等键。服务端需在 TTL 内去重。
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: 请求 ID（建议分段：<SRC>.<PAGE>.<TS>.<RAND>，端侧/网关可注入）
    XTraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: Trace ID（建议分段：<SRC>.<SESSION>.<PAGE>.<TS>.<RAND>，端侧/网关可注入）
    XParentTraceId:
      name: X-Parent-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: 异步链路父 traceId（MQ/定时任务等触发源头）
    XCausationId:
      name: X-Causation-Id
      in: header
      required: false
      schema:
        type: string
      description: 异步触发载体 ID（messageId/topicOffset 的安全编码/jobRunId 等）
    XClientAccountId:
      name: X-Client-Account-Id
      in: header
      required: false
      schema:
        type: string
      description: 账号安全主体归因提示；authz 必须以网关校验后的 token principal 为准，不信任客户端裸值
    XClientPersonaId:
      name: X-Client-Persona-Id
      in: header
      required: false
      schema:
        type: string
      description: 当前公开业务主体归因提示；服务必须验证其归属与 operation 权限
    XClientDeviceActorId:
      name: X-Client-Device-Actor-Id
      in: header
      required: false
      schema:
        type: string
      description: 游客设备事实主体；只能用于 metadata 明确允许 device actor 的 operation
    XClientOperationId:
      name: X-Client-Operation-Id
      in: header
      required: false
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[A-Z][A-Za-z0-9]+$'
      description: ContractGraph 中的 canonical operation_id
    XClientSurfaceId:
      name: X-Client-Surface-Id
      in: header
      required: false
      schema:
        type: string
      description: metadata codegen 的 surface_id，独立于 route/page/operation
    XClientRouteId:
      name: X-Client-Route-Id
      in: header
      required: false
      schema:
        type: string
      description: metadata codegen 的 route_id，独立于 URL 与 operation
    XReferralSource:
      name: X-Referral-Source
      in: header
      required: false
      schema:
        type: string
      description: 用户旅程来源，用于曝光、点击和转化归因
    XFeedRequestId:
      name: X-Feed-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: 服务端生成的 Feed 请求归因 ID，翻页与后续行为需原样透传
    XShareId:
      name: X-Share-Id
      in: header
      required: false
      schema:
        type: string
      description: 服务端 OutboundShareFact ID，用于站外分享传播链归因
    XModelId:
      name: X-Model-Id
      in: header
      required: false
      schema:
        type: string
      description: 产生当前推荐或推理结果的模型版本标识
    XExperimentBucket:
      name: X-Experiment-Bucket
      in: header
      required: false
      schema:
        type: string
      description: 稳定实验分桶，用于指标切分和回滚归因
    XClientUserId:
      name: X-Client-User-Id
      in: header
      required: false
      schema:
        type: string
      description: ownerID，上下游统一根账号标识
    XClientSubAccountId:
      name: X-Client-Sub-Account-Id
      in: header
      required: false
      schema:
        type: string
      description: subAccountID，对外可见主体标识
    XClientSubAccountContextVersion:
      name: X-Client-Sub-Account-Context-Version
      in: header
      required: false
      schema:
        type: string
      description: subAccount 上下文版本
    XClientPageId:
      name: X-Client-Page-Id
      in: header
      required: false
      schema:
        type: string
      description: 端侧来源标识（推荐三段式：模块.业务对象.页面名/动作，如 chat.conversation.list）
    XClientSessionId:
      name: X-Client-Session-Id
      in: header
      required: false
      schema:
        type: string
      description: 端侧一次启动会话 ID（稳定），用于日志关联与影响范围分析
    XClientSentAt:
      name: X-Client-Sent-At
      in: header
      required: false
      schema:
        type: string
      description: 端侧发送时间（ISO8601），用于端云时延分析
    XClientDevicePlatform:
      name: X-Client-Device-Platform
      in: header
      required: false
      schema:
        type: string
        enum: [android, ios, ohos, web, desktop]
      description: 端侧平台（android/ios/web/desktop 等）
    XClientLocale:
      name: X-Client-Locale
      in: header
      required: false
      schema:
        type: string
      description: BCP 47 客户端区域语言标识
    XClientAppVersion:
      name: X-Client-App-Version
      in: header
      required: false
      schema:
        type: string
      description: 端侧版本标识（用于回归与影响范围定位）
    XClientRegionCode:
      name: X-Client-Region-Code
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]{6}$'
      description: 端侧省级行政区划码（GB/T 2260 六位，如 330000=浙江）；用于灰度路由与影响范围分析，缺失时不参与地域维度匹配
    XClientCarrier:
      name: X-Client-Carrier
      in: header
      required: false
      schema:
        type: string
        enum: [chinamobile, chinaunicom, chinatelecom, chinabroadnet]
      description: 端侧电信运营商；用于灰度路由与网络质量分析，缺失时不参与运营商维度匹配
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 游标分页 cursor
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 分页大小
  schemas:
    ErrorResponse:
      type: object
      required: [code, origin, nature, userMessage, debugMessage, module, kind, reason, location, context]
      properties:
        code:
          type: string
          description: 统一错误码：<MODULE>.<KIND>.<REASON>
          pattern: '^[A-Z_]+\.(USER|SYSTEM|NETWORK|MIDDLEWARE)\.[a-z0-9_]+$'
        origin:
          type: string
          description: 运行时失败来源；由 runtime/errors 统一映射，业务逻辑不得从文案推断
          enum:
            - user
            - environment
            - remoteDependency
            - system
        nature:
          type: string
          description: 运行时失败性质；恢复行为由 RuntimeRecoveryPolicy 决定，不在错误事实中存放恢复判定
          enum:
            - permanent
            - transient
            - requiresPermission
            - bug
        userMessage:
          type: string
          description: 面向用户的友好提示语（可 i18n）
        debugMessage:
          type: string
          description: 面向定位的错误原因（需脱敏）
        module:
          type: string
          description: 错误源模块（如 CONTENT/USER/CHAT/DB/MQ/CACHE）
          enum:
            - GATEWAY
            - ORCH
            - CONTENT
            - CIRCLE
            - ENTITY
            - SEARCH
            - INTEGRATION
            - USER
            - CHAT
            - RTC
            - OPS
            - ASSISTANT
            - NOTIFICATION
            - DB
            - MQ
            - CACHE
            - OSS
            - CDN
            - UNKNOWN
        kind:
          type: string
          description: 运行时失败类型；wire 层使用 runtime kind，不再暴露 current USER/SYSTEM/NETWORK/MIDDLEWARE 作为业务判定字段
          enum:
            - validation
            - auth
            - permission
            - notFound
            - rateLimited
            - timeout
            - network
            - unavailable
            - internal
        reason:
          type: string
          description: 稳定原因码（如 invalid_argument/timeout/connection_refused）
          pattern: '^[a-z0-9_]+$'
        message:
          type: string
          description: 兼容字段（记录），建议等同 debugMessage
        requestId:
          type: string
        traceId:
          type: string
        location:
          type: object
          required: [businessObject, functionModule]
          properties:
            businessObject:
              type: string
            functionModule:
              type: string
            sourceFilePath:
              type: string
            sourceLineNumber:
              type: integer
            sourceLineText:
              type: string
        context:
          type: object
          required: [attributes]
          properties:
            attributes:
              type: array
              items:
                type: object
                required: [key, value]
                properties:
                  key:
                    type: string
                  value:
                    type: string
    CursorPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
