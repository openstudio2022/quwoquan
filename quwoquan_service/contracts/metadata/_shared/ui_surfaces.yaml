    description: 网络结果页（小趣搜 assistant 结果 tab + 圈子频道分类内容结果）
    operation_ids:
      - CreatePost
      - GetNearbyLocations
      - PublishPost
      - SearchLocations
      - SearchPosts
      - GetPost
      - SearchCircles
      - SearchXiaoquResults
      - UpsertRecentSearch

  - id: locationPlaceLanding
    owner: search
    route_id: locationPlaceLanding
    path_template: /locations/{placeId}
    description: 一方地点（location.place）落地页：被内容引用但未绑定主页的临时地点卡 + 提升为实体主页引导（R-S05e-1）
    operation_ids: []

  - id: localDrafts
    owner: content
    route_id: localDrafts
    path_template: /create/drafts
    description: 本地草稿页：续草稿统一入口，展示图片/视频/长文草稿并支持继续编辑、删除与恢复
    operation_ids: []

  - id: homepagePicker
    owner: entity
    route_id: homepagePicker
    path_template: /homepages/picker
    description: 主页搜索与选择器
    operation_ids:
