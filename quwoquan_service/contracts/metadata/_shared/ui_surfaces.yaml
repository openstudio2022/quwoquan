version: 1

surfaces:
  - id: chatList
    owner: chat
    route_id: chat
    path_template: /chat
    description: 趣信列表与会话入口
    operation_ids:
      - ListInbox
      - ListConversations
      - ListConversationTimestamps
      - BatchGetConversations
      - ListContacts
      - SearchContacts

  - id: startGroupChat
    owner: chat
    route_id: startGroupChat
    path_template: /chat/start-group
    description: 全局添加入口的发起讨论页
    operation_ids:
      - CreateConversation
      - ListConversations
      - SearchSocialRelations
      - ListPersonaCircles

  - id: chatDetail
    owner: chat
    route_id: chatDetail
    path_template: /chat/{id}
    description: IM 会话详情
    operation_ids:
      - GetConversation
      - InitMediaUpload
      - CompleteMediaUpload
      - AbortMediaUpload
      - ListMessages
      - SendMessage
      - RecallMessage
      - SyncMessages
      - MarkAsRead
      - GetReceipts

  - id: chatSettings
    owner: chat
    route_id: chatSettings
    path_template: /chat/{id}/settings
    description: 会话设置页
    operation_ids:
      - GetConversation
      - UpdateConversationSettings
      - ListMembers

  - id: chatManage
    owner: chat
    route_id: chatManage
    path_template: /chat/{id}/manage
    description: 讨论管理页
    operation_ids:
      - GetConversation
      - ListMembers
      - UpdateConversationSettings
      - DissolveConversation

  - id: chatAddMembers
    owner: chat
    route_id: chatAddMembers
    path_template: /chat/{id}/add-members
    description: 会话加成员页
    operation_ids:
      - ListMembers
      - AddMembers
      - ListContacts
      - SearchContacts

  - id: chatTransferOwnership
    owner: chat
    route_id: chatTransferOwnership
    path_template: /chat/{id}/transfer-ownership
    description: 群主转让页
    operation_ids:
