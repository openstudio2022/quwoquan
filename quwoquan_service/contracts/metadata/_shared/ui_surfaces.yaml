    operation_ids:
      - ListRecentSearches
      - UpsertRecentSearch
      - DeleteRecentSearch
      - ClearRecentSearches

  - id: globalSearchSuggestions
    owner: search
    route_id: globalSearch
    path_template: /search
    description: 输入后的实时联想页（最常使用、联系人、聊天记录、搜索网络结果）
    operation_ids:
      - SearchContacts
      - SearchSocialRelations
      - SearchConversations
      - SearchMessages
      - SearchCircles
      - ListCircleGroups
      - SearchCircleGroups
      - UpsertRecentSearch

