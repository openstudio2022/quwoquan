      - ListMembers
      - TransferOwnership

  - id: chatAdmins
    owner: chat
    route_id: chatAdmins
    path_template: /chat/{id}/admins
    description: 群管理员页
    operation_ids:
      - GetConversation
      - ListMembers
      - UpdateGroupAdmins

  - id: chatMemberSearch
    owner: chat
    route_id: chatMemberSearch
    path_template: /chat/{id}/member-search
    description: 群成员搜索页（端侧过滤）
    operation_ids:
      - GetConversation
      - ListMembers

  - id: assistantHalfSheet
    owner: assistant
    route_id: assistantPersonal
    path_template: /assistant/personal
    description: 私助半弹层入口
    operation_ids:
      - ReportPageContext
      - GetEntryPersonalization
      - GetSuggestedActions

  - id: personalAssistantDialog
    owner: assistant
    route_id: assistantPersonal
    path_template: /assistant/personal
    description: 找私助云端优先对话入口
    operation_ids:
      - CreateAssistantConversation
      - GetAssistantConversation
      - StartAssistantRun
      - GetAssistantRun
      - StreamAssistantRunEvents
      - ListAppMessages
      - GetAppMessage
      - AckAppMessage
      - ReadAppMessage
      - CreateProfileUpdateProposal
      - GetAppMessageUnreadCount
      - ReportInteractionEvent
      - ReportScorecard
      - ReportPageContext
      - GetEntryPersonalization
      - GetSuggestedActions
      - GetPolicy
      - ListSkills
      - ListAssistantTasks
      - ListAssistantMemories
      - ListConsents
      - GrantSkillConsent
      - RevokeSkillConsent
      - ListSkillSubscriptions
      - CreateSkillSubscription
      - GetSkillSubscription
      - UpdateSkillSubscriptionStatus

  - id: assistantSettings
    owner: assistant
    route_id: chatDetail
    path_template: /chat/{id}
    description: 私助会话设置
    operation_ids:
      - GetPolicy
      - ListSkills
      - ListAssistantTasks
      - ListAssistantMemories
      - ListConsents
      - GrantSkillConsent
      - RevokeSkillConsent

