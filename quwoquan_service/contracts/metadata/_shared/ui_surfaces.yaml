  - id: homepageDetail
    owner: entity
    route_id: homepageDetail
    path_template: /homepages/{id}
    description: 实体（共享主页）统一对象页：身份 / 我的交集 / 打动 / Tab 内容（含详情与阅读壳层、口碑、相关群组）
