
# connectionState 闭集：搜索 hit 与分组编排的唯一连接状态真相源。
# 已连接/已互动结果进入「已连接区」；未连接结果进入「发现区」。
# intersectionReason 为 IntersectionReason 子集（primaryText + sourceRef + dimension +
# intersectionClass + objectKind + avatarUrl + displayName）；端只读 primaryText（G2）。
connection_states:
  - id: connected
    label: 已连接
    description: 用户已加入圈子、已关注对象、已有联系人/会话，或对内容赞/评/转过
    search_zones:
      - connected
  - id: unconnected
    label: 未连接
    description: 与 query 匹配但用户尚未建立持续连接或内容互动
    search_zones:
      - discovery
  - id: intersection_lead
    label: 交集线索
    description: 未连接对象但存在可展示的事实/affinity 交集句，用于发现区交集 Tab 与激发搜索
    search_zones:
      - discovery
      - intersection_tab

# owner_object 是每个 object_type 的唯一登记归属：它必须指向磁盘上真实存在的业务对象，
# 且该对象 object.yaml 的 search_policy.object_type_refs 必须回指同一个 id。execution_strategy
# 与 owner_object 的 search_policy.exposed 是同一事实的两种投影（remote_only=remote /
# hybrid_remote_fallback_local=hybrid / local_only=local_only / filter_only=filter_only），
# 由 verify_object_search_policy_closure.py 双向校验，任何一侧新增或漂移都 BLOCK。
object_types:
  - id: web.document
    label: 网页
    domain: external
    owner_object: assistant.assistant_run
    execution_strategy: remote_only
    provider: web_search
  - id: chat.contact
    label: 联系人
    domain: messages
    owner_object: user.persona_relationship
    execution_strategy: local_only
    provider: chat_local
  - id: chat.conversation
    label: 聊天会话
    domain: messages
    owner_object: chat.conversation
    execution_strategy: local_only
    provider: chat_local
  - id: chat.message
    label: 聊天消息
    domain: messages
    owner_object: chat.message
    execution_strategy: local_only
    provider: chat_local
  - id: circle.group
    label: 讨论
    domain: circle
    owner_object: circle.circle_group
    execution_strategy: hybrid_remote_fallback_local
    provider: circle_remote_local
  - id: circle.circle
    label: 圈子
    domain: circle
    owner_object: circle.circle
    execution_strategy: remote_only
    provider: circle_remote
  - id: content.post
    label: 内容
    domain: content
    owner_object: content.post
    execution_strategy: remote_only
    provider: content_remote
  # 第一方地点对象（R-S05e）：被内容引用、尚未绑定 canonicalEntity 的自由文本地点聚合
  # 去重后的快照对象。由 content 域灌入统一索引，复用跨对象 geo 维度承载坐标/地名。
  - id: location.place
    label: 地点
    domain: content
    owner_object: content.post
    execution_strategy: remote_only
    provider: content_remote
  - id: entity.homepage
    label: 主页
    domain: entity
    owner_object: entity.homepage
    execution_strategy: remote_only
    provider: homepage_remote
  # user.profile 的 owner 是 user.user_account：可搜索用户文档由 account 生命周期
  # （accountState=active）决定，投影函数与 SearchIndexView 消费的
  # user.user_account.UserSuspended/UserRestored 事件同源。它不是 user.persona。
  - id: user.profile
    label: 用户
    domain: user
    owner_object: user.user_account
    execution_strategy: remote_only
    provider: user_profile_remote
  - id: tag
    label: 标签
    domain: tag
    owner_object: tag.tag_node_view
    # TagNodeView 是 taxonomy/filter projection；没有独立结果落地页，因此不进入
    # RetrieveTarget 或结果 section。未来若提升为可导航对象，必须另行登记 route/surface。
    execution_strategy: filter_only
    provider: taxonomy_filter
  - id: integration.location_poi
    label: 位置
    domain: integration
    owner_object: integration.location
    execution_strategy: remote_only
    provider: location_remote

# CitationDestination 是搜索、助手 grounding 与回答引用共用的唯一落点形态。
# internal 只承载 canonical object type/id，由 link_templates.yaml codegen 生成路由；
# external 只承载经过 HTTPS 校验的 URL。未知对象或缺失落点必须不渲染为可点击引用。
citation_destination:
  internal:
    object_type_source: _shared/link_templates.yaml#citation_destinations
    required_fields: [objectTypeRef, objectId]
  external:
    required_fields: [url]
    allowed_schemes: [https]

# AI/App-facing target taxonomy. These are the ONLY object names exposed on the
# retrieve contract; internal object_types stay implementation details.
ai_targets:
  - id: article
    label: 文章
    object_type: content.post
    content_type: article
    description: 文字为主题的文章
  - id: photo
    label: 图文
    object_type: content.post
    content_type: image
    description: 发图配文，图片为主体、文字为说明
  - id: video
    label: 视频
    object_type: content.post
    content_type: video
    description: 视频内容
  - id: user
    label: 用户
    object_type: user.profile
    description: 用户或创作者公开资料
  - id: entity
    label: 实体主页
    object_type: entity.homepage
    description: 景点、地点、品牌、学校等实体主页
  - id: location
    label: 地点
    object_type: location.place
    description: 被内容引用但尚未绑定实体主页的第一方自由文本地点（去重快照；提升为实体后由 entity 承载）
  - id: circle
    label: 圈子
    object_type: circle.circle
    description: 圈子
  - id: group
    label: 讨论
    object_type: circle.group
    description: 圈子或组织下的讨论
  - id: chat
    label: 聊天
    object_type: chat.message
    description: 聊天会话与消息片段（按权限返回）

# 跨对象 geo/地点维度（R-S05e）。geo 是挂在统一检索文档上的可选结构化维度：任意对象
# 类型用同一组字段附加地点，并支持「附近(geo 半径)」检索/排序。这是该维度的单一描述
# 真相源，runtime/search.Document.Geo + Fields(placeId/placeName)、es index mapping
# (geo/placeId/placeName)、search_contract.filter(near)/hit(geo/distanceKm/placeName)
# 均与此对齐。
#
# location 既是该跨对象维度，也有一类复用该维度的第一方对象 target：location.place
# （见 object_types/ai_targets 的 location）。location.place 仅覆盖「被内容引用、但尚未
# 绑定 canonicalEntityId/primaryHomepageId 的自由文本地点」，由 content 域聚合去重为第一方
# 快照对象；一旦该地点绑定为 canonicalEntity（成为 entity.homepage），其 location.place
# 对象即被删除——同一地点只出现一次（未提升=location.place、已提升=entity.homepage），
# geo 机制只有一套，二者互斥不重复。
location_dimension:
  description: 跨对象 geo 维度 + 第一方 location.place 对象；未绑定 canonicalEntity 的自由文本地点由 location.place 承载，已绑定者由 entity.homepage 承载，二者互斥不重复（单一真相源）。
  fields:
    - id: geo
      type: geo_point
      description: 结构化经纬度(lat/lng)；仅在对象有真实坐标时填充，禁止编造。
    - id: placeId
      type: keyword
      description: 关联地点(通常是 entity.homepage)的稳定 id；对象本身即地点时可省略。
    - id: placeName
      type: text
      description: 人类可读地点名(城市/地名/发布地)。
  near_filter:
    description: filters.near(lat/lng/radiusKm) 表达"附近"，对带 geo 的候选做硬半径过滤 + 邻近加权。
  # 各对象类型 location 接入状态：populated=已落地真实字段；extension=零契约改动即可接入。
  object_population:
    - object_type: entity.homepage
      status: populated
      source: Homepage.location(GeoPoint) -> geo；Homepage.city -> placeName
    - object_type: content.post
      status: populated
      source: Post.location(GeoPoint) -> geo(非零时)；Post.locationName -> placeName
    - object_type: user.profile
      status: extension
      source: 用户模型暴露常驻地/活动坐标时，在 ProjectUserProfileToSearchDocument 填 Geo/placeName
    - object_type: circle.circle
      status: extension
      source: 圈子模型暴露地点/坐标时，在 ProjectCircleToSearchDocument 填 Geo/placeName

section_kinds:
  - id: contacts
    title: 联系人
    default_object_types:
      - chat.contact
  - id: chat_records
    title: 聊天记录
    default_object_types:
      - chat.conversation
      - chat.message
  - id: groups
    title: 讨论
    default_object_types:
      - circle.group
      - circle.circle
  - id: content
    title: 内容
    default_object_types:
      - content.post
  - id: homepages
    title: 主页
    default_object_types:
      - entity.homepage
  - id: locations
    title: 位置
    default_object_types:
      - location.place
      - integration.location_poi
  - id: web
    title: 网页
    default_object_types:
      - web.document
  - id: users
    title: 用户
    default_object_types:
      - user.profile
