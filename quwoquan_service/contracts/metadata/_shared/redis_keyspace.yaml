
# Redis 键空间规范 + Scene 路由
#
# 统一由 runtime/redis.Router 消费。上层通过 Router.Scene(name) 或
# Router.ForKey(key) 访问，不感知底层 standalone/cluster 拓扑。
#
# ═══════════════════════════════════════════════════════════════════
# Scene 路由表（runtime/redis.Router prefix_routing 的唯一真相）
# ═══════════════════════════════════════════════════════════════════
#
# scene_routing.scenes.{name}.key_prefixes 定义 key prefix → scene 映射。
# Router.ForKey(key) 按最长前缀匹配路由；未匹配 → fallback scene。
#
# 每个 scene 可独立部署为 standalone / cluster Redis 实例，
# 弹性扩缩仅改 config YAML，上层零代码改动。
#
# ═══════════════════════════════════════════════════════════════════
# Redis Cluster 哈希标签约定（{tag}）
# ═══════════════════════════════════════════════════════════════════
#
# 同一聚合 / 同一用户的 session 级键使用 {tag} 确保同 slot：
#   rec 场景：{userId}     — 同用户 session key 同 slot，pipeline 安全
#   realtime 场景：{conversationId} — 同会话 seq/dedup/presence 同 slot
#
# standalone 模式下 Redis 忽略花括号，行为完全一致。
#
# ═══════════════════════════════════════════════════════════════════
# 多云兼容性
# ═══════════════════════════════════════════════════════════════════
#
# 阿里云 Tair 集群版 / 火山引擎 VeCache 均遵循 Redis Cluster 协议，
# 无需代码差异，仅配置差异（addrs / password / tls）。

scene_routing:
  fallback: general
  scenes:
    rec:
      description: 推荐热路径（session signals / served / impressed / negative / realtime_interest）
      requirements: 高 QPS、低延迟（< 100ms）、可独立水平扩容
      key_prefixes: ["rec:"]
    general:
      description: 实体缓存、助手上下文、安全限流、计数缓冲、互动状态
      requirements: 读多写少、TTL 较长、延迟容忍度更高
      key_prefixes:
        - "cache:"
        - "ix:"
        - "events.content."
        - "events.circle."
        - "events.search."
        - "events.chat."
        - "events.integration."
        - "page_ctx:"
        - "assistant:"
        - "content_analysis:"
        - "content:publication-rate:"
        - "comment_summary:"
        - "suggested_actions:"
        - "blocked_set:"
        - "device_tokens:"
        - "login_fail:"
        - "counter:"
        - "reaction:"
        - "privacy:"
    realtime:
      description: 实时推送 Pub/Sub、消息序号、在线状态、消息幂等去重
      requirements: 超低延迟、Pub/Sub 流量模式与 K/V 不同、必须独立部署
      key_prefixes:
        - "rt:"
        - "seq:"
        - "presence:"
        - "dedup:"

# ═══════════════════════════════════════════════════════════════════
# Key Patterns（按 scene 分组）
# ═══════════════════════════════════════════════════════════════════

key_patterns:

  - pattern: "privacy:closed_subject:<hmacSha256>"
    redis_scene: general
    ttl_seconds: null
    type: string
    description: |
      UserAccountClosed 防复活栅栏的共享快速读副本。键只包含独立密钥计算的
      HMAC-SHA256，不得包含 userId/personaId 原文；Mongo durable tombstone 是恢复
      真相源。注销清理先提交 durable tombstone，再写该键，行为/搜索/关系/学习/
      训练写入命中后 fail-closed。

  - pattern: "privacy:open_subject:<hmacSha256>"
    redis_scene: general
    ttl_seconds: 300
    type: string
    description: |
      在线写路径对 Mongo durable tombstone 未命中的短期负缓存。键仅包含同一
      HMAC-SHA256；任何 UserAccountClosed 处理先写 closed_subject，再删除本键。
      所有消费者必须先检查 closed_subject，因此本键不得绕过已提交的注销状态。

  # ─── rec 场景 ────────────────────────────────────────────────────
  - pattern: "rec:session_signals:{<userId>}:<sessionId>"
    redis_scene: rec
    ttl_seconds: 1800
    type: hash
    hash_tag: userId
    description: |
      Session 内实时兴趣标签权重（HIncrByFloat）。
      哈希标签 {userId} 与 rec:served / rec:impressed / rec:negative 共享同一 slot，
      使 GetSessionState pipeline 读在单个 RTT 内完成。

  - pattern: "rec:served:{<userId>}:<yyyyMMdd>"
    redis_scene: rec
    ttl_seconds: 172800
    type: set
    hash_tag: userId
    description: |
      服务端已下发内容 ID（served）。按 user+day 分桶，只用于短窗口翻页 /
      刷新去重，不代表用户真实看见，也不得直接作为训练正样本。
      Feed 过滤路径必须对候选集做 SISMEMBER 点查或等价批量点查，禁止长窗口
      SMEMBERS 全量回读。

  - pattern: "rec:impressed:{<userId>}:<yyyyMMdd>"
    redis_scene: rec
    ttl_seconds: 604800
    type: set
    hash_tag: userId
    description: |
      端侧达到可见面积 + 停留阈值后的真实曝光内容 ID（impressed）。
      按 user+day 分桶，供跨会话疲劳、训练样本派生与曝光健康统计消费。
      过滤路径必须做候选 membership 点查，不得按用户全量拉取。

  - pattern: "rec:negative:{<userId>}"
    redis_scene: rec
    ttl_seconds: 604800
    type: set
    hash_tag: userId
    description: |
      用户级负反馈过滤集（dislike / report / hide_author / hide_content_type 等）。
      不绑定 session，供未来窗口跨会话即时过滤；TTL 7 天，优先级高于
      served/impressed/dwell/动态预算。

  - pattern: "rec:event_dedup:{<userId>}:<clientEventId>"
    redis_scene: rec
    ttl_seconds: 86400
    type: string
    hash_tag: userId
    description: |
      行为上报幂等键。端侧每个事件生成 clientEventId，云侧 SET NX 写入本 key；
      已存在则跳过行为写入和特征投影，避免弱网重试或双通道重复计数。

  - pattern: "rec:hidden_authors:{<userId>}"
    redis_scene: rec
    ttl_seconds: 604800
    type: set
    hash_tag: userId
    description: |
      用户明确选择减少/不想看该作者后的作者级过滤集（hide_author）。
      不绑定 session，供推荐未来窗口跨会话即时过滤；TTL 7 天，后续可由曝光治理策略动态调整。

  - pattern: "rec:hidden_types:{<userId>}"
    redis_scene: rec
    ttl_seconds: 604800
    type: set
    hash_tag: userId
    description: |
      用户明确选择减少此类内容后的内容类型过滤集（hide_content_type）。
      不绑定 session，供推荐未来窗口跨会话即时过滤；TTL 7 天，后续可由曝光治理策略动态调整。

  - pattern: "rec:realtime_interest:{<userId>}:<sessionId>"
    redis_scene: rec
    ttl_seconds: 1800
    type: string
    hash_tag: userId
    description: Session 实时兴趣向量（最近一次行为信号的 JSON 快照）

  - pattern: "rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:<windowId>"
    redis_scene: rec
    ttl_seconds: 600
    type: string
    hash_tag: quotaShard
    max_value_bytes: 2097152
    max_items: 300
    default_page_depth: 8
    max_active_per_subject: 8
    quota_shard_count: 256
    max_live_records_per_quota_shard: 128
    max_live_bytes_per_quota_shard: 134217728
    global_max_live_records: 32768
    global_max_live_bytes: 34359738368
    quota_index_pattern: "rec:ranked_feed_window_index:{rfw-<quotaShard>}"
    quota_metadata_pattern: "rec:ranked_feed_window_metadata:{rfw-<quotaShard>}"
    quota_config:
      shard_count: sys.content-service.feed.ranked_window_quota_shard_count
      records_per_shard: sys.content-service.feed.ranked_window_maximum_live_records_per_shard
      bytes_per_shard: sys.content-service.feed.ranked_window_maximum_live_bytes_per_shard
    create_operation: lua_same_quota_shard_set_nx_with_key_and_byte_admission
    description: |
      subjectHash 为 canonical 窗口配额主体的 SHA-256 前 128 bit 十六进制：具名/
      已验证设备请求使用命名空间化 actorId，无身份公开请求使用命名空间化
      sessionId，禁止使用全局匿名 fallback actor 作为存储或配额键。键中只保留
      主体摘要，不暴露 actorId/sessionId。推荐域不可变、未压缩
      RankedFeedWindow JSON，默认冻结 8 个完整请求页、最多 300 项且硬限
      2,097,152 bytes，以 (ordinal, contentId) 形成总序。canonical local_contract 的
      典型 300 项样本约 1.5 MiB，可进入窗口；高密度 300 项样本约 3.0 MiB，必须拒绝并
      停止签发 continuation，不得静默截断。生产编码器必须按 item 逐块累计完整 wire
      bytes，越过剩余预算时立即停止并拒绝；禁止先物化无界整窗 JSON 后才检查大小。
      subjectHash 由固定 256 个 quotaShard 确定性承载；默认全族硬上限为
      256 * 128 = 32,768 个 live value、256 * 128 MiB = 32 GiB live payload。
      这是业务准入上限而非 Redis maxmemory 或环境容量证明。Lua 在同一 quotaShard
      slot 内原子执行 SET NX、过期/缺失成员清理、每主体最多 8 个窗口淘汰以及分片
      live key/live byte 拒绝；分片已满只拒绝 contender，禁止淘汰其他主体。
      Cluster adapter 只预读 max_live_records_per_quota_shard + 1 个索引成员并把当前
      value key 全部显式列入 EVAL KEYS；Lua 自身也只读取同一硬界内成员。并发导致
      索引出现未声明成员时脚本不写入并做有界重试，严禁动态构造 Redis key、全量
      SCAN/KEYS/ZRANGE 或可漂移 mutable counter。winner replay 不重复计入 bytes，
      过期/缺失 value 清理必须同步删除 index/metadata 并精确扣除 bytes。
      创建后 value TTL 不滑动，读取禁止 EXPIRE 续期。窗口同时绑定
      actor/session/route、active release/manifest digest、candidate watermark 以及
      policy/model/feature/ranking/reason 版本；任一失配或键缺失必须 fail-closed，
      不得实时重算、offset 续接或回退 Mongo _id。
      key 与 payload 都是唯一 canonical schema，不含协议版本前缀或 schema-version
      信封；任何非 canonical key/payload 均不读写，禁止 dual-read、shim 或依赖
      maxmemory 作为业务配额。

  - pattern: "rec:ranked_feed_window_index:{rfw-<quotaShard>}"
    redis_scene: rec
    ttl_seconds: 600
    type: sorted_set
    hash_tag: quotaShard
    max_members: 128
    member: "rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:<windowId>"
    score: redis_server_expires_at_microseconds
    description: |
      RankedFeedWindow 固定配额分片索引，与 value/metadata 使用相同 quotaShard
      slot。每个分片最多 128 个 live 成员；Lua 创建时先清理过期或缺失 value，
      再按 metadata 的 subjectHash 只淘汰该主体最老窗口。第 9 个主体窗口必须原子
      删除最老 value/index/metadata；分片 key/byte 上限命中则无写入拒绝。
      index TTL 可随新窗口创建延长，value TTL 严禁滑动。

  - pattern: "rec:ranked_feed_window_metadata:{rfw-<quotaShard>}"
    redis_scene: rec
    ttl_seconds: 600
    type: hash
    hash_tag: quotaShard
    max_fields: 128
    field: "rec:ranked_feed_window:{rfw-<quotaShard>}:<subjectHash>:<windowId>"
    value: "<subjectHash>:<payloadBytes>"
    description: |
      与 index 一一对应的 owner digest + 精确 payload bytes 元数据。Lua 每次只在
      有界 index 上重算 live key/live bytes，不维护可漂移计数器；任一缺失、非法
      或 value 实际 bytes 不一致必须 repair_bound fail-closed。

  - pattern: "rec:feed_delivery_page:{fdp-<quotaShard>}:<scopeHash>:<deliveryPageId>"
    redis_scene: rec
    ttl_seconds: 600
    type: string
    hash_tag: quotaShard
    max_value_bytes: 65536
    max_items: 20
    max_object_cards: 20
    max_active_per_scope: 400
    quota_shard_count: 256
    max_live_records_per_quota_shard: 512
    max_live_bytes_per_quota_shard: 33554432
    global_max_live_records: 131072
    global_max_live_bytes: 8589934592
    quota_index_pattern: "rec:feed_delivery_page_index:{fdp-<quotaShard>}"
    quota_metadata_pattern: "rec:feed_delivery_page_metadata:{fdp-<quotaShard>}"
    quota_config:
      shard_count: sys.content-service.feed.delivery_page_quota_shard_count
      records_per_shard: sys.content-service.feed.delivery_page_maximum_live_records_per_shard
      bytes_per_shard: sys.content-service.feed.delivery_page_maximum_live_bytes_per_shard
    create_operation: lua_same_quota_shard_set_nx_with_key_and_byte_admission
    description: |
      content.Post.GetFeed 已交付页的未压缩只追加 JSON。scopeHash 为 actor/session/
      route/pageSize 规范元组的 SHA-256，不暴露原始主体。每页只保存已交付 Post
      identity 顺序、对象卡公开快照与 anchor、previous page identity、原始 outbound
      cursor、feedRequestId、release/version 与固定 expiry；previous cursor 只能读取该
      记录（含原推荐归因）并按原顺序执行当前可见性 hydration，不得重新 recall、重排、反向 live query
      或补入替代内容。value TTL 不滑动；同 scope 最多 400 页，覆盖最多 8 个活跃
      RankedFeedWindow 各 50 页的 cursor 深度。scopeHash 由固定 256 个 quotaShard
      确定性承载；默认全族硬上限为 256 * 512 = 131,072 个 live value、
      256 * 32 MiB = 8 GiB live payload。Lua 与 RankedFeedWindow 复用同一有界
      原子准入契约：显式 EVAL KEYS、无动态 key/无全量 scan/无 mutable counter；
      每 scope 淘汰仅作用于自身，分片 key/byte 已满拒绝 contender 且不得淘汰其他
      scope。任何原子能力缺失、repair bound、payload 冲突或 quota 拒绝均
      fail-closed。key 与 payload 都是唯一 canonical schema，不含协议版本前缀或
      schema-version 信封；禁止 dual-read/shim。

  - pattern: "rec:feed_delivery_page_index:{fdp-<quotaShard>}"
    redis_scene: rec
    ttl_seconds: 600
    type: sorted_set
    hash_tag: quotaShard
    max_members: 512
    member: "rec:feed_delivery_page:{fdp-<quotaShard>}:<scopeHash>:<deliveryPageId>"
    score: redis_server_expires_at_microseconds
    description: |
      FeedDeliveryPage 固定配额分片索引，与 value/metadata 使用相同 quotaShard
      slot；新页原子追加时清理过期记录并按 scope 淘汰最老页，分片最多 512 个
      live member，读取不得延长 value TTL。

  - pattern: "rec:feed_delivery_page_metadata:{fdp-<quotaShard>}"
    redis_scene: rec
    ttl_seconds: 600
    type: hash
    hash_tag: quotaShard
    max_fields: 512
    field: "rec:feed_delivery_page:{fdp-<quotaShard>}:<scopeHash>:<deliveryPageId>"
    value: "<scopeHash>:<payloadBytes>"
    description: |
      与 FeedDeliveryPage index 一一对应的 scope digest + payload bytes 元数据；
      Lua 从有界 index 精确重算分片 live key/live bytes，异常 metadata 必须
      repair_bound fail-closed。

  - pattern: "rec:icool:{<userId>}"
    redis_scene: rec
    ttl_seconds: 2592000
    type: sorted_set
    hash_tag: userId
    description: |
      交集推荐跨会话冷却集（intersection cooldown）。
      member = 交集对象 id，score = 冷却过期 unix 秒。
      交集曝光未转化即 ZADD（默认 14 天，policy.yaml intersectionCooldownDays 可配）；
      下发前 ZRANGEBYSCORE (now, +inf) 视为冷却中并排除，过期成员自然解禁。
      TTL 30 天为兜底上限，避免无限增长（与会话级 rec:exposed 区分）。

  - pattern: "rec:ineg:{<userId>}"
    redis_scene: rec
    ttl_seconds: 5184000
    type: sorted_set
    hash_tag: userId
    description: |
      交集负反馈冷却集（intersection negative-feedback cooldown，F 推荐与交集配对差异化）。
      member = 交集主体对象 id（subjectId），score = 冷却过期 unix 秒。
      用户对交集条目显式负反馈（feedbackKind ∈ registry.feedbackKinds：notInterested /
      dismiss / rejectGreeting / leaveCircle）即 ZADD（默认 30 天，policy.yaml
      intersection.negativeFeedbackCooldownDays 可配）。
      与 rec:icool 分离：曝光冷却 seen 仅降权保留，负反馈冷却在下发前 ZRANGEBYSCORE (now, +inf)
      命中即「过滤不再推荐」（更强、语义正确、可观测）。TTL 60 天为兜底上限。

  # ─── general 场景 ────────────────────────────────────────────────
  - pattern: "cache:{entity}:{id}"
    redis_scene: general
    ttl_source: aggregate.cache_ttl_seconds
    type: string
    description: 实体级读缓存（runtime/redis.NewCacheAdapter → Repository 缓存装饰器）

  - pattern: "page_ctx:{userId}"
    redis_scene: general
    ttl_seconds: 300
    type: string
    description: 助手当前页面最小强类型 context snapshot JSON（仅对象引用、结构化动作与当前页授权）

  - pattern: "assistant:subscription:lease:{subscriptionId}:{deliveryId}"
    redis_scene: general
    ttl_seconds: 300
    type: string
    description: 主动订阅首次调度及失败补偿共用 deliveryId 的跨实例租约；只有 SetNX 成功的实例可进入外部副作用。

  - pattern: "assistant:subscription:delivery_slot:{subscriptionId}:{utcDate}:{slot}"
    redis_scene: general
    ttl_seconds: 172800
    type: string
    description: 主动订阅 UTC 自然日投递配额槽；成功后保留，失败时按持有值校验释放，原子限制 maxPerDay。

  - pattern: "ix:watermark:{<userId>}"
    redis_scene: general
    ttl_seconds: 7776000
    type: hash
    hash_tag: userId
    description: |
      「我的交集」收件箱 per-dimension 已读水位（HSet field=dimension, value=已读 unix 秒）。
      MarkVisited 写入对应维度水位，Summary/List 读路径据此把 ≤ 水位的事实判为已读。
      D1 修复：原 cache:viewer_intersections（string 快照语义）被误作 hash 使用，造成类型/语义
      冲突；水位迁出到独立 hash key（ix: 前缀走 general scene），与读模型聚合快照彻底分离。
      hash_tag {userId} 保证同用户水位落同一 slot；TTL 90 天覆盖长周期已读状态。

  - pattern: "content_analysis:{postId}"
    redis_scene: general
    ttl_seconds: 86400
    type: hash
    description: 内容多模态分析缓存

  - pattern: "content:publication-rate:persona:<personaHash>:<bucket>"
    redis_scene: general
    ttl_seconds: 70
    type: string
    description: |
      发布频控 Persona 窗口计数（SubmitPostPublication 准入，
      publication_policy.yaml 的 personaRateWindowSeconds=60 / maxPublications
      策略常量经 codegen 消费；CONTENT.USER.rate_limited 的唯一实现载体）。
      personaHash 为 personaId 摘要，不落明文；TTL = 窗口 + 10s 余量。

  - pattern: "content:publication-rate:intent:<intentHash>:<bucket>"
    redis_scene: general
    ttl_seconds: 70
    type: string
    description: |
      发布频控 intent 级裁决缓存（allowed/limited/pending 三态）。同一
      publishIntentId 的重试复用首次裁决结果，保证幂等重放永不重复计数；
      依赖错误 fail-closed（准入语义，不能把 pending 当 allow 绕过限流）。

  - pattern: "comment_summary:{postId}"
    redis_scene: general
    ttl_seconds: 3600
    type: hash
    description: 评论总结缓存

  - pattern: "suggested_actions:{userId}:{pageType}:{objectId}"
    redis_scene: general
    ttl_seconds: 300
    type: string
    description: Suggested Actions 缓存

  - pattern: "blocked_set:{userId}"
    redis_scene: general
    ttl_seconds: 3600
    type: set
    description: 屏蔽用户列表（安全过滤）

  - pattern: "device_tokens:{userId}"
    redis_scene: general
    ttl_seconds: 3600
    type: set
    description: 设备推送 token

  - pattern: "login_fail:{userId}"
    redis_scene: general
    ttl_seconds: 1800
    type: string
    description: 登录失败滑动窗口计数（限流）

  - pattern: "counter:{postId}:{type}"
    redis_scene: general
    ttl_seconds: null
    type: string
    description: |
      热点内容计数缓冲（异步回写 MongoDB）。type=comment 时承载帖级评论数
      （counter:{postId}:comment），由 RedisCommentStore 读穿 + 写失效，权威值来自
      Mongo comments 集合 CountDocuments（含二级、排除软删）。

  # 评论排行 ZSet（comment_hot / comment_recommended）、赞踩集合镜像
  # （comment_like / comment_dislike）与 per-comment 读穿计数器
  # （counter:comment:{commentId}:like|dislike）已删除：均为只写不读写放大，
  # 且 per-comment 计数器读穿回填存在 stale-backfill 竞态。评论排序读路径直接
  # 走 Mongo 复合索引 keyset 分页，赞踩计数由 comment_reactions 集合权威派生。
  # 详见 services/content-service/contracts/content/post/storage.yaml 与 R-CMT01 回写。

  - pattern: "reaction:{userId}:{postId}"
    redis_scene: general
    ttl_seconds: 300
    type: hash
    description: 互动状态缓存（like）

  - pattern: "cache:group_avatar:{conversationId}"
    redis_scene: general
    ttl_seconds: 86400
    type: string
    description: 群组合成头像 CDN URL 缓存（24h TTL，头像变更时主动失效）

  - pattern: "rt:resume:chat:user:{accountId}"
    redis_scene: realtime
    ttl_seconds: 86400
    type: stream
    description: |
      chat-service 按可信接收者写入的短期可重放实时事件流。realtime-gateway 只从
      已验签 accountId 派生 stream，客户端仅提交上次确认的 Redis stream cursor；
      设备之间不共享 ACK。eventId/messageId/seq 负责应用层幂等，Chat Mongo 与
      /chat/messages/sync 仍是消息权威与 gap 修复真相源。

  - pattern: "events.search.recommendation_signals"
    redis_scene: general
    ttl_seconds: 86400
    type: stream
    description: |
      搜索 → 推荐短期特征流。query 信号只带归一化词，click 信号只带真实点击对象；
      content-service 消费组投影到具备物理 TTL 的 rm_search_intent。
      确定性坏消息进入脱敏 DLQ 并 ACK，暂态投影失败保留 PEL 重试。

  - pattern: "events.search.recommendation_signals.dlq"
    redis_scene: general
    ttl_seconds: 86400
    type: stream
    description: 搜索推荐坏消息的脱敏隔离流，只保存 sourceStreamId、signalDigest、稳定错误码和隔离时间。

  - pattern: "events.search.recommendation_signals.dedup:{signalDigest}"
    redis_scene: general
    ttl_seconds: 86400
    type: string
    description: content-service 按 signalId SHA-256 建立的消费幂等键。

  - pattern: "events.chat.assistant_mentions"
    redis_scene: general
    ttl_seconds: null
    type: stream
    description: |
      chat-service 发布的 @小趣 可靠事实流。assistant-service 使用独立 consumer group
      拉取对话上下文并经 chat-service 回帖；重复投递必须由 conversationId + messageId
      幂等键抑制，Redis Stream 仅承载可重放传输，不替代 chat 消息权威存储。

  - pattern: "events.chat.assistant_mentions.dlq"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: |
      assistant-service 处理 @小趣 事实失败后的可重放死信。仅在原消息成功写入本流、
      刷新七天保留期且已从源 consumer group ACK 后计入
      assistant_mentioned_consumer_dlq_total；保留重放所需事件字段与错误摘要，不写入原始错误。

  - pattern: "events.content.post_lifecycle"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: |
      content-service 从 Post 权威 Mongo outbox 以独立 checkpoint 投递的跨上下文事实流。
      circle-service 与 recommendation-service 通过各自 consumer group、Mongo inbox 和版本投影
      维护 Post 外部引用及候选索引；
      重复 XADD 或 pending reclaim 不得重复产生业务副作用。持续写入会刷新 7 天保留期，
      全量 rebuild 由 Post outbox 重置专属投递 checkpoint 后重放，不以 Redis 作为权威存储。

  - pattern: "events.content.post_lifecycle.dlq"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: Circle Post 外部引用投影连续失败后的不可变死信；保留原 eventId、streamId 与错误摘要。

  - pattern: "events.content.post_lifecycle.recommendation_candidate.dlq"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: RecommendationCandidateIndexView 连续失败后的不可变死信；只保留源坐标、事件身份、尝试次数和截断错误。

  - pattern: "events.content.behavior_facts"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: |
      content-service 从 ContentBehaviorFact 权威 Mongo 事实以独立 checkpoint 投递的可重放事实流。
      recommendation-service 使用对象专属 consumer group 与事实唯一键幂等处理，禁止读取 Content Mongo 或直接写 Content 投影。

  - pattern: "events.content.behavior_facts.recommendation-feedback.dlq"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: RecommendationFeedbackFact 连续失败后的脱敏死信；只保存源坐标、事件身份、尝试次数和截断错误。

  - pattern: "events.content.feed_page_delivered"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: Content 确认 FeedDeliveryPage 后发布的可重放推荐交付事件；Recommendation 以独立 consumer group 幂等形成曝光事实。

  - pattern: "events.content.feed_page_delivered.recommendation-exposure.dlq"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: RecommendationExposureFact 连续失败后的脱敏死信；只保存源坐标、事件身份、尝试次数和截断错误。

  - pattern: "events.user.account"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: |
      user-service 从 UserAccount 权威 PostgreSQL outbox 投递的账号状态事实流。每个下游使用独立
      consumer group 与本域持久化幂等状态；Redis 只保存七天可重放传输副本，不能替代账号聚合或下游隐私事实。

  - pattern: "events.user.account.recommendation-service.dlq"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: RecommendationSubjectClosureFact 连续失败后的脱敏死信；只保存源坐标、事件身份、尝试次数和截断错误。

  - pattern: "events.circle.post_placements"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: |
      circle-service 从 CirclePostPlacement Mongo outbox 投递的跨上下文事实流；
      每个下游使用独立 consumer group 与 durable inbox，Redis 仅承载可重放传输。

  - pattern: "events.circle.memberships"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: |
      circle-service 从 CircleMembership Mongo outbox 以独立 checkpoint 投递的跨上下文事实流；
      Recommendation、Notification 等消费者必须使用独立 consumer group、durable inbox 和 DLQ，
      Redis 仅承载可由权威 outbox 重放的传输副本。

  - pattern: "events.circle.behavior_facts"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: CircleBehaviorFact Mongo outbox 的可重放传输副本；推荐消费者必须使用 durable inbox、checkpoint 与 DLQ。

  - pattern: "events.integration.external_interaction"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: |
      integration-service 从不可变 provider attempt ledger 以独立 checkpoint 投递的外部交互结果事实。
      request 202、provider 接受和终端展示属于不同时间线；notification-service 必须使用独立
      consumer group、Mongo inbox 与 DLQ，不得把 Redis 或 provider receipt 当成 delivered。

  - pattern: "events.integration.external_interaction.notification-dlq"
    redis_scene: general
    ttl_seconds: 604800
    type: stream
    description: NotificationDeliveryJob 消费外部交互结果时的隔离死信；保存 source stream
      坐标、eventId、不可逆错误摘要与隔离时间，受控恢复后才从源 PEL 重放。

  - pattern: "cache:rtask_ready:{taskType}"
    redis_scene: general
    ttl_seconds: null
    type: sorted_set
    description: Reliable task ready index（score = startAt unix millis）

  # ─── realtime 场景 ────────────────────────────────────────────────
  - pattern: "rt:conversation:{<conversationId>}"
    redis_scene: realtime
    ttl_seconds: null
    type: pubsub_channel
    hash_tag: conversationId
    description: |
      会话消息 Pub/Sub fanout 通道。
      realtime-gateway 每个节点 Subscribe，chat-service Publish。
      哈希标签 {conversationId} 保证同会话消息路由一致。

  - pattern: "rt:inbox:{userId}"
    redis_scene: realtime
    ttl_seconds: null
    type: pubsub_channel
    description: 用户会话列表变更通知 Pub/Sub 通道

  - pattern: "rt:system:config"
    redis_scene: realtime
    ttl_seconds: null
    type: pubsub_channel
    description: 运营配置变更广播通道（V2 实现，V1 预留）

  - pattern: "rt:channel:{channelId}"
    redis_scene: realtime
    ttl_seconds: null
    type: pubsub_channel
    description: 外部渠道（飞书等）消息路由通道

  - pattern: "seq:conversation:{<conversationId>}"
    redis_scene: realtime
    ttl_seconds: null
    type: string
    hash_tag: conversationId
    description: |
      per-conversation 消息序号计数器（Redis INCR 原子递增）。
      哈希标签 {conversationId} 与 dedup 键共享同一 slot。

  - pattern: "dedup:msg:{<conversationId>}:{clientMsgId}"
    redis_scene: realtime
    ttl_seconds: 300
    type: string
    hash_tag: conversationId
    description: |
      消息幂等去重（SET NX，TTL 5min）。
      客户端重试发送同一 clientMsgId → 服务端只写一条。

  - pattern: "presence:user:{userId}"
    redis_scene: realtime
    ttl_seconds: 120
    type: hash
    description: |
      用户在线状态。
      fields: connId, nodeId, lastHeartbeat, subscribedTopics。
      TTL 120s，心跳续期（每 30s EXPIRE）。
      realtime-gateway 写入，chat-service 查询判断在线/离线推送。

  - pattern: "presence:conn:{connId}"
    redis_scene: realtime
    ttl_seconds: 120
    type: hash
    description: |
      连接级状态（反向索引）。
      fields: userId, nodeId, connectedAt。
      用于 gateway 节点下线时批量清理。
