contract_id: app_page_object_contract
schema: app_page_object_contract
source_path_root: quwoquan_app
description: |
  App 页面扫描路径到业务对象、生产路由、Surface、Query Slice、强类型展示、
  鉴权、平台能力与 telemetry 的唯一契约。页面横向质量矩阵只维护页面类型与
  P1–P8；metadata_driven_ui_gap_inventory 只维护 DTO/ReadPresentation typing
  治理状态，二者不得复制本文件中的对象绑定。
query_slice_reference_format:
  projection: "<object_id>.projection.<projection_file_stem>"
  object: "<object_id>.aggregate|entity"
  local: "local.<named_slice>"
  none: "query_slices 与 typed_presentation 同时为 none，并填写 data_contract_reason"

pages:
  - page_id: app.bottom_navigation
    source_path: lib/app/shell/bottom_navigation.dart
    page_kind: component
    parent_page_id: app.main_shell
    surface_ids: [appShell]
    experience_owner: app
    data_owners: [app]
    object_ids: []
    query_slices: none
    typed_presentation: none
    data_contract_reason: 纯导航组件，业务数据由当前路由页面持有。
    auth_requirement: inherited
    capability_requirements: { all_of: [], any_of: [] }
    telemetry_descriptor: { inherit_from: app.main_shell }
    entry_widget: BottomNavigationWidget
    mount_evidence: [lib/app/shell/main_app_shell.dart]

  - page_id: app.main_shell
    source_path: lib/app/shell/main_app_shell.dart
