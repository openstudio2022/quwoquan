contract_id: app_page_object_contract
schema: app_page_object_contract
source_path_root: quwoquan_app
description: |
  App 页面扫描路径到业务对象、生产路由、Surface、Query Slice、强类型展示、
  鉴权、平台能力与 telemetry 的唯一契约。页面集合由目录实时扫描，质量与
  typing 状态由代码、metadata 和可执行 gate 推导，不维护矩阵或 inventory。
query_slice_reference_format:
  projection: "<object_id>.projection.<projection_file_stem>"
  object: "<object_id>.aggregate|entity"
  local: "local.<named_slice>"
  none: "query_slices 与 typed_presentation 同时为 none，并填写 data_contract_reason"

runtime_execution:
  - object_id: notification.notification_delivery_job
    operation_ids:
      - notification.notification_delivery_job.AckIncomingCallPresentation
    production_evidence:
      - path: lib/service/notification_service/notification_delivery/notification_delivery_job/adapters/incoming_call_presentation_remote.dart
        symbols:
          - RemoteIncomingCallPresentationAcknowledger
          - notificationNotificationDeliveryJobAckIncomingCallPresentation
      - path: lib/service/rtc_service/rtc/call_session/application/incoming_call_coordinator.dart
        symbols:
          - IncomingCallCoordinator
          - notificationDeliveryJobProcessCommandWriterProvider
  - object_id: ops.event_record
    operation_ids:
      - ops.event_record.ReportEventBatch
      - ops.event_record.ReportRuntimeLogBatch
      - ops.event_record.ReportStartupEventBatch
    production_evidence:
      - path: lib/service/product_ops_service/product_ops/event_record/adapters/event_record_batch_writer.dart
        symbols:
          - reportEventBatch
          - reportRuntimeLogBatch
      - path: lib/service/product_ops_service/product_ops/event_record/adapters/startup_telemetry_remote.dart
        symbols:
          - RemoteStartupTelemetryTransport
          - opsEventRecordReportStartupEventBatch
      - path: lib/runtime/observability/telemetry/app_telemetry_outbox.dart
        symbols:
          - AppTelemetryOutbox
          - sendSealedBatch
      - path: lib/runtime/observability/runtime_logger.dart
        symbols:
          - RuntimeLogger
          - RuntimeLogTransport
      - path: lib/runtime/observability/startup/startup_telemetry.dart
        symbols:
          - StartupTelemetryReporter
          - StartupTelemetryTransport
  - object_id: ops.visit_record
    operation_ids:
      - ops.visit_record.RecordVisit
    production_evidence:
      - path: lib/service/product_ops_service/product_ops/visit_record/adapters/ops_visit_append_writer.dart
        symbols:
          - RemoteOpsVisitAppendWriter
          - opsVisitRecordRecordVisit
      - path: lib/runtime/services/visit_recorder_service.dart
        symbols:
          - VisitRecorderService
          - recordVisit
  - object_id: user.device_registration
    operation_ids:
      - user.device_registration.RemoveDevicePushEndpoint
      - user.device_registration.UpsertDevicePushEndpoint
    production_evidence:
      - path: lib/service/user_service/account/device_registration/adapters/device_push_endpoint_remote.dart
        symbols:
          - RemoteDevicePushEndpointWriter
          - userDeviceRegistrationRemoveDevicePushEndpoint
          - userDeviceRegistrationUpsertDevicePushEndpoint
      - path: lib/service/user_service/account/device_registration/application/device_push_endpoint_writer.dart
        symbols:
          - DevicePushEndpointCoordinator
          - syncAfterLogin
          - removeForLogout
