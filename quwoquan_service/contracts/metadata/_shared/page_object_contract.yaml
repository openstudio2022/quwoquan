    data_owners: [app]
    object_ids: []
    query_slices: none
    typed_presentation: none
    data_contract_reason: 主导航与页面装配壳，业务数据由 IndexedStack 子页面持有。
    auth_requirement: optional
    capability_requirements: { all_of: [], any_of: [] }
    telemetry_descriptor: { event_namespace: page.app.main_shell, lifecycle: [enter, exit, route_failure] }
