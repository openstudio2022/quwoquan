schemaVersion: prefab_user_provenance/1
description: '预制用户唯一增量真相源声明。新增预制用户必须经 creator_pool 管线产出；

  archive fixture_user_* 只读保留，不得新增引用。

  '
defaultTrack: creator_pool
archiveTrackPolicy: read_only_until_t4
currentUserSlot: creator_pool.currentUserVariant
tracks:
  archive:
    prefabTrack: archive
    source: shared.avatar-user-pool
    fixturePath: _shared/test_fixtures/user_pool.json
    policy: read_only_until_t4
  creator_pool:
    prefabTrack: creator_pool
    source: creator_pool.seed/2
    fixturePath: _shared/test_fixtures/user_pool.creator_pool.travel_photo_1k_v1.json
    manifestPath: _shared/test_fixtures/user_pool.manifest.travel_photo_1k_v1.json
    policy: sole_incremental_source
archiveAliases:
  fixture_user_current:
    resolvesTo: qwq_creator_current_user_variant
    deprecated: true
    note: T2+ dual-read alias; resolver maps to currentUserVariant slot
  user_001:
    resolvesTo: qwq_creator_current_user_variant
    deprecated: true
batchPolicy:
  canonicalBatchId: travel_photo_1k_v1
  travel_photo_1k_v1:
    role: commercial_truth_source
    seedTruth: true
    seedFixture: creator_travel_photo_1k_v1.seed.json
    userPoolFixture: user_pool.creator_pool.travel_photo_1k_v1.json
    manifestFixture: user_pool.manifest.travel_photo_1k_v1.json
    note: canonical 商用千级旅行摄影创作者试跑池；active seed/overlay/slice/manifest/scenario 单一真相源
