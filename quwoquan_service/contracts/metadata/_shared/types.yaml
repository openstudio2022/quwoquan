
types:
  ReleaseCandidateBinding:
    description: User、Content、Search 共享的不可变内容候选值；不是 ContentActiveReleaseFence，刻意不含 active、revision 或 activatedAt。
    fields:
      - {name: environment, type: enum, values: [alpha, beta, gamma, prod], constraints: [NOT_NULL]}
      - {name: sourceOwner, type: enum, values: [qwq_data], constraints: [NOT_NULL]}
      - {name: releaseId, type: string, constraints: [NOT_BLANK], max_utf8_bytes: 160}
      - {name: manifestDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  CreatorSearchPublicSnapshot:
    description: User 公开投影 owner 从 verified Creator candidate 生产的自包含公开值；无账户凭证、人设策略或作品正文。objectId 必须等于 personaId，authorId 与 creatorId 来自原包映射，不推导登录身份。
    fields:
      - {name: objectType, type: enum, values: [user.profile], constraints: [NOT_NULL]}
      - {name: objectId, type: string, constraints: [NOT_BLANK]}
      - {name: creatorId, type: string, constraints: [NOT_BLANK]}
      - {name: personaId, type: string, constraints: [NOT_BLANK]}
      - {name: authorId, type: string, constraints: [NOT_BLANK]}
      - {name: userHandle, type: string, constraints: [NOT_BLANK]}
      - {name: displayName, type: string, constraints: [NOT_BLANK]}
      - {name: bio, type: string, constraints: [NULLABLE]}
      - {name: avatarUrl, type: string, constraints: [NULLABLE]}
      - {name: avatarAssetId, type: string, constraints: [NULLABLE]}
      - {name: avatarAccessMode, type: enum, enum_ref: MediaDeliveryAccessMode, constraints: [NULLABLE]}
      - {name: identityTags, type: '[]string', constraints: [NOT_NULL], max_items: 100}
      - {name: postCount, type: int64, constraints: [NOT_NULL], min: 0}
      - {name: sourceVersion, type: int64, constraints: [NOT_NULL], min: 1}
      - {name: profileDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: sourceDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
  CreatorSearchCandidateSnapshot:
    description: >-
      完整候选公开闭包，按 objectId 升序且 creatorId/personaId/authorId 各自唯一；不得截断分页或用相同数量替代身份集合。
      sourceDigest 为公开 snapshot 除自身 sourceDigest 外字段的 UTF-8 canonical JSON SHA-256；objectSetDigest 为排序 objectType/objectId 数组摘要，
      snapshotDigest 为整个值除自身 snapshotDigest 外字段摘要。canonical JSON 按键排序、无空白、原 UTF-8、时间 UTC RFC3339Nano；所有摘要带 sha256: 前缀。
      sourceClosureDigest 绑定 User verified candidate 的原 closure，不能用公开摘要覆盖原包事实；头像三字段同有同无，无头像全 null。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: sourceClosureDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: objectSetDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: snapshotDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: profiles, type: '[]CreatorSearchPublicSnapshot', constraints: [NOT_NULL], max_items: 500}
  SearchReleaseCandidateSnapshot:
    description: 唯一搜索准备输入值，kind只区分creator/post/homepage。恰一对应snapshot非null且所有release一致；源owner快照不复制，旧形状拒绝不补字段。
    fields:
      - {name: kind, type: enum, values: [creator, post, homepage], constraints: [NOT_NULL]}
      - {name: creator, type: CreatorSearchCandidateSnapshot, constraints: [NULLABLE]}
      - {name: post, type: ReleasePostCandidateSnapshot, constraints: [NULLABLE]}
      - {name: homepage, type: ReleaseHomepageCandidateSnapshot, constraints: [NULLABLE]}
  ReleaseCandidateObjectIdentity:
    description: 各源owner生产、Search/Recommendation消费的exact源身份；release只用共享四元组值。revision不属于candidate，不接受旧协议补字段。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: objectType, type: enum, values: [content.post, entity.homepage, user.profile], constraints: [NOT_NULL]}
      - {name: objectId, type: string, constraints: [NOT_BLANK]}
      - {name: sourceVersion, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: sourceDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  ReleaseHomepagePublicSnapshot:
    description: Entity verified候选的公开裁剪，homepageId/objectId与entityRef映射逐项核验；documentDigest按除自身外canonical JSON计算，规则沿CreatorSearchCandidateSnapshot。
    fields:
      - {name: identity, type: ReleaseCandidateObjectIdentity, constraints: [NOT_NULL]}
      - {name: entityRef, type: string, constraints: [NOT_BLANK]}
      - {name: canonicalEntityId, type: string, constraints: [NOT_BLANK]}
      - {name: title, type: string, constraints: [NOT_BLANK]}
      - {name: homepageType, type: enum, enum_ref: HomepageType, constraints: [NOT_NULL]}
      - {name: introductionMarkdown, type: string, constraints: [NOT_NULL]}
      - {name: city, type: string, constraints: [NULLABLE]}
      - {name: location, type: GeoPoint, constraints: [NULLABLE]}
      - {name: coverUrl, type: string, constraints: [NULLABLE]}
      - {name: tagRefs, type: '[]string', constraints: [NOT_NULL]}
      - {name: deepLink, type: string, constraints: [NOT_BLANK]}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: documentDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  ReleasePostPublicSnapshot:
    description: Content从verified Post/outbox/media候选生成，供Search与Recommendation复用；不是live PostPublished。sourceDigest绑定原候选，documentDigest绑定本公开值除自身字段；Homepage来自Entity同tuple公开值，不从标题推导。
    fields:
      - {name: identity, type: ReleaseCandidateObjectIdentity, constraints: [NOT_NULL]}
      - {name: postRef, type: string, constraints: [NOT_BLANK]}
      - {name: authorId, type: string, constraints: [NOT_BLANK]}
      - {name: authorDisplayName, type: string, constraints: [NOT_BLANK]}
      - {name: authorAvatarUrl, type: string, constraints: [NULLABLE]}
      - {name: contentType, type: enum, enum_ref: ContentType, constraints: [NOT_NULL]}
      - {name: contentIdentity, type: enum, enum_ref: ContentIdentity, constraints: [NOT_NULL]}
      - {name: status, type: enum, enum_ref: PostStatus, constraints: [NOT_NULL]}
      - {name: visibility, type: enum, enum_ref: Visibility, constraints: [NOT_NULL]}
      - {name: moderationStatus, type: enum, enum_ref: ModerationStatus, constraints: [NOT_NULL]}
      - {name: title, type: string, constraints: [NOT_NULL]}
      - {name: body, type: string, constraints: [NOT_NULL]}
      - {name: summary, type: string, constraints: [NOT_NULL]}
      - {name: tagRefs, type: '[]string', constraints: [NOT_NULL]}
      - {name: entityRefs, type: '[]string', constraints: [NOT_NULL]}
      - {name: primaryHomepage, type: ReleaseHomepagePublicSnapshot, constraints: [NULLABLE]}
      - {name: mediaAssetIds, type: '[]string', constraints: [NOT_NULL]}
      - {name: mediaUrls, type: '[]string', constraints: [NOT_NULL]}
      - {name: coverUrl, type: string, constraints: [NULLABLE]}
      - {name: thumbnailUrl, type: string, constraints: [NULLABLE]}
      - {name: videoUrl, type: string, constraints: [NULLABLE]}
      - {name: durationMs, type: int64, min: 0, constraints: [NOT_NULL]}
      - {name: width, type: int, min: 0, constraints: [NOT_NULL]}
      - {name: height, type: int, min: 0, constraints: [NOT_NULL]}
      - {name: contentVertical, type: string, constraints: [NULLABLE]}
      - {name: publishedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: updatedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: deepLink, type: string, constraints: [NOT_BLANK]}
      - {name: documentDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  ReleasePostCandidateSnapshot:
    description: 完整有界闭包，posts按objectId排序唯一，所有identity.release相同；超过1000拒绝而不截断。objectSetDigest为排序objectType/objectId数组摘要，snapshotDigest为除自身外canonical JSON摘要；源/媒体闭包摘要来自Content原verified事实，不是查询ready。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: sourceClosureDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: mediaClosureDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: objectSetDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: snapshotDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: posts, type: '[]ReleasePostPublicSnapshot', max_items: 1000, constraints: [NOT_NULL]}
  ReleaseHomepageCandidateSnapshot:
    description: Entity完整verified候选公开集合；按objectId排序唯一，映射摘要来自原entityRef映射，摘要规则同ReleasePostCandidateSnapshot，超过1000拒绝不截断。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: sourceClosureDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: entityRefMappingDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: objectSetDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: snapshotDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: homepages, type: '[]ReleaseHomepagePublicSnapshot', max_items: 1000, constraints: [NOT_NULL]}
  ReleaseQueryPreparationBinding:
    description: 唯一准备身份为本值canonical摘要，slice只区分对象种类，无协议版本字段或兼容选择；源摘要不参与身份。Provider与schema代际必须由部署受管事实验证，不能由caller自行选择。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NOT_NULL]}
      - {name: slice, type: enum, values: [creator_search, post_search, homepage_search, recommendation], constraints: [NOT_NULL]}
      - {name: providerBindingGeneration, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: schemaGeneration, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  ReleaseQueryClassEvidence:
    description: 一类真实候选查询的完整结果身份/内容摘要，非passed布尔值；proof evaluator重验不能仅比较数量。
    fields:
      - {name: queryClass, type: enum, values: [result, suggest, retrieval, ids, count, facet, home, premium, required_detail], constraints: [NOT_NULL]}
      - {name: objectSetDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: documentsDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  ReleaseQueryReadinessProof:
    description: owner只读重验自身checkpoint与真实查询后返回，不存第二ready registry。完整身份/文档摘要不能用数量代替；proofDigest按除自身外canonical JSON计算。validUntil覆盖短准入窗口，source/projection/准入漂移立即失效。
    fields:
      - {name: binding, type: ReleaseQueryPreparationBinding, constraints: [NOT_NULL]}
      - {name: sourceClosureDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: objectSetDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: snapshotDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: documentsDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
      - {name: checkpointVersion, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: queryClasses, type: '[]ReleaseQueryClassEvidence', constraints: [NOT_NULL], description: Search精确覆盖result/suggest/retrieval/ids/count/facet；Recommendation精确覆盖home/premium/required_detail，未知/重复/缺项拒绝。}
      - {name: premiumAdmissionDigest, type: string, format: canonical_sha256, constraints: [NULLABLE], description: recommendation必填，其余必须null。}
      - {name: premiumObjectSetDigest, type: string, format: canonical_sha256, constraints: [NULLABLE], description: recommendation必填且对应非空合格work+video集合，其余必须null。}
      - {name: verifiedAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: validUntil, type: timestamp, constraints: [NOT_NULL]}
      - {name: proofDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  ReleasePinnedQueryFence:
    description: Content从唯一active pointer生产的请求值，不替代ContentActiveReleaseFence transport；无active时release=null且revision=0，found候选完整且revision正。Recommendation不得自行选active，public不得提交此值。
    fields:
      - {name: release, type: ReleaseCandidateBinding, constraints: [NULLABLE]}
      - {name: revision, type: int64, min: 0, constraints: [NOT_NULL]}
  ReleasePremiumAdmission:
    description: ProductOps唯一签发的Data候选准入值；source必须为content.post且同contentId，独立绑定源版本/摘要。同对象A/B可并存，旧准入不能借contentId授予B；原聚合revision驱动撤回与下架，不产生第二premium authority。
    fields:
      - {name: source, type: ReleaseCandidateObjectIdentity, constraints: [NOT_NULL]}
      - {name: admissionRevision, type: int64, min: 1, constraints: [NOT_NULL]}
      - {name: auditId, type: string, constraints: [NOT_BLANK]}
      - {name: qualityScore, type: float64, min: 0.75, constraints: [NOT_NULL]}
      - {name: status, type: enum, values: [active, rolled_back, takedown_ejected], constraints: [NOT_NULL]}
      - {name: qualityAdmission, type: enum, values: [approved], constraints: [NOT_NULL]}
      - {name: scope, type: enum, values: [global], constraints: [NOT_NULL]}
      - {name: expiresAt, type: timestamp, constraints: [NOT_NULL]}
      - {name: admissionDigest, type: string, format: canonical_sha256, constraints: [NOT_NULL]}
  RealtimeEventEnvelope:
    description: >-
      WebSocket 与 LongPoll 共用的第一方实时业务 envelope。type 是闭集判别器，
      具体 event_ref、payload_entity 与 owner 只由 _shared/realtime_event_catalog.yaml
      登记；payload 字段继续由对象本地 contracts 拥有，未知 type 或字段必须拒绝。
    discriminator: type
    variant_catalog: _shared/realtime_event_catalog.yaml
    unknown_field_policy: reject
    fields:
      - { name: type, type: string }
      - { name: eventId, type: string, nullable: true }
      - { name: occurredAt, type: timestamp }
      - { name: payload, type: object }

  GreetingIntersectionSnapshot:
    description: >-
      user-service 以当前双方关系重新解析并冻结、chat-service 只读消费的破冰交集展示快照。
      该跨服务值对象只有此处一个 wire owner，不允许领域服务复制定义或在 App barrel 隐藏冲突类型。
    fields:
      - { name: intersectionId, type: string, constraints: [NOT_BLANK] }
      - { name: evidenceId, type: string, constraints: [NOT_BLANK] }
      - { name: sourceRef, type: string, constraints: [NOT_BLANK] }
      - { name: objectTypeRef, type: string, constraints: [NOT_BLANK] }
      - { name: objectId, type: string, constraints: [NOT_BLANK] }
      - { name: primaryText, type: string, constraints: [NOT_BLANK] }
      - { name: dimension, type: string, constraints: [NULLABLE] }
      - { name: resolvedAt, type: timestamp, constraints: [NOT_NULL] }

  GeoPoint:
    fields:
      - { name: latitude, type: float64 }
      - { name: longitude, type: float64 }

  Cursor:
    description: 游标分页
    fields:
      - { name: value, type: string }
      - { name: direction, type: enum, values: [forward, backward] }

  Pagination:
    fields:
      - { name: cursor, type: string, nullable: true }
      - { name: limit, type: int, default: 20, min: 1, max: 100 }

  TagHeatWindow:
    description: |
      标签的热度生效窗口。seasonal / campaign 标签必须声明，其余状态为 null。
      窗口只表达「什么时候该被加权」，不表达可用性：窗口之外标签仍可解析、仍可作为
      历史内容的标签，只是不再获得热度加权。用可用性表达窗口会让去年拍的春季照片
      在今年春天之外变成无标签内容。
    fields:
      - { name: startAt, type: timestamp }
      - { name: endAt, type: timestamp }
      - { name: recurrence, type: enum, enum_ref: TagHeatRecurrence }

enums:
  TagHeatRecurrence: [once, annual]
  ContentType: [image, video, micro, article]
  IntersectionDimension: [identity, location, content, interest, relationship]
  ArticleTemplatePreset: [gentle, ritual, diffuse, journal, tech]
  ArticleFontPreset: [clean, classic, handwritten, rounded, mono]
  ContentIdentity: [moment, work]
  PostStatus: [pending_review, published, rejected, deleted]
  Visibility: [public, private]
  AssistantUsePolicy: [inherit, exclude]
  PostSourceType: [original, repost, quote]
  ModerationStatus: [pending, approved, rejected]
  PostModerationCaseStatus: [pending, reviewed, approved, rejected, superseded]
  MediaUploadSessionStatus: [pending, completed, aborted]
  # file 会完成为正式 MediaAsset，并被 chat attachment / circle storage 引用；
  # 它不是仅存在于上传传输层的临时载荷类型。
  MediaType: [image, video, audio, file]
  MediaAssetStatus: [processing, ready, rejected, deleted]
  MediaAssetAccessPolicy: [owner_only, referenced_post, public]
  MediaVideoCodec: [h264]
  MediaContainer: [mp4]
  MediaAudioCodec: [aac]
  MediaCoverStrategy: [first_frame, manual]
  CaptureDisclosureGroup: [gear, parameters, place, time]
  FilterCatalogReleaseStatus: [staged, active, retired]
  MediaImageReprocessRunStatus: [running, paused, rolling_back, completed, failed, rolled_back]
  MediaOriginalAccessPurpose: [view, save]
  MediaOriginalAccessOutcome: [granted, denied, rate_limited]
  # 媒体交付访问模式（DEC-033）：public 走匿名公开 slice；signed_grant 必须经
  # ReserveOriginalImageAccessGrant 换取短时签名 URL。App 只依此 typed 声明分流，
  # 禁止从 CAS 前缀、URL 形态或 query 参数推断交付形态。
  MediaDeliveryAccessMode: [public, signed_grant]
  Gender: [male, female, other, unspecified]
  # 个人主页「生活」Tab 子分类：足迹/书影音/味蕾/爱物
  ConversationType: [direct, group, encrypted]
  MessageType: [text, image, video, audio, file, card, system_call_log, system_announcement]
  MessageStatus: [sent, recalled]
  CircleStatus: [active, archived, deleted]
  CircleMemberRole: [owner, admin, member]
  CircleVisibility: [public, private, invite_only]
  # Wire / BSON 与 Flutter CircleDto 一致，使用 invite_only（非 invite）
  CircleJoinPolicy: [open, approval, invite_only]
  CircleKind: [interest, organization]
  CircleDisplaySubjectType: [circle, school, college, grade, classroom, company, department, team]
  CircleGroupType: [public_group, self_built, org_node]
  CircleGroupVisibility: [public, private]
  CircleGroupJoinPolicy: [apply_only, invite_only]
  CircleGroupStatus: [active, archived]
  CircleGroupMembershipRole: [owner, manager, member]
  CircleGroupMembershipState: [pending, active, rejected, left, removed]
  CircleMembershipState: [pending, active, rejected, left, removed]
  OrganizationNodeType: [generic, college, grade, classroom, department, team]
  # members 与 ui_config circle_sections 对齐；interaction 板块已下线（生产 UI 零消费）。
  CircleSectionType: [works, members, chat, storage, custom]
  CircleFileType: [file, folder]
  CircleFileStatus: [active, deleted]
  CirclePostPlacementState: [active, removed]
  HomepageStatus: [candidate, published, offline]
  # 地点类主页类型与数据工程 Entity/地点 一级类型试点 scope 对齐（裁决 6）：
  # 景区→sight，其余按 entity_type_taxonomy.PILOT_PRIMARY_TYPES 补齐
  # （博物馆/遗址/古镇/宗教场所/打卡地/自然景观/公园/温泉/主题乐园）。
  # transport_hub/city/route/photo_spot/gear 是旅行垂类的下钻宾语，承载
  # intersection_kind_registry.verticalExtensionContract 要求的「objectKind 必须映射到
  # 已有 homepage 类型」；它们不在数据发布试点 scope 内，只能由 user_suggested/owner_created 产生。
  HomepageType: [vehicle, hotel, restaurant, sight, university, school, travel_photo, museum, heritage_site, ancient_town, religious_site, check_in_spot, natural_landscape, park, hot_spring, theme_park, transport_hub, city, route, photo_spot, gear]
  HomepageSourceType: [official_seed, imported, user_suggested, owner_created]
  HomepageClaimStatus: [unclaimed, pending_review, claimed, rejected]
  HomepageClaimTier: [basic, verified]
  HomepageClaimReviewStatus: [pending_review, approved, rejected]
  HomepageStatusReportReason: [offline, incorrect_info, duplicate_entry, inactive]
  HomepageStatusReportStatus: [pending_review, confirmed_offline, dismissed]
  HomepageReviewStatus: [active, deleted]
  ProposalStatus: [pending, confirmed, applying, applied, rolling_back, rolled_back, rejected, expired]
  ProposalSource: [persona, assistant, external]
  ReportTargetType: [post, comment, user, circle, gathering, message]
  ReportReason: [spam, harassment, violence, adult, copyright, other]
  ReportStatus: [pending, reviewing, resolved, dismissed]
  ReportResolution: [warn, delete_content, suspend_user, terminate_gathering, ban, dismiss]
  NotificationType: [social, content, circle, system, assistant]
  RunTriggerType: [user_query, suggested_action, skill_select, global_search_handoff]
  BehaviorEventType: [impression, click, dwell, like, dislike, undo_dislike, hide_author, hide_content_type, report, share, comment, intersection_expand, intersection_feedback, wishlist_add, wishlist_remove, skip, follow, join_circle, leave_circle, add_contact, author_view, entity_page_view, tag_click, content_depth, play_progress, effective_play, assistant_interest, onboarding_interest]
  LocationProvider: [baidu, amap]
  ExternalInteractionOperation: [sms_otp.send, push_delivery.send]
  ExternalInteractionStatus: [accepted, pending_dispatch, processing, sent_unconfirmed, delivered, failed, dead_letter]
  ExternalInteractionAttemptStatus: [sent_unconfirmed, delivered, failed]
  ExternalInteractionSensitivity: [public, private, secret]
  ExternalInteractionProvider: [aliyun_sms, local_sms_recorder, push_dispatch, apns_voip, fcm, push_protocol_substitute]
  ConnectorAuthorizationMode: [device_native, oauth2, public_link]
  ConnectorAuthorizationStatus: [pending, verified, consumed, expired, revoked, failed]
  ConnectorConfirmationPolicy: [none, user_confirmation]
  ConnectorDefinitionStatus: [active, retired]
  ConnectorConnectionStatus: [pending, active, expired, revoked, failed]
  ConnectorInvocationStatus: [accepted, awaiting_confirmation, executing, completed, failed, cancelled]
  ConnectorDataClassification: [public, private, sensitive]
  OneTapLoginHintState: [registered, new_phone, unavailable]
  # user owns endpoint registration and integration owns provider delivery;
  # the endpoint kind crossing that boundary therefore has one shared owner.
  DevicePushEndpointKind: [apns_voip, fcm]
  PushDeliveryAction: [ring, cancel, alert]
  SearchScope: [all, content, social_relation, messages, circles]
  SearchFeedbackEventType: [impression, click, dwell, refine, zero_result, degrade]
  ProfileVisibility: [public, friends, private]
  MemberRole: [owner, admin, member]
  MemberListSort: [joined_asc, display_name_asc]
  MemberType: [user, assistant]
  TransportType: [websocket, long_poll]
  CallType: [audio, video]
  CallStatus: [initiated, ringing, connecting, in_call, ended]
  EndReason: [normal, cancelled, rejected, no_answer, error, timeout, last_leave, account_closed, account_suspended]
  ParticipantRole: [initiator, invitee]
  ParticipantStatus: [invited, ringing, connecting, connected, left, timeout]
  TrustRelation: [known, possibly_unknown]
  CallInviteStatus: [pending, ringing, accepted, declined, expired, cancelled]
  IsolationLevel: [open, semi, strict]
  AccountState: [anonymous, active, suspended, closed]
  CredentialType: [anonymous_device, phone, carrier_phone, federated_slot_a, federated_slot_b, federated_slot_c, apple, passkey]
  GreetingRequestStatus: [pending, replied, ignored, blocked, cancelled, expired]
  GreetingRequestSource: [profile, recommendation, group_member, invite]
  ConversationOriginType: [direct_init, greeting_reply, ad_hoc_group, circle_group, gathering]
  ConversationStatus: [active, dissolved]
  MessageCardKind: [profile_qr, content_post, user_profile, entity_profile, circle, gathering, rtc_call_log, intersection_icebreaker]
  RelationshipState: [self, not_following, following, followed_by, mutual]
  ProfileOwnerKind: [account, persona, creator]
  # 关注频道读模型（FollowingSubject / FollowedSubjectVisitState）的并集值域：
  # persona 行来自 PersonaRelationship，circle 行来自 CircleMembership，
  # homepage / location 行来自 SubjectFollow。写侧不共享这个值域——
  # SubjectFollow 只能写 homepage/circle/location，由对象自有
  # SubjectFollowTargetKind 拥有，避免读并集被当成写许可。
  FollowSubjectKind: [persona, homepage, circle, location]
  SubjectFollowState: [following, unfollowed]
  ProfileSyncApplyScope: [current_subject_only, owner_only, all_personas, selected_subjects]
  ProfileSyncSource: [owner_edit, persona_edit, manual_sync, initial_inherit]
  InteractionActivityType: [like, comment, share]
  InteractionDirection: [received, sent]
  CommentReactionType: [none, like, dislike]
  ThemeModeSetting: [system, light, dark]
  FontSizePreset: [xs, sm, md, lg, xl]
  FeedPreference: [recommend, chronological]
  AppearanceSource: [owner_default, sub_override, system_default]
  AppearanceApplyScope: [all_accounts, current_persona, inherit_owner_default]
  PersonaStatus: [active, inactive, retired]
  PersonaLifecycleAction: [retire]
  PersonaLifecycleGuardReason: [allowed, blocked_primary_persona, blocked_last_persona, blocked_active_persona, blocked_retired_persona, quota_reached]
  # 标签生命周期。active / trending / seasonal / campaign 都是可用状态，只有 deprecated
  # 不可用：可用性判定必须走 tag-service 的 lifecycle.IsUsable，禁止在调用方写
  # `status == "active"`——那会把趋势标签、季节标签与活动标签一起误判成停用。
  # trending 热度由运营或离线任务写入，seasonal / campaign 必须带 heatWindow 说明生效窗口。
  TagLifecycleStatus: [active, trending, seasonal, campaign, deprecated]
  # 结构化事实字段闭集。与 content_source_registry 的
  # lanePolicies.homepage.structuredFactsPolicy.fields 必须一致：
  # 放开官方来源的范围就是这个列表，扩列表等于扩信源政策。
  HomepageStructuredFactField:
    - openingHours
    - ticketPriceRange
    - recommendedDurationMinutes
    - bestSeasonTagRefs
    - altitudeMeters
    - officialWebsite
  # 结构化事实允许的来源类别。正文底稿仍锁三百科；官网与政府/文旅门户只在此处放开。
  HomepageStructuredFactSourceClass: [encyclopedia, official_site, government_tourism]
  # 对象关系边类型闭集。此前 edgeType 是无约束 String，词表分裂成两个互不相交的半边：
  # 物化器只写 semantic_co_mention/tag_overlap/geo_proximity，端侧 switch 只认
  # author_of/posted_to_circle/... —— 两边都在消费自己那半，谁也不会报错。收敛为闭集后，
  # 生产方与消费方都从这里取值，parity 由 verify_object_relation_edge_type_contract.py 守。
  # 顺序有意义：断言边（第一方记录直接得出）→ 空间边（实体间地理关系）→ 计算边（信号派生、TTL 退场）。
  ObjectRelationEdgeType:
    - author_of
    - posted_to_circle
    - reshared_to_circle
    - mentions_entity
    - comment_about_entity
    - circle_under_entity
    - member_of
    - review_of
    # located_in/part_of 是地理包含（景点在城市里、子景区属于景区），near 是实体间
    # 邻近断言，route_stop 是路线经停。geo_proximity 与 near 不是同一件事：前者是
    # conditionProfile.regions 相同算出来的共现信号，后者是断言两个实体在空间上挨着。
    - located_in
    - part_of
    - near
    - route_stop
    - semantic_co_mention
    - tag_overlap
    - geo_proximity
    - behavior_co_engagement

classifications:
  PUBLIC: 公开数据
  PII: 个人可识别信息
  SENSITIVE: 敏感数据
  SECRET: 机密数据（凭证等）

log_policies:
  allow: 允许完整记录
  mask: 脱敏记录（部分隐藏）
  drop: 不记录
