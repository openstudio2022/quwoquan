attribution_params:
  params:
  - desc: 渠道来源（wechat_session / wechat_timeline / xiaohongshu / toutiao / browser / poster_qr 等）
    key: utm_source
  - desc: 媒介（social / poster / token / qr / seo）
    key: utm_medium
  - desc: 运营活动标识
    key: utm_campaign
  - desc: 单次站外分享事实 id，与 content/outbound_share_fact CreateOutboundShare 追加事实及埋点对齐
    key: share_id
  - desc: 邀请者 subAccountId，拉新归因，对齐 user/invite_record
    key: inviter
  - desc: referralSource 语义来源标识（对齐端侧 ReferralSource）
    key: referral
  rules:
  - 仅追加到 web HTTPS 链接与中转页；scheme 深链通过 extinfo / 透传字段携带等价归因。
  - 入站解析时全部剥离，仅交给埋点与归因，绝不参与 GoRouter route 匹配。
entities:
  chat:
    app_deep_link:
      host: chat
      path_template: '{conversationId}'
      scheme: quwoquan
    description: 单聊/群聊会话
    navigation:
      param_bindings:
        conversationId: id
      route_id: chatDetail
    primary_params:
    - conversationId
    web:
      path_template: chat/{conversationId}
  circle:
    app_deep_link:
      host: circle
      path_template: '{circleId}'
      scheme: quwoquan
    description: 圈子主页
    navigation:
      param_bindings:
        circleId: id
      route_id: circleDetail
    primary_params:
    - circleId
    web:
      path_template: circle/{circleId}
  entity_homepage:
    app_deep_link:
      host: homepages
      path_template: '{homepageId}'
      scheme: quwoquan
    description: 主页实体（共享主页网络）
    navigation:
      param_bindings:
        homepageId: id
      route_id: homepageDetail
    primary_params:
    - homepageId
    web:
      path_template: homepages/{homepageId}
  post:
    app_deep_link:
      host: content
      path_template: post/{postId}
      scheme: quwoquan
    description: 内容帖（点滴/作品等），与 Post 聚合 id 对齐
    navigation:
      param_bindings:
        postId: workId
      route_id: workBrowser
    primary_params:
    - postId
    web:
      path_template: post/{postId}
  user:
    app_deep_link:
      host: user
      path_template: '{username}'
      scheme: quwoquan
    description: 用户公开主页（路由键为 username）
    navigation:
      param_bindings:
        username: username
      route_id: userProfile
    primary_params:
    - username
    web:
      path_template: u/{username}

# canonical search object type → 已登记 link template。codegen 以此生成站内
# CitationDestination 的 deep link 与 route path；未知 object type 不产生可点击引用。
citation_destinations:
  internal:
    - object_type: chat.conversation
      entity: chat
    - object_type: circle.circle
      entity: circle
    - object_type: content.post
      entity: post
    - object_type: entity.homepage
      entity: entity_homepage
    - object_type: user.profile
      entity: user
  external:
    allowed_schemes: [https]
runtime_origin_binding:
  dart_define_key: PUBLIC_WEB_BASE_URL
  description: '公网可复制链接的 origin 仅来自运行时：

    - 过渡期：`--dart-define=PUBLIC_WEB_BASE_URL=https://…`（与现有 AppPublicContentLinks 对齐）

    - 目标态：Remote Config 键（如 `public_web_base_url`），由产品/运维按 env 下发

    '
  remote_config_key: public_web_base_url
share_token:
  format:
    body_charset: base62
    body_length: 8
    pattern: '{prefix}{body}{suffix}'
    prefix: 【趣窝圈】
    suffix: 「复制本条 {token} 打开趣窝圈App查看」
  resolution:
  - 客户端识别 prefix / suffix 包裹后提取 token，调用短链解析还原 target_entity / target_id + 归因。
  - 剪贴板读取遵循 iOS14+ / Android12+ 系统限制，仅在用户主动粘贴或显式授权场景读取（见 external-inbound-deeplink-routing）。
  - 口令 token 与 transfer_pages.short_link 的 {token} 同源，可互转。
transfer_pages:
  short_link:
    description: 短链中转页，承载口令 / 海报二维码默认落点，解析后跳转 universal_landing 或直接渲染分流页。
    web:
      path_template: s/{token}
  universal_landing:
    description: 通用智能跳转中转页，按 UA 分流（微信 / 浏览器 / iOS / Android / PC）唤起 App、下载或 web 预览。
    query_rules:
    - desc: 目标实体类型（post / circle / user / entity_homepage）
      key: target_entity
    - desc: 目标实体主键（postId / circleId / username / homepageId）
      key: target_id
    - desc: 可选，携带口令归因短码
      key: token
    web:
      path_template: open
