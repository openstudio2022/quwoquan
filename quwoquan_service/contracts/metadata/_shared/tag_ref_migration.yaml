version: 1

# 过渡映射：已废弃的扁平 tag_taxonomy.yaml id → 数据工程路径制 tagRef。
#
# 用途：
#   - 存量对象标签（post.tags / circle.tags / entity.categoryTags|highlightTags / 用户兴趣）
#     回填到唯一真相源（数据工程 publish/v1/tags，四分组路径 id）。
#   - 回填完成后本文件与 _shared/tag_taxonomy.yaml 一并删除，不保留第二套真相源。
#
# 边界（V0.5 首发标签子集）：
#   - 严格映射仅覆盖校园（Entity/机构/学校、Audience 校园人群）与旅游出行
#     （Topic/旅行、Topic/地理、Topic/摄影、Topic/美食餐饮、Entity/地点）+ 通用 Format。
#   - 子集外的旧 id 标记 status: deferred，回填时按 taxonomy 增长再补；不强制 shared-tags 召回。
#   - 目标 tagRef 为垂类根（verify_tag_tree.py R2 保证存在的必备维度/垂类）；
#     更细的叶子锚点在回填脚本里按文本匹配下沉，本表只冻结根归属。
#
# tagRef 格式：路径制，必须以 Topic/Audience/Format/Entity 开头（verify_tag_tree.py R10）。

source_of_truth: quwoquan_data/publish/v1/tags
deprecates: _shared/tag_taxonomy.yaml
delete_after_backfill: true

mappings:
  # ── content_tags：表达形式（媒体载体）→ Format/内容载体 ──
  type_image:        { tagRef: Format/内容载体, status: launch }
  type_video:        { tagRef: Format/内容载体, status: launch }
  type_article:      { tagRef: Format/内容载体, status: launch }
  type_micro:        { tagRef: Format/内容载体, status: launch }

  # ── content_tags：旅游出行尖刀 topic → Topic 垂类根 ──
  topic_travel:      { tagRef: Topic/旅行, status: launch }
  topic_photography: { tagRef: Topic/摄影, status: launch }
  topic_food:        { tagRef: Topic/美食餐饮, status: launch }
  geo_domestic:      { tagRef: Topic/地理, status: launch }
  geo_overseas:      { tagRef: Topic/地理, status: launch }
  topic_local:       { tagRef: Topic/地理, status: launch }

  # ── content_tags：子集外 topic（回填延后，非首发召回）──
  topic_tech:        { tagRef: Topic/科技, status: deferred }
  topic_fashion:     { tagRef: Topic/时尚穿搭, status: deferred }
  topic_sports:      { tagRef: Topic/运动, status: deferred }
  topic_music:       { tagRef: Topic/影视娱乐, status: deferred }
  topic_art:         { tagRef: Topic/艺术创作, status: deferred }
  topic_education:   { tagRef: Topic/教育成长, status: deferred }
  topic_pets:        { tagRef: Topic/宠物动物, status: deferred }
  topic_parenting:   { tagRef: Topic/亲子育儿, status: deferred }
  topic_fitness:     { tagRef: Topic/健康养生, status: deferred }
  topic_home:        { tagRef: Topic/家居生活, status: deferred }
  topic_finance:     { tagRef: Topic/金融理财, status: deferred }
  topic_news:        { tagRef: Topic/人文社科, status: deferred }
  # mood_* / quality_* 不是内容主题锚点，归 Format/内容角度，回填延后
  mood_positive:     { tagRef: Format/内容角度, status: deferred }
  mood_neutral:      { tagRef: Format/内容角度, status: deferred }
  mood_negative:     { tagRef: Format/内容角度, status: deferred }
  mood_inspirational:{ tagRef: Format/内容角度, status: deferred }
  mood_humorous:     { tagRef: Format/内容角度, status: deferred }
  quality_high:      { tagRef: Format/内容角度, status: deferred }
  quality_original:  { tagRef: Format/内容角度, status: deferred }
  quality_curated:   { tagRef: Format/内容角度, status: deferred }

  # ── circle_tags：圈子类型/主题 → Topic 垂类或 Entity/机构 ──
  circle_alumni:           { tagRef: Entity/机构, status: launch }    # 校友圈 → 校园身份
  circle_topic_travel:     { tagRef: Topic/旅行, status: launch }
  circle_topic_photography:{ tagRef: Topic/摄影, status: launch }
  circle_topic_food:       { tagRef: Topic/美食餐饮, status: launch }
  circle_interest:         { tagRef: Topic/场景, status: deferred }
  circle_local:            { tagRef: Topic/地理, status: deferred }
  circle_professional:     { tagRef: Entity/机构, status: deferred }
  circle_event:            { tagRef: Entity/活动, status: deferred }
  circle_topic_tech:       { tagRef: Topic/科技, status: deferred }
  circle_topic_fitness:    { tagRef: Topic/健康养生, status: deferred }
  circle_topic_pets:       { tagRef: Topic/宠物动物, status: deferred }
  # circle_active/growing/stable/dormant、size 系列为运营态属性，非内容标签，不迁移（丢弃）

  # ── user_tags：声明式兴趣 → Topic 垂类（校园+旅游首发）──
  interest_travel:      { tagRef: Topic/旅行, status: launch }
  interest_photography: { tagRef: Topic/摄影, status: launch }
  interest_food:        { tagRef: Topic/美食餐饮, status: launch }
  interest_tech:        { tagRef: Topic/科技, status: deferred }
  interest_art:         { tagRef: Topic/艺术创作, status: deferred }
  interest_fashion:     { tagRef: Topic/时尚穿搭, status: deferred }
  interest_sports:      { tagRef: Topic/运动, status: deferred }
  interest_music:       { tagRef: Topic/影视娱乐, status: deferred }
  interest_reading:     { tagRef: Topic/人文社科, status: deferred }
  interest_gaming:      { tagRef: Topic/游戏电竞, status: deferred }
  interest_pets:        { tagRef: Topic/宠物动物, status: deferred }
  interest_parenting:   { tagRef: Topic/亲子育儿, status: deferred }
  interest_fitness:     { tagRef: Topic/健康养生, status: deferred }
  interest_home:        { tagRef: Topic/家居生活, status: deferred }
  interest_finance:     { tagRef: Topic/金融理财, status: deferred }
  # role_*/active_*/prefer_* 为派生画像信号，非声明式兴趣 tagRef，不迁移（丢弃）

# social_tags（关系强度/频率/互动）整组废弃：属交集 relationship 维度，
# 由 follow_edge.relation_signal + IntersectionReason.relationRef 表达，不进路径制 taxonomy。
discarded_taxonomies:
  - social_tags
