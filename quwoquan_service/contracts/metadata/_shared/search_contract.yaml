
modes:
  - id: suggest
    description: 轻量联想与建议，优先低成本 lexical 路径
  - id: result
    description: 正式结果与 assistant 检索结果，允许多对象召回

execution_strategies:
  - id: local_only
    description: 仅端侧本地缓存或索引执行
  - id: remote_only
    description: 仅远端 provider 执行
  - id: hybrid_remote_fallback_local
    description: 远端优先，失败或 0 结果时回退本地
  - id: filter_only
    description: 仅作为 canonical retrieve 过滤维度，不产生独立搜索结果

resolved_sources:
  - id: local
    description: 本地直接命中
  - id: remote
    description: 远端直接命中
  - id: local_fallback
    description: 远端失败或空结果后回退本地

conversation_types:
  - id: direct
    description: 单聊或点对点会话
  - id: group
    description: 群聊或群组会话

content_type_filters:
  - id: article
    description: 文章内容
  - id: image
    description: 图片内容
  - id: video
    description: 视频内容
  - id: micro
    description: 微趣内容

defaults:
  suggest_limit: 12
  result_limit: 20
  assistant_limit: 8

# Frozen unified object-retrieval contract for AI tools and the App.
# Match conditions are ids/names/terms; filters narrow the candidates.
# Relationships are inferred by the backend; callers never send type/relation.
retrieve_contract:
  name: retrieve
  description: 统一对象检索接口；targets 指定检索的业务对象，ids/names/terms 为主匹配条件，filters(tags,timeRange) 为收窄条件，关系由后端反查推断。
  match_conditions:
    - ids
    - names
    - terms
  filter_fields:
    - tags
    - timeRange
    # near 是跨对象 geo/地点维度的"附近"过滤（lat/lng/radiusKm）；任何带 geo 维度的
    # target（entity/content 已接入，user/circle 为零契约扩展点）都参与半径检索。
    - near
  page_fields:
    - limit
    - cursor
  response_fields:
    - hits
    - citations
    - facets
    - degradeSignals
    - provenance
    # Commercial search-service envelope additions (App + AI consume; never UI-hardcoded).
    - relatedTerms
    - rankingVersion
    - experimentBucket
    - requestId
  hit_fields:
    - target
    - objectId
    - title
    - snippet
    - score
    - matchedTerms
    - matchedTags
    - evidence
    - payload
    - connectionState
    - intersectionReason
    # Ranking transparency + media layout, supplied by the cloud (R06 metadata-first).
    - rankReasons
    - rankPosition
    - coverWidth
    - coverHeight
    # 跨对象地点维度（R-S05e）：geo(lat/lng) 结构化坐标、distanceKm 仅在 near 查询下
    # 由后端按 haversine 计算、placeName 人类可读地点名。无地点维度的 hit 三者皆空，
    # 端侧只读不得自行合成。
    - geo
    - distanceKm
    - placeName
  # Fields that must NEVER be exposed to AI/App callers on the retrieve contract.
  forbidden_fields:
    - type
    - relation
    - anchors
    - kind
    - mode
    - strategy
    - purpose
    - visibility
    - fields
    - where
    - query
    - objectTypes
    - contentTypes
    - tags
    - timeRange

tool_contract:
  name: search
  description: 统一检索网页与趣我圈对象的 query-first tool
  required_fields:
    - query
  optional_fields:
    - mode
    - objectTypes
    # Canonical read-by-id consumers (for example location.place deep-link
    # recovery) use ids for an exact identity match. Query remains required for
    # lexical ranking/observability and must never be inferred from the client.
    - ids
    - limit
    - conversationType
    - contentTypes
    - categoryId
    - subCategory
    - filters
    - sortHints
    - launchContext
  internal_optional_fields:
    - queryVariants
    - searchPlans
    - acceptedSearchPlans
  response_fields:
    - hits
    - citations
    - degradeSignals
    - provenance
  hit_required_fields:
    - objectType
    - objectId
    - title
    - snippet
    - score
    - sourceDomain
    - visibility
    - reasons
    - evidence
    - connectionState
