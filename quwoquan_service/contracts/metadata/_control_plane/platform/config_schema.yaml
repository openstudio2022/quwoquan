configs:
  - key: sys.config_center.poll_interval_sec
    type: int
    owner: platform-ops
    default: 30
    scope: environment
    reload: hot
    rollout: progressive
    risk_level: medium
    ui_editable: true

  - key: sys.config_center.disk_fallback_enabled
    type: bool
    owner: platform-ops
    default: true
    scope: environment
    reload: hot
    rollout: progressive
    risk_level: high
    ui_editable: true

  # 运营态错误提示语 override 命名空间（reload: hot，无需重启即生效）。
  # 完整 key 形如 sys.error_message.<MODULE.KIND.reason>.<locale>，
  # 例如 sys.error_message.USER.AUTH.otp_mismatch.zh；值为字符串文案。
  # 命中即覆盖 codegen 静态 baseline，未命中回退 baseline（fail-safe）。
  # 实际值经 config 层下发，无需在此枚举每个错误码；本条仅登记治理/reload 语义。
  - key: sys.error_message
    key_namespace: true
    type: string
    owner: platform-ops
    scope: environment
    reload: hot
    rollout: progressive
    risk_level: high
    ui_editable: true

  - key: sys.gateway.rate_limit.per_user_rps
    type: int
    owner: platform-ops
    default: 30
    scope: service
    reload: hot
    rollout: progressive
    risk_level: high
    ui_editable: true

  - key: sys.orchestrator.downstream.timeout_ms
    type: int
    owner: platform-ops
    default: 800
    scope: service
    reload: hot
    rollout: progressive
    risk_level: high
    ui_editable: true

  - key: sys.content.mongo.max_pool_size
    type: int
    owner: platform-ops
    default: 120
    scope: service
    reload: restart
    rollout: progressive
    risk_level: medium
    ui_editable: true

  - key: sys.assistant.otel.trace_sample_ratio
    type: float
    owner: platform-ops
    default: 0.2
    scope: service
    reload: hot
    rollout: progressive
    risk_level: medium
    ui_editable: true

  # 登录成功明细仅用于漏斗钻取；聚合指标与错误事件始终全量。
  # alpha/beta/gamma 发布层覆盖为 1.0，prod 默认 0.1，可热更新灰度或回滚。
  - key: sys.user.auth.success_detail_sample_ratio
    type: float
    owner: user-identity
    default: 0.1
    scope: environment
    reload: hot
    rollout: progressive
    risk_level: high
    ui_editable: true

  - key: sys.user.auth.raw_event_retention_days
    type: int
    owner: user-identity
    default: 30
    scope: environment
    reload: restart
    rollout: progressive
    risk_level: high
    ui_editable: true

  - key: sys.user.auth.aggregate_metric_retention_days
    type: int
    owner: user-identity
    default: 180
    scope: environment
    reload: restart
    rollout: progressive
    risk_level: medium
    ui_editable: true

  - key: sys.content.worker.concurrency
    type: int
    owner: platform-ops
    default: 16
    scope: service
    reload: restart
    rollout: progressive
    risk_level: medium
    ui_editable: true

  - key: sys.client_state_sync.flush_delay_sec
    type: int
    owner: platform-ops
    default: 10
    scope: service
    reload: hot
    rollout: progressive
    risk_level: medium
    ui_editable: true

  - key: sys.client_state_sync.retry_delay_sec
    type: int
    owner: platform-ops
    default: 300
    scope: service
    reload: hot
    rollout: progressive
    risk_level: medium
    ui_editable: true

  - key: sys.client_state_sync.max_batch_size
    type: int
    owner: platform-ops
    default: 20
    scope: service
    reload: hot
    rollout: progressive
    risk_level: low
    ui_editable: true

  - key: sys.client_state_sync.max_pending_age_sec
    type: int
    owner: platform-ops
    default: 259200
    scope: service
    reload: hot
    rollout: progressive
    risk_level: low
    ui_editable: true

  - key: sys.client_state_sync.flush_on_foreground_resume
    type: bool
    owner: platform-ops
    default: true
    scope: service
    reload: hot
    rollout: progressive
    risk_level: low
    ui_editable: true

  - key: sys.client_state_sync.flush_on_network_recovered
    type: bool
    owner: platform-ops
    default: true
    scope: service
    reload: hot
    rollout: progressive
    risk_level: low
    ui_editable: true
