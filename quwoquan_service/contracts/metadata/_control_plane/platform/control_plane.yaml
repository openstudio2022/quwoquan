plane: platform-control-plane
domain: platform
dashboard:
  primary_route: /platform/observability
  widgets:
    - release_health
    - service_latency
    - error_budget
    - rollback_readiness
object_types:
  - object_type: service_catalog_entry
    view_kind: snapshot
    label: 服务目录项
    source_entity: EntityRegistry
    view_model: ServiceCatalogEntry
    risk_level: low
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_snapshot.ListServiceCatalogEntries

  - object_type: plane_binding
    view_kind: snapshot
    label: Plane 绑定
    source_entity: DeploymentMapping
    view_model: PlaneBinding
    risk_level: high
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_snapshot.ListPlaneBindings

  - object_type: prod_plane_access_isolation
    view_kind: snapshot
    label: 生产平面访问隔离投影
    source_entity: ProdPlaneAccessIsolation
    view_model: ProdPlaneAccessIsolationSnapshot
    risk_level: high
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_snapshot.GetProdPlaneAccessIsolation

  - object_type: service_config
    view_kind: snapshot
    label: 配置只读快照（IaC）
    source_entity: ConfigSnapshot
    view_model: ConfigSnapshotView
    risk_level: high
    deployment_profile: latency_sensitive
    operation_refs:
      - operation_id: ops.config_snapshot.ListServiceConfigs
      - operation_id: ops.config_snapshot.ResolveEffectiveConfig
      - operation_id: ops.config_snapshot.GetConfigSnapshot
      - operation_id: ops.config_snapshot.ListConfigDomains
    analytics_views:
      - view_id: config-risk-overview
        widget_types: [risk_distribution, rollout_backlog]
        drilldown_route_id: /platform/config/drift

  - object_type: config_instance_report
    view_kind: snapshot
    label: 实例配置报告
    source_entity: ConfigInstanceReport
    view_model: ConfigInstanceReport
    risk_level: high
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_instance_report.ListConfigInstanceReports
      - operation_id: ops.config_instance_report.ReportConfigInstance

  - object_type: release_candidate
    view_kind: snapshot
    label: 发布候选 ACK
    source_entity: ConfigInstanceReport
    view_model: ReleaseManifestCandidate
    risk_level: critical
    deployment_profile: batch_heavy
    operation_refs:
      - operation_id: ops.config_instance_report.ListReleaseCandidateAcks
      - operation_id: ops.config_snapshot.GetGrayRoutingPolicy
    analytics_views:
      - view_id: release-health
        widget_types: [success_rate, latency_p95, rollback_readiness]
        drilldown_route_id: /platform/rollout

  - object_type: environment_topology
    view_kind: snapshot
    label: 环境拓扑
    source_entity: RuntimeTopology
    view_model: EnvironmentTopology
    risk_level: medium
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_snapshot.ListEnvironmentTopologies

  - object_type: runtime_cluster
    view_kind: snapshot
    label: 运行时集群
    source_entity: RuntimeCluster
    view_model: RuntimeCluster
    risk_level: medium
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_snapshot.ListRuntimeClusters

  - object_type: runtime_service
    view_kind: snapshot
    label: 运行时服务
    source_entity: RuntimeService
    view_model: RuntimeService
    risk_level: medium
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_instance_report.ListRuntimeServices

  - object_type: runtime_instance
    view_kind: snapshot
    label: 运行时实例
    source_entity: RuntimeInstance
    view_model: RuntimeInstance
    risk_level: medium
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_instance_report.ListRuntimeInstances

  # Alertmanager 告警回流：ingest 由 Alertmanager receiver 推送（webhook），
  # active 供值班列表消费，ack 由值班人显式认领并落审计。
  - object_type: active_alert
    view_kind: workflow_case
    label: 活动告警
    source_entity: AlertTemplate
    view_model: ActiveAlert
    risk_level: high
    deployment_profile: latency_sensitive
    operation_refs:
      - operation_id: ops.config_instance_report.IngestAlertmanagerWebhook
      - operation_id: ops.config_instance_report.ListActiveAlerts
      - operation_id: ops.config_instance_report.AcknowledgeAlert
        danger_level: medium
        approval_mode: single

  - object_type: platform_control_plane_journal
    view_kind: audit
    label: 平台控制面审计与处置投影
    source_entity: ControlPlaneJournal
    view_model: PlatformControlPlaneJournal
    risk_level: medium
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.config_instance_report.ListPlatformAudits
      - operation_id: ops.config_instance_report.ListPlatformApprovals
      - operation_id: ops.config_instance_report.GetPlatformProjectionSummary
      - operation_id: ops.config_instance_report.GetPlatformTriageSummary
