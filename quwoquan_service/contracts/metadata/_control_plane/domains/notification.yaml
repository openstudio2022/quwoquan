version: 1
domain: notification
display_name: Notification
template_role: replica_ready
rollout_group: wave_1_copy
acceptance_status: integration_pass
metadata_paths:
- notification/notification
service_names:
- notification-service
control_planes:
  platform:
    enabled: true
    object_types:
    - service_catalog_entry
    - plane_binding
    config_prefixes:
    - sys.notification.
  product:
    enabled: true
    object_types:
    - notification_policy
    - moderation_case
    config_prefixes:
    - ops.notification.
minimum_package:
  metadata_files:
  - contracts/metadata/notification/notification/service.yaml
  - contracts/metadata/notification/notification/tests/e2e.yaml
  codegen_targets:
  - go_runtime
  - python_runtime
  - ops_portal
  test_evidence:
    t1:
    - contracts/metadata/notification/notification/service.yaml
    t2:
    - ../quwoquan_app/test/local_contract/cloud/notification/notification_metadata_contract__local_contract_test.dart
    - services/notification-service/tests/api_integration/app_message_lifecycle__api_integration_test.go
    - services/notification-service/tests/api_integration/notification_delivery_mongo_integration__reliability__api_integration_test.go
    t3:
    - contracts/metadata/notification/notification/tests/e2e.yaml
    t4:
    - ../quwoquan_app/test/user_acceptance/patrol/chat/chat_notification_entry__user_acceptance_test.dart
deployment:
  plane_binding_domain: notification
  plane_binding_source: quwoquan_ops/environments/process_domain_plane_mapping.yaml
  current_binding_source: quwoquan_ops/environments/process_domain_mapping.yaml
replication:
  source_template: content
  next_copy_targets: []
  copy_notes:
  - Notification is the second object counterexample with a dedicated service, Mongo aggregate plus transactional outbox,
    typed App facets, external delivery ledger, rate limiting, operator metrics, and dead-letter recovery.
blocking_gaps: []
