menus:
  - menu_id: overview
    label: 总览
    domain: overview
    route_path: /
    icon: layout-dashboard
    order: 10
    permission_scope: ops.portal.read
    object_types: [dashboard]

  - menu_id: platform-ops
    label: Platform Ops
    domain: platform-ops
    route_path: /platform
    icon: server-cog
    order: 20
    permission_scope: ops.platform.read
    object_types: [service_config, config_release]

  - menu_id: platform-config
    parent_menu_id: platform-ops
    label: 配置与可靠性
    domain: platform-ops
    route_path: /platform/config
    icon: settings-2
    order: 21
    permission_scope: ops.platform.config.read
    object_types: [service_config, config_release]

  - menu_id: platform-config-center
    parent_menu_id: platform-config
    label: 配置快照（IaC 只读）
    domain: platform-ops
    route_path: /platform/config/snapshot
    icon: settings-2
    order: 211
    permission_scope: ops.platform.config.read
    object_types: [service_config]

  - menu_id: platform-config-drift
    parent_menu_id: platform-config
    label: 实例一致性
    domain: platform-ops
    route_path: /platform/config/drift
    icon: badge-check
    order: 213
    permission_scope: ops.platform.config.read
    object_types: [config_instance_report, runtime_instance]

  - menu_id: platform-service-catalog
    parent_menu_id: platform-ops
    label: 服务目录
    domain: platform-ops
    route_path: /platform/catalog
    icon: boxes
    order: 20
    permission_scope: ops.platform.catalog.read
    object_types: [service_catalog_entry, plane_binding]

  - menu_id: platform-rollout
    parent_menu_id: platform-ops
    label: 灰度与回滚
    domain: platform-ops
    route_path: /platform/rollout
    icon: rocket
    order: 23
    permission_scope: ops.platform.rollout.read
    object_types: [config_release]

  - menu_id: platform-observability
    parent_menu_id: platform-ops
    label: 可观测与 SLO
    domain: platform-ops
    route_path: /platform/observability
    icon: chart-area
    order: 26
    permission_scope: ops.platform.observability.read
    object_types: [active_alert]

  - menu_id: product-ops
    label: Product Ops
    domain: product-ops
    route_path: /product
    icon: sparkles
    order: 30
    permission_scope: ops.product.read
    object_types: [report_queue, premium_pool_entry, l1l4_metric_snapshot]

  - menu_id: product-dashboard
    parent_menu_id: product-ops
    label: 业务总览
    domain: product-ops
    route_path: /product/dashboard
    icon: chart-column
    order: 31
    permission_scope: ops.product.dashboard.read
    object_types: [dashboard]

  - menu_id: governance
    parent_menu_id: product-ops
    label: 治理处置
    domain: product-ops
    route_path: /product/governance
    icon: shield-alert
    order: 32
    permission_scope: ops.case.read
    object_types: [report_queue]

  - menu_id: entity-homepage-governance
    parent_menu_id: product-ops
    label: 实体主页治理
    domain: product-ops
    route_path: /product/entity-homepage-governance
    icon: building
    order: 33
    permission_scope: ops.case.read
    object_types: [homepage_candidate_queue, homepage_claim_request_queue, homepage_status_report_queue]

  - menu_id: recommendation
    parent_menu_id: product-ops
    label: 推荐运营
    domain: product-ops
    route_path: /product/recommendation
    icon: chart-spline
    order: 34
    permission_scope: ops.reco.read
    object_types: [premium_pool_entry]

  - menu_id: product-l1-l4
    parent_menu_id: product-ops
    label: 四层指标
    domain: product-ops
    route_path: /product/l1-l4
    icon: chart-area
    order: 34
    permission_scope: ops.product.dashboard.read
    object_types: [dashboard, metric_registry]

  - menu_id: product-l1-l4-overview
    parent_menu_id: product-l1-l4
    label: 环境总览
    domain: product-ops
    route_path: /product/l1-l4/environment
    icon: chart-area
    order: 341
    permission_scope: ops.product.dashboard.read
    object_types: [l1l4_metric_snapshot]

  - menu_id: product-l1-l4-service
    parent_menu_id: product-l1-l4
    label: 服务下钻
    domain: product-ops
    route_path: /product/l1-l4/service
    icon: chart-area
    order: 342
    permission_scope: ops.product.dashboard.read
    object_types: [l1l4_metric_snapshot, runtime_service]

  - menu_id: audit
    label: 审计与变更
    domain: overview
    route_path: /audit
    icon: history
    order: 40
    permission_scope: ops.audit.read
    object_types: [audit_event]
