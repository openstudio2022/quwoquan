plane: product-control-plane
domain: product
dashboard:
  primary_route: /product/dashboard
  widgets:
    - moderation_summary
    - experiment_health
    - recommendation_guardrail
    - rtc_media_qoe
    - sla_watch
object_types:
  # App/telemetry ingest + operator aggregate read paths served by product-ops
  # composition root under RequireGeneratedOperationAuthorization. Keep these
  # ContractGraph operation_ids in the product plane so /ops/events* is not
  # rejected as GATEWAY.USER.route_not_found before handlers run.
  - object_type: event_record_telemetry
    view_kind: dashboard
    label: 产品遥测事件摄入与汇总
    source_entity: EventRecord
    view_model: EventSummarySlice
    risk_level: medium
    deployment_profile: latency_sensitive
    operation_refs:
      - operation_id: ops.event_record.ReportEventBatch
      - operation_id: ops.event_record.GetEventSummary

  - object_type: l1l4_metric_snapshot
    view_kind: dashboard
    label: 四层指标快照
    source_entity: ProductMetricSnapshot
    view_model: ProductMetricSnapshot
    risk_level: medium
    deployment_profile: latency_sensitive
    operation_refs:
      - operation_id: ops.event_record.ListL1L4MetricSnapshots
      - operation_id: ops.event_record.GetServiceRouteRED
      - operation_id: ops.event_record.GetGrowthOverview
      - operation_id: ops.event_record.GetPageExperience

  - object_type: rtc_media_qoe_summary
    view_kind: dashboard
    label: RTC 媒体 QoE 24 小时权威回读
    source_entity: EventRecord
    view_model: RtcMediaQoeSummarySlice
    risk_level: high
    deployment_profile: latency_sensitive
    operation_refs:
      - operation_id: ops.event_record.GetRtcMediaQoeSummary
    analytics_views:
      - view_id: rtc_media_qoe_24h
        widget_types: [metric_strip, hourly_timeseries, freshness_badge]
        drilldown_route_id: product.dashboard

  - object_type: product_control_plane_journal
    view_kind: audit
    label: 产品控制面工作流与审计投影
    source_entity: ControlPlaneJournal
    view_model: ProductControlPlaneJournal
    risk_level: medium
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: ops.event_record.ListProductWorkflows
      - operation_id: ops.event_record.ListProductAudits
      - operation_id: ops.event_record.ListProductApprovals
      - operation_id: ops.event_record.GetProductProjectionSummary
      - operation_id: ops.event_record.GetProductTriageSummary

  - object_type: report_queue
    view_kind: operational_queue
    label: 举报运营队列
    source_entity: Report
    view_model: ReportQueue
    risk_level: high
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: content.report.ListReports
      - operation_id: content.report.GetReport
      - operation_id: content.report.BeginReportReview
      - operation_id: content.report.ResolveReport
        danger_level: high
        approval_mode: single
      - operation_id: content.report.DismissReport
      - operation_id: content.post_moderation_case.GetCurrentPostModerationCase
      - operation_id: content.post_moderation_case.ReviewPostModerationCase
      - operation_id: content.post_moderation_case.DecidePostModeration
        danger_level: high
        approval_mode: single

  - object_type: homepage_candidate_queue
    view_kind: operational_queue
    label: 实体主页候选治理队列
    source_entity: Homepage
    view_model: HomepageCandidateQueue
    risk_level: high
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: entity.homepage.ListHomepageCandidates
      - operation_id: entity.homepage.IntakeHomepageCandidate
      - operation_id: entity.homepage.PublishHomepageCandidate
        danger_level: high
        approval_mode: single

  - object_type: homepage_claim_request_queue
    view_kind: operational_queue
    label: 实体主页认领审核队列
    source_entity: HomepageClaimRequest
    view_model: HomepageClaimRequestQueue
    risk_level: high
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: entity.homepage_claim_request.ListHomepageClaimRequests
      - operation_id: entity.homepage_claim_request.ReviewHomepageClaimRequest
        danger_level: high
        approval_mode: single

  - object_type: homepage_status_report_queue
    view_kind: operational_queue
    label: 实体主页状态上报审核队列
    source_entity: HomepageStatusReport
    view_model: HomepageStatusReportQueue
    risk_level: high
    deployment_profile: audit_heavy
    operation_refs:
      - operation_id: entity.homepage_status_report.ListHomepageStatusReports
      - operation_id: entity.homepage_status_report.ReviewHomepageStatusReport
        danger_level: high
        approval_mode: single

  - object_type: experiment
    view_kind: release
    label: 实验
    source_entity: Experiment
    view_model: Experiment
    risk_level: medium
    deployment_profile: latency_sensitive
    operation_refs:
      - operation_id: ops.experiment.CreateExperiment
      - operation_id: ops.experiment.ListExperiments
      - operation_id: ops.experiment.UpdateExperimentRollout
        danger_level: high
        approval_mode: single

  # 全局精选池：premium-pool 写入经 outbox 事件广播，content-service 投影进
  # rm_premium_pool 供 feed 消费；takedown 为高危处置，双 principal 双签后执行。
  - object_type: premium_pool_entry
    view_kind: policy
    label: 全局精选池条目
    source_entity: PremiumPoolEntry
    view_model: PremiumPoolEntry
    risk_level: high
    deployment_profile: latency_sensitive
    operation_refs:
      - operation_id: ops.premium_pool_entry.ListPremiumPoolEntries
      - operation_id: ops.premium_pool_entry.UpsertPremiumPoolEntry
        danger_level: high
        approval_mode: single
      - operation_id: ops.premium_pool_entry.RollbackPremiumPoolEntry
        danger_level: high
        approval_mode: single
      - operation_id: ops.premium_pool_entry.TakedownPremiumPoolEntry
        danger_level: critical
        approval_mode: dual
        idempotency: required
