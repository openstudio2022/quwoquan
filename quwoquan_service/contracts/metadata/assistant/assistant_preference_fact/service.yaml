api_routes:
- actor: persona
  application:
    aggregate_owner: AssistantPreferenceFact
    mutation_target: AssistantPreferenceFact
    invariant_target: AssistantPreferenceFact
    facet: AssistantPreferenceFactCommandFacade
    kind: command
    method: setPreference
  method: POST
  operation: SetAssistantPreference
  path: /assistant/preferences
  description: 为当前 owner 幂等设置 session 或 long_term 结构化偏好事实。
  request_fields: [scope, conversationId, kind, value, sourceType]
  response_entity: AssistantPreferenceFact
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
    - ASSISTANT.USER.preference_invalid_argument
    - ASSISTANT.USER.unauthorized
    - ASSISTANT.SYSTEM.preference_storage_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_preference_fact_command
    trace: true
    attributes: [operation, outcome, error_code, scope, kind]
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: requester_self
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private

- actor: persona
  application:
    facet: AssistantPreferenceFactQueryFacade
    kind: query
    method: listPreferences
    reader: AssistantPreferenceFactReader
    slice: AssistantPreferenceFactListView
  method: GET
  operation: ListAssistantPreferences
  path: /assistant/preferences
  description: 列出当前 owner 的偏好事实，可按 scope、conversationId 和 status 筛选。
  query_params: [scope, conversationId, status]
  response_entity: AssistantPreferenceFactListView
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
    - ASSISTANT.USER.preference_invalid_argument
    - ASSISTANT.USER.unauthorized
    - ASSISTANT.SYSTEM.preference_storage_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_preference_fact_query
    trace: true
    attributes: [operation, outcome, error_code, scope, status]
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: requester_self
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private

- actor: persona
  application:
    aggregate_owner: AssistantPreferenceFact
    mutation_target: AssistantPreferenceFact
    invariant_target: AssistantPreferenceFact
    facet: AssistantPreferenceFactCommandFacade
    kind: command
    method: revokePreference
  method: POST
  operation: RevokeAssistantPreference
  path: /assistant/preferences/{preferenceId}/revoke
  description: owner 遗忘偏好事实；重复调用保持 revoked，非 owner 返回 not_found。
  response_entity: AssistantPreferenceFact
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
    - ASSISTANT.USER.preference_not_found
    - ASSISTANT.USER.unauthorized
    - ASSISTANT.SYSTEM.preference_storage_unavailable
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_preference_fact_command
    trace: true
    attributes: [operation, outcome, error_code]
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: preference_owner
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private

- actor: persona
  application:
    aggregate_owner: AssistantPreferenceFact
    mutation_target: AssistantPreferenceFact
    invariant_target: AssistantPreferenceFact
    facet: AssistantPreferenceFactCommandFacade
    kind: command
    method: restorePreference
  method: POST
  operation: RestoreAssistantPreference
  path: /assistant/preferences/{preferenceId}/restore
  description: owner 在撤销窗口内恢复偏好事实；重复调用保持 active，非 owner 返回 not_found。
  response_entity: AssistantPreferenceFact
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: none
  error_codes:
    - ASSISTANT.USER.preference_not_found
    - ASSISTANT.USER.preference_restore_expired
    - ASSISTANT.USER.unauthorized
    - ASSISTANT.SYSTEM.preference_storage_unavailable
  privacy:
    request_classification: INTERNAL
    response_classification: SENSITIVE
    log_policy: metadata_only
  telemetry:
    metric: assistant_preference_fact_command
    trace: true
    attributes: [operation, outcome, error_code]
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: preference_owner
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private

