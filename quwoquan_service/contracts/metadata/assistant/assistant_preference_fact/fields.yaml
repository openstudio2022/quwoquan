aggregate: AssistantPreferenceFact

entities:
  AssistantPreferenceFact:
    description: owner 可见、可撤销恢复的结构化助手偏好事实
    fields:
      - name: preferenceId
        source: preferenceId
        type: string
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read
      - name: userId
        source: userId
        type: string
        constraints: [NOT_NULL]
        classification: SENSITIVE
        log_policy: redact
        api_exposure: read
        ops_exposure: read
      - name: scope
        source: scope
        type: enum
        enum_ref: AssistantPreferenceScope
        constraints: [NOT_NULL]
        classification: SENSITIVE
        log_policy: metadata_only
        api_exposure: read_write
        ops_exposure: read
      - name: conversationId
        source: conversationId
        type: string
        constraints: [NULLABLE]
        classification: SENSITIVE
        log_policy: redact
        api_exposure: read_write
        ops_exposure: read
      - name: kind
        source: kind
        type: enum
        enum_ref: AssistantPreferenceKind
        constraints: [NOT_NULL]
        classification: SENSITIVE
        log_policy: metadata_only
        api_exposure: read_write
        ops_exposure: read
      - name: value
        source: value
        type: string
        constraints: [NOT_NULL]
        classification: SENSITIVE
        log_policy: redact
        api_exposure: read_write
        ops_exposure: read
        description: 由 kind 对应 allowlist 校验的结构化 wire value，禁止自由文本记忆
      - name: sourceType
        source: sourceType
        type: enum
        enum_ref: AssistantPreferenceSourceType
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: metadata_only
        api_exposure: read_write
        ops_exposure: read
      - name: status
        source: status
        type: enum
        enum_ref: AssistantPreferenceStatus
        constraints: [NOT_NULL]
        classification: SENSITIVE
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read
      - name: revokedAt
        source: revokedAt
        type: string
        constraints: [NULLABLE]
        classification: SENSITIVE
        log_policy: redact
        api_exposure: read
        ops_exposure: read
      - name: revocationDeadline
        source: revocationDeadline
        type: string
        constraints: [NULLABLE]
        classification: SENSITIVE
        log_policy: redact
        api_exposure: read
        ops_exposure: read
      - name: createdAt
        source: createdAt
        type: string
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read
      - name: updatedAt
        source: updatedAt
        type: string
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read
      - name: version
        source: version
        type: int
        constraints: [NOT_NULL]
        classification: INTERNAL
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read

  AssistantPreferenceFactListView:
    description: owner 的偏好事实列表
    fields:
      - name: items
        source: items
        type: "[]AssistantPreferenceFact"
        constraints: [NOT_NULL]
        classification: SENSITIVE
        log_policy: metadata_only
        api_exposure: read
        ops_exposure: read
