aggregate: AssistantInteractionEvent
layer: app_side

description: |
  端侧独立测试场景。学习回路上报：feedback 动作产生 InteractionEvent。

facet_scenarios:
  - name: feedback_produces_interaction_event
    description: 用户点有用/不相关/太频繁产生 typed InteractionEvent 上报
    assertions:
      - eventId 稳定（同一动作重试不产生新 eventId）
      - runId/feedbackType/score 字段完整

  - name: report_failure_not_silently_dropped
    description: 上报失败进结构化重试，不静默丢弃
    assertions:
      - 失败抛 CloudException 或进入持久化重试队列
      - 不存在 per-event catch 吞掉后合成 BatchAck
