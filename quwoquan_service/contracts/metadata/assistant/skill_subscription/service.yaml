- actor: none
  application:
    aggregate_owner: SkillSubscription
    mutation_target: SkillSubscription
    invariant_target: SkillSubscription
    facet: SkillSubscriptionCommandFacade
    kind: command
    method: acquireDueLeases
  method: POST
  operation: TickSkillSubscriptionCron
  path: /internal/assistant/skill-subscriptions:tick

  description: 领取到期订阅的调度租约（lease + TTL）；多实例并发安全，同一 tick 窗口只有一个租约持有者投递。
  request_fields:
  - now
  - leaseOwner
  - leaseDurationMs
  response_entity: SkillSubscriptionCronTickResult
  reliability:
    timeout_ms: 30000
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - ASSISTANT.USER.subscription_invalid_argument
  - ASSISTANT.SYSTEM.subscription_storage_unavailable
  privacy:
    request_classification: INTERNAL
    response_classification: INTERNAL
    log_policy: metadata_only
  telemetry:
    metric: assistant_skill_subscription_cron
    trace: true
    attributes: [operation, outcome, error_code, leases_acquired]
  slo:
    latency_p95_ms: 5000
    availability_percent: 99.5
  authorization:
    principal: service
    ownership_policy: internal_service
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: service
    token_transport: bearer
    visibility: internal
