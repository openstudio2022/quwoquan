  description: 一次创建订阅；clientRequestId 为稳定 intent，重放返回首个结果。
  request_fields:
  - skillId
  - domainId
  - tagRefs
  - searchQueryPlan
  - trigger
  - destination
  - clientRequestId
  response_entity: SkillSubscription
  reliability:
    timeout_ms: 1500
    cancellation: supported
    retry_mode: idempotent
    max_attempts: 2
    idempotency: required
  error_codes:
  - ASSISTANT.USER.subscription_invalid_argument
  - ASSISTANT.USER.subscription_idempotency_conflict
  - ASSISTANT.USER.unauthorized
  - ASSISTANT.SYSTEM.subscription_storage_unavailable
  privacy:
    request_classification: SENSITIVE
    response_classification: SENSITIVE
    log_policy: metadata_only
