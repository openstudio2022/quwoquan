    metric: assistant_skill_subscription_command
    trace: true
    attributes: [operation, outcome, error_code, replayed]
  slo:
    latency_p95_ms: 500
    availability_percent: 99.9
  authorization:
    principal: persona
    ownership_policy: subscription_owner
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private
