aggregate: SkillSubscription
backend: mongodb
collections:
  skill_subscriptions:
    entity: SkillSubscription
    role: authoritative
    description: 订阅聚合真相源；一次创建幂等由 ownerId+clientRequestId 唯一约束承载。
    indexes:
      - { name: idx_skill_subscriptions_owner, keys: { ownerId: 1, createdAt: -1 } }
      - { name: idx_skill_subscriptions_status, keys: { status: 1 } }
      - { name: idx_skill_subscriptions_trigger, keys: { trigger.kind: 1, status: 1 } }
      - { name: uq_skill_subscriptions_client_request, keys: { ownerId: 1, clientRequestId: 1 }, unique: true, sparse: true }
status_transition_note: >
  UpdateSkillSubscriptionStatus 是收敛的 set 语义：目标状态已满足时服务端 no-op
  返回存量（不推进 updatedAt、不产生伪事件）。set 操作重放与用户再次设置同构且
  无害，故不建独立 receipt 集合；一次创建的幂等由 uq_skill_subscriptions_client_request
  唯一约束承载（聚合自身即 receipt）。

redis_cache:
  - key: "assistant:cron:lease:{subscriptionId}:{window}"
    ttl_seconds: 300
    type: string
    description: 订阅调度租约（SetNX + TTL）；同一 tick 窗口只有一个租约持有者，多实例并发安全，进程崩溃后租约过期可被重新领取。
  - key: "assistant:intersection:lease:{userId}:{window}"
    ttl_seconds: 300
    type: string
    description: 交集提醒调度租约，同上语义。
