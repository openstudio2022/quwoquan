aggregate: SkillSubscription
backend: mongodb
collections:
  skill_subscriptions:
    entity: SkillSubscription
    role: authoritative
  skill_subscriptions_command_receipts:
    entity: SkillSubscription
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。
  skill_subscriptions_outbox:
    entity: SkillSubscription
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
