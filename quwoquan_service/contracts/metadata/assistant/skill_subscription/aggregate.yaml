domain: assistant
aggregate_root: SkillSubscription
object_kind: aggregate_root
description: Persona 主动式 Skill 的触发器、目的地、状态和调度租约聚合。
storage_backend: mongodb
capabilities: [commandable, queryable, idempotent_commands]
members: []
business_rules:
  - owner persona、skillId 和 trigger 创建后不可变
  - destination 必须在当前 consent scope 内
  - 只有 active subscription 可获取调度租约
  - 同一 schedule window 只能产生一次触发事件
  - paused 可恢复，archived 为终态
lifecycle:
  states: [active, paused, archived]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/assistant/skill_subscription/model
  ports: internal/domain/assistant/skill_subscription/ports
  application: internal/application/assistant/skill_subscription
  persistence: internal/infrastructure/assistant/skill_subscription/persistence
