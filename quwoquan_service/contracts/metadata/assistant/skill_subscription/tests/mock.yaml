aggregate: SkillSubscription
layer: app_side

description: |
  端侧独立测试场景。alpha mock 与 Remote typed Facet 同构。

dto_scenarios:
  - name: subscription_wire_roundtrip
    description: SkillSubscription wire 解码（trigger/destination/status）
    assertions:
      - status 枚举拒绝未知值

facet_scenarios:
  - name: create_subscription_idempotent
    description: 同一 clientRequestId 重复创建返回同一 subscriptionId
    assertions:
      - alpha mock 与 Remote 行为同构

  - name: update_status_no_version_field
    description: 状态迁移不携带调用方版本字段
    assertions:
      - wire body 只含 status
      - 失败抛结构化 CloudException 并映射 subscription 错误码

  - name: list_failure_structured
    description: 列表失败不再吞异常返回空列表
    assertions:
      - 失败抛 CloudException；UI 展示结构化错误态而非空态
