entity: SkillSubscription

scenarios:
  - name: subscription_create_idempotent
    operation: CreateSkillSubscription
    go_func: TestSkillSubscriptionCreateIdempotent
    evidence: api_integration
    assertions:
      - ownerId+clientRequestId 唯一约束承载一次创建幂等（聚合自身即 receipt）
      - 相同 clientRequestId 重放返回首个 subscriptionId，不产生第二条订阅

  - name: subscription_status_server_owned_cas
    operation: UpdateSkillSubscriptionStatus
    go_func: TestSkillSubscriptionStatusServerOwnedCas
    evidence: api_integration
    assertions:
      - request 不携带版本字段；服务端内部 CAS + 有限重放
      - 目标状态已满足时持久化 no-op receipt，不递增版本、不产伪事件

  - name: subscription_cron_lease_no_duplicate
    operation: TickSkillSubscriptionCron
    go_func: TestSkillSubscriptionCronLeaseNoDuplicate
    evidence: api_integration
    assertions:
      - 同一 tick 窗口并发领取只有一个租约持有者
      - 租约带 TTL；进程崩溃后租约过期可被重新领取
      - 不存在进程内 claim map

  - name: subscription_owner_isolation
    operation: GetSkillSubscription
    go_func: TestSkillSubscriptionOwnerIsolation
    evidence: api_integration
    assertions:
      - 非 owner 读取返回 not_found（防枚举）
