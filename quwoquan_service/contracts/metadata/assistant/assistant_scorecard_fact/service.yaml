service:
  name: assistant-service
  domain: assistant
  owner: assistant-team
  description: AssistantScorecardFact typed append packet。
  commercial_defaults:
    status: blocked
    block_reason: append sink、metric registry 校验和 outbox 尚未完成生产装配
    gap_id: ASSISTANT_SCORECARD_FACT_WIRING
    target_story: app-cloud-business-object-commercial-closure
api_routes:
  - method: POST
    path: /internal/assistant/learning/scorecards

    operation: ReportScorecard
    actor: account
    application:
      kind: command
      facet: AssistantScorecardFactAppendSink
      method: append
      append_sink: AssistantScorecardFact
      mutation_target: AssistantScorecardFact
      invariant_target: AssistantScorecardFact
    request_entity: Scorecard
    description: 服务内部 typed append（run 完成时自评落盘）；scoreId 为唯一 dedupe key，重复上报幂等重放。
    reliability:
      timeout_ms: 3000
      cancellation: supported
      retry_mode: idempotent
      max_attempts: 3
      idempotency: required
    error_codes:
      - ASSISTANT.USER.scorecard_invalid
      - ASSISTANT.USER.unauthorized
      - ASSISTANT.SYSTEM.scorecard_sink_unavailable
    privacy:
      request_classification: SENSITIVE
      response_classification: INTERNAL
      log_policy: metadata_only
    telemetry:
      metric: assistant_scorecard_append
      trace: true
      attributes: [operation, outcome, error_code, deduped]
    slo:
      latency_p95_ms: 800
      availability_percent: 99.5
    authorization:
      principal: service
      ownership_policy: internal_service
    security:
      auth_mode: required
      principal: service
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal
