version: 1
domain: assistant
entity: AssistantScorecardFact
object_kind: append_only_fact
description: AssistantRun 的离线或在线评估分数不可变事实，仅经 typed append sink 写入。
storage_backend: mongodb
capabilities: [append_only, deduplicated_append]
business_rules:
  - scoreId、runId、metricId 与 scoreSource 创建后不可变
  - scoreValue 必须符合 metric registry 的范围和版本
  - 同一 scoreId 只追加一次，事实不提供 update 或 delete
lifecycle:
  states: [recorded]
