aggregate: AssistantScorecardFact
layer: app_side

description: |
  scorecard 为服务内部事实（run 完成自评），端侧不直接上报；
  端侧仅在 ops/learning 摘要读路径消费聚合结果。

facet_scenarios:
  - name: learning_summary_consumes_scorecard_aggregation
    description: 学习摘要视图消费 scorecard 聚合结果
    assertions:
      - 摘要字段与 metadata 投影一致
      - 服务不可用时展示结构化错误态
