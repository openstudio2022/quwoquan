
service:
  name: assistant-service
  domain: assistant
  owner: backend-team
  commercial_defaults:
    status: blocked
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: ASSISTANT_ASSISTANT_RUN_COMMERCIAL_EVIDENCE
    target_story: app-cloud-business-object-commercial-closure
  description: 小趣助手执行、上下文感知、Skill 路由与学习反馈

api_routes:
  - method: POST
    path: /assistant/search/xiaoqu

    operation: SearchXiaoquResults
    actor: persona
    application:
      kind: query
      facet: AssistantSearchQueryFacade
      method: searchXiaoquResults
      reader: AssistantSearchReader
      slice: AssistantSearchResultView
    description: 小趣搜网络结果 tab 查询（返回 AI 总结与引用，不直接创建完整对话页 UI）
    request_entity: AssistantSearchXiaoquRequestWire
    request_fields: [userQuery, searchIntensity, subAccountId, personaContextVersion, sourceSurfaceId, fromGlobalSearch, contextSnapshot]
    response_entity: AssistantSearchResultView
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /assistant/conversations/{conversationId}/runs

    operation: StartAssistantRun
    actor: persona
    application:
      kind: command
      facet: AssistantRunCommandFacade
      method: startRun
      aggregate_owner: AssistantRun
      mutation_target: AssistantRun
      invariant_target: AssistantRun
    description: 统一启动助手执行；流式结果是该 Run 的 transport，不存在 CreateTurn/StreamTurn 第二主线
    request_fields: [skillId, domainId, input, trigger, clientRequestId]
    response_entity: AssistantTurnEnvelope
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/runs/{runId}

    operation: GetAssistantRun
    actor: persona
    application:
      kind: query
      facet: AssistantTurnQueryFacade
      method: getRun
      reader: AssistantRunReader
      slice: AssistantTurnEnvelope
    description: 读取已启动助手 Run 的当前信封与恢复状态。
    response_entity: AssistantTurnEnvelope
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/runs/{runId}/events

    operation: StreamAssistantRunEvents
    actor: persona
    application:
      kind: query
      facet: AssistantRunEventTransport
      method: streamEvents
      reader: AssistantRunEventReader
      slice: AssistantStreamEvent
    description: 已启动助手 Run 的只读 SSE 事件 transport；不是第二条创建或执行主线。
    response_entity: AssistantStreamEvent
    transport: sse
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: POST
    path: /assistant/page-context

    operation: ReportPageContext
    actor: persona
    application:
      kind: command
      facet: AssistantContextCommandFacade
      method: reportPageContext
      aggregate_owner: AssistantRun
      mutation_target: AssistantRun
      invariant_target: AssistantRun
    description: 页面上下文上报
    request_entity: AssistantReportPageContextRequestWire
    request_fields: [pageType, businessObjects, contextSnapshot, userAction, userActions, subAccountId, personaContextVersion]
    response_entity: PageContextAck
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/personalization

    operation: GetEntryPersonalization
    actor: persona
    application:
      kind: query
      facet: AssistantPersonalizationQueryFacade
      method: getEntryPersonalization
      reader: AssistantEntryPersonalizationReader
      slice: AssistantEntryPersonalizationView
    description: 私助半屏入口的欢迎语、chips 与建议行云下发
    query_params: [source, pageType, tab, dimension, objectId, objectType, experienceLevel]
    response_entity: AssistantEntryPersonalizationView
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/suggested-actions

    operation: GetSuggestedActions
    actor: persona
    application:
      kind: query
      facet: AssistantSuggestionQueryFacade
      method: getSuggestedActions
      reader: AssistantSuggestedActionReader
      slice: SuggestedActionListView
    description: 获取当前页面建议操作
    query_params: [pageType, objectId]
    response_entity: SuggestedActionListView
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/policy

    operation: GetPolicy
    actor: none
    application:
      kind: query
      facet: AssistantPolicyQueryFacade
      method: getPolicy
      reader: AssistantPolicyReader
      slice: AssistantPolicyView
    description: 策略拉取
    response_entity: AssistantPolicyView

  - method: GET
    path: /assistant/skills

    operation: ListSkills
    actor: none
    application:
      kind: query
      facet: AssistantSkillCatalogQueryFacade
      method: listSkills
      reader: AssistantSkillCatalogReader
      slice: AssistantSkillCatalogListView
    description: 可用 Skill 列表（技能目录）
    query_params: [limit]
    response_entity: AssistantSkillCatalogListView

  - method: POST
    path: /assistant/skills/creation-suggest

    operation: SuggestCreationAssistance
    actor: persona
    application:
      kind: query
      facet: AssistantCreationQueryFacade
      method: suggestCreationAssistance
      reader: AssistantCreationSuggestionReader
      slice: AssistantCreationSuggestResponse
    description: |
      创作辅助建议：基于草稿摘要、已绑定圈子与主关联主页，返回可溯源标签、关联主页、标题与摘要建议。
      不生成收藏、稍后看、关注内容等已退场动作建议。
    request_entity: AssistantCreationSuggestRequest
    request_fields: [draftTitle, draftSummary, bodyDigest, boundCircleIds, primaryHomepageId]
    response_entity: AssistantCreationSuggestResponse
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/tasks

    operation: ListAssistantTasks
    actor: persona
    application:
      kind: query
      facet: AssistantPersonalDataQueryFacade
      method: listTasks
      reader: AssistantTaskReader
      slice: AssistantUserTaskListView
    description: 用户助手任务/待办列表（日程 tab 等）
    query_params: [limit, status]
    response_entity: AssistantUserTaskListView
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/memories

    operation: ListAssistantMemories
    actor: persona
    application:
      kind: query
      facet: AssistantPersonalDataQueryFacade
      method: listMemories
      reader: AssistantMemoryReader
      slice: AssistantUserMemoryListView
    description: 用户助手记忆条目列表（摘要级）
    query_params: [limit]
    response_entity: AssistantUserMemoryListView
    security:
      auth_mode: required
      principal: owner
      token_transport: bearer
      anonymous_policy: deny
      visibility: private

  - method: GET
    path: /assistant/ops/learning-summary

    operation: GetLearningOpsSummary
    actor: account
    application:
      kind: query
      facet: AssistantLearningOpsQueryFacade
      method: getLearningSummary
      reader: AssistantLearningOpsReader
      slice: AssistantLearningOpsSummaryView
    description: 运营侧读取指定用户的学习画像摘要与低分指标下钻摘要
    response_entity: AssistantLearningOpsSummaryView
    security:
      auth_mode: required
      principal: operator
      token_transport: bearer
      anonymous_policy: deny
      visibility: internal

consumers:
  - name: app
    capabilities:
      [
        search_xiaoqu_results,
        report_page_context,
        get_entry_personalization,
        get_suggested_actions,
        report_events,
        list_skills,
        list_assistant_tasks,
        list_assistant_memories,
        manage_consent,
      ]
  - name: platform-ops
    capabilities: [read_runs, read_events, read_scorecards, read_learning_summary, manage_policy, manage_skills]
  - name: recommendation-engine
    capabilities: [read_runs, read_events]

contract_test:
  mock_strategy:
    app_side:
      mock_target: assistant-service API
      data_source: fields.yaml
      scenarios:
        - name: page_context_report
          route: POST /assistant/page-context
          variants: [content_detail, feed, chat, circle]
          assertions: [status_200, context_cached]

        - name: suggested_actions
          route: GET /assistant/suggested-actions
          assertions: [status_200, actions_relevant_to_page]

        - name: entry_personalization
          route: GET /assistant/personalization
          assertions: [status_200, welcome_and_chips_returned]

        - name: skill_consent_flow
          routes:
            - POST /assistant/skills/{skillId}/consent
            - DELETE /assistant/skills/{skillId}/consent
          assertions: [consent_granted, consent_revoked]

    service_side:
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        mongodb: testcontainers (mongo:7)
        redis: miniredis/v2
      spy_targets: [event_publisher]
      mock_targets: [llm_client, embedding_client, cross_service_clients]
      data_management:
        seed: fixture 工厂预制到真实 MongoDB
        cleanup: "DeleteMany for assistant_runs, interaction_events"
        redis_cleanup: miniredis.FlushAll()
      scenarios:
        - name: page_context_to_redis
          command: ReportPageContext (with userActions)
          seed: []
          assertions:
            - "miniredis.HGetAll('page_ctx:{userId}') → contains pageType + objects"
            - "miniredis.TTL('page_ctx:{userId}') → ~300s"

        - name: feedback_learning_loop
          command: ReportInteractionEvent (feedback)
          seed: [fixture.NewAssistantRun()]
          assertions:
            - "db.interaction_events.FindOne({runId}) → feedbackType + score correct"
            - "db.assistant_runs.FindOne({_id}).satisfactionScore → updated"
            - "db.assistant_runs.FindOne({_id}).sessionPreferenceFacts or longTermPreferenceFacts → appendable"
            - "eventSpy.AssertPublished('AssistantFeedbackReceived')"

  coverage_requirements:
    - all page types covered in page_context scenarios
    - skill consent enforcement verified
    - learning feedback loop end-to-end
    - intent graph / aggregation state / process timeline v2 covered
