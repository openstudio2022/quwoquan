aggregate: AssistantRun
backend: mongodb

collections:
  assistant_runs:
    entity: AssistantRun
    indexes:
      - { name: idx_runs_user_created, keys: { userId: 1, createdAt: -1 } }
      - { name: idx_runs_conversation, keys: { conversationId: 1, createdAt: -1 } }
      - { name: idx_runs_context_window, keys: { conversationId: 1, userId: 1, status: 1, createdAt: -1 } }
      - { name: uq_runs_client_request, keys: { userId: 1, conversationId: 1, clientRequestId: 1 }, unique: true, sparse: true }
      - { name: idx_runs_skill, keys: { skillId: 1, createdAt: -1 }, sparse: true }
      - { name: idx_runs_status, keys: { status: 1, createdAt: -1 } }

  assistant_run_events:
    entity: AssistantRun
    description: AssistantRun 拥有的 SSE 有序事件日志；支持 Last-Event-ID 断线续传，保留 7 天。
    indexes:
      - { name: uq_run_events_run_seq, keys: { runId: 1, seq: 1 }, unique: true }
      - { name: idx_run_events_expire, keys: { expiresAt: 1 }, expireAfterSeconds: 0 }

  rm_assistant_learning_profile:
    entity: AssistantLearningProfile
    indexes:
      - { name: idx_alp_user, keys: { userId: 1 }, unique: true }
      - { name: idx_alp_updated, keys: { updatedAt: -1 } }
      - { name: idx_alp_last_feedback, keys: { lastFeedbackAt: -1 }, sparse: true }

redis_cache:
  - key: "assistant:learning:dedup:{kind}:{id}"
    ttl_seconds: 604800
    type: string
    description: 学习事件与评分卡幂等键

  - key: "assistant:learning:event:{userId}:{eventId}"
    ttl_seconds: 86400
    type: hash
    description: 最近学习事件热路径摘要

  - key: "rec:assistant_score:{userId}:{metricId}"
    ttl_seconds: 86400
    type: hash
    description: 助手评分卡热路径聚合

  - key: "page_ctx:{userId}"
    ttl_seconds: 300
    type: hash
    description: 页面上下文

  - key: "suggested_actions:{userId}:{pageType}:{objectId}"
    ttl_seconds: 300
    type: string
    description: Suggested Actions 缓存

  - key: "assistant:run:execution:{runId}"
    ttl_seconds: 190
    type: string
    description: AssistantRun 跨实例执行 single-flight lease

  - key: "assistant:run:cancel:{runId}"
    ttl_seconds: 600
    type: string
    description: AssistantRun 跨实例取消信号
