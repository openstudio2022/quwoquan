        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: objectType
        source: objectType
        type: string
        constraints: [NOT_NULL]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: post/circle/conversation/message/user 等业务对象类型

