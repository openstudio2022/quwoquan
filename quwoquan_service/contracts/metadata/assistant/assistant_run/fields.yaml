        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: sourceDomain
        source: sourceDomain
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read

      - name: url
        source: url
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 可点击引用 URL；站内对象可为空并由 deepLink 承载。

      - name: deepLink
        source: deepLink
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 站内对象 deep link。

      - name: score
        source: score
        type: float
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: grounding/retrieval 相关性分数。

      - name: recallSource
        source: recallSource
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: local/remote/local_fallback；与 _shared/search_contract.yaml resolved_sources 对齐。

      - name: objectTypeRef
        source: objectTypeRef
        type: string
        constraints: [NULLABLE]
        classification: PUBLIC
        log_policy: allow
        api_exposure: read
        ops_exposure: read
        description: 与 _shared/search_objects.yaml object_types.id 对齐的对象类型引用。

