domain: assistant
aggregate_root: AssistantRun
object_kind: aggregate_root

description: |
  助手执行契约入口。记录每次小趣助手执行的上下文与输入输出。
  会话、订阅、授权和画像提案均有独立生命周期，不属于 AssistantRun 聚合成员；
  轮次是由执行事件投影出的 AssistantTurnView，交互事件与评分卡通过 typed
  append-only sink 写入，也不嵌入 AssistantRun 一致性边界。
  MongoDB 存储，支撑高频写入和灵活 schema（LLM 输出多变）。
  contextEmbedding 支持 RAG 语义检索记录 run。

storage_backend: mongodb
cache_layer: redis
cache_ttl_seconds: 60

capabilities:
  - queryable
  - aggregatable
  - vector_searchable

taggable: false
vector_enabled: true

members: []

business_rules:
  - run 必须绑定 actor persona、conversationId、输入摘要与当前 consent snapshot
  - 同一 clientRequestId 只启动一个 run，重放返回同一 run identity
  - run 只能从 queued 进入 running，再进入 completed、failed 或 cancelled
  - tool 调用必须经过 operation allowlist 与目标上下文公开 Facade
  - 交互反馈、评分卡和 Turn 仅由事件产生，不嵌入 Run 聚合
lifecycle:
  states: [queued, running, completed, failed, cancelled]
  optimistic_concurrency: version
  idempotency: command_receipt

ddd_layer_mapping:
  domain_model: internal/domain/assistant/model
  ports: internal/domain/assistant/assistant_run/ports
  application: internal/application/assistant
  adapter_rest: internal/adapter/rest/assistant
  adapter_event: internal/adapter/event/assistant
