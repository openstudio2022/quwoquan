aggregate: AssistantRun
layer: e2e

description: |
  端云集成场景。app → gateway → assistant-service（deterministic/真实 provider）→ MongoDB。

execution:
  environment: gamma
  ci_strategy: advisory
  trigger: pre-release

scenarios:
  - name: assistant_run_full_stream_journey
    description: 发问 → SSE 流式回答 → 反馈上报 → 历史回读
    test_type: ui_journey
    patrol_flow: test/user_acceptance/pages/assistant/personal_assistant_dialog_page__user_acceptance_test.dart
    actors:
      app: lib/ui/assistant/pages/personal_assistant_conversation_page.dart
      service: assistant-service POST /assistant/conversations/{id}/runs + GET /assistant/runs/{runId}/events
      storage: MongoDB assistant_runs + assistant_interaction_events
    assertions:
      - SSE 事件按 seq 单调到达并以终态收尾
      - 用户反馈产生 InteractionEvent 且 eventId 幂等
      - 杀进程重启后 run 历史与回答仍可回读
