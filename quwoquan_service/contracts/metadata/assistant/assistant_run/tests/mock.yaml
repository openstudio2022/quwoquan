aggregate: AssistantRun
layer: app_side

description: |
  端侧独立测试场景。alpha mock 消费 assistant_scenarios.json fixture bundle，
  与 Remote typed Facet 同构。

dto_scenarios:
  - name: turn_envelope_wire_roundtrip
    description: AssistantTurnEnvelope 解码字段完整（status/answerText/streamState/resumeToken）
    assertions:
      - 状态机枚举拒绝未知值
      - resumeToken 缺失时恢复语义明确为不可恢复

facet_scenarios:
  - name: start_run_idempotent_intent
    description: 同一 clientRequestId 重复 startRun 返回同一 runId
    assertions:
      - alpha mock 与 Remote 行为同构
      - 失败抛结构化 CloudException（不再是 StateError）

  - name: stream_failure_structured
    description: SSE 中断/失败产出 RuntimeFailure
    assertions:
      - AssistantErrorCode.streamUnavailable 映射
      - UI 展示 errors.yaml 文案，无硬编码中文

  - name: xiaoqu_search_no_fake_fallback
    description: 小趣搜失败不再返回本地合成假结果
    assertions:
      - 失败抛 CloudException，结果页展示结构化错误态
      - 不存在 _buildFallbackSearchResult 行为
