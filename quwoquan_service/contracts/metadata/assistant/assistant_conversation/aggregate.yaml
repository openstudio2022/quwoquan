domain: assistant
aggregate_root: AssistantConversation
object_kind: aggregate_root
description: Persona 与助手连续交互的会话身份、摘要和当前执行策略聚合。
storage_backend: mongodb
capabilities: [commandable, queryable, idempotent_commands]
members: []
business_rules:
  - conversation 创建后 owner persona 不可变
  - 同一 conversation 最多一个 active run
  - summary 只由完成 run 的事件按 source sequence 与服务端内部 version CAS 推进
  - archived conversation 不接受新 run
lifecycle:
  states: [active, archived]
  optimistic_concurrency: version
  idempotency: command_receipt
ddd_layer_mapping:
  domain_model: internal/domain/assistant/assistant_conversation/model
  ports: internal/domain/assistant/assistant_conversation/ports
  application: internal/application/assistant/assistant_conversation
  persistence: internal/infrastructure/assistant/assistant_conversation/persistence
