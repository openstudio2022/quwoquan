aggregate: AssistantConversation
layer: e2e

description: |
  端云集成场景。app → gateway → assistant-service → MongoDB 全链路。

execution:
  environment: gamma
  ci_strategy: advisory
  trigger: pre-release

scenarios:
  - name: assistant_dialog_conversation_lifecycle
    description: 打开私助全屏对话 → 创建会话 → 发起 run → 历史可回读
    test_type: ui_journey
    patrol_flow: test/user_acceptance/pages/assistant/personal_assistant_dialog_page__user_acceptance_test.dart
    actors:
      app: lib/ui/assistant/pages/personal_assistant_conversation_page.dart
      service: assistant-service POST /assistant/conversations
      storage: MongoDB assistant_conversations
    assertions:
      - 会话创建后 conversationId 稳定，杀进程重启后 run 历史仍可读
      - 未登录用户无法创建会话
