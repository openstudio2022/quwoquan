aggregate: AssistantConversation
layer: app_side

description: |
  端侧独立测试场景（不依赖云端）。
  alpha mock 与 Remote 同构：同一 typed Facet 合同，行为断言一致。

dto_scenarios:
  - name: conversation_wire_roundtrip
    description: AssistantConversation wire 解码字段完整
    assertions:
      - conversationId/userId/summary/activeTurnId/lastTurnId 解码一致
      - 未知字段拒绝进入 typed 模型

facet_scenarios:
  - name: create_conversation_idempotent_intent
    description: 同一 clientRequestId 重复调用返回同一 conversationId
    assertions:
      - alpha mock 与 Remote 行为同构
      - 失败抛结构化 CloudException，不合成本地成功

  - name: conversation_not_found_structured
    description: 不存在会话返回结构化 not_found
    assertions:
      - AssistantErrorCode.conversationNotFound 映射
      - UI 错误态携带 RuntimeFailure 恢复语义
