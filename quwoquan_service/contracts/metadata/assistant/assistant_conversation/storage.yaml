version: 1
aggregate: AssistantConversation
backend: mongodb
collections:
  assistant_conversations:
    entity: AssistantConversation
    role: authoritative
  assistant_conversations_command_receipts:
    entity: AssistantConversation
    role: authoritative
    description: 与 aggregate state 和 outbox 在同一 mongodb transaction 提交的幂等回执。
  assistant_conversations_outbox:
    entity: AssistantConversation
    role: append_only
    description: 按 aggregate version 幂等发布并支持 replay/checkpoint。
