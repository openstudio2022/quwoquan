aggregate: AssistantConversation
backend: mongodb
collections:
  assistant_conversations:
    entity: AssistantConversation
    role: authoritative
    description: 会话聚合真相源；一次创建幂等由 userId+clientRequestId 唯一约束承载（聚合自身即 receipt，与 Post 发布同型）。
    indexes:
      - { name: idx_conversations_user_updated, keys: { userId: 1, updatedAt: -1 } }
      - { name: uq_conversations_client_request, keys: { userId: 1, clientRequestId: 1 }, unique: true, sparse: true }
