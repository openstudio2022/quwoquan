entity: SkillConsent

scenarios:
  - name: consent_grant_versioned_fact
    operation: GrantSkillConsent
    go_func: TestSkillConsentGrantVersionedFact
    evidence: api_integration
    assertions:
      - grant/revoke 形成版本化审计流水（历史行永久保留，最多一条 active）
      - 重复授权幂等返回现有 active 事实，不覆盖 grantedAt

  - name: consent_revoke_immediate_enforcement
    operation: RevokeSkillConsent
    go_func: TestSkillConsentRevokeImmediateEnforcement
    evidence: api_integration
    assertions:
      - 撤权后敏感能力执行点立即拒绝（skill_consent_required）
      - 撤权行保留 revokedAt 供审计

  - name: consent_fail_closed_everywhere
    operation: ListConsents
    go_func: TestSkillConsentFailClosedEverywhere
    evidence: local_contract
    assertions:
      - store 未装配或查询失败时返回 ASSISTANT.SYSTEM.consent_unavailable
      - creationAssistantEnabled 不因双 store 缺失放行、不吞查询错误
      - 伪造 X-Client-User-Id 返回 401

  - name: consent_gate_on_execution_point
    operation: GrantSkillConsent
    go_func: TestConsentGateEnforcedInAgentLoop
    evidence: local_contract
    assertions:
      - RequiresConsent 技能在 agent loop 执行点强制校验 active consent
      - 未授权执行返回 skill_consent_required 而非静默降级
