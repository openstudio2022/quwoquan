api_routes:
- actor: account
  application:
    aggregate_owner: SkillConsent
    mutation_target: SkillConsent
    invariant_target: SkillConsent
    facet: SkillConsentCommandFacade
    kind: command
    method: grantConsent
  description: 授权 Skill
  method: POST
  operation: GrantSkillConsent
  path: /v1/assistant/skills/{skillId}/consent
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private
- actor: account
  application:
    aggregate_owner: SkillConsent
    mutation_target: SkillConsent
    invariant_target: SkillConsent
    facet: SkillConsentCommandFacade
    kind: command
    method: revokeConsent
  description: 撤销 Skill 授权
  method: DELETE
  operation: RevokeSkillConsent
  path: /v1/assistant/skills/{skillId}/consent
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private
- actor: account
  application:
    facet: SkillConsentQueryFacade
    kind: query
    method: listConsents
    reader: SkillConsentListReader
    slice: SkillConsentListSlice
  description: 授权列表
  method: GET
  operation: ListConsents
  path: /v1/assistant/consents
  security:
    anonymous_policy: deny
    auth_mode: required
    principal: owner
    token_transport: bearer
    visibility: private
consumers:
- capabilities:
  - grant
  - revoke
  - list
  name: app
- capabilities:
  - read
  - revoke_any
  name: platform-ops
contract_test:
  mock_strategy:
    app_side:
      scenarios:
      - assertions:
        - consent_granted
        - consent_revoked
        name: consent_lifecycle
        routes:
        - POST /v1/assistant/skills/{skillId}/consent
        - DELETE /v1/assistant/skills/{skillId}/consent
    service_side:
      data_management:
        cleanup: TRUNCATE skill_consents CASCADE
        seed: fixture 工厂预制到真实 PG
      description: 使用真实测试数据库，不 mock 存储层
      real_engines:
        postgres: embedded-postgres
      scenarios:
      - assertions:
        - SELECT * FROM skill_consents WHERE user_id=? AND skill_id=? → row exists, revoked_at IS NULL
        - eventSpy.AssertPublished('SkillConsentGranted', {skillId, grantedScope})
        command: GrantSkillConsent
        name: grant_consent
        seed: []
      - assertions:
        - PG unique violation (partial index) → handled gracefully
        command: GrantSkillConsent x2 (same user+skill)
        name: duplicate_consent_rejected
        seed:
        - fixture.NewSkillConsent()
      - assertions:
        - SELECT revoked_at FROM skill_consents → NOT NULL
        - eventSpy.AssertPublished('SkillConsentRevoked')
        command: RevokeSkillConsent
        name: revoke_consent
        seed:
        - fixture.NewSkillConsent()
      spy_targets:
      - event_publisher
service:
  commercial_defaults:
    block_reason: canonical operation awaits object-centered commercial migration
    gap_id: ASSISTANT_SKILL_CONSENT_COMMERCIAL_EVIDENCE
    status: blocked
    target_story: app-cloud-business-object-commercial-closure
  domain: assistant
  name: assistant-service
  owner: backend-team
version: 1
