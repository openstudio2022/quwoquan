domain: assistant
entity: SkillConsent
object_kind: aggregate_root

description: |
  Skill 授权同意独立聚合。拥有 grant/revoke/version/audit 生命周期，
  不作为 AssistantRun 的 owned member。
  PostgreSQL 存储，授权决策必须准确一致。

storage_backend: postgres
cache_layer: none
capabilities:
  - queryable

taggable: false
vector_enabled: false

business_rules:
  - consent identity 固定为 personaId + skillId + scope
  - grant 必须记录版本化条款、actor 与审计时间
  - revoke 立即阻断后续 run，但不删除历史审计
  - AssistantRun 只能读取当前 consent Slice，不能直接修改 consent
lifecycle:
  states: [granted, revoked, expired]
  optimistic_concurrency: version
  idempotency: command_receipt

ddd_layer_mapping:
  domain_model: internal/domain/assistant/model
  ports: internal/domain/assistant/skill_consent/ports
  application: internal/application/assistant
  adapter_rest: internal/adapter/rest/assistant
  adapter_event: internal/adapter/event/assistant
