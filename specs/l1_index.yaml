version: 2
owner: quwoquan-platform
source:
  canonical_tree: specs/feature-tree/tree_index.yaml
  journey_registry: specs/feature-tree/journey_scenario_registry.yaml
purpose: >
  领域服务工程映射索引。L1_domain_service 是产品领域服务，不等同于单个后端部署进程；
  本文件负责把特性树领域服务映射到 app、metadata、service、deploy 和 test 工程资产。

schema:
  required_fields:
    - key
    - title
    - directory
    - category
    - app_modules
    - metadata_domains
    - service_modules
    - deploy_processes
    - test_roots

domain_services:
  - category: functional
    title: 内容发现与发布
    key: discovery-content
    directory: specs/feature-tree/discovery-content
    app_modules:
      - quwoquan_app/lib/ui/discovery
      - quwoquan_app/lib/ui/content
      - quwoquan_app/lib/cloud/services/content
    metadata_domains:
      - quwoquan_service/contracts/metadata/content
      - quwoquan_service/contracts/metadata/integration
    service_modules:
      - quwoquan_service/services/content-service
      - quwoquan_service/services/integration-service
    deploy_processes:
      - content-service
      - integration-service
      - gateway
      - orchestrator
    test_roots:
      - quwoquan_app/test/ui/discovery
      - quwoquan_app/test/ui/content
      - quwoquan_app/test/cloud/content
      - quwoquan_service/services/content-service/tests

  - category: functional
    title: 圈子社区
    key: circle-community
    directory: specs/feature-tree/circle-community
    app_modules:
      - quwoquan_app/lib/ui/circle
      - quwoquan_app/lib/cloud/services/circle
    metadata_domains:
      - quwoquan_service/contracts/metadata/social
    service_modules:
      - quwoquan_service/services/circle-service
    deploy_processes:
      - circle-service
      - gateway
      - orchestrator
    test_roots:
      - quwoquan_app/test/ui/circle
      - quwoquan_app/test/cloud/circle
      - quwoquan_service/services/circle-service/tests

  - category: functional
    title: 聊天与会话
    key: chat-conversation
    directory: specs/feature-tree/chat-conversation
    app_modules:
      - quwoquan_app/lib/ui/chat
      - quwoquan_app/lib/cloud/services/chat
    metadata_domains:
      - quwoquan_service/contracts/metadata/messages
    service_modules:
      - quwoquan_service/services/chat-service
    deploy_processes:
      - chat-service
      - gateway
      - orchestrator
    test_roots:
      - quwoquan_app/test/ui/chat
      - quwoquan_app/test/cloud/chat
      - quwoquan_service/services/chat-service/tests

  - category: functional
    title: 用户身份画像与关系
    key: user-identity-profile-relationship
    directory: specs/feature-tree/user-identity-profile-relationship
    app_modules:
      - quwoquan_app/lib/ui/user
      - quwoquan_app/lib/ui/welcome
      - quwoquan_app/lib/ui/settings
      - quwoquan_app/lib/cloud/services/user
    metadata_domains:
      - quwoquan_service/contracts/metadata/user
    service_modules:
      - quwoquan_service/services/user-service
    deploy_processes:
      - user-service
      - gateway
      - orchestrator
    test_roots:
      - quwoquan_app/test/ui/user
      - quwoquan_app/test/ui/welcome
      - quwoquan_app/test/cloud/user
      - quwoquan_service/services/user-service/tests

  - category: functional
    title: 助手运行与学习闭环
    key: assistant-run-learning
    directory: specs/feature-tree/assistant-run-learning
    app_modules:
      - quwoquan_app/lib/ui/assistant
      - quwoquan_app/lib/cloud/services/assistant
    metadata_domains:
      - quwoquan_service/contracts/metadata/assistant
      - quwoquan_service/contracts/metadata/recommendation
    service_modules:
      - quwoquan_service/services/assistant-service
      - quwoquan_service/services/rec-model-service
    deploy_processes:
      - assistant-service
      - rec-model-service
      - product-ops
    test_roots:
      - quwoquan_app/test/ui/assistant
      - quwoquan_app/test/common/assistant
      - quwoquan_service/services/assistant-service/tests

  - category: functional
    title: 全局搜索体验
    key: global-search-experience
    directory: specs/feature-tree/global-search-experience
    app_modules:
      - quwoquan_app/lib/ui/search
      - quwoquan_app/lib/core/providers/app_providers.dart
    metadata_domains:
      - quwoquan_service/contracts/metadata/content
      - quwoquan_service/contracts/metadata/messages
      - quwoquan_service/contracts/metadata/social
      - quwoquan_service/contracts/metadata/user
    service_modules:
      - quwoquan_service/services/content-service
      - quwoquan_service/services/chat-service
      - quwoquan_service/services/circle-service
      - quwoquan_service/services/user-service
      - quwoquan_service/services/entity-service
    deploy_processes:
      - gateway
      - orchestrator
    test_roots:
      - quwoquan_app/test/ui/search
      - quwoquan_app/test/cloud/search

  - category: functional
    title: 共享主页网络
    key: shared-homepage-network
    directory: specs/feature-tree/shared-homepage-network
    app_modules:
      - quwoquan_app/lib/ui/entity
      - quwoquan_app/lib/ui/content
    metadata_domains:
      - quwoquan_service/contracts/metadata/entity
      - quwoquan_service/contracts/metadata/content
      - quwoquan_service/contracts/metadata/social
    service_modules:
      - quwoquan_service/services/entity-service
      - quwoquan_service/services/content-service
      - quwoquan_service/services/circle-service
    deploy_processes:
      - entity-service
      - content-service
      - circle-service
      - gateway
      - orchestrator
    test_roots:
      - quwoquan_app/test/ui/entity
      - quwoquan_app/test/cloud/entity
      - quwoquan_service/services/entity-service/tests

  - category: nonfunctional
    title: 统一运行时能力域
    key: runtime
    directory: specs/feature-tree/runtime
    app_modules:
      - quwoquan_app/lib/core
      - quwoquan_app/lib/cloud/runtime
      - quwoquan_app/lib/app
    metadata_domains:
      - quwoquan_service/contracts/metadata/_shared
    service_modules:
      - quwoquan_service/runtime
      - quwoquan_service/platform
    deploy_processes:
      - all
    test_roots:
      - quwoquan_app/test/core
      - quwoquan_app/test/cloud
      - quwoquan_service/runtime

  - category: nonfunctional
    title: 平台运维治理
    key: platform-ops-governance
    directory: specs/feature-tree/platform-ops-governance
    app_modules:
      - agent_ops
    metadata_domains:
      - quwoquan_service/contracts/metadata/ops
    service_modules:
      - quwoquan_service/services/platform-ops-service
    deploy_processes:
      - platform-ops
    test_roots:
      - agent_ops/tests
      - quwoquan_service/services/platform-ops-service

  - category: nonfunctional
    title: 产品运营增长
    key: product-ops-growth
    directory: specs/feature-tree/product-ops-growth
    app_modules:
      - quwoquan_app/lib/ui/discovery
      - quwoquan_app/lib/ui/assistant
    metadata_domains:
      - quwoquan_service/contracts/metadata/ops
      - quwoquan_service/contracts/metadata/recommendation
    service_modules:
      - quwoquan_service/services/product-ops-service
      - quwoquan_service/services/rec-model-service
    deploy_processes:
      - product-ops
      - rec-model-service
    test_roots:
      - quwoquan_app/test/smoke
      - quwoquan_service/services/product-ops-service

  - category: nonfunctional
    title: 网关与编排基础能力
    key: gateway-orchestrator-foundation
    directory: specs/feature-tree/gateway-orchestrator-foundation
    app_modules:
      - quwoquan_app/lib/cloud/runtime
      - quwoquan_app/lib/app
    metadata_domains:
      - quwoquan_service/contracts/metadata/_shared
    service_modules:
      - quwoquan_service/runtime
    deploy_processes:
      - gateway
      - orchestrator
    test_roots:
      - quwoquan_app/test/cloud
      - quwoquan_service/runtime

  - category: nonfunctional
    title: 推荐平台
    key: recommendation-platform
    directory: specs/feature-tree/recommendation-platform
    app_modules:
      - quwoquan_app/lib/ui/discovery
    metadata_domains:
      - quwoquan_service/contracts/metadata/recommendation
      - quwoquan_service/contracts/metadata/_vectors
    service_modules:
      - quwoquan_service/services/rec-model-service
      - quwoquan_data
    deploy_processes:
      - rec-model-service
    test_roots:
      - quwoquan_service/services/rec-model-service
      - quwoquan_data/tests
