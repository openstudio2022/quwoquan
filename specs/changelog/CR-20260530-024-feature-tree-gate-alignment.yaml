    summary: >-
      内容多形态统一 Gate-V2 收口时，gate_repo.sh（scope=all）暴露出与内容统一无关、但阻塞全量门禁的仓库级
      feature-tree 约定迁移残留：本轮特性树已切到新 L3 约定（design/plan/tasks 折入 spec.md，删除 408 个
      tasks.md；acceptance.yaml 由 feature/level 字段改为 node 块；l1_index.yaml 升级为 version:2 的
      domain_services 结构），新校验脚本 verify_feature_tree_refactor.sh / verify_acceptance_standard.sh
      据此通过，但若干旧校验脚本仍按旧约定强校验，导致 gate-full 在多个领域整树失败。将以下三处对齐到新约定：
      (1) quwoquan_service/scripts/gate.sh §5.1–5.3：always_required 去掉 tasks.md（保留 spec.md+acceptance.yaml）、
      删除 design.md 按 tasks.md [x] 强制的旧逻辑、acceptance 结构检查由 feature/level 改为 node.id/node.level、
      归档前 pending 检查触发判据由「tasks.md 全 [x]」改为「acceptance.archived==true」、验收项与 recorded 测试
      改读分层块 gwt/sit/uat/domain_acceptance 的 tests.recorded（路径列表），§5.5④ cancelled/deprecated 判据
      同步由 tasks.md 改为 acceptance pending。 (2) verify_specs_l1_hierarchy.sh：由旧 l1 数组改读 v2
      domain_services（字段取自文件 schema.required_fields），并补 recommendation-platform/README.md。
      (3) verify_ff_config_contract.sh：3 个 config 节点的统一门禁矩阵（/prd、/design、submit-with-gate）随
      tasks.md 删除迁入各自 spec.md，校验改读 spec.md。对齐后 gate_repo.sh（service+app+portal）[gate] OK。
    reason: >-
      新 L3 约定（spec.md + acceptance.yaml，禁 tasks 治理文档）由 specs/feature-tree/00_FEATURE_TREE_STANDARD.md
      §六与 verify_feature_tree_refactor.sh 确立为 canonical；旧校验脚本为滞后产物，按「不带债务进入下一阶段」
      口径必须对齐，否则全量门禁无法绿、内容多形态统一无法开工。
