    summary: |
      冻结浙江、四川四载体商业放量的统一口径：主页先形成 20,000 条以上发现候选，
      去重并完成 source-ready 预筛后保留至少 12,000 个唯一旅行对象，每省冻结
      5,000 个不可替换目标；主页、文章、图片、视频依次通过 Canary、H200、
      H1000、H10K，10,000 个 accepted 对象必须在 24 小时内完成 canonical、
      immutable release、Gamma import/API/App UAT、回滚与重放。100,000/日只依据
      四车道真实 H10K 的 p50/p95、首过率、unitPassedCost、source-ready capacity、
      queue lag 与 24h soak evaluate-only，不实际生产。

      修正主页 L2/L3 仍把 2,899 项 M3 历史主清单和 60 篇 launch posts 描述为最终
      交付的规格漂移；明确 Wikipedia、百度百科、今日头条百科三源
      encyclopedia-primary 闭集、五路 discovery、H200/H1000/M3/H10K 数量合同和
      每档 rollout closure。生产执行只认 qwq-data CLI、单 execution work package、
      Mongo+Redis ReliableTask、typed Python worker、Cursor SDK author/reviewer、
      权威成本账本和对象事务，不保留控制面吞吐或文件存在冒充 accepted 的口径。
    reason: |
      原规格仍停留在 2,899 实体和单机流水线，和已冻结的 H10K acceptance、用户要求
      以及生产 ReliableTask 主线冲突；若不先修正，后续 12K 扩池、四车道放量和
      100K/日容量结论会同时维护两套完成定义。
    change_type:
      - specification
      - data
      - service
      - local_contract
      - api_integration
