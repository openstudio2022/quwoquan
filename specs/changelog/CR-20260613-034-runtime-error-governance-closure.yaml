id: CR-20260613-034-runtime-error-governance-closure
title: 端云错误码治理闭环与用户提示语热配置收口
slug: runtime-error-governance-closure
revision: 1
status: specified

affected_nodes:
  - specs/feature-tree/runtime/runtime-errors
