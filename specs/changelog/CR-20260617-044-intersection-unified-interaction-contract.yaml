      - 只附加策略：保留 reason/point/tally/author_impact 已冻结字段位置不动，旁挂统一子类型；intersection_point 保留裸 sampleAvatarUrls 过渡。
      - 单通道不变量由契约测试强制：join(primarySpans.text)==primaryText、join(briefSpans.text)==briefText；禁止 recommendationTraceId / reason 级 displayText/label/sharedCount 回归。
      - Go 侧新字段为「只附加的可选投影」，云端暂不产出时端侧默认空值降级（spans → primaryText → 隐藏），与 §20.5 漂移 a/e 延后策略一致；未削弱任何 Go 契约。
      - Mock 模拟云端产出 spans/visuals/target（保证不变量），Remote 只读 codegen DTO；alpha seed 与 contract fixture intersection_core 同源。
      - 完整分页影响明细 API（listAuthorImpactEvidence）列为 P1：evidenceSnapshotId 已在契约预留，未就绪前我的影响力只展示云侧 sampleVisuals 样本、明确不编造全量；需用户确认后登记 docs/outstanding_risks_backlog.md。
