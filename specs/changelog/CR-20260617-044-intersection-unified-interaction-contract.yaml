entries:
  - timestamp: "2026-06-17T21:20:00+08:00"
    summary: |
      把「可交互交集句」从逐 DTO 打补丁升级为横切所有交集展示面的统一交互子契约 +
      端侧统一渲染器 / 导航器，回写 Phase 0 §20.7。新增 recommendation 域三个共享值对象
      IntersectionTarget / IntersectionTextSpan / IntersectionVisual；reason/point/tally/author_impact
      四个 read_model 只附加旁挂 primarySpans / briefSpans / sampleVisuals / sourceRef /
      countObjectKind / countTarget / evidenceSnapshotId / impactId。冻结单通道不变量
      join(spans.text)==primaryText/briefText。我的主页「我的连接 / 我的影响力」为首个落地：
      名字 span 进对应主页、数字 span 进维度(+sourceRef)下钻列表、列表项进对象页；
      新建端侧共享 InteractiveIntersectionText + IntersectionVisualCluster + IntersectionTargetNavigator，
      供 B–E 直接复用。myIntersections 路由新增 sourceRef query 支持维度内证据组过滤。
    reason: |
      旧实现各交集 surface（我的主页 / 用户主页 / 圈子主页 / 实体主页 / 首页推荐页）对「名字可点击、
      数字可点击、整行可点击」各写一套，且我的连接 / 我的影响力仍是呆板纯文本行 + 纯文本 action sheet。
      必须先沉淀统一交互子契约 + 共享渲染器，避免 B–E 二次分叉，并让 A 成为首个落地标杆。
