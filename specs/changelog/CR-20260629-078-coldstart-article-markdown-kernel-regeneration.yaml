      quwoquan_data/scripts/governance/creator_pool/content_bind.py（而非手改 JSON 制造漂移）：为 article
      载体补 _stub_article_markdown（QWQ Rich Markdown v1，含 front matter 桌面）+ _stub_article_render_profile
      （dict，contentVertical=travel），且不再产出 articleDocument；经 qwq-data materialize 重生
      content_scenarios.json。新增生成器合约测试防回退。
    reason: |
      markdown-article-kernel/spec.md 冻结「长文唯一持久化真相源为 Markdown（articleMarkdown +
      articleAssetManifest + articleRenderProfile），旧 articleDocument 预制数据全部重生成」。该冷启动文章
      未走 Markdown 重生成，门禁红、端云长文契约存数据漂移（contentType=article 却无 Markdown 真相源），
      冷启动文章无法经现有 reader（codec→QwqMarkdownAst→MarkdownPaginationEngine→ImmersiveMarkdownReader
      →pageflip）正确渲染。按「未上线零兼容、零技术债容忍」与单一真相，修法必须落在生成器，不得手改 codegen/
      materialize 产物制造第二真相。次序上排在 R-PAGEFLIP-001 之后（reader 渲染末端经 pageflip 层），
      pageflip 层已于 CR-20260629-077 逐帧同构稳定，前置已满足。
