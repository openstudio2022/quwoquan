    summary: |
      /continue-dev 场景 B：在 R-CS06 闭环与 CR-052 规模评估后，收口 backlog R-TST03——9 个
      三层迁移前已存在的 App 红测。根因均为测试断言落后于产品契约，非 canonical wrapper 回归：

      1. 错误态：页面/选点/作品入口已统一 `AppPageErrorState`+`runtimeErrorSemantic`（如
         homepageLoadFailedTitle/workOpenFailedTitle/pageLoadFailedTitle+Message），测试仍断言旧
         UITextConstants.*Unavailable* 字面量。
      2. 聊天：`ChatMessageBubble` 图片/视频预览改 `AppCachedNetworkImage`；回执测试补 `ProviderScope`。
      3. 圈子 hub：契约 seed 的 groupFeedPostIds 与摄影 tab category 过滤不对齐；grid 导航测试用
         `_LegacyHubCircleFeedRepository` 注入稳定 circle_post_* 样本；摄影 inline carousel 禁用外层
         onTap——图片测渲染、视频测 work-browser 导航。

      未改产品行为，只修测试与 mock 注入以对齐 runtime error cutover 与契约 seed。
    reason: |
      canonical `make test-local-contract` 被 9 个迁移前存量红测阻断，易误判为目录门回归；诚实收口需
      对齐测试与当前产品真相源，而非放宽 gate 或恢复旧文案 shim。
