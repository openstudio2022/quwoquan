    notes:
      - 数据工程 materialize 侧此前已能写 manifest semanticMentions；本轮断点专修 App 用户创作发布路径。
      - 客户端 isSemanticTargetRefValid 仅作防御性过滤，服务端 ValidTargetRef 仍是唯一权威校验。
      - 本轮不登记新风险（用户指令）；R-CS06 已在 docs/outstanding_risks_backlog.md 标记已解决并附证据。
