entries:
  - timestamp: "2026-06-21T18:00:00+08:00"
    summary: |
      打通 App 用户创作发布路径的 semanticMentions 端云契约（backlog R-CS06），消除发布 wire codegen
      按字段名硬编码导致的类型桥接债，使端侧 entity/tag 正文内联经结构化 semanticMentions 落到服务端
      EntityRefs/TagRefs：

      A. wire codegen 改为 metadata type 驱动（R06/R24）：
        - content_post_mutation_wires_codegen.go 新增 dartMutationWireFieldType(field, fieldTypes) +
          objectMetaTypes 闭集，按 fields.yaml 的字段 `type` 渲染 Dart 类型：[]object→List<CloudJsonMap>?、
          其它 []X→List<String>?、object/GeoPoint→CloudJsonMap?、标量(string/int/enum/ObjectId/缺失)→String?；
          新增 _mutationMapList helper 解析结构化数组。
        - main.go 由 Post 实体定义线程化 field→type 映射传入 wire 生成器。
        - 重生成 content_post_mutation_wires.g.dart：三处 wire 类（CreatePost/UpdatePost/PromotePostToWork）
          semanticMentions/reviewAspects 由 String? → List<CloudJsonMap>?；illustrationAssetId/sourcePostId
          等 ObjectId 标量不回归仍为 String?；make codegen-app 幂等无新漂移。

      B. App 发布侧构建 published semanticMentions：
        - create_page_remote_helpers.dart 新增 semanticMentionsForPayload(state)，由正文 entity/tag 内联 +
          settings/homepage refs 构建 {kind,status:published,targetRef} 行，含 isSemanticTargetRefValid
          客户端防御校验（镜像服务端 ValidTargetRef，去非法/candidate/重复）；buildCreatePostPayloadMap 注入。
        - 顶层 tagRefs/entityRefs 仍是只读投影，被 wire writable_fields 剥离，不进 wire payload。

      C. 服务端契约（既有 applySemanticMentionPayload 行为锁定）：
        - CreatePost 消费 semanticMentions：published+valid 投影落 EntityRefs/TagRefs；pending_review/rejected
          不落；published+非法 targetRef 整单拒绝；顶层 refs 与投影不一致拒绝（杜绝绕 mention 直写 refs 旁路）。
    reason: |
      服务侧 semantic.Project 已对称支持 entity/tag 并把 tagRefs/entityRefs 当作 published semanticMentions
      的只读投影，但 App 发布从不构建结构化 semanticMentions，且 wire codegen 按字段名硬编码把 []object 误
      生成为 String?，端云类型与语义双重断裂——用户创作的 entity/tag 内联发布后均无法落服务端 refs，grounding
      与推荐数据来源链在 App 发布侧断点。按「当前未上线、对桥接债零容忍」原则，metadata-first 修正 wire 类型
      渲染、补齐 App 构建与端云契约测试，闭合断点。
