id: CR-20260716-108-request-wait-and-search-recovery
title: 全 App 异步等待恢复规范与全局搜索终态修复
slug: request-wait-and-search-recovery
revision: 1
status: implemented

affected_nodes:
  - specs/feature-tree/runtime/runtime-client-foundation/page-horizontal-quality
  - specs/feature-tree/global-search-experience/cross-domain-search-journey/full-screen-search-shell-and-entry
  - specs/feature-tree/global-search-experience/cross-domain-search-journey/multi-domain-result-composition

entries:
  - timestamp: "2026-07-16T00:00:00+08:00"
    summary: |
      将全 App 等待反馈收敛为 foreground/action/long_task 三种模式和 1.5/3/6
      三个语义时间点，只新增 AppRequestWaitController 与 AppRequestFeedback。
      搜索移除输入框 spinner，本地域与云实体并行；query supersede、dispose 和
      6 秒 deadline 通过真实 transport cancellation 收口。首页沿用既有 skeleton，
      缓存刷新保留正文，空白阻塞 3 秒提示，6 秒进入既有错误或重试终态。
    reason: |
      旧全局搜索同时在输入框和正文表达进度，并把本地联想、同步预热和云端实体
      串入同一等待链；异常、timeout 与 query 替换存在未关闭 pending 或旧响应回写。
      页面之间又缺少统一的等待恢复契约和证据看护。本变更以最小公共能力解决
      计时、取消与反馈位置，不新建业务 outcome 状态体系或 request profile 注册表。
    change_type:
      - app
