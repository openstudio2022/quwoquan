        - make verify-app-page-horizontal-quality
        - make verify-test-coverage-map
      recorded:
        - AppRequestWaitController 的 1.5/3/6 边界、action metadata deadline、long_task、supersede/dispose 和 AppRequestFeedback 无障碍/reduced-motion 定向测试通过。
        - 可取消 HTTP、搜索联想/正式结果、“钱”命中“东钱湖”、首页缓存刷新与慢提示的 local_contract/UAT 已串行复跑通过；flutter analyze --no-pub lib test 通过。
        - metadata/OpenAPI/ContractGraph、P9 79 页矩阵、69 surface 证据、覆盖映射、验收标准、no-fake 和测试目录门禁通过。
        - 中间复跑曾受并行媒体改动的编译错误阻断；该工作树可编译后已重跑成功，不删除此失败历史。
    notes:
      - alpha full/lite fixture 已增加发布态“东钱湖”；beta 的延迟、取消、部分失败由注入式 local_contract 看护。
      - gamma 真实“钱”查询与 prod canonical `/v1/search` 拓扑证据尚未完成；代码与常量一致不等于环境闭环。
      - prod 不部署、不导入数据；真实环境证据齐备前保持 GATE_BLOCK。
      - App gate 当前在入口被本地额外 `main` 分支的 branch policy 阻断；本 CR 不越权删除用户分支。
      - gamma-local 实时健康检查为 22/23，被无关媒体资产 source.mp4 404 阻断；因此不声称 gamma 真实搜索已验收。
