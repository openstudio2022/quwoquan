        - flutter test --no-pub test/local_contract/core/widgets/app_request_feedback__local_contract_test.dart
        - flutter test --no-pub test/local_contract/cloud/runtime/cloud_http_client_cancellation__local_contract_test.dart
        - flutter test --no-pub test/local_contract/ui/search/pages/global_search_page_widget__local_contract_test.dart
        - flutter test --no-pub test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
