entries:
  - timestamp: "2026-07-17T17:57:00+08:00"
    summary: |
      取消 aggregate command 默认公开 expectedVersion；Store CAS 保持服务端内部机制。
      operation 仅在真实多写者快照覆盖时声明 If-Match。
      Post 发布由本地自动保存草稿、单一持久 PublishIntent、稳定幂等键和永久 receipt
      替换 CreatePost + BindMediaAssetsToPost + PublishPost 三段公开流程。
    reason: |
      Post 是单作者、发布后内容不可编辑的一次性提交。让用户参与版本协商既不能解决
      响应丢失和跨步骤崩溃，又会制造可避免的提交失败；不同对象类型也需要不同的一致性机制。
