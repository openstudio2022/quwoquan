  - timestamp: "2026-07-17T19:45:00+08:00"
    summary: |
      完成本地草稿分项持久化失败检查与索引损坏恢复、Post 发布意图进程重启自动重放 UAT，
      并补齐浏览器发送 Idempotency-Key / If-Match 所需 CORS 合同。
      本地合同、真实 Mongo 并发重放、Circle API 集成与 UAT 已通过；gamma_local 运行制品
      尚未取得，因此对应 Story acceptance 仍保持 partial。
    reason: |
      发布意图持久化只有在草稿本身可恢复、Web 预检允许业务幂等头、且重启后无需用户
      再次点击时才形成完整端侧可靠性闭环。
