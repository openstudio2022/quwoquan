  - timestamp: "2026-07-17T20:35:00+08:00"
    summary: |
      将 Comment 删除/置顶/附件绑定和 ProfileUpdateProposal 确认/应用/拒绝收口为
      服务端内部 CAS；公开请求不再携带版本字段。ProfileUpdateProposal 新增 applying
      持久化检查点，先阻断并发 Reject，再按 proposalId 幂等应用 Persona，消除跨聚合
      半成功窗口。ContractGraph version precondition 改为类型化枚举，并以合同测试固定
      全仓仅四个真实多人快照覆盖操作使用 If-Match。OpenAPI 由同一策略生成
      Idempotency-Key/If-Match header；目标状态已满足的 Comment/ProfileProposal 命名
      意图持久化 no-op receipt，不递增版本或制造伪事件。
    reason: |
      命名状态迁移不应让调用方协商聚合版本；跨聚合写入则必须先持久化阶段，不能只靠
      乐观锁或调用顺序假设原子性。
