id: CR-20260608-031-aliyun-prod-ack-modular-monolith-topology-baseline
title: 阿里云 ACK 生产部署形态规格基线（modular-monolith-first + 三层正交 + Strangler split-ready）
status: specified
feature_path: runtime/deliver-deploy-prod-pipeline
summary: |
  冻结 prod-hosted 在阿里云 ACK 上的标准部署形态，对齐业界云原生最佳实践，避免“多业务容器共享 Pod /
  sidecar 承载领域职责”等定制反模式：单集群 + 共享节点池 bin-packing；应用层 seed-box 以 Modular Monolith
  单 Deployment 起步；recommendation 与实时/媒体各自同集群独立 Deployment；数据面用阿里云托管（同 VPC 私网 +
  ExternalName/DSN 抽象 + Secret 注入 + 按域存储归属）；Strangler Fig 渐进拆分且域级 API/route/Service 名/
  端侧配置/数据面归属保持不变。明确三层正交边界（领域=逻辑真相源 / Deployment=部署单元 / 单集群=物理资源）
  与反模式禁止项，并冻结 gamma-local 与 prod-hosted 工作负载图谱同构。
  本 CR 为规格冻结（spec-first），不落部署 manifest / CI 改动；实际 ACK root、process/package inventory、
  stackctl/rollout 接线为后续 /dev 切片清单。
