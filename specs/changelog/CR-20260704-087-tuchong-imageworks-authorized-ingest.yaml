      repairReport: /tmp/qwq-tuchong-imageworks-20260704/runtime/site_supply/photography/photographer_authorized_pool/photographer_imageworks_100_prod_a/authorized_asset_ingest/repair_report.json
      commercialReadinessReport: /tmp/qwq-tuchong-imageworks-20260704/photographer_imageworks_100_prod_a_commercial_readiness.json
risks:
  - 图虫官方条款、OpenAPI、授权订单规则会变；每轮 production 前必须刷新官方 terms/robots/OpenAPI 文档和授权清单。
  - 当前实现不绕过 WorksClassifier 的 image work 最小图片数门；因此 100 个发布 image works 的授权资产需求高于 100 张单图。
  - 截至 2026-07-04，本地未提供真实摄影师逐图授权 manifest；production 不能进入 produce/publish/import，也不能声明 100/1000 commercial ready。
