id: CR-20260704-087-tuchong-imageworks-authorized-ingest
title: 图虫发现 + 摄影师授权池图片作品 ingest 与 100 到 1000 放量门
date: 2026-07-04
area: Data
domain: content-supply
type: additive
summary: >
  为图虫站点维度图片作品放量新增授权资产清单 ingest 路径，并将图虫社区发现线与
  图虫创意/摄影师授权池 production 线拆层。社区源只验证供给结构、质量分布和吞吐；
  图虫创意/OpenAPI/订单授权或摄影师逐图授权素材必须逐资产通过 rights/provenance/
  source-unit/asset-bytes 门后才能进入 release。
featureTree:
  L1_domain_service: runtime
  L2_business_capability: runtime-data-engineering
  L3_story: geo-content-trinity
acceptanceIntent: [GWT, contract, SIT]
evidenceLayers: [local_contract, api_integration, runtime_e2e]
changes:
  - site-supply 新增 licensed_asset_ingest admission mode 和 ingest-authorized-assets CLI；允许 licensed_api 与 manual_authorization 两类授权输入。
  - 新增 photographer_authorized_pool source profile，作为摄影师逐图授权 manifest 的 production 入口；图虫社区 URL 只能作为 discovery/reference，不能作为发布资产 URL。
  - 图虫创意或摄影师授权清单按 sourceCollectionId 聚合为 image work；每个 image work 遵守现有 WorksClassifier 的 minImagesForImageWork 规则。
  - 授权资产逐项校验 assetId/sourceUrl/(downloadUrl|localPath)/title/creator/credit/license/termsUrl/usageScope/authorizationProof/modelReleaseStatus/propertyReleaseStatus/sourceCollectionId/collectionPageUrl/tags。
  - ingest 可通过 --download-assets 下载 downloadUrl 或校验 localPath，落盘 sha256、mimeType、byteSize、width/height、localPath/sourcePath 等字节证据。
  - 重复 assetId/sourceUrl/downloadUrl/localPath/sha256、低清、水印、弱实体相关、缺肖像或物权状态的资产在源头 reject。
  - site-supply content-plan bridge 支持 image lane：授权 image handoff 物化为标准 source unit + carrier=image brief + content_plan_packet，不走 article-only baseDraft 分支。
  - site-scale-readiness commercial 对 licensed_asset_ingest 检查 authorized_asset_ingest 阶段与 releasedPostLaneCounts，不用 handoff counts 代替发布证据。
  - content source registry 新增 tuchong_stock_authorized 与 photographer_authorized_pool，避免和 tuchong 社区源混用。
scaleGates:
  controlled100:
    batch: tuchong_image_100_controlled
    siteId: tuchong
    mode: controlled_trial
    target: image handoff >= 100
    kpi: 不计入发布 KPI
  production100:
    batch: photographer_imageworks_100_prod_a
    siteId: photographer_authorized_pool
    mode: commercial
    target: releasedPostLaneCounts.image >= 100
    sourceInput: 摄影师逐图授权 manifest；按现有 image work 合同，每 100 个 image works 至少需要约 400 张合格授权图，建议 raw >= 600
  production1000:
    batch: photographer_imageworks_1000_prod
    siteId: photographer_authorized_pool
    mode: commercial
    target: releasedPostLaneCounts.image >= 1000
    sourceInput: 摄影师逐图授权 manifest overfetch；raw >= 6000、qualified >= 4000；必须落盘 raw discovered、qualified、picked、authored、reviewed、released、imported 漏斗
policy:
  - 图虫社区 tuchong 只能作为 controlled_trial / validationOnly，不允许 raw crawl 或 publish assets。
  - 图虫创意 tuchong_stock_authorized 只接受 OpenAPI 或订单授权逐资产凭证。
  - 摄影师授权池 photographer_authorized_pool 只接受 creator/credit/termsUrl/usageScope/authorizationProof/modelReleaseStatus/propertyReleaseStatus 与 downloadUrl/localPath 完整的逐图 manifest。
  - 缺授权配置或授权清单时，production 直接 GATE_BLOCK；必须落盘分层漏斗和 repair report，再从同一层补 manifest 重跑。
