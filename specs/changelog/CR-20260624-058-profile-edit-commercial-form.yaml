entries:
  - timestamp: "2026-06-24T18:30:00+08:00"
    summary: |
      将我的主页编辑资料页重构为固定字段顺序的商业表单：封面、头像、昵称、性别、生日、地区、手机号、趣我圈号、我的二维码、签名、标签。
      页面拆分为媒体、基础资料、账号社交、扩展资料四个 iOS 分组区块；普通字段右侧值统一进入右对齐槽位，封面与头像使用紧凑预览行。
      趣我圈号改为服务端系统分配的只读公开标识，资料页仅展示和复制，不向用户开放编辑。
      新增私有资料编辑快照、二维码卡片、手机号绑定凭证、职业与兴趣标签、真实二维码 SDK 渲染和扫码主页入口的端云契约基线。
    reason: |
      原编辑页只覆盖封面、头像、昵称和 bio，无法支撑手机号凭证、二维码社交、职业/兴趣标签、生日/地区/性别等商用资料闭环。
      若继续在 UI 内临时拼字段，会形成公开资料、owner 凭证、persona handle 和标签体系的第二真相源，因此本轮按 metadata-first 扩展契约和页面。
