    notes:
      - 二维码 V1 使用服务签发的 HTTPS 主页链接与 opaque qrToken；服务仅存 token hash，支持 active/revoked/expiry/styleVersion，App 展示层使用 pretty_qr_code 渲染真实二维码，底层依赖 Dart qr 编码库。
      - 编辑资料页三次 UI 收口：封面/头像采用同一媒体预览语义尺寸；右侧取值改为普通值、待填写 CTA、系统只读值三类语义 token；性别端侧入口仅保留男/女/不展示。
      - 编辑资料页四次 UI 收口：未填写项不再使用蓝色加粗 CTA，改为弱视觉短好处提示；性别未设置显示轻提示；趣我圈号只展示系统号，不显示复制图标。
      - 真实运营商一键绑定和保存二维码到系统相册依赖设备与平台能力，本地仅验证降级链路。
      - 职业/兴趣 V1 必须经 tag-service 校验，App 不维护第二套云外标签真相源。
