    summary: |
      全仓破坏性单轨收口：删除对象 metadata 顶层 version、消灭 projection/enums aliases
      与 codegen 多键解码、信封统一为 schema（无 /N .vN .mN）、删除前向/后向兼容分支
      与 CLI warn-only/compat 逃逸；门禁 verify_single_track_contracts 与 Graph 单轨校验锁死。
      HTTP 路径去 /v1 由并行 CR-20260717-109 负责；本 CR 不引入 /v2 或第二套 path。
    reason: |
      aliases→codegen→App 正向兼容测试是双轨根因；未上线阶段必须零 shim 直接切换到
      唯一当前契约形状，否则任何字段演进都会同时维护旧键与新键。
