    summary: |
      登录页账号摘要采用“文本稳定、头像渐进增强”：昵称与脱敏手机号不依赖头像，
      头像只有在可信候选成功下载并解码后才显示；空值、加载中和失败态均不创建
      头像占位、布局间距或无障碍节点。LoginAccountHint 增加
      nicknameCustomized，同源决定展示真实昵称或“欢迎回来”；会话刷新、软退出、
      过期与彻底退出同步冻结账号摘要保留、覆盖和精确头像缓存驱逐语义。
    reason: |
      旧返回态以“欢”字或中性轮廓补足头像会制造虚假身份线索，且端侧通过昵称格式
      猜测系统昵称会与服务端资料真相源漂移。账号识别文本必须稳定，头像仅作为加载
      成功后的可选增强，失败不得干扰登录主流程。
    change_type: [ux, contract, privacy, reliability, testing]
