          - quwoquan_app/test/user_acceptance/journeys/user/profile_tab_navigation_journey__user_acceptance_test.dart
    notes: |
      本 CR 在全部专项门禁、核心页 local_contract/user_acceptance 和 production
      dependency purity 通过前保持 in_progress。
  - timestamp: "2026-07-20T21:30:00+08:00"
    summary: |
      完成 W1–W5 实现收口：handled exception 进入结构化异常遥测；创作草稿
      autosave 失败可见且可观测；删除文章编辑器无实现列表/层级入口；沉浸浏览器与
      首页 feed 按职责拆分至 R03 阈值内；群公告、群主转让、管理员治理统一使用
      canonical metadata fixture 与 typed command；交集 inbox、welcome、settings
      的成功/空态/错误恢复保持真实对象 Facet 驱动。同步删除无 endpoint 时拼接
      头像 URL 的旧测试假设，改为 fail-closed 空态。
    reason: |
      页面商用品质不能只依赖静态矩阵；必须由真实成功、权限、失败回滚、登录续接、
      pageflip 像素不变量和端云 API 合约共同证明，且测试不得依赖已退休假种子或
      客户端 URL fallback。
    change_type:
      - implementation
      - local_contract
      - api_integration
      - user_acceptance
      - observability
