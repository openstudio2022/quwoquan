    summary: |
      将交集句从“所有 surface 都显式可点击宾语”修正为上下文 SVO：
      当前内容卡、视频书、内容详情和当前主页作为宿主对象时，宾语由 Query Slice
      承载，不再渲染可点击 self-target；独立列表和跨对象证据仍必须显式 typed object。
    reason: |
      `联系人林清越等3人赞过和评论过《这条记录》` 在内容卡形成 self-loop；
      feed 旧实现还可能从 viewer 交集理由池按 70/20/10 随机附着到 post，
      不能证明 reason 属于当前业务对象，违反业务对象中心的 Reader/Slice 设计。
