    notes:
      - displayBinding 默认 explicit_link；只有 Service 在 Reader/Slice 输出口证明宿主对象一致时，才能下发 host_implicit 或 host_plain。
      - 70/20/10 是有效候选曝光节奏，不是跨对象附着理由的授权。
      - App 不得从 span.target 缺失回退到 actionTargetId 或整行点击。
