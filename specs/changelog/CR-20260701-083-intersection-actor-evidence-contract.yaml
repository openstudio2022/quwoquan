id: CR-20260701-083-intersection-actor-evidence-contract
title: 首页交集人数句逐人证据端云契约
slug: intersection-actor-evidence-contract
revision: 1
status: implemented

affected_nodes:
  - specs/product/intersection-definition-and-application.md
  - quwoquan_service/contracts/metadata/recommendation/rec_model/projections/intersection_reason.yaml
  - quwoquan_service/contracts/metadata/recommendation/rec_model/projections/intersection_actor_evidence.yaml
  - quwoquan_service/services/content-service/internal/application/intersection
  - quwoquan_app/lib/cloud/runtime/generated/recommendation

entries:
  - timestamp: "2026-07-01T00:00:00+08:00"
    summary: |
      将首页推荐交集人数句从纯文案升级为可下钻的逐人证据协议：
      `IntersectionReason` 新增 actorEvidenceTotalCount、actorEvidenceCompleteness 与 actorEvidence，
      `IntersectionActorEvidence` 承载每个 actor 的关系来源、动作摘要、互动计数、跳转目标、rank 与快照版本。
    reason: |
      `联系人林清越等 8 人：5赞 2评 1转发` 中的 8 人不是“都来这里互动过”的泛化群体，
      而是同一证据快照下可枚举的交集 actor。端侧需要直接消费云侧结构化列表，
      展示每个人来自哪里、TA 在当前对象上做了什么，禁止从 primaryText 反解析。
    change_type:
      - product
      - contract
      - test
      - governance
    changed_documents:
      - path: specs/product/intersection-definition-and-application.md
        sections:
          - "§17.1.2 新增人数下钻逐人证据规则"
          - "§20.1 冻结契约表新增 IntersectionActorEvidence"
      - path: quwoquan_service/contracts/metadata/recommendation/rec_model/projections/intersection_actor_evidence.yaml
        sections:
          - "新增逐人证据投影，定义来源、动作、计数、target、rank、snapshot 与完整性消费约束"
      - path: quwoquan_service/contracts/metadata/recommendation/rec_model/projections/intersection_reason.yaml
        sections:
          - "新增 actorEvidenceTotalCount / actorEvidenceCompleteness / actorEvidence 字段"
      - path: quwoquan_service/services/content-service/internal/application/intersection
        sections:
          - "服务视图与 hydrate 链路承载逐人证据，不伪造名称或动作，仅补齐默认完整度、target、rank、snapshot、sortKey"
      - path: quwoquan_service/contracts/metadata/content/test_fixtures/scenarios/content_scenarios.lite.json
        sections:
          - "home_showcase_core seed 为首页交集句补充完整 actorEvidence"
      - path: quwoquan_app/lib/cloud/runtime/generated/recommendation
        sections:
          - "codegen 生成 IntersectionActorEvidence DTO，并扩展 IntersectionReason DTO"
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - user_acceptance
      rollout_impact: medium
      breaking_contract: false
    test_evidence:
      recorded:
        - "make -C quwoquan_service codegen-app（generated IntersectionActorEvidence + IntersectionReason actorEvidence fields）"
        - "make -C quwoquan_service verify-metadata"
        - "cd quwoquan_service && go test ./services/content-service/internal/application/intersection"
        - "cd quwoquan_app && flutter test test/cloud/recommendation/intersection_reason_test.dart test/local_contract/cloud/recommendation/intersection_reason__local_contract_test.dart test/ui/discovery/home_intersection_multiform_feed_widget_test.dart"
    notes:
      - "本 CR 只扩展端云契约和 seed，不新增人数列表 UI 弹层。"
      - "当 actorEvidenceCompleteness != complete 时，端不得把人数 N 作为完整列表入口。"
