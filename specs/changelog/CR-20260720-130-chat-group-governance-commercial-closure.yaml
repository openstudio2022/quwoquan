entries:
  - timestamp: "2026-07-20T16:40:00+08:00"
    summary: |
      按「群聊商用化收口规划」阶段 0～5 执行（backlog R-CHAT-001~004）：

      metadata（messages 域）：conversation_membership 新增 LeaveConversation
      operation（自愿退群，owner 须先转让）与 ConversationMemberLeft 事件；
      conversation 新增 UpdateAnnouncement / UpdateGroupGovernanceSettings 两个
      command 与 announcement/announcementUpdatedBy/announcementUpdatedAt/
      nameEditableByAdminOnly 权威字段；UpdateConversationTitle ownership 降为
      conversation_member（治理开关动态收紧由聚合 invariant 执行）；
      ConversationArchived 单轨改名 ConversationDissolved（realtime fanout +
      dissolvedBy/dissolvedAt payload），status 单轨 active/dissolved；
      errors.yaml +group_full/+conversation_dissolved/
      +group_owner_must_transfer_before_leave；MessageType +system_announcement
      （公告即触达，仅服务端产生）；chat_group_settings_client 投影删
      qrCodeJoinEnabled/joinRequiresApproval/privacyShieldAdminOnly 假开关
      （JoinRequest 对象链落地后随对象链恢复，登记 R-CHAT-003）；
      app_routes/app_pages/ui_surfaces +chatAnnouncement；chat-service codegen
      manifest 清理 SearchConversations/SearchMessages 死配置，
      ListConversationTimestamps/BatchGetConversations 转显式注册实现。

      chat-service：MemberService 补 requireActiveConversationMember 共享授权门
      （非成员统一 not_found 信息隐藏；dissolved 返回 conversation_dissolved），
      AddMembers 互关/拉黑 gate（与建群 validateGroupInitialMembers 同源，圈子
      绑定群跳过）+ group_full；RemoveMember 角色矩阵（owner 可移任何非 owner、
      admin 仅可移普通成员、禁 self-remove）；新增 LeaveConversation（幂等回执
      + MemberLeft 事件 + roster revision + 群头像重算）；ConversationService
      新增 UpdateAnnouncement（owner/admin + no-op 重放 + 2000 rune 上限 +
      事务后经 MessageService.SendAnnouncementSystemMessage 公告即触达）与
      UpdateGroupGovernanceSettings（roster revision + RosterUpdated
      aspects=[governance]）；UpdateConversationTitle 消费 nameEditableByAdminOnly
      动态授权；Dissolve 写 dissolved + ConversationDissolved；handler 补
      Leave/Announcement/Governance/Timestamps/Batch 五个端点，RemoveMember 不再
      把 operator 缺省为被移除人；conversationToWire/groupHomeToWire 回读权威
      公告与治理开关（消灭硬编码空串）；实时扇出接收者由单页 512 截断改为
      分页全量（对齐 maxGroupSize=1000）。

      App：ChatMemberRepository +leaveConversation、ChatGroupAdminRepository
      +updateAnnouncement，updateGroupSettings 改走 /governance 专属命令
      （不再误发 UpdateConversationSettings 被静默丢弃）；设置页退群原子切换
      LeaveConversation、成员网格补 owner/admin「−」移出模式（服务端为强制门、
      UI 同源预判）、公告行入口；新建 chat_announcement_page（owner/admin 编辑
      发布 + 确认对话框 + 成员只读，Inset form 壳，登记页面矩阵/settings
      manifest/gap inventory）；建群候选行透出 metFrom 事实交集证据；
      alpha mock 引擎 + 两个 MockChatRepository 同步 leave/announcement 语义
      （owner 拒绝、公告触达、no-op 幂等与云侧 parity）。

      规格与观测：group-candidate-source-orchestration story 补建（修复
      registry 漂移）并回填既有证据；member-add-remove-policy、group-settings
      acceptance 从 pending 骨架回填 implemented + recorded；tree_index 登记；
      告警组 quwoquan_l2_chat_objects +ChatConversationCreateErrorRateHigh/
      +ChatGroupGovernanceErrorRateHigh/+ChatGroupGovernanceLatencyHigh
      （5xx 口径，授权拒绝 4xx 不计入）；成熟度矩阵 §15 M6-B 补收口进展；
      backlog 登记 R-CHAT-001（已解决）/R-CHAT-002（已解决）/R-CHAT-003/
      R-CHAT-004。

      证据：chat-service 全量测试 ok（api_integration 含新增
      group_governance_authorization__security 11 例授权/生命周期负例 +
      group_announcement_governance__contract 6 例读写对称回归，74.9s）；
      App chat_settings_page widget 18 例、chat_announcement_page 4 例、
      cloud_mock 群治理 parity 6 例全绿；页面矩阵/scan/metadata-driven UI/
      dart semantic/mock isolation 门禁通过；acceptance standard +
      feature-tree refactor 校验通过。

      未闭环（R-CHAT-004）：gamma-local Patrol 群管理 journey、prod gray
      canary、大群扇出容量压测、@群成员提及 story；chat operation
      commercial_defaults.status: blocked 待上述证据后解除。
