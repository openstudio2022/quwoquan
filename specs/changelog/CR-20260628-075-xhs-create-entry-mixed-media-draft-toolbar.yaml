      - 社交入口路由保留在移动端底栏 `+` 和业务上下文中；入口 sheet 不再使用图标宫格或发布/互动分组标题。
  - timestamp: "2026-06-29T09:40:00+08:00"
    summary: |
      视频选择页从旧的“现在开拍”大卡片改为与图片选择页一致的深色三列宫格：第 1 格 `拍视频`，第 2 格 `一键成片`，其余格展示 `全部视频`。`一键成片` 进入图片选择器，至少选择 1 张图片后生成本地视频结果，并以标准 video item 直接进入视频编辑/选封面页，不回到视频选择器停留。
    reason: |
      旧视频页布局与发布图片页不一致，且“现在开拍”大卡片占据过多空间，无法承载用户提出的“一键成片”入口。将视频页收敛到与图片页同构的宫格后，拍摄、成片和视频资源之间的空间关系更清晰，也继续保持图片入口不暴露视频能力。
