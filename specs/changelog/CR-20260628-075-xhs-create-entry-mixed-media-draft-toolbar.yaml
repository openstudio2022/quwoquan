entries:
  - timestamp: "2026-06-28T18:56:00+08:00"
    summary: |
      移动端全局 `+` 面板收口为无图标、无分组标题的 iOS 列表：创作动作保留 `发布照片`、`发布视频`、`写文字`，社交动作保留 `添加联系人`、`发起群聊`、`创建圈子`，并去掉草稿行。
      `/create?type=gallery` 重新定义为照片发布入口，`/create?type=video` 新增为视频发布入口，`/create?type=capture` 保留为旧相机/深链兼容入口；CreatePage 按入口和真实返回媒体进入对应编辑状态。
      草稿入口移入编辑器顶栏，编辑后显示保存状态；保存成功前会写入并 reload 校验草稿 payload 与索引可读，本地草稿页进入/恢复时 reload 当前用户 scope。
    reason: |
      原入口仍按图片/视频/互动入口拆分，图标难以准确表达且左右布局漂移；但添加联系人、发起群聊、创建圈子仍属于底栏 `+` 的高频入口，不能从动作面板删除。主标题采用 `发布照片` / `发布视频`，副文案承接 `从相册选照片或拍照` / `从相册选视频或拍视频`，比把长句放在主标题中更便于快速扫描。
      草稿入口放在 sheet 中也让保存状态不可见，且缺少真实底栏加号链路保存后立即可读的回归证据。本轮用动作优先的 iOS 列表和编辑器顶栏状态机统一体验。
