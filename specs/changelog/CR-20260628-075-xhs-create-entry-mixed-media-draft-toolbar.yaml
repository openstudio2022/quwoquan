entries:
  - timestamp: "2026-06-28T18:56:00+08:00"
    summary: |
      移动端全局 `+` 面板收口为 `从相册选择`、`相机`、`写文字` 与 `取消`，去掉发布/互动分组、图标、社交动作和草稿行。
      `/create?type=gallery` 重新定义为混合相册入口，`/create?type=capture` 重新定义为默认拍照且可切录像的相机入口；CreatePage 按实际返回图片或视频进入对应编辑状态。
      草稿入口移入编辑器顶栏，编辑后显示保存状态；保存成功前会写入并 reload 校验草稿 payload 与索引可读，本地草稿页进入/恢复时 reload 当前用户 scope。
    reason: |
      原入口仍按图片/视频/互动入口拆分，图标难以准确表达且左右布局漂移；相册和相机被提前绑定到图片或视频，导致用户在开始阶段被迫做内容类型判断。
      草稿入口放在 sheet 中也让保存状态不可见，且缺少真实底栏加号链路保存后立即可读的回归证据。本轮用动作优先的 iOS 列表和编辑器顶栏状态机统一体验。
