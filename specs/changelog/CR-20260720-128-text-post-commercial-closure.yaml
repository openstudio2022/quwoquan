id: CR-20260720-128-text-post-commercial-closure
title: 写文字创作发布端云商用闭环
slug: text-post-commercial-closure
revision: 1
status: in_progress
affected_nodes:
  - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication
  - specs/feature-tree/discovery-content/publish-comment-reaction
  - specs/feature-tree/discovery-content/content-type-framework
  - specs/feature-tree/product-ops-growth/event-ingestion-and-analytics
entries:
  - timestamp: "2026-07-20T15:00:00+08:00"
    summary: |
      将写文字从「入口与本地编辑器可用」收口为完整商用 Journey：正文优先与标题渐进披露、
      micro/article 显式确认、端云同源长度与 Persona 频控、发布前安全门 fail-closed、
      immutable PublishIntent、发布任务可见与恢复、published 结果回流、tag/entity/circle/location
      事实关联、产品遥测漏斗、审核运营和四环境证据。
    reason: |
      现状能够可靠提交 Post，但发布成功仅 Toast 后关闭，micro/article 静默分型，创作事件误写
      推荐行为端点而被拒绝，长度/频控错误码没有调用点，PostStatus 与 ModerationCase 状态机
      漂移，tag 创作入口和文字发布 UAT 缺失。以上会造成用户旅程、内容安全、运营指标和发布
      准入同时断链，不能进入商用。
    decisions:
      - Post 远端状态只保留 pending_review/published/rejected/deleted；LocalPostDraft 不进入云聚合。
      - 发布前安全门为 allow/review/reject/unavailable；review/unavailable 只能创建不可公开
        pending_review 并进入人工 Case，没有 allow/approve 结论不得进入公开读模型。
      - production 必须注入 PublicationSafetyGate 与 PublicationRateGate，缺失时 fail-fast。
      - micro/article 由系统建议、用户确认，不再静默决定。
      - 创作发布漏斗进入 ops telemetry catalog，不再调用 content ReportBehaviors。
      - 能解决的缺口直接实现并关闭，不新增本功能专用长期风险条目。
    change_type:
      - specification
      - contract
      - implementation
      - local_contract
      - api_integration
      - user_acceptance
      - observability
      - security
    tests:
      - layer: local_contract
        intent: GWT
        evidence:
          - quwoquan_app/test/local_contract/ui/content/entry/text_publication_format_confirmation__functional__local_contract_test.dart
          - quwoquan_app/test/local_contract/ui/content/entry/post_publication_intent_task_state__reliability__local_contract_test.dart
          - quwoquan_service/services/content-service/internal/application/post/post_publication_admission__local_contract_test.go
      - layer: api_integration
        intent: SIT
        evidence:
          - quwoquan_service/services/content-service/tests/api_integration/post_text_publication__api_integration_test.go
      - layer: user_acceptance
        intent: UAT
        evidence:
          - quwoquan_app/test/user_acceptance/pages/content/create/text_publication_roundtrip__experience__user_acceptance_test.dart
    rollout:
      stages: [alpha, beta, gamma_local, prod_gray_initial, prod_full]
      rollback:
        - 停止新发布但保留 LocalPostDraft 和 intent 可读。
        - 安全 provider 不可用时保持 fail-closed，禁止切换为 allow。
        - 已发布 Post 继续按 receipt 和 outbox 单轨读取。
    notes: |
      在三层测试、四环境运行制品、Portal 审核台、发布 dashboard/alert 与 prod gray readback
      全部通过前保持 in_progress。

