id: CR-20260721-137-content-report-feedback-identity-environment-recovery
title: Post 举报反馈可信账户投递与内容生命周期环境恢复
slug: content-report-feedback-identity-environment-recovery
revision: 1
status: in_progress
affected_nodes:
  - specs/feature-tree/discovery-content/content-display-journey-consistency
  - specs/feature-tree/discovery-content/content-display-journey-consistency/content-action-intent-contract
entries:
  - timestamp: "2026-07-21T14:30:00+08:00"
    summary: |
      将 Report 的结案通知接收者从 persona 语义收敛为创建时固化的 trusted reporterAccountId，
      并为历史记录引入受控、可审计的 persona→account 迁移工件。Beta/Gamma content-release
      profile 仅验证举报、负反馈与通知生命周期；与该旅程无关的 embedding/ES pipeline 显式关闭，
      full workload 继续要求外部 embedding binding。
    reason: |
      personaId 不能作为 Inbox account principal 使用。直接猜测或复制 personaId 会造成结案通知误投、
      越权读取或不可审计的数据修复。另一方面，局部举报生命周期验证被无关 embedding 依赖阻断，
      会掩盖 Report/Notification 的真实就绪性。
    decisions:
      - 历史迁移只接受部署期 JSON 映射工件；缺失、空值、冲突或与已持久化 ownership 不一致时启动 fail-closed。
      - 回填同时更新 Report、未投递 report outbox payload 与 idempotency receipt，避免重放重新丢失账户归属。
      - content-release 不是 full workload 的降级声明：仅关闭不在本旅程验收范围内的 embedding/ES，full 仍保持凭据缺失即拒绝启动。
      - App API 不回显 reporterAccountId；Notification Inbox 只接受 JWT principal account，拒绝 caller header 伪造。
    change_type:
      - metadata
      - implementation
      - local_contract
      - api_integration
      - user_acceptance
      - reliability
      - security
      - environment
    tests:
      - layer: local_contract
        intent: contract
        evidence:
          - quwoquan_service/services/content-service/internal/infrastructure/persistence/report_account_backfill__local_contract_test.go
          - quwoquan_service/services/content-service/cmd/api/main__local_contract_test.go
          - quwoquan_ops/tests/local_contract/test_environment_auth_token_isolation__local_contract_test.py
          - quwoquan_ops/tests/local_contract/test_stackctl_gamma_operation_lock__local_contract_test.py
      - layer: api_integration
        intent: SIT
        evidence:
          - quwoquan_service/services/content-service/tests/api_integration/report_crud_contract__api_integration_test.go
          - quwoquan_service/services/notification-service/tests/api_integration/app_message_lifecycle__api_integration_test.go
          - quwoquan_service/services/notification-service/tests/api_integration/interaction_notification_stream__api_integration_test.go
      - layer: user_acceptance
        intent: UAT
        evidence:
          - quwoquan_ops/tests/acceptance/user_acceptance/service_ops/content-service/smoke/run_report_feedback_lifecycle_probe.py
          - quwoquan_ops/tests/acceptance/user_acceptance/service_ops/content-service/gate/verify_report_feedback_four_environment.py
    rollout:
      stages: [alpha, beta, gamma, prod]
      rollback:
        - 不删除已固化 reporterAccountId；若受控映射工件错误，停止启动并使用经审核的新工件重新迁移，禁止直接 SQL 覆盖。
        - content-release 配置版本只能用于局部生命周期验证；full workload 和 prod 保持 embedding Binding 的 fail-closed 准入。
    notes: |
      状态保持 in_progress，直到 Beta/Gamma 实际对象级 lifecycle 报告通过，并在具备真实法律主体、
      鉴权和 SSH 凭据后取得生产 read-only 私有列表证据。不得以本地静态测试或未关联 stackctl
      report 代替四环境准出。
