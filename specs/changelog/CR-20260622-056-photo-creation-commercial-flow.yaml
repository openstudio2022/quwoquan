  - timestamp: "2026-06-22T22:30:00+08:00"
    summary: |
      冻结图片作品从相册选择、拍照确认、图片编辑、排序完成、远端上传绑定、发布到展示回读的商用主链路规格。
      同步修正媒体编辑器 IA：继续保留“双编辑器”产品心智，但图片与视频必须在媒体工具内部按 entry mode 分流，
      图片发布路径不得展示“一键成片”“拍视频”“录像”等视频发布语义。
    reason: |
      当前图片选择器仍混用图片/视频/一键成片语义，相机页拍照后直接返回且保留拍视频入口，远端发布 payload 仍可能
      携带本地图片路径。该状态无法达到用户给定的高保设计和商用上线要求，需要先把规格、验收和测试证据冻结，再进入
      Red → Green → Refactor 实施。
