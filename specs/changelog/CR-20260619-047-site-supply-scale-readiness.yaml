id: CR-20260619-047-site-supply-scale-readiness
title: 网站维度内容供给线与日产 10 万级准出门
date: 2026-06-19
area: Data
domain: content-supply
type: additive
summary: >
  新增 site-supply 前半段供给线，按站点生成 frontier/candidate/score/map/rollup packet，
  并新增 verify site-scale-readiness 作为网站维度日产 10 万级准出门。
motivation:
  - 支持从旅游等垂类的网站维度全面发现内容候选。
  - 保持与实体补全线互不干扰，同时复用 content_plan、produce、review、ship、importer。
changes:
  - quwoquan_data/scripts/cli.py 新增 site-supply 命令入口。
  - quwoquan_data/scripts/site_supply/handler.py 新增站点线 packet/gate/rollup 逻辑。
  - quwoquan_data/scripts/verify/site_scale_readiness.py 新增 10 万级站点准出报告。
  - quwoquan_data/verticals/travel/sources/source_registry.yaml 增加 qunar/ctrip siteCrawlProfile 样例。
  - quwoquan_data/schema/site_supply 增加站点线 packet schema。
  - site_rollup 增加逐候选 gate/handoff 审计；缺 score/map 或对象级 stage evidence 会在本阶段阻断。
  - verify site-scale-readiness 增加 trial/commercial 模式；trial 只用于结构试跑，commercial 要求 E2E 证据。
  - 增加 controlled_trial admission mode：fetchable=false/crawlAllowed=false 的站点可在 source_registry 显式 controlledTrial.allowed=true 后做 validation-only 规模试跑，但仍不得进入真实 batch crawl 或商业发布准出。
  - site_rollup 与 site-scale-readiness 增加 laneCounts/contentPlanHandoffLaneCounts 与 min article/image/video 门，支持携程/马蜂窝首批 500/100/50 与万级放量验证。
evidence:
  t1:
    - quwoquan_data/schema/site_supply/*.schema.json
    - python3 quwoquan_data/scripts/cli.py vertical source-registry
  t2:
    - python3 quwoquan_data/tests/site_supply/test_site_supply_contract.py
    - python3 quwoquan_data/tests/verify/test_site_scale_readiness.py
    - QWQ_RUNTIME_ROOT=/tmp/qwq-ctrip-mafengwo-controlled-650-FII5U1/runtime python3 quwoquan_data/scripts/cli.py verify site-scale-readiness --mode trial --vertical travel --batch ctrip_mafengwo_controlled_650 --daily-target 10000 --min-article-count 1000 --min-image-count 200 --min-video-count 100
    - QWQ_RUNTIME_ROOT=/tmp/qwq-ctrip-mafengwo-controlled-10000-ouYsX9/runtime python3 quwoquan_data/scripts/cli.py verify site-scale-readiness --mode trial --vertical travel --batch ctrip_mafengwo_controlled_10000 --daily-target 10000 --min-article-count 500 --min-image-count 100 --min-video-count 50
  t3:
    - 待站点试跑批次完成 ship/import 后补录。
  t4:
    - 待 gamma feed/search/detail 用户旅程采样后补录。
rollout:
  default: real batch crawl disabled until a siteCrawlProfile has crawlAllowed=true
  firstPilot: travel/qunar_guide for real crawl; travel/ctrip_travelogue and travel/mafengwo_travelogue for controlled_trial validation
  stagedTrial:
    - level: hundred
      command: python3 quwoquan_data/scripts/cli.py site-supply trial --site-id qunar_guide --batch <batch> --target-count 100 --daily-target 1000
      gate: python3 quwoquan_data/scripts/cli.py verify site-scale-readiness --mode trial --vertical travel --batch <batch> --daily-target 1000
    - level: thousand
      command: python3 quwoquan_data/scripts/cli.py site-supply trial --site-id ctrip_travelogue --batch <batch> --target-count 650 --article-count 500 --image-count 100 --video-count 50 --daily-target 10000
      gate: python3 quwoquan_data/scripts/cli.py verify site-scale-readiness --mode trial --vertical travel --batch <batch> --daily-target 10000 --min-article-count 500 --min-image-count 100 --min-video-count 50
    - level: controlled_10k
      command: two site-supply trial workers for ctrip_travelogue and mafengwo_travelogue, each target-count 5000 with article=3846 image=769 video=385
      gate: python3 quwoquan_data/scripts/cli.py verify site-scale-readiness --mode trial --vertical travel --batch <batch> --daily-target 10000 --min-article-count 500 --min-image-count 100 --min-video-count 50
    - level: commercial_10k
      gate: python3 quwoquan_data/scripts/cli.py verify site-scale-readiness --mode commercial --vertical travel --batch <batch> --daily-target 10000
  blockedByDefault:
    - ctrip_travelogue for real batch crawl unless fetchable=true and crawlAllowed=true
    - mafengwo_travelogue for real batch crawl unless fetchable=true and crawlAllowed=true
    - Pinterest
    - 小红书
    - 抖音
    - 微博
    - B站
risks:
  - 外站 terms/robots/限流变化会使站点线自动 no_go。
  - 站点线只解决前半段供给，发布仍必须经 content_plan/produce/review/ship/importer。
