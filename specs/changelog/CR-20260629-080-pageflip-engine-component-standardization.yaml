      - "components/pageflip 为通用 engine，必须保持零 ui/** import；article_reader/pageflip 是文章阅读宿主 adapter，不沉淀到 components。"
      - "旧 package:quwoquan_app/ui/content/pageflip/ 不保留兼容 facade；verify_content_ui_directory_boundaries.py 已加入退役路径扫描。"
      - "四环境 all-tier verify 曾尝试执行；alpha/beta 被既有 seed media hash、缺失 mock avatar、beta root CA 与 Patrol CLI 前置阻断，gamma/prod all-tier 长跑中止，未作为本 CR 准出证据。"
