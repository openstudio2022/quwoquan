id: CR-20260629-080-pageflip-engine-component-standardization
title: 翻页通用引擎沉淀 components 并删除 ui/content/pageflip 旧根（R-PAGEFLIP-002）
slug: pageflip-engine-component-standardization
revision: 1
status: implemented

affected_nodes:
  - specs/feature-tree/runtime/runtime-client-foundation/article-editor-refactor
  - specs/feature-tree/discovery-content
  - quwoquan_app/lib/components/pageflip
