entries:
  - timestamp: "2026-06-29T11:20:00+08:00"
    summary: |
      收口 R-PAGEFLIP-002：将平台无关的生产翻页引擎自 `quwoquan_app/lib/ui/content/pageflip/**`
      迁入 `quwoquan_app/lib/components/pageflip/**`，作为唯一生产 engine 根；旧 `ui/content/pageflip`
      删除且不保留 facade。文章阅读器宿主 `quwoquan_app/lib/ui/content/article_reader/pageflip/**`
      保留在 content UI 域，继续负责文章分页绑定、texture capture、host/layers/pipelines/debug 映射。
      所有生产、test、tool import 一次性切到 `package:quwoquan_app/components/pageflip/...`；
      旧 `test/ui/content/pageflip` 与 `test/local_contract/ui/content/pageflip` 同步迁入
      `test/components/pageflip` 与 `test/local_contract/components/pageflip`。
    reason: |
      `ui/content/pageflip` 的职责是通用翻页 engine（geometry、render frame、curl mesh、release policy、
      page surface snapshot），长期放在 content UI 域会迫使诊断 harness、测试工具与未来非 content
      场景反向依赖 content。按 01-arch-constraints 与用户确认的“通用引擎进 components，文章 reader
      adapter 留 UI”方案，应删除旧 UI engine 根；但前后翻几何对像素极敏感，本 CR 只做物理迁移与 import
      重定向，不改 geometry、BACK 主线、release policy、gesture 状态机和 texture 语义。
    change_type:
      - architecture
      - refactor
      - test
      - governance
    changed_documents:
      - path: quwoquan_app/lib/components/pageflip
        sections:
          - "自 quwoquan_app/lib/ui/content/pageflip 迁入，成为生产通用 engine 唯一根"
          - "保持 geometry、render_frame、curl_mesh、release_policy、snapshot 语义不变"
      - path: quwoquan_app/lib/ui/content/article_reader/pageflip
        sections:
          - "继续作为文章 reader adapter 消费 components/pageflip，不下沉到 components"
      - path: quwoquan_app/test/components/pageflip
        sections:
          - "自 test/ui/content/pageflip 迁入，覆盖 engine contract/widget/pixel 用例"
      - path: quwoquan_app/test/local_contract/components/pageflip
        sections:
          - "自 test/local_contract/ui/content/pageflip 迁入，保持 local_contract 对应证据"
      - path: quwoquan_app/test/support/pageflip
        sections:
