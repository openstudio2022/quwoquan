entries:
  - timestamp: "2026-07-18T22:50:00+08:00"
    summary: |
      将媒体传输拆分为服务内部 storageOrigin、设备可达 uploadIngress 与按 avatar/image/video
      区分的 deliveryBase。Android 本地调试 APK、Dart HttpClient 与 ExoPlayer 使用同一
      alpha TLS 根；启动 watchdog 仅在 renderer 首帧缺失时显示原生恢复，首帧后的慢安全
      终态由 Flutter 接管并以 attemptId 和固定时钟 origin 诊断。
    reason: |
      alpha Android APK 打入的根证书与 TLS 代理签发根不一致，图片与视频同时发生证书校验
      失败。gamma 将上传对象存储 authority 复用为全部公开媒体交付地址，且 S3 预签名 URL
      与移动端 local target host 不一致；直接 host 改写会破坏签名。Android 还将已有 Flutter
      首帧但 safe terminal 较慢误判为原生恢复，并在同一启动尝试中切换时钟。
