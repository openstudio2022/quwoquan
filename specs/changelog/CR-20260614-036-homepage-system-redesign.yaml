    summary: |
      将用户主页、我的主页、地点和事物主页、圈子主页统一为身份区、CTA、交集、影响力/介绍、Tab、内容流。
      首屏 CTA 收敛为用户关注/私信、我的编辑资料/分享主页、地点和事物关注/私信、圈子加入/私信；
      交集模块统一为纵向列表并新增全部交集页 objectIntersections；作品二级筛选统一为全部/图片/视频/文字。
      地点和事物主页用户文案禁止出现“实体”，治理动作进入更多菜单，紫色主视觉替换为品牌蓝。
    reason: |
      旧实现四类主页信息架构割裂，交集表达不一致且首屏被统计、管理与多余操作稀释，无法在 5 秒内回答
      “为什么推荐它 / 我与它有什么关系 / 我帮助了谁”。本 CR 按高保与最新澄清统一主页体系。
