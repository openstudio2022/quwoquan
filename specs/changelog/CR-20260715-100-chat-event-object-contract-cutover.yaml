id: CR-20260715-100-chat-event-object-contract-cutover
title: Chat 事件对象归属与多契约路由生成收口
slug: chat-event-object-contract-cutover
revision: 2
status: in_progress

affected_nodes:
  - specs/feature-tree/chat-conversation/list-detail-message-delivery/realtime-push-and-offline-sync
  - specs/feature-tree/runtime/system-architecture-and-engineering-guide

entries:
  - timestamp: "2026-07-15T19:23:00+08:00"
    summary: |
      Message 聚合改为在同一 MongoDB transaction 内提交 state、单调 seq、
      command receipt 与稳定 eventId/outbox sequence。删除 Redis seq/dedup 真相源和
      SendMessage goroutine 双事件通路，新增独立 relay、consumer checkpoint 与重放。
    reason: |
      短 TTL Redis 去重无法保证永久幂等，命令返回后的 goroutine 无法覆盖进程退出；
      请求内同步发布也不能提供服务重启后的自动恢复。Message outbox 必须成为唯一
      可重放事件主线。
    change_type: [contract, architecture, reliability, observability, testing]
    changed_documents:
      - path: quwoquan_service/contracts/metadata/messages/message
        sections: [storage, idempotency, outbox, checkpoint]
      - path: quwoquan_service/services/chat-service/internal/application
        sections: [MessageService, MessageOutboxRelay]
      - path: quwoquan_service/services/chat-service/internal/infrastructure/persistence/mongo_conversation_store.go
        sections: [Message commit, outbox reader, checkpoint store]
      - path: quwoquan_service/contracts/metadata/messages/conversation/errors.yaml
        sections: [CHAT.USER.message_idempotency_conflict]
    impact:
      replan_required: false
      redesign_required: false
      retest_layers: [local_contract, api_integration, user_acceptance]
      rollout_impact: controlled
      breaking_contract: true
      breaking_rationale: |
        同一 sender/conversation 下复用 clientMsgId 但改变业务负载时不再返回旧消息，
        而是稳定返回 CHAT.USER.message_idempotency_conflict；不保留旧 Redis 去重语义。
    verification:
      completed:
        - go test ./services/chat-service/... -count=1
        - make -C quwoquan_service verify-metadata
        - make -C quwoquan_service verify-ddd-cqrs-baseline
        - make -C quwoquan_service verify-production-wiring-purity
      planned:
        - stackctl verify --env gamma --kind service --tier all
        - 十条 AppRoot Scenario 与四环境发布工件验证
    remaining_blockers:
      - App Chat 仍需从聚合 ChatRepository 切换到 operation-specific typed Facet。
      - Gamma 外部登录真实凭据未配置，无法完成 Remote UAT。

  - timestamp: "2026-07-15T01:35:00+08:00"
    summary: |
      Chat 领域事件按 Conversation、ConversationMembership、ConversationUserState 和
      Message 四个对象重新生成。退休的 MemberJoined、MemberLeft、
      ConversationSettingsUpdated、ReadReceiptSent、AssistantInvited 与
      AssistantRemoved 不保留别名或双发路径。
    reason: |
      原实现只有 Conversation events 被生成，应用层和端侧因此长期依赖未受 metadata
      约束的手写常量。对象中心 metadata 已拆分 command 路由，但 codegen 仍只读取
      Conversation/service.yaml，使重生后 SendMessage、成员管理、助手和设置路由消失。
    change_type: [contract, architecture, reliability, observability, testing]
    changed_documents:
      - path: quwoquan_service/contracts/metadata/messages
        sections: [event ownership, object-owned command routes]
      - path: quwoquan_service/services/chat-service/codegen_chat_service_manifest.yaml
        sections: [service_yamls]
      - path: quwoquan_app/runners/alpha/lib/alpha_realtime_connection_delegate.dart
        sections: [alpha composition, generated contract fixture bundle]
      - path: quwoquan_app/test/support/fixtures/chat/fixture_realtime_connection_delegate.dart
        sections: [local contract fixture only]
    impact:
      replan_required: false
      redesign_required: false
      retest_layers: [local_contract, api_integration, user_acceptance]
      rollout_impact: controlled
      breaking_contract: true
      breaking_rationale: |
        退休事件名不再被发布或消费。所有端云消费者必须使用对象归属后的 canonical
        事件名；本仓未保留 alias、fallback 或双发兼容。
    verification:
      completed: []
      planned:
        - cd quwoquan_service && make codegen && make verify-metadata
        - cd quwoquan_service && go test ./services/chat-service/tests/api_integration -run TestEventPublish -count=1
        - cd quwoquan_app && flutter test test/local_contract/cloud/realtime/realtime_conversation_member_added_handler__functional__local_contract_test.dart test/local_contract/cloud/realtime/realtime_fixture_catalog__contract__local_contract_test.dart
        - make verify-test-coverage-map
        - bash quwoquan_ops/gate/gate_repo.sh
    remaining_blockers:
      - 双省主页执行、Gamma 导入和动态 App UAT 仍由 R-HSE06 的真实数据准出门管理。
