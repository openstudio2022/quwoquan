    summary: |
      按“非深排商用成熟度 P0”计划补齐推荐主链路：质量分/recScore 投影、
      协同物化召回读取、首页/旅行/精品场景路由、排序融合质量分与交集 fact/affinity、
      App 首页/精品解释 primaryText-only 呈现，并新增旅行垂类和精品流式两个 L3 Story。
    reason: |
      当前推荐底座已有框架但存在 recScore 恒 0、协同召回未有效装配、交集特征未候选级融合、
      首页/精品解释 UI 与 primaryText 契约漂移、评估指标缺分桶等商用断点。
      本轮先用非深度工程闭环补 P0，不引入深排平台。
