  - timestamp: "2026-07-18T20:30:00+08:00"
    summary: |
      将 networkClass 收敛为 wifi/ethernet/5g/4g/mobile/other/none 七值闭集，
      删除 vpn。VPN 叠加时端侧只上报底层接入；Android/iOS 在蜂窝 transport 已确认时
      通过平台防腐层细化 5G/4G，未知或未获授权时诚实降级为 mobile。
    reason: |
      VPN 是覆盖隧道而非底层接入介质，作为独立运营维度会掩盖 Wi‑Fi/有线/蜂窝网络质量。
      旧六值目录也无法区分 LTE 与 NR，影响启动和异常的网络维度归因。
    change_type: [specification, metadata, codegen, app, service, portal, local_contract, api_integration]
    changed_documents:
