  - timestamp: "2026-07-18T13:35:00+08:00"
    summary: |
      冻结 alpha/beta/gamma 的产品遥测验证闭环：alpha 仅允许 fake-SLS local_contract，
      beta 在 VPC 受控 runner 对真实 SLS 做 api_integration，gamma-local 真机完成
      user_acceptance；补充独立只读 TEST_SLS 验证角色、探针归属、串行晋级和证据脱敏规则。
      同时完成 SLS 对 ES 的替换式选型复核，维持产品日志 SLS 单轨、内容搜索 ES 单轨。
    reason: |
      现有实现已有 SLS 单轨和局部协议证据，但缺可执行的跨环境真实资源/真机收口方案；
      同时需要明确“二者均有索引”不等于应把产品遥测迁到 Elasticsearch。
    change_type: [design, ops, api_integration, user_acceptance]
    changed_documents:
      - path: specs/feature-tree/product-ops-growth/event-ingestion-and-analytics/design.md
        sections: [Alpha/Beta/Gamma验证闭环设计, SLS与Elasticsearch选型判定]
      - path: quwoquan_ops/runbooks/product_telemetry_sls_cutover.md
        sections: [Alpha/Beta/Gamma执行顺序]
