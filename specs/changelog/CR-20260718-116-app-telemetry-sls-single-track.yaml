  - timestamp: "2026-07-18T12:00:00+08:00"
    summary: |
      将 App 产品事件/异常收敛为九字段公共信封、严格 event/page 目录、actor-scoped
      加密 outbox 和 product-ops SLS 单轨；启动阶段 journal 保持受限匿名链路，内容可交互后
      单独投影 app_startup。推荐反馈继续由 BehaviorReporter/content-service/Redis/投影闭环，
      不再伪装为 Ops 事件。
    reason: |
      旧方案同时保留胖信封、Mongo、Elasticsearch、推荐双写和两个行为网络出口，无法满足
      当前单轨、隐私、可验证和零兼容约束；Portal 直连云日志还会泄露浏览器凭据。
