  - timestamp: "2026-07-18T18:30:00+08:00"
    summary: |
      删除 Grafana 中没有真实 producer 的 ops_events_total、ops_event_metrics_* 与
      app_api_latency_ms_* 查询。受限启动诊断只向 Prometheus 投影低基数阶段指标；
      app_startup 内容可用 P95 和错误率由 SLS 查询告警承接；product_action 小时聚合
      保留 journey/action/result 以支持登录等产品漏斗；重放、6 秒 deadline 与动效帧预算
      保持为真实设备/Web 发布 UAT 硬门。
    reason: |
      SLS 单轨切换后旧大盘和测试仍要求已退休的 OpsEvent/AppLog 指标，形成空面板与
      第二真相源。在线指标、产品聚合和发布探针必须各自只验证真实生产链。
    change_type: [specification, observability, ops, local_contract]
    changed_documents:
