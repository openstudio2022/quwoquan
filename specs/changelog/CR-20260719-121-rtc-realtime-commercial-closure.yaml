  - timestamp: "2026-07-20T12:56:00+08:00"
    summary: |
      异常重启后重新以 `contracts/metadata/rtc/**` 与本 CR 的既有实现证据做只读排查，
      启动 RTC 商用规划收敛。确认当前唯一主线为 CallSession 聚合 +
      CallParticipant owned entity、`audio/video` callType、realtime-gateway 单通道、
      五个 typed Facet、Initiate/Answer/Join 响应直接下发 LiveKit 凭据，以及
      CallEnded→chat `system_call_log`。L2 spec/design 与全部 RTC L3
      spec/acceptance 已据此退场旧录制/Egress/E2EE 承诺、旧独立信令、聚合
      Repository/Mock/DataSourceMode、临时 fallback 与 `voice` 类型口径。

      本轮同时把 timeout/connected、offline push、PiP hangup、screen share、
      media QoE 作为 planned 三层证据回填 acceptance；M7 商用成熟度详细规格补齐
      对象全景、页面评级、断点、黄金指标、四环境准出和交集策略。用户确认的两项
      正式风险已登记为 R-RTC01（离线来电 Push 未实现）与 R-RTC02（媒体 QoE
      黄金指标缺失），并明确不重复 R-CLOUD01/R-OBJ-002。
    reason: |
      旧 L2/L3 文档仍把已删除的对象、路径、端侧聚合抽象与迁移分支写成当前方案，
      会诱导后续实现恢复双轨；同时页面/在线通话证据不能证明离线唤醒和媒体质量，
      必须把未验证项留在 partial/pending。
    change_type:
