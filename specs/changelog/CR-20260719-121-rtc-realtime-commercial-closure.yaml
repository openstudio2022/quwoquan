  - timestamp: "2026-07-20T18:20:00+08:00"
    summary: |
      异常恢复后复核 RTC media QoE 本地主线并修正两处会让观测失真的缺陷：
      (1) 呼叫方在对端接听前已连上 SFU 后取消，必须优先归为 abandoned；
      (2) SLS 接通率分子和分母必须同时排除 abandoned，避免比率超过 100%。
      同时把非预期中断 wire 值统一为 connection_lost，并将不存在的
      livekit_node_dropped_packets 替换为 LiveKit 官方
      livekit_packet_loss_percent_bucket P95；quality_score histogram 保持官方名称。

      L2/L3 acceptance 已把 QoE emitter、hourly rollup、SLS/LiveKit 告警与本地合同
      转为 recorded/partial。静态规则、文本面板和本地 fake 数据仍不算真实 readback；
      Gamma/Prod series、可执行查询面板、真机弱网与告警恢复/回滚演练继续阻断 ready。
    reason: |
      原实现会把“本地已入 SFU、对端未接即取消”误计为成功，并让 abandoned 只从分母
      排除而仍进入分子；原 LiveKit 丢包告警还引用了上游不存在的指标名。两者都会让
      商用灰度得到虚假的健康结论，必须在环境 readback 前修正。
    change_type:
      - app
      - observability
      - local_contract
      - acceptance
    tests:
      - layer: local_contract
        intent: contract
        evidence:
          - quwoquan_app/test/local_contract/core/rtc_media_qoe_emission__observability__local_contract_test.dart
          - quwoquan_app/test/local_contract/core/telemetry/app_telemetry_reporter__local_contract_test.dart
          - quwoquan_ops/tests/local_contract/test_rtc_media_qoe_observability__observability_reliability__local_contract_test.py
    notes: |
      `promtool check rules quwoquan_ops/observability/monitoring/alerts/quwoquan_alerts.yaml`
      通过（143 rules）；QoE Dart local_contract 5 例与 Ops Python contract 通过。
      全局 ops event schema gate 当前被并发内容发布改动中的 legacy `surfaceId` 阻断，
      该字段不属于本 RTC 切片，未越权修改。
