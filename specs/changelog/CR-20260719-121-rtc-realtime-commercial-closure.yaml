entries:
  - timestamp: "2026-07-19T18:30:00+08:00"
    summary: |
      按业务对象范式收口 rtc/realtime 两域的服务端与契约。三项架构决策（用户拍板）：
      (1) realtime-gateway 第一方实现（承载 realtime 域，不归并）；(2) call_recording
      彻底删除（端云死链，未来按七步 DoD 重建）；(3) presence_view 与
      channel_ingress_receipt 显式 deferred。

      metadata：删除 call_recording 对象与 CallSession 的 isRecording/recordingUrl/
      录制事件/recording_not_allowed；call_session 状态机统一（initiated→ringing→
      connecting→in_call→ended），14 个 operation 补齐 idempotency/errors/telemetry/slo；
      新增 realtime connection IssueConnectionTicket operation、ticket 二态错误码、
      lease/fencing/ticket redis 键；chat conversation 事件的 realtime_channel 由
      rt:conversation 改为 rt:user per-user fan-out（授权留在拥有成员数据的发布端）；
      telemetry catalog 增补 rtc_call_outcome / realtime_connect_result；补 rtc/realtime
      tests 三件套与两对象 readiness.yaml。

      服务端：新建 realtime-gateway 第一方源码（ticket 签发/消费、WS 升级下发 auth_ack、
      LongPoll 兜底、Redis per-user 订阅路由、lease+fencing+presence、7 个 local_contract
      全绿）；rtc-service 按 packet 重做——CallSession 加 Version，store 改三 collection
      单事务原子提交（state CAS + 幂等 receipt + outbox），orchestrator 改服务端内部 CAS
      有限重放 + no-op receipt，装配 auth.Middleware（不再信任客户端身份 header）、
      InitiateCall 活跃通话去重、relationship gate 在 beta/gamma/prod fail-fast，删除
      /rtc/signal 信令 handler、LiveKit Egress 死代码与录制方法；livekitUrl 由服务端
      响应下发。新增 codegen_rtc_service 与 codegen_realtime_gateway 生成器并接入 Makefile。
    reason: |
      勘察确认 rtc/realtime 存在系统性技术债：realtime-gateway 是零源码幽灵服务（chat 实时
      与 rtc 信令共同断裂）、orchestrator 无 CAS 整文档 ReplaceOne 互吞并发写、rtc-service
      未装配鉴权（operation guard 下 fail-closed 且信任客户端 header）、信令双端点协议错位、
      call_recording 端到端死链。这些必须按对象范式收口而非继续加旁路。
    change_type:
      - design
      - metadata
      - codegen
      - service
      - local_contract
      - api_integration
    tests:
      - layer: local_contract
        intent: contract
        evidence:
          - quwoquan_service/services/realtime-gateway/tests/local_contract/gateway__local_contract_test.go
          - quwoquan_service/services/rtc-service/internal/application/signal_wire_type__local_contract_test.go
      - layer: api_integration
        intent: SIT
        evidence:
          - quwoquan_service/services/rtc-service/tests/api_integration/call_lifecycle_contract__api_integration_test.go
          - quwoquan_service/services/rtc-service/tests/api_integration/room_management_contract__api_integration_test.go
          - quwoquan_service/services/rtc-service/tests/api_integration/one_to_one_relationship_gate__api_integration_test.go
    notes: |
      本 CR 覆盖 B10 服务端与契约。
  - timestamp: "2026-07-19T20:30:00+08:00"
    summary: |
      App 端信令收敛单通道与凭据换轨：删除独立信令 WebSocket
      （rtc_signaling_client/wire/wire_frame 三文件），来电/结束事件改由 realtime
      单通道（RealtimeMessageHandler 按 call.*/participant.*/screen_share.* wire
      命名空间分发到 RtcSignalEventBus，IncomingCallCoordinator 订阅总线）；
      RealtimeConnectionCredential 改一次性 ticket 流（先 POST /realtime/tickets
      换 ticket，WS query 只带 ticket，长期 token 不进 URL），prod fail-closed 解锁；
      RtcRepository 补 cancelCall/leaveCall 真 operation（不再复用 hangup）、全部命令
      携带 Idempotency-Key、livekitUrl 从服务端响应消费（删除端侧硬拼
      wss://<host>:7880）；recording 从 App DTO/错误码/payload/测试全部清零。
      rtc 104 个 + realtime 35 个 local_contract 通过。
    reason: |
      与服务端单通道/ticket/CAS 契约同步落地端侧，消除双 WS 栈、身份进 URL、
      取消误用挂断、连接地址硬编码四类断点。
    change_type:
      - app
      - local_contract
    tests:
      - layer: local_contract
        intent: contract
        evidence:
          - quwoquan_app/test/local_contract/cloud/realtime/realtime_transport_contract__local_contract_test.dart
          - quwoquan_app/test/local_contract/cloud/rtc/rtc_signaling_wire__local_contract_test.dart
          - quwoquan_app/test/local_contract/cloud/rtc/rtc_errors__local_contract_test.dart
    notes: |
      环境与运营接入（同日）：gamma-local compose 的 realtime-gateway 从
      edge-media-pending 启用（build/healthcheck/auth 四件套 env，Redis standalone），
      Caddyfile 增加 /rtc 与 /realtime 路由；Docker 镜像构建成功并容器冒烟通过
      （healthz ok、匿名 ticket 403 fail-closed、伪造 ws ticket 返回结构化
      REALTIME.USER.ticket_invalid 401）；workload_topology_inventory 更新 provenance；
      Prometheus 告警新增 rtc 通话延迟/发起错误率与 gateway ticket 拒绝率/升级错误率
      四条规则；通话结束点接入 rtc_call_outcome 埋点（generated catalog 工厂）。

      剩余 GATE_BLOCK：RtcRepository 拆 typed Facet + rtc_mock_data 迁
      quwoquan_cloud_mock + supportsDevCallSimulation 收敛（改动面大，需独立会话）；
      通话旅程与 chat 实时收消息 user_acceptance（需真机/模拟器 + gamma 全栈）；
      gamma-local 全栈冷启动 + stackctl verify 运行制品与 LiveKit 容器可用性确认；
      realtime_connect_result 埋点接 delegate 连接生命周期；rtc 5 页曝光/停留埋点；
      commercial.status 翻 ready（依赖上述证据）。App 全仓测试受并发会话 WIP
      （content/discovery/user 域半成品）阻断，rtc/realtime 域内测试已全绿
      （rtc cloud 104 + rtc ui 88 + realtime 35）。
  - timestamp: "2026-07-20T03:30:00+08:00"
    summary: |
      B10 端到端商用收口第二轮：RTC 15 个 operation 全部补 pure Dart
      client_contract，经 ContractGraph 生成 typed client；App 按 metadata Facet
      拆为 lifecycle/participant/media/screen-share/query 五个细粒度接口与 Remote
      adapter，删除 410 行聚合 RtcRepository、App 内 Mock、DataSourceMode 分支、
      mock allowlist 豁免与 debug 模拟旁路。Alpha 从独立 quwoquan_cloud_mock
      注入 CallSession Facet，并用真实 realtime event pipeline 回放来电。

      真实来电先以 call.ringing payload 绘制 callerName/avatar 首帧，再经 GetCall
      补全聚合；参与者展示由 chat ConversationMember named reader 与 LiveKit
      运行态单点组合，voice/video 共用同一 provider，消除裸 userId、恒显陌生人
      假警告和双渲染链。RTC outbox 改补偿 relay；CallEnded 同时发布 per-user
      realtime 与 durable Redis Stream，chat consumer 幂等投影 system_call_log
      Message，App 渲染通话记录气泡并支持回拨。新增 ReportMediaConnected
      关闭 connecting→in_call/startedAt 写模型断点，并以 CAS 幂等 ring timeout
      sweeper 产生 no_answer/CallEnded；GetCall BOLA 漏洞同步修复。

      页面错误状态改为 RuntimeFailureBase，四个通话页面统一经 CallStageBanner
      展示可恢复错误；RTC 页面/组件中文字面量与私有尺寸清零并回写页面矩阵。
      realtime_connect_result 已接 transport 生命周期，page_open/page_return 继续
      由 generated AppPages observer 自动承载。
    reason: |
      上轮服务端完成后复盘发现真实来电页空白、Participant 展示退化、通话记录断链、
      UI 错误静默和 production Mock 双轨。以上均属于商用阻断，不能用旧 debug
      模拟与裸 HTTP Repository 掩盖。
