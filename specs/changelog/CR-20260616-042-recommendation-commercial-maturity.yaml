    summary: |
      在 H2 负反馈即时抑制完成后，重新自检推荐系统规划任务清单，将动态曝光治理、
      协同召回、排序校准、时间衰减、离线 replay、在线 AB、真实流量训练晋升、
      运营干预和冷启动质量分提升为非深度商用成熟度必备能力。新增
      discovery-content/exposure-governance L2，并冻结七个曝光治理 L3。
    reason: |
      原规划把动态曝光预算、生命周期复活、协同召回和离线评估等能力放在 Phase 2/3。
      复审后确认：虽然深度模型平台轨仍为长期上限，但成熟非深度推荐系统必须先具备
      曝光治理、评估飞轮、运营治理和冷启动质量分，否则无法达到商用推荐体验标准。
