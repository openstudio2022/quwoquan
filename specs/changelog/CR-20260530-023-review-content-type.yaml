      - B3 无 metadata 增量：tagRefs 字段 + CreatePost writable_fields 已就绪；若后续需 suggestedTagRefs 读契约再 metadata-first 增量。
      - 自动打标模型/管线（reshare-derived + content-recognition）out of scope（属 ML/数据工程）；B3 只冻结端侧消费 suggestedTagRefs 的 IA 契约。
      - 搜索补充依赖 C2 publish/tags 发布，故首发态退化为芯片多选、搜索由 flag 灰度，B3 不被 C2 阻塞。
      - 准入门清单 B3 状态已回写为冻结。

