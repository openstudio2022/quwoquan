  - timestamp: "2026-05-30T16:40:00+08:00"
    summary: >-
      引入口碑（review）内容类型，建模选型冻结为方案 A：ContentType 新增枚举值 review。口碑=带评分(rating
      1–5)+强 POI 绑定(primaryHomepageId 必填)+维度评分(reviewAspects) 的内容类型，复用 Post 聚合、
      publish 写链路(CreatePost/UpdatePost/PromotePostToWork)、推荐召回管线与统一 ContentSurfaceView；
      POI 星级聚合(ratingAverage/ratingCount/ratingDistribution)作读侧投影，不写 Post、不拆表、不新增第二套 model。
      一人一 POI 一评由部分唯一索引保证（与 published 不可变一致，重复发布拒绝、删旧再发）。
      已落 /prd(spec.md)+/design(并入 L3 spec 设计决策)+acceptance.yaml，注册 tree_index。
      C1 metadata 落盘并过 make verify-metadata + codegen + codegen-app，Go content-service build 绿。
    reason: >-
      「交集」为产品北极星，口碑天然带 entityRef(POI)+tagRefs(维度)+评分，是交集最强真实信号之一。方案 B
      （独立 review 实体）需再造写链路/召回/展示并最终仍投影回 ContentSurfaceView，与刚完成的 R24 收敛相悖，
      故否决。方案 A 以最小契约增量（枚举追加 + 可空字段 + 部分唯一索引 + 读模型）让口碑进入统一内容主链。
    change_type:
