    notes:
      - 纯增量契约：ContentType 末位追加 review、rating/reviewAspects 可空、部分唯一索引 + sparse 聚合索引，向后兼容无破坏性迁移。
      - 错误码命名遵循 CONTENT.{USER|SYSTEM|MIDDLEWARE}.reason 约定（KIND=USER），review 三码归 USER/invalid_argument|conflict。
      - C1 已完成（metadata + codegen + Go build 绿）；C1 仅落契约，业务逻辑/读模型/端侧分支为 review-content-type /dev 故事范围。
      - 跟进项（review /dev S5/S6）：lib/core/trackers/content_engagement_tracker.dart 的本地 ContentType 枚举需补 review
        并接入消费深度计算（其真相源注释指向 types.yaml，须随枚举追加同步）；ContentSurfaceView 增 rating?/reviewAspects?/poiSummary?
        只读字段 + mapper review 分支；POI 聚合读模型与一人一 POI 一评写校验在云侧实现。
      - 准入门清单 B1/B2/C1 状态已回写。

  - timestamp: "2026-05-30T17:10:00+08:00"
    summary: >-
      冻结 B3 创作打标 IA（新建 L3 creation-tagging-ia）。决策：打标全类型可选不强制；入口内联各类型编辑页；
      由自动打标（转发识别+内容识别）辅助，手动 UI 作确认/修正层（未确认不静默写入）；交互形态=首发 launch 子集芯片
      + 自动建议多选≤5（零依赖 C2），C2 发布后 flag 灰度「搜索更多标签」（检索源唯一 publish/tags）；首发标签子集
      唯一引用 tag_ref_migration launch 项；tagRefs 经 CreatePost.writable_fields 注入（已通），验收以发布后
      content.tagRefs 一致 + 进召回/IntersectionReason、打标→交集可还原为准。已落 spec.md+acceptance.yaml、注册 tree_index、结构门禁绿。
    reason: >-
      content.tagRefs 是「交集」归因核心输入，但创作流此前无打标入口导致 tagRefs 长期为空、交集稀疏；口碑（review）
      进一步要求地点+维度标签。按用户冻结口径（可选+内联+自动打标辅助）落 IA，使打标→content.tagRefs→交集可还原。
    change_type:
