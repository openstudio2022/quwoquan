    summary: |
      维持「关注单轨 + 互关派生 + GreetingRequest 破冰」正式关系模型，
      新增 greeting-request-inbox-and-upgrade 与 conversation-entry-matrix
      两个 L3 Story，回填 L2 SIT/contract 证据。端侧 ContactDiscovery、
      GreetingRequest、FollowingSubject 与 RelationshipCapability 已切 generated
      typed client，production provider 删除 AppDataSourceMode mock 分支，alpha
      runner 显式注入 fixture adapter。收口 follow_blocked codegen 错误、Greeting
      状态闭集、FollowingSubject Mongo key/index、社交搜索强类型 capability、
      semi/friends 已知路径隐私和九个 UI surface operation 归属。
      alpha/beta/gamma manifest 已加入 greeting_core、subject_follow_core、
      contact_discovery_core 与 following_subject_core，并重生 alpha bundle /
      gamma curated 场景；prod 继续禁止 seed。五个联系人页面 UAT 已由文件存在性
      声明改为真实 Widget 驱动，补联系人关系生命周期 API/UAT 与交集不造假负例。
      关系首页筛选/打开动作进入 product_action，新增 L2 关系商用 dashboard。
    reason: |
      现状实现骨架与页面数量较完整，但 generated client、环境种子、验收证据、
      商用观测和交集事实边界断裂，导致代码“看似齐全”而真实环境空转。本变更
      优先关闭单轨契约和可验证链路；R-IX02 未提供 per-candidate 事实前明确禁止
      viewer 级近似进入联系人事实文案。
