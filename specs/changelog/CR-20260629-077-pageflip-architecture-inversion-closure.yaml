entries:
  - timestamp: "2026-06-29T01:50:00+08:00"
    summary: |
      收口 R-PAGEFLIP-001 架构倒置：把翻页诊断 harness 自 quwoquan_app/lib/components/pageflip（16 文件，
      自带 engine/scene/widget/geometry 包装但薄委托生产引擎 ui/content/pageflip）git mv 到
      quwoquan_app/test/support/pageflip。执行时真相源核查证伪了初版「删除重复引擎」前提——该 harness
      并非第二套引擎，而是仅被 test + tool/ 诊断入口消费、被门禁/架构测试/合约测试硬性钉位的诊断脚手架，
      正确收口是移出 lib/ 消除「lib/components/** 反向依赖 lib/ui/content/**」的倒置（违反 01-arch
      -constraints 分层方向与 R01），同时保留 harness 完整与全部门禁钉位。harness 内部 package: 自引用
      改相对 import；4 个消费者（2 test + 2 tool 诊断入口）改相对引用（harness 无 flutter_test 依赖，
      flutter run -t tool/... 仍可用）。
    reason: |
      lib/components/pageflip 位于通用组件层却反向依赖 UI 专属的 lib/ui/content/pageflip，且仅被 test 与
      tool/ 诊断入口消费、未进生产 paint 链路（生产 reader 走 ui/content/article_reader/pageflip 宿主 →
      ui/content/pageflip 引擎）。按「未上线零兼容、零技术债容忍」与 R01/R24，应消除 lib 层倒置。前后翻
      几何历时数月才稳定、对像素极敏感（受 11/12 号规则强约束），故先建像素/视觉回归基线再搬迁，逐帧同构
      为判据，禁止保留第二套坐标链/旁路。
