entries:
  - timestamp: "2026-06-22T21:01:44+08:00"
    summary: |
      收口 `flutter run` 启动 alpha 后图片/视频/头像/主页封面不可访问与聊天 emoji 显示问号的同源问题：

      1. 四环境 public base 契约统一切换到 secure public plane。`alpha/beta/gamma`
         committed topology、App runtime config、Dart runtime defaults 改为
         `https://*.quwoquan-env.test` / `wss://*.quwoquan-env.test`；`prod`
         保持 `118.31.239.122` 主机标识，但全部 public API / realtime / media /
         gray-strategy URL 统一为 HTTPS / WSS。
      2. 本地支持启动入口不再允许裸 `flutter run` 漏过 env-package。`quwoquan_app/run.sh`
         与 `scripts/run_ios_simulator.sh` 统一委托到 env-package-backed alpha
         wrapper，并强制注入 `APP_RUNTIME_ENV`、`APP_DATA_SOURCE`、`MEDIA_*`、
         `CONTRACT_FIXTURE_PROFILE`、`APP_CURRENT_USER_ID`；alpha mock stack 与
         prod-sim / beta / gamma 本地入口同步收口到“内部 HTTP upstream + 外部 HTTPS
         public plane”模式。顺手修复了 macOS 系统 Bash 3.2 不支持 `mapfile` 导致
         `run.sh` 本身启动失败的问题。
      3. 内容媒体与头像 URL 解析规则补齐 `*.quwoquan-env.test` 私有开发域识别，
         让切到 TLS 域名后，本地图片、视频 poster、头像、主页封面仍能走正确的
         media/avatar candidate rewrite，而不是被当作陌生公网主机丢弃。
      4. Apple 主题字体契约不再依赖“emoji 为空再 fallback”的分支。主题主字体链
         直接纳入已打包的 `Noto Color Emoji`，并让 emoji picker glyph、聊天正文
         `SelectableText` 等渲染面显式消费同一套 emoji-capable text stack。
      5. `flutter run` 冷启动不再依赖外部 GitHub 下载 `sqlite3` iOS simulator
         native asset。根 `pubspec.yaml` 通过 `hooks.user_defines.sqlite3.source=system`
         把测试支撑包 `sqflite_common_ffi -> sqlite3` 的 hook 切到系统 SQLite，
         既保留主机单测能力，又避免测试依赖污染移动端 App 构建链。
      6. 本地支持构建链进一步收口到 “local-only dependency purity” 契约。
         `run.sh`、`run_flutter_test_guarded.py` 与 `gate_repo.sh` 全部切到
         `flutter pub get --offline` / `flutter run --no-pub`，并禁止 gate
         内隐式 `npm install`。`flutter_webrtc` / `livekit_client` 的 Android
         GitHub/JitPack 自定义 AAR 改为仓内 vendored 资产；`flutter_webrtc`
         desktop CMake 与 `livekit_client` Linux test CMake 不再自下载远端依赖，
         缺资产时统一 fail-closed；新增 `verify_local_dependency_purity.py`
         对 iOS Pods、SwiftPM、Android AAR 与启动/gate 入口做回归阻断。
      7. `verify_runtime_host_literals.py` 与新的 secure env 契约对齐，显式允许
         仓库受控的 `*.quwoquan-env.test` public plane，同时继续阻断 `lib/**`
         中任何未登记的第三方 host literal，避免门禁仍按旧的 loopback-only
         假设误报。
    reason: |
      这轮缺陷的根因并不是单一 Widget 或单一图片组件，而是三条契约同时漂移：
      `alpha` 启动链绕过 env-package、四环境 committed public base 仍是明文
      `http/ws`（触发 iOS ATS 拦截），以及 Apple 主题字体链缺少 emoji-capable
      family。若只补单个 surface，会继续留下第二真相源与跨环境回归缺口。
