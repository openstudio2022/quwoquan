convergence_items:
  - item: realtime-gateway 实现未就绪
    current: gamma-local edge-media-pending 占位 + prod K8s 骨架占位镜像
    target: 补源码/Dockerfile/configs 后改入 edge-media profile 并纳入主验证链，prod overlay 换正式镜像
  - item: edge-media profile 实测
    current: docker compose config（主栈 + edge-media）静态校验通过
    target: 在具备 Docker 的机器 `docker compose --profile edge-media up` 实测 rtc/livekit/coturn 健康与信令链路
dev_log:
  - date: "2026-06-08"
    change: |
      统一 recommendation 对外 DNS 命名；gamma-local 以 compose profiles 补齐 edge-media 名册（rtc/livekit/coturn
      就绪、realtime-gateway pending）；新增 verify_gamma_local_prod_consistency.py 并串入 gate。
    verify:
      - python3 quwoquan_ops/environments/verify/verify_gamma_local_prod_consistency.py
      - python3 quwoquan_ops/environments/verify/verify_workload_topology_inventory.py
      - docker compose -f quwoquan_ops/environments/compose/docker-compose.gamma-local.yaml --profile edge-media config
      - bash -n quwoquan_app/scripts/gamma/start_local_gamma_mirror.sh
