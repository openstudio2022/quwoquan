id: CR-20260608-032-gamma-local-edge-media-rec-naming-convergence
title: gamma-local 与 prod 环境一致性收敛（edge-media profile 统一 + recommendation 对外 DNS 命名统一）
status: implemented
feature_path: runtime/deliver-deploy-prod-pipeline/local-gamma-mirror
summary: |
  在 CR-031 形态基线之上，落地 gamma-local 与 prod 的环境一致性增量，遵循“各环境一致、逻辑独立、
  物理按需组装、当前阶段统一部署”：
  1) recommendation 对外 DNS 命名统一：各环境调用方统一 http://recommendation-service:8000（与 prod K8s
     Service 同名）；rec-model-service 仅保留为 Python 工件名（目录/Dockerfile/metadata）与兼容网络别名。
     改 content beta/gamma config、gamma 启动脚本（release config + podman 分支 + 容器别名）、
     gamma/主/rec-model 三个 compose 的网络别名与调用 URL。
  2) edge-media 名册补齐：gamma-local 在同一 compose 内以 compose profiles 定义 realtime-gateway /
     rtc-service / livekit-sfu / coturn（统一部署载体 + 按需组装）。rtc-service/livekit-sfu/coturn 实现就绪、
     归 edge-media profile（可 `docker compose --profile edge-media up` 叠加主栈）；realtime-gateway 实现未就绪
     （仅 K8s 骨架、占位镜像、无源码/Dockerfile），归 edge-media-pending 占位作为收敛项。
  3) 环境一致性门禁：新增 verify_gamma_local_prod_consistency.py（rec DNS 统一、edge-media 名册与 prod inventory
     一致且 profile 化、主栈纯净），串入 make gate。
  本 CR 为实现增量；edge-media profile 的实际拉起健康需在具备 Docker 的机器上 `--profile edge-media` 实测，
  realtime-gateway 待实现就绪后改入 edge-media 并纳入主验证链。
artifacts:
