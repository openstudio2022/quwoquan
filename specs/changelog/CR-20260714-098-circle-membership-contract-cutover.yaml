id: CR-20260714-098-circle-membership-contract-cutover
title: CircleMembership 唯一对象契约与 App 暴露切换
slug: circle-membership-contract-cutover
revision: 1
status: in_progress

affected_nodes:
  - specs/feature-tree/discovery-content/publish-comment-reaction
  - specs/feature-tree/runtime/system-architecture-and-engineering-guide

entries:
  - timestamp: "2026-07-14T23:25:00+08:00"
    summary: |
      CircleMembership 从旧的成员/用户圈子读取与 join/leave 路由收口为对象专属
      `ListCircleMemberships`、`ListPersonaCircles`、`JoinCircle` 与 `LeaveCircle`。
      App surface、request page id、typed remote 和服务 HTTP handler 仅消费新操作；
      `ListCircleMembers`、`ListUserCircles`、`POST /join`、`POST /leave` 不保留 alias、
      shim 或兼容路由。
    reason: |
      旧 ContractGraph snapshot 与当前 CircleMembership aggregate、query facade 和 HTTP
      handler 不一致，导致 App 生成物仍声明不可实现的操作。保留旧名会制造第二接口真相源，
      且会掩盖 persona 主体、幂等和版本语义。
    change_type: [contract, security, reliability, observability, testing]
    changed_documents:
      - path: quwoquan_service/contracts/metadata/social/circle_membership/service.yaml
        sections: [ListPersonaCircles, JoinCircle, LeaveCircle, ListCircleMemberships]
      - path: quwoquan_service/contracts/metadata/_shared/ui_surfaces.yaml
        sections: [startGroupChat, circleDetail, circleStats]
      - path: quwoquan_service/contracts/metadata/_shared/request_context.yaml
        sections: [domain_operation_page_ids.circle]
      - path: quwoquan_app/lib/cloud/remote/circle/membership/membership_remote.dart
        sections: [CircleMembershipRemote]
      - path: quwoquan_app/tool/cloud_codegen/contract_graph.lock.json
        sections: [circle.circle_membership]
      - path: quwoquan_app/tool/cloud_codegen/contract_graph.breaking.json
        sections: [approved ContractGraph handoff]
    impact:
      replan_required: false
      redesign_required: false
      retest_layers: [local_contract, api_integration]
      rollout_impact: controlled
      breaking_contract: true
      breaking_rationale: |
        删除两个无实现的旧 operation，JoinCircle 改为唯一 POST memberships 路由，
        LeaveCircle 改为唯一 DELETE memberships/self 路由。客户端必须使用重新生成的
        typed contract；服务端不接受旧 transport。
    verification:
      completed:
        - command: cd quwoquan_service && go test ./services/circle-service/tests/api_integration -run TestCircleMembership -count=1 -v
          result: PASS；真实 Mongo 7 + Redis 7 验证新 join/leave transport、persona 授权、幂等、事务、outbox、重放与 owner/moderator 不变量。
        - command: python3 quwoquan_ops/cli/cloud_contract_handoff.py accept --owner app-cloud-governance --approve-breaking && python3 quwoquan_ops/cli/cloud_contract_handoff.py verify
          result: PASS；23 项明确的 CircleMembership breaking change 已由本 CR 批准，App exposure 锁定为当前 ContractGraph。
        - command: make verify-app-generated-manifest
          result: PASS；App-only emitter 从已批准 ContractGraph 干净重建 227 个输出。
      planned:
        - cd quwoquan_service && go test ./services/circle-service/tests/api_integration -run TestCircleMembership -count=1
        - python3 quwoquan_ops/cli/cloud_contract_handoff.py accept --owner app-cloud-governance --approve-breaking
        - python3 quwoquan_ops/cli/cloud_contract_handoff.py verify
        - cd quwoquan_service && make codegen-app && make verify-app-generated-manifest
        - cd quwoquan_app && flutter analyze lib test
    remaining_blockers:
      - 本 CR 只收口 CircleMembership 的端云合同；浙江和四川内容主页生成、Gamma 导入与动态 App UAT 仍必须通过其 G0-G7 准出门。
