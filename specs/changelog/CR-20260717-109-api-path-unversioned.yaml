id: CR-20260717-109-api-path-unversioned
title: HTTP API 路径去协议版本段（/v1）
slug: api-path-unversioned
revision: 1
status: verified

affected_nodes:
  - specs/feature-tree/runtime/system-architecture-and-engineering-guide
  - specs/feature-tree/runtime/runtime-client-foundation

entries:
  - timestamp: "2026-07-17T00:00:00+08:00"
    summary: |
      破坏性去掉 HTTP API 路径中的 /v1、/internal/v1、/callbacks/v1；
      metadata→强制器→codegen→服务间 client→网关双平面→App/Portal/Data/观测同窗切换。
      零双挂、零 rewrite、零旧 path fallback；门禁 verify_api_path_unversioned 阻断回归。
    reason: |
      协议版本段造成网关 matcher、服务间 client、App generated 与运维探针多真相源，
      且与「单轨当前 schema、无兼容双轨」军规冲突。路径改为平面（可选）+ 域 + 资源 + 操作。
    change_type:
      - metadata
      - contract
      - service
      - app
      - ops
      - data
      - observability
      - local_contract
      - api_integration
      - user_acceptance
      - spec
      - gate
    changed_documents:
      - path: quwoquan_service/contracts/metadata/**/service.yaml
        sections:
          - path
      - path: quwoquan_service/contracts/metadata/_schemas/service.schema.json
        sections:
          - path pattern
      - path: quwoquan_service/internal/metadata/validate/validate.go
        sections:
          - allowedPath
      - path: quwoquan_ops/gate/verify_api_path_unversioned.py
        sections:
          - scanner
      - path: specs/feature-tree/runtime/system-architecture-and-engineering-guide/spec.md
        sections:
          - 权威真相源
      - path: specs/feature-tree/runtime/system-architecture-and-engineering-guide/acceptance.yaml
        sections:
          - SIT4 api_path_unversioned
    impact:
      replan_required: false
      redesign_required: true
      retest_layers:
        - local_contract
        - api_integration
        - user_acceptance
      breaking: true
      notes:
        - 旧 path 一律 404；客户端与网关不得保留双注册或 strip-prefix 兼容层。
        - 媒体 object key media/**/vN/、法律条款版本目录、聚合 expectedVersion 不在范围。
  - timestamp: "2026-07-17T01:40:00+08:00"
    summary: |
      continue-dev 复盘收口：扩大 verify_api_path_unversioned 扫描至 tests/feature-tree/gates/rules；
      活跃规格/门禁文档批量去版本叙述；gamma 运行中 12 个 Go 服务热替换无版本二进制并完成
      网关新旧 path 双探测；DESIGN.md + make verify-api-path-unversioned 固化治理。
    reason: |
      仅改 metadata/codegen 不足以保证运行栈与文档真相源一致；运行中旧镜像仍注册 /v1
      会导致「仓内绿、环境红」。本轮补齐运行面与文档面，并加宽门禁防回归。
    change_type:
      - ops
      - gate
      - spec
      - local_contract
      - api_integration
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - api_integration
      notes:
        - 正式 docker image rebuild 仍依赖 R-AUTH-001 密钥注入后的 stackctl up；当前 gamma 证据为热替换二进制。
