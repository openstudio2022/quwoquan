entries:
  - timestamp: "2026-06-22T00:00:00+08:00"
    summary: |
      按 `/plan-review` 把全仓测试治理从历史 `T1-T4/L1-L4` 口径收敛到唯一三层模型，并把
      `gamma-local + prod gray-initial` 的 Journey / Page 用例提升为顶层真相源，再向下约束
      `beta/gamma` 的 `api_integration` 与 `alpha/local` 的 `local_contract`。本次收口包含：

      - 目录与 bridge：新增 `generate_canonical_test_bridges.py`，为 App 377、Service 183、
        Data 101、quwoquan_ops 9 个 legacy suite 生成 canonical bridge，并自动生成 28 个页面级
        `user_acceptance/pages/<owner>/<surface_id>/...` wrapper。
      - inventory：`specs/gates/test_directory_inventory.yaml` 升级为 version 2，记录
        `current_path -> target_path -> classification_basis -> migration_status`；`pending_count`
        表示尚未 bridge 的 suite 数，新增 `bridged_count` 表示已桥接数。该状态用于治理执行面，
        不表示 legacy 文件已从磁盘移除。
      - 页面真相源：新增 `specs/gates/user_acceptance_page_inventory.yaml`，以 metadata
        `ui_surfaces` / `app_routes` 为唯一页面清单；`page-horizontal-quality` acceptance 建立
        `user_acceptance.page.*` 页面矩阵，不再为 0。
      - 证据与 acceptance：新增 `normalize_acceptance_recorded_paths.py`，回写 66 份 acceptance，
        `tests.recorded` 只允许 canonical 三层路径或真实 `QWQ_OUTPUT_ROOT/env/repo/runs/tests/**/report.json`。
      - 门禁：`verify-test-no-fake` 与 `verify-test-coverage-map` 从别名升级为独立脚本，并串入
        `Makefile` 与 `quwoquan_ops/gate/gate_repo.sh`；`make gate` / `make gate-full` 收敛到新口径。
      - 二轮收口：新增 `specs/gates/test_legacy_source_allowlist.yaml` 作为存量 legacy 源 ratchet，
        `verify-test-directory-layout` 阻断任何“新增 legacy + 补 bridge”的回潮；`verify-test-no-fake`
        进一步下钻到 bridge 背后的 legacy 源文件，并把 bench-only / grandfathered skip 例外显式化。
      - traceability：`verify-test-coverage-map` 新增 `test_evidence.cases[] -> canonical file /
        report.json.case_results[]` 校验，并补上 Journey/Scenario 的反向绑定 gate，使
        `runtime-test-pyramid` / `runtime-testinfra` 的 `tests.recorded`、`test_evidence`、`execution`
        可以直接被脚本证明。
      - 远端层 preflight：新增 `verify-test-remote-env`，在真正触发远端 `api_integration` /
        hosted `user_acceptance` 之前，先阻断缺失的 base URL、product-ops URL、token 与
        Patrol CLI wiring，避免半路才因环境前置缺失失败。
      - 历史口径清理：清掉 `README`、Patrol 用例文件头、断言文案、支撑注释与 `pubspec`
        里的 `T1-T4/L1-L4` 人类可读旧 testing 口径；保留 `RUN_T4_PATROL` / `tier t4`
        等运行时接口名，作为后续单独评估的遗留。
      - strict 扩围：回填 `comment-thread`、`voice-message`、`profile-homepage-redesign`、
        `object-homepage-network` 的 `tests.recorded` canonical 文件，并把
        `voice-message` / `profile-homepage-redesign` / `object-homepage-network` 整文件，
        以及 `comment-thread` 已补齐的 13 个 GWT 项纳入 `verify-test-coverage-map` hard gate。
        全仓 full strict 诊断从 `23` 份 acceptance / `55` 个 layer 缺口下降到
        `20` 份 acceptance / `26` 个 layer 缺口。
    reason: |
      迁移前全仓测试目录、环境语义、页面用例、acceptance recorded 与门禁都存在第二口径：Journey/
      Page 不是顶层真相源，`user_acceptance.page.*` 为 0，legacy 路径仍大量出现在主证据中，
      `verify-test-no-fake`/`verify-test-coverage-map` 只是别名，导致“看似迁移、实际不可追溯”的
      假绿风险。用户要求一次性收口迁移并关闭 `R-TST01`/`R-TST02`，因此需要同步完成规范、
      工程目录、acceptance、门禁与执行入口的同源化。
