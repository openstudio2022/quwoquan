    summary: |
      错误组件停止注入 X 和返回 CTA，栈页面/模态由宿主单独拥有退出导航；
      评论首屏、刷新和分页失败按不同载体分层。Post/内容分享面板改为
      “分享到趣我圈 + 分享到其他平台”两区，圈子走 RepostToCircle，群聊/私信
      走结构化 chat card，微信/朋友圈复用 NativeBridge 并显式降级系统分享。
    reason: |
      现有整页错误组件同时生成 X 和“返回”，与宿主导航栏重复；评论首屏
      失败使用灰色软卡片，无法表达阻塞空态。原内容分享面板仅有复制/海报/
      系统分享纵向列表，没有串起已存在的站内聊天卡片、圈子转发和微信定向能力。
