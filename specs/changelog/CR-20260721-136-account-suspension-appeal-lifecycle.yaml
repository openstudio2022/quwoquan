        intent: contract
        evidence:
          - quwoquan_service/services/user-service/tests/local_contract/account_enforcement_facade__lifecycle__local_contract_test.go
          - quwoquan_service/services/user-service/tests/local_contract/account_enforcement_auth_epoch__local_contract_test.go
      - layer: api_integration
