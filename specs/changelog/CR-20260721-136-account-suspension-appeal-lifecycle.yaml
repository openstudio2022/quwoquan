id: CR-20260721-136-account-suspension-appeal-lifecycle
title: UserAccount 可逆封禁、恢复与申诉运营生命周期
slug: account-suspension-appeal-lifecycle
revision: 1
status: in_progress
affected_nodes:
  - specs/feature-tree/user-identity-profile-relationship/settings-and-device-token
  - specs/feature-tree/user-identity-profile-relationship/settings-and-device-token/account-suspension-and-appeal-lifecycle
entries:
  - timestamp: "2026-07-21T13:10:00+08:00"
    summary: |
      冻结运营账号封禁与申诉恢复的 metadata-first 设计。UserAccount 保持 accountState/authEpoch
      唯一 owner；Product Ops 的 moderation_case_v1 / appeal_case_v1 只在审批完成后签发受信
      internal enforcement decision。Suspend/Restore 由 User Service 原子持久化状态、epoch、
      session revoke receipt 与 outbox，分别驱动跨域可逆 restriction projection。
    reason: |
      当前 UserSuspended 只有不完整 metadata 声明，缺可信生产者、认证入口统一拒绝、恢复语义、
      申诉审计和跨域投影。若以注销清理器替代封禁，会不可逆删除数据；若只在客户端隐藏，会让
      旧 token 和跨域接口继续访问，均不具备商用安全性。
    decisions:
      - closed 是不可恢复注销终态；只允许 active→suspended→active，Restore 永远不能作用于 closed。
      - 账号状态、authEpoch、session revoke 与 event outbox 同一 PostgreSQL 事务；状态 reader 不可用时认证和服务鉴权 fail-closed。
      - decision 必须携带 OIDC/服务主体、opaque case ref、decision id/digest、request/trace 与 workflow/audit 证据；App 和下游不能直接写账号状态。
      - Content、Chat、Circle、Notification、Search、Recommendation 使用 eventId+digest 幂等的可逆 restriction projection，严禁调用不可逆 accountclosure 删除路径。
      - App 仅显示 account_suspended 结构化解释和申诉续接，恢复后必须重新登录并通过 AuthContinuation 续接原目标。
    change_type:
      - specification
      - design
      - metadata
      - implementation
      - local_contract
      - api_integration
      - user_acceptance
      - reliability
      - observability
      - security
    tests:
