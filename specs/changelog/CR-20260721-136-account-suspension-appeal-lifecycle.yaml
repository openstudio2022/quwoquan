          - quwoquan_service/services/content-service/tests/api_integration/user_account_suspension_projection__api_integration_test.go
          - quwoquan_service/services/chat-service/tests/api_integration/user_account_suspension_projection__api_integration_test.go
          - quwoquan_service/services/circle-service/tests/api_integration/user_account_suspension_projection__api_integration_test.go
          - quwoquan_service/services/notification-service/tests/api_integration/user_account_suspension_projection__api_integration_test.go
          - quwoquan_service/services/search-service/tests/api_integration/user_account_suspension_projection__api_integration_test.go
