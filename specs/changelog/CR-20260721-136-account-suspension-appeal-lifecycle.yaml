    rollout:
      stages: [alpha, beta, gamma, prod]
      rollback:
        - 已提交 Suspend/Restore decision 只能通过后续审计完整的决策处理，禁止直接写库或静默改回 active。
        - 保留 outbox、stream、checkpoint、inbox/digest 和 TTL DLQ；代码回滚后继续按 canonical event 排空。
    notes: |
      状态保持 in_progress，直到 metadata/codegen、所有认证入口、跨域 restriction projection、
      三层测试、Gamma 真机矩阵、辅助功能证据与受保护 Prod rollout 均完成。规格冻结不是商用准出。
