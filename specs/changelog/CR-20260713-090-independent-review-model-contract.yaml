  - timestamp: "2026-07-13T23:10:00+08:00"
    summary: |
      页面自有图片下载改为强类型 PageImageFetchResult：429 限流、上游不可用、HTTP 状态、
      网络、尺寸与媒体类型失败各自保留闭集结果并执行有限退避。页面图位不再消费独立
      图片作品配额；wikitext 延迟补全同时刷新 meta、source.layout、source.md 与
      source.clean.md。build_validate 与 release readiness 强制消费图片完整性报告。
    reason: |
      普陀山页面已枚举 17 张图片却因通用 None 返回和 CDN 429 被静默折叠为 8 张，且
      source.layout 未同步导致正文图锚点丢失。该问题会使离线验证误把不完整来源推进到
      Agent 生成和发布候选，必须在下载和主页准入边界硬阻断。
    change_type:
      - contract
      - reliability
      - observability
      - testing
