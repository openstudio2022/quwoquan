  - timestamp: "2026-07-13T16:00:00+08:00"
    summary: |
      执行 recipe 显式绑定 author/reviewer 的 model 与 modelFamily；G0 分别执行真实 Cursor
      SDK 启动探针。新增 homepage_reviewer_response schema，控制器将其转换为带
      provider/model/modelFamily/runId 的 canonical reviewer_result，attestation 强制保存模型族。
    reason: |
      浙江金丝雀的 gpt-5.4-mini 虽可被列出但本地 SDK 实际返回空 status=error；旧实现只比较
      模型字符串，且 Agent 回复与 canonical reviewer_result 共用 schemaVersion，无法证明独立性或
      精确归因失败。
