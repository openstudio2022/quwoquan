    notes:
      - 图片完整性失败只可删除失败 execution 后以新 sequence + retryOf 重跑；禁止复用残缺 assets 或旧 review 证据。
  - timestamp: "2026-07-13T16:30:00+08:00"
    summary: |
      审阅输入新增由 manifest.imagePlacements 投影的 mediaDisposition。cover、inline 与
      related gallery 使用闭集 expected disposition；groupMember 只验证相关图片画廊闭包，
      不再错误要求正文段落锚定。
    reason: |
      东钱湖金丝雀中的 groupMember 已按产品规则进入相关图片，独立审阅仍将其误判为正文
      图文错位，触发无效 ReAct 回退。规则须在 reviewer prompt 与运行时输入同源表达。
