  - timestamp: "2026-07-17T18:45:00+08:00"
    summary: |
      将启动路径从欢迎页定时退出收敛为原生首帧、Flutter bootstrap、Welcome、Router 与
      安全 Shell 的单向终态机。新增独立 StartupAttempt journal 与受限匿名启动遥测接收，
      用于关联 native、Dart、Router、Shell、recovery 和最终摘要，且不改变通用事件入口
      的已验证主体要求。
    reason: |
      缺运行时定义会在 runApp 前抛错并永久停留原生 LaunchScreen；Welcome/Router 的异步
      回调、native 首帧和现有 Analytics/AppLog 链路也无法共同保证用户可恢复和云端可诊断。
