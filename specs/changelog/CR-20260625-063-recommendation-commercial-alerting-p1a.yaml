entries:
  - timestamp: "2026-06-25T01:30:00+08:00"
    summary: |
      在 P1 推荐商用归因看板之后，新增 P1a 商用告警层：unknown attribution、按供给来源的
      负反馈异常、按召回路径的 CTR 异常、旅行/精品消费断崖和 UGC/数据工程供给 share 失衡。
      告警只消费 P0+ 真实 emitter 指标 recommendation_feed_served_by_attribution_total 与
      recommendation_behavior_by_attribution_total。
    reason: |
      看板只能支撑人工复盘，商用成熟还需要持续异常时能触发响应。P1a 将 P0+ bounded attribution
      从可查询推进到可告警，避免端云归因丢失、场景路由退化或供给来源失衡长期静默。
