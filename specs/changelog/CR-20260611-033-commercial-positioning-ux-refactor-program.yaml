convergence_items:
  - item: 校友图谱（共同校友图谱级计算）
    current: identity 维度「同校」entity tagRef 事实表达
    target: 校友关系图谱数据源就绪后升级为可枚举校友集合
  - item: 实体页影响卡（homepage_impact）
    current: WP3 首发仅做「认识对象」摘要卡，影响卡视归因数据可用性
    target: 归因数据可用后补 homepage_impact_summary 投影与卡片
  - item: 消息页五个一级分类
    current: 双 Tab + 五分类落二级胶囊（折中冻结）
    target: 商用后若数据证明二级承载不足，另起 CR 评估一级分类重构
  - item: 创作页协调层大文件治理
    current: WP6 已抽离发布确认组件与行内对象提及 picker，但 create_page.dart 仍约 2646 行
    target: 后续按 article-editor-refactor 继续拆出媒体处理、草稿调度、发布 orchestration 与编辑器 adapter，使协调层降至 <1000 行
  - item: WP7 专题 / 圈子精选卡位
    current: WP7 Core 冻结 Web 宽屏多列墙与 Work Browser V1 验收，尚未落地专题/精选卡位 metadata、UI 与测试
    target: 启用 WP7 Plus 时，在 content/post/ui_config.yaml 增加卡位配置，Web/Mobile 消费并补配置开关与跳转测试
  - item: Work Browser 输入边界纯化
    current: viewer 仍保留 rawPostsById + PostBaseDto -> WorkBrowserItemDto 兼容路径
    target: 后续收敛为 WorkBrowserItemDto 单一输入真相源，完成 works-immersive-viewer GWT6
