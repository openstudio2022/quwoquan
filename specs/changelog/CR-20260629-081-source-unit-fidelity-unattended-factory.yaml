entries:
  - timestamp: "2026-06-29T16:40:00+08:00"
    summary: |
      将来源单元物理真相源从实体对象 `1.download/sources/{NN}.{kind}` 迁到批次级
      `sources/{sourceUnitId}`，实体/作品对象仅保留 `1.download/source_refs.json` 软引用；
      同步 `meta.relevance.targetRefs/entityTags/semanticMentions/coverageTargets` 与
      `publishMediaMode`，并让 content_plan、route analysis、release integrity、scale readiness
      都按单一 `baseSourceRef` 取证。新增 `env cursor-probe` N 次探针报告与
      `task scaled-e2e run` 串联入口；managed-local stale `controllerYield` 恢复下沉到 CLI，
      shell runner 不再手工改 workflow JSON。
    reason: |
      旧实现把 source pool 绑定到实体目录，导致跨实体证据聚合、UGC 文本与 Wikimedia/官方图替换、
      HTML 图片丢失、600 字硬门误伤富图文底稿，以及 controllerYield 残留必须人工清理。
      本轮按“底稿忠实 + 同源媒体 + 无人托管”约束，把底稿、源图、证据链、运行恢复和放量入口统一到可审计 CLI 合约。
    change_type:
      - contract
      - architecture
      - data_pipeline
      - test
      - operations
    changed_documents:
      - path: quwoquan_data/docs/pipeline_directory_layout_spec.md
        sections:
          - "source unit 物理真相源改为 sources/{sourceUnitId}"
          - "对象级 source_refs.json 仅保存软引用索引"
      - path: quwoquan_data/docs/content_pipeline_spec.md
        sections:
          - "download 输出改为 source_refs.json + 批次级 source pool"
      - path: specs/feature-tree/runtime/runtime-data-engineering/geo-content-trinity/workflow.md
        sections:
          - "content_plan 输入改为 source_refs.json 指向的 canonical source unit"
      - path: quwoquan_data/schema/produce/content_plan_packet.schema.json
        sections:
          - "baseSourceRef 描述改为 batch 相对 sources/{sourceUnitId}/source.md"
    impact:
