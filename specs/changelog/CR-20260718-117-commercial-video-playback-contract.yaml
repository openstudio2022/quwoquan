    summary: |
      冻结首页内嵌和 WorkBrowser 沉浸播放为两个 profile，定义唯一播放会话、快照、
      手动暂停优先级、四级时间轴、受控 storyboard、权威 VOD 描述符、有效播放与 Ops QoE
      分轨。初始 App 切片以 session 消除 WorkBrowser 对原生 controller 的直接持有，并接入
      首页半透明进度轨、WorkBrowser 暂停/拖动控制层。
    reason: |
      现有 ready 只表示 controller 初始化，控制权、时长来源、seek、推荐行为与 QoE 都不可靠；
      页面各自直接操作 controller 会导致手动暂停被自动恢复、切集残留播放以及观测数据失真。
