  - timestamp: "2026-07-19T00:18:00+08:00"
    summary: |
      将商用播放拆分为 P0 progressive MP4/Range 安全 seek、P1-A storyboard 与 P1-B
      HLS/CMAF ABR 三条独立准入线；首页总时长位置覆盖旧约定，固定为轨道左上。
      产品时长上限冻结为 1 小时，125 秒素材用于高频拖动回归，接近/超过 1 小时的
      受控素材用于边界与拒绝合同。
    reason: |
      现有计划把未实现的处理链、预览链与 ABR 混为一个发布门，且已有 canary 的声明时长
      与真实媒体不一致。分门后，P0 可在 preview/ABR 关闭时安全发布，同时不降低真实
      probe、原生首帧/seek settle、有效播放、QoE 和四环境证据要求。
