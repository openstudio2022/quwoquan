  - timestamp: "2026-07-19T10:15:00+08:00"
    summary: |
      原生 QoE 事件改为 prepare 前注册的 Media3 证据链：TTFF 使用 native monotonic elapsed，
      release seek 仅在 seek discontinuity 后收到 native rendered-frame 才结算；同时上报
      dropped frames、processed frames、audio underrun 与低基数 renderer/queue/fallback 配置。
      App 不再读取 video_player 的 testing-only playerId，而是通过仅 Android 消费、请求前剥离的
      opaque token 关联并回放初始化早期事件；非 Android 平台保持无原生指标字段。
    reason: |
      旧实现会在 ExoPlayer listener 注册前 prepare，可能遗漏第一帧；又以 controller attach
      时间估算 TTFF，并依赖 testing-only playerId，既不是真实原生证据也有跨版本风险。直接释放
      SurfaceView 所有的 Surface 还可能重现 buffer ownership race。必须以同一原生事件链和
      metadata/codegen/SLS 读回闭环，而不能用 seek Future、机型分支或零值伪造性能结论。
    change_type:
      - app
      - service
      - ops
      - metadata
      - local_contract
      - observability
