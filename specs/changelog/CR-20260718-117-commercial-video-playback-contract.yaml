  - timestamp: "2026-07-19T09:56:00+08:00"
    summary: |
      T4 证据链改为只接受设备所属 Patrol 原始日志中的原生首帧与 seek-settled 标记，
      full gate 会重新读取归档日志及 report/screenshot/recording/QoE 文件；同一成功 run
      还必须来自物理 Android，并拒绝 emulator、controller 命令完成和环境变量声称的
      native settle。media-canary validate 同时改为重新 probe 视频并校验
      descriptor/probeHash，避免手改 descriptor 冒充 fast-start、GOP、时长或权威媒体属性。
    reason: |
      原先 `VIDEO_PLAYBACK_NATIVE_SEEK_SETTLED` 可使缺少设备事件的报告显示
      `native_settled`，而 descriptor 校验也只读取声明值；两者均不能作为商用证据。
      必须把验收结论绑定到实际设备日志和实际媒体字节，保留外部矩阵未齐时的 GATE_BLOCK。
