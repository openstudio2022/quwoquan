  - timestamp: "2026-07-19T08:48:00+08:00"
    summary: |
      高保真视觉合同覆盖旧“时长左上、圆形背景播放按钮”约定：
      首页时间轴贴视频底边并常驻轨道右上方总时长；WorkBrowser 时间轴贴互动工具栏
      上沿、无左侧播放按钮，总时长只在首次进入或切集后最多显示 5 秒；标题、正文和
      交集说明均位于时长/时间轴之上，实际碰撞时立即隐藏视觉时长且不占独立行；
      暂停态使用无背景圆角播放三角，拖动态使用更大的等宽时间浮标。
    reason: |
      现行共享状态机和 release-only seek 已具备正确架构基础，但布局、视觉层级与低端设备
      证据不符合高保真目标。Android 兼容不采用品牌/具体机型特殊分支，改为最低支持 API、
      低内存、低算力、软件 decoder 和能力缺失的统一 capability/结构化降级矩阵。
    change_type:
