  - timestamp: "2026-07-03T00:00:00+08:00"
    summary: |
      修复图片书第一页中心左滑前翻不跟手的材质门禁漂移：直接 page surface 纹理生成器存在时，
      翻页框架将其视为 active curl 材质真相源，不再受外部 `isPageTextureReady` / precache 状态阻塞；
      图片加载回调刷新 `textureReadinessSignature` 时，如当前正在拖动或释放动画中，则延后刷新材质缓存，
      避免真实设备上动态层被中途清空。
    reason: |
      文章可稳定前/后翻，是因为文章翻页启动时已有排版 page surface；图片书虽然已接入同一 pointer
      手势层和 pageflip controller，但仍保留网络图片 ready 门禁与拖动中清快照的刷新策略，真实图片加载
      时会把“可生成失败/占位双面 surface”的直接纹理路径误当成未就绪，造成第一页前翻无反馈或闪断。
    change_type:
      - bugfix
      - product
      - test
      - governance
    changed_documents:
      - path: quwoquan_app/lib/components/media/shared/pageflip/media_page_flip_book.dart
        sections:
          - "直接纹理生成器存在时 `_isPageTextureReady` 恒为 true，ready predicate 仅服务截图捕获路径"
          - "拖动/释放动画期间延后 direct texture refresh，避免加载回调清空 held curl 材质"
      - path: quwoquan_app/test/local_contract/ui/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart
        sections:
          - "新增直接纹理路径不被 ready=false 或加载回调打断跟手的 local_contract"
      - path: quwoquan_app/test/local_contract/ui/components/media/image/book/image_book_canvas_widget__local_contract_test.dart
        sections:
          - "新增 ImageBookCanvas 第一页中心左滑立即进入公共翻书跟手层契约"
      - path: specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer/acceptance.yaml
        sections:
          - "GWT3 增补 direct page surface 材质路径不得被 ready/precache 状态阻塞"
