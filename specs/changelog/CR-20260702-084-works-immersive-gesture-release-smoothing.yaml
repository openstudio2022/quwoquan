  - timestamp: "2026-07-02T00:00:00+08:00"
    summary: |
      修复两张图场景下图片书第一页前翻、第二页后翻在画面中心慢拖不跟手的问题：媒体书页宿主
      从 `GestureDetector.onHorizontalDrag*` 改为 pointer 级追踪，并允许当前方向可翻时在 preview
      阶段先启动动态 curl；如果后续仲裁锁定纵向切作品，则立即取消子级翻页。边界横滑只保留
      轻量回弹，不再弹出“到边界”类提示语。
    reason: |
      Flutter 横向拖拽识别本身要等待手势竞技场判定，再叠加沉浸仲裁的 preview 距离，会让两张图
      首尾可翻方向在中心慢拖时出现前半段无反馈。边界提示语会打断视频书沉浸浏览，应由视觉回弹
      表达边界，而不是 toast 文案解释。
    change_type:
