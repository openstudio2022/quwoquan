  - timestamp: "2026-07-03T00:00:00+08:00"
    summary: |
      将图片书与文章浏览器的拖动入口收敛到同一个 `ImmersivePointerGestureLayer`：公共层只负责
      单指 pointer 追踪、delta、totalDelta、水平 velocity 与 start/update/end/cancel 事件采样；
      图片书和文章宿主继续各自处理 pageflip intent、边界回弹、纹理和文章 tap/hover 语义。
    reason: |
      前序修复让图片书先进入 pointer 级采样，而文章主舞台仍使用 `GestureDetector.onPan*`，
      虽然共用 intent controller，但采样时机和速度来源仍分叉。为了避免后续图片和文章手势体验再次
      漂移，需要把手势层逻辑共享，业务行为留在各自宿主。
    change_type:
      - architecture
      - refactor
      - test
      - governance
    changed_documents:
