entries:
  - timestamp: "2026-07-02T00:00:00+08:00"
    summary: |
      收敛视频书图片与文章沉浸翻页的手势仲裁：前/后翻方向以累计 `dx` 为唯一真相源，
      左滑前翻、右滑后翻；起手左右半区不再决定翻页方向。preview 阶段释放父级竖向
      PageView，让斜向纵拖能及时跟手；只有锁定横向翻页或横向边界回弹后才冻结竖向切作品。
      图片书与文章宿主统一使用 pageflip release policy，并将 settle 时长限制为 `260ms..520ms`，
      避免高速释放闪缩。
    reason: |
      用户反馈前后翻曾被错误设计为左右半区判向，且可翻页时上下切作品跟手性差、释放动画过快。
      根因是手势 preview 阶段过早 hold 父级竖向滚动，以及文章宿主仍在 panStart 时使用
      `directionForGlobalPoint` 由起手位置决定方向。本次只修手势入口与释放策略，不改 pageflip
      几何、三面纹理、BACK 主线或云 API。
    change_type:
      - bugfix
      - product
      - test
      - governance
    changed_documents:
      - path: quwoquan_app/lib/components/media/shared/gesture/immersive_gesture_intent_controller.dart
        sections:
          - "preview 阶段不再冻结父级竖向滚动；locked pageflip/boundary 后才 hold vertical"
          - "保持 `dx < 0` 前翻、`dx > 0` 后翻、纵向优势切作品的统一仲裁"
      - path: quwoquan_app/lib/components/pageflip/release_policy.dart
        sections:
          - "settle duration clamp 调整为 260ms..520ms，避免高速释放闪缩"
      - path: quwoquan_app/lib/components/pageflip/controller.dart
        sections:
          - "为 animation plan 增加 duration override helper，不改变帧序列和几何"
      - path: quwoquan_app/lib/components/media/shared/pageflip/media_page_flip_book.dart
        sections:
          - "图片书 release 改用共享 pageflip release policy"
      - path: quwoquan_app/lib/ui/content/article_reader/pageflip/host/article_read_only_book_deck.dart
        sections:
          - "沉浸文章拖动方向改为优先由手势 intent / drag dx 决定，起手位置仅决定上下角"
          - "文章 release 改用共享 pageflip release policy"
      - path: specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer/acceptance.yaml
        sections:
          - "GWT3 增补 dx 判向、preview 不冻结竖向、release 速度限幅验收"
