  - timestamp: "2026-07-03T00:00:00+08:00"
    summary: |
      修复 Work Browser 父级 Listener 与图片书/文章子级手势层同时更新同一手势仲裁器的问题：
      父级作为唯一 intent 坐标源，负责用 Work Browser 坐标更新 `ImmersiveGestureIntentController`；
      图片书和文章宿主只读取 locked/preview intent，并继续用自身局部坐标驱动 pageflip fold。
    reason: |
      前序测试覆盖了子组件 held curl 和大幅横拖，但没有覆盖“父级 Listener + 子级 pageflip layer”
      组合下的小幅中心慢拖。真实设备上父子两层会把不同坐标系的 `localPosition` 交替写入同一个
      controller，导致第一页图片左滑前翻的累计 dx/intent 被扰乱；文章因宿主初始化路径不同不易暴露，
      但同样需要遵守唯一坐标源规则。
    change_type:
      - bugfix
      - architecture
      - test
    changed_documents:
      - path: quwoquan_app/lib/components/media/shared/pageflip/media_page_flip_book.dart
        sections:
          - "外部 gestureIntentController 由父级唯一更新；图片书只消费 intent，不再用子级 localPosition 二次 update"
      - path: quwoquan_app/lib/ui/content/article_reader/pageflip/host/article_read_only_book_deck.dart
        sections:
          - "文章宿主同步改为消费父级 intent，不再二次 begin/update 外部 controller"
      - path: quwoquan_app/test/local_contract/ui/discovery/widgets/works_immersive_viewer_widget__local_contract_test.dart
        sections:
          - "Work Browser 图片首图中心小幅左滑必须立即出现翻页层"
      - path: specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer/acceptance.yaml
        sections:
          - "GWT3 明确父级是沉浸手势仲裁器唯一坐标源"
