  - timestamp: "2026-07-06T00:00:00+08:00"
    summary: |
      收口视频书图片翻页连续浏览舒适度：默认仍保留原生翻书，但将图片书 active moving sheet
      改为同层 `recto/verso` 渐进呈现，前翻时当前页正面随手指离场、后翻时上一页正面在同一
      moving sheet 内可见，避免进入 curl 后整张动层突然替换为背面。图片书运动 profile 改为
      `dragTravelFactor=1.0`，前 `24px` 只做浅 edge lift；release 改为 ease-out 连续采样，
      并把提交/回弹时长分别收敛为 `320ms..520ms` / `220ms..360ms`。
    reason: |
      前序修复已解决“能跟手、不会闪”，但用户连续翻图片时仍感到跳跃和视觉不适。根因不再是单纯
      速度过快，而是 active sheet 纹理离散替换、背面镜像对比过强、释放帧线性 round 跳变，
      以及缺少 Reduce Motion 替代路径。本次补正式舒适度契约，不把普通 PageView 作为默认主体验。
    change_type:
      - bugfix
      - product
      - accessibility
      - observability
      - test
      - governance
    changed_documents:
      - path: quwoquan_app/lib/components/media/shared/pageflip/media_page_flip_book.dart
        sections:
          - "图片书子级只消费父级 intent；moving sheet 内同层呈现 recto/verso；舒适 drag profile、ease-out 采样、Reduce Motion 轻量页态更新与 motion event"
      - path: quwoquan_app/lib/components/pageflip/release_policy.dart
        sections:
          - "commit settle clamp 320ms..520ms，cancel settle clamp 220ms..360ms"
      - path: quwoquan_app/lib/components/media/image/book/image_book_page_surface.dart
