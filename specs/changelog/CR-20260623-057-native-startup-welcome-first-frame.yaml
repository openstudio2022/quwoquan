  - timestamp: "2026-06-25T09:20:00+08:00"
    summary: |
      按 Android 真机反馈再次纠偏：撤销“初始化后再完整播放 Flutter 欢迎页”的串行方案，启动欢迎改成同一条并行时间轴。

      1. Android `windowBackground` 移除静态 `launch_splash_icon`，启动窗口只保留品牌背景，避免把静态花瓣首帧伪装成欢迎页。
      2. Android `NativeWelcomeView` 只承担 Flutter 首帧前的早期绘制，并把 `nativeStartupElapsedMs` 暴露给 Flutter。
      3. Flutter `WelcomeScreen` 新增 `initialSequenceElapsed` / `sequenceEnabled` / `onFlutterWelcomeReady`：拿到原生已跑时间后从对应花瓣进度接续，而不是从 0 重放。
      4. 一次花瓣绽放约 1.5 秒完成；启动初始化与欢迎动效并行，Shell ready 且动效已完成就进入主壳。若 Shell 未 ready，才进入最多两轮重放并显示一行 `启动中，马上进入`。
      5. 原生 overlay 不再等待 Flutter 欢迎完成；它只等 `flutterWelcomeReady`，确认 Flutter 已按同一进度渲染后淡出。若握手异常，4.5 秒兜底释放并记录 `android_flutter_welcome_ready_timeout`，避免用户卡死。
      6. 本地契约测试更新为反向约束：禁止静态花瓣 `windowBackground`，要求 `nativeStartupElapsedMs -> flutterWelcomeReady -> flutterWelcomeCompleted` 可观测链路，要求 Flutter 欢迎页消费 `initialSequenceElapsed`。
    reason: |
