  - timestamp: "2026-06-24T08:36:00+08:00"
    summary: |
      按 iPhone 模拟器复测反馈撤回“原生欢迎页静态镜像”方案：原生层不能再显示花瓣、标题、标语，也不能把原生停留时间当作欢迎页动效的一部分。新的启动边界为：

      1. iOS `LaunchScreen.storyboard` 不再引用 `LaunchImage` 欢迎镜像，改为只引用 `LaunchTransitionBackground`
         背景渐变；旧 `LaunchImage` 资源改为透明占位，避免再次展示花瓣/标题。
      2. Android 原生启动层不再生成或引用 `launch_brand_cluster.png`、`launch_background_full.png`；
         `launch_background.xml` 改为 XML gradient，v31 样式从 `Theme.SplashScreen` 回到普通
         `NoTitleBar + windowBackground`，避免 Android 12 system splash 强行显示透明图标 + 蓝底。
      3. Flutter `WelcomeScreen` 删除 `nativeWelcomeCoveredDuration` 抵扣逻辑，欢迎页动效始终按自身
         3 秒完整序列播放；原生过渡不再缩短花瓣绽放过程。
      4. `StartupActivity` 去掉固定 120ms handoff 延迟，下一帧即进入 Flutter 宿主，减少空过渡停留。
      5. 设备探针阈值收紧，只有足够前景差异或复杂度才算“欢迎页/内容可见”，不再把单色或简单渐变背景误判为启动成功。
      6. 本地契约测试新增反向断言：禁止 iOS storyboard 重新引用 `LaunchImage`，禁止生成脚本再画花瓣/标题，
         禁止 Flutter 欢迎页按原生启动耗时缩短，禁止 Android v31 回到 `Theme.SplashScreen`。
    reason: |
      iPhone 模拟器上用户观察到的“前 1-3 秒静态花瓣页 + 初始化后进入真正欢迎页”，本质是原生启动层镜像了
      Flutter 欢迎页首帧，并且 Flutter 又用原生已显示时长抵扣欢迎页地板时长。这虽然遮住了白/蓝屏，但产品语义
      上是两个欢迎页，违背“欢迎页只有一个”的要求。本轮把原生层降级为无内容过渡背景，真正的花瓣、标题、标语
      和动效只由 Flutter `WelcomeScreen` 负责。
