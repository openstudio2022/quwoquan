entries:
  - timestamp: "2026-06-23T23:30:00+08:00"
    summary: |
      修复 Android 真机 `flutter run` 冷启动时 Flutter 首帧前仍停留纯蓝原生窗口的问题：

      1. Android `LaunchTheme` / `NormalTheme` 的 `windowBackground` 从纯色改为品牌渐变 + 欢迎页静态首帧，
         补齐 `drawable-mdpi..xxxhdpi/launch_brand_cluster.png` 密度资源；Android 12+ 单独使用
         `launch_splash_icon.png` 居中花瓣图标，避免完整 cluster 被系统图标视口裁到透明留白。
      2. Android `MainActivity` 在 `onCreate` 后立即安装原生欢迎 overlay，Flutter UI displayed 后
         120ms 淡出移除，避免 Android 12 system splash 阶段屏蔽普通 `windowBackground` bitmap 时继续纯蓝等待。
      3. iOS `LaunchScreen.storyboard` 不再只是纯蓝背景，改为在背景上全屏 aspect-fit 引用
         `LaunchImage` 欢迎静态帧；重新生成 `LaunchImage` 1x/2x/3x 透明覆盖层。
      4. Flutter 欢迎页首帧改为标题稳定、花瓣从可识别但未完成绽放的状态开始，原生静态帧与 Flutter
         接管后的第一帧保持同一视觉节奏。
      5. 根启动接通 `onSequenceComplete` 状态机：首轮欢迎动效结束后检查 Shell ready；未 ready 时最多
         重放两次花瓣，重放期间只显示一行 `启动中，马上进入`，超过上限进入降级 Shell，由页面生命周期承接。
      6. Android / iOS 增加 `QWQStartup` 平台日志，配合 Dart `startup_welcome_sequence` 埋点观察
         原生 Activity / Flutter engine / Flutter UI displayed / welcome completed。
      7. 新增 native launch screen local_contract 测试，阻断 Android 退回纯色启动屏、漏 Android 12+
         splash 或 iOS storyboard 不引用 LaunchImage 的回归。
    reason: |
      上一轮只修了 Flutter 首帧之后的欢迎页，Android 用户实际等待的 2-4 秒发生在 Flutter 首帧之前，
      由原生 `LaunchTheme` 负责显示。原生资源仍是纯蓝色，导致测试通过但真机第一可见画面仍不是欢迎页。
      本轮把“欢迎页第一帧”提升到平台原生启动层，Flutter 接管后再播放完整花瓣动效，并补观测和契约测试。
