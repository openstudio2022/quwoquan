  - timestamp: "2026-06-24T00:50:00+08:00"
    summary: |
      复测发现 Android 12 system splash / preview window 仍会在 Flutter 首帧前覆盖 `MainActivity`
      的 overlay，表现为 0.5s / 2.0s 仍是空蓝或空浅底。最终改为原生 `StartupActivity`
      作为唯一 Launcher：它在 500ms 前直接绘制同一张合成欢迎页位图，再无动画交给 `MainActivity`。

      1. 新增 `StartupActivity`，启动即显示 `launch_background_full.png` 合成欢迎页，避免 Android
         starting window 丢失 layer-list bitmap 或只显示纯色背景。
      2. `MainActivity` 不再直接作为 Launcher，改用 `FlutterStartupTheme`，继续保留原生欢迎 overlay
         到 Flutter UI displayed，保证 Activity 交接期间仍是同一个欢迎视觉。
      3. 原生侧通过 `quwoquan/startup/native` 暴露已显示欢迎页耗时；Flutter 欢迎页计算 3 秒地板时扣除
         原生已覆盖时长，避免用户先等原生欢迎页再完整等待第二段 3 秒。
      4. 新增 `scripts/device/verify_startup_first_frame.py`，默认 Android 500ms 门槛，三层截图必须都非空屏、
         非蓝屏；同时记录 `android_flutter_ui_displayed` 是否在 3 秒预算内，作为性能观察字段。
      5. 移除早期 Android 12 system splash icon / color 兜底资源，避免与 `StartupActivity`
         合成欢迎页形成第二套启动真相源。
      6. Web 构建因 vendored `record_web` 缺少 `setOnConfigChanged` 阻断，本轮补齐平台接口空实现，保持
         Web 启动验证可运行。
    reason: |
      只改 `LaunchTheme` / Android 12 splash icon 无法保证真机和 emulator 的第一可见画面；系统 preview
      会优先显示纯色并盖住 Flutter 宿主 Activity。把极轻量原生欢迎页前置为 Launcher 后，用户可见首帧
      不再依赖 Flutter engine 或 Android 12 system splash 的 icon 行为。
