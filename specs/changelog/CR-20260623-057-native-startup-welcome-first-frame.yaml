  - timestamp: "2026-06-24T02:05:00+08:00"
    summary: |
      启动 engine / Dart 性能专项复盘后，确认 Android `flutter run` debug 模式是用户看到 2-4 秒纯蓝等待的主要放大器，
      但 release 包还暴露了两个必须同步修复的问题：

      1. `GeneratedPluginRegistrant.java` 会被 Flutter 重新生成并写回 `integration_test` / `patrol` dev-only 插件，
         release 编译缺少测试插件类，或在缺失 registrant 时运行期崩溃。新增构建前 patch 钩子，把 dev-only 插件改为
         可选反射注册，release 包不编译测试插件，debug/profile 仍可在类存在时注册。
      2. Android 12+ system splash 只声明 AndroidX 属性时，release 500ms 仍可能只显示纯蓝背景。v31 样式同时声明
         framework `android:windowSplashScreen*` 与 AndroidX `windowSplashScreen*`，并保留 `StartupActivity`
         合成欢迎页和 `MainActivity` overlay，形成 system splash -> native welcome -> Flutter welcome 的同一视觉链路。
      3. 移除过期 `CurrentSharedPreferencesPlugin` registrant 补丁，恢复当前依赖实际存在的
         `SharedPreferencesPlugin`，避免 release Java 编译失败。
      4. 顺手修复 release AOT 暴露的 `CreateMediaPickerPage._buildForcedDarkChrome` 两处缺失 `baseContext`
         参数，确保启动性能测试能覆盖完整 release 编译。
    reason: |
      debug/profile 的 JIT、JDWP、profile instrumentation、本地 alpha mock 准备和 adb install 后包广播会显著拖慢
      Activity 创建与 Flutter engine 配置；这解释了 `flutter run` 首启比 release 慢。但生产验收不能只归因于 debug，
      release 构建纯度、Android 12 system splash 属性和端侧首帧探针必须同时闭环。
