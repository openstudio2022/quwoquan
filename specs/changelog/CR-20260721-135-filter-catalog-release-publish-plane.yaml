id: CR-20260721-135
title: FilterCatalogRelease 单轨目录与受信四环境发布面
date: 2026-07-21
status: in_progress
feature_tree:
  domain_service: discovery-content
  business_capability: publish-comment-reaction
  story: filter-catalog-release
motivation: >
  图片编辑器不得继续把 App asset 或动态配置当成滤镜业务真相。目录需要由不可变
  FilterCatalogRelease 发布、公开读取、端侧校验缓存和同源 bootstrap 共同闭环，
  且发布面必须具备最小权限、幂等、环境证据和可回滚性。
changes:
  metadata_and_service:
  - 新增并验证 FilterCatalogRelease aggregate、强类型 15 项 adjustments、Stage/Activate/Rollback/GetActiveFilterCatalog operation 与单 active 生命周期。
  - 修复 content-service route codegen，使四个目录 operation 直达专属 handler；补齐重复分类排序拒绝，避免 Go/Python/Dart 不变量漂移。
  app:
  - 端侧 ImageEditorFilterConfig 校验与服务端收敛：拒绝重复分类/同分类预设排序、禁用 original、禁用 fallback、禁用预设的未知分类引用及非 canonical 文本。
  - 继续使用 typed RemoteFilterCatalogQuery、verified cache 与同源 bootstrap，不引入 Mock/asset 旁路。
  data_and_ops:
  - 新增 qwq-data filter-catalog publish：从 canonical binding 与 metadata 解析环境导入，执行稳定 Idempotency-Key 的 Stage/Activate/Rollback，并用 public GET 复核 releaseId、digest 和成员计数。
  - 新增 stackctl filter-catalog：beta/gamma 使用本地最小 service principal；prod 仅接受受控 token，激活必须显式声明 prod gray approval。
  - stackctl integration/release verify 自动追加只读 active catalog 验证；不在巡检中隐式改变目录状态。
  - 新增目录指标告警和 L2 dashboard 的读面/发布面可观测面板。
