    summary: |
      删除生产最少等待 6 秒；Flutter 首帧全开终态稳定后立即播放约 1480ms 的
      全开、逆序聚拢、顺时针逐瓣绽放。正常一轮 ready 即进入，3 秒为 Shell 首帧
      目标，6 秒仅为从进程启动起算的硬退出上限。未 ready 最多重放两次并显示单行提示。
    reason: |
      旧启动把初始化与欢迎动效串行；第一轮纠偏又错误地用正视平面图形的 rotateX
      透视模拟开合，造成花瓣单轴压扁和对称组脉冲。最终规格恢复远端认可版本的
      等比径向生长与顺时针逐瓣开放，同时保留单控制器、3/6 秒和 terminal latch。
