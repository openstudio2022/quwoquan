    notes:
      - 生产正常路径不得等待满 6 秒；6 秒只作为硬退出上限。
      - debug 的本地 HTTPS 信任安装与认证、业务数据一样只做首帧后 best-effort，不得阻断安全 Shell readiness。
      - iOS 原生背景使用 1x3/2x6/3x9 可拉伸渐变纹理；禁止恢复固定 393x852 全屏启动快照。
      - Android 12+ 系统 SplashScreen API 使用同源静态花瓣 icon；透明 icon 会造成可复现的纯蓝空屏，禁止恢复。
      - 设备/Web 探针必须等到 welcome_overlay_removed，并用 overlayRemovedMs 证明 Flutter 欢迎层在 6 秒内实际移除；只看到 Shell 首帧不算通过。
      - 当前视觉唯一有效版本为 motionSpecVersion=petal_bloom_v2；旧 rotateX/petal hinge Golden、录像和时长报告全部失效。
      - 本轮 flutter build ios --simulator --debug、flutter build apk --profile 与最终 Flutter 定向复跑均被并行聊天契约改动阻断：chat_message_card_dto.g.dart 缺失、ChatMessageCardCommand? 空安全校验未收口，且聊天气泡引用了当前不存在的 AppSpacing.mediumBorderRadius；失败发生在启动代码执行前的 kernel 编译阶段，不得记为启动验证失败或成功。
      - 当前 flutter devices 只有 iPhone 15 simulator、macOS 与 Chrome，没有 Android/iPhone 真机；真机录像和 20 次 UAT 仍为准出阻断。
      - api_integration 不适用；主要证据为 local_contract 与 release user_acceptance。
      - CR 在 Android/iPhone 真机各 20 次 UAT 完成前保持 planned，不以模拟器或 build 代替。
