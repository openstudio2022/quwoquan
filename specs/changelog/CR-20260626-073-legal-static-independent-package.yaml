  - timestamp: "2026-06-26T14:30:00+08:00"
    summary: |
      新增 `quwoquan_service/services/legal-static` 法律协议源目录和 `legal-static` 独立静态资源发布单元，首版包含用户协议、隐私政策、权限说明、第三方 SDK 清单。
      `stackctl package --env <env> --kind legal-static` 与 `stackctl verify --env <env> --kind legal-static` 独立于 App、service、内容页和数据工程包运行；发布包生成 manifest、checksums、release metadata 与 `current` 指针。
      App 增加 `APP_LEGAL_BASE_URL`，保留单文档 URL override；关于页新增用户协议/隐私政策入口；user-service 继续只保存 consent version，不承载正文。
    reason: |
      法律正文需要可独立上架、独立回滚、独立 CDN/gateway 挂载，不能跟内容页或业务领域服务代码绑定。
      当前首发免费社区版本不包含付费、会员、广告、电商、退款/发票、自动续费等商业条款，因此需登记正式 backlog，在未来商业化能力上线前强制触发补充条款。
    change_type:
