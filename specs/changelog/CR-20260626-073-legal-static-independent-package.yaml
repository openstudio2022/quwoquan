  - timestamp: "2026-06-26T23:45:00+08:00"
    summary: |
      补齐 `flutter run` / alpha mock public plane 的 `/legal/*` 静态资源挂载，启动 alpha mock 栈前先构建 `legal-static` alpha 包，并对 `/legal/user-agreement` 做健康探测。
      dev-up、start_app_instance、plain Android flutter run 与 app env dart-defines 统一注入 `APP_LEGAL_BASE_URL`，避免 gateway override 与 legal base 分叉；真实 prod 继续使用 `https://quwoquan.com/legal` canonical。
      `LegalDocumentPage` 增加 HTTP 预检、WebView HTTP/资源错误兜底、原生错误态、重试/返回动作和脱敏 journey 事件，协议不可达不再展示 mock/raw HTTP HTML，也不阻断登录流程。
    reason: |
      点击登录页用户协议/隐私政策时，alpha mock gateway 未挂载 `/legal/*`，导致 WebView 渲染 `api mock route is not ready` 的 404 HTML。该错误属于法律协议静态资源可达性断点，应在环境路由与 App 页面错误语义两端同时收口。
