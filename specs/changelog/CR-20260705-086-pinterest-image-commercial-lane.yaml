id: CR-20260705-086-pinterest-image-commercial-lane
title: Pinterest 图片作品商用 lane 与 local runtime 收敛
date: 2026-07-05
area: Data
domain: content-supply
type: additive
summary: >
  将 Pinterest 从 discovery-only 受控试跑口径升级为 image-only 正式商业验证 lane：新增
  attribution_no_watermark 权利模型、公开图归因 ingest、单源图片作品 provenance 字段和唯一执行分支守卫，
  同时把 local runtime / fanout 的执行分支与环境证据落到可审计路径。
motivation:
  - 三周内多次放量尝试被 discovery-only 权利口径、shell 级全局 kill、日志猜完成与多分支并发叠债阻断。
  - H100/H1000 的真实性要求必须先拿到单一执行分支、真实下载、真实 author、真实 release 和真实 TokenLedger/throughput 证据。
changes:
  - content_source_registry 为 Pinterest 增加 attribution_manifest + attribution_no_watermark，并把图片 lane prompt 改成单源归因发布口径。
  - travel/photography rights policy 增加 attribution_no_watermark 许可种类、授权 basis 与必须证据字段。
  - travel/photography site registry 为 Pinterest 增加 attributionPublish 配置，开放 attribution_publish_ingest 正式 admission mode。
  - site_supply authorized_assets 增加 ingest-attributed-assets / build_attributed_asset_ingest_report，复用同一 image work funnel 生成真实本地字节与 content_plan handoff。
  - site_supply 新增 harvest-pinterest-pins，把公开 pin URL 解析成带 `pinUrl/sourceUrl/originalAssetUrl/sourceAuthor/repostAttribution/watermarkScan/ocrScan/localPath` 的归因 manifest，并固化到本地字节与扫描报告。
  - task target selection / managed run / fanout runner 增加 workflowPolicy.executionBranch 守卫与 env_ready/run_matrix 分支证据。
policy:
  - Pinterest 只允许通过 attribution manifest 进入发布候选；不得把 controlled trial、raw crawl 或平台正文抓取伪装成真实发布链。
  - 单个图片作品只能消费一个 sourceCollectionId，不得跨 pin、跨作者、跨来源拼接。
  - local runtime 的完成判定必须来自 workflow state / audit / downstream evidence，禁止 shell grep WORKFLOW COMPLETE 作为唯一完成信号。
evidence:
  local_contract:
    - quwoquan_data/.venv/bin/python -m py_compile quwoquan_data/scripts/_common/execution_branch.py quwoquan_data/scripts/site_supply/authorized_assets.py quwoquan_data/scripts/site_supply/core.py quwoquan_data/scripts/vertical/license.py
    - quwoquan_data/.venv/bin/python -m py_compile quwoquan_data/scripts/site_supply/pinterest_public_pin.py quwoquan_data/scripts/site_supply/cli_handlers.py
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/common/test_image_provider_compliance__local_contract_test.py quwoquan_data/tests/local_contract/vertical/test_image_rights_asset_level__local_contract_test.py quwoquan_data/tests/local_contract/vertical/test_travel_source_registry__local_contract_test.py -q
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/site_supply/test_tuchong_authorized_assets__local_contract_test.py -q
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/site_supply/test_pinterest_public_pin__local_contract_test.py -q
  api_integration:
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/verify/test_site_scale_readiness__local_contract_test.py -q
  runtime_e2e:
    - 待本轮 H100/H1000 真跑后回填 task_workflow_state.json、trial_review.json、managed_batch_audit.json、site_rollup_report.json 与 downstream_e2e 报告。
rollout:
  h100:
    target: 100 Pinterest 单源图片作品
    gate: 单一执行分支、真实下载、真实 author/review/materialize、真实 release/import/search/reco、TokenLedger/firstPassRate 全部具备
  h1000:
    target: 1000 Pinterest 单源图片作品
    gate: H100 全绿后切 reliabletask，并证明零跨任务清理、零全局 kill、零假完成与实测 throughput
  evaluate_only:
    target: 1万/日 与 10万/日外推
    gate: 只依据 H1000 实测 throughput / unitPassedCost / sourceReadyCapacity，不提前承诺
risks:
  - Pinterest 公开 pin 与原图链接稳定性、来源作者字段质量和原图可下载率可能波动；必须在批次级审计中保留 rejectedAssets 与 provenance 证据。
  - source_catalog 仍把 Pinterest 视为 editorial_reference_only coverage 类别，发布资格必须继续由 content_source_registry / rights policy 单独裁决，避免类别与权利混淆。
