id: CR-20260721-134-circle-group-chat-binding-sync
title: CircleGroup 与 Chat Conversation 的可靠绑定及成员同步闭环
slug: circle-group-chat-binding-sync
revision: 1
status: in_progress
affected_nodes:
  - specs/feature-tree/circle-community/circle-collaboration-tools
  - specs/feature-tree/circle-community/circle-collaboration-tools/circle-group-chat-binding-sync
  - specs/feature-tree/chat-conversation/group-creation-member-management
entries:
  - timestamp: "2026-07-21T04:30:00+08:00"
    summary: |
      纠正 CircleGroupMembership 已声明 chat-conversation-membership-projector、但 chat-service
      没有消费者的 P0 断链。冻结 CircleGroupCreated/Archived 与 CircleGroupMembership 生命周期
      通过 Redis Stream + consumer group 投影 Chat 名册，Chat 以
      CircleGroupConversationProvisioned durable event 回写 CircleGroup.conversationId 的单一
      双向绑定模型；同时禁止 Chat HTTP 直接写圈群成员/角色/生命周期。
    reason: |
      现有实现会让 CircleGroup 的成员、角色、归档与 Chat Conversation 永久漂移，导致已加入
      无法聊天、离群后仍留 Inbox、Chat 群主可越权修改 CircleGroup 成员，以及无唯一
      conversationId 绑定。该状态不具备商用条件。
    decisions:
      - CircleGroup 是群单元、成员、角色与归档的唯一写模型；Conversation 只负责消息。
      - 不使用同步 RPC、前端拼装、Circle.conversationId fallback、双读/双写或兼容分支。
      - Stream source event 必须持久化成功后才 ACK；pending reclaim、source-event 幂等、TTL DLQ、健康检查和告警为上线前置条件。
      - CircleGroup 与 Chat 一致限制为 1000 active human members；容量在 Circle membership 事务上游拒绝。
      - circleGroupId 非空的 Chat 会话拒绝普通 Chat 成员和治理写命令，返回 metadata 生成的结构化错误。
    change_type:
      - specification
      - metadata
      - implementation
      - local_contract
      - api_integration
      - user_acceptance
      - reliability
      - observability
      - security
    tests:
      - layer: local_contract
        intent: contract
        evidence:
          - quwoquan_service/services/chat-service/internal/adapters/mq/circle_group_chat_consumer__local_contract_test.go
          - quwoquan_service/services/circle-service/internal/adapters/mq/circle_group_conversation_binding_consumer__local_contract_test.go
      - layer: api_integration
        intent: SIT
        evidence:
          - quwoquan_service/services/chat-service/tests/api_integration/circle_group_chat_binding__api_integration_test.go
          - quwoquan_service/services/circle-service/tests/api_integration/circle_group_chat_binding__api_integration_test.go
      - layer: user_acceptance
        intent: UAT
        evidence:
          - quwoquan_app/test/user_acceptance/chat_conversation/circle_group_chat_binding__user_acceptance_test.dart
    rollout:
      stages: [alpha, beta, gamma, prod]
      rollback:
        - 仅允许整版部署回退；保留 outbox、stream、checkpoint 和 idempotency 记录，恢复后续跑。
        - 任何 DLQ、超过 30 秒 pending 或绑定/名册偏差均阻断环境晋级，不回退到旧兼容路径。
    notes: |
      状态保持 in_progress，直到实现、三层测试、指标/告警和四环境真实证据全部取得。当前
      元数据/规格冻结不是商用准出证据。
