  - specs/feature-tree/discovery-content/content-type-framework/review-content-type   # 已删除（never-implemented，仅 C1 契约）
  - specs/feature-tree/discovery-content/content-type-framework/unified-presentation-model
  - quwoquan_service/contracts/metadata/_shared/types.yaml
  - quwoquan_service/contracts/metadata/content/post/fields.yaml
  - quwoquan_service/contracts/metadata/content/post/service.yaml
  - quwoquan_service/contracts/metadata/content/post/errors.yaml
