  - quwoquan_app/lib/core/models/media_viewer_extra.dart
  - quwoquan_app/lib/ui/content

entries:
  - timestamp: "2026-06-29T01:30:00+08:00"
    summary: |
      按用户冻结口径「当前内容类型只有图片(image)/视频(video)/文章(article)三类」，彻底清除 review（口碑）
      内容类型：从 _shared/types.yaml 的 ContentType 枚举移除 review；从 content/post 移除 rating、reviewAspects
      字段族、CreatePost/UpdatePost/PromotePostToWork 三处 writable_fields、3 个 review 错误码
      （review_rating_required/review_poi_required/review_duplicate_per_poi）与 2 个 review 部分唯一索引
      （idx_posts_review_author_poi/idx_posts_review_poi）；删除 review_aspect 投影及其 codegen 产物
      review_aspect.g.dart；手写 content_error_code_ext.dart 同步移除三处 review 错误码分支；
      registry_test.go 的 ContentType 枚举断言移除 review。注意 micro（微趣）属类型轴、moment 属身份轴，
      均保留不动；review 仅作为「曾在 C1 落契约、从未实现业务/读模型/端侧」的未上线内容类型被撤销。
    reason: |
      CR-20260530-023 方案 A 把口碑作为 ContentType.review 落了 C1 契约，但业务逻辑/POI 聚合读模型/端侧 mapper
      从未实现，端侧对 review 静默按图片帖渲染，形成「真相源有定义、端侧无实现」的概念漂移与隐性技术债。
      用户明确当前只有图片/视频/文章三类，按「未上线零兼容、零技术债容忍」原则撤销 review 契约与未实现规划节点，
      使 ContentType 真相源与端侧实现一致。creation-tagging-ia（创作打标 IA）与 publish/tags tagRef 真相源是
      独立且仍生效的能力，不在本次撤销范围。
    change_type:
      - metadata
      - content_service
      - architecture
      - acceptance
    changed_documents:
      - path: quwoquan_service/contracts/metadata/_shared/types.yaml
        sections:
          - "enums.ContentType（移除 review，收敛为 [image, video, micro, article]）"
      - path: quwoquan_service/contracts/metadata/content/post/fields.yaml
        sections:
          - "移除 Post.rating"
          - "移除 Post.reviewAspects"
      - path: quwoquan_service/contracts/metadata/content/post/service.yaml
        sections:
          - "CreatePost.writable_fields 移除 rating/reviewAspects"
          - "UpdatePost.writable_fields 移除 rating/reviewAspects"
          - "PromotePostToWork.writable_fields 移除 rating/reviewAspects"
      - path: quwoquan_service/contracts/metadata/content/post/errors.yaml
        sections:
          - "移除 CONTENT.USER.review_rating_required"
          - "移除 CONTENT.USER.review_poi_required"
          - "移除 CONTENT.USER.review_duplicate_per_poi"
      - path: quwoquan_service/contracts/metadata/content/post/storage.yaml
        sections:
          - "移除 posts.idx_posts_review_author_poi"
          - "移除 posts.idx_posts_review_poi"
      - path: quwoquan_service/contracts/metadata/content/post/projections/review_aspect.yaml
        sections:
          - "删除该投影（review 维度读模型）"
      - path: quwoquan_app/lib/cloud/runtime/generated/content/review_aspect.g.dart
        sections:
          - "删除 codegen 产物"
      - path: quwoquan_app/lib/cloud/content/generated/content_error_code_ext.dart
        sections:
          - "移除 reviewRatingRequired/reviewPoiRequired/reviewDuplicatePerPoi 错误码映射分支"
      - path: quwoquan_service/runtime/registry/registry_test.go
        sections:
          - "ContentType GetEnum 断言移除 review"
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - api_integration
      rollout_impact: low
      breaking_contract: true
    test_evidence:
      recorded:
        - "cd quwoquan_service && make verify-metadata（绿）"
        - "make codegen + make codegen-app（重生成，review_aspect.g.dart 移除）"
        - "go test ./services/content-service/... -count=1（api_integration + local_contract 全量绿）"
        - "go test ./runtime/registry/... -count=1（ContentType GetEnum 断言绿）"
        - "flutter analyze（无本次新增错误；UnifiedObjectKind.trip 为脏树预存在）"
        - "Dart content 契约 88 测试绿"
        - "make verify-article-contract-purity（OK）"
        - "make verify-app-mock-isolation（OK）"
        - "dart tools/runtime_error_codegen/bin/check_runtime_error_cutover.dart：content/review 侧零问题（仅 connection_repository.dart 预存在失败，属 R-PLAZA-001）"
    notes:
      - "破坏性契约：ContentType 枚举与 Post 字段减项，但 review 从未上线、无生产数据，按未上线处理无需迁移。"
      - "creation-tagging-ia（B3）与 tagRef publish/tags 真相源（C2）不在撤销范围，仍生效。"
      - "feature-tree review-content-type 节点（spec.md + acceptance.yaml，never-implemented）已删除并同步 tree_index；unified-presentation-model 与 content-unification-admission-gate-checklist 的 review 断言已中和。"
      - "残余叙述清理：creation-tagging-ia/spec.md 内将 review 作为可打标内容类型示例的措辞已轻量去除，打标 IA 本体不变。"

  - timestamp: "2026-06-29T01:35:00+08:00"
    summary: |
      统一 image↔photo 命名：photo_post.yaml 的 displayFormat default 由 'photo' 改 'image'；discovery_feed.yaml
      的 displayFormat computed getter 移除 `|| type == 'photo'` 旧分支；mock/seed 数据
      （content_repository_mock_posts.dart、user_profile_mock_data.dart、user_profile_contract_seed_helpers.dart、
      search_network_results_page_state.dart）的 'photo' 一律改 'image'。content_type_constants.dart 移除
      audio/vertical/horizontal/square/author/circle/official/singleMode/gridMode 等零引用死常量，仅保留
      image/video/micro/article，唯一消费点改用 codegen 常量。
    reason: |
      端云对内容类型字符串存在 photo/image 双轨与一批零引用死常量，造成「微趣被错配图片卡」等隐性错配风险与
      第二真相源。统一为 image 并删死常量，使端云内容类型字符串单一一致。
    change_type:
      - metadata
      - fix
    changed_documents:
      - path: quwoquan_service/contracts/metadata/content/post/projections/photo_post.yaml
        sections:
          - "displayFormat default 'photo' → 'image'"
      - path: quwoquan_service/contracts/metadata/content/post/projections/discovery_feed.yaml
        sections:
          - "displayFormat computed getter 移除 || type == 'photo'"
      - path: quwoquan_app/lib/core/constants/content_type_constants.dart
        sections:
          - "移除零引用死常量，收敛为 image/video/micro/article"
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
      rollout_impact: low
      breaking_contract: false
    notes:
      - "纯命名收敛 + 死常量清理，行为等价；image 路径既有渲染零变化。"

  - timestamp: "2026-06-29T01:40:00+08:00"
    summary: |
      拆 MediaViewerExtra.category 混轴：删除 category 字段（其混淆了内容类型轴与展示来源）；
      unified_media_viewer_page.dart 的 _resolveContentType/_resolveContentTypeFromDto 改为直接由
      contentType/DTO 解析，不再依赖 category；各 MediaViewerExtra 构造点（discovery_page.dart、
      profile_works_tab.dart 等）移除 category 入参。content 客户端目录标准化（不触 pageflip）：
      删空目录 markdown/pages；评论 providers 收敛到 comments/providers/（更新 7 处引用，删空
      content/providers/）；根 article 模型 document_models+projection+theme 迁入 content/models/
      （更新 ~29 处引用，pageflip 全套回归通过）。
    reason: |
      category 是身份/类型/来源混轴字段，违反单轴单字段；content 域根散落评论 providers 与 article 模型，
      违反 lib/ui/{domain}/{pages|providers|widgets|models} 结构约束。按概念统一与目录标准化收敛。
    change_type:
      - architecture
      - fix
    changed_documents:
      - path: quwoquan_app/lib/core/models/media_viewer_extra.dart
        sections:
          - "移除 category 字段"
      - path: quwoquan_app/lib/ui/content/comments/providers
        sections:
          - "comment_provider* 从 content/providers/ 迁入"
      - path: quwoquan_app/lib/ui/content/models
        sections:
          - "article_document_models/_projection/article_theme 从 content/ 根迁入"
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - user_acceptance
      rollout_impact: low
      breaking_contract: false
    notes:
      - "纯文件搬迁 + 引用更新，无契约变更；article_presentation_models（实为 pageflip 诊断）随 pageflip 专项搬迁，本轮不动。"
      - "pageflip 三层架构倒置（components/pageflip 依赖 ui/content/pageflip 且仅 test 消费）登记为高风险 backlog 专项，按用户口径最后搬迁。"
