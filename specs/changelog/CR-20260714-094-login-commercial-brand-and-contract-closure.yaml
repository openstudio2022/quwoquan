entries:
  - timestamp: "2026-07-14T00:00:00+08:00"
    summary: |
      登录返回态移除昵称首字头像，改为真实头像优先和中性用户轮廓；主按钮统一为
      “短信验证码登录”，其他方式可见名精简为微信、QQ、支付宝、其他手机号，同时保留
      完整无障碍动作。欢迎页共享花瓣 Painter 增加两层花蕊，并以同一真相源重生
      Android、iOS、Web maskable 图标和 favicon，增加视觉基线、哈希和最小尺寸校验。

      metadata-first 为 SendOtp、手机号、微信、QQ、支付宝、一键登录及 hint 补齐
      commercial、authorization、安全、隐私、可靠性、遥测、错误码与 SLO；App
      ContractGraph breaking delta 通过正式 handoff 明确批准。新增登录 L2 大盘、连续两个
      5 分钟窗口告警、sys.user.auth 采样/保留配置和登录明细 30 天 TTL。
    reason: |
      旧返回头像从“欢迎回来”截取“欢”字，其他方式重复“登录”，平台图标仍可能漂移到
      Flutter 默认资产；同时登录操作的商业、安全、隐私与 SLO 声明不完整，缺少可执行的
      provider 健康度告警和登录明细保留策略。上述缺口会妨碍品牌一致性、无障碍和商业
      准入审计。
