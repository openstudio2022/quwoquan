entries:
  - timestamp: "2026-07-01T10:00:00+08:00"
    summary: |
      工作包 A：冻结交集 v3「可行动交集实例」商用化基线。把交集从「解释为什么推荐」升级为
      「把内容消费与出行意图转化为可证、安全、可沉淀的同趣关系」，确立唯一产品主轴
      「别人帮你刷内容，我们帮你遇到对的人」，锁定商用滩头「旅行+摄影 同趣搭子」，冻结竞品差异化
      矩阵、安全护城河、北极星（可行动交集完成/关系形成，非 DAU）、商业模式假设与冷启动集中度、
      用户价值阶梯与留存环、v3 七触点 IA，以及差异化必做切片 C0「共同想去→约伴」的边界。
      本轮仅冻结规格/术语/验收/CR，不进入 C0–F 代码实现。
    reason: |
      v2 已把交集统一为三层架构 + 四槽视觉 + 单通道文案，但只交付「解释 + 轻行动」尚不足以成为
      能换 App 的产品楔子。CEO/投资人与用户双视角要求：明确差异化（内容平台停在消费、OTA 停在下单，
      兴趣→真实关系是品类空白）、明确北极星（关系形成而非刷时长）、明确一个真实可跑的差异化闭环
      （共同想去→约伴），并把主轴叙事写入唯一真相源，避免各触点/融资材料自造第二版口径。
    change_type:
      - planning
      - product
      - acceptance
      - governance
    changed_documents:
      - path: specs/00_GLOBAL_TERMINOLOGY.md
        sections:
          - "§3 新增「产品主轴」= 别人帮你刷内容，我们帮你遇到对的人（唯一叙事真相源，与品牌情绪 slogan 遇见同趣绽放热爱同源不冲突）"
      - path: specs/product/intersection-definition-and-application.md
        sections:
          - "§24 交集 v3 可行动交集实例基线（主轴/双主打点/IntersectionInstance 八要素/用户语言/滩头/竞品矩阵/安全护城河/北极星+商业模式+冷启动/价值阶梯+留存环/七触点 IA/C0 边界/deferred 诚实边界/与 §21-23 关系/分期）"
      - path: specs/product/intersection-action-deepening-and-social-ia.md
        sections:
          - "§0 口径更新补 v3 产品主轴、商用滩头、C0 共同想去→约伴与安全边界"
      - path: specs/feature-tree/object-homepage-network/intersection-unified-experience/spec.md
        sections:
          - "v3 可行动交集基线：主轴对齐 + 七触点统一矩阵 + C0 切片 + 验收指向"
      - path: specs/feature-tree/object-homepage-network/intersection-unified-experience/acceptance.yaml
        sections:
          - "sit_acceptance.SIT5 v3 可行动交集与商用主轴（主轴不变量/七触点/C0/deferred 诚实/北极星漏斗）"
      - path: specs/feature-tree/journey_scenario_registry.yaml
        sections:
          - "intersection-action-to-companionship boundary_notes 补 2026-07-01 v3 商用化基线与 C0 边界"
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
      rollout_impact: low
      breaking_contract: false
    notes:
      - "主轴单一真相源：slogan 登记于 00_GLOBAL_TERMINOLOGY.md §3，完整叙事 + 投资/用户双主打点在 intersection-definition-and-application.md §24；禁止各 spec/UI/融资材料另写第二版主轴。"
      - "契约不新增真相源：IntersectionInstance 复用 IntersectionReason/IntersectionPoint/IntersectionActionHint/AuthorImpactItem/circle_impact_item；仅现有投影无法表达时才 metadata-first 扩字段（§23、R24）。"
      - "C0 边界：仅开放 start_companion 一个新重行动，基于已有 coWishlistedEntity + 关注 + 交集证据，不依赖新 LBS/实时；附近/实时/线下局 aggregate 仍 deferred；无稳定 wishlist 数据源或无真实承接页则 GATE_BLOCK 如实上报，禁伪造候选/伪成行。"
      - "后续工作包 UAT 继承（v3 用户旅程，落地后回填 acceptance 证据）：UAT-1 视频书底部交集解释可发现并可进对象；UAT-2 内容卡到实体/人主页闭环；UAT-3 圈子你认识的人在这→加入/讨论；UAT-4 我的同趣机会收件箱→下钻行动→清零；UAT-5 影响力/传播回流可见；UAT-6 安全边界（未实名/青少年/被拉黑重行动拦截、模糊位置、双向同意）；UAT-7 推荐/兴趣配对差异化（可证交集优先、负反馈/冷却生效）；UAT-8 deferred 诚实边界（附近/实时/线下局不进正式可执行 UI、launcher 不伪候选）；UAT-9 同趣搭子 C0 共同想去→约伴最薄闭环。"
      - "验收意图：工作包 A 为 SIT/contract（文档一致性 + acceptance schema/路径存在性）；C0–F 继承 local_contract/api_integration/user_acceptance，逐包下发。"
      - "遗留与风险：v3 商用闭环（C0 约伴真实承接、附近/实时/线下局 aggregate、深排平台、PremiumPoolSource 生产、prod 发布）仍属长期 deferred，如需正式登记需用户确认后写入 docs/outstanding_risks_backlog.md。"

  - timestamp: "2026-07-01T15:30:00+08:00"
    summary: |
      交集 v3 概念收敛：把用户需要理解的名词收敛为「交集 + 打动」两维度。发现/配对入口前台统一
      「交集配对」（旧兴趣配对/找同趣/同趣退场），交集收件箱统一「今日交集/我的交集」（旧今日同趣机会退场），
      辐射他人前台统一「打动」（替代影响/影响力）。机器标识 interest_match/impact/intersection 全程不变。
    reason: |
      用户反馈「今日同趣机会」难理解、并列名词过多（交集/同趣/兴趣配对/影响）违背降低认知负荷。
      收敛到「交集（找到对的人的依据/入口）+ 打动（你被多少人认可）」两维度，与主轴「遇到对的人」一致；
      「影响」偏专业改「打动」更有温度（「感染」因疾病联想弃用）。
    change_type:
      - planning
      - product
      - governance
    changed_documents:
      - path: specs/00_GLOBAL_TERMINOLOGY.md
        sections:
          - "§3 交集配对入口 + 收敛使用规则；§18.1 影响→打动；新增 §18.7 交集 v3 概念收敛（前台词收敛表 + 迁移字典 + 门禁落地边界）"
      - path: specs/product/intersection-definition-and-application.md
        sections:
