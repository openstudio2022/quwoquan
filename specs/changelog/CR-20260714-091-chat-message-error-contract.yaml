id: CR-20260714-091-chat-message-error-contract
title: 聊天消息发送与撤回稳定错误契约
slug: chat-message-error-contract
revision: 1
status: implemented

affected_nodes:
  - specs/feature-tree/chat-conversation
  - specs/feature-tree/chat-conversation/list-detail-message-delivery

entries:
  - timestamp: "2026-07-14T00:00:00+08:00"
    summary: |
      为 SendMessage 和 RecallMessage 明确声明 RuntimeErrorResponse 可消费的稳定错误码。
      撤回目标不存在、跨会话、非发送者和超过撤回窗口不再以裸错误冒泡为 HTTP 500；
      发送关系门禁的 unauthorized、too_long、not_mutual、blocked 也进入同一 metadata
      契约，使 App、服务、观测和 Gamma API 测试从 ContractGraph 同源生成。
    reason: |
      Gamma 端云探针曾在 RecallMessage 路径收到 500，且 ContractGraph 中这两个 App
      暴露操作没有错误码清单。没有稳定错误码时，端侧无法给出可恢复提示，运行问题也无法
      被按错误类型观察和验证。
    changed_documents:
      - path: quwoquan_service/contracts/metadata/messages/conversation/errors.yaml
        sections:
          - CHAT.USER.message_not_found
          - CHAT.USER.message_recall_forbidden
          - CHAT.USER.message_recall_expired
      - path: quwoquan_service/contracts/metadata/messages/conversation/service.yaml
        sections:
          - SendMessage
          - RecallMessage
      - path: quwoquan_service/services/chat-service/internal/application/message_service.go
        sections:
          - RecallMessage RuntimeError mapping
      - path: quwoquan_service/services/chat-service/internal/infrastructure/persistence/mongo_conversation_store.go
        sections:
          - FindMessageByID not-found mapping
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - api_integration
        - user_acceptance
      rollout_impact: medium
      breaking_contract: true
    approval:
      decision: approved
      rationale: |
        Adding explicit error-code sets makes failure behavior stricter and observable. The route,
        request, response success shape, auth mode and actor contract are unchanged. ContractGraph
        handoff must record this approved breaking delta before App code generation.
    verification:
      planned:
        - cd quwoquan_service && make codegen-contract-graph codegen-chat-service codegen-app verify-metadata
        - cd quwoquan_service && go test ./services/chat-service/internal/application ./services/chat-service/internal/adapters/http -count=1
        - python3 quwoquan_app/scripts/gamma/run_local_gamma_t3.py --strict-all
