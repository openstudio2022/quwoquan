id: CR-20260718-119
title: 登录与内联错误体验统一
date: 2026-07-18
status: in_progress
journey: identity-entry-and-continuation
scenario: identity-entry-persona-continuation
feature_path:
  l1: user-identity-profile-relationship
  l2: onboarding-and-identity-entry
  l3: two-state-one-tap-login--commercial-login-entry
affected_nodes:
  - runtime/runtime-client-foundation/error-permission-display-semantics
  - user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login--commercial-login-entry
change:
  summary: >-
    将字段、表单、操作与服务状态的非阻断错误收敛到共享透明内联错误行；
    登录页不再维护灰色/琥珀色卡片或私有语气分支，并修复运营商 hint 错误吞没。
  public_contracts:
    - USER.AUTH 的稳定 code、HTTP 状态和 recovery/disruption 不变；仅更新安全 user_message。
    - AppInlineFieldError 与 AppFormErrorCard 复用同一错误视觉 token。
  api_compatibility: HTTP 和 wire shape 不变。
acceptance:
  - 输入错误才标红输入框；发送、网络、限流、provider 与服务不可用错误不标红输入框。
  - 登录错误只在对应的唯一操作锚点呈现，编辑、重试或成功后清除且不抢焦点。
  - ResolveOneTapLoginHint 的受限账号错误进入结构化阻断面，不静默降级或创建账号。
  - 共享内联错误在浅深色、窄屏和动态字体下保持可读，无胶囊、色块、卡片或阴影。
verification:
  planned:
    - make verify-metadata
    - make codegen
    - make codegen-app
    - dart quwoquan_ops/tools/runtime_error_codegen/bin/check_runtime_error_cutover.dart
    - cd quwoquan_app && flutter test test/local_contract/core/widgets/error_states/app_error_states__local_contract_test.dart test/local_contract/ui/user/login_page_widget__local_contract_test.dart
    - cd quwoquan_service && go test ./services/user-service/tests/api_integration -run TestAuth -count=1
    - make verify-app-login-entry-loop-contract
    - make verify-app-page-horizontal-quality
    - bash quwoquan_ops/gate/gate_repo.sh --scope app
risks:
  - id: R-AUTH-001
    status: open
    note: 正式 provider 凭据、受控 SDK 与真实设备 UAT 尚未闭合；本 CR 不改变商业登录发布准入。
