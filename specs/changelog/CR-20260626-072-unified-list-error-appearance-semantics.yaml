entries:
  - timestamp: "2026-06-26T10:30:00+08:00"
    summary: |
      新增列表页语义 multiOptionList / singleList，并在 App 侧落地 AppSegmentedChoiceBar、AppListPageScaffold、AppListSurface、AppListRowCard。
      ProfileStatsPage、MyIntersectionInboxPage、ObjectIntersectionListPage 统一背景、一级选项、列表 surface、空/错态语义；一级多选项使用 tap-only 分段控，不通过左右滑动切换 tab。
      workBrowser 路由新增 sourceTheme 查询参数，WorkBrowserEntryPage 在首屏直拉失败时按来源 light/dark 局部渲染错误页，成功进入 viewer 仍保留沉浸式外观。
    reason: |
      图一/图三暴露出列表页分段控和列表 surface 漂移；图二暴露出内容不存在错误页继承沉浸式深色上下文，导致从浅色来源进入时低对比且不友好。
      若继续按截图页面私有分支修补，会形成第二套列表语义和错误外观语义，因此本轮收口到 runtime-client-foundation 的共享组件与错误语义。
