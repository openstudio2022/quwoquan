id: CR-20260615-037-search-dedicated-es-service-landing
title: 搜索商用端云一体：独立可部署 search-service + 专用 ES/OpenSearch 集群落地
slug: search-dedicated-es-service-landing
revision: 1
status: specified

affected_nodes:
  - specs/feature-tree/global-search-experience
  - specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology
