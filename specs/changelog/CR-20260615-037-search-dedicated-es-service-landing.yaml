      rollout_impact: high
      breaking_contract: false
    notes:
      - canonical search(request) 接口与 object taxonomy 不变；ES 仅替换读侧实现，业务写模型不迁移。
      - 私有对象 chat.* 仍 local_only，绝不上云做跨用户召回。
      - 部署：alpha/beta/gamma/prod 声明专用搜索 ES 集群与 search-service 进程，beta=gamma=prod 拓扑逐字一致。
      - 服务目录经 /qwq-extend new-service 脚手架创建，禁止手动 mkdir。
      - runtime/search/es 真实 HTTP 客户端 + 装配（ES 主 + native 回退）已落地并单测通过（T1/T2）。
