entries:
  - timestamp: "2026-06-15T00:00:00+08:00"
    summary: |
      将统一搜索读库从“分域只读路由 + App 端聚合 + 本期不落地统一读库”改为：本期落地专用
      ES/OpenSearch 集群（索引 quwoquan_objects）作为派生搜索读库，并新建独立可部署
      search-service（domain=search）承载 canonical search(request) 的云侧统一入口
      POST /v1/search（mode=suggest|result）与 POST /v1/search/feedback，复用
      runtime/search.Retrieve 单趟跨类型排序；召回后端 ES 主 + native 透明回退
      （FallbackBackend），ES 故障整体降级 native 不阻塞主路径；各域
      （content/entity/circle/user/integration）经统一 indexer 灌入同一 ES 索引，
      原各域 /v1/.../search 只读路由收敛为 indexer 数据源/内部回退。
    reason: |
      旧冻结边界明确“本期不新增统一 /v1/search、不指定搜索引擎、统一读库不落地”，与
      L2 商用化三引擎阻断登记（要求共享搜索核心、相关性排序、统一 envelope、单一 canonical
      contract）相互矛盾，导致站内搜索长期停在 ListPublished/内存 strings.Contains 主路径、
      App 端跨域 fan-out 第二真相源。用户已决定采用专用 ES 集群 + 复用 runtime/search/es 库 +
      新建可部署 search-service。按“当前未上线、零历史兼容、单一真相源”收口为唯一架构。
    change_type:
      - refine
      - arch
      - contract
    changed_documents:
      - path: specs/feature-tree/global-search-experience/spec.md
        sections:
