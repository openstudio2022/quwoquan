id: CR-20260613-035-four-environment-commercial-login
title: 登录四环境商用化：外部依赖注入矩阵、gamma 受控放通与社交三方落地
slug: four-environment-commercial-login
revision: 2
status: specified

affected_nodes:
  - specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity
  - specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login--commercial-login-entry

entries:
  - timestamp: "2026-07-12T22:10:00+08:00"
    summary: |
      按当前发布范围移除 Apple/Passkey 的公开登录面：从 user metadata route、生成的 App API
      metadata、AuthRepository/RemoteAuthRepository 与 user-service HTTP handler 同步删除未实现登录；
      仅保留 NativeAuth 防腐层中的未来扩展枚举。local-gamma 与 prod gateway 均补齐
      /v1/auth*、/v1/owner* 到 user-service 的路由，并增加无副作用 OTP 空请求探针。
    reason: |
      Apple 与 Passkey 尚未进入本期支持范围；此前 Apple 公开端点直接将未校验 token 当作稳定凭证，
      会造成认证绕过风险，Passkey 则存在元数据与 handler 漂移。
      同时，认证与 owner 路由未进入 gamma/prod 网关会使 Remote 登录链路得到 Caddy 404。
    change_type:
      - security
      - contract
      - ops
    changed_documents:
      - path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/spec.md
        sections:
          - 功能说明
          - 范围
          - 不做什么（Out of Scope）
          - 验收标准
      - path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md
        sections:
          - Out of Scope
      - path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/acceptance.yaml
        sections:
          - scope
          - contract_acceptance
      - path: quwoquan_service/contracts/metadata/user/user_profile/service.yaml
        sections:
          - LoginWithApple / LoginWithPasskey removal
      - path: quwoquan_ops/environments/local-gamma/Caddyfile
        sections:
          - user-service gateway routes
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - api_integration
        - user_acceptance
      rollout_impact: high
      breaking_contract: true
    notes:
      - Apple/Passkey future implementation must begin with verified assertion metadata, server-side validation, native SDK UAT and a new approved CR; it must not restore the removed raw-token endpoint.
  - timestamp: "2026-06-13T18:05:00+08:00"
    summary: |
      将全部登录方式（手机号 OTP、运营商一键、微信/支付宝/QQ、匿名）收敛到统一"环境 × 外部依赖"注入矩阵：
      三类外部依赖（短信 OTP、运营商置换、社交 OAuth）建立防腐接口与 mock/sandbox/real 分环境注入；
      gamma 用 SandboxAllowlist 受控放通（沙箱号段/测试授权码），prod 严格无放通；新增 LoginWithAlipay/LoginWithQq
      与社交错误码并 codegen；user-service 实现 LoginWithSocialProvider 票据置换与首登资料同步；端侧补 loginAlipay/
      loginQq、NativeAuthBridge sandbox 注入、LoginPage 三方登录无死循环与 gamma 调试码受控回填。
    reason: |
      原 two-state 登录 Story 将社交 SDK 列为 Out of Scope，且 gamma 配置为完全严格、社交后端仅打桩，无法满足
      "四环境可测、社交诚实完成、可商用发布"的目标。本 CR 在不引入第二套登录页/路由的前提下补齐社交与四环境矩阵，
      并以门禁强制生产纯净。
    change_type:
      - extend
      - governance
    changed_documents:
      - path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/spec.md
        sections:
          - 功能说明
          - 四环境 × 三类外部依赖矩阵（真相源）
          - 验收标准
      - path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity/acceptance.yaml
        sections:
          - scope
          - gwt_acceptance
          - contract_acceptance
          - execution
      - path: quwoquan_service/contracts/metadata/user/user_profile/service.yaml
        sections:
          - LoginWithAlipay
          - LoginWithQq
      - path: quwoquan_service/contracts/metadata/user/user_profile/errors.yaml
        sections:
          - social provider 错误码
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - T1
        - T2
        - T3
        - T4
      rollout_impact: high
      breaking_contract: false
    notes:
      - gamma 受控放通登记 TECHDEBT-LOGIN-SANDBOX-ALLOWLIST-GAMMA-001，到期清理。
      - 支付宝/QQ prod 真实 OAuth 待凭证，登记 TECHDEBT-SOCIAL-PROD-OAUTH-ALIPAY-QQ-001；未配置时返回结构化 unavailable，绝不伪造成功。
      - 一键登录 prod 真实运营商 resolver 待接入；过渡期返回结构化不可用，杜绝 dev 解码后门进入生产。
