id: CR-20260629-079-content-directory-unification
title: content 客户端 UI 目录标准化归一（models 单一化 + reader→article_render 重命名 + 分层门禁固化，R-CONTENTDIR-001）
slug: content-directory-unification
revision: 1
status: implemented

affected_nodes:
  - specs/feature-tree/runtime/runtime-client-foundation
  - quwoquan_app/lib/ui/content/models
  - quwoquan_app/lib/ui/content/article_render
  - quwoquan_app/scripts/content/verify_content_ui_directory_boundaries.py

entries:
  - timestamp: "2026-06-29T08:30:00+08:00"
    summary: |
      收口 R-CONTENTDIR-001：content 域目录标准化归一。①models 单一化——`reader/models/article_detail_view.dart`
      与 `entry/models/*`（7 文件）全部上提 `lib/ui/content/models/`，删除 `entry/models/` 与 `reader/models/`
      子目录；对应测试迁至 `test/ui/content/models/` 与 `test/local_contract/ui/content/models/`。
      ②`reader/` → `article_render/` 重命名澄清（markdown codec/ast/pagination/parser + flow/pagination
      services 渲染引擎层）；`article_reader/`（翻页书本阅读宿主，含 pageflip 宿主子树）名称保持，受
      「冻结 pageflip 物理布局」红线约束本轮不重命名。③扩展边界门禁 [verify_content_ui_directory_boundaries.py]
      固化三不变量：唯一 models 根 / pageflip 引擎仅被 article_reader 与 test 消费 / article_render 不得
      依赖 article_reader；新增退役路径 `package:quwoquan_app/ui/content/reader/` 扫描。同步
      test_directory_inventory、test_legacy_source_allowlist、file_line_budget_allowlist 路径。
    reason: |
      01-arch-constraints §2.4 要求 `lib/ui/{domain}/pages|providers|widgets|models`。content 域内存在三类
      不归一：三个 models 目录（公共模型误置子域、域级 models 反向依赖 reader/models）；reader 与
      article_reader 命名混淆未表达 host→engine 分层；双 pageflip host→engine 分层未被门禁固化。按折中档
      + 冻结 pageflip 物理布局，先消除目录认知成本与层内倒置，以门禁防回退；两个 pageflip 物理合并在
      后续 R-PAGEFLIP-002 / CR-20260629-080 中按逐帧同构像素回归标准独立收口。
    change_type:
