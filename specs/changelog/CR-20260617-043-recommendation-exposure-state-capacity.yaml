    notes:
      - P0 已进入实现：新 Redis key（served/impressed day-bucket、negative 用户级）、recpolicy 采样/阈值/限流/容量预算、行为 wire schema（clientEventId/feedRequestId/state）已回到 metadata/codegen 后落 runtime/app/service。
      - runtime/recommendation 已引入 ExposureMemory/ExposureFilter/FeedbackIngestor，feed 过滤改候选 membership 点查，served write-behind 失败不阻断，HotPath/BufferedHotPath/SessionCache 透传能力边界。
      - App 端行为模型和 tracker 已透传 clientEventId/state/feedRequestId；真实 impressed 需要可见面积 + 停留阈值，未达阈值降级 visible；negative/interaction/dwell 显式七态。
      - content-service 行为入口已接 clientEventId 去重与七态写入；P0 emitter（七态计数、ingest/drop、hotpath drop、smembers fallback）由 objective_only 转 measured，P1/P2 无 emitter 告警保留前置标注。
      - 第一切片 P0 的 T1/T2 已登记到 acceptance recorded；T3 local-gamma 与 T4 重复曝光旅程仍需继续补证。
      - 动态曝光预算、生命周期复活、协同召回、模型容量和真集群容量仍按 P1/P2 Story 推进，不在 P0 里伪完成。
      - 深度排序模型平台轨（MMoE/PLE/ESMM、双塔 ANN、IPS）仍为长期上限，不计入当前商用成熟度门槛。
