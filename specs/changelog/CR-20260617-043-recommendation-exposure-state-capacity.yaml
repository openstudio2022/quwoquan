    summary: |
      承接 /plan-review（埋点 / 状态 / 存储 / 模型 / 容量 / 实时性）多角色评审：把推荐反馈状态
      从二元「已读/已曝光」升级为七态闭集（served/visible/impressed/dwell/interaction/negative/
      training_sample），冻结端侧统一上报抗冲击规格（新 L3 feedback-ingestion-sampling）、
      曝光记忆去全量化与运行时边界（ExposureMemory/ExposureFilter/FeedbackIngestor）、
      rec-model-service 商用并发容量（新 L3 inference-capacity-elasticity），并把状态分离 /
      ingest/drop / 容量 SLI 命名与死告警 emitter 前置写入 SLO 与告警真相源。
    reason: |
      plan-review 给出 GATE_BLOCK：状态未分离、记忆全量化（engine 每次 feed 全量 SMembers）、
      上报双通道无幂等、商用成熟度指标全 objective_only 且 5 条运营告警为死告警，直接威胁并发、
      容量与实时性。需先冻结状态闭集、去全量化存储、端侧抗冲击与模型容量规格，再进入 /baseline 与 /dev。
