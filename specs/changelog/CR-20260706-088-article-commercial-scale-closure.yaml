id: CR-20260706-088-article-commercial-scale-closure
title: 文章商业化唯一分支收口与 shared commercial pool
date: 2026-07-06
area: Data
domain: content-supply
type: additive
summary: >
  为 article/homepage 商业化新建专属 story，冻结开放式 travel/photography 文章来源站点的统一
  onboarding 合同、shared commercial pool、唯一 commercial execution branch，以及 H100/H1000 与
  10k evaluate-only 的真实证据口径。
motivation:
  - 现有 `geo-content-trinity` 已显式收紧为 Pinterest image-only 商业验证，不能继续承载 article/homepage 泛化改造。
  - 三周迭代后，文章商业化真正的风险已收敛到前半条来源与 planning 旁路，而非 produce/publish 后半链本身。
  - 若不先冻结 shared pool、single branch 与 authoritative commercial evidence，继续开发只会在历史旁路上叠债。
changes:
  - 新建 `specs/feature-tree/runtime/runtime-data-engineering/article-commercial-scale-closure/{spec.md,acceptance.yaml}`。
  - 冻结 article 商业化的 shared commercial pool、唯一执行分支、H100/H1000 里程碑与 10k evaluate-only 出口。
  - 明确 article 商业 blocker 以 `R-CS01 / R-CS03 / R-CS07 / R-CS09 / R-CS10` 为主，`R-CS02` 仅在 H1000 后的 10k 评估阶段升级为硬门。
  - 为后续代码收口预留 single-source 真相源：`task run` DAG、统一 onboarding 合同、统一 commercial evidence。
policy:
  - 开放式旅行/摄影文章来源站点允许扩展，但必须进入统一 onboarding 合同，并按 `commercial_release / controlled_trial / reference_only / blocked` 裁决。
  - H100/H1000 成功标准只认 shared commercial pool 的真实 release/import/search/reco 与 authoritative TokenLedger/firstPassRate/throughput 证据。
  - 10k/日只允许基于 H1000 实测做 evaluate，不得提前承诺可达。
evidence:
  planning_truth:
    - specs/feature-tree/runtime/runtime-data-engineering/article-commercial-scale-closure/spec.md
    - specs/feature-tree/runtime/runtime-data-engineering/article-commercial-scale-closure/acceptance.yaml
    - quwoquan_data/docs/content_supply_commercialization_plan.md
    - quwoquan_data/docs/content_supply_instruction_scale_prompts.md
    - quwoquan_data/docs/agent_content_supply_operating_model.md
  runtime_truth:
    - quwoquan_data/scripts/task/run.py
    - quwoquan_data/scripts/site_supply/content_plan.py
    - quwoquan_data/scripts/verify/scale_readiness.py
    - quwoquan_data/scripts/verify/sdk_monitoring.py
rollout:
  h100:
    target: authoritative H100 article+homepage real E2E via shared commercial pool
    gate: env_ready/task_workflow_state/token_ledger/managed_batch_audit/sdk_monitoring/scale_readiness/release-import-search-reco evidence all present and real
  h1000:
    target: same-branch H1000 scale-up after H100 is green
    gate: throughput, queue stability, partialDelivery, creator load, sourceReady capacity and firstPassRate all measured from the real H1000 batch
  evaluate_only:
    target: 10k/day feasibility
    gate: only based on H1000 measured throughput, unitPassedCost, sourceReadyObjectCapacity, firstPassRate and downstream visibility
risks:
  - `R-CS09` 版权风险在本轮继续保留，story 冻结不等于法务风险关闭。
  - 若 H1000 后触发 `R-CS02` 的 queueBackend/reliabletask/throughput 硬门，本轮必须诚实停在 evaluate 结论，不得继续承诺交付。
