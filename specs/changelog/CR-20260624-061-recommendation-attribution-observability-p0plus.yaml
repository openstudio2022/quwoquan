    notes:
      - 修正 App trackClick 将 click 错报为 interaction 的七态契约漂移，CTR 分子重新由独立 click 状态驱动。
      - 新增指标 recommendation_feed_served_by_attribution_total 与 recommendation_behavior_by_attribution_total；标签值做 bounded 归一，避免高基数外溢。
      - 深排平台继续 out of scope；本 CR 不引入 MMoE/PLE/ESMM、双塔 ANN、IPS 或同步 scorer 调用。
