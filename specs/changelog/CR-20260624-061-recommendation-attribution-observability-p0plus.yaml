  - timestamp: "2026-06-24T22:30:00+08:00"
    summary: |
      在非深排 P0 基线之后，补齐推荐观测与反馈归因闭环：feed 下发、App 行为上报、
      content-service raw event、learning context 与 Prometheus 指标统一携带 bounded attribution，
      覆盖 channel/vertical/supply_source/recall_path/ranking_version/reason_version/intersection_class。
    reason: |
      P0 已打通质量分、协同召回、旅行/精品路由和交集解释，但商业化评估仍缺按首页、
      旅行、精品、UGC、数据工程、召回路径和交集类别切分的效果证据。P0+ 先补观测与
      行为归因，不进入深排平台。
