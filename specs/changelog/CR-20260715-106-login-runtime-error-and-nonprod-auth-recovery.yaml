  - timestamp: "2026-07-15T15:30:00+08:00"
    summary: |
      登录退出从 allowGuestDismissPop 布尔值收敛为强类型宿主策略；第三方登录能力
      区分配置、安装、SDK、超时和平台状态，不再把可恢复不可用静默过滤。统一错误
      系统增加表单内联卡与字段错误载体，OTP/社交错误就近呈现。

      alpha/beta/gamma 默认使用固定测试码 123456，但保留 challenge、过期、限流与
      一次性消费；alpha public plane 补齐 Remote OTP 路由。prod 继续只允许真实 provider，
      OTP 通过 metadata SECRET codeRef 密封传递且 fail-closed。
    reason: |
      裸 flutter run 的 alpha App 当前请求缺失的 mock public-plane auth route 并返回 404；
      登录页同时存在第三方入口无解释消失和 inlineCard 错误被弱化为 caption 的契约漂移。
