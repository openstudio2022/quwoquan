id: CR-20260620-049-data-partial-delivery-release-contract
title: 数据工程部分交付与失败实体引用隔离契约
date: 2026-06-20
area: Data
domain: content-supply
type: corrective
summary: >
  将实体主页、文章、图片、视频的 planned quota 从发布硬门调整为成功率与履约率指标。
  release/import 只消费通过质量与权利门的成功对象；实体主页失败时剔除结构化实体引用，
  不阻断文章、图片、视频发布。
motivation:
  - 支持真实生产中按成功对象独立发布，避免少量主页、文章、图片或视频失败拖垮整批。
  - 防止失败实体进入已发布标签、实体引用和可点击 /entity 链接。
  - 让百级、千级、万级试跑用 partialDelivery.fulfillment 衡量真实产能，而不是把未满额误判为整批失败。
changes:
  - publish_filter 在实体主页缺失时过滤 entityRefs / normalizedEntityRefs，并将正文 /entity 链接降级为普通文本。
  - publish handler 对所有 post manifest 应用发布过滤，包括 image/video 载体。
  - release assemble/gate 支持 image/video asset-only post，并允许 allowPartialContent=true 时 planned post 缺额不阻断。
  - task publish 阶段只要求 postCount > 0，不再要求 entityCount > 0。
  - release integrity 统计 videoCount，并区分 article/image/video 的资产契约。
  - scale_readiness 将文章/图片缺额、failedLaneCount、source sufficiency 低于目标记录为 partialDelivery/warning；零可发布 post、流程卡死、导入/发布证据缺失仍为 blocker。
  - trial_review 将默认部分交付下的 source_unavailable 归因为 partial delivery recovery，不再建议整批替换。
evidence:
  t1:
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/annotate/test_annotate_publish_filter__local_contract_test.py -q
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/verify/test_scale_readiness__local_contract_test.py -q
    - quwoquan_data/.venv/bin/python -m py_compile quwoquan_data/scripts/core/publish_filter.py quwoquan_data/scripts/content/release/canonical/handler.py quwoquan_data/scripts/content/release/canonical/assemble.py quwoquan_data/scripts/content/release/canonical/gate.py quwoquan_data/scripts/core/release_integrity.py quwoquan_data/scripts/task/run.py quwoquan_data/scripts/verify/scale_readiness.py quwoquan_data/scripts/task/trial_review.py
  t2:
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/workflow/test_task_run_pipeline.py::test_publish_stage_materializes_task_inputs_and_release quwoquan_data/tests/workflow/test_task_run_pipeline.py::test_publish_stage_allows_site_supply_dynamic_posts_without_entity_homepages quwoquan_data/tests/workflow/test_task_run_pipeline.py::test_publish_stage_allows_partial_posts_without_entity_homepages_for_entity_batch -q
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/task/test_trial_review__local_contract_test.py -q
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/user_acceptance/verify/test_release_integrity_gate__user_acceptance_test.py -q
    - quwoquan_data/.venv/bin/python -m pytest quwoquan_data/tests/local_contract/produce/test_image_post_contract__local_contract_test.py quwoquan_data/tests/local_contract/media/test_media_asset_url__local_contract_test.py -q
  t3:
    - 待下一轮真实百级/千级托管试跑补录 release/import/smoke 证据。
  t4:
    - 待 gamma feed/search/detail 样本消费链路补录。
rollout:
  default: workflowPolicy.allowPartialContent defaults to true for data content publishing.
  hardMode: set workflowPolicy.allowPartialContent=false when a task requires all planned objects before release.
  scaleUse: use partialDelivery.fulfillment and runtime throughput to size upstream candidate volume and worker concurrency.
risks:
  - 当前变更修复发布与验证语义；真实百级/千级 Cursor SDK 试跑仍需重新采集 TokenLedger、release/import 与吞吐证据。
  - 正文实体链接已降级；图片/video caption 中的纯文本实体提及仍作为非结构化文本保留，结构化实体引用会被过滤。
