    verification:
      - "go build ./...：全量绿"
      - "go vet runtime/impact + circle/content application + content-service/tests：绿"
      - "go test ./runtime/impact/...：ok"
      - "dart analyze intersection_icon_resolver.dart + impact_help_type_metadata.g.dart：No issues"
      - "flutter test object_page（intersection_four_slot_primitives + object_intersection_card）：33 passed"
      - "verify_intersection_kind_registry.py：OK（28 kinds 对齐）"
      - "verify_impact_help_type_registry.py：OK（6 helpTypes 对齐），负向篡改 Go 表已检出漂移"
    notes:
      - audience iconKey 从隐式 cascadePath 兜底升级为显式 audienceReach，是本次刻意修复的视觉漂移（端 _iconForKey 用 eye_fill glyph）。
      - 行为保持：behaviorActions / summaryAction / evidenceAction / iconKey 与原 switch 逐项核对一致（仅 audience iconKey 为修复项）。
      - glyph（iconKey→IconData）仍由端设计层在 _iconForKey 维护，verify 守护「注册表每个 impact iconKey 必有 glyph case」闭集覆盖。
      - 本轮不登记新风险（用户指令）；剩余任务与风险在新一轮规格规划中系统梳理。
