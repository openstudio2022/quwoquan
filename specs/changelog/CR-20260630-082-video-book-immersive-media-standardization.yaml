id: CR-20260630-082-video-book-immersive-media-standardization
title: 视频书沉浸媒体体验与目录职责标准化
slug: video-book-immersive-media-standardization
revision: 1
status: implemented

affected_nodes:
  - specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer
  - quwoquan_app/lib/components/media/shared/pageflip
  - quwoquan_app/lib/components/media/image/book
  - quwoquan_app/lib/components/media/shared/toolbar
  - quwoquan_app/lib/ui/discovery/widgets/works_immersive_viewer.dart
  - quwoquan_app/scripts/content/verify_content_ui_directory_boundaries.py

entries:
  - timestamp: "2026-06-30T00:00:00+08:00"
    summary: |
      将精品沉浸浏览按“视频书”口径收口：图片作品从旧横滑 PageView 主体验改为公共图片书翻页体验；
      视频作品继续保留播放器与分集横滑，不把视频帧物理折页；文章作品继续使用 content article reader
      宿主。三类媒体底部工具栏统一显示云侧具象化交集句，替代 `N 个交集 >` 摘要作为主表达。
    reason: |
      图片、视频、文章在精品沉浸页应共享统一消费壳和底部推荐解释表达，但公共翻页能力不能继续下沉在
      `ui/content`，也不能让 discovery DTO/provider 污染公共组件。按职责边界：`components/pageflip`
      仅做通用引擎，`components/media/shared/pageflip` 做通用媒体书页宿主，`components/media/image/book`
      做图片书展示层，`ui/discovery/widgets/WorksImmersiveViewer` 只做作品浏览 adapter。
    change_type:
      - product
      - architecture
      - refactor
      - test
      - governance
    changed_documents:
      - path: quwoquan_app/lib/components/media/shared/pageflip/media_page_flip_book.dart
        sections:
          - "新增媒体通用翻页宿主，消费 components/pageflip 几何和 renderer，不依赖 ui/provider/DTO/route"
          - "媒体宿主以全屏横向位移判定 next/prev，并通过 contentSignature 管理内容快照生命周期，避免父级 rebuild 重置翻页控制器"
          - "首帧仅做有限静态纹理预热，不启动 curl；拖拽/动画活跃路径继续复用同一 pageflip render scene"
      - path: quwoquan_app/lib/components/media/image/book/image_book_canvas.dart
        sections:
          - "新增图片书展示层，只接收图片 URL 列表和边界/页码回调"
      - path: quwoquan_app/lib/components/media/shared/toolbar/immersive_intersection_statement.dart
        sections:
          - "新增沉浸底栏具象化交集句，复用 InteractiveIntersectionText，不本地拼推荐文案"
      - path: quwoquan_app/lib/components/media/shared/toolbar/immersive_engagement_bar.dart
        sections:
          - "底部工具栏增加 full-width 交集句 rail，并保留作者/关注/赞转评一行结构"
      - path: quwoquan_app/lib/ui/discovery/widgets/works_immersive_viewer.dart
        sections:
          - "图片画布改接 ImageBookCanvas；交集 span/fallback 导航由 discovery adapter 注入"
          - "视频仍走播放器分集；文章仍走 article_reader/pageflip 宿主"
      - path: quwoquan_app/lib/components/object_page/intersection_target_navigator.dart
        sections:
          - "无 GoRouter 宿主时 open 返回 false，允许调用方优雅降级到本地详情 sheet"
      - path: quwoquan_app/scripts/content/verify_content_ui_directory_boundaries.py
        sections:
          - "允许 components/media/shared/pageflip 作为 components/pageflip 的生产宿主"
          - "禁止 media pageflip/image book 公共组件 import ui/**、content DTO、Riverpod provider 或 GoRouter"
      - path: specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer/spec.md
        sections:
          - "更新图片书、底部具象化交集句、文章宿主边界和目录职责说明"
      - path: specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer/acceptance.yaml
        sections:
          - "GWT3/GWT5 验收从旧图片横滑/交集摘要改为图片书/具象化交集句"
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - user_acceptance
      rollout_impact: medium
      breaking_contract: false
    test_evidence:
      recorded:
        - "cd quwoquan_app && flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart（44 过）"
        - "cd quwoquan_app && flutter test test/components/media/shared/toolbar/immersive_engagement_bar_widget_test.dart test/local_contract/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart test/local_contract/components/media/image/book/image_book_canvas_widget__local_contract_test.dart（18 过）"
        - "cd quwoquan_app && flutter test test/components/object_page/intersection_target_navigator_test.dart（8 过）"
        - "cd quwoquan_app && flutter test test/local_contract/ui/content（364 过）"
        - "cd quwoquan_app && flutter analyze <touched dart files>（0 issue）"
        - "python3 quwoquan_app/scripts/content/verify_content_ui_directory_boundaries.py（passed）"
        - "python3 quwoquan_app/scripts/content/verify_pageflip_backward_mainline.py（OK）"
        - "make verify-app-pageflip-back-mainline（66 过 / 3 跳，既有 skip）"
        - "python3 quwoquan_ops/gate/scaffold/generate_test_directory_inventory.py && python3 quwoquan_ops/gate/scaffold/verify_test_directory_inventory.py（OK）"
        - "make verify-test-coverage-map（OK）"
        - "bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh && bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh（OK）"
        - "python3 quwoquan_ops/cli/stackctl.py verify --env alpha|beta|gamma|prod --kind packaging --tier t1（四环境均 passed，各 4 checks）"
    notes:
      - "本 CR 不改云 API、外部 route、错误码或四环境拓扑。"
      - "本 CR 不把视频帧做物理翻页；如需视频 texture snapshot 翻页，应另起独立专项。"
  - timestamp: "2026-06-30T00:00:00+08:00"
    summary: |
      复盘修正视频书落地缺口：App Shell 可见「精品」入口改为「视频书」；图片书宿主从触点半区判向改为
      全屏横滑 delta 判向；修复 `pageBuilder` closure 身份变化导致父级 rebuild 清空翻页 controller 的问题。
    reason: |
      旧实现只完成目录接入和组件存在性测试，未证明图片浏览器横滑后真实改变页码；同时底部导航仍取
      `AppConceptConstants.premium = 精品`，导致用户可见入口未按视频书口径完成。
    change_type:
      - product
      - bugfix
      - test
      - governance
    changed_documents:
      - path: quwoquan_app/lib/core/constants/app_concept_constants.dart
        sections:
          - "用户可见 premium 一级入口文案改为视频书，内部 featured route/filter ID 不迁移"
      - path: quwoquan_app/lib/core/constants/ui_text_constants_values.dart
        sections:
          - "Web/Work Browser 可见文案改为视频书，并新增视频书加载文案常量"
      - path: quwoquan_app/lib/components/media/shared/pageflip/media_page_flip_book.dart
        sections:
          - "全屏左滑/右滑转换为 pageflip forward/back 输入"
          - "通过 contentSignature 替代 pageBuilder closure identity 作为快照刷新信号"
      - path: quwoquan_app/test/local_contract/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart
        sections:
          - "新增左滑下一页、右滑上一页行为契约"
      - path: quwoquan_app/test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart
        sections:
          - "Work Browser 图片书测试从组件存在性升级为真实页码变化和末图边界保护"
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - local_contract
        - user_acceptance
      rollout_impact: medium
      breaking_contract: false
    test_evidence:
      recorded:
        - "cd quwoquan_app && flutter test test/local_contract/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart test/local_contract/components/media/image/book/image_book_canvas_widget__local_contract_test.dart（5 过）"
        - "cd quwoquan_app && flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart（44 过）"
    notes:
      - "本修正不改 components/pageflip 几何核心，不改 ui/content/article_reader/pageflip BACK 主线。"
      - "内部 `featured` 命名暂作为 route/filter ID 保留，避免把产品文案修复扩大成高风险路由迁移。"
