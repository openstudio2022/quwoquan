  - timestamp: "2026-07-21T12:03:00+08:00"
    summary: |
      从 MediaAsset 的既有图片归一化基线中拆出 image-delivery-variants Story，冻结单一
      图片交付 descriptor、唯一 CDN profile policy、Post 可见性驱动原图授权与版本化
      reprocess/backfill 语义。
    reason: |
      审计证明上传、异步处理和公共 slice 主链已存在，但图片 variants 仍未成为独立端云
      契约：metadata、Data 和 App 分别维护 profile，descriptor 缺少交付元数据，原图授权
      未按 Post 可见性与限流闭环，不能以已有基线宣称商用图片矩阵完成。
    decisions:
      - 保持 MediaAsset 为唯一 aggregate；thumbnail/display/cover/full 为同一 normalized
        baseline 的 CDN profile，不创建第二媒体对象、Store 或状态机。
      - 后续 metadata 从 content/media_asset 生成 ImageVariantPolicy 到 Service、Data 与 App；
        删除 content/post policy、App 默认尺寸和 Python 常量，不保留双读。
      - 策略升级使用新的 processingVersion 与 descriptor 原子切换；历史资产由可暂停、
        可审计、可回滚的 reprocess/backfill 处理，旧 ready slice 保持可读。
      - 原图授权继续记录 MediaOriginalAccessFact，但必须以 Post named visibility reader
        加 asset policy 与 rate limit 判定，不能用 owner-only 查询偷换读权限。
    change_type:
      - specification
      - acceptance
      - reliability
      - security
      - observability
