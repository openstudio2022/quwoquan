    rollout:
      stages: [alpha, beta, gamma_local, prod_gray_initial, prod_full]
      rollback:
        - 停止新媒体上传与新发布，保留私有源对象、processing 资产和 outbox 待恢复重放。
        - 不把 processing 强改 ready，不回退到原始上传字节。
        - 已发布 Post 与 versioned public slices 继续可读。
    notes: |
      三层测试、触发范围门禁、gamma_local 真实依赖链与 prod gray readback 全部通过后改为
      completed；任何未执行环境证据均保持显式 GATE_BLOCK。
  - timestamp: "2026-07-21T04:55:00+08:00"
    summary: |
      修复 MediaAsset 已处理 descriptor 与后续可变聚合版本混用的问题。处理完成后的
      public slice 路径绑定 `processingVersion`，封面选择或 access policy 变更只推进
      aggregate version；恢复和校验继续消费冻结的 processingVersion，不能把合法的
      v2 视频交付物按后续 v3 聚合版本误判为无效。
    reason: |
      旧实现会在 ready 视频选择封面后，以新 aggregate version 重新验证旧 descriptor，
      导致 Mongo 事务恢复失败并向 HTTP 返回伪装成依赖不可用的 503，破坏发布后封面主线。
