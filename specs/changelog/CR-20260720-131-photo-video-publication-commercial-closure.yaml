      这是冻结实现边界与验收的规格变更，不是完成声明。缺少真实 ImageDeliveryDescriptor、
      policy codegen、reprocess、Post visibility 原图授权、beta/gamma/prod 非 dry-run
      报告前，图片商用矩阵必须保持 GATE_BLOCK。
  - timestamp: "2026-07-21T14:17:16+08:00"
    summary: |
      落地图片 ImageDeliveryDescriptor 与原图授权两项商用主线：ImageVariantPolicy 从
      content/media_asset 唯一生成 Service/App/Data profile；图片 ready 必须持久化主色、
      LQIP、内容画像和 derivative policy version。原图授权改为只读 Post named visibility
      reader、asset policy 与 metadata 生成的 viewer/media/purpose 限流共同判定。
    reason: |
      旧实现把原图授权错误收缩为 MediaAsset owner 查询，导致已发布 Post 可见性、拉黑关系、
      审核状态和限流均未进入准入；同时图片 delivery profile 分散在 Post metadata、App 默认
      尺寸和 Data 常量，无法保证同一策略版本的三侧交付一致。
    decisions:
      - MediaAsset 仍是唯一媒体 aggregate；ImageVariantPolicy 只生成 CDN delivery profile，
        不创建 variant Store、资产副本或双读兼容。
      - 生产装配 fail-closed：Post media visibility reader 或 block reader 缺失时，原图授权
        不签发 URL。
      - 原图 grant 仅允许 ready image；asset owner_only 仍必须存在 viewer 可见的已发布引用
        Post，不能以 owner 查询绕过可见性。
      - 原图额度与窗口由 media_original_access_fact/original_access_policy.yaml 生成到服务端；
        Mongo transaction 中先保留 hash 化 viewer/media/purpose 窗口额度，再追加审计事实，
        幂等重放不消耗额度也不延长 expiresAt。
      - granted、denied、rate_limited 都追加同一 MediaOriginalAccessFact；拒绝事实不含
        原图 URL 或 expiresAt，不能用日志或内存计数代替审计。
    change_type:
