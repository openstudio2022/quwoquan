id: CR-20260702-001-photo-picker-editor-one-tap-flow
title: 图片选择到编辑再到创作与一键成片归属调整
slug: photo-picker-editor-one-tap-flow
revision: 1
status: implemented

affected_nodes:
  - specs/feature-tree/discovery-content/content-type-framework/creation-mode-and-surface-ia-unification
  - specs/feature-tree/discovery-content/publish-comment-reaction/post-create-update
  - quwoquan_app/lib/components/media
  - quwoquan_app/lib/ui/content/entry

entries:
  - timestamp: "2026-07-02T00:00:00+08:00"
    summary: |
      图片发布链路调整为“图片选择器 -> 图片编辑页 -> 图片创作页”。图片选择页底部从“编辑图片 / 完成(n)”改为“一键成片 / 下一步(n)”，右上新增“草稿箱”；“下一步(n)”进入图片编辑页，图片编辑页底部工具栏下方新增紧凑蓝色“下一步”，再进入图片创作页。
      一键成片从视频入口迁回图片入口，至少选中 2 张图片才可点击；完成后进入图片创作页并锁定为单素材作品，不进入视频选择器或视频发布页。视频选择页移除一键成片，只保留“拍视频”和全部视频资源。
    reason: |
      用户确认一键成片应服务于图片发布心智，而不是视频选择心智；图片选择、图片编辑和图片创作三段之间还必须保持图片顺序与编辑状态一致。旧口径把一键成片放在视频入口，会导致视频页空态与图片发布主链路不一致，也让图片编辑页缺少明确的下一步转场。
