  - timestamp: "2026-05-31T16:00:00+08:00"
    summary: 冻结 profile-homepage-redesign 的 V5 全量口径为唯一真相源，并把交集卡升级为基于 tag-service shared-tags 的真闭环
    reason: >-
      历史存在三套并存口径（主 spec 全量含微趣、commercial-readiness 收窄含微趣、最新产品口径全量无微趣），
      且交集仅为带计数文案的展示卡、resonance 旧链路为孤儿第二数据通路。V5 需收口为单一口径并打通真实数据。
    change_type:
      - refine
      - freeze
      - migrate
    decisions:
      - 一级 Tab 冻结为全量 4 个：创作/圈子/互动/生活，由 codegen profile_tabs 驱动。
      - profile 内容形式仅文章/图片/视频三类（contentIdentity=work）；profile 不引入微趣/moment；历史含微趣表述废止。
      - 交集卡真闭环：tag-service 新增 ObjectTagIndexWriter + Mongo upsert + 离线批量导入工具，从 content.tagRefs / circle.tags / user.interestTags 回填 object_tag_index。
      - 打标写存储归属：由 tag-service 自持 object_tag_index 写能力（与 feedback 写路径同评审结论一致，集中在 tag 域）。
      - 离线批量回填为 V5 落地路径；事件驱动增量（MQ consumer + user InterestTagsUpdated 事件化）为收敛后续。
      - resonance 旧链路（页面/路由/模型/Repository 方法/文案）全部删除，不向后兼容。
