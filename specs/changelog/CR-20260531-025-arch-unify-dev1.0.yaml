    summary: >-
      V4 架构统一收口：把分散在多个未合并 worktree 的版本工作统一到单一 dev1.0 主线，
      消除全部独立工作区，确立「今后只有 dev1.0」单一主线原则。
      P0 主树固化：session0 合并后累积在 dev1.0 working tree 的 1733 改动（5 工作线：
      specs 去版本化标准化 / 内容命名收敛 CR-022 / ops 环境拓扑+数据生产 / user auth /
      pageflip 增量）固化为 5 个主题 commit；约 927 个产物（.qwq_output/runs/env-packages 164 +
      quwoquan_data/release 763）按口径排除不污染主线。
      S1 V3 整合：session3 对象页壳层统一(ObjectPageShell) + tag-service 真打 + 交集卡
      merge 进 dev1.0，content 取 dev1.0 B 内容收敛基线、shell 取 session3 V3 重构。
      S2 V2 收口：dev1.0 B(CR-022 Block 0) 已吸收内容多形态核心(ContentSurfaceView/
      micro/口碑字段)，补 review_aspect projection 契约；session2 旧 moment 基线与旧 UI
      整体丢弃，不搬旧债。
      S5 游离全清：14 worktree → 2(dev1.0 + auth 三天内宽限)，16 个一周前分支删除，
      7 个历史 stash 清空。
    reason: >-
      按用户冻结口径「统一到 dev1.0、不要再有独立工作区、不留技术债与兼容处理、保持技术
      主线升级」：多版本散落在 session0/session2/session3 及 12 个历史 worktree 造成碎片化
      与未固化债务。一次性收口到单一 dev1.0 主线，内容线硬切单一同源(无 unified_surface_view
      双读 flag、无旧投影并行)，分支保留原则今后仅 dev1.0(三天内工作区宽限保留)。
