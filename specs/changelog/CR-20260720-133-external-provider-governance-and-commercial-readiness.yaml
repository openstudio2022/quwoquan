          - quwoquan_ops/tests/local_contract/external_provider_governance__local_contract_test.py
      - layer: api_integration
        intent: SIT
        evidence:
          - quwoquan_ops/tests/acceptance/api_integration/external_provider_governance__api_integration_test.py
          - quwoquan_service/services/integration-service/tests/api_integration
          - quwoquan_service/services/rtc-service/tests/api_integration
      - layer: user_acceptance
        intent: UAT
        evidence:
          - quwoquan_ops/tests/acceptance/user_acceptance/external_provider_governance__user_acceptance_test.py
    rollout:
      stages: [alpha, beta, gamma_local, prod_gray_initial, prod_full]
      rollback:
        - 仅回滚到 registry 中 adapter_ready=true 的 last-good config+image 对。
        - required 能力无 ready Provider 时阻断 rollout；optional 能力结构化关闭，不切 Mock。
        - 保留失败 run ID、观测引用与 callback/队列水位，修复后按幂等合同重放。
    notes: |
      本 CR 在仓内 compiler、gate、测试和 Adapter 迁移完成后仍保持 in_progress，直到真实
      Beta/Gamma 凭据、远端调用、设备/运营旅程、logs/traces/metrics readback 与回滚证据
      全部取得；不得用静态检查或替代 Provider 冒充商用完成。
