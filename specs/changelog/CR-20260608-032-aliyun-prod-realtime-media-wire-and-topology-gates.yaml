id: CR-20260608-032-aliyun-prod-realtime-media-wire-and-topology-gates
title: ACK 生产部署形态落地（实时/媒体 wire 进多云 prod root + 工作负载三态/拆分契约/同构门禁）
status: partial
feature_path: runtime/deliver-deploy-prod-pipeline
summary: |
  在 CR-20260608-031 规格冻结基础上落地 prod-hosted 可渲染、可门禁的工作负载图谱（T1/T2 闭环）：
  1) 新建 realtime-gateway 完整 kustomize（base：Deployment/Service/HPA/PDB + probe/resources；overlays/prod：
     镜像 tag、APP_ENV=prod、replicas/HPA replacements），并把 realtime-gateway / rtc-service / livekit-sfu /
     coturn 一并 wire 进 aliyun-prod / volcengine-prod / huaweicloud-prod 三个 prod root。
  2) 校正 workload_topology_inventory.yaml：四个实时/媒体 workload 标记 wired_to_prod_root=true、补 kustomize_overlay
     与 prod_root_kustomizations；livekit-sfu 由 StatefulSet 校正为首发 Deployment（与磁盘一致，UDP 经 NodePort/LB），
     coturn 注明 hostNetwork 固定副本不配 HPA。
  3) 新增并接入三道 topology 门禁到 Makefile（gate + verify 经 verify-workload-topology-inventory target）：
     verify_workload_topology_inventory.py（三态一致 + 标准原语齐全 + 无 sidecar 反模式）、
     verify_strangler_contract_invariants.py（split_candidate route/Service DNS 不变量 + domain 唯一归属 + 拆分模块可迁）、
     verify_gamma_local_prod_isomorphism.py（gamma↔prod 暴露面/四平面键一致 + 数据面 DSN 变量经 Secret 跨环境不变）。
  4) 数据面表述统一为「固定小规格存算分离单主（PolarDB/Tair/MongoDB，不依赖 Serverless，MongoDB Serverless 2025-12-31 EOS）」，
     同步 spec/design/acceptance 与预算 canvas（≤¥500/月）。
  5) acceptance SIT2 回填 T1/T2 证据并标 partial；T3/T4（真实 ACK stackctl deploy/health/inspect/doctor 全链 + 用户主链路
     无感漂移）待生产账号环境执行，本地无云账号不虚标。
