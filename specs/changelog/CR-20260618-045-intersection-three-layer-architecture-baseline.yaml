    notes:
      - 契约本轮标「草案/未冻结」，由 A–E UI 原型反推定稿；定稿后并入 freeze-checklist 第 1 节冻结清单。
      - 只附加策略：reason/tally/inbox/author_impact/circle_impact 已冻结字段位置不动，旁挂新子类型与 lifecycle/传播字段；Go 侧新字段为只附加可选投影，云端未产出时端侧降级（spans→primaryText→隐藏、objectVisual 空回退占位、lifecycle stable/weakened 不渲染）。
      - 单通道不变量保持：join(spans.text)==primaryText/briefText；槽②句内头像由 WidgetSpan 承载、不贡献字符，契约/widget 测试强制（interactive_intersection_text_test.dart）。
      - G2 不破：lifecycle 弱标不进结论句、不变蓝、不堆叠；端 iconKey 由 IntersectionIconResolver 语义映射，禁页面硬编码 switch(sourceRef)。
      - 传播红线（§21.4）：端只展示可证绝对计数 + 路径节点视觉；reach/conversion 仅云侧内部排序因子、不进 DTO；禁百分比/漏斗/增长率。
      - coLiked（赞）§21.9 恢复为 T4 最低权重：排序永远在 T1–T3 之后、like 图标仅无更高价值交集时露出、禁请求期全量求交（§21.7 走预投影/采样/上限）；本次只翻赞，§14A 收藏/稍后看/关注内容保持退场。
      - 云侧数据源采集、Lifecycle 状态机（需历史强度时间序列）、多跳 Propagation、Graph 加权真算、coLiked 预投影、Selection 数值化、Remote 填充全部后置；需用户确认后登记 docs/outstanding_risks_backlog.md。
