entries:
  - timestamp: "2026-06-18T15:30:00+08:00"
    summary: |
      把「交集」统一为一条「采集→算法→投影」端到端管线上的加权社交图谱边，其边被依次赋予
      Graph(结构) / Lifecycle(变化) / Propagation(扩散) / Projection(表达) 四属性（§21）。本轮按
      「UI 原型优先、云侧算法后置」推进：先写清原理与端到端统一模型，补全端侧展示统一要求
      （四槽视觉模型 + iconKey 语义闭集 + 每 surface 密度上限 + 降级链 + 五面 A–E 矩阵），落性能/
      容量弹性设计（冷热三档 + coLiked 高频红线），并以 metadata-first「草案/未冻结」契约 codegen 出
      端 DTO，最后用 Mock 驱动敲定五面 UI 原型。
      契约草案新增：kind_registry 每 kind Graph 元数据(relationStrengthBase/interactionFrequencyKey/
      recencyHalfLifeDays/lifecycleApplicable/propagationRole/iconKey)；intersection_reason 增
      lifecycleState/previousStrength/strengthDelta/edgeWeight/iconKey/objectVisual；intersection_text_span
      增 visual(句内头像)；tally/inbox 增 strengthened/reactivated 分桶计数 + iconKey；author_impact 增
      propagationPath/hopCount/secondarySpreadCount/iconKey；circle_impact 补统一交互子契约 + propagationPath +
      iconKey(解决端 G4)；新增 intersection_propagation_path 值对象；policy intersection 块增
      graphWeights/lifecycleWeights/propagation 配置位。
      端侧新建四槽共享件 IntersectionTypeIcon/IntersectionIconResolver(槽①)、InteractiveIntersectionText
      句内头像(槽②)、IntersectionObjectCover(槽③)、IntersectionLifecycleBadge(槽④)、
      IntersectionPropagationView(传播)；circle_impact 卡接统一三件套 + 传播视图；my_home 四槽样板；
      IntersectionEntity 弱标真相源切换为服务端 lifecycleState；Mock/fixture 补 lifecycle/传播/inline 头像样本。
      §21.9 赞红线翻转：coLiked 恢复为 T4 最低权重轻量交集（只翻赞、不恢复收藏）。
    reason: |
      旧「交集」是社交图谱、生命周期、传播三套并行模型，缺统一原理与端侧具象化展示口径：
      单行交集卡只有一句话纯文本，缺类型图标 / 句内头像 / 对象封面 / lifecycle 弱标 / 传播视图，
      circle_impact 还未接统一交互子契约(端 G4)。先沉淀端到端统一模型 + 四槽共享件 + 五面矩阵，
      用 Mock 原型敲定展示，再冻结契约进入云侧真算，避免 A–E 各面二次分叉与契约反复。
