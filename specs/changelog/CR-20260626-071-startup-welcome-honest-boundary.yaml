entries:
  - timestamp: "2026-06-26T00:00:00+08:00"
    summary: |
      纠偏 Android 启动欢迎页实现：删除原生镜像欢迎页、原生 overlay 与 native handoff，
      恢复 MainActivity 直接作为 launcher。原生层只保留无内容中性过渡背景；品牌花瓣、
      标题、标语与启动中提示只能由 Flutter WelcomeScreen 渲染。
    reason: |
      先前实现用 NativeWelcomeView 在 Flutter 首帧前绘制花瓣、标题、标语和启动提示，形成
      第二套镜像欢迎页；同时原生 overlay 依赖 flutterWelcomeReady 释放，在 debug/异常路径下
      会出现无限“启动中”循环。该实现违背“同一个欢迎页完成整个启动”的 UX 目标。
    change_type:
