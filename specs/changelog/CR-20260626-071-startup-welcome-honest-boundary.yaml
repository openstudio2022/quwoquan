    notes:
      - Flutter engine 首帧前不再承诺显示欢迎页；平台上只能显示无内容过渡背景，否则就是第二套 native 镜像。
      - 欢迎页重放提示仍只允许 Flutter 层一行 `启动中，马上进入`，不能出现阶段列表、按钮或底部大卡片。
      - 原生层禁止再出现花瓣、`趣我圈`、`遇见同趣，绽放热爱`、`启动中` 等欢迎页语义。
  - timestamp: "2026-06-26T02:45:00+08:00"
    summary: |
      完成 Android/iOS/Web 启动验证后的二次收口：

      1. Android 本地 HTTPS CA 安装改为 `runApp` 前启动但不阻塞 Flutter 首帧；启动壳在欢迎页播放期间
         等待该 prerequisite，2.5 秒预算后仍进入 Shell，由页面生命周期承接加载。
      2. Flutter `WelcomeScreen.deferSequenceStart` 改为等待首帧 rasterized（带可取消超时）后再启动花瓣
         动效，避免慢启动时欢迎动效在 iOS LaunchScreen 背后跑完。
      3. iOS 将 launch storyboard 改名为 `LaunchTransitionScreen` 并只使用无内容中性背景；`Main.storyboard`
         与 `AppDelegate` 同步中性背景，避免 FlutterViewController 接管期间闪白/闪蓝。
      4. 设备探针区分启动空背景与进入 Shell 后的骨架屏；有欢迎页或主壳可见后，骨架屏不再被误判为启动空白，
         但旧亮蓝无内容背景仍会失败。
    reason: |
      设备复测发现两个新的真实问题：一是 Android alpha/profile 默认会在 `runApp` 前通过 MethodChannel
      安装本地 HTTPS CA，导致 Flutter 首帧被非业务 prerequisite 阻塞；二是 iOS 慢启动时 Flutter 欢迎页
      的计时可能在系统 LaunchScreen 背后提前完成，用户只能看到过渡背景后直接进入 Shell。二者都不是
      native 镜像问题，但都会破坏“同一个 Flutter 欢迎页承接启动等待”的体验。
    change_type:
      - app
      - startup
      - ux
      - performance
      - observability
      - user_acceptance
