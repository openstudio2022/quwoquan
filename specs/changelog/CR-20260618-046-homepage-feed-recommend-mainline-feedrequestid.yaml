  - specs/feature-tree/discovery-content/feed-orchestration-recommendation

entries:
  - timestamp: "2026-06-18T22:30:00+08:00"
    summary: |
      把首页推荐收口为唯一主链路 GET /v1/content/feed?sort=recommend，彻底退役对外
      POST /v1/content/recommend 旁路，并把 feedRequestId 归因主线改为「服务端权威生成 + 客户端回显」。

      契约（metadata-first）：
      - service.yaml 删除 POST /v1/content/recommend route；feed route 正式声明 feedRequestId
        （请求 query_params 可选回显 + 响应 envelope 输出），并补 rankingVersion / reasonVersion。
      - 删除 projections/content_recommendation_response.yaml 投影。
      - request_context.yaml 删除 content.GetRecommendation → content.recommend decoder 映射。
      - tests/contract.yaml 删 get_recommendation_contract，新增 get_feed_issues_server_feed_request_id。
      - tests/e2e.yaml discovery_feed_load_and_render 增「服务端下发 frq_ + 端侧采纳/回显/行为透传」断言。

      服务端（content-service）：
      - GetFeed 首刷未携带 feedRequestId 时由 rtrec.NewFeedRequestID() 生成 frq_ 前缀 ULID，
        写入 FeedResponse envelope（feedRequestId / rankingVersion=rec-v1 / reasonVersion=reason-v1）；
        客户端回显时原样沿用。
      - runtime/id 注册 PrefixFeedRequest=frq_；runtime/recommendation engine FeedResponse 扩展 envelope 字段。
      - 删除 handleGetRecommendation handler、application.Recommend 用例与 RecommendRequest；
        codegen 模板（content_service / app_metadata / barrel）移除 GetRecommendation 特判。

      App（端侧）：
      - 新增强类型 envelope DiscoveryFeedPage（items + nextCursor + feedRequestId/rankingVersion/reasonVersion）；
        listDiscoveryFeedPage 返回类型由 CursorPage<PostBaseDto> 升级为 DiscoveryFeedPage（abstract/mock/remote/cached 同步）。
      - 删除 getRecommendation / ContentRecommendationResponseDto / recommend path 全部消费与生成产物。
      - 首页发现流不再客户端自造 feedRequestId：load 首刷传 null、采纳服务端 envelope id；
        分页回显该 id；FeedSessionNotifier 新增 adoptServerFeedRequestId，曝光/点击/打开复用同一归因 id。
    reason: |
      首页推荐此前是 GET /v1/content/feed 与 POST /v1/content/recommend 双轨：recommend 仅是
      rtrec.Engine.GetFeed 的对外薄包装，无内部 service-to-service 调用方，属冗余旁路，违反单一真相源。
      同时 feedRequestId 由 App 自造塞 query，服务端 feed 链路不生成，归因链在端云之间割裂，
      无法支撑后续曝光/点击/停留对同一推荐请求的稳定归因。阶段一作为商用化地基，必须先把对外契约
      收口为单主链路并把归因 id 提升为服务端权威，避免后续召回/精排/曝光态/AB 各阶段在双轨与
      客户端自造 id 上反复返工。
    change_type:
      - metadata
      - codegen
      - feature-implementation
      - acceptance
    changed_documents:
      - path: quwoquan_service/contracts/metadata/content/post/service.yaml
        sections:
          - 删除 POST /v1/content/recommend route
          - GET /v1/content/feed 声明 feedRequestId（query 回显 + 响应 envelope）+ rankingVersion / reasonVersion
      - path: quwoquan_service/contracts/metadata/content/post/projections/content_recommendation_response.yaml
        sections:
          - 删除投影（recommend 旁路退役）
      - path: quwoquan_service/contracts/metadata/_shared/request_context.yaml
        sections:
          - content.GetRecommendation → content.recommend 映射删除
      - path: quwoquan_service/contracts/metadata/content/post/tests/contract.yaml
        sections:
          - 删 get_recommendation_contract
          - 增 get_feed_issues_server_feed_request_id（frq_ 下发 + 回显沿用 + 版本字段）
      - path: quwoquan_service/contracts/metadata/content/post/tests/e2e.yaml
        sections:
          - discovery_feed_load_and_render 增服务端权威 feedRequestId 断言
      - path: specs/feature-tree/discovery-content/content-service-contract-foundation/spec.md
        sections:
          - 内容推荐能力改为内部编排，对外唯一入口 GET /v1/content/feed?sort=recommend
          - 新增「服务端权威下发 feedRequestId」场景
    impact:
      replan_required: false
      redesign_required: false
      retest_layers:
        - T1
        - T2
        - T3
      rollout_impact: medium
      breaking_contract: true
    notes:
      - breaking：对外 POST /v1/content/recommend 已删除，任何外部调用方必须改用 GET /v1/content/feed?sort=recommend；当前阶段按未上线处理，不做向后兼容。
      - feedRequestId 服务端权威化仅覆盖首页发现流；搜索/圈子/个人作品等其他 feed 面仍由端侧 newFeedRequestId 客户端生成，待各自阶段接入服务端 envelope（见 feed_session_provider.dart §46 注释）。
      - 行为事件（behavior）如何持久消费并回流 feedRequestId 归因留待阶段五处理；本阶段已保证端侧曝光/点击/打开复用服务端下发的同一 id。
      - 验证：content-service go build/test 全绿（含新 TestFeedIssuesServerFeedRequestID）；App flutter analyze 受影响目录无新增告警，content/integration 契约测试 + discovery 旅程测试全绿（102 通过，含 envelope feedRequestId 断言）。
      - 已知无关失败：home_page_widget_test 的 13 项关注流布局断言因用户本地在 home_multi_form_feed.dart 进行的大规模（约 1998 行）moment-grid 重构而失败，与本 CR（recommend/feedRequestId）无关，未在本轮处置以免覆盖用户在途改动。
