id: CR-20260618-046-homepage-feed-recommend-mainline-feedrequestid
title: 首页推荐商用化·阶段一（契约与归因主线冻结：退役 recommend 旁路 + feedRequestId 服务端权威化）
slug: homepage-feed-recommend-mainline-feedrequestid
revision: 1
status: implemented

affected_nodes:
  - quwoquan_service/contracts/metadata/content/post/service.yaml
  - quwoquan_service/contracts/metadata/content/post/projections/content_recommendation_response.yaml
  - quwoquan_service/contracts/metadata/content/post/tests/contract.yaml
  - quwoquan_service/contracts/metadata/content/post/tests/e2e.yaml
  - quwoquan_service/contracts/metadata/_shared/request_context.yaml
