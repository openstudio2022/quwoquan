      新增 L3 Story `object-homepage-gamma-real-data-closure`，把实体主页与圈子主页从本地 UI 合格推进到
      gamma-local 真实数据、真实服务、真实 App Remote、行为归因与 api_integration/user_acceptance 验收闭环。同步修正 L2 SIT2
