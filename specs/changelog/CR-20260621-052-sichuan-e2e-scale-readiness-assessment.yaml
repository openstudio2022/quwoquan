id: CR-20260621-052-sichuan-e2e-scale-readiness-assessment
title: 四川景区十级真实 e2e 复盘与十→百→千规模就绪评估（无代码改动，证据固化）
date: 2026-06-21
area: Data
domain: content-supply
type: assessment
summary: >
  /continue-dev 场景 B 复盘轮：在 R-CS06 闭环后，对内容生产工作流商用化剩余断点做系统性梳理，
  并对真实批次 e2e10（四川省景区十级，含黄龙/阆中两反爬实体）跑 scale-readiness 真实评估，
  用运行时证据精确定位 R-CS01 已收敛边界与 R-CS02/CS03 真实放量门槛。本轮不改业务代码，
  只固化评估证据并回写 backlog；不为凑一轮对成熟 pipeline 做臆造改动制造第二真相源。
motivation:
  - 诚实回答用户「可否由十级进入百级再到千级规模放大」，用真实批次门评估代替主观判断。
  - 避免把已实质建成的工程能力（多源候选/维基别名解析/Wikidata 兜底/partial delivery）误判为开放工程缺口。
  - 把真实放量的资源门槛（token 预算 + reliabletask 分发 + Cursor API 速率）显式化为用户决策项。
findings:
  r_cs06_closeout:
    - R-CS06（App 发布侧 semanticMentions 端云契约）本轮前已闭环：wire codegen metadata-first、App semanticMentionsForPayload、服务端 projection 契约锁定，App 28 + Go 4 用例绿，见 CR-051。
  r_cs01_source_sufficiency:
    - 代码实证：research_plan 已对 homepage 同时产 official + 维基（canonical+短名+别名解析 + Wikidata zhwiki 失败兜底）+ curated knownHomepageSupportSites + baidu + sogou。
    - 真实批次实证：e2e10 scale-readiness sourceSufficiency.homepage/article/image rate=1.0(8/8 活跃)，sourcePlanCategories.encyclopedia=10；源充分性在计划层已达标。
    - 反爬残留：黄龙/阆中 build_prepare「homepage input unavailable after repair budget」，由 CR-049 partial delivery 处理为 8/10、abandoned 实体 excluded from refs。
    - 结论：R-CS01 残留收敛为外站反爬 fetch-time 不可控 + 逐实体 curated 兜底 + 真实放量成功率，非干净泛化工程缺口。
  r_cs02_cs03_scale_gate:
    - e2e10 为 quotas=0 纯实体主页基线，冻结在 content_plan 检查点（waiting_agent），expectedObjects.total=0，结构上不产出 POST。
    - executionReadiness：tokenLedgerCount=0、measuredThroughput=null、firstPassRate=null、releaseManifestExists=false。
    - 百级/千级 scale-readiness 均 decision=no_go；真实放量经济性与吞吐证据只能由含配额、烧 token、跑完 produce_author→review→materialize→ship 的真实批次产出。
    - env preflight 已确认本环境 CURSOR_API_KEY=present、network=ready（cursor API/wikipedia/commons 可达），具备真实跑能力。
changes:
  - 无业务代码改动（assessment-only）。
  - docs/outstanding_risks_backlog.md：R-CS01/CS02/CS03 三项以运行时证据精确回写复核段（更新既有项，非新登记风险）。
  - 固化评估证据 .qwq_output/runs/sichuan-e2e-assessment/scale_readiness_100.json 与 scale_readiness_1000.json。
evidence:
  t1:
    - python3 quwoquan_data/scripts/cli.py env preflight  # runtime=ready, CURSOR_API_KEY=present, network=ready
  t3:
    - python3 quwoquan_data/scripts/cli.py verify scale-readiness --task 旅行/地域/四川省/景区/景区十级e2e --batch e2e10 --daily-target 100   # decision=no_go
    - python3 quwoquan_data/scripts/cli.py verify scale-readiness --task 旅行/地域/四川省/景区/景区十级e2e --batch e2e10 --daily-target 1000  # decision=no_go
  artifacts:
    - .qwq_output/runs/sichuan-e2e-assessment/scale_readiness_100.json
    - .qwq_output/runs/sichuan-e2e-assessment/scale_readiness_1000.json
next_round:
  - 真实放量验证（unblocks R-CS02/CS03）：新建含 quotas>0 的四川内容批次，Agent 真实创作正文，烧 token 跑完 plan→download→produce(compose-brief→author→review --materialize)→media check-images→verify→ship，采集首个真实 TokenLedger/firstPassRate/吞吐与 release/import 证据。
  - 该轮需用户授权 token 预算与放量规模（十/百/千），属真金白银/外部速率配额决策，不在会话内自动启动。
risks:
  - 本轮为评估，不改变任何生产行为；R-CS01 外站反爬与 R-CS02/CS03 真实放量证据仍为 open，已在 backlog 精确登记。
