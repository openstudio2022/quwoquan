    summary: >-
      进 V5 前对 4 类跨主线历史债 + 运行环境项做统一收敛。核心结论：三处债务（R03 行数、
      R02 接口方法数、tag-service 测试）此前都无门禁脚本、靠人工评审，是债务回潮根因。
      本轮补齐门禁基建并冻结现状基线、闭合低成本 501、把 tag-service 接入门禁与交集真打栈。
      G0 门禁基建：新增 verify_file_line_budget.py(R03 ratchet：>1000 行 allowlist，排除
      *.g.dart/l10n/test/mock，只降不升) 与 verify_repository_interface_method_budget.py
      (R02 ratchet：>10 方法登记，伞组合接口 body 空自然计 0 免登记)；tag-service 入
      Makefile build + scripts/gate.sh go test；三脚本挂进 agent_ops/gate/gate_repo.sh。
      G1 登记豁免：R03 46 文件(含 pageflip 3 文件标 pageflip-locked 专项后置)、R02 10 接口
      (Circle34/Chat31/UserProfile27 等)冻结基线，不拆文件。
      G2 tag 501 闭合：实现 search/related/search-by-tags/graph-cooccurrence/related-objects
      5 个(复用 TagNode/ObjectTagIndex 只读 + 在线共现计算)，补 5 个 T3 contract + 前端 T2
      一致性测试；feedback 保留 501(写路径待架构评审)。501 由 6→1。
      G3 运行环境：tag-service 入 local-gamma(端口 manifest slot270/compose 容器/config-root/
      Caddyfile /v1/tag* 双块路由/podman 分支)，交集 sharedTags 真打闭环 + Colima/镜像/patrol
      环境补齐步骤文档化。
    reason: >-
      用户决策：进 V5 前统一清理「剩余 4 类全仓库预存历史债 + 运行环境项」。R03 按「登记豁免 +
      门禁冻结、不实际拆」(article_read_only_book_deck 等 pageflip 本轮完全不碰)；tag 5 个低成本
      501 闭合、feedback 保留；R02 ContentRepository 已达标作模板、其余登记后续。根因是三处债务
      从未进门禁，故优先补门禁堵回潮，再显性登记可控债。
