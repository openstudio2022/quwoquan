entries:
  - timestamp: "2026-06-25T09:40:00+08:00"
    summary: |
      新增我的资料页 `职业与兴趣` 独立页面，职业与兴趣均从 tag-service 标签体系查询，
      通过 user-service 保存 `occupationTagRef` 与有序 `interestTagRefs`，并把职业/兴趣
      tagRefs 投影到 `object_tag_index` 的 user 对象索引，供 shared-tags、推荐解释与小趣助手复用。
    reason: |
      旧资料编辑页内嵌标签选择依赖端侧 suggestion 与 `Topic/兴趣/*` mock 路径，无法支撑职业事实标签、
      兴趣偏好标签、交集索引与四环境数据集成同源。本 CR 将职业/兴趣标签统一收敛到
      `quwoquan_data/publish/tags` → tag-service import → App 查询/保存的闭环。
