entries:
  - timestamp: "2026-06-25T02:40:00+08:00"
    summary: |
      收口图片创作链路的三处共享语义：图片选择器已选缩略条左对齐、图片编辑器缩略条左对齐且 reveal-not-center、
      创作页图片模式顶栏标题统一为“图片创作”。同时冻结拖拽悬停阶段的即时让位反馈，要求创作页网格、选择器缩略条
      和编辑器缩略条共用同一重排几何真相源。
    reason: |
      现状虽然已有统一拖拽组件，但三个触点仍存在视觉与交互漂移：缩略条内容较少时呈现居中感、图片编辑器会把当前图
      强制滚动到中间、创作页图片模式标题仍是通用“创作”且首屏被弱化。若不先把规格、验收与页面质量口径写回真相源，
      后续很容易在局部修 UI 时再次分叉出三套 drag 行为和标题语义。
