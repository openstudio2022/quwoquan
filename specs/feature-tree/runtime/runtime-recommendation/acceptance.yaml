version: 2
node:
  id: runtime-recommendation
  level: L2_business_capability
  path: specs/feature-tree/runtime/runtime-recommendation
  title: runtime recommendation
  parent_domain_service: runtime
  parent_business_capability: runtime-recommendation
scope:
  summary: 推荐运行时基础能力验收，覆盖 HotPath、SessionCache、Engine、Scorer、Rerank、降级与可观测。
  in_scope:
  - Redis HotPath session 状态、negative/exposed/tag weights/realtime interest。
  - 7 阶段 Engine 管线、多源召回、预排、过滤、特征组装、打分、重排。
  - RuleScorer、RemoteModelScorer、CascadeScorer fallback。
  - MMR/UCB1 探索、多样性、冷启动保底、SessionCache 与 BufferedHotPath。
  out_of_scope:
  - 首页 feed IA、频道布局、页面 route/surface；归 discovery-content/feed-orchestration-recommendation。
  - 深度排序模型平台轨与双塔 ANN 在线服务。
sit_acceptance:
  SIT1:
    title: runtime recommendation 引擎能力 SIT
    story_refs:
    - runtime/runtime-recommendation/dual-channel-recommendation-engine
    done_when:
    - HotPath 处理 impression/engagement/dislike 后，SessionState 中 exposed/negative/tagWeights
      与实时兴趣可被读取。
    - Engine 7 阶段管线在召回源超时、模型 scorer 失败、候选重复、冷启动等场景下仍返回稳定结果或明确空态。
    - RuleScorer 消费用户特征、交集信号、搜索意图、负反馈惩罚、UCB1 探索和 MMR 多样性。
    - SessionCache、BufferedHotPath、Redis key hash-tag 与 pipeline/parallel 路径一致性有测试证据。
    performance_points:
    - HotPath 行为上报生效延迟 < 100ms。
    - Feed P95 <= 200ms，P99 <= 400ms（业务侧 SLO 引用 rec_slo.yaml）。
    tests:
      planned: []
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.runtime.runtime_recommendation.sit1.sit1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.runtime.runtime_recommendation.sit1.sit1_local_contract
        envs: *id001
      - layer: api_integration
        suite: sit1_api_integration
        cases:
        - api_integration.runtime.runtime_recommendation.sit1.sit1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/engine_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/bench_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/feed_type_contract_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/engagement_depth_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/intersection_fusion_test.go'
