version: 2
node:
  id: global-route-edge-pop-contract
  level: L3_story
  path: specs/feature-tree/runtime/native-edge-gesture-navigation/global-route-edge-pop-contract
  title: global route edge pop contract
  parent_domain_service: runtime
  parent_business_capability: native-edge-gesture-navigation
scope:
  summary: 全局无底栏页面原生边缘返回上一页。
  in_scope:
  - ordinary non-bottom-nav route page factory
  - platform native back policy
  - explicit special-page back guard boundary
  out_of_scope:
  - unsaved form leave protection internals
gwt_acceptance:
  GWT_GLOBAL_ROUTE_EDGE_POP:
    title: 无底栏页面通过平台原生边缘手势返回上一页
    given:
    - 用户位于非底栏根路由，且 Router 栈存在上一页。
    when:
    - 用户发起平台原生 back 手势。
    then:
    - App 返回上一页，不退出应用，不跳转硬编码兜底 tab。
    done_when:
    - 普通非 shell 页面通过 AppRoutePageFactory 构造平台 Page。
    - iOS 普通页面使用 CupertinoPage 承载并支持 leading-edge interactive pop。
    - Android 普通页面经系统 back / predictive back 返回上一页。
    - 特殊页面通过 route kind 或 AppBackGuard 显式登记。
    edge_cases:
    - 全屏搜索结果页返回搜索页。
    - 内容详情页返回来源 feed。
    - 聊天详情页返回消息 tab 或搜索锚点来源。
    - 业务 guard 拦截后不触发 root exit guard。
    platform_variants:
      iOS:
      - leading-edge interactive pop only
      Android:
      - left and right edge back gestures
      - predictive back or system back dispatcher
    contract_refs:
    - AppRoutePageFactory contract
    - NativeBackNavigationPolicy contract
    - AppBackGuard contract
    performance_points:
    - route pop first feedback <= 100ms
    - no visible jank during route pop animation
    tests:
      planned:
      - file: quwoquan_app/test/app/navigation/native_back_navigation_policy_test.dart
      - file: quwoquan_app/test/app/navigation/app_route_page_factory_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.runtime.native_edge_gesture_navigation.global_route_edge_pop_contract.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt_global_route_edge_pop_local_contract
        cases:
        - local_contract.runtime.native_edge_gesture_navigation.global_route_edge_pop_contract.gwt_global_route_edge_pop_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: route_integration
        cases:
        - api_integration.runtime.native_edge_gesture_navigation.global_route_edge_pop_contract.route_integration
        envs:
        - beta
        - gamma
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.runtime.native_edge_gesture_navigation.global_route_edge_pop_contract.user_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_app/test/app/navigation/app_router_edge_pop_contract_test.dart'
