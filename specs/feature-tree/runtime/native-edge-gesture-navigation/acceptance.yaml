  level: L2_business_capability
  path: specs/feature-tree/runtime/native-edge-gesture-navigation
  title: native edge gesture navigation
  parent_domain_service: runtime
scope:
  summary: iOS/Android 边缘手势导航能力 SIT。
  in_scope:
  - global route edge pop contract
  - immersive media edge swipe back
  - home edge swipe exit guard
  out_of_scope:
  - system-level OS gesture settings
sit_acceptance:
  SIT_EDGE_SWIPE:
    title: 边缘手势导航能力 SIT
    story_refs:
    - global-route-edge-pop-contract
    - immersive-media-edge-swipe-back
    - home-edge-swipe-exit-guard
    capability_boundary:
      owns:
      - platform anti-corruption back policy
      - route page factory
      - app shell edge back policy
      - root page exit guard state machine
      - immersive viewer edge-back conflict arbitration
      does_not_own:
      - media content paging business rules
      - platform OS gesture global settings
    conflict_matrix:
    - conflict: MaterialApp.router default route vs iOS interactive pop
      resolution: ordinary non-shell routes are built through AppRoutePageFactory and become CupertinoPage on iOS
    - conflict: immersive media horizontal paging vs edge back
      resolution: edge hot zone triggers back; non-edge horizontal drag remains media paging
    - conflict: home root edge back vs accidental app exit
      resolution: Android first gesture shows guard; second gesture within 2 seconds exits; iOS root does not exit
    done_when:
    - Ordinary non-bottom-nav pages can return to the previous route through platform-native back gestures.
    - iOS leading-edge pop and Android left/right back gestures follow platform expectations.
    - Android home root exit guard blocks accidental first exit.
    - Immersive media viewer returns without misfiring media page swipe.
    performance_points:
    - action-to-feedback latency <= 100ms
    - no visible jank during route pop animation
    - false-positive conflict cases covered by tests
    evidence:
      primary:
      - T2_module_interaction
      - T3_route_integration
      supporting:
      - T1_static_contract
      - T4_user_journey
    tests:
      planned:
      - quwoquan_app/test/app/navigation/native_back_navigation_policy_test.dart
      - quwoquan_app/test/app/navigation/app_route_page_factory_test.dart
      - quwoquan_app/test/ui/content/edge_gesture/immersive_media_edge_swipe_back_test.dart
      - quwoquan_app/test/app/navigation/home_edge_swipe_exit_guard_test.dart
      recorded: []
    status: pending
execution:
