version: 2
node:
  id: native-edge-gesture-navigation
  level: L2_business_capability
  path: specs/feature-tree/runtime/native-edge-gesture-navigation
  title: native edge gesture navigation
  parent_domain_service: runtime
scope:
  summary: iOS/Android 边缘手势导航能力 SIT。
  in_scope:
  - global route edge pop contract
  - immersive media edge swipe back
  - home edge swipe exit guard
  out_of_scope:
  - system-level OS gesture settings
sit_acceptance:
  SIT_EDGE_SWIPE:
    title: 边缘手势导航能力 SIT
    story_refs:
    - global-route-edge-pop-contract
    - immersive-media-edge-swipe-back
    - home-edge-swipe-exit-guard
    capability_boundary:
      owns:
      - platform anti-corruption back policy
      - route page factory
      - app shell edge back policy
      - root page exit guard state machine
      - immersive viewer edge-back conflict arbitration
      does_not_own:
      - media content paging business rules
      - platform OS gesture global settings
    conflict_matrix:
    - conflict: MaterialApp.router default route vs iOS interactive pop
      resolution: ordinary non-shell routes are built through AppRoutePageFactory
        and become CupertinoPage on iOS
    - conflict: immersive media horizontal paging vs edge back
      resolution: edge hot zone triggers back; non-edge horizontal drag remains media
        paging
    - conflict: home root edge back vs accidental app exit
      resolution: Android first gesture shows guard; second gesture within 2 seconds
        exits; iOS root does not exit
    done_when:
    - Ordinary non-bottom-nav pages can return to the previous route through platform-native
      back gestures.
    - iOS leading-edge pop and Android left/right back gestures follow platform expectations.
    - Android home root exit guard blocks accidental first exit.
    - Immersive media viewer returns without misfiring media page swipe.
    performance_points:
    - action-to-feedback latency <= 100ms
    - no visible jank during route pop animation
    - false-positive conflict cases covered by tests
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/app/navigation/native_back_navigation_policy__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/navigation/app_route_page_factory__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit_edge_swipe_local_contract
        cases:
        - local_contract.runtime.native_edge_gesture_navigation.sit_edge_swipe.sit_edge_swipe_local_contract
        envs: &id001
        - local
      - layer: api_integration
        suite: route_integration
        cases:
        - api_integration.runtime.native_edge_gesture_navigation.sit_edge_swipe.route_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: sit_edge_swipe_local_contract
        cases:
        - local_contract.runtime.native_edge_gesture_navigation.sit_edge_swipe.sit_edge_swipe_local_contract
        envs: *id001
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.runtime.native_edge_gesture_navigation.sit_edge_swipe.user_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/content/edge_gesture/immersive_media_edge_swipe_back_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/app/navigation/home_edge_swipe_exit_guard_test.dart'
execution:
