node:
  id: immersive-media-edge-swipe-back
  level: L3_story
  path: specs/feature-tree/runtime/native-edge-gesture-navigation/immersive-media-edge-swipe-back
  title: immersive media edge swipe back
  parent_domain_service: runtime
  parent_business_capability: native-edge-gesture-navigation
scope:
  summary: 沉浸式媒体浏览器边缘滑动返回。
  in_scope:
  - iOS left/right edge swipe
  - Android left/right edge swipe or predictive back equivalent
  out_of_scope:
  - media paging business rules
gwt_acceptance:
  GWT_EDGE_BACK:
    title: 沉浸式媒体边缘滑动返回上一页
    given:
    - 用户已从 feed 或详情页进入沉浸式媒体浏览器。
    when:
    - 用户从屏幕左边缘或右边缘发起返回手势。
    then:
    - App 返回上一页，沉浸式媒体浏览器关闭。
    - 媒体左右翻页不被误触发。
    done_when:
    - iOS 与 Android 均验证边缘返回成功。
    - 返回动画无可见卡顿。
    edge_cases:
    - 手势从非边缘区域开始时继续媒体横滑。
    - 手势取消时停留在沉浸媒体浏览器。
    platform_variants:
      iOS:
      - interactive pop edge gesture
      Android:
      - predictive back or system back dispatcher
    contract_refs:
    - App route pop contract
    - Edge gesture policy contract
    performance_points:
    - action-to-feedback latency <= 100ms
    - no visible jank during pop animation
