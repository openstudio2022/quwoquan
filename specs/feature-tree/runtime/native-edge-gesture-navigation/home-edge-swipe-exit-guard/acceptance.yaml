version: 2
node:
  id: home-edge-swipe-exit-guard
  level: L3_story
  path: specs/feature-tree/runtime/native-edge-gesture-navigation/home-edge-swipe-exit-guard
  title: home edge swipe exit guard
  parent_domain_service: runtime
  parent_business_capability: native-edge-gesture-navigation
scope:
  summary: 主页根页边缘滑动退出保护。
  in_scope:
  - first edge swipe guard prompt
  - second edge swipe exit within guard window
  - guard timeout reset
  out_of_scope:
  - unsaved form leave protection
gwt_acceptance:
  GWT_HOME_EXIT_GUARD:
    title: 主页首次边缘滑动提示，二次边缘滑动退出
    given:
    - 用户位于主页根路由，当前没有可 pop 的子页面。
    when:
    - 用户第一次从屏幕左边缘或右边缘发起返回手势。
    then:
    - App 显示再次滑动退出提示，且不退出。
    done_when:
    - 第二次边缘滑动在保护窗口内退出或交给系统返回。
    - 保护窗口超时后再次滑动重新显示提示。
    edge_cases:
    - 保护窗口超时。
    - 用户切换 tab 后保护状态重置。
    - 非根路由边缘滑动直接 pop。
    platform_variants:
      iOS:
      - root route interactive gesture guarded by app shell
      Android:
      - predictive back or system back dispatcher guarded by app shell
    contract_refs:
    - Root route pop contract
    - Exit guard state contract
    performance_points:
    - first prompt appears <= 100ms after gesture begins
    - guard window is deterministic and testable
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.runtime.native_edge_gesture_navigation.home_edge_swipe_exit_guard.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt_home_exit_guard_local_contract
        cases:
        - local_contract.runtime.native_edge_gesture_navigation.home_edge_swipe_exit_guard.gwt_home_exit_guard_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: route_integration
        cases:
        - api_integration.runtime.native_edge_gesture_navigation.home_edge_swipe_exit_guard.route_integration
        envs:
        - beta
        - gamma
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.runtime.native_edge_gesture_navigation.home_edge_swipe_exit_guard.user_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_app/test/app/navigation/home_edge_swipe_exit_guard_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/patrol/edge_swipe_navigation_e2e_test.dart'
