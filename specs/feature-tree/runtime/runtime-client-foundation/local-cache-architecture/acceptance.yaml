    status: planned
    linked_tasks:
      - request-suppression-tests
    tests:
      - file: quwoquan_app/test
        note: 新增 feed/detail/query cache hit/miss 与请求数断言
  A7:
    criteria: 可缓存对象 freshness 字段来自 metadata/codegen；客户端不硬编码第二套 path、operation、surface 或版本字段规则
    status: planned
    linked_tasks:
      - metadata-freshness-alignment
    tests:
      - file: quwoquan_service/contracts/metadata
      - file: quwoquan_app/lib/cloud/runtime/generated
  A8:
    criteria: 图片/头像/封面/正文图入口收口到统一 wrapper，直用 Image.network、NetworkImage、CachedNetworkImage 的 allowlist 只能递减
    status: planned
    linked_tasks:
      - unified-resource-entrypoints
    tests:
      - file: quwoquan_app/scripts/media/verify_app_network_image_surface.py
      - file: specs/gates/app_network_image_policy_allowlist.yaml
  A9:
    criteria: cache hit/miss、network suppression、refresh latency、clear cache result、offline recovery 可被测试或观测读取
    status: planned
    linked_tasks:
      - cache-diagnostics-probe
    tests:
      - file: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/cache-management-runbook.md
  A10:
    criteria: T4 真机覆盖冷启动首页 feed、连续滚动、重复进入详情、头像/封面变更、分层清理缓存后的离线回显
    status: planned
    linked_tasks:
      - cache-t4-evidence
    tests:
      - file: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/cache-management-runbook.md
execution:
  local_gate: "make verify-app-page-horizontal-quality && python3 quwoquan_app/scripts/media/verify_app_network_image_surface.py"
  full_gate: make gate
journey_acceptance:
  - id: A1
    statement: 页面统一消费 CacheReadResult，不自行判断缓存来源与新鲜度
    t_layers: [T1, T2]
  - id: A2
    statement: 业务对象策略统一登记并可被开发和测试复用
    t_layers: [T1]
  - id: A3
    statement: 用户分层清理不会删除草稿、待发送消息、outbox、账号凭证
    t_layers: [T2, T4]
scenario_acceptance:
  - id: S1
    statement: 离线冷启动可展示最近 feed/query/detail 快照并标识离线状态
    t_layers: [T2, T4]
  - id: S2
    statement: 恢复网络后对象版本更新并与本地 overlay 合并
    t_layers: [T2, T3]
  - id: S3
    statement: 清理临时图片和视频后，post metadata 与头像 URL 仍可回显
    t_layers: [T2, T4]
evidence_matrix:
  T1:
    - type: doc
      artifact: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/spec.md
    - type: doc
      artifact: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/design.md
    - type: doc
      artifact: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/object-cache-policy.yaml
    - type: doc
      artifact: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/cache-inventory.md
    - type: doc
      artifact: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/cache-management-runbook.md
  T2:
    - type: planned_test
      note: ObjectCacheStore、QuerySnapshotStore、ResourceCacheController、CacheManagementService 单元测试
    - type: planned_test
      note: feed/detail/query stale-while-revalidate widget/provider 测试
  T3:
    - type: planned_test
      note: RemoteRepository 版本字段、sync patch/outbox 合并、弱网恢复集成测试
  T4:
    - type: manual_evidence
      note: 真机 flutter run 录屏与抓包，覆盖冷启动、滚动、重复详情、清理缓存、离线恢复
