version: 2
node:
  id: local-cache-architecture
  level: L3_story
  path: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture
  title: local cache architecture
  parent_domain_service: runtime
  parent_business_capability: runtime-client-foundation
scope:
  summary: 本地对象缓存、查询快照、资源预算入口与清理语义的端侧验收范围。
  in_scope:
  - QuerySnapshot 持久化与 stale-while-revalidate 命中
  - Post/User 最小对象快照复用
  - 图片 preset 入口与媒体缓存轻量本地优先
  - 快速滑动下视频单活跃与资源预取抑制
  out_of_scope:
  - 完整离线视频平台
  - 预测式大规模预下载
  - 业务 UI 内平台分支
gwt_acceptance:
  GWT1:
    title: QuerySnapshot 短退重启与频道切换复用
    given:
    - 用户已浏览首页推荐、精品或个人作品第一页，ContentRepository 已写入 query snapshot。
    when:
    - 用户频道切换、回滑、短退重启，或在 profile works 区再次打开已看内容列表。
    then:
    - 端侧先回显 snapshot 中的 post 文本、作者快照、互动计数与 cursor，再后台刷新；命中 fresh snapshot 时不重复请求远端。
    done_when:
    - feed 与 userPosts 共用 ContentQuerySnapshotStore，清理临时资源不删除 post metadata，离线内容清理可删除
      query snapshot。
    edge_cases:
    - snapshot 过期时 stale-while-revalidate 不阻塞 UI。
    - 媒体字节不存在时展示占位并在网络恢复后重拉。
    contract_refs:
    - object-cache-policy.yaml#objects.QuerySnapshot
    - object-cache-policy.yaml#objects.Post
    performance_points:
    - 回滑和频道切换避免重复远端请求。
    - 快速滑动不触发多视频并发初始化。
    tests:
