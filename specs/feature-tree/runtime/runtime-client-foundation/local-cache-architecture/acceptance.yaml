    - A7_contract_metadata_consistency
    - A9_runtime_observability
  notes: 本 L3 冻结对象级缓存、查询快照、资源缓存、同步一致性、分层清理与验证看护；首版不强制全局 ETag/304
  A1:
    criteria: 统一 CacheReadResult 输出合同、对象策略模板、分层模型、清理入口规格已冻结
    status: planned
    linked_tasks:
      - cache-spec-baseline
    tests:
      - file: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/spec.md
      - file: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/object-cache-policy.yaml
  A2:
    criteria: 设计文档明确 ObjectCacheStore、QuerySnapshotStore、ResourceCacheController、CacheManagementService、CacheRepositoryDecorator 的职责边界
    status: planned
    linked_tasks:
      - cache-design-baseline
    tests:
      - file: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/design.md
  A3:
    criteria: inventory 覆盖 post、用户、会话、评论、媒体资源、feed/search/profile/circle query snapshot 的当前状态与缺口
    status: planned
    linked_tasks:
      - cache-inventory-baseline
    tests:
      - file: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/cache-inventory.md
  A4:
    criteria: 用户可见分层清理入口具备释放空间估算、影响说明、二次确认、保护对象边界与完成统计
    status: planned
    linked_tasks:
      - cache-management-entry
    tests:
      - file: specs/feature-tree/runtime/runtime-client-foundation/local-cache-architecture/cache-management-runbook.md
  A5:
    criteria: 业务对象特性树已登记对象级缓存章节，且指向统一对象策略
    status: planned
    linked_tasks:
      - business-feature-cache-specs
    tests:
      - file: specs/feature-tree/discovery-content/publish-comment-reaction/post-create-update/spec.md
      - file: specs/feature-tree/discovery-content/publish-comment-reaction/comment-thread/spec.md
      - file: specs/feature-tree/user-identity-profile-relationship/auth-profile-snapshot/profile-read-update/spec.md
      - file: specs/feature-tree/chat-conversation/chat-experience-optimization/chat-list-local-cache/spec.md
      - file: specs/feature-tree/runtime/runtime-media/spec.md
      - file: specs/feature-tree/discovery-content/feed-orchestration-recommendation/unified-items-cursor/spec.md
