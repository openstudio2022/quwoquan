version: 2
node:
  id: cross-platform-portability
  level: L3_story
  path: specs/feature-tree/runtime/runtime-client-foundation/cross-platform-portability
  title: cross platform portability
  parent_domain_service: runtime
  parent_business_capability: runtime-client-foundation
scope:
  summary: 跨平台可移植架构验收范围。
  in_scope:
  - 平台能力防腐层。
  - 体验一致性契约。
  - Web 宽屏和安装提示基线。
  - 跨平台测试 profile 与门禁证据口径。
  out_of_scope:
  - 鸿蒙原生工程。
  - Web 全量宽屏壳。
  - RTC/来电/原生视频编辑的平台实现。
gwt_acceptance:
  GWT1:
    title: 跨平台能力防腐层成立
    given:
    - 业务页面需要判断文件、相册、相机、RTC、宽屏、安装提示等能力。
    when:
    - 页面或服务读取平台能力。
    then:
    - 调用方只消费 PlatformCapabilities、AppPlatform、FileStorageGateway 或 NativeBridge 防腐层。
    done_when:
    - 业务层不新增直接平台分支。
    - 不支持的能力通过统一 RuntimeFailure 或能力不可用语义降级。
    edge_cases:
    - Web 无本地随机文件系统。
    - 新平台默认关闭高风险能力。
    contract_refs:
    - specs/feature-tree/runtime/runtime-client-foundation/cross-platform-portability/spec.md
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.runtime.runtime_client_foundation.cross_platform_portability.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.cross_platform_portability.gwt1_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_app/test/core/platform/platform_capabilities_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/app/shell/web_app_install_banner_test.dart'
execution:
