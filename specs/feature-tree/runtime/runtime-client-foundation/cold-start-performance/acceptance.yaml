        overlay_removed_over_6000_count: 0
        replay_count: 0
        artifact: .qwq_output/env/alpha/runs/startup_first_frame/web_probe/20260715T205250/startup_web_report.json
      pending:
      - Android petal_bloom profile/release 真机 20 次冷启动与完整录像
      - iPhone petal_bloom profile/release 真机 20 次冷启动与完整录像
      - 旧 petal hinge 版本时长报告不得作为当前视觉规格验收证据
  GWT6:
    title: 启动故障终态与跨端遥测闭环
    given:
    - 缺失运行时端点、Welcome observer 抛错、Router future 永不完成或抛错、native 首帧未确认
    - 启动发生在离线、游客、登录切换、Web pagehide 或下一次成功启动补传条件下
    when:
    - bootstrap、Root/Welcome、Router、原生 watchdog 和 startup reporter 的异步分支竞争
    then:
    - 每次启动恰好进入 `routerShell`、`safeRecovery` 或 `nativeRecovery` 一个终态，不能永久停在原生 LaunchScreen、Flutter Welcome 或空白页
    - 配置失败在 Flutter 恢复根显示脱敏结构化错误；Router 失败可重试并创建新的受控加载尝试
    - native watchdog 只在 renderer 首帧确认前且前台预算耗尽时显示恢复面；Flutter 首帧已到但 safe terminal 较慢时只记录结构化 slow terminal，不得覆盖 Flutter 页面
    - 同一 attempt 从首次 arm 起只使用一个单调时钟 origin；native clock hydration 不得重新 arm、rebase 或改变 deadline
    - 同一 `attemptId` 的 native、Dart、Router、Shell、恢复和 summary 事件可按稳定 eventId 精确一次关联
    - 原生重试生成新的 attemptId，旧 watchdog/journal 不得影响新 Activity；`Activity.recreate()` 不得作为进程冷启动证据
    - journal 仅在完整 ACK 后删除；零 ACK、部分 ACK、离线、认证切换及 Web 重载均保留待补传记录
    - 请求、本地 journal、Mongo 和 ES 都不含邮箱、手机号、token、原始异常、堆栈或业务文本
    done_when:
    - local_contract、真实 API 接收/幂等/投影集成和 Android/iPhone/Web 故障 UAT 都有可复验记录
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/app/bootstrap_recovery__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_state_machine__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_telemetry__local_contract_test.dart
