version: 4
node:
  id: cold-start-performance
  level: L3_story
  path: specs/feature-tree/runtime/runtime-client-foundation/cold-start-performance
  title: cold start performance
  parent_domain_service: runtime
  parent_business_capability: runtime-client-foundation
scope:
  summary: Flutter 唯一逐瓣绽放动效、3 秒正常目标、6 秒硬退出、原生同源静态终态与全链路观测。
  in_scope:
  - Android/iOS 自适应背景与同源透明品牌簇，Web 最早 bootstrap 计时
  - 单控制器全开到逆序聚拢再顺时针逐瓣绽放、最多两次重放与单行提示
  - process start 到 welcome exit 的 6 秒硬门与 0.65 压缩下限
  - deferred Router 并行预加载、安全 Shell、120ms 欢迎终帧淡出与 overlay terminal fallback
  - startup_welcome_sequence、帧耗时与重放/降级/deadline 发布 UAT 硬门
  - pre-runApp 配置失败恢复根、Router 超时/异常安全终态与 Android/iOS 原生首帧 watchdog
  - "`StartupAttempt` 本地 journal、受限匿名启动遥测接收、SLS/Prometheus 投影与补传"
  out_of_scope:
  - native 动态欢迎、overlay、提示或动画进度 handoff
  - 等待首页、聊天、资料等业务数据后才进入 Shell
gwt_acceptance:
  GWT1:
    title: 原生静态终态与 Flutter 第一帧连续
    given:
    - 应用从 Android、iOS 或 Web 冷启动
    when:
    - 原生启动资源切换到 Flutter WelcomeScreen 第一帧
    then:
    - 原生只有自适应背景与同源透明品牌簇，不存在第二套动态欢迎
    - iOS 背景使用可拉伸三段渐变纹理，不使用固定 393x852 全屏快照
    - Android 12+ 系统 splash 至少显示同源静态花瓣 icon，不得退化成纯蓝空屏
    - Flutter 第一帧 bloomAmount=1，保持 90ms 后开始逆序聚拢
    - bloomAmount=1 不应用动态变换，不出现尺寸或位置跳变
    - 图一高保仅作视觉参考，不烘焙截图文字；背景为上亮下深品牌蓝，花朵约屏宽 40% 且 clamp 132~168dp，slogan 为 Noto Sans SC 32sp/600 近白单色
    - Noto Sans SC 的 OFL-1.1、固定上游 commit 与 SHA-256 校验通过，不存在待替换品牌字体或未知授权字体
    - 欢迎页、登录页品牌标与应用图标消费同一 WelcomeAppearance；不存在 vivid/opacity 第二终态
    - Android launch_background 与启动色由原生资产生成器从 Dart token 生成，四套 drawable 和 Android 12 色值不得漂移
    - 花苞视觉因子为 0.561024，花瓣宽高比相对 52:94 偏差不超过 0.5%
    - 聚拢顺序严格为 7→0，绽放顺序严格为 0→7
    - 开放 50% 时最大与最小花瓣视觉因子差至少 0.20
    - 聚拢时每片花瓣质心半径单调减小，绽放时单调增加
    - 不存在 rotateX/Y、透视、单轴伸缩、spring 或 overshoot
    done_when:
    - native launch、字体授权、视觉 token、几何/波次合同与新 Golden 通过，并有 Android/iPhone profile/release 完整录像证据
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/app/startup_native_launch_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_motion_golden__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_welcome_motion_probe__local_contract_test.py
      recorded:
      - file: quwoquan_app/test/local_contract/app/startup_native_launch_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_motion_golden__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_welcome_motion_probe__local_contract_test.py
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: startup_native_flutter_handoff
        cases:
        - local_contract.runtime.runtime_client_foundation.cold_start_performance.handoff
        envs: [local]
  GWT2:
    title: 正常一轮退出与最多两次重放
    given:
    - Flutter WelcomeScreen 第一帧稳定
    when:
    - readiness 在首轮前或首轮任意阶段到达，或者持续未 ready
    then:
    - readiness 只在 openSettle 全开边界生效
    - 首轮 ready 时约 1480ms 后进入 Shell，不等待 6 秒
    - 未 ready 时才显示单行提示，最多 replay 2 后进入降级 Shell
    - onFinish 在所有竞争条件下恰好调用一次
    done_when:
    - fake clock 状态机 local_contract 通过
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/app_startup_welcome__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/app_startup_welcome__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: startup_welcome_state_machine
        cases:
        - local_contract.runtime.runtime_client_foundation.cold_start_performance.motion
        envs: [local]
  GWT3:
    title: 6 秒硬退出与安全 Shell
    given:
    - 首帧偏晚、预算不足、永久不 ready、reduced motion 或后台恢复
    when:
    - 剩余预算和 deadline 与动画阶段竞争
    then:
    - 足够 0.65 周期时同比压缩单瓣时长与 stagger，但仍完整聚拢再绽放
    - 不足时保持全开短停并进入降级 Shell
    - Router 构建失败显示可操作安全 Shell，不回到欢迎页
    - 任一可控场景 welcomeExitMs 不超过 6000
    - Shell 首帧后欢迎层在 120ms 内移除，overlayRemovedMs 不超过 6000
    done_when:
    - deadline、lifecycle、fallback local_contract 通过
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_deferred_router__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/welcome/welcome_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_deferred_router__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: startup_deadline_and_safe_shell
        cases:
        - local_contract.runtime.runtime_client_foundation.cold_start_performance.deadline
        envs: [local]
  GWT4:
    title: 启动阶段可观测且可告警
    given:
    - 欢迎页进入任一 phase、replay、degraded 或 deadline
    when:
    - startup_welcome_sequence 上报
    then:
    - 包含 motionSpec=petal_bloom、cycle、预算、readiness、提示、压缩、帧 P95、exitReason 与 deadlineOrigin
    - Shell 首帧记录 shellFirstPaintMs
    - 欢迎层实际移除记录 overlayRemovedMs
    - home_feed_first_usable 仅在默认推荐非空内容首帧和欢迎遮罩移除均完成后记录，Router/Provider 成功、空态、错误态与后台页不得伪造
    - replay、降级、欢迎退出/遮罩移除超 6 秒与连续慢帧可配置告警
    - 受限启动遥测真实生成 `ops_startup_phase_total` 与
      `ops_startup_phase_duration_seconds`；仪表盘按 platform/runtime_env 查看首帧、
      Shell、terminal 漏斗、recovery 与 journal_drop，attemptId 不作为指标标签
    done_when:
    - 埋点字段合同与 startup probe 通过
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/app/startup_native_launch_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_ttid__local_contract_test.dart
      - file: quwoquan_ops/tests/local_contract/test_startup_welcome_observability__local_contract_test.py
      - file: quwoquan_app/test/local_contract/app/startup_probe_parser__local_contract_test.py
      recorded:
      - file: quwoquan_app/test/local_contract/app/startup_native_launch_screen__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/startup_ttid__local_contract_test.dart
      - file: quwoquan_ops/tests/local_contract/test_startup_welcome_observability__local_contract_test.py
      - file: quwoquan_app/test/local_contract/app/startup_probe_parser__local_contract_test.py
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: startup_observability_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.cold_start_performance.observability
        envs: [local]
  GWT5:
    title: Android、iPhone 与 Web 商用启动时长 UAT
    given:
    - Android 与 iPhone profile/release 真机，以及 Web profile/release
    when:
    - 各执行至少 20 次冷启动或硬刷新，并注入 2s、3s、4.5s、5.5s、永久不 ready
    then:
    - TTID P50 不超过 1s、P95 不超过 2s
    - 正常 shellFirstPaint 目标不超过 3s
    - welcomeExit 超 6 秒比例为 0
    - overlayRemovedMs 缺失或超 6 秒比例为 0
    - 自动采集并验证原生静态帧、Flutter 首帧、花苞峰值、逐瓣绽放、最终全开、Shell 首帧顺序
    - 动效探针逐帧分割八种花瓣颜色并校验定向包围盒宽高比、质心半径、顺序和帧间位移
    - 动效 raster P95 不超过 16.7ms，连续两帧超过 32ms 必须告警
    done_when:
    - Android/iPhone 真机与 Web 各 20 次证据入库；模拟器不得替代真机
    tests:
      planned:
      - file: quwoquan_app/scripts/device/verify_startup_first_frame.py
      - file: quwoquan_app/scripts/device/verify_startup_ttid_baseline.py
      - file: quwoquan_app/scripts/device/verify_startup_web.py
      - file: quwoquan_app/scripts/device/verify_welcome_motion_frames.py
      recorded:
      - file: quwoquan_app/test/user_acceptance/quality/performance/startup_web_3s_6s_report__user_acceptance_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: user_acceptance
        execution_profile: release
        suite: startup_3s_6s_release_probe
        cases:
        - user_acceptance.runtime.runtime_client_foundation.cold_start_performance.release_sla
        envs: [gamma_local]
      evidence:
      - platform: web
        motion_spec: petal_bloom
        runs: 20
        result: passed
        ttid_p50_ms: 557
        ttid_p95_ms: 709
        shell_first_paint_p50_ms: 2197
        shell_first_paint_p95_ms: 2409
        overlay_removed_p50_ms: 2318
        overlay_removed_p95_ms: 2531
