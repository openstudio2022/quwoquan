version: 2
node:
  id: app-remote-config
  level: L3_story
  path: specs/feature-tree/runtime/runtime-client-foundation/app-remote-config
  title: App 远程运营配置
  parent_domain_service: runtime
  parent_business_capability: runtime-client-foundation
scope:
  summary: 统一 App 远程运营配置的 schema、缓存、激活、投影、灰度与验收。
  in_scope:
    - AppRemoteConfig 字段目录与 schema 风险分级
    - /v1/config/app 元信息增强与规范投影
    - 端侧 LKG 缓存、后台刷新与消费者收口
    - 配置发布、漂移、灰度、回滚观测契约
  out_of_scope:
    - gateway/CDN/auth/secret/payment/security policy 热更新
    - 控制面完整 UI 实现
    - 第三方 Remote Config SaaS 接入
gwt_acceptance:
  GWT1:
    title: 启动不阻塞且有默认可用配置
    given:
      - 首次安装且本地没有远程配置缓存
      - /v1/config/app 网络不可达
    when:
      - App 冷启动进入欢迎页和首页
    then:
      - 首帧不等待远程配置
      - 首页频道、评论、feature flag 使用 codegen defaults
      - 不出现白屏或阻塞性配置错误
    done_when:
      - 冷启动首帧可在无远程配置的情况下正常进入欢迎页和首页
      - 首页频道、评论与 feature flag 由本地默认值提供
      - 远程配置失败不会阻塞首帧或产生白屏
    edge_cases:
      - 无网络
      - 本地无缓存
      - 远程配置 schema 不兼容
    contract_refs:
      - /v1/config/app
      - AppRemoteConfigSnapshot
    performance_points:
      - 首帧不得等待远程配置网络请求
      - 冷启动期间配置拉取只能后台进行
    evidence:
      primary: [T2_module_interaction]
      supporting: [T1_static_contract]
    tests:
      planned:
        - quwoquan_app/test/core/providers/app_remote_config_provider_test.dart
      recorded:
        - quwoquan_app/test/core/providers/app_remote_config_provider_test.dart
    status: implemented
  GWT2:
    title: LKG 优先和后台刷新
    given:
      - 本地存在上一份稳定配置
    when:
      - App 启动后远程返回新 configHash
    then:
      - 启动立即激活 LKG
      - 普通字段写入 pending next-session
      - 当前会话不发生首页频道结构跳变
    done_when:
      - 启动后优先使用磁盘 LKG 作为 active 配置
      - 远程 fresh 配置仅在后台刷新并进入 pending
      - 当前会话内不会出现频道结构跳变
    edge_cases:
      - 远程返回更早发布包
      - 远程返回无效 hash
      - LKG 与网络 fresh 不一致
    contract_refs:
      - AppRemoteConfigStore
      - AppRemoteConfigSnapshot.activationPolicy
    performance_points:
      - LKG 命中不应增加首帧等待
      - 后台刷新不应阻塞页面构建
    evidence:
      primary: [T2_module_interaction]
    tests:
      planned:
        - quwoquan_app/test/core/providers/app_remote_config_provider_test.dart
      recorded:
        - quwoquan_app/test/core/providers/app_remote_config_provider_test.dart
    status: implemented
  GWT3:
    title: 配置接口统一消费
    given:
      - 评论输入、评论列表、首页频道和交集卡都需要配置
    when:
      - 页面首次构建
    then:
      - 组件不得直接重复拉取 /v1/config/app
      - 配置均从 AppRemoteConfig/contentRuntime facade 读取
    done_when:
      - comment/home/intersection 等消费者统一走 AppRemoteConfig facade
      - 页面构建过程中不再重复拉取 /v1/config/app
      - 新配置字段通过统一 provider 下发到消费者
    edge_cases:
      - 消费者在无配置时回退到默认值
      - 同一会话内多次访问不会重复请求
    contract_refs:
      - /v1/config/app
      - contentRuntimeConfigProvider
      - AppRemoteConfig
    performance_points:
      - 配置消费不应造成页面二次网络请求
      - 页面首构只允许读取内存或磁盘快照
    evidence:
      primary: [T1_static_contract, T2_module_interaction]
    tests:
      planned:
        - python3 quwoquan_app/scripts/runtime/verify_app_remote_config_contract.py
        - quwoquan_app/test/ui/content/providers/comment_provider_test.dart
      recorded:
        - quwoquan_app/scripts/runtime/verify_app_remote_config_contract.py
        - quwoquan_app/test/ui/content/post/contract/content_runtime_config_provider_test.dart
    status: implemented
  GWT4:
    title: 服务端快照可缓存可回滚
    given:
      - 控制面发布新配置包
    when:
      - 客户端请求 /v1/config/app
    then:
      - 响应包含 schemaVersion/packageVersion/configHash/maxAgeSec
      - ETag 可用于未变更轻响应
      - 回滚后新会话获得回滚版本 hash
    done_when:
      - /v1/config/app 响应包含可审计的快照元信息
      - ETag 命中时可返回轻响应
      - 回滚后新会话拿到回滚后的 packageVersion / configHash
    edge_cases:
      - 配置包被拒绝发布
      - ETag 未命中
      - 回滚后客户端仍持有旧缓存
    contract_refs:
      - /v1/config/app
      - AppRemoteConfigSnapshot
      - ConfigProjectionService
    performance_points:
      - 未变更配置应走轻响应
      - 快照投影与缓存命中不应拉高 p95
    evidence:
      primary: [T3_app_api_integration]
      supporting: [T1_static_contract]
    tests:
      planned:
        - quwoquan_service/services/content-service/tests/post_comment_contract_test.go
      recorded:
        - quwoquan_service/services/content-service/tests/post_comment_contract_test.go
    status: implemented
execution:
  local_gate:
    - python3 quwoquan_app/scripts/runtime/verify_app_remote_config_contract.py
    - cd quwoquan_app && flutter test test/core/providers/app_remote_config_provider_test.dart test/ui/content/providers/comment_provider_test.dart
  full_gate:
    - make gate
