version: 2
node:
  id: external-inbound-deeplink-routing
  level: L3_story
  path: specs/feature-tree/runtime/runtime-client-foundation/external-inbound-deeplink-routing
  title: external inbound deeplink routing
  parent_domain_service: runtime
  parent_business_capability: runtime-client-foundation
scope:
  summary: 把站外链接/二维码/口令可靠回流到 App 目标页，覆盖微信内唤起、拦截兜底、未装下载后延迟深链还原。
  journey_scenarios:
  - external-inbound-deeplink-return
  in_scope:
  - iOS Universal Link / Android App Links / 鸿蒙 / scheme 注册矩阵与 path 约定。
  - 端侧 DeepLinkResolver 入站解析、反查实体、路由跳转与失败降级。
  - 微信内 wx-open-launch-app / Universal Link 唤起与拦截检测确定性兜底。
  - 延迟深链方案分层与第三方 SDK 选型决策框架。
  - PlatformCapabilities 能力位与 NativeBridge 接口契约。
  out_of_scope:
  - 分享面板/卡片/海报/口令生成。
  - 公开 HTML/SEO 渲染实现。
  - 链接结构定义（entity-link-templates-metadata）。
gwt_acceptance:
  GWT1:
    title: 已安装设备点击外链直达 App 目标页（5 类对象）
    given:
    - 用户已安装 App，在浏览器或微信内看到内容/实体/用户/圈子/我的链接或二维码。
    when:
    - 用户点击 HTTPS Universal Link / App Links 或扫码进入中转页。
    then:
    - DeepLinkResolver 反查 link_templates 实体行并跳转对应 GoRouter 目标页。
    - 透传 referralSource/feedRequestId，归因参数被剥离交埋点不参与 route 匹配。
    done_when:
    - post（article/photo/video/micro）、circle、user、entity_homepage 五类目标都能直达。
    edge_cases:
    - 冷启动（App 未运行）在路由就绪后重放 pending link。
    - 未知 path/实体不存在降级首页并上报 RuntimeFailure。
    platform_variants:
      iOS:
      - Universal Link 首选，scheme 兜底；UL paths 带通配符不带 query。
      Android:
      - App Links autoVerify 首选，scheme 兜底。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml
    - runtime/errors
    performance_points:
    - 点击到目标页可见 P95 <= 2.5s。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.external_inbound_deeplink_routing.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.external_inbound_deeplink_routing.gwt1_local_contract
        envs: *id001
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.runtime.runtime_client_foundation.external_inbound_deeplink_routing.user_journey
        envs: &id002
        - gamma
    notes:
    - '[migrated_from_planned] quwoquan_app/test/runtime/deeplink/deep_link_resolver_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/runtime/deeplink/deep_link_cold_start_replay_test.dart'
  GWT2:
    title: 微信内唤起按平台分流且拦截有确定性兜底
    given:
    - 用户在微信会话/朋友圈点击 quwoquan 链接或中转页。
    when:
    - 中转页识别 UA（MicroMessenger/iOS/Android/鸿蒙）并触发唤起。
    then:
    - Android/鸿蒙走 wx-open-launch-app，iOS 走 Universal Link。
    - 唤起失败（未关联/未安装/版本过低/超时）按阶梯降级：浏览器打开引导 → 下载页+延迟深链 → web 预览（仅 public）。
    done_when:
    - 每种失败路径都有明确 UI 与文案，无静默失败。
    edge_cases:
    - wx-open-launch-app error 事件被监听并降级。
    - iOS UL 未就绪（checkUniversalLinkReady 失败）展示兜底引导。
    platform_variants:
      iOS:
      - 微信内 Universal Link 唤起 + UL 回调检测。
      Android:
      - 微信开放标签 + error 事件检测。
    contract_refs:
    - specs/feature-tree/runtime/runtime-client-foundation/external-inbound-deeplink-routing/spec.md
    - runtime/errors
    performance_points:
    - 微信内已安装唤起成功率 >= 95%。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.external_inbound_deeplink_routing.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.runtime.runtime_client_foundation.external_inbound_deeplink_routing.user_journey
        envs: *id002
    notes:
    - '[migrated_from_planned] quwoquan_app/test/runtime/deeplink/wechat_launch_strategy_test.dart'
    - '[migrated_from_planned] quwoquan_app/integration_test/wechat_launch_journey_test.dart'
  GWT3:
    title: 未安装下载后延迟深链还原原始目标
    given:
    - 用户未安装 App，点击外链/二维码/口令。
    when:
    - 用户被引导到应用商店，下载安装后首次启动。
    then:
    - 首启通过延迟深链（Android Install Referrer / iOS 指纹对撞 / 受控剪贴板口令）还原原始 target_entity/target_id。
    - 携带 share_id/inviter/utm 归因，安装来源可统计。
    done_when:
    - 至少一条还原路径在 Android 与 iOS 各通过端到端验证。
    edge_cases:
    - 隐私受限时用 UIPasteControl 用户主动粘贴口令兜底。
    - 还原上下文有 TTL，消费后清除。
    platform_variants:
      iOS:
      - 指纹聚类对撞 + 口令兜底。
      Android:
      - Install Referrer 系统通道优先。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points:
    - 安装后参数找回率 >= 90%。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.external_inbound_deeplink_routing.gwt3_local_contract
        envs: *id001
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.runtime.runtime_client_foundation.external_inbound_deeplink_routing.user_journey
        envs: *id002
      supporting:
      - layer: api_integration
        suite: gwt3_api_integration
        cases:
        - api_integration.runtime.runtime_client_foundation.external_inbound_deeplink_routing.gwt3_api_integration
        envs:
        - beta
        - gamma
    notes:
    - '[migrated_from_planned] quwoquan_app/test/runtime/deeplink/deferred_deep_link_test.dart'
    - '[migrated_from_planned] quwoquan_app/integration_test/deferred_deep_link_journey_test.dart'
  GWT4:
    title: 入站能力由能力位与 NativeBridge 防腐驱动
    given:
    - 应用运行在 mobile/web/ohos 不同 capability profile。
    when:
    - 业务/UI 查询是否展示深链入口或兜底引导。
    then:
    - 只读 incomingDeepLink/wechatShareAndLaunch/deferredDeepLink 能力位决定展示与降级。
    - 缺失平台原生通道返回结构化 unavailable，不 crash。
    done_when:
    - mobile/web/ohos 三 profile 下行为契约由同一批测试经 platformCapabilitiesProvider override
      驱动。
    edge_cases:
    - web profile 不支持入站唤起，仅渲染落地页。
    - ohos SDK 未就绪时能力位降级。
    contract_refs:
    - quwoquan_app/lib/core/platform/platform_capabilities.dart
    - specs/feature-tree/runtime/runtime-client-foundation/cross-platform-portability/spec.md
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt4_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.external_inbound_deeplink_routing.gwt4_local_contract
        envs: *id001
      - layer: local_contract
        suite: gwt4_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.external_inbound_deeplink_routing.gwt4_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_app/test/core/platform/deeplink_capability_profile_test.dart'
