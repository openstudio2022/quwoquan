version: 2
node:
  id: entity-link-templates-metadata
  level: L3_story
  path: specs/feature-tree/runtime/runtime-client-foundation/entity-link-templates-metadata
  title: entity link templates metadata
  parent_domain_service: runtime
  parent_business_capability: runtime-client-foundation
scope:
  summary: 实体可复制链接、应用内导航锚点、对外引流归因/口令/中转页的唯一结构真相源。
  journey_scenarios:
  - external-inbound-deeplink-return
  in_scope:
  - 5 类实体（post/circle/user/entity_homepage，「我」等同 user）的 web/deeplink 双链与 navigation
    映射。
  - 对外引流归因参数 attribution_params 结构。
  - 智能中转落地页 transfer_pages（short_link/universal_landing）结构。
  - 跨 App 口令 share_token 结构。
  out_of_scope:
  - 端侧 codegen 工具改造与调用点替换（/dev 切片）。
  - 服务端短链解析、UA 分流渲染（external-inbound-deeplink-routing / public-content-web-entry）。
  - 生产域名（仅 runtime_origin_binding 声明键名）。
gwt_acceptance:
  GWT1:
    title: 5 类实体双链与导航锚点同源
    given:
    - 给定任一实体（post/circle/user/entity_homepage）的主键。
    when:
    - 按 metadata 模板拼接 web HTTPS、scheme 深链与 navigation route。
    then:
    - web.path_template、app_deep_link、navigation.route_id 来自同一行，语义一致。
    - navigation.route_id 必须存在于 app_routes.yaml。
    done_when:
    - codegen/verify 校验所有 route_id 存在；不存在则阻断合入。
    edge_cases:
    - Post 链接不生成 scope 或圈子可见性 query。
    - private 实体不生成可分享链接（由分享策略裁决）。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.entity_link_templates_metadata.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.entity_link_templates_metadata.gwt1_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/cloud/runtime/link_templates_route_binding_test.dart'
  GWT2:
    title: 对外链接统一携带归因参数且入站被剥离
    given:
    - 分享侧生成对外 web 链接或中转页链接。
    when:
    - 按渠道注入 attribution_params（utm_source/utm_medium/utm_campaign/share_id/inviter/referral）。
    then:
    - 归因参数仅追加在 query，不进入 path_template。
    - 入站 DeepLinkResolver 剥离归因参数交给埋点，不参与 route 匹配。
    done_when:
    - 归因 query 解析单测覆盖注入与剥离两端。
    edge_cases:
    - 缺失归因参数时使用默认 referralSource，不阻断跳转。
    - 非法/超长归因参数被安全截断。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.entity_link_templates_metadata.gwt2_local_contract
        envs: *id001
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.entity_link_templates_metadata.gwt2_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_app/test/cloud/runtime/share_attribution_params_test.dart'
  GWT3:
    title: 中转页与口令回溯到同一实体真相源
    given:
    - 给定 universal_landing（open?target_entity&target_id）或 share_token。
    when:
    - 解析中转页 target_entity/target_id 或口令 token。
    then:
    - 解析结果回溯到 entities 中同一实体行，再映射 navigation.route_id。
    - 口令 token 与 short_link 的 {token} 同源可互转。
    done_when:
    - 中转页与口令解析单测覆盖 4 类实体目标。
    edge_cases:
    - target_entity 未知时降级首页并上报。
    - 口令失效/过期返回结构化错误。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.entity_link_templates_metadata.gwt3_local_contract
        envs: *id001
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.entity_link_templates_metadata.gwt3_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_app/test/cloud/runtime/transfer_page_token_resolution_test.dart'
contract_acceptance:
  CONTRACT1:
    title: 链接模板/归因/口令/中转页结构契约
    metadata_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml
    done_when:
    - link_templates.yaml 的 entities/attribution_params/transfer_pages/share_token
      结构合法且 route_id 可解析。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract1_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.entity_link_templates_metadata.contract1_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_service/tools/codegen_app_metadata/link_templates_schema_test.go'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
