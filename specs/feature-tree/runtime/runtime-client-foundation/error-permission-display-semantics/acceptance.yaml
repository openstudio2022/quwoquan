  GWT3:
    title: 表单失败按操作锚点单通道呈现
    given:
    - 页面存在输入字段、提交按钮、协议控件或第三方方式网格。
    when:
    - 输入校验、提交、限流、provider 或网络失败发生。
    then:
    - 输入问题使用 AppInlineFieldError；操作失败使用 AppFormErrorCard，不以弱 caption 替代 metadata inlineCard。
    - 两类内联错误均为透明的圆形感叹号加 14px 常规错误文字，图文间距 6px；浅色 #E5484D、深色 #FF6B6B，不使用色点、胶囊、卡片或阴影。
    - 自动完成恢复转场时使用 compact 密度，只显示一条说明，不附加与页面主按钮重复的动作。
    - 每次失败只有一个主反馈，liveRegion 只播报新错误一次，不抢焦点。
    - 编辑、重试或成功后清除对应反馈。
    done_when:
    - 登录页和共享 UiErrorSemantic 的 local_contract 同时通过。
    edge_cases:
    - 320px 窄屏
    - 200% 动态字体
    - 深浅色
    contract_refs:
    - specs/ux/error-and-permission-semantics.md
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/core/errors/ui_error_semantics__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/core/errors/ui_error_semantics__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: form_error_semantics
        cases:
        - local_contract.runtime.runtime_client_foundation.error_permission_display_semantics.form_error_semantics
        envs: *id001
      supporting: []
    notes:
    - '2026-07-16: 登录运营商显式失败使用 compact formInlineCard，卡内无短信按钮，页面仅保留“获取验证码”单一主动作。'
  GWT4:
    title: 播放与加载失败提供无歧义恢复或退出路径
    given:
    - 用户在内容流、沉浸浏览或首屏加载中遇到可重试和不可重试失败。
    when:
    - 错误载体渲染标题、可选说明与恢复操作。
    then:
    - 可重试的视频失败只展示一个“再试一次”主操作，标题和说明不包含“稍后”或重复恢复动词。
    - 不可重试的视频失败不展示伪重试，提供“可以先看看别的内容”的替代路径。
    - 首屏加载失败的恢复操作与宿主返回分离，页面说明不与“再试一次”冲突。
    done_when:
    - 媒体播放失败、页态错误组件与结构化错误语义的 local_contract 断言同时通过。
    edge_cases:
    - 网络不可达
    - 媒体资源不存在
    - 设备解码不支持
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/errors.yaml
    - specs/ux/error-and-permission-semantics.md
    tests:
