scope:
  summary: error permission display semantics 验收范围。
  in_scope:
  - 页面级错误按 UiErrorSemantic.presentation 选择载体
  - 跨页面/沉浸入口失败态按 sourceAppearanceMode 保持来源外观
  - 错误组件与宿主页面/模态的导航所有权
  - 整页、区块、刷新、分页和动作失败的分层载体
  out_of_scope: []
