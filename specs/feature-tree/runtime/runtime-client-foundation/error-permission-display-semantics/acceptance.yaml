  GWT2:
    title: 错误恢复不复制宿主导航
    given:
    - 用户在栈内页面、底部弹层或内容区块中遇到首屏加载失败。
    when:
    - 宿主渲染导航控件，错误组件渲染原因和恢复动作。
    then:
    - 栈内页面只保留导航栏返回，不额外出现 X 或“返回”错误 CTA。
    - 模态容器只保留宿主 X/barrier，内容错误态不复制退出。
    - 区块首屏失败使用无卡片外框的错误空态，刷新和分页失败不覆盖已有内容。
    done_when:
    - 统一错误组件、分身页、评论区及栈页面宿主的 local_contract 同时通过。
    edge_cases:
    - 无恢复动作
    - 有缓存旧数据
    - 页面嵌套在模态内
    contract_refs:
    - specs/feature-tree/runtime/runtime-client-foundation/design.md
    - specs/ux/error-and-permission-semantics.md
    performance_points: []
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/core/widgets/error_states/app_error_states__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/widgets/persona_management_page__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/comment_system/comment_facet_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/circle/widgets/circle_shell_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/discovery/pages/work_browser_entry_page__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/content/entry/video_editor_error_state_widget__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: navigation_ownership_and_error_layers
        cases:
