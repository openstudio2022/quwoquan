version: 2
node:
  id: public-content-web-entry
  level: L3_story
  path: specs/feature-tree/runtime/runtime-client-foundation/public-content-web-entry
  title: public content web entry
  parent_domain_service: runtime
  parent_business_capability: runtime-client-foundation
scope:
  summary: 公开内容 Web 入口闭环验收范围。
  in_scope:
  - 公开内容 Web 入口规格。
  - 站外分享 HTTPS 链同源。
  - Markdown-to-SEO-HTML renderer 骨架。
  - public HTML 服务最小闭环（post/circle/user/entity_homepage 四类对象的可索引 HTML envelope）。
  - robots.txt、分类型 sitemap.xml、canonical、OG/Twitter card、JSON-LD、noindex 权限过滤。
  - open / s/{token} 智能中转页 UA 分流合同与安装转化埋点。
  - PC 内容优先体验与安装转化规格。
  out_of_scope:
  - 完整 PC masonry 首页实现。
  - 创作、私信、RTC 的桌面化实现。
gwt_acceptance:
  GWT1:
    title: 站外分享默认使用公开 HTTPS 链接
    given:
    - 用户在内容分享 Sheet 点击复制链接或系统分享。
    when:
    - 分享模板被构建并交给分享 action handler。
    then:
    - 站外文本使用 PUBLIC_WEB_BASE_URL + link_templates 的 HTTPS landing URL。
    - App deep link 保留在模板中，但不作为站外默认复制文本。
    done_when:
    - 分享模板测试覆盖 landing URL 与 deep link 双字段。
    - action handler 测试覆盖 copy/system_share 默认输出 HTTPS。
    edge_cases:
    - private 内容不生成可分享 landing URL。
    - circle_visible 内容保留受控分享提示。
    contract_refs:
    - specs/feature-tree/runtime/runtime-client-foundation/public-content-web-entry/spec.md
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/ui/content/share/content_share_template_public_link_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/content/share/content_share_template_public_link__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.contract
        envs: *id001
    notes: []
  GWT2:
    title: Markdown 可派生安全 SEO HTML
    given:
    - 一篇公开文章提供 articleMarkdown、assetManifest 与公开链接。
    when:
    - Markdown-to-SEO-HTML renderer 生成公开页投影。
    then:
    - 输出安全 HTML、canonical、OG 与 JSON-LD。
    - 任意 HTML / script 注入被转义或阻断。
    done_when:
    - renderer snapshot 覆盖 heading、paragraph、figure、gallery、callout、HTML escape。
    - private / circle_visible 权限边界有测试。
    edge_cases:
    - Markdown 中包含任意 HTML。
    - assetManifest 缺失图片。
    - 摘要为空时从正文派生 description。
    contract_refs:
    - specs/feature-tree/runtime/runtime-client-foundation/public-content-web-entry/spec.md
    - specs/feature-tree/discovery-content/content-type-framework/markdown-article-kernel/spec.md
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/ui/content/seo/markdown_seo_html_renderer_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/content/seo/markdown_seo_html_renderer__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.contract
        envs: *id001
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.gwt2_local_contract
        envs: *id001
      supporting: []
    notes: []
  GWT3:
    title: 4 类对象公开页输出 SEO 元信息与 JSON-LD
    given:
    - 内容、圈子、用户、实体主页各有一个 public 可见对象。
    when:
    - 公开 HTML 服务为对象渲染落地页。
    then:
    - 每类对象输出 canonical、OG/Twitter card 与对应 schema.org JSON-LD（Article/ImageObject/VideoObject/SocialMediaPosting/Organization/ProfilePage/Place）。
    - canonical 与 App 详情同一身份（PUBLIC_WEB_BASE_URL + link_templates path）。
    done_when:
    - 4 类对象 SEO 快照测试覆盖 canonical/OG/JSON-LD。
    - robots.txt 与分类型 sitemap.xml 生成。
    edge_cases:
    - circle_visible 受控预览且不进 sitemap。
    - private/审核未过对象 noindex 且不渲染正文。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    - specs/feature-tree/runtime/runtime-client-foundation/public-content-web-entry/spec.md
    performance_points: []
    tests:
      planned:
      - file: quwoquan_service/runtime/publicweb/renderer_test.go
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.contract
        envs: *id001
      - layer: api_integration
        suite: gwt3_api_integration
        cases:
        - api_integration.runtime.runtime_client_foundation.public_content_web_entry.gwt3_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.gwt3_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/web/seo_object_pages_snapshot_test.dart'
    - '[migrated_from_planned] quwoquan_service/services/content-service/tests/public_seo_render_contract_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/publicweb/renderer_test.go'
  GWT4:
    title: 智能中转页按 UA 分流唤起或下载
    given:
    - 站外链接/二维码/口令默认落点为中转页 open / s/{token}。
    when:
    - 不同 UA（微信 Android/鸿蒙、微信 iOS、系统浏览器、PC）访问中转页。
    then:
    - 微信 Android/鸿蒙内嵌 wx-open-launch-app，微信 iOS 用 Universal Link，浏览器用 UL/App Links/scheme，PC
      渲染预览 + 下载 CTA。
    - 唤起失败按确定性阶梯降级到浏览器引导/下载页/web 预览。
    done_when:
    - 中转页 UA 分流 contract 覆盖 4 类环境。
    - 解析回 link_templates 同一实体行。
    edge_cases:
    - token 失效返回结构化错误并降级。
    - target_entity 未知降级首页。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    - specs/feature-tree/runtime/runtime-client-foundation/external-inbound-deeplink-routing/spec.md
    performance_points: []
    tests:
      planned:
      - file: quwoquan_service/runtime/publicweb/transfer_test.go
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: api_integration
        suite: gwt4_api_integration
        cases:
        - api_integration.runtime.runtime_client_foundation.public_content_web_entry.gwt4_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/content-service/tests/transfer_page_ua_routing_contract_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/publicweb/transfer_test.go'
  GWT5:
    title: 安装转化入口对 4 类对象统一可用
    given:
    - 用户在手机 Web 或 PC Web 浏览任一对象公开页。
    when:
    - 用户触发安装/下载/扫码入口。
    then:
    - 手机 Web 直接下载并兜底；PC Web 提供多平台安装入口 + 扫码 + 分享到手机/微信。
    - 下载地址来自 CloudRuntimeConfig，不硬编码。
    done_when:
    - 安装转化组件测试覆盖手机/PC 两形态与下载地址注入。
    edge_cases:
    - 唤起失败回落到下载入口。
    - 不支持的平台隐藏对应安装项。
    contract_refs:
    - specs/feature-tree/runtime/runtime-client-foundation/public-content-web-entry/spec.md
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt5_local_contract
        cases:
        - local_contract.runtime.runtime_client_foundation.public_content_web_entry.gwt5_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/web/install_conversion_cta_test.dart'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/publicweb/renderer_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/publicweb/transfer_test.go'
execution:
