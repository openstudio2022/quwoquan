  SIT2:
    title: seed-box + product-ops 独立拓扑 SIT
    story_refs: []
    done_when:
      - "beta/gamma/prod 中 `seed-box` 承载 application plane 的冷启动域：content、integration、chat、user、circle、notification、entity、tag、assistant。"
      - "`product-ops-service` 独立承载 ops domain、`/v1/ops*` 与 `/v1/control-plane/product*`，不再作为 seed-box child process。"
      - "`recommendation-service` 保持独立，`search-service` 保持独立上游，edge/media/service/data 四运行时平面保持隔离。"
      - "`seed_box_entrypoint.py` 与 `Dockerfile` 实际承载所有 seed-box domains，不能只让 YAML 三源自洽。"
      - "`prod_plane_access_isolation.yaml` 的 service runtime plane 纳入独立 `product-ops-service` governed workload，且 prod root kustomization 能渲染该 workload。"
      - "Strangler split candidates 的 `route_prefix` 来自 metadata `service.yaml` 真实 path 前缀，而非硬编码 `/v1/<domain>/`。"
      - "`gateway` / `orchestrator` 不再作为 seed-box 幽灵域出现。"
