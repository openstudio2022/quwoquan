    title: 端云架构导引与真相源链接 SIT
    story_refs: []
    done_when:
      - "新节点 `spec.md` / `design.md` / `acceptance.yaml` 存在并注册进 `specs/feature-tree/tree_index.yaml`。"
      - "导引清楚区分源码服务目录、部署进程、runtime module 与 workload，不再把 `cmd/*/main.go` 或部署资产混数为服务数量。"
      - "导引只通过 `contract_refs` 链接拓扑与 metadata 真相源，不复制第二套 domain/process/module 列表。"
      - "根 `AGENTS.md` 与 `specs/README.md` 将本节点列为端云架构阅读入口，服务层陈旧文档链回本节点。"
    contract_refs:
      - quwoquan_ops/environments/process_domain_mapping.yaml
      - quwoquan_ops/environments/process_domain_plane_mapping.yaml
      - quwoquan_ops/environments/workload_topology_inventory.yaml
      - quwoquan_ops/environments/module_package_mapping.yaml
      - quwoquan_ops/environments/reliable_task_module_catalog.yaml
      - quwoquan_service/contracts/metadata
      - specs/feature-tree/tree_index.yaml
    tests:
      planned: []
      recorded:
        - file: quwoquan_service/services/content-service/tests/api_integration/post_crud_contract__api_integration_test.go
        - file: quwoquan_service/services/content-service/tests/api_integration/report_crud_contract__api_integration_test.go
        - file: quwoquan_app/test/local_contract/cloud/generated_operation_client__contract__local_contract_test.dart
        - file: quwoquan_app/test/local_contract/cloud/remote/content/post/post_lifecycle_remote__local_contract_test.dart
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          suite: feature_tree_architecture_guide
          cases:
            - local_contract.runtime.system_architecture_and_engineering_guide.sit1.feature_tree_schema
