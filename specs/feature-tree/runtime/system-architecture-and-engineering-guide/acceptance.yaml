version: 2
node:
  id: system-architecture-and-engineering-guide
  level: L2_business_capability
  path: specs/feature-tree/runtime/system-architecture-and-engineering-guide
  title: system architecture and engineering guide
  parent_domain_service: runtime
  parent_business_capability: system-architecture-and-engineering-guide
scope:
  summary: 端云系统架构与工程导引验收范围，覆盖 D0 业务对象设计冻结、F1 ContractGraph/公共底座、G1 硬门禁、content 商用样板、seed-box 拓扑与可拆分证明。
  in_scope:
    - 端云服务目录、部署进程、runtime module、平面与 workload 三态导引
    - seed-box modular-monolith-first 拓扑、product-ops 独立发布与 Strangler split-ready 验证
    - 内容工程生产到交集行动闭环的能力现状与 gap 矩阵
    - 文档权威入口与陈旧服务层文档收编
    - 业务对象 Facade、统一 URL、Data Ports、页面 Slice、错误、测试与四环境合同
    - ContractGraph compiler、最小公共底座、硬门禁和 Post+Report 样板准出
  out_of_scope:
    - 替代 quwoquan_ops/environments 或 quwoquan_service/contracts/metadata 成为第二套真相源
    - 实现具体交集算法、推荐模型、数据工程生产流水线或 App 页面功能
    - edge-media 的 RTC/SFU/TURN 细节实现
sit_acceptance:
