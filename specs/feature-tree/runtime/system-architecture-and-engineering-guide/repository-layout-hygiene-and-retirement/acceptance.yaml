version: 4
node:
  id: repository-layout-hygiene-and-retirement
  level: L3_story
  path: specs/feature-tree/runtime/system-architecture-and-engineering-guide/repository-layout-hygiene-and-retirement
  title: repository layout hygiene and retirement
  parent_domain_service: runtime
  parent_business_capability: system-architecture-and-engineering-guide

scope:
  summary: 全仓路径分类、WIP 保护、可再生产输出清理和历史入口退役。
  in_scope:
    - Git/ignored 全路径 inventory 与候选证据。
    - App、Service、Data、Ops 的目录/入口防回归门禁。
    - 高置信二进制、失效脚本、重复文档和未注册入口的原子退役。
    - Data CLI、stackctl、ML workflow 和设备脚本的唯一入口收敛。
    - Fixture 媒体反向引用闭包、App 精确资产声明和无松弛棘轮基线。
  out_of_scope:
    - 当前 WIP、运行中的环境、vendor、商业 SDK、有效 fixture 和外部备份调度。
    - 真实 beta/gamma/prod 远端发布或设备 UAT。

gwt_acceptance:
  GWT1:
    title: inventory 能保护脏工作树并输出可复验证据
    given:
      - 仓库同时存在 Git 跟踪、未跟踪、ignored、generated、vendor 和本地输出路径。
      - 工作树包含用户正在修改的文件和运行中的环境输出。
    when:
      - 执行 python3 quwoquan_ops/cli/repo_hygiene_audit.py。
    then:
      - 报告写入 QWQ_OUTPUT_ROOT/env/repo/runs/，逐路径记录 Git 状态、大小、分类和哈希预算结果。
      - 当前 WIP 归入 protected_wip，且不进入自动删除候选。
    done_when:
      - 报告包含固定九类分类、WIP 清单、候选引用证据和最小验证命令。
    quality_facets: [contract, reliability, observability]
    test_object: cli_command
    slo_refs: []
    observability_refs:
      - QWQ_OUTPUT_ROOT/env/repo/runs/repo-hygiene-audit/summary.json
    security_refs: []
    edge_cases:
      - 未跟踪密钥、证书和 IDE 配置。
      - 超过哈希预算的大型 fixture 或构建产物。
    contract_refs:
      - specs/feature-tree/runtime/system-architecture-and-engineering-guide/repository-layout-hygiene-and-retirement/spec.md
      - quwoquan_ops/cli/repo_hygiene_audit.py
    performance_points: []
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: repository_layout_hygiene
          cases:
            - local_contract.runtime.system_architecture_and_engineering_guide.repository_layout_hygiene_and_retirement.gwt1_inventory
          envs: [local]
          test_object: cli_command
          quality_facet: contract
      supporting: []
    tests:
      planned: []
      recorded:
        - file: quwoquan_ops/tests/local_contract/test_repo_hygiene_audit__repository_layout__contract__local_contract_test.py
    status: implemented

  GWT2:
    title: 退役入口不会回流且唯一验证入口仍闭环
    given:
      - Service 根、Data verify、Makefile、活动 workflow 和发布计划存在历史路径漂移。
    when:
      - 执行 Service layout gate、Data verify all、输出根 gate 和 repository hygiene local contract。
    then:
      - Service 根的 tracked *.test/Mach-O/ELF 构建产物被阻断，删除中的工作树文件不被误报。
      - Data 验证只经 cli.py verify all，历史 audit 入口和无效 Make target 不再注册。
      - ML workflow 使用 service-owned scripts，chat-avatar workflow 不默认读取 ignored manifest。
      - specs/launch-plan 是三周发布文档唯一入口。
      - 活动 Make/Actions/gate 的脚本路径全部存在，第一方 Markdown 本地链接无断链。
      - 特性树不存在 L1 tree.yaml 镜像，全部 CR YAML 均可解析。
      - 旧无 slice 与未引用 archived 媒体副本为零，全部权威媒体引用均有物理对象。
      - App 不打包无消费者配置，已清零语义基线不可通过 update-baseline 回流。
      - allowlist 与当前扫描命中精确一致，不保留已删除文件或历史计数余量。
    done_when:
      - 所有最小 gate 通过，且高置信退役路径无活动源码引用。
    quality_facets: [functional, contract, reliability]
    test_object: quality_gate
    slo_refs: []
    observability_refs:
      - quwoquan_ops/gate/verify_output_layout.py
    security_refs: []
    edge_cases:
      - tracked 文件已在工作树删除但尚未暂存。
      - 历史 changelog/backlog 保留旧命令作为事实证据。
    contract_refs:
      - quwoquan_service/scripts/verify/verify_service_layout.py
      - quwoquan_data/scripts/cli.py
      - quwoquan_data/scripts/verify/handler.py
      - .github/workflows/ml_training_pipeline.yml
      - .github/workflows/verify-chat-avatar-commercial-matrix.yml
      - quwoquan_ops/gate/verify_entrypoint_script_paths.py
      - quwoquan_ops/gate/verify_markdown_local_links.py
      - quwoquan_ops/gate/verify_alpha_media_fixture_surface.py
    performance_points: []
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: repository_layout_hygiene
          cases:
            - local_contract.runtime.system_architecture_and_engineering_guide.repository_layout_hygiene_and_retirement.gwt2_single_entrypoint
          envs: [local]
          test_object: quality_gate
          quality_facet: contract
      supporting:
        - layer: local_contract
          execution_profile: baseline
          suite: data_verify_all
          cases:
            - local_contract.runtime.system_architecture_and_engineering_guide.repository_layout_hygiene_and_retirement.data_verify_all
          envs: [local]
          test_object: quality_gate
          quality_facet: reliability
    tests:
      planned: []
      recorded:
        - file: quwoquan_ops/tests/local_contract/test_repo_hygiene_audit__repository_layout__contract__local_contract_test.py
        - file: quwoquan_ops/tests/local_contract/verify_seeded_media_ca_path__local_contract_test.py
        - file: quwoquan_app/test/local_contract/app/startup_probe_parser__local_contract_test.py
    status: implemented

execution:
  local_gate:
    - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
    - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
    - python3 quwoquan_ops/gate/verify_entrypoint_script_paths.py
    - python3 quwoquan_ops/gate/verify_markdown_local_links.py
    - python3 quwoquan_ops/gate/verify_alpha_media_fixture_surface.py --files-only
  profile_gates:
    - make gate
notes:
  - 当前工作树含用户 WIP；inventory 报告记录排除项，清理不得覆盖这些路径。
  - 真实远端环境与设备 UAT 不属于本 Story，需由发布能力 Story 单独验收。
