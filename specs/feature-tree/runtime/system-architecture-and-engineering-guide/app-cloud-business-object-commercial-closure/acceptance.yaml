  GWT2:
    title: 服务端从可信 principal 执行 operation 与对象授权
    given:
      - route descriptor 携带 auth、actor、principal、scope 和 ownership/member policy。
    when:
      - 请求经 Gateway 或直连 Service 访问 required operation。
    then:
      - 服务端清除客户端身份头并从已验证 JWT/device ticket 重建 ActorContext。
      - 缺失或非法 credential 返回结构化 401，权限不满足返回 403，对象防枚举可返回 404。
      - application 对 owner/member/participant/admin 再校验，失败不产生 DB、OSS、MQ 或 LiveKit 副作用。
    done_when:
      - required operation 服务端 guard 覆盖率为 100%。
      - RTC/Realtime、Chat/Content Media、Assistant consent、Behavior/Ops 的跨 actor 负例全绿。
      - production 缺 JWT key/issuer/audience 时启动失败且不存在默认 secret。
    quality_facets: [security, reliability, observability]
    test_object: api_operation
    slo_refs:
      - specs/feature-tree/runtime/system-architecture-and-engineering-guide/acceptance.yaml#SIT7
    observability_refs:
