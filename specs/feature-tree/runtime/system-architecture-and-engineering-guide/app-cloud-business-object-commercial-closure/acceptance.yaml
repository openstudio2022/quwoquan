  GWT4:
    title: Runtime 对 deadline cancellation retry error telemetry 语义唯一
    given:
      - operation contract 声明 timeout、retry、idempotency、recovery、privacy 与 telemetry。
    when:
      - 请求经历超时、取消、401 refresh、429/5xx、坏响应或弱网。
    then:
      - executor 按剩余预算执行，取消可终止请求和 backoff。
      - command 仅在声明幂等且有 key 时重放，attempt/retry reason 反映真实执行。
      - 所有失败映射为 RuntimeFailure，UI 不把系统失败伪装为空态。
      - telemetry 不记录 token、PII、实例 URL 或 presigned query。
    done_when:
      - Cloud 只有一条 context/config/transport/error/telemetry 执行链。
      - Runtime import DAG、generated-client-only、RuntimeFailure 零旁路门禁全绿。
    quality_facets: [reliability, performance, observability, security]
    test_object: application_service
    slo_refs:
      - specs/feature-tree/runtime/runtime-sli/acceptance.yaml
    observability_refs:
      - cloud_operation_duration_seconds
      - cloud_operation_attempt_total
      - cloud_operation_failure_total
    security_refs:
      - docs/outstanding_risks_backlog.md#R-CLOUD06
    edge_cases:
      - deadline 在 retry backoff 中到期
      - 取消发生在 token refresh 或流式上传中
      - POST 收到 401 但没有幂等 key
      - telemetry sink 自身失败
    platform_variants:
      iOS:
        - 取消和网络恢复消费统一 runtime contract。
      Android:
        - 取消和网络恢复消费统一 runtime contract。
      Web:
        - 不支持的本地能力走结构化降级。
      OHOS:
        - 不支持的本地能力走结构化降级。
    contract_refs:
      - quwoquan_app/packages/quwoquan_cloud_contracts
      - quwoquan_app/lib/cloud/runtime
      - quwoquan_service/contracts/metadata
    performance_points:
