      - docs/outstanding_risks_backlog.md#R-CLOUD02
      - docs/outstanding_risks_backlog.md#R-CLOUD03
    edge_cases:
      - 伪造 X-Client 身份头
      - 错误 issuer/audience/scope/token version
      - 用户 B 访问用户 A 的媒体、会话、consent 或 call
      - RTC/Realtime ticket 过期或重放
    platform_variants:
