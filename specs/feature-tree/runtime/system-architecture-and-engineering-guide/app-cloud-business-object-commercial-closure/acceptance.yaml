contract_acceptance:
  CONTRACT1:
    title: L3 Story 与 AppRoot 十条 Scenario 双向可追踪
    metadata_refs:
      - specs/feature-tree/journey_scenario_registry.yaml
      - specs/feature-tree/acceptance.yaml#UAT_BUSINESS_OBJECT_COMMERCIALIZATION
      - specs/feature-tree/runtime/system-architecture-and-engineering-guide/acceptance.yaml#SIT7
      - specs/changelog/CR-20260713-088-app-cloud-commercial-directory-governance.yaml
    done_when:
      - L2 SIT7 与 CR-088 引用本 Story。
      - UAT 的十个 scenario_refs 均在 registry 中引用本 Story。
      - tree_index 注册本 Story，且 Story 只含 spec.md 与 acceptance.yaml。
    quality_facets: [contract]
    test_object: metadata
    slo_refs: []
    observability_refs:
      - feature_traceability_coverage
    security_refs: []
    test_evidence:
      primary:
        - layer: local_contract
          suite: app_cloud_story_traceability
          cases:
            - local_contract.runtime.system_architecture_and_engineering_guide.app_cloud_business_object_commercial_closure.traceability
          envs: [local]
          test_object: metadata
          quality_facet: contract
      supporting: []
    tests:
      planned:
        - command: bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
        - command: bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
      recorded:
        - file: quwoquan_ops/tests/local_contract/test_app_cloud_story_traceability__contract__local_contract_test.py
    status: implemented

execution:
  local_gate:
    - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
    - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
    - python3 quwoquan_ops/gate/verify_cloud_commercial_directory_governance.py
    - python3 quwoquan_ops/cli/cloud_contract_handoff.py verify
    - cd quwoquan_service && go test ./services/user-service/internal/domain/persona/profile_update_proposal/model ./services/user-service/internal/application/persona/profile_update_proposal ./services/user-service/internal/adapters/http -count=1
    - cd quwoquan_app && flutter test test/local_contract/cloud/user/profile_update_proposal_facets__local_contract_test.dart test/local_contract/ui/user/profile_update_proposal_review_sheet__local_contract_test.dart
  api_integration:
    - cd quwoquan_service && go test ./services/user-service/tests/api_integration -run TestProfileUpdateProposal -count=1
  full_gate:
    - make gate
    - python3 quwoquan_ops/cli/stackctl.py verify --env gamma --kind all --tier all
    - make gate-full
