    - identity-entry-persona-continuation
    - content-feed-open-detail
    - global-search-query-and-filter
    - global-route-edge-pop-contract
    - message-direct-and-greeting-upgrade
    - circle-entity-group-handoff
    - assistant-context-grounded-answering
    - outbound-object-share-distribution
    - intersection-action-deepening-on-object
    - profile-share-interaction-history
  out_of_scope:
    - 通用 CRUD、事件溯源、分布式事务或通用 Saga
    - 推荐、内容生产和 edge-media 内部算法

gwt_acceptance:
  GWT0:
    title: DDD/CQRS 批量迁移前架构硬门
    given:
      - 每个 ContractGraph domain 的唯一 Registry 已登记稳定 context、aggregate root、owned child、projection/fact/session/external reference、访问策略、字段引用和关系。
      - DDD-OBJ-001 至 CHILD-ACCESS-012 已在 L2 design 冻结。
    when:
      - ContractGraph commercial validator 编译 canonical object 与 operation binding。
    then:
      - separate_aggregate 及任何等价别名在 loader/schema 层直接失败。
      - 未登记 domain/object/relationship、聚合根嵌套、跨上下文直达子对象、command 跨 canonical object、owned entity 独立 Store、projection command、fact update/delete 和未分类字段全部失败。
      - query 必须绑定 named Reader 与 typed Slice；append-only command 必须绑定 append_sink，且不得伪装为 aggregate_owner。
      - readiness evidence 只声明 exact-path 证据，文件 SHA256 与阶段由 Graph 派生；缺 UAT/四环境不得 commercial-ready。
    done_when:
      - Account/Persona/Relationship、Content/Media/TrustSafety、Circle、Chat、Assistant、Notification、Search、Tag、Recommendation、Ops、RTC/Realtime/Integration 的对象与强/最终一致性有唯一裁决。
      - 跨上下文写只经目标 Command Facade，读只经 named Reader/Slice；owned entity/value object 只经 aggregate root。
      - 架构反设计 local contract 全绿，批量迁移只能消减 commercial profile 失败项。
    quality_facets: [contract, data_consistency]
    test_object: metadata
    slo_refs: []
    observability_refs:
      - contract_graph_validation_failure_total
    security_refs:
      - docs/outstanding_risks_backlog.md#R-CLOUD04
    edge_cases:
      - separate_aggregate 被 loader 当作兼容别名
      - 同一 fields.yaml 字段未分类或被重复分类
      - command 在 Post packet 内声称由 MediaAsset 或 Report 拥有
      - append-only fact 声明 PATCH/DELETE
      - aggregate members 嵌入另一个 aggregate root
      - 跨上下文 relationship 直接指向 owned entity 或其存储
    platform_variants:
      iOS:
        - 与其他平台消费相同 canonical object contract。
      Android:
        - 与其他平台消费相同 canonical object contract。
      Web:
        - 与其他平台消费相同 canonical object contract。
      OHOS:
