version: 2
node:
  id: runtime
  level: L1_domain_service
  path: specs/feature-tree/runtime
  title: runtime
  parent_domain_service: runtime
scope:
  summary: >
    runtime 作为跨端云机制领域服务，治理共享 runtime 包和 integration-service 等独立机制
    进程；部署边界不形成新的 L1，业务对象与 Vendor SDK 不得穿透。
  in_scope:
  - 配置、错误、HTTP、消息、可观测、治理、平台防腐和外部 Provider 机制
  - 构建期 ContractGraph/Binding 校验、显式 composition、readiness 与发布回滚
  out_of_scope:
  - 业务 aggregate、跨对象通用 CRUD、运行时 metadata 扫描与动态选厂
domain_acceptance:
  DA1:
    title: runtime 领域边界验收
    done_when:
    - runtime L1、各 L2、共享 runtime 包、integration-service 和 quwoquan_ops 的工程映射清晰。
    - integration-service 只作为 runtime 治理的独立机制进程，不登记为 integration L1。
    - 外部 Provider 只经能力专属 typed Port 和显式 Adapter 装配，Gamma/Prod 无 Mock fallback。
    boundary_points:
    - domain/application 不依赖 adapters/infrastructure 或 Vendor SDK。
    - 独立机制进程不拥有业务 aggregate，不复制业务对象真相源。
    - 环境和 rollout stage 只作为三层测试证据维度。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: da1_local_contract
        cases:
        - local_contract.runtime.domain_service.da1.da1_local_contract
        envs:
        - local
      - layer: api_integration
        execution_profile: integration
        suite: da1_api_integration
        cases:
        - api_integration.runtime.domain_service.da1.da1_api_integration
        envs:
        - beta
        - gamma
      supporting: []
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
