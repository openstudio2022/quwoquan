  - SkillSubscription tick lease 与状态机
  - AppMessage 收件箱投递与会话投递门控
  out_of_scope:
  - 通知通道实现（归 notification 域）
gwt_acceptance:
  GWT1:
    title: 订阅触发与投递
    given:
    - 用户创建了 active 的主动技能订阅。
    when:
    - 内部 tick cron 领取到期订阅。
    then:
    - 产出投递到用户收件箱；会话投递前校验成员/频控/静默。
    done_when:
    - paused/cancelled 订阅不投递；重复 tick 不重复投递。
    edge_cases:
    - lease 竞争（多实例）
    - notification-service 不可达（熔断）
