version: 2
node:
  id: context-grounded-answering
  level: L3_story
  path: specs/feature-tree/runtime/runtime-assistant/context-grounded-answering
  title: context grounded answering
  parent_domain_service: runtime
  parent_business_capability: runtime-assistant
scope:
  summary: 页面上下文感知问答 grounding 验收范围。
  in_scope:
  - ReportPageContext 上报与 Redis TTL 缓存
  - grounding 注入 run prompt 与引用回溯
  out_of_scope:
  - 搜索 handoff（归 assistant-search-handoff-and-grounding）
gwt_acceptance:
  GWT1:
    title: 页面上下文注入回答
    given:
    - 用户在内容详情页上报了结构化 page context。
    when:
    - 用户在小趣发起提问。
    then:
    - 回答 prompt 注入 page context；引用可回溯到源对象。
    done_when:
    - 上下文过期/缺失时降级为通用回答且不伪造事实。
    edge_cases:
    - page context TTL 过期
    - businessObjects 为空
    contract_refs:
    - quwoquan_service/contracts/metadata/assistant/assistant_run/service.yaml
    performance_points: []
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/assistant-service/internal/application/service__local_contract_test.go
      - file: quwoquan_service/services/assistant-service/internal/adapters/http/handler__local_contract_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.runtime.runtime_assistant.context_grounded_answering.contract
        envs: &id001
        - local
      supporting: []
    notes:
    - 2026-07-20 补建 story 目录以修复 journey_scenario_registry 引用漂移；grounding 现状证据来自 ReportPageContext/GetSuggestedActions 合同测试。
  GWT2:
    title: 交集证据授权回查与引用落点
    given:
    - 用户从对象页交集卡打开小趣，App 提交强类型 AssistantIntersectionEvidenceRef。
    when:
    - 用户启动 AssistantRun。
    then:
    - assistant-service 以当前 persona 通过 content 公开 Reader 回查 intersectionId、evidenceId、sourceRef 与目标对象。
    - 仅回查到的当前事实可进入 prompt、evidence ledger 与 citation。
    - 伪造、过期、撤销或无权访问的引用返回结构化失败，不降级为客户端声明的事实。
    done_when:
    - 内部 citation 以 canonical destination 打开正确对象，外部 citation 仅允许已校验 HTTPS URL。
    - 未知对象、缺失 destination 或权限失败不回退打开 post。
    edge_cases:
    - cross-persona forged intersection reference
    - stale pointSummarySnapshotId
    - sourceRef or target object mismatch
    - untrusted external URL scheme
    contract_refs:
    - quwoquan_service/contracts/metadata/assistant/assistant_run/fields.yaml
    - quwoquan_service/contracts/metadata/assistant/assistant_run/errors.yaml
    - quwoquan_service/contracts/metadata/_shared/search_objects.yaml
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_service/services/assistant-service/internal/application/intersection_evidence_grounding__local_contract_test.go
      - file: quwoquan_service/services/assistant-service/tests/api_integration/assistant_intersection_grounding__api_integration_test.go
      - file: quwoquan_app/test/local_contract/ui/assistant/assistant_intersection_evidence_handoff__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/assistant/assistant_citation_destination__local_contract_test.dart
      recorded: []
    status: planned
    test_evidence:
      primary: []
      supporting: []
    notes:
    - production Remote composition 的对象页→小趣→站内 citation Patrol 证据仅可在 beta/gamma 受控账号与设备可用后记录；Recording Facet/widget 不能充当 UAT。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
