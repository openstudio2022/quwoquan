version: 2
node:
  id: runtime-external-integration
  level: L2_business_capability
  path: specs/feature-tree/runtime/runtime-external-integration
  title: 外部能力集成与 Provider 商用治理
  parent_domain_service: runtime
  parent_business_capability: runtime-external-integration
scope:
  summary: >
    以能力专属 typed Port、Provider Adapter、构建期 BindingCompiler、统一 Conformance
    Suite、3×3 证据和双层 readiness 隔离第三方差异；integration-service 只是 runtime
    治理的一种部署形态。
  in_scope:
  - Capability/Adapter/环境 Binding 单轨注册、显式 composition 与启动 fail-closed
  - Alpha/Beta/Gamma × local_contract/api_integration/user_acceptance 九格证据
  - 统一错误、超时/取消、幂等、隐私、观测、成本、降级、切换与回滚
  - SLS、MQ、DNS、RTC、LLM 首波及其余现存外部依赖的分波迁移
  out_of_scope:
  - 为无产品需求的未来能力预造万能 Provider
  - 运行时扫描 metadata、动态选厂或以 Mock/Fake 作为 Gamma/Prod fallback
sit_acceptance:
  SIT1_capability_boundary:
    title: 能力专属 Port、Adapter 隔离与访问策略
    story_refs:
    - integration-service-foundation
    - integration-service-foundation--location-nearby-search-gateway
    - provider-adapter-conformance-suite
    done_when:
    - 每项外部能力有唯一 canonical typed Port；Vendor SDK/type/endpoint/error/callback DTO
      只存在于登记的 Adapter 路径。
    - Adapter 恰属 central_integration、domain_owned_adapter、client_platform_adapter、
      data_pipeline_adapter 之一；豁免不绕过注册、合同、测试和商用门禁。
    - application/domain/UI 不直接读取第三方配置、环境变量或 Vendor DTO。
    performance_points:
    - Adapter 映射开销不超过能力总延迟预算的 5%。
    tests:
      planned:
      - quwoquan_ops/tests/local_contract/external_provider_governance__local_contract_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: capability_boundary
        cases:
        - local_contract.runtime.runtime_external_integration.capability_boundary
        envs:
        - local
        test_object: metadata
        quality_facet: contract
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: vendor_boundary_static
        cases:
        - local_contract.runtime.runtime_external_integration.vendor_boundary_static
        envs:
        - local
        test_object: security_policy
        quality_facet: security
    notes:
    - Vendor import、SBOM 与实现路径由 registry 双向反查，禁止维护第二套 allowlist。
  SIT2_binding_and_readiness:
    title: 构建期 Binding、显式装配与逐能力 readiness
    story_refs:
    - integration-service-foundation
    - capability-provider-commercial-readiness-gate
    done_when:
    - registry、metadata、环境 Binding、binding root、SBOM 与 acceptance 双向一致。
    - BindingCompiler 只在构建/门禁阶段运行；运行时不扫描 metadata 或按字符串动态选厂。
    - content embedding、user one-tap/social、integration location/SMS/Push、assistant model、
      RTC room 与 runtime SLS 各自产出 root-scoped checked-in Go descriptor，并由对应
      composition entrypoint fail-closed 消费。
    - runtime.message.transport 使用唯一 Redis Adapter Binding；其所有实际 producer/
      consumer root 共享同一环境选择、各自产出 descriptor 并在 publisher/consumer 构造前
      preflight Redis scene。任何 root 直接构造未校验 transport、静默跳过 consumer 或把
      Pub/Sub 当作 durable delivery 均为阻断。
    - runtime NATS 与 DNS 显式声明生产消费为 none，仅为资产登记；不得列为
      release-required、不得生成 release Binding 或冒充 readiness 证据。
    - Gamma/Prod 缺 required Provider、凭据、初始化或健康探针时启动失败；optional
      能力仅结构化 unavailable/degraded，绝不假成功。
    - readiness 只暴露 capability/adapter ID、状态、版本、digest 和 evidence URI，不暴露
      endpoint、Secret 或 token。
    performance_points:
    - Provider preflight 必须在服务启动预算内完成，慢探针异步执行且初始状态 fail-closed。
    tests:
      planned:
      - quwoquan_ops/tests/local_contract/external_provider_governance__local_contract_test.py
      - quwoquan_ops/tests/acceptance/api_integration/external_provider_governance__api_integration_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: binding_compiler
        cases:
        - local_contract.runtime.runtime_external_integration.binding_compiler
        envs:
        - local
        test_object: config_release
        quality_facet: contract
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: provider_startup_readiness
        cases:
        - api_integration.runtime.runtime_external_integration.provider_startup_readiness
        envs:
        - beta
        - gamma
        test_object: observability
        quality_facet: availability
    notes: []
  SIT3_provider_conformance_3x3:
    title: Provider 公共/专项 Conformance 与 Alpha/Beta/Gamma 九格证据
    story_refs:
    - provider-adapter-conformance-suite
    - capability-provider-commercial-readiness-gate
    done_when:
    - 公共 suite 覆盖 success、validation、auth、network/DNS、timeout、throttle、retry、
      idempotency、redaction 与 observability；能力专项 profile 覆盖本能力协议语义。
    - Alpha/Beta/Gamma 各自执行 local_contract、api_integration、user_acceptance；环境不是
      第四测试目录层。
    - local_contract 对对应环境的真实 Adapter 类运行离线协议/故障 harness，永不访问外网；
      api_integration 才执行真实 TLS、鉴权和远端调用。
    - runtime.message.transport 的 user_acceptance 只能以 production Remote composition 的
      原生设备 chat @ assistant journey 取证，并受 stackctl 解析的 endpoint、CI 注入的
      auth 和环境 seed 约束；未登记该 harness 时必须输出
      PROVIDER.CONFORMANCE.REMOTE_CHAT_ASSISTANT_UAT_HARNESS_REQUIRED 并 GATE_BLOCK，
      不得用 memory Redis、fixture consumer、UI mock 或 Provider override 生成 passed。
    - 每格报告含当前 commit/image/config/ContractGraph/Adapter digest、断言/skip、网络边界、
      数据 digest、acceptance refs 与 logs/traces/metrics 引用。
    - NOT_RUN、required skip、零断言、dry-run、旧 digest、缺观测或缺清理回执均阻断。
    performance_points:
    - 聚合器对单能力九格判定 P95 不超过 5 秒，不读取大型日志正文。
    tests:
      planned:
      - quwoquan_ops/tests/local_contract/provider_conformance_evidence__contract__local_contract_test.py
      - quwoquan_ops/tests/local_contract/provider_conformance_runner__local_contract_test.py
      - quwoquan_ops/tests/acceptance/api_integration/external_provider_governance__api_integration_test.py
      - quwoquan_ops/tests/acceptance/user_acceptance/external_provider_governance__user_acceptance_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: provider_conformance_alpha_binding
        cases:
        - local_contract.runtime.runtime_external_integration.provider_conformance.alpha
        envs: [alpha]
        test_object: package_contract
        quality_facet: contract
      - layer: local_contract
        execution_profile: baseline
        suite: provider_conformance_beta_binding
        cases:
        - local_contract.runtime.runtime_external_integration.provider_conformance.beta
        envs: [beta]
        test_object: package_contract
        quality_facet: contract
      - layer: local_contract
        execution_profile: baseline
        suite: provider_conformance_gamma_binding
        cases:
        - local_contract.runtime.runtime_external_integration.provider_conformance.gamma
        envs: [gamma]
        test_object: package_contract
        quality_facet: contract
      - layer: api_integration
        execution_profile: smoke
        suite: provider_conformance_alpha_api
        cases:
        - api_integration.runtime.runtime_external_integration.provider_conformance.alpha
        envs: [alpha]
        test_object: api_operation
        quality_facet: reliability
      - layer: api_integration
        execution_profile: integration
        suite: provider_conformance_beta_api
        cases:
        - api_integration.runtime.runtime_external_integration.provider_conformance.beta
        envs: [beta]
        test_object: api_operation
        quality_facet: reliability
      - layer: api_integration
        execution_profile: integration
        suite: provider_conformance_gamma_api
        cases:
        - api_integration.runtime.runtime_external_integration.provider_conformance.gamma
        envs: [gamma]
        test_object: api_operation
        quality_facet: reliability
      - layer: user_acceptance
        execution_profile: smoke
        suite: provider_conformance_alpha_journey
        cases:
        - user_acceptance.runtime.runtime_external_integration.provider_conformance.alpha
        envs: [alpha]
        test_object: workflow
        quality_facet: experience
      - layer: user_acceptance
        execution_profile: integration
        suite: provider_conformance_beta_journey
        cases:
        - user_acceptance.runtime.runtime_external_integration.provider_conformance.beta
        envs: [beta]
        test_object: workflow
        quality_facet: experience
      - layer: user_acceptance
        execution_profile: release
        suite: provider_conformance_gamma_journey
        cases:
        - user_acceptance.runtime.runtime_external_integration.provider_conformance.gamma
        envs: [gamma_local]
        test_object: workflow
        quality_facet: experience
      supporting: []
    notes:
    - 九格是同一三层测试在三种 Provider 环境配置下的执行矩阵，不新增测试目录层。
  SIT4_switch_degrade_rollback:
    title: Provider 故障、降级、替换与原子回滚
    story_refs:
    - capability-provider-commercial-readiness-gate
    done_when:
    - required Provider 不可用且无 ready 备选时阻断 rollout；optional 能力关闭时返回结构化
      指引，禁止切 Mock 或本地合成成功。
    - 切换只发生在两个 ready 的 production-grade Adapter 之间，并验证合同/数据兼容、
      用户 Journey 连续、指标口径一致和旧 callback 收口。
    - config+image 成对发布和回滚；last-good 可恢复且回滚后健康、数据与用户结果一致。
    performance_points:
    - 自动故障判定和受控切换不超过能力 SLO 中声明的 disruption budget。
    tests:
      planned:
      - quwoquan_ops/tests/acceptance/api_integration/external_provider_governance__api_integration_test.py
      - quwoquan_ops/tests/acceptance/user_acceptance/external_provider_governance__user_acceptance_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: provider_switch_rollback
        cases:
        - api_integration.runtime.runtime_external_integration.provider_switch_rollback
        envs: [beta, gamma]
        test_object: config_release
        quality_facet: reliability
      - layer: user_acceptance
        execution_profile: release
        suite: provider_degradation_journey
        cases:
        - user_acceptance.runtime.runtime_external_integration.provider_degradation_journey
        envs: [gamma_local]
        test_object: workflow
        quality_facet: experience
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: recovery_policy_contract
        cases:
        - local_contract.runtime.runtime_external_integration.recovery_policy_contract
        envs: [local]
        test_object: domain_rule
        quality_facet: reliability
    notes: []
  SIT5_output_and_secret_boundary:
    title: 输出目录、Secret 与 evidence 隔离
    story_refs:
    - provider-adapter-conformance-suite
    - capability-provider-commercial-readiness-gate
    done_when:
    - Provider 配置、环境 Binding、schema、policy、endpoint/secret 值、渲染 `.env`、
      证书和 TLS 状态均不进入 `.qwq_output`。
    - 输出根 `.qwq_output` 只含可删除重建的 runs/observability/process/cache 分类产物；deploy payload、渲染配置、Caddy、TLS 与 env 文件写入 `QWQ_DEPLOY_WORK_ROOT/<target>/`；
      process 不含 config/PKI，evidence 只含 ref/digest 和脱敏状态。
    - 删除 `.qwq_output` 后可仅凭版本控制真相源和显式外部依赖重建。
    performance_points: []
    tests:
      planned:
      - quwoquan_ops/tests/local_contract/test_output_paths_layout__local_contract_test.py
      - quwoquan_ops/tests/local_contract/provider_conformance_evidence__contract__local_contract_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: output_source_truth_isolation
        cases:
        - local_contract.runtime.runtime_external_integration.output_source_truth_isolation
        envs: [local]
        test_object: security_policy
        quality_facet: security
      supporting: []
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  - python3 quwoquan_ops/gate/verify_output_layout.py
  - python3 quwoquan_ops/gate/verify_output_path_source_contract.py
  - python3 quwoquan_ops/gate/verify_external_provider_governance.py
  - python3 quwoquan_ops/gate/verify_provider_conformance_evidence.py
  profile_gates:
  - make gate
  - make gate-smoke
  - make gate-integration ENV=beta
  - make gate-integration ENV=gamma
  - make gate-release ENV=gamma
