version: 2
node:
  id: media-upload-and-storage--upload-session-and-cdn-delivery
  level: L3_story
  path: specs/feature-tree/runtime/runtime-media/media-upload-and-storage--upload-session-and-cdn-delivery
  title: media upload and storage  upload session and cdn delivery
  parent_domain_service: runtime
  parent_business_capability: runtime-media
scope:
  summary: 上传 ingress、内部对象存储与按媒体类型 canonical public slice 交付的单轨验收。
  in_scope:
  - InitUpload → upload ticket → CompleteUpload/Abort 的类型化会话
  - storageOrigin、uploadIngress 与 avatar/image/video deliveryBase 的职责隔离
  - App 仅消费 assetId/publicSliceKey，经 MediaDeliveryResolver 生成交付 URI
  - alpha/beta/gamma/prod 的 HTTPS、CA、Range/MIME 和真实设备证据边界
  out_of_scope:
  - 在 App 重写已签名 URL host 或保留 S3 presigned URL 的兼容路径
  - 将内部对象存储 authority 作为公开媒体交付 origin
gwt_acceptance:
  GWT1:
    title: 上传与公开媒体交付 authority 单轨
    given:
    - 当前环境 topology 已注入可达的 uploadIngress 和按媒体类型区分的 deliveryBase
    - 服务内部 storageOrigin 与公开 delivery authority 不同
    when:
    - 用户上传头像、图片或视频并完成媒体会话
    then:
    - InitUpload 只返回类型化 upload ticket，端侧不重写签名 authority
    - CompleteUpload 与业务投影只返回 assetId、版本和 canonical publicSliceKey，不持久化 upload URL、CAS key 或瞬时 cdnUrl
    - 公开 URL 只能由对应媒体类型的 deliveryBase 与 publicSliceKey 构造；错误 authority 被拒绝
    - Android/iOS 使用相同的 HTTPS/CA/host target，图片解码、视频 Range 206/MIME 与 player ready 有独立证据
    - 商用矩阵缺少 beta、gamma-local 或 prod-hosted 非 dry-run 设备报告时保持 GATE_BLOCK
    done_when:
    - local_contract、真实 storage api_integration 与 Android/iOS user_acceptance 对同一 assetId/publicSliceKey 均可复验
    edge_cases:
    - uploadIngress 与 storageOrigin 不同
    - 收到错误媒体类型或错误 delivery authority
    - 证书链无效、Range/MIME 不符合合同或播放器无法 ready
    contract_refs:
    - quwoquan_service/contracts/metadata/content/media_asset/service.yaml
    - specs/feature-tree/runtime/runtime-media/video-end-to-end-commercial-matrix.md
    - specs/feature-tree/runtime/runtime-media/image-end-to-end-commercial-matrix.md
    performance_points:
    - 视频公开交付必须支持 HTTPS Range 206 和 video/* MIME
    tests:
      planned: []
      recorded: []
    status: pending
