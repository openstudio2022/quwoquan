        - file: quwoquan_ops/tests/local_contract/test_media_delivery_manifest_parity__local_contract_test.py
        - file: quwoquan_ops/tests/local_contract/test_seeded_media_surface_head_range__local_contract_test.py
        - file: quwoquan_ops/tests/local_contract/test_environment_patrol_smoke__local_contract_test.py
        - file: quwoquan_ops/tests/local_contract/test_local_target_tls__local_contract_test.py
        - file: quwoquan_ops/tests/local_contract/test_local_gamma_media__local_contract_test.py
