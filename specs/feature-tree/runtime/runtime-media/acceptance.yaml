    notes:
      - "`prod-sim` 是 prod 语义的本地演练 target；生产播放证据只接受 `prod-hosted` 的 `gray-initial` release canary。"
      - 未产生真实 beta/gamma-local/prod-hosted 设备 ready 证据时，SIT 状态保持 partial，不能由 curl、dry-run 或页面节点存在替代。
  SIT2:
    title: VOD 权威描述符、storyboard、QoE 与有效播放分轨
    story_refs:
    - specs/feature-tree/discovery-content/content-display-journey-consistency/video-display-journey
    done_when:
    - 内容视频以 `{assetId, assetVersion, processorProfile}` 幂等处理，并且只允许 `processing -> ready | rejected`。
    - 只有 ready asset 可被 publish 和投影；descriptor 从服务端探测结果提供 verifiedDurationMs、尺寸、codec/container、canonical video/cover slice 与可选 previewTrack。
    - native duration 只用于 seek 边界和数据质量校验；超容差只产生一次去重事件/修复任务，不覆盖服务端权威值或伪装为播放失败。
    - previewTrack、缓存 key、帧访问和取消均绑定 asset/version/profile/access policy；缺轨或预览失败退化为时间浮标。
    - video_playback_qoe 只进入 Ops 强类型遥测，effective_play 只进入 content behavior；两条链路的字段、隐私和推荐消费者互不混用。
    - 每会话每内容最多一次 effective_play，服务端拒绝未达有效播放门槛、seek 虚增、buffering、后台或离屏时段。
    - SLS hourly 聚合与 dashboard/alert 能 readback P50/P95 ready/TTFF、rebuffer incidents per ready 和 duration mismatch rate，告警有最小样本量抑制。
    performance_points:
    - 首帧真实可用时采集 TTFF；平台无法取得首帧时不得伪报 TTFF，只报告 readyMs。
    - raw QoE 留存 3 天、去身份 hourly 聚合留存 90 天。
    tests:
      planned:
      - file: quwoquan_service/services/content-service/tests/local_contract/video_playback_descriptor__local_contract_test.go
      - file: quwoquan_service/services/content-service/tests/api_integration/video_media_processing__api_integration_test.go
      - file: quwoquan_service/services/content-service/tests/api_integration/effective_play_behavior__api_integration_test.go
      - file: quwoquan_ops/tests/local_contract/test_video_playback_qoe_sls__local_contract_test.py
      - file: quwoquan_app/test/user_acceptance/patrol/video/video_playback_qoe__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: video_playback_descriptor
        cases:
        - local_contract.runtime.runtime_media.video_descriptor.ready_asset_only
        - local_contract.runtime.runtime_media.video_descriptor.preview_access_and_version_binding
        - local_contract.runtime.runtime_media.video_qoe.behavior_isolation
        envs: &id002
        - alpha
      - layer: api_integration
        suite: video_media_processing
        cases:
        - api_integration.runtime.runtime_media.video_processing.ready_publish_projection
        - api_integration.runtime.runtime_media.effective_play.server_policy
        envs:
        - beta
        - gamma
      supporting:
      - layer: user_acceptance
        suite: video_playback_qoe
        cases:
        - user_acceptance.runtime.runtime_media.video_qoe.device_readback
        envs:
        - gamma_local
        - prod
        rollout_stages:
        - gray_initial
    notes:
    - 2026-07-18：现有播放器仅证明 controller initialize ready，尚不具备真实 TTFF、卡顿、seek 或时长偏差采集；effective_play、处理状态机、SLS readback 和真实设备证据均未实现，状态保持 pending。
