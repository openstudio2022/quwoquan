version: 2
node:
  id: runtime-media
  level: L2_business_capability
  path: specs/feature-tree/runtime/runtime-media
  title: runtime media
  parent_domain_service: runtime
  parent_business_capability: runtime-media
scope:
  summary: 四环境媒体交付、公开 slice key、播放器终态与防羊群验收。
  in_scope:
    - publicSliceKey / MediaDeliveryReference 命名与 authority-only 交付
    - App 图片负缓存与视频控制器槽位退出
    - manifest 驱动的 canonical media Range/MIME、Dart define parity 与门禁
    - alpha/beta/gamma-local/prod-sim 的本地 target preflight，以及 prod-hosted gray-initial 的 release canary 证据
  out_of_scope:
    - 独立的视频剪辑、转码策略和内容供给能力
sit_acceptance:
  SIT1:
    title: runtime media 交付与加载恢复 SIT
    story_refs: []
    done_when:
    - 同一逻辑资产在四环境仅 authority 不同
    - 404 负缓存阻止 rebuild 羊群
    - VideoPlayer dispose 不泄漏槽位；槽满可退出失败态
    - fixture/seed 媒体字段无环境字面量与 CAS path
    - canonical public video 在每个已启动 target 返回 HTTPS、Range 206 与 video/* MIME；失败会阻断该 target 的 Patrol/UAT
    - player ready 与可恢复/不可恢复失败分别有结构化、无 PII 证据
    performance_points: []
    tests:
      planned: []
      recorded:
        - file: quwoquan_app/test/local_contract/core/media/media_delivery_reference__local_contract_test.dart
        - file: quwoquan_app/test/local_contract/core/media/content_media_url__local_contract_test.dart
