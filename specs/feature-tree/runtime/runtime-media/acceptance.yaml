    notes:
    - 2026-07-19：商用准入拆分为 P0 progressive MP4/Range、P1-A storyboard、P1-B ABR。Android 已以 prepare-to-rendered-frame 与 seek discontinuity 后 rendered-frame 产出真实 TTFF/seek settle，并记录 dropped frames、audio underrun 与通用 renderer/queue/fallback；controller initialize 与 seekTo Future 仍不作为该证据。125 秒、3595 秒和 3605 秒 canary 的 probe/fast-start/GOP/时长/哈希本地合同已验证，effective_play 服务端防作弊及 QoE 字段分轨也已进入本地门禁。
    - 2026-07-20：发布证据合同进一步冻结为“可解析而非只存在”：Range health、物理 Android native 日志、物理 iOS Patrol、Perfetto trace/同 hash summary、SLS QoE 双网络桶 readback 均由 full gate 重新验证；prod 三阶段使用同一 preflight 主线。beta/gamma/prod-hosted 的非 dry-run 处理回调、早期/低端 Android 与 iOS 物理机、Perfetto、SLS readback 与同 release/config 的 prod 三阶段真实报告仍缺失；SIT2 只能保持 partial，`make gate-runtime-media-full` 继续 GATE_BLOCK。
