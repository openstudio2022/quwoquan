  SIT2:
    title: VOD 权威描述符、P0 seek、独立增强、QoE 与有效播放分轨
    story_refs:
    - specs/feature-tree/discovery-content/content-display-journey-consistency/video-display-journey
    done_when:
    - 内容视频以 `{assetId, assetVersion, processorProfile}` 幂等处理，并且只允许 `processing -> ready | rejected`。
    - P0 只有真实 probe 验证过 H.264/AAC、时长、尺寸、GOP/keyframe、fast-start、hash 与 canonical video/cover slice 的 ready asset 可被 publish 和投影；seed 不得直接伪造 ready。
    - 产品时长上限为 3600000ms；125000ms 资产用于 seek 回归，3605000ms 资产必须被超上限策略拒绝，同时保留接近一小时合法资产的边界验证。
    - native duration 只用于 seek 边界和数据质量校验；超容差只产生一次去重事件/修复任务，不覆盖服务端权威值或伪装为播放失败。
    - P0 拖动只更新虚拟 target，release 只提交一次 seek；切集/dispose 的过期 generation、buffering、ended/replay 和 seek failure 均有确定状态与结构化恢复。
    - P1-A previewTrack、缓存 key、帧访问和取消均绑定 asset/version/profile/access policy；缺轨或预览失败退化为时间浮标，不阻断 P0。
    - P1-B HLS/CMAF descriptor、rendition set、codec ladder、segment/keyframe、MIME/CORS/鉴权/cache-control 和平台 capability matrix 独立验收；ABR 关闭或失败时回退 P0。
    - video_playback_qoe 只进入 Ops 强类型遥测，effective_play 只进入 content behavior；两条链路的字段、隐私和推荐消费者互不混用。
    - video_playback_qoe 必须携带低基数 devicePlatform/networkClass 与 effectivePlaybackMs，使 rebuffer time ratio、Android Wi-Fi/蜂窝 TTFF/seek settle、终态失败、掉帧和 audio underrun 可由 SLS readback 直接计算；任一必需字段缺失不得以零值补齐。
    - 每会话每内容最多一次 effective_play，服务端拒绝未达有效播放门槛、seek 虚增、buffering、后台或离屏时段。
    - SLS hourly 聚合与 dashboard/alert 能 readback P50/P95 TTFF/seek settle、rebuffer incidents per ready、seek failure 和 duration mismatch rate，告警有最小样本量抑制。
    - 发布级 user_acceptance evidence 必须重新解析 Range health report、物理 Android 原始 native 日志、物理 iOS Patrol 成功 run、Android Perfetto trace/同 hash 指标摘要和结构化 SLS QoE readback；只检查文件存在、手写布尔值或 simulator 均不得通过。
    - prod-hosted 的 gray-initial、carry-on、full 必须各自可执行同一个 release canary preflight，并绑定同一 commit、production config hash 与 media identity；任一阶段不可达即阻断后续阶段。
    - Android 不按品牌或具体机型维护 renderer/codec 分支；统一能力策略必须覆盖最低支持 API、低内存、低算力、软件 decoder 与能力缺失，并保留结构化降级和真实物理机证据。
    performance_points:
    - 首帧真实可用时采集 TTFF；平台无法取得首帧时不得伪报 TTFF，只报告 readyMs。
    - 首帧成功率 >= 99.5%；P95 Wi-Fi <= 1500ms、蜂窝网络 <= 2500ms。
    - release seek settle P95 Wi-Fi <= 1000ms、蜂窝网络 <= 2000ms；seek failure rate < 0.5%。
    - 拖动 move 期间 native seek 次数为 0，触控到 thumb/time 更新 P95 <= 50ms，>2x vsync 的 jank frame < 1%。
    - 30 秒播放窗口 dropped-frame ratio < 1%、audio underrun = 0；秒级黑帧或主线程 stall 为阻断。
    - rebuffer sessions / ready sessions < 2%，rebuffer time / effective playback time < 1%，终态播放失败率 < 0.5%。
    - P1-A preview 内存/磁盘/网络命中 P95 分别 <= 100ms/300ms/1000ms；超时或失败只允许降级。
    - raw QoE 留存 3 天、去身份 hourly 聚合留存 90 天。
