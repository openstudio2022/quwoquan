version: 2
node:
  id: gray-release-to-prod
  level: L3_story
  path: specs/feature-tree/runtime/deliver-deploy-prod-pipeline/gray-release-to-prod
  title: gray release to prod
  parent_domain_service: runtime
  parent_business_capability: deliver-deploy-prod-pipeline
scope:
  summary: prod 仅有一个生产环境；gray-initial / carry-on / full 只是 prod rollout stage。发布前
    真实远端复验统一收敛到 prod gray-initial，不引入 prod-gray 第二环境。
  in_scope:
  - prod gray-initial 的 hosted deploy、只读/幂等 api_integration 与 Journey/Page
    user_acceptance
  - rollout stage 配置、SLO 决策、审批与回滚证据
  - 与 local-gamma-mirror 的职责边界收敛
  out_of_scope:
  - 提交前本地左移链路
  - 新增生产环境枚举或第二套发布拓扑
gwt_acceptance:
  GWT1:
    title: prod gray-initial 承接真实远端复验
    given:
    - local-gamma-mirror 已完成提交前左移验证。
    - pre-release gate、包纯度、环境拓扑、host allowlist 与 deploy contract 已通过。
    when:
    - 触发 gray release 到 prod 的 Stage 1 初始灰度。
    then:
    - 发布仅在 prod 环境语义下执行，gray-initial 作为 rollout stage 承接真实远端复验。
    - gray-initial 必须执行只读/幂等 api_integration 与 Journey/Page user_acceptance，不得
      以 local-gamma 或 beta/gamma 结果直接代替。
    done_when:
    - 生产灰度口径已统一为 prod rollout stage，不再出现 prod-gray 第二环境。
    - 发布前只认 prod gray-initial rollout stage 的远端证据，和 local-gamma-mirror 职责不重叠。
    edge_cases:
    - gray-initial 不可用时必须 GATE_BLOCK，不能回退为“只看 beta/gamma”。
    - 只读/幂等 api_integration 才能进入 prod gray-initial 自动链，写操作需显式审批。
    contract_refs:
    - quwoquan_ops/environments/environment_topology_manifest.yaml
    - quwoquan_ops/environments/gamma_validation_suites.json
    - quwoquan_ops/environments/workload_topology_inventory.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_ops/acceptance/api_integration/test_prod_deploy_contract__api_integration_test.py
      - file: quwoquan_ops/acceptance/api_integration/test_prod_plane_runtime_stack__api_integration_test.py
      - file: quwoquan_ops/acceptance/api_integration/test_resolve_prod_release_state__api_integration_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: api_integration
        suite: gray_initial_release_contract
        cases:
        - api_integration.runtime.deliver_deploy_prod_pipeline.gray_release_to_prod.gray_initial_release_contract
        envs: &id001
        - prod
        rollout_stages:
        - gray_initial
      - layer: user_acceptance
        suite: gray_initial_journey_page_matrix
        cases:
        - user_acceptance.runtime.deliver_deploy_prod_pipeline.gray_release_to_prod.gray_initial_journey_page_matrix
        envs:
        - prod
        rollout_stages:
        - gray_initial
      supporting:
      - layer: local_contract
        suite: gray_release_stage_contract
        cases:
        - local_contract.runtime.deliver_deploy_prod_pipeline.gray_release_to_prod.gray_release_stage_contract
        envs:
        - alpha
        - local
    notes:
    - 2026-06-22 口径收敛：生产只有 prod，一个 rollout stage 命名为 gray_initial；不新增 prod-gray。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate-full
