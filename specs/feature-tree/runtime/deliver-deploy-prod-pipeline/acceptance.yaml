      domain 不双归属（local_contract）。'
    - '[migrated_from_planned] 契约不变合同测试：拆分前后域级 API path / route / Service DNS 名 /
      端侧 runtime 注入 / 数据面归属一致（local_contract/api_integration）。'
    - '[migrated_from_planned] gamma-local 与 prod-hosted 同构启停 + health/inspect/doctor
      + 用户主链路无感知漂移（local_contract/user_acceptance）。'
    - '[migrated_from_planned] 反模式门禁：拒绝多业务容器共享 Pod 当常态、sidecar 承载领域职责、集群内自建 DB StatefulSet
      默认、硬编码 DB 连接/跨域直连。'
