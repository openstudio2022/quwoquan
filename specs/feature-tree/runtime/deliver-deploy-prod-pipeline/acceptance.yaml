version: 2
node:
  id: deliver-deploy-prod-pipeline
  level: L2_business_capability
  path: specs/feature-tree/runtime/deliver-deploy-prod-pipeline
  title: deliver deploy prod pipeline
  parent_domain_service: runtime
  parent_business_capability: deliver-deploy-prod-pipeline
scope:
  summary: deliver deploy prod pipeline 验收范围（含 main 自动 promotion 主链与 ACK 集群部署形态）。
  in_scope:
  - main 后单一自动 promotion 主链与统一证据归档
  - prod-hosted ACK single-cluster + modular-monolith-first + 独立 Deployment + 托管数据面
  - Strangler split-ready 拆分与契约不变
  - gamma-local 与 prod-hosted 工作负载图谱同构
  out_of_scope:
  - 新增 beta-hosted / prod-gray 等额外环境名
  - 多业务容器共享 Pod / sidecar 承载领域职责 / 集群内自建数据库 StatefulSet 默认
sit_acceptance:
  SIT1:
    title: deliver deploy prod pipeline 能力 SIT
    story_refs: []
    done_when:
    - '`main` 入库后存在单一自动 promotion workflow，能按 `alpha-local -> beta-local -> prod-hosted(gray-initial
      -> carry-on -> full)` 固定顺序执行（gamma 仅本地，旧 gamma-hosted 阶段已退役，远端复验由 prod gray-initial
      承接）。'
    - '`stackctl`、workflow、runbook 与环境矩阵口径一致，不再维护第二套自动推进或回滚逻辑。'
    - '`prod initial -> prod checks -> prod full` 之间的健康检查、只读集成探针、SLO gate 与 auto rollback
      可验证。'
    performance_points:
    - '`mainline_auto_prod` blocking critical path `<= 900s`，并有机器可读 timing summary
      证据。'
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.runtime.deliver_deploy_prod_pipeline.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        suite: sit1_api_integration
        cases:
        - api_integration.runtime.deliver_deploy_prod_pipeline.sit1.sit1_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.runtime.deliver_deploy_prod_pipeline.sit1.sit1_local_contract
        envs: *id001
      - layer: user_acceptance
        suite: end_to_end_journey
        cases:
        - user_acceptance.runtime.deliver_deploy_prod_pipeline.sit1.end_to_end_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] `deploy/shared/gamma_validation_suites.json` 新增 `mainline_auto_prod`
      profile，并由 workflow / verify 脚本消费。'
    - '[migrated_from_planned] `stackctl deploy/health/inspect/doctor` 在 beta/gamma/prod
      阶段输出统一证据。'
    - '[migrated_from_planned] `07. Deploy To Prod (Auto)` 通过主链 timing summary 与 stage
      artifacts 证明 900 秒预算与 rollback 闭环。'
  SIT2:
    title: ACK 集群部署形态（modular-monolith-first + split-ready）SIT
    story_refs: []
    done_when:
    - '`prod-hosted` 首发形态为 `seed-box` 单 Deployment + `recommendation`/实时/媒体各自独立 Deployment，无
      sidecar 承载领域职责。'
    - 三层正交边界成立：领域服务=逻辑真相源，Deployment=部署单元，单 ACK 集群+共享节点池=物理资源；对外稳定标识是 Service 而非 Deployment。
    - 数据面采用固定小规格存算分离单主（PolarDB PostgreSQL / Tair / MongoDB 单主，不依赖 Serverless）+ 同 VPC
      私网 + ExternalName/DSN 抽象 + Secret 注入；每域只连归属存储，无硬编码连接、无跨域直连。
    - Strangler 拆分前后，域级 API / route / Service 名 / 端侧配置 / 数据面归属完全不变。
    - '`gamma-local` 与 `prod-hosted` 工作负载图谱（含数据面 Service 名/DSN 变量）同构；`stackctl` /
      workflow / ACK root 对同一 inventory 解释一致。'
    contract_refs:
    - deploy/shared/process_domain_mapping.yaml
    - deploy/shared/module_package_mapping.yaml
    - deploy/kustomization/aliyun-prod/kustomization.yaml
    - deploy/shared/environment_topology_manifest.yaml
    performance_points:
    - 成本优化走标准 K8s 能力（requests/limits + bin-packing + HPA + cluster-autoscaler），低峰可缩容降本。
    tests:
      planned: []
      recorded: []
      pending_evidence:
      - api_integration/user_acceptance：真实 ACK 集群 stackctl deploy/health/inspect/doctor
        全链与用户主链路无感漂移，待生产账号环境执行（本地无云账号不虚标）。
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit2_local_contract
        cases:
