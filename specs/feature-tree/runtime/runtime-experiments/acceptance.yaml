version: 2
node:
  id: runtime-experiments
  level: L2_business_capability
  path: specs/feature-tree/runtime/runtime-experiments
  title: runtime experiments
  parent_domain_service: runtime
  parent_business_capability: runtime-experiments
scope:
  summary: 统一 runtime hash 分桶、推荐/搜索复用、实际流量归因及未绑定控制面 fail-closed。
  in_scope:
  - runtime/experiments AssignBucket 与 HashResolver
  - recommendation recpolicy 与 search ranking 的 resolver 复用
  - 实际曝光/查询事实中的 experimentBucket
  - Product Ops Experiment/ExperimentAssignmentFact 冻结门禁
  out_of_scope:
  - Product Ops 到 runtime 的 durable policy/assignment binding
sit_acceptance:
  SIT1:
    title: runtime experiments 能力 SIT
    story_refs: []
    done_when:
    - 相同 experimentId、subjectKey 与 bucket 权重始终得到可复现结果。
    - recommendation 与 search 不复制 hash 算法，均复用 runtime/experiments。
    - 未绑定线上流量的 Product Ops assignment 轨不进入热路径或 Portal。
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: sit1_local_contract
        cases:
        - local_contract.runtime.runtime_experiments.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        execution_profile: integration
        suite: sit1_api_integration
        cases:
        - api_integration.runtime.runtime_experiments.sit1.sit1_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: sit1_local_contract
        cases:
        - local_contract.runtime.runtime_experiments.sit1.sit1_local_contract
        envs: *id001
    notes:
    - '[evidence] quwoquan_service/runtime/experiments/experiments_test.go'
    - '[evidence] quwoquan_service/runtime/recpolicy/policy_test.go'
    - '[evidence] quwoquan_service/services/search-service/internal/application/experiments_repeatability__local_contract_test.go'
    - '[gate] quwoquan_service/scripts/recommendation/verify_experiment_single_track.py'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  - bash quwoquan_service/scripts/recommendation/verify_recommendation_service_contract.sh
  profile_gates:
  - make gate
