version: 2
node:
  id: article-commercial-scale-closure
  level: L3_story
  path: specs/feature-tree/runtime/runtime-data-engineering/article-commercial-scale-closure
  title: article commercial scale closure
  parent_domain_service: runtime
  parent_business_capability: runtime-data-engineering
scope:
  summary: 旅行/摄影文章来源 shared commercial pool、唯一文章商业执行分支、H100/H1000 真实闭环与 10k evaluate-only 验收范围。
  in_scope:
  - article/homepage shared commercial pool onboarding
  - authoritative H100 article/homepage runtime evidence
  - H1000 scale-up after H100
  - TokenLedger/firstPassRate/sdk-monitoring/release-import-search-reco evidence
  out_of_scope:
  - Pinterest image-only lane
  - video lane
  - creator pool新一轮扩池
  - 10k/日实际生产放量交付
gwt_acceptance:
  GWT1:
    title: open-ended article sources enter one onboarding contract and shared commercial pool
    given:
    - 旅行/摄影文章来源站点允许开放式扩展，但 commercial path 只接受统一 onboarding 合同。
    - 站点 registry、source quality、rights policy 与 onboarding gate 使用单一真相源。
    when:
    - 运营把现有与新增站点纳入 article source onboarding，并尝试进入 shared commercial pool。
    then:
    - "每个站点都被裁决为 `commercial_release`、`controlled_trial`、`reference_only` 或 `blocked` 之一。"
    - shared commercial pool 只汇总通过 rights/source quality/mixed-layout/homepage closure 的站点与来源。
    - "不再允许退场的 `source_plan`、`knownArticleSources`、prior-plan source reuse、双 planning contract 作为 acceptance path。"
    done_when:
    - 开放式站点扩展不再产生第二套 article 商业主线，所有 commercial source 都能通过统一 onboarding 报表与 gate 解释。
    edge_cases:
    - 单站点可继续保留 discovery/reference 能力，但不得冒充 commercial release source。
    - 新站点可进入 shared pool，不要求各自独立跑 H100/H1000。
    contract_refs:
    - quwoquan_data/verticals/travel/sources/source_registry.yaml
    - quwoquan_data/scripts/content/source/source_inputs.py
    - quwoquan_data/scripts/content/source/research/auto_plan_writer.py
    - quwoquan_data/scripts/content/execution/pipeline/content_plan.py
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/governance/test_travel_source_registry__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/core/test_content_plan_source_contract__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/core/test_auto_content_plan__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/source/test_auto_research_article_homepage__behavior__functional__local_contract_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: article_source_onboarding
        cases:
        - local_contract.runtime.runtime_data_engineering.article_commercial_scale_closure.gwt1.onboarding
        envs: [local]
  GWT2:
    title: authoritative H100 article and homepage batch closes with real cursor_sdk evidence
    given:
    - shared commercial pool 已筛出足够的 article/homepage source-ready capacity。
    - "执行面统一使用 `cursor_sdk` 与默认最新 `composer`。"
    when:
    - 运营运行一条 H100 article+homepage 真实 batch，从 download 到 publish 全链闭环。
    then:
    - "批次必须同时生成 `env_ready_report.json`、`workflow_state.json`、`token_ledger.json`、`managed_batch_audit.json`、`sdk_monitoring_report.json` 与 `scale_readiness` 报告。"
    - "H100 准出账本口径（2026-07-06 用户裁定）：本地 cursor_sdk bridge 尚不回传 usage 字段，`TokenLedger.measurementMode=estimated_from_artifacts` 在 H100 可准出，但必须通过 `verify scale-readiness --accept-estimated-token-ledger` 与 `verify sdk-monitoring --accept-estimated-token-ledger` 显式声明接受；门禁默认仍严格阻断，禁止静默放宽。authoritative usage 账本保留为后续升级项（见 backlog R-CS03）。"
    - "`firstPassRate`、`objectsPerHour`、release/import/search/reco visibility 必须来自真实批次证据，而不是结构化注入。"
    done_when:
    - "H100 以真实批次证据通过（账本允许显式接受的 estimated 口径），且 `firstPassRate >= 0.9`、source sufficiency 与 text_only 口径下的 homepage closure 门同时满足。"
    edge_cases:
    - "`allowPartialContent=true` 时允许失败对象诚实降级，但不得污染成功对象 release/import。"
    - "`cursorStartup.ready=false`、`task_workflow_state != succeeded` 或 `managedBatchAudit.failedLaneCount > 0` 时，必须 `GATE_BLOCK`。"
    contract_refs:
    - quwoquan_data/scripts/content/execution/pipeline/pipeline_run.py
    - quwoquan_data/scripts/content/execution/pipeline/metrics.py
    - quwoquan_data/scripts/content/execution/readiness_audit.py
    - quwoquan_data/AGENTS.md
    performance_points:
    - H100 至少具备真实 TokenLedger、firstPassRate、objectsPerHour、release/import/search/reco 证据。
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/release/test_active_runtime_preflight__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/post/test_homepage_independent_review_evidence__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/release/test_execution_readiness__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/api_integration/release/test_release_first_ship__behavior__functional__api_integration_test.py
      - file: quwoquan_data/tests/user_acceptance/journeys/content_execution/test_execution_work_package_operator_journey__behavior__functional__user_acceptance_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: article_h100_contract
        cases:
        - local_contract.runtime.runtime_data_engineering.article_commercial_scale_closure.gwt2.h100
        envs: [local]
      supporting:
      - layer: api_integration
        suite: article_release_visibility
        cases:
        - api_integration.runtime.runtime_data_engineering.article_commercial_scale_closure.gwt2.release_visibility
        envs: [beta, gamma]
      - layer: user_acceptance
        suite: article_operator_journey
        cases:
        - user_acceptance.runtime.runtime_data_engineering.article_commercial_scale_closure.gwt2.operator
        envs: [gamma_local]
  GWT3:
    title: article homepage source sufficiency and mixed-layout stay honest at commercial scale
    given:
    - article lane 允许 travel/photography 站点进入 shared pool，但必须保持 single-source-one-work、homepage closure 与 mixed-layout 同源。
    when:
    - batch 同时消费 homepage 与 article source，并尝试 materialize mixed-layout article。
    then:
    - "article 不得因历史图文不同源旁路而静默退化成 `text_only`；但 H100 本轮（2026-07-06 用户裁定 R-CS10 收口）按显式声明的 `text_only` 文章准出口径执行：qunar 逐图 rights 缺失（全沙箱 2762 个 source unit assetCount=0），图文同源列为后续升级项。text_only 准出必须通过 `verify scale-readiness --accept-text-only-articles` 显式声明，门禁默认仍阻断 text_only release，禁止静默退化。"
    - homepage 缺失时必须隔离对应 entityRefs，不得让 released post 出现 dangling homepage 引用。
    - source insufficiency 必须进入 partialDelivery / warning / blocker，而不是用 retired fallback 或 source reuse 冒充满足。
    done_when:
    - "`R-CS01`、`R-CS07`、`R-CS10` 在 shared commercial pool 上有真实批次证据，而不是只剩结构验证。"
    edge_cases:
    - source-ready capacity 不足时允许诚实 shortfall，但不允许伪造 homepage/article 成功。
    - factual_reference_only 仍需经过底稿贴合度与 mixed-layout 同源门，不得用“站点多了”掩盖质量退化。
    contract_refs:
    - quwoquan_data/scripts/content/execution/pipeline/pipeline_run.py
    - quwoquan_data/scripts/content/source/research/source_quality.py
    - quwoquan_data/scripts/core/base_draft.py
    - quwoquan_data/scripts/content/release/canonical/gate.py
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/source/test_source_quality_gate__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/core/test_content_plan_source_gate__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/post/test_route_brief_and_evidence__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/user_acceptance/quality/test_release_integrity_gate__behavior__functional__user_acceptance_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: article_sufficiency_and_mixed_layout
        cases:
        - local_contract.runtime.runtime_data_engineering.article_commercial_scale_closure.gwt3.sufficiency
        envs: [local]
  GWT4:
    title: H1000 follows H100 and 10k stays evaluate-only
    given:
    - H100 已 authoritative 通过。
    - H1000 仍沿用同一 commercial branch、shared pool 与 acceptance contract。
    when:
    - 运营把同一 article/homepage 商业线从 H100 放大到 H1000，并基于真实结果评估 10k/日。
    then:
    - H1000 只放大对象量，不得再次改写 contract、来源口径或 provider 口径。
    - "10k/日结论只基于 H1000 的 `measured throughput`、`unitPassedCost`、`sourceReadyObjectCapacity`、`firstPassRate` 与下游 visibility 证据。"
    - "若命中 `queueBackend=reliabletask`、吞吐或稳定性门槛，则只输出 `NO_GO / GATE_BLOCK`，不得提前承诺 10k 可达。"
    done_when:
    - H1000 的 throughput/queue stability/partialDelivery/creator load 证据齐全，且 10k 评估结论诚实可追溯。
    edge_cases:
    - "`R-CS02` 只在 H1000 后成为 10k evaluate 的硬门，不得反向阻断 H100 收口。"
    contract_refs:
    - quwoquan_data/scripts/content/execution/readiness_audit.py
    - specs/feature-tree/runtime/runtime-data-engineering/article-commercial-scale-closure/spec.md
    - specs/changelog/CR-20260704-085-sichuan-source-supply-scale-gates.yaml
    performance_points:
    - H1000 必须给出 measured throughput、unitPassedCost、sourceReadyObjectCapacity、firstPassRate 的真实实测值。
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/release/test_execution_readiness__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/execution/test_execution_shared_evidence__behavior__functional__local_contract_test.py
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: article_h1000_and_10k_eval
        cases:
        - local_contract.runtime.runtime_data_engineering.article_commercial_scale_closure.gwt4.h1000
        envs: [local]
      supporting:
      - layer: api_integration
        suite: article_scale_runtime
        cases:
        - api_integration.runtime.runtime_data_engineering.article_commercial_scale_closure.gwt4.scale_runtime
        envs: [gamma]
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
