gwt_acceptance:
  GWT1:
    title: Pinterest image-only commercial lane stays scoped and auditable
    given:
    - 商业验证任务显式声明只做 Pinterest `image` lane，且 workflowPolicy 绑定唯一执行分支。
    - Pinterest 来源 registry、content_source_registry 与 vertical license policy 同时声明 `attribution_no_watermark`。
    - local runtime 以任务级 `QWQ_DATA_ROOT/QWQ_RUNTIME_ROOT/QWQ_PUBLISH_ROOT` 运行，shell supervisor 不再用全局 `pkill` 或日志猜完成。
    when:
    - 运营通过 `site-supply ingest-attributed-assets` 或等价正式入口导入 Pinterest 公开图归因清单，并推进到 image work content_plan 与 managed author/review。
    then:
    - 只有具备 `pinUrl/discoveryUrl/originalAssetUrl/sourceAuthor/repostAttribution/watermarkScan/ocrScan/modelReleaseStatus/collectedAt` 的图片才可进入发布候选。
    - content_plan / base draft / release integrity 保持单一 `sourceCollectionId`，禁止多来源拼接和大改重写。
    - workflow 完成判定来自 task workflow state / audit / downstream evidence，而不是 `WORKFLOW COMPLETE` 文本 grep。
    done_when:
    - H100/H1000 前置代码路径都已被 local_contract 锁住，且商业评估只依赖真实下载、真实 author、真实 release、真实 TokenLedger/firstPassRate/throughput 证据。
    edge_cases:
    - Pinterest 受控试跑 `controlled_trial` 仍不能冒充真实发布，必须走 `attribution_publish_ingest`。
    - 原图或 pin 缺作者、转载出处、无水印/OCR 扫描时必须阻断。
    - local runtime 存在其他批次运行时，只允许观察，不得跨任务误清理。
    contract_refs:
    - quwoquan_data/verticals/travel/sources/source_registry.yaml
    - quwoquan_data/verticals/photography/sources/source_registry.yaml
    - quwoquan_data/verticals/travel/rights/license_policy.yaml
    - quwoquan_data/verticals/photography/rights/license_policy.yaml
    - quwoquan_data/scripts/site_supply/authorized_assets.py
    - quwoquan_data/scripts/task/run.py
    - quwoquan_data/scripts/task/fanout_runner.py
    performance_points:
    - H100 至少产出真实 TokenLedger / firstPassRate / objectsPerHour / release-import-search-reco 证据。
    - H1000 只在 H100 全绿后推进，并以 reliabletask + local runtime isolation 作为并发基线。
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/site_supply/test_tuchong_authorized_assets__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/site_supply/test_pinterest_public_pin__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/common/test_image_provider_compliance__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/vertical/test_image_rights_asset_level__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/vertical/test_travel_source_registry__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/task/test_managed_preflight_workspace__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/task/test_trial_review__local_contract_test.py
      - file: quwoquan_data/tests/verify/test_site_scale_readiness.py
      recorded:
      - file: quwoquan_data/tests/local_contract/site_supply/test_tuchong_authorized_assets__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/site_supply/test_pinterest_public_pin__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/common/test_image_provider_compliance__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/vertical/test_image_rights_asset_level__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/vertical/test_travel_source_registry__local_contract_test.py
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.runtime.runtime_data_engineering.geo_content_trinity.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt1_pinterest_image_only_local_contract
        cases:
        - local_contract.runtime.runtime_data_engineering.geo_content_trinity.gwt1_pinterest_image_only_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: image_release_visibility
        cases:
        - api_integration.runtime.runtime_data_engineering.geo_content_trinity.image_release_visibility
        envs:
        - gamma
    notes:
    - Pinterest image-only 商业验证仅接受单源图片作品与真实下载证据，不接受 homepage/article 泛改造冒充完成。
  GWT2:
    title: partial delivery and failed entity reference isolation
    given:
    - 内容生产任务配置了实体主页、文章、图片或视频目标额度。
    - 部分对象或实体主页在来源、质量、权利或审核门中失败。
    when:
    - 数据工程执行 publish、release integrity、scale readiness 与 trial review。
    then:
    - release 只包含已通过质量与权利门的成功文章、图片、视频和主页对象。
    - 未达额度只写入 partialDelivery 履约率、warning 与审计证据，不阻断成功对象发布。
    - 未发布实体主页对应的 entityRefs、normalizedEntityRefs 与正文 /entity 链接被剔除或降级，保留 pendingEntityMentions
      供后续补实体审核。
    done_when:
    - 成功对象可独立发布，失败对象不污染下游 release/import。
    edge_cases:
    - 实体主页 0 个但 postCount > 0 时，publish 可继续且实体引用为空。
    - image/video 不满目标时只影响对应 lane fulfillment，不影响文章发布。
    - allowPartialContent=false 的任务仍按全量契约硬阻断。
    contract_refs:
    - quwoquan_data/scripts/publish/gate.py
    - quwoquan_data/scripts/_common/publish_filter.py
    - quwoquan_data/scripts/verify/scale_readiness.py
    - quwoquan_data/scripts/task/trial_review.py
    performance_points:
    - partialDelivery.fulfillment 可用于百级、千级、万级扩容时估算真实产能。
    tests:
      planned:
      - file: quwoquan_data/tests/annotate/test_annotate_publish_filter.py
      - file: quwoquan_data/tests/local_contract/task/test_workflow_state_machine__local_contract_test.py
