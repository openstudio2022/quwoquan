      - file: quwoquan_data/tests/user_acceptance/workflow/test_task_run_operator_journey__user_acceptance_test.py
      - file: quwoquan_data/tests/verify/test_scale_readiness.py
      - file: quwoquan_data/tests/task/test_trial_review.py
      recorded:
      - file: quwoquan_data/tests/local_contract/annotate/test_annotate_publish_filter__local_contract_test.py
