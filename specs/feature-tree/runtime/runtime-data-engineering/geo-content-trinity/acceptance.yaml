version: 2
node:
  id: geo-content-trinity
  level: L3_story
  path: specs/feature-tree/runtime/runtime-data-engineering/geo-content-trinity
  title: geo content trinity
  parent_domain_service: runtime
  parent_business_capability: runtime-data-engineering
scope:
  summary: 主页、文章、图片和视频复用同一 execution、来源权利与发布闭包。
  in_scope:
  - 四类内容的单 execution 五阶段结构。
  - source unit、图片权利、creator/tag/entity 引用与 review 闭包。
  - 失败对象隔离和成功对象独立发布。
  out_of_scope:
  - 按站点建立第二套 runner 或发布目录。
gwt_acceptance:
  GWT1:
    title: 多内容类型复用同一来源与权利合同
    given:
    - recipe 明确 contentType，来源与权利规则来自静态 registry。
    when:
    - execution 执行 download、quality、compose、draft、review。
    then:
    - 四类内容均使用相同 source unit、Agent 审计与逐图权利闭包。
    - 中间文件只进入 execution，approved 对象才进入 publish/release。
    done_when:
    - 图片来源、下载字节、授权与发布引用均可回放。
    edge_cases:
    - 缺作者、原始来源、授权或无水印/OCR 结论时阻断该对象。
    contract_refs:
    - quwoquan_data/verticals/travel/sources/source_registry.yaml
    - quwoquan_data/verticals/travel/rights/license_policy.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/core/test_image_provider_compliance__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/governance/test_image_rights_asset_level__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/governance/test_travel_source_registry__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/source/test_auto_research_image_lane__behavior__functional__local_contract_test.py
      recorded:
      - file: quwoquan_data/tests/local_contract/core/test_image_provider_compliance__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/governance/test_image_rights_asset_level__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/governance/test_travel_source_registry__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/source/test_auto_research_image_lane__behavior__functional__local_contract_test.py
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: geo_content_rights
        cases:
        - local_contract.runtime.runtime_data_engineering.geo_content_trinity.gwt1.rights
        envs: [local]
      supporting: []
    notes: []
  GWT2:
    title: 失败对象隔离与成功对象独立发布
    given:
    - 同一 execution 中部分对象在来源、质量、权利或 review 门失败。
    when:
    - 生成 canonical publish 与 immutable release。
    then:
    - release 只包含 approved 对象，失败对象保留在 execution evidence。
    - 下游不得看到悬挂 entity、creator、tag 或 media 引用。
    done_when:
    - release-first ship 与 operator journey 契约通过。
    edge_cases:
    - 某一内容类型为零不污染其他已批准内容类型。
    contract_refs:
    - quwoquan_data/scripts/content/release/canonical/gate.py
    - quwoquan_data/scripts/core/publish_filter.py
    performance_points: []
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/homepage/test_annotate_publish_filter__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/source/test_auto_research_article_homepage__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/api_integration/release/test_release_first_ship__behavior__functional__api_integration_test.py
      - file: quwoquan_data/tests/user_acceptance/journeys/content_execution/test_execution_work_package_operator_journey__behavior__functional__user_acceptance_test.py
      recorded:
      - file: quwoquan_data/tests/local_contract/homepage/test_annotate_publish_filter__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/source/test_auto_research_article_homepage__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/api_integration/release/test_release_first_ship__behavior__functional__api_integration_test.py
      - file: quwoquan_data/tests/user_acceptance/journeys/content_execution/test_execution_work_package_operator_journey__behavior__functional__user_acceptance_test.py
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: geo_content_partial_delivery
        cases:
        - local_contract.runtime.runtime_data_engineering.geo_content_trinity.gwt2.partial_delivery
        envs: [local]
      - layer: api_integration
        suite: geo_content_release
        cases:
        - api_integration.runtime.runtime_data_engineering.geo_content_trinity.gwt2.release
        envs: [beta, gamma]
      supporting: []
    notes: []
