version: 2
node:
  id: filter-catalog-release
  level: L3_story
  path: specs/feature-tree/discovery-content/publish-comment-reaction/filter-catalog-release
  title: filter catalog release
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction
scope:
  summary: 滤镜目录以不可变 FilterCatalogRelease 单轨发布，App 经 typed query、verified cache 和同源 bootstrap replica 消费。
  in_scope:
  - FilterCatalogRelease、FilterCategoryDefinition、FilterPresetDefinition、FilterAdjustmentValues 的 metadata 与状态机。
  - Stage、Activate、Rollback、GetActiveFilterCatalog typed operations。
  - content-service Store/Reader/Facade/HTTP 装配和单 active 原子切换。
  - App RemoteFilterCatalogQuery、VerifiedFilterCatalogStore、coordinator 与图片编辑器注入。
  - canonical catalog artifact、四环境 seed、bootstrap replica 和 digest 同源门禁。
  out_of_scope:
  - EditRecipe、FilterUsageFact、FilterUsageStatsView 与圈子交集。
  - 图片像素算法和 MediaAsset variants。
gwt_acceptance:
  GWT1:
    title: 不可变目录可幂等 Stage 并单 active 激活
    given: [data publish plane 持有通过 schema 与目录不变量校验的 canonical catalog artifact]
    when: [Stage 相同 digest 两次并 Activate 新 release]
    then:
    - 相同 digest 重放返回首次 release，不产生第二份目录。
    - 同 Idempotency-Key 不同 payload 返回 CONTENT.USER.filter_catalog_idempotency_conflict。
    - 新 release 原子变为 active，旧 active 变为 retired，同一环境只有一个 active。
    - 分类、预设、推荐列表和调整参数在 Stage 后不可修改。
    done_when: [Mongo 真实引擎 contract 覆盖 digest 幂等、状态机和单 active CAS]
    edge_cases: [未知 release、非法引用、重复 ID、越界参数、半写入事务回滚]
    contract_refs:
    - quwoquan_service/contracts/metadata/content/filter_catalog_release/aggregate.yaml
    - quwoquan_service/contracts/metadata/content/filter_catalog_release/service.yaml
    performance_points: [Stage/Activate P95 <= 1000ms]
    tests:
      planned:
      - file: quwoquan_service/services/content-service/tests/api_integration/filter_catalog_release__api_integration_test.go
      recorded: []
    status: pending
  GWT2:
    title: active catalog 可公开读取且可原子回滚
    given: [环境已有 active release 和至少一个 retired release]
    when: [public Reader 获取 active catalog，随后 publish plane Rollback 到 retired release]
    then:
    - GET 只返回完整 active release，不暴露 sourceOwner、receipt 或内部操作字段。
    - Rollback 后 public GET 立即返回目标 release，原 active 变 retired。
    - 重复回滚到已 active release 为 no-op receipt，不递增 version。
    done_when: [service contract 与真实 HTTP api_integration 同时覆盖]
    edge_cases: [active 缺失返回结构化不可用；目标不是 retired 返回非法状态迁移]
    contract_refs:
    - quwoquan_service/contracts/metadata/content/filter_catalog_release/errors.yaml
    - quwoquan_service/contracts/metadata/content/filter_catalog_release/tests/contract.yaml
    performance_points: [GetActiveFilterCatalog P95 <= 300ms]
    tests:
      planned:
      - file: quwoquan_service/services/content-service/tests/api_integration/filter_catalog_release__api_integration_test.go
      recorded: []
    status: pending
  GWT3:
    title: App 只消费 typed release 并具备可证明离线能力
    given: [App production composition 已注入 RemoteFilterCatalogQuery 和 VerifiedFilterCatalogStore]
    when: [首次在线加载、重启离线加载、远端发布新 release、cache 损坏]
    then:
    - 在线成功校验后按 releaseId + canonicalDigest 原子替换 cache。
    - 离线重启读取最后一次 verified cache；无 cache 时只读取同源 bootstrap replica。
    - cache 或 bootstrap digest 不匹配时拒绝使用并输出 RuntimeFailure，不返回手写空目录。
    - ImageEditorPage 不实例化 Remote、Mock、文件 Store 或动态 Map 配置。
    done_when: [local_contract 覆盖 Remote 映射、cache 校验、bootstrap 同源和 UI 错误/重试态]
    edge_cases: [无网、超时、cache 截断、未知调整字段、目录为空、release 切换期间并发读取]
    contract_refs:
    - quwoquan_app/packages/quwoquan_cloud_contracts/lib/src/content/filter_catalog_facets.dart
    - quwoquan_app/lib/application/content/filter_catalog
    - quwoquan_app/lib/infrastructure/local/content/filter_catalog
    performance_points: [warm cache 加载 P95 <= 100ms]
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/content/filter_catalog_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_filter_catalog__local_contract_test.dart
      - file: quwoquan_app/test/api_integration/cloud/content/filter_catalog_remote__api_integration_test.dart
      recorded: []
    status: pending
  GWT4:
    title: 四环境发布、观测和回滚证据闭环
    given: [alpha/beta/gamma/prod manifest 均声明 FilterCatalogRelease seed 或发布输入]
    when: [运行 environment import、gamma UAT 和 prod gray activation]
    then:
    - 每个环境可证明 releaseId、digest、presetCount 与 active 状态。
    - gamma 完成在线获取、编辑器展示、离线重启与回滚后再获取。
    - 读取、Stage、Activate、Rollback 指标与告警可查询，日志不含图片和用户身份。
    done_when: [stackctl verify 与 CONTENT_MEDIA_GAMMA_UAT 证据均 recorded]
    edge_cases: [环境无 active release、digest 漂移、回滚目标缺失]
    contract_refs:
    - specs/feature-tree/discovery-content/publish-comment-reaction/filter-catalog-release/spec.md
    performance_points: [active catalog availability >= 99.9%]
    tests:
      planned:
      - file: quwoquan_app/test/user_acceptance/pages/content/create/photo_creation_publish_roundtrip__user_acceptance_test.dart
      recorded: []
    status: pending
