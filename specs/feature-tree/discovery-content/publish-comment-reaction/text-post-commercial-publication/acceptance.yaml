version: 2
node:
  id: text-post-commercial-publication
  level: L3_story
  path: specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication
  title: text post commercial publication
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction

scope:
  summary: 写文字从编辑、显式形态确认、发布前安全准入、可靠提交到结果回流与运营观测的商用闭环。
  in_scope:
    - micro/article 统一文字编辑器与显式发布形态确认。
    - LocalPostDraft、PostPublicationIntent、Post receipt 和 CirclePostPlacement 的可靠协作。
    - 发布前长度、频控和内容安全 fail-closed 准入。
    - 发布结果回流、发布任务恢复、tag 事实、审核运营和发布漏斗。
  out_of_scope:
    - 发布后正文编辑。
    - 跨设备云草稿。
    - AI 代写与模板市场。

gwt_acceptance:
  GWT1:
    title: 写文字入口正文优先且短文字与文章由用户显式确认
    given:
      - 用户已登录并从全局创作面板点击写文字。
    when:
      - 用户分别输入轻量正文和包含标题、多段落或插图的重内容并进入发布确认。
    then:
      - 顶栏显示写文字而非长文编辑，默认焦点进入正文。
      - 标题以添加标题可选入口渐进展开。
      - 系统可建议短文字或文章，但确认页显示并允许用户修改最终形态。
      - 最终 typed command 的 contentType 与用户确认一致，提交阶段不得再次静默推导。
    done_when:
      - micro 与 article 两种确认结果均有 widget 与 payload 合同证据。
    edge_cases:
      - 恢复有标题草稿时标题输入框直接展开。
      - 用户从建议 article 改为 micro 时不丢正文，文章专属排版字段不进入 micro wire。
    contract_refs:
      - quwoquan_service/contracts/metadata/content/post/service.yaml
      - quwoquan_app/packages/quwoquan_cloud_contracts/lib/src/content/post_publication_contracts.dart
    performance_points:
      - 编辑器 warm 可交互 P95 <= 1.2s。
    quality_facets: [functional, contract, experience]
    test_object: page
    slo_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/spec.md
    observability_refs:
      - quwoquan_service/contracts/metadata/ops/event_record/event_catalog.yaml
    security_refs: []
    tests:
      planned:
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: text_publication_format_confirmation
          cases:
            - local_contract.discovery_content.publish_comment_reaction.text_post.format_confirmation
          envs: [local]
          test_object: widget
          quality_facet: functional
      supporting: []

  GWT2:
    title: 文字长度合同和发布频控端云同源
    given:
      - 标题、micro 正文、article Markdown、摘要与 mention 已声明唯一长度上限。
    when:
      - 用户在边界值和超边界值提交，或同一 Persona 在频控窗口内连续发布。
    then:
      - 边界值可发布，超界请求返回 CONTENT.USER.content_too_long。
      - 频控命中返回 CONTENT.USER.rate_limited 和 recovery-after。
      - App 展示剩余量并按恢复时间调度，不无限立即重试。
    done_when:
      - App local_contract 与真实 content API 对同一边界和错误码给出一致结果。
    edge_cases:
      - Unicode 组合字符按 rune 计数。
      - 服务端绕过请求仍被拒绝。
      - 频控依赖不可用时 fail-closed。
    contract_refs:
      - quwoquan_service/contracts/metadata/content/post/errors.yaml
      - quwoquan_service/contracts/metadata/content/post/service.yaml
    performance_points:
      - 准入校验 P95 <= 50ms（不含外部安全 provider）。
    quality_facets: [contract, reliability, security]
    test_object: api_operation
    slo_refs:
      - quwoquan_service/contracts/metadata/content/post/service.yaml
    observability_refs:
      - quwoquan_ops/observability/monitoring/alerts/content_contract/post.yaml
    security_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/spec.md
    tests:
      planned:
        - file: quwoquan_service/services/content-service/internal/application/post/post_publication_admission__local_contract_test.go
        - file: quwoquan_service/services/content-service/tests/api_integration/post_text_publication__api_integration_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: post_publication_admission
          cases:
            - local_contract.content.post.publication_length_and_rate_gate
          envs: [local]
          test_object: application_service
          quality_facet: security
      supporting:
        - layer: api_integration
          execution_profile: integration
          suite: post_text_publication
          cases:
            - api_integration.content.post.text_publication_boundaries
          envs: [beta, gamma]
          test_object: api_operation
          quality_facet: contract

  GWT3:
    title: 发布前安全门 fail-closed 且未获批准时不公开 Post
    given:
      - content-service 已装配 PublicationSafetyGate。
    when:
      - 安全门分别返回 allow、review、reject 和 unavailable。
    then:
      - allow 原子创建一个 published Post、receipt 和 outbox。
      - review 创建不可公开 pending_review Post、receipt 和 review outbox。
      - reject 返回结构化拒绝，草稿保留且 Post/receipt/outbox 数均为零。
      - unavailable 按 fail-closed 策略创建 pending_review 并进入人工 Case，公开 Post 数为零。
      - production composition 缺端口时启动失败。
    done_when:
      - 四种结论、人工批准/拒绝与并发重放均有 local_contract 和 api_integration 证据。
    edge_cases:
      - 同一 intent 重放不得绕过首次拒绝结论。
      - 外部 provider 超时不得 fallback 为 allow。
    contract_refs:
      - quwoquan_service/contracts/metadata/content/post/errors.yaml
      - quwoquan_service/contracts/metadata/content/post/aggregate.yaml
    performance_points:
      - SubmitPostPublication P95 <= 800ms。
    quality_facets: [security, reliability, data_consistency]
    test_object: application_service
    slo_refs:
      - quwoquan_service/contracts/metadata/content/post/service.yaml
    observability_refs:
      - quwoquan_ops/observability/monitoring/alerts/content_contract/post.yaml
    security_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/spec.md
    tests:
      planned:
        - file: quwoquan_service/services/content-service/internal/application/post/post_publication_admission__local_contract_test.go
        - file: quwoquan_service/services/content-service/tests/api_integration/post_text_publication__api_integration_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: post_publication_admission
          cases:
            - local_contract.content.post.publication_safety_fail_closed
          envs: [local]
          test_object: application_service
          quality_facet: security
      supporting:
        - layer: api_integration
          execution_profile: integration
          suite: post_text_publication
          cases:
            - api_integration.content.post.publication_safety_no_partial_write
          envs: [beta, gamma]
          test_object: api_operation
          quality_facet: data_consistency

  GWT4:
    title: 发布意图可恢复可管理且鉴权失败不空转
    given:
      - 用户已产生 submitting、retry_wait 或 blocked 发布意图。
    when:
      - 网络恢复、登录失效、服务限流、永久校验失败或用户主动放弃。
    then:
      - 发布任务页展示状态、错误与重试或放弃动作。
      - unauthorized 进入登录续接而非网络重试。
      - rate_limited 尊重 recovery-after。
      - 仅 published receipt 清理草稿；放弃后后台不得复活 intent。
    done_when:
      - 重启恢复、错误分类、重试与放弃状态机均有 local_contract。
    edge_cases:
      - Persona 切换不重放原 Persona 的 intent。
      - circle placement 部分失败只重试失败圈子，不重复创建 Post。
    contract_refs:
      - quwoquan_app/lib/ui/content/entry/providers/post_publication_intent_queue_provider.dart
    performance_points:
      - 重启后 2s 内恢复可见任务状态。
    quality_facets: [reliability, experience, security]
    test_object: provider
    slo_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/spec.md
    observability_refs:
      - quwoquan_service/contracts/metadata/ops/event_record/event_catalog.yaml
    security_refs:
      - quwoquan_app/lib/core/auth/auth_gate.dart
    tests:
      planned:
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: post_publication_intent_task_state
          cases:
            - local_contract.content.post.publication_intent_recovery
          envs: [local]
          test_object: provider
          quality_facet: reliability
      supporting: []

  GWT5:
    title: 发布成功立即回流真实 Post 并刷新消费投影
    given:
      - micro 或 article 发布返回 published receipt。
    when:
      - App 处理成功结果。
    then:
      - micro 打开内容详情，article 打开作品浏览器文章。
      - 目标页展示已发布和真实圈子、实体、标签、位置去向。
      - feed 与当前 Persona 作品列表失效并回读同一 Post。
      - 不出现仅 Toast 后关闭或要求手动下拉的断点。
    done_when:
      - 写短文字和写文章两条完整 UAT 均从底栏加号走到回读页。
    edge_cases:
      - 私密内容不进入公开 feed，但作者仍能在自己的列表和详情看到。
      - 回读暂时失败时显示已发布回执与重试，不重新提交发布。
    contract_refs:
      - quwoquan_service/contracts/metadata/content/post/service.yaml
      - quwoquan_service/contracts/metadata/content/post/projections/work_browser_item.yaml
    performance_points:
      - 发布回执到目标页可见 P95 <= 2s。
    quality_facets: [functional, experience, data_consistency]
    test_object: workflow
    slo_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/spec.md
    observability_refs:
      - quwoquan_service/contracts/metadata/ops/event_record/event_catalog.yaml
    security_refs: []
    tests:
      planned:
        - file: quwoquan_service/services/content-service/tests/api_integration/post_text_publication__api_integration_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: user_acceptance
          execution_profile: release
          suite: text_publication_roundtrip
          cases:
            - user_acceptance.content.create.micro_publish_and_return
            - user_acceptance.content.create.article_publish_and_return
          envs: [gamma_local, prod]
          rollout_stages: [gray_initial]
          test_object: workflow
          quality_facet: experience
      supporting:
        - layer: api_integration
          execution_profile: integration
          suite: post_text_publication
          cases:
            - api_integration.content.post.publish_feed_detail_roundtrip
          envs: [beta, gamma]
          test_object: api_operation
          quality_facet: data_consistency

  GWT6:
    title: 标签和实体只以可证实 semantic mention 进入交集投影
    given:
      - 用户可从 typed tag/entity picker 选择目标，也可不选择。
    when:
      - 用户发布包含标签、实体或两者都无的文字内容。
    then:
      - 选择项写入 semanticMentions，服务端只投影合法 published mention。
      - 非法、pending 或 rejected mention 不进入 tagRefs/entityRefs。
      - 推荐相似度和自由字符串不得伪装成事实标签。
    done_when:
      - picker、payload、服务端投影和回读均有合同证据。
    edge_cases:
      - 重复选择去重。
      - 标签下线后发布返回结构化校验错误并保留草稿。
    contract_refs:
      - quwoquan_service/contracts/metadata/content/post/fields.yaml
      - quwoquan_service/contracts/metadata/tag/tag/service.yaml
    performance_points: []
    quality_facets: [contract, security, data_consistency]
    test_object: mapper
    slo_refs: []
    observability_refs:
      - quwoquan_service/contracts/metadata/ops/event_record/event_catalog.yaml
    security_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/spec.md
    tests:
      planned:
        - file: quwoquan_service/services/content-service/internal/application/post/semantic_projection__local_contract_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: text_publication_tag_picker
          cases:
            - local_contract.content.post.tag_picker_semantic_mentions
          envs: [local]
          test_object: widget
          quality_facet: contract
      supporting:
        - layer: local_contract
          execution_profile: baseline
          suite: semantic_projection
          cases:
            - local_contract.content.post.semantic_projection
          envs: [local]
          test_object: mapper
          quality_facet: data_consistency

  GWT7:
    title: 创作发布漏斗进入产品遥测单轨并可运营
    given:
      - 写文字页面已进入、保存草稿并提交发布。
    when:
      - 发布成功、排队、阻断或失败。
    then:
      - App 只提交强类型 content_publication 事件，不调用推荐行为 ReportBehaviors。
      - 事件包含 contentType、stage、result、objectState、surfaceId，且不含正文或原始 intentId。
      - Dashboard 可计算三项黄金指标，发布可用性和 P95 告警均有规则。
    done_when:
      - App reporter、product-ops ingestion、dashboard 和 alert 合同全绿。
    edge_cases:
      - 离线补传保留 occurredAt 并幂等。
      - 事件失败不得阻断用户发布。
    contract_refs:
      - quwoquan_service/contracts/metadata/ops/event_record/event_catalog.yaml
      - quwoquan_ops/observability/monitoring/alerts/content_contract/post.yaml
    performance_points:
      - 遥测写入不得阻塞发布主路径。
    quality_facets: [observability, reliability, security]
    test_object: observability
    slo_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/spec.md
    observability_refs:
      - quwoquan_ops/observability/monitoring/dashboards/l2_content_objects.json
    security_refs:
      - quwoquan_service/contracts/metadata/ops/event_record/event_catalog.yaml
    tests:
      planned:
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: content_publication_telemetry
          cases:
            - local_contract.content.post.publication_telemetry_catalog
          envs: [local]
          test_object: observability
          quality_facet: observability
      supporting: []

  GWT8:
    title: 举报审核可运营且决定与 Post revision 一致
    given:
      - 已发布 Post 被举报并打开当前 revision 的 PostModerationCase。
    when:
      - operator 在 Portal 领取、复核并批准或拒绝。
    then:
      - pending、reviewed、approved、rejected、superseded 状态迁移符合闭集。
      - 旧 revision 决定不能覆盖新 revision。
      - rejected Post 从公开读模型下架，作者收到站内信并可查看原因。
      - Portal 不使用 mock/seed 数据。
    done_when:
      - Portal、content API、通知消费与公开读路径有端到端证据。
    edge_cases:
      - operator 无权限返回结构化 403。
      - 并发相同决定幂等，不同 reviewer 冲突。
    contract_refs:
      - quwoquan_service/contracts/metadata/content/post_moderation_case/service.yaml
      - quwoquan_service/contracts/metadata/content/post_moderation_case/fields.yaml
    performance_points:
      - 审核命令 P95 <= 800ms。
    quality_facets: [security, observability, data_consistency]
    test_object: workflow
    slo_refs:
      - quwoquan_service/contracts/metadata/content/post_moderation_case/service.yaml
    observability_refs:
      - quwoquan_ops/observability/monitoring/alerts/content_contract/post_moderation_case.yaml
    security_refs:
      - quwoquan_service/contracts/metadata/content/post_moderation_case/service.yaml
    tests:
      planned:
        - file: quwoquan_service/services/content-service/tests/api_integration/moderation_case_contract__api_integration_test.go
        - file: quwoquan_ops/portal/src/shared/api/controlPlane.test.mjs
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: api_integration
          execution_profile: integration
          suite: moderation_case_contract
          cases:
            - api_integration.content.post.moderation_revision_workflow
          envs: [beta, gamma]
          test_object: workflow
          quality_facet: data_consistency
      supporting:
        - layer: user_acceptance
          execution_profile: release
          suite: moderation_operator_journey
          cases:
            - user_acceptance.ops.content.post_moderation
          envs: [gamma_local, prod]
          rollout_stages: [gray_initial]
          test_object: page
          quality_facet: security

execution:
  local_gate:
    - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
    - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
    - make gate
    - make gate-integration ENV=gamma
    - make gate-release ENV=prod

