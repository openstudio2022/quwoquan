  GWT5:
    title: 默认、最新、最多赞三档排序端云一致
    given:
    - 评论线程包含不同创建时间、赞数、回复数和踩数的评论。
    when:
    - 用户从排序入口选择默认、最新或最多赞。
    then:
    - 默认映射为 recommended，latest 按创建时间倒序，most_liked 按赞数优先。
    - 端侧不维护第二套排序规则，只消费服务端返回顺序。
    done_when:
    - 三档排序在 Mock、Remote 和 contract seed 下顺序一致。
    edge_cases:
    - recommended 同分时使用稳定 tie-breaker。
    - 删除或审核隐藏的评论不参与排序。
    contract_refs:
    - content/post service.yaml ListComments sort
    performance_points:
    - 评论首屏排序查询 P95 小于 800ms。
    tests:
      planned: []
      recorded:
