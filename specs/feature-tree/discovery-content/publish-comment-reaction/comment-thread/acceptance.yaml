    when: [创建量达到配置阈值后再次提交]
    then:
      - 服务端在 Comment 创建事务内按 authorId 串行化，再查询权威短窗/日窗并返回 comment_rate_limited。
      - 默认阈值为 30 秒不超过 5 条且 24 小时不超过 200 条，配置变更不改协议。
      - 幂等重放在频控前返回原 receipt；并发请求不会超卖额度，删除评论不能绕过计数。
      - App 保留草稿并消费 RuntimeFailure/RuntimeRecoveryPolicy，不伪造成功或切换 Mock。
    done_when: [边界时刻、跨窗、并发、错误映射与 Widget 恢复均通过]
