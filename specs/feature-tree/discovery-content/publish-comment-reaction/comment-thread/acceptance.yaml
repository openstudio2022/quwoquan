version: 2
node:
  id: comment-thread
  level: L3_story
  path: specs/feature-tree/discovery-content/publish-comment-reaction/comment-thread
  title: comment thread
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction
scope:
  summary: 评论 V2 完整闭环，覆盖平铺文章内联评论、沉浸式上压评论、评论/回复/展开/赞踩/输入能力、端云契约、环境种子与性能降级。
  in_scope:
  - 平铺文章评论入口滚动定位到正文后的内联评论区。
  - 图片、视频、文章翻页等沉浸式内容入口打开内容上压评论分屏。
  - 一级评论、二级回复预览、回复分页展开、默认/最新/最多赞排序。
  - 文本、emoji、图片附件、@小趣、@联系人或关注对象输入与结构化回显。
  - 评论赞踩互斥、viewerReaction 重入恢复、删除/举报/回复权限态。
  - 内容作者置顶/取消置顶一级评论与置顶优先排序、canPin 派生权限。
  - 创建评论按受信代理头解析省级属地快照（ipLocation）落库与透传展示。
  - 内容作者赞过标识（authorLiked）与互动深链精确定位（commentId/parentCommentId）。
  - alpha/beta/gamma 非生产环境复杂评论种子与四层测试证据。
  out_of_scope:
  - 评论全文搜索。
  - 评论翻译。
  - 评论区关闭（帖主关闭评论区，V2+）。
  - ML rerank，仅保留低延迟 recommended 可解释排序。
gwt_acceptance:
  GWT1:
    title: 平铺文章评论入口定位到内联评论区
    given:
    - 用户打开平铺文章详情页，文章存在可评论状态和已加载评论计数。
    when:
    - 用户点击底部评论图标或评论计数。
    then:
    - 页面滚动到正文之后的评论 section，不打开独立弹窗。
    - 用户可继续向上滑回正文，底部栏保留半宽输入入口、文章赞和转发。
    done_when:
    - 内联评论区完成首屏加载，且入口二次点击仍稳定定位。
    edge_cases:
    - 评论区为空时展示空态和输入入口。
    - 评论加载失败时保留文章正文并显示可重试错误态。
    contract_refs:
    - content/post service.yaml ListComments
    performance_points:
    - 评论 section 首屏 P95 小于 800ms。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/comment_system/comment_viewer_modal_widget__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/patrol/content/comment_post__user_acceptance_test.dart
      - file: quwoquan_service/services/content-service/tests/api_integration/post_comment_contract__api_integration_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.publish_comment_reaction.comment_thread.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.publish_comment_reaction.comment_thread.gwt1_local_contract
        envs: *id001
      - layer: user_acceptance
        suite: device_journey
        cases:
        - user_acceptance.discovery_content.publish_comment_reaction.comment_thread.device_journey
        envs:
        - gamma_local
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.discovery_content.publish_comment_reaction.comment_thread.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/content/article_inline_comment_section_test.dart'
  GWT2:
    title: 沉浸式内容打开上压评论分屏
    given:
    - 用户正在浏览图片、视频或文章翻页沉浸式内容。
    when:
    - 用户点击评论入口。
    then:
    - 当前内容区域上压并保留上下文，评论区在下方加载。
    - 关闭评论后恢复原沉浸式高度，图片索引、视频进度或 pageflip 状态不丢失。
    done_when:
    - 三类沉浸式入口都能完成打开、评论、关闭和恢复。
    edge_cases:
    - 打开评论时键盘弹起后内容区域仍可见。
    - pageflip 只作为宿主 chrome，不改动几何计算链路。
    contract_refs:
    - content/post service.yaml ListComments
    performance_points:
    - 打开分屏动画小于 300ms。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/comment_system/comment_viewer_modal_widget__local_contract_test.dart
