  GWT9:
    title: 我的-互动评论类点击深链进入评论区并滚动定位高亮
    given:
    - 用户在"我的-互动"列表看到评论类或回复类互动项。
    when:
    - 用户点击该互动项的内容预览。
    then:
    - 深链进入对应内容评论区并携带 openComments=true，非评论类互动不带该参数。
    - 评论列表命中已加载的目标一级评论时滚动定位并短暂高亮，约 2.4s 后淡出。
    done_when:
    - 评论类互动深链稳定打开评论区，命中目标项与可见区有正面积交集并高亮。
    edge_cases:
    - 目标评论不在已加载页时不报错；commentId wire 已落地，精确定位见 GWT14。
    - 高亮淡出定时器在组件销毁时取消，不泄漏。
    contract_refs:
    - content/post service.yaml ListComments
    - app route workBrowser openComments
    performance_points:
    - 滚动定位动画小于 320ms。
    tests:
      planned: []
      recorded:
