      - 状态只允许 active→deleted、active→hidden→active、active|hidden→tombstoned。
      - deleted/tombstoned 为终态，非法迁移与陈旧 expectedVersion 返回稳定 conflict。
      - 前台列表、回复和计数只包含 active；作者私有投影可见 hidden 状态。
