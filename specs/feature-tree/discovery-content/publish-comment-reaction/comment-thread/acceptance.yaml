  GWT4:
    title: 回复预览和展开数量由云端配置控制
    given:
    - App Config 返回 reply_preview_count、reply_first_expand_page_size 和 reply_expand_page_size。
    when:
    - 用户打开评论列表并多次展开某条一级评论的回复。
    then:
    - 一级评论默认展示 reply_preview_count 条回复，配置不可达时 fallback 为 1。
    - 首次点击展开最多追加 reply_first_expand_page_size 条回复，配置不可达时 fallback 为 5。
    - 后续每次点击展开追加 reply_expand_page_size 条回复，配置不可达时 fallback 为 10。
    - 展示数超过预览数时提供收起，剩余回复数量准确递减。
    done_when:
    - Mock、Remote、服务端 contract 对相同配置给出一致结果。
    edge_cases:
    - 配置值小于 0 或过大时端云使用契约约束裁剪。
    - replyNextCursor 为空时不再展示展开入口。
    contract_refs:
    - content/post service.yaml ListCommentReplies
    - app config sys.content.comment.reply_preview_count
    - app config sys.content.comment.reply_first_expand_page_size
    - app config sys.content.comment.reply_expand_page_size
    performance_points:
    - 回复展开查询 P95 小于 500ms。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/services/content/comment_sort_consistency__local_contract_test.dart
      - file: quwoquan_service/services/content-service/tests/api_integration/post_comment_contract__api_integration_test.go
      - file: quwoquan_app/test/local_contract/ui/components/comment_system/comment_viewer_modal_widget__local_contract_test.dart
    status: implemented
    test_evidence:
