version: 3
node:
  id: comment-thread
  level: L3_story
  path: specs/feature-tree/discovery-content/publish-comment-reaction/comment-thread
  title: Comment / ContentReaction commercial object closure
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction

scope:
  summary: Comment 与 ContentReaction 经对象专属 Facade、generated client、Mongo/outbox 和统一 Runtime execution path 完成二层评论闭环。
  in_scope:
    - typed Comment command/query、reply Slice、ContentReaction 与服务端能力投影。
    - production Remote-only、alpha fixture 隔离、严格 decoder 与 RuntimeFailure。
    - pinned-first 稳定顺序、CAS、幂等、outbox、计数和投影收敛。
    - Feed、沉浸式、文章、个人互动入口与登录续接。
  out_of_scope:
    - recommended/latest/most_liked 三档排序及任何兼容参数。
    - IP 属地、作者赞过、评论搜索、翻译、视频附件和 ML rerank。
    - generic Repository、动态 Map DTO、失败回退 Mock 与 PostService 评论第二通路。

gwt_acceptance:
  GWT1:
    title: 平铺内容入口复用 typed Comment surface
    given: [用户打开可评论的平铺内容详情]
    when: [用户从评论 CTA 进入评论 section]
    then:
      - 页面只消费 ContentCommentFacet 与 ContentCommentListItem。
      - 空态、加载失败和重试不影响正文浏览。
      - 首屏无数据失败使用无卡片外框的区块错误空态；已有评论刷新失败保留旧数据；追加失败只出现在列表尾部。
      - 首屏阻塞失败时标题不展示未经确认的“共 0 条评论”。
    done_when: [Gamma 真机完成打开、评论、返回和二次进入]
    edge_cases: [空评论, 首屏失败, 重复点击]
    contract_refs: [content.comment.ListComments, app surface metadata]
    performance_points: [首屏 P95 小于 800ms]
    tests:
      planned: []
      recorded:
        - file: quwoquan_app/test/local_contract/ui/components/comment_system/comment_facet_widget__local_contract_test.dart
        - file: quwoquan_app/test/user_acceptance/patrol/content/comment_post__user_acceptance_test.dart
    status: partial
    test_evidence:
      primary:
        - layer: local_contract
          suite: comment_surface
          cases: [local_contract.discovery_content.publish_comment_reaction.comment_thread.gwt1_local_contract]
          envs: [local]
      supporting:
        - layer: user_acceptance
          suite: comment_device_journey
          cases: [user_acceptance.discovery_content.publish_comment_reaction.comment_thread.device_journey]
          envs: [gamma_local]
    notes: [local contract 已通过；本轮尚无 Gamma 设备执行产物]

