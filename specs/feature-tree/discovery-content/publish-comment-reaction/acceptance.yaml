version: 2
node:
  id: publish-comment-reaction
  level: L2_business_capability
  path: specs/feature-tree/discovery-content/publish-comment-reaction
  title: publish comment reaction
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction
scope:
  summary: publish-comment-reaction 能力级 SIT，验证文字/照片发布、图片本地编辑、评论、回复、反应计数、行为上报和端云状态协同。
  in_scope:
  - 照片选择/拍摄、纯端侧像素编辑、MediaAsset 上传与发布回流。
  - 内容详情、沉浸式内容和个人主页评论入口组合验证。
  - 评论提交、回复、展开、赞踩与 post interaction 计数最终一致。
  - Comment metadata、App Config、Mock/Remote、content-service contract 和 seed manifest
    对齐。
  out_of_scope:
  - 推荐排序模型训练。
  - 评论搜索、置顶、翻译。
sit_acceptance:
  SIT1:
    title: 评论 V2 与内容互动能力端云组合 SIT
    story_refs:
    - comment-thread
    - reaction-state-counter
    done_when:
    - 平铺文章入口完成内联定位，沉浸式入口完成上压分屏，个人主页评论可跳回原内容评论区。
    - 评论创建、回复创建、回复分页、赞踩切换、删除/举报权限态都由云端契约驱动。
    - postInteractionStateProvider 与 Comment state 在乐观更新和云端确认后保持最终一致。
    - alpha/beta/gamma seed 与 verifiedEndpoints 覆盖 comments、replies、reaction、attachment、mentions。
    performance_points:
    - 评论首屏 P95 小于 800ms。
    - 评论提交云端确认 P95 小于 500ms。
    - 回复展开 P95 小于 500ms。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: sit1_local_contract
        cases:
        - local_contract.discovery_content.publish_comment_reaction.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        execution_profile: integration
        suite: sit1_api_integration
        cases:
        - api_integration.discovery_content.publish_comment_reaction.sit1.sit1_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: sit1_local_contract
        cases:
        - local_contract.discovery_content.publish_comment_reaction.sit1.sit1_local_contract
        envs: *id001
      - layer: user_acceptance
        execution_profile: release
        suite: device_journey
        cases:
        - user_acceptance.discovery_content.publish_comment_reaction.sit1.device_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/content/providers/comment_provider_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/components/comment_system/immersive_comment_split_sheet_test.dart'
    - '[migrated_from_planned] quwoquan_service/services/content-service/tests/comment_thread_contract_test.go'
    - '[migrated_from_planned] quwoquan_app/integration_test/comment_thread_journey_test.dart'
  SIT2:
    title: 写文字发布、安全准入、分发回流与运营观测组合 SIT
    story_refs:
    - text-post-commercial-publication
    - post-create-update
    done_when:
    - LocalPostDraft 和 immutable PublishIntent 在断网、重启、限流与鉴权失效后保持可恢复。
    - micro/article 由用户显式确认，发布命令经过长度、Persona 频控与安全门后才原子创建 Post。
    - published receipt 只创建一个 Post，并立即回流详情或作品浏览器以及 feed/Persona 作品投影。
    - tag/entity/location/circle 关联只来自可证实事实，circle placement 失败不重复发布。
    - App 产品遥测、服务 RED、dashboard 和 alert 能对账三项黄金指标。
    performance_points:
    - SubmitPostPublication P95 小于等于 800ms。
    - 发布回执到内容可见 P95 小于等于 2s。
    tests:
      planned:
      - file: quwoquan_service/services/content-service/tests/api_integration/post_text_publication__api_integration_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: post_text_publication
        cases:
        - api_integration.content.post.text_publication_commercial_roundtrip
        envs: [beta, gamma]
        test_object: workflow
        quality_facet: data_consistency
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: text_publication_contract
        cases:
        - local_contract.content.post.text_publication_contract
        envs: [local]
        test_object: application_service
        quality_facet: contract
      - layer: user_acceptance
        execution_profile: release
        suite: text_publication_roundtrip
        cases:
        - user_acceptance.content.create.micro_publish_and_return
        - user_acceptance.content.create.article_publish_and_return
        envs: [gamma_local, prod]
        rollout_stages: [gray_initial]
        test_object: workflow
        quality_facet: experience
  SIT3:
    title: 照片选择、像素编辑、MediaAsset 上传与发布回流组合 SIT
    story_refs:
    - image-editing
    - filter-catalog-release
    - post-create-update
    done_when:
    - 图片编辑器全部可见工具为真实像素实现；裁剪、旋转/翻转、颜色矩阵、局部径向调整、曲线、马赛克和文字共用 ImageEditorExportEngine。
    - 滤镜目录只消费 active FilterCatalogRelease；在线更新、verified cache 离线重启和同源 bootstrap replica 均可验证。
    - 编辑确认生成文件快照，撤销/重做/放弃保护可执行；完成后才把本地路径交给 MediaUploadSession。
    - 发布 payload 只携带 MediaAsset ID，保持用户排序；失败不产生半成品 Post。
    - gamma-local 用户可从选择/拍照进入编辑器，完成编辑、上传、发布并回读真实内容。
    performance_points:
    - 编辑器 warm 可交互 P95 小于等于 1.2s。
    - 12MP 单工具烘焙 P95 小于等于 3s，峰值内存小于等于 300MB。
    - 大图上传不整文件常驻 Dart heap。
    tests:
      planned:
      - file: quwoquan_app/test/api_integration/ui/content/photo_publish_atomic_publication_roundtrip__api_integration_test.dart
      - file: quwoquan_service/services/content-service/tests/api_integration/post_crud_contract__api_integration_test.go
      - file: quwoquan_ops/tests/acceptance/user_acceptance/service_ops/content-service/smoke/run_media_publication_lifecycle_probe.py
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_curve_engine__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_step_stack__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_annotation_models__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_export_pipeline__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_discard_confirm__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_operation_panel__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_invalid_image_decode__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_thumbnail_reorder_widget__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: image_editor_commercial_baseline
        cases:
        - local_contract.discovery_content.publish_comment_reaction.image_editing.commercial_baseline
        envs: [local]
        test_object: page
        quality_facet: functional
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: photo_publish_atomic_roundtrip
        cases:
        - api_integration.discovery_content.publish_comment_reaction.post_create_update.photo_upload_bind_publish_roundtrip
        envs: [beta, gamma]
        test_object: workflow
        quality_facet: data_consistency
      - layer: user_acceptance
        execution_profile: release
        suite: photo_creation_roundtrip
        cases:
        - user_acceptance.discovery_content.publish_comment_reaction.image_editing.photo_edit_publish_return
        envs: [gamma_local, prod]
        rollout_stages: [gray_initial]
        test_object: workflow
        quality_facet: experience
    notes:
    - 2026-07-20 本地图片编辑 8 个 local_contract 套件共 52 个用例通过；Remote 与环境证据未执行前保持 partial。
