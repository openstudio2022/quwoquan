version: 2
node:
  id: post-create-update--create-entry-location-visibility-circle
  level: L3_story
  path: specs/feature-tree/discovery-content/publish-comment-reaction/post-create-update--create-entry-location-visibility-circle
  title: 创作入口位置、可见性与圈子选择
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction
scope:
  summary: 创作与全局搜索通过同一 Integration Location 契约读取位置，并保持发布设置用户旅程可恢复。
  in_scope:
  - ContractGraph 生成的 GetNearbyLocations、SearchLocations operation client。
  - production Remote 与独立 alpha fixture composition 的物理隔离。
  - 系统定位 capability、权限拒绝、附近列表、位置搜索和限流保留最近结果。
  - compact/light、regular/dark、expanded/light 的同一行为契约。
  out_of_scope:
  - 地图瓦片、地图选点和第三方地图 SDK UI。
  - 圈子领域自身的服务端重构。
gwt_acceptance:
  GWT1:
    title: App 只经 generated operation client 读取附近位置与搜索结果
    given:
    - integration/location metadata 已声明 path、method、auth、surface 与结构化错误。
    - gamma 环境已由统一 seed/import 流程准备 Integration Location 数据。
    when:
    - 创作位置页读取附近位置，或全局搜索查询地点。
    then:
    - 请求的 path、query、surface、route、page 与 canonical operation ID 均来自 codegen。
    - production composition 只装配 Remote adapter；alpha/test composition 从独立 fixture bundle 装配 Mock。
    - Remote 与 Mock 均返回 LocationPoiListSlice，不向 UI 传递弱类型 wire Map。
    done_when:
    - local_contract、api_integration 与 alpha package contract 均通过。
    edge_cases:
    - 空搜索词回退 nearby，不发送空 SearchLocations 请求。
    - 429 且存在最近成功结果时保留最近结果。
    - malformed response 映射为结构化 CloudException。
    contract_refs:
    - quwoquan_service/contracts/metadata/integration/location/service.yaml
    - quwoquan_service/contracts/metadata/integration/location/errors.yaml
    - quwoquan_service/contracts/metadata/_shared/ui_surfaces.yaml
    performance_points:
    - 单次 nearby/search 只执行一个 operation，不进行 UI 层二次网络请求。
    tests:
      planned:
      - file: quwoquan_app/test/api_integration/cloud/integration/location_query__api_integration_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/integration/remote_api_path_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/content/entry/contract/location_circle_services_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/content/entry/publish_settings_parse__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/providers/create_location_service_provider__local_contract_test.dart
      - file: quwoquan_app/packages/quwoquan_cloud_mock/test/local_contract/integration/alpha_location_query__local_contract_test.dart
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: location_operation_contract
        cases:
        - local_contract.discovery_content.publish_comment_reaction.location.generated_operation
        envs: &local_env
        - local
      supporting:
      - layer: api_integration
        suite: location_gamma_remote
        cases:
        - api_integration.discovery_content.publish_comment_reaction.location.gamma_remote
        envs:
        - gamma
    notes:
    - gamma Remote 通过后再将状态收口为 implemented。
  GWT2:
    title: 权限、错误、主题与断点不改变位置选择业务语义
    given:
    - 用户从创作发布确认进入位置选择页。
    when:
    - 定位权限授予、永久拒绝，或云端超时。
    - 页面运行在 compact/light、regular/dark、expanded/light 任一组合。
    then:
    - 授权成功展示 typed POI；永久拒绝展示 metadata 文案与去设置动作。
    - 首屏云端失败展示统一结构化页态和重试动作。
    - 三种屏宽/主题复用同一 capability 与数据 Slice，无平台分支。
    done_when:
    - Widget local_contract 与用户旅程测试通过。
    edge_cases:
    - 加载中展示统一 loading 语义。
    - 用户可选择不显示位置并继续发布。
    contract_refs:
    - specs/ux/error-and-permission-semantics.md
    - specs/feature-tree/runtime/runtime-client-foundation/page-horizontal-quality-matrix.md
    performance_points:
    - 加载状态不阻塞页面返回和取消位置选择。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/content/entry/widgets/location_selector_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/journeys/content/entry/entry_location_error_journey__user_acceptance_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: location_page_widget
        cases:
        - local_contract.discovery_content.publish_comment_reaction.location.page_widget
        envs: *local_env
      supporting:
      - layer: api_integration
        suite: location_gamma_remote
        cases:
        - api_integration.discovery_content.publish_comment_reaction.location.gamma_remote
        envs:
        - gamma
      - layer: user_acceptance
        suite: location_error_journey
        cases:
        - user_acceptance.discovery_content.publish_comment_reaction.location.error_journey
        envs:
        - gamma_local
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  - make verify-app-page-horizontal-quality
  full_gate:
  - make gate
