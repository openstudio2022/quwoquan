  GWT5:
    title: 视频选封面与发布 payload 使用同源远端封面契约
    given:
    - 用户已在视频编辑页选择一个视频，默认封面候选可用。
    - App 处于 Remote 数据源，content media upload API 可用。
    when:
    - 用户保持默认首帧封面或拖动时间轴选择手工封面，并点击下一步后发布视频作品。
    then:
    - 未手工选封面时默认 `coverStrategy=first_frame` 且 `coverFrameTimeMs=0`。
    - 手工选封面时 `coverStrategy=manual`，`coverFrameTimeMs` 与当前预览帧一致。
    - 最终 `CreatePost` payload 显式携带 `videoUrl`、`thumbnailUrl`、`coverUrl`、`durationMs` 和可得的 `width/height`，且不包含本地文件路径。
    - "`thumbnailUrl` 与 `coverUrl` 指向远端可访问封面；无真实转码 worker 时由 App 本地选帧封面上传或媒体资产封面 URL 提供。"
    done_when:
    - Mock/Remote 的视频 payload 形态在 local contract 对齐，Remote/API 在 api_integration 证明创建与回读闭环。
    edge_cases:
    - 封面上传失败时中止发布并提供可恢复动作，不能创建无关封面或半成品视频 post。
    - 视频上传成功但封面缺失时服务返回结构化错误或明确降级策略，不允许首页使用 seed 图。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/service.yaml
    - quwoquan_service/contracts/metadata/content/post/fields.yaml
    - quwoquan_app/lib/ui/content/entry/services/create_page_remote_helpers.dart
    - quwoquan_app/lib/ui/content/entry/providers/create_editor_provider.dart
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/content/create/video_publish_payload_cover_contract__local_contract_test.dart
      - file: quwoquan_app/test/api_integration/gamma/video_publish_cover_roundtrip__api_integration_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/content/create/video_creation_publish_roundtrip__user_acceptance_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/content/create/video_publish_payload_cover_contract__local_contract_test.dart
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: video_publish_payload_cover_contract
