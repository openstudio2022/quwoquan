    - 2026-06-22 已通过 local_contract 证明视频与封面上传后 payload 只含远端 `videoUrl/thumbnailUrl/coverUrl`，并覆盖封面上传失败 abort；gamma api_integration 与 user_acceptance 证据未落盘，状态保持 pending。
  GWT6:
    title: 数据工程视频导入与用户上传视频使用同一封面展示契约
    given:
    - 数据工程产物包含至少一个视频 post manifest。
    - 服务侧 content importer 可写入 content post 与 feed/read model 投影。
    when:
    - 数据工程发布 gate 校验视频 manifest，并由 importer 导入视频内容。
    then:
    - video manifest 显式声明 `videoUrl` 或 `videoAssetId`，并声明 `thumbnailUrl` 或 `coverUrl`。
    - importer 写入的 Post、DiscoveryFeed 和作品浏览器 media item 均包含同源 `videoUrl` 与 `thumbnailUrl/coverUrl`。
    - 数据工程不得用无关图片冒充视频首帧；无法抽帧时必须声明手工封面来源。
    done_when:
    - 数据工程 schema/gate、服务 importer local contract 与端云 api_integration 能证明导入视频和用户上传视频使用同一展示契约。
    edge_cases:
    - manifest 缺少视频资产或封面资源时 publish gate 失败。
    - importer 重跑时保持幂等，不产生封面字段漂移。
    contract_refs:
    - quwoquan_data/schema/produce/post_manifest.schema.json
    - quwoquan_data/scripts/publish/gate.py
