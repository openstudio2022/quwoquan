        envs:
        - gamma
      supporting:
      - layer: user_acceptance
        suite: video_creation_journey
        cases:
        - user_acceptance.discovery_content.publish_comment_reaction.post_create_update.video_creation_publish_roundtrip
        envs:
        - gamma_local
