    - 2026-06-22 已记录图片入口隐藏录像模式、拍后确认态“重新拍摄/使用照片”和使用照片返回图片结果；真实相机硬件路径由设备矩阵巡检覆盖。
    - 2026-06-23 冻结高保拍照相机：黑色沉浸式、九宫格、滤镜/快门/翻转底栏、闪光灯单击 on/off 开关、前置置灰、拍后统一进图片编辑页，再按 picker/create 来源追加；新增 fake camera local_contract、几何约束与两条 user_acceptance 旅程证据。
    - 2026-06-28 图片专用调用继续 photoOnly；全局 capture 改为 switchable，但拍照结果仍进入图片确认、编辑和发布子流程。
  GWT3:
    title: 图片发布远端媒体引用与展示回读一致
    given:
    - 用户已在创作编辑器中完成图片排序和发布设置。
    - App 处于 Remote 数据源，content media upload API 可用。
    when:
    - 用户点击发布图片作品。
    then:
    - "发布前本地图片路径先转换为 content media 远端引用，最终 `CreatePost` payload 的 `mediaUrls` / `coverUrl` 不包含本地文件路径。"
    - "`coverUrl` 默认使用排序后的第一张图片远端引用。"
    - "`BindMediaAssetsToPost` 把已完成的媒体资产绑定到创建出的 post。"
    - 发布成功后发现流、个人主页作品列表与详情页按同一顺序回读展示图片。
    done_when:
    - Mock/Remote 的图片 payload 形态在 local contract 对齐，Remote/API 在 api_integration 证明上传、绑定、发布、回读闭环。
    edge_cases:
    - 上传失败时中止发布并提供可恢复动作，不能创建带本地路径的 post。
    - 部分图片上传失败时不得发布半成品图片顺序。
    - 私密发布时仍遵守 visibility/circle 现有契约。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/service.yaml
    - quwoquan_app/lib/cloud/services/content/content_repository.dart
    - quwoquan_app/lib/ui/content/entry/services/create_page_remote_helpers.dart
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/content/create/photo_publish_payload_media_refs__local_contract_test.dart
      - file: quwoquan_app/test/api_integration/gamma/photo_publish_upload_bind_roundtrip__api_integration_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/content/create/photo_creation_publish_roundtrip__user_acceptance_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/content/create/photo_publish_payload_media_refs__local_contract_test.dart
      - file: quwoquan_app/test/api_integration/gamma/photo_publish_upload_bind_roundtrip__api_integration_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/content/create/photo_creation_publish_roundtrip__user_acceptance_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        suite: photo_publish_payload_media_refs
        cases:
        - local_contract.discovery_content.publish_comment_reaction.post_create_update.photo_publish_payload_uses_remote_media_refs
        envs: *id001
      - layer: api_integration
        suite: photo_publish_upload_bind_roundtrip
        cases:
        - api_integration.discovery_content.publish_comment_reaction.post_create_update.photo_upload_bind_publish_roundtrip
        envs:
        - gamma
      supporting:
      - layer: user_acceptance
        suite: photo_creation_journey
        cases:
        - user_acceptance.discovery_content.publish_comment_reaction.post_create_update.photo_creation_publish_roundtrip
        envs:
        - gamma_local
    notes:
    - 2026-06-22 已记录本地图片上传转换、失败 abort、content-service init/complete/create/bind API 合同，以及发布旅程的远端 URL 顺序、首图 coverUrl 与 bind assetIds 顺序。
  GWT4:
    title: 视频选择与拍摄进入深色视频选封面主链路
    given:
    - "用户已登录，并从视频作品入口进入 `/create?type=video`，或从旧相机兼容入口 `/create?type=capture` 得到视频结果。"
    - 设备相册或相机权限可用，至少存在一个可选择视频或可录制视频。
    when:
    - 用户打开视频选择器选择一个视频，点击 `拍视频` 进入相机拍摄一段视频，或点击 `一键成片` 选择图片生成视频。
    then:
    - 视频选择器使用深色 iOS 全屏选择态，布局与图片选择器一致：顶部为取消和居中 `全部视频`，主体为三列宫格。
    - 宫格第 1 格为 `拍视频`，第 2 格为 `一键成片`，其余格仅展示视频资源；图片资源不得在视频资源格中出现。
    - 点击 `一键成片` 后进入图片选择器，至少选择 1 张图片后进入预览；生成本地视频成功后直接进入视频编辑/选封面页，不回到视频选择器停留。
    - 视频缩略图展示时长，选中态清晰；选择单个视频后进入视频编辑/选封面页，不直接写入发布 payload。
    - 视频入口进入相机时默认后置摄像头，顶部为返回/“摄像模式”/灯光，底部仅保留滤镜/蓝色录像按钮/翻转，不出现拍照模式标题或白色快门。
    - 全局 `/create?type=capture` 默认拍照但可切到录像；录像完成后进入同一视频预览确认和视频编辑/选封面页。
    - 录制中顶部显示时长，主按钮转为停止态，翻转与滤镜锁定；小于 1 秒提示“录制时间太短”，到 60 秒自动停止并进入预览确认。
    - 录制停止后先进入视频预览确认（自动播放/重拍/下一步），下一步进入同一视频编辑/选封面页，不回落到图片确认流或浅色不可用页。
    - 滤镜复用 `filter_presets.json` 的 `camera_photo` 集合与拍照同源；麦克风被拒时允许继续无声录制，不整体阻断视频入口。
    done_when:
    - 相册视频、拍摄视频与一键成片视频均能进入统一视频编辑状态，包含 `videoPath`、`durationMs` 和默认封面候选。
    edge_cases:
    - 相册权限未授权时展示深色权限态与恢复动作。
    - 相机权限拒绝时展示深色页级权限态与去设置/返回动作。
    - 麦克风权限拒绝时允许继续无声录制，不阻断进入相机。
    - 一键成片未选择图片时不得生成；平台不支持或生成失败时展示明确不可用/失败提示，不伪造 video result。
    - 相机不可用或录制失败时展示结构化深色错误态并隐藏录制/翻转等无意义控件，不丢失创作上下文。
    contract_refs:
    - quwoquan_app/lib/components/media/picker/create_media_picker_page.dart
    - quwoquan_app/lib/components/media/camera/camera_capture_page.dart
    - quwoquan_app/lib/ui/content/entry/pages/video_editor_page.dart
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/content/create/creation_mixed_media_picker__local_contract_test.dart
