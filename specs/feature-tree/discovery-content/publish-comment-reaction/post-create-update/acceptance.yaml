        suite: photo_camera_capture_flow
        cases:
        - local_contract.discovery_content.publish_comment_reaction.post_create_update.photo_camera_hifi_state_filter_flash_preview_editor
        envs: *id001
      - layer: local_contract
        suite: photo_camera_hifi_layout
        cases:
        - local_contract.discovery_content.publish_comment_reaction.post_create_update.photo_camera_hifi_topbar_shutter_filter_geometry
        envs: *id001
      supporting:
