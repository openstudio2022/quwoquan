      - file: quwoquan_app/test/local_contract/content/create/photo_camera_capture_flow__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/content/create/photo_camera_hifi_layout__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/ui/content/entry/journeys/photo_picker_reentry_append_journey__user_acceptance_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        suite: camera_capture_mode_switch
        cases:
