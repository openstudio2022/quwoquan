version: 2
node:
  id: post-create-update
  level: L3_story
  path: specs/feature-tree/discovery-content/publish-comment-reaction/post-create-update
  title: post create update
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction
scope:
  summary: 内容创建、媒体发布与发布后回读验收；本轮覆盖图片与视频作品商用创作链路，并对齐全局照片入口、视频入口与旧相机兼容入口的结果分流。
  in_scope:
  - 图片作品从相册选择、拍摄、编辑、排序、完成回填到发布的端侧主链路。
  - 图片发布远端媒体上传、完成、绑定、发布与展示回读契约。
  - 全局照片/视频入口按发布目标进入图片或视频发布子流程，最终 payload 语义互斥。
  - 视频作品从相册选择、拍摄、选封面、完成回填到发布的端侧主链路。
  - 视频封面字段、封面策略、远端发布 payload 与发布后 feed 回读契约。
  out_of_scope:
  - 重做图片编辑器内部滤镜、裁剪、文字、马赛克算法。
  - 新增外部平台分享 SDK。
  - 视频加音乐、特效、美颜、闪光灯、定时、完整剪辑能力商用化。
  - 首页运行时临时抽帧；未播放态封面必须来自服务/数据生产出的封面 URL。
gwt_acceptance:
  GWT1:
    title: 图片选择器达到商用品质的深色 iOS 图片发布体验
    given:
    - "用户已登录，并从全局 `/create?type=gallery` 选择图片，或从图片专用追加入口进入图片选择。"
    - 设备相册权限可用，最近项目和至少一个相册目录包含图片。
    when:
    - 用户打开图片选择器、切换相册目录、选择多张图片、取消其中一张，并拖动底部缩略条调整顺序。
    then:
    - 页面使用深色 iOS 全屏选择态，顶部为返回按钮和居中“图片选择”下拉标题。
    - 相册下拉展示封面、名称、数量和选中态；切换后宫格只显示当前目录图片。
    - 宫格首项为拍摄，图片右上角空心圆选择态；选中后显示与底部顺序一致的蓝色编号。
    - 底部仅展示“编辑图片”和“完成(n)”，不出现“一键成片”或视频发布暗示。
    - 底部缩略条在内容不足一屏时仍从左起始，不得视觉居中。
    - 宫格取消、底部点叉删除和拖动排序会同步更新底部缩略条、宫格编号与最终完成顺序；拖拽悬停到目标槽位时，其余缩略图会先即时前移/后移空出目标位，松手后才提交最终顺序。
    done_when:
    - 图片选择器可把当前顺序图片回填到创作编辑器当前位置，且该顺序与底部缩略条悬停后的最终顺序一致。
    edge_cases:
    - 未授权相册权限时展示内联权限态和恢复动作。
    - 选中数达到上限时阻止新增并展示用户可理解提示。
    - 目录为空时展示空态，不破坏底部已有选择。
    contract_refs:
    - quwoquan_app/lib/components/media/picker/create_media_picker_page.dart
    - quwoquan_app/lib/core/services/media_picker_service.dart
    - quwoquan_app/lib/ui/content/entry/pages/create_page.dart
    performance_points:
    - 相册 warm 打开到可交互 P95 <= 1.2s。
    - 选中/取消/排序反馈 P95 <= 100ms，不能整页缩略图闪烁。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/content/create/creation_mixed_media_picker__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/content/create/create_entry_media_resolution__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/components/media/media_reorderable_view__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/components/media/image_editor_thumbnail_reorder_widget__local_contract_test.dart
