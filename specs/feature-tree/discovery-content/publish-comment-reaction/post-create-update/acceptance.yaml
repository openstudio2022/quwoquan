    - 2026-06-22 已记录图片模式展示规则、相册目录切换、视频防穿透、宫格选择、底部删除与完成回填 widget 合同；真实拖拽手势由后续真机巡检继续覆盖。
    - 2026-06-23 新增跨页面 user_acceptance：重入图片选择器不预选旧图，但确认后会把新图追加到已有图片末尾，不覆盖第一次选择。
    - 2026-06-25 补充缩略条左对齐、悬停即时让位、图片创作标题与创作页图片网格重排 local_contract；仍未覆盖真机触控与长列表惯性拖拽。
    - 2026-06-28 对齐全局照片入口：选择图片后进入图片 flow，图片/视频互斥仍以最终媒体类型和 payload 为准。
  GWT2:
    title: 图片拍摄为高保黑色拍照确认流并统一进图片编辑页
    given:
    - "用户从图片选择器首格“拍摄”、图片专用拍摄入口，或全局 `/create?type=capture` 默认拍照模式进入相机。"
    - 设备相机权限可用。
    when:
    - 用户切换滤镜/闪光灯/前后镜头，拍摄一张照片，在确认页选择重新拍摄或使用照片。
    then:
    - 图片专用拍摄页为全黑沉浸式 chrome，顶部仅保留返回、居中“拍照模式”和闪光灯；底部仅保留滤镜、快门、翻转。
    - 图片专用拍照模式不出现录像切换、动图入口或麦克风权限请求；默认后置、闪光灯 off、滤镜 original。
    - 全局 `/create?type=capture` 可显示拍照/录像切换，但拍照返回时必须进入同一图片确认与图片编辑回流。
    - 闪光灯为单击开关，不弹出选择面板；图标在关闭闪光与开启闪光状态之间切换，前置镜头不可用时置灰并关闭。
    - 六个相机滤镜来自 `filter_presets.json` 的 `camera_photo` 集合，实时作用于取景/预览，不在相机页维护第二套矩阵或文案。
    - 拍照后展示确认态，包含“重新拍照”和“使用照片”；重新拍照保留当前滤镜、镜头和闪光灯状态。
    - "使用照片必须先进入 `ImageEditorPage`；编辑完成后按 caller 回流，picker 来源追加到选择器底部，`/create?type=capture` 来源追加到创作页图片列表。"
    done_when:
    - 从拍摄得到的图片可进入图片选择器底部缩略条或创作编辑器图片列表，并参与排序、编辑和发布。
    edge_cases:
    - 相机不可用时展示深色页面级错误态和重试/返回动作。
    - 相机权限拒绝时展示深色权限态和去设置/返回动作。
    - 拍摄失败时展示提交级错误，不退出创作上下文。
    contract_refs:
    - quwoquan_app/lib/components/media/camera/camera_capture_page.dart
    - quwoquan_app/lib/components/media/picker/create_media_picker_page.dart
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/content/create/camera_capture_mode_switch__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/content/create/photo_camera_capture_flow__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/content/create/photo_camera_hifi_layout__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/ui/content/entry/journeys/photo_picker_reentry_append_journey__user_acceptance_test.dart
      recorded:
