version: 2
node:
  id: image-editing
  level: L3_story
  path: specs/feature-tree/discovery-content/publish-comment-reaction/image-editing
  title: image editing
  parent_domain_service: discovery-content
  parent_business_capability: publish-comment-reaction
scope:
  summary: 图片编辑器商用化：工具全真实现（占位清零）、曲线/白平衡/马赛克/文字补齐、全局撤销与放弃保护、像素引擎同源与页面观测。
  in_scope:
  - 一级工具（滤镜/裁剪/旋转/专业工具/文字/马赛克）与专业工具箱（整体/局部/HSL/黑白色阶/曲线/白平衡）全部真实像素级实现。
  - 确认即烘焙 + 文件快照全局撤销/重做/历史回退；back 放弃确认与顶栏完成提交。
  - ImageEditorExportEngine 预览导出同源、解码降采样上限。
  - page.media.image_editor 四事件埋点与 image_editor_tool_used 工具分布。
  out_of_scope:
  - 消除笔/透视校正/涂鸦/贴纸/美颜（M3 规划）。
  - FilterCatalogRelease 云目录与 MediaAsset 图片 variants（独立 M2 Story）。
  - EditRecipe/FilterUsageFact/FilterUsageStatsView 上云与圈子交集（独立 M3 Story）。
  - 媒体上传/发布链路（归属 post-create-update）。
gwt_acceptance:
  GWT1:
    title: 工具入口零占位，所见工具即真实效果
    given: [用户从图片选择器/相机/创作页进入图片编辑器]
    when: [用户遍历底部工具栏与专业工具箱的全部入口并逐一确认]
    then:
    - 底部工具栏为滤镜/裁剪/旋转/专业工具/文字/马赛克 6 项；不存在相框入口。
    - 专业工具箱为调整图片/局部/HSL/黑白色阶/曲线/白平衡 6 项；不存在透视/修复/色调对比度/魅力光晕占位项。
    - 任何面板不出现「操作模版或内容」「即将支持」类占位文案。
    - 每个工具确认后当前图片文件被真实烘焙（文件路径变更且像素变化）。
    done_when: [全仓无占位符号；工具确认路径全部经 ImageEditorExportEngine 烘焙]
    edge_cases: [烘焙失败（解码失败/磁盘满）展示结构化错误反馈并保持原图不变]
    contract_refs:
    - quwoquan_app/lib/components/media/image/editor/image_editor_page.dart
    - quwoquan_app/lib/components/media/image/editor/shared/image_editor_export_engine.dart
    performance_points: [12MP 单工具烘焙 P95 <= 3s]
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_discard_confirm__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_export_pipeline__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_operation_panel__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_invalid_image_decode__local_contract_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: image_editor_export_pipeline
        cases:
        - local_contract.discovery_content.publish_comment_reaction.image_editing.export_pipeline_pixel_assertions
        envs: &id001
        - local
  GWT2:
    title: 曲线为真实多通道 LUT 编辑器
    given: [用户进入专业工具箱曲线面板]
    when: [用户切换 RGB/R/G/B 通道、添加/拖动控制点并确认]
    then:
    - 面板展示直方图背景、对角基线与通道曲线；控制点可增删拖动（每通道最多 8 点，端点仅纵向）。
    - LUT 由 Fritsch–Carlson 单调插值生成，无过冲；预览与导出使用同一 LUT。
    - 确认后图片按曲线烘焙并入撤销栈；取消不产生任何变更。
    done_when: [曲线引擎单测覆盖恒等/单调/S 曲线/提亮/排序与像素应用断言]
    edge_cases: [恒等曲线确认不产生步骤; 预览资源加载失败上报 failure 埋点且不崩溃]
    contract_refs:
    - quwoquan_app/lib/components/media/image/editor/panels/curves/image_editor_curve_models.dart
    - quwoquan_app/lib/components/media/image/editor/panels/curves/image_editor_curve_panel.dart
    performance_points: [控制点拖动预览重算合并连续帧，不阻塞 UI 线程]
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_curve_engine__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_operation_panel__local_contract_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: image_editor_curve_engine
        cases:
        - local_contract.discovery_content.publish_comment_reaction.image_editing.curve_lut_monotone_and_pixel_apply
        envs: *id001
  GWT3:
    title: 马赛克与文字为图上实绘图层
    given: [用户进入马赛克或文字工具]
    when: [马赛克涂抹并确认；文字添加/拖缩旋/样式颜色切换并确认]
    then:
    - 马赛克涂抹路径实时显示对应马赛克效果；笔画可单步撤销；确认后全尺寸合成。
    - 文字项以图层渲染，选中态可编辑样式（纯色/描边/底纹）与 8 色板颜色，双击重新编辑内容。
    - 预览与导出共用同一归一化几何（buildMosaicStrokePath / buildTextPainter）。
    done_when: [模型 wire roundtrip、笔刷映射、路径命中与像素合成断言全绿]
    edge_cases: [空笔画/空文字确认不产生步骤直接退出; 预览马赛克资源未就绪时以半透明蒙层反馈]
    contract_refs:
    - quwoquan_app/lib/components/media/image/editor/panels/mosaic/image_editor_mosaic_models.dart
    - quwoquan_app/lib/components/media/image/editor/panels/text/image_editor_text_models.dart
    performance_points: [涂抹跟手 P95 <= 50ms]
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_annotation_models__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_export_pipeline__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_operation_panel__local_contract_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: image_editor_annotation_models
        cases:
        - local_contract.discovery_content.publish_comment_reaction.image_editing.mosaic_text_models_and_geometry
        envs: *id001
  GWT4:
    title: 全局撤销/重做与放弃保护
    given: [用户完成了至少一步工具确认]
    when: [用户点击顶栏撤销/重做/记录，或点击 back]
    then:
    - 撤销恢复上一步文件快照；重做恢复；新步骤清空重做栈；历史面板可回退到任一步之前。
    - back 弹出破坏性放弃确认；确认后宿主收到 null 不更新；无修改时直接退出。
    - 顶栏「完成」提交编辑结果并上报 submit 埋点。
    done_when: [步骤栈契约测试与页面 widget 测试（放弃/完成/禁用态/工具入口清单）全绿]
    edge_cases: [多图会话撤销仅作用于对应图片槽位; 快照文件缺失时撤销不崩溃]
    contract_refs:
    - quwoquan_app/lib/components/media/image/editor/shared/image_editor_step_stack.dart
    - quwoquan_app/lib/components/media/image/editor/top_bar/image_editor_top_bar.dart
    performance_points: [撤销/重做为文件路径切换，无重新烘焙开销]
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_discard_confirm__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_step_stack__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/media/image_editor_thumbnail_reorder_widget__local_contract_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: image_editor_step_stack
        cases:
        - local_contract.discovery_content.publish_comment_reaction.image_editing.step_stack_undo_redo_revert
        envs: *id001
