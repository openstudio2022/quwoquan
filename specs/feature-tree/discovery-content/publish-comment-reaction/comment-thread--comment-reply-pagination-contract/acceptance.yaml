        envs: *id001
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.discovery_content.publish_comment_reaction.comment_thread_comment_reply_pagination_contract.gwt1_api_integration
        envs:
        - beta
        - gamma
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/content/providers/comment_reply_pagination_test.dart'
    - '[migrated_from_planned] quwoquan_service/services/content-service/tests/comment_thread_contract_test.go'
