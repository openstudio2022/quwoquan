version: 2
node:
  id: exposure-observability-capacity
  level: L3_story
  path: specs/feature-tree/discovery-content/exposure-governance/exposure-observability-capacity
  title: exposure observability capacity
  parent_domain_service: discovery-content
  parent_business_capability: exposure-governance
scope:
  summary: 曝光治理的指标、告警、容量估算和回滚层。
  in_scope:
  - 曝光健康 SLI 和告警阈值。
  - 容量策略分层。
  - 回滚层与降级路径。
  out_of_scope:
  - P0 不实现曝光基尼、覆盖率、生命周期复活、策略下架剔除延迟等 P1/P2 高级 emitter。
gwt_acceptance:
  GWT1:
    title: 曝光观测与容量 GWT
    given:
    - 曝光治理能力逐步上线。
    when:
    - 重复曝光、曝光集中、复活异常、频控异常或预算异常发生。
    then:
    - SLI、告警和回滚层能够定位并关闭对应能力，feed 主路径可回退。
    done_when:
    - SLI 名称、告警、容量分层和回滚层均冻结。
    - 状态写入量、ingest QPS 与 buffer/ingest drop（rec_hotpath_dropped_total、ingest_dropped_total）可观测；无
      emitter 告警标注前置。
    edge_cases:
    - local-gamma 只能证明链路，不作为真集群容量基准。
    contract_refs:
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    - deploy/monitoring/alerts/quwoquan_alerts.yaml
    performance_points:
    - exposure_gini <= 0.65
    - content_coverage_rate >= 0.30
    - policy_takedown_ejection_latency P95 <= 60s
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/api_integration/post_behavior_contract__api_integration_test.go
      - file: quwoquan_service/services/content-service/tests/local_contract/internal/application/exposure_observability_capacity__local_contract_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.exposure_governance.exposure_observability_capacity.contract
        envs: &id001
        - local
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.discovery_content.exposure_governance.exposure_observability_capacity.gwt1_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.exposure_governance.exposure_observability_capacity.gwt1_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/content-service/tests/recommendation_slo_contract_test.go'
    - '[migrated_from_planned] agent_ops/tests/test_recommendation_alerts.py'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/engine_test.go'
    - '[migrated_from_recorded_reference] quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml'
    - '[migrated_from_recorded_reference] deploy/monitoring/alerts/quwoquan_alerts.yaml'
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
