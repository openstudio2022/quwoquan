version: 2
node:
  id: exposure-governance
  level: L2_business_capability
  path: specs/feature-tree/discovery-content/exposure-governance
  title: exposure governance
  parent_domain_service: discovery-content
  parent_business_capability: exposure-governance
scope:
  summary: 推荐曝光治理的商用成熟度能力：served/impressed 双轨、疲劳、频控、动态预算、复活、活跃度自适应与曝光健康。
  in_scope:
    - served/impressed 双轨和跨页、跨会话去重规格。
    - 作者、标签、话题和 near-dup 频控规格。
    - 动态曝光预算、分级流量池和 bandit 先验规格。
    - 内容生命周期复活与活跃度自适应规格。
    - 曝光健康 SLI、容量与回滚策略。
  out_of_scope:
    - P1/P2 的动态预算、生命周期复活、协同召回和模型容量按各自 Story 推进。
    - 深度排序模型平台轨。
    - 交集 affinity 异步模型化与四主页真实数据 T3/T4。
sit_acceptance:
  SIT1:
    title: 曝光治理商用成熟度 SIT
    story_refs:
      - discovery-content/exposure-governance/served-dedup-write-behind
      - discovery-content/exposure-governance/cross-session-fatigue-memory
      - discovery-content/exposure-governance/dimension-frequency-and-neardup
      - discovery-content/exposure-governance/dynamic-exposure-budget
      - discovery-content/exposure-governance/content-lifecycle-resurfacing
      - discovery-content/exposure-governance/activity-adaptive-exposure
      - discovery-content/exposure-governance/exposure-observability-capacity
      - discovery-content/exposure-governance/ops-intervention-and-policy-ejection
    done_when:
      - 七态状态分离（served/visible/impressed/dwell/interaction/negative/training_sample），短窗口下发去重和真实曝光疲劳分别有契约定义。
      - 曝光记忆与过滤不依赖长窗口全量 SMembers，served/impressed 按 user+day 分桶、negative 用户级，容量有 cardinality budget。
      - 端侧反馈上报统一通道、分级采样、clientEventId 幂等与 feedRequestId 归因闭环，细则归 feed-orchestration-recommendation/feedback-ingestion-sampling。
      - 动态曝光预算、生命周期复活与活跃度自适应均通过 metadata-first 前置清单约束，不形成第二套推荐引擎。
      - 曝光健康 SLI 与 `recommendation_slo.yaml` 同名；P0 emitter 已 measured，P1/P2 无 emitter 告警保持前置标注。
      - 运营干预与违规/下架剔除有审计、过期、回滚和 SLO 口径。
      - "`feed-orchestration-recommendation` 只引用 exposure-governance 的能力边界，不再拥有独立曝光预算或生命周期真相源。"
    performance_points:
      - repeat_exposure_rate < 0.01。
      - exposure_gini <= 0.65。
      - content_coverage_rate >= 0.30。
      - policy_takedown_ejection_latency P95 <= 60s。
    evidence:
      primary:
        - T1_static_contract
        - T2_module_interaction
      supporting:
        - T3_app_api_integration
        - T4_e2e_journey
    tests:
      planned:
        - quwoquan_service/runtime/recommendation/exposure_dynamic_budget_test.go
        - quwoquan_service/services/content-service/tests/post_feed_exposure_governance_contract_test.go
        - quwoquan_app/test/patrol/discovery/feed_exposure_governance_journey_test.dart
      recorded:
        - quwoquan_service/runtime/recommendation/engine_test.go
        - quwoquan_service/services/content-service/tests/post_behavior_contract_test.go
        - quwoquan_app/test/cloud/behavior/contract/behavior_repository_contract_test.dart
        - quwoquan_app/test/cloud/content/content_behavior_tracker_test.dart
        - quwoquan_app/test/core/trackers/intersection_attribution_test.dart
    status: partially_implemented_p0
execution:
  local_gate:
    - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
    - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
    - make gate
