version: 2
node:
  id: dynamic-exposure-budget
  level: L3_story
  path: specs/feature-tree/discovery-content/exposure-governance/dynamic-exposure-budget
  title: dynamic exposure budget
  parent_domain_service: discovery-content
  parent_business_capability: exposure-governance
scope:
  summary: 分级流量池赛马与 bandit 动态曝光预算，让优质内容随反馈获得更多曝光。
  in_scope:
  - 流量池状态、bandit 先验、reward 与晋级/淘汰阈值。
  - 动态预算指标、AB 分桶和回滚层。
  out_of_scope:
  - P1 先实现基于 recpolicy 的分级流量池曝光份额约束；真实 Thompson Sampling 与预算存储留给后续 `rm_exposure_state`
    物化增强。
  - 深度排序模型和 IPS 训练不进入本 Story。
gwt_acceptance:
  GWT1:
    title: 动态曝光预算 GWT
    given:
    - 新内容进入 trial 池，已有内容处于 rising/mature/evergreen 池。
    when:
    - 内容获得点击、完成、停留、正向互动或负反馈。
    then:
    - 内容曝光预算按 reward 与不确定性晋级、保持或淘汰，预算分配可观测且可回滚。
    done_when:
    - 流量池状态机、reward、先验、阈值、AB 标签和回滚层均冻结。
    edge_cases:
    - 小样本内容不得因早期少量负反馈永久淘汰；需要最小样本量或置信度保护。
    contract_refs:
    - quwoquan_service/contracts/metadata/recommendation/rec_model/policy.yaml
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    performance_points:
    - dynamic_budget_share observe_only
    - ab_experiment_validity >= 0.95
    tests:
      planned: []
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.exposure_governance.dynamic_exposure_budget.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.exposure_governance.dynamic_exposure_budget.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.discovery_content.exposure_governance.dynamic_exposure_budget.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - '[migrated_from_planned] quwoquan_service/services/content-service/tests/post_feed_exposure_governance_contract_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/engine_test.go'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
