scope:
  summary: 内容生命周期状态机与优质老内容复活召回。
  in_scope:
    - 生命周期状态机。
    - 季节、事件、社交、常青、二次分发复活触发器。
    - 合规准入、疲劳、去重和动态预算约束。
  out_of_scope:
    - 本轮不实现 ResurfaceSource 或 rm_exposure_state。
gwt_acceptance:
  GWT1:
    title: 内容复活 GWT
    given:
      - 一篇老内容处于 dormant 状态，但历史完成率高，且当前季节或社交事件命中。
    when:
      - 用户请求推荐 feed。
    then:
      - 该内容可经复活召回进入候选，但仍受去重、疲劳、审核和预算约束，并带复活触发解释。
    done_when:
      - 生命周期状态、触发器、约束链路、指标和回滚层均冻结。
    edge_cases:
      - retired 或违规下架内容不能被复活。
    contract_refs:
      - quwoquan_service/contracts/metadata/content/post/storage.yaml
      - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    performance_points:
      - resurfaced_exposure_rate observe_only
    evidence:
      primary:
        - T1_contract
        - T2_module_interaction
      supporting:
        - T3_app_api_integration
        - T4_e2e_journey
    tests:
      planned:
        - quwoquan_service/runtime/recommendation/exposure_resurfacing_test.go
        - quwoquan_service/services/content-service/tests/post_feed_resurfacing_contract_test.go
      recorded: []
    status: specified
