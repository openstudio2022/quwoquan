  title: content action intent contract
  parent_domain_service: discovery-content
  parent_business_capability: content-display-journey-consistency
scope:
  summary: Post 八类互动/反馈意图、更多面板、举报生命周期、账号态治理动作与推荐回流的商用闭环。
  in_scope:
  - like/favorite/share/comment/dislike/report/block user/block keywords 对象归属与端云链路。
  - 举报原因选择、reporter 私有进度、运营 Report/ModerationCase 审核与结案通知。
  - 不感兴趣即时移除、短时 undo_dislike 补偿和未来窗口精确过滤。
  - 首页 Feed 与 Work Browser 两个宿主的行为、归因、登录 continuation 和错误恢复一致性。
  out_of_scope:
  - 打赏、会员、虚拟币等交易能力（R-LEGAL-001 未关闭前不展示）。
  - 通用 App 意见反馈对象；本 Story 只负责 Post 反馈与治理。
  - 推荐深度模型参数与线上收益晋级。
gwt_acceptance:
  GWT1:
    title: Post 反馈与治理动作端云闭环 GWT
    given:
    - 用户从首页 Feed、Work Browser 或用户主页打开正式更多/举报入口。
    - metadata 已声明 Report、Behavior、PersonaRelationship 与 UserSettings 对象操作。
    when:
    - 用户执行不感兴趣、撤销、拉黑作者、屏蔽关键词或选择原因后提交举报。
    - 运营人员领取 Report、审核当前 PostModerationCase 并 resolved 或 dismissed。
    then:
    - 面板只展示具备真实结果的动作，不出现开发中 toast 或空回调。
    - 不感兴趣立即移除/跳过且带完整 feed 归因；撤销只恢复当前 Post 的精确负反馈。
    - 拉黑和屏蔽关键词在登录成功后续接原动作，关闭登录回到安全状态且不循环。
    - 举报以可信 persona 归属；创建时同步固化可信 account 归属，结案通知只能投递至该 account 的 Inbox，且 account 标识不得从 App API 回显。
    - 举报人只能在“我的举报”查看自己的公开生命周期字段。
    - Portal 先消费当前 PostModerationCase 后再允许内容处置或驳回举报。
    done_when:
    - App、content-service、user-service、notification-service 与 Portal 共享同一 metadata/ContractGraph。
    - local_contract、api_integration 与 user_acceptance 证据均可定位并通过适用门禁。
    edge_cases:
    - 游客关闭登录不回到受限触发点，登录成功恢复原 post/reason/关键词。
    - 举报目标删除、Case 尚未投影、重复 Idempotency-Key、未知 cursor、越权 reporter、缺失可信 account 或伪造 Inbox 身份均 fail closed。
    - 弱网缓存回退继续过滤 blockedKeywords，不重新展示已屏蔽内容。
    - 最后一条沉浸内容负反馈不黑屏，撤销仍可恢复。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/report/service.yaml
    - quwoquan_service/contracts/metadata/content/report/events.yaml
    - quwoquan_service/contracts/metadata/content/post/behaviors.yaml
    - quwoquan_service/contracts/metadata/content/post_moderation_case/service.yaml
    - quwoquan_service/contracts/metadata/user/user_settings/service.yaml
    - quwoquan_service/contracts/metadata/user/persona_relationship/service.yaml
    performance_points:
    - CreateReport P95 <= 800ms；ListMyReports P95 <= 400ms。
    - 举报 72 小时结案率 >= 95%。
    - 行为上报到精确负反馈过滤生效 P95 < 100ms。
    tests:
      planned:
      - file: quwoquan_ops/tests/acceptance/user_acceptance/service_ops/content-service/gate/verify_report_feedback_four_environment.py
      - file: quwoquan_ops/tests/acceptance/user_acceptance/service_ops/content-service/smoke/run_report_feedback_lifecycle_probe.py
      recorded:
