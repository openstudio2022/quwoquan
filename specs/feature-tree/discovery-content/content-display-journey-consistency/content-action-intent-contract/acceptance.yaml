    notes:
    - 2026-07-20：代码与本地三层证据已登记；四环境 stackctl 与对象级旅程报告未全部取得前保持 partial，不以静态实现宣称商用完成。
    - 2026-07-21：Report 持久化可信 reporterAccountId；resolved/dismissed 事件以该账户投递，Inbox 只接受 JWT principal 的 account，拒绝 X-Client-User-Id 伪造。对应本地/API 契约覆盖账户持久化、事件投递和私有字段不回显。
    - 2026-07-21：历史 Report 的 persona→account 迁移只接受受控、可审计的映射工件；缺失、冲突或未验证映射均 fail closed，绝不将 personaId 猜作 accountId。Beta/Gamma 的 content-release workload 显式禁用与举报旅程无关的 embedding/ES 管线，full workload 仍对 embedding Binding fail closed。
    - 2026-07-20 门禁已从“通用环境状态 + 文件存在”强化为对象级证据：beta/gamma 必须实际执行创建、幂等重放、reporter 隔离、运营驳回、通知回流及 dislike 撤销；prod 只允许真实鉴权的 read-only 私有列表探针；所有报告必须晚于当前代码。
    - 2026-07-20 最新实跑：beta 通用 integration `.qwq_output/env/beta/runs/20260720T174029Z-verify-beta-local/report.json` 为 ok，但对象级探针 `.qwq_output/env/beta/runs/20260720T174907Z-report-feedback-beta/report-feedback-lifecycle.json` 在 `GET /content/users/me/reports` 返回 404，证明当前 beta fixture gateway 未接真实 Report 服务，不能计商用证据；gamma/prod release 仍为 GATE_BLOCK 且尚无合格对象级报告。
