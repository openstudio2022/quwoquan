    title: content service cloud production 能力 SIT
    story_refs: []
    done_when:
    - 能力内 Story 组合、状态机、异常路径和端云协同可验证。
    - 四种 contentType 共用同一五阶段 required-artifact 契约且严格 Schema fail-closed。
    - executionId 对 immutable core 确定、敏感，resume 只追加 checkpoint/log。
    - Prompt 快照可重放、哈希可校验且拒绝密钥形变量。
    - release 同 ID 二次装配失败，且不含 Prompt、draft、repair、raw log 或完整 5.review。
    - canonical 仅含自治 creators/entities/posts/tags/media objects，全部对象引用闭包且环境中立。
    - release create-once；环境执行只读 desired state 并把证据 append-only 写入 env run。
    - importer 拒绝缺 release、路径逃逸与悬挂引用。
