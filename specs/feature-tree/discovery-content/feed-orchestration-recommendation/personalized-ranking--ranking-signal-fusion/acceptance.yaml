version: 2
node:
  id: personalized-ranking--ranking-signal-fusion
  level: L3_story
  path: specs/feature-tree/discovery-content/feed-orchestration-recommendation/personalized-ranking--ranking-signal-fusion
  title: personalized ranking  ranking signal fusion
  parent_domain_service: discovery-content
  parent_business_capability: feed-orchestration-recommendation
scope:
  summary: 多路排序信号融合；质量分、垂类、供给来源与交集 fact/affinity 只经统一 Rule/CascadeScorer 注入。
  in_scope:
  - qualityScore/recScore 投影消费。
  - intersectionFactStrength/intersectionFreshness/affinityIntersectionScore 候选级融合。
  - fact > affinity，affinity 必须有 confidenceLabel。
  - contentVertical/supplySource/recallPath 观测分桶。
  out_of_scope:
  - intersection-only ranker。
  - 同步 /v1/score 读路径打分。
  - MMoE/PLE/ESMM、双塔 ANN、IPS/Thompson 深排平台。
gwt_acceptance:
  GWT1:
    title: personalized ranking  ranking signal fusion GWT
    given:
    - 候选来自 tag/hot/social/collab_i2i/collab_u2i/explore 等多路召回，且 rm_discovery_feed 已投影质量分、垂类、供给来源和交集候选特征。
    when:
    - Engine 组装 ContentCandidate 并执行统一排序。
    then:
    - 高质量冷启动内容获得保守提升；fact 交集高于 affinity；无 confidenceLabel 的 affinity 不加分；排序不调用同步 scorer RPC。
    done_when:
    - policy.yaml、feature_registry、ContentCandidate、RuleScorer 和 App 解释显示均对齐。
    edge_cases:
    - affinityIntersectionScore 存在但 confidenceLabel 缺失时不参与融合。
    - primaryText 缺失时首页/精品不渲染推荐解释占位。
    contract_refs:
    - quwoquan_service/contracts/metadata/recommendation/rec_model/policy.yaml
    - quwoquan_service/services/rec-model-service/scripts/feature_registry.yaml
    performance_points:
    - negative_feedback_rate <= 0.08
    - content_coverage_rate >= 0.30
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/runtime/recommendation/intersection_fusion__local_contract_test.go
      - file: quwoquan_service/services/content-service/tests/local_contract/runtime/recommendation/quality_score_fusion__local_contract_test.go
      - file: quwoquan_app/test/local_contract/components/content/intersection_reason_chip_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/discovery/home_intersection_multiform_feed_widget__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.personalized_ranking_ranking_signal_fusion.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.personalized_ranking_ranking_signal_fusion.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: ui_explain_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.primary_text_explain_contract
        envs: *id001
    notes:
    - P0 已覆盖规则融合、qualityScore 冷启动、fact > affinity、affinity confidenceLabel 门、首页/精品 primaryText 显示契约。
    - api_integration/user_acceptance 仍需 gamma 数据验证 feedRequestId/rankingVersion/reasonVersion 与行为分桶。
