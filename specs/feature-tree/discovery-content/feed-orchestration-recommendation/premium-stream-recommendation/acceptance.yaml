version: 2
node:
  id: premium-stream-recommendation
  level: L3_story
  path: specs/feature-tree/discovery-content/feed-orchestration-recommendation/premium-stream-recommendation
  title: premium stream recommendation
  parent_domain_service: discovery-content
  parent_business_capability: feed-orchestration-recommendation
scope:
  summary: 精品/沉浸式内容流的非深排 P0 路由、质量准入边界与 primaryText 解释契约。
  in_scope:
  - premium/similar/featured/immersive/精品 路由到 FeedSimilar + premium_stream。
  - premium preset、质量分和交集融合排序。
  - 精品解释标题与 primaryText-only 呈现。
  - product-ops 全局精品池写入前置：global scope、质量准入、审计、过期、回滚和下架剔除。
  - P1d-2 content-service 精品池投影读取、PremiumPoolSource 场景门控、premium_pool recall path 和统一过滤。
  out_of_scope:
  - 未经 content-service 投影读取验收的 PremiumPoolSource 上线启用。
  - 同步 scorer 调用。
  - 深排平台、双塔 ANN、IPS/Thompson。
  - 第二套标签、实体、解释或 App 本地精品列表。
gwt_acceptance:
  GWT1:
    title: 精品流式体验路由与解释契约
    given:
    - 用户进入精品/沉浸式内容流，内容具备质量分和交集理由。
    when:
    - content-service 请求推荐引擎，App 展示精品详情解释。
    then:
    - 推荐场景为 similar/premium_stream，App 标题展示“与你相关的线索”，主句只显示 primaryText。
    done_when:
    - 路由、排序、解释、product-ops 全局精品写入前置和未启用 PremiumPoolSource 的边界均可测试。
    edge_cases:
    - primaryText 缺失时不显示解释占位。
    - secondaryText 只在详情列表辅助展示，不作为主句兜底。
    contract_refs:
    - specs/feature-tree/discovery-content/feed-orchestration-recommendation/premium-stream-recommendation/spec.md
    - quwoquan_service/contracts/metadata/recommendation/rec_model/policy.yaml
    performance_points:
    - negative_feedback_rate <= 0.08
    - content_coverage_rate >= 0.30
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/internal/application/feed/feed_service_negative_fallback__local_contract_test.go
      - file: quwoquan_service/services/product-ops-service/tests/local_contract/cmd/api/main__local_contract_test.go
      - file: quwoquan_app/test/local_contract/ui/content/widgets/intersection_reason_chip_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/discovery/home_intersection_multiform_feed_widget__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.premium_stream_recommendation.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: user_acceptance
        suite: gwt1_user_acceptance
        cases:
        - user_acceptance.discovery_content.feed_orchestration_recommendation.premium_stream_recommendation.gwt1_user_acceptance
        envs:
        - gamma_local
    notes:
    - P0 已覆盖 FeedService premium_stream 路由与 App primaryText-only 解释。
    - P1d 已补 product-ops 全局精品池写入前置；PremiumPoolSource 仍需 content-service 投影/读取集成后启用。
  GWT2_premium_pool_readpath:
    title: 精品池全局召回读路径闭环
    given:
    - product-ops 已写入 global scope、qualityAdmission=approved、未过期且未下架的精品条目。
    - content-service 拥有内容 published/approved/visible 与推荐质量分投影。
    when:
    - 用户进入 premium_stream/similar 精品流。
    then:
    - content-service 只读本地精品池推荐投影，装配 RecallPath=premium_pool 候选并交给 Engine 统一过滤、排序和曝光治理。
    done_when:
    - product-ops 写入、回滚、过期、下架状态可投影到 content-service 推荐读模型。
    - PremiumPoolSource 不同步调用 product-ops、质量模型、数据工程任务或 /v1/score。
    - premium_pool 候选与其他召回源共享负反馈、下架、过期、频控、near-dup、作者屏蔽和类型屏蔽过滤。
    - disable_premium_pool_source 回滚开关生效时，精品流退回 premium preset + 通用候选，不退回圈内精选。
    - premium_pool 分桶进入 replay、AB、看板和告警归因。
    edge_cases:
    - 投影缺失或过期时 fail closed，不用 Post.Featured 或圈内精选兜底。
    - 内容已下架、作者被屏蔽、类型被屏蔽或 near-dup 命中时必须被过滤。
    - 低流量 premium_pool 分桶只用于诊断，不单独作为策略晋级依据。
    contract_refs:
    - specs/feature-tree/discovery-content/feed-orchestration-recommendation/premium-stream-recommendation/spec.md
    - quwoquan_service/contracts/metadata/recommendation/rec_model/projections/premium_pool_projection.yaml
    - quwoquan_service/contracts/metadata/recommendation/rec_model/policy.yaml
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    performance_points:
    - premium_pool_active_projection_coverage >= 0.99
    - premium_pool_takedown_ejection_lag_p95 <= 60s
    - premium_pool_negative_feedback_rate <= 0.08
    - premium_pool_unknown_attribution_rate <= 0.01
    tests:
      planned:
      - file: quwoquan_service/services/content-service/tests/api_integration/recommendation/premium_pool_readpath__api_integration_test.go
      - file: quwoquan_app/test/user_acceptance/discovery/premium_stream_premium_pool__user_acceptance_test.dart
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/internal/infrastructure/recommendation/premium_pool_source__local_contract_test.go
      - file: quwoquan_service/services/product-ops-service/tests/local_contract/cmd/api/main__local_contract_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.premium_stream_recommendation.premium_pool_readpath
        envs: &id002
        - local
      supporting:
      - layer: api_integration
        suite: gwt2_api_integration
        cases:
        - api_integration.discovery_content.feed_orchestration_recommendation.premium_stream_recommendation.premium_pool_readpath
        envs:
        - gamma
      - layer: user_acceptance
        suite: gwt2_user_acceptance
        cases:
        - user_acceptance.discovery_content.feed_orchestration_recommendation.premium_stream_recommendation.premium_pool_readpath
        envs:
        - gamma_local
    notes:
    - 2026-06-25 continue-dev 裁决：下一轮主切片为 P1d-2 精品池读路径闭环，且已进入开发。
    - 已完成 local_contract 基座：rm_premium_pool projection metadata、fail-closed 投影字段、product-ops PremiumPoolEntry* 事件发布、content-service PremiumPoolProjector/PremiumPoolEventConsumer、PremiumPoolSource premium_stream/similar 场景门控、RecallPath=premium_pool、content-service 接线和 disable_premium_pool_source 回滚开关。
    - 仍不能宣称 GWT2 完成：真实 product-ops API -> Redis events.ops -> content-service Mongo rm_premium_pool -> /v1/content/feed 的 api_integration、user_acceptance 和 Gamma/UAT 仍为 planned。
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
