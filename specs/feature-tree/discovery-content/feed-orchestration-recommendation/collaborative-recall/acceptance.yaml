    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/recommendation/collaborative_recall_test.go'
    - '[migrated_from_recorded_reference] quwoquan_service/services/content-service/internal/infrastructure/recommendation'
    - '[migrated_from_recorded_reference] quwoquan_service/services/content-service/cmd/api'
