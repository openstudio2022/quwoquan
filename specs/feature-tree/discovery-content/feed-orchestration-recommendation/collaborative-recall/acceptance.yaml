version: 2
node:
  id: collaborative-recall
  level: L3_story
  path: specs/feature-tree/discovery-content/feed-orchestration-recommendation/collaborative-recall
  title: collaborative recall
  parent_domain_service: discovery-content
  parent_business_capability: feed-orchestration-recommendation
scope:
  summary: itemCF/swing i2i 与 u2i 非深度协同召回规格，提升早期推荐准确性。
  in_scope:
  - 行为共现离线物化。
  - i2i/u2i 召回源与多路召回配额融合。
  - replay 评估与回滚层。
  out_of_scope:
  - 离线物化作业和 replay 评估脚本按后续数据工程切片补齐。
  - feed 读路径同步共现计算。
  - 双塔 ANN。
gwt_acceptance:
  GWT1:
    title: 协同召回 GWT
    given:
    - 系统拥有用户点击、停留、点赞、收藏、评论等共现行为。
    when:
    - 离线作业物化 i2i/u2i 候选后，用户请求推荐 feed。
    then:
    - 协同候选按配额进入召回融合，相关性提升可由 replay 与线上 SLI 证明。
    done_when:
    - 物化表、召回源、配额、recall_path、评估指标和回滚层均规格化。
    edge_cases:
    - 行为稀疏用户回退 tag/hot/new/interest onboarding 保底。
    contract_refs:
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    - quwoquan_service/contracts/metadata/recommendation/rec_model/policy.yaml
    performance_points:
    - collaborative_recall_lift >= 0.05
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/runtime/recommendation/collaborative_recall__local_contract_test.go
      - file: quwoquan_service/services/content-service/cmd/api/main__local_contract_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.collaborative_recall.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.collaborative_recall.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.discovery_content.feed_orchestration_recommendation.collaborative_recall.gwt1_api_integration
        envs:
