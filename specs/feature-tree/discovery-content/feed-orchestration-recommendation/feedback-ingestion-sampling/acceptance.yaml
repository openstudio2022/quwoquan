        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.feedback_ingestion_sampling.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
