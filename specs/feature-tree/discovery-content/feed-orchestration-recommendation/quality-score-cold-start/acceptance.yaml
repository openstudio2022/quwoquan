version: 2
node:
  id: quality-score-cold-start
  level: L3_story
  path: specs/feature-tree/discovery-content/feed-orchestration-recommendation/quality-score-cold-start
  title: quality score cold start
  parent_domain_service: discovery-content
  parent_business_capability: feed-orchestration-recommendation
scope:
  summary: 内容质量分和 recScore 投影驱动无行为内容冷启动。
  in_scope:
  - 内容质量分来源、异步投影、训练 item 特征字段、质量分覆盖率。
  - UGC、BulkImport 与数据工程 importer 同一投影公式。
  out_of_scope:
  - 同步质量模型 RPC、深度质量模型。
gwt_acceptance:
  GWT1:
    title: 内容质量分冷启动 GWT
    given:
    - 内容尚无用户行为样本，但已通过数据工程或 UGC 发布链路进入可推荐池。
    when:
    - 新用户或冷启动场景请求推荐 feed。
    then:
    - 内容按质量分、探索和多样性参与召回排序，不退化为纯时间流。
    done_when:
    - 质量分来源、投影字段、覆盖率指标和读路径零打分约束均落地。
    edge_cases:
    - 质量分缺失时使用保守默认值并进入缺失指标，不得伪造高分。
    contract_refs:
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    - quwoquan_service/contracts/metadata/content/post/storage.yaml
    performance_points:
    - quality_score_coverage >= 0.95
    - cold_start_non_empty_rate >= 0.999
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/internal/infrastructure/recommendation/projection_fields__local_contract_test.go
      - file: quwoquan_service/services/content-service/tests/local_contract/runtime/recommendation/quality_score_fusion__local_contract_test.go
      - file: quwoquan_service/services/content-service/cmd/import/mongo_import__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.quality_score_cold_start.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.quality_score_cold_start.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.discovery_content.feed_orchestration_recommendation.quality_score_cold_start.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - local_contract 已覆盖质量分投影、缺失保守默认、recScore 镜像、冷启动排序消费。
    - api_integration/user_acceptance 的线上覆盖率指标仍需 gamma 数据验证。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
