version: 2
node:
  id: quality-score-cold-start
  level: L3_story
  path: specs/feature-tree/discovery-content/feed-orchestration-recommendation/quality-score-cold-start
  title: quality score cold start
  parent_domain_service: discovery-content
  parent_business_capability: feed-orchestration-recommendation
scope:
  summary: 内容质量分和 recScore 投影驱动无行为内容冷启动。
  in_scope:
    - 内容质量分来源、异步投影、训练 item 特征字段、质量分覆盖率。
  out_of_scope:
    - 本轮不实现质量分作业、importer 或投影逻辑。
gwt_acceptance:
  GWT1:
    title: 内容质量分冷启动 GWT
    given:
      - 内容尚无用户行为样本，但已通过数据工程或 UGC 发布链路进入可推荐池。
    when:
      - 新用户或冷启动场景请求推荐 feed。
    then:
      - 内容按质量分、探索和多样性参与召回排序，不退化为纯时间流。
    done_when:
      - 质量分来源、投影字段、覆盖率指标和读路径零打分约束均冻结。
    edge_cases:
      - 质量分缺失时使用保守默认值并进入缺失指标，不得伪造高分。
    contract_refs:
      - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
      - quwoquan_service/contracts/metadata/content/post/storage.yaml
    performance_points:
      - quality_score_coverage >= 0.95
      - cold_start_non_empty_rate >= 0.999
    evidence:
      primary:
        - T1_contract
        - T2_module_interaction
      supporting:
        - T3_app_api_integration
    tests:
      planned:
        - quwoquan_service/services/content-service/tests/post_quality_score_projection_contract_test.go
        - quwoquan_service/runtime/recommendation/cold_start_quality_score_test.go
      recorded: []
    status: specified
execution:
  local_gate:
    - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
    - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
    - make gate
