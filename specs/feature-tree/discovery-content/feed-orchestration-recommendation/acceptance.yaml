version: 2
node:
  id: feed-orchestration-recommendation
  level: L2_business_capability
  path: specs/feature-tree/discovery-content/feed-orchestration-recommendation
  title: feed orchestration recommendation
  parent_domain_service: discovery-content
  parent_business_capability: feed-orchestration-recommendation
scope:
  summary: 发现流推荐编排的端云行为、流式体验、交集解释、曝光治理集成边界与推荐 SLO 基线。
  in_scope:
  - 首页 feed 首屏、翻页、刷新、续接、四态与推荐理由展示规格。
  - 端侧行为回流到推荐 HotPath/FeedbackRecorder 的契约与测试。
  - 交集理由同源消费、发现流多形态布局、关注对象列表与曝光/点击归因。
  - served/impressed 双轨、跨页去重、负反馈即时抑制和曝光健康 SLI 的集成边界；曝光治理策略所有权归属 `discovery-content/exposure-governance`。
  out_of_scope:
  - 深度排序模型平台轨（MMoE/PLE/ESMM、双塔 ANN、IPS）。
  - 协同过滤召回真实实现与离线物化作业。
  - Thompson Sampling、生命周期复活、Bloom/Cuckoo/Count-Min 等海量曝光基础设施实现。
sit_acceptance:
  SIT1:
    title: 首页推荐流端云编排 SIT
    story_refs:
    - discovery-content/feed-orchestration-recommendation/unified-items-cursor
    - discovery-content/feed-orchestration-recommendation/personalized-ranking
    - discovery-content/feed-orchestration-recommendation/personalized-ranking--ranking-signal-fusion
    - discovery-content/feed-orchestration-recommendation/realtime-feed-baseline
    - discovery-content/feed-orchestration-recommendation/feedback-ingestion-sampling
    done_when:
    - Feed 首屏、翻页、刷新与续接语义清晰，端侧只透传 cursor，不解析 token。
    - 首页频道按 metadata layout policy 呈现：关注单列、精品侵入式、推荐/校园/旅行/摄影手机双列发现流，文章/口碑/强交集解释可 full-span。
    - 同一个 PostBaseDto / ContentSurfaceView / IntersectionReason 支持单列、双列、侵入式和对象页承接，不新增第二套首页业务列表。
    - 交集模块从 feed intersectionReasons 或 tag-service shared-tags 同源派生，用户行动回流 intersectionDimension / intersectionTagRefs。
    - 关注频道登录后展示关注对象顶部列表，覆盖用户、圈子、地点和事物主页；上次访问后变化以红点提示，点击对象并进入主页后可消红点。
    - 行为上报（impression/click/dwell/like/favorite/share/dislike/report）可进入统一行为契约，强负反馈只影响未来窗口。
    - 端侧反馈经单一 BehaviorReporter 通道分级上报（强信号即时、弱信号采样合并），clientEventId 幂等、feedRequestId 归因闭环，不双通道重复上报。
    - 推荐 SLO/KPI 有真相源，至少覆盖 feed 延迟、空结果率、fallback 率、重复曝光率、CTR、停留、完成率与负反馈率。
    - 曝光记忆、动态曝光预算、生命周期复活和活跃度自适应只引用 exposure-governance 规格，不在本节点维护第二套规则。
    performance_points:
    - Feed P95 <= 200ms、P99 <= 400ms（模型超时可降级）。
    - 同 session 跨页重复率 < 1%；空 feed 率 < 0.1%。
    - 行为上报到 HotPath 生效延迟 < 100ms。
    evidence:
      primary:
      - T2_module_interaction
      - T3_app_api_integration
      supporting:
      - T1_static_contract
      - T4_e2e_journey
