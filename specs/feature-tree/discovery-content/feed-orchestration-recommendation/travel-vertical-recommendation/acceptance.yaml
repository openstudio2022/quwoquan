scope:
  summary: 旅行频道 vertical=travel_photography 的召回、排序、fallback 与观测契约。
  in_scope:
  - subCategory/type 归一为 travel_photography。
  - 旅行垂类过滤覆盖推荐召回与 repository fallback。
  - channelId/vertical/recallPath 分桶观测。
  out_of_scope:
  - 旅行专用深排模型。
  - 第二套旅行 feed API。
gwt_acceptance:
  GWT1:
    title: 旅行频道只返回合格旅行垂类内容
    given:
    - 用户请求首页旅行频道，系统存在旅行和非旅行内容。
    when:
    - content-service 调用推荐引擎并在召回不足时进入 fallback。
    then:
    - 推荐请求携带 Vertical=travel_photography，响应不混入非旅行内容。
    done_when:
    - 推荐召回、fallback 和交集理由通道均使用同一 channel/vertical 口径。
    edge_cases:
    - 协同召回和社交召回返回候选后仍按 vertical 过滤。
    contract_refs:
    - specs/feature-tree/discovery-content/feed-orchestration-recommendation/travel-vertical-recommendation/spec.md
    performance_points:
    - cold_start_non_empty_rate >= 0.999
    - repeat_exposure_rate < 0.01
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/internal/application/feed/feed_service_negative_fallback__local_contract_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.feed_orchestration_recommendation.travel_vertical_recommendation.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.discovery_content.feed_orchestration_recommendation.travel_vertical_recommendation.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - P0 已覆盖 FeedService 路由与 fallback vertical 过滤；gamma 行为分桶仍需联调验收。
