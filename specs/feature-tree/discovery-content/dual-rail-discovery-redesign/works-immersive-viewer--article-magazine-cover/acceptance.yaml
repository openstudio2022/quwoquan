version: 2
node:
  id: works-immersive-viewer--article-magazine-cover
  level: L3_story
  path: specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer--article-magazine-cover
  title: works immersive viewer  article magazine cover
  parent_domain_service: discovery-content
  parent_business_capability: dual-rail-discovery-redesign
scope:
  summary: Work Browser 文章深色纸张杂志阅读验收范围。
  in_scope:
  - 深色纸张主题系统
  - 更多菜单阅读设置
  - pageflip 纸张材质同源
  - Markdown 实体标签点击
  out_of_scope:
  - 独立文章详情页改版
  - 非默认浅色纸张偏好
gwt_acceptance:
  GWT1:
    title: 深色纸张主题默认与垂类适配
    given:
    - Work Browser 中存在文章作品，作品带有 contentVertical 或 articleRenderProfile.paperTexture。
    when:
    - 用户进入文章作品。
    then:
    - 文章默认不使用白纸。
    - 摄影/旅行/历史/科技/自然按规格映射为深色纸/暖黑纸/深棕纸/冷灰纸/墨绿纸。
    - 顶部仅返回与更多，底部工具栏与图片/视频一致。
    done_when:
    - widget 测试断言默认纸张与垂类映射。
    edge_cases:
    - 无垂类时回退深色纸。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/projections/work_browser_item.yaml
    - quwoquan_service/contracts/metadata/content/post/ui_config.yaml#article_dark_paper_themes
    performance_points: []
    evidence:
      primary:
      - T2_module_interaction
      supporting:
      - T1_contract
    tests:
      planned:
      - flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart
      recorded: []
    status: pending
  GWT2:
    title: 翻书动画纸张材质同源
    given:
    - 当前文章使用任一深色纸张主题。
    when:
    - 用户水平翻页。
    then:
    - 正面、背面、底页、阴影使用同一纸张 palette。
    - 不出现白色背面、白色底页或直接切页。
    done_when:
    - pageflip 视觉/contract 测试断言 paperTexture 被正反面消费。
    edge_cases:
    - 降级 pager 仍使用同一 paperTexture。
    contract_refs:
    - quwoquan_app/lib/ui/content/article_reader/pageflip/host/article_read_only_book_deck.dart
    performance_points: []
    evidence:
      primary:
      - T2_module_interaction
      supporting:
      - T1_contract
    tests:
      planned:
      - make verify-app-pageflip-back-mainline
      - flutter test test/ui/content/article_reader
      recorded: []
    status: pending
  GWT3:
    title: Markdown 实体标签进入实体主页
    given:
    - QWQ Rich Markdown 中包含实体标签，例如 `@[灵隐寺](entity:homepage/hp_lingyin)`。
    when:
    - 用户点击正文实体标签。
    then:
    - 标签以行内样式显示。
    - "点击进入 `AppRoutePaths.homepageDetail(id: 'hp_lingyin')`。"
    done_when:
    - codec 与 widget/navigation 测试通过。
    edge_cases:
    - 未知实体类型只显示文本，不导航。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/fields.yaml#entityRefs
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml#homepageDetail
    performance_points: []
    evidence:
      primary:
      - T1_contract
      - T2_module_interaction
      supporting: []
    tests:
      planned:
      - flutter test test/ui/content/markdown/article_markdown_codec_test.dart
      - flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart
      recorded: []
    status: pending
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
