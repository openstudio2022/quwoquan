        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded_command] cd quwoquan_app && flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart'
    - '[migrated_from_recorded_command] cd quwoquan_app && flutter test test/ui/content/post/contract/post_ui_config_contract_test.dart'
  GWT5:
    title: 具象化交集句作为推荐解释层
    given:
    - 当前作品契约下发 `IntersectionReason.primaryText/primarySpans`、target 与详情列表。
    when:
    - 用户查看默认态并点击底部具象化交集句或其中可导航片段。
    then:
    - 默认态只在底部工具栏最下方显示云侧具象化交集句；不显示 `N 个交集 >` 摘要作为主表达；内容层无交集 chip/卡片/浮层。
    - 点击可导航片段进入对应主页/列表；整句 fallback 弹出「为什么推荐给你」详情 sheet，详情项文案来自云侧投影。
    done_when:
    - widget 测试断言默认态具象化交集句、点击后详情/导航降级、内容层无交集元素。
    edge_cases:
    - 无交集数据时摘要行隐藏。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/projections/work_browser_item.yaml
    - quwoquan_service/contracts/metadata/recommendation/rec_model/projections/intersection_reason.yaml
    performance_points: []
    tests:
