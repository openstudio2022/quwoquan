version: 2
node:
  id: works-immersive-viewer
  level: L3_story
  path: specs/feature-tree/discovery-content/dual-rail-discovery-redesign/works-immersive-viewer
  title: works immersive viewer (Work Browser V1.0)
  parent_domain_service: discovery-content
  parent_business_capability: dual-rail-discovery-redesign
scope:
  summary: Work Browser V1.0 统一沉浸式作品浏览器验收范围。
  in_scope:
  - workBrowser 统一深链入口
  - 顶部系统层只保留返回/更多
  - 更多菜单媒体筛选（全部作品/图片/视频/文章）
  - 图片书物理翻页、视频集胶囊、文章页尾页码
  - 底部工具栏作者/关注/赞转评 + 具象化交集句
  - 交集详情 sheet（点击后出现）
  - WorkBrowserItemDto 强类型契约数据流
  - 文章深色纸张主题系统、阅读设置与实体标签跳转
  out_of_scope:
  - 保留旧深链兼容重定向
  - 评论 Drawer 改版
  - 收藏入口（V1.0 明确禁止）
gwt_acceptance:
  GWT1:
    title: 统一作品导航与顶部系统层
    given:
    - 用户从任一入口进入 Work Browser，队列中含图片、视频、文章三类作品。
    when:
    - 用户垂直滑动切换作品，并在三类媒体之间穿越。
    then:
    - 每次垂直滑动精确切换一个完整作品；滑到底触发加载下一页。
    - 顶部始终只有返回与更多；不出现媒体类型标识、页码、常驻筛选 Tab。
    - 三类媒体的顶部系统层与底部工具栏结构、位置一致，无「换浏览器」感。
    done_when:
    - widget 测试断言顶部无 works-format-tab-strip、无 works-top-progress-label。
    edge_cases:
    - 边缘 15px 不响应水平拖拽。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml#workBrowser
    performance_points: []
    tests:
      planned:
      - command: flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded_command] cd quwoquan_app && flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart'
  GWT2:
    title: 旧内容深链入口收敛到 workBrowser
    given:
    - metadata 中 `workBrowser` 是内容消费唯一深链路由。
    - post link template 的 navigation route_id 指向 `workBrowser`，参数绑定为 `postId -> workId`。
    when:
    - 执行 app metadata codegen 并扫描 App 路由、UI 调用点与测试桩。
    then:
    - '`AppRoutePaths` 仅生成 `workBrowser`，不再生成 `articleDetail`、`mediaViewer`、`videoViewer`。'
    - '`app_router.dart` 只注册 `/works/browser/{workId}` 内容消费入口；无 extra 时按 workId 拉取作品定位队列，有
      extra 时复用同一 Work Browser 壳。'
    - 发现、搜索、圈子、个人主页、评论回原帖入口均调用 `AppRoutePaths.workBrowser(...)`。
    done_when:
    - metadata/codegen/router/UI/test 中无旧三入口残留。
    edge_cases:
    - 单帖搜索结果可通过 `workId` 定位作品。
    - 圈子与个人主页传入的队列上下文仍保持互动状态回写。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml#workBrowser
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml#entities.post.navigation
    performance_points: []
    tests:
      planned:
      - command: make codegen-app
      - command: make -C quwoquan_service verify-metadata
      - command: flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.contract
        envs: *id001
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded] go run ./tools/codegen_app_metadata --metadata-dir
      contracts/metadata --app-dir ../quwoquan_app --integration-service-dir ./services/integration-service
      --rtc-service-dir ./services/rtc-service --chat-service-dir ./services/chat-service
      --user-service-dir ./services/user-service'
    - '[migrated_from_recorded] flutter analyze --no-fatal-warnings --no-fatal-infos
      <modified workBrowser route files>'
    - '[migrated_from_recorded_command] make -C quwoquan_service verify-metadata'
    - '[migrated_from_recorded_command] python3 quwoquan_app/scripts/runtime/verify_metadata_routes_vs_codegen_app.py'
    - '[migrated_from_recorded_command] flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart'
    - '[migrated_from_recorded_command] flutter test test/ui/circle/pages/home_circles_hub_page_test.dart
      test/ui/circle/widgets/section_widgets_test.dart test/ui/circle/circle_content_identity_widget_test.dart'
    - '[migrated_from_recorded_command] flutter test test/app/navigation/native_back_navigation_policy_test.dart'
    - '[migrated_from_recorded_command] bash agent_ops/scaffold/verify_acceptance_standard.sh'
    - '[migrated_from_recorded_command] bash agent_ops/scaffold/verify_feature_tree_refactor.sh'
  GWT3:
    title: 三类媒体内部导航状态信息与图片书体验
    given:
    - 队列中存在 8 图作品、4 集视频作品、6 页文章作品。
    when:
    - 用户在各作品内部水平滑动。
    then:
    - 图片作品使用 `components/media/image/book/ImageBookCanvas` 与 `components/media/shared/pageflip/MediaPageFlipBook` 形成物理翻书体验，不回退为 rubber-band PageView 主体验。
    - 图片作品横滑按住时出现同源动态翻页层，正面、背面、底页三面材质齐备，翻页边界与折线可见，背面不得采样黑屏、空纹理或 loading 模糊材质。
    - 图片书前翻绑定为 `recto=current.front / verso=next.back / bottom=next.front`，后翻绑定为 `recto=prev.front / verso=prev.back / bottom=current.front`；back 必须是独立暗淡背面纹理，不得复用 front。
    - 横图、竖图、极端比例图统一 rasterize 成同一书页 logicalSize，图片自然尺寸只影响 cover 裁剪，不改变翻页几何。
    - 图片加载中只作为静态等待态；active 翻页中如图片尚未解码或加载失败，必须输出同尺寸 failure front/back page surface，表达“图片未正确加载”的状态而非黑屏、跳页或 loading 模糊页。
    - 图片作品在内容下方、标题上方显示点状页态，最多 6 点且明确当前位置；单图无指示器。
    - 视频作品显示自绘极简控制行（播放态/当前时间/进度/总时长）与 `视频集 · n/m ↔` 胶囊（时间轴下、标题上）；无点状指示器；单视频无胶囊；无平台默认控制层。
    - 文章作品使用深色纸张阅读，页码 `n / m` 位于正文后、作者栏前，chevron 可切页；顶部无页码。
    - 文章默认不使用白纸，翻页正面、背面、底页共用同一纸张 palette。
    done_when:
    - local_contract 覆盖 `MediaPageFlipBook` 全屏左滑 0→1、右滑 1→0、前翻/后翻 held dynamic layer 三面 face binding、斜向拖拽 rotation 与同尺寸，且 `ImageBookCanvas` 会同步当前图片页码。
    - local_contract 覆盖 `ImageBookPageSurfaceFactory` 横图、竖图、loading、failure 四类输入均输出同尺寸非空 front/back page surface，且 back 亮度低于 front；同时覆盖 `ImageBookCanvas` active texture builder 不返回 loading 材质。
    - widget 测试覆盖 Work Browser 图片书组件接入、首图 held curl 与翻到下一张、末图继续左滑不退出、三类媒体导航状态信息位置与上限断言。
    - pageflip 测试覆盖文章深色纸张正反面材质同源。
    edge_cases:
    - 8 图作品只渲染 6 点，以首尾淡化表达更多。
    - 图片滑到首末边界后，内容区横滑只触发图片书 overflow，不误触发主 tab/沉浸页退出。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/projections/work_browser_item.yaml
    performance_points: []
    tests:
      planned:
      - command: flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/components/media/image/book/image_book_canvas_widget__local_contract_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.gwt3_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.discovery_content.dual_rail_discovery_redesign.works_immersive_viewer.contract
        envs: *id001
    notes:
    - '[recorded_command] cd quwoquan_app && flutter analyze lib/components/media/shared/pageflip/media_page_flip_book.dart lib/components/media/image/book/image_book_canvas.dart test/local_contract/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart test/local_contract/components/media/image/book/image_book_canvas_widget__local_contract_test.dart test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart'
    - '[recorded_command] cd quwoquan_app && flutter test --no-pub test/local_contract/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart test/local_contract/components/media/image/book/image_book_canvas_widget__local_contract_test.dart test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart'
    - '[recorded_command] python3 quwoquan_app/scripts/content/verify_pageflip_backward_mainline.py'
    - '[recorded_command] make verify-app-pageflip-back-mainline'
    - '[recorded_command] python3 quwoquan_app/scripts/content/verify_content_ui_directory_boundaries.py'
    - '[recorded_command] cd quwoquan_app && flutter test test/local_contract/components/media/shared/pageflip/media_page_flip_book_widget__local_contract_test.dart test/local_contract/components/media/image/book/image_book_canvas_widget__local_contract_test.dart'
    - '[recorded_command] cd quwoquan_app && flutter test test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart'
  GWT4:
    title: 媒体筛选进入更多菜单
    given:
