scope:
  summary: MediaAsset processing/ready/rejected/deleted 状态机、ready descriptor 与重试守卫。
  in_scope:
  - 聚合跃迁、幂等结果回写、ready/rejected 不变量。
  out_of_scope:
  - 页面发布结果回流。
gwt_acceptance:
  GWT1:
    title: MediaAsset 只以有效处理结果离开 processing
    given:
    - MediaAsset 处于 processing 并带有权威私有源对象。
    when:
    - worker 回写 ready 或 rejected 结果，或重复投递相同事实。
    then:
    - 合法 descriptor 进入 ready，内容性失败进入 rejected，重复事实对终态 no-op。
    done_when:
    - 缺主 slice、封面、尺寸、时长或 H.264/AAC/fast-start 约束的 ready 结果被拒绝。
    - 基础设施失败不改变聚合状态。
    edge_cases:
    - 终态资产重复收到 ready/rejected 结果。
    - deleted 资产收到滞后 outbox 事实。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/media_asset/fields.yaml
