version: 2
node:
  id: media-failure-recovery--recovery-and-rollback-policy
  level: L3_story
  path: specs/feature-tree/discovery-content/media-processing-helper-read/media-failure-recovery--recovery-and-rollback-policy
  title: media failure recovery  recovery and rollback policy
  parent_domain_service: discovery-content
  parent_business_capability: media-processing-helper-read
scope:
  summary: Worker checkpoint 与 poison event 恢复、版本化派生物、回滚安全和审计观测。
  in_scope:
  - checkpoint、重放、dead letter、health、Prometheus 指标与告警。
  out_of_scope:
  - 独立媒体服务部署。
gwt_acceptance:
  GWT1:
    title: Worker 故障与回滚不丢事件、不破坏已发布媒体
    given:
    - outbox 存在待处理事实且 Worker 使用持久 checkpoint。
    when:
    - checkpoint 保存失败、Worker 重启、损坏 outbox 事实或发布版本回滚。
    then:
    - 正常事实可重放，损坏且带 cursor 的事实会被幂等隔离，派生物按版本保留，已发布 Post
      继续可读。
    done_when:
    - 故障注入证明首次 checkpoint 失败后第二次处理成功。
    - poison event 只记录 source identity、cursor 与原因，不记录原始 payload；成功隔离后
      后续事实继续处理，隔离写入失败时 checkpoint 不推进。
    - health、jobs（按 media_type/input_size_class/result）、处理时长、complete-to-ready、
      outbox oldest-event age、DLQ 准入年龄、扫描批量、连续满批和 poison event 有自动化断言。
    - 回滚流程不把 processing 强改 ready，不删除已发布版本 slice。
    edge_cases:
    - Worker 空闲时没有新事实。
    - 连续满批但单个 job 均成功。
    - poison event 缺少 eventId 或 checkpoint，不能安全隔离。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/observability.yaml
    - quwoquan_ops/observability/monitoring/alerts/quwoquan_alerts.yaml
    performance_points:
    - 最近成功扫描超过 15 分钟时 health 不健康。
    tests:
      planned:
      - file: quwoquan_service/services/content-service/internal/application/media/processing/worker__functional__local_contract_test.go
      - file: quwoquan_service/services/content-service/tests/api_integration/media_processing_checkpoint__data_consistency__api_integration_test.go
      - file: quwoquan_service/services/content-service/tests/local_contract/media/media_processing_worker__reliability__local_contract_test.go
      recorded: []
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: media_processing_checkpoint
        cases:
        - api_integration.content.media.checkpoint_failure_replay
        envs: [beta, gamma]
        test_object: workflow
        quality_facet: reliability
      - layer: local_contract
        execution_profile: baseline
        suite: media_processing_observability
        cases:
        - local_contract.content.media.worker_health_and_metrics
        - local_contract.content.media.worker_poison_event_isolation
        envs: [local]
        test_object: observability_collector
        quality_facet: observability
      supporting: []
    notes: []
execution:
