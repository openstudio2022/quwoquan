version: 2
node:
  id: image-delivery-variants
  level: L3_story
  path: specs/feature-tree/discovery-content/media-processing-helper-read/image-delivery-variants
  title: image delivery variants
  parent_domain_service: discovery-content
  parent_business_capability: media-processing-helper-read
scope:
  summary: 单一 MediaAsset 图片交付 descriptor、唯一 CDN variant policy、原图授权和可回滚 reprocess 闭环。
  in_scope:
  - MediaAsset 的 ImageDeliveryDescriptor、derivativePolicyVersion、CDN profile 与历史资产 reprocess。
  - ImageVariantPolicy metadata/codegen、Data materializer、Dart resolver 和 Image 读侧。
  - Post 可见性驱动的原图授权、403/429 限流和对应审计事实。
  - alpha/beta/gamma/prod 非 dry-run 图片端到端证据。
  out_of_scope:
  - 编辑算法、滤镜目录、用户配方、滤镜使用事实、视频 ABR。
gwt_acceptance:
  GWT1:
    title: 图片只有在完整交付 descriptor 可验证后才能 ready
    given:
    - 已完成的图片 MediaUploadSession 产生 processing MediaAsset 和耐久 outbox 事实。
    when:
    - processor 真实解码、方向归一、执行像素/尺寸守卫、写入 normalized baseline 并绑定 ImageDeliveryDescriptor。
    then:
    - ready 资产拥有 processingVersion、derivativePolicyVersion、公共 slice、尺寸、MIME、dominantColor、lqip 与 contentProfile。
    done_when:
    - 损坏、超限、descriptor 缺字段或 CDN baseline 不可读全部进入 rejected 或保持 processing 重试，不能发布。
    - thumbnail/display/cover/full 不创建独立 MediaAsset、独立 Store 或独立生命周期。
    - 真实 PNG/JPEG 经 FFmpegMediaProcessor、Mongo、对象存储和 public reader 的 descriptor 一致。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/media_asset/entity.yaml
    - quwoquan_service/contracts/metadata/content/media_asset/fields.yaml
    - quwoquan_service/contracts/metadata/content/media_asset/service.yaml
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/internal/domain/media/model/media_processing_version__local_contract_test.go
      - file: quwoquan_service/services/content-service/internal/application/media/processing/worker__functional__local_contract_test.go
      - file: quwoquan_service/services/content-service/tests/api_integration/media_processing_worker__data_consistency__api_integration_test.go
      - file: quwoquan_service/services/content-service/tests/api_integration/media_processing_pipeline__data_consistency__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: image_delivery_descriptor
        cases:
        - local_contract.content.media.image_descriptor_requires_policy_and_generated_metadata
        - local_contract.content.media.image_rejects_incomplete_or_unreadable_delivery
        envs: [local]
        test_object: domain_rule
        quality_facet: contract
      - layer: api_integration
        execution_profile: integration
        suite: image_delivery_processing
        cases:
        - api_integration.content.media.png_jpeg_to_ready_delivery_descriptor
        - api_integration.content.media.image_processing_rejects_invalid_input
        envs: [beta, gamma]
        test_object: workflow
        quality_facet: data_consistency
      supporting: []
    notes: []

  GWT2:
    title: 所有消费者只使用 metadata 生成的图片 profile
    given:
    - active ImageVariantPolicy 声明 thumbnail/display/cover/full 的 policy version。
    when:
    - App、Data 与 Service 解析同一 MediaAsset image descriptor。
    then:
    - 三侧得到相同 profile 尺寸、格式、质量和 URL 参数；业务代码不存在默认 400/750、Python profile 常量或 Post 目录副本。
    done_when:
    - 读取页只经 generated ImageUrlResolver/AppImage 消费 display profile，沉浸页只消费 full profile。
    - policy 变更先生成新 processingVersion 并完成可读验证，失败时保持旧 descriptor。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/media_asset/image_variant_policy.yaml
    - quwoquan_data/scripts/core/media_asset_url.py
    - quwoquan_app/lib/cloud/media/cdn_image_url_builder.dart
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/media/content_image_variant_policy__local_contract_test.dart
      - file: quwoquan_data/tests/local_contract/source/test_media_asset_url__behavior__functional__local_contract_test.py
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: image_variant_policy_codegen
        cases:
        - local_contract.content.media.profile_single_source_generated_to_service_app_data
        - local_contract.content.media.no_handwritten_profile_or_url_fallback
        envs: [local]
        test_object: metadata
        quality_facet: contract
      supporting: []
    notes:
    - 2026-07-21：metadata 生成 Service/App/Data 单一 profile，移除了 Post 目录策略与 App 默认 400/750；策略版本化 reprocess 仍由 GWT4 验收。

  GWT3:
    title: 原图访问按 Post 可见性授权并可靠限流
    given:
    - ready 图片被 public、followers 或 private Post 引用，且访问者身份各不相同。
    when:
    - 访问者请求 view 或 save 原图授权。
    then:
    - 同时满足内容可见性和 accessPolicy 的请求获得短时 grant；非可见者稳定得到 403；超过窗口稳定得到 429。
    done_when:
    - 授权服务经 Post named visibility reader，不以 ViewerID 伪装 owner 查询。
    - grant/rejection/ratelimit 仅追加 MediaOriginalAccessFact 与安全指标，不泄露原图 URL 或图片字节。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/media_original_access_fact/service.yaml
    - quwoquan_service/contracts/metadata/content/media_original_access_fact/fields.yaml
    - quwoquan_service/contracts/metadata/content/media_original_access_fact/original_access_policy.yaml
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/media/media_aggregates__local_contract_test.go
      - file: quwoquan_service/services/content-service/internal/application/post/media_visibility_reader__local_contract_test.go
      - file: quwoquan_service/services/content-service/tests/api_integration/post_markdown_contract__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: original_access_visibility
        cases:
        - api_integration.content.media.original_access_grant_for_visible_post
        - api_integration.content.media.original_access_denied_for_nonviewer
        - api_integration.content.media.original_access_rate_limited
        envs: [beta, gamma]
        test_object: workflow
        quality_facet: security
      supporting: []
    notes:
    - 2026-07-21：原图授权已改为 Post named visibility reader + asset policy + 由 metadata 生成的 viewer/media/purpose 限流；granted、denied、rate_limited 均落同一审计事实，拒绝事实不含原图 URL。gamma Remote 页面与四环境证据仍由 GWT5 收口。

  GWT4:
    title: 策略升级与历史资产重处理可停止、恢复和回滚
    given:
    - 已存在不同 processingVersion 的 ready 图片以及待升级的 ImageVariantPolicy。
    when:
    - reprocess worker 分批处理历史资产，或在验证失败时停止 activation。
    then:
    - 每个资产仅在新 descriptor 完整、可读且与 policy 匹配时原子切换；失败、暂停和回滚继续提供旧 slice。
    done_when:
    - cursor、idempotency、旧新 descriptor、清理候选和 rollback target 都可审计。
    - 不直接覆写 ready descriptor、不删除仍被 Post 引用的旧 slice、不以 aggregate version 重解释 processingVersion。
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/internal/domain/media/model/media_processing_version__local_contract_test.go
    status: pending
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: image_variant_reprocess
        cases:
        - api_integration.content.media.policy_upgrade_generates_new_processing_version
        - api_integration.content.media.reprocess_failure_preserves_previous_ready_descriptor
        - api_integration.content.media.rollback_preserves_readability
        envs: [gamma]
        test_object: workflow
        quality_facet: reliability
      supporting: []
    notes: []

  GWT5:
    title: 图片四环境设备矩阵以真实 Remote 主线闭环
    given:
    - 同 release/config hash 的 beta Android/iOS、gamma remote 和 prod gray 环境可用。
    when:
    - 用户选图、编辑、上传、等待 ready、发布、在第二账号查看并请求原图。
    then:
    - 每个必选环境都有非 dry-run serviceEvidence 与 uiEvidence，包含 mediaId/postId、descriptor、profile load、授权结局和回滚结论。
    done_when:
    - alpha 只作为同构工程证据；beta Android 与 iOS、gamma 与 prod gray-initial/carry-on/full 任一缺失均保持 GATE_BLOCK。
    - 报告符合 image-end-to-end-commercial-matrix 的统一 schema，禁止用 mock、fixture、路径存在性或 dry-run 代替。
    tests:
      planned: []
      recorded:
      - file: quwoquan_ops/tests/acceptance/user_acceptance/service_ops/content-service/smoke/run_media_publication_lifecycle_probe.py
    status: pending
    test_evidence:
      primary:
      - layer: user_acceptance
        execution_profile: integration
        suite: content_image_delivery_device_matrix
        cases:
        - user_acceptance.content.image.upload_publish_display_original_access
        envs: [beta]
        test_object: workflow
        quality_facet: availability
      - layer: user_acceptance
        execution_profile: release
        suite: content_image_delivery_remote_release
        cases:
        - user_acceptance.content.image.upload_publish_display_original_access
        envs: [gamma_local, prod]
        test_object: workflow
        quality_facet: availability
      supporting: []
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate-runtime-media
