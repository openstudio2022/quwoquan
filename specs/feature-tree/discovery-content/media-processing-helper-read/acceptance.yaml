version: 2
node:
  id: media-processing-helper-read
  level: L2_business_capability
  path: specs/feature-tree/discovery-content/media-processing-helper-read
  title: media processing helper read
  parent_domain_service: discovery-content
  parent_business_capability: media-processing-helper-read
scope:
  summary: 图片/视频从上传完成事实到 ready/rejected 终态、归一化公开切片与可预览读取的商用闭环。
  in_scope:
  - MediaAsset 状态机、outbox worker、checkpoint、FFmpeg/FFprobe、对象存储派生物、健康与指标。
  - 真实 MinIO + MongoDB + FFmpeg 的数据一致性证据。
  out_of_scope:
  - 文章摘要生成由 helper-read-summary 独立 Story 验收。
  - HLS/DASH ABR 在 feature flag 关闭时不属于首发交付。
sit_acceptance:
  SIT1:
    title: 图片/视频媒体处理、恢复与读取能力 SIT
    story_refs:
    - media-processing-helper-read/media-status-pipeline
    - media-processing-helper-read/media-failure-recovery
    - media-processing-helper-read/image-delivery-variants
    done_when:
    - completed 上传产生耐久事实，worker 以 checkpoint 至少一次消费并把资产推进到 ready 或 rejected。
    - 图片只有在真实解码、像素/尺寸守卫和归一化成功后才 ready，公开 slice 从 normalized object 物化，不复制原始上传字节。
    - 图片 ready descriptor 必须绑定 processingVersion 与 derivativePolicyVersion；thumbnail/display/cover/full
      由同一 ImageVariantPolicy 的 CDN profile 派生，不创建第二个 MediaAsset 或手写 App/Data profile。
    - 原图授权同时验证 Post 可见性和 asset policy；非可见访问为 403、超限为 429，且不泄露
      原图 URL 或图片内容。
    - 带音轨视频完成 H.264/AAC 归一，无音轨视频注入 AAC 静音轨；二者均满足 fast-start 与关键帧约束。
    - 非媒体字节稳定进入 rejected，不生成可发布 slice。
    - checkpoint 保存失败可重放，重复事实不重复处理已终态资产。
    - ready descriptor 的 processingVersion 与可变 aggregate version 分离；视频封面或访问策略
      后续变更后，原有 versioned public slice 仍可恢复、读取和校验。
    - 有有效 checkpoint 的损坏事实先以 consumer/event 幂等方式持久化到 dead letter，
      成功后才推进 checkpoint；死信写入失败时不得跳过该事实。
    - Worker 健康、单任务耗时、结果、扫描批量、连续满批和 poison event 可被 Prometheus
      与 health endpoint 读取。
    performance_points:
    - 单个 2 秒样例视频在本地集成环境 30 秒内进入终态。
    - Worker 空闲扫描间隔 2 秒，批量上限 10，连续满批 15 分钟触发积压告警。
    - 50 MiB、最长 1 小时视频的 job P95 在 840 秒内；poison event 与 dead-letter 写入失败均有
      critical 告警。
    tests:
      planned:
