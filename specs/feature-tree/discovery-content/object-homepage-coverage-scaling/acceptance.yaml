scope:
  summary: 实体主页从双省 20K 发现候选、12K source-ready 唯一对象、H10K 冻结目标到真实生产、环境发布与 App 消费的验收范围。
  in_scope:
  - 区县、实体类型与来源 coverage cell 及 checkpoint。
  - 浙江、四川各至少 6,000 个 source-ready 唯一对象，以及各 5,000 个不可替换 H10K 冻结目标。
  - execution-owned encyclopedia-primary 来源资格核验与逐图权利闭包。
  - Mongo+Redis ReliableTask、Cursor SDK author/reviewer、权威成本、对象事务与 accepted throughput。
  - Canary、H200、H1000、M3、H10K immutable release、Gamma 导入、API、App UAT、回滚与重放。
  out_of_scope:
  - 两省以外的本轮实跑。
sit_acceptance:
  SIT1:
    title: 省级实体主页端到端 SIT
    story_refs:
    - zhejiang-sichuan-province-coverage
    done_when:
    - coverage cell 的终态、失败与截断可审计，资源上限不冒充饱和。
    - 原始发现候选不少于 20,000，去重且 source-ready 唯一对象不少于 12,000；H10K 每省冻结 5,000 且失败不得替换。
    - 静态主清单只保存稳定身份与分类，不保存来源 URL、来源资格或运行期证据。
    - 每个 execution 包含 plan、sources、五阶段对象树、evidence 与 publish_ref。
    - approved 对象只经对象事务进入 canonical publish，release 环境中立且 create-once。
    - H10K 在 24 小时内达到至少 416.67 accepted homepage/h，Gamma 导入、API、App UAT、回滚与重放证据写入对应 env run。
    performance_points:
    - H200、H1000、H10K 记录每小时 accepted homepage、P50/P95 单对象耗时、首过率、queue lag 与 unitPassedCost。
