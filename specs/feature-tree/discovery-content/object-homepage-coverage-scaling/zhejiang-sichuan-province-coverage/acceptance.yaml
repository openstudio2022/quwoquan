        envs: [gamma]
      supporting: []
    notes: []
  GWT4:
    title: H200、H1000、M3 与 H10K 两省扩量
    given:
    - 双省金丝雀 release 的 immutable Gamma closure 已通过复验。
    when:
    - 使用同一 recipe、source digest、模型与 CLI 依次执行 H200、H1000、M3、H10K。
    then:
    - H200/H1000 的每个选中 coverage cell 必须对应 approved execution；任一 blocked 对象必须先修复来源、权利或流程问题，不能被替换后计入该档成功。
    - M3 的每个浙江/四川 coverage cell 必须对应 approved execution；任一 blocked、abandoned 或未归因对象都阻断最终 release。
    - aggregate release 聚合 approved execution manifest，不建立 campaign 运行根。
    - 每档创建前必须复验前一档 rollout_milestone_closure；H10K 累计集合精确等于每省 5,000 个冻结对象及其 master digest。
    - H10K release 精确包含 10,000 unique entities 及其实际引用的 creator/media/tag/rights 闭包。
    - H10K 的 accepted throughput 不低于 416.67/h，且在 24 小时内完成 canonical、immutable release 与 Gamma 查询闭包。
    - 每档使用 full-sync release，回滚上一 immutable release 后 replay 当前 release。
    done_when:
    - H10K 两省覆盖 release 通过 verify two-province-coverage-release 与 rollout attestation 复验。
    edge_cases:
    - 外部限流或来源失败只阻断对应 execution，不计为覆盖成功。
    contract_refs:
    - quwoquan_data/scripts/verify/verify_two_province_coverage_release.py
    - quwoquan_data/verticals/travel/cold_start_supply_policy.yaml
    - quwoquan_data/schema/governance/cold_start_supply_policy.schema.json
    performance_points:
    - 放量前 Cursor SDK soak 必须满足 rollout capacity 合同，且不得冒充主页 accepted-content throughput。
    - H200/H1000/H10K 的真实 approved homepage 吞吐与对象 P95 必须满足同一 rollout capacity 合同。
    tests:
      planned:
      - file: quwoquan_data/tests/api_integration/release/test_release_first_ship__behavior__functional__api_integration_test.py
      recorded:
      - file: quwoquan_data/tests/api_integration/release/test_release_first_ship__behavior__functional__api_integration_test.py
    status: pending
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: two_province_full_release
        cases:
        - api_integration.discovery_content.object_homepage_coverage_scaling.zhejiang_sichuan_province_coverage.gwt4.full_release
        envs: [gamma]
      supporting: []
    notes: []
  GWT5:
    title: H10K Gamma 消费、动态 App 用户旅程与 H100K 外推
    given:
    - H10K release 已冻结，10,000 entities 的引用闭包、权威成本和 digest 已通过验证。
    when:
    - 用户从标签页和搜索进入浙江、四川实体主页。
    then:
    - 正文、封面、标签与来源信息正确渲染，错误态可恢复，关键行为有 trace。
    - H200、H1000、M3、H10K 按最多 100 实体一片执行 UAT 分片，每档 App 只构建一次。
    - Alpha 对同 digest 执行 mock/contract 投影；Beta 执行真实 full-sync、API、幂等与回滚。
    - Gamma 执行全量 API、100 个 H10K 主页分片及 feed、搜索、article/image/video 消费旅程。
    - 100,000/日只依据 H10K p50/p95、首过率、unitPassedCost、source-ready capacity、queue lag 与 24h soak 外推 4,166.67/h，并保留至少 20% 容量余量。
    - Prod 仅在显式确认和审批证据齐全时按 gray-initial、carry-on、full 三阶段灰度，并可回滚上一 release。
    - 冷启动 feed 至少 20 条，非空率不低于 0.999，重复曝光率低于 0.01，端云 trace 完整。
    done_when:
    - Gamma 动态 UAT 与 rollback/replay 证据通过；H100K 输出诚实 GO/NO_GO，Prod 未获批准前保持 NO_GO。
    edge_cases:
    - 未导入实体返回统一 404 语义与空态。
    contract_refs:
    - quwoquan_service/contracts/metadata/entity/homepage/service.yaml
    performance_points:
    - 10,000 实体 homepage API P95 不超过 300ms，可用性不低于 99.5%。
    tests:
      planned:
      - file: quwoquan_app/test/user_acceptance/pages/entity/homepage_detail/homepage_detail_page__user_acceptance_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/entity/homepage_introduction/homepage_introduction_page__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: user_acceptance
        execution_profile: release
        suite: two_province_gamma_local
        cases:
        - user_acceptance.discovery_content.object_homepage_coverage_scaling.zhejiang_sichuan_province_coverage.gwt5.gamma_local
        envs: [gamma_local, prod]
      supporting:
      - layer: local_contract
        execution_profile: smoke
        suite: two_province_alpha_projection
        cases:
        - local_contract.discovery_content.object_homepage_coverage_scaling.zhejiang_sichuan_province_coverage.gwt5.alpha_projection
        envs: [alpha]
      - layer: api_integration
        execution_profile: integration
        suite: two_province_environment_promotion
        cases:
        - api_integration.discovery_content.object_homepage_coverage_scaling.zhejiang_sichuan_province_coverage.gwt5.promotion
        envs: [beta, gamma]
      - layer: api_integration
        execution_profile: release
        suite: two_province_prod_promotion
        cases:
        - api_integration.discovery_content.object_homepage_coverage_scaling.zhejiang_sichuan_province_coverage.gwt5.prod_promotion
        envs: [prod]
    notes: []
