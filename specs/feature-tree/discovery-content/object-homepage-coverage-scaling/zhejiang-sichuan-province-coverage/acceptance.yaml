      - layer: local_contract
        execution_profile: baseline
        suite: execution_contract
        cases:
        - local_contract.discovery_content.object_homepage_coverage_scaling.zhejiang_sichuan_province_coverage.gwt1.execution
        envs: [local]
      supporting: []
    notes:
    - '2026-07-19: `python3 quwoquan_data/scripts/cli.py task preflight --json`, `python3 quwoquan_data/scripts/cli.py verify all` and the complete `make gate` passed. The preflight used only the external 0600 Cursor key file and proved the local SDK startup probe; no execution, release, or environment promotion is implied by this local closure.'
  GWT2:
    title: 12K 唯一候选、正文来源与逐图权利准入
    given:
    - 浙江、四川覆盖主清单通过 schema 与语义门。
    when:
    - 选择实体并构建 source unit、对象本地 source catalog 与图片候选。
    then:
    - discovery 候选至少 20,000 个，按旅行对象类型、城市/区县与 canonical identity 去重后保留至少 12,000 个唯一对象。
    - 浙江、四川各至少 6,000 个对象通过 source-ready 预筛，正文仅使用 Wikipedia、百度百科、今日头条百科闭集。
    - 冻结每省 5,000 个对象后不得用替换对象掩盖失败，短缺保持 NO_GO。
    - 图片逐项具有原始落地页、作者、license/authorization、用途、无水印和内容匹配结论。
    - 普陀山 17 个页面图位与东钱湖 5 个页面图位均无数量截断；尺寸参数不进入图注。
    - cover、inline、related 三类处置互斥，groupMember 只进入相关图片。
    done_when:
    - 12K 候选漏斗、每省 5K 冻结目标和金丝雀 source/rights/selection 证据完整。
    edge_cases:
    - 网络、来源或权利不确定时对象保持 blocked，不伪造 URL。
    contract_refs:
    - quwoquan_data/schema/governance/master_list.schema.json
    - quwoquan_data/verticals/travel/rights/license_policy.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_data/tests/local_contract/governance/test_coverage_matrix__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/execution/test_execution_source_qualification__behavior__functional__local_contract_test.py
      - file: quwoquan_data/tests/local_contract/governance/test_image_rights_asset_level__behavior__functional__local_contract_test.py
