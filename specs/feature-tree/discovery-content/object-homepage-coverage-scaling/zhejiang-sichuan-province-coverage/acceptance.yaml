        suite: coverage_source_rights
        cases:
        - local_contract.discovery_content.object_homepage_coverage_scaling.zhejiang_sichuan_province_coverage.gwt2.source_rights
        envs: [local]
      supporting: []
    notes: []
  GWT3:
    title: 浙江与四川双金丝雀 release 准出
    given:
    - GWT1、GWT2 全绿且浙江选出普陀山、东钱湖，四川选出海螺沟。
    when:
    - 两条 homepage execution 顺序执行五阶段并完成 canonical promotion；随后以 canary 里程碑执行三载体 cold-start execution，为三个金丝雀实体各生成 article/image/video 一篇。
    - 主页与 9 篇 posts 聚合进同一个 aggregate canary release。
    then:
    - 正文由 Cursor SDK 生成，独立 review approved，canonical/release 引用闭包。
    - canary cold-start 以主页先行为前置：金丝雀主页未 canonical 时三载体 execution 必须 GATE_BLOCK。
    - canary release 的 post 闭包必须精确等于金丝雀实体数 × 三载体（9 篇），content mix 逐载体核验。
    - reviewer response 与绑定 provider/model/modelFamily/runId 的 canonical reviewer result 使用不同 schema；同源 run、同模型族或无 findings 不得 approved。
    - object transaction audit、apply、rollback 与 replay 可复验。
    - Gamma 导入、API 核验、动态 App UAT、回滚与重放必须写入 immutable rollout_milestone_closure；下一档只复验该 release 闭包。
    done_when:
    - 三个实体与 9 篇三载体 posts 均出现在同一 canary release，homepage media completeness 与 release gate 全绿。
    edge_cases:
    - 任一省失败时不得形成双省成功 release。
    contract_refs:
    - quwoquan_data/schema/release/release_manifest.schema.json
    - quwoquan_data/schema/release/object_transaction_package.schema.json
    - quwoquan_data/schema/release/rollout_milestone_closure.schema.json
    - quwoquan_data/scripts/verify/verify_homepage_media_completeness.py
    performance_points: []
    tests:
