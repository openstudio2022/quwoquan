  GWT5:
    title: 统一展示——review 在 ContentSurfaceView 上 contentType 分支呈现
    given:
    - 一条 review 内容进入 feed/detail/immersive/share 任一 surface。
    when:
    - 经 ContentSurfaceViewMapper 投影为 ContentSurfaceView。
    then:
    - review 评分/POI 摘要经 contentType==review 分支呈现，四 surface 口径一致。
    - 不拆表、不新增第二套 model；分支用契约字段判别（非 is/as）。
    done_when:
    - local_contract 投影契约 + local_contract 四 surface 同源断言通过。
    edge_cases:
