    title: 召回与交集——review 进召回通道且交集归因可还原
    given:
    - review 含 entityRefs/tagRefs。
    when:
    - 进入推荐召回与交集理由生成。
    then:
    - review 出现在召回结果；POI/标签维度的 IntersectionReason 可还原。
    done_when:
    - 召回与交集归因集成测试覆盖。
