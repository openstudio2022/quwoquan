version: 2
node:
  id: unified-presentation-model
  level: L3_story
  path: specs/feature-tree/discovery-content/content-type-framework/unified-presentation-model
  title: unified presentation model
  parent_domain_service: discovery-content
  parent_business_capability: content-type-framework
scope:
  summary: 收敛端侧 feed/detail/immersive/share 四套并行内容展示模型为单一只读 ContentSurfaceView + ContentSurfaceViewMapper，全量硬切、删除旧投影与迁移 flag。
  in_scope:
  - 单一只读 presentation model ContentSurfaceView（micro/image/video/article 四媒体类型）
  - 单一映射器 ContentSurfaceViewMapper（含 fromArticleDetailPayload 富渲染桥接）
  - feed / detail / immersive / share 四 surface 统一消费 ContentSurfaceView
  - 删除旧投影类 PostSummaryView / projectPostMap / _shareSeedForPost 与 unified_surface_view flag
  out_of_scope:
  - 发布/编辑写链路与持久化字段（仅读侧收敛）
  - 口碑 review 类型接入（随 B1 选型，以 contentType 分支无痛接入）
  - pageflip 受控文件 article_read_only_book_deck.dart 的几何
gwt_acceptance:
  GWT1:
    title: 四 surface 统一消费单一 ContentSurfaceView，无第二套展示模型
    given:
    - 同一内容 DTO 进入 feed / detail / immersive / share 任一 surface。
    when:
    - surface 通过 ContentSurfaceViewMapper 投影为 ContentSurfaceView 并渲染。
    then:
    - 四 surface 对同一 DTO 的同字段呈现一致，均来自单一 mapper。
    - 不存在 PostSummaryView / projectPostMap / _shareSeedForPost 等并行投影路径。
    done_when:
    - 四 surface 全量硬切完成，T1 投影契约全绿，app 门禁 [gate] OK。
    edge_cases:
    - article 富渲染（pages/document）经 surfaceView.article 消费，pageflip 几何不变。
    - 无来源/空字段时只读降级，不抛异常。
    contract_refs: []
    performance_points: []
    evidence:
      primary:
      - T1_contract
      - T2_module_interaction
      supporting: []
    tests:
      planned: []
      recorded:
      - quwoquan_app/test/ui/content/post/contract/post_view_projection_contract_test.dart
      - quwoquan_app/test/ui/discovery/home_page_widget_test.dart
      - quwoquan_app/test/ui/discovery/widgets/works_immersive_viewer_widget_test.dart
    status: done
  GWT2:
    title: 硬切收尾——旧投影类与迁移 flag 删除，无双读共存
    given:
    - 四 surface 已切到 ContentSurfaceView。
    when:
    - 扫描端侧内容展示路径与 feature flag。
    then:
    - PostSummaryView / projectPostMap / _shareSeedForPost / unified_surface_view flag 均已删除。
    - 无 @Deprecated 共存路径、无双读分支；旧 wire 行序列化方法已统一命名为 toWireMap。
    done_when:
    - retired_terms / dart_semantic / mock_isolation 门禁绿，app 门禁无 FAIL/BLOCK。
    edge_cases: []
    contract_refs: []
    performance_points: []
    evidence:
      primary:
      - T1_contract
      supporting: []
    tests:
      planned: []
      recorded:
      - quwoquan_app/test/ui/content/post/contract/post_view_projection_contract_test.dart
    status: done
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
