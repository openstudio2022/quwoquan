version: 2
node:
  id: creation-tagging-ia
  level: L3_story
  path: specs/feature-tree/discovery-content/content-type-framework/creation-tagging-ia
  title: creation tagging IA
  parent_domain_service: discovery-content
  parent_business_capability: content-type-framework
scope:
  summary: 冻结创作侧打标 IA：各类型编辑页内联打标区，打标全类型可选、不强制，由自动打标（转发识别+内容识别）辅助，手动 UI 作确认/修正层。常用标签和搜索结果来自 tag-service serving projection，tagRefs 经 CreatePost 注入，使「打标→content.tagRefs→交集归因」可还原。
  in_scope:
  - 各类型编辑页内联打标区（图文/视频），打标可选不拦截发布
  - 自动打标建议 suggestedTagRefs 消费 + 可编辑/可删除芯片（确认/修正层）
  - 交互形态：tag-service 常用标签 + 自动建议多选 ≤5；搜索入口由 flag 控制
  - 端侧不维护标签 catalog 或首发子集
  - tagRefs 经 CreatePost/UpdatePost writable_fields 注入（已通）
  out_of_scope:
  - 自动打标模型/管线（转发识别、内容识别）实现（属 ML/数据工程）
  - taxonomy 治理与发布导入（属数据工程与 tag-service）
  - 标签运营后台/治理
  - pageflip 受控文件
gwt_acceptance:
  GWT1:
    title: 各类型编辑页内联打标区，打标可选不拦截发布
    given:
    - 用户在图文/视频编辑页创作。
    when:
    - 未选任何标签直接发布。
    then:
    - 发布成功，不因缺标签被拦截；打标区为可选内联区域。
    done_when:
    - 各类型编辑页打标可选路径 widget 测试通过。
    edge_cases:
    - 自动建议拉取超时时只显首发子集芯片，不阻断发布。
    contract_refs: []
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
