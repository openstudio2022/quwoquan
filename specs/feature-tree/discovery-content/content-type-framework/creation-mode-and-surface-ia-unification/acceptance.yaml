version: 2
node:
  id: creation-mode-and-surface-ia-unification
  level: L3_story
  path: specs/feature-tree/discovery-content/content-type-framework/creation-mode-and-surface-ia-unification
  title: creation mode and surface ia unification
  parent_domain_service: discovery-content
  parent_business_capability: content-type-framework
scope:
  summary: 创作入口与媒体编辑器 IA 收敛验收；本轮补充小红书式创作动作、社交动作保留、照片/视频入口、旧相机兼容与顶栏草稿保存状态。
  in_scope:
  - 创作首层三动作菜单、社交动作保留与媒体编辑器双编辑器心智。
  - 照片入口、视频入口、旧相机兼容和图片/视频真实结果分流。
  - 图片路径承载一键成片、图片编辑与图片创作三段一致性；视频路径不暴露一键成片。
  - 编辑器顶栏草稿入口、保存状态、本地草稿页、自动保存、继续编辑与清稿时机统一。
  out_of_scope:
  - 重做图片编辑器内部工具。
  - 新增外部分享 SDK。
  - 新增 metadata 字段。
gwt_acceptance:
  GWT1:
    title: 加号入口保留创作与社交动作并按真实媒体结果分流
    given:
    - 用户从底栏或发现页全局 `+` 打开创作入口。
    - 设备相册和相机权限可用，且相册内同时存在图片和视频。
    when:
    - 用户查看入口 sheet，并分别点击“发布照片”“发布视频”“写文字”以及三条社交动作。
    - 用户在照片或视频入口中选择/拍摄图片或视频。
    then:
    - 移动端入口显示 `发布照片`、`发布视频`、`写文字`、`添加联系人`、`发起群聊`、`创建圈子` 与 `取消`。
    - "`发布照片` 副文案固定为 `从相册选照片或拍照`。"
    - "`发布视频` 副文案固定为 `从相册选视频或拍视频`。"
    - 入口不显示发布/互动分组标题、图标、旧宫格、社交入口缩写或草稿行。
    - "`/create?type=gallery` 打开图片选择器，允许从相册选照片或拍照，返回图片编辑状态。"
    - "`/create?type=video` 打开视频选择器，允许从相册选视频或拍视频，返回视频编辑状态。"
    - "`/create?type=capture` 仅作为旧相机/深链兼容入口，默认拍照且同页可切到录像；拍照返回图片编辑状态，录像返回视频编辑状态。"
    - "`/create?type=write` 直接进入文字为主编辑器。"
    - 相册/相机取消且编辑器无内容时关闭创作页回到来源页。
    - 图片 entry mode 下，相册选择器和拍摄页只表达图片发布；选择页底部为 `一键成片` 与 `下一步(n)`，右上提供 `草稿箱`，不展示 `拍视频` 或录像语义。
    - 图片 flow 的创作页顶栏标题为“图片创作”，并使用主导航标题语义，不在首屏淡化。
    - 图片选择器已选缩略条、图片编辑器缩略条与创作页图片网格共用统一拖拽重排行为：内容不足一屏时左对齐，拖拽悬停时目标区间兄弟项即时前移/后移空出目标位。
    - 图片 entry mode 下，`一键成片` 至少选中 2 张图片才可用；点击后进入一键成片页，完成后进入图片创作页并锁定为单素材。
    - 图片 entry mode 下，点击 `下一步(n)` 进入图片编辑页；图片编辑页底部工具栏下方提供蓝色 `下一步`，点击后进入图片创作页，图片顺序和编辑后路径在选择页、编辑页、创作页三者间保持一致。
    - 视频 entry mode 下，选择页复用图片选择页的深色三列宫格，第 1 格为 `拍视频`，其余格仅展示视频资源；不展示 `一键成片`，不复用图片路径的 `一键成片` / `下一步(n)` 按钮语义。
    - 图片与视频互斥，切换类型前必须删空当前媒体，不存在图片和视频混合发布草稿。
    done_when:
    - "用户只需要在入口选择开始动作，系统能根据真实媒体结果进入图片或视频编辑状态，且发布 payload 的 `contentType` 与最终媒体类型一致。"
    edge_cases:
    - 从旧草稿恢复时，根据草稿媒体类型进入正确子流程。
    - 从相机拍照回填后进入图片 entry mode，录像回填后进入视频 entry mode。
    - 旧图片/视频专用深链仍保持 photoOnly / videoOnly 专用模式，不被全局可切相机影响。
    contract_refs:
    - specs/feature-tree/discovery-content/publish-comment-reaction/post-create-update/spec.md
    - quwoquan_app/lib/components/media/picker/create_media_picker_page.dart
    - quwoquan_app/lib/components/media/camera/camera_capture_page.dart
    performance_points:
    - 入口到媒体工具可交互 warm P95 <= 1.2s。
