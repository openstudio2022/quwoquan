version: 2
node:
  id: commercial-message-system
  level: L2_business_capability
  path: specs/feature-tree/chat-conversation/commercial-message-system
  title: 消息体系商用重构
  parent_domain_service: chat-conversation
  parent_business_capability: commercial-message-system
scope:
  summary: 以商用发布为目标，验证消息页、联系页、群主页、交集、通知和真实云端数据的一致性。
  in_scope:
  - 消息模块内的独立消息页与联系页 IA。
  - 消息页全部/未读/群聊/私聊/通知筛选。
  - 联系页全部/互关/圈子/群聊筛选。
  - Entity/Circle/Group/Conversation/Contact/Intersection/Notification 对象边界。
  - 群头像云端预合成、点击群进聊天、聊天信息页群主页能力入口。
  - 商用路径 Remote-only 与真实服务 read model。
  out_of_scope:
  - 新增底栏入口。
  - 端到端加密。
  - 群对象拉黑。
  - 旧 Mock/Prototype 数据继续作为生产能力。
sit_acceptance:
  SIT1:
    title: 消息与联系双首页 IA 成立
    story_refs:
    - message-home-commercial-ia
    - contact-home-commercial-ia
    done_when:
    - 底栏仍为首页/精品/添加/消息/我，消息模块内可进入独立消息页和联系页状态。
    - 两页顶部不放内联搜索框，统一使用顶部工具栏搜索按钮入口。
    - 小趣入口和底部导航保持现有视觉主线。
    - 旧消息二级筛选 @我/@小趣/提醒 不再作为商用首页主 IA。
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_page_widget__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit1.sit1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit1.sit1_local_contract
        envs: *id001
      - layer: user_acceptance
        suite: device_journey
        cases:
        - user_acceptance.chat_conversation.commercial_message_system.sit1.device_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/chat/journeys/commercial_message_system_journey_test.dart'
  SIT2:
    title: 消息首页五类筛选由真实收件箱与通知 inbox 驱动
    story_refs:
    - message-home-filter-contract
    done_when:
    - 全部、未读、群聊、私聊筛选来自 ChatInbox 或 MessageHomeProjection。
    - 通知筛选来自 notification-service/app-message 持久 inbox，不靠标题或摘要猜测。
    - 小趣发现新圈子/新群聊作为 AppMessage 或 assistant insight 类型通知行展示，支持已读或 dismiss 状态。
    - 列表只展示头像、标题、摘要、时间和头像右上未读数。
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_page_widget__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit2_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit2.sit2_local_contract
        envs: *id001
      - layer: api_integration
        suite: sit2_api_integration
        cases:
        - api_integration.chat_conversation.commercial_message_system.sit2.sit2_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: sit2_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit2.sit2_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/chat-service/tests/message_home_projection_contract_test.go'
    - '[migrated_from_planned] quwoquan_service/services/notification-service/tests/app_message_inbox_contract_test.go'
    - '[migrated_from_planned] quwoquan_app/test/ui/chat/models/chat_inbox_filter_test.dart'
  SIT3:
    title: 联系首页聚合真实关系、圈子、群和交集
    story_refs:
    - contact-home-relationship-projection
    done_when:
    - 全部混排用户和群，按最近互动时间倒序。
    - 互关只包含 mutual 用户，超过 20 人显示 A-Z 索引，小于等于 20 人不显示。
    - 圈子 tab 只展示圈子列表，点击进入圈子联系人页。
    - 群聊 tab 只展示已加入群，不展示聊天内容或公告。
    - 交集摘要最多展示 2 个具体交集点，不出现 N 个交集。
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/chat/providers/chat_contacts_rows_provider__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit3_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit3.sit3_local_contract
        envs: *id001
      - layer: api_integration
        suite: sit3_api_integration
        cases:
        - api_integration.chat_conversation.commercial_message_system.sit3.sit3_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: sit3_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit3.sit3_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/chat-service/tests/api_integration/contact_home_projection_contract__api_integration_test.go'
    - '[migrated_from_planned] quwoquan_app/test/ui/chat/widgets/contact_home_widget_test.dart'
  SIT4:
    title: 群聊天和聊天信息页使用同一 GroupHome 真相源
    story_refs:
    - group-home-chat-info-contract
    done_when:
    - 消息列表点击群直接进入聊天页，不先进入群主页。
    - 群聊天页顶部展示群名称、来源实体、来源圈子和成员数。
    - 右上角进入聊天信息页，展示群信息、群公告、相册/文件/活动/成员四宫格入口。
    - 成员、管理员、转让群主、退出/解散等治理能力继续可用。
    - 群头像只消费云端预合成 avatarUrl，不触发端侧成员九宫格 fallback。
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/components/avatar/conversation_avatar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_settings_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/journeys/chat/chat_group_management_journey__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit4_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit4.sit4_local_contract
        envs: *id001
      - layer: api_integration
        suite: sit4_api_integration
        cases:
        - api_integration.chat_conversation.commercial_message_system.sit4.sit4_api_integration
        envs: *id002
      supporting:
      - layer: user_acceptance
        suite: device_journey
        cases:
        - user_acceptance.chat_conversation.commercial_message_system.sit4.device_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_service/services/chat-service/tests/group_home_contract_test.go'
  SIT5:
    title: 商用路径无 Mock、占位和本地业务拼接
    story_refs:
    - commercial-remote-only-message-system
    done_when:
    - 生产包默认 Remote，无 Mock/Remote 切换入口。
    - App UI/Provider 不从 MockChatRepository、MockIntersectionRepository、MockAppMessageRepository
      或 PrototypeBundle 拼业务列表。
    - 服务端生产配置不允许 mock-user、memory store、noop resolver、baseURL 为空返回空。
    - App 不消费 Circle.conversationId 和 ChatInbox.avatarCompositeUrls 作为商用主渲染。
    performance_points: []
    tests:
      planned:
      - command: make verify-app-mock-isolation
      - command: make verify-app-seed-manifest
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit5_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.sit5.sit5_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: sit5_api_integration
        cases:
        - api_integration.chat_conversation.commercial_message_system.sit5.sit5_api_integration
        envs: *id002
    notes:
    - '[migrated_from_planned] quwoquan_service/services/chat-service/tests/commercial_config_contract_test.go'
    - '[migrated_from_planned] quwoquan_service/services/notification-service/tests/commercial_storage_contract_test.go'
contract_acceptance:
  CONTRACT1:
    title: metadata/codegen/Remote DTO 与商用消息体系一致
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml
    - quwoquan_service/contracts/metadata/messages/conversation/fields.yaml
    - quwoquan_service/contracts/metadata/notification/notification/service.yaml
    - quwoquan_service/contracts/metadata/social/circle/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage/service.yaml
    done_when:
    - MessageHome、ContactHome、GroupHome、IntersectionSummary、AppMessage 均有 metadata
      真相源。
    - App RemoteRepository 只使用 codegen path/operation/surface/header。
    - MockRepository 仅作为 alpha/test fixture，并与 Remote 返回同结构 DTO。
    - 真实服务 contract 测试使用真实测试数据库，不 mock 存储层。
    tests:
      planned:
      - command: make -C quwoquan_service verify-metadata
      - command: make codegen-app
      - file: quwoquan_app/test/local_contract/cloud/chat/contract/chat_repository_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/content/intersection_repository_contract__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract1_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.contract1.contract1_local_contract
        envs: *id001
      - layer: api_integration
        suite: contract1_api_integration
        cases:
        - api_integration.chat_conversation.commercial_message_system.contract1.contract1_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: contract1_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.contract1.contract1_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/cloud/notification/app_message_repository_contract_test.dart'
