version: 2
node:
  id: contact-home-relationship-projection
  level: L3_story
  path: specs/feature-tree/chat-conversation/commercial-message-system/contact-home-relationship-projection
  title: 联系首页关系聚合投影
  parent_domain_service: chat-conversation
  parent_business_capability: commercial-message-system
scope:
  summary: 让联系首页各类筛选、关系聚合与交集摘要都由真实 read model 提供。
  journey_scenarios:
  - commercial-message-system
  out_of_scope:
  - 消息首页通知筛选
gwt_acceptance:
  GWT1:
    title: 联系首页关系、圈子、群和交集由真实聚合驱动
    given:
    - 用户已存在互关、圈子成员和群成员等关系数据。
    when:
    - 用户查看全部、互关、圈子、群聊筛选。
    then:
    - 联系首页按真实关系聚合展示，不由 UI 或 Provider 本地拼接业务事实。
    - 交集摘要最多展示 2 个具体交集点，不出现泛化数量文案。
    done_when:
    - 联系首页的各类关系视图都可映射到真实 projection 和交集契约。
    edge_cases:
    - 互关人数不超过 20 时不显示 A-Z 索引。
    - 只有圈子或只有群关系时仍可稳定渲染对应筛选。
    platform_variants:
      iOS: []
      Android: []
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml
    - quwoquan_app/lib/cloud/runtime/generated/recommendation/intersection_reason.g.dart
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/chat/providers/chat_contacts_rows_provider__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.contact_home_relationship_projection.gwt1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.chat_conversation.commercial_message_system.contact_home_relationship_projection.gwt1_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.chat_conversation.commercial_message_system.contact_home_relationship_projection.gwt1_local_contract
        envs: *id001
    notes:
