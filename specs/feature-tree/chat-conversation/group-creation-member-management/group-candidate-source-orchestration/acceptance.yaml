version: 2
node:
  id: group-candidate-source-orchestration
  level: L3_story
  path: specs/feature-tree/chat-conversation/group-creation-member-management/group-candidate-source-orchestration
  title: 建群候选来源编排
  parent_domain_service: chat-conversation
  parent_business_capability: group-creation-member-management
scope:
  summary: 建群/加人候选来源（互关联系人、既有群、圈子）由云侧统一编排，端侧只消费 typed 候选行。
  in_scope:
  - ListGroupCandidates / ListSelectableGroupConversations / ListSelectableGroupContactMembers 契约
  - 互关过滤、已在群锁定、friendMemberCount 云侧计算
  out_of_scope:
  - 入群申请/扫码进群（JoinRequest 对象链独立工作包）
gwt_acceptance:
  GWT1:
    title: 候选来源互关过滤与已在群锁定
    given:
    - 当前用户存在互关联系人、非互关联系人与已加入群聊。
    when:
    - 打开建群向导或加人模式请求候选来源。
    then:
    - 候选只含互关联系人；加人模式下已在群成员被锁定；可选群列表只含 friendMemberCount>0 的群。
    done_when:
    - Mock 与 Remote 候选行为一致且有端云证据。
    edge_cases:
    - 无互关联系人时候选为空且页面呈现空态。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml#ListGroupCandidates
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml#ListSelectableGroupConversations
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml#ListSelectableGroupContactMembers
    performance_points: []
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/chat-service/tests/api_integration/selectable_group_contract__api_integration_test.go
      - quwoquan_service/services/chat-service/tests/api_integration/social_contacts_contract__api_integration_test.go
      - quwoquan_app/test/local_contract/ui/chat/providers/start_group_from_group_provider__local_contract_test.dart
      - quwoquan_app/test/user_acceptance/pages/chat/start_group_chat/start_group_chat_page__user_acceptance_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: selectable_group_contract
        cases:
        - api_integration.chat.selectable_group.mutual_filter_and_member_exclusion
        envs:
        - beta
      - layer: local_contract
        execution_profile: baseline
        suite: start_group_member_wizard
        cases:
        - local_contract.chat_conversation.group_creation_member_management.group_candidate_source_orchestration.wizard_dedupe
        envs:
        - local
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: start_group_chat_page
        cases:
        - user_acceptance.chat.start_group_chat.candidate_sources_journey
        envs:
        - gamma_local
    notes:
    - 2026-07-20 建档：功能先行实现（图四/图五流程），本次补齐 story 归属并回填既有测试证据。
execution:
