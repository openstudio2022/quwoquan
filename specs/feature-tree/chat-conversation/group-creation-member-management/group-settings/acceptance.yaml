version: 2
node:
  id: group-settings
  level: L3_story
  path: specs/feature-tree/chat-conversation/group-creation-member-management/group-settings
  title: group settings
  parent_domain_service: chat-conversation
  parent_business_capability: group-creation-member-management
scope:
  summary: 群设置与治理：治理开关权威对象链（nameEditableByAdminOnly）、群公告权威化（公告即触达）、用户级 mute/pin 与治理设置分离。
  in_scope:
  - UpdateGroupGovernanceSettings（owner/admin）写 Conversation 权威字段并被 UpdateConversationTitle 授权消费
  - UpdateAnnouncement（owner/admin）写权威公告并经 system_announcement 消息触达全员
  - GetConversation / GroupHome 回读真实治理开关与公告（消灭硬编码空串假实现）
  - 用户级 mute/pin 走 ConversationUserState.UpdateConversationSettings，与群治理单轨分离
  out_of_scope:
  - 扫码进群 / 进群审批开关（JoinRequest 对象链落地后随对象链恢复，不留假开关）
gwt_acceptance:
  GWT1:
    title: 治理开关与群公告权威对象链
    given:
    - 活跃群聊，owner/admin 与普通成员各一。
    when:
    - owner 开启 nameEditableByAdminOnly；owner/admin 发布群公告；普通成员尝试同样操作。
    then:
    - 开关持久化并可回读；开启后普通成员改名被拒、owner 放行。
    - 公告写入 Conversation 权威字段，GroupHome 回读一致，会话内出现 system_announcement 消息；普通成员发布被拒。
    done_when:
    - 读写对称（无投影有字段而命令无入口的假功能）且三层证据齐备。
    edge_cases:
    - 公告一致 no-op 不重复触达；设置一致 no-op 不递增 roster revision。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml#UpdateGroupGovernanceSettings
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml#UpdateAnnouncement
    - quwoquan_service/contracts/metadata/messages/conversation/projections/chat_group_settings_client.yaml
    - quwoquan_service/contracts/metadata/messages/conversation/projections/group_home.yaml
    performance_points: []
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/chat-service/tests/api_integration/group_announcement_governance__contract__api_integration_test.go
      - quwoquan_app/test/local_contract/ui/chat/widgets/group_manage_page_widget__local_contract_test.dart
      - quwoquan_app/test/local_contract/ui/chat/widgets/chat_settings_page_widget__local_contract_test.dart
      - quwoquan_app/test/user_acceptance/pages/chat/chat_manage/chat_manage_page__user_acceptance_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: group_announcement_governance
        cases:
        - api_integration.chat.governance.name_edit_restriction_roundtrip
        - api_integration.chat.governance.announcement_publish_and_reach
        - api_integration.chat.governance.regular_member_rejected
        envs:
        - beta
      - layer: local_contract
        execution_profile: baseline
        suite: group_manage_page
        cases:
        - local_contract.chat_conversation.group_creation_member_management.group_settings.governance_switch_optimistic
        - local_contract.chat_conversation.group_creation_member_management.group_settings.name_admin_only_hint
        envs:
        - local
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: chat_manage_page
        cases:
        - user_acceptance.chat.manage.governance_settings_journey
        envs:
        - gamma_local
    notes:
    - 2026-07-20 群聊商用化阶段 0/1：治理开关从「读投影恒默认值、写被静默丢弃」的假实现收口为权威字段 + 专属命令；群公告从硬编码空串收口为权威字段 + UpdateAnnouncement + 公告即触达；扫码进群/审批/隐私盾假开关下线。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
