version: 2
node:
  id: group-creation-member-management
  level: L2_business_capability
  path: specs/feature-tree/chat-conversation/group-creation-member-management
  title: group creation member management
  parent_domain_service: chat-conversation
  parent_business_capability: group-creation-member-management
scope:
  summary: 私建群创建、后续成员增删、角色治理与群设置在同一 Conversation/ConversationMembership 聚合边界内形成可商用闭环。
  in_scope:
  - 三来源选人、原子建群、成员添加/移除/主动退出
  - owner/admin/member 权限矩阵、群主转让、管理员与公告设置
  - 1000 user 成员上限、relationship gate、结构化错误与 Inbox 回流
  out_of_scope:
  - 圈子与 CircleGroup 自身生命周期
  - 企业组织通讯录、邀请链接与二维码入群
sit_acceptance:
  SIT1:
    title: 群创建与成员治理能力 SIT
    story_refs:
    - group-create-flow
    - member-add-remove-policy
    - group-settings
    done_when:
    - 三来源候选只经 chat-service 权威 Reader 输出，App 不自行拼装 Inbox、Circle 和关系数据。
    - CreateConversation/AddMembers/RemoveMember/LeaveConversation/TransferOwnership 权限与生命周期组合可验证。
    - 创建或治理成功后 Conversation、Membership、GroupHome/Inbox 投影与 outbox 一致，失败无部分提交。
    - beta/gamma API 与 gamma_local UAT 均有可重复执行证据；prod 只执行只读与受控 smoke。
    performance_points:
    - 列表与治理 query P95 小于 500ms，command P95 小于 500ms。
    - 候选源无逐群 N+1，1000 人群成员读取使用分页或受控上限。
    tests:
      planned:
      - quwoquan_service/services/chat-service/tests/api_integration/selectable_group_contract__api_integration_test.go
      - quwoquan_service/services/chat-service/tests/api_integration/group_governance_authorization__security__api_integration_test.go
      - quwoquan_service/services/chat-service/tests/api_integration/conversation_error_contract__api_integration_test.go
      - quwoquan_app/test/local_contract/ui/chat/widgets/start_group_chat_page_widget__local_contract_test.dart
      - quwoquan_app/test/user_acceptance/journeys/chat/chat_group_create_journey__user_acceptance_test.dart
      - quwoquan_app/test/user_acceptance/journeys/chat/chat_group_management_journey__user_acceptance_test.dart
      recorded:
      - quwoquan_service/services/chat-service/tests/api_integration/selectable_group_contract__api_integration_test.go
      - quwoquan_service/services/chat-service/tests/api_integration/group_governance_authorization__security__api_integration_test.go
      - quwoquan_service/services/chat-service/tests/api_integration/conversation_error_contract__api_integration_test.go
      - quwoquan_app/test/local_contract/ui/chat/providers/start_group_from_group_provider__local_contract_test.dart
      - quwoquan_app/test/local_contract/ui/chat/widgets/start_group_chat_page_widget__local_contract_test.dart
      - quwoquan_app/test/user_acceptance/journeys/chat/chat_group_create_journey__user_acceptance_test.dart
      - quwoquan_app/test/user_acceptance/journeys/chat/chat_group_management_journey__user_acceptance_test.dart
      - quwoquan_ops/tests/acceptance/user_acceptance/service_ops/chat-service/smoke/run_chat_group_lifecycle_probe.py
