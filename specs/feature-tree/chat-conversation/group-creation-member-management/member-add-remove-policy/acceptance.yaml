version: 2
node:
  id: member-add-remove-policy
  level: L3_story
  path: specs/feature-tree/chat-conversation/group-creation-member-management/member-add-remove-policy
  title: member add remove policy
  parent_domain_service: chat-conversation
  parent_business_capability: group-creation-member-management
scope:
  summary: 群成员进出治理策略：加人授权与关系 gate、移出角色矩阵、自愿退群语义、解散终态。
  in_scope:
  - AddMembers 操作者须为活跃成员；新成员互关/拉黑 gate（圈子绑定群跳过）；上限 group_full
  - RemoveMember 仅 owner/admin；owner 不可被移出；admin 仅可移出普通成员；禁止 self-remove
  - LeaveConversation 自愿退群（owner 须先转让 group_owner_must_transfer_before_leave）
  - dissolved 终态下成员命令返回 conversation_dissolved
  out_of_scope:
  - 入群申请/审批与扫码进群（JoinRequest 对象链独立工作包）
  - 群禁言
gwt_acceptance:
  GWT1:
    title: 成员治理授权矩阵与生命周期
    given:
    - 存在含 owner/admin/member 三种角色的活跃群聊。
    when:
    - 各角色分别发起加人、移出、退群、解散后的成员命令。
    then:
    - 非成员加人被拒（not_found 信息隐藏）；非互关/拉黑目标被拒；超限返回 group_full。
    - 普通成员移出他人被拒；owner 不可被移出；admin 不可移出 admin；self-remove 被引导走退群。
    - 成员退群成功且 roster 收敛；owner 退群返回须先转让；解散后成员命令返回 conversation_dissolved。
    done_when:
    - metadata ownership_policy 由服务端强制执行且三层证据齐备。
    edge_cases:
    - 重复退群 / 重复加人 no-op 幂等重放。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation_membership/service.yaml#AddMembers
    - quwoquan_service/contracts/metadata/messages/conversation_membership/service.yaml#RemoveMember
    - quwoquan_service/contracts/metadata/messages/conversation_membership/service.yaml#LeaveConversation
    - quwoquan_service/contracts/metadata/messages/conversation/errors.yaml
    performance_points: []
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/chat-service/tests/api_integration/group_governance_authorization__security__api_integration_test.go
      - quwoquan_service/services/chat-service/tests/api_integration/member_management_contract__api_integration_test.go
      - quwoquan_app/test/local_contract/ui/chat/widgets/chat_settings_page_widget__local_contract_test.dart
      - quwoquan_app/test/local_contract/ui/chat/chat_member_roster_consistency__local_contract_test.dart
      - quwoquan_app/test/user_acceptance/journeys/chat/chat_group_management_journey__user_acceptance_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: group_governance_authorization
        cases:
        - api_integration.chat.membership.non_member_add_rejected
        - api_integration.chat.membership.remove_role_matrix_enforced
        - api_integration.chat.membership.leave_owner_must_transfer
        - api_integration.chat.membership.dissolved_commands_rejected
        envs:
        - beta
      - layer: local_contract
        execution_profile: baseline
        suite: chat_settings_governance
        cases:
        - local_contract.chat_conversation.group_creation_member_management.member_add_remove_policy.remove_entry_role_gate
        - local_contract.chat_conversation.group_creation_member_management.member_add_remove_policy.leave_uses_leave_conversation
        envs:
        - local
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: chat_group_management_journey
        cases:
        - user_acceptance.chat.group_management.member_governance_journey
        envs:
        - gamma_local
    notes:
    - 2026-07-20 群聊商用化阶段 0：云侧补齐成员级授权（此前任何登录用户可移出任意成员）、新增 LeaveConversation 自愿退群语义并原子切换 App 退群路径、ConversationDissolved 事件与 dissolved 单轨状态。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
