version: 2
node:
  id: media-infrastructure--sfu-deployment-contract
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/media-infrastructure--sfu-deployment-contract
  title: LiveKit TURN deployment contract
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: LiveKit/TURN 受控制品、真实媒体、容量、弱网、QoE readback 与 prod gray 回滚合同。
  in_scope:
  - Room/token/TURN/32 人容量
  - Gamma-local 设备媒体与 prod-hosted gray_initial
  - QoE series、告警与回滚 receipt
  out_of_scope:
  - 录制媒体管道、本期 E2EE、fake media 准出
gwt_acceptance:
  GWT1_runtime_and_release_evidence:
    title: 真实运行制品与 QoE 证据满足四环境准出
    given:
    - rtc-service、LiveKit、coturn、realtime-gateway 与观测栈按环境拓扑装配。
    when:
    - 执行 Beta API、Gamma 设备/弱网、Prod gray canary 与回滚演练。
    then:
    - artifact/config digest、Room/token、TURN、32 人边界、重连、三项 QoE 指标与告警回执可追踪。
    done_when:
    - Alpha/Beta/Gamma/Prod 各自证据完整，且真实触发→通知→恢复→回滚链通过。
    edge_cases:
    - 缺 Secret、不可达 SFU、TURN-only、网络切换、容量超限、QoE series 缺失均 fail-closed。
    contract_refs:
    - rtc/call_session/aggregate.yaml#livekit_integration
    - rtc/call_session/service.yaml
    - ops/event_record/event_catalog.yaml#rtc_media_qoe
    performance_points:
    - command P95 遵 metadata；媒体接通率/P95/中断率必须来自真实 QoE readback。
    tests:
      planned:
      recorded:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/room_management_contract__api_integration_test.go
      - file: quwoquan_app/test/local_contract/core/rtc_media_qoe_emission__observability__local_contract_test.dart
      - file: quwoquan_ops/tests/local_contract/test_rtc_media_qoe_observability__observability_reliability__local_contract_test.py
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: sfu_runtime_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.sfu.runtime
        envs:
        - beta
        - gamma
      - layer: user_acceptance
        execution_profile: release
        suite: sfu_runtime_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.sfu.runtime
        envs:
        - gamma_local
        - prod
        rollout_stages:
        - gray_initial
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: sfu_runtime_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.sfu.runtime
        envs:
        - local
    notes:
    - Gamma full workload 仍因受控 product telemetry SLS Secret 缺失而 fail-closed。
    - 现有 room/reconnect 文件不能证明容量、QoE 或 prod gray，故保持 partial。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
