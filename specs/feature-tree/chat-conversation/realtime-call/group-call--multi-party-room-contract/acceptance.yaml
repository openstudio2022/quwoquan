version: 2
node:
  id: group-call--multi-party-room-contract
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/group-call--multi-party-room-contract
  title: multi party room contract
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: CallSession owned participants 的 Invite/Join/Leave、32 人边界、幂等与事件合同。
  in_scope:
  - participantCount/maxParticipants
  - inviteStatus/participant status
  - last_leave 与 participant realtime events
  out_of_scope:
  - 链接入会、独立 participant resource、页面视觉
gwt_acceptance:
  GWT1_owned_participant_consistency:
    title: 多人参与者集合与事件保持一致
    given:
    - CallSession 未结束且当前 actor 是合法参与者。
    when:
    - actor 邀请成员，成员加入/离开，或并发命令命中人数上限。
    then:
    - owned participants、participantCount、inviteStatus、receipt/outbox 与 realtime payload 一致。
    done_when:
    - 32/33 人、重复 join/leave、最后一人离开和越权负例全部有真实 store 证据。
    edge_cases:
    - 同一 invitee 并发邀请不重复；已结束通话不新增 participant。
    contract_refs:
    - rtc/call_session/aggregate.yaml#members
    - rtc/call_session/service.yaml#InviteToCall
    - rtc/call_session/service.yaml#JoinCall
    - rtc/call_session/service.yaml#LeaveCall
    performance_points:
    - command P95 300ms；参与者可见延迟由 realtime UAT 单独验收。
    tests:
      planned:
      recorded:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/room_management_contract__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: multi_party_room_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.multi_party_room.owned_participant
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: multi_party_room_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.multi_party_room.owned_participant
        envs:
        - local
    notes:
    - recorded API 测试存在，但 planned 的新目录化聚合合同尚未落地，故不标 completed。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
