  SIT5_signaling_contract:
    title: realtime-gateway 单通道 wire type 端云一致与参与者绑定
    story_refs:
    - group-call
    - call-experience
    done_when:
    - events.yaml 的 client_ws_type 经 codegen 生成 Go 映射，orchestrator 推送使用 wire type（call.ringing
      等）。
    - Dart parseRtcWsPayload 与 Go 推送 type 对齐；来电/参与者事件可被端侧解析。
    - LiveKit 远端 participants/tracks 实时同步到 callParticipantsProvider，视频格渲染真实 VideoTrack。
    - RTC 不建立私有信令连接；所有在线 call/participant/screen_share 事件只由
      realtime-gateway 的可信 ticket/auth_ack 连接投递。
    performance_points:
    - 通话状态同步延迟 ≤500ms（1v1）/≤1s（多人）。
