version: 2
node:
  id: realtime-call
  level: L2_business_capability
  path: specs/feature-tree/chat-conversation/realtime-call
  title: realtime call
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: 1v1 + 多人（≤32）实时音视频通话商用上线验收。覆盖入口门禁、呼出/来电/通话全过程态、 通话中加人与信任提示、离开/挂断收尾、三端来电唤醒（iOS
    CallKit / Android 全屏意图 / Web Push）、 权限与错误统一语义、LiveKit 参与者与轨道绑定、弱网与全局通话条/PiP。
  in_scope:
  - 1v1 与多人通话状态机、端云协同、异常路径
  - 三端来电平台能力矩阵与权限降级
  - 信任两态（认识 / 可能不认识）提示
  - 错误码/文案统一语义与权限卡片
  - LiveKit 远端参与者/轨道到 UI 的实时绑定
  out_of_scope:
  - 超过 32 人会议、PSTN、直播推流、实时字幕
  - E2EE 与 AI 降噪（后续 Phase）
sit_acceptance:
  SIT1_entry_gating:
    title: 入口清晰度与关系门禁
    story_refs:
    - one-to-one-call
    - group-call
    done_when:
    - 1v1 输入区仅互相关注显示语音/视频入口；非互相关注显示可解释教育卡而非空白。
    - 群聊输入区进入选人页，≤8 默认全选、>8 默认空选，可切换当前会话/互相关注/其他群。
    - 用户主页按关系态展示消息/语音/视频或仅打招呼，入口只读 relationship-capability 能力位。
    performance_points:
    - 入口能力位读取不阻塞会话首屏渲染。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/call_participant_picker_page_widget__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit1_entry_gating_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.sit1_entry_gating.sit1_entry_gating_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: sit1_entry_gating_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.sit1_entry_gating.sit1_entry_gating_local_contract
        envs: *id001
    notes:
