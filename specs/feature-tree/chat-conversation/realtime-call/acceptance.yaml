    - Web M2 仅支持前台 realtime 站内来电；后台 Web Push/Service Worker 明确 deferred，
      不伪装成已实现能力。
    - 平台判断只读 PlatformCapabilities（incomingCallUi/webPushIncomingCall/realtimeCommunication），无裸平台判断。
    performance_points:
