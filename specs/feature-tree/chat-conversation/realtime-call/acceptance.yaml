version: 2
node:
  id: realtime-call
  level: L2_business_capability
  path: specs/feature-tree/chat-conversation/realtime-call
  title: realtime call
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: 1v1 + 多人（≤32）实时音视频通话商用验收。以 CallSession/CallParticipant、
    realtime-gateway 单通道、LiveKit 媒体和会话 system_call_log 为主线；离线来电与媒体
    QoE 仍是未完成商用门，不因 metadata 声明或本地测试存在而视为通过。
  in_scope:
  - 1v1 与多人通话状态机、端云协同、异常路径
  - realtime-gateway 在线事件、三端离线来电平台能力矩阵与权限降级
  - 关系门禁，以及来电/入会前的信任两态（认识 / 可能不认识）提示
  - 错误码/文案统一语义与权限卡片
  - LiveKit 远端参与者/轨道到 UI 的实时绑定
  - CallEnded 到关联 Conversation system_call_log 的 durable 投影
  - PiP 挂断、屏幕共享与媒体 QoE 商用准出
  out_of_scope:
  - 超过 32 人会议、PSTN、直播推流、实时字幕
  - 通话录制、媒体录制文件与本期 E2EE
  - 独立通话历史聚合页（当前主形态为会话 system_call_log）
