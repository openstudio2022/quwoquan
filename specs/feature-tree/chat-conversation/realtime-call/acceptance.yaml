  SIT4_incoming_platform_matrix:
    title: 三端来电唤醒与权限降级
    story_refs:
    - one-to-one-call
    - group-call
    - call-experience
    done_when:
    - iOS 后台/锁屏经 PushKit 唤醒并立即上报 CallKit；Android 经 FCM 高优先级+全屏意图唤醒，14+ 权限不可用降级 heads-up。
    - Web 前台站内来电弹窗，后台经 Web Push+Service Worker 通知点击进会；未安装 PWA 给出引导降级。
    - 平台判断只读 PlatformCapabilities（incomingCallUi/webPushIncomingCall/realtimeCommunication），无裸平台判断。
    performance_points:
    - 来电离线推送到达 ≤5s。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/rtc/incoming_call_coordinator__local_contract_test.dart
