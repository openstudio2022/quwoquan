  SIT6_error_permission_semantics:
    title: 错误与权限统一语义
    story_refs:
    - one-to-one-call
    - call-experience
    done_when:
    - 通话错误走 errors.yaml→codegen，端侧用 RtcErrorCode.fromCode(...).toDisplayMessage(l10n)，含
      not_mutual/blocked。
    - 麦克风/摄像头/通知/全屏来电/Web 通知权限统一权限卡片，永久拒绝显示去设置并提供仅语音降级。
    - 无裸异常字符串与硬编码中文/REC 文案。
    performance_points:
