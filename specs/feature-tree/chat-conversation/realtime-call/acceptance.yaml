  SIT2_call_lifecycle:
    title: 呼出/来电/通话全过程态闭环
    story_refs:
    - one-to-one-call
    - call-experience
    done_when:
    - 发起→呼出（可取消）→振铃（接听/拒绝/30s 超时）→建连→通话→挂断收尾完整可达。
    - 通话页覆盖连接中/振铃/单人等待/通话中/对方未接/已离开/重连中/弱网/已结束全部过程态。
    - 通话结束后在关联会话插入通话记录消息。
    performance_points:
    - 强网通话建立 ≤3s；来电在线推送到达 ≤1s。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/rtc/providers/call_session_provider_lifecycle__local_contract_test.dart
      - file: quwoquan_service/services/rtc-service/tests/api_integration/call_lifecycle_contract__api_integration_test.go
