  SIT3_multiparty_invite_trust:
    title: 多人房间、通话中加人与信任两态提示
    story_refs:
    - group-call
    done_when:
    - Join/Leave/Invite 全路径可用；32 人上限返回 call_full；最后一人离开结束房间。
    - 通话中加人支持当前会话/互相关注/其他群与链接入会，链接含来源/过期/风险提示。
    - 参与者按 认识/可能不认识 两态展示来源标签或风险提示；新人为“可能不认识”时在会成员收到轻量横幅。
    performance_points:
    - 参与者加入可见延迟 ≤2s。
    tests:
