version: 2
node:
  id: group-call
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/group-call
  title: group call
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: 2~32 人多人通话：选人发起、加入/离开、通话中邀请、链接入会、信任两态。
  in_scope:
  - 多人选人规则（≤8 全选、>8 空选）
  - Join/Leave/Invite 与 32 人上限
  - 通话中加人与链接入会、信任两态提示
  out_of_scope:
  - 1v1 状态机（见 one-to-one-call）
gwt_acceptance:
  GWT1_join_leave_limit:
    title: 多人加入、离开与 32 人上限
    given:
    - 已存在一个进行中的多人通话。
    when:
    - 被邀请人加入、某成员离开、第 33 人尝试加入。
    then:
    - 参与者数实时更新；第 33 人加入返回 call_full；最后一人离开结束房间。
    done_when:
    - 多人房间加入/离开/上限路径闭环。
    edge_cases:
    - 重复加入幂等；离开后再被邀请可重新加入。
    contract_refs:
    - rtc/call_session service.yaml JoinCall
    - rtc/call_session service.yaml LeaveCall
    performance_points:
    - 参与者加入可见延迟 ≤2s。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_join_leave_limit_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.group_call.gwt1_join_leave_limit_local_contract
        envs: &id001
        - local
      - layer: api_integration
        suite: gwt1_join_leave_limit_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.group_call.gwt1_join_leave_limit_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: gwt1_join_leave_limit_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.group_call.gwt1_join_leave_limit_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/rtc-service/tests/multi_party_room_contract_test.go'
  GWT2_invite_trust:
    title: 通话中加人与信任两态提示
    given:
    - 当前在多人通话中，可邀请当前会话/互相关注/其他群成员或分享链接。
    when:
    - 邀请一名“可能不认识”的成员加入。
    then:
    - 被邀请人来电页显示来源与信任态；加入后在会成员收到“可能不认识 TA”轻量横幅。
    done_when:
    - 加人链路与信任两态提示可达。
    edge_cases:
    - 被拉黑/房间满/链接过期时拒绝入会并显示结构化错误。
    contract_refs:
    - rtc/call_session service.yaml InviteToCall
    - rtc/call_session fields.yaml trustRelation
    performance_points:
    - 邀请结果反馈 ≤2s。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_invite_trust_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.group_call.gwt2_invite_trust_local_contract
        envs: *id001
      - layer: api_integration
        suite: gwt2_invite_trust_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.group_call.gwt2_invite_trust_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: gwt2_invite_trust_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.group_call.gwt2_invite_trust_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/rtc/widgets/participant_trust_badge_test.dart'
    - '[migrated_from_planned] quwoquan_service/services/rtc-service/tests/multi_party_room_contract_test.go'
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
