version: 2
node:
  id: group-call
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/group-call
  title: group call
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: 2～32 人 CallSession 的直接邀请、加入、离开、上限、信任证据与结束语义。
  in_scope:
  - InviteToCall/JoinCall/LeaveCall/ReportMediaConnected
  - CallParticipant owned entity 与 32 人边界
  - realtime-gateway 参与者事件
  - 来电/入会前 known/possibly_unknown 提示
  out_of_scope:
  - 呼叫链接入会、主持人审批、超过 32 人会议
  - 独立 CallParticipant Store/Facade
gwt_acceptance:
  GWT1_join_leave_limit:
    title: 多人加入、离开与 32 人边界
    given:
    - 已存在一个未结束的多人 audio/video CallSession。
    when:
    - 被邀请人加入、成员离开、第 33 人尝试加入、最后一人离开。
    then:
    - participantCount 与 owned participants 一致；第 33 人收到 call_full；最后一人离开写 ended/last_leave。
    done_when:
    - join/leave/limit/last_leave 与重复命令在真实 Mongo/Redis 集成中闭环。
    edge_cases:
    - 重复 join/leave 幂等；非参与者、已结束、被拉黑请求不产生写入。
    contract_refs:
    - rtc/call_session/service.yaml#JoinCall
    - rtc/call_session/service.yaml#LeaveCall
    - rtc/call_session/fields.yaml#CallParticipant
    performance_points:
    - 参与者加入可见 P95 目标 ≤2s，需 realtime + media 实证。
    tests:
      planned:
      recorded:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/room_management_contract__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: group_call_room_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.group_call.room_lifecycle
        envs: &integration_envs
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: group_call_room_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.group_call.room_lifecycle
        envs: &local_envs
        - local
    notes: []
  GWT2_direct_invite_and_trust:
    title: 直接邀请与最小信任证据
    given:
    - 当前参与者可从合法会话/关系候选中选择 invitee。
    when:
    - 调用 InviteToCall 邀请 known 或 possibly_unknown 成员。
    then:
    - inviteStatus、invitedBy 与 realtime 事件一致；来电/入会前展示来源和必要风险提示。
    done_when:
    - 邀请、接受/拒绝/过期和信任提示均消费同一 CallSession/event 输出。
    edge_cases:
    - 房间满、被拉黑、已结束或重复邀请结构化失败/幂等，不显示未建合同的链接入口。
    contract_refs:
    - rtc/call_session/service.yaml#InviteToCall
    - rtc/call_session/fields.yaml#CallInviteStatus
    - rtc/call_session/fields.yaml#TrustRelation
    performance_points:
    - 邀请结果反馈 P95 目标 ≤2s。
    tests:
      planned:
      recorded:
      - file: quwoquan_app/test/local_contract/ui/rtc/providers/call_participants_presentation__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/call_participant_picker_page_widget__local_contract_test.dart
      - file: quwoquan_service/services/rtc-service/tests/api_integration/room_management_contract__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: group_call_invite_trust_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.group_call.invite_trust
        envs: *local_envs
      - layer: api_integration
        execution_profile: integration
        suite: group_call_invite_trust_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.group_call.invite_trust
        envs: *integration_envs
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: group_call_invite_trust_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.group_call.invite_trust
        envs:
        - gamma_local
    notes:
    - 通话页不常驻交集信息；信任证据只在来电/入会和新成员进入时展示。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
