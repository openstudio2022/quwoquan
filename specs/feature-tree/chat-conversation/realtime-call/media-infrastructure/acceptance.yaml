version: 2
node:
  id: media-infrastructure
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/media-infrastructure
  title: media infrastructure
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: SFU/TURN/录制媒体基础设施与三端来电推送通道（VoIP/FCM/Web Push）。
  in_scope:
  - LiveKit SFU 房间生命周期与 Token 签发
  - WS 信令 wire type 端云一致
  - 来电推送负载契约（VoIP/FCM/Web Push）
  out_of_scope:
  - 端侧通话 UI（见 call-experience）
gwt_acceptance:
  GWT1_signaling_wire_type:
    title: WS 信令 wire type 端云一致
    given:
    - events.yaml 已声明 client_ws_type（call.ringing 等）。
    when:
    - rtc-service 发布 CallRinging/ParticipantJoined 等事件。
    then:
    - 推送的 WS type 为 wire type，端侧 parseRtcWsPayload 可解析，无 domain 常量泄漏到线协议。
    done_when:
    - 端云信令 type 完全对齐且来电可被端侧识别。
    edge_cases:
    - 未知 type 端侧降级为 unknown payload 不崩溃。
    contract_refs:
    - rtc/call_session events.yaml client_ws_type
    performance_points:
    - 信令延迟（发起→来电通知）≤1s。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_signaling_wire_type_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.media_infrastructure.gwt1_signaling_wire_type_local_contract
        envs: &id001
        - local
      - layer: api_integration
        suite: gwt1_signaling_wire_type_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.media_infrastructure.gwt1_signaling_wire_type_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: gwt1_signaling_wire_type_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.media_infrastructure.gwt1_signaling_wire_type_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/rtc-service/tests/ws_event_wire_type_contract_test.go'
    - '[migrated_from_planned] quwoquan_app/test/cloud/rtc/rtc_signaling_wire_type_test.dart'
  GWT2_incoming_push_payload:
    title: 三端来电推送负载契约
    given:
    - 一通呼叫发起，被叫离线或后台。
    when:
    - rtc-service 在 call.initiated/ringing 投递推送。
    then:
    - VoIP/FCM/Web Push 负载含 callId/发起人/来源/类型/信任标记/过期，端侧据此唤起来电页。
    done_when:
    - 三端推送负载契约一致且可驱动来电唤醒。
    edge_cases:
    - 推送过期或重复时端侧幂等处理。
    contract_refs:
    - rtc/call_session events.yaml CallRinging push_policy
    performance_points:
    - 离线推送到达 ≤5s。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: api_integration
        suite: gwt2_incoming_push_payload_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.media_infrastructure.gwt2_incoming_push_payload_api_integration
        envs: *id002
      - layer: user_acceptance
        suite: e2e_journey
        cases:
        - user_acceptance.chat_conversation.realtime_call.media_infrastructure.e2e_journey
        envs:
        - gamma_local
      supporting:
      - layer: local_contract
        suite: gwt2_incoming_push_payload_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.media_infrastructure.gwt2_incoming_push_payload_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/rtc-service/tests/incoming_push_payload_contract_test.go'
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
