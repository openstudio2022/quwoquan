version: 2
node:
  id: one-to-one-call
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/one-to-one-call
  title: one to one call
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: 互相关注门禁下的 1v1 audio/video 通话、媒体 connected、异常收尾、离线来电与会话通话记录。
  in_scope:
  - Initiate/Answer/Reject/Cancel/Hangup/ReportMediaConnected
  - no_answer、忙线、重复命令与接听/取消竞态
  - realtime-gateway 在线来电与三端离线来电计划
  - CallEnded 到 Conversation system_call_log
  out_of_scope:
  - 多人房间
  - 通话录制、本期 E2EE、独立通话历史页
gwt_acceptance:
  GWT1_initiate_answer_connected:
    title: 合法关系发起并以媒体 connected 进入通话
    given:
    - 双方互相关注且未拉黑，被叫可接听。
    when:
    - 主叫发起 video 通话，被叫 AnswerCall 后 LiveKit 媒体可用并上报 ReportMediaConnected。
    then:
    - callType 为 video，状态依次收敛到 initiated/ringing/connecting/in_call，双方渲染真实媒体。
    done_when:
    - AnswerCall 成功与媒体 connected 被明确区分，至少两人 connected 后才进入 in_call。
    edge_cases:
    - 非互关、blocked、非参与者、already_in_call 均结构化失败且不创建第二通话。
    contract_refs:
    - rtc/call_session/service.yaml#InitiateCall
    - rtc/call_session/service.yaml#AnswerCall
    - rtc/call_session/service.yaml#ReportMediaConnected
    performance_points:
    - 接听到媒体可用 P95 目标建议 ≤3s，待 QoE metadata/SLO 最终冻结。
    tests:
      planned:
      - file: quwoquan_app/test/api_integration/cloud/rtc/rtc_api_contract_runner.dart
      recorded:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/call_lifecycle_contract__api_integration_test.go
      - file: quwoquan_service/services/rtc-service/tests/api_integration/one_to_one_relationship_gate__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: one_to_one_connected_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.one_to_one_call.connected
        envs: &integration_envs
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: one_to_one_connected_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.one_to_one_call.connected
        envs: &local_envs
        - local
    notes:
    - 现有 lifecycle 测试不替代 planned 的 answer/connected 时间与终态断言。
  GWT2_reject_cancel_no_answer_and_history:
    title: 拒绝、取消、无应答与会话记录一致收尾
    given:
    - CallSession 处于 initiated 或 ringing。
    when:
    - 被叫拒绝、主叫取消、30 秒未接，或通话中一方挂断。
    then:
    - 聚合进入 ended，endReason 分别为 rejected/cancelled/no_answer/normal，并只投影一条 system_call_log。
    done_when:
    - 四种收尾、重复命令、取消/接听竞态和 chat durable projection 均可验证。
    edge_cases:
    - ended 为终态；相同 Idempotency-Key 重放不得重复发布 CallEnded 或重复插入消息。
    contract_refs:
    - rtc/call_session/service.yaml#RejectCall
    - rtc/call_session/service.yaml#CancelCall
    - rtc/call_session/service.yaml#HangupCall
    - rtc/call_session/events.yaml#CallEnded
    performance_points:
    - 在线结束状态同步 P95 目标 ≤500ms。
    tests:
      planned:
      recorded:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/call_lifecycle_contract__api_integration_test.go
      - file: quwoquan_service/services/chat-service/tests/api_integration/rtc_call_log_projection__api_integration_test.go
      - file: quwoquan_app/test/local_contract/ui/rtc/providers/call_session_provider_lifecycle__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: one_to_one_end_history_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.one_to_one_call.end_history
        envs: *integration_envs
      - layer: user_acceptance
        execution_profile: release
        suite: one_to_one_end_history_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.one_to_one_call.end_history
        envs:
        - gamma_local
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: one_to_one_end_history_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.one_to_one_call.end_history
        envs: *local_envs
    notes:
    - 独立历史聚合页 deferred；本项只验收会话 system_call_log。
  GWT3_offline_incoming_call:
    title: 后台、锁屏与被终止状态的离线来电
    given:
    - 被叫不在线或 App 在后台/锁屏/被系统终止，设备已完成合法 push 注册。
    when:
    - rtc-service 发布未过期的 CallRinging。
    then:
    - iOS/Android/Web 按 capability 使用 PushKit/FCM/Web Push 唤醒或明确降级，重复/过期 payload 不重复响铃。
    done_when:
    - provider、设备注册、平台回调、接听/拒绝与真实设备 readback 全链通过。
    edge_cases:
    - Push 重复、延迟到达、呼叫已取消、全屏意图权限关闭、Web PWA 未安装。
    contract_refs:
    - rtc/call_session/events.yaml#CallRinging
    performance_points:
    - 离线来电到达 P95 目标 ≤5s，需真实 provider 证据。
    tests:
      planned:
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/rtc/rtc_call_ringing_payload_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/platform/rtc_native_incoming_call__platform__local_contract_test.dart
      - file: quwoquan_service/services/notification-service/tests/api_integration/rtc_incoming_call_coordination__reliability__api_integration_test.go
      - file: quwoquan_service/services/integration-service/tests/api_integration/push_delivery_worker__idempotency__api_integration_test.go
      - file: quwoquan_service/services/user-service/tests/api_integration/device_credential_packet__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: one_to_one_offline_push_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.one_to_one_call.offline_push
        envs: *integration_envs
      - layer: user_acceptance
        execution_profile: release
        suite: one_to_one_offline_push_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.one_to_one_call.offline_push
        envs:
        - gamma_local
        - prod
        rollout_stages:
        - gray_initial
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: one_to_one_offline_push_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.one_to_one_call.offline_push_payload
        envs: *local_envs
    notes:
    - DeviceRegistration、durable delivery、provider 幂等/失效、原生桥与跨通道去重已有 local/API/原生编译证据；真实 APNs/FCM 凭据、后台/锁屏/终止态真机到达 P95 与取消竞态 readback 未完成前保持 partial。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
