version: 2
node:
  id: one-to-one-call
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/one-to-one-call
  title: one to one call
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: 1v1 语音/视频通话端到端：发起、呼叫、接听/拒绝/超时、通话、挂断、通话记录。
  in_scope:
  - 互相关注门禁下的发起与状态机
  - 呼出取消、振铃超时、忙线提示
  - 挂断收尾与通话记录消息
  out_of_scope:
  - 多人房间（见 group-call）
gwt_acceptance:
  GWT1_initiate_and_answer:
    title: 互相关注发起并接听 1v1 通话
    given:
    - 双方为互相关注状态，被叫在线。
    when:
    - 主叫从会话输入区发起视频通话并被对方接听。
    then:
    - 双方进入通话页并渲染真实音视频流，状态机经 initiated→ringing→connecting→in_call。
    done_when:
    - 1v1 视频通话可建连且双方可见对方画面。
    edge_cases:
    - 被叫忙线时主叫收到结构化“对方正在通话中”提示。
    contract_refs:
    - rtc/call_session service.yaml InitiateCall
    - rtc/call_session service.yaml AnswerCall
    performance_points:
    - 强网通话建立 ≤3s。
    tests:
      planned:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/call_lifecycle_contract__api_integration_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_initiate_and_answer_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.one_to_one_call.gwt1_initiate_and_answer_local_contract
        envs: &id001
        - local
      - layer: api_integration
        suite: gwt1_initiate_and_answer_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.one_to_one_call.gwt1_initiate_and_answer_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: gwt1_initiate_and_answer_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.one_to_one_call.gwt1_initiate_and_answer_local_contract
        envs: *id001
    notes: []
  GWT2_reject_timeout_cancel:
    title: 拒绝、超时与取消收尾
    given:
    - 主叫发起呼叫，被叫处于振铃态。
    when:
    - 被叫拒绝 / 30s 未接 / 主叫主动取消。
    then:
    - 通话结束并写入对应 endReason（rejected/no_answer/cancelled）与通话记录消息。
    done_when:
    - 三种收尾路径均可达且状态一致。
    edge_cases:
    - 主叫取消与被叫接听竞态时以服务端状态机为准。
    contract_refs:
    - rtc/call_session service.yaml RejectCall
    - rtc/call_session service.yaml CancelCall
    performance_points:
    - 状态同步延迟 ≤500ms。
    tests:
      planned:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/call_lifecycle_contract__api_integration_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: api_integration
        suite: gwt2_reject_timeout_cancel_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.one_to_one_call.gwt2_reject_timeout_cancel_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: gwt2_reject_timeout_cancel_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.one_to_one_call.gwt2_reject_timeout_cancel_local_contract
        envs: *id001
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
