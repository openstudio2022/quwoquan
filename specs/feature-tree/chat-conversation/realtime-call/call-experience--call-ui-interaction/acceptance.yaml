version: 2
node:
  id: call-experience--call-ui-interaction
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/call-experience--call-ui-interaction
  title: call UI interaction contract
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: RTC 页面把 CallSession、LiveKit track、控制 command 与全局 PiP 生命周期组合为单一体验。
  in_scope:
  - 过程态、真实媒体、错误恢复
  - 控制栏、PiP/通话条、屏幕共享
  out_of_scope:
  - 录制 UI、交集常驻展示、debug 模拟路径
gwt_acceptance:
  GWT1_controls_and_global_lifecycle:
    title: 控制真实生效且 PiP 挂断完成云端收尾
    given:
    - 用户处于 audio/video 通话中并可在页面与 PiP/通话条之间切换。
    when:
    - 用户静音、切摄像头/音频输出、回流或从 PiP 挂断。
    then:
    - LiveKit/typed Facet 收到真实动作，页面只消费权威结果，CallEnded 后全局投影幂等销毁。
    done_when:
    - 本地状态、媒体运行态、云端状态与导航无分叉。
    edge_cases:
    - command 失败、CallEnded 先到、后台恢复、多人 Leave 与 Hangup 语义不同。
    contract_refs:
    - rtc/call_session/service.yaml#ToggleMute
    - rtc/call_session/service.yaml#ToggleCamera
    - rtc/call_session/service.yaml#HangupCall
    - rtc/call_session/service.yaml#LeaveCall
    performance_points:
    - 控制交互不阻塞 UI；真实帧率由设备 UAT 记录。
    tests:
      planned:
      recorded:
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/call_controls_bar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/pip_call_overlay__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/shell/active_call_shell_mount__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: call_ui_controls_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.call_ui.controls_pip
        envs:
        - local
      - layer: user_acceptance
        execution_profile: release
        suite: call_ui_controls_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.call_ui.controls_pip
        envs:
        - gamma_local
      supporting: []
    notes:
    - Widget 证据未覆盖真实 PiP command/云端终态，故保持 partial。
  GWT2_screen_share_ui:
    title: 屏幕共享 UI 与聚合/媒体一致
    given:
    - 通话进行中，平台能力与权限状态已知。
    when:
    - 用户开始或停止共享，或发生并发共享/权限拒绝。
    then:
    - UI 等待 typed command 与 LiveKit track 的真实结果，冲突/无能力显示结构化反馈。
    done_when:
    - 开始、停止、互斥、离开与恢复路径均有三层证据。
    edge_cases:
    - 共享者离开或系统中止采集时自动收敛。
    contract_refs:
    - rtc/call_session/service.yaml#StartScreenShare
    - rtc/call_session/service.yaml#StopScreenShare
    performance_points:
    - 共享画面可用时延进入 media QoE，不用 command latency 冒充。
    tests:
      planned:
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: call_ui_screen_share_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.call_ui.screen_share
        envs:
        - local
      - layer: api_integration
        execution_profile: integration
        suite: call_ui_screen_share_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.call_ui.screen_share
        envs:
        - beta
        - gamma
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: call_ui_screen_share_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.call_ui.screen_share
        envs:
        - gamma_local
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
