version: 2
node:
  id: call-experience
  level: L3_story
  path: specs/feature-tree/chat-conversation/realtime-call/call-experience
  title: call experience
  parent_domain_service: chat-conversation
  parent_business_capability: realtime-call
scope:
  summary: 五个 RTC 页面、真实媒体展示、过程态、控制、PiP hangup、屏幕共享与恢复体验。
  in_scope:
  - CallSession + LiveKit 派生展示态
  - 真实 VideoTrack/音频控制与 RuntimeFailure
  - ActiveCallBar/PiP 回流及云端挂断
  - 屏幕共享 start/stop、互斥与平台降级
  out_of_scope:
  - 通话录制 UI、交集常驻模块、debug 模拟主链
gwt_acceptance:
  GWT1_real_media_and_states:
    title: 真实媒体与全过程态可理解
    given:
    - audio/video 通话正在振铃、建连、通话、弱网、重连或结束。
    when:
    - CallSession 状态或 LiveKit participants/tracks/connection state 变化。
    then:
    - 页面派生正确 stage，真实 track 可见；无 track、弱网、重连与结束均有明确反馈。
    done_when:
    - connecting/ringing/waitingPeer/inCall/reconnecting/weakNetwork/peerNoAnswer/peerLeft/ended 全覆盖。
    edge_cases:
    - 无摄像头降级 audio；CallEnded 与 reconnect 竞态只收尾一次。
    contract_refs:
    - rtc/call_session/fields.yaml#CallStatus
    - rtc/call_session/events.yaml
    performance_points:
    - 通话页帧预算与媒体 QoE 分开记录；不得以 Widget pump 证明真实帧率。
    tests:
      planned:
      recorded:
      - file: quwoquan_app/test/local_contract/ui/rtc/providers/call_session_provider_lifecycle__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/rtc/providers/call_participants_presentation__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: call_experience_states_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.call_experience.states
        envs: &local_envs
        - local
      - layer: user_acceptance
        execution_profile: release
        suite: call_experience_states_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.call_experience.states
        envs: &gamma_envs
        - gamma_local
      supporting: []
    notes:
    - 现有 UAT 不等于真实 Gamma hosted/Prod 媒体 QoE 证据。
  GWT2_pip_hangup:
    title: PiP/通话条回流与挂断收尾
    given:
    - 用户在进行中的通话里返回其他页面，ActiveCallBar/PiP 已显示。
    when:
    - 用户点击回流，或从 PiP 发起挂断。
    then:
    - 回流到 canonical 通话页；挂断调用 HangupCall/LeaveCall 并等待云端终态后幂等关闭浮层。
    done_when:
    - 导航、云端状态、CallEnded 与浮层生命周期在竞态下不重复或残留。
    edge_cases:
    - 挂断请求失败显示可恢复错误，不先把通话本地标为结束。
    contract_refs:
    - rtc/call_session/service.yaml#HangupCall
    - rtc/call_session/service.yaml#LeaveCall
    performance_points:
    - PiP 操作与回流不阻塞 UI 线程。
    tests:
      planned:
      recorded:
      - file: quwoquan_app/test/local_contract/app/shell/active_call_shell_mount__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/pip_call_overlay__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/active_call_bar__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: call_experience_pip_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.call_experience.pip_hangup
        envs: *local_envs
      - layer: user_acceptance
        execution_profile: release
        suite: call_experience_pip_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.call_experience.pip_hangup
        envs: *gamma_envs
      supporting: []
    notes:
    - 现有 overlay Widget 证据未覆盖真实 command/终态，因此保持 partial。
  GWT3_screen_share:
    title: 屏幕共享开始、互斥、停止与平台降级
    given:
    - CallSession 已 in_call，平台 screen capture capability 可用或明确不可用。
    when:
    - 参与者开始/停止共享，另一参与者并发开始，或用户拒绝采集权限。
    then:
    - CallSession screen-share 字段与 LiveKit track 一致；并发冲突结构化失败；无能力时安全降级。
    done_when:
    - command、媒体 track、页面与平台权限四层同源。
    edge_cases:
    - 共享者离开、App 后台、系统停止采集、网络重连。
    contract_refs:
    - rtc/call_session/service.yaml#StartScreenShare
    - rtc/call_session/service.yaml#StopScreenShare
    - rtc/call_session/events.yaml#ScreenShareStarted
    - rtc/call_session/events.yaml#ScreenShareStopped
    performance_points:
    - command P95 300ms；共享画面可用时延进入 RTC QoE。
    tests:
      planned:
      recorded:
      - file: quwoquan_service/services/rtc-service/tests/api_integration/call_lifecycle_contract__api_integration_test.go
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/call_controls_bar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/rtc/widgets/video_call_page_interactions__functional__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/rtc/providers/call_session_signal_consume__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: call_experience_screen_share_local_contract
        cases:
        - local_contract.chat_conversation.realtime_call.call_experience.screen_share
        envs: *local_envs
      - layer: api_integration
        execution_profile: integration
        suite: call_experience_screen_share_api_integration
        cases:
        - api_integration.chat_conversation.realtime_call.call_experience.screen_share
        envs:
        - beta
        - gamma
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: call_experience_screen_share_user_acceptance
        cases:
        - user_acceptance.chat_conversation.realtime_call.call_experience.screen_share
        envs: *gamma_envs
    notes:
    - command、互斥状态、页面控制与 realtime signal 已有 local/API 证据；真实 screen track、设备权限与 Gamma QoE 仍待 production Remote UAT。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
