version: 2
node:
  id: message-interaction-polish--mention-highlight-and-picker
  level: L3_story
  path: specs/feature-tree/chat-conversation/list-detail-message-delivery/message-interaction-polish--mention-highlight-and-picker
  title: message interaction polish  mention highlight and picker
  parent_domain_service: chat-conversation
  parent_business_capability: list-detail-message-delivery
scope:
  summary: 群聊 @成员从权威 roster 搜索、输入 token、服务端校验、未读提醒、气泡高亮到主页跳转的完整闭环。
  in_scope:
  - 输入 @ 打开成员选择器；服务端搜索最多返回 50 个结果；选择后插入 @显示名 与稳定 userId
  - 普通成员提及、owner/admin @所有人、assistant 已入群时 @小趣的服务端校验
  - Message/MessageSent/ListMessages/SyncMessages mentions 同源与 mentionUnreadCount 推进、已读归零
  - 气泡高亮与普通成员主页跳转，浅色/深色和自己/他人气泡可读
  out_of_scope:
  - '@提及专属系统 Push 通道'
  - 跨会话或非成员提及
  - 群内昵称
gwt_acceptance:
  GWT1:
    title: 输入选择与发送 payload
    given:
    - 当前用户位于含普通成员、管理员和小趣的群会话。
    when:
    - 用户键入 @，搜索并选择一个普通成员后发送消息。
    then:
    - 贴底选择器在 200ms 目标内出现，搜索只消费 ListMembers typed 结果。
    - 输入框插入 @显示名 与尾随空格，并以主题语义色显示。
    - SendMessage.mentions 只包含仍存在于正文中的稳定 userId，删除 token 后不得误发提醒。
    - mention_select 与 mention_send 记录为 metadata 生成的
      chat_interaction_outcome，仅携带 mentionScope、chatOutcome 和人数/未读分桶；
      不得上报成员 ID、会话 ID、消息 ID、显示名或正文。
    done_when:
    - 输入、选择、删除与发送行为有 local_contract，Mock 与 Remote 参数一致。
    edge_cases:
    - 取消选择器保留原始 @。
    - 空结果和查询失败提供空态或结构化重试。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation_membership/service.yaml#ListMembers
    - quwoquan_service/contracts/metadata/messages/message/service.yaml#SendMessage
    performance_points:
    - 选择器首批结果 P95 小于 200ms，单次最多 50 项。
    tests:
      planned: []
      recorded:
      - quwoquan_app/test/local_contract/ui/components/input/customizable_chat_input_bar__local_contract_test.dart
      - quwoquan_app/test/local_contract/ui/chat/widgets/chat_mention_picker__local_contract_test.dart
      - quwoquan_app/test/local_contract/ui/chat/providers/chat_message_provider__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: chat_mention_composer
        cases:
        - local_contract.chat.mention_picker.search_select_insert
        - local_contract.chat.mention_composer.deleted_token_not_sent
        envs:
        - local
      supporting: []
    notes:
    - 2026-07-21 已在本地复验 picker、token 删除和 SendMessage.mentions 透传；Remote 参数与真实输入法旅程尚无 gamma_local 证据，不能标记 implemented。
  GWT2:
    title: 服务端目标校验与提及未读
    given:
    - 群内存在 owner/admin/member 与一个非成员账号。
    when:
    - 不同角色发送普通提及或 __all__，并由 InboxProjector 消费 MessageSent。
    then:
    - 普通目标必须是活跃成员；非成员目标返回 CHAT.USER.message_invalid。
    - 仅 owner/admin 可使用 __all__；普通成员越权被拒且不泄露名册信息。
    - 普通提及只推进目标用户 mentionUnreadCount；__all__ 推进除发送者外全部 user 成员。
    - MarkAsRead 后 unreadCount 与 mentionUnreadCount 均回到服务端权威值。
    - read_watermark 使用 chat_interaction_outcome 的 watermarkResult 与
      unreadCountBucket 记录成功、幂等、拒绝或失败结果，且不携带 readSeq 或对象 ID。
    done_when:
    - HTTP、Mongo Message、outbox 与 ConversationUserState 由 api_integration 证明一致且重放幂等。
    edge_cases:
    - 重复 userId 去重且保持首次出现顺序。
    - assistant 未加入会话时 assistant mention 被拒。
    - mentions 超过 50 项被拒。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/message/fields.yaml#mentions
    - quwoquan_service/contracts/metadata/messages/message/events.yaml#MessageSent
    - quwoquan_service/contracts/metadata/messages/conversation_user_state/fields.yaml#mentionUnreadCount
    performance_points:
    - 服务端校验随 mentions 数量线性增长且最多 50 次目标查找。
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/chat-service/tests/api_integration/message_mention_contract__api_integration_test.go
      - quwoquan_app/packages/quwoquan_cloud_mock/test/local_contract/chat/alpha_message_writer__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: message_mention_contract
        cases:
        - api_integration.chat.mention.member_target_validated
        - api_integration.chat.mention.all_role_matrix
        - api_integration.chat.mention.unread_and_mark_read
        envs:
        - beta
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: alpha_chat_mention_parity
        cases:
        - local_contract.chat.mention.mock_role_and_membership_parity
        envs:
        - local
    notes:
    - 2026-07-21 本地已复验 canonical round-trip、越权拒绝、部分已读、延迟投影与重放幂等；beta 环境尚未留证。
  GWT3:
    title: 气泡高亮与主页跳转
    given:
    - 收到一条 mentions 含普通成员、__all__ 或 assistant 的文本消息。
    when:
    - 会话页渲染气泡并点击高亮 token。
    then:
    - 只有 mentions 对应 token 高亮；普通文本中的孤立 @ 不高亮。
    - 普通成员 token 点击进入该 userId 的用户主页；__all__ 与 assistant 不进入用户主页。
    - 当前 roster 无显示名时按 mentions 与正文 token 顺序回退，点击目标仍正确。
    done_when:
    - 气泡 local_contract 覆盖自己/他人消息、深浅模式和点击目标；双账号 UAT 覆盖提醒到主页旅程。
    edge_cases:
    - 同名成员按发送 mentions 顺序保持稳定目标。
    - 成员改名或离群后历史消息仍可显示正文并保留稳定 ID。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation/projections/chat_message_client.yaml
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml#userProfile
    performance_points:
    - 高亮解析相对正文长度与 mentions 数量线性增长，不影响列表 60fps。
    tests:
      planned: []
      recorded:
      - quwoquan_app/test/local_contract/ui/chat/widgets/chat_message_bubble_widget__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: chat_message_mention_bubble
        cases:
        - local_contract.chat.mention.bubble_highlight
        - local_contract.chat.mention.profile_target
        envs:
        - local
      supporting: []
    notes:
    - 2026-07-21 气泡高亮与稳定点击目标 local_contract 已复验；双账号提醒到主页的 gamma_local UAT 尚无实跑证据，保持 GATE_BLOCK，不能以无实际 mention 行为的群管理旅程冒充覆盖。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
