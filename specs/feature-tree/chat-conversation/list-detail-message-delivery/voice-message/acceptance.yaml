      - layer: local_contract
        execution_profile: baseline
        suite: gwt4_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.voice_message.gwt4_local_contract
        envs: *id001
    notes:
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/media/media_test.go'
  GWT5:
    title: 播放、缓存和并发播放状态可用可靠
    given:
    - 消息列表中存在可播放 audio 消息。
    when:
    - 用户点击语音气泡播放、暂停、切换另一条语音。
    - 或缓存命中、缓存失败、下载超时。
    then:
    - 同一时刻只有一个 active voice message。
    - 播放进度驱动气泡波形。
    - 缓存失败降级为流式播放；不可播放失败显示统一错误提示。
    done_when:
    - 播放切换、失败、缓存降级均有测试或 user_acceptance 证据。
    edge_cases:
    - 消息撤回或删除时停止对应播放。
    - URL 空时气泡不可播放并显示发送中/不可播放态。
    contract_refs: []
    performance_points:
    - 播放进度更新不导致消息列表全量重建或掉帧。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_message_bubble_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_player_manager__local_contract_test.dart
