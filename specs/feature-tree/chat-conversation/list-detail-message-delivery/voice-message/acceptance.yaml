version: 2
node:
  id: voice-message
  level: L3_story
  path: specs/feature-tree/chat-conversation/list-detail-message-delivery/voice-message
  title: voice message
  parent_domain_service: chat-conversation
  parent_business_capability: list-detail-message-delivery
scope:
  summary: 聊天语音消息从录音、真实波形、上传、发送到播放的商用化闭环，以及评论 ASR 入口关闭约束。
  in_scope:
  - 趣聊 1v1 和群聊中的按住录音、上滑取消、松手发送。
  - 真实麦克风振幅驱动的录音 HUD 波形。
  - audio 消息 media payload、上传、发送、播放、缓存和失败状态。
  - 麦克风权限、录音、上传、发送、播放、缓存失败的统一错误语义。
  - 评论、回复、文章内联评论、沉浸评论面板无 ASR/语音入口。
  out_of_scope:
  - 评论语音转文字、音频评论附件。
  - 发送语音时附带 ASR 文本。
  - 语音变速播放、连续播放、转发语音。
gwt_acceptance:
  GWT1:
    title: 按住录音展示真实音量波形并松手发送
    given:
    - 用户已进入趣聊对话页，麦克风权限可用。
    - 当前没有其他录音任务正在进行。
    when:
    - 用户切换到语音模式并按住说话。
    - 录音过程中麦克风采集到不同音量。
    - 用户松手发送。
    then:
    - 输入栏和 HUD 展示右进左出的时间序列波形，波形高度随真实振幅变化。
    - 录音低于最短时长不发送并提示过短。
    - 合法录音通过 MediaUploadManager 上传并发送 type=audio 消息。
    - 发送成功后消息气泡可点击播放。
    done_when:
    - 录音、上传、发送、消息展示、播放闭环在 Widget/Provider 测试和 user_acceptance 记录中均有证据。
    edge_cases:
    - 快速按下后立刻松手不会发送。
    - 振幅采样单帧失败不打断录音。
    - 达到最长时长自动停止并进入发送。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml#SendMessage
    - quwoquan_service/contracts/metadata/_shared/types.yaml#MessageType
    performance_points:
    - 录音 HUD 只保留固定窗口采样，长录音不无限增长 UI 状态。
    - 强网录音完成到发送方可播放目标不超过 3 秒。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/components/input/customizable_chat_input_bar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_send_provider__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/pages/chat_conversation_page_composer__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/input/customizable_chat_input_bar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_send_provider__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/pages/chat_conversation_page_composer__local_contract_test.dart
      - file: quwoquan_service/services/chat-service/tests/api_integration/message_audio_contract__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.voice_message.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.voice_message.contract
        envs: *id001
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.chat_conversation.list_detail_message_delivery.voice_message.gwt1_api_integration
        envs: &id002
        - beta
        - gamma
    notes:
    - 真实麦克风、上传、播放的 gamma_local 设备旅程尚无 canonical user_acceptance 记录，禁止用 mock realtime 文件代替。
  GWT2:
    title: 上滑取消、页面退出和并发录音不会产生幽灵录音或重复发送
    given:
    - 用户正在聊天输入栏按住录音。
    when:
    - 用户上滑到取消区域后松手。
    - 或用户在录音中切换页面、App 退后台、权限弹窗打断。
    - 或用户快速重复按下语音按钮。
    then:
    - 取消态松手删除临时文件，不触发上传和 sendMessage。
    - 页面退出或路由切换释放录音资源。
    - 同一时刻最多一个 VoiceRecorder 处于 recording，不重复发送。
    done_when:
    - 取消、释放资源、重复按下均有 local_contract 测试覆盖。
    edge_cases:
    - Pointer cancel 触发取消。
    - onStartRecord 异步返回前用户已松手时取消录音。
    contract_refs: []
    performance_points:
    - 快速连按不创建第二个录音任务。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/components/input/customizable_chat_input_bar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/pages/chat_conversation_page_composer__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/input/customizable_chat_input_bar__local_contract_test.dart
      - file: quwoquan_service/services/chat-service/tests/api_integration/message_audio_contract__api_integration_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt2_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.voice_message.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: gwt2_api_integration
        cases:
        - api_integration.chat_conversation.list_detail_message_delivery.voice_message.gwt2_api_integration
        envs:
        - beta
        - gamma
    notes:
    - '[migrated_from_recorded_reference] 已迁移 canonical run evidence（voice_message_t4_evidence.md）'
  GWT3:
    title: 权限与失败统一映射到临时或永久恢复动作
    given:
    - 录音、上传、发送、播放或缓存任一环节发生失败。
    when:
    - 失败为临时网络、设备占用、播放下载超时。
    - 或失败为永久拒绝权限、文件无效、格式不支持、契约/权限错误。
    then:
    - 临时失败展示可重试或自动恢复动作。
    - 永久或需外部操作失败展示重新录制、去设置、登录或关闭入口。
    - 用户可见文案来自统一错误/权限语义，不直接展示原始异常字符串。
    done_when:
    - 每类失败在 Widget/Provider 测试中至少有一条断言。
    edge_cases:
    - 麦克风永久拒绝提供去设置动作。
    - 缓存失败不阻断播放，降级为流式播放。
    - URL 空或媒体不存在提示不可播放。
    contract_refs:
    - specs/ux/error-and-permission-semantics.md
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/components/input/customizable_chat_input_bar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_send_provider__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_message_bubble_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_player_manager__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/components/input/customizable_chat_input_bar__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_send_provider__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_message_bubble_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_player_manager__local_contract_test.dart
    status: implemented
