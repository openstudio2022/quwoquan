        execution_profile: baseline
        suite: gwt3_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.voice_message.gwt3_local_contract
        envs: *id001
    notes:
    - '[migrated_from_recorded_reference] 已迁移 canonical run evidence（voice_message_t4_evidence.md）'
  GWT4:
    title: audio Message 与 MediaAsset 强类型引用端云一致
    given:
    - 录音生成 VoiceRecordResult，包含 filePath、durationMs、fileSize、waveform。
    when:
    - 上传完成并调用 sendMessage(type=audio)。
    then:
    - SendMessage command 只包含稳定 mediaAssetId，不携带 URL 或动态 media Map。
    - Chat 通过 owner-scoped MediaAsset named Reader 校验资产，并在消息 Slice 返回 deliveryUrl、mediaType、contentType、fileSizeBytes 与音频技术投影。
    - MessageType.audio、mediaAssetId、MessageSent payload 与 metadata/codegen 一致。
    done_when:
    - local_contract contract 和端云契约测试覆盖 audio 消息字段。
    edge_cases:
    - 上传失败不发送 audio 消息。
    - MediaAsset 非 ready、owner 不匹配或 delivery projection 不完整时不得展示为可播放成功态。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/message/service.yaml#SendMessage
    - quwoquan_service/contracts/metadata/messages/message/events.yaml#MessageSent
    - quwoquan_service/contracts/metadata/content/media_asset/service.yaml#GetMediaAssetDeliveryReference
    - quwoquan_service/contracts/metadata/_shared/types.yaml#MessageType
    performance_points:
    - waveform 做采样压缩，避免 120 秒录音产生超大 payload。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/contracts/chat/message_contracts__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/chat/message/contract/message_dto_contract__local_contract_test.dart
      - file: quwoquan_service/runtime/media/media_test.go
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_send_provider__local_contract_test.dart
      recorded:
