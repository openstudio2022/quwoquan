        execution_profile: baseline
        suite: gwt6_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.voice_message.gwt6_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt6_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.voice_message.gwt6_local_contract
        envs: *id001
    notes:
    - 评论域无语音入口仅由评论组件反向契约证明，不借用 Chat audio 或 mock realtime 证据。
