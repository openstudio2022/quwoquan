      - file: quwoquan_app/test/local_contract/cloud/chat/message/contract/message_dto_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/providers/voice_send_provider__local_contract_test.dart
      - file: quwoquan_service/services/chat-service/tests/api_integration/message_audio_contract__api_integration_test.go
    status: partial
    test_evidence:
