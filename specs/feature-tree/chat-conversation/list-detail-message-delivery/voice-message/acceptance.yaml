  GWT6:
    title: 评论和回复入口在 ASR 未支持时不展示语音能力
    given:
    - 用户打开评论弹层、沉浸评论分屏、文章内联评论或回复输入。
    when:
    - ASR 供应商、评论语音契约和 metadata 未正式接入。
    then:
    - 评论输入只展示文本、图片附件和 @ 小趣等已支持能力。
    - 不展示麦克风、语音转文字、音频评论入口。
    - 聊天语音发送链路不被评论复用。
    done_when:
    - 评论组件回归测试断言所有评论入口无 ASR/语音入口。
    edge_cases:
    - 搜索域 ASR 规格不影响评论域入口。
    - 通用输入栏保留 ASR 扩展点时，评论域默认不可启用。
    contract_refs:
    - specs/feature-tree/global-search-experience/cross-domain-search-journey/recent-search-sync-and-voice-asr/spec.md
    performance_points: []
    tests:
      planned:
