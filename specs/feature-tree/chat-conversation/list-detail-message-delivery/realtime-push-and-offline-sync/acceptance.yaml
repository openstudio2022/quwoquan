version: 2
node:
  id: realtime-push-and-offline-sync
  level: L3_story
  path: specs/feature-tree/chat-conversation/list-detail-message-delivery/realtime-push-and-offline-sync
  title: realtime push and offline sync
  parent_domain_service: chat-conversation
  parent_business_capability: list-detail-message-delivery
scope:
  summary: Production Remote-only realtime 连接、alpha runner 物理隔离 fixture、生命周期接线与聊天页实时更新验收。
  in_scope:
  - '`RealtimeConnectionDelegate`、`RealtimeConnectionNotifier` 与 `realtimeConnectionManagerProvider`
    的唯一 production Remote 入口。'
  - alpha runner 通过 composition-root override 注入 fixture delegate，production kernel 不可达。
  - '`QuWoQuanAppRoot` 的 foreground/background lifecycle 接线。'
  - Remote idle long-poll、active websocket、background disconnect 的最小状态机闭环。
  - '`chat_realtime_fixture_core` fixture 驱动的 `MessageSent` 与 `ConversationMemberAdded` alpha realtime
    事件。'
  - '`ChatConversationPage` 在 alpha composition 下通过 realtime handler 追加新消息。'
  out_of_scope:
  - 服务端 EventPublisher 与 Redis realtime fanout。
  - FCM/APNs 离线推送与通知点击直达聊天页。
  - '`/config/realtime` 配置拉取与热更新。'
  - 全量 seq gap fill、断线补洞、多设备同步。
gwt_acceptance:
  GWT1:
    title: alpha composition 进入聊天只走 runner-owned fixture 状态机
    given:
    - alpha runner 已显式覆盖 realtime notifier，会话 fixture `conv_001` 已打包。
    - App 已处于前台并通过 `realtimeConnectionManagerProvider` 驱动连接状态。
    when:
    - 用户进入 `ChatConversationPage('conv_001')`。
    then:
    - 连接状态切到 `TransportState.active`。
    - 300-400ms 内消息列表新增来自 `chat_realtime_fixture_core` 的 `MessageSent`。
    - alpha fixture 路径不依赖 remote LongPoll / WebSocket outbound 请求。
    done_when:
    - alpha delegate、composition override 与 widget 测试都能证明“进聊天即有新消息”链路成立。
    edge_cases:
    - 页面卸载前先 `onAppBackground`，不会残留 120s idle timer 导致测试不稳定。
    - fixture 缺失时不推送任何伪造事件；新增场景必须先登记 contract fixture。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/chat/test_fixtures/scenarios/chat_scenarios.json
    - quwoquan_service/contracts/metadata/_shared/test_fixtures/app_alpha_seed_manifest.json
    performance_points:
    - mock 追加消息目标在 400ms 内可见，足够支撑 alpha 演示和 widget 自动化测试。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_fixture_delegate__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_conversation_realtime_fixture__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_fixture_delegate__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/chat/widgets/chat_conversation_realtime_fixture__local_contract_test.dart
      - file: quwoquan_service/services/chat-service/tests/api_integration/contract_fixture_seed_contract__api_integration_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt1_local_contract
        envs: *id001
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes: []
  GWT2:
    title: 群聊 fixture 的 ConversationMemberAdded 事件能走统一 handler 分支
    given:
    - 群聊 fixture `fixture_conv_group` 已在 `chat_realtime_fixture_core` 登记 `ConversationMemberAdded`
      realtime 事件。
    when:
    - test/alpha fixture catalog 把事件交给 `RealtimeMessageHandler` 处理。
    then:
    - 会话消息列表新增系统消息，文案指向新成员加入群聊。
    - handler 不需要 UI 特判，也不依赖 test-only helper。
    done_when:
    - '`ConversationMemberAdded` 作为独立分支有专门测试证据，且能在 contract fixture 中追溯到对应 payload。'
    edge_cases:
    - 未识别事件类型不会中断整个 handler 分发流程。
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/chat/test_fixtures/scenarios/chat_scenarios.json
    performance_points:
    - 单个 realtime 事件应同步插入 provider，不引入额外轮询等待。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_conversation_member_added_handler__functional__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_conversation_member_added_handler__functional__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt2_local_contract
        envs: *id001
    notes: []
  GWT3:
    title: Remote foreground idle / active / background 状态切换可验证
    given:
    - production composition 固定 Remote，`currentUserIdProvider` 可解析出有效用户 ID。
    - realtime gateway URL 与 metadata/codegen 已生成。
    when:
    - App 从 background 回到 foreground。
    - 用户进入聊天页。
    - 用户离开页面或 App 退后台。
    then:
    - foreground 时切到 `TransportState.idle` 并启动 long-poll。
    - enter chat 时停止 long-poll 并发起 websocket connect。
    - background 时 teardown transport 并回到 `TransportState.disconnected`。
    done_when:
    - remote lifecycle focused tests 与 transport contract tests 同时通过。
    edge_cases:
    - '`inactive` 不触发 background 断连。'
    - 非 active 态调用 `onLeaveConversation()` 不应再额外启动 idle timer。
    contract_refs:
    - quwoquan_service/contracts/metadata/realtime/connection/service.yaml
    - quwoquan_app/lib/cloud/runtime/generated/realtime/realtime_api_metadata.g.dart
    - quwoquan_app/lib/cloud/runtime/generated/realtime/realtime_request_page_ids.g.dart
    performance_points:
    - 状态切换不引入重复 transport 实例或 leaked reconnect timer。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/realtime/remote_realtime_lifecycle__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_transport_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_lifecycle_mapping__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_root_startup__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/realtime/remote_realtime_lifecycle__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_transport_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_lifecycle_mapping__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_root_startup__local_contract_test.dart
      - file: quwoquan_service/services/chat-service/tests/api_integration/message_sync_contract__api_integration_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt3_local_contract
        envs: *id001
      - layer: api_integration
        suite: gwt3_api_integration
        cases:
        - api_integration.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt3_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt3_local_contract
        envs: *id001
    notes: []
  GWT4:
    title: Production Remote 与 alpha fixture 通过 composition root 物理隔离
    given:
    - production provider 使用 `RealtimeConnectionNotifier` 默认 Remote factory。
    - alpha runner 覆盖整个 notifier，并从生成的 immutable fixture bundle 取事件。
    when:
    - 运行时 `appDataSourceMode` 发生变化，或构建 production kernel/AOT。
    then:
    - realtime notifier 不观察 mode，也不会重建或替换已装配 delegate。
    - production source 不包含 fixture delegate/catalog，且不依赖 `quwoquan_cloud_mock`。
    - alpha fixture 不读取仓库文件，production 无失败回退或热切换入口。
    done_when:
    - composition isolation test、package boundary gate 与 production dependency purity 同时通过。
    edge_cases:
    - active delegate 生命周期内 mode 变化不得销毁 transport 或注入另一实现。
    contract_refs:
    - specs/gates/mock_data_cloud_integration_policy.md
    - quwoquan_app/runners/alpha/lib/alpha_realtime_connection_delegate.dart
    performance_points:
    - composition 固定后不因无关 mode 状态产生额外 delegate 或 timer。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_composition_isolation__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/realtime/realtime_composition_isolation__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt4_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt4_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: gwt4_local_contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.realtime_push_and_offline_sync.gwt4_local_contract
        envs: *id001
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
