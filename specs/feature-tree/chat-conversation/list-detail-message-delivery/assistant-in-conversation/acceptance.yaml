version: 2
node:
  id: assistant-in-conversation
  level: L3_story
  path: specs/feature-tree/chat-conversation/list-detail-message-delivery/assistant-in-conversation
  title: assistant in conversation
  parent_domain_service: chat-conversation
  parent_business_capability: list-detail-message-delivery
scope:
  summary: 小趣作为会话成员参与消息验收范围。
  in_scope:
  - assistant memberType 成员生命周期
  - mention 事实与 AssistantMentioned 事件发布
  out_of_scope:
  - 小趣回复生成（归 runtime-assistant/assistant-mentioned-consumer）
gwt_acceptance:
  GWT1:
    title: 会话内 @小趣 事件链
    given:
    - 会话中含 memberType=assistant 的小趣成员。
    when:
    - 用户发送 @小趣 消息。
    then:
    - chat 域持久化 mention 事实并发布 AssistantMentioned 到可靠事件流。
    done_when:
    - 小趣被移除后新 mention 不再发布事件；AssistantRemoved 生效。
    edge_cases:
    - 小趣成员被移除后的历史 mention
    - 重复 mention 幂等
    contract_refs:
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml
    performance_points: []
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/chat-service/tests/api_integration/assistant_mentioned_stream_contract__api_integration_test.go
      - file: quwoquan_service/services/assistant-service/tests/local_contract/assistant_mentioned_chat_contract__local_contract_test.go
      - file: quwoquan_app/test/user_acceptance/journeys/chat/chat_assistant_journey__user_acceptance_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.chat_conversation.list_detail_message_delivery.assistant_in_conversation.contract
        envs: &id001
        - local
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.chat_conversation.list_detail_message_delivery.assistant_in_conversation.gwt1_api_integration
        envs:
        - beta
        - gamma
      supporting: []
    notes:
    - 2026-07-20 补建 story 目录以修复 journey_scenario_registry 引用漂移；既有 chat/assistant 双侧事件流测试回填为 recorded 证据。
execution:
