    - '[migrated_from_planned] quwoquan_app/test/cloud/user/greeting_repository_contract_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/chat/pages/greeting_request_inbox_test.dart'
    - '[migrated_from_planned] runtime/reports/contact_session_governance_t4_evidence.md'
  SIT4:
    title: 私信与 1v1 RTC 服务端门禁不可绕过
    story_refs:
    - direct-conversation-gate
    - send-message-gate
    - rtc-relationship-gate
    done_when:
    - CreateConversation 对 direct 1v1 校验 mutual 或 replied greeting；非授权状态不创建 conversation。
    - SendMessage 校验 conversation 成员、非 blocked、会话未只读；不依赖端侧按钮作为唯一防线。
    - 1v1 RTC 发起校验 mutual 且未 blocked；非 mutual 或 blocked 返回 metadata 生成的结构化错误。
    - 端侧按钮、输入区、错误态与服务端错误语义一致。
    performance_points:
    - SendMessage 门禁校验额外耗时 p95 <= 20ms。
    tests:
      planned:
      - file: quwoquan_service/services/chat-service/tests/direct_conversation_relationship_gate_test.go
      - file: quwoquan_service/services/chat-service/tests/send_message_relationship_gate_test.go
      - file: quwoquan_service/services/rtc-service/tests/one_to_one_relationship_gate_test.go
