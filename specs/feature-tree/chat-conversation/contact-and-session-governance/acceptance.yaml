version: 2
node:
  id: contact-and-session-governance
  level: L2_business_capability
  path: specs/feature-tree/chat-conversation/contact-and-session-governance
  title: 关注、拉黑与私信治理
  parent_domain_service: chat-conversation
  parent_business_capability: contact-and-session-governance
scope:
  summary: 以“关注”为唯一关系概念，验证关注状态、拉黑门禁、打招呼请求箱、正式私信与 1v1 RTC 的端云一致性。
  in_scope:
  - RelationshipState 只保留 self/not_following/following/followed_by/mutual，mutual 不命名为额外关系等级。
  - BlockEdge 作为最高优先级门禁，创建拉黑边时清除双方 FollowEdge、失效 pending GreetingRequest，并阻断关注、打招呼、建会话、发消息和
    1v1 RTC。
  - 非 mutual 用户只能通过 GreetingRequest 进入请求箱，回复后创建或复用正式 1v1 conversation。
  - CreateConversation、SendMessage、RTC 发起必须有服务端关系门禁与结构化错误。
  - 主页动作、请求箱、正式会话、blocked 会话四态与 RelationshipCapabilityView 保持一致。
  out_of_scope:
  - 好友、同好、密友、挚友等关系等级。
  - 群对象拉黑、关系积分、亲密度、勋章。
  - 群组空间、相册、文件库能力。
sit_acceptance:
  SIT1:
    title: 关注状态机与关系能力位单一真相源
    story_refs:
    - relationship-state-contract
    done_when:
    - RelationshipState 枚举、RelationshipCapabilityView、主页动作矩阵和会话入口都只消费 self/not_following/following/followed_by/mutual。
    - 规格、契约、端侧 UI、Remote/Mock 和测试中不存在作为关系等级的旧字段。
    - mutual 仅由双向 FollowEdge 派生，不持久化第二套关系实体。
    performance_points:
    - 关系能力读取 p95 <= 150ms。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.chat_conversation.contact_and_session_governance.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: local_contract
