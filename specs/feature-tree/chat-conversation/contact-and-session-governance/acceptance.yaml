        suite: sit1_api_integration
        cases:
        - api_integration.chat_conversation.contact_and_session_governance.sit1.sit1_api_integration
        envs: &id002
        - beta
        - gamma
    notes:
    - '[migrated_from_planned] quwoquan_app/test/cloud/user/relationship_capability_contract_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/user/widgets/profile_action_bar_relationship_state_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/chat/pages/chat_conversation_relationship_gate_test.dart'
    - '[migrated_from_planned] quwoquan_service/services/user-service/tests/follow_relationship_capability_contract_test.go'
  SIT2:
    title: 拉黑门禁级联与取消拉黑不自动恢复关系
    story_refs:
    - block-gate-cascade
    done_when:
    - 创建 BlockEdge 幂等，并删除双方 FollowEdge、失效双方 pending GreetingRequest、发布 UserBlocked。
    - 任一方向存在拉黑时，关注、打招呼、建会话、SendMessage、1v1 RTC 均由服务端拒绝。
    - 取消拉黑只删除 BlockEdge 并发布 UserUnblocked，不恢复关注边和 blocked 请求。
    - 既有 1v1 conversation 只读保留，不能继续发送新消息。
    performance_points:
    - 拉黑写入到所有门禁生效 p95 <= 1s。
    tests:
      planned:
      - file: quwoquan_service/services/user-service/tests/block_cascade_contract_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit2_local_contract
        cases:
        - local_contract.chat_conversation.contact_and_session_governance.sit2.sit2_local_contract
        envs: *id001
      - layer: api_integration
        suite: sit2_api_integration
        cases:
        - api_integration.chat_conversation.contact_and_session_governance.sit2.sit2_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: sit2_local_contract
        cases:
        - local_contract.chat_conversation.contact_and_session_governance.sit2.sit2_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/services/chat-service/tests/message_block_gate_contract_test.go'
    - '[migrated_from_planned] quwoquan_service/services/rtc-service/tests/one_to_one_block_gate_contract_test.go'
    - '[migrated_from_planned] quwoquan_app/test/ui/chat/pages/blocked_conversation_widget_test.dart'
  SIT3:
    title: 打招呼请求箱与回复建正式私信
    story_refs:
    - greeting-request-inbox
    - greeting-reply-promotes-conversation
    done_when:
    - 非 mutual 且未拉黑用户可发起一条 pending GreetingRequest，请求不进入普通会话列表。
    - 同一 requester-target 只能存在一条 pending 请求，重复创建返回结构化错误。
    - 接收方回复 pending 请求后创建或复用 1v1 conversation，并写入 promotedConversationId。
    - 回复建会话不自动创建 FollowEdge，不改变 RelationshipState。
    performance_points:
    - 打招呼回复到正式会话可见 p95 <= 2s。
    tests:
      planned:
      - file: quwoquan_service/services/user-service/tests/greeting_request_state_machine_test.go
      recorded: []
    status: pending
    test_evidence:
