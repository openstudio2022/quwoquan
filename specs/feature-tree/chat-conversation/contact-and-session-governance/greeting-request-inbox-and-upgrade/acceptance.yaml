version: 2
node:
  id: greeting-request-inbox-and-upgrade
  level: L3_story
  path: specs/feature-tree/chat-conversation/contact-and-session-governance/greeting-request-inbox-and-upgrade
  title: 打招呼请求箱与正式会话升级
  parent_domain_service: chat-conversation
  parent_business_capability: contact-and-session-governance
scope:
  summary: 非互相关注用户先进入独立打招呼请求箱，接收方回复后幂等升级正式一对一会话。
  journey_scenarios:
  - message-direct-and-greeting-upgrade
  out_of_scope:
  - 自动创建关注关系
  - 正式会话消息收发
  - 外部 push provider
gwt_acceptance:
  GWT1:
    title: pending 请求与普通会话隔离
    given:
    - 双方非互相关注、未拉黑且接收方允许陌生打招呼。
    when:
    - 发起方发送打招呼请求。
    then:
    - 只创建一条 pending GreetingRequest。
    - 请求进入独立收发箱，不进入普通会话列表。
    - 重复 pending、拉黑、频控与接收偏好由服务端结构化拒绝。
    done_when:
    - 请求箱隔离、唯一性和门禁具有端云测试证据。
    edge_cases:
    - 同 pair 重复发送
    - 任一方向拉黑
    - 请求过期、忽略或撤回
    contract_refs:
    - quwoquan_service/contracts/metadata/user/greeting_request/service.yaml
    - quwoquan_service/contracts/metadata/user/greeting_request/errors.yaml
    performance_points:
    - SendGreetingRequest 延迟满足 metadata SLO。
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/user-service/tests/api_integration/greeting_request_state_machine__api_integration_test.go
      - file: quwoquan_app/test/local_contract/cloud/user/contract/greeting_repository_contract__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/journeys/chat/greeting_inbox_journey__user_acceptance_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: greeting_request_state_machine
        cases:
        - api_integration.chat_conversation.contact_and_session_governance.greeting_request_inbox
        envs: &integration_envs
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: greeting_repository_contract
        cases:
        - local_contract.chat_conversation.contact_and_session_governance.greeting_request_inbox
        envs: &local_env
        - local
      - layer: user_acceptance
        execution_profile: release
        suite: greeting_inbox_journey
        cases:
        - user_acceptance.chat_conversation.contact_and_session_governance.greeting_request_inbox
        envs:
        - gamma_local
  GWT2:
    title: 回复请求幂等升级正式会话
    given:
    - 接收方拥有一条未过期、未拉黑的 pending GreetingRequest。
    when:
    - 接收方回复请求。
    then:
    - 服务端创建或复用 direct conversation，并写回 promotedConversationId。
    - 请求状态变为 replied，正式会话进入普通会话列表。
    - 回复不会自动创建关注边。
    done_when:
    - 会话升级、幂等与关注状态不变均有 API 集成证据。
    edge_cases:
    - 重复回复
    - 回复时关系已被拉黑
    - 已存在 direct conversation
    contract_refs:
    - quwoquan_service/contracts/metadata/user/greeting_request/service.yaml
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml
    performance_points:
    - 回复到正式会话可见 p95 <= 2s。
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/user-service/tests/api_integration/greeting_request_state_machine__api_integration_test.go
      - file: quwoquan_service/services/chat-service/tests/api_integration/direct_conversation_relationship_gate__api_integration_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: api_integration
        execution_profile: integration
        suite: greeting_reply_promotion
        cases:
        - api_integration.chat_conversation.contact_and_session_governance.greeting_reply_promotion
        envs: *integration_envs
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: greeting_repository_contract
        cases:
        - local_contract.chat_conversation.contact_and_session_governance.greeting_reply_promotion
        envs: *local_env
contract_acceptance:
  CONTRACT1:
    title: 请求箱与会话升级使用单轨 metadata 契约
    metadata_refs:
    - quwoquan_service/contracts/metadata/user/greeting_request/service.yaml
    - quwoquan_service/contracts/metadata/user/greeting_request/fields.yaml
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml
    done_when:
    - GreetingRequest 状态、错误、事件和 promotedConversationId 由 metadata/codegen 单轨生成。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/user/contract/greeting_repository_contract__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: greeting_contract
        cases:
        - local_contract.chat_conversation.contact_and_session_governance.greeting_contract
        envs: *local_env
      supporting: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
