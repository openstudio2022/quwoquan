version: 2
node:
  id: recommendation-platform
  level: L1_domain_service
  path: specs/feature-tree/recommendation-platform
  title: recommendation platform
  parent_domain_service: recommendation-platform
scope:
  summary: recommendation platform 验收范围，覆盖训练、推理、评估飞轮与真实流量晋升边界。
  in_scope:
  - rec-model-training 训练管线与部署。
  - rec-model-service 推理 API 与 Go 集成。
  - evaluation-and-flywheel 离线 replay、在线 AB 与真实训练晋升规格。
  out_of_scope:
  - 深度排序模型平台轨不进入当前商用成熟度门槛。
domain_acceptance:
  DA1:
    title: recommendation platform 领域边界验收
    done_when:
    - 领域边界、上下游依赖、工程映射和服务治理清晰。
    - evaluation-and-flywheel 的离线 replay、在线 AB 与真实训练晋升规格已登记，且不与训练/推理服务职责混淆。
    boundary_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: da1_local_contract
        cases:
        - local_contract.recommendation_platform.domain_service.da1.da1_local_contract
        envs:
        - local
      - layer: api_integration
        execution_profile: integration
        suite: da1_api_integration
        cases:
        - api_integration.recommendation_platform.domain_service.da1.da1_api_integration
        envs:
        - beta
        - gamma
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_service/services/rec-model-service/scripts/tests/test_replay_evaluation.py'
    - '[migrated_from_planned] quwoquan_service/services/rec-model-service/scripts/tests/test_ab_significance.py'
    - '[migrated_from_planned] quwoquan_service/services/rec-model-service/scripts/tests/test_training_promotion_gate.py'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
