version: 2
node:
  id: offline-replay-evaluation
  level: L3_story
  path: specs/feature-tree/recommendation-platform/evaluation-and-flywheel/offline-replay-evaluation
  title: offline replay evaluation
  parent_domain_service: recommendation-platform
  parent_business_capability: evaluation-and-flywheel
scope:
  summary: 推荐策略离线 replay 评估规格。
  in_scope:
  - replay 数据集、NDCG/Recall@K/MAP/覆盖率/多样性/校准误差、协同召回 lift 和 fact/affinity 解释 CTR。
  out_of_scope:
  - 批量调度、数据仓库 ETL 或深排训练 replay 平台。
gwt_acceptance:
  GWT1:
    title: 离线 replay 评估 GWT
    given:
    - 存在过往请求、候选、曝光和反馈样本。
    when:
    - 新推荐策略准备进入线上 AB。
    then:
    - replay 输出质量指标和回归结论，低于门槛不得晋升。
    done_when:
    - 指标、报告字段、数据窗口、invalid 原因、版本归因和晋升门槛均冻结。
    edge_cases:
    - 样本不足时报告标记 invalid，不允许冒充通过。
    contract_refs:
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    performance_points:
    - offline_ndcg_at_k >= 0.20
    - offline_recall_at_k >= 0.25
    - offline_diversity_rate >= 0.30
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/runtime/recommendation/offline_replay_evaluation__local_contract_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.recommendation_platform.evaluation_and_flywheel.offline_replay_evaluation.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.recommendation_platform.evaluation_and_flywheel.offline_replay_evaluation.gwt1_local_contract
        envs: *id001
      supporting: []
    notes:
    - P1b 已实现 runtime/recommendation replay dataset/report 纯函数；正式 recorded 证据仅登记 canonical
      local_contract，批量 ETL/调度仍不在本轮。
    - P1d-2 PremiumPoolSource 启用前，replay dataset/report 必须能按 `recallPath=premium_pool`、`supplySource`
      和 `intersectionClass` 分桶输出指标；低流量分桶仅诊断，不单独作为晋级依据。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
