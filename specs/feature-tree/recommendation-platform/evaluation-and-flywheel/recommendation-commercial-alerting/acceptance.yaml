version: 2
node:
  id: recommendation-commercial-alerting
  level: L3_story
  path: specs/feature-tree/recommendation-platform/evaluation-and-flywheel/recommendation-commercial-alerting
  title: recommendation commercial alerting
  parent_domain_service: recommendation-platform
  parent_business_capability: evaluation-and-flywheel
scope:
  summary: 非深排推荐商用成熟度 P1a 归因告警契约。
  in_scope:
  - unknown attribution rate 告警。
  - 负反馈率按 supply_source/channel/vertical 分桶告警。
  - CTR 按 recall_path/channel/vertical 分桶告警。
  - 旅行与精品场景消费率告警。
  - UGC 与数据工程供给 share 失衡告警。
  out_of_scope:
  - 深排平台、双塔 ANN、MMoE/PLE/ESMM、IPS/Thompson 或同步 scorer。
  - 离线 replay 脚本、在线 AB 平台或真实流量训练晋升。
  - product-ops 全局精品池写入、审计、过期、回滚和下架实时剔除。
gwt_acceptance:
  GWT1:
    title: 推荐商用归因告警 GWT
    given:
    - P0+ 推荐归因指标已按 bounded labels 暴露。
    - P1 推荐商用归因看板已固定 dashboard 源文件和 SLO 入口。
    when:
    - 归因丢失、负反馈异常、召回路径 CTR 下滑、旅行/精品消费断崖或供给来源失衡持续发生。
    then:
    - Prometheus 告警在 quwoquan_rec_model 组内触发，并能从标签定位 channel、vertical、supply_source 或 recall_path。
    done_when:
    - recommendation_slo.yaml、quwoquan_alerts.yaml、acceptance.yaml 与 local_contract 同步锁定。
    - 告警不引用 objective_only 指标冒充已观测能力。
    edge_cases:
    - 低流量分桶只作为告警排查入口，不作为策略晋升或 AB 显著性结论。
    - unknown attribution 告警必须单独暴露，避免端云字段丢失被总量指标掩盖。
    contract_refs:
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    - deploy/monitoring/alerts/quwoquan_alerts.yaml
    performance_points:
    - recommendation_attribution_bucket_coverage >= 0.95
    - attribution_negative_feedback_rate <= 0.08
    - attribution_ctr_by_recall_path >= 0.03
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/content-service/tests/local_contract/internal/application/recommendation_alerts_contract__local_contract_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: recommendation_alerts_contract
        cases:
        - local_contract.recommendation_platform.evaluation_and_flywheel.recommendation_commercial_alerting.contract
        envs:
        - local
      supporting:
      - layer: api_integration
        suite: recommendation_commercial_alerting_api
        cases:
        - api_integration.recommendation_platform.evaluation_and_flywheel.recommendation_commercial_alerting.metrics
        envs:
        - beta
        - gamma
    notes:
    - 本 Story 只告警 P0+ 已真实 emit 的归因指标；离线 replay、在线 AB、训练晋升和精品池运营入口仍是独立后续任务。
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
