version: 2
node:
  id: online-ab-significance
  level: L3_story
  path: specs/feature-tree/recommendation-platform/evaluation-and-flywheel/online-ab-significance
  title: online ab significance
  parent_domain_service: recommendation-platform
  parent_business_capability: evaluation-and-flywheel
scope:
  summary: 推荐策略在线 AB 显著性、样本量与分桶稳定性规格。
  in_scope:
  - champion/challenger、分桶标签、样本量、SRM、显著性、relative lift、晋级/回滚结论和护栏指标。
  out_of_scope:
  - 本轮不实现 AB 框架或线上流量切分。
gwt_acceptance:
  GWT1:
    title: 在线 AB 显著性 GWT
    given:
    - 新推荐策略已通过离线 replay。
    when:
    - 策略进入线上 challenger。
    then:
    - 系统按稳定分桶收集北极星与护栏指标，样本量不足或显著性不足不得晋升。
    done_when:
    - 分桶标签、样本量口径、SRM、显著性判定、保护指标和报告字段均规格化。
    edge_cases:
    - 实验污染或分桶漂移时标记 invalid。
    contract_refs:
    - quwoquan_service/services/content-service/configs/observability/recommendation_slo.yaml
    performance_points:
    - ab_experiment_validity >= 0.95
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/content-service/tests/local_contract/runtime/recommendation/online_ab_significance__local_contract_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.recommendation_platform.evaluation_and_flywheel.online_ab_significance.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.recommendation_platform.evaluation_and_flywheel.online_ab_significance.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.recommendation_platform.evaluation_and_flywheel.online_ab_significance.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - P1c 已实现 BuildABExperimentReport 与 EvaluateABAdmissionWithGuardrails；正式 recorded
      证据仅登记 canonical local_contract，真实线上流量切分仍由既有 experiment bucket 能力承载。
    - P1d-2 PremiumPoolSource 灰度前，AB report 必须能按 `premium_pool` recall_path、精品场景、UGC/数据工程供给和交集类别分桶呈现主指标与保护指标；低流量诊断桶不得单独触发晋级。
