version: 2
node:
  id: app-root
  level: AppRoot
  path: specs/feature-tree
  title: app root title

scope:
  summary: app-level UAT summary
  journey_refs:
    - journey-id
  scenario_refs:
    - scenario-id
  out_of_scope:
    - item

uat_acceptance:
  UAT1:
    title: user journey acceptance title
    journey: end-to-end user journey
    scenario_refs:
      - scenario-id
    experience_points:
      - user-visible experience point
    platforms:
      - iOS
      - Android
    done_when:
      - observable user outcome
    quality_facets:
      - functional
      - experience
      - observability
    test_object: page
    slo_refs:
      - specs or SLO document path
    observability_refs:
      - metric, log, trace or dashboard reference
    security_refs: []
    performance_points:
      - action-to-feedback latency target
      - animation jank threshold
    test_evidence:
      primary:
        - layer: user_acceptance
          suite: journey_primary
          cases:
            - user_acceptance.journey-id.scenario-id.primary
          envs: [gamma_local, prod]
          execution_profile: release
          rollout_stages: [gray_initial]
          test_object: page
          quality_facet: experience
      supporting:
        - layer: api_integration
          suite: app_root_supporting_api
          cases:
            - api_integration.domain.operation.primary
          envs: [beta, gamma]
          execution_profile: integration
          test_object: api_operation
          quality_facet: contract
    tests:
      planned:
        - command: replace-with-real-user-acceptance-command
      recorded: []
    status: pending

execution:
  local_gate:
    - make gate
  smoke_gate:
    - make gate-smoke
  integration_gate:
    - make gate-integration ENV=beta
  release_gate:
    - make gate-release ENV=gamma
