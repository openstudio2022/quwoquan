version: 2
node:
  id: story-id
  level: L3_story
  path: specs/feature-tree/domain-service-id/business-capability-id/story-id
  title: story title
  parent_domain_service: domain-service-id
  parent_business_capability: business-capability-id

scope:
  summary: minimum closed-loop value point
  journey_scenarios:
    - scenario-id
  out_of_scope:
    - item

gwt_acceptance:
  GWT1:
    title: primary behavior
    given:
      - precondition
    when:
      - user or system action
    then:
      - observable result
    done_when:
      - minimum value is complete
    quality_facets:
      - functional
      - experience
    test_object: widget
    slo_refs:
      - specs or SLO document path
    observability_refs:
      - metric, log, trace or dashboard reference
    security_refs: []
    edge_cases:
      - empty state
      - permission denied
    platform_variants:
      iOS:
        - iOS-specific behavior
      Android:
        - Android-specific behavior
    contract_refs:
      - route, metadata, platform policy, or config contract
    performance_points:
      - story-level latency or jank target
    test_evidence:
      primary:
        - layer: local_contract
          suite: story_primary_behavior
          cases:
            - local_contract.domain.capability.story.primary
          envs: [local]
          execution_profile: baseline
          execution_profile: baseline
          test_object: widget
          quality_facet: functional
      supporting:
        - layer: api_integration
          suite: story_remote_flow
          cases:
            - api_integration.domain.operation.story_case
          envs: [beta, gamma]
          execution_profile: integration
          test_object: api_operation
          quality_facet: contract
    tests:
      planned:
        - command: replace-with-real-story-test-command
      recorded: []
    status: pending

contract_acceptance:
  CONTRACT1:
    title: interface contract
    metadata_refs:
      - contracts/metadata/domain/entity/service.yaml
    done_when:
      - API path, operation, DTO, error and route/surface constants come from metadata
    quality_facets:
      - contract
      - observability
    test_object: metadata
    slo_refs: []
    observability_refs:
      - metric, log, trace or dashboard reference
    security_refs: []
    test_evidence:
      primary:
        - layer: local_contract
          suite: story_metadata_contract
          cases:
            - local_contract.domain.metadata.contract
          envs: [local]
          execution_profile: baseline
          test_object: metadata
          quality_facet: contract
      supporting: []
    tests:
      planned:
        - command: replace-with-real-metadata-contract-command
      recorded: []
    status: pending

execution:
  local_gate:
    - make gate
  smoke_gate:
    - make gate-smoke
  integration_gate:
    - make gate-integration ENV=beta
  release_gate:
    - make gate-release ENV=gamma
