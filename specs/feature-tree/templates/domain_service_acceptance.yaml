version: 2
node:
  id: domain-service-id
  level: L1_domain_service
  path: specs/feature-tree/domain-service-id
  title: domain service title

scope:
  summary: domain boundary and service governance summary
  app_modules: []
  metadata_domains: []
  services: []
  test_paths: []

domain_acceptance:
  DA1:
    title: domain boundary acceptance
    done_when:
      - domain-owned objects are explicit
      - upstream and downstream dependencies are explicit
      - app, metadata, service, deploy and test mappings are registered
    test_evidence:
      primary:
        - layer: local_contract
          suite: domain_boundary_local_contract
          cases:
            - local_contract.domain.boundary.static_contract
          envs: [local]
        - layer: api_integration
          suite: domain_boundary_api_integration
          cases:
            - api_integration.domain.service.contract
          envs: [beta, gamma]
      supporting:
        - layer: user_acceptance
          suite: domain_user_acceptance
          cases:
            - user_acceptance.journey-id.scenario-id.domain_effect
          envs: [gamma_local, prod_gray_initial]
    tests:
      planned:
        - command: replace-with-real-domain-gate-or-test-command
      recorded: []
    status: pending

execution:
  local_gate:
    - make gate
  full_gate:
    - make gate-full
