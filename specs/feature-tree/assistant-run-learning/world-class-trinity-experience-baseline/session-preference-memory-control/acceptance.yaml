version: 2
node:
  id: session-preference-memory-control
  level: L3_story
  path: specs/feature-tree/assistant-run-learning/world-class-trinity-experience-baseline/session-preference-memory-control
  title: 会话偏好即时生效与记忆可撤销
  parent_domain_service: assistant-run-learning
  parent_business_capability: world-class-trinity-experience-baseline
scope:
  summary: 结构化偏好事实的即时注入、可见、遗忘和撤销恢复。
  in_scope:
    - session preference injection
    - long-term preference management
    - owner-scoped revoke and restore
  out_of_scope:
    - vector memory
    - implicit personality inference
gwt_acceptance:
  GWT1:
    title: 会话偏好立即影响下一次回答
    given:
      - 用户已有一个可续聊的 assistant conversation
    when:
      - 用户选择结构化重新生成风格并继续提问
    then:
      - 下一次 Run 的模型请求收到同 conversation 的 session preference
      - 用户原始问题不被拼接风格前缀
      - 其他 conversation 不继承该 session preference
    done_when:
      - 服务与 App local_contract 通过
    edge_cases:
      - 偏好上报失败时不得伪装为已生效
    contract_refs:
      - quwoquan_service/contracts/metadata/assistant/assistant_preference_fact/service.yaml
    performance_points:
      - 偏好读取包含在 StartAssistantRun 的 1500ms P95 预算内
    tests:
      planned:
        - file: quwoquan_service/services/assistant-service/internal/application/preference_fact_service__local_contract_test.go
        - file: quwoquan_app/test/local_contract/ui/assistant/personal_assistant_stream_controller__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: preference_injection
          cases:
            - local_contract.assistant_run_learning.world_class_trinity_experience_baseline.session_preference_memory_control.preference_injection
          envs: [local]
      supporting: []
    notes: []
  GWT2:
    title: 用户遗忘偏好并撤销恢复
    given:
      - 管理页展示 owner 的 active preference facts
    when:
      - 用户遗忘一个事实并在撤销窗口内恢复
    then:
      - 遗忘后列表和运行时召回立即排除该事实
      - 恢复后列表和运行时召回重新包含该事实
      - 非 owner 始终得到 not-found
    done_when:
      - local_contract、真实存储 api_integration 和页面 user_acceptance 通过
    edge_cases:
      - 重复遗忘与重复恢复保持幂等
      - 撤销窗口过期后恢复失败关闭
    contract_refs:
      - quwoquan_service/contracts/metadata/assistant/assistant_preference_fact/service.yaml
    performance_points:
      - 偏好读写 P95 不超过 500ms
    tests:
      planned:
        - file: quwoquan_service/services/assistant-service/tests/api_integration/preference_fact__api_integration_test.go
        - file: quwoquan_app/test/local_contract/ui/assistant/assistant_management_page_preference__local_contract_test.dart
        - file: quwoquan_app/test/user_acceptance/pages/assistant/assistant_management/assistant_memory_revoke_restore__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          execution_profile: baseline
          suite: preference_revoke_restore
          cases:
            - local_contract.assistant_run_learning.world_class_trinity_experience_baseline.session_preference_memory_control.preference_revoke_restore
          envs: [local]
        - layer: api_integration
          execution_profile: integration
          suite: preference_store
          cases:
            - api_integration.assistant_run_learning.world_class_trinity_experience_baseline.session_preference_memory_control.preference_store
          envs: [gamma]
      supporting:
        - layer: user_acceptance
          execution_profile: user_journey
          suite: management_memory
          cases:
            - user_acceptance.assistant_run_learning.world_class_trinity_experience_baseline.session_preference_memory_control.management_memory
          envs: [beta, gamma]
    notes: []
execution:
  local_gate:
    - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
    - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
    - make gate
