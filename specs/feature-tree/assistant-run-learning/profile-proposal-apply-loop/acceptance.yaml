      - file: quwoquan_service/services/user-service/tests/api_integration/profile_update_proposal_store__api_integration_test.go
      - file: quwoquan_app/test/local_contract/cloud/user/profile_update_proposal_facets__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/profile_update_proposal_review_sheet__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.assistant_run_learning.profile_proposal_apply_loop.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        suite: sit1_api_integration
        cases:
        - api_integration.assistant_run_learning.profile_proposal_apply_loop.sit1.sit1_api_integration
        envs:
