        execution_profile: baseline
        suite: sit1_local_contract
        cases:
        - local_contract.assistant_run_learning.assistant_runtime_foundation.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        execution_profile: integration
        suite: sit1_api_integration
        cases:
        - api_integration.assistant_run_learning.assistant_runtime_foundation.sit1.sit1_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: sit1_local_contract
