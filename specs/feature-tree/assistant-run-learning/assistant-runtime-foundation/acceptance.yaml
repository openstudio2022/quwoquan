    notes:
    - 2026-07-19 B8 批次建立本 L2，收口 journey_scenario_registry 既有引用；对象收口证据随 B8 各阶段回填。
    - 2026-07-19 服务端证据已落（conversation/run 持久化+重启恢复+幂等重放、SSE 终态重放、run 完成自评 scorecard、订阅幂等+状态 no-op+cron 租约、consent 版本化流水+双点 fail-closed gate、学习事实 dedupe，均经真实 Mongo/PG/Redis api_integration 通过）；端侧 Facet 拆分与 gamma 环境证据未闭合，保持 partial。
    - 2026-07-19 端侧证据已落：1847 行聚合 Repository 拆 8 对象级 Facet（Remote-only provider 装配、mock 物理迁 test/support、production 零 mock 可达）；12 处吞异常/2 处 StateError/假 policy·搜索·personalization fallback 全部改结构化 CloudException 单轨（fail-closed）；学习回路接通（submitFeedback → ReportInteractionEvent typed 上报 + 稳定 eventId + 失败补发）；assistant 5 页曝光埋点接现行 pageAccess 通道。assistant local_contract 86 例 + search 回归全绿；verify-metadata/全仓 codegen/错误单轨门禁/mock 隔离门禁全绿。
    - 2026-07-19 UAT 证据已落：assistant 5 页 UAT 由路径存在性伪验收改真实页面 pump（load_success/empty_permission_error/primary_cta/trace_context 四类 20 例全绿，负例断言结构化 CloudException 枚举同源，反馈 UAT 断言 typed InteractionEvent 上报）。剩余：gamma/beta/prod 环境运行证据（readiness environments 空，stage 停 implemented），保持 partial。
    - 2026-07-20 页面商用续章完成：对话错误卡/原请求重试/欢迎空态/真实 phase；production half sheet 个性化与首条问题透传；技能中心去除 8 个假开关和演示订阅载荷，仅更新既有订阅；任务/记忆对象进入真实 UI 四态；订阅双写 controller、开发回放面板与死 ScheduleRow 清零；assistant 用户文案/视觉 token 单轨。证据：UI local_contract 38 例、cloud local_contract 8 例、真实页面 UAT 20 例、assistant-service 全包（含 api_integration）全绿。四环境 artifact 仍按既定环境批准出，SIT 保持 partial。
