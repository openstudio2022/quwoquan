version: 2
node:
  id: assistant-runtime-foundation
  level: L2_business_capability
  path: specs/feature-tree/assistant-run-learning/assistant-runtime-foundation
  title: assistant runtime foundation
  parent_domain_service: assistant-run-learning
  parent_business_capability: assistant-runtime-foundation
scope:
  summary: 助手域对象运行基座（conversation/run 持久化、订阅 lease、consent 门控、端侧对象级 Facet）验收范围。
  in_scope:
  - AssistantConversation/AssistantRun 对象 Store（state/receipt/outbox）与重启恢复语义
  - SkillSubscription receipts/outbox 与 cron lease 领取
  - SkillConsent 版本化事实、执行点 fail-closed 门控与事件
  - 端侧对象级 Facet、alpha mock 物理隔离、结构化错误单轨
  out_of_scope:
  - Run/Stream 协议与策略模板（归 run-stream-policy）
  - 学习事件聚合与反馈注入（归 learning-event-feedback-injection）
sit_acceptance:
  SIT1:
    title: 助手对象运行基座能力 SIT
    story_refs: []
    done_when:
    - conversation/run/turn 状态持久化于 MongoDB 对象 Store；服务重启后 run 可读、SSE resume 语义明确；进程内业务状态 map 为零。
    - 创建类命令以稳定 intent + 唯一约束 + receipt 幂等；状态迁移类命令服务端内部 CAS + no-op receipt；公开请求无调用方版本字段。
    - cron/主动投递经带 TTL 的 lease 领取，多实例并发不重复投递。
    - consent 在敏感能力执行点强制校验且 fail-closed；未授权、撤权后、伪造身份、store 不可用负例全部拒绝。
    - 端侧经对象级 Facet 消费，production 无 mock 可达、无吞异常 fallback、无本地合成成功数据。
    - 对话/half sheet/技能中心/管理页消费真实 Facet；错误可见可恢复，任务/记忆具备 loading/empty/error/data 四态，无本地假开关、演示订阅载荷或悬空双写路径。
    performance_points:
    - run 创建与状态查询 P95 <= 800ms；SSE 首事件 <= 2s（deterministic provider 基线）。
    tests:
      planned:
      - command: cd quwoquan_service && go test ./services/assistant-service/... -count=1
      - command: cd quwoquan_service && go test ./services/assistant-service/tests/api_integration -count=1
      - command: cd quwoquan_app && flutter test test/local_contract/cloud/assistant test/local_contract/ui/assistant
      recorded:
      - file: quwoquan_service/services/assistant-service/tests/api_integration/conversation_run_store__api_integration_test.go
      - file: quwoquan_service/services/assistant-service/tests/api_integration/learning_facts__api_integration_test.go
      - file: quwoquan_service/services/assistant-service/internal/application/consent_gate__security__local_contract_test.go
      - file: quwoquan_service/services/assistant-service/internal/application/conversation_store_fail_closed__local_contract_test.go
      - file: quwoquan_app/test/local_contract/ui/assistant/personal_assistant_stream_controller__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/assistant/pages/assistant_skill_center_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/assistant/assistant_management_page_consent__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/assistant/personal_assistant_dialog/personal_assistant_dialog_page__user_acceptance_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/assistant/assistant_half_sheet/assistant_half_sheet_page__user_acceptance_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/assistant/assistant_settings/assistant_settings_page__user_acceptance_test.dart
