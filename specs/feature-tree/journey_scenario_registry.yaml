    status: specified

  - id: content-feed-open-detail
    title: 从内容流打开详情
    parent_journey: content-discovery-to-consumption
    domain_services:
      - discovery-content
    business_capabilities:
      - discovery-content/feed-orchestration-recommendation
      - discovery-content/exposure-governance
      - discovery-content/content-display-journey-consistency
    stories:
      - discovery-content/feed-orchestration-recommendation/unified-items-cursor
      - discovery-content/feed-orchestration-recommendation/collaborative-recall
      - discovery-content/feed-orchestration-recommendation/quality-score-cold-start
      - discovery-content/feed-orchestration-recommendation/interest-onboarding-prior
      - discovery-content/feed-orchestration-recommendation/feedback-ingestion-sampling
      - discovery-content/exposure-governance/served-dedup-write-behind
