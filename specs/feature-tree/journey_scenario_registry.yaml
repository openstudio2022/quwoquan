version: 1
owner: quwoquan-platform
source:
  app_spec: specs/feature-tree/spec.md
  app_acceptance: specs/feature-tree/acceptance.yaml
  tree_index: specs/feature-tree/tree_index.yaml

schema:
  journey:
    required:
      - id
      - title
      - user_goal
      - scenario_refs
      - domain_services
      - uat_refs
  scenario:
    required:
      - id
      - title
      - parent_journey
      - domain_services
      - business_capabilities
      - stories
      - acceptance_refs

journeys:
  - id: content-discovery-to-consumption
    title: 内容发现到消费
    user_goal: 用户从发现页进入内容详情，并完成阅读、互动或跳转作者主页。
    scenario_refs:
      - content-feed-open-detail
      - content-detail-profile-handoff
    domain_services:
      - discovery-content
      - user-identity-profile-relationship
      - shared-homepage-network
    uat_refs:
      - UAT1
    status: draft

  - id: cross-domain-search
    title: 跨领域搜索
    user_goal: 用户在统一搜索入口中查找内容、圈子、聊天记录、主页和地点。
    scenario_refs:
      - global-search-query-and-filter
    domain_services:
      - global-search-experience
      - discovery-content
      - circle-community
      - chat-conversation
      - shared-homepage-network
    uat_refs:
      - UAT1
    status: draft

  - id: app-root-navigation-safety
    title: 应用根导航安全
    user_goal: 用户通过系统边缘手势返回上一页或退出根页时，获得符合平台习惯且不误触的体验。
    scenario_refs:
      - global-route-edge-pop-contract
      - immersive-media-edge-swipe-back
      - home-edge-swipe-exit-guard
    domain_services:
      - runtime
      - discovery-content
    uat_refs:
      - UAT_EDGE_SWIPE
    status: specified

  - id: message-social-connection
    title: 消息社交连接
    user_goal: 用户能从主页、联系人、搜索、圈子、组织节点、相关群组和会话内小趣入口，清晰进入 1v1、请求箱、群聊与助手参与的消息路径。
    scenario_refs:
      - message-direct-and-greeting-upgrade
      - message-group-entry-matrix
      - message-assistant-in-conversation
    domain_services:
      - chat-conversation
      - user-identity-profile-relationship
      - circle-community
      - shared-homepage-network
      - assistant-run-learning
      - global-search-experience
    uat_refs:
      - UAT_MESSAGE_SOCIAL_CONNECTION
    status: specified

  - id: assistant-omnipresent-private-assistant
    title: 无处不在的小趣私人助理
    user_goal: 用户在首页、内容页、搜索页、个人页和群聊中都能唤起同一个小趣；小趣理解当前对象、最近会话、站内搜索、社交关系、画像与标签，并能在授权后主动把有价值的信息投递给用户或会话。
    scenario_refs:
      - assistant-context-grounded-answering
      - assistant-chat-topic-understanding
      - assistant-search-handoff-and-grounding
      - assistant-proactive-subscription-delivery
    domain_services:
      - assistant-run-learning
      - runtime
      - global-search-experience
      - chat-conversation
      - user-identity-profile-relationship
      - notification
      - discovery-content
      - circle-community
    uat_refs:
      - UAT_ASSISTANT_OMNIPRESENT_PRIVATE_ASSISTANT
    status: specified

  - id: external-acquisition-and-deeplink
    title: 对外引流与深链回流
    user_goal: 用户在站外（微信朋友圈/聊天群、小红书/今日头条等 UGC 平台、浏览器、搜索引擎）看到内容或主页的卡片/海报/口令/链接，点击后可靠回流到 App 对应页面；未安装时被引导下载并在安装后还原原始目标。
    scenario_refs:
      - outbound-object-share-distribution
      - external-inbound-deeplink-return
      - public-web-seo-install-conversion
    domain_services:
      - product-ops-growth
      - runtime
      - discovery-content
      - user-identity-profile-relationship
    uat_refs:
      - UAT_EXTERNAL_ACQUISITION
    status: draft

  - id: intersection-action-to-companionship
    title: 交集行动深化到结伴同行
    user_goal: 用户从内容、实体与位置发现"同趣"的人和场，沿"围观→轻触→对话→同趣→同行→线下→实时"行动阶梯逐级深化，完成结伴同行、线下相聚与实时连接，并安全沉淀为可管理的关系（趣友/密友/联系人标签）。
    scenario_refs:
      - intersection-action-deepening-on-object
      - companionship-and-nearby-connection
      - contact-label-driven-connection
    domain_services:
      - object-homepage-network
      - circle-community
      - user-identity-profile-relationship
      - recommendation-platform
      - chat-conversation
    uat_refs:
      - UAT_INTERSECTION_ACTION_TO_COMPANIONSHIP
    boundary_notes:
      - 归属决策（复用扩展，不新建独立后端服务进程）：交集行动深化挂 object-homepage-network/intersection-unified-experience；附近同趣/结伴同行/线下局挂 circle-community 新 L2 companionship-and-nearby-connection；派生称谓与联系人标签挂 user-identity-profile-relationship/persona-follow-graph。
      - UAT_INTERSECTION_ACTION_TO_COMPANIONSHIP 与下列 scenario 的新增 capability/story 为规划草案，待 design/acceptance 落地后回填双向绑定；当前 status:draft 仅登记归属与旅程范围。
      - 2026-06-30「交集行动重建」：前台主词收敛为「同趣/找同趣/兴趣配对」，旧 plaza/connection 原型已整体下线；底栏 + 动作面板「兴趣配对」以 interest_match_page launcher 落地（导流到 /search、/search/network、/profile/intersections 等既有真实面 + 曝光埋点），不自建第二套 Mock 候选列表。附近同趣/结伴同行/线下局的真实聚合与风控仍 deferred，未落地前 status 保持 draft，详见 specs/product/intersection-action-deepening-and-social-ia.md §0。
    status: draft

scenarios:
  - id: global-route-edge-pop-contract
    title: 全局无底栏页面边缘返回
    parent_journey: app-root-navigation-safety
    domain_services:
      - runtime
    business_capabilities:
      - runtime/native-edge-gesture-navigation
    stories:
      - runtime/native-edge-gesture-navigation/global-route-edge-pop-contract
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_EDGE_SWIPE
    boundary_notes:
      - runtime 负责平台防腐策略、Page 工厂与根壳返回状态机；业务页面只声明路由类型和可选返回 guard。
    status: specified

  - id: content-feed-open-detail
    title: 从内容流打开详情
    parent_journey: content-discovery-to-consumption
    domain_services:
      - discovery-content
    business_capabilities:
      - discovery-content/feed-orchestration-recommendation
      - discovery-content/exposure-governance
      - discovery-content/content-display-journey-consistency
    stories:
      - discovery-content/feed-orchestration-recommendation/unified-items-cursor
      - discovery-content/feed-orchestration-recommendation/collaborative-recall
      - discovery-content/feed-orchestration-recommendation/quality-score-cold-start
      - discovery-content/feed-orchestration-recommendation/interest-onboarding-prior
      - discovery-content/feed-orchestration-recommendation/feedback-ingestion-sampling
      - discovery-content/exposure-governance/served-dedup-write-behind
      - discovery-content/exposure-governance/cross-session-fatigue-memory
      - discovery-content/exposure-governance/dynamic-exposure-budget
      - discovery-content/exposure-governance/content-lifecycle-resurfacing
      - discovery-content/content-display-journey-consistency/viewer-profile-state-sync-contract
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT1
    boundary_notes:
      - 发现流排序归 discovery-content；作者关系与画像归 user-identity-profile-relationship。
      - 曝光记忆、动态曝光预算、生命周期复活与曝光健康归 exposure-governance；feed-orchestration-recommendation 只消费其业务边界，不维护第二套曝光真相源。
    status: draft

  - id: content-detail-profile-handoff
    title: 内容详情跳转作者主页
    parent_journey: content-discovery-to-consumption
    domain_services:
      - discovery-content
      - user-identity-profile-relationship
      - shared-homepage-network
    business_capabilities:
      - discovery-content/content-display-journey-consistency
      - user-identity-profile-relationship/profile-homepage-redesign
      - shared-homepage-network/homepage-review-and-content-journey
    stories:
      - discovery-content/content-display-journey-consistency/viewer-profile-state-sync-contract
      - user-identity-profile-relationship/profile-homepage-redesign/owner-subaccount-homepage-unification
      - user-identity-profile-relationship/profile-homepage-redesign/career-interest-profile-editor
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT1
    boundary_notes:
      - 内容详情只传递 referralSource 与 subject id，不拥有主页 IA。
    status: draft

  - id: global-search-query-and-filter
    title: 全局搜索查询与筛选
    parent_journey: cross-domain-search
    domain_services:
      - global-search-experience
      - discovery-content
      - circle-community
      - chat-conversation
      - shared-homepage-network
    business_capabilities:
      - global-search-experience/cross-domain-search-journey
      - global-search-experience/search-provider-routing-and-storage-topology
    stories:
      - global-search-experience/cross-domain-search-journey/full-screen-search-shell-and-entry
      - global-search-experience/cross-domain-search-journey/search-intersection-consumption
      - global-search-experience/search-provider-routing-and-storage-topology/search-execution-routing-policy
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT1
    boundary_notes:
      - global-search-experience 负责入口、路由和聚合体验；各领域服务负责本域结果契约。
    status: draft

  - id: message-direct-and-greeting-upgrade
    title: 1v1 私信与打招呼升级
    parent_journey: message-social-connection
    domain_services:
      - chat-conversation
      - user-identity-profile-relationship
    business_capabilities:
      - chat-conversation/contact-and-session-governance
      - chat-conversation/list-detail-message-delivery
      - user-identity-profile-relationship/persona-follow-graph
    stories:
      - chat-conversation/contact-and-session-governance/greeting-request-inbox-and-upgrade
      - chat-conversation/contact-and-session-governance/conversation-entry-matrix
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_MESSAGE_SOCIAL_CONNECTION
      - specs/feature-tree/chat-conversation/contact-and-session-governance/acceptance.yaml
    boundary_notes:
      - 关注/互关/拉黑与打招呼状态归 user-identity-profile-relationship；正式会话、消息收发和只读态归 chat-conversation。
      - 非互关用户必须先走打招呼请求箱；回复后升级为正式 direct conversation，未回复不得污染普通会话列表。
    status: specified

  - id: message-group-entry-matrix
    title: 私建群、圈子群、组织节点群与主页相关群入口
    parent_journey: message-social-connection
    domain_services:
      - chat-conversation
      - circle-community
      - shared-homepage-network
    business_capabilities:
      - chat-conversation/group-creation-member-management
      - circle-community/circle-collaboration-tools
      - shared-homepage-network/homepage-review-and-content-journey
    stories:
      - chat-conversation/group-creation-member-management/group-create-flow
      - chat-conversation/group-creation-member-management/group-candidate-source-orchestration
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_MESSAGE_SOCIAL_CONNECTION
      - specs/feature-tree/chat-conversation/group-creation-member-management/group-create-flow/acceptance.yaml
    boundary_notes:
      - 圈子与组织型关系主页负责群单元和成员治理；chat-conversation 只负责 group conversation 与消息链路。
      - 共享主页只输出 related groups 摘要；不得直接拥有 conversation 创建语义。
      - 学校下的班级群是组织节点 CircleGroup 绑定 group conversation，不是新的会话类型。
    status: specified

  - id: message-assistant-in-conversation
    title: 小趣作为会话成员参与消息
    parent_journey: message-social-connection
    domain_services:
      - chat-conversation
      - assistant-run-learning
    business_capabilities:
      - chat-conversation/list-detail-message-delivery
      - assistant-run-learning/assistant-runtime-foundation
    stories:
      - chat-conversation/list-detail-message-delivery/assistant-in-conversation
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_MESSAGE_SOCIAL_CONNECTION
      - specs/feature-tree/chat-conversation/acceptance.yaml
    boundary_notes:
      - 小趣以 ConversationMember.memberType=assistant 参与 direct/group conversation；assistant-service 负责回复生成，chat-conversation 负责成员、消息、同步和审计。
      - 个人助手全屏会话与会话内 @小趣 共享助手 runtime，不维护第二套助手逻辑。
    status: specified

  - id: assistant-context-grounded-answering
    title: 内容与页面上下文感知问答
    parent_journey: assistant-omnipresent-private-assistant
    domain_services:
      - assistant-run-learning
      - runtime
      - discovery-content
      - user-identity-profile-relationship
      - global-search-experience
    business_capabilities:
      - assistant-run-learning/assistant-runtime-foundation
      - runtime/runtime-assistant
      - global-search-experience/cross-domain-search-journey
    stories:
      - assistant-run-learning/run-stream-policy/run-sync-contract
      - runtime/runtime-assistant/context-grounded-answering
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_ASSISTANT_OMNIPRESENT_PRIVATE_ASSISTANT
      - specs/feature-tree/runtime/runtime-assistant/acceptance.yaml
    boundary_notes:
      - 页面只上报结构化 context snapshot；小趣 grounding、检索与回答归 assistant-run-learning/runtime-assistant。
      - 内容、主页、关系和标签对象归各自领域服务，小趣不得维护第二套对象真相源。
    status: specified

  - id: assistant-chat-topic-understanding
    title: 群聊话题理解与会话内回复
    parent_journey: assistant-omnipresent-private-assistant
    domain_services:
      - assistant-run-learning
      - chat-conversation
      - runtime
    business_capabilities:
      - chat-conversation/list-detail-message-delivery
      - assistant-run-learning/assistant-runtime-foundation
      - runtime/runtime-assistant
    stories:
      - chat-conversation/list-detail-message-delivery/assistant-in-conversation
      - runtime/runtime-assistant/assistant-mentioned-consumer
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_ASSISTANT_OMNIPRESENT_PRIVATE_ASSISTANT
      - specs/feature-tree/acceptance.yaml#UAT_MESSAGE_SOCIAL_CONNECTION
      - specs/feature-tree/chat-conversation/acceptance.yaml
      - specs/feature-tree/runtime/runtime-assistant/acceptance.yaml
    boundary_notes:
      - chat-conversation 负责 mentions、AssistantMentioned 事件、成员与消息窗口；assistant-service 负责 grounding 和回复生成。
      - AssistantMentioned 必须进入可靠事件流，不能只依赖 realtime Pub/Sub。
    status: specified

  - id: assistant-search-handoff-and-grounding
    title: 搜索 handoff 与统一 grounding
    parent_journey: assistant-omnipresent-private-assistant
    domain_services:
      - assistant-run-learning
      - global-search-experience
      - discovery-content
      - chat-conversation
      - shared-homepage-network
    business_capabilities:
      - global-search-experience/cross-domain-search-journey
      - global-search-experience/search-provider-routing-and-storage-topology
      - assistant-run-learning/assistant-runtime-foundation
    stories:
      - global-search-experience/cross-domain-search-journey/xiaoqu-entry-handoff
      - global-search-experience/search-provider-routing-and-storage-topology/search-execution-routing-policy
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_ASSISTANT_OMNIPRESENT_PRIVATE_ASSISTANT
      - specs/feature-tree/global-search-experience/acceptance.yaml
    boundary_notes:
      - 搜索服务提供 canonical search(request) 与 citations；小趣消费检索结果并声明站内/站外引用边界。
      - SearchXiaoquResults 不得保留固定 citations 占位。
    status: specified

  - id: assistant-proactive-subscription-delivery
    title: 小趣主动订阅与用户/会话投递
    parent_journey: assistant-omnipresent-private-assistant
    domain_services:
      - assistant-run-learning
      - notification
      - chat-conversation
      - runtime
      - user-identity-profile-relationship
    business_capabilities:
      - assistant-run-learning/assistant-runtime-foundation
      - runtime/runtime-assistant
      - chat-conversation/list-detail-message-delivery
    stories:
      - runtime/runtime-assistant/proactive-subscription-delivery
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_ASSISTANT_OMNIPRESENT_PRIVATE_ASSISTANT
      - specs/feature-tree/runtime/runtime-assistant/acceptance.yaml
    boundary_notes:
      - MVP 采用 inviter opt-in：邀请小趣入群的人授权投递；投递前必须校验小趣仍是会话成员、订阅 active、频控/静默/去重通过。
      - 用户收件箱走 AppMessage；会话/群投递复用 chat-service SendMessage，不新增第二消息通道。
    status: specified

  - id: immersive-media-edge-swipe-back
    title: 沉浸式媒体浏览器边缘滑动返回
    parent_journey: app-root-navigation-safety
    domain_services:
      - runtime
      - discovery-content
    business_capabilities:
      - runtime/native-edge-gesture-navigation
    stories:
      - runtime/native-edge-gesture-navigation/immersive-media-edge-swipe-back
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_EDGE_SWIPE
    boundary_notes:
      - runtime 负责平台手势策略；discovery-content 负责沉浸式媒体 surface 的业务语义。
    status: specified

  - id: home-edge-swipe-exit-guard
    title: 主页边缘滑动退出保护
    parent_journey: app-root-navigation-safety
    domain_services:
      - runtime
    business_capabilities:
      - runtime/native-edge-gesture-navigation
    stories:
      - runtime/native-edge-gesture-navigation/home-edge-swipe-exit-guard
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_EDGE_SWIPE
    boundary_notes:
      - 根页退出保护归 runtime/app shell；具体业务 tab 不拥有退出决策。
    status: specified

  - id: outbound-object-share-distribution
    title: 对象对外分享分发
    parent_journey: external-acquisition-and-deeplink
    domain_services:
      - product-ops-growth
      - discovery-content
      - user-identity-profile-relationship
      - circle-community
      - shared-homepage-network
    business_capabilities:
      - product-ops-growth/outbound-share-distribution
    stories:
      - product-ops-growth/outbound-share-distribution/object-share-cards
      - product-ops-growth/outbound-share-distribution/share-channel-panel
      - product-ops-growth/outbound-share-distribution/share-attribution-and-token
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_EXTERNAL_ACQUISITION
    boundary_notes:
      - 分享面板、渠道编排、卡片视觉与归因口令归 product-ops-growth；各对象的可分享字段与分享落库计数归各自领域（content/circle/user/entity）。
    status: draft

  - id: external-inbound-deeplink-return
    title: 外链深链回流到 App 目标页
    parent_journey: external-acquisition-and-deeplink
    domain_services:
      - runtime
    business_capabilities:
      - runtime/runtime-client-foundation
    stories:
      - runtime/runtime-client-foundation/external-inbound-deeplink-routing
      - runtime/runtime-client-foundation/entity-link-templates-metadata
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_EXTERNAL_ACQUISITION
    boundary_notes:
      - 链接结构与导航锚点真相源归 entity-link-templates-metadata；入站解析、原生注册、微信唤起与延迟深链归 external-inbound-deeplink-routing。
    status: draft

  - id: public-web-seo-install-conversion
    title: 公开 Web SEO 与安装转化
    parent_journey: external-acquisition-and-deeplink
    domain_services:
      - runtime
      - discovery-content
    business_capabilities:
      - runtime/runtime-client-foundation
    stories:
      - runtime/runtime-client-foundation/public-content-web-entry
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_EXTERNAL_ACQUISITION
    boundary_notes:
      - 公开 HTML/SEO/中转页/安装转化归 public-content-web-entry；内容正文真相源仍归 discovery-content。
    status: draft

  - id: intersection-action-deepening-on-object
    title: 对象页交集行动深化（同趣围观到破冰升级）
    parent_journey: intersection-action-to-companionship
    domain_services:
      - object-homepage-network
      - recommendation-platform
      - chat-conversation
    business_capabilities:
      - object-homepage-network/intersection-unified-experience
    stories:
      - object-homepage-network/intersection-unified-experience/intersection-algorithm-closure
      - object-homepage-network/intersection-unified-experience/entity-homepage-intersection-redesign
      - object-homepage-network/intersection-unified-experience/home-recommend-intersection-redesign
    acceptance_refs:
      - specs/feature-tree/object-homepage-network/intersection-unified-experience/acceptance.yaml
    boundary_notes:
      - 交集 kind/actionKey/objectKind 闭集真相源在 intersection_kind_registry.yaml；对象页行动区只读分发新增 actionHints，不维护第二套行动表。
      - 行动阶梯 L3-L6（同趣/同行/线下/实时）新增 actionKey 已登记 metadata；无稳定数据源的 kind 先 status:deferred，不产出。
    status: draft

  - id: companionship-and-nearby-connection
    title: 附近同趣·结伴同行·线下局
    parent_journey: intersection-action-to-companionship
    domain_services:
      - circle-community
      - recommendation-platform
      - user-identity-profile-relationship
