version: 1
owner: quwoquan-platform
source:
  app_spec: specs/feature-tree/spec.md
  app_acceptance: specs/feature-tree/acceptance.yaml
  tree_index: specs/feature-tree/tree_index.yaml

schema:
  journey:
    required:
      - id
      - title
      - user_goal
      - scenario_refs
      - domain_services
      - uat_refs
  scenario:
    required:
      - id
      - title
      - parent_journey
      - domain_services
      - business_capabilities
      - stories
      - acceptance_refs

journeys:
  - id: identity-entry-and-continuation
    title: 身份进入与动作续接
    user_goal: 游客完成欢迎、同意、商业登录、Persona 选择与账号安全后，登录成功继续原动作，关闭登录则回到安全状态且不循环。
    scenario_refs:
      - identity-entry-persona-continuation
    domain_services:
      - user-identity-profile-relationship
      - runtime
      - integration
    uat_refs:
      - UAT_BUSINESS_OBJECT_COMMERCIALIZATION
    status: specified

  - id: cold-start-safe-handoff
    title: 冷启动安全交接与可观测恢复
    user_goal: 用户从系统启动页进入 Flutter 欢迎与主壳时，无论配置、路由、首帧或网络观测是否异常，都能在有限时间内看到可解释、可恢复的终态。
    scenario_refs:
      - cold-start-safe-handoff-and-telemetry
    domain_services:
      - runtime
      - product-ops-growth
    uat_refs:
      - UAT_COLD_START_SAFE_HANDOFF
    status: specified

  - id: content-discovery-to-consumption
    title: 内容发现到消费
    user_goal: 用户从发现页进入内容详情，并完成阅读、互动或跳转作者主页。
    scenario_refs:
      - content-feed-open-detail
      - content-detail-profile-handoff
      - content-comment-interaction
    domain_services:
      - discovery-content
      - user-identity-profile-relationship
      - shared-homepage-network
    uat_refs:
      - UAT1
    status: draft

  - id: content-creation-to-publication
    title: 内容创作到发布回流
    user_goal: 用户从全局创作入口写文字、发照片或发视频，可靠保存草稿与媒体，经过安全准入和真实媒体处理后发布，并立即看到内容及真实分发去向；失败、排队、处理中和审核结果都有可恢复终态。
    scenario_refs:
      - text-post-create-publish-return
      - photo-post-create-publish-return
      - video-post-create-process-publish-return
    domain_services:
      - discovery-content
      - user-identity-profile-relationship
      - circle-community
      - tag-interest-taxonomy
      - integration
      - product-ops-growth
    uat_refs:
      - UAT_CONTENT_CREATION_TO_PUBLICATION
    status: specified

  - id: cross-domain-search
    title: 跨领域搜索
    user_goal: 用户在统一搜索入口中查找内容、圈子、聊天记录、主页和地点。
    scenario_refs:
      - global-search-query-and-filter
    domain_services:
      - global-search-experience
      - discovery-content
      - circle-community
      - chat-conversation
      - shared-homepage-network
    uat_refs:
      - UAT1
    status: draft

  - id: app-root-navigation-safety
    title: 应用根导航安全
    user_goal: 用户通过系统边缘手势返回上一页或退出根页时，获得符合平台习惯且不误触的体验。
    scenario_refs:
      - global-route-edge-pop-contract
      - immersive-media-edge-swipe-back
      - home-edge-swipe-exit-guard
    domain_services:
      - runtime
      - discovery-content
    uat_refs:
      - UAT_EDGE_SWIPE
    status: specified

  - id: message-social-connection
    title: 消息社交连接
    user_goal: 用户能从主页、联系人、搜索、圈子、组织节点、相关群组和会话内小趣入口，清晰进入 1v1、请求箱、群聊与助手参与的消息路径。
    scenario_refs:
      - message-direct-and-greeting-upgrade
      - message-group-entry-matrix
      - message-assistant-in-conversation
    domain_services:
      - chat-conversation
      - user-identity-profile-relationship
      - circle-community
      - shared-homepage-network
      - assistant-run-learning
      - global-search-experience
    uat_refs:
      - UAT_MESSAGE_SOCIAL_CONNECTION
    status: specified

  - id: circle-entity-group-collaboration
    title: 圈子、实体主页与讨论协作
    user_goal: 用户从实体主页或搜索进入圈子与组织节点，完成加入、群单元进入、内容协作和权限治理，且主页、圈子、群与会话边界清晰。
    scenario_refs:
      - circle-entity-group-handoff
    domain_services:
      - circle-community
      - shared-homepage-network
      - chat-conversation
      - discovery-content
    uat_refs:
      - UAT_BUSINESS_OBJECT_COMMERCIALIZATION
    status: specified

  - id: assistant-omnipresent-private-assistant
    title: 无处不在的小趣私人助理
    user_goal: 用户在首页、内容页、搜索页、个人页和群聊中都能唤起同一个小趣；小趣理解当前对象、最近会话、站内搜索、社交关系、画像与标签，并能在授权后主动把有价值的信息投递给用户或会话。
    scenario_refs:
      - assistant-context-grounded-answering
      - assistant-chat-topic-understanding
      - assistant-search-handoff-and-grounding
      - assistant-proactive-subscription-delivery
    domain_services:
      - assistant-run-learning
      - runtime
      - global-search-experience
      - chat-conversation
      - user-identity-profile-relationship
      - notification
      - discovery-content
      - circle-community
    uat_refs:
      - UAT_ASSISTANT_OMNIPRESENT_PRIVATE_ASSISTANT
    status: specified

  - id: external-acquisition-and-deeplink
    title: 对外引流与深链回流
    user_goal: 用户在站外（微信朋友圈/聊天群、小红书/今日头条等 UGC 平台、浏览器、搜索引擎）看到内容或主页的卡片/海报/口令/链接，点击后可靠回流到 App 对应页面；未安装时被引导下载并在安装后还原原始目标。
    scenario_refs:
      - outbound-object-share-distribution
      - external-inbound-deeplink-return
      - public-web-seo-install-conversion
    domain_services:
      - product-ops-growth
      - runtime
      - discovery-content
      - user-identity-profile-relationship
    uat_refs:
      - UAT_EXTERNAL_ACQUISITION
    status: draft

  - id: intersection-action-to-companionship
    title: 交集行动深化到结伴同行
    user_goal: 用户从内容、实体与位置发现"同趣"的人和场，沿"围观→轻触→对话→同趣→同行→线下→实时"行动阶梯逐级深化，完成结伴同行、线下相聚与实时连接，并安全沉淀为可管理的关系（趣友/密友/联系人标签）。
    scenario_refs:
      - intersection-action-deepening-on-object
      - companionship-and-nearby-connection
      - contact-label-driven-connection
    domain_services:
      - object-homepage-network
      - circle-community
      - user-identity-profile-relationship
      - recommendation-platform
      - chat-conversation
    uat_refs:
      - UAT_INTERSECTION_ACTION_TO_COMPANIONSHIP
    boundary_notes:
      - 归属决策（复用扩展，不新建独立后端服务进程）：交集行动深化挂 object-homepage-network/intersection-unified-experience；附近同趣/结伴同行/线下局挂 circle-community 新 L2 companionship-and-nearby-connection；派生称谓与联系人标签挂 user-identity-profile-relationship/persona-follow-graph。
      - UAT_INTERSECTION_ACTION_TO_COMPANIONSHIP 与下列 scenario 的新增 capability/story 为规划草案，待 design/acceptance 落地后回填双向绑定；当前 status:draft 仅登记归属与旅程范围。
      - 2026-06-30「交集行动重建」：前台主词收敛为「同趣/找同趣/兴趣配对」，旧 plaza/connection 原型已整体下线；底栏 + 动作面板「兴趣配对」以 interest_match_page launcher 落地（导流到 /search、/search/network、/profile/intersections 等既有真实面 + 曝光埋点），不自建第二套 Mock 候选列表。附近同趣/结伴同行/线下局的真实聚合与风控仍 deferred，未落地前 status 保持 draft，详见 specs/product/intersection-action-deepening-and-social-ia.md §0。
      - 2026-07-01「交集 v3 商用化基线」：产品主轴「别人帮你刷内容，我们帮你遇到对的人」，商用滩头旅行+摄影同趣搭子，北极星为可行动交集完成/关系形成（非 DAU）；v3 先落 C0 最薄闭环「共同想去→约伴」（coWishlistedEntity + start_companion，复用已有 wishlist/关注/交集信号，不依赖新 LBS/实时），附近/实时/线下局真实聚合仍 deferred。真相源 specs/product/intersection-definition-and-application.md §24，验收见 intersection-unified-experience/acceptance.yaml SIT5。前台概念收敛为「交集 / 打动」两维度，入口统一「交集配对」、收件箱统一「今日交集」（旧兴趣配对/找同趣/同趣机会/影响力前台退场，机器标识 interest_match/impact 保留），详见 00_GLOBAL_TERMINOLOGY.md §18.7。
    status: draft

  - id: profile-private-activity-history
    title: 我的主页私有互动历史
    user_goal: 当前用户在自己的主页按互动类型和方向查看可靠、可恢复且不向他人公开的互动历史。
    scenario_refs:
      - profile-share-interaction-history
    domain_services:
      - user-identity-profile-relationship
      - discovery-content
    uat_refs:
      - UAT_PROFILE_SHARE_INTERACTION
    status: specified

scenarios:
  - id: text-post-create-publish-return
    title: 写文字创建、可靠发布与结果回流
    parent_journey: content-creation-to-publication
    domain_services:
      - discovery-content
      - user-identity-profile-relationship
      - circle-community
      - tag-interest-taxonomy
      - integration
      - product-ops-growth
    business_capabilities:
      - discovery-content/content-type-framework
      - discovery-content/publish-comment-reaction
    stories:
      - discovery-content/content-type-framework/creation-mode-and-surface-ia-unification
      - discovery-content/content-type-framework/creation-tagging-ia
      - discovery-content/content-type-framework/markdown-article-kernel
      - discovery-content/publish-comment-reaction/text-post-commercial-publication
      - discovery-content/publish-comment-reaction/post-create-update
      - runtime/system-architecture-and-engineering-guide/app-cloud-business-object-commercial-closure
    acceptance_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/text-post-commercial-publication/acceptance.yaml
      - specs/feature-tree/discovery-content/publish-comment-reaction/acceptance.yaml#SIT2
      - specs/feature-tree/acceptance.yaml#UAT_CONTENT_CREATION_TO_PUBLICATION
    boundary_notes:
      - 草稿与发布任务属于端侧可靠性对象，Post 只表示通过准入的已发布事实。
      - 圈子 placement、tag、entity、location 分别由其对象真相源治理，发布页面只消费 typed Facet。
      - 创作漏斗进入产品遥测，不进入推荐行为 ReportBehaviors。
    status: specified

  - id: photo-post-create-publish-return
    title: 照片创建、像素编辑、原图可靠上传与发布回流
    parent_journey: content-creation-to-publication
    domain_services:
      - discovery-content
      - user-identity-profile-relationship
      - circle-community
      - integration
      - product-ops-growth
    business_capabilities:
      - discovery-content/publish-comment-reaction
      - discovery-content/media-processing-helper-read
    stories:
      - discovery-content/publish-comment-reaction/image-editing
      - discovery-content/publish-comment-reaction/filter-catalog-release
      - discovery-content/publish-comment-reaction/post-create-update
      - discovery-content/media-processing-helper-read/media-status-pipeline
      - runtime/system-architecture-and-engineering-guide/app-cloud-business-object-commercial-closure
    acceptance_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/image-editing/acceptance.yaml
      - specs/feature-tree/discovery-content/publish-comment-reaction/filter-catalog-release/acceptance.yaml
      - specs/feature-tree/discovery-content/publish-comment-reaction/acceptance.yaml#SIT3
      - specs/feature-tree/discovery-content/media-processing-helper-read/acceptance.yaml#SIT1
      - specs/feature-tree/acceptance.yaml#UAT_CONTENT_CREATION_TO_PUBLICATION
    boundary_notes:
      - 图片编辑会话是纯端侧 runtime session，确认结果才进入 MediaUploadSession；编辑器不拥有云端上传、处理或公开 URL。
      - 滤镜目录由 FilterCatalogRelease 单轨发布；App 仅消费 active release、verified cache 或同源 bootstrap replica。
      - 端侧流式读取并上传本地原图，发布 payload 只携带 MediaAsset ID，不携带本地路径或临时 URL。
      - 图片 MediaAsset 完成校验后直接 ready；Post 发布、圈子 placement 与公开性仍由各自对象真相源治理。
      - 上传、发布与结果回流进入产品遥测，不进入推荐行为 ReportBehaviors。
    status: specified

  - id: video-post-create-process-publish-return
    title: 视频创建、转码处理、发布与结果回流
    parent_journey: content-creation-to-publication
    domain_services:
      - discovery-content
      - user-identity-profile-relationship
      - circle-community
      - integration
      - product-ops-growth
    business_capabilities:
      - discovery-content/publish-comment-reaction
      - discovery-content/media-processing-helper-read
      - runtime/runtime-media
    stories:
      - discovery-content/publish-comment-reaction/post-create-update
      - discovery-content/media-processing-helper-read/media-status-pipeline
      - discovery-content/media-processing-helper-read/media-failure-recovery
      - discovery-content/media-processing-helper-read/media-status-pipeline--media-processing-state-machine
      - discovery-content/media-processing-helper-read/media-failure-recovery--recovery-and-rollback-policy
    acceptance_refs:
      - specs/feature-tree/discovery-content/publish-comment-reaction/acceptance.yaml#SIT2
      - specs/feature-tree/discovery-content/media-processing-helper-read/acceptance.yaml#SIT1
      - specs/feature-tree/acceptance.yaml#UAT_CONTENT_CREATION_TO_PUBLICATION
    boundary_notes:
      - 本地原视频按流式上传进入私有 CAS；Post 只绑定 ready 的视频与封面 MediaAsset。
      - content-service 内媒体处理模块是独立功能边界，可替换 adapter 后拆分部署，但不复制聚合状态机。
      - 首发播放交付是 H.264/AAC progressive fast-start MP4；adaptive flag 关闭时不得宣称 HLS/DASH 已交付。
    status: specified

  - id: identity-entry-persona-continuation
    title: 欢迎、授权、商业登录、Persona 与原动作续接
    parent_journey: identity-entry-and-continuation
    domain_services:
      - user-identity-profile-relationship
      - runtime
      - integration
    business_capabilities:
      - user-identity-profile-relationship/onboarding-and-identity-entry
      - user-identity-profile-relationship/auth-profile-snapshot
      - user-identity-profile-relationship/persona-follow-graph
      - runtime/runtime-client-foundation
    stories:
      - user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login--commercial-login-entry
      - user-identity-profile-relationship/onboarding-and-identity-entry/post-login-landing
      - user-identity-profile-relationship/onboarding-and-identity-entry/onboarding-consent-flow
      - user-identity-profile-relationship/persona-follow-graph/persona-management
      - runtime/system-architecture-and-engineering-guide/app-cloud-business-object-commercial-closure
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_BUSINESS_OBJECT_COMMERCIALIZATION
    boundary_notes:
      - UserAccount 只承担账号/认证/安全，公开业务动作使用 Persona；ActorContext 明确 accountId/personaId/deviceActorId。
      - 登录关闭回安全状态，登录成功通过 AuthContinuation 恢复目标动作；不得通过旧路由或 fallback 绕过双目标合同。
    status: specified

  - id: cold-start-safe-handoff-and-telemetry
    title: 原生首帧、Flutter 启动恢复与启动遥测
    parent_journey: cold-start-safe-handoff
    domain_services:
      - runtime
      - product-ops-growth
    business_capabilities:
      - runtime/runtime-client-foundation
      - product-ops-growth/event-ingestion-and-analytics
    stories:
      - runtime/runtime-client-foundation/cold-start-performance
      - product-ops-growth/event-ingestion-and-analytics/analytics-metric-dictionary
    acceptance_refs:
      - specs/feature-tree/acceptance.yaml#UAT_COLD_START_SAFE_HANDOFF
      - specs/feature-tree/runtime/runtime-client-foundation/cold-start-performance/acceptance.yaml#GWT6
      - specs/feature-tree/product-ops-growth/event-ingestion-and-analytics/acceptance.yaml#SIT2
    boundary_notes:
      - runtime 负责原生→Flutter handoff、启动状态机与用户恢复面；product-ops-growth 只接收固定、脱敏、可幂等的启动事实并负责投影与告警。
      - 通用 `/ops/events` 继续要求已验证主体；匿名启动接收面不得变成通用埋点旁路。
    status: specified

  - id: global-route-edge-pop-contract
    title: 全局无底栏页面边缘返回
    parent_journey: app-root-navigation-safety
    domain_services:
      - runtime
    business_capabilities:
