version: 2
node:
  id: object-homepage-network
  level: L1_domain_service
  path: specs/feature-tree/object-homepage-network
  title: object homepage network
  parent_domain_service: object-homepage-network
scope:
  summary: 用户主页、圈子/群组主页、共享主页三类对象页端云一体升级验收范围。
  in_scope:
  - 三类对象页统一信息架构、视觉系统、交集证据和小艺入口。
  - ObjectRelationEdge、ObjectPageBundle、ObjectPageContext 契约。
  - HomepageType、entity-service、评论关联实体、实体双 ID 四项硬债清算。
  - 灰度、埋点、实时推荐、小艺主动服务闭环。
  out_of_scope:
  - 交易、支付、预约和团购闭环。
  - 新增第二套标签枚举或旧 resonance 链路兼容。
  - user/circle/entity 各领域主档所有权迁移。
domain_acceptance:
  DA1:
    title: 三类对象页统一体验验收
    done_when:
    - 用户主页、圈子/群组主页、共享主页均使用统一四段式信息架构。
    - 任一对象页首屏能在 3 秒内讲清对象身份、与我的关系和可行动作。
    - 三类对象页共享视觉组件，但按 user/circle/homepage 保留自然差异。
    boundary_points:
    - 前台不暴露 entity、object graph、relation edge 等工程词。
    - UI 不维护第二套对象关系文案或路由表。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/components/object_page/object_intersection_card__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/components/object_page/object_intersection_section__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/components/object_page/object_page_shell__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/widgets/profile_shell_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/author_impact_card__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/circle/widgets/circle_shell_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart
      - file: quwoquan_data/tests/local_contract/produce/test_homepage_introduction_seed__local_contract_test.py
      - file: quwoquan_service/services/entity-service/tests/api_integration/homepage_handler__api_integration_test.go
      - file: quwoquan_app/test/user_acceptance/pages/user/userProfile/userProfile_page__user_acceptance_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/circle/circleDetail/circleDetail_page__user_acceptance_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/entity/homepageDetail/homepageDetail_page__user_acceptance_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: da1_local_contract
        cases:
        - local_contract.object_homepage_network.domain_service.da1.da1_local_contract
        envs: &id001
        - local
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.object_homepage_network.domain_service.da1.user_journey
        envs:
        - gamma_local
      supporting:
      - layer: local_contract
        suite: da1_local_contract
        cases:
        - local_contract.object_homepage_network.domain_service.da1.da1_local_contract
        envs: *id001
      - layer: api_integration
        suite: da1_api_integration
        cases:
        - api_integration.object_homepage_network.domain_service.da1.da1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - '[migrated_from_planned] quwoquan_app/test/components/object_page/object_identity_header_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/components/object_page/object_relation_ribbon_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/user/profile_object_homepage_widget_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/circle/circle_object_homepage_widget_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/entity/entity_object_homepage_widget_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/patrol/object_homepage_network_journey_test.dart'
  DA2:
    title: 对象关系契约与硬债验收
    done_when:
    - ObjectRelationEdge、ObjectPageBundle、ObjectPageContext 完成 metadata 与 codegen。
    - HomepageType 与 fixture 不再漂移，首发校园和旅游出行对象有明确模板。
    - entity-service 主页读模型具备持久化、内容聚合、口碑、相关圈子和关系边。
    - 评论可关联 canonicalEntityId 或 homepageId，并能形成 comment_about_entity 关系边。
    - canonicalEntityId 与 homepageId 有单一映射合同。
    boundary_points:
    - 关系事实只来自 metadata/codegen/后端投影，端侧不得编造。
    - 不恢复旧扁平 tag taxonomy 或旧 resonance 链路。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/services/content/intersection_object_evidence__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/components/object_page/object_intersection_card__local_contract_test.dart
      - file: quwoquan_service/services/entity-service/tests/api_integration/homepage_handler__api_integration_test.go
      - file: quwoquan_service/services/user-service/tests/api_integration/homepage_bundle_contract__api_integration_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.object_homepage_network.domain_service.da2.contract
        envs: *id001
      - layer: api_integration
        suite: da2_api_integration
        cases:
        - api_integration.object_homepage_network.domain_service.da2.da2_api_integration
        envs: &id002
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: da2_local_contract
        cases:
        - local_contract.object_homepage_network.domain_service.da2.da2_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_service/contracts/metadata/object_page/tests/contract.yaml'
    - '[migrated_from_planned] quwoquan_service/tests/entity/object_page_bundle_contract_test.go'
    - '[migrated_from_planned] quwoquan_service/tests/entity/homepage_type_fixture_contract_test.go'
    - '[migrated_from_planned] quwoquan_service/tests/content/comment_entity_relation_contract_test.go'
    - '[migrated_from_planned] quwoquan_app/test/cloud/runtime/generated/object_page_dto_contract_test.dart'
    - '[migrated_from_recorded_reference] quwoquan_service/contracts/metadata/entity/homepage/projections/homepage_introduction.yaml'
    - '[migrated_from_recorded_reference] quwoquan_service/contracts/metadata/entity/homepage/projections/homepage_introduction_section.yaml'
    - '[migrated_from_recorded_reference] quwoquan_service/contracts/metadata/entity/homepage/service.yaml'
  DA3:
    title: 运营灰度与回滚验收
    done_when:
    - 对象页升级可按地域、版本、白名单、experimentBucket、对象类型和环境灰度。
    - 生产 App 仍只有一个 prod 包，不出现 app-prod-gray 或 release mock 入口。
    - 每个灰度 cohort 可观测曝光、转化、异常率、接口 RT、小艺触发和 dismiss。
    - 可按层级关闭小艺主动提示、关系证据可视化、新对象页模板、推荐策略变体。
    boundary_points:
    - 灰度不改变数据真相源。
    - 回滚不得恢复旧对象页并行数据链路。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: da3_local_contract
        cases:
        - local_contract.object_homepage_network.domain_service.da3.da3_local_contract
        envs: *id001
      - layer: api_integration
        suite: cross_service_integration
        cases:
        - api_integration.object_homepage_network.domain_service.da3.cross_service_integration
        envs: *id002
      supporting:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.object_homepage_network.domain_service.da3.user_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_service/tests/product_ops/object_homepage_rollout_contract_test.go'
    - '[migrated_from_planned] quwoquan_app/test/core/rollout/object_homepage_rollout_policy_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/object_homepage/object_homepage_rollout_widget_test.dart'
  DA4:
    title: 埋点到实时推荐闭环验收
    done_when:
    - 对象页曝光、交集曝光/点击、关系边点击、Tab 切换、行动、小艺反馈均进入统一行为管道。
    - 事件携带 objectType、objectId、canonicalEntityId、tagRefs、entityRefs、relationEdgeIds、intersectionReasonIds、referralSource、feedRequestId、recommendationTraceId、experimentBucket、rolloutCohort。
    - 推荐服务能消费对象关系反馈并形成 relation-aware ranking 输入。
    boundary_points:
    - 不允许只上报普通点击而丢失对象关系字段。
    - api_integration 中每个真实行为断言必须在 local_contract mock 行为测试中有对应断言。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: da4_local_contract
        cases:
        - local_contract.object_homepage_network.domain_service.da4.da4_local_contract
        envs: *id001
      - layer: api_integration
        suite: cross_service_integration
        cases:
        - api_integration.object_homepage_network.domain_service.da4.cross_service_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.object_homepage_network.domain_service.da4.contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/core/trackers/object_homepage_behavior_tracker_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/object_homepage/object_homepage_behavior_widget_test.dart'
    - '[migrated_from_planned] quwoquan_service/tests/recommendation/object_homepage_event_ingestion_contract_test.go'
  DA5:
    title: 小艺主动服务验收
    done_when:
    - 小艺主动提示消费 ObjectPageContext、IntersectionReason、ObjectRelationEdge 和 rollout 策略。
    - 主动提示具备置信度、触发原因、冷却时间、可关闭状态。
    - impression、click、accept、dismiss 全部回流行为管道。
    - 小艺提示不遮挡对象页主操作，不在同一首屏出现多个主动提示。
    boundary_points:
    - 小艺不得基于端侧临时拼装上下文生成事实解释。
    - 用户关闭或忽略必须影响后续触发策略。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: da5_local_contract
        cases:
        - local_contract.object_homepage_network.domain_service.da5.da5_local_contract
        envs: *id001
      - layer: api_integration
        suite: cross_service_integration
        cases:
        - api_integration.object_homepage_network.domain_service.da5.cross_service_integration
        envs: *id002
      supporting:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.object_homepage_network.domain_service.da5.user_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/assistant/object_page_assistant_action_dock_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/assistant/object_page_context_builder_test.dart'
    - '[migrated_from_planned] quwoquan_service/tests/assistant/object_page_assistant_context_contract_test.go'
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  - make verify-app-page-horizontal-quality
  full_gate:
  - make gate-full
