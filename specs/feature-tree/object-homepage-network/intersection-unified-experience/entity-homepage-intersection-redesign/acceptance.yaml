    when:
    - 渲染实体主页「我的交集」卡。
    then:
    - 我的交集卡走共享 ObjectIntersectionPreviewCard（objectBType=homepage、objectSharedReasonsProvider），标题「我的交集」，单列预览句（蓝色可点击锚点）
      + 弱入口「查看全部」。
    done_when:
    - 弃旧推荐标题与 bundle 直出交集，统一走 objectSharedReasons provider 与我的主页同壳。
    edge_cases:
    - 无交集事实时三态降级不占位。
    contract_refs:
    - recommendation/model_release/projections/intersection_reason.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.entity_homepage_intersection_redesign.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.entity_homepage_intersection_redesign.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded] local_contract quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart（交集卡走
      ObjectIntersectionSection/objectBType=homepage，旧推荐标题单结论句，无交集三态降级，2026-06-16
