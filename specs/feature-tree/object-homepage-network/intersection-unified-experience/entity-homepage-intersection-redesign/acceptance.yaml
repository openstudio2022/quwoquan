version: 2
node:
  id: entity-homepage-intersection-redesign
  level: L3_story
  path: specs/feature-tree/object-homepage-network/intersection-unified-experience/entity-homepage-intersection-redesign
  title: entity homepage intersection redesign
  parent_domain_service: object-homepage-network
  parent_business_capability: intersection-unified-experience
scope:
  summary: 实体主页与我的主页同壳同语义 token 重做为「身份 → 我的交集 → 这里打动的人 → 记录/讨论/相关圈子」双模块结构，资料/关于入口下沉。
  in_scope:
  - 我的交集卡标题统一为「我的交集」，渲染共享 ObjectIntersectionPreviewCard（objectBType=homepage、objectSharedReasonsProvider 单一真相源）：单列预览句 + 蓝锚点 + 查看全部。
  - 打动卡新增，标题「这里打动的人」，IntersectionStatementCard + entityImpactProvider，逐条只读 EntityImpactItem，句内数字下钻影响明细，无事实不展示。
  - 资料/关于入口不进入首屏核心模块，头部只保留一句话简介。
  - 核心动作主按钮关注、次按钮改「发记录」；移除首屏常驻「想去·结伴」入口。
  - 一级 tab 记录/讨论/相关圈子；记录流双列瀑布 + 卡内唯一交集句（封面→交集句→标题→作者→赞）。
  - 二级过滤（右侧漏斗 + ActionSheet，非胶囊），过滤项进 homepage_sub_tabs。
  - 相关圈子卡片化并进入圈子主页；公开路径移除内部运维字段。
  - 头部头像簇 + N 关注单计数 + verified + 成立年份（契约预留 + alpha mock）。
  - 用户语言禁词清理（实体/Entity/为什么推荐/兴趣圈/同趣事实化）。
  out_of_scope:
  - 云侧 Homepage/Entity 服务、排序、图谱实现（含 entity impact GetEntityImpact Go handler 暂缓，仅端契约 + alpha mock）。
  - AB / 特征 / 召回系统。
gwt_acceptance:
