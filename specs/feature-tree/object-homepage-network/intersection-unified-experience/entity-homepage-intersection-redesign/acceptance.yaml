version: 2
node:
  id: entity-homepage-intersection-redesign
  level: L3_story
  path: specs/feature-tree/object-homepage-network/intersection-unified-experience/entity-homepage-intersection-redesign
  title: entity homepage intersection redesign
  parent_domain_service: object-homepage-network
  parent_business_capability: intersection-unified-experience
scope:
  summary: 实体主页沿用他人主页同壳同口径重做交集卡、关于这里卡、记录流与头部。
  in_scope:
  - 交集卡切 ObjectIntersectionSection（objectBType=homepage）单一真相源，标题「为什么推荐这里」。
  - 关于这里卡标题「关于这里」，2~4 行 + 缩略图 + 查看更多介绍。
  - 一级 tab 改记录/讨论/相关圈子；记录流单列改双列瀑布 + PostBaseDto 流 + 卡内交集句。
  - 二级过滤新建（右侧漏斗 + ActionSheet，非胶囊），过滤项进 homepage_sub_tabs。
  - 头部头像簇 + N 关注单计数 + verified + 成立年份（契约预留 + alpha mock）。
  - 用户语言禁词清理（实体/Entity/兴趣圈/影响力/同趣事实化）。
  out_of_scope:
  - 云侧 Homepage/Entity 服务、排序、图谱实现。
  - AB / 特征 / 召回系统。
gwt_acceptance:
  GWT1:
    title: 为什么推荐这里单一真相源 GWT
    given:
    - alpha mock homepage fixtures 含主谓宾 primaryText。
    when:
    - 渲染实体主页交集卡。
    then:
    - 交集卡走 ObjectIntersectionSection（objectBType=homepage），标题「为什么推荐这里」，列表入口每行单结论句
      + 至多一条辅助说明 + 查看更多。
    done_when:
    - 弃 bundle 直出，统一走 objectSharedReasons provider。
    edge_cases:
    - 无交集事实时三态降级不占位。
    contract_refs:
    - recommendation/rec_model/projections/intersection_reason.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/ui/entity/pages/homepage_detail_page_widget_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.entity_homepage_intersection_redesign.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.entity_homepage_intersection_redesign.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded] local_contract quwoquan_app/test/ui/entity/pages/homepage_detail_page_widget_test.dart（交集卡走
      ObjectIntersectionSection/objectBType=homepage，标题「为什么推荐这里」单结论句，无交集三态降级，2026-06-16
      green）'
    - '[migrated_from_recorded] PENDING api_integration：gamma /v1/content/intersections/object（homepage）真实链路待
      WP-D。'
  GWT2:
