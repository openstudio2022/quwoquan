version: 2
node:
  id: circle-homepage-intersection-redesign
  level: L3_story
  path: specs/feature-tree/object-homepage-network/intersection-unified-experience/circle-homepage-intersection-redesign
  title: circle homepage intersection redesign
  parent_domain_service: object-homepage-network
  parent_business_capability: intersection-unified-experience
scope:
  summary: 圈子主页与我的主页同壳同语义 token 重做为「身份 → 我的交集 → 圈子打动的人 → 记录/讨论/成员」双模块结构。
  in_scope:
  - 我的交集卡标题统一为「我的交集」，渲染共享 ObjectIntersectionPreviewCard（objectBType=circle、objectSharedReasonsProvider）：单列预览句 + 蓝锚点 + 查看全部。
  - 打动卡标题统一为「圈子打动的人」，AuthorImpactCard 同构、去好友化/去收藏，circleImpactProvider 单一真相源。
  - 移除头部成员头像簇（你认识的人收敛进我的交集模块）；次按钮由私信改「进入讨论」（切讨论 tab）。
  - 一级 tab 内容改记录；记录流去胶囊改右侧过滤、双列瀑布、卡内交集句。
  - 头部 N 成员单计数；圈子独立头像字段契约预留 + alpha mock。
  - 删除 section_interaction/circle_stats_row 死代码与中文字面量。
  - 用户语言禁词清理（实体/Entity/Circle/为什么推荐/兴趣圈）。
  out_of_scope:
  - 云侧 Circle 服务/排序/图谱实现。
  - 圈子私信 1v1 链路改造。
gwt_acceptance:
  GWT1:
    title: 我的交集卡列表入口 GWT
    given:
    - alpha mock circle fixtures 含主谓宾 primaryText 与蓝锚点 primarySpans。
    when:
    - 渲染圈子主页「我的交集」卡。
    then:
    - 我的交集卡走共享 ObjectIntersectionPreviewCard（objectBType=circle、objectSharedReasonsProvider），标题「我的交集」，单列预览句（蓝锚点）
      + 弱入口「查看全部」。
    done_when:
    - 弃旧推荐标题，与我的主页同壳同语义 token。
    edge_cases:
    - 无交集事实时三态降级不占位。
    contract_refs:
    - recommendation/rec_model/projections/intersection_reason.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/circle/widgets/circle_shell_widget__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/circle/widgets/circle_shell_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/object_page/object_intersection_card__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.circle_homepage_intersection_redesign.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.circle_homepage_intersection_redesign.contract
        envs: *id001
    notes:
    - '[recorded] local_contract 2026-06-25：`flutter test test/ui/circle/widgets/circle_shell_widget_test.dart`
      10/10 green；覆盖旧推荐交集卡、云侧 displayText、事实行来源说明、空/错态收起。'
    - '[recorded] local_contract 2026-06-25：`flutter test test/components/object_page/object_intersection_card_test.dart
      test/components/object_page/object_intersection_section_test.dart` 15/15 green；圈子主页 ObjectIntersectionSection
      下游已切 primaryText/primarySpans 单通道，覆盖无 primaryText 隐藏、affinity 推荐辅助、展开与高亮。'
    - '[migrated_from_recorded] local_contract quwoquan_app/test/local_contract/ui/circle/widgets/circle_shell_widget__local_contract_test.dart（旧推荐交集卡：单结论句
      + 辅助说明 + 查看更多，无交集三态降级，2026-06-16 green）'
    - '[recorded] PENDING api_integration 2026-06-25：gamma-local 静态拓扑已包含 circle-service，
      但 stackctl api_integration 仍因 gateway health SSL EOF 未进入 circle object intersections populated
      探针；由 `object-homepage-gamma-real-data-closure` 继续收口。'
  GWT2:
    title: 圈子打动卡与去好友化 GWT
