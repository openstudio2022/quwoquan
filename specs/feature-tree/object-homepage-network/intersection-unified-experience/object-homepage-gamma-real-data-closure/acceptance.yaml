      - "公开页面不展示统一对象键、模板、来源、灰度 cohort、主页管理等内部字段。"
    done_when:
      - "homepage bundle、introduction、related-groups 均有 populated api_integration 结果。"
      - "App Remote 页面不回退 Dart mock，且内部字段不外露。"
      - "关注状态刷新后在页面、服务响应和行为埋点中一致。"
    tests:
