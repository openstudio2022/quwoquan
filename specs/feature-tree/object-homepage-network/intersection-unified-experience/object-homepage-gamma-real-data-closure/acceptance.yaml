        - file: "quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart"
        - file: "quwoquan_app/test/local_contract/cloud/entity/contract/homepage_repository_contract__local_contract_test.dart"
        - command: "python3 quwoquan_app/scripts/gamma/run_local_gamma_t3.py --strict-all"
        - file: "quwoquan_app/test/user_acceptance/pages/entity/homepageDetail/homepageDetail_page__user_acceptance_test.dart"
      recorded: []
