        - layer: user_acceptance
          suite: object_homepage_recovery_journey
          cases:
            - user_acceptance.object_homepage_network.intersection_unified_experience.object_homepage_gamma_real_data_closure.object_homepage_recovery_journey
          envs:
            - gamma_local
      supporting: []
execution:
  local_gate:
    - "bash agent_ops/scaffold/verify_feature_tree_refactor.sh"
    - "bash agent_ops/scaffold/verify_acceptance_standard.sh"
    - "bash quwoquan_service/scripts/contract/verify_contract_metadata.sh"
    - "docker compose -f quwoquan_service/docker-compose.gamma-local.yaml config"
  integration_gate:
    - "python3 agent_ops/deploy/stackctl.py up --env gamma --skip-app"
    - "python3 agent_ops/deploy/stackctl.py health --target gamma-local --scope full"
    - "python3 quwoquan_app/scripts/gamma/run_local_gamma_t3.py --strict-all"
    - "python3 agent_ops/deploy/stackctl.py verify --env gamma --kind all --tier all"
  exit_review:
    - "规格达成：逐项说明 L3 GWT1-GWT5 状态。"
    - "测试证据：列出 local_contract、api_integration、user_acceptance 命令与结果。"
    - "E2E：证明 Data -> Service -> App -> Behavior -> Recommendation -> Observability -> Environment 无断点。"
    - "产品/UX：说明禁词、降级、可点击证据、CTA、二级模块是否达成。"
    - "运营观测：说明指标、采样、告警、保留周期、回滚策略。"
