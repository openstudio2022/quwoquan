version: 2
node:
  id: object-homepage-gamma-real-data-closure
  level: L3_story
  path: specs/feature-tree/object-homepage-network/intersection-unified-experience/object-homepage-gamma-real-data-closure
  title: Object Homepage Gamma Real Data Closure
  parent_domain_service: object-homepage-network
  parent_business_capability: intersection-unified-experience
scope:
  summary: "把圈子主页与实体主页从本地 UI 合格推进到 gamma-local 真实数据、真实服务、真实 App Remote、真实行为观测闭环。"
  in_scope:
    - "entity-service 与 circle-service 的 gamma-local compose/gateway/package/health/stackctl 闭环。"
    - "实体主页、圈子主页、相关圈子、影响摘要、对象交集、关注/加入状态的 metadata-first 端云契约闭环。"
    - "api_integration 探针覆盖 homepage/circle/intersection/related groups/impact，并验证 primaryText 与 primarySpans。"
    - "user_acceptance 覆盖推荐入口、搜索入口、我的主页入口、CTA、Tab、错误态和空态。"
    - "行为埋点与服务观测覆盖曝光、点击、证据、CTA、错误、空态和环境归因。"
  out_of_scope:
    - "深排平台、premium pool、全量商业运营后台、支付或预约链路。"
    - "新增 homepage/circle 专属交集 API。"
    - "prod rollout；本 Story 只到 gamma-local 与商用准入证据。"
quality_gates:
  product_maturity:
    - "用户能一眼理解这是什么、为什么推荐、能做什么、证据是否可信。"
    - "没有用户可见禁词：交集、实体、Entity、Circle、影响力、兴趣圈。"
    - "无 primaryText 时隐藏该理由；无有效理由时隐藏推荐区；无简介/记录时展示可恢复空态。"
  contract_maturity:
    - "App 只消费 metadata/codegen/service read model，不维护第二套 URL、DTO、错误码或 mock 真相源。"
    - "对象交集商用可见理由满足 join(primarySpans.text) == primaryText。"
    - "objectType=homepage|circle 不得退化为 interest/同好 等错误用户语义。"
  operational_maturity:
    - "stackctl health 与 api_integration 探针证明 entity/circle 不是静态存在，而是可访问、可鉴权、可返回种子数据。"
    - "缺少 Patrol runner 时，必须输出替代 dry-run 或手工 UAT 证据，并明确不能宣称自动化 user_acceptance 完成。"
commercial_readiness_review:
  reviewed_at: "2026-06-25T12:30:00+08:00"
  verdict: "not_commercially_ready_yet_but_ready_for_ordered_development"
  reason:
    - "现有 local_contract 证明 UI 与共享交集组件方向正确，但 gamma-local 真实运行、seed、populated API、App Remote 与 user_acceptance 尚未闭环。"
    - "当前 app_gamma_seed_manifest 只覆盖 entity search/object-page-bundle/introduction 与 circle list/detail，缺 related-groups、impact、members/feed、object intersections 商用探针。"
    - "content-service objectType=homepage 当前存在退化为 interest/同好 的风险，必须在服务端 subtype 解析或等价 metadata 契约中收口。"
  decision:
    - "下一轮允许进入开发，但必须先修 P0 gamma health 与 P1 manifest/seed/probe，不能先做 App UI 或新增并行 API。"
    - "继续复用 /v1/homepages/*、/v1/circles/*、/v1/content/intersections/object；只有 metadata 缺字段时才扩 read model。"
    - "本 Story 仍是 gamma-local 商用准入门，不宣称 prod-ready。"
implementation_backlog:
  P0_gamma_health:
    owner_domains: [Ops, Service]
    entrypoints:
      - "python3 agent_ops/deploy/stackctl.py health --target gamma-local --scope full"
      - "python3 agent_ops/deploy/stackctl.py verify --env gamma --kind all --tier all"
    done_when:
      - "gateway/product-ops gateway/entity-service/circle-service/content-service health 均可访问。"
      - "无 SSL EOF、404 mirror route 或服务未启动导致的 gate_block。"
    anti_overdesign:
      - "不手写第二套 gateway URL、端口或 health 脚本。"
  P1_manifest_seed_probe:
    owner_domains: [App, Service]
    entrypoints:
      - "quwoquan_service/contracts/metadata/_shared/test_fixtures/app_gamma_seed_manifest.json"
      - "quwoquan_app/scripts/gamma/run_local_gamma_t3.py"
    done_when:
      - "verifiedEndpoints 覆盖 related-groups、review-summary、circle impact、members、feed、object intersections。"
      - "seed refs 覆盖 viewer relationship、circle membership、related circle、homepage subtype 与 content anchor。"
      - "strict probe 对缺 domain、缺 runtime ref、空 populated result 均 gate_block。"
    anti_overdesign:
      - "不在探针脚本里手写第二套业务文档结构；需要新数据时优先补 metadata fixture 或服务 seed 命令。"
  P2_typed_api_assertions:
    owner_domains: [Service, App]
    entrypoints:
      - "quwoquan_app/scripts/gamma/run_local_gamma_t3.py"
      - "quwoquan_service/services/entity-service/tests/api_integration/homepage_handler__api_integration_test.go"
      - "quwoquan_service/services/circle-service/tests/api_integration/circle_member_contract__api_integration_test.go"
      - "quwoquan_service/services/content-service/tests/api_integration/intersection_source_contract__api_integration_test.go"
    done_when:
      - "不只检查 2xx/bytes；逐字段断言 homepage/circle/intersection 商用 read model。"
      - "对象交集满足 primaryText/spans join、target、visuals、actionHints、pagination、empty/error。"
      - "公开实体页响应不含内部运维字段。"
    anti_overdesign:
      - "不新增 homepage-intersections 或 circle-intersections 并行接口。"
  P3_metadata_first_model_decision:
    owner_domains: [Service, App]
    entrypoints:
      - "quwoquan_service/contracts/metadata/entity/homepage/service.yaml"
      - "quwoquan_service/contracts/metadata/social/circle/service.yaml"
      - "quwoquan_service/contracts/metadata/content/post/service.yaml"
    done_when:
      - "缺字段先补 metadata 并 verify/codegen。"
      - "HomepageDetailBundle、CircleDetailView、CircleImpactSummary、IntersectionReason 的职责边界清晰。"
      - "objectType=homepage 的 subtype/label/dimension 不由 App 本地文案推断。"
    anti_overdesign:
      - "只扩最小 read model，不引入深排平台、premium pool 或复杂相关圈子推荐平台。"
  P4_app_remote_and_local_parity:
    owner_domains: [App]
    entrypoints:
      - "quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart"
      - "quwoquan_app/test/local_contract/ui/circle/widgets/circle_shell_widget__local_contract_test.dart"
      - "quwoquan_app/test/local_contract/components/object_page/object_intersection_card__local_contract_test.dart"
      - "quwoquan_app/test/user_acceptance/pages/entity/homepageDetail/homepageDetail_page__user_acceptance_test.dart"
      - "quwoquan_app/test/ui/circle/journeys/circle_detail_journey_test.dart"
    done_when:
      - "local_contract 与 api_integration 字段、错误态、空态、点击行为一一对应。"
      - "remote/gamma 不回退 Dart mock 或 UI 自造 primaryText。"
      - "关注/加入状态刷新后页面、服务响应、行为埋点一致。"
    anti_overdesign:
      - "复用 ObjectPageShell、ObjectIntersectionSection、IntersectionTargetNavigator，不复制一套对象页组件。"
  P5_observability_feedback:
    owner_domains: [App, Service, Ops]
    entrypoints:
      - "quwoquan_app/test/core/trackers/intersection_attribution_test.dart"
      - "quwoquan_service/services/content-service/configs/observability/intersection_slo.yaml"
      - "agent_ops/deploy/stackctl.py"
    done_when:
      - "曝光、理由、span、证据、CTA、Tab、记录、错误、空态均有 surface/objectType/objectId/reasonId/targetType/targetId/env。"
      - "关注、加入、打开对象、打开讨论、相关圈子点击能回流 recommendation attribution。"
      - "错误码、用户恢复动作、服务日志/指标、App RuntimeFailure 映射同源。"
    anti_overdesign:
      - "不引入第二套 analytics event 命名；沿用现有 behavior/recommendation attribution。"
  P6_exit_gate:
    owner_domains: [App, Service, Ops]
    entrypoints:
      - "bash agent_ops/scaffold/verify_feature_tree_refactor.sh"
      - "bash agent_ops/scaffold/verify_acceptance_standard.sh"
      - "bash quwoquan_service/scripts/contract/verify_contract_metadata.sh"
      - "docker compose -f quwoquan_service/docker-compose.gamma-local.yaml config"
      - "python3 quwoquan_app/scripts/gamma/run_local_gamma_t3.py --strict-all"
      - "make verify-app-page-horizontal-quality"
      - "make verify-app-mock-isolation"
    done_when:
      - "local_contract、api_integration、user_acceptance 三层证据齐备。"
      - "Exit Review 能逐项说明规格达成、E2E、产品/UX、观测、自动化门禁和剩余风险。"
      - "Patrol runner 缺失时只标 runner-blocked 或 dry-run，不宣称自动化 user_acceptance 完成。"
gwt_acceptance:
  GWT1_gamma_local_topology:
    title: "gamma-local 拓扑、网关与健康检查闭环"
    given:
      - "entity-service 和 circle-service 已在 docker-compose.gamma-local.yaml、Caddyfile、port profile 与 package 流程中声明。"
    when:
      - "运行 metadata verify、compose config、stackctl health 与 stackctl verify。"
    then:
      - "gateway 可通过 gamma-local public base 访问 entity/circle/content/user 相关端点。"
      - "health 不再因为 404、路由缺失、TLS EOF 或服务未启动而失败。"
    done_when:
      - "metadata 与 compose 静态契约通过。"
      - "stackctl health 证明 gamma-local gateway 与 entity/circle 服务可访问。"
      - "stackctl verify 覆盖 api_integration；Patrol runner 缺失时输出明确 user_acceptance 阻断证据。"
    tests:
      planned:
        - command: "bash quwoquan_service/scripts/contract/verify_contract_metadata.sh"
        - command: "docker compose -f quwoquan_service/docker-compose.gamma-local.yaml config"
        - command: "python3 agent_ops/deploy/stackctl.py health --target gamma-local --scope full"
        - command: "python3 agent_ops/deploy/stackctl.py verify --env gamma --kind all --tier all"
      recorded: []
    status: pending
    test_evidence:
      primary:
        - layer: local_contract
          suite: object_homepage_gamma_topology_static_contract
          cases:
            - local_contract.object_homepage_network.intersection_unified_experience.object_homepage_gamma_real_data_closure.gamma_topology_static_contract
          envs:
            - local
        - layer: api_integration
          suite: object_homepage_gamma_gateway_health
          cases:
            - api_integration.object_homepage_network.intersection_unified_experience.object_homepage_gamma_real_data_closure.gateway_health
          envs:
            - gamma
        - layer: user_acceptance
          suite: object_homepage_gamma_page_smoke
          cases:
            - user_acceptance.object_homepage_network.intersection_unified_experience.object_homepage_gamma_real_data_closure.page_smoke
          envs:
            - gamma_local
      supporting: []
    notes:
      - "2026-06-25: metadata verify pass with existing unrelated warnings in search/user_profile response_entity checks."
      - "2026-06-25: docker compose gamma-local config pass."
      - "2026-06-25: stackctl verify --env gamma --kind all --tier all fails at api_integration gateway health with SSL UNEXPECTED_EOF_WHILE_READING, and user_acceptance page smoke fails because Patrol CLI is missing."
  GWT2_entity_homepage_real_bundle:
    title: "实体主页真实 bundle、简介、相关圈子与关注状态闭环"
