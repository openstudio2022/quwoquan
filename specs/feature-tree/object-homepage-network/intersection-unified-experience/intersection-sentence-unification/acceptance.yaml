        suite: service_display_statement_contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.intersection_sentence_unification.service_svo_contract
        envs: *id001
      - layer: local_contract
        execution_profile: baseline
        suite: app_display_statement_contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.intersection_sentence_unification.app_fail_closed_contract
        envs: *id001
      - layer: api_integration
        execution_profile: integration
        suite: gamma_t3_intersection_statement_semantics
        cases:
        - api_integration.object_homepage_network.intersection_unified_experience.intersection_sentence_unification.gamma_semantic_probe
        envs:
        - gamma
      supporting: []
    notes:
    - '2026-07-06: local_contract 已覆盖 Service/App 语义合同；strict gamma 语义断言已补强但尚未在本轮跑远端 stackctl/beta/gamma remote smoke，故保持 partial。'
