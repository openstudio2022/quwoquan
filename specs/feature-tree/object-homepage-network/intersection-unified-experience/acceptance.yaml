    - 点击进入按维度分组列表页，展示自上次查看的新增交集。
    - 打开列表即推进已读水位并清零红点，无需逐项查看详情。
    performance_points:
    - 读模型 viewer_object_intersections 预物化 + 缓存，请求期零打分。
    tests:
      planned:
      - file: quwoquan_app/test/ui/user/widgets/my_intersection_inbox_widget_test.dart
