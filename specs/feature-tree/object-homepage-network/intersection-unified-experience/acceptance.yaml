version: 2
node:
  id: intersection-unified-experience
  level: L2_business_capability
  path: specs/feature-tree/object-homepage-network/intersection-unified-experience
  title: intersection unified experience
  parent_domain_service: object-homepage-network
  parent_business_capability: intersection-unified-experience
scope:
  summary: 交集统一体验与推荐端云一体验收范围（我的主页聚合入口、对象页交集卡、首页/频道交集推荐、事实与概率分通道、保鲜与冷却）。
  in_scope:
  - 六场景（S1–S5 + 横切句型）primaryText 单句展示与 G2 门禁。
  - 我的主页「我的交集」聚合入口：总数 + 最多 3 维度红点 + 自上次新增列表 + 打开清零。
  - profile/entity/circle 三类主页移除 demo 问小趣 dock。
  - 全局搜索交集 Tab 与 connectionState 分组消费 intersectionReason 子集。
  - 首页与各频道（含校园、旅行）交集推荐卡重设计：去关注按钮、头像 + 名字 + 红计数。
  - 实体主页与圈子主页的 gamma-local 真实 bundle、impact、related groups、object intersections 端云闭环。
  - IntersectionReason 字段收敛、recommendation/intersection 域契约、viewer_object_intersection
    读模型。
  - 事实与概率分通道、保鲜期、跨会话推荐冷却窗口、曝光到转化漏斗埋点。
  out_of_scope:
  - 交易、支付、预约闭环。
  - 第二套标签枚举或端侧拼接交集文案。
  - following_subject 关注列表未读机制改造。
sit_acceptance:
