        suite: contract
        cases:
        - local_contract.object_homepage_network.intersection_unified_experience.home_recommend_intersection_redesign.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded] local_contract quwoquan_app/test/ui/discovery/home_intersection_multiform_feed_widget_test.dart（双列/单列卡片均经统一交集句组件渲染唯一蓝色主谓宾句，无来源不展示，2026-06-16
      green）'
