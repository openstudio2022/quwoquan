scope:
  summary: 首页推荐 feed 卡片与 spotlight 交集句按主谓宾单句高保重做。
  in_scope:
  - feed 卡片（双列/单列）卡内唯一交集句。
  - spotlight 模块单句主谓宾（替换主/副双句堆叠）。
  - 交集句点击进对象页高亮归因保留。
  out_of_scope:
  - 频道集合调整。
  - 云侧推荐排序 / 保鲜冷却。
gwt_acceptance:
  GWT1:
    title: 首页 feed 卡片唯一交集句 GWT
    given:
    - alpha mock 提供带 IntersectionReason 的发现流卡片。
    when:
    - 渲染首页推荐 feed。
    then:
    - 每张卡片卡内有且仅一条蓝色主谓宾交集句。
    done_when:
    - 双列与单列卡片均经统一交集句组件渲染。
    edge_cases:
    - 卡片无交集来源时不显示交集句。
    contract_refs:
    - content/post/projections/discovery_feed.yaml
    performance_points: []
    tests:
      planned:
