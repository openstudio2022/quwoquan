version: 2
node:
  id: home-recommend-intersection-redesign
  level: L3_story
  path: specs/feature-tree/object-homepage-network/intersection-unified-experience/home-recommend-intersection-redesign
  title: home recommend intersection redesign
  parent_domain_service: object-homepage-network
  parent_business_capability: intersection-unified-experience
scope:
  summary: 首页推荐 feed 卡片与 spotlight 交集句按主谓宾单句高保重做。
  in_scope:
    - feed 卡片（双列/单列）卡内唯一交集句。
    - spotlight 模块单句主谓宾（替换主/副双句堆叠）。
    - 交集句点击进对象页高亮归因保留。
  out_of_scope:
    - 频道集合调整。
    - 云侧推荐排序 / 保鲜冷却。
gwt_acceptance:
  GWT1:
    title: 首页 feed 卡片唯一交集句 GWT
    given:
      - alpha mock 提供带 IntersectionReason 的发现流卡片。
    when:
      - 渲染首页推荐 feed。
    then:
      - 每张卡片卡内有且仅一条蓝色主谓宾交集句。
    done_when:
      - 双列与单列卡片均经统一交集句组件渲染。
    edge_cases:
      - 卡片无交集来源时不显示交集句。
    contract_refs:
      - content/post/projections/discovery_feed.yaml
    performance_points: []
    evidence:
      primary:
        - T2_module_interaction
      supporting:
        - T1_contract
    tests:
      planned:
        - quwoquan_app/test/ui/discovery/home_intersection_multiform_feed_widget_test.dart
      recorded:
        - "T2 quwoquan_app/test/ui/discovery/home_intersection_multiform_feed_widget_test.dart（双列/单列卡片均经统一交集句组件渲染唯一蓝色主谓宾句，无来源不展示，2026-06-16 green）"
        - "PENDING T3：gamma 发现流真实 IntersectionReason 拉取链路待 WP-D。"
    status: pending
  GWT2:
    title: spotlight 单句主谓宾 GWT
    given:
      - alpha mock 提供 channel 交集 spotlight 数据。
    when:
      - 渲染「与你有关的新发现」横滑模块。
    then:
      - 每张 spotlight 卡展示头像/封面 + 类型角标 + 一条主谓宾句，无主/副双句堆叠。
    done_when:
      - spotlight 文案口径与 intersection-definition §17 一致。
    edge_cases: []
    contract_refs:
      - recommendation/rec_model/projections/intersection_reason.yaml
    performance_points: []
    evidence:
      primary:
        - T2_module_interaction
      supporting:
        - T1_contract
    tests:
      planned:
        - quwoquan_app/test/ui/discovery/home_intersection_multiform_feed_widget_test.dart
      recorded:
        - "T2 quwoquan_app/test/ui/discovery/home_intersection_multiform_feed_widget_test.dart（spotlight 卡：头像/封面 + 类型角标 + 一条主谓宾句，无主/副双句堆叠，≤4 卡曝光归因 + 换一批，2026-06-16 green）"
        - "PENDING T3：gamma /v1/content/feed/intersections 真实 spotlight 链路待 WP-D。"
    status: pending
execution:
  local_gate:
    - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
    - bash agent_ops/scaffold/verify_acceptance_standard.sh
    - make verify-app-page-horizontal-quality
  full_gate:
    - make gate
