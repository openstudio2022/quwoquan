        execution_profile: release
        suite: journey
        cases:
        - user_acceptance.shared_homepage_network.homepage_discovery_and_attach_journey.homepage_entry_and_preview.journey
        envs:
        - gamma_local
    notes:
    - "2026-07-20 M9 商用化审查：六类入口（搜索/feed 对象卡/关注频道/沉浸浏览器实体提及/交集导航/深链）已在代码可达且 planned 证据文件均存在；等 entity-service packet 迁移编译恢复后跑绿回填 recorded。"
