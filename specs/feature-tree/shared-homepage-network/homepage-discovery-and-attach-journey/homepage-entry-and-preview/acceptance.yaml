version: 2
node:
  id: homepage-entry-and-preview
  level: L3_story
  path: specs/feature-tree/shared-homepage-network/homepage-discovery-and-attach-journey/homepage-entry-and-preview
  title: homepage entry and preview
  parent_domain_service: shared-homepage-network
  parent_business_capability: homepage-discovery-and-attach-journey
scope:
  summary: 从搜索结果、内容卡、关注频道、交集导航进入主页详情并保留原上下文。
  in_scope:
  - 搜索/feed 对象卡/关注频道/沉浸浏览器实体提及/交集导航进入 homepageDetail。
  - 预览摘要（HomepageSummary initialSummary）先渲染，详情数据到达后替换。
  - 返回后原搜索或发布上下文保留。
  out_of_scope:
  - 主页完整内容与口碑消费（homepage-review-and-content-journey）。
  - 主页搜索候选本身（homepage-search-and-picker）。
gwt_acceptance:
  GWT1:
    title: 多入口进入主页详情且预览到详情无跳变
    given:
    - 已发布主页可经 /homepages/{id} 访问，入口携带 referralSource 与可选 initialSummary。
    when:
    - 用户从搜索结果、feed 对象卡、关注频道或交集导航点击进入。
    then:
    - 详情页按 referralSource 上报曝光（trackEntityPageView），加载失败展示结构化错误态并可重试。
    - initialSummary 先呈现基础信息，bundle 到达后无信息架构跳变。
    - 返回（pop）后原上下文（搜索词/feed 位置）保留。
    done_when:
    - 入口断裂为零：六类入口全部可达 homepageDetail 且埋点带 referralSource。
    edge_cases:
    - 主页已下线时展示 homepage_offline(410) 语义错误态与安全返回。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/app_routes.yaml
    - quwoquan_service/contracts/metadata/entity/homepage/service.yaml
    performance_points:
    - GetHomepageDetail p95 < 1.5s（L1 spec SLO 同源）。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_record_navigation__functional__local_contract_test.dart
      - file: quwoquan_service/services/entity-service/tests/api_integration/homepage_handler__api_integration_test.go
      - file: quwoquan_app/test/user_acceptance/pages/entity/homepage_detail/homepage_detail_page__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.shared_homepage_network.homepage_discovery_and_attach_journey.homepage_entry_and_preview.contract
        envs: &id001
        - local
      - layer: local_contract
