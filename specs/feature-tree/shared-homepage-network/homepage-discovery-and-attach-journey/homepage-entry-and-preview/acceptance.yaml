        suite: gwt1_local_contract
        cases:
        - local_contract.shared_homepage_network.homepage_discovery_and_attach_journey.homepage_entry_and_preview.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
