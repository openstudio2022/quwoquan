  level: L3_story
  path: specs/feature-tree/shared-homepage-network/homepage-discovery-and-attach-journey/homepage-attach-in-publish-flow
  title: homepage attach in publish flow
  parent_domain_service: shared-homepage-network
  parent_business_capability: homepage-discovery-and-attach-journey
scope:
  summary: 发布器主主页挂载与主页内发布上下文自动带入的单轨语义。
  in_scope:
  - 发布器经 homepagePicker 选择主主页并写入 post primaryHomepageId。
  - 从主页详情进入创作时经 HomepageCanonicalReference extra 自动带入当前主页。
  - 口碑必绑主页、笔记/作品/提问可选绑的规则。
  out_of_scope:
  - 发布器完整编辑体验。
  - 多主页挂载。
gwt_acceptance:
  GWT1:
    title: 全局发布与主页内发布共用同一挂载语义
    given:
    - 用户从创作入口或主页详情「发布」进入同一发布器。
    when:
    - 用户选择/确认主主页并发布内容。
    then:
    - 发布 payload 携带唯一 primaryHomepage 引用；主页内进入时默认带入且可更换。
    - 发布失败不出现「内容已发布但主页未挂上」的静默不一致。
    done_when:
    - 两个入口产生的挂载字段与回流聚合语义一致。
    edge_cases:
    - 所选主页在发布前被下线时给出结构化错误并允许改选。
    contract_refs:
    - quwoquan_service/contracts/metadata/content/post/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage/service.yaml
