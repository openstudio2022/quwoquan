scope:
  summary: 搜索无结果时补充主页提交进入候选态，并返回原上下文。
  in_scope:
  - suggestHomepage 页最小必要信息提交（SuggestHomepageCandidate）。
  - 提交进入 candidate 态，不直接公开。
  - 提交后返回搜索/发布上下文。
  out_of_scope:
  - 候选发布审核后台（homepage-candidate-intake-and-publish 的治理消费面）。
  - 认领申请。
gwt_acceptance:
  GWT1:
    title: 用户补充缺失主页并进入候选待审
    given:
    - 已登录 persona 在搜索无结果或地点落地页点击「补充主页/提升为主页」。
    when:
    - 填写类型、名称等最小信息并提交。
    then:
    - 服务端以可信 persona 落库 candidate（sourceType=user_suggested），不进入公开搜索。
    - 提交失败不丢失已填内容；成功后返回原上下文并有明确反馈。
    done_when:
    - SuggestHomepageCandidate per-op ready；候选不可公开浏览由状态机保证。
    edge_cases:
    - 同名主页已存在时给出去重提示或直接引导至现有主页。
