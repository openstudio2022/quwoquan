  id: homepage-offline-report-and-history-retention
  level: L3_story
  path: specs/feature-tree/shared-homepage-network/homepage-claim-maintain-and-offline-journey/homepage-offline-report-and-history-retention
  title: homepage offline report and history retention
  parent_domain_service: shared-homepage-network
  parent_business_capability: homepage-claim-maintain-and-offline-journey
scope:
  summary: 用户上报主页状态异常，审核 confirmed_offline 后主页下线但历史保留。
  in_scope:
  - homepageStatusReport 页提交纠错/歇业上报（CreateHomepageStatusReport）。
  - Ops portal 查询待审队列并执行 confirmed_offline/dismissed 审核。
  - confirmed_offline 经事件驱动 Homepage 下线并从搜索删除。
  - 下线后详情返回 homepage_offline(410) 语义，历史口碑/挂载记录保留不硬删。
  out_of_scope:
  - 上报处理结果的站内信通知。
gwt_acceptance:
  GWT1:
    title: 状态上报进入待审并在确认后下线保留记录
    given:
    - 已登录 persona 在已发布主页发现状态异常。
    when:
    - 提交 reason+描述；治理 operator 审核 confirmed_offline 或 dismissed。
    then:
    - 上报以可信 persona 落库 pending_review；同 reporter 同 reason 去重。
    - confirmed_offline 后主页 status=offline、搜索投影删除、详情呈现下线语义。
    - 历史评价与挂载记录保留（禁止回退为硬删除）。
    - 同 actor/idempotency-key/digest 重放返回同一结果，审核终态不可互改。
    - 审核事实经 durable outbox 与 checkpoint 幂等投影到 Homepage。
    done_when:
    - List/Create/ReviewHomepageStatusReport 全部 per-op commercial ready，Ops portal 治理队列已有真实 consumer。
    - receipt、CAS/终态守卫、outbox 投影与页面提交成功/失败路径均有测试证据。
    edge_cases:
    - 匿名提交被结构化 403 拒绝；重复上报幂等。
    - 上报者不可审核自己的上报，缺 reviewer actor 时 fail-closed。
    contract_refs:
    - quwoquan_service/contracts/metadata/entity/homepage_status_report/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage_status_report/events.yaml
