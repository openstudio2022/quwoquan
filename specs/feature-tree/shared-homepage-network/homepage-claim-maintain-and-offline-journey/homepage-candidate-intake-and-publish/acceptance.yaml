    - 具备 entity_governance_operator 权限的 account 登录治理消费面。
    when:
    - 建档候选并执行 publish。
    then:
    - 候选以幂等命令落库；publish 后 status=published、进入搜索投影并可被 App 消费。
    - 非治理 account 调用被结构化 403 拒绝。
    done_when:
