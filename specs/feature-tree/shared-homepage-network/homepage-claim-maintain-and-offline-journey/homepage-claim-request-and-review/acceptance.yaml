gwt_acceptance:
  GWT1:
    title: 用户提交认领申请且审核幂等推进主页认领态
    given:
    - 已登录 persona 打开已发布未认领主页的认领申请页。
    when:
    - 用户提交认领材料（tier/执照/证件/联系方式）；治理 operator 审核 approved/rejected。
    then:
    - 申请以可信 operation.Context persona 落库（requesterPersonaId，无 body 身份、无 mock-user 兜底）。
    - approved 推进 Homepage claimStatus=claimed 且 owner 绑定申请 persona；认领 owner 可维护基础资料。
    - 同 actor/idempotency-key/digest 重放返回同一申请；同一主页同一 persona 同时最多一个 pending_review 申请。
    - approved/rejected 终态不可互改；审核事实经 durable outbox 与 checkpoint 幂等投影到 Homepage。
    done_when:
    - List/Create/ReviewHomepageClaimRequest 全部 per-op commercial ready，Ops portal 治理队列已有真实 consumer。
    - actor-scoped receipt、partial unique pending 索引、CAS/终态守卫与跨聚合投影均有 local_contract + 真实 Mongo 证据。
    edge_cases:
    - 匿名/无 persona 提交被结构化 403 拒绝。
    - 相同幂等键不同 digest 返回 idempotency_conflict；重复 pending 返回 duplicate_pending_claim。
    - 申请人不可审核自己的申请，缺 reviewer actor 时 fail-closed。
    contract_refs:
    - quwoquan_service/contracts/metadata/entity/homepage_claim_request/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage_claim_request/readiness.yaml
    performance_points:
    - 命令 p95 800ms（service.yaml slo 同源）。
