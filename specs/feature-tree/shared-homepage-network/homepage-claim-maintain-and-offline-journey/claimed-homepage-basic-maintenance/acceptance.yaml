version: 2
node:
  id: claimed-homepage-basic-maintenance
  level: L3_story
  path: specs/feature-tree/shared-homepage-network/homepage-claim-maintain-and-offline-journey/claimed-homepage-basic-maintenance
  title: claimed homepage basic maintenance
  parent_domain_service: shared-homepage-network
  parent_business_capability: homepage-claim-maintain-and-offline-journey
scope:
  summary: 认领 owner 维护主页基础资料（UpdateClaimedHomepageBasics）。
  in_scope:
  - homepageMaintenance 页编辑副标题/地址/封面等基础字段并提交。
  - 仅 claimed owner persona 可写（claimed_homepage_owner ownership policy）。
  - CAS 版本冲突的结构化恢复（version_conflict → refresh）。
  out_of_scope:
  - 认领审批流本身（homepage-claim-request-and-review）。
  - canonical identity/homepageType 修改（创建后不可变）。
gwt_acceptance:
  GWT1:
    title: 认领 owner 更新基础资料且非 owner 被拒
    given:
    - 主页 claimStatus=claimed 且当前 persona 为 owner。
    when:
    - owner 提交基础资料变更；非 owner persona 尝试提交。
    then:
    - owner 提交成功并回详情页刷新；非 owner 得到结构化 permission_denied(403)。
    - 版本冲突返回 version_conflict(409) 且页面给出刷新恢复动作。
    done_when:
    - UpdateClaimedHomepageBasics per-op ready 且权限/冲突负例齐备。
    edge_cases:
    - 主页被下线后维护入口禁用。
    contract_refs:
    - quwoquan_service/contracts/metadata/entity/homepage/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage/errors.yaml
    performance_points:
    - 命令 p95 800ms（service.yaml slo 同源）。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_maintenance_page_widget__local_contract_test.dart
