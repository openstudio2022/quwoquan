    notes:
    - 2026-07-19（B6）：HomepageReview 对象商用闭环——服务端 CAS+receipt+outbox、真实摘要投影替换合成假摘要、App typed facet + 写评价 sheet + product_action 埋点；gamma UAT 页面驱动证据待环境部署后补录。
