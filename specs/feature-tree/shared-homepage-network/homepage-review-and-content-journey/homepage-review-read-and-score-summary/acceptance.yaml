version: 2
node:
  id: homepage-review-read-and-score-summary
  level: L3_story
  path: specs/feature-tree/shared-homepage-network/homepage-review-and-content-journey/homepage-review-read-and-score-summary
  title: homepage review read and score summary
  parent_domain_service: shared-homepage-network
  parent_business_capability: homepage-review-and-content-journey
scope:
  summary: 主页评价读写全链与评分摘要真实聚合（HomepageReview 独立聚合 + Homepage 摘要投影）。
  in_scope:
  - 发表/编辑/删除我的评价（1-5 星 + 正文 + 亮点标签）
  - 评价 keyset 列表与我的评价预填（含软删复活）
  - 摘要卡真实均分/评分数/亮点标签（review tagRefs 频次聚合）
  out_of_scope:
  - 维度分评价（B6 裁决砍除）
  - 评价治理（举报/下架，归 Ops portal 后续批次）
gwt_acceptance:
  GWT1:
    title: 用户发表评价后列表与评分摘要真实收敛
    given:
    - 已登录 persona 打开已发布主页详情页的口碑子 tab。
    when:
    - 用户经写评价 sheet 提交 1-5 星、正文与亮点标签；随后编辑或删除该评价。
    then:
    - 评价出现在列表且"我的评价"支持编辑/删除；同一 persona 对同一主页只有一条记录。
    - 摘要（均分/评分数/亮点标签）由服务端对 active 评价真实聚合，删除后同步回退。
    - 网络重试经 Idempotency-Key 幂等重放，不产生重复评价；非作者修改被结构化拒绝。
    done_when:
    - 五个 operation（create/update/delete/list/mine）在 alpha mock 与 remote 行为同构且全部 per-op commercial ready。
    edge_cases:
    - 软删后再次发表复活同一聚合（版本连续递增）。
    - 主页 offline/不存在时评价写入被结构化拒绝。
    contract_refs:
    - quwoquan_service/contracts/metadata/entity/homepage_review/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage_review/readiness.yaml
    performance_points:
    - 列表查询 p95 300ms；命令 p95 800ms（service.yaml slo 同源）。
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/entity-service/internal/application/homepage_review/facade__local_contract_test.go
      - quwoquan_service/services/entity-service/tests/api_integration/homepage_review_handler__api_integration_test.go
      - quwoquan_service/services/entity-service/tests/api_integration/homepage_review_mongo_store__api_integration_test.go
      - quwoquan_app/test/local_contract/cloud/entity/homepage_review_alpha_facet__contract__local_contract_test.dart
      - quwoquan_app/test/local_contract/ui/entity/homepage_review_sheet__widget__local_contract_test.dart
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.shared_homepage_network.homepage_review_and_content_journey.homepage_review_read_and_score_summary.contract
        envs: &id001
