version: 2
node:
  id: homepage-contextual-publish-entry
  level: L3_story
  path: specs/feature-tree/shared-homepage-network/homepage-review-and-content-journey/homepage-contextual-publish-entry
  title: homepage contextual publish entry
  parent_domain_service: shared-homepage-network
  parent_business_capability: homepage-review-and-content-journey
scope:
  summary: 从主页详情发起创作并自动带入当前主页引用。
  in_scope:
  - 详情页创作入口经 HomepageCanonicalReference extra 进入统一发布器。
  - 游客点击先见创作面板/登录门（对齐登录入口无死循环契约）。
  out_of_scope:
  - 发布器编辑体验与媒体处理。
  - 口碑发表（homepage-review-read-and-score-summary 承载）。
gwt_acceptance:
  GWT1:
    title: 主页内发布入口带上下文进入统一发布器
    given:
    - 用户处于已发布主页详情。
    when:
    - 点击「发布/记录」入口。
    then:
    - 进入统一 create 发布器且当前主页引用已带入，可确认或更换。
    - 未登录用户经 requireLogin 门禁；关闭登录回安全态不再复弹。
    done_when:
    - 主页内入口与全局创作入口产出同一挂载语义。
    edge_cases:
    - 主页 offline 时创作入口隐藏或禁用并给出说明。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/page_object_contract.yaml
    performance_points: []
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/entity/pages/homepage_detail_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/entity/homepage_detail/homepage_detail_page__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.shared_homepage_network.homepage_review_and_content_journey.homepage_contextual_publish_entry.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.shared_homepage_network.homepage_review_and_content_journey.homepage_contextual_publish_entry.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: journey
        cases:
        - user_acceptance.shared_homepage_network.homepage_review_and_content_journey.homepage_contextual_publish_entry.journey
        envs:
        - gamma_local
    notes:
    - "2026-07-20 M9 商用化审查：详情页 _openCreateContent 已实现带 HomepageCanonicalReference；跑绿并补 offline 态负例后回填 recorded。"
