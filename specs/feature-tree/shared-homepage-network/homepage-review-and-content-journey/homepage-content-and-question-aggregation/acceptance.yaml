  level: L3_story
  path: specs/feature-tree/shared-homepage-network/homepage-review-and-content-journey/homepage-content-and-question-aggregation
  title: homepage content and question aggregation
  parent_domain_service: shared-homepage-network
  parent_business_capability: homepage-review-and-content-journey
scope:
  summary: 主页记录/讨论聚合 Tab 消费挂载内容与问答预览，并可跳转内容消费。
  in_scope:
  - HomepageUIConfig 驱动的一级 Tab（记录/讨论/兴趣圈）与记录流二级过滤。
  - contentPreview/questionPreview 投影消费与点击进入 workBrowser。
  - 点击埋点携带 referralSource=entityPage 与 feedRequestId。
  out_of_scope:
  - 发布写入（homepage-contextual-publish-entry）。
  - 评论树本身（content 域）。
gwt_acceptance:
  GWT1:
    title: 用户在主页浏览挂载记录并进入消费
    given:
    - 已发布主页带 contentPreview/questionPreview 投影（fixture 或真实挂载回流）。
    when:
    - 用户切换 Tab、按类型过滤并点击一条记录。
    then:
    - Tab 结构来自 HomepageUIConfig codegen，不由页面硬编码。
    - 点击经 contentBehaviorTracker 上报后进入 workBrowser 且上下文保留。
    - 无内容时展示可恢复空态，不制造假记录。
    done_when:
    - 记录/讨论聚合四态齐备且点击回流埋点在。
    edge_cases:
    - 挂载帖子被删除/封禁后预览同步失效不可点击。
    contract_refs:
    - quwoquan_service/contracts/metadata/entity/homepage/ui_config.yaml
    - quwoquan_service/contracts/metadata/entity/homepage/projections/homepage_content_preview.yaml
