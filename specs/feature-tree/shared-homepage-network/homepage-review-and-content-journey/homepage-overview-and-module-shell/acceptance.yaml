gwt_acceptance:
  GWT1:
    title: 地点和事物主页首屏统一结构
    given:
    - 用户进入一个已发布的地点和事物主页。
    when:
    - 页面首屏完成渲染。
    then:
    - 用户 5 秒内能看懂这是什么、我与它有什么关系、围绕它正在发生什么。
    done_when:
    - 首屏顺序为身份区、关注/私信、与你的交集、认识对象、内容/讨论/兴趣圈。
    - 用户可见文案不出现实体，兜底使用对象名、具体类型或这个主页。
    - 与你的交集使用纵向列表，默认 3 条，展开更多后再进入全部交集页。
    - 紫色主视觉替换为品牌蓝；管理、认领、状态上报在更多菜单中。
    edge_cases:
    - 无介绍摘要时认识对象卡不阻塞首屏。
    - 无交集时交集模块收起，不制造假交集。
