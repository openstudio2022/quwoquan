        execution_profile: integration
        suite: contract2_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.contract2_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: contract2_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.contract2_local_contract
        envs: *id001
    notes:
    - '2026-07-12: TestAuth_SocialLogin_WechatAlipayQqExchangeStableServerIdentity 与全量 TestAuth_* API integration 通过；数据库迁移同时约束全局凭证唯一、owner 内同类型唯一及可选手机号唯一。'
  CONTRACT3:
    title: 登录商业可观测、采样与保留契约
    done_when:
    - 登录漏斗、各 provider 请求结果、非 2xx 比率、P95 与 USER 错误码在同一 L2 大盘可查。
    - provider 非 2xx 比率超过 2%，或挑战/登录 P95 超过 1.2s/1.5s，连续两个 5 分钟窗口后触发告警。
    - '`sys.user.auth.*` 声明成功明细采样、30 天原始明细和 180 天聚合指标保留，并支持 progressive rollout。'
    - 登录观测不得依赖已退役的 product-ops `event_records` Mongo 集合；运行时采样和保留必须由正式单轨实现证明。
