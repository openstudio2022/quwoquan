contract_acceptance:
  CONTRACT1:
    title: 社交 metadata/codegen/错误码契约一致
    done_when:
    - LoginWithAlipay / LoginWithQq 为 public operation 且 request/response 由 metadata
      生成。
    - CredentialType 枚举包含 alipay/qq。
    - USER.AUTH 社交错误码生成 Dart/Go 常量。
    - 端侧 RemoteAuthRepository 消费生成的 path/pageId，不硬编码。
    - Apple 与 Passkey 不在 public operation、RemoteAuthRepository 或用户服务公开登录路由中；
      `POST /auth/login/apple` 和 `POST /auth/login/passkey` 必须返回 404。
    - SendOtp、手机号、微信、QQ、支付宝、一键登录和 hint 的 commercial/security/privacy/reliability/telemetry/SLO 均由 ContractGraph 生成；缺生产证据的 provider 必须保持 blocked。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/user/account_identity_facets__contract__local_contract_test.dart
      - file: quwoquan_service/services/user-service/tests/api_integration/credential_contract__api_integration_test.go
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/user/account_identity_facets__contract__local_contract_test.dart
      - file: quwoquan_service/services/user-service/tests/api_integration/credential_contract__api_integration_test.go
    status: implemented
    test_evidence:
      primary:
