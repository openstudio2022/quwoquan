version: 2
node:
  id: four-environment-commercial-login-maturity
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/four-environment-commercial-login-maturity
  title: four environment commercial login maturity
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: onboarding-and-identity-entry
scope:
  summary: 四环境（alpha/beta/gamma/prod）× 三类外部依赖（短信OTP/运营商一键/社交OAuth）配置矩阵、社交三方票据置换与首登资料同步、凭证唯一性与生产纯净。
  in_scope:
  - 三类外部依赖防腐接口与分环境 fail-closed 配置
  - alpha/beta/gamma 固定测试码 provider 与 prod 真实 provider 的构建隔离
  - 删除任意验证码、debugCode、sandbox phone allowlist 与 pass-through 旁路
  - LoginWithSocialProvider 微信/支付宝/QQ 票据置换与首登资料同步
  - LoginWithAlipay / LoginWithQq metadata 契约与 codegen
  - 凭证全局唯一与 owner 内每类型唯一
  - 端侧 NativeAuthBridge 与 LoginPage 三方登录无死循环
  - "`SendOtp` response 不包含验证码"
  - "`verify_login_dependency_config` 强制非生产 fixed_test、prod provider 及 build-tag 包纯度"
  out_of_scope:
  - Apple / Passkey 正式 SDK 登录；当前不得提供 App 登录入口、Remote Repository 方法或公开 HTTP 登录路由
  - 第三方头像转存自有 CDN
gwt_acceptance:
  GWT1:
    title: 四环境矩阵冻结且非生产测试能力与 prod 隔离
    given:
    - 四环境 user-service 配置均使用 HTTPS 外部依赖地址，OTP mode 已显式声明。
    when:
    - 运行登录外部依赖配置门禁。
    then:
    - 任一环境出现 pass-through、sandbox allowlist、sandbox phone、任意验证码或 debug reveal 配置即被阻断。
    - alpha/beta/gamma 必须为 fixed_test；prod 必须为 provider，且 prod 默认构建源集不包含固定码与非生产 dispatch adapter。
    - social providers 为映射、one-tap resolver 非空。
    - gamma-local 仅通过 `-tags=nonprod` 装配固定码；生产 Dockerfile 默认不启用该 tag。
    done_when:
    - 四环境登录依赖矩阵在配置与门禁中同源表达。
    - prod 缺正式 provider、密封密钥或错误选择 fixed_test 时 fail-closed。
    contract_refs:
    - quwoquan_service/services/user-service/configs/gamma/config.yaml
    - quwoquan_service/services/user-service/configs/prod/config.yaml
    - quwoquan_service/scripts/verify/verify_login_dependency_config.py
    performance_points:
    - 配置纯度门禁必须可在本地和 CI 中确定性执行，不依赖真实上游。
    tests:
      planned:
      - file: quwoquan_ops/tests/local_contract/test_login_dependency_config__fail_closed__security__local_contract_test.py
      recorded:
      - file: quwoquan_ops/tests/local_contract/test_login_dependency_config__fail_closed__security__local_contract_test.py
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.gwt1_api_integration
        envs: &id002
        - beta
        - gamma
    notes:
    - '2026-07-15: alpha/beta/gamma 显式 fixed_test、prod 显式 provider；固定码与本地 dispatch 只存在于 nonprod build tag，prod 源集和默认镜像构建均排除。'
  GWT2:
    title: 短信 OTP challenge、密封传输与固定码校验不泄漏
    given:
    - user-service 创建持久化 challenge；非生产 fixed_test 通过隔离 adapter 激活，provider 模式通过 ExternalInteractionClient 投递。
    when:
    - 客户端请求 SendOtp，并用错误验证码尝试登录。
    then:
    - response 只包含脱敏号码、challenge/request identity、状态和有效期。
    - 固定码仅为 123456，错误码、过期、第五次失败锁定、一次性消费和发送限流均生效。
    - provider 模式仅传递 AES-256-GCM codeRef；outbox、attempt ledger、日志和指标不保存手机号、验证码或 codeRef。
    - provider 模式仅通过 service principal、operation scope 与校验服务端证书并出示客户端证书的 HTTPS/mTLS transport 提交；任一证书材料缺失时 fail-closed。
    done_when:
    - application contract 覆盖 provider 失败、正常排队和错误验证码拒绝。
    - API integration 证明 response/outbox 不泄露验证码，provider 只在请求前于内存中解封。
    contract_refs:
    - quwoquan_service/services/user-service/internal/application/account/authentication_challenge/command_facade__local_contract_test.go
    - quwoquan_service/services/user-service/tests/api_integration/helpers.go
    - quwoquan_service/services/integration-service/tests/api_integration/external_interaction_mongo_provider__reliability__api_integration_test.go
    - quwoquan_service/services/user-service/internal/infrastructure/integration/service_mtls_client__local_contract_test.go
    performance_points:
    - OTP 投递不引入绕过校验或响应泄露。
    tests:
      planned:
      - file: quwoquan_service/services/user-service/internal/application/account/authentication_challenge/command_facade__local_contract_test.go
      recorded:
      - file: quwoquan_service/services/user-service/internal/application/account/authentication_challenge/command_facade__local_contract_test.go
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt2_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt2_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.gwt2_local_contract
        envs: *id001
    notes:
    - '2026-07-15: fixed_test 覆盖正确、错误、五次锁定、过期语义与复用拒绝；Mongo API integration 证明 codeRef 仅进入 TTL vault、不进入 outbox，provider 前瞬时解封；mTLS local contract 证明服务端 CA 校验和客户端证书出示，缺材料 fail-closed。'
  GWT3:
    title: 社交三方票据置换分环境实现且 prod 使用官方协议
    given:
    - 服务运行时只装配真实 HTTP provider；缺少正式凭据时 fail-closed。
    when:
    - 分别用确定性 HTTP 协议响应与未配置 provider 进行 Exchange。
    then:
    - prod 使用正式凭证完成微信、支付宝、QQ 官方签名或令牌置换。
    - 未配置 app 凭证时返回结构化 unavailable，不伪造成功。
    - 错误响应与日志不包含 secret、authCode、token、provider 原始 body 或 OAuth URL query。
    done_when:
    - 三类官方 provider resolver 均有确定性协议测试。
    - prod 微信、支付宝、QQ 均有真实 UAT；未配置凭证只用于验证 fail-closed，不能作为完成证据。
    contract_refs:
    - quwoquan_service/services/user-service/internal/infrastructure/integration/external_auth_provider_client__local_contract_test.go
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    - quwoquan_service/contracts/metadata/user/user_profile/errors.yaml
    performance_points:
