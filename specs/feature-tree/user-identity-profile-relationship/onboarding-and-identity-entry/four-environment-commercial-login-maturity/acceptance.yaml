        execution_profile: baseline
        suite: contract1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.contract1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: contract1_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.contract1_api_integration
        envs: *id002
    notes:
    - '[migrated_from_recorded_command] cd quwoquan_app && flutter test test/cloud/user/contract/auth_repository_contract_test.dart'
    - '2026-07-12: make verify-app-auth-policy 与 RemoteSocialAuthorizationRepository/AuthRepository local_contract 通过。'
    - '2026-07-12: TestUnsupportedFutureLoginMethodsAreNotPublic 通过；Apple/Passkey route 从 metadata、RemoteAuthRepository 与 user-service handler 同步移除。'
    - '2026-07-14: 8 个登录操作已补齐 commercial/security/privacy/reliability/telemetry/SLO；社交和一键登录继续因 R-AUTH-001 标为 blocked，未用本地绿灯冒充生产 ready。'
  CONTRACT2:
    title: 凭证唯一性约束契约
    done_when:
    - 全局 credential_type+credential_key 唯一。
    - owner 内 owner_id+credential_type 唯一。
    tests:
      planned:
      - file: quwoquan_service/services/user-service/tests/api_integration/auth_contract__api_integration_test.go
      recorded:
