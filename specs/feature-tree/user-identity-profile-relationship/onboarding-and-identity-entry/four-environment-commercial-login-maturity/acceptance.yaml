        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.gwt3_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt3_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.gwt3_local_contract
        envs: *id001
    notes:
    - '2026-07-15: 微信、支付宝、QQ HTTP 协议、未配置 fail-closed 与敏感信息脱敏测试通过；prod 正式凭据与真机成功证据仍待发布密钥系统注入，故状态保持 partial。'
  GWT4:
    title: 社交首登创建账号并同步昵称头像
    given:
    - 某社交身份首次登录，App 上传短期 authCode。
    when:
    - 服务端 LoginWithSocialProvider 置换身份并首登。
    then:
    - 创建 owner + primary persona + credential，credentialKey 由 unionId/appOpenId 生成。
    - 用厂商资料初始化昵称（去重）与头像。
    - accountHint 返回 nicknameCustomized=true；头像只有通过端侧可信候选校验并成功解码后才展示，原始第三方 URL 不绕过安全边界。
    - 二次同一身份登录命中既有 credential，不重复创建。
    done_when:
    - 社交首登和二次登录都被 auth contract 测试覆盖。
    - owner、primary persona、credential 与昵称头像初始化结果可在真实存储验证。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/fields.yaml
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    - quwoquan_service/services/user-service/tests/api_integration/auth_contract__api_integration_test.go
    performance_points:
    - 社交票据置换 P95 <= 1500ms；首登资料同步 P95 <= 1000ms，资料同步失败不阻断登录。
    tests:
      planned:
