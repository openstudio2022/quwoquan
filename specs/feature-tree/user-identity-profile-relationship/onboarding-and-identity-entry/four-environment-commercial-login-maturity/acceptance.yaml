        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.four_environment_commercial_login_maturity.gwt4_local_contract
        envs: *id001
    notes:
    - '2026-07-12: TestAuth_SocialLogin_WechatAlipayQqExchangeStableServerIdentity
      通过，覆盖三方首登、稳定 credential、昵称头像初始化与重复登录；018 迁移允许多个未绑定手机号的社交账号并保持非空手机号唯一。'
    - '2026-07-14: 社交 accountHint 补齐 nicknameCustomized；取得厂商头像字段与端侧成功展示分离，第三方头像转存自有 CDN 仍保持 Out of Scope。'
  GWT5:
    title: 端侧社交登录命中 metadata 且失败不回环
    given:
    - 端侧使用平台能力桥，RemoteAuthRepository 指向 gateway。
    when:
    - 用户点击微信/支付宝/QQ 登录，或第三方授权取消/不可用。
    then:
    - loginAlipay/loginQq 命中 metadata path 与 pageId 并透传 authCode。
    - 失败只在唯一登录流程反馈槽提示；取消静默恢复且不显示错误。
    - 支持平台的未安装、未配置、探测超时和 SDK 不可用保持入口可发现，点击后就近解释并提供短信恢复；仅平台明确不支持时隐藏。
    - 普通压栈入口显示返回，受限目的地显示安全关闭；错误不得改变该策略，关闭后不二次弹登录。
    done_when:
    - App 端社交登录 Repository、NativeAuthBridge 和 LoginPage 状态均有 local_contract 覆盖。
    - 授权取消、provider 不可用和服务错误不会触发登录回环。
    - 同一次失败不会同时显示 Toast/Snackbar 与内联反馈。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    - quwoquan_service/contracts/metadata/user/user_profile/errors.yaml
    - quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
    performance_points:
    - 登录页错误恢复必须就近完成，不造成页面重建死循环或重复弹窗。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/user/account_identity_facets__contract__local_contract_test.dart
