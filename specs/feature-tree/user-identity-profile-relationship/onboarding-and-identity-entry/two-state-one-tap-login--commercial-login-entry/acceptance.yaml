version: 2
node:
  id: two-state-one-tap-login--commercial-login-entry
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login--commercial-login-entry
  title: two state one tap login commercial login entry
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: onboarding-and-identity-entry
scope:
  summary: 商用登录入口验收：历史账号一键登录、本机号码一键登录/创建、其它手机号验证码登录、高保同构布局、端云契约与数据库副作用。
  in_scope:
  - LoginPage 两状态同构高保布局与响应式截图
  - 本地历史账号摘要与服务端二次登录
  - 运营商 SDK capability/hint/login 链路
  - 手机号验证码登录全状态 UI 与异常逃生路径
  - ResolveOneTapLoginHint / LoginOneTap metadata 契约
  - SendOtp / LoginWithPhone metadata 契约
  - user-service 账号查询/创建、credential/device/consent 持久化
  - 登录埋点、SLO、灰度与回滚
  out_of_scope:
  - 微信、QQ、支付宝、Apple、Passkey 正式 SDK 登录
  - Web 运营商一键登录可用性承诺
gwt_acceptance:
  GWT1:
    title: 历史账号摘要展示并通过服务端二次登录
    given:
    - App 本地存在 remembered account summary，但 access token 已失效或用户手动退出。
    when:
    - 用户打开登录页并点击“一键登录”。
    then:
    - 页面展示头像、昵称、脱敏手机号。
    - 点击主按钮必须调用服务端登录接口刷新 token，不得仅凭本地摘要进入登录态。
    - 登录成功后回到 redirect 或 AuthContinuation 目标态。
    done_when:
    - 历史账号摘要只作为展示线索，真实登录态必须来自服务端 token 刷新。
    - redirect/AuthContinuation 目标态与登录关闭安全态均被测试覆盖。
    contract_refs:
    - quwoquan_app/test/ui/user/login_page_widget_test.dart
    - quwoquan_app/test/core/auth/auth_session_store_test.dart
    - quwoquan_app/test/cloud/user/contract/auth_repository_contract_test.dart
    performance_points:
    - 历史账号二次登录过程中页面必须保持可恢复加载态，不出现本地假登录闪回。
    tests:
      planned:
      - file: quwoquan_app/test/ui/user/login_page_widget_test.dart
      - file: quwoquan_app/test/core/auth/auth_session_store_test.dart
      - file: quwoquan_app/test/cloud/user/contract/auth_repository_contract_test.dart
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt1_local_contract
        envs: *id001
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt1_api_integration
        envs: &id002
        - beta
        - gamma
    notes:
    - '[migrated_from_recorded_command] cd quwoquan_app && flutter test test/ui/user/login_page_widget_test.dart
      test/core/auth/auth_session_store_test.dart test/cloud/user/contract/auth_repository_contract_test.dart'
    - '[migrated_from_recorded_command] cd quwoquan_app && make verify-app-login-entry-loop-contract'
  GWT2:
    title: 本机号码一键创建默认账号
    given:
    - 本地无历史账号摘要，运营商 SDK 返回 vendor、carrierToken 与脱敏手机号。
    - 服务端 hint 判定该手机号未绑定账号。
    when:
    - 用户勾选协议并点击“本机号码一键登录”。
    then:
    - 服务端创建 owner、primary persona、credential、device、consent record。
    - 登录结果返回默认昵称、头像或默认头像所需字段。
    - App 保存 token 与 remembered account summary。
    done_when:
    - 本机号码首次登录在服务端完成账号、persona、credential、device 与 consent 持久化。
    - App 只消费服务端返回的登录结果并写入 remembered summary。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    - quwoquan_service/services/user-service/tests/auth_contract_test.go
    - quwoquan_app/test/ui/user/login_page_widget_test.dart
    performance_points:
    - 本机号码 hint 与登录链路必须有超时降级，不阻塞其它登录方式。
    tests:
      planned:
      - file: quwoquan_service/services/user-service/tests/auth_contract_test.go
      - file: quwoquan_app/test/ui/user/login_page_widget_test.dart
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: api_integration
        suite: gwt2_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt2_api_integration
        envs: *id002
      supporting:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt2_local_contract
        envs: *id001
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt2_local_contract
