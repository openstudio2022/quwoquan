  GWT7:
    title: 手机号验证码异常不拦截用户
    given:
    - 用户处于未勾选协议、验证码错误、验证码过期、发送频繁、短信服务商失败、网络失败、账号锁定、账号暂停或删除任一异常状态。
    when:
    - 用户继续操作当前登录页。
    then:
    - 页面提供至少一个清晰下一步：勾选协议、修改手机号、修改验证码、重新获取、等待倒计时、换其它方式或关闭。
    - 除发送中、登录中、成功反馈外，手机号可编辑；编辑手机号会清空验证码与错误。
    - 登录关闭不回环，登录成功进入 redirect 或 AuthContinuation 目标态。
    done_when:
    - 每类 OTP 异常都有明确下一步，并保留用户可恢复路径。
    - 修改手机号会清空验证码与错误，关闭和成功目标态不回环。
