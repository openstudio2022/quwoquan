  GWT3:
    title: 两状态高保同构与响应式
    given:
    - 登录页分别进入 returningAccount 与 carrierPhone 状态。
    when:
    - 在 iPhone 17、iPad、Web 宽屏尺寸下渲染。
    then:
    - Logo、标题、副标题、主按钮、协议、其他登录方式区域位置一致。
    - Account Area 等高，移动端对齐高保，iPad/Web 居中且不拉伸。
    - 深浅色、触控区、语义 label 满足无障碍要求。
    - 返回账号头像仅在可信候选成功解码后显示；空值、加载中和失败时头像、间距及头像语义均不存在，昵称与脱敏手机号保持稳定。
    - 仅 nicknameCustomized=true 的非空昵称展示原文，系统默认昵称、旧数据缺字段或空昵称统一显示“欢迎回来”；可见方式名为微信/QQ/支付宝/其他手机号，无障碍语义保持完整登录动作。
    - 登录原因主副标题由 AuthGateReason/AuthContinuation 决定，returning/carrier/phone/OTP 转场不得替换 Hero 文案。
    - 花瓣两层花蕊与 Android/iOS/Web/favicon 由共享 Painter 生成，资产哈希和最小尺寸可辨识性一致。
    done_when:
    - returningAccount 与 carrierPhone 两状态共享同一 LoginFrame 信息架构。
    - 移动、平板与 Web 宽屏下关键区域不重叠、不拉伸、不漂移。
    contract_refs:
