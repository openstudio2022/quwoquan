contract_acceptance:
  CONTRACT1:
    title: metadata/codegen/auth policy 与商用登录契约一致
    done_when:
    - ResolveOneTapLoginHint 是 public operation。
    - LoginOneTap request/response 字段由 metadata 生成并被 App RemoteRepository 消费。
    - SendOtp / LoginWithPhone request/response 字段由 metadata 生成并被 App RemoteRepository
      消费。
    - SendOtp response 可表达 maskedPhone、expiresInSeconds、deliveryStatus、requestId、challengeId、retryAfterSeconds、debugCode。
    - USER.AUTH carrier/consent/account 状态错误码生成 Dart/Go 常量。
    - USER.AUTH otp_mismatch/otp_expired 与频控错误可映射到手机号 OTP UI 状态。
    - 旧未登记 /v1/auth/login 与 credentialType/credentialKey 登录兼容口径不得回归。
    tests:
      planned:
      - command: make verify-app-auth-policy
      - file: quwoquan_app/test/cloud/user/contract/auth_repository_contract_test.dart
      - file: quwoquan_service/services/user-service/tests/auth_contract_test.go
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.contract1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: contract1_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.contract1_api_integration
        envs: *id002
    notes:
    - '[migrated_from_recorded_command] make verify-app-auth-policy'
    - '[migrated_from_recorded_command] cd quwoquan_app && flutter test test/cloud/user/contract/auth_repository_contract_test.dart'
    - '[migrated_from_recorded_command] cd quwoquan_service && go test ./services/user-service/tests
      -run ''TestAuth_OneTapLogin_UsesServerResolvedPhone|TestAuth_RetiredGenericLoginRoute_Removed'''
  CONTRACT2:
    title: 手机号 OTP 服务商与错误语义契约
    done_when:
    - SendOtp provider failure 返回结构化可恢复错误，App 映射 sendFailed。
