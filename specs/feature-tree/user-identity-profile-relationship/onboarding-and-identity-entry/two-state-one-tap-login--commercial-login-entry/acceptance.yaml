    - 用户继续操作当前登录页。
    then:
    - 页面提供至少一个清晰下一步：勾选协议、修改手机号、修改验证码、重新获取、等待倒计时、换其它方式或关闭。
    - 除发送中、登录中、成功反馈外，手机号可编辑；编辑手机号会清空验证码与错误。
    - 登录关闭不回环，登录成功进入 redirect 或 AuthContinuation 目标态。
    - 社交取消由恢复策略吸收且不显示失败；社交失败只显示在其它方式网格上方的唯一反馈槽。
