  GWT8:
    title: 手机号验证码登录创建或恢复账号
    given:
    - 用户输入合法手机号并通过 SendOtp 获得 challenge。
    - 用户输入 6 位验证码并勾选协议。
    when:
    - 用户点击登录。
    then:
    - App 调用 LoginWithPhone，不调用旧 /v1/auth/login 泛用路由。
    - 服务端校验 OTP 后创建或恢复 owner、primary persona、credential、device、consent record。
    - App 保存 token 与 remembered account summary。
    done_when:
