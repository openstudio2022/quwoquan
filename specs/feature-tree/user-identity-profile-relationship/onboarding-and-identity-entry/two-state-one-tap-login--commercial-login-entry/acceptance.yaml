  GWT6:
    title: 手机号验证码 12 状态同构高保
    given:
    - 登录页进入手机号验证码登录态。
    when:
    - 用户经历初始、输入中、合法、发送中、已发送、输入验证码、验证码完整、登录中、成功、验证码错误、验证码过期、发送频繁状态。
    then:
    - Header、Logo、Reason、主按钮、协议、其它登录方式位置稳定。
    - 验证码显示为 6 个独立方框，支持数字限制、退格与 6 位粘贴。
    - 输入/验证码不匹配使用字段错误；发送、网络、provider、限流和过期使用操作点附近的 AppFormErrorCard，不用弱 caption 或大弹窗。
    - AppInlineFieldError 与 AppFormErrorCard 均为透明 16px 圆形感叹号、14px 常规文字、6px 图文间距的单一错误样式；浅色 #E5484D、深色 #FF6B6B，窄屏最多两行。
    - 自动降级使用 compact AppFormErrorCard，仅展示一条可换行说明；页面主按钮已承担恢复动作时错误行不得复制按钮。
