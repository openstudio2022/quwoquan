    - SDK 不可用或 provider 超时在 1.2s 内降级。
    - 账号 suspended/deleted 展示结构化错误，不创建新账号。
    - 登录关闭仍回安全态，不触发登录循环。
    done_when:
    - 协议、SDK 不可用、超时、账号受限和关闭路径均有明确恢复动作。
    - 任一失败状态都不会绕过结构化错误语义或触发登录回环。
