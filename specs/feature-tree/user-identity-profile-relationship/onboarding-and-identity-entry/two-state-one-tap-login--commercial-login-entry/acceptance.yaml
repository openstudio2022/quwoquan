version: 2
node:
  id: two-state-one-tap-login--commercial-login-entry
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/two-state-one-tap-login--commercial-login-entry
  title: two state one tap login commercial login entry
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: onboarding-and-identity-entry
scope:
  summary: 商用登录入口验收：历史账号继续登录、本机号码一键登录/创建、其它手机号验证码登录、高保同构布局、端云契约与数据库副作用。
  in_scope:
  - LoginPage 两状态同构高保布局与响应式截图
  - 本地历史账号摘要与服务端二次登录
  - 运营商 SDK capability/hint/login 链路
  - 手机号验证码登录全状态 UI 与异常逃生路径
  - ResolveOneTapLoginHint / LoginOneTap metadata 契约
  - SendOtp / LoginWithPhone metadata 契约
  - 微信、支付宝、QQ 官方原生 SDK 防腐桥、能力探测与服务端票据置换
  - RuntimeFailure/RuntimeRecoveryPolicy 驱动的单流程反馈槽与显式恢复动作
  - user-service 账号查询/创建、credential/device/consent 持久化
  - 登录埋点、SLO、灰度与回滚
  out_of_scope:
  - Apple、Passkey 正式 SDK 登录
  - Web 运营商一键登录可用性承诺
gwt_acceptance:
  GWT1:
    title: 历史账号摘要展示并通过服务端二次登录
    given:
    - App 本地存在 remembered account summary，但 access token 已失效或用户手动退出。
    when:
    - 页面确认摘要存在具体账号线索和可立即执行的恢复动作，用户点击“继续登录”。
    then:
    - 页面稳定展示合规昵称与脱敏手机号；可信头像成功解码后才显示，空值、加载中和失败时不占位。
    - 系统默认昵称、空标识和单独头像不得生成“欢迎回来/上次使用的账号/一键登录”幽灵页；无第二行时不保留间距。
    - 点击主按钮必须调用服务端登录接口刷新 token，不得仅凭本地摘要进入登录态。
    - 登录成功后回到 redirect 或 AuthContinuation 目标态。
    done_when:
    - 历史账号摘要只作为展示线索，真实登录态必须来自服务端 token 刷新。
    - 摘要没有可执行恢复动作时直接解析运营商或手机号入口，不展示返回账号卡片。
    - redirect/AuthContinuation 目标态与登录关闭安全态均被测试覆盖。
    contract_refs:
    - quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
    - quwoquan_app/test/local_contract/core/auth/auth_session_store__local_contract_test.dart
    - quwoquan_app/test/local_contract/cloud/user/account_identity_facets__contract__local_contract_test.dart
    performance_points:
    - 历史账号二次登录过程中页面必须保持可恢复加载态，不出现本地假登录闪回。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/auth/auth_session_store__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/user/account_identity_facets__contract__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/auth/auth_session_store__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/user/account_identity_facets__contract__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.two_state_one_tap_login_commercial_login_entry.gwt1_local_contract
        envs: *id001
      - layer: api_integration
