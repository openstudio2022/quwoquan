  GWT6:
    title: 手机号验证码 12 状态同构高保
    given:
    - 登录页进入手机号验证码登录态。
    when:
    - 用户经历初始、输入中、合法、发送中、已发送、输入验证码、验证码完整、登录中、成功、验证码错误、验证码过期、发送频繁状态。
    then:
