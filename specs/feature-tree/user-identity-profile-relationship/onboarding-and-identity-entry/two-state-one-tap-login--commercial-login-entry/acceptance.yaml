  GWT4:
    title: 协议、错误与降级单通道且不悬空
    given:
    - 用户未勾选协议、运营商 SDK 不可用、provider 超时、账号 suspended/deleted 任一条件成立。
    when:
    - 用户打开登录页或点击主按钮。
    then:
    - 未勾选协议时不发请求。
    - 同一次失败只在 phoneField/otpField/agreement/processFeedback/accountBlocked
      之一展示，不同时出现 Toast、Snackbar 或第二条社交错误带。
    - SDK 不可用或 provider 超时在 1.2s 内降级。
    - 账号 suspended/deleted 展示结构化错误，不创建新账号。
    - 登录关闭仍回安全态，不触发登录循环。
    - 普通页面压栈进入显示返回箭头；受限目的地和宿主关闭显示 X，错误状态不得切换图标或持有路由控制权。
    done_when:
    - 协议、SDK 不可用、超时、账号受限和关闭路径均有明确恢复动作。
    - 任一失败状态都不会绕过结构化错误语义或触发登录回环。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/errors.yaml
    - quwoquan_app/test/local_contract/core/auth/auth_gate_matrix_contract__local_contract_test.dart
    - quwoquan_service/services/user-service/tests/api_integration/auth_contract__api_integration_test.go
    performance_points:
