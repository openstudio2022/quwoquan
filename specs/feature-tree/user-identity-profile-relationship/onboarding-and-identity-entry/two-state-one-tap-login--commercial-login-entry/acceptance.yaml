  GWT5:
    title: 无历史摘要且运营商不可用时进入手机号验证码登录
    given:
    - App 本地不存在 remembered account summary。
    - 运营商 SDK 不可用、超时或 Web/模拟器不支持。
    when:
    - 用户打开登录页。
    then:
    - 页面在同一 LoginFrame 中展示手机号输入态。
    - 主按钮为“获取验证码”，手机号非法时禁用。
    - 产品支持平台的微信/QQ/支付宝入口可发现；仅平台明确不支持时隐藏，手机号态不重复展示“其他手机号”。
    - 没有真实可发现方式时隐藏整个分隔区，关闭仍回安全态。
    done_when:
    - 无历史摘要且运营商不可用时，用户在同一 LoginFrame 内可继续用手机号验证码登录。
    - 关闭、其它登录方式和手机号输入错误态均不触发二次登录弹窗。
    contract_refs:
