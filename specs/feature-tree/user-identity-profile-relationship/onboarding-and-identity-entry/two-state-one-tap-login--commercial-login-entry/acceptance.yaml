    notes:
    - '[migrated_from_recorded_command] cd quwoquan_app && flutter test test/ui/user/login_page_widget_test.dart
      test/core/auth/auth_session_store_test.dart test/cloud/user/contract/auth_repository_contract_test.dart'
    - '[migrated_from_recorded_command] cd quwoquan_app && make verify-app-login-entry-loop-contract'
    - '2026-07-12: returning account 只预填、显式提交、服务端刷新及 AuthContinuation 单所有者契约测试通过。'
    - '2026-07-16: 返回会话主动作更名为继续登录；系统昵称加空标识、单独头像及过期但不可恢复摘要均不再形成返回账号页。'
  GWT2:
    title: 本机号码一键创建默认账号
    given:
    - 本地无历史账号摘要，运营商 SDK 返回 vendor、carrierToken 与脱敏手机号。
    - 原生探测强类型状态为 available，且 vendor、短时 carrierToken 和有效期形成完整可提交路径。
    - 服务端 hint 判定该手机号未绑定账号。
    when:
    - 用户勾选协议并点击“本机号码一键登录”。
    then:
    - 服务端创建 owner、primary persona、credential、device、consent record。
    - 登录结果返回默认昵称、nicknameCustomized 与可选头像字段；App 不生成默认头像。
    - App 保存 token 与 remembered account summary。
    done_when:
    - 本机号码首次登录在服务端完成账号、persona、credential、device 与 consent 持久化。
    - App 只消费服务端返回的登录结果并写入 remembered summary。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    - quwoquan_service/services/user-service/tests/api_integration/auth_contract__api_integration_test.go
    - quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
    performance_points:
    - 本机号码 hint 与登录链路必须有超时降级，不阻塞其它登录方式。
    - SDK 仅初始化但探测未返回 token 时必须静默隐藏入口，不允许通过用户点击后的失败探测能力。
    tests:
      planned:
      - file: quwoquan_service/services/user-service/tests/api_integration/auth_contract__api_integration_test.go
      - file: quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
