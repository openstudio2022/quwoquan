version: 2
node:
  id: onboarding-consent-flow--consent-record-contract
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/onboarding-consent-flow--consent-record-contract
  title: onboarding consent flow  consent record contract
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: onboarding-and-identity-entry
scope:
  summary: 登录前协议同意、协议版本透传与 consent record 真相源验收。
  in_scope:
  - 登录页勾选用户协议 / 隐私政策后才允许手机号或一键登录提交
  - agreementVersion/privacyVersion 与 AuthLegalConfig 真相源一致
  - one-tap 登录请求必须透传协议版本，后端能够消费并留痕
  out_of_scope:
  - 法律正文 URL 可达性与外部法务发布流程
  - 数据导出、账号注销、撤回同意的后续权利动作
gwt_acceptance:
  GWT1:
    title: 未勾选协议不得登录，协议版本需进入登录契约
    given:
    - 用户处于欢迎页或登录页，准备通过手机号或一键登录进入账号体系。
    when:
    - 用户未勾选协议直接提交登录，或勾选协议后发起一键登录请求。
    then:
    - 未勾选协议时只出现统一阻断提示，不发起登录网络请求，不切换页面。
    - 勾选协议后，一键登录请求体包含 agreementVersion/privacyVersion，版本号与 AuthLegalConfig 一致。
    done_when:
    - 手机号登录与一键登录共享同一勾选语义、协议文案、版本真相源，不存在第二套硬编码版本号。
    edge_cases:
    - 一键登录探测超时后切到手机号表单，协议区仍在“稍后登录”之后、“其他登录方式”之前。
    - release 包未开放的第三方登录入口不得绕开协议勾选路径。
    contract_refs:
    - quwoquan_app/lib/ui/user/pages/login_page.dart
    - quwoquan_app/lib/core/auth/auth_legal_config.dart
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    performance_points:
    - 未勾选协议时本地阻断响应时间 < 100ms；一键登录请求版本字段构造不引入额外网络前等待。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
      - file: quwoquan_service/services/user-service/tests/api_integration/auth_contract__api_integration_test.go
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.onboarding_consent_flow_consent_record_contract.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.onboarding_consent_flow_consent_record_contract.contract
        envs: *id001
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
