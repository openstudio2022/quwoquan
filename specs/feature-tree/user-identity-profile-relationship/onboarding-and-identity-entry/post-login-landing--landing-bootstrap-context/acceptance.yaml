version: 2
node:
  id: post-login-landing--landing-bootstrap-context
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/onboarding-and-identity-entry/post-login-landing--landing-bootstrap-context
  title: post login landing  landing bootstrap context
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: onboarding-and-identity-entry
scope:
  summary: 登录成功后的 session bootstrap、redirect/continuation 恢复与游客安全回退验收。
  in_scope:
  - applyLoginResult 后 accessToken/refreshToken/ownerId/activeSubAccountId 落盘与恢复
  - 登录成功返回 redirect 或执行 AuthContinuation
  - 游客关闭登录返回安全态，不触发受限动作残留
  out_of_scope:
  - token 过期后的自动 refresh/retry 细节
  - 多设备最近登录记录与设备审计页
gwt_acceptance:
  GWT1:
    title: 登录成功后恢复 owner/subAccount 上下文并进入目标态
    given:
    - 用户从受限动作进入登录页，存在 redirect 或 pending AuthContinuation。
    when:
    - 登录成功并写入 accessToken、refreshToken、ownerId、activeSub。
    then:
    - AuthSessionStore 持久化 ownerId、activeSubAccountId、accountState、identityOrigin，并在
      restore 时恢复为 authenticated。
    - 页面优先进入 redirect 指向的目标；若无 redirect，则继续完成 pending AuthContinuation。
    done_when:
    - 从欢迎页、评论、关注、消息、创作等登录入口完成登录后，不需要用户手动重复操作即可继续原目标态。
    edge_cases:
    - manualLoggedOut 与 sessionExpired 的 promptReason 不得混淆。
    - continueAsGuest 只记 launchPromptDismissed，不得写入伪 authenticated 状态。
    - 匿名/游客 installId 必须持续保留，避免登录前后 deviceActorId 语义割裂。
    contract_refs:
    - quwoquan_app/lib/core/auth/auth_session.dart
    - quwoquan_app/lib/core/auth/auth_continuation.dart
    - quwoquan_app/lib/ui/user/pages/login_page.dart
    performance_points:
    - 登录成功后 session bootstrap + 导航切换 P95 <= 2s。
    tests:
      planned:
      - file: quwoquan_app/test/core/auth/auth_session_store_test.dart
      - file: quwoquan_app/test/ui/user/login_page_widget_test.dart
      - file: quwoquan_app/test/core/auth/required_route_gate_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/core/auth/auth_session_controller__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/app_startup_welcome__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/auth/required_route_gate__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.post_login_landing_landing_bootstrap_context.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.user_identity_profile_relationship.onboarding_and_identity_entry.post_login_landing_landing_bootstrap_context.contract
        envs: *id001
    notes: []
