version: 2
node:
  id: auth-profile-snapshot
  level: L2_business_capability
  path: specs/feature-tree/user-identity-profile-relationship/auth-profile-snapshot
  title: auth profile snapshot
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: auth-profile-snapshot
scope:
  summary: 认证、refresh token、owner/subAccount 快照与凭证管理的能力级 SIT 验收。
  in_scope:
  - OTP/手机号登录、一键登录、匿名登录、refresh token、logout
  - owner 级凭证列表、绑定/解绑、最后一个凭证保护
  - ownerId / activeSub / accountState / identityOrigin 等登录结果快照一致性
  out_of_scope:
  - 账号注销、恢复申诉、数据导出
  - Web 宽屏登录门 UI 细节
sit_acceptance:
  SIT1:
    title: 登录结果快照、凭证管理与会话状态机端云一致
    story_refs:
    - auth-token-lifecycle--token-issue-refresh-revoke
    done_when:
    - LoginWithPhone / LoginOneTap / LoginAnonymous / RefreshToken / Logout 的 request/response
      字段与 metadata、App DTO、服务端行为一致。
    - accessToken、refreshToken、ownerId、activeSub、accountState、identityOrigin 在 App
      Session 与服务端 contract 中同源。
    - ListCredentials / BindCredential / UnbindCredential 的鉴权模式、错误码与“最后一个凭证禁止解绑”约束可验证。
    performance_points:
    - refresh token 轮换成功路径 P95 <= 800ms
    - OTP 登录成功到 session 写入完成 P95 <= 2s
    tests:
      planned:
      - file: quwoquan_service/services/user-service/tests/api_integration/auth_contract__api_integration_test.go
      - file: quwoquan_service/services/user-service/tests/api_integration/credential_contract__api_integration_test.go
      - file: quwoquan_app/test/local_contract/core/auth/auth_session_store__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/login_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/user/contract/auth_repository_contract__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/cloud/user/contract/auth_repository_contract__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/runtime/cloud_http_client_refresh__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/auth/auth_session_controller__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/chat/chat_message_snapshot_contract__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/journeys/user/edit_profile_journey__user_acceptance_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        suite: sit1_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.auth_profile_snapshot.sit1.sit1_api_integration
        envs:
        - beta
        - gamma
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.auth_profile_snapshot.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: local_contract
        suite: profile_identity_sync
        cases:
        - local_contract.user_identity_profile_relationship.auth_profile_snapshot.sit1.profile_identity_sync
        envs:
        - local
      - layer: api_integration
        suite: user_profile_creation
        cases:
        - api_integration.user_identity_profile_relationship.auth_profile_snapshot.sit1.user_profile_creation
        envs:
        - gamma
      - layer: user_acceptance
        suite: profile_identity_sync
        cases:
        - user_acceptance.user_identity_profile_relationship.auth_profile_snapshot.sit1.profile_identity_sync
        envs:
        - gamma_local
      supporting:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.auth_profile_snapshot.sit1.sit1_local_contract
        envs: *id001
    notes:
    - '[migrated_from_recorded_command] make verify-app-auth-policy'
    - '[migrated_from_recorded_command] go test ./services/user-service/tests -run
      TestAuth_FirstLogin_UsesCloudDefaultNicknamePattern -count=1'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
