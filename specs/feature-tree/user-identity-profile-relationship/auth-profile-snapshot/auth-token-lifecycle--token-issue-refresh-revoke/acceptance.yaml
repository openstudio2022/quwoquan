version: 2
node:
  id: auth-token-lifecycle--token-issue-refresh-revoke
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/auth-profile-snapshot/auth-token-lifecycle--token-issue-refresh-revoke
  title: auth token lifecycle  token issue refresh revoke
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: auth-profile-snapshot
scope:
  summary: access/refresh token 签发、轮换、吊销与会话过期行为验收。
  in_scope:
  - RefreshToken 返回新 accessToken/new refreshToken 并轮换持久化
  - Logout 吊销 refresh token，旧 refreshToken 不可再次刷新
  - sessionExpired prompt 与 manualLoggedOut prompt 区分
  - 微信 / Apple 票据登录与 passkey challenge/assertion 的客户端 contract 预留
  out_of_scope:
  - CloudHttpClient 统一 refresh once -> retry 自动化链路
  - 多设备“当前设备/全部设备”会话管理 UI
gwt_acceptance:
  GWT1:
    title: refresh token 轮换成功，logout 后旧 token 不可复用
    given:
    - 用户已通过手机号或一键登录获得 accessToken 与 refreshToken。
    when:
    - 客户端调用 RefreshToken，再使用新 refreshToken 调用 Logout，并尝试复用被吊销 token。
    then:
    - RefreshToken 返回轮换后的 refreshToken，新旧 refreshToken 不同。
    - Logout 后再次使用旧 refreshToken 调用 RefreshToken 返回 401/token expired 或 unauthorized。
    done_when:
    - 服务端 contract、App session store 与错误码语义一致，不再存在“token 已失效但客户端仍保留 authenticated”的灰区。
    - 微信 / Apple 与 passkey 相关 repository 方法、page id、path、错误码与 metadata 同源；未开通的客户端能力不引入第二真相源。
    edge_cases:
    - refreshToken 为空或过期时返回结构化错误码，不返回裸字符串。
    - manual logout 不得误标为 sessionExpired。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    - quwoquan_service/contracts/metadata/user/user_profile/errors.yaml
    performance_points:
    - refresh token 正常轮换 P95 <= 800ms。
    evidence:
      primary:
      - T3_app_api_integration
      - T2_module_interaction
      supporting:
      - T1_contract
    tests:
      planned:
      - quwoquan_service/services/user-service/tests/auth_contract_test.go
      - quwoquan_app/test/core/auth/auth_session_store_test.dart
      - quwoquan_app/test/cloud/user/contract/auth_repository_contract_test.dart
      - quwoquan_app/test/core/platform/native_auth_bridge_test.dart
      recorded:
      - make verify-app-auth-policy
      - quwoquan_app/test/cloud/runtime/cloud_http_client_refresh_test.dart
      - quwoquan_app/test/core/auth/auth_session_controller_test.dart
      - quwoquan_app/test/app/app_startup_welcome_test.dart
    status: partial
