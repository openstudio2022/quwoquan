version: 2
node:
  id: profile-commercial-readiness
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/profile-homepage-redesign/profile-commercial-readiness
  title: profile commercial readiness
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: profile-homepage-redesign
scope:
  summary: 个人主页商用就绪 Story——我的主页数据加载、统计行、名字可设置等上线 gap 的最小价值闭环（V5 全量口径下保留并对齐）。
  in_scope:
  - 我的主页进入时加载当前用户档案（displayName/avatar/background 非 me 占位）
  - 统计行（圈子/关注/粉丝）与列表数据同源
  - 用户名字可设置并即时刷新
  out_of_scope:
  - 一级 Tab 收窄（历史去掉生活 Tab 的口径已被 V5 全量口径覆盖反转）
  - 创作可见性过滤去除（历史去除口径已被 V5 恢复）
gwt_acceptance:
  GWT1:
    title: 我的主页数据加载与统计行同源
    given:
    - 已登录用户进入 /profile（ProfileMode.mine）。
    when:
    - MyProfilePage 首帧触发 userDataProvider.loadUser(currentUserId)。
    then:
    - displayName/avatar/background 来自 getUserProfile，非 me 占位。
    - 统计行顺序圈子/关注/粉丝，数字与进入详情列表条数一致（同一 Repository 方法）。
    done_when:
    - 我的主页首屏展示真实档案与一致统计，Mock/Remote 经 appDataSourceModeProvider 透明切换。
    edge_cases:
    - 未登录 → 展示登录引导（_LoggedOutProfilePrompt）。
    - 档案加载失败 → 结构化错误兜底，不崩溃、不显示 me。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    performance_points:
    - 我的主页首屏 TTI P95 ≤ 1.5s（缓存命中 ≤ 600ms）
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/user/pages/my_profile_page__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/widgets/profile_stats_row__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.user_identity_profile_relationship.profile_homepage_redesign.profile_commercial_readiness.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.user_identity_profile_relationship.profile_homepage_redesign.profile_commercial_readiness.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.user_identity_profile_relationship.profile_homepage_redesign.profile_commercial_readiness.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes: []
