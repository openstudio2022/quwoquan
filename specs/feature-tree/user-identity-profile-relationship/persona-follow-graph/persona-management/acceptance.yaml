version: 2
node:
  id: persona-management
  level: L3_story
  path: specs/feature-tree/user-identity-profile-relationship/persona-follow-graph/persona-management
  title: persona management
  parent_domain_service: user-identity-profile-relationship
  parent_business_capability: persona-follow-graph
scope:
  summary: 分身管理摘要、编辑、同步建议与当前分身切换的端云闭环验收范围。
  in_scope:
  - 分身列表、quota 与 active persona context 同源读取
  - 分身编辑 displayName/userHandle/phone/email/isolationLevel 后的管理摘要回显
  - profile sync suggestion 的出现、应用与 appliedCount 闭环
  - 当前分身切换后 activeContext 与页面 current 标识对齐
  - 管理摘要与 active persona context 显式下发 avatarUrl/avatarVersion，供端侧头像缓存失效消费
  out_of_scope:
  - 分身头像图片挑选/上传入口与对象存储端到端
  - 分身删除/退役的复杂守卫策略（单独归属 `persona-management--persona-lifecycle-contract`）
gwt_acceptance:
  GWT1:
    title: 分身管理摘要、编辑同步与当前分身切换一致
    given:
    - 用户已有主分身与至少一个辅助分身。
    - user-service 可返回 persona management summary、active persona context 与 profile
      sync suggestion 所需字段。
    - App 已进入分身管理页。
    when:
    - 用户浏览分身列表与 quota。
    - 用户编辑辅助分身的 userHandle/phone/email 等字段并保存。
    - 用户应用同步建议，或切换当前分身。
    then:
    - 页面展示 quota、items 与 activeContext，且当前分身标识与 activeContext.subAccountId 一致。
    - 保存后管理摘要回显最新字段，分身停止继承 owner 对应字段。
    - 出现 sync suggestion 时，应用后返回 appliedCount 并刷新管理摘要。
    - persona item 与 active persona context 中的 avatarUrl/avatarVersion 显式可消费，端侧头像缓存键稳定。
    done_when:
    - user-service persona summary / update / sync / activate 契约测试通过。
    - App local_contract 聚合覆盖 repository、provider、page 与分身管理旅程。
    - App user_acceptance 聚合覆盖分身管理页编辑、同步建议与切换当前分身。
    edge_cases:
    - quota 达到上限时不再允许创建，并记录 quota telemetry。
    - active persona context 缺失时回退到 item.isActive，不产生双 current。
    - persona avatarVersion 为 0 时仍可渲染头像 URL，但显式版本字段必须存在。
    contract_refs:
    - quwoquan_service/contracts/metadata/user/user_profile/service.yaml
    - quwoquan_service/contracts/metadata/user/user_profile/fields.yaml
    - quwoquan_service/contracts/metadata/user/user_profile/projections/persona_management_item_wire.yaml
    - quwoquan_service/contracts/metadata/user/user_profile/projections/active_persona_context_wire.yaml
    performance_points:
    - 分身编辑、应用同步与切换当前分身后只做一次 summary reload，不阻塞页面继续交互。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/user/providers/persona_management_provider__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/user/widgets/persona_management_page__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/journeys/user/persona_management_journey__user_acceptance_test.dart
      - file: quwoquan_service/services/user-service/tests/api_integration/persona_contract__api_integration_test.go
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: persona_management
        cases:
        - local_contract.user.persona_management.repository_summary_context
        - local_contract.user.persona_management.sync_suggestion_and_apply
        - local_contract.user.persona_management.activate_current_persona
        envs: &id001
        - local
      - layer: api_integration
        execution_profile: integration
        suite: persona_management
        cases:
        - api_integration.user.persona_management.summary_quota_active_context
        - api_integration.user.persona_management.update_reflects_fields_and_avatar_version
        - api_integration.user.persona_management.apply_sync_returns_applied_count
        - api_integration.user.persona_management.activate_transaction_single_active
        envs:
        - gamma
      - layer: user_acceptance
        execution_profile: release
        suite: persona_management
        cases:
        - user_acceptance.user.persona_management.edit_sync_activate_journey
        envs:
        - gamma_local
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: persona_management_provider
        cases:
        - local_contract.user.persona_management.telemetry_create_activate_retire_quota
        envs: *id001
    notes:
    - 当前 story 只验证 avatarVersion 的读链与缓存失效语义，不声明分身头像上传入口。
    - '[migrated_from_recorded_command] go test ./services/user-service/tests -run
      Test(GetPersonaManagementSummary_ReturnsQuotaAndActiveContext|UpdatePersona_ReflectsManagementFields|ApplyPersonaProfileSync_ReturnsAppliedCount|ActivatePersona_Transaction)
      -count=1'
  GWT2:
    title: 分身管理首屏失败只保留宿主返回与恢复动作
    given:
    - 用户已进入栈内分身管理页。
    - persona management summary 读取返回结构化失败。
    when:
    - 页面渲染错误状态。
    then:
    - 顶部导航只有一个返回按钮，不出现错误 X 或额外“返回” CTA。
    - 标题为分身管理业务语义，原因与恢复动作由 UiErrorSemantic 解析。
    - 点击“再试一次”重新读取 summary，不创建假数据。
    done_when:
    - 分身页错误 widget local_contract 通过。
    edge_cases:
    - 网络超时
    - 未授权
    - 页面已被销毁
    contract_refs:
    - specs/feature-tree/runtime/runtime-client-foundation/error-permission-display-semantics/spec.md
    performance_points: []
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/user/widgets/persona_management_page__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: persona_management_error_navigation
        cases:
        - local_contract.user.persona_management.error_navigation_ownership
        envs: *id001
      supporting: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
