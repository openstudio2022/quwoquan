    done_when:
    - 能力内 Story 组合、状态机、异常路径和端云协同可验证。
    - PersonaRelationship 关注/拉黑命令具备服务端 CAS + 幂等 receipt + 事务 outbox；capability wire 端云 16 字段对齐。
    - SubjectFollow 是主页/圈子/地点关注唯一真相源（entity.FollowHomepage 已退役），事件驱动 following_subjects 投影与 homepage follower 投影。
    - FollowedSubjectVisitState 水位单调推进且 clientRequestId 重放安全；关注频道红点点击后跨会话不复现。
    - 拉黑与打招呼用户旅程可逆：拉黑列表可查看/解除，收到的打招呼可回复/忽略，发出的 pending 请求可撤回；动作失败均有结构化反馈。
    performance_points:
    - PersonaRelationship command/list P95 ≤ 500ms；公开 ProfileSubject 读取 P95 ≤ 500ms。
    - PersonaRelationship follower/following 派生计数投影 P95 lag ≤ 5s，命令路径不得执行全表 COUNT。
    - Persona 切换命令 P95 ≤ 1500ms，且 attribution/public-leakage/migration-failure 指标可告警。
    - counter/page/filter/capability consistency mismatch 生产指标恒为 0。
