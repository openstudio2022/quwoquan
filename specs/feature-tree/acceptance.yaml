  UAT_PROFILE_SHARE_INTERACTION:
    title: 我的主页转发互动双向历史
    journey: 当前用户在我的主页互动二级控制行查看收到的与我发起的转发，可靠恢复方向状态，正确打开目标，且任何他人或旧分身均不可读取。
    scenario_refs:
    - profile-private-activity-history
    - profile-share-interaction-history
    done_when:
    - 互动保持两层导航且选中转发后可切换收到的/我发起的。
    - received 与 initiated 文案、预览、空态、分页、刷新、滚动恢复和点击优先级符合规格。
    - received 未读与真实 impact 正确，initiated 不显示未读或 impact。
    - 他人主页不请求转发列表，子账号切换不残留旧数据，服务端拒绝越权。
    - 八个 share interaction 观测事件携带完整公共归因参数。
    experience_points:
    - share received and initiated list
    - cached direction switch and scroll restoration
    - unavailable content fallback
    - owner-only privacy
    performance_points:
    - cached direction switch visible in next frame
    - first page API p95 <= 500ms
    - first data visible p95 <= 1.5s
    - unauthorized reads and cursor duplicate or omission count = 0
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: user_acceptance
        suite: profile_share_journey
        cases:
        - user_acceptance.user.profile.interaction.share.full_journey
        - user_acceptance.user.profile.interaction.share.identity_switch
        envs:
        - gamma_local
        test_object: page
        quality_facet: experience
      supporting:
      - layer: api_integration
        suite: profile_share_api
        cases:
        - api_integration.content.profile_share.contract
        - api_integration.content.profile_share.owner_isolation
        envs: *id001
        test_object: api_operation
        quality_facet: security
      - layer: local_contract
        suite: profile_share_contract
        cases:
        - local_contract.user.profile.interaction.share.widget
        - local_contract.user.profile.interaction.share.state
        envs:
        - local
        test_object: widget
        quality_facet: functional
    notes: []
  UAT_EDGE_SWIPE:
    title: iOS/Android 边缘滑动返回与退出保护
    journey: 用户在任意无底栏子页通过平台原生边缘手势返回上一页，在沉浸式媒体浏览器中不会误触横滑翻页，并在 Android 底栏根页首次边缘返回时获得退出保护提示。
    scenario_refs:
    - app-root-navigation-safety
    - global-route-edge-pop-contract
    - immersive-media-edge-swipe-back
    - home-edge-swipe-exit-guard
    done_when:
    - 无底栏普通页面通过 iOS leading edge 或 Android 左/右边缘返回上一页。
    - 沉浸式媒体浏览器边缘滑动触发返回，不误触媒体左右切换。
    - Android 主页根页第一次边缘滑动只提示再次滑动退出。
    - Android 主页根页第二次边缘滑动在 2 秒保护窗口内退出或交给系统返回。
    - iOS 根页无可 pop 栈时不模拟退出应用。
    - iOS 与 Android 的系统手势区域、阈值、动画和提示分别验证。
    experience_points:
    - global route edge pop contract
    - immersive media browser edge swipe back
    - Android home root edge swipe exit guard
    performance_points:
    - edge swipe action-to-feedback latency <= 100ms
    - return animation has no visible jank on supported devices
    - media page-swipe and edge-back false-positive conflicts are covered
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/app/navigation/native_back_navigation_policy__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/app/navigation/app_route_page_factory__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.specs.feature_tree.uat_edge_swipe.user_journey
        envs:
        - gamma_local
      supporting:
      - layer: local_contract
        suite: uat_edge_swipe_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_edge_swipe.uat_edge_swipe_local_contract
        envs: &id002
        - local
      - layer: api_integration
        suite: route_integration
        cases:
        - api_integration.specs.feature_tree.uat_edge_swipe.route_integration
        envs: *id001
    notes:
