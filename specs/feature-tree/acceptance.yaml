  UAT_BUSINESS_OBJECT_COMMERCIALIZATION:
    title: 十条跨对象 Journey 商用准出
    journey: 用户在身份、内容、搜索、导航、消息、圈子/实体/群、助手、站外回流、交集行动和我的私有历史十条 Journey 中获得端到端真实结果，且每个对象可观测、可运维、可灰度回滚。
    scenario_refs:
    - identity-entry-persona-continuation
    - content-feed-open-detail
    - global-search-query-and-filter
    - global-route-edge-pop-contract
    - message-direct-and-greeting-upgrade
    - circle-entity-group-handoff
    - assistant-context-grounded-answering
    - outbound-object-share-distribution
    - intersection-action-deepening-on-object
    - profile-share-interaction-history
    done_when:
    - 十条 Journey 的全部 page/surface/operation/object/store/event/behavior/metric 节点可正向追踪，且无反向孤儿。
    - command 经过 aggregate owner，query 读取 named Slice；App 只访问 generated Gateway operation。
    - 每条 Journey 至少跨两个真实业务对象，并验证权限、错误恢复、幂等、副作用、投影收敛和推荐/运营回流。
    - 所有页面通过 light/dark、多屏、无障碍、语义 token、性能、弱网和 capability 降级检查。
    - alpha 使用 contract seed；beta/gamma 使用 Remote + 真实依赖；prod 无 seed/Mock/Memory/Noop，并完成实时 SLO、灰度和回滚。
    - local_contract、api_integration、user_acceptance 均有真实断言和 CaseResult；禁止路径存在、动态 skip 或 Memory 假集成充当证据。
    experience_points:
    - 入口、主动作、恢复动作和跨对象 handoff 一致
    - 登录关闭无循环且成功续接原动作
    - 页面主题、多屏、无障碍与弱网体验一致
    performance_points:
    - 每个 Journey 的首屏、主动作、API P95/P99、队列 lag 和投影 freshness 阈值来自各能力 acceptance/SLO
    - 发布前容量、压测、故障注入和回滚恢复时间有实时报告
