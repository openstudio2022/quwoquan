  UAT_EDGE_SWIPE:
    title: iOS/Android 边缘滑动返回与退出保护
    journey: 用户在任意无底栏子页通过平台原生边缘手势返回上一页，在沉浸式媒体浏览器中不会误触横滑翻页，并在 Android 底栏根页首次边缘返回时获得退出保护提示。
    scenario_refs:
    - app-root-navigation-safety
    - global-route-edge-pop-contract
    - immersive-media-edge-swipe-back
    - home-edge-swipe-exit-guard
    done_when:
    - 无底栏普通页面通过 iOS leading edge 或 Android 左/右边缘返回上一页。
    - 沉浸式媒体浏览器边缘滑动触发返回，不误触媒体左右切换。
    - Android 主页根页第一次边缘滑动只提示再次滑动退出。
    - Android 主页根页第二次边缘滑动在 2 秒保护窗口内退出或交给系统返回。
    - iOS 根页无可 pop 栈时不模拟退出应用。
    - iOS 与 Android 的系统手势区域、阈值、动画和提示分别验证。
    experience_points:
    - global route edge pop contract
    - immersive media browser edge swipe back
    - Android home root edge swipe exit guard
    performance_points:
    - edge swipe action-to-feedback latency <= 100ms
    - return animation has no visible jank on supported devices
    - media page-swipe and edge-back false-positive conflicts are covered
    tests:
      planned:
      - file: quwoquan_app/test/app/navigation/native_back_navigation_policy_test.dart
      - file: quwoquan_app/test/app/navigation/app_route_page_factory_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.specs.feature_tree.uat_edge_swipe.user_journey
        envs: *id001
      supporting:
      - layer: local_contract
        suite: uat_edge_swipe_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_edge_swipe.uat_edge_swipe_local_contract
        envs: &id003
        - local
      - layer: api_integration
        suite: route_integration
        cases:
        - api_integration.specs.feature_tree.uat_edge_swipe.route_integration
        envs: *id002
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/content/edge_gesture/immersive_media_edge_swipe_back_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/app/navigation/home_edge_swipe_exit_guard_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/patrol/edge_swipe_navigation_e2e_test.dart'
  UAT_EXTERNAL_ACQUISITION:
    title: 对外引流与深链回流端到端价值闭环
    journey: 用户在微信朋友圈/聊天群、小红书/今日头条等 UGC 平台、浏览器与搜索引擎看到内容（文章/图文/视频/动态）或主页（实体/用户/圈子/我）的分享卡、海报、口令或链接，点击后在已安装时可靠回流到
      App 对应页面、未安装时被引导下载并在安装后还原原始目标，整条链路归因可统计。
    scenario_refs:
    - external-acquisition-and-deeplink
    - outbound-object-share-distribution
    - external-inbound-deeplink-return
    - public-web-seo-install-conversion
    done_when:
    - 5 类对象都能从统一分享面板分享到微信会话/朋友圈，并生成站外可点击的 HTTPS 落地链接。
    - 已安装用户在微信内（Android/鸿蒙用 wx-open-launch-app、iOS 用 Universal Link）、在浏览器内（Universal
      Link/App Links/scheme）点击后回流到 App 对应详情页。
    - 未安装用户被引导到应用商店，安装后首启通过延迟深链还原原始目标对象。
    - 公开 Web 内容/主页可被搜索引擎索引（canonical/OG/JSON-LD/robots/sitemap），并提供安装转化入口。
    - 一键海报（含二维码与口令）可投放到不支持外链的 UGC 平台，扫码或口令识别后回流到目标对象。
    - 全链路携带 referralSource/share_id/UTM/口令归因，可在指标大盘按渠道与对象类型统计转化。
    experience_points:
    - outbound share distribution across 5 object types
    - reliable inbound deeplink return inside WeChat and browsers
    - deferred deeplink restore after install
    - public web SEO and install conversion
    performance_points:
    - 已安装设备点击到 App 目标页可见 P95 <= 2.5s
    - 微信内唤起成功率（已安装）>= 95%
    - 延迟深链安装后参数找回率 >= 90%
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.specs.feature_tree.uat_external_acquisition.user_journey
        envs: *id001
      supporting:
      - layer: local_contract
        suite: uat_external_acquisition_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_external_acquisition.uat_external_acquisition_local_contract
        envs: *id003
      - layer: local_contract
        suite: uat_external_acquisition_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_external_acquisition.uat_external_acquisition_local_contract
        envs: *id003
      - layer: api_integration
        suite: cross_service_integration
        cases:
        - api_integration.specs.feature_tree.uat_external_acquisition.cross_service_integration
        envs: *id002
    notes:
    - '[migrated_from_planned] quwoquan_app/test/runtime/deeplink/deep_link_resolver_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/share/object_share_panel_test.dart'
    - '[migrated_from_planned] quwoquan_app/integration_test/external_acquisition_deeplink_e2e_test.dart'
  UAT_MESSAGE_SOCIAL_CONNECTION:
    title: 消息社交连接端到端价值闭环
    journey: 用户从主页、联系人、搜索、圈子、组织节点、主页相关群组与会话内小趣入口进入消息体系，能清晰完成 1v1、请求箱升级、私建群、圈子群、班级群和
      @小趣 回复。
    scenario_refs:
    - message-social-connection
    - message-direct-and-greeting-upgrade
    - message-group-entry-matrix
    - message-assistant-in-conversation
    done_when:
    - 互关用户从 TA 的主页点击消息，可创建或复用 direct conversation 并完成发送/接收。
    - 非互关用户只能先打招呼；对方回复后升级为正式 direct conversation；未回复前不进入普通会话列表。
    - 用户可从全局发起群聊入口选择服务端返回的候选来源与成员，建群后进入 group conversation。
    - 用户可从兴趣圈子进入默认公共群或自建群；从学校组织主页进入院系/班级节点所绑定的班级群会话。
    - 用户可从共享主页的相关群组卡片进入真实 Circle/CircleGroup 绑定的群会话，主页本身不拥有 conversation。
    - 用户可在 1v1 或群会话中邀请小趣并 @小趣，收到 assistant_reply，且消息进入同一同步和审计链路。
    experience_points:
    - 1v1 建聊规则可见，用户不需要通过报错猜测关系门。
    - 圈子、组织、群、会话、主页相关群的层级清晰，不混用“实体/圈子/群聊”。
    - 小趣会话内参与与个人助手入口语义一致但不割裂。
    performance_points:
    - 1v1 消息发送到对端收到 p99 <= 200ms。
    - 群消息发送到在线成员收到 p99 <= 500ms。
    - 会话内 @小趣 首个可见响应 p95 <= 3s，失败时结构化降级。
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/chat-service/tests/direct_conversation_relationship_gate_test.go
      - file: quwoquan_service/services/chat-service/tests/send_message_relationship_gate_test.go
      - file: quwoquan_service/services/chat-service/tests/group_lifecycle_contract_test.go
      - file: quwoquan_service/services/chat-service/tests/conversation_error_contract_test.go
      - file: quwoquan_service/services/chat-service/tests/assistant_mentioned_stream_contract_test.go
      - file: quwoquan_service/services/chat-service/tests/message_sync_contract_test.go
      - file: quwoquan_app/test/cloud/chat/contract/chat_repository_contract_test.dart
      - file: quwoquan_app/test/ui/chat/widgets/chat_page_widget_test.dart
      - file: quwoquan_app/test/ui/chat/widgets/start_group_chat_page_widget_test.dart
      - file: quwoquan_app/test/ui/chat/widgets/chat_settings_page_widget_test.dart
      - file: quwoquan_app/test/ui/chat/pages/chat_conversation_page_realtime_journey_test.dart
      - file: quwoquan_app/test/ui/chat/journeys/chat_assistant_journey_test.dart
      - file: quwoquan_app/test/ui/circle/widgets/circle_shell_widget_test.dart
      - file: quwoquan_app/test/ui/circle/widgets/section_widgets_test.dart
      - file: quwoquan_app/test/cloud/circle/contract/circle_group_dto_contract_test.dart
      - file: quwoquan_service/services/rtc-service/tests/one_to_one_relationship_gate_test.go
    status: partial
    test_evidence:
      primary:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.specs.feature_tree.uat_message_social_connection.user_journey
        envs: *id001
      supporting:
      - layer: local_contract
        suite: uat_message_social_connection_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_message_social_connection.uat_message_social_connection_local_contract
        envs: *id003
      - layer: local_contract
        suite: uat_message_social_connection_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_message_social_connection.uat_message_social_connection_local_contract
        envs: *id003
      - layer: api_integration
        suite: cross_service_integration
        cases:
        - api_integration.specs.feature_tree.uat_message_social_connection.cross_service_integration
        envs: *id002
    notes: []
  UAT_ASSISTANT_OMNIPRESENT_PRIVATE_ASSISTANT:
    title: 无处不在的小趣私人助理商用主线
    journey: 用户可在内容、搜索、群聊、个人页和主动订阅场景中使用同一个小趣；小趣能理解当前上下文、站内外检索、社交关系、画像与标签，并在授权后完成用户或会话级主动服务。
    scenario_refs:
    - assistant-omnipresent-private-assistant
    - assistant-context-grounded-answering
    - assistant-chat-topic-understanding
    - assistant-search-handoff-and-grounding
    - assistant-proactive-subscription-delivery
    done_when:
    - 用户从首页、内容页、群聊、搜索页、个人页进入小趣时，入口语义和会话状态一致，不维护第二套助手体验。
    - 用户在内容页提问时，小趣基于当前对象、内容片段、标签和站内外检索给出有引用边界的回答。
    - 用户在群聊中 @小趣 时，消息以结构化 mentions 触发 AssistantMentioned，assistant-service 基于最近消息窗口与成员信息回群回复。
    - 用户可订阅主题并投递到用户或会话；投递前执行 consent、频控、静默、去重与审计。
    - 小趣回答后的赞/踩、采纳、撤销和引用打开能回流到 InteractionEvent，并携带 referralSource、triggerMessageId、assistantTurnId。
    experience_points:
    - 入口无处不在但不打扰，半屏/全屏/群聊内体验一致。
    - 回答明确区分站内对象、群聊上下文和互联网引用。
    - 主动服务可暂停、恢复、撤销和审计，避免错投递。
    performance_points:
    - 会话内 @小趣 首个可见响应 p95 <= 3s。
    - grounding success >= 95%，citation 可点击率 100%。
    - 主动投递 wrong-destination 事故 = 0。
    tests:
      planned:
      - file: quwoquan_app/test/ui/chat/journeys/chat_assistant_journey_test.dart
      - file: quwoquan_service/services/assistant-service/internal/infrastructure/messaging/assistant_mentioned_consumer_test.go
      - file: quwoquan_service/services/chat-service/tests/assistant_mentioned_stream_contract_test.go
      recorded:
      - file: quwoquan_app/test/components/input/customizable_chat_input_bar_test.dart
      - file: quwoquan_app/test/ui/chat/providers/chat_message_provider_test.dart
      - file: quwoquan_app/test/ui/assistant/widgets/assistant_half_sheet_personalization_provider_test.dart
      - file: quwoquan_app/test/ui/assistant/personal_content_access_provider_test.dart
      - file: quwoquan_service/services/chat-service/tests/event_publish_contract_test.go
      - file: quwoquan_service/services/chat-service/tests/assistant_mentioned_stream_contract_test.go
      - file: quwoquan_service/services/assistant-service/internal/application/chat_mention_service_test.go
      - file: quwoquan_service/services/assistant-service/internal/application/service_test.go
      - file: quwoquan_service/services/assistant-service/internal/application/skill_subscription_service_test.go
      - file: quwoquan_service/services/assistant-service/tests/assistant_mentioned_chat_integration_test.go
      - file: quwoquan_service/services/assistant-service/internal/infrastructure/chatclient/client_test.go
      - file: quwoquan_service/services/assistant-service/internal/infrastructure/messaging/assistant_mentioned_consumer_test.go
      - file: quwoquan_service/scripts/contract/verify_assistant_context_contract.py
      - file: quwoquan_service/scripts/contract/verify_assistant_security_contract.py
      - file: specs/feature-tree/assistant-run-learning/commercial_slo_observability.md
    status: partial
    test_evidence:
      primary:
      - layer: user_acceptance
        suite: user_journey
        cases:
        - user_acceptance.specs.feature_tree.uat_assistant_omnipresent_private_assistant.user_journey
        envs: *id001
      supporting:
      - layer: local_contract
        suite: uat_assistant_omnipresent_private_assistant_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_assistant_omnipresent_private_assistant.uat_assistant_omnipresent_private_assistant_local_contract
        envs: *id003
      - layer: local_contract
        suite: uat_assistant_omnipresent_private_assistant_local_contract
        cases:
        - local_contract.specs.feature_tree.uat_assistant_omnipresent_private_assistant.uat_assistant_omnipresent_private_assistant_local_contract
        envs: *id003
      - layer: api_integration
        suite: cross_service_integration
        cases:
        - api_integration.specs.feature_tree.uat_assistant_omnipresent_private_assistant.cross_service_integration
        envs: *id002
