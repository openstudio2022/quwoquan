version: 2
node:
  id: behavior-ingestion
  level: L3_story
  path: specs/feature-tree/circle-community/in-circle-recommendation-loop/behavior-ingestion
  title: behavior ingestion
  parent_domain_service: circle-community
  parent_business_capability: in-circle-recommendation-loop
scope:
  summary: 圈子对象级行为信号（impression/dwell/joinCircle/leaveCircle）经 CircleBehaviorFact 进入推荐侧的摄取链路。
  in_scope:
  - App 端圈子主页 impression/dwell 与 join/leave 行为事实追加（游客态守卫、幂等重放不重复追加）
  - circle-service CircleBehaviorFact append-only 存储、weeklyActive 投影与 events.circle.behavior_facts stream
  - recommendation-service 对 circle 事件（CircleCreated/Updated/Archived + behavior facts）的消费落地
  out_of_scope:
  - 圈内内容排序策略（recommendation-ranking 承载）
  - 通用 content 行为事件通道（content 域 behaviors.yaml 承载）
gwt_acceptance:
  GWT1:
    title: 圈子主页行为事实端到端摄取
    given:
    - 登录 persona 打开圈子主页并停留后离开；或完成加入/退出。
    when:
    - CircleDetailPage 触发 impression（首帧）与 dwell（dispose）；joinCircle/leaveCircle 成功且非幂等重放。
    then:
    - ReportCircleBehavior 命令写入 circle_behavior_facts（recorded 不可变）。
    - weeklyActive 投影按 lastActiveAt 窗口回写 circles.weeklyActiveCount。
    - events.circle.behavior_facts stream 发布 CircleBehaviorFactAppended。
    done_when:
    - 游客态不产生 401 噪音（writer 不解析）；行为失败不影响页面交互且进全局异常遥测。
    edge_cases:
    - 幂等重放（idempotentReplay=true）不追加行为事实。
    - 游客浏览不追加任何 fact。
    contract_refs:
    - quwoquan_service/contracts/metadata/social/circle_behavior_fact/service.yaml
    - quwoquan_service/contracts/metadata/social/circle_behavior_fact/events.yaml
    performance_points: []
    tests:
      planned: []
      recorded:
      - quwoquan_app/test/local_contract/ui/circle/widgets/circle_detail_page_widget__local_contract_test.dart
      - quwoquan_service/services/circle-service/tests/api_integration/circle_behavior_fact__api_integration_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.circle_community.in_circle_recommendation_loop.behavior_ingestion.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.circle_community.in_circle_recommendation_loop.behavior_ingestion.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: circle_behavior_fact
        cases:
        - api_integration.circle.behavior_fact.append_and_weekly_active
        envs:
        - gamma
    notes:
    - App 端 impression/dwell/join/leave 行为信号已于 2026-07-19 接线（页面矩阵 circle_detail 行 B4）。
  GWT2:
    title: 推荐侧消费 circle 事件形成候选闭环
    given:
    - circle 事件契约声明 recommendation-engine 为 consumer（events.yaml），但实现缺失（R-CIRCLE-003）。
    when:
    - CircleCreated/CircleUpdated/CircleArchived 或 CircleBehaviorFactAppended 发布到 Redis stream。
    then:
    - recommendation-service 消费事件并维护圈子候选投影；archived 圈子退出候选。
    - hub「圈子推荐」模块可消费真实召回而非全量列表端侧过滤。
    done_when:
    - api_integration 证明 CircleCreated → 推荐候选可见、CircleArchived → 候选下线。
    edge_cases:
    - 事件重放（inbox 去重）不产生重复候选。
    contract_refs:
    - quwoquan_service/contracts/metadata/social/circle/events.yaml
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt2_local_contract
        cases:
        - local_contract.circle_community.in_circle_recommendation_loop.behavior_ingestion.gwt2_rec_consumption
        envs: *id001
      supporting:
      - layer: api_integration
        execution_profile: integration
        suite: circle_candidate_ingestion
        cases:
        - api_integration.recommendation.circle.candidate_ingestion
        envs:
        - gamma
    notes:
    - 缺口登记 docs/outstanding_risks_backlog.md R-CIRCLE-003；规格落点 docs/functional_module_commercial_maturity_matrix.md M8-H Phase 3。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
