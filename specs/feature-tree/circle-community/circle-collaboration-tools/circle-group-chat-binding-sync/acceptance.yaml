version: 2
node:
  id: circle-group-chat-binding-sync
  level: L3_story
  path: specs/feature-tree/circle-community/circle-collaboration-tools/circle-group-chat-binding-sync
  title: circle group chat binding sync
  parent_domain_service: circle-community
  parent_business_capability: circle-collaboration-tools
scope:
  summary: CircleGroup 权威成员生命周期到 Chat Conversation 的可靠投影与反向绑定验收范围。
  in_scope:
  - CircleGroup 创建、成员 active/left/removed/role_changed、归档的 durable Stream 投影和双向绑定
  - 圈群容量、Chat HTTP 旁路拒绝、终态 Inbox/realtime 清理、DLQ/health/metrics
  out_of_scope:
  - 文件、资料、公开内容、二维码邀请与跨圈迁移
gwt_acceptance:
  GWT1:
    title: CircleGroup 创建后可靠建立唯一聊天绑定
    given:
    - active CircleGroup 已经由 circle-service 真实命令创建，CircleGroupCreated 在 Redis Stream 可重放。
    when:
    - chat circle-group provisioner 消费创建事实，随后 circle binding projector 消费回写事实。
    then:
    - Conversation、owner ConversationMember、owner ConversationUserState 与 Chat outbox 在同一事务提交。
    - Conversation.circleGroupId 与 CircleGroup.conversationId 双向一对一；重复或 reclaim 事件不创建第二个对象。
    - chat 持久化或回写失败时 source message 不 ACK，达到重试上限进入带 TTL DLQ 且 health/metric 可见。
    done_when:
    - Circle HTTP create -> Redis Stream -> Chat Mongo -> reverse Stream -> Circle Mongo 的真实 API integration 通过。
    - local_contract 覆盖 payload 校验、幂等、乱序/reclaim 和 DLQ。
    edge_cases:
    - CircleGroup 在 provision 完成前归档时，最终不能留下 active Conversation。
    contract_refs:
    - quwoquan_service/contracts/metadata/social/circle_group/events.yaml#CircleGroupCreated
    - quwoquan_service/contracts/metadata/messages/conversation/events.yaml#CircleGroupConversationProvisioned
    performance_points:
    - create_to_binding_p95_ms <= 3000
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/chat-service/internal/application/circle_group_chat_sync__local_contract_test.go
      - quwoquan_service/services/chat-service/internal/adapters/mq/circle_group_chat_sync_consumer__local_contract_test.go
      - quwoquan_service/services/circle-service/internal/application/circle/circle_group/circle_group_conversation_binding_projector__local_contract_test.go
      - quwoquan_service/services/circle-service/internal/infrastructure/messaging/circle_group_conversation_binding_consumer__local_contract_test.go
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: circle_group_chat_binding_consumer
        cases:
        - local_contract.circle_community.circle_collaboration_tools.circle_group_chat_binding_sync.gwt1_local_contract
        envs: &local
        - local
      - layer: api_integration
        execution_profile: integration
        suite: circle_group_chat_binding_e2e
        cases:
        - api_integration.circle_community.circle_collaboration_tools.circle_group_chat_binding_sync.gwt1_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: circle_group_chat_binding_user_journey
        cases:
        - user_acceptance.circle_community.circle_collaboration_tools.circle_group_chat_binding_sync.gwt1_user_acceptance
        envs:
        - gamma_local
        - prod
    notes: []
  GWT2:
    title: CircleGroup 成员生命周期准确收敛到聊天名册与 Inbox
    given:
    - 已绑定 CircleGroup 与 Conversation 存在，成员申请、审批、离开、移除和角色变更通过 CircleGroupMembership 命令产生 outbox。
    when:
    - chat membership projector 消费对应 Stream 事件并发生重复、乱序或重启 reclaim。
    then:
    - active 只创建一次 Chat member/UserState，role 映射为 owner/admin/member。
    - left/removed 原子删除 UserState 和 ChatInbox 可达性，迟到 MessageSent 不得复活。
    - role_changed 只更新既有 Chat member，不创建重复名册行；Chat HTTP 成员治理全部返回 circle_group_managed_by_circle。
    done_when:
    - Redis + Mongo 双服务 API integration 覆盖完整状态机、重复/乱序、realtime 与 Inbox readback。
    - 双账号 user_acceptance 覆盖加入后可见、离开/被移除后缓存清理和管理入口收敛。
    edge_cases:
    - 第 1001 位成员在 Circle membership 事务内返回 group_membership_full，Chat 与 Circle 均无部分写入。
    - CircleGroupArchived 后迟到 membership event 不得复活 Chat 名册或 UserState。
    contract_refs:
    - quwoquan_service/contracts/metadata/social/circle_group_membership/events.yaml
    - quwoquan_service/contracts/metadata/messages/conversation_membership/aggregate.yaml
    performance_points:
    - membership_projection_p95_ms <= 3000
    - projection_pending_age_ms <= 30000
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/chat-service/internal/application/circle_group_chat_sync__local_contract_test.go
      - quwoquan_service/services/chat-service/internal/adapters/mq/circle_group_chat_sync_consumer__local_contract_test.go
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: circle_group_membership_chat_projection
        cases:
        - local_contract.circle_community.circle_collaboration_tools.circle_group_chat_binding_sync.gwt2_local_contract
        envs: *local
      - layer: api_integration
        execution_profile: integration
        suite: circle_group_membership_chat_projection_e2e
        cases:
        - api_integration.circle_community.circle_collaboration_tools.circle_group_chat_binding_sync.gwt2_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: circle_group_membership_chat_projection_user_journey
        cases:
        - user_acceptance.circle_community.circle_collaboration_tools.circle_group_chat_binding_sync.gwt2_user_acceptance
        envs:
        - gamma_local
        - prod
    notes: []
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make verify-metadata
  - make gate
