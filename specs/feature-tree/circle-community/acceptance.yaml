  summary: circle community 验收范围。
  in_scope: []
  out_of_scope: []
domain_acceptance:
  DA1:
    title: circle community 领域边界验收
    done_when:
    - 领域边界、上下游依赖、工程映射和服务治理清晰。
    - 9 个业务对象（circle 含 section_config、membership、group、group_membership、file、post_placement、behavior_fact、search_item_view）按对象 packet 治理：state/receipt/outbox 同事务、命名迁移服务端 CAS、no-op receipt 持久化、If-Match 仅 group/file 快照覆盖两处（封闭清单）。
    - Circle 聚合本体命令仅圈主/管理员（BOLA fail-closed）；展示位（pin/feature）唯一写入口是 CirclePostPlacement，feed 读模型由 placement outbox 投影回写。
    boundary_points:
    - Circle↔MediaAsset 引用完整性由 tombstone 关系承载（无 MediaAssetDeleted 消费者，2026-07-19 裁决删除悬空声明）。
    - hub 多圈发现 feed 为端侧有界并发扇出（性能债注记，聚合 API 属规格增量走 /prd）。
    tests:
      planned: []
      recorded:
      - quwoquan_service/services/circle-service/tests/api_integration/circle_crud_contract__api_integration_test.go
      - quwoquan_service/services/circle-service/tests/api_integration/circle_membership__api_integration_test.go
      - quwoquan_service/services/circle-service/tests/api_integration/circle_group__api_integration_test.go
      - quwoquan_service/services/circle-service/tests/api_integration/circle_file_contract__api_integration_test.go
      - quwoquan_service/services/circle-service/tests/api_integration/circle_post_placement__api_integration_test.go
      - quwoquan_service/services/circle-service/tests/api_integration/circle_behavior_fact__api_integration_test.go
      - quwoquan_app/test/user_acceptance/journeys/circle/circle_detail_journey__user_acceptance_test.dart
      - quwoquan_app/test/user_acceptance/journeys/circle/circle_navigation_journey__user_acceptance_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: da1_local_contract
        cases:
        - local_contract.circle_community.domain_service.da1.da1_local_contract
        envs:
        - local
      - layer: api_integration
        execution_profile: integration
        suite: da1_api_integration
        cases:
        - api_integration.circle_community.domain_service.da1.da1_api_integration
        envs:
        - beta
        - gamma
      supporting: []
    notes: []
  DA2:
    title: 圈子发现聚合读模型契约
    done_when:
    - ListCircleDiscoveryFeed 是圈子频道唯一聚合读接口；服务端完成 category、subCategory、scope、可见性和成员范围过滤，App 不得 listCircles 后逐圈拉取 feed。
    - 默认 recommended 首屏只有一次 discovery-feed 请求；mine 仅由已认证 Persona 主动切换后按需请求，匿名 mine 不返回成员数据。
    - CircleDiscoveryFeedPageSlice 与 CircleFeedPageSlice 均为 metadata 生成的强类型 Slice；排序、keyset cursor、同分 tie-breaker、placement 归属与必填字段可由 ContractGraph 验证。
    - discovery feed 读缓存 TTL 为 60 秒，缓存键按 persona、scope、category、subCategory、sort、cursor 隔离；Circle、Membership、Post、Placement 变化会失效相关切片。
    - 聚合查询具有索引/explain 与 10k/100k 数据集 P95 不超过 800ms 的证据，不得以单 HTTP 请求掩盖存储 N+1。
    boundary_points:
    - CircleDiscoveryFeed 只读 Circle、CircleMembership、Post、CirclePostPlacement 的投影，不加载 Circle 聚合或维护第二套成员/内容事实。
    - GetCircleFeed 与 discovery feed 共用 CircleFeedItemView 的 placement/post 强类型表达；不得以 Post.toMap 或动态 wire map 补展示字段。
    tests:
      planned:
      - quwoquan_service/services/circle-service/tests/local_contract/circle_discovery_feed_cache__local_contract_test.go
      - quwoquan_service/services/circle-service/tests/api_integration/circle_discovery_feed__api_integration_test.go
      - quwoquan_app/test/local_contract/ui/circle/pages/home_circles_hub_page__local_contract_test.dart
      - quwoquan_app/test/api_integration/cloud/circle/circle_discovery_feed__api_integration_test.dart
      - quwoquan_app/test/user_acceptance/patrol/circle/circle_commercial_visual_journey__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: da2_local_contract
        cases:
        - local_contract.circle_community.domain_service.da2.da2_local_contract
        envs:
        - local
      - layer: api_integration
        execution_profile: integration
        suite: da2_api_integration
        cases:
        - api_integration.circle_community.domain_service.da2.da2_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: da2_user_acceptance
        cases:
        - user_acceptance.circle_community.domain_service.da2.da2_user_acceptance
        envs:
        - gamma_local
