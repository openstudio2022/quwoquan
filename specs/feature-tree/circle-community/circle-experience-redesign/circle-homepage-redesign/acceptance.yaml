gwt_acceptance:
  GWT1:
    title: 圈子主页首屏统一结构
    given:
    - 用户进入一个圈子主页。
    when:
    - 页面首屏完成渲染。
    then:
    - 用户 5 秒内能看懂这个圈子是什么、为什么推荐这个圈子、我为什么适合加入。
    done_when:
    - 首屏顺序为身份区、加入/私信、与你的交集、圈子影响力、内容/讨论/成员。
    - 编辑圈子、管理中心、发布、分享、复制链接、举报进入更多菜单，不占首屏主 CTA。
    - 与你的交集使用纵向列表，默认 3 条；圈子影响力展示连接价值，不展示统计面板。
    - 圈子内容二级筛选沿主页统一口径，仅展示全部、图片、视频、文字。
    edge_cases:
    - 私密圈子游客访问时内容区显示门禁，不阻断首屏身份和 CTA。
    - 圈子影响力为空或加载失败时模块收起，不影响交集与内容 tab。
    contract_refs:
    - quwoquan_service/contracts/metadata/social/circle/ui_config.yaml
    performance_points:
    - Tab 切换 p95 < 200ms
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/circle/widgets/circle_action_bar_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/circle/widgets/circle_shell_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/circle/widgets/section_widgets__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/components/object_page/object_intersection_card__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/pages/circle/circle_detail/circle_detail_page__user_acceptance_test.dart
      - file: quwoquan_service/services/circle-service/tests/api_integration/circle_section_contract__api_integration_test.go
      - file: quwoquan_service/services/circle-service/tests/api_integration/circle_feed_contract__api_integration_test.go
      - file: quwoquan_service/services/circle-service/tests/api_integration/circle_membership__api_integration_test.go
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.circle_community.circle_experience_redesign.circle_homepage_redesign.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.circle_community.circle_experience_redesign.circle_homepage_redesign.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: journey
        cases:
        - user_acceptance.circle_community.circle_experience_redesign.circle_homepage_redesign.journey
        envs:
        - gamma_local
      - layer: api_integration
        execution_profile: integration
        suite: gwt1_api_integration
        cases:
        - api_integration.circle_community.circle_experience_redesign.circle_homepage_redesign.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes: []
  GWT2:
    title: 圈子频道单请求、游标与强类型内容投影
    given:
    - 用户进入圈子频道，默认频道为 recommended。
    - 服务端存在不同分类、成员范围、展示位状态和相同排序值的圈子内容。
    when:
    - 用户首次打开频道、切换我的频道或继续加载下一页。
    then:
    - 首屏仅请求一次 ListCircleDiscoveryFeed(recommended)；已认证用户切换我的频道后才请求 ListCircleDiscoveryFeed(mine)，匿名用户不会读取 mine 数据。
    - 页面只消费服务端返回的 CircleDiscoveryFeedPageSlice 与 CircleFeedItemView；每个帖子必含 placementId，展示字段不通过 Post.toMap 或动态 Map 补造。
    - nextCursor 驱动增量追加且无重复/遗漏；服务端稳定排序、scope 与分类过滤在端侧不可被重新解释。
    - Circle、Membership、Post、Placement 变化后，最多 60 秒缓存窗口内收敛为最新内容；恢复请求显示结构化加载/错误/重试状态。
    edge_cases:
    - anonymous mine 返回安全空态与登录续接，不泄漏成员圈子、成员关系或私密内容。
    - 缺 placementId、非法 cursor 或非法 scope 时不以空成功降级；端侧显示结构化 RuntimeFailure 恢复面。
    contract_refs:
    - quwoquan_service/contracts/metadata/social/circle/service.yaml
    - quwoquan_service/contracts/metadata/social/circle/fields.yaml
    - quwoquan_service/contracts/metadata/social/circle/projections/circle_discovery_feed.yaml
    - quwoquan_service/contracts/metadata/social/circle/storage.yaml
    performance_points:
    - ListCircleDiscoveryFeed p95 <= 800ms at 10k/100k fixture scale
    - 默认频道首屏一次请求
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/circle/pages/home_circles_hub_page__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/circle/circle_query_contracts__local_contract_test.dart
      - file: quwoquan_app/test/api_integration/cloud/circle/circle_discovery_feed__api_integration_test.dart
      - file: quwoquan_service/services/circle-service/tests/api_integration/circle_discovery_feed__api_integration_test.go
      - file: quwoquan_app/test/user_acceptance/patrol/circle/circle_commercial_visual_journey__user_acceptance_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt2_local_contract
        cases:
        - local_contract.circle_community.circle_experience_redesign.circle_homepage_redesign.gwt2_local_contract
        envs:
        - local
      - layer: api_integration
        execution_profile: integration
        suite: gwt2_api_integration
        cases:
        - api_integration.circle_community.circle_experience_redesign.circle_homepage_redesign.gwt2_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: gwt2_user_acceptance
        cases:
        - user_acceptance.circle_community.circle_experience_redesign.circle_homepage_redesign.gwt2_user_acceptance
        envs:
        - gamma_local
