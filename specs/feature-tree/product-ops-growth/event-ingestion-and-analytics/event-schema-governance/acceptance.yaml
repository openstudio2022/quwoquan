  title: event schema governance
  parent_domain_service: product-ops-growth
  parent_business_capability: event-ingestion-and-analytics
scope:
  summary: 九字段信封、严格事件/页面目录、批次幂等、SLS 单轨、隐私与保留治理。
  in_scope:
  - event_catalog.yaml 与 app_pages.yaml 三端 codegen。
  - App/Service 双端 strict validation 与 canonical batch digest。
  - SLS raw/aggregate 单轨和 Portal 查询门面。
  out_of_scope:
  - 推荐 BehaviorSignal、Assistant 学习、visit_record。
gwt_acceptance:
  GWT1:
    title: event schema governance GWT
    given:
    - 前置条件明确。
    when:
    - 用户或系统动作发生。
    then:
    - 可观察结果符合预期。
    done_when:
    - 九字段与目录在 App/Go/Portal 生成产物一致，未知字段或事件被双端拒绝。
    - canonical body 重放只写一批，超时后已写入可确认，Portal 默认掩码 sessionId。
    - Mongo/ES/EventBatchReported/AppLogUploader 旧日志轨零残留。
    edge_cases:
    - occurredAt 早于 72h 或晚于 5min。
    - 批次恰好 50 条/128 KiB 与越界一条/一字节。
    - PutLogs 超时但服务端已接收。
    contract_refs:
    - quwoquan_service/contracts/metadata/ops/event_record/event_catalog.yaml
    - quwoquan_service/contracts/metadata/_shared/app_pages.yaml
    - quwoquan_service/contracts/metadata/ops/event_record/storage.yaml
    performance_points:
    - ingest P95 <= 800ms
