version: 2
node:
  id: event-ingestion-and-analytics
  level: L2_business_capability
  path: specs/feature-tree/product-ops-growth/event-ingestion-and-analytics
  title: event ingestion and analytics
  parent_domain_service: product-ops-growth
  parent_business_capability: event-ingestion-and-analytics
scope:
  summary: App 产品事件/异常、受限启动诊断、SLS 明细/聚合、Portal 查询和推荐反馈边界的端到端验收。
  in_scope:
  - 九字段事件目录、页面目录、App 加密 outbox、product-ops SLS 单轨与 Portal 查询。
  - 受限匿名启动诊断与 app_startup 产品投影隔离。
  - BehaviorReporter 到 HotPath/投影/推荐/指标单出口。
  out_of_scope:
  - ClickHouse、Elasticsearch、消息队列、对象存储归档、Assistant 学习并入 Ops。
sit_acceptance:
  SIT1:
    title: 九字段目录与 App 可靠交付
    story_refs: [event-schema-governance, analytics-metric-dictionary]
    done_when:
    - App/Go/Portal 生成目录一致，未知事件/字段/枚举本地和服务端均拒绝。
    - networkClass 固定为 wifi/ethernet/5g/4g/mobile/other/none；VPN 叠加时上报底层
      接入，单独 vpn/lte/nr/offline 均被服务端拒绝。
    - session 状态机、页面映射、10s/50条/128KiB、单飞密封批次、重试/死信/actor 隔离可验证。
    performance_points: [event_120_per_minute, error_20_per_minute]
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/core/telemetry/app_telemetry_session_store__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/telemetry/app_telemetry_session_context__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/telemetry/app_telemetry_outbox__local_contract_test.dart
      - file: quwoquan_service/services/product-ops-service/tests/local_contract/visit_event_contract__local_contract_test.go
      - file: quwoquan_service/services/product-ops-service/cmd/api/main__local_contract_test.go
      recorded:
      - file: quwoquan_app/test/local_contract/core/telemetry/app_telemetry_session_context__local_contract_test.dart
      - file: quwoquan_service/services/product-ops-service/tests/local_contract/visit_event_contract__local_contract_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: telemetry_contract
        cases: [local_contract.product_ops_growth.event_ingestion_and_analytics.sit1]
        envs: [local]
      supporting: []
    notes: [实现和证据正在闭合，禁止提前标记 implemented。]
  SIT2:
    title: SLS 写入幂等、聚合与查询门面
    story_refs: [event-schema-governance, analytics-metric-dictionary]
    done_when:
    - canonical digest、全批校验、重复 ACK、超时后已写入确认和查询去重通过协议测试。
    - 真实 SLS 三 Logstore TTL 为 3/3/90 天，Scheduled SQL 输出无 session/user，Portal 只经 product-ops 查询。
    performance_points: [summary_p95_2s, drilldown_p95_3s]
    tests:
      planned:
      - file: quwoquan_service/services/product-ops-service/tests/api_integration/sls_event_store__api_integration_test.go
      - file: quwoquan_service/services/product-ops-service/tests/api_integration/event_query_facade__api_integration_test.go
      recorded: []
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        suite: sls_ingestion_and_query
        cases: [api_integration.product_ops_growth.event_ingestion_and_analytics.sit2]
        envs: [beta, gamma]
      supporting: []
    notes: [缺 TEST_SLS 凭据或资源时为外部 GATE_BLOCK，不得以 Mongo/ES 替代证据。]
  SIT3:
    title: 受限启动诊断与产品启动事件隔离
    story_refs: [event-schema-governance]
    done_when:
    - /ops/startup-events 只收固定脱敏字段，匿名 /ops/events 保持 401。
    - journal 阶段写 startup diagnostic Logstore；内容可交互后 app_startup 经普通 Reporter 写 product Logstore。
    - 正常、慢启动和 hasError 启动均全量上报；3000ms 只用于聚合分析和告警，不参与端侧采样。
    performance_points: [error_flush_within_1s]
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/app/startup_telemetry__local_contract_test.dart
      - file: quwoquan_service/services/product-ops-service/tests/local_contract/visit_event_contract__local_contract_test.go
      recorded:
      - file: quwoquan_app/test/local_contract/app/startup_telemetry__local_contract_test.dart
      - file: quwoquan_service/services/product-ops-service/tests/local_contract/visit_event_contract__local_contract_test.go
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        suite: startup_telemetry_schema_and_privacy
        cases: [local_contract.product_ops_growth.event_ingestion_and_analytics.sit3]
        envs: [local]
      supporting:
      - layer: api_integration
        suite: startup_telemetry_ingress
        cases: [api_integration.product_ops_growth.event_ingestion_and_analytics.sit3]
        envs: [gamma]
    notes: [现有 journal/recovery 基线保留；app_startup 已按 100% 采集并由目录门禁和 Reporter local_contract 固定，受限 startup diagnostic 与普通 app_startup 已由现存协议测试证明写入不同 Logstore，真实 SLS/gamma 证据仍待外部资源。]
  SIT4:
    title: 推荐反馈单出口与一次生效
    story_refs: [feedback-ingestion-sampling]
    done_when:
    - ContentBehaviorTracker 和 ContentEngagementTracker 只调用 BehaviorReporter，BehaviorRepository 不调用 Ops。
    - /content/behaviors 或专用命令只产生一次 BehaviorSignal，并经 BehaviorBatchReported 驱动推荐投影。
    - Portal behavior 卡读取 recommendation Prometheus 真实指标。
    performance_points: [hotpath_apply_p95_100ms]
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/cloud/behavior/behavior_single_outlet__local_contract_test.dart
      - file: quwoquan_service/services/content-service/tests/api_integration/post_behavior_contract__api_integration_test.go
      recorded: []
    status: partial
    test_evidence:
      primary:
      - layer: api_integration
        suite: behavior_once_and_attribution
        cases: [api_integration.discovery_content.feedback_ingestion_sampling.sit4]
        envs: [beta, gamma]
      supporting: []
