version: 2
node:
  id: object-share-cards
  level: L3_story
  path: specs/feature-tree/product-ops-growth/outbound-share-distribution/object-share-cards
  title: object share cards
  parent_domain_service: product-ops-growth
  parent_business_capability: outbound-share-distribution
scope:
  summary: 5 类对象在微信会话/朋友圈/海报/口令渠道的卡片视觉与文案设计，美观且驱动点击回流。
  journey_scenarios:
  - outbound-object-share-distribution
  out_of_scope:
  - 链接结构与入站回流。
  - 分享面板交互编排（share-channel-panel）。
  - 归因落库（share-attribution-and-token）。
gwt_acceptance:
  GWT1:
    title: 微信会话/朋友圈卡按对象类型正确生成
    given:
    - 给定任一 public 对象的 ObjectShareSeed。
    when:
    - 用户选择微信会话或朋友圈分享。
    then:
    - 生成 OpenSDK 卡片：title/description/缩略图按对象类型映射（文章/图文/视频/动态/实体/用户/圈子）。
    - 缩略图比例与大小满足 OpenSDK 约束，亮点徽标体现社交证明数字。
    done_when:
    - 5 类对象（含内容 4 形态）卡片字段映射测试通过。
    edge_cases:
    - 视频卡缩略图带播放角标；图文卡多图取主图。
    - 缺图时用品牌占位与类型色块。
    contract_refs:
    - specs/feature-tree/product-ops-growth/outbound-share-distribution/object-share-cards/spec.md
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points:
    - 卡片素材准备 P95 <= 800ms。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.object_share_cards.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.object_share_cards.gwt1_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/share/wechat_share_card_mapping_test.dart'
  GWT2:
    title: 海报含二维码与口令且视觉层级正确
    given:
    - 用户选择保存海报。
    when:
    - 客户端渲染 1080x1920 海报 PNG。
    then:
    - 含主视觉/价值区/归属区/品牌行动区，二维码指向短链 s/{token}，底部含口令短码。
    - 色/距/字走设计 token，文案走 UITextConstants。
    done_when:
    - 海报渲染快照覆盖 5 类对象差异化主视觉与二维码/口令区。
    edge_cases:
    - 人脸/水印/敏感缩略图被安全过滤。
    - 长标题截断不溢出安全边距。
    contract_refs:
    - specs/feature-tree/product-ops-growth/outbound-share-distribution/object-share-cards/spec.md
    performance_points:
    - 海报渲染 P95 <= 1.5s。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.object_share_cards.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.object_share_cards.gwt2_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/share/object_share_poster_render_test.dart'
  GWT3:
    title: 可见性分级控制卡片生成
    given:
    - 对象 visibility 为 public / circle_visible / private。
    when:
    - 用户尝试生成对外卡片。
    then:
    - public 生成完整卡；circle_visible 生成受控预览卡（隐藏正文，提示加入圈子）；private 不生成。
    done_when:
    - 三档可见性卡片生成行为测试通过。
    edge_cases:
    - circle_visible 海报不含正文与二维码直达内容。
    contract_refs:
    - specs/feature-tree/product-ops-growth/outbound-share-distribution/object-share-cards/spec.md
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.object_share_cards.gwt3_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.object_share_cards.gwt3_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/share/object_share_card_visibility_test.dart'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
