version: 2
node:
  id: outbound-share-distribution
  level: L2_business_capability
  path: specs/feature-tree/product-ops-growth/outbound-share-distribution
  title: outbound share distribution
  parent_domain_service: product-ops-growth
scope:
  summary: 5 类对象统一对外分享分发（微信卡片/海报/口令/系统分享），携带归因并可靠回流。
  story_refs:
  - object-share-cards
  - share-channel-panel
  - share-attribution-and-token
  out_of_scope:
  - 链接/深链/中转页结构定义（runtime/entity-link-templates-metadata）。
  - 入站唤起/拦截兜底/延迟深链（runtime/external-inbound-deeplink-routing）。
  - 公开 HTML/SEO 渲染（runtime/public-content-web-entry）。
sit_acceptance:
  SIT1:
    title: 5 类对象对外分享分发端云一致闭环
    story_refs:
    - object-share-cards
    - share-channel-panel
    - share-attribution-and-token
    capability_boundary:
      owns:
      - 统一分享面板与渠道编排。
      - 5 类对象 × 渠道卡片视觉与文案。
      - 分享归因/口令生成与识别、海报渲染。
      does_not_own:
      - 链接结构与入站回流。
      - 各对象可分享字段与分享落库计数实现。
    conflict_matrix:
    - conflict: 微信能力位缺失（Web/鸿蒙/未集成 SDK）
      resolution: 自动降级海报 + 系统分享，面板不展示死按钮。
    - conflict: private 对象触发对外分享
      resolution: 渠道置灰提示不可分享；未知或已退役 visibility 直接拒绝。
    - conflict: 游客触发需登录的分享动作
      resolution: 走 AuthGateReason.shareRecord 登录门，关闭回安全态不死循环（rule15）。
    done_when:
    - 5 类对象 × 渠道（微信会话/朋友圈/海报/系统分享/复制链接/复制口令）组合可用且无盲区。
    - 各渠道物料携带 share_id/utm 归因，与入站节点联调可回流到对应对象。
    - 可见性分级与登录门行为正确。
    - 分享归因可在指标大盘按渠道与对象类型统计转化。
    performance_points:
    - 分享面板打开 P95 <= 300ms。
    - 海报渲染 P95 <= 1.5s。
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: sit1_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        execution_profile: integration
        suite: sit1_api_integration
        cases:
        - api_integration.product_ops_growth.outbound_share_distribution.sit1.sit1_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: sit1_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.sit1.sit1_local_contract
        envs: *id001
      - layer: user_acceptance
        execution_profile: release
        suite: user_journey
        cases:
        - user_acceptance.product_ops_growth.outbound_share_distribution.sit1.user_journey
        envs:
        - gamma_local
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/share/object_share_panel_test.dart'
    - '[migrated_from_planned] quwoquan_app/test/ui/share/object_share_card_render_test.dart'
    - '[migrated_from_planned] quwoquan_service/services/content-service/tests/object_share_attribution_contract_test.go'
    - '[migrated_from_planned] quwoquan_app/integration_test/object_share_distribution_journey_test.dart'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
