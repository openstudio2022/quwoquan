version: 3
node:
  id: share-channel-panel
  level: L3_story
  path: specs/feature-tree/product-ops-growth/outbound-share-distribution/share-channel-panel
  title: share channel panel
  parent_domain_service: product-ops-growth
  parent_business_capability: outbound-share-distribution
scope:
  summary: 统一分享面板编排圈子/群聊/私信站内分发与微信/朋友圈/海报/系统分享/复制站外渠道，含登录门与可见性分级。
  journey_scenarios:
  - outbound-object-share-distribution
  out_of_scope:
  - 卡片视觉设计（object-share-cards）。
  - 归因落库与口令解析（share-attribution-and-token）。
  - 入站回流（runtime/external-inbound-deeplink-routing）。
gwt_acceptance:
  GWT1:
    title: 5 类对象统一面板两段式渠道编排
    given:
    - 用户在任一对象详情页打开分享面板。
    when:
    - 面板根据对象与能力位渲染渠道列表。
    then:
    - Post/内容先展示“分享到趣我圈”的最近会话、圈子、群聊和私信，再展示“分享到其他平台”。
    - 微信会话/朋友圈/保存海报/系统分享/复制链接按可用性排列。
    - 站外默认链接为 HTTPS landing/中转页，scheme 仅作打开目标。
    done_when:
    - 5 类对象面板渲染与渠道执行测试通过；Post 站内三类目标均有真实动作。
    edge_cases:
    - 微信能力位缺失降级海报/系统分享，不展示死按钮。
    contract_refs:
    - specs/feature-tree/product-ops-growth/outbound-share-distribution/share-channel-panel/spec.md
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points:
    - 面板打开 P95 <= 300ms。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/content/share/share_template_by_identity_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/share/forward_share_sheet__local_contract_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.share_channel_panel.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.share_channel_panel.gwt1_local_contract
        envs: *id001
    notes:
    - 站内两类发送和站外渠道已有 local contract；Gamma 真机微信证据尚未在本轮产生。
    - Android 当前为显式 ACTION_SEND Activity 桥接，不等价于 OpenSDK 卡片成功；签名、安装态与真机结果未闭环前保持 partial。
  GWT2:
    title: 分享登录门关闭后不死循环且成功续接
    given:
    - 游客触发需账号态的分享动作。
    when:
    - 弹出 AuthGateReason.shareRecord 登录门，用户关闭或登录成功。
    then:
    - 关闭后回安全态不重复弹登录；登录成功续接原渠道动作（AuthContinuation）。
    done_when:
    - 关闭再 pump 不再弹登录；登录成功进入目标渠道执行的测试通过。
    edge_cases:
    - 公开对象复制链接/保存海报对游客直接可用。
    contract_refs:
    - quwoquan_app/lib/core/auth/auth_continuation.dart
    - specs/feature-tree/runtime/runtime-client-foundation/error-permission-display-semantics/spec.md
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt2_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.share_channel_panel.gwt2_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/share/share_login_continuation_test.dart'
  GWT3:
    title: 可见性分级控制渠道可用性
    given:
    - 对象 visibility 为 public / private 或未知值。
    when:
    - 面板渲染渠道。
    then:
    - public 按能力位开放渠道；private 渠道置灰提示不可分享；未知值严格拒绝。
    done_when:
    - public/private/未知值渠道可用性测试通过。
    edge_cases:
    - 已退役 visibility 不生成链接或卡片。
    contract_refs:
    - specs/feature-tree/product-ops-growth/outbound-share-distribution/share-channel-panel/spec.md
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt3_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.share_channel_panel.gwt3_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        execution_profile: baseline
        suite: gwt3_local_contract
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.share_channel_panel.gwt3_local_contract
        envs: *id001
    notes:
    - '[migrated_from_planned] quwoquan_app/test/ui/share/share_channel_visibility_test.dart'
  GWT4:
    title: Post 站内分发使用 CirclePostPlacement 与聊天卡片的真实契约
    given:
    - 已登录用户打开可分享 Post 的统一面板。
    - 用户有已加入圈子、群聊或可私信联系人。
    when:
    - 用户选择圈子、群聊或私信目标并确认。
    then:
    - 圈子调用 `circle.circle_post_placement.PlacePostInCircle(circleId, postId)` 并返回 typed placement result。
    - 群聊/私信通过 chat conversation 发送结构化 card payload，私信无会话时先创建 direct conversation。
    - 失败保留当前选择并通过结构化错误重试，不显示假成功。
    done_when:
    - App local_contract、内容/聊天 api_integration 与真机分发旅程形成对应证据。
    edge_cases:
    - 没有已加入圈子
    - 目标会话已失效
    - 转发期间网络中断
    contract_refs:
    - quwoquan_service/contracts/metadata/circle/circle_post_placement/service.yaml
    - quwoquan_service/contracts/metadata/messages/conversation/service.yaml
    performance_points:
    - 目标选择页首屏 P95 <= 800ms。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/content/share/share_template_by_identity_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/share/forward_share_sheet__local_contract_test.dart
      - file: quwoquan_service/services/circle-service/tests/api_integration/circle_post_placement__api_integration_test.go
      - file: quwoquan_app/test/user_acceptance/journeys/share/forward_share_journey__user_acceptance_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: post_internal_distribution
        cases:
        - local_contract.product_ops_growth.outbound_share_distribution.share_channel_panel.post_internal_distribution
        envs: *id001
      - layer: api_integration
        execution_profile: integration
        suite: circle_post_placement
        cases:
        - api_integration.product_ops_growth.outbound_share_distribution.share_channel_panel.place_post_in_circle
        envs: [beta, gamma]
      supporting:
      - layer: user_acceptance
        execution_profile: release
        suite: forward_share_journey
        cases:
        - user_acceptance.product_ops_growth.outbound_share_distribution.share_channel_panel.forward_share_journey
        envs: [gamma_local]
    notes:
    - App typed Facet 与 CircleService 真实 Mongo transaction 已有本地证据；Gamma 真机站内分发未重跑前保持 partial。
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
