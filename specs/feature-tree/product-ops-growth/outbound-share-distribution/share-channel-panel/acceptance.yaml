version: 2
node:
  id: share-channel-panel
  level: L3_story
  path: specs/feature-tree/product-ops-growth/outbound-share-distribution/share-channel-panel
  title: share channel panel
  parent_domain_service: product-ops-growth
  parent_business_capability: outbound-share-distribution
scope:
  summary: 统一分享面板编排微信/海报/系统分享/复制/口令/二维码渠道，含登录门与可见性分级。
  journey_scenarios:
  - outbound-object-share-distribution
  out_of_scope:
  - 卡片视觉设计（object-share-cards）。
  - 归因落库与口令解析（share-attribution-and-token）。
  - 入站回流（runtime/external-inbound-deeplink-routing）。
gwt_acceptance:
  GWT1:
    title: 5 类对象统一面板渠道编排
    given:
    - 用户在任一对象详情页打开分享面板。
    when:
    - 面板根据对象与能力位渲染渠道列表。
    then:
    - 微信会话/朋友圈/保存海报/系统分享/复制链接/复制口令/二维码按可用性排列。
    - 站外默认链接为 HTTPS landing/中转页，scheme 仅作打开目标。
    done_when:
    - 5 类对象面板渲染与渠道执行测试通过。
    edge_cases:
    - 微信能力位缺失降级海报/系统分享，不展示死按钮。
    contract_refs:
    - specs/feature-tree/product-ops-growth/outbound-share-distribution/share-channel-panel/spec.md
    - quwoquan_service/contracts/metadata/_shared/link_templates.yaml
    performance_points:
    - 面板打开 P95 <= 300ms。
    evidence:
      primary:
      - T2_module_interaction
      supporting:
      - T1_static_contract
    tests:
      planned:
      - quwoquan_app/test/ui/share/object_share_panel_test.dart
      recorded: []
    status: pending
  GWT2:
    title: 分享登录门关闭后不死循环且成功续接
    given:
    - 游客触发需账号态的分享动作。
    when:
    - 弹出 AuthGateReason.shareRecord 登录门，用户关闭或登录成功。
    then:
    - 关闭后回安全态不重复弹登录；登录成功续接原渠道动作（AuthContinuation）。
    done_when:
    - 关闭再 pump 不再弹登录；登录成功进入目标渠道执行的测试通过。
    edge_cases:
    - 公开对象复制链接/保存海报对游客直接可用。
    contract_refs:
    - quwoquan_app/lib/core/auth/auth_continuation.dart
    - specs/feature-tree/runtime/runtime-client-foundation/error-permission-display-semantics/spec.md
    performance_points: []
    evidence:
      primary:
      - T2_module_interaction
      supporting: []
    tests:
      planned:
      - quwoquan_app/test/ui/share/share_login_continuation_test.dart
      recorded: []
    status: pending
  GWT3:
    title: 可见性分级控制渠道可用性
    given:
    - 对象 visibility 为 public / circle_visible / private。
    when:
    - 面板渲染渠道。
    then:
    - public 全渠道可用；circle_visible 受控素材；private 渠道置灰提示不可分享。
    done_when:
    - 三档可见性渠道可用性测试通过。
    edge_cases:
    - circle_visible 复制链接为受控预览链接。
    contract_refs:
    - specs/feature-tree/product-ops-growth/outbound-share-distribution/share-channel-panel/spec.md
    performance_points: []
    evidence:
      primary:
      - T2_module_interaction
      supporting:
      - T1_static_contract
    tests:
      planned:
      - quwoquan_app/test/ui/share/share_channel_visibility_test.dart
      recorded: []
    status: pending
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
