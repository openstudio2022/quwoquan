version: 2
node:
  id: feedback-collection-unification
  level: L3_story
  path: specs/feature-tree/product-ops-growth/feedback-optimization-loop/feedback-collection-unification
  title: feedback collection unification
  parent_domain_service: product-ops-growth
  parent_business_capability: feedback-optimization-loop
scope:
  summary: 行为反馈归一为画像与人群信号：content 派生 interestProfile/segments（MatchSegments 单一计算源）→
    UserInterestRecomputed 事件投影 user 域 rm_user_profile_view → segments 同步回写 rm_recommend_feature。
  in_scope:
  - HotPath 行为信号归一到 rm_recommend_feature.userFeatures + 半衰期衰减作业
  - InterestProfileAggregator 派生 interestProfile + MatchSegments 匹配人群
  - 两路 CQRS 投影：UserInterestRecomputed→user 域；segments $set 回 rm_recommend_feature
    顶层
  out_of_scope:
  - 端侧埋点采集与上报（属 app 客户端 + content 上报契约）
  - 策略评估/发布（见 optimization-evaluation-and-release）
gwt_acceptance:
  GWT1:
    title: 行为反馈派生画像/人群并双路投影
    given:
    - 某用户在 rm_recommend_feature.userFeatures 已累计四维 affinities（含旅行类高亲和）。
    - segments.yaml 定义了 travel_enthusiast 等规则人群。
    when:
    - InterestProfileAggregator.Recompute 运行。
    then:
    - 派生出 topN interestProfile + 生命周期分层，MatchSegments 命中对应 segments。
    - 发布 UserInterestRecomputed 事件且投影到 user 域 rm_user_profile_view.interestProfile/segments。
    - segments 同步 $set 回 rm_recommend_feature 顶层供引擎定向。
    done_when:
    - 派生→双路投影闭环可由 content/user 两侧单测证明。
    edge_cases:
    - 无足够行为数据 → interestProfile 为空、segments 为空数组（非 nil）。
    - segments 回写失败 → best-effort 降级，不阻断事件投影。
    contract_refs:
    - contracts/metadata/recommendation/rec_model/segments.yaml
    - contracts/metadata/recommendation/rec_model/events.yaml
    - contracts/metadata/recommendation/model_release/projections/recommend_feature.yaml
    - contracts/metadata/user/user_profile/projections/user_profile_view.yaml
    performance_points:
    - 人群匹配为纯函数（无 IO），可在派生路径内同步完成。
    tests:
      planned: []
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.feedback_collection_unification.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.feedback_collection_unification.gwt1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: gwt1_api_integration
        cases:
        - api_integration.product_ops_growth.feedback_optimization_loop.feedback_collection_unification.gwt1_api_integration
        envs:
        - beta
        - gamma
    notes:
    - '[migrated_from_recorded_noncanonical] services/content-service/internal/infrastructure/recommendation/interest_profile_test.go'
    - '[migrated_from_recorded_noncanonical] services/content-service/internal/infrastructure/recommendation/segment_test.go'
    - '[migrated_from_recorded_noncanonical] services/user-service/internal/infrastructure/projection/interest_profile_projector_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/tools/verify_metadata/main_test.go'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
