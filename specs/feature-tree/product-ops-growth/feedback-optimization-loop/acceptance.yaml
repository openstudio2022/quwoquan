version: 2
node:
  id: feedback-optimization-loop
  level: L2_business_capability
  path: specs/feature-tree/product-ops-growth/feedback-optimization-loop
  title: feedback optimization loop
  parent_domain_service: product-ops-growth
  parent_business_capability: feedback-optimization-loop
scope:
  summary: 反馈优化大循环：行为反馈 → 兴趣/人群画像派生 → 元数据驱动的推荐策略解析与自调建议 → 人审发布。算法侧闭环（content 派生 +
    user 投影 + recpolicy 热加载引擎 + 顾问 suggest-only）。
  in_scope:
  - 行为反馈归一到 rm_recommend_feature + 派生 interestProfile/segments（content-service）
  - UserInterestRecomputed 事件投影到 user 域 rm_user_profile_view（单一真相源）
  - policy.yaml 元数据化评分权重/二级系数/实验/segment 定向/护栏
  - runtime/recpolicy Store 热加载（atomic + validate-before-swap + last-good）+ codegen
    baseline fail-safe
  - 推荐引擎从 ResolvedPolicy 取权重/系数/分桶/定向；PipelineMetrics 归因 policyVersion/preset/segment
  - rec_policy_advisor 只产建议 + 至多 :simulate（绝不 :activate）
  out_of_scope:
  - 策略激活/灰度/回滚的实际执行（由 product-ops 控制面 + ops-portal 人审双签完成）
  - 模型训练与离线特征工程（属 rec-model-service / ML 管线）
sit_acceptance:
  SIT1:
    title: 反馈优化大循环能力 SIT（端云协同 + 元数据驱动 + 顾问 suggest-only）
    story_refs:
    - feedback-collection-unification
    - optimization-evaluation-and-release
    done_when:
    - 行为反馈→派生 interestProfile/segments→事件投影 user 域→segments 回写宽表 全链路可验证。
    - policy.yaml 改权重/系数/实验/定向即热生效（Store.Apply 校验通过即原子切换），坏 YAML 保留 last-good。
    - 引擎按 ResolvedPolicy 打分/重排，命中 segment 的用户按 segmentTargeting 取 preset 覆盖/权重增量。
    - PipelineMetrics 与 rec_requests_by_policy_total 按 policyVersion×preset×segment
      归因。
    - rec_policy_advisor 评估护栏后只产 recommend_review/hold/reject 建议，至多调 :simulate，无 activate
      路径。
    - 大循环实证脚本跨 content/user 两库断言行为→派生→双路 CQRS 投影→引擎可定向闭合，且宽表与画像两路 segments 一致（单一 MatchSegments
      源）。
    - 飞轮评估 dashboard（l2_content_flywheel）按派生/投影/引擎归因/互动/主动个性化各环节可视化，配套告警覆盖派生失败率、投影失败与新鲜度滞后。
    performance_points:
    - 策略解析在 GetFeed 关键路径上为 lock-free 读（atomic.Pointer），不引入额外锁竞争。
    - 大循环实证为离线数据面校验，纯函数评估可单测，不依赖在线服务，可作回归门禁。
    tests:
      planned: []
      recorded:
      - file: runtime/recpolicy/policy_test.go
      - file: runtime/recpolicy/store_test.go
      - file: runtime/recpolicy/sync_test.go
      - file: runtime/recommendation/engine_test.go
      - file: services/content-service/internal/infrastructure/recommendation/segment_test.go
      - file: scripts/recommendation/test_rec_policy_advisor.py
      - file: scripts/recommendation/test_eval_content_flywheel_loop.py
      - file: deploy/monitoring/dashboards/l2_content_flywheel.json
      - file: deploy/monitoring/alerts/quwoquan_alerts.yaml
      - file: quwoquan_service/tools/verify_metadata/main_test.go
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.sit1.sit1_local_contract
        envs: &id001
        - local
      - layer: local_contract
        suite: sit1_local_contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.sit1.sit1_local_contract
        envs: *id001
      supporting:
      - layer: api_integration
        suite: sit1_api_integration
        cases:
        - api_integration.product_ops_growth.feedback_optimization_loop.sit1.sit1_api_integration
        envs:
        - beta
        - gamma
      - layer: user_acceptance
        suite: journey
        cases:
        - user_acceptance.product_ops_growth.feedback_optimization_loop.sit1.journey
        envs:
        - gamma
    notes: []
