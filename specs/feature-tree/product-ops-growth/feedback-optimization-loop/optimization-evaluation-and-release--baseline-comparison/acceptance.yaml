version: 2
node:
  id: optimization-evaluation-and-release--baseline-comparison
  level: L3_story
  path: specs/feature-tree/product-ops-growth/feedback-optimization-loop/optimization-evaluation-and-release--baseline-comparison
  title: optimization evaluation and release  baseline comparison
  parent_domain_service: product-ops-growth
  parent_business_capability: feedback-optimization-loop
scope:
  summary: 基线对照 / champion-challenger：control/champion/rule 为基线，AB 分桶 + PipelineMetrics
    按 preset×segment×bucket 归因，护栏以相对基线 minRatio 比对，reject 支配，达标才进人审。
  in_scope:
  - policy.yaml 基线身份（defaultPreset=control / champion / rule）+ AB 分桶
  - PipelineMetrics 与 rec_requests_by_policy_total 按 preset×segment×bucket 归因
  - rec_policy_advisor 逐指标相对基线 minRatio 比对 + reject 支配 + 样本不足 hold
  out_of_scope:
  - 候选激活/灰度（product-ops 控制面 + ops-portal 人审双签）
gwt_acceptance:
  GWT1:
    title: 候选相对基线逐指标对照得出发布建议
    given:
    - policy.yaml 定义 control 基线与候选 preset，护栏含相对 minRatio 与绝对 minSamples。
    - 给定候选 cohort 多项 KPI（部分达标、部分跌破基线）。
    when:
    - rec_policy_advisor 逐指标与基线对照。
    then:
    - 全部指标达标且样本充足 → recommend_review。
    - 任一指标跌破基线 minRatio → 整体 reject（reject 支配 review）。
    - 样本不足或缺 baseline → hold。
    done_when:
    - 相对基线对照 + reject 支配 + 样本门槛的发布判定可由单测证明。
    edge_cases:
    - 多指标混合（达标 + 跌破）→ reject。
    - 缺 baseline preset → hold（不误判 reject）。
    contract_refs:
    - contracts/metadata/recommendation/rec_model/policy.yaml
    - contracts/metadata/_control_plane/product/workflow.yaml
    performance_points: []
    tests:
      planned: []
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        execution_profile: baseline
        suite: contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.optimization_evaluation_and_release_baseline_comparison.contract
        envs: &id001
        - local
      - layer: local_contract
        execution_profile: baseline
        suite: gwt1_local_contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.optimization_evaluation_and_release_baseline_comparison.gwt1_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_recorded_noncanonical] scripts/recommendation/test_rec_policy_advisor.py'
    - '[migrated_from_recorded_noncanonical] runtime/recommendation/engine_test.go'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  profile_gates:
  - make gate
