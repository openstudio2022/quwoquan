version: 2
node:
  id: optimization-evaluation-and-release
  level: L3_story
  path: specs/feature-tree/product-ops-growth/feedback-optimization-loop/optimization-evaluation-and-release
  title: optimization evaluation and release
  parent_domain_service: product-ops-growth
  parent_business_capability: feedback-optimization-loop
scope:
  summary: >-
    推荐评分策略元数据化 + 热加载 + 顾问 suggest-only：policy.yaml → recpolicy.Store →
    引擎 ResolvedPolicy 打分 → PipelineMetrics 归因 → rec_policy_advisor 只产建议至多 :simulate。
  in_scope:
  - policy.yaml 权重/系数/实验/segment 定向/护栏（元数据真相源）
  - recpolicy.Store 热加载（atomic + validate-before-swap + last-good）+ codegen baseline fail-safe
  - 引擎从 ResolvedPolicy 取权重/系数/分桶/重排阈值；PipelineMetrics 归因
  - rec_policy_advisor 护栏评估 + suggest-only + 至多 :simulate
  out_of_scope:
  - 策略激活(activate) / 灰度 / 回滚的执行（product-ops 控制面 + ops-portal 人审双签）
gwt_acceptance:
  GWT1:
    title: 元数据驱动策略热加载与引擎解析
    given:
    - policy.yaml 定义了 control/engagement_heavy 等预设、实验与 segment 定向。
    - recpolicy.Store 已 seed codegen baseline 并热加载 policy.yaml。
    when:
    - 编辑 policy.yaml 调整权重/系数（合法）后被 Store.Apply 应用。
    - 写入一份结构非法的 policy.yaml。
    then:
    - 合法变更原子切换、EffectiveHash 改变、引擎按新权重打分。
    - 非法变更被 Validate 拒绝并保留 last-good，引擎打分不受影响。
    done_when:
    - 改 metadata 即生效且坏 YAML 不失稳的闭环可由单测证明。
    edge_cases:
    - 缺实验定义 → ResolveBucketOr 返回声明式 fallback。
    - 缺 baseline preset → 顾问标 hold（missing baseline），不误判 reject。
    contract_refs:
    - contracts/metadata/recommendation/rec_model/policy.yaml
    - runtime/recpolicy/rec_policy_baseline.gen.go
    performance_points:
    - GetFeed 关键路径策略读为 lock-free（atomic.Pointer）。
    evidence:
      primary:
      - T1_contract
      - T2_module_interaction
      supporting:
      - T3_app_api_integration
    tests:
      planned: []
      recorded:
      - runtime/recpolicy/policy_test.go
      - runtime/recpolicy/store_test.go
      - runtime/recpolicy/sync_test.go
      - runtime/recommendation/engine_test.go
      - quwoquan_service/tools/verify_metadata/main_test.go
    status: implemented
  GWT2:
    title: 顾问只产建议且至多 :simulate（绝不 activate）
    given:
    - policy.yaml 护栏 action 全部为 suggest_only。
    - 给定一组 cohort KPI（preset×segment×bucket）。
    when:
    - 运行 rec_policy_advisor 评估护栏。
    then:
    - 达标候选标 recommend_review，回归候选标 reject，样本不足标 hold；全部 action=suggest_only。
    - 脚本至多调用 :simulate；模块不存在任何 activate 能力（call_activate/activate_url 不存在）。
    done_when:
    - 顾问"只产建议 + 至多 :simulate + 无 activate"可由单测证明。
    edge_cases:
    - policy.yaml 出现非 suggest_only 护栏 → 顾问拒绝运行（ValueError）。
    - policy-id 含 ':activate' → CLI 拒绝（exit 2）。
    contract_refs:
    - contracts/metadata/recommendation/rec_model/policy.yaml
    - contracts/metadata/_control_plane/product/workflow.yaml
    performance_points: []
    evidence:
      primary:
      - T1_contract
      - T2_module_interaction
      supporting: []
    tests:
      planned: []
      recorded:
      - scripts/recommendation/test_rec_policy_advisor.py
    status: implemented
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
