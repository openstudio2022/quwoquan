version: 2
node:
  id: feedback-collection-unification--feedback-quality-control
  level: L3_story
  path: specs/feature-tree/product-ops-growth/feedback-optimization-loop/feedback-collection-unification--feedback-quality-control
  title: feedback collection unification  feedback quality control
  parent_domain_service: product-ops-growth
  parent_business_capability: feedback-optimization-loop
scope:
  summary: 反馈质量控制 / 去噪：四维 affinities 半衰期衰减、行为-动作枚举端云一致校验、 评估侧样本门槛（不足即 hold）、人群命中 AND
    语义收敛。
  in_scope:
  - InterestDecayJob 四维 affinities 半衰期衰减（解 $inc 单调累积）
  - verify_behavior_action_consistency 行为-动作枚举端云一致门禁
  - rec_policy_advisor 样本不足 cohort 一律 hold
  out_of_scope:
  - 反爬/风控/账号封禁等安全治理（属安全域）
  - 端侧采集与上报本身（属 app 客户端）
gwt_acceptance:
  GWT1:
    title: 去噪与样本门槛保障反馈质量
    given:
    - 某用户既往累计旧兴趣 affinities，近期无新行为。
    - 某 cohort 样本量低于护栏 minSamples。
    when:
    - InterestDecayJob 运行；rec_policy_advisor 评估该 cohort。
    then:
    - 旧兴趣 affinities 按半衰期单调下降，画像反映近期偏好。
    - 样本不足 cohort 一律标 hold，不产 recommend_review/reject。
    done_when:
    - 衰减去噪 + 样本不足 hold 的质量控制可由单测证明。
    edge_cases:
    - 端报行为类型云侧枚举缺失 → verify_behavior_action_consistency BLOCK。
    - 样本恰为 0 → hold（既不达标也不 reject）。
    contract_refs:
    - contracts/metadata/recommendation/rec_model/segments.yaml
    - contracts/metadata/recommendation/rec_model/policy.yaml
    performance_points:
    - 衰减作业为批处理离线路径，不在 GetFeed 关键路径。
    tests:
      planned: []
      recorded: []
    status: pending_evidence
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.feedback_collection_unification_feedback_quality_control.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.product_ops_growth.feedback_optimization_loop.feedback_collection_unification_feedback_quality_control.gwt1_local_contract
        envs: *id001
      supporting: []
    notes:
    - '[migrated_from_recorded_noncanonical] services/content-service/internal/infrastructure/recommendation/interest_profile_test.go'
    - '[migrated_from_recorded_noncanonical] scripts/recommendation/test_rec_policy_advisor.py'
    - '[migrated_from_recorded_noncanonical] scripts/recommendation/verify_behavior_action_consistency.py'
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
