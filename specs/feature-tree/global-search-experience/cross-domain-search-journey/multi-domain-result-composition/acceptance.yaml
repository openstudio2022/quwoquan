version: 2
node:
  id: multi-domain-result-composition
  level: L3_story
  path: specs/feature-tree/global-search-experience/cross-domain-search-journey/multi-domain-result-composition
  title: multi domain result composition
  parent_domain_service: global-search-experience
  parent_business_capability: cross-domain-search-journey
scope:
  summary: 联想并行分段、正式结果 canonical 单请求与等待恢复验收范围。
  in_scope:
  - 本地分段与云实体并行、部分失败和终态映射。
  - 正式结果页 canonical `POST /search` 单请求。
  - 3 秒慢提示、6 秒取消、supersede/dispose 与旧内容保留。
  out_of_scope:
  - 搜索索引和生产部署。
  - 新的 request profile 或第二套 outcome 状态体系。
gwt_acceptance:
  GWT1:
    title: 多域结果并行结算且等待必有出口
    given:
    - 用户输入 query，本地域与云域响应时延或失败情况不同。
    when:
    - 联想页或正式结果页执行搜索，随后发生完成、部分失败、超时、query 替换或 dispose。
    then:
    - 本地结果先展示，云实体只在“搜索网络结果”段局部等待。
    - 正式结果每个 generation 只调用一次 canonical `/search`。
    - 3 秒只在空白阻塞时显示一次提示；6 秒真实取消 transport 并进入可重试终态。
    - empty、partial、timeout、failure 分开映射；旧 completion 不得回写。
    done_when:
    - 输入“钱”可预览并打开发布态“东钱湖”实体主页。
    - 全页同一 request scope 同时只有一个主 indicator，任何路径均停止等待。
    edge_cases:
    - 本地域成功、云域失败时保留本地结果并显示 partial。
    - 所有域成功为空才显示 empty，所有域失败才显示整页 error。
    - 旧 query 在新 query 之后完成时结果被丢弃。
    contract_refs:
    - quwoquan_service/contracts/metadata/search/query/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage/service.yaml
    performance_points:
    - 本地域 1.5 秒结算；前台云读取 3 秒慢提示、6 秒终止。
    tests:
      planned: []
      recorded:
      - file: quwoquan_app/test/local_contract/ui/search/pages/global_search_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/search_repository__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/services/app_request_wait_controller__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.multi_domain_result_composition.contract
