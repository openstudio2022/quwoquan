version: 2
node:
  id: full-screen-search-shell-and-entry
  level: L3_story
  path: specs/feature-tree/global-search-experience/cross-domain-search-journey/full-screen-search-shell-and-entry
  title: full screen search shell and entry
  parent_domain_service: global-search-experience
  parent_business_capability: cross-domain-search-journey
scope:
  summary: full screen search shell and entry 验收范围，覆盖默认搜索页、输入过程、正式结果页固定 Tab 与连接/未连接分组规则。
  in_scope:
  - 默认搜索页的最近搜索、今日交集、热门圈子、热门地点、同趣的人。
  - 输入过程的联系人、聊天记录、已加入圈子、已关注地点、已关注的人、推荐搜索词。
  - 正式结果页固定 Tab：小趣、全部、交集、图片、视频、长文。
  - 全部 Tab 的已连接区前置与未连接发现区按比例成组混排。
  - 指定类别 Tab 的纯内容消费流。
  out_of_scope:
  - 独立圈子、地点、人一级 Tab。
  - 输入过程中展示未连接对象或正式内容结果。
  - 维护第二套搜索接口或 UI 内业务假数据。
gwt_acceptance:
  GWT1:
    title: 默认搜索页负责激发搜索而不是展示正式结果
    given:
    - 用户打开全局搜索页。
    - 搜索框为空。
    when:
    - 最近搜索与默认推荐数据加载完成。
    then:
    - 页面展示最近搜索、今日交集、热门圈子、热门地点、同趣的人。
    - 最近搜索最多保留 15 条，默认最多 3 行；超过 3 行时右下角出现“查看更多”。
    - 默认页不展示图片、视频、长文等正式结果流。
    done_when:
    - 用户无需输入即可看到继续搜索和产生兴趣的五类启发内容。
    edge_cases:
    - 最近搜索为空时隐藏最近搜索区，其他启发区仍可展示。
    - 默认推荐某一组为空时隐藏该组，不留空白标题。
    contract_refs:
    - specs/feature-tree/global-search-experience/spec.md
    performance_points:
    - 搜索页打开后默认壳层即时可见，默认数据可异步补齐。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/search/pages/global_search_page_widget__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.contract
        envs: &id001
        - local
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.gwt1_local_contract
        envs: *id001
      supporting: []
    notes: []
  GWT2:
    title: 输入过程本地结果先出且云实体不阻塞
    given:
    - 用户在全局搜索页输入关键词。
    when:
    - 本地联系人、会话、消息、常用项与云端实体主页开始并行查询。
    then:
    - 搜索框尾部只有清除按钮，输入框内没有 spinner。
    - 本地域各自在 1.5 秒内结算并先于慢云端结果展示。
    - 发布态云实体作为既有“搜索网络结果”段预览，不新增第五分段。
    - 输入“钱”时包含匹配命中“东钱湖”，点击后进入对应实体主页。
    - 无命中的分组隐藏。
    - 不展示未关注圈子、未关注地点、未连接的人、图片、视频、长文正式结果。
    - 点击搜索按钮进入正式结果页，默认 Tab 为全部。
    done_when:
    - 本地结果不被聊天同步、圈子预热或云实体延迟阻塞。
    edge_cases:
    - 单域失败显示 partial；所有域成功且为空才显示 empty；所有域失败才显示整页 error。
    - query 变化、清空、返回和 dispose 后旧 completion 不得回写。
    - 空白阻塞到 3 秒提示一次，6 秒取消 transport、停止 spinner 并显示重试，不得显示“暂无结果”。
    - 联系人点击必须直达会话或按既有回退打开可用会话。
    contract_refs:
    - quwoquan_service/contracts/metadata/_shared/search_contract.yaml
    - quwoquan_service/contracts/metadata/_shared/search_objects.yaml
    - quwoquan_service/contracts/metadata/search/query/service.yaml
    - quwoquan_service/contracts/metadata/entity/homepage/service.yaml
    performance_points:
    - 输入后首批可见分组 P95 在 1.5s 内出现。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/search/pages/global_search_page_widget__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/search/pages/global_search_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/services/app_request_wait_controller__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/core/widgets/app_request_feedback__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/runtime/cloud_http_client_cancellation__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/cloud/services/contract_seeded_mock_repository__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.contract
        envs: *id001
    notes: []
  GWT3:
    title: 全部 Tab 先展示已连接区，再展示未连接发现区分组混排
    given:
    - 用户提交关键词进入正式搜索结果页。
    - 结果池包含已连接结果和未连接结果。
    when:
    - 用户停留在默认全部 Tab。
    then:
    - 顶部 Tab 固定为“小趣｜全部｜交集｜图片｜视频｜长文”。
    - 已连接区按聊天记录、联系人、已加入圈子、已关注地点、已关注的人、已互动内容顺序展示，每类最多一组。
    - 未连接发现区按交集、圈子、地点、人、图片、视频、长文同类成组，并按匹配池数量与相关度比例混排。
    - 发现区不展示“查看更多”，继续下滑加载下一批组。
    - 当前 query/tab generation 只调用一次 canonical `POST /search`，App 不做顺序 fan-out。
    done_when:
    - 全部 Tab 同时满足“已连接优先”和“未连接按比例发现”的信息架构。
    edge_cases:
    - 某一类只有已连接结果时，不再在发现区重复出现。
    - 某一类只有未连接结果时，只进入发现区。
    - 单域失败必须用 degrade signal 展示，不阻塞其他分组。
    - query/tab 变化、6 秒 timeout 与 dispose 都会取消或废弃旧请求；旧响应不得闪回。
    contract_refs:
    - specs/feature-tree/global-search-experience/spec.md
    - quwoquan_service/contracts/metadata/_shared/search_contract.yaml
    performance_points:
    - 单次综合搜索 fan-out 不得让首屏分组超过 1.5s 目标。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/search_repository__local_contract_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/search_repository__local_contract_test.dart
    status: implemented
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt3_local_contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.gwt3_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.contract
        envs: *id001
    notes: []
  GWT4:
    title: 指定类别 Tab 只展示该类别的消费流
    given:
    - 用户在正式结果页切换到交集、图片、视频或长文 Tab。
    when:
    - 对应结果池加载完成。
    then:
    - 交集 Tab 展示交集概览、交集推荐区和交集发现流，每张卡显示交集原因。
    - 图片 Tab 只展示双列图片瀑布流，不展示图片组标题。
    - 视频 Tab 只展示双列视频瀑布流，不展示视频组标题。
    - 长文 Tab 只展示单列长文阅读流，不展示长文组标题。
    - 小趣 Tab 单独展示总结、推荐方向、相关对象和可继续追问，不参与全部混排。
    done_when:
    - 每个指定类别 Tab 都与全部 Tab 的聚合视角区分清晰。
    edge_cases:
    - 指定类别无结果时展示对应空态，不回退展示其他类别结果。
    - 已互动内容在指定类别 Tab 内靠前展示。
    contract_refs:
    - specs/feature-tree/global-search-experience/spec.md
    - specs/feature-tree/global-search-experience/cross-domain-search-journey/xiaoqu-entry-handoff/acceptance.yaml
    performance_points:
    - 切换 Tab 后加载状态和结果状态稳定，无旧 Tab 内容闪回。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt4_local_contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.gwt4_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.full_screen_search_shell_and_entry.contract
        envs: *id001
    notes: []
