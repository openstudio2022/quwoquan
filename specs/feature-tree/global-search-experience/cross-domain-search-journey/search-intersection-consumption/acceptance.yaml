version: 2
node:
  id: search-intersection-consumption
  level: L3_story
  path: specs/feature-tree/global-search-experience/cross-domain-search-journey/search-intersection-consumption
  title: search intersection consumption
  parent_domain_service: global-search-experience
  parent_business_capability: cross-domain-search-journey
scope:
  summary: 全局搜索交集 Tab 与 connectionState 分组消费 intersectionReason 子集。
  in_scope:
  - 搜索 hit connectionState + intersectionReason 契约。
  - 交集 Tab / 今日交集 / 发现区交集分组 UI。
  - G2 primaryText 只读展示。
  out_of_scope:
  - 云侧 search read model 全量。
  - 端侧文案拼装。
gwt_acceptance:
  GWT1:
    title: 交集 Tab primaryText GWT
    given:
    - alpha mock search 返回含 intersectionReason.primaryText 的 hit。
    when:
    - 用户进入网络结果页「交集」Tab。
    then:
    - 每张卡展示一条蓝色 primaryText；无 displayText/label 回退。
    done_when:
    - 无 primaryText 的 hit 不出现。
    contract_refs:
    - _shared/search_contract.yaml
    - _shared/search_objects.yaml
    performance_points:
    - 交集 Tab 仅消费云侧 primaryText，端不二次拼装句子，渲染零额外 RPC。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.search_intersection_consumption.gwt1_local_contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.search_intersection_consumption.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded] local_contract quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart（「交集
      tab 按云侧 connectionState 分组并只读 primaryText」：交集句严格只读 intersectionReason.primaryText，无
      primaryText 不展示，无 displayText/label 回退与端侧拼装，2026-06-16 green）'
    - '[migrated_from_recorded] PARTIAL api_integration（2026-06-16 gamma-local，已迁移 canonical run evidence：search_intersection_smoke.json
      + backlog R-S06-S）：经网关 `POST /v1/search` 200、provider=elasticsearch、rankingVersion=search-v1、返回真实
      seeded location（杭州西湖）。BLOCKED：hit 上 populated connectionState/intersectionReason.primaryText
      需网关可识别 token + seed viewer 关系，匿名探测为 null。'
  GWT2:
    title: connectionState 分组 GWT
    given:
    - search hit 混合 connected / unconnected / intersection_lead。
    when:
    - 渲染「全部」Tab。
    then:
    - 已连接区与发现区按 connectionState 分组；交集句仅出现在 discovery / intersection_lead。
    done_when:
    - connected / discovery / intersection_lead 三组互斥，connected 区不展示交集句。
    contract_refs:
    - _shared/search_objects.yaml
    performance_points:
    - 分组在端侧基于 connectionState 闭集一次性归类，无逐卡远程查询。
    tests:
      planned:
      - file: quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
      recorded: []
    status: pending
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.search_intersection_consumption.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.cross_domain_search_journey.search_intersection_consumption.contract
        envs: *id001
    notes:
    - '[migrated_from_recorded] local_contract quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart（同一用例混合
      connected / unconnected / intersection_lead 命中：connected 进「已形成的连接」、其余进「发现更多交集」，connected
      区不展示交集句，端基于 connectionState 闭集一次性归类，2026-06-16 green）'
    - '[migrated_from_recorded] PENDING api_integration：gamma 真实 connectionState 闭集分组需
      seed viewer 关系后经 `/v1/search` 返回 populated connectionState，见 backlog R-IX05
      衍生待办与 R-S06-S。'
execution:
  local_gate:
  - make verify-metadata
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
