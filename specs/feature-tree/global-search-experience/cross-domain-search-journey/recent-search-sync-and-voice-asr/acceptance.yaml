version: 2
node:
  id: recent-search-sync-and-voice-asr
  level: L3_story
  path: specs/feature-tree/global-search-experience/cross-domain-search-journey/recent-search-sync-and-voice-asr
  title: recent search sync and voice asr
  parent_domain_service: global-search-experience
  parent_business_capability: cross-domain-search-journey
scope:
  summary: RecentSearchState 账号态同步、游客本地缓存与命名意图幂等验收范围。
  in_scope:
  - search-service /search/recent 四条对象级 operation。
  - 登录 Persona 跨请求同步、语义键去重、有界淘汰、单条删除与清空。
  - 游客本地缓存与登录后 Remote 真相源合并。
  out_of_scope:
  - 语音 ASR 输入链路；另由平台语音能力 Story 承载。
gwt_acceptance:
  GWT1:
    title: 最近搜索跨端同步、语义去重与安全重放
    given:
    - 用户以 Persona 登录并执行搜索。
    - App 通过 RecentSearchQuery / RecentSearchCommandWriter 访问 search-service。
    when:
    - 用户重复搜索同一 scope + facet + normalized query，或重放相同命名意图。
    - 用户删除单条记录或清空指定 scope。
    then:
    - entryId 由服务端语义键 sha256 派生；客户端不提交版本字段或自造 hashCode。
    - 同语义条目只保留一条并置顶，单 scope 最多 12 条。
    - version CAS 冲突在服务端有限重放；相同 Idempotency-Key 返回首次 receipt。
    - 登录态 Remote 为真相源；游客/离线仅使用本地表现层缓存。
    done_when:
    - local_contract 与真实 Mongo api_integration 覆盖相同去重、receipt、owner isolation 行为。
    edge_cases:
    - 删除不存在条目、重复 clear 为 no-op receipt，不递增聚合版本。
    - Remote 失败保留本地缓存并记录结构化失败，不合成远端成功。
    contract_refs:
    - quwoquan_service/contracts/metadata/search/recent_search_state/service.yaml
    - quwoquan_service/contracts/metadata/search/recent_search_state/tests/contract.yaml
    performance_points:
    - list/upsert/delete/clear P95 500ms；前台操作 6 秒内必须终态退出。
    tests:
      planned:
      - file: quwoquan_app/test/user_acceptance/patrol/search/cross_domain_search_journey__user_acceptance_test.dart
      recorded:
      - file: quwoquan_service/services/search-service/tests/local_contract/recent_search_state__command_query__local_contract_test.go
      - file: quwoquan_service/services/search-service/tests/api_integration/recent_search_state_store__api_integration_test.go
      - file: quwoquan_app/test/local_contract/cloud/search/recent_search_contracts__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/cross_domain_search_journey__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/pages/global_search_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/patrol/search/cross_domain_search_journey__user_acceptance_test.dart
    status: partial
    test_evidence:
      primary:
      - layer: local_contract
