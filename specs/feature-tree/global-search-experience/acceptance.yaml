version: 2
node:
  id: global-search-experience
  level: L1_domain_service
  path: specs/feature-tree/global-search-experience
  title: global search experience
  parent_domain_service: global-search-experience
scope:
  summary: global search experience 领域边界验收；含 2026-06-16 商用闭环已落地证据（R-S05~R-S07-S）、两阶段商用合同与发布阻断（R-S06-S-1/2/3）。
  in_scope:
  - 全局搜索领域边界、上下游依赖、工程映射与服务治理（search-service + ES + Redis）。
  - canonical search(request) 两阶段：suggest 本地、result 云侧最终结果。
  - result 阶段云侧对象 taxonomy（content.post / entity.homepage / location.place / 相关词 /
    小趣）单一真相源。
  out_of_scope:
  - 业务写模型存储引擎迁移（ES 仅作派生搜索读库）。
  - 并发 intersection 重构会话负责的 quwoquan_app/lib/** 交集端侧切片。
  - integration.location_poi 作为创作/附近 gateway 数据源的能力本身。
domain_acceptance:
  DA1:
    title: global search experience 领域边界与商用主链路落地验收
    done_when:
    - 领域边界、上下游依赖、工程映射和服务治理清晰；search-service（domain=search，18095）为云侧 canonical 入口。
    - 各域灌数（R-S05a~e）落地：content.post/entity.homepage/circle.circle/circle.group/user.profile
      + 第一方 location.place 进统一索引 quwoquan_objects。
    - App remote /v1/search 接线（R-S06）：RemoteSearchRepository 走 CloudHttpClient + codegen
      path，透传商用字段，按数据源切换。
    - 反馈/热力/排序（R-S07）与搜索信号注入推荐 Feed（R-S07-5）落地；结果页排序 term-heat 已闭环。
    - 端到端 /v1/search 真实冒烟（R-S06-S）：stackctl gamma 实例化 search-service，网关 /v1/search
      200、/v1/search/feedback 202（证据 QWQ_OUTPUT_ROOT/env/gamma/local/gamma-local/process/search_smoke_report.json）。
    - 两阶段商用合同成立：suggest 本地对象即时，result 云侧最终结果不混入本地对象。
    - 搜索准确性/可重复性/热力推荐闭环具备 local_contract/local_contract/api_integration/user_acceptance
      证据；真集群 measured 容量和版本落盘仍作为发布阻断项跟踪。
    boundary_points:
    - chat.* 私有对象 local_only，绝不上云做跨用户召回。
    - location.place 与 entity.homepage 互斥单源，同一地点只出现一次。
    - integration.location_poi 不作为统一 result 对象。
    tests:
      planned:
      - artifact: QWQ_OUTPUT_ROOT/env/repo/runs/search-load/<prod-sim-or-real-cluster>/search_capacity_report.json
      - artifact: QWQ_OUTPUT_ROOT/env/repo/runs/search-load/<prod-sim-or-real-cluster>/search_repeatability_multi_replica_report.json
      - artifact: QWQ_OUTPUT_ROOT/env/prod/runs/<run-id>/search_release_verify_report.json
      recorded:
      - file: quwoquan_service/services/search-service/tests/api_integration/search_contract__api_integration_test.go
      - file: quwoquan_service/services/search-service/tests/api_integration/storage_ttl_contract__api_integration_test.go
      - file: quwoquan_service/services/content-service/internal/application/searchprojection/place_search_projection__local_contract_test.go
      - file: quwoquan_service/services/content-service/internal/infrastructure/recommendation/search_signal_consumer__local_contract_test.go
      - file: quwoquan_app/test/local_contract/ui/search/retrieve_request_mapper__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/search_repository__local_contract_test.dart
      - file: quwoquan_app/test/user_acceptance/journeys/search/cross_domain_search_journey__user_acceptance_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/pages/search_network_results_page_widget__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/pages/global_search_page_widget__local_contract_test.dart
    status: partial
    notes:
    - search 域 local_contract/user_acceptance 已 recorded：Flutter search suite 50/50；user_acceptance
      journey 覆盖本地 suggest、云侧 result、本地对象不进 result、最近搜索、单域降级、整页错误重试和归因链。
    - 推荐信号真实 Redis 双服务 api_integration 已证明：发布/消费/投影/RuleScorer 消费链路 recorded（`search_signal_t3_report.json`
      + search_signal_consumer/runtime recommendation tests）。
    - 保持 partial 的原因不是功能链路缺口，而是商用发布阻断仍未闭合：R-S06-S-1 真集群 measured 容量、多副本 repeatability；R-S06-S-2
      写时增量/backfill 长稳。R-S06-S-3 已收口为唯一根 Go module，并有构建与测试门禁。
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/search/retrieve_contract_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/search/core_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/search/sort_stable_test.go'
    - '[migrated_from_recorded_artifact] 已迁移 canonical run evidence（search_smoke_report.json）'
    - '[migrated_from_recorded_artifact] 已迁移 canonical run evidence（search_signal_t3_report.json）'
    - '[migrated_from_recorded_artifact] 已迁移 canonical run evidence（search_repeatability_golden_diff.json）'
    - '[migrated_from_recorded_artifact] 已迁移 canonical run evidence（search_rollback_rehearsal.md）'
    test_evidence:
      primary:
      - layer: local_contract
        suite: da1_local_contract
        cases:
        - local_contract.global_search_experience.domain_service.da1.da1_local_contract
        envs: &id001
        - local
      - layer: api_integration
        suite: da1_api_integration
        cases:
        - api_integration.global_search_experience.domain_service.da1.da1_api_integration
        envs:
        - beta
        - gamma
      supporting:
      - layer: local_contract
        suite: da1_local_contract
        cases:
        - local_contract.global_search_experience.domain_service.da1.da1_local_contract
        envs: *id001
execution:
  local_gate:
  - bash quwoquan_ops/gate/scaffold/verify_feature_tree_refactor.sh
  - bash quwoquan_ops/gate/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
