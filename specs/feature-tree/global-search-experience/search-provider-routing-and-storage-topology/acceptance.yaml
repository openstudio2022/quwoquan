      - file: quwoquan_service/services/content-service/tests/local_contract/internal/application/place_search_projection__local_contract_test.go
      - file: quwoquan_service/services/content-service/tests/local_contract/internal/infrastructure/recommendation/search_signal_consumer__local_contract_test.go
      - file: quwoquan_service/services/entity-service/tests/api_integration/homepage_search_contract__api_integration_test.go
      - file: quwoquan_service/services/circle-service/tests/api_integration/circle_search_contract__api_integration_test.go
      - file: quwoquan_service/services/assistant-service/tests/local_contract/internal/application/tool_coordinator__local_contract_test.go
      - file: quwoquan_service/services/assistant-service/tests/local_contract/internal/application/tool/registry_retrieve_contract__local_contract_test.go
