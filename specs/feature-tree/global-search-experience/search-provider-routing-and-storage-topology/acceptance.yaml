version: 2
node:
  id: search-provider-routing-and-storage-topology
  level: L2_business_capability
  path: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology
  title: search provider routing and storage topology
  parent_domain_service: global-search-experience
  parent_business_capability: search-provider-routing-and-storage-topology
scope:
  summary: search provider routing and storage topology 验收范围，覆盖 canonical /v1/search、两阶段执行策略、ES/OpenSearch
    派生读库、搜索准确性/可重复性、搜索词热力推荐闭环与发布准出。
  in_scope:
  - canonical search(request) tool-facing contract。
  - 站内业务对象 provider registry 与统一 hit/citation envelope。
  - suggest 本地快速检索与 result 云侧最终结果的执行策略边界。
  - 搜索核心的 query normalization、相关性排序、敏感 query 阻断、稳定 tie-break 与 rankReasons。
  - assistant web_search/search/app_search alias 到 canonical search 的一致性。
  - tag/entity/term-heat 信号进入召回、排序、解释、相关搜索词与推荐 Feed 特征。
  out_of_scope:
  - 业务主存储向 ES/OpenSearch 迁移。
  - 向量/语义召回默认开启。
  - 未授权私有聊天内容跨用户检索。
sit_acceptance:
  SIT1:
    title: canonical search provider routing 三引擎能力 SIT
    story_refs:
    - specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/spec.md
    - specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/canonical-search-contract/spec.md
    - specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-object-taxonomy-and-provider-registry/spec.md
    - specs/feature-tree/global-search-experience/cross-domain-search-journey/xiaoqu-entry-handoff/spec.md
    done_when:
    - content.post / entity.homepage / location.place 等云侧 result 对象走 search-service
      + ES/OpenSearch 派生读库并返回稳定 matchedTerms/evidence/rankReasons/rankPosition。
    - suggest 阶段本地对象与 result 阶段云侧对象边界清晰：chat.* 不上云、不进入最终结果页；integration.location_poi
      不作为 canonical result 对象。
    - web_search / app_search / search 工具不再输出 fake_* provider，而是 canonical_search
      envelope 或结构化 degrade signal。
    - LLM 检索响应含 hits/citations/degradeSignals/provenance，citation 可追溯 objectType/objectId/provider。
    - 敏感 query 被阻断，未实现或无权限 provider 不影响其他 provider 结果。
    - 搜索词 queryheat/relatedTerms 与 searchTermAffinity 推荐闭环可证明被排序或 Feed scorer 消费。
    - acceptance 中声明的测试路径存在并可由本地门禁重复运行。
    performance_points:
    - suggest 本地即时；result P95 ≤ 1.5s；P99/错误率/degrade/cache hit/Redis lag/index freshness
      由 search_slo.yaml 读取。
    - provider 级限流/降级不得扩大为整页不可用。
    - 同 query 稳定数据下 TopN 不无故跳变；真集群多副本需验证 ES preference。
    tests:
      planned:
      - artifact: artifacts/search-load/<prod-sim-or-real-cluster>/search_capacity_report.json
      - artifact: artifacts/search-load/<prod-sim-or-real-cluster>/search_repeatability_multi_replica_report.json
      - artifact: artifacts/stackctl/prod/<run-id>/search_release_verify_report.json
      recorded:
