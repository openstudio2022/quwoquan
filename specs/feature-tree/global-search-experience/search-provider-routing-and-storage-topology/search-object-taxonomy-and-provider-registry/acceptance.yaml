version: 2
node:
  id: search-object-taxonomy-and-provider-registry
  level: L3_story
  path: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/search-object-taxonomy-and-provider-registry
  title: search object taxonomy and provider registry
  parent_domain_service: global-search-experience
  parent_business_capability: search-provider-routing-and-storage-topology
scope:
  summary: searchable object taxonomy 与 provider registry 验收范围；含 R-S05e 第一方地点对象 location.place。
  in_scope:
  - searchable object 统一命名与 provider 注册。
  - location.place 作为复用 geo 维度的第一方对象 target 的 taxonomy 注册与检索路由。
  - location.place 与 entity.homepage 的单一真相源边界（互斥、不重复）。
  - 第一方地点快照存储的身份/去重与灌数源。
  - location.place 命中的临时落地卡（landing card）与「提升为实体主页」CTA 归属与渲染（R-S05e-1 / WP-D，复用搜索 payload，不新建后端 operation）。
  out_of_scope:
  - 排序策略与存储弹性拓扑（归 search-storage-topology-and-elasticity）。
  - 完整地点 detail 页与独立后端 detail/写 operation（落地层仅复用搜索结果 payload + suggestHomepage 既有 surface）。
gwt_acceptance:
  GWT1:
    title: location 作为第一方对象 target 注册进统一 taxonomy 与 retrieve 契约
    given:
    - search_objects.yaml 已登记 object_type=location.place 与 ai_target=location（object_type=location.place）。
    - runtime/search 已加性新增 ObjectTypeLocation 与 TargetLocation。
    when:
    - 校验 metadata ai_targets 与 runtime AllTargets 一一对应，并把 location.place 文档解析为 target。
    then:
    - len(ai_targets)==len(AllTargets) 且 location→location.place 双向映射成立。
    - TargetForDocument(location.place)==location，ObjectTypesForTargets([location])==[location.place]。
    - 既有 geo 跨对象维度符号（GeoNear/Near/Document.Geo/nearMatch/hit geo|distanceKm|placeName）保持不变。
    done_when:
    - location 成为 canonical search 可召回的一类对象，且 geo 维度机制仅一套。
    edge_cases:
    - 未知 target 仍被 PlanRequest 忽略并产出 degrade signal。
    contract_refs:
    - contracts/metadata/_shared/search_objects.yaml
    - contracts/metadata/_shared/search_contract.yaml
    performance_points: []
    evidence:
      primary:
      - T1_contract
      supporting:
      - T2_module_interaction
    tests:
      planned: []
      recorded:
      - quwoquan_service/runtime/search/retrieve_contract_test.go::TestAITargetsMatchRuntimeAllowlist
      - quwoquan_service/runtime/search/retrieve_location_test.go
    status: passed
  GWT2:
    title: 第一方地点快照存储按地名去重、对绑定实体的地点单源排除
    given:
    - 多篇已发布公开帖子引用同一自由文本地名（无 canonicalEntityId/primaryHomepageId）。
    - 另有帖子的地点已绑定 canonicalEntityId。
    when:
    - 写时投影器与 backfill 从帖子聚合 location.place 快照并投影到统一索引。
    then:
    - 同一规范化地名(+粗 geohash)收敛为一条 location.place 快照，popularity 反映引用计数。
    - 绑定 canonicalEntity 的帖子不产生 location.place；其曾引用的地点在失去最后一篇自由文本引用后被删除。
    - 帖子转私有/删除/解绑后，对应快照与 ES 文档被移除（无残留）。
    done_when:
    - 同一地点在统一索引中只出现一次（未提升=location.place，已提升=entity.homepage）。
    edge_cases:
    - 无坐标地点 geohash 段为空仍可稳定生成身份。
    - ES 故障时投影失败被结构化吞掉，不阻塞主写路径。
    contract_refs:
    - contracts/metadata/_shared/search_objects.yaml
    performance_points:
    - 写时投影按单帖反查引用集，增量维护避免全量扫描。
    evidence:
      primary:
      - T2_module_interaction
      supporting:
      - T1_contract
    tests:
      planned:
      - T3_integration：gamma ES 灌数后 /v1/search 召回 location.place（随 search-service 集成补录）。
      recorded:
      - quwoquan_service/services/content-service/internal/application/place_search_projection_test.go
      - quwoquan_service/services/content-service/internal/infrastructure/placeindex/projector_test.go
      - quwoquan_service/services/content-service/internal/infrastructure/placeindex/backfill_test.go
    status: passed
  GWT3:
    title: location.place 命中落地为临时地点卡并引导提升为 entity.homepage（R-S05e-1 / WP-D）
    given:
    - search 结果页交集「已连接地点」承载 location.place 命中（未绑定 canonicalEntity）。
    - route locationPlaceLanding 与 surface locationPlaceLanding 已 metadata-first 定义并 codegen。
    when:
    - 点击 location.place 命中，进入 /locations/{placeId} 落地页；点击「提升为实体主页」CTA。
    then:
    - 落地页渲染临时地点卡（地名 + 地址 + 临时徽标），命中详情来自搜索结果 payload（route extra），无独立后端 operation。
    - CTA 跳转 suggestHomepage（复用既有 surface），携带地名作为 query，不新造写路径。
    - 进入上报 location_place_landing.enter 曝光、CTA 上报 promote_click（JourneyEventTracker）。
    done_when:
    - location.place 点击落地体验定义并验证；未提升=location.place、已提升=entity.homepage 单一真相源在落地层一致。
    edge_cases:
    - 深链无 route extra 时由 name/source query 参数兜底渲染。
    - 落地页 pop 无前驱时回退全局搜索页。
    contract_refs:
    - contracts/metadata/_shared/app_routes.yaml
    - contracts/metadata/_shared/ui_surfaces.yaml
    performance_points: []
    evidence:
      primary:
      - T2_module_interaction
      supporting:
      - T1_contract
    tests:
      planned:
      - T3_integration：gamma 真实 location.place 召回后端云联调落地页（随 search-service 集成补录）。
      recorded:
      - quwoquan_app/test/ui/search/pages/location_place_landing_page_widget_test.dart
      - quwoquan_app/test/ui/search/pages/search_network_results_page_widget_test.dart
    status: passed
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
