version: 2
node:
  id: canonical-search-contract
  level: L3_story
  path: specs/feature-tree/global-search-experience/search-provider-routing-and-storage-topology/canonical-search-contract
  title: canonical search contract
  parent_domain_service: global-search-experience
  parent_business_capability: search-provider-routing-and-storage-topology
scope:
  summary: canonical search(request) 唯一 contract 验收；含 2026-06-16 商用 response 字段、App
    RemoteSearchRepository 接线、assistant tool 桥接与错误响应。
  in_scope:
  - 单一 search(request) contract，suggest/result 仅以 mode 区分。
  - 商用 response 字段 requestId/rankingVersion/experimentBucket/relatedTerms/rankReasons/rankPosition/coverWidth/coverHeight/connectionState/intersectionReason。
  - App RemoteSearchRepository + RetrieveRequest 映射；assistant search tool 桥接 canonical。
  - 错误响应经 CloudException/runtimeFailure 结构化。
  out_of_scope:
  - 具体排序算法与 provider 实现。
  - 复杂布尔 DSL / 脚本排序 / 图查询表达式。
gwt_acceptance:
  GWT1:
    title: 唯一 canonical contract + 商用 response 字段（metadata/codegen 对齐）
    given:
    - _shared/search_contract.yaml 已登记商用字段且 make verify-metadata 绿。
    - codegen 产物 search_registry.g.dart 与 metadata 一致且幂等。
    when:
    - 调用 search(request) 以 mode=suggest|result 区分，返回统一 envelope。
    then:
    - response 含 requestId/rankingVersion/experimentBucket/relatedTerms；hit 含 rankReasons/rankPosition/coverWidth/coverHeight/connectionState/intersectionReason。
    - suggest 与 result 共用同一接口，无第二套建议专用接口。
    done_when:
    - 页面与业务层只看到一个 contract，商用字段以 metadata 为唯一真相源。
    edge_cases:
    - 未知 target 被 PlanRequest 忽略并产出 degrade signal。
    - 缺 connectionState/intersectionReason.primaryText 的 hit 不进交集分组、不造假。
    contract_refs:
    - contracts/metadata/_shared/search_contract.yaml
    - contracts/metadata/_shared/search_objects.yaml
    performance_points:
    - query-first 扁平结构，支持 AI 多次小查询，不引入过深嵌套。
    tests:
      planned: []
      recorded:
      - file: quwoquan_service/services/search-service/tests/api_integration/search_contract__api_integration_test.go
      - file: quwoquan_app/test/local_contract/ui/search/retrieve_request_mapper__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/search_repository__local_contract_test.dart
      - file: quwoquan_service/services/assistant-service/tests/local_contract/internal/application/service__local_contract_test.go
    status: completed
    test_evidence:
      primary:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.search_provider_routing_and_storage_topology.canonical_search_contract.contract
        envs: &id001
        - local
      supporting:
      - layer: local_contract
        suite: gwt1_local_contract
        cases:
        - local_contract.global_search_experience.search_provider_routing_and_storage_topology.canonical_search_contract.gwt1_local_contract
        envs: *id001
    notes:
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/search/retrieve_contract_test.go'
    - '[migrated_from_recorded_noncanonical] quwoquan_service/runtime/search/query_first_test.go'
  GWT2:
    title: App result 只消费 canonical 响应（RemoteSearchRepository + RetrieveRequest 映射
      + 错误响应）
    given:
    - appDataSourceModeProvider=remote 时 searchRepositoryProvider 返回 RemoteSearchRepository。
    - RetrieveRequest.fromSearchRequest() 单源映射 targets 并剔除 chat 本地命名空间对象。
    when:
    - result 阶段 POST /v1/search（CloudHttpClient + codegen path），解析 RetrieveResponse。
    then:
    - App 透传 rankReasons/rankPosition/coverWidth/coverHeight/connectionState/intersectionReason/relatedTerms，不再消费分域搜索接口。
    - 错误经 CloudException/runtimeFailure 结构化，不吞异常、不暴露原始异常字符串。
    done_when:
    - App result 阶段唯一消费 canonical search(request) 响应。
    edge_cases:
    - 远端降级时 degradeSignals 透传给 SearchRepository。
    - 网络/解析错误返回结构化 runtimeFailure，UI 可消费。
    contract_refs:
    - contracts/metadata/_shared/search_contract.yaml
    performance_points:
    - result 首批分组 P95 ≤ 1.5s；单域失败不阻塞整页。
    tests:
      planned:
      - file: quwoquan_app/test/ui/search/pages/search_network_results_page_widget_test.dart
      recorded:
      - file: quwoquan_app/test/local_contract/ui/search/retrieve_request_mapper__local_contract_test.dart
      - file: quwoquan_app/test/local_contract/ui/search/search_repository__local_contract_test.dart
      - file: quwoquan_service/services/assistant-service/tests/local_contract/internal/application/tool/registry_retrieve_contract__local_contract_test.go
    status: implemented
    notes:
    - App remote 接线（R-S06）以 scoped dart analyze + 部署验证器为证据；App 全量 widget 测试受并发 intersection
      重构外部阻塞，page widget 列 planned，待合流后转 recorded（WP-B/WP-C）。
    test_evidence:
      primary:
      - layer: local_contract
        suite: gwt2_local_contract
        cases:
        - local_contract.global_search_experience.search_provider_routing_and_storage_topology.canonical_search_contract.gwt2_local_contract
        envs: *id001
      supporting:
      - layer: local_contract
        suite: contract
        cases:
        - local_contract.global_search_experience.search_provider_routing_and_storage_topology.canonical_search_contract.contract
        envs: *id001
execution:
  local_gate:
  - bash agent_ops/scaffold/verify_feature_tree_refactor.sh
  - bash agent_ops/scaffold/verify_acceptance_standard.sh
  full_gate:
  - make gate
