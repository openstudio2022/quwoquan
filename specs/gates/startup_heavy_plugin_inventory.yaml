# 冷启动重插件清单：Phase1 引擎注册的主要 native 负担。
# 优化策略：Deferred Components / 按需注册 / 首次进入 RTC·创作时再 loadLibrary。
# 参考：specs/changelog/CR-20260626-071-startup-welcome-honest-boundary.yaml

plugins:
  - name: livekit_client
    category: rtc
    defer_target: lib/ui/rtc/**
    risk: high
    notes: WebRTC + noise + audioswitch AAR 全量链接

  - name: flutter_webrtc
    category: rtc
    defer_target: lib/ui/rtc/**
    risk: high
    notes: 与 livekit 重复负担，启动期不应 eager 初始化

  - name: flutter_callkit_incoming
    category: rtc
    defer_target: lib/ui/rtc/**
    risk: medium
    notes: 来电 UI native 模块，首启非必要

  - name: camera
    category: content_entry
    defer_target: lib/ui/content/entry/**
    risk: high
    notes: 创作入口首次打开再注册

  - name: camera_android_camerax
    category: content_entry
    defer_target: lib/ui/content/entry/**
    risk: high
    notes: Android CameraX 栈

  - name: photo_manager
    category: content_entry
    defer_target: lib/ui/content/entry/**
    risk: medium
    notes: 相册选择器

  - name: image_picker
    category: content_entry
    defer_target: lib/ui/content/entry/**
    risk: medium

  - name: video_thumbnail
    category: content_entry
    defer_target: lib/ui/content/entry/**
    risk: low

  - name: mobile_scanner
    category: auxiliary
    defer_target: on_demand
    risk: medium

  - name: hive
    category: storage
    defer_target: welcome_window
    risk: medium
    notes: 已在欢迎窗口后通过 appearance/auth 间接打开，禁止首帧 watch 链触发

  - name: sqflite
    category: storage
    defer_target: on_demand
    risk: low

next_steps:
  - Android Play Feature Delivery deferred components for rtc + content_entry bundles
  - Audit GeneratedPluginRegistrant / lazy MethodChannel at first consumer
  - split-per-abi release APK（已启用 build.gradle.kts splits.abi）
